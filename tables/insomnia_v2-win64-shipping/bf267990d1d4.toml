[[cheat]]
id = "stats-script"
name = "Stats Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(AOB_Health,Insomnia_v2-Win64-Shipping.exe,8B 83 90 02 00 00 48 8B) // should be unique
alloc(newmem,$1000,"Insomnia_v2-Win64-Shipping.exe"+5A521A)
alloc(pHealth,8)
alloc(pHealthCheat,8)

label(newHealth)
label(codeHealth)
label(returnHealth)

registersymbol(AOB_Health)
registersymbol(pHealth)
registersymbol(pHealthCheat)

newmem:

newHealth:
  mov [pHealth],rbx
  cmp dword ptr [pHealthCheat],1 // cheat check
  jne codeHealth
  mov dword ptr [rbx+00000290],(float)100.0
  jmp codeHealth

codeHealth:
  mov eax,[rbx+00000290]
  jmp returnHealth

AOB_Health:
  jmp newmem
  nop
returnHealth:


[DISABLE]
AOB_Health:
  db 8B 83 90 02 00 00

unregistersymbol(AOB_Health)
unregistersymbol(pHealth)
unregistersymbol(pHealthCheat)
dealloc(pHealthCheat)
dealloc(pHealth)
dealloc(newmem)"""

