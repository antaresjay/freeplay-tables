type = "script"
source = """
[ENABLE]

aobscanregion(DisableStaminaUse,FirstPersonAIO:FixedUpdate+14f,FirstPersonAIO:FixedUpdate+23e,0F B6 86 18 01 00 00 85 C0 0F)
alloc(newmem,$1000,DisableStaminaUse)

label(code)
label(return)

newmem:
mov [rsi+118],0

code:
  movzx eax,byte ptr [rsi+00000118]
  jmp return

DisableStaminaUse:
  jmp newmem
  nop 2
return:
registersymbol(DisableStaminaUse)

[DISABLE]

DisableStaminaUse:
  db 0F B6 86 18 01 00 00

unregistersymbol(*)
dealloc(*)"""
