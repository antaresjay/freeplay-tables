[[cheat]]
id = "player-controller-ctrl-numpad-2"
name = "Player Controller (Ctrl + Numpad 2)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : StarsInTheTrash.exe
// Author            : ndck76
// Executable Version: 2022.3.16.49695
// Game Version      : Build.16674305
// Script Date       : 2024-12-13


[ENABLE]

aobscanregion(grabhold,PlayerController:Move,PlayerController:Move+5000,0FB687xxxx000085xx0FxxxxxxxxxxF3xxxxxxxxF3xxxxxxF3xxxxxxxxxxxxxxF3xxxxxx66xxxxxx0Fxxxxxxxxxx0FxxxxxxxxxxC6xxxxxxxxxxxx) //PlayerController:Move+42b3
alloc(newmem,$1000,grabhold)
alloc(data,8)
alloc(grabholdbkp,7)
registersymbol(data)
registersymbol(grabhold)
registersymbol(grabholdbkp)
label(code)
label(return)

grabholdbkp:
  readmem(grabhold,7)

newmem:
  mov [data],rdi

code:
  readmem(grabhold,7)
  jmp return

grabhold:
  jmp newmem
  nop 2
return:

[DISABLE]

grabhold:
  readmem(grabholdbkp,7)

unregistersymbol(*)
dealloc(*)"""

