[[cheat]]
id = "player-progression-data-ctrl-numpad-1"
name = "Player Progression Data (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : BH2020 Alpha.exe
// Author            : ndck76
// Executable Version: 2020.3.43.49136
// Game Version      : v1.3.25
// Script Date       : 2024-01-26


define(address,AbilityPointsManager:HandleEnemyKillMessage+21)
define(bytes,F3 0F 10 40 74)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,AbilityPointsManager:HandleEnemyKillMessage+21)

label(code)
label(return)
label(data2)
registersymbol(data2)

newmem:

code:
  mov [data2],rax
  movss xmm0,[rax+74]
  jmp return

data2:
  db

address:
  jmp newmem
return:

[DISABLE]

address:
  db bytes
  // movss xmm0,[rax+74]

dealloc(*)
unregistersymbol(*)"""

