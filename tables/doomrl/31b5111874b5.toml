[[cheat]]
id = "godmode"
name = "Godmode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(aobhp,DB 80 ?? ?? ?? ?? 0F B7 80 ?? ?? ?? ?? 89 45 CC)
alloc(newmem,64)
registersymbol(hp)
label(hp)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
mov [eax+000000E0],(int)200

originalcode:
fild dword ptr [eax+000000E0]

exit:
jmp returnhere

"aobhp":
hp:
jmp newmem
nop
returnhere:

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
hp:
fild dword ptr [eax+000000E0]
//Alt: db DB 80 E0 00 00 00
unregistersymbol(hp)"""

