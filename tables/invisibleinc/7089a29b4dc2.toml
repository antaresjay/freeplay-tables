[[cheat]]
id = "invisible-cheats"
name = "Invisible Cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(invinc,invisibleinc.exe,8B 02 8B 4D 0C) // should be unique
alloc(invincmem,$1024,invinc)

label(return)
label(originalcode)
label(originalcodedummy)
label(Crdoit)
label(Alrmdoit)
label(APdoit)
label(_Push99)
label(_Push99k)
label(_PushZr)
label(chkstr)

invincmem:
  pushfd
  cmp dword ptr [pBase0],edx
  jne originalcodedummy
  jmp originalcodedummy
  originalcodedummy:
  cmp dword ptr [edx+14],0000002A
  je Crdoit
  cmp dword ptr [edx+14],000000B5
  je Alrmdoit
  //cmp dword ptr [edx+C4],3FF00000
  cmp dword ptr [esp],0x00000206
  je APdoit
  originalcode:
  popfd
  mov eax,[edx]
  mov ecx,[ebp+0C]
  jmp return

Crdoit:
  cmp dword ptr [EnPwrMnyCheat],1
  jne originalcode
  cmp dword ptr [edx+8],00000003
  jne originalcode
  cmp dword ptr [esp+C],00000000
  jne originalcode
  //cmp dword ptr [edx+27],00000540
  //jne originalcode
  cmp dword ptr [edx+58],00000000
  jne originalcode
  cmp dword ptr [edx+D8],00000004
  jne originalcode
  mov [pBase1],edx
  jmp _Push99k

Alrmdoit:
  cmp dword ptr [EnAlrmCheat],1
  jne originalcode
  cmp dword ptr [edx+8],00000003
  jne originalcode
  cmp dword ptr [edx+18],00000004
  jne originalcode
  cmp dword ptr [edx+58],00000004
  jne originalcode
  cmp dword ptr [edx+138],00000004
  jne originalcode
  cmp dword ptr [edx+168],00000005
  jne originalcode
  cmp dword ptr [edx+118],00000004
  jne originalcode
  mov [pBase4],edx
  jmp _PushZr

APdoit:
  cmp dword ptr [EnAPCheat],1
  jne originalcode
  cmp dword ptr [edx+8],00000003
  jne originalcode
  cmp dword ptr [esp+C],00000020
  jne originalcode
  cmp dword ptr [edx+18],00000004
  jne originalcode
  //cmp dword ptr [edx+9BC],00000020
  //jne originalcode
  cmp dword ptr [edx+98],00000004
  jne originalcode
  cmp dword ptr [edx+58],00000004
  jne originalcode
  cmp dword ptr [edx+9B4],00000000
  je originalcode
  fld [edx+10]
  push ecx
  //mov ecx,[edx+10]
  fstp dword ptr [pBase]
  mov ecx,[pBase]
  mov ecx,[ecx+30]
  //push eax
  //mov [chkstr],'mp'
  //cmp ecx,'mp'//[chkstr]
  cmp ecx,'unitX'//[chkstr]
  pop ecx
  //pop eax
  jne originalcode
  mov [pBase5],edx
  jmp _Push99

chkstr:
 dd 'mp'

_Push99:
  fld qword ptr [pdw99]
  fstp qword ptr [edx]
  jmp originalcode

_Push99k:
  fld qword ptr [pdw99k]
  fstp qword ptr [edx]
  fld qword ptr [pdw99]
  fstp qword ptr [edx+120]
  fld qword ptr [pdw99]
  fstp qword ptr [edx+220]
  jmp originalcode

_PushZr:
  fldz
  fstp qword ptr [edx]
  jmp originalcode


invinc:
  jmp invincmem
return:
registersymbol(invinc)

[DISABLE]

invinc:
  db 8B 02 8B 4D 0C
unregistersymbol(invinc)
dealloc(invincmem)
{
