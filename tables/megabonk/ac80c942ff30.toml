source = """
{ Game   : Megabonk.exe
  Version: 1.0.7
  Date   : 2025-10-02
  Author : RMLSNK
}

[ENABLE]

aobscanmodule(Enemy,GameAssembly.dll,0F 2F 83 80 00 00 00 73)
assert(Enemy,0F 2F 83 80 00 00 00 73)
alloc(newmem,$2000,Enemy)
alloc(origEnemy,7)
alloc(pEnemy,8)
registersymbol(Enemy origEnemy pEnemy bOneHitKill bInvulnerable bDropRate fEnemyMoveSpeed)

origEnemy:
  readmem(Enemy,7)

newmem:
  mov [pEnemy],rcx                         // base Address
  movss xmm2,[fEnemyMoveSpeed]
  movss [rcx+C4],xmm2                      // set movement speed

//IsOneShotKill
  cmp byte ptr [bOneHitKill],1
  jne @origOneHitKill
  mov [rcx+80],(float).1

@origOneHitKill:                           // restore one shot kill
  cmp byte ptr [bOneHitKill],0
  jne @Invulnerable
  cmp [rcx+80],(float).1                   // compare with float
  jg @Invulnerable
  push rax
  mov rax,[rcx+84]
  mov [rcx+80],rax                         // load max health
  pop rax

@Invulnerable:
  cmp byte ptr [bInvulnerable],1
  jne @origInvulnerable
  mov byte ptr [rcx+FD],1

@origInvulnerable:
  cmp byte ptr [bInvulnerable],0
  jne @Exit
  mov byte ptr [rcx+FD],0

@DropRate:
  cmp byte ptr [bDropRate],1
  jne @origDropRate
  mov [rcx+154],(float)25.0

@origDropRate:
  cmp byte ptr [bDropRate],0
  jne @Exit
  cmp [rcx+154],(float)25.0                 // restore only affected
  jl @Exit
  mov [rcx+154],(float)0.009999999776      // avg drop rate

@Exit:
  comiss xmm0,[rbx+00000080]
  jmp return

bOneHitKill:
  db 0

bInvulnerable:
  db 0

bDropRate:
  db 0

fEnemyMoveSpeed:
  dd (float)1.0

Enemy:
  jmp newmem
  nop 2
return:

[DISABLE]

Enemy:
  readmem(origEnemy,7)

unregistersymbol(*)
