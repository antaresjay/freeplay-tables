eChargeType:
db 0

bIsGolden:
db 0

newmem:
  // Instant charge
  cmp byte ptr [eChargeType],1
  jne @skipCharge
  mulss xmm6,[xShrine]
@skipCharge:
 movss dword ptr [rbx+28],xmm6

  // Infinite Reward
  cmp byte ptr [eChargeType],2
  jne @skipInfiniteRewards
  mov [pReward],rbx
  mov dword ptr [rbx+28],0
  cmp dword ptr [rbx+F4],1
  je @f
  mov byte ptr [rbx+EC],1
  @@:
  mov byte ptr [rbx+EC],0
  mov byte ptr [rbx+F4],0
@skipInfiniteRewards:

  // Golden
  cmp byte ptr [bIsGolden],1
  jne @skipGolden
  mov byte ptr [rbx+D0],1
@skipGolden:

  jmp return

Shrine:
  jmp newmem
return:

[DISABLE]

Shrine:
  readmem(origShrine,5)

