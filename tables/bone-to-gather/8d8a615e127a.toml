[[cheat]]
id = "no-damage"
name = "No Damage"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
//Send@FearlessRevolution|Sintrix
[ENABLE]

aobscanregion(isflag,CharacterBase:TakeDamage,CharacterBase:TakeDamage+43,0F B6 46 79 85 C0)
alloc(newmem,$1000,isflag)
label(code return)

newmem:
mov [rsi+79],1

code:
  movzx eax,byte ptr [rsi+79]
  test eax,eax
  jmp return

isflag:
  jmp newmem
  nop
return:
registersymbol(isflag)

[DISABLE]

isflag:
  db 0F B6 46 79 85 C0

unregistersymbol(*)
dealloc(*)"""

