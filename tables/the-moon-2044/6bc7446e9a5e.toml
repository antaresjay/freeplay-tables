source = """
define(address,Stamina.Stamina:set_CurrentStamina+102)
define(bytes,F3 0F 10 46 28)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Stamina.Stamina:set_CurrentStamina+102)

label(code)
label(return)

newmem:
  mov [rsi+28],(float)200

code:
