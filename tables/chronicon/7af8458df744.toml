source = """
{
stats are common function loop, handle them here
find what writes any stat

TODO:
 when hooks and hacks are enabled before returning to game and triggering
a stat refresh in game, the default values overwrite hack. hack must be disabled
and game reentered to get stats to refresh before reenabling hack.
}

[ENABLE]
aobscanmodule(HOOK_STATHANDLER,Chronicon.exe,F2xxxxxx5B83xxxxC2xxxx8Bxx5F89xx8Bxxxx5E5D89xxxx5B83xxxxC2xxxx8Bxx85xx74xxFFxxxx5F5E5D89xx5B83xxxxC2xxxx)
alloc(newmem,$1000)

label(code)
label(return)

label(Stat)
label(Stat_Hax)
label(Stat_Next)
label(CleanUp)

newmem:
  push esi
  push edi
  mov esi,globals          // load into register to avoid memory to far
  mov edi,options          // not sure if needed in 32bit, habbit now
  add esi,50               // move 50 bytes in globals to stats start
  add edi,50               // move 50 bytes in options

Stat:
  cmp [esi],0              // check for stat pointer
  je CleanUp               // ran out of stats to check, goto CleanUp
  cmp ebx,dword ptr[esi]   // compare pointers, is it wanted stat?
  jne Stat_Next            // no match, jump to next stat
  cmp [esi+4],0            // check user toggle (inverse bool)
  je Stat_Hax              // hax enabled
  jmp CleanUp              // not

Stat_Hax:
  movsd xmm0,[edi]         // load custom double into xmm0
  jmp CleanUp              // hack done, goto CleanUp

Stat_Next:
  add esi,8                // move 8 bytes in globals
  add edi,8                // move 8 bytes in options
  jmp Stat                 // loop and check for another stat

