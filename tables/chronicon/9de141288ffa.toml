source = """
[ENABLE]

aobscanmodule(SkillPoint_Get_AOB,Chronicon.exe,41 0F 97 C0 41 0F B6 C0) // should be unique
aobscanmodule(SkillPoint_Ret,Chronicon.exe,F3 44 0F 11 44 24 20 E8 * * * * 44 0F 28 54 24 40 44 0F) // should be unique
alloc(newmem,$1000,SkillPoint_Get_AOB)

label(code)
label(return)

newmem:
  pushf
  cmp [rsp+AA],SkillPoint_Ret+C
  jne code
  mov [rcx],0
  mov [rcx+4],40534000
code:
  popf
  seta r8l
  movzx eax,r8l
  jmp return

SkillPoint_Get_AOB:
  jmp newmem
  nop 3
return:
registersymbol(SkillPoint_Get_AOB)

[DISABLE]

SkillPoint_Get_AOB:
  db 41 0F 97 C0 41 0F B6 C0

unregistersymbol(SkillPoint_Get_AOB)
dealloc(newmem)"""
