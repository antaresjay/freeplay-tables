[ENABLE]

aobscanmodule(player,DxG.exe,8b 43 04 50 68 ? ? ? ? 68 ? ? ? ? ff) // should be unique
alloc(newmem,$1000)
alloc(myHero,8)
alloc(myMira,8)
alloc(myMina,8)
alloc(myDesura,8)

label(code)
label(return)

newmem:
  cmp [ebx],1
  jne @f
  mov [myHero],ebx
  @@:
  cmp [ebx+614],1
  jne @f
  mov [myMira],ebx
  @@:
  cmp [ebx+51c],1
  jne @f
  mov [myMina],ebx
  @@:
  cmp [ebx+20],1
  jne @f
  mov [myDesura],ebx
  @@:

code:
  mov eax,[ebx+04]
  push eax
  push DxG.exe+237E4
  jmp return

player:
  jmp newmem
  nop 4
return:
registersymbol(myHero)
registersymbol(myMira)
registersymbol(myMina)
registersymbol(myDesura)
registersymbol(player)

[DISABLE]

player:
