[[cheat]]
id = "enable-powerful-champions"
name = "Enable Powerful Champions"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@Sintrix
define(address,Core.Gameplay.Info.ChampionInfo:get_ChampionData+10)
define(bytes,48 8B F1 48 8B 46 60)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Core.Gameplay.Info.ChampionInfo:get_ChampionData+10)
label(code return)

newmem:
push rcx
mov rcx,[rcx+60]
mov rcx,[rcx+60]
mov [rcx+10],(float)999999999
mov [rcx+14],(float)999999999
mov [rcx+18],(float)999999999
mov [rcx+1C],(float)999999999
mov [rcx+20],(float)10000000
mov [rcx+38],(float)999999999
mov [rcx+3C],(float)9999999999

code:
  pop rcx
  mov rsi,rcx
  mov rax,[rsi+60]
  jmp return

address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  db bytes


dealloc(*)"""

