[ENABLE]
aobscanmodule(item,$process,?? 8B ?? B9 ?? ?? 00 00 66 ?? 89)
alloc(newmem,$1000,item)

label(itemPtr)
label(itemBkp)
label(return)

newmem:
  push rax
