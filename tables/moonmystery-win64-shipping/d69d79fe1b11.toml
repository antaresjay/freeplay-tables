[[cheat]]
id = "ammo-clip-editor-ctrl-numpad-1"
name = "Ammo Clip Editor (Ctrl + Numpad 1)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : MoonMystery-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 4.27.2.0
// Game Version      : Build.16212010
// Script Date       : 2024-10-30


[ENABLE]

aobscanmodule(ammo,MoonMystery-Win64-Shipping.exe,8Bxx4883xxxx5FC3xxxxxxxxxxxxxx405541544156) // should be unique
alloc(newmem,$1000,ammo)
alloc(data2,8)
alloc(ammobkp,6)
registersymbol(data2)
registersymbol(ammo)
registersymbol(ammobkp)
label(code)
label(return)

ammobkp:
  readmem(ammo,6)

newmem:
  mov [data2],rax

code:
  readmem(ammo,6)
  jmp return

ammo:
  jmp newmem
  nop
return:

[DISABLE]

ammo:
  readmem(ammobkp,6)

unregistersymbol(*)
dealloc(*)"""

