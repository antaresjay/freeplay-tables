[[cheat]]
id = "shoot-anyone"
name = "Shoot Anyone"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Oregon-Win64-Shipping.exe
  Version: 
  Date   : 2022-12-31
  Author : Hypn

  This script disables the "CanBeFiredAt" check on NPCs, allowing you to shoot anyone.
}

[ENABLE]

aobscanmodule(INJECT,Oregon-Win64-Shipping.exe,E8 60 41 13 00) // should be unique
alloc(newmem,$1000,INJECT)

label(code)
label(return)

newmem:

code:
  //call Oregon-Win64-Shipping.UORTargetableComponent::CanBeFiredAt
  jmp return

INJECT:
  jmp newmem
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db E8 60 41 13 00

unregistersymbol(INJECT)
dealloc(newmem)"""

