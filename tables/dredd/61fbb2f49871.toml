[[cheat]]
id = "right-click-change-script-here-for-info"
name = "Right click -> change script HERE for info"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
Hoi chums,

here's a small trainer with a few scripts for the older "Judge
Dredd: Dredd vs Death" game on Steam, made for and tested with
Steam Build #250755.

Some info on the scripts:

* No damage ("god mode") should work for all difficulties on
  singleplayer. Although the comparison I've included to
  distinguish between player and NPC/enemy wasn't the first
  of choice so to speak it seems to hold up.
  While technically you'll be invincible, deep falls will
  still end your game.

* No damage ("god mode") V2 uses a different comparison.
  Should the first script fail, try this one.

* No damage ("god mode" - arcade missions) is basically the
  same as the V2-god mode script, however the value it uses
  for the enemy/player compare changes in some of the arcade
  missions. In those cases, use this script instead (and be
  sure to deactivate the other god mode script first!)
  BUT FUCK THOSE ARCADE MISSIONS. Some are quite impossible
  and bugged.

-> A little caveat regarding some of the god mode scripts:    <-
-> Activate only AFTER you've started a game; you can't start <-
-> a new game while the scripts are active.                   <-

* Keep health at max will try to keep your health full all
  the time. Great amounts of damage in a short while however
  MIGHT cause this to fail. You can try the 999 alternative
  if this happens.

* Keep ammo at 999 will do exactly as it says; give you lots
  of ammo. As far as I can tell it should work for all
  weapons, but I didn't run some lengthy tests, so let me
  know if there are problems.

* Freeze medkits at 3: You will always carry three medkits.
  You can even activate the script, jump into the game, jump
  back out and deactivate it just to refresh your medpacks.

* Unlimited grenade: I needed to include two scripts because
  of the way the game handles the grenades. Not that they're
  too useful but hey... just activate both optoins for this
  to work.

* No law point decrease: Another script I haven't fully tested
  but it should keep your law points from decreasing. It also
  keeps you from gaining more. Funny, huh? :)

* Freeze law points at 100: It should keep your law points at
  maximum but maybe you have to arrest someone first.

Anyways, enjoy this great game. Book the fat ladies!
}
[ENABLE]
[DISABLE]"""

[[cheat]]
id = "no-damage-god-mode"
name = 'No damage ("god mode")'
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(invulv2,Dredd.exe,89 41 2C C2 04 00 CC CC CC CC CC CC 53) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(player)

newmem:

code:
  cmp [ecx+0000],005EFF50
  je player
  mov [ecx+2C],eax
  ret 0004
  jmp return

player:
  nop
  ret 0004
  jmp return

invulv2:
  jmp newmem
  nop
return:
registersymbol(invulv2)

[DISABLE]

invulv2:
  db 89 41 2C C2 04 00

unregistersymbol(invulv2)
dealloc(newmem)

"Dredd.exe"+51104:
  mov [ecx+2C],eax
"Dredd.exe"+51107:
  ret 0004"""

