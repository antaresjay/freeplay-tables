[[cheat]]
id = "godmode-ohk"
name = "Godmode + OHK"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : canemagic.exe
  Version: 
  Date   : 2019-06-12
  Author : Anjinggila

  This script does blah blah blah
}

[ENABLE]

aobscan(INJECT,48 8B C2 F2 0F 2A C0 F2 0F 5A E8 F3 0F 11 6F 28) // should be unique
alloc(newmem,$1000,1E0EFBAE83B)

label(code)
label(playerHealth)
label(enemyHealth)
label(return)

newmem:
  cmp [rdi+214],(float)0
  je enemyHealth
  cmp [rdi+214],(float)-100
  je playerHealth
  jmp code

enemyHealth:
  mov [rdi+28],(float)0
  jmp return

playerHealth:
  mov [rdi+28],(float)300
  jmp return

code:
  movss [rdi+28],xmm5
  jmp return

INJECT+0B:
  jmp newmem
return:
registersymbol(INJECT)

[DISABLE]

INJECT+0B:
  db F3 0F 11 6F 28

unregistersymbol(INJECT)
dealloc(newmem)"""

