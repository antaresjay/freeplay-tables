[[cheat]]
id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
//Send
[ENABLE]

aobscanmodule(ammo,Bugsnax.exe,89 04 B3 FF C7)
alloc(newmem,$1000,ammo)

label(code)
label(return)

newmem:

code:
  add [rbx+rsi*4],eax
  inc edi
  jmp return

ammo:
  jmp newmem
return:
registersymbol(ammo)

aobscanmodule(ammo2,Bugsnax.exe,89 04 BB FF C7)
alloc(newmem2,$1000,ammo2)

label(code2)
label(return2)

newmem2:

code2:
  add [rbx+rdi*4],eax
  inc edi
  jmp return2

ammo2:
  jmp newmem2
return2:
registersymbol(ammo2)

[DISABLE]

ammo:
  db 89 04 B3 FF C7

ammo2:
  db 89 04 BB FF C7

unregistersymbol(*)
dealloc(*)"""
