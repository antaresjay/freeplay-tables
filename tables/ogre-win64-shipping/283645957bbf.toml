source = """
{ Game   : Ogre-Win64-Shipping.exe
  Version: Demo rev5451
  Date   : 2023-05-11
  Author : R_X
}

[ENABLE]

aobscanmodule(pBase,Ogre-Win64-Shipping.exe,48 8B 01 FF 90 80 02 00 00 48 89) // should be unique
alloc(newmem,$1000,pBase)
alloc(base,8)

label(code)
label(return)

base:
dq 0

newmem:

code:
  mov [base],rcx
  mov rax,[rcx]
  call qword ptr [rax+00000280]
  jmp return

pBase:
  jmp newmem
  nop 4
return:
registersymbol(pBase base)

[DISABLE]

pBase:
  db 48 8B 01 FF 90 80 02 00 00

unregistersymbol(*)
dealloc(*)"""
