alloc(newmem,$1000)

label(code)
label(return)

label(pPtr)
registersymbol(pPtr)

label(mFlag)
registersymbol(mFlag)

newmem:

  mov [pPtr], rcx

  cmp dword ptr [mFlag], 1
  jne code

  mov [rcx+E8], #999999

code:
  cmp dword ptr [rcx],00
  mov rcx,[rax+00000090]
  mov rdx,[rsi+18]
  jmp return

pPtr:
dq 0

mFlag:
dd 0

preparecheats:
  jmp far newmem
return:
registersymbol(preparecheats)

[DISABLE]

preparecheats:
