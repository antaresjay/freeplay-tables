[[cheat]]
id = "reset-gambling-count-to-zero-on-play"
name = "Reset Gambling Count To Zero On Play"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(GambleCount,GB.Game.GameData:AddGambleCount,GB.Game.GameData:AddGambleCount+2d,89 86 00 01 00 00)
alloc(newmem,$1000,GambleCount)
label(code return)

newmem:

code:
  mov [rsi+00000100],#0
  jmp return

GambleCount:
  jmp newmem
  nop
return:
registersymbol(GambleCount)

[DISABLE]

GambleCount:
  db 89 86 00 01 00 00

unregistersymbol(*)
dealloc(*)"""
