[[cheat]]
id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(ammocd,CepheusProtocol-Win64-Shipping.exe,83 BE 6C 06 00 00 00)
alloc(newmem,$1000,ammocd)

label(code)
label(return)

newmem:
code:
  mov [rsi+0000066C], #99
  cmp dword ptr [rsi+0000066C],00
  jmp return

ammocd:
  jmp newmem
  nop
  nop
return:
registersymbol(ammocd)

[DISABLE]

ammocd:
  db 83 BE 6C 06 00 00 00

unregistersymbol(ammocd)
dealloc(newmem)"""
