[[cheat]]
id = "unlimited-influence"
name = "Unlimited Influence"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(influence,Attila.dll,8B 81 F4 02 00 00 C3) 
alloc(newmem,$1000)

label(code)
label(normalcode)
label(return)

newmem:
code:
  cmp [ecx+000002F4], #100
  jg normalcode

  mov [ecx+000002F4], #100

normalcode:
  mov eax, [ecx+000002F4]
  jmp return

influence:
  jmp code
  nop
return:
registersymbol(influence)

[DISABLE]

influence:
  db 8B 81 F4 02 00 00

unregistersymbol(influence)
dealloc(newmem)"""
