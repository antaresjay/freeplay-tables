[[cheat]]
id = "script-one-hit-kill-friend-god"
name = "Script: One Hit Kill,Friend God"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Quake4.exe
  Version: Steam
  Date   : 2013-08-06
  Author : jgoemat

  One-hit kill (NOTE: MIGHT NEED TO CHECK MONSTER/FRIEND)
}

[ENABLE]

aobscanmodule(ONEHITKILL,gamex86.dll,29 81 BC 00 00 00 8B) // should be unique
alloc(newmem,$1000)

label(code)
label(skip)
label(enemy)
label(return)

newmem:

code:
  mov [GLOBALS+2030],ecx
  mov [GLOBALS+2034],eax
  push ebx
  mov ebx,[ecx+2A8]
  test ebx,ebx
  jz enemy

  // friend
  cmp [GLOBALS+1010],0
  je skip
  xor eax,eax // no damage to friends
  jmp skip

enemy:
  cmp [GLOBALS+100C],0
  je skip

  cmp eax,[ecx+000000BC]
  jge skip
  mov eax,[ecx+000000BC]
  inc eax
skip:
  pop ebx
  sub [ecx+000000BC],eax
  jmp return

ONEHITKILL:
  jmp code
  nop
return:
registersymbol(ONEHITKILL)

[DISABLE]

ONEHITKILL:
  db 29 81 BC 00 00 00

unregistersymbol(ONEHITKILL)
dealloc(newmem)

