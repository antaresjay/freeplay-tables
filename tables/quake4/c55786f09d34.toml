[[cheat]]
id = "script-globals"
name = "Script: Globals"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Quake4.exe
  Version: Steam
  Date   : 2013-08-06
  Author : jgoemat

  ALlocate space for global variables:

  1000 - flags
  2000 - Clip structure base address (clip at 05EC)
  2010 - Ammo structure base address (ammo at index*04+18)
  2014 - Ammo - last index
  2020 - Health structure base address (health at BC)
  2030 - Hit Monster structure base (health at BC)
  2034 - Last damage done to monster
}

globalalloc(GLOBALS,$100000)

[ENABLE]

GLOBALS+1000:
  dd 0 // 1000: Flag: Clip
  dd 0 // 1004: Flag: Ammo
  dd 0 // 1008: Flag: God
  dd 0 // 100C: Flag: One Hit Kill
  dd 0 // 1010: Flag: Friend God

[DISABLE]"""

