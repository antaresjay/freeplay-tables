[[cheat]]
id = "playercontroller-base-address-scan-initialization-activate-this-first"
name = "PlayerController Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlayerController_basepointer)
registersymbol(PlayerController_update_enable)
registersymbol(PlayerController_set_enable)
registersymbol(PlayerController_healthset_enable)
registersymbol(PlayerController_armorset_enable)
registersymbol(PlayerController_damageset_enable)

alloc(PlayerController_basepointer, 4)
alloc(PlayerController_update_enable, 4)
alloc(PlayerController_set_enable, 4)
alloc(PlayerController_healthset_enable, 4)
alloc(PlayerController_armorset_enable, 4)
alloc(PlayerController_damageset_enable, 4)


[DISABLE]
unregistersymbol(PlayerController_basepointer)
unregistersymbol(PlayerController_update_enable)
unregistersymbol(PlayerController_set_enable)
unregistersymbol(PlayerController_healthset_enable)
unregistersymbol(PlayerController_armorset_enable)
unregistersymbol(PlayerController_damageset_enable)

dealloc(PlayerController_basepointer)
dealloc(PlayerController_update_enable)
dealloc(PlayerController_set_enable)
dealloc(PlayerController_healthset_enable)
dealloc(PlayerController_armorset_enable)
dealloc(PlayerController_damageset_enable)"""

[[cheat]]
id = "playercontroller-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerController Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerController_savedAOB)
label(PlayerController_returnhere)
label(PlayerController_originalcode)
label(PlayerController_exit)

label(PlayerController_update_exit)
label(PlayerController_set_exit)
label(PlayerController_healthset_exit)
label(PlayerController_armorset_exit)
label(PlayerController_damageset_exit)

registersymbol(PlayerController_savedAOB)

//3904F2E9 - C7 85 60FFFFFF 00000000 - mov [ebp-000000A0],00000000
//3904F2F3 - C7 85 64FFFFFF 00000000 - mov [ebp-0000009C],00000000
// PlayerController:FixedUpdate+55
//3904F2FD - C7 85 68FFFFFF 00000000 - mov [ebp-00000098],00000000
//3904F307 - D9EE                  - fldz
//3904F309 - D9 9D 44FFFFFF        - fstp dword ptr [ebp-000000BC]
//3904F30F - C7 85 6CFFFFFF 00000000 - mov [ebp-00000094],00000000
//3904F319 - C7 85 70FFFFFF 00000000 - mov [ebp-00000090],00000000
aobscan(PlayerController_searchedAOB, C7 85 68 FF FF FF 00 00 00 00 D9 EE D9 9D 44 FF FF FF)

alloc(PlayerController_newmem, 2048, PlayerController_searchedAOB)
alloc(PlayerController_temp1, 4, PlayerController_searchedAOB)


PlayerController_newmem:
mov [PlayerController_temp1], ebx

cmp dword ptr [PlayerController_update_enable], #0
je PlayerController_update_exit
mov [PlayerController_basepointer], edi
PlayerController_update_exit:

cmp dword ptr [PlayerController_set_enable], #0
je PlayerController_set_exit
PlayerController_set_exit:

cmp dword ptr [edi+10], #0
je PlayerController_damageset_exit
mov ebx, [edi+10]

cmp dword ptr [PlayerController_healthset_enable], #0
je PlayerController_healthset_exit
fld [ebx+12c]
fstp [ebx+170]
PlayerController_healthset_exit:

cmp dword ptr [PlayerController_armorset_enable], #0
je PlayerController_armorset_exit
fld [ebx+130]
fstp [ebx+174]
PlayerController_armorset_exit:

cmp dword ptr [PlayerController_damageset_enable], #0
je PlayerController_damageset_exit
mov [ebx+1c8], (float)9999
PlayerController_damageset_exit:

mov ebx, [PlayerController_temp1]


PlayerController_originalcode:
db C7 85 68 FF FF FF 00 00 00 00
//mov [ebp-00000098],00000000


PlayerController_exit:
jmp PlayerController_returnhere


PlayerController_searchedAOB:
PlayerController_savedAOB:
jmp PlayerController_newmem
nop
nop
nop
nop
nop
PlayerController_returnhere:


[DISABLE]
PlayerController_savedAOB:
db C7 85 68 FF FF FF 00 00 00 00
//mov [ebp-00000098],00000000

unregistersymbol(PlayerController_savedAOB)

dealloc(PlayerController_newmem)
dealloc(PlayerController_temp1)"""

