[[cheat]]
id = "movement-speed-x-hotkey-is-f2"
name = "Movement Speed X - Hotkey is F2"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

label(check)

alloc(mine,16)
alloc(mine2,16)
alloc(mine3,16)
registersymbol(mine)
registersymbol(mine2)
registersymbol(mine3)

mine2:
dd 186A0
mine3:
dd (float)1.00

newmem: //this is allocated memory, you have read,write,execute access
cmp ebx,02
je check
jmp originalcode

check:
    push ecx
mov ecx,[gta_sa.exe+77CE50]
mov [mine],ecx
    pop ecx
//
fild [mine]
fidiv [mine2]
fadd [mine3]
fstp [mine]
//
fmul [mine]

originalcode:
fmul dword ptr [ecx+44]
fadd dword ptr [eax+30]

exit:
jmp returnhere

"gta_sa.exe"+142DE5:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
dealloc(mine)
dealloc(mine2)
dealloc(mine3)
unregistersymbol(mine)
unregistersymbol(mine2)
unregistersymbol(mine3)
"gta_sa.exe"+142DE5:
fmul dword ptr [ecx+44]
fadd dword ptr [eax+30]
//Alt: db D8 49 44 D8 40 30"""

