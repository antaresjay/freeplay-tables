category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
label(xp_multi)
registersymbol(xp_multi)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
push ebx
mov ebx,[edi+88]
sub eax,ebx
imul eax,[xp_multi]
