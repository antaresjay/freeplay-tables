[[cheat]]
id = "find-baseitem-need-to-pick-an-item-can-be-disabled-after-finding-baseitem"
name = 'Find baseitem (need to pick an item), can be disabled after finding "baseitem'
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(pack,8B 40 24 3D 01 00 00 00 0F 94 C0 0F B6 C0 85 C0 0F 84)
alloc(newmem,$100)

label(code)
label(return)

globalalloc(baseitem,4)

newmem:

code:
         mov [baseitem],eax // added
  mov eax,[eax+24]
  cmp eax,00000001

  jmp return

pack:
   jmp code
  nop
  nop
  nop
return:
registersymbol(pack)

[DISABLE]

pack:
  db 8B 40 24 3D 01 00 00 00

unregistersymbol(pack)
dealloc(newmem)"""

