[[cheat]]
id = "no-engine-overheat"
name = "No Engine Overheat"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,NWH.Vehicle:FixedUpdate)
define(bytes,55 48 8B EC 48 81 EC 50 01 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,NWH.Vehicle:FixedUpdate)

label(code)
label(return)

newmem:
mov [rcx+188],0
mov [rcx+184],0

code:
  push rbp
  mov rbp,rsp
  sub rsp,00000150
  jmp return

address:
  jmp newmem
  nop 6
return:

[DISABLE]

address:
  db bytes


dealloc(newmem)

{"""
