[[cheat]]
id = "player"
name = "Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Quest Hunter.exe
  Version: 
  Date   : 2019-03-09
  Author : Abystus
}

[ENABLE]

aobscan(HealthRead,D9 40 58 D9 5D CC D9 45 CC) // should be unique
alloc(newmem,$1000)

label(playerbase)
label(return)

newmem:
  mov [playerbase],eax
  fld dword ptr [eax+58]
  fstp dword ptr [ebp-34]
  jmp return

playerbase:

HealthRead:
  jmp newmem
  nop
return:
registersymbol(HealthRead)
registersymbol(playerbase)
[DISABLE]

HealthRead:
  db D9 40 58 D9 5D CC

unregistersymbol(HealthRead)
unregistersymbol(playerbase)
dealloc(newmem)"""

