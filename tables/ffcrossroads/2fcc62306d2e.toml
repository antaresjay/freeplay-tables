type = "script"
source = """
[ENABLE]


aobscanmodule(timecd,FFCROSSROADS.exe,8B 83 94 02 00 00 48 8B CB 2B)
alloc(newmem,$1000,"FFCROSSROADS.exe"+2B752D)

label(code)
label(return)

newmem:
code:
  mov [rbx+00000294], #3999999
  mov eax, [rbx+00000294]
  jmp return

timecd:
  jmp newmem
  nop
return:
registersymbol(timecd)

[DISABLE]

timecd:
  db 8B 83 94 02 00 00

unregistersymbol(timecd)
dealloc(newmem)"""
