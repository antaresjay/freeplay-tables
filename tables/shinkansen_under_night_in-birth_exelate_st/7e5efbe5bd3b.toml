//000E82E0 - 85 C9                 - test ecx,ecx
//000E82E2 - 7E 1E                 - jle 000E8302
//000E82E4 - 66 0F6E C8            - movd xmm1,eax
//000E82E8 - 66 0F6E C1            - movd xmm0,ecx
aobscan(gamestats_searchedAOB, BF 80 00 00 00 85 C9 7E 1E)

