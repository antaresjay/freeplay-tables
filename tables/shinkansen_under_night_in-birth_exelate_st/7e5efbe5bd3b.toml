[[cheat]]
id = "player-stats-base-address-scan-to-update-play-level"
name = "Player Stats Base Address Scan (To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstats_update_exit)
label(playerstats_set_exit)
label(playerstats_vitset_exit)
label(playerstats_exsset_exit)
label(playerstats_veilset_exit)
label(playerstats_worthset_exit)
label(playerstats_enemyset_entry)
label(playerstats_enemyset_exit)

registersymbol(playerstats_savedAOB)

//001133DE - 89 48 14              - mov [eax+14],ecx
//001133E1 - 8B 0E                 - mov ecx,[esi]
// Accesses VIT Gauge
//001133E3 - 8B 43 F0              - mov eax,[ebx-10]
//001133E6 - 89 41 10              - mov [ecx+10],eax
//001133E9 - 8B 06                 - mov eax,[esi]
//001133EB - 0FB6 4B F8            - movzx ecx,byte ptr [ebx-08]
//001133EF - 89 48 0C              - mov [eax+0C],ecx
//001133F2 - 8B CF                 - mov ecx,edi
//001133F4 - 8B 07                 - mov eax,[edi]
//001133F6 - FF 50 20              - call dword ptr [eax+20]
//001133F9 - FF 73 F0              - push [ebx-10]
aobscan(playerstats_searchedAOB, 8B 43 F0 89 41 10 8B 06 0F B6 4B F8 89 48 0C 8B CF 8B 07)

alloc(playerstats_newmem, 2048, playerstats_searchedAOB)
alloc(playerstats_temp1, 4, playerstats_searchedAOB)
alloc(playerstats_temp2, 4, playerstats_searchedAOB)
alloc(playerstats_temp3, 4, playerstats_searchedAOB)
alloc(playerstats_temp4, 4, playerstats_searchedAOB)
alloc(playerstats_temp5, 4, playerstats_searchedAOB)


playerstats_newmem:
mov [playerstats_temp1], eax
mov [playerstats_temp2], ebx
mov [playerstats_temp3], ecx
mov [playerstats_temp4], edx

mov ebx, ebx
sub ebx, 74

cmp byte ptr [ebx+6], #0
jne playerstats_enemyset_entry

cmp dword ptr [playerstats_update_enable], #0
je playerstats_update_exit
mov [playerstats_basepointer], ebx
playerstats_update_exit:

cmp dword ptr [playerstats_set_enable], #0
je playerstats_set_exit
playerstats_set_exit:

cmp dword ptr [playerstats_vitset_enable], #0
je playerstats_vitset_exit
mov eax, [ebx+68]
mov [ebx+64], #99999
playerstats_vitset_exit:

cmp dword ptr [playerstats_exsset_enable], #0
je playerstats_exsset_exit
mov eax, [ebx+90]
mov [ebx+84], eax
playerstats_exsset_exit:

cmp dword ptr [playerstats_veilset_enable], #0
je playerstats_veilset_exit
mov eax, [ebx+d0]
mov [ebx+cc], eax
playerstats_veilset_exit:

cmp dword ptr [playerstats_worthset_enable], #0
je playerstats_worthset_exit
mov [ebx+6c], #1
mov [ebx+70], #1
playerstats_worthset_exit:

jmp playerstats_enemyset_exit

playerstats_enemyset_entry:
cmp dword ptr [playerstats_enemyset_enable], #0
je playerstats_enemyset_exit
mov [ebx+84], #0
mov [ebx+cc], #0
cmp [ebx+64], #5
jl playerstats_enemyset_exit
mov [ebx+64], #1
playerstats_enemyset_exit:

mov eax, [playerstats_temp1]
mov ebx, [playerstats_temp2]
mov ecx, [playerstats_temp3]
mov edx, [playerstats_temp4]


playerstats_originalcode:
db 8B 43 F0 89 41 10
//mov eax,[ebx-10]
//mov [ecx+10],eax


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB:
playerstats_savedAOB:
jmp playerstats_newmem
nop
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
db 8B 43 F0 89 41 10
//mov eax,[ebx-10]
//mov [ecx+10],eax

unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)
dealloc(playerstats_temp1)
dealloc(playerstats_temp2)
dealloc(playerstats_temp3)
dealloc(playerstats_temp4)
dealloc(playerstats_temp5)"""

