test ebx, ebx
je gamestats_chainset_exit
mov edx, [ecx+104]
mov [ecx+100], edx
gamestats_chainset_exit:

cmp dword ptr [gamestats_timeset_enable], #0
je gamestats_timeset_exit
mov [ebx+14f8], #4851
gamestats_timeset_exit:

cmp dword ptr [gamestats_vorpalset_enable], #0
je gamestats_vorpalset_exit
cmp [ebx-60], #1
jge gamestats_vorpalset_exit
mov [ebx-60], #1
