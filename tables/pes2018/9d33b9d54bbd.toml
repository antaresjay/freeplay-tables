[[cheat]]
id = "pes2018"
name = "PES2018球员属性修改"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048,"PES2018.exe"+126484F)
alloc(data,8)
label(returnhere)
label(originalcode)
label(exit)
registersymbol(data)

newmem:
push rax
lea rax,[rcx]
mov [data],rax
pop rax

originalcode:
movzx eax,byte ptr [rcx]
mov [r8],eax

exit:
jmp returnhere

"PES2018.exe"+126484F:
jmp newmem
nop
returnhere:




[DISABLE]

dealloc(newmem)
dealloc(data,8)
unregistersymbol(data)
"PES2018.exe"+126484F:
movzx eax,byte ptr [rcx]
mov [r8],eax"""

