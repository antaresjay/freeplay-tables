[[cheat]]
id = "find-player-structure-test-works-or-no"
name = ">> Find Player Structure ( test, works or no ) <<"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : HeroesOfLoot.exe
  Version: 2.1.0
  Date   : 2015-05-27
  Author : wcz
}

[ENABLE]

aobscan(PlayerStructure,8B 4B 74 85 C9 0F 8E 97)
alloc(newmem,$1000)
label(code)
label(return)
globalalloc(_pbase,4)

newmem:

code:
  mov [_pbase],ebx
  mov ecx,[ebx+74]
  test ecx,ecx
  jmp return

PlayerStructure:
  jmp code
return:
registersymbol(PlayerStructure)

[DISABLE]

PlayerStructure:
  db 8B 4D 74 85 C9

unregistersymbol(PlayerStructure)
dealloc(newmem)

