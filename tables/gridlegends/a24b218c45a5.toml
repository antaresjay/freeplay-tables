[[cheat]]
id = "infinite-flashbacks"
name = "Infinite Flashbacks"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(flashbackcd,GridLegends.exe,0F BF 80 68 01 00 00 44 2B F0 49 63 C6 48 C1 F8 3F)
alloc(newmem,$1000,flashbackcd)

label(code)
label(return)
label(newmem_addr)

newmem:
code:
  mov word ptr [rax+168], 0
  movsx eax, word ptr [rax+00000168]
  sub r14d, eax
  movsxd rax, r14d
  sar rax, 3F
  jmp return

flashbackcd:
  jmp qword ptr [newmem_addr]

newmem_addr:
dq newmem
nop
nop
nop
return:
registersymbol(flashbackcd)

[DISABLE]

flashbackcd:
  db 0F BF 80 68 01 00 00 44 2B F0 49 63 C6 48 C1 F8 3F

unregistersymbol(flashbackcd)
dealloc(newmem)"""
