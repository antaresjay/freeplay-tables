[[cheat]]
id = "step-9"
name = "Step 9"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,Tutorial-i386.exe,D8 6B 04 D9 5D D0) // should be unique
alloc(newmem,$1000)

label(originalcode)
label(return)
alloc(nil,4)
alloc(full,4)

full:
dd (float)100
nil:
dd (float)0

{
//Adds health to players instead of subtract
newmem:
  cmp [ebx+10],1
  jne originalcode
  fadd dword ptr [ebx+04]
  fstp dword ptr [ebp-30]
  jmp return
}

//one hit kill on enemy:
{
newmem:
  cmp [ebx+10],1
  je originalcode
  fsubr dword ptr [nil]
  fstp dword ptr [ebp-30]
  jmp return
}

//Refills health after every hit

newmem:
  cmp [ebx+10],1
  jne originalcode
  fsubr dword ptr [full]
  fstp dword ptr [ebp-30]
  jmp return


originalcode:
  fsubr dword ptr [ebx+04]
  fstp dword ptr [ebp-30]
  jmp return

INJECT:
  jmp newmem
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db D8 6B 04 D9 5D D0

unregistersymbol(INJECT)
dealloc(newmem)
dealloc(nil)"""
