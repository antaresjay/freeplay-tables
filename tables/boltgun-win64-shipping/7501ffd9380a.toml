[[cheat]]
id = "characterpointer"
name = "CharacterPointer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Character,$process,48 8B BF 40 02 00 00 EB) // should be unique
alloc(newmem,$1000,Character)
alloc(godMode,1,Character)

label(code)
label(return)
label(noGodMode)

newmem:
  mov [CharacterPointer],rdi //Pointer
  cmp byte ptr [godMode],00 //;Smybol for the god mode toggle is "godMode"
  je noGodMode
  mov byte ptr [rdi+5A],1C // True State for bCanBeDamaged, offset might change (hex)
  jmp code

noGodMode:
  mov byte ptr [rdi+5A],1D // False State for bCanBeDamaged, offset might change (hex)

code:
  mov rdi,[rdi+00000240]
  jmp return

CharacterPointer: //Pointer
  dq 0

Character:
  jmp newmem
  nop 2
return:
registersymbol(Character)
registersymbol(CharacterPointer)
registersymbol(godMode)

[DISABLE]

Character:
  db 48 8B BF 40 02 00 00

unregistersymbol(Character)
unregistersymbol(CharacterPointer)
unregistersymbol(godMode)
dealloc(newmem)
dealloc(godMode)"""
