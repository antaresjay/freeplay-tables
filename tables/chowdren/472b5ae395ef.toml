[[cheat]]
id = "get-total-kills-coins-stats"
name = "Get Total Kills / Coins Stats"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Chowdren.exe | Mighty Goose
  Version: Windows Store | Version: 1.0.4.0
  Date   : 2021-10-01
  Author : SovietWristwatch.jpg
}

[ENABLE]
aobscanmodule(stats,Chowdren.exe,F2 0F 11 49 08)
alloc(newmem,$1000,stats)

label(code)
label(return)
label(kills)
label(coins)
label(_kills)
label(_coins)
registersymbol(stats)
registersymbol(_kills)
registersymbol(_coins)

newmem:
  cmp r8,41
  je kills
  cmp r8,42
  je coins
  jmp code

kills:
  mov [_kills],rcx
  jmp code

coins:
  mov [_coins],rcx

code:
  movsd [rcx+08],xmm1
  jmp return

_kills:
  dq (double)0

_coins:
  dq (double)0

stats:
  jmp newmem
return:

[DISABLE]
stats:
  db F2 0F 11 49 08

unregistersymbol(stats)
unregistersymbol(_kills)
unregistersymbol(_coins)
dealloc(newmem)"""

