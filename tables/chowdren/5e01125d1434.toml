[[cheat]]
id = "inf-money"
name = "Inf_Money"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Mo,Chowdren.exe,F2 0F 11 86 C8 EB 09 00 48 8D 15 * * * * 48 8D 4D C8 E8 A2) // should be unique
alloc(newmem,$1000,Mo)
alloc(cash,4)

cash:
dq (double)999999999


label(code)
label(return)

newmem:

code:
  fld qword ptr [cash]
  fstp qword ptr [rsi+0009EBC8]
  jmp return

Mo:
  jmp newmem
  nop 3
return:
registersymbol(Mo)

[DISABLE]

Mo:
  db F2 0F 11 86 C8 EB 09 00

unregistersymbol(Mo)
dealloc(newmem)
dealloc(cash)"""

