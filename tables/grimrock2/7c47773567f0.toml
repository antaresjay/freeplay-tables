[[cheat]]
id = "stuff"
name = "Stuff"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(aob_general1,grimrock2.exe,0F B6 46 FD 8B 6C C2 04 8B 04 C2 ?? ?? ?? ?? ?? 8B 06 0F B6 CC 0F B6 E8)
label(_general1)
registersymbol(_general1)

alloc(mem_general1,2048)
label(return_general1)

registersymbol(p_activatedC1)
label(p_activatedC1)

registersymbol(p_xpmul)
label(p_xpmul)

//Health
aobscan(aob_Ihealth,0A 00 00 00 6c 65 61 64 65 72 73 68 69 70)
label(_Ihealth1)
registersymbol(_Ihealth1)
label(_Ihealth2)
registersymbol(_Ihealth2)
label(no_health)
//Health end
//Energy
aobscan(aob_Ienergy,0A 00 00 00 6c 65 61 64 65 72 73 68 69 70)
label(_Ienergy1)
registersymbol(_Ienergy1)
label(_Ienergy2)
registersymbol(_Ienergy2)
label(no_energy)
//Energy end
//XP
aobscan(aob_Ixp,0F 00 00 00 65 78 70 46 6F 72 4E 65 78 74 4C 65 76 65 6C)
label(_Ixp1)
registersymbol(_Ixp1)
label(_Ixp2)
registersymbol(_Ixp2)
label(no_xp)
//XP end
//Projectiles
aobscan(aob_Iproje,0D 00 00 00 6F 6E 55 6E 65 71 75 69 70 49 74 65 6D)
label(_Iproje1)
registersymbol(_Iproje1)
label(_Iproje2)
registersymbol(_Iproje2)
label(no_proje)
//Projectiles end
//Torch
aobscan(aob_Itorch,07 00 00 00 6D 61 78 46 75 65 6C)
label(_Itorch1)
registersymbol(_Itorch1)
label(_Itorch2)
registersymbol(_Itorch2)
label(no_torch)
//Torch end

mem_general1:
push ebx
xor ebx,ebx

bt [p_activatedC1],bx
jnc no_health
cmp edi,_Ihealth1
jne no_health
cmp esi,_Ihealth2
jne no_health
mov ebp,7fefffff
no_health:
inc ebx

bt [p_activatedC1],bx
jnc no_energy
cmp edi,_Ienergy1
jne no_energy
cmp esi,_Ienergy2
jne no_energy
mov ebp,7fefffff
no_energy:
inc ebx

bt [p_activatedC1],bx
jnc no_xp
cmp edi,_Ixp1
jne no_xp
cmp esi,_Ixp2
jne no_xp
fld qword [ecx]
fld qword [ecx]
mov [ecx+04],ebp
mov [ecx],eax
fld qword [ecx]
fsubrp
fld qword [p_xpmul]
fmulp
faddp
fstp qword [ecx]
mov ebp,[ecx+04]
mov eax,[ecx]
no_xp:
inc ebx

bt [p_activatedC1],bx
jnc no_proje
cmp edi,_Iproje1
jne no_proje
cmp esi,_Iproje2
jne no_proje

mov ebp,[ecx+04]
mov eax,[ecx]
no_proje:
inc ebx

bt [p_activatedC1],bx
jnc no_torch
cmp edi,_Itorch1
jne no_torch
cmp esi,_Itorch2
jne no_torch

mov ebp,[ecx+04]
mov eax,[ecx]
no_torch:
inc ebx

mov [ecx+04],ebp
mov [ecx],eax
pop ebx
jmp return_general1

p_activatedC1:
dd (int)0

p_xpmul:
dq (double)1

aob_general1+b:
_general1:
jmp mem_general1
return_general1:

//Health
aob_Ihealth-4c:
_Ihealth1:

aob_Ihealth-164:
_Ihealth2:
//Health end
//Energy
aob_Ienergy-4c:
_Ienergy1:

aob_Ienergy-13c:
_Ienergy2:
//Energy end
//XP
aob_Ixp-1c:
_Ixp1:

aob_Ixp-6c:
_Ixp2:
//XP end

//Projectiles
aob_Iproje+ec:
_Iproje1:

aob_Iproje+ac:
_Iproje2:
//Projectiles end

//Torch
aob_Itorch+1e4:
_Itorch1:

aob_Itorch+d4:
_Itorch2:
//Torch end

[DISABLE]
_general1:
mov [ecx+04],ebp
mov [ecx],eax

unregistersymbol(p_activatedC1)
unregistersymbol(p_xpmul)
unregistersymbol(_general1)
dealloc(mem_general1)

unregistersymbol(_Ihealth1)
unregistersymbol(_Ihealth2)
unregistersymbol(_Ienergy1)
unregistersymbol(_Ienergy2)
unregistersymbol(_Ixp1)
unregistersymbol(_Ixp2)
unregistersymbol(_Iproje1)
unregistersymbol(_Iproje2)
unregistersymbol(_Itorch1)
unregistersymbol(_Itorch2)"""

