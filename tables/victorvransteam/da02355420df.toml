[[cheat]]
id = "map-s-hit-awareness-timer-s"
name = "Map's Hit awareness & Timer(s)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanmodule(__No_Hits_Timer_,VictorVranSteam.exe,8B 4D 0C 8B 02 89 01 8B 42 04 89 41 04 5F) // should be unique
aobscan(_GameTimers_,C3 CC 55 8B EC A1 xx xx 9B 00 56 8B 75 08)
alloc(newmem,256)
alloc(_storetimer,24)

label(original)
label(_exit)
label(return)
label(_timercode)
label(_counter_)
label(_savetime)
registersymbol(_storetimer)
registersymbol(__No_Hits_Timer_)

newmem:
mov edi,_GameTimers_+06
mov edi,[edi]
mov [_storetimer+10],edi
add edi,4010
mov [_storetimer+14],edi

pushfd
mov edi,[edx+08]
cmp [RefClass_no_hits],edi
jne _timercode
cmp [edx+10],0
jne original

mov edi,[edx]
cmp edi,0
je original
xor edi,edi
mov [edx],edi
jmp original

_timercode:
cmp [RefClass_time_limit],edi
jne original

cmp [edx],0
je original

push ecx
  xor ecx,ecx
  lea edi,[_storetimer]

_counter_:
  cmp [edi+ecx*4],edx
  je _exit
  cmp [edi+ecx*4],0
  je _savetime
  inc ecx
  cmp ecx,4
  jne _counter_
//in order to have a rolling storage
  xor ecx,ecx
  mov [edi+04],ecx
  mov [edi+08],ecx
  mov [edi+0C],ecx

_savetime:
  mov [edi+ecx*4],edx

_exit:
pop ecx


original:
popfd
  mov ecx,[ebp+0C]
  mov eax,[edx]
  jmp return

__No_Hits_Timer_:
  jmp newmem
return:


[DISABLE]
//code from here till the end of the code will be used to disable the cheat
__No_Hits_Timer_:
  db 8B 4D 0C 8B 02
//mov ecx,[ebp+0C]
//mov eax,[edx]

unregistersymbol(_storetimer)
unregistersymbol(__No_Hits_Timer_)
dealloc(_storetimer)
dealloc(newmem)"""

