  je _freeze
  cmp eax,#8000    //Lightning Trap, Sword Dash, Mortar Explosive Jump
  je _freeze
  cmp eax,#6000    //Ball Lightning
  je _freeze
  cmp eax,#5000    //Sword Slash
  je _freeze
  cmp eax,#3000    //Rapier Coupe De Grace
  je _freeze
  cmp eax,#16000   //Rapier Charge
  je _freeze
  cmp eax,#28000   //Shythe Whirlwind
  jne code

_freeze:
  mov eax,#500
  mov [edx],eax

code:
  popfd
  mov ecx,[ebp+0C]
  mov eax,[edx]
  jmp return

INJECT:
  jmp newmem
return:


[DISABLE]
INJECT:
  db 8B 4D 0C 8B 02

unregistersymbol(INJECT)
dealloc(newmem)"""

