[[cheat]]
id = "items-selection"
name = "Items selection"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanmodule(Items_Inject,VictorVranSteam.exe,8B D0 89 54 24 14) // should be unique
//aobscan(OffsetBase_testing,0A 00 00 00 74 69 6D 65 5F 6C 69 6D 69 74)
alloc(newmem,1024)
alloc(store_mem,128)

label(returnhere)
label(originalcode)
label(exit)
label(_armor)
label(_bombs)
label(_cards)
label(_cardscc)
label(_cardsms)
label(_cooldn)
label(_cons_cooldn)
label(_cooldnch)
label(_fullXp)
label(_health)
label(_money)
label(_overdrive)
label(_pl_level)
label(_stacking)
label(_weapon)
label(_weapons)
label(_wpn_level)
label(_counter_)
label(_storage)
label(_savemulti_)

label(_storec_)
label(_storew_)
label(_storecd_)
label(_storeccd_)
label(_storeh_)
label(_stores_)
label(_storestk_)
label(_storegold_)
label(_storeMOverdr_)
label(_storelvl_)
label(_storexp_)
label(_storewlvl_)
registersymbol(Items_Inject)
registersymbol(_storew_)
registersymbol(_storec_)
registersymbol(_storecd_)
registersymbol(_storeccd_)
registersymbol(_storeh_)
registersymbol(_stores_)
registersymbol(_storeMOverdr_)
registersymbol(_storestk_)
registersymbol(_storegold_)
registersymbol(_storelvl_)
registersymbol(_storexp_)
registersymbol(_storewlvl_)

store_mem:
_storew_:
dd 0
dd 0
_storec_:
dd 0
dd 0
dd 0
_storecd_:
dd 0
dd 0
dd 0
dd 0
_storeccd_:
dd 0
_storeh_:
dd 0
_stores_:
dd 0
_storeMOverdr_:
dd 0
_storestk_:
dd 0
_storegold_:
dd 0
_storelvl_:
dd 0
_storexp_:
dd 0
_storewlvl_:
dd 0

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
pushfd
mov edx,[eax+08]

cmp edx,[RefClass_base_damage]
//Check for base_damage: Weapons, Bombs, Demon Powers
je _weapons
cmp edx,[RefClass_adm]
//Check for adm: Cards bonus damage
je _cards
cmp edx,[RefClass_movement_speed]
//Check for movement_speed: Card bonus speed
je _cardsms
cmp edx,[RefClass_acc]
//Check for movement_speed: Card bonus speed
je _cardscc
cmp edx,[RefClass_health_no_debuf]
//Check for health_no_debuf: MedKit class
je _health
cmp edx,[RefClass_armor_per_card]
//Check for armor_per_card: The Saint bonus armor
je _armor
cmp edx,[RefClass_stacks]
//Check for stacks: Stackable bonuses from weapons
je _stacking
cmp edx,[RefClass_Gold]
//Check for Gold: Money
je _money
cmp edx,[RefClass_XP]
//Check for XP: Overall Xp gained
je _fullXp
cmp edx,[RefClass_Level]
//Check for Level: current player level
je _pl_level
cmp edx,[RefClass_MaxOverdrive]
//Check for MaxOverdrive
je _overdrive
cmp edx,[RefClass_cooldown]
//Check for cooldown: Weapons' attack and consumable cooldowns
je _cooldn
cmp edx,[RefClass_cooldown_charged]
//Check for cooldown_charged: Shock cooldown
je _cooldnch
cmp edx,[RefClass_level__w]
//Check for cooldown_charged: Shock cooldown
je _wpn_level

jmp originalcode


_weapons:
//base_damage for Weapons, Demon Powers
  cmp [eax+10],0
  jne _bombs

_weapon:
    mov [_storew_],eax
    jmp originalcode

_bombs:
//base_damage for Bombs
    cmp [eax+10],03E40000
    jna originalcode

    mov [_storew_+04],eax
    jmp originalcode

_cards:
//Cards bonus damage (single or overall)
  mov [_storec_],eax
  jmp originalcode

_cardsms:
//Card bonus speed (or overall bonus speed)
  mov [_storec_+04],eax
  jmp originalcode

_cardscc:
//Card bonus speed (or overall bonus speed)
  mov [_storec_+08],eax
  jmp originalcode

_health:
//MedKit class
  mov [_storeh_],eax
  jmp originalcode

_armor:
//"The Saint" bonus armor
  mov [_stores_],eax
  jmp originalcode

_stacking:
//Stackable bonuses from weapons (Soul Shard an so on)
  cmp [eax],10     // overall stack charges max = 15
  jae originalcode

  mov [_storestk_],eax
  jmp originalcode

_money:
//Money available (mainly on Inventory) and piles collected
  cmp [eax+10],0
  jne originalcode

  mov [_storegold_],eax
  jmp originalcode

_fullXp:
//Overall Xp gained
  mov [_storexp_],eax
  jmp originalcode

_pl_level:
//current player level
  mov [_storelvl_],eax
  jmp originalcode

_overdrive:
//when overdrive bar is fully charged
  mov [_storeMOverdr_],eax
  jmp originalcode

_wpn_level:
//when overdrive bar is fully charged
  mov [_storewlvl_],eax
  jmp originalcode

//==========================================
//New classes go before the above line

_cooldn:
//Weapons' attack cooldowns
  cmp [eax+10],0
  jne _cons_cooldn

  cmp [eax],#3000
  jb originalcode
  cmp [eax],#28000
  jbe _storage
  jmp originalcode

_cons_cooldn:
//Consumable cooldowns (because have different structure)
    cmp [eax+10],03E40000
    jna originalcode

    cmp [eax],#20000
    jb originalcode
    cmp [eax],#90000
    ja originalcode

    mov [_storeccd_],eax
    jmp originalcode

_cooldnch:
//Shock cooldown (typically due by overheating)
//  cmp [eax+10],03E00000
//  jb originalcode

_storage:
//All cooldowns get here
//... but some values are from unknown sources
  push ecx
  xor ecx,ecx
  lea edx,[_storecd_]

_counter_:
  cmp [edx+ecx*4],eax
  je exit
  cmp [edx+ecx*4],0
  je _savemulti_

  inc ecx
  cmp ecx,4
  jne _counter_
//in order to have a rolling storage...
  xor ecx,ecx
  mov [edx+04],ecx
  mov [edx+08],ecx
  mov [edx+0C],ecx

_savemulti_:
  mov [edx+ecx*4],eax

exit:
  pop ecx

originalcode:
popfd
mov edx,eax
mov [esp+14],edx

jmp returnhere

Items_Inject:
jmp newmem
nop
returnhere:



[DISABLE]
//code from here till the end of the code will be used to disable the cheat
Items_Inject:
  db 8B D0 89 54 24 14
//mov edx,eax
//mov [esp+14],edx


unregistersymbol(_storew_)
unregistersymbol(_storec_)
unregistersymbol(_storecd_)
unregistersymbol(_storeccd_)
unregistersymbol(_storeh_)
unregistersymbol(_stores_)
unregistersymbol(_storeMOverdr_)
unregistersymbol(_storestk_)
unregistersymbol(_storegold_)
unregistersymbol(_storelvl_)
unregistersymbol(_storexp_)
unregistersymbol(_storewlvl_)
unregistersymbol(Items_Inject)
dealloc(store_mem)
dealloc(newmem)"""

