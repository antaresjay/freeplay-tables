[[cheat]]
id = "god-mode"
name = "God mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,OBSCURE2.exe,D9 91 20 03 00 00 D8 99) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(hit)
label(code2)

newmem:
cmp [ecx+0000000C],1
jne code
fst dword ptr [ecx+00000320]
mov [ecx+00000320],(float)100
jmp return
code:
cmp [hit],1
jne code2
  fst dword ptr [ecx+00000320]
  mov [ecx+00000320],0
  jmp return

code2:
fst dword ptr [ecx+00000320]
  jmp return

  hit:
  dd 0

INJECT:
  jmp newmem
  nop
return:
registersymbol(INJECT)
registersymbol(hit)
registersymbol(code2)

[DISABLE]

INJECT:
  db D9 91 20 03 00 00

unregistersymbol(*)
dealloc(*)"""

