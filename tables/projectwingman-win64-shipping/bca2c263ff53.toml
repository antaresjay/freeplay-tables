[[cheat]]
id = "activate"
name = "Activate"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(player,2048)
registersymbol(player)

player:
dq 0

aobscanmodule(BombCapability,ProjectWingman-Win64-Shipping.exe,48 89 54 24 10 * * * * * * * 48 81 EC 58 03 00 00)
registersymbol(BombCapability)
aobscanmodule(GunsCapability,ProjectWingman-Win64-Shipping.exe,* * * * * 48 89 4C 24 08 * 48 81 EC 10 03 00 00)
registersymbol(GunsCapability)
aobscanmodule(MissileCapability,ProjectWingman-Win64-Shipping.exe,* * * * * * * * * * 56 57 48 81 EC 08 06 00 00)
registersymbol(MissileCapability)
aobscanmodule(Activate,ProjectWingman-Win64-Shipping.exe,4C 8B DC 55 53 49 8D AB 78 F3 FF FF)
registersymbol(Activate)
alloc(newmem,2048,Activate)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
push rax
push rcx
mov rax,[rcx+30]
mov rax,[rax+000002B0]
test rax,rax
je originalcode
mov rax,[rax+00000E30]
mov [player],rax

originalcode:
pop rcx
pop rax
mov r11,rsp
push rbp
push rbx

exit:
jmp returnhere

Activate:
jmp newmem
returnhere:

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(player)
unregistersymbol(player)

unregistersymbol(BombCapability)
unregistersymbol(GunsCapability)
unregistersymbol(MissileCapability)
unregistersymbol(Activate)
dealloc(newmem)
Activate:
//mov r11,rsp
//push rbp
//push rbx
db 4C 8B DC 55 53"""

