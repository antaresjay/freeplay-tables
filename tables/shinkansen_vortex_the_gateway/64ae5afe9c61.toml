[[cheat]]
id = "cpxmaincontrol-base-address-scan-initialization-activate-this-first"
name = "cpxMainControl Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(cpxMainControl_basepointer)
registersymbol(cpxMainControl_update_enable)
registersymbol(cpxMainControl_set_enable)
registersymbol(cpxMainControl_healthset_enable)
registersymbol(cpxMainControl_needsset_enable)
registersymbol(cpxMainControl_positivesset_enable)
registersymbol(cpxMainControl_negativesset_enable)

alloc(cpxMainControl_basepointer, 4)
alloc(cpxMainControl_update_enable, 4)
alloc(cpxMainControl_set_enable, 4)
alloc(cpxMainControl_healthset_enable, 4)
alloc(cpxMainControl_needsset_enable, 4)
alloc(cpxMainControl_positivesset_enable, 4)
alloc(cpxMainControl_negativesset_enable, 4)


[DISABLE]
unregistersymbol(cpxMainControl_basepointer)
unregistersymbol(cpxMainControl_update_enable)
unregistersymbol(cpxMainControl_set_enable)
unregistersymbol(cpxMainControl_healthset_enable)
unregistersymbol(cpxMainControl_needsset_enable)
unregistersymbol(cpxMainControl_positivesset_enable)
unregistersymbol(cpxMainControl_negativesset_enable)

dealloc(cpxMainControl_basepointer)
dealloc(cpxMainControl_update_enable)
dealloc(cpxMainControl_set_enable)
dealloc(cpxMainControl_healthset_enable)
dealloc(cpxMainControl_needsset_enable)
dealloc(cpxMainControl_positivesset_enable)
dealloc(cpxMainControl_negativesset_enable)"""

[[cheat]]
id = "cpxmaincontrol-base-address-scan-to-activate-play-level-to-update-play-level"
name = "cpxMainControl Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(cpxMainControl_savedAOB)
label(cpxMainControl_returnhere)
label(cpxMainControl_originalcode)
label(cpxMainControl_exit)

label(cpxMainControl_update_exit)
label(cpxMainControl_set_exit)
label(cpxMainControl_healthset_exit)
label(cpxMainControl_needsset_exit)
label(cpxMainControl_positivesset_exit)
label(cpxMainControl_negativesset_exit)

registersymbol(cpxMainControl_savedAOB)

//0518E05E - C7 85 34FEFFFF 00000000 - mov [ebp-000001CC],00000000
//0518E068 - C7 85 38FEFFFF 00000000 - mov [ebp-000001C8],00000000
// cpxMainControl:Update+32
//0518E072 - C7 85 3CFEFFFF 00000000 - mov [ebp-000001C4],00000000
//0518E07C - 8B 47 20              - mov eax,[edi+20]
//0518E07F - 8D 8D 40FEFFFF        - lea ecx,[ebp-000001C0]
//0518E085 - 83 EC 04              - sub esp,04
//0518E088 - 6A 01                 - push 01
//0518E08A - 50                    - push eax
aobscan(cpxMainControl_searchedAOB, 0F B6 87 04 03 00 00 85 C0)

alloc(cpxMainControl_newmem, 2048, cpxMainControl_searchedAOB)
alloc(cpxMainControl_temp1, 4, cpxMainControl_searchedAOB)


cpxMainControl_newmem:
mov [cpxMainControl_temp1], ebx

cmp dword ptr [cpxMainControl_update_enable], #0
je cpxMainControl_update_exit
mov [cpxMainControl_basepointer], edi
cpxMainControl_update_exit:

cmp dword ptr [cpxMainControl_set_enable], #0
je cpxMainControl_set_exit
cpxMainControl_set_exit:

cmp dword ptr [cpxMainControl_healthset_enable], #0
je cpxMainControl_healthset_exit
cmp dword ptr [edi+b8], #0
je cpxMainControl_healthset_exit
mov ebx, [edi+b8]
fld [ebx+70]
fstp [ebx+74]
cpxMainControl_healthset_exit:

cmp dword ptr [cpxMainControl_needsset_enable], #0
je cpxMainControl_needsset_exit
cmp dword ptr [edi+bc], #0
je cpxMainControl_needsset_exit
mov ebx, [edi+bc]
cmp dword ptr [ebx+58], #0
je cpxMainControl_needsset_exit
mov ebx, [ebx+58]
mov [ebx+8], (float)50
mov [ebx+c], (float)100
mov [ebx+10], (float)100
cpxMainControl_needsset_exit:

cmp dword ptr [cpxMainControl_positivesset_enable], #0
je cpxMainControl_positivesset_exit
cmp dword ptr [edi+bc], #0
je cpxMainControl_positivesset_exit
mov ebx, [edi+bc]
cmp dword ptr [ebx+58], #0
je cpxMainControl_positivesset_exit
mov ebx, [ebx+58]
mov [ebx+14], (float)100
mov [ebx+1c], (float)100
mov [ebx+24], (float)100
mov [ebx+2c], (float)100
mov [ebx+30], (float)100
mov [ebx+38], (float)100
cpxMainControl_positivesset_exit:

cmp dword ptr [cpxMainControl_negativesset_enable], #0
je cpxMainControl_negativesset_exit
cmp dword ptr [edi+bc], #0
je cpxMainControl_negativesset_exit
mov ebx, [edi+bc]
cmp dword ptr [ebx+58], #0
je cpxMainControl_negativesset_exit
mov ebx, [ebx+58]
mov [ebx+20], (float)0
mov [ebx+40], (float)0
mov [ebx+44], (float)0
cpxMainControl_negativesset_exit:

mov ebx, [cpxMainControl_temp1]


cpxMainControl_originalcode:
db 0F B6 87 04 03 00 00
//movzx eax,byte ptr [edi+00000304]


cpxMainControl_exit:
jmp cpxMainControl_returnhere


cpxMainControl_searchedAOB:
cpxMainControl_savedAOB:
jmp cpxMainControl_newmem
nop
nop
cpxMainControl_returnhere:


[DISABLE]
cpxMainControl_savedAOB:
db 0F B6 87 04 03 00 00
//movzx eax,byte ptr [edi+00000304]

unregistersymbol(cpxMainControl_savedAOB)

dealloc(cpxMainControl_newmem)
dealloc(cpxMainControl_temp1)"""

