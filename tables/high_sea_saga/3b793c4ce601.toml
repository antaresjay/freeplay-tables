type = "script"
source = """
[ENABLE]
aobscanmodule(staminasigh,GameAssembly.dll,8B 41 18 85 C0 74 * 6A 00 50 E8)
alloc(newmem,$1000)
label(return)

newmem:
push ecx
push edx
mov eax,[ecx+18]
mov edx,[eax+08]
mov ecx,[edx+08]
xor ecx,edi
mov [edx+18],ecx
pop edx
pop ecx
test eax,eax
jmp return

staminasigh:
  jmp newmem
return:
registersymbol(staminasigh)

[DISABLE]
staminasigh:
  db 8B 41 18 85 C0

unregistersymbol(staminasigh)
dealloc(newmem)"""
