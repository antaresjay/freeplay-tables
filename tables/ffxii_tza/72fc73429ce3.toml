[[cheat]]
id = "override-shop-item-buy-item-you-want"
name = "Override Shop Item (Buy Item You Want)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(ShopItemAOB,FFXII_TZA.exe,8B 58 10 0F B7 48 08 0F BA F3 1F) // should be unique
registersymbol(ShopItemAOB)
alloc(newmem,1024,ShopItemAOB)

label(OverrideItemID)
registersymbol(OverrideItemID)

newmem:
  mov ebx,[rax+10]
  movzx ecx,word ptr [rax+08]
  mov cx,[OverrideItemID]
  cmp cx,-1
  jne return
  movzx ecx,word ptr [rax+08]
  jmp return

OverrideItemID:
dw -1
  
ShopItemAOB:
  jmp newmem
  nop
  nop
  return:
  
[DISABLE]

ShopItemAOB:
  db 8B 58 10 0F B7 48 08

unregistersymbol(ShopItemAOB)
unregistersymbol(OverrideItemID)

dealloc(newmem)"""

