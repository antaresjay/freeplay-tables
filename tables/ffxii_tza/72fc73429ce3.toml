[[cheat]]
id = "damage-modifier-script-god-mode-one-hit-kill-etc"
name = "Damage Modifier Script (God Mode, One Hit Kill, etc)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DamageModAOB,FFXII_TZA.exe,49 8B C8 44 8B F2 E8 ?? ?? ?? ?? 48 8B CE 48 8B E8)
registersymbol(DamageModAOB)
alloc(newmem,4096,DamageModAOB)

///
label(originalcode)
label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(EnemyDamageMultiplier)
registersymbol(EnemyDamageMultiplier)
label(HeroDamageMultiplier)
registersymbol(HeroDamageMultiplier)
label(EnemyHealingMultiplier)
registersymbol(EnemyHealingMultiplier)
label(HeroHealingMultiplier)
registersymbol(HeroHealingMultiplier)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

///
newmem:
  cmp byte ptr [rsi+54],FF
  je EnemyHit
HeroHit:
  cmp edx,0
  jl HeroDamageHit
  jg HeroHealingHit
  jmp originalcode
HeroDamageHit:
  cmp [HeroDamageMultiplier],(float)0.0
  je CheckGodMode
  neg rdx
  push rdx
  fild dword ptr [rsp]
  fmul dword ptr [HeroDamageMultiplier]
  fistp dword ptr [rsp]
  pop rdx
  neg rdx
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor rdx,rdx
  jmp originalcode
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne originalcode
  push rax
  movzx eax,[rsi+48]
  neg rdx
  cmp edx,eax
  jl @F
  xor rdx,rdx
@@:
  neg rdx
  pop rax
  jmp originalcode
HeroHealingHit:
  cmp [HeroHealingMultiplier],(float)0.0
  je originalcode
  push rdx
  fild dword ptr [rsp]
  fmul dword ptr [HeroHealingMultiplier]
  fistp dword ptr [rsp]
  pop rdx
  jmp originalcode
EnemyHit:
  cmp edx,0
  jl EnemyDamageHit
  jg EnemyHealingHit
  jmp CheckOneHitKill
EnemyDamageHit:
  cmp [EnemyDamageMultiplier],(float)0.0
  je CheckOneHitKill
  neg rdx
  push rdx
  fild dword ptr [rsp]
  fmul dword ptr [EnemyDamageMultiplier]
  fistp dword ptr [rsp]
  pop rdx
  neg rdx
CheckOneHitKill:
  cmp [OneHitKill],1
  jne originalcode
  mov rdx,#999999
  neg rdx
  jmp originalcode
EnemyHealingHit:
  cmp [EnemyHealingMultiplier],(float)0.0
  je originalcode
  push rdx
  fild dword ptr [rsp]
  fmul dword ptr [EnemyHealingMultiplier]
  fistp dword ptr [rsp]
  pop rdx
  
originalcode:
  mov [rsp+10],edx
  mov rcx,r8
  mov r14d,edx
  jmp return

GodMode:
dq 1
OneHitKill:
dq 0
EnemyDamageMultiplier:
dq (float)0.0
HeroDamageMultiplier:
dq (float)0.5
EnemyHealingMultiplier:
dq (float)0.0
HeroHealingMultiplier:
dq (float)2.0
HeroCannotDie:
dq 1

DamageModAOB:
  jmp newmem
  nop
  return:
  
[DISABLE]

DamageModAOB:
  db 49 8B C8 44 8B F2

unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(EnemyDamageMultiplier)
unregistersymbol(HeroDamageMultiplier)
unregistersymbol(HeroCannotDie)
unregistersymbol(DamageModAOB)

dealloc(newmem)"""

