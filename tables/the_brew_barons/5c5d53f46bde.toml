[[cheat]]
id = "money"
name = "Money"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(moniesssss,GameAssembly.dll,8B 8B F0 00 00 00 03 CE 33 FF 85 C9 0F 4E CF)
alloc(newmem,$1000)

label(code)
label(return)

label(materials)

label(oldisgold)
registersymbol(oldisgold)

label(harstem)
registersymbol(harstem)

newmem:
  cmp dword ptr [oldisgold], 1
  jne materials

  mov [rbx+F0], #999999

materials:
  cmp dword ptr [harstem], 1
  jne code

  mov [rbx+118], #9999
code:
  mov ecx,[rbx+000000F0]
  add ecx,esi
  xor edi,edi
  test ecx,ecx
  cmovle ecx,edi
  jmp return

oldisgold:
dd 0

harstem:
dd 0

moniesssss:
  jmp far newmem
  nop
return:
registersymbol(moniesssss)

[DISABLE]

moniesssss:
  db 8B 8B F0 00 00 00 03 CE 33 FF 85 C9 0F 4E CF

unregistersymbol(moniesssss)
unregistersymbol(oldisgold)
unregistersymbol(harstem)
dealloc(newmem)"""

