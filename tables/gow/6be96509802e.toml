[[cheat]]
id = "disable-writing-to-fov-address"
name = "Disable Writing to FOV Address"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem2,2048,"GoW.exe"+4C5E16) 
label(returnhere2)
label(originalcode2)
label(exit2)

newmem2: //this is allocated memory, you have read,write,execute access
//place your code here
nop

originalcode2:
//movss [rbx+000001A8],xmm0

exit2:
jmp returnhere2

"GoW.exe"+4C5E16:
jmp newmem2
nop 3
returnhere2:

alloc(newmem,2048,"GoW.exe"+4BB102) 
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
nop

originalcode:
//movss [rcx+000001A8],xmm0

exit:
jmp returnhere

"GoW.exe"+4BB102:
jmp newmem
nop 3
returnhere:



 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem2)
"GoW.exe"+4C5E16:
movss [rbx+000001A8],xmm0
//Alt: db F3 0F 11 83 A8 01 00 00
dealloc(newmem)
"GoW.exe"+4BB102:
movss [rcx+000001A8],xmm0
//Alt: db F3 0F 11 81 A8 01 00 00"""

