[[cheat]]
id = "find-variables"
name = "Find Variables"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(getLuaVariable,EngineWin64s.dll,48 8B 06 49 89 06)
alloc(newmem,$1000,getLuaVariable)

label(code)
label(return)
label(health)
label(metapoints)
label(money)
label(keys)
label(crit)
label(bullet)
label(rarity)
label(hero)
label(giftpoints)

newmem:
  mov eax,[r12+08]
  and eax,3F
  je code
  sub eax,03
  je code
  cmp eax,01
  jne code
  //mov rax,(double)1.0
  //cmp [rsi],rax
  //jne @f
  mov rax,[r12]
  lea rax,[rax+18]
@@:
  mov rax,[r12]
@@:
  cmp [rax+10],#6
  jne @f
  cmp dword ptr [rax+18],'Heal'
  jne @f
  cmp  word ptr [rax+1C],'th'
  jne @f
  mov rax,health
  mov [rax],rsi
  jmp code
@@:
  cmp [rax+10],#10
  jne @f
  cmp dword ptr [rax+18],'Meta'
  jne @f
  cmp dword ptr [rax+1C],'Poin'
  jne @f
  cmp  word ptr [rax+20],'ts'
  jne @f
  mov rax,metapoints
  mov [rax],rsi
  jmp code
@@:
  cmp [rax+10],#5
  jne @f
  cmp dword ptr [rax+18],'Mone'
  jne @f
  cmp  byte ptr [rax+1C],'y'
  jne @f
  mov rax,money
  mov [rax],rsi
  jmp code
@@:
  cmp [rax+10],#8
  jne @f
  cmp dword ptr [rax+18],'Lock'
  jne @f
  cmp dword ptr [rax+1C],'Keys'
  jne @f
  mov rax,keys
  mov [rax],rsi
  jmp code
@@:
  cmp [rax+10],#10
  jne @f
  cmp dword ptr [rax+18],'Gift'
  jne @f
  cmp dword ptr [rax+1C],'Poin'
  jne @f
  cmp  word ptr [rax+20],'ts'
  jne @f
  mov rax,giftpoints
  mov [rax],rsi
  jmp code
@@:
  cmp [rax+10],#4
  jne @f
  cmp dword ptr [rax+18],'Crit'
  jne @f
  mov rax,crit
  mov [rax],rsi
  jmp code
@@:
  cmp [rax+10],#6
  jne @f
  cmp dword ptr [rax+18],'Bull'
  jne @f
  cmp  word ptr [rax+1C],'et'
  jne @f
  mov rax,bullet
  mov [rax],rsi
  jmp code
@@:
  cmp [rax+10],#6
  jne @f
  cmp dword ptr [rax+18],'Rari'
  jne @f
  cmp  word ptr [rax+1C],'ty'
  jne @f
  mov rax,rarity
  mov [rax],rsi
  jmp code
@@:
  cmp [rax+10],#4
  jne @f
  cmp dword ptr [rax+18],'Hero'
  jne @f
  mov rax,hero
  mov [rax],rsi
  jmp code
code:
  mov rax,[rsi]
  mov [r14],rax
  jmp return

health:
  dq 0
metapoints:
  dq 0
money:
  dq 0
keys:
  dq 0
crit:
  dq 0
bullet:
  dq 0
rarity:
  dq 0
hero:
  dq 0
giftpoints:
  dq 0

getLuaVariable:
  jmp newmem
  nop
return:
registersymbol(getLuaVariable)
registersymbol(health)
registersymbol(metapoints)
registersymbol(money)
registersymbol(keys)
registersymbol(crit)
registersymbol(bullet)
registersymbol(rarity)
registersymbol(hero)
registersymbol(giftpoints)

[DISABLE]
getLuaVariable:
  db 48 8B 06 49 89 06
unregistersymbol(getLuaVariable)
unregistersymbol(health)
unregistersymbol(metapoints)
unregistersymbol(money)
unregistersymbol(keys)
unregistersymbol(crit)
unregistersymbol(bullet)
unregistersymbol(rarity)
unregistersymbol(hero)
unregistersymbol(giftpoints)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: "EngineWin64s.dll"+37EA29

"EngineWin64s.dll"+37EA07: 74 20                    -  je EngineWin64s.dll+37EA29
