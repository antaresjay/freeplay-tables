[[cheat]]
id = "set-pixels"
name = "-> Set Pixels"
category = "misc"
description = ""
hint = ""
type = "script"
source = '''
//Target:  IncrementalCubes.exe
//Author:  Salis
//Credit to METHOS for custom Template LUA

[ENABLE]

////////////////////////  whitecubes  \\\\\\\\\\\\\\\\\\\\\\\\

define(address, GameLogicDataValues:Update+4c)

alloc(newmem,1024)
alloc(obytes_whitecubes, 10)
label(return code)

registersymbol(obytes_whitecubes newpixels)

obytes_whitecubes:
readmem(address, 10)

newmem:

code:
 fld qword ptr [newpixels]
 fstp qword ptr [rax+00000228]
 //movsd [rax+00000228],xmm0
 jmp return

newpixels:
dq (double)9999999

address:
 jmp newmem
 nop 3
return:


[DISABLE]

address:
readmem(obytes_whitecubes, 10)

dealloc(*)
unregistersymbol(*)'''

