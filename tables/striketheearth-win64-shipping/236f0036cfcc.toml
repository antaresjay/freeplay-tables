[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(getplayer,StrikeTheEarth-Win64-Shipping.exe,48 8B 4E 30 48 8B 01 FF 90 98 07 00 00 48 89 87 68 01 00 00) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

label(modify_loop)


label(get_data)
registersymbol(get_data)


newmem:
  push r15
  push r14
  push rdx
  push rbx

  mov [get_data], rsi

  mov r15, [rsi+30]
  test r15, r15
  je code

  mov r15, [r15+2D0]
  test r15, r15
  je code

  mov r14, [r15+720]
  test r14, r14
  je code

modify_loop:
  mov [rdx+0], #77
  add rdx, 14
  dec rbx
  jnz modify_loop

code:
  pop rbx
  pop rdx
  pop r14
  pop r15

  mov rcx,[rsi+30]
  mov rax,[rcx]
  call qword ptr [rax+00000798]
  mov [rdi+00000168],rax
  jmp return

get_data:
dq 0


getplayer:
  jmp far newmem
  nop 6
return:
registersymbol(getplayer)

[DISABLE]

getplayer:
  db 48 8B 4E 30 48 8B 01 FF 90 98 07 00 00 48 89 87 68 01 00 00

unregistersymbol(getplayer)
dealloc(newmem)"""

