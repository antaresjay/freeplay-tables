[[cheat]]
id = "unlimited-health"
name = "Unlimited Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : FSD-WinGDK-Shipping.exe
  Version: 1.35.65091.0 | Windows Store
  Date   : 2021-09-06
  Author : SvT
}

[ENABLE]
aobscanmodule(health,FSD-WinGDK-Shipping.exe,F3 44 0F 11 8F 98 01 00 00)
alloc(newmem,$1000,health)

label(code)
label(return)

newmem:
  cmp [rdi+170],1
  jne code
  mov [rdi+00000198],(float)0
  jmp return

code:
  movss [rdi+00000198],xmm9
  jmp return

health:
  jmp newmem
  nop 4
return:
registersymbol(health)

[DISABLE]
health:
  db F3 44 0F 11 8F 98 01 00 00

unregistersymbol(health)
dealloc(newmem)"""

