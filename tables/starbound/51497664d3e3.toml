newmem:

cmp [select1],1      //is this option selected?
jne mmitem           //no? go to next option
cmp [select2],1        //is the other option activate?
je mmitem            //yes? move on
//mov [test1],1        //set the flag from this option
mov [citem],ecx      //used as a pointer

mmitem:
cmp [select2],1      //is this option selected?
jne code             //no? go to next option
cmp [select1],1        //is the other option activate?
je code
//mov [test2],1
