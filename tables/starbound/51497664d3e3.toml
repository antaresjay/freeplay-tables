  mov eax,[ecx+1C]
  mov ebp,esp
  jmp return

select1:

dd 0

select2:

dd 0

mitem:

dd #1000

bitem:
  jmp newmem
return:
registersymbol(bitem)

[DISABLE]

bitem:
  db 8B 41 1C 89 E5

unregistersymbol(bitem)
