[[cheat]]
id = "inf-health-energy"
name = "Inf health & energy"
category = "player"
description = ""
hint = ""
type = "script"
source = """
//Find the Star::Player::setAdmin() command, it sets the admin flag.
//starbound.exe+176ED0 - 55                    - push ebp
//starbound.exe+176ED1 - 89 E5                 - mov ebp,esp
//starbound.exe+176ED3 - 8B 45 08              - mov eax,[ebp+08]
//starbound.exe+176ED6 - 5D                    - pop ebp
//starbound.exe+176ED7 - 88 81 850A0000        - mov [ecx+00000A85],al
//starbound.exe+176EDD - C2 0400               - ret 0004

//Once you have that, the last mov function there acts on the admin flag in RAM.
//So watch that flag and see when it's read.  For monster attacks, it's read
//when the attack would hit you, the game does a comparison on the admin flag
//to see if you should be hit by the attack or not.
//starbound.exe+185B2B - 80 BB 850A0000 00     - cmp byte ptr [ebx+00000A85],00
//starbound.exe+185B32 - 74 0B                 - je starbound.exe+185B3F
//starbound.exe+185B34 - 8B 8B 140A0000        - mov ecx,[ebx+00000A14]
//starbound.exe+185B3A - E8 C11A2300           - call starbound.exe+3B7600
//starbound.exe+185B3F - D9 05 3C2FDE00        - fld dword ptr [starbound.exe+9E2F3C]
//starbound.exe+185B45 - 89 D9                 - mov ecx,ebx


[ENABLE]
aobscan(instaheal, 80 BB 85 0A 00 00 00 74 0B 8B 8B 14 0A 00 00 E8 ?? ?? ?? 00 D9 05 ?? ?? ?? ?? 89 D9)
label(_instaheal)
registersymbol(_instaheal)

//Reverse the logic of the check by checking for on instead of off.
instaheal+6:
_instaheal:
db 01

[DISABLE]
_instaheal:
db 00

unregistersymbol(_instaheal)"""

