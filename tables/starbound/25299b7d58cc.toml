[[cheat]]
id = "get-base-ptr"
name = "Get Base Ptr "
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(playerhsh,starbound.exe,F3 0F 10 47 54 F3 0F 5E)
alloc(newmem,$100,"starbound.exe") // Or starbound.Star::StatSet::resourcePercentage+41

label(code)
label(return)
label(playerbaseptr)
registersymbol(playerbaseptr)
label(astrcmp)
label(strings)

newmem:
push rcx
push rdx
push rax
mov rcx,rsi // ResourceName
mov rdx,strings // Health String
call long astrcmp
test al,al
je short @f

lea rcx,[rdi-20]
mov rdx,strings
call long astrcmp
test al,al
je short code
mov [playerbaseptr],rdi
jmp long code

@@:
mov rdx,strings+7 // Energy String
call long astrcmp
test al,al
je short @f

cmp [rsp+140],starbound.Star::Player::energyPercentage+48
jne short code
mov [playerbaseptr+8],rdi
jmp short code

@@:
mov rdx,strings+E // Food String
call short astrcmp
test al,al
je short code

mov [playerbaseptr+10],rdi

code:
  pop rax
  pop rdx
  pop rcx
  movss xmm0,[rdi+54]
  jmp return

astrcmp:
push rsi
push rdi
mov rsi,rcx
mov rdi,rdx
dec rdi
@@:
xor rax,rax
lodsb
test al,al
je short @f
  inc rdi
  cmp [rdi],al
  je short @b
  pop rdi
  pop rsi
  xor al,al
  ret

@@:
pop rdi
pop rsi
or al,1
ret

strings:
db 'health',0
db 'energy',0
db 'food',0

playerbaseptr:
dq 0

playerhsh:
  jmp newmem
return:
registersymbol(playerhsh)

[DISABLE]

playerhsh:
  db F3 0F 10 47 54

unregistersymbol(playerhsh)
dealloc(newmem)
unregistersymbol(playerbaseptr)"""

