[[cheat]]
id = "get-player"
name = "Get Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(HealthAccess,MK12.exe,F3 00 22 41 2C F3 0F 5E 81 C8 00 00 00 C3)
alloc(newmem,$1000)
label(code return Player)

newmem:
cmp dword ptr [rcx+0FFC],#0
jne code
mov [Player],rcx


code:
  movss xmm0,[rcx+2C]
  divss xmm0,[rcx+000000C8]
  ret 
  jmp return

Player:
dq 0


HealthAccess:
  jmp far newmem
return:
registersymbol(HealthAccess Player)

[DISABLE]

HealthAccess:
  db F3 0F 10 41 2C F3 0F 5E 81 C8 00 00 00 C3

unregistersymbol(*)
dealloc(*)"""
