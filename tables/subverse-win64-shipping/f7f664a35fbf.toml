[[cheat]]
id = "get-player-ship-works-during-space-combat"
name = "Get Player Ship (Works during space combat)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(get_playerShip,Subverse-Win64-Shipping.exe,48 8B 06 FF 90 00 07 00 00)
alloc(newmem,$1000,get_playerShip)
label(code)
label(return)
alloc(playerShip,8)
registersymbol(playerShip)

newmem:
  mov [playerShip],rsi
code:
  mov rax,[rsi]
  call qword ptr [rax+00000700]
  jmp return

get_playerShip:
  jmp newmem
  nop 4
return:
registersymbol(get_playerShip)

[DISABLE]
get_playerShip:
  db 48 8B 06 FF 90 00 07 00 00

unregistersymbol(get_playerShip)
dealloc(newmem)"""

