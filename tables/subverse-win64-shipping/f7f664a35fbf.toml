source = """
[ENABLE]
aobscanmodule(get_infiniteMovement,Subverse-Win64-Shipping.exe,F6 D2 20 91 E8 09 00 00)
alloc(newmem,$1000,get_infiniteMovement)
label(code)
label(return)
alloc(infiniteMovement,8)
registersymbol(infiniteMovement)

newmem:
  ret
code:
