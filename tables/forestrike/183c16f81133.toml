[[cheat]]
id = "currency-instance-ctrl-numpad-2-activate-during-fights-will-populate-when-successfully-beating-an-enemy"
name = "Currency Instance (Ctrl + Numpad 2) {Activate during fights. Will populate when successfully beating an enemy}"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Forestrike.exe
// Author            : ndck76
// Executable Version: 2022.3.62.62237
// Game Version      : v1.0-2318
// Script Date       : 2025-11-19


[ENABLE]

aobscanmodule(currency,GameAssembly.dll,8Bxxxx488Bxxxxxxxxxx488Dxxxxxx33xx89) //Forestrike.UISystem.CurrencyDisplayUI.ResetAmountPreview
alloc(newmem,$1000,currency)
alloc(data3,8)
alloc(currencybkp,10)
registersymbol(data3)
registersymbol(currency)
registersymbol(currencybkp)
label(code)
label(return)

currencybkp:
  readmem(currency,10)

newmem:
  mov [data3],rax

code:
  readmem(currency,10)
  jmp return

currency:
  jmp newmem
  nop 5
return:

[DISABLE]

currency:
  readmem(currencybkp,10)

unregistersymbol(*)
dealloc(*)"""

