[[cheat]]
id = "5-heart-use-after-1-hit"
name = "5 Heart [Use After 1 Hit]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

label(what1)
registersymbol(what1)

aobscan(aob1,89 86 4c 01 00 00 8B 86 D0 00 00 00)

newmem:

originalcode:
mov [esi+0000014c],(int)50

exit:
jmp returnhere

aob1:
what1:
jmp newmem
nop
returnhere:

[DISABLE]
dealloc(newmem)
what1:
db 89 86 4c 01 00 00 8B 86 D0 00 00 00
unregistersymbol(what1)"""

