name = "Not Lose Heart [Use After 1 Hit]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[Enable]
aobscan(nlh_aob1,89 86 4C 01 00 00 8B 86 D0 00 00 00)
registersymbol(nlh_aob1)

nlh_aob1:
db 90 90 90 90 90 90

[Disable]

