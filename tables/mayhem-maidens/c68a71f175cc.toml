[[cheat]]
id = "infinite-crystal-health"
name = "Infinite Crystal Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

//Send@FearlessRevolution|Sintrix
aobscanmodule(CrystalHealthAOB,GameAssembly.dll,F3 0F 10 B1 C4 00 00 00 48 85)
alloc(newmem,$1000,CrystalHealthAOB)

label(code)
label(return)

newmem:

code:
  mov [rcx+C4],(float)9999
  movss xmm6,[rcx+000000C4]
  jmp return

CrystalHealthAOB:
  jmp newmem
  nop 3
return:
registersymbol(CrystalHealthAOB)
//Send@FearlessRevolution|Sintrix
[DISABLE]

CrystalHealthAOB:
  db F3 0F 10 B1 C4 00 00 00
//Scenes.TowerDefense.Entity.Crystal.get_HPRatio
unregistersymbol(*)
dealloc(*)"""

