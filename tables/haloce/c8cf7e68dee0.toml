[[cheat]]
id = "readme"
name = "README"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{This will quicly explain how some parts of the table works, feel free to delete
or move this readme as it will not effect the game.



GENERAL INFORMATION:

If you click on the "values" script and you get a bunch of ??, unpause the game
for a second and it will show the correct values.

"Unstoppable" will enable all scripts and "EXTREME GAMEPLAY" will... be a
surprise. Here's a hint, EXTREME GAMEPLAY will not work if "Health Manipulation"
is enabled.



MULTIPLAYER:

NOTE. I am unsure if the multiplayer scripts will work or not, I did the best I
could only by visiting other servers and using single player lan.

ALSO NOTE. The multiplayer scripts WILL NOT WORK unless you are the host, the
most you could do is view your values and make your hud completely useless.

I wasn't able to get all the multiplayer scripts to only effect the host, but I
was able to get the really important ones. I marked these scripts accordingly.

The multiplayer scripts should be able to work in single player, but I had it
fail in one of my maps so I am unsure if it will work in every other map. The
single player script worked in all of my maps, but they won't work in
multiplayer.



FOR SCRIPT MAKERS:

Most of the scripts rely on my two filters, one for single player and one for
multiplayer. If you want the multiplayer scripts to work for everyone, then just
delete the filters. If you want to use them in some of your own scripts then I
will past them down below.
If one doesn't work then you may have to disect the data structure and compare
these values.

    cmp [esi+C0],EC700000
  jne code                //single player
    cmp [esi+B8],FFFF0001
    jne code


  cmp [esi+DC],(float)75
  je @f
  cmp [esi+DC],(float)40
  jne code
  @@:                      //multiplayer
    cmp [esi+bC],00000000
  jne code
    cmp [esi+110],00000000
  jne code
    cmp [esi+218],EC700000
  jne code

The only real differences between Halo Combat Evolved and Halo Custom Edition
are the names and the jumps. If you plan to make scripts for them then be sure
to edit accordingly.

Enjoy}

[ENABLE]
[DISABLE]"""

