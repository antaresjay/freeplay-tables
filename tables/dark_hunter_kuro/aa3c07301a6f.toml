 jne @f
 mov [dragonorb],eax
 @@:

pcrystal:
 cmp dword ptr [eax+18],7e4
 jne @f
 mov [crystal],eax
 @@:

ohko:
 cmp dword ptr [eohko],0
 je @f
 cmp dword ptr [eax+18],2
 jne @f
 cmp esi,2
 je @f
 mov [eax+28],0
 mov [eax+2c],1
@@:

