id = "script-author-name-modifier"
name = "Script Author Name Modifier"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(AuthorName_AoB,$process,8A 04 ?? 49 FF ?? 88 02 48 83 C2)
alloc(AuthorName_Newmem,$100,AuthorName_AoB)
alloc(AuthorName_BackupBytes,6,AuthorName_AoB)

label(AuthorName_Return)
label(AuthorName_OriginalCode)

AuthorName_BackupBytes:
  readmem(AuthorName_AoB,6)

AuthorName_Newmem:
//;Compare against default Author Name (in this case it's "Ryo Asuka"):
  cmp [rcx+rdx],'Ryo ' //;4 Characters / 4 Bytes
  jne AuthorName_OriginalCode
  cmp [rcx+rdx+4],'Asuk' //;4 Characters / 4 Bytes
  jne AuthorName_OriginalCode
  cmp byte ptr [rcx+rdx+8],'a' //;1 Character / 1 Byte
  jne AuthorName_OriginalCode
//;Set String to:
  mov [rcx+rdx],'Akir' //;4 Characters / 4 Bytes
  mov [rcx+rdx+4],'a Fu' //;4 Characters / 4 Bytes
  mov word ptr [rcx+rdx+8],'do' //;2 Characters / 2 Bytes
//;Set String Length:
  mov dword ptr [rcx+rdx-8],A //;String length is 10 (A in hex decimal)

AuthorName_OriginalCode:
  readmem(AuthorName_AoB,6)
  {
  mov al,[rcx+rdx]
  dec r8
  }
  jmp AuthorName_Return

AuthorName_AoB:
  jmp AuthorName_Newmem
  nop
AuthorName_Return:
registersymbol(AuthorName_AoB)
registersymbol(AuthorName_BackupBytes)

[DISABLE]

AuthorName_AoB:
  readmem(AuthorName_BackupBytes,6)

unregistersymbol(AuthorName_AoB)
unregistersymbol(AuthorName_BackupBytes)
dealloc(AuthorName_Newmem)
dealloc(AuthorName_BackupBytes)"""

