00A4 = pSoldier6
00A8 = pSoldier7
00Ac = pSoldier8
00B0 = pSoldier9
00d5 = bcSoldiers
00d6 = bmSoldiers
01b4 = pFocusedEnemy

struct AMMO:
0000 = 00813768
003c = pVehicle/Troop
0064 = pVehicle/Troop
