[ENABLE]

aobscanmodule(coord_injcopy,glh2.exe,8B 96 AC 00 00 00 5D) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(ycoord)
registersymbol(ycoord)

newmem:
mov [ycoord],esi

code:
  mov edx,[esi+000000AC]
  jmp return

  ycoord:
  dq 0

coord_injcopy:
  jmp newmem
  nop
return:
registersymbol(coord_injcopy)

[DISABLE]

coord_injcopy:
  db 8B 96 AC 00 00 00

unregistersymbol(coord_injcopy)
unregistersymbol(ycoord)
dealloc(newmem)

