[[cheat]]
id = "establish-player-ship"
name = "Establish Player Ship"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(FindShip,83 3E 00 48 8B 4E 18) // should be unique
alloc(newmem,$1000,044F2CCC)
globalalloc(myShip,8)
label(code)
label(return)
label(NotMe)

newmem:

code:
  push rax
{  mov rax, [rsi+20]
  test rax,rax
  jne NotMe
  cmp [rax+10], #50
  jg NotMe
  cmp [rsi+38], 0
  je NotMe
  mov rax, [rsi+38]
  test rax,rax
  jne NotMe
  cmp [rax+10], #50
  jg NotMe
  cmp [rsi+90], 0
  je NotMe
  cmp [rsi+90], #10000000
  jg NotMe
  mov [myShip], rsi}
  cmp [rsi+F4], (float)100
  jl NotMe
  mov [myShip], rsi
NotMe:
  pop rax
  cmp dword ptr [rsi],00
  mov rcx,[rsi+18]
  jmp return

FindShip:
  jmp code
  nop
  nop
return:
registersymbol(FindShip)

[DISABLE]

FindShip:
  db 83 3E 00 48 8B 4E 18

//myShip:
//  dd 00000000

unregistersymbol(FindShip)
dealloc(newmem)"""

