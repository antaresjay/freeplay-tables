[[cheat]]
id = "game-manager-ctrl-numpad-1-will-populate-when-timer-starts"
name = "Game Manager (Ctrl + Numpad 1) {Will populate when timer starts}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Yasuke Simulator.exe
// Author            : ndck76
// Executable Version: 2022.3.59.1816
// Game Version      : Build.17806657
// Script Date       : 2025-03-22


[ENABLE]

aobscanregion(time,TimeDisplay:Update,TimeDisplay:Update+100,F30F10xxxxF3xxxxxxF2xxxxxxF3xxxxxxxx48xxxxxx48xxxxxxF3xxxxxxxxF3xxxxxx48xxxx) //TimeDisplay:Update+1c
alloc(newmem,$1000,time)
alloc(data2,8)
alloc(timebkp,5)
registersymbol(data2)
registersymbol(time)
registersymbol(timebkp)
label(code)
label(return)

timebkp:
  readmem(time,5)

newmem:
  mov [data2],rax

code:
  readmem(time,5)
  jmp return

time:
  jmp newmem
return:

[DISABLE]

time:
  readmem(timebkp,5)

unregistersymbol(*)
dealloc(*)"""

