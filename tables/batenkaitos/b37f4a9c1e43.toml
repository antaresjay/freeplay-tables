[[cheat]]
id = "modify-atk-def"
name = "modify atk/def"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Batenkaitos.exe
  Version: 
  Date   : 2024-07-04
  Author : Alfon Regiantoro

  This script does blah blah blah rbx
}

[ENABLE]

aobscanmodule(modif_at,GameAssembly.dll,F3 0F 59 71 14 F3) // should be unique
alloc(newmem,$200,modif_at)
alloc(mod_atk,8)
alloc(mod_def,8)
registersymbol(mod_atk)
registersymbol(mod_def)
label(code)
label(code1)
label(code2)
label(return)

mod_atk:
  dd 00 00 00 00

mod_def:
  dd 00 00 00 00

newmem:
  cmp [mod_atk],0
  jg code1
  cmp [mod_def],0
  jg code2
code:
  mulss xmm6,[rcx+14]
  jmp return
code1:
  push rbx
  mov rbx,[mod_atk]
  mov [rcx+04],rbx
  pop rbx
  jmp code
code2:
  push rbx
  mov rbx,[mod_def]
  mov [rcx+0C],rbx
  pop rbx
  jmp code
modif_at:
  jmp newmem
return:
registersymbol(modif_at)

