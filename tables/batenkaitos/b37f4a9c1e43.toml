[[cheat]]
id = "inf-hp-in-battle"
name = "inf hp in battle"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Batenkaitos.exe
  Version: 
  Date   : 2024-07-01
  Author : Alfon Regiantoro

  This script does blah blah blah cmp rcx+10=0/ rcx+48=0 is enemy,rcx+18=maxhp
}

[ENABLE]

aobscanmodule(bhpdmg,GameAssembly.dll,89 41 14 48 8B 87 10 01 00 00) // should be unique
alloc(newmem,$100,bhpdmg)

label(code)
label(return)

newmem:
  cmp [rcx+10],#0
  je code
  cmp [rcx+48],#0
  je code
  mov [rcx+32],#0
  mov eax,[rcx+18]
code:
  mov [rcx+14],eax
  mov rax,[rdi+00000110]
  jmp return

bhpdmg:
  jmp newmem
  nop 5
return:
registersymbol(bhpdmg)

[DISABLE]

bhpdmg:
  db 89 41 14 48 8B 87 10 01 00 00

unregistersymbol(bhpdmg)
dealloc(newmem)

