source = """
[ENABLE]

aobscanmodule(leviackerman,GameAssembly.dll,66 0F 6E 88 8C 00 00 00 45 33 C0 0F 5B C9 48 8B CB F3 0F 5E 0D * * * * 48 8B 5C)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov [rax+88], #90

code:
  movd xmm1,[rax+0000008C]
  xor r8d,r8d
  cvtdq2ps xmm1,xmm1
  jmp return

leviackerman:
  jmp far newmem
return:
registersymbol(leviackerman)

[DISABLE]

leviackerman:
  db 66 0F 6E 88 8C 00 00 00 45 33 C0 0F 5B C9

unregistersymbol(leviackerman)
dealloc(newmem)"""
