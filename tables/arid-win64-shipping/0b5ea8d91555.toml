[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
//Send
[ENABLE]

aobscanmodule(health,Arid-Win64-Shipping.exe,48 8B 07 41 0F 28 CC 48 8B CF FF 90 90)
alloc(newmem,$1000,health)

label(code)
label(return)

newmem:
push rdi
mov rbp,[rdi+0250] //Pawn
test rbp,rbp
je @f
mov rbp,[rbp+0558] //Condition
mov rbp,[rbp+00C0] // Attributes
mov rbp,[rbp+0000] // Health
movss xmm8,[newhealth]
movss [rbp+0060],xmm8
movss [rbp+0068],xmm8

@@:
pop rbp


code:
  mov rax,[rdi]
  movaps xmm1,xmm12
  jmp return

newhealth:
dd (float)1000

health:
  jmp newmem
  nop 2
return:
registersymbol(health)

[DISABLE]

health:
  db 48 8B 07 41 0F 28 CC

unregistersymbol(*)
dealloc(*)"""

