[[cheat]]
id = "if-kabbu-got-hit-then-activate-2"
name = "[if Kabbu Got Hit Then Activate]"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(Health,89 07 0F B6 85 DA E1 FF FF 85)
registersymbol(Health)
alloc(newmem,$1000)
label(originalcode)
label(return)

label(HealthFlag1)
registersymbol(HealthFlag1)

newmem:
  cmp [edi+3C],#2                //Check if player
  je originalcode                //Skip if true
  mov [edi],eax                  //Set health

  cmp byte ptr [HealthFlag1],1 //Check if ohk enabled
  jne originalcode               //Skip if not enabled
  mov [edi],#0                   //Set health to zero

originalcode:
  movzx eax,byte ptr [ebp-00001E26]
  jmp return

Health:
  jmp newmem
  nop 4
return:

HealthFlag1: //Standard/Starting value
  db 0         //0 = Infinite Health, 1 = Infinite Health & One Hit Kill

[DISABLE]

Health:
  db 89 07 0F B6 85 DA E1 FF FF

unregistersymbol(Health)
unregistersymbol(HealthFlag1)
dealloc(newmem)
dealloc(HealthFlag1)"""

