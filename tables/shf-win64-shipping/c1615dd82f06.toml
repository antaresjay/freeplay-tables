[[cheat]]
id = "hina-character-ctrl-numpad-1"
name = "Hina Character (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : SHf-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.4.2.0
// Game Version      : v1.1.378720
// Script Date       : 2025-09-23


[ENABLE]

aobscanmodule(master,SHf-Win64-Shipping.exe,488Bxx488BxxxxxxxxxxE8xxxxxxxxF3xxxxxxxxxxxxxxF3xxxxxxxxxxxxxx488B) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,10)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,10)

newmem:
  mov [data],rcx

code:
  readmem(master,10)
  jmp return

master:
  jmp newmem
  nop 5
return:

[DISABLE]

master:
  readmem(masterbkp,10)

unregistersymbol(*)
dealloc(*)"""

