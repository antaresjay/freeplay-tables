[[cheat]]
id = "enable-hero-modifiers"
name = "Enable Hero Modifiers"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@Sintrix/FearlessRevolution
define(address,Health:GetHealthRatio+9)
define(bytes,D9 40 38 D9 40 34)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000)
registersymbol(herohp)
registersymbol(aihp)
label(code return onehit herohp aihp)

newmem:
cmp [herohp],1
jne onehit
cmp [edi+C4],1
jne @f
mov [eax+38],(float)100
jmp return

onehit:
cmp [aihp],1
jne code
cmp [edi+C4],0
jne code
mov [eax+38],(float)1
jmp code

code:
  fld dword ptr [eax+38]
  fld dword ptr [eax+34]
  jmp return

herohp:
dd 0

aihp:
dd 0

address:
  jmp newmem
  nop
return:

[DISABLE]

address:
  db bytes

unregistersymbol(*)
dealloc(*)

//Health:GetHealthRatio+9: D9 40 38        - fld dword ptr [eax+38]"""

