// MetaCaravanController:UpdateEconomy+a1
//04D2C301 - D9 40 0C              - fld dword ptr [eax+0C]
//04D2C304 - D9 5D A4              - fstp dword ptr [ebp-5C]
//04D2C307 - D9 45 A4              - fld dword ptr [ebp-5C]
