[[cheat]]
id = "avatar-base-address-scan-initialization-activate-this-first"
name = "Avatar Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Avatar_basepointer)
registersymbol(Avatar_update_enable)
registersymbol(Avatar_set_enable)
registersymbol(Avatar_actionpointsset_enable)
registersymbol(Avatar_ammoset_enable)
registersymbol(Avatar_hpset_enable)

alloc(Avatar_basepointer, 4)
alloc(Avatar_update_enable, 4)
alloc(Avatar_set_enable, 4)
alloc(Avatar_actionpointsset_enable, 4)
alloc(Avatar_ammoset_enable, 4)
alloc(Avatar_hpset_enable, 4)


[DISABLE]
unregistersymbol(Avatar_basepointer)
unregistersymbol(Avatar_update_enable)
unregistersymbol(Avatar_set_enable)
unregistersymbol(Avatar_actionpointsset_enable)
unregistersymbol(Avatar_ammoset_enable)
unregistersymbol(Avatar_hpset_enable)

dealloc(Avatar_basepointer)
dealloc(Avatar_update_enable)
dealloc(Avatar_set_enable)
dealloc(Avatar_actionpointsset_enable)
dealloc(Avatar_ammoset_enable)
dealloc(Avatar_hpset_enable)"""

[[cheat]]
id = "avatar-base-address-scan-to-activate-battle-to-update-battle"
name = "Avatar Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Avatar_savedAOB)
label(Avatar_returnhere)
label(Avatar_originalcode)
label(Avatar_exit)

label(Avatar_update_exit)
label(Avatar_set_exit)
label(Avatar_actionpointsset_exit)
label(Avatar_ammoset_exit)
label(Avatar_hpset_exit)

registersymbol(Avatar_savedAOB)

//35D7267A - 8B C8                 - mov ecx,eax
//35D7267C - 39 09                 - cmp [ecx],ecx
// InteractionStateAvatarTargetPlace:OldMovement+5ee
//35D7267E - 8B 40 30              - mov eax,[eax+30]
//35D72681 - 8B C8                 - mov ecx,eax
//35D72683 - 39 09                 - cmp [ecx],ecx
//35D72685 - 8B 40 0C              - mov eax,[eax+0C]
//35D72688 - 8B 4F 4C              - mov ecx,[edi+4C]
//35D7268B - 2B C1                 - sub eax,ecx
//35D7268D - 89 85 20FFFFFF        - mov [ebp-000000E0],eax
aobscan(Avatar_searchedAOB, 0F B6 80 05 01 00 00 85 C0 * * 0F B6 45 10)

alloc(Avatar_newmem, 2048)
alloc(Avatar_temp1, 4)
alloc(Avatar_temp2, 4)


Avatar_newmem:
mov [Avatar_temp1], ebx
mov [Avatar_temp2], edx

// Check Team
cmp dword ptr [eax+ec], #0
jne Avatar_hpset_exit

cmp dword ptr [Avatar_update_enable], #0
je Avatar_update_exit
mov [Avatar_basepointer], eax
Avatar_update_exit:

cmp dword ptr [Avatar_set_enable], #0
je Avatar_set_exit
Avatar_set_exit:

cmp dword ptr [Avatar_actionpointsset_enable], #0
je Avatar_actionpointsset_exit
cmp dword ptr [eax+30], #0
je Avatar_actionpointsset_exit
mov ebx, [eax+30]
mov edx, [ebx+14]
mov [ebx+c], edx
Avatar_actionpointsset_exit:

cmp dword ptr [Avatar_ammoset_enable], #0
je Avatar_ammoset_exit
cmp dword ptr [eax+54], #0
je Avatar_ammoset_exit
mov ebx, [eax+54]
// If Clipsize is 1 or less, don't change
cmp edx, #1
jle Avatar_ammoset_exit
mov edx, [ebx+24]
cmp dword ptr [ebx+8], #0
je Avatar_ammoset_exit
mov ebx, [ebx+8]
cmp dword ptr [ebx+3c], #0
je Avatar_ammoset_exit
mov ebx, [ebx+3c]
mov [ebx+c], edx
Avatar_ammoset_exit:

cmp dword ptr [Avatar_hpset_enable], #0
je Avatar_hpset_exit
cmp dword ptr [eax+34], #0
je Avatar_hpset_exit
mov ebx, [eax+34]
cmp dword ptr [ebx+8], #0
je Avatar_hpset_exit
mov ebx, [ebx+8]
cmp dword ptr [ebx+14], #0
je Avatar_hpset_exit
mov ebx, [ebx+14]
cmp dword ptr [ebx+24], #0
je Avatar_hpset_exit
mov edx, [ebx+24]
fld [edx+14]
mov edx, [ebx+28]
fstp [edx+14]
Avatar_hpset_exit:

mov ebx, [Avatar_temp1]
mov edx, [Avatar_temp2]


Avatar_originalcode:
db 0F B6 80 05 01 00 00
//movzx eax,byte ptr [eax+00000105]


Avatar_exit:
jmp Avatar_returnhere


Avatar_searchedAOB:
Avatar_savedAOB:
jmp Avatar_newmem
nop
nop
Avatar_returnhere:


[DISABLE]
Avatar_savedAOB:
db 0F B6 80 05 01 00 00
//movzx eax,byte ptr [eax+00000105]

unregistersymbol(Avatar_savedAOB)

dealloc(Avatar_newmem)
dealloc(Avatar_temp1)
dealloc(Avatar_temp2)"""

