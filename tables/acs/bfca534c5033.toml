[[cheat]]
id = "player"
name = "Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(health,ACS.exe,F6 83 04 02 00 00 01 8B)
alloc(newmem,$1000,"ACS.exe"+FFF3A2)

registersymbol(health)

label(healthcode)
registersymbol(healthcode)

label(code)

label(healthflag)
registersymbol(healthflag)


newmem:
healthcode:
code:
  cmp dword ptr [healthflag], 1
  jne @F
  mov [rbx+000000E0], #999999

@@:
  test byte ptr [rbx+00000204], 1
  jmp health+7

healthflag:
dd 0



[DISABLE]

unregistersymbol(health)
unregistersymbol(healthcode)
dealloc(newmem)"""

