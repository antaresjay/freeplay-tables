id = "character-try-to-run"
name = "Character - try to run"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[Enable]
alloc(newmem,100)
label(returnhere)
label(exit)
label(STA)
registersymbol(STA)
aobscan(aob1, D8 86 B4 01 00 00 83 EC 04 D9 1C 24)
