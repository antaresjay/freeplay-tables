[[cheat]]
id = "no-recoil"
name = "No Recoil"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]



aobscanmodule(recoil_aob,Back4Blood.exe,F3 0F 11 87 60 04 00 00 E8) // should be unique
alloc(newmem,$1000,"Back4Blood.exe"+186AECE)

label(code)
label(return)

newmem:
xorps xmm0,xmm0
code:
  movss [rdi+00000460],xmm0
  movss [rdi+0000045c],xmm0
  jmp return

recoil_aob:
  jmp newmem
  nop 3
return:
registersymbol(recoil_aob)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
recoil_aob:
  db F3 0F 11 87 60 04 00 00

unregistersymbol(recoil_aob)
dealloc(newmem)"""

