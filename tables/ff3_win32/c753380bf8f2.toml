type = "script"
source = """
[ENABLE]


aobscanmodule(attk,FF3_Win32.exe,89 4A 58 8D 4B 06)
alloc(newmem,$1000)
label(code)
label(return)

newmem:

code:
  mov [edx+58],#9999
  lea ecx,[ebx+06]
  jmp return

attk:
jmp newmem
nop

return:

registersymbol(attk)

[DISABLE]

attk:
