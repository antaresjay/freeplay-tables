[[cheat]]
id = "disable-enemy-attacks"
name = "Disable Enemy Attacks"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
//Send@FearlessRevolution|Sintrix
[ENABLE]

aobscanmodule(disableEnemy,GameAssembly.dll,48 8B D9 75 13 48 8D 0D * * * * E8 22 AE 38)
alloc(newmem,$1000,disableEnemy)

label(code)
label(return)

newmem:
push rcx
mov rcx,[rcx+20]
mov [rcx+CC],(float)9999
pop rcx

code:
  mov rbx,rcx
  jne GameAssembly.dll+F100F5
  jmp return

disableEnemy:
  jmp newmem
return:
registersymbol(disableEnemy)

[DISABLE]

disableEnemy:
  db 48 8B D9 75 13

unregistersymbol(*)
dealloc(*)"""

