[[cheat]]
id = "master-script"
name = "Master Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Table by besthsq
// Table version: 1.1
// Game version: 5.7.2970167 & 5.8.2990569
// Changes v1.1:
// - Removed melee pierce attack/armor editing fields because their functions
//   are redundant and can mess things up if not used correctly.
// - Reorganized fields

//define(PBASE,"AoK HD.exe"+3431C5) // 8B 0C F2 51 8B C4 89 38 8B 01
//define(HP,"AoK HD.exe"+31DB68) // F3 0F 2C 50 34 0F BF 41 2A 85 D2

// =======================
[ENABLE]
AOBScanModule(PBASE,"AoK HD.exe",8B 0C F2 51 8B C4 89 38 8B 01)
AOBScanModule(HP,"AoK HD.exe",F3 0F 2C 50 34 0F BF 41 2A 85 D2)

alloc(MyCodeBlock,4096,$process)

registersymbol(PBASE)
registersymbol(HP)

label(_PBASECode)
label(_PBASERet)
label(_HPCode)
label(_HPRet)

// pointers to expose
label(pPlayerBase)
label(iResEditorPlayerOffset)
label(pUnitSelected)
label(pUnitType)

registersymbol(pPlayerBase)
registersymbol(iResEditorPlayerOffset)
registersymbol(pUnitSelected)
registersymbol(pUnitType)


// =======================
// Implementation
MyCodeBlock:

// On checking all players for score
_PBASECode:
 mov ecx,[edx+esi*8]   // original code
 push ecx
 mov eax,esp
 mov [pPlayerBase],edx     // expose base pointer to list of all player pointers
 jmp _PBASERet

// On viewing unit HP
_HPCode:
 cvttss2si edx,[eax+34]    // original code
 mov [pUnitSelected],eax   // expose selected unit pointer
 mov [pUnitType],ecx       // expose selected unit type pointer
 jmp _HPRet


// ============================
// Variables
pPlayerBase:
 dd 0
iResEditorPlayerOffset:
 dd 8
pUnitSelected:
 dd 0
pUnitType:
 dd 0

// Hack Points
PBASE:
jmp _PBASECode
nop
_PBASERet:

HP:
jmp _HPCode
_HPRet:

// =============================
[DISABLE]

PBASE:
 mov ecx,[edx+esi*8]
 push ecx
 mov eax,esp
/*
AoK HD.exe+3431C5 - 8B 0C F2              - mov ecx,[edx+esi*8]
AoK HD.exe+3431C8 - 51                    - push ecx
AoK HD.exe+3431C9 - 8B C4                 - mov eax,esp
AoK HD.exe+3431CB - 89 38                 - mov [eax],edi
AoK HD.exe+3431CD - 8B 01                 - mov eax,[ecx]
*/

HP:
cvttss2si edx,[eax+34]
/*
AoK HD.exe+31DB68 - F3 0F2C 50 34         - cvttss2si edx,[eax+34]
AoK HD.exe+31DB6D - 0FBF 41 2A            - movsx eax,word ptr [ecx+2A]
AoK HD.exe+31DB71 - 85 D2                 - test edx,edx
*/


unregistersymbol(pPlayerBase)
unregistersymbol(iResEditorPlayerOffset)
unregistersymbol(pUnitSelected)
unregistersymbol(pUnitType)

unregistersymbol(PBASE)
unregistersymbol(HP)


dealloc(MyCodeBlock)"""

