[[cheat]]
id = "full-health"
name = "full health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanmodule(someWriteAOB,Wuppo.exe,DD 1B 5D 5B ** ** ** E9) //DD 1B 5D 5B 59 C3)
registersymbol(someWriteAOB)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
pushfd //
cmp [pPlayerHealth],ebx
jne originalcode
fstp st(0)
fld qword ptr [ebx+10]
fst qword ptr [eax]

originalcode:
popfd //
fstp qword ptr [ebx]
pop ebp
pop ebx
add esp,04

exit:
jmp returnhere

///

someWriteAOB: //"Wuppo.exe"+12900F:
jmp newmem
nop
nop
returnhere:

bFullHealth:
db 1




[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
someWriteAOB: //"Wuppo.exe"+12900F:
db DD 1B 5D 5B 83 C4 04
//Alt: fstp qword ptr [ebx]
//Alt: pop ebp
//Alt: pop ebx
//Alt: add esp,04

bFullHealth:
db 0"""

