[[cheat]]
id = "enable"
name = "enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanmodule(healthReadRet1AOB,Wuppo.exe,53 55 57 56 E8 ** ** ** ** 83 C4 10)
label(pHealthReadRet1)
registersymbol(pHealthReadRet1)

healthReadRet1AOB+9:
pHealthReadRet1:

aobscanmodule(healthReadRet2AOB,Wuppo.exe,53 E8 ** ** ** ** 83 C4 08 ** ** ** ** ** ** ** ** ** ** ** ** ** ** 59 5F 5E 5D 5B 8B 8C 24 ** ** ** ** 33 CC E8 ** ** ** ** 81 C4)
label(pHealthReadRet2)
registersymbol(pHealthReadRet2)

healthReadRet2AOB+2A:
pHealthReadRet2:

aobscanmodule(someReadAOB,Wuppo.exe,DD 07 3B F9 5F DD 1E)
registersymbol(someReadAOB)

label(bFullHealth)
registersymbol(bFullHealth)
label(pPlayer)
registersymbol(pPlayer)
label(pPlayerHealth)
registersymbol(pPlayerHealth)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
cmp dword ptr [esp+24],pHealthReadRet1 //"Wuppo.exe"+11B85C
jne originalcode
cmp dword ptr [edi+14],0
je originalcode
cmp dword ptr [esp+4c],pHealthReadRet2 //"Wuppo.exe"+11B9C4
jne originalcode
//cmp dword ptr [edi+74],0     //
//je originalcode              //

/*
test ebx,ebx
jz originalcode
mov ebp,[ebx+4]
test ebx,ebx
jz originalcode
*/

/*
fld qword ptr [edi]
cmp edi,ecx
pop edi
jmp exit
*/
mov [pPlayer],ebx
mov [pPlayerHealth],edi
cmp byte ptr [bFullHealth],1
jne originalcode
fld qword ptr [edi+10]
fstp qword ptr [edi]

originalcode:
fld qword ptr [edi]
cmp edi,ecx
pop edi

exit:
jmp returnhere

///
bFullHealth:
dd 0
pPlayer:
dd 0
pPlayerHealth:
dd 0
///

someReadAOB: //"Wuppo.exe"+1098F1:
jmp newmem
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
someReadAOB: //"Wuppo.exe"+1098F1:
db DD 07 3B F9 5F
//Alt: fld qword ptr [edi]
//Alt: cmp edi,ecx
//Alt: pop edi

unregistersymbol(bFullHealth)
unregistersymbol(pPlayer)
unregistersymbol(pPlayerHealth)"""

