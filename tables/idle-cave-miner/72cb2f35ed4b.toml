[[cheat]]
id = "instant-complete-quests"
name = "Instant Complete Quests"
category = "game"
description = ""
hint = ""
type = "script"
source = """
//Send@Sintrix
//Quest.IsComplete

define(address,GameAssembly.dll+3266CC)
define(bytes,F2 0F 10 70 18)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,GameAssembly.dll+3266CC)

label(code)
label(return)

newmem:

code:
  movsd xmm6,[rax+18]
  xorps xmm6,xmm6
  jmp return

address:
  jmp newmem
return:

[DISABLE]

address:
  db bytes

dealloc(*)"""

