[[cheat]]
id = "jk-scene-ctrl-numpad-1"
name = "JK Scene (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : GixJK.exe
// Author            : ndck76
// Executable Version: 2022.3.62.30479
// Game Version      : v0.50.05 (Early Access)
// Script Date       : 2025-12-21


[ENABLE]

aobscanmodule(playlog,GameAssembly.dll,41FFxxxxxxxxxx488Bxxxxxxxxxx498Bxxxxxxxxxx4889) //JK.Scenes.JKScene.FixedUpdate
alloc(newmem,$1000,playlog)
alloc(data,8)
alloc(playlogbkp,7)
registersymbol(data)
registersymbol(playlog)
registersymbol(playlogbkp)
label(code)
label(return)

playlogbkp:
  readmem(playlog,7)

newmem:
  mov [data],r14

code:
  readmem(playlog,7)
  jmp return

playlog:
  jmp newmem
  nop 2
return:

[DISABLE]

playlog:
  readmem(playlogbkp,7)

unregistersymbol(*)
dealloc(*)"""

