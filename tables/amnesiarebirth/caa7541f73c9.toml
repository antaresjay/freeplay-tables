[[cheat]]
id = "get-item-quantity"
name = "Get Item Quantity"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{
\tGame\t: AmnesiaRebirth.exe
\tVersion\t: 
\tDate\t: 2021-01-17
\tAuthor\t: aSwedishMagyar
}
[ENABLE]
aobscanmodule(getInventory,AmnesiaRebirth.exe,48 8b 54 dd 08 48 85 d2 74 ? 48 8b 06)
registersymbol(getInventory)
registersymbol(baseInventory)
registersymbol(numAddress)
alloc(newgetInventory,1000,getInventory)
label(codegetInventory)
label(returngetInventory)
label(baseInventory)
label(startCheck)
label(loadAddress)
label(numAddress)
newgetInventory:
  push rax
  push rcx
  xor rcx,rcx
startCheck:
  cmp [rdi+C],0
  jne codegetInventory
  test r12,r12
  jne codegetInventory
  cmp [numAddress],64
  jae codegetInventory
  mov rax,baseInventory
@@:
  cmp rbp,[rax+rcx*8]
  je  codegetInventory
  cmp [rax+rcx*8],0
  je  loadAddress
  cmp rcx,[numAddress]
  jae codegetInventory
  inc rcx
  jmp @b
loadAddress:
  mov [rax+rcx*8],rbp
  inc [numAddress]
codegetInventory:
  pop rcx
  pop rax
  mov rdx,[rbp+rbx*8+08]
  jmp returngetInventory
numAddress:
  dd 0
baseInventory:
  dq 0
getInventory:
  jmp newgetInventory
returngetInventory:

[DISABLE]
getInventory:
  db 48 8B 54 DD 08

unregistersymbol(getInventory)
unregistersymbol(baseInventory)
unregistersymbol(numAddress)
dealloc(newgetInventory)

