source = """
// Game Executable   : Hammer Of Pain Main.exe
// Author            : ndck76
// Executable Version: 2022.3.7.27451
// Game Version      : Build.16134883
// Script Date       : 2024-12-20


define(address,CountOfShards:ChangeCount+8f)
define(bytes,49 63 47 58 03 45 D8)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,CountOfShards:ChangeCount+8f)

label(code)
label(return)
label(data2)
registersymbol(data2)

newmem:

code:
  mov [data2],r15
  movsxd  rax,dword ptr [r15+58]
  add eax,[rbp-28]
  jmp return

data2:
  db

address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  db bytes
  // movsxd  rax,dword ptr [r15+58]
  // add eax,[rbp-28]

dealloc(*)
unregistersymbol(*)"""

