[[cheat]]
id = "scripts"
name = "Scripts"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
\tGame\t: DarkDeity.exe
\tVersion\t: 
\tDate\t: July 10, 2021
\tAuthor\t: aSwedishMagyar
}
[ENABLE]
///////////////////////////////////////////////////////////////////////////////////
//Function Points
///////////////////////////////////////////////////////////////////////////////////
alloc(funcSpace,100,$process)
label(bInfiniteHealth)
registersymbol(bInfiniteHealth)
registersymbol(funcSpace)
registersymbol(testFunc)
registersymbol(dealDamage)
registersymbol(calcCrit)
funcSpace:
testFunc:
\tret
dealDamage:
\tret
calcCrit:
\tret
bInfiniteHealth:
\tdb 00
///////////////////////////////////////////////////////////////////////////////////
//Script Checks/Parameters
///////////////////////////////////////////////////////////////////////////////////
registersymbol(dealDamageScript)
registersymbol(calcCritScript)
registersymbol(testScript)

alloc(scriptChecks,100,$process)
label(dealDamageScript)
label(calcCritScript)
label(testScript)

scriptChecks:
dealDamageScript:
dd 0
dd dealDamage
dq (double)1
calcCritScript:
dd 0
dd calcCrit
dq (double)100
testScript:
dd 0
dd testFunc
dq (double)1
///////////////////////////////////////////////////////////////////////////////////
//Script Inject
///////////////////////////////////////////////////////////////////////////////////
registersymbol(origscriptInject)
alloc(newscriptInject,100,scriptInject)
label(codescriptInject)
label(origscriptInject)
label(returnscriptInject)

newscriptInject:
  push eax
  push edx
  xor edx,rdx
  mov eax,scriptChecks
@@:
  cmp ecx,[eax+edx]\t\t//Check which Script has been called
  je @f
  add edx,10
  cmp edx,40
  jg codescriptInject
  jmp @b
@@:
  lea eax,[eax+edx+4]\t//Function Address
  lea edx,[eax+4]\t\t//Parameter Address
  mov eax,[eax]
  test eax,eax\t\t\t//Check if there is a function
  je codescriptInject
  call eax
codescriptInject:
  pop edx
  pop eax
origscriptInject:
  readmem(scriptInject,5)
  jmp returnscriptInject

scriptInject:
  jmp newscriptInject
returnscriptInject:
[DISABLE]
scriptInject:
  readmem(origscriptInject,5)
dealloc(newscriptInject)
unregistersymbol(dealDamageScript)
unregistersymbol(calcCritScript)
unregistersymbol(testScript)
dealloc(scriptChecks)
unregistersymbol(funcSpace)
unregistersymbol(testFunc)
unregistersymbol(calcCrit)
unregistersymbol(dealDamage)
unregistersymbol(bInfiniteHealth)
dealloc(funcSpace)"""

