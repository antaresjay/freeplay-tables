[[cheat]]
id = "pointers"
name = "Pointers"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
\tGame\t: DarkDeity.exe
\tVersion\t: 
\tDate\t: July 10, 2021
\tAuthor\t: aSwedishMagyar
}
[ENABLE]
registersymbol(currentPlayer)
assert(getItems+6,8B 14 B9 85 D2)
alloc(newgetItems,100,getItems)
label(codegetItems)
label(returngetItems)
label(currentPlayer)
label(addStat)
newgetItems:
  mov edx,[ecx+edi*4]
  test edx,edx
  je codegetItems
  cmp [edx+4],9
  je addStat
  cmp [edx+4],3
  jne codegetItems
  mov [currentPlayer+4],edx
  jmp codegetItems
addStat:
  mov [currentPlayer],edx
codegetItems:
  test edx,edx
  jmp returngetItems
currentPlayer:
  dd 0
  dd 0
getItems+6:
  jmp newgetItems
returngetItems:
[DISABLE]
getItems+6:
  db 8B 14 B9 85 D2
unregistersymbol(currentPlayer)
dealloc(newgetItems)"""

