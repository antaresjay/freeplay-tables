type = "script"
source = """
[ENABLE]



aobscanmodule(noreload,Remnant-Win64-Shipping.exe,29 7B 54 48 8B CE)
alloc(newmem,$1000,noreload)

label(code)
label(return)

newmem:

code:
mov rcx,rsi
jmp return

noreload:
jmp newmem
nop
return:
registersymbol(noreload)

[DISABLE]
noreload:
db 29 7B 54 48 8B CE

unregistersymbol(noreload)
dealloc(newmem)"""

