[[cheat]]
id = "first-person-character-ctrl-numpad-1"
name = "First Person Character (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : ZombieDinerSimulator-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.6.1.0
// Game Version      : v0.65
// Script Date       : 2025-12-17


[ENABLE]

aobscanmodule(master,ZombieDinerSimulator-Win64-Shipping.exe,488BxxFFxxxxxxxxxx4889xx4883xxxx5BC34889xxxxxx4889xxxxxx56) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,9)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,9)

newmem:
  mov [data],rcx

code:
  readmem(master,9)
  jmp return

master:
  jmp newmem
  nop 4
return:

[DISABLE]

master:
  readmem(masterbkp,9)

unregistersymbol(*)
dealloc(*)"""

