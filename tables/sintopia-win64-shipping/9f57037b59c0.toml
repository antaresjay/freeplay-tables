source = """
[ENABLE]

aobscanmodule(resource,Sintopia-Win64-Shipping.exe,48 8B F7 4D 8D 34 FC 49 89 5E 18 49 39 1F)
alloc(newmem,$1000)

label(code)
label(return)

label(inffaith)
registersymbol(inffaith)

newmem:
  mov rsi,rdi
  lea r14,[r12+rdi*8]
  mov [r14+18],rbx

  cmp dword ptr [inffaith], 1
  jne code

  mov [r15], #666

code:
  cmp [r15],rbx
  jmp return

inffaith:
dd 0

resource:
  jmp far newmem
return:
registersymbol(resource)

[DISABLE]

resource:
  db 48 8B F7 4D 8D 34 FC 49 89 5E 18 49 39 1F

unregistersymbol(resource)
unregistersymbol(inffaith)
dealloc(newmem)"""

