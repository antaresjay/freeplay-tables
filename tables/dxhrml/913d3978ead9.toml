[[cheat]]
id = "inf-health-one-shoot-kill"
name = "Inf Health+One Shoot Kill"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem:
cmp [esi+7c],(float)1
jne originalcode
nop
nop
nop
jmp exit
originalcode:
mov [esi+5C],0

exit:
jmp returnhere

"dxhrml.exe"+120997:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
dealloc(newmem)
"dxhrml.exe"+120997:
fstp dword ptr [esi+5C]
fld dword ptr [ecx+68]
//Alt: db D9 5E 5C D9 41 68"""

