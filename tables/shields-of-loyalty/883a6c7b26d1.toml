[[cheat]]
id = "get-selected-unit-data"
name = "Get Selected Unit Data"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Shields of Loyalty.exe
  Version: 
  Date   : 2026-02-12
  Author : CannonFodder

  This script does blah blah blah
}

[ENABLE]

//aobscan(SelectUnitInject,48 8B CE BA 02 00 00 00 48 8D 64) // should be unique
aobscanregion(SelectUnitInject,GameManager:SelectUnit+5ba,GameManager:SelectUnit+620,48 8B CE BA 02 00 00 00 48 8D 64) // should be unique
alloc(newmem,$1000,SelectUnitInject)

registersymbol(unitId)
registersymbol(unitDataAddr)
label(code)
label(return)

newmem:
  push rcx
  mov rcx,[rbp-430]//unit id
  mov [unitId],rcx
  mov [unitDataAddr],rcx
  pop rcx
code:
  mov rcx,rsi
  mov edx,00000002
  jmp return

unitId:
  dd 0
unitDataAddr:
  dq 0

SelectUnitInject:
  jmp newmem
  nop 3
return:
registersymbol(SelectUnitInject)

[DISABLE]

SelectUnitInject:
  db 48 8B CE BA 02 00 00 00

unregistersymbol(*)
dealloc(newmem)

{
