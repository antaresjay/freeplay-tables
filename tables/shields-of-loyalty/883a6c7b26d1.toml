[[cheat]]
id = "get-selected-player-unit-data"
name = "Get Selected Player Unit Data"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Shields of Loyalty.exe
  Version: 
  Date   : 2026-02-12
  Author : CannonFodder

  This script does blah blah blah
}

[ENABLE]

//aobscan(SelectUnitInject,48 8D 86 28 01 00 00 48 63 10 89 95 68) // should be unique
aobscanregion(SelectUnitInject,GameManager:SelectUnit+5da,GameManager:SelectUnit+645,48 8D 86 28 01 00 00 48 63 10 89 95 68) // should be unique
assert(SelectUnitInject-3,48 8B 08)//mov rcx,[rax] //unit manager address in rcx after this
alloc(newmem,$1000,SelectUnitInject)

registersymbol(unitId unitCount)
registersymbol(unitDataAddr)
label(loopSearch)
label(skip)
label(found)
label(code)
label(return)

newmem:
  push rax//for store selected unit id
  push rbx//for store unit data address
  push rdx//for store current index

  mov rax,[rbp-430]//unit id
  mov [unitId],rax
  mov rbx,[rcx+138]//UnitManager.UnitDatas
  mov rbx,[rbx+18]//entries
  mov rdx,[rbx+18]
  mov [unitCount],rdx
  mov rdx,0
  //mov rdx,[rbx+20]
  add rbx,20//1st entry (unit data)
loopSearch:
  cmp rdx,[unitCount]//if current index >= unit count
  jge skip
  cmp [rbx+10],rax//if unit id == selected unit id
  je found
  inc rdx//current index += 1
  add rbx,88//next unit
  jmp loopSearch
found:
  mov [unitDataAddr],rbx
skip:
  pop rdx
  pop rbx
  pop rax
code:
  lea rax,[rsi+00000128]
  jmp return

unitId:
  dd 0
unitCount:
  dd 0
unitDataAddr:
  dq 0

SelectUnitInject:
  jmp newmem
  nop 2
return:
registersymbol(SelectUnitInject)

[DISABLE]

SelectUnitInject:
  db 48 8D 86 28 01 00 00

unregistersymbol(*)
dealloc(newmem)

