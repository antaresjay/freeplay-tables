type = "script"
source = """
// Created by Papun
[ENABLE]

aobscan(Base_hero,48 8B 40 20 48 8B 40 30 48 8B C8 83 39 00 48 83 C0 10 48 8B 08 48 89 8D F0) // should be unique
alloc(newmem, $1000)
alloc(herox, 8)

label(code)
label(return)

registersymbol(herox)

herox:
dq 0

newmem:

code:
  mov [herox], rax
  mov rax,[rax+20]
  mov rax,[rax+30]
  jmp return

Base_hero:
  jmp newmem
  nop 3
return:

registersymbol(Base_hero)

[DISABLE]

Base_hero:
  db 48 8B 40 20 48 8B 40 30

unregistersymbol(Base_hero)
unregistersymbol(herox)
dealloc(newmem)
dealloc(herox)"""

[[cheat]]
id = "god-mode"
name = "god_mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Created by Papun

[Enable]
aobscan(Health,46 10 48 8B 11 48 89 10 48 8B 51 08)
alloc(newmem,$1000,Health)

label(return)
label(skip_write)
label(normal_write)

newmem:
  mov rbx,[rax]
  cmp rdx,rbx
  jge normal_write
  mov [rax],rbx
  jmp skip_write

normal_write:
  mov [rax],rdx

skip_write:
  mov rdx,[rcx+08]
  jmp return

Health+05:
  jmp newmem
  nop 2
return:
registersymbol(Health)

[DISABLE]
Health+05:
  db 48 89 10 48 8B 51 08

unregistersymbol(Health)
dealloc(newmem)"""
