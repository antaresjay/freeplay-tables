[[cheat]]
id = "full-health"
name = "Full Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{  Game Executable   : Speed-Win64-Shipping.exe (paused)
   Executable Version: 4.24.3.0
   Script Date       : 2022-01-14
   Author            : AlvinC
}

[ENABLE]
aobscanmodule(aophealth,Speed-Win64-Shipping.exe,3E 66 0F 6E 8F 20 07 00 00)
alloc(nphealth,$1000,aophealth)
label(rphealth)
label(resphealth)
nphealth:
push ebx
mov ebx,[rdi+00000724]
mov [rdi+00000720],ebx
pop ebx
resphealth:
readmem(aophealth+01,8)
jmp rphealth
aophealth+01:
jmp nphealth
nop 3
rphealth:
registersymbol(aophealth resphealth)
[DISABLE]
aophealth+01:
readmem(resphealth,8)
unregistersymbol(*)
dealloc(*)"""

