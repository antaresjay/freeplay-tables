type = "script"
source = """
[ENABLE]

aobscanmodule(timer_AOB,StreetFighter6.exe,FE ?? 88 ?? ?? 84 ?? 7F ?? 0F B6) // should be unique
alloc(re_timer,2)
registersymbol(re_timer)

re_timer:
