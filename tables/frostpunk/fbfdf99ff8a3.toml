type = "script"
source = """
[ENABLE]

aobscanmodule(aobResources,FrostpunkWindows10.exe,41 03 4C 00 08) // should be unique
alloc(newmemResourc,$1000,aobResources)

label(lblResOrig)
label(lblResStart)
label(lblResCont)
label(lblResRet)
label(pCoal)
label(pWood)
label(pSteel)
label(pSteamCores)
label(pRawFood)
label(pFoodRat)
label(pStructuralProf)
label(pSteamEx)
label(pSteelComp)
label(pProthesis)
registersymbol(pCoal)
registersymbol(pWood)
registersymbol(pSteel)
registersymbol(pSteamCores)
registersymbol(pRawFood)
registersymbol(pFoodRat)
registersymbol(pStructuralProf)
registersymbol(pSteamEx)
registersymbol(pSteelComp)
registersymbol(pProthesis)
registersymbol(aobResources)
label(gpRawFood)
label(gpSteel)
registersymbol(gpRawFood)
registersymbol(gpSteel)

newmemResourc:
pCoal:
dq 0
pWood:
dq 0
pSteel:
dq 0
pSteamCores:
dq 0
pRawFood:
dq 0
pFoodRat:
dq 0
pStructuralProf:
dq 0
pSteamEx:
dq 0
pSteelComp:
dq 0
pProthesis:
dq 0

lblResStart:
  push rbx
  push rcx

  lea rbx,[r8+rax] //+08
  mov rdx,qword ptr [r8+rax]
  mov rdx,qword ptr [rdx]
  mov rdx,qword ptr [rdx]
//Coal is unique so 4 Byte enough
@@:
  cmp edx,'Coal'
  jne short @f
  mov qword ptr [pCoal],rbx
  jmp lblResCont
//though only 4 Byte sadly mov is still need - if you want to differate
@@:
  mov ecx,'Wood' //R_L�dooW 525F4C00646F6F57
  cmp edx,ecx
  jne short gpSteel
  shr rdx,0x20 //Shift Right 32Bit, descructive but rdx else not needed
  cmp dl,00
  jne short @f
  mov qword ptr [pWood],rbx
  jmp lblResCont
@@:
  mov ecx,'en M' //Wooden Mat
  cmp edx,ecx
  jne short @f
  mov qword ptr [pStructuralProf],rbx
  jmp lblResCont
gpSteel:
  mov ecx,'Stee' //Found 'Steel' & 'Steel�f�'=66006C65657453
  cmp edx,ecx
  jne gpRawFood
  shr rdx,0x20
  cmp dx,006C
  jne short @f
  mov qword ptr [pSteel],rbx
  jmp lblResCont
@@:
  mov ecx,'l Pl' //Steel Plat
  cmp edx,ecx
  jne short @f
  mov qword ptr [pSteelComp],rbx
  jmp lblResCont
gpRawFood:
  mov rcx,'Raw Food'
  cmp rdx,rcx
  jne short @f
  mov qword ptr [pRawFood],rbx
  jmp lblResCont
@@: //just dont force food ration without other rations.
  mov rcx,'Food Rat'
  cmp rdx,rcx
  jne short @f
  mov qword ptr [pFoodRat],rbx
  jmp lblResCont
@@:
  mov rcx,'Steam Co'
  cmp rdx,rcx
  jne short @f
  mov qword ptr [pSteamCores],rbx
  jmp lblResCont
@@:
  mov rcx,'Steam To' //Steam Tool
  cmp rdx,rcx
  jne short @f
  mov qword ptr [pSteamEx],rbx
  jmp lblResCont
@@:
  mov rcx,'Augmenta'
  cmp rdx,rcx
  jne short lblResCont
  mov qword ptr [pProthesis],rbx

lblResCont:
  pop rcx
  pop rbx

lblResOrig:
  add ecx,[r8+rax+08]
  jmp lblResRet

aobResources:
  jmp lblResStart //skipping values
lblResRet:

[DISABLE]

aobResources:
  db 41 03 4C 00 08

{unregistersymbol(pCoal)
unregistersymbol(pWood)
unregistersymbol(pSteel)
unregistersymbol(pSteamCores)
unregistersymbol(pRawFood)
unregistersymbol(pStructuralProf)
unregistersymbol(pSteamEx)
unregistersymbol(pSteelComp)
unregistersymbol(pProthesis)
unregistersymbol(aobResources)
unregistersymbol(newmemResourc)
