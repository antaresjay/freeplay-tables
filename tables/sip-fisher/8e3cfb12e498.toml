type = "script"
source = """
{ Game   : Sip Fisher.exe
  Version: 
  Date   : 2025-08-31
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,Player:UnStuck)
define(bytes,55 48 8B EC 48 81 EC 80 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Player:UnStuck)

label(code)
label(return)

newmem:

mov [player_stuck_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,00000080
  jmp return

player_stuck_ptr:
dq 0

address:
  jmp newmem
  nop 6
return:
registersymbol(player_stuck_ptr)

[DISABLE]

address:
  db bytes
  // push rbp
  // mov rbp,rsp
  // sub rsp,00000080

dealloc(newmem)
unregistersymbol(player_stuck_ptr)
{
// ORIGINAL CODE - INJECTION POINT: Player:UnStuck

21712B4EFC9: 04 02                 - add al,02
21712B4EFCB: 05 04 03 01 50        - add eax,50010304
21712B4EFD0: 00 00                 - add [rax],al
21712B4EFD2: 00 00                 - add [rax],al
21712B4EFD4: 00 00                 - add [rax],al
21712B4EFD6: 00 00                 - add [rax],al
21712B4EFD8: 00 00                 - add [rax],al
21712B4EFDA: 00 00                 - add [rax],al
21712B4EFDC: 00 00                 - add [rax],al
21712B4EFDE: 00 00                 - add [rax],al
// ---------- INJECTING HERE ----------
Player:UnStuck: 55                    - push rbp
// ---------- DONE INJECTING  ----------
Player:UnStuck+1: 48 8B EC              - mov rbp,rsp
Player:UnStuck+4: 48 81 EC 80 00 00 00  - sub rsp,00000080
Player:UnStuck+b: 48 89 75 F0           - mov [rbp-10],rsi
Player:UnStuck+f: 48 89 7D F8           - mov [rbp-08],rdi
Player:UnStuck+13: 48 8B F1              - mov rsi,rcx
Player:UnStuck+16: 48 8B 46 58           - mov rax,[rsi+58]
Player:UnStuck+1a: 48 8B C8              - mov rcx,rax
Player:UnStuck+1d: 33 D2                 - xor edx,edx
Player:UnStuck+1f: 83 38 00              - cmp dword ptr [rax],00
Player:UnStuck+22: 48 8D 6D 00           - lea rbp,[rbp+00]
}"""

