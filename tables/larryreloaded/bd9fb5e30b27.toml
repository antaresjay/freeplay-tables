type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
registersymbol(aob1)
aobscan(aob1, 89 48 14 EB 18 8B 46 10 83 EC 08 53 50 39 00)


newmem: //this is allocated memory, you have read,write,execute access
//place your code here
