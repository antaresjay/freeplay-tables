[[cheat]]
id = "stretch"
name = "Stretch"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here

originalcode:
nop //fstp dword ptr [esi+04]
nop //fld dword ptr [esp+38]

exit:
jmp returnhere

"d3d9.dll"+15C852:
jmp newmem
nop 2
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
"d3d9.dll"+15C852:
fstp dword ptr [esi+04]
fld dword ptr [esp+38]
//Alt: db D9 5E 04 D9 44 24 38"""

