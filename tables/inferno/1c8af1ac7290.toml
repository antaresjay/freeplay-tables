[[cheat]]
id = "instant-restock"
name = "instant restock"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
define(address,"Little Inferno.exe"+E326)
define(bytes,D9 1C 01 5B 83 C4 1C)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
mov [ecx+eax],(float)0
code:
  //fstp dword ptr [ecx+eax]
  pop ebx
  add esp,1C
  jmp return

address:
  jmp newmem
  nop
  nop
return:

[DISABLE]

address:
  db bytes

dealloc(newmem)"""

