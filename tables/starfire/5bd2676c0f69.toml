name = "𝐃𝐚𝐦𝐚𝐠𝐞"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{  Game Executable   : StarFire.exe
   Script Date       : 2025-09-11
   Author            : Sianz
}

[ENABLE]

alloc(newmem,$1000,RuntimeInspectorNamespace.ColorWheelControl.get_Alpha)
alloc(mydmg,8)
label(code)
label(return)

mydmg:
dd (float)999999

newmem:
  cmp dword ptr [rcx+1D8],#2
  jne code
  cmp dword ptr [rcx+6D8],#2
  jne code
  movss xmm1,[mydmg]
  movss [rcx+30],xmm1
code:
  movss xmm0,[rcx+30]
  jmp return

RuntimeInspectorNamespace.ColorWheelControl.get_Alpha:
  jmp newmem
return:
registersymbol(mydmg)

[DISABLE]

RuntimeInspectorNamespace.ColorWheelControl.get_Alpha:
  db F3 0F 10 41 30

unregistersymbol(*)
dealloc(*)"""

