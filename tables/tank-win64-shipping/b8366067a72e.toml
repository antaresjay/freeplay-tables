[[cheat]]
id = "hp-scripts-ohk-damage-multiplier"
name = "HP scripts (OHK, Damage multiplier),"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{  Game Executable   : TANK-Win64-Shipping.exe
   Author            : Tuuuup!
   Executable Version: 5.4.3.0
   Script Date       : 2025-05-28
}
[ENABLE]
aobscanmodule(hpdamage,$process,2B??89??????????85??7F??C7)
registersymbol(hpdamage hpdamagebkp hppl damp2 ohk damp1)
alloc(newmem,128,hpdamage)
label(code return hppl player damp damp2 ohk damp1)
label(hpdamagebkp)
newmem:
push r12
mov r12,pltank
cmp rdi,[r12]
pop r12
je player
cmp [ohk],1
jne damp
sub eax,eax
jmp code

damp:
cmp [damp1],1
jne code
imul edx,[damp2]
jmp code

player:
cmp [hppl],1
jne code
xor edx,edx // removes damage

code:
sub eax,edx
  mov [rdi+000004D8],eax
  jmp return
  
hpdamagebkp:
readmem(hpdamage,8)
align 10 cc
hppl:
dd 0
align 10 cc
damp2:
dd #2
align 10 cc
ohk:
dd 0
align 10 cc
damp1:
dd 0
hpdamage:
  jmp newmem
  nop 3
return:

[DISABLE]
hpdamage:
 // db 2B C2 89 87 D8 04 00 00
readmem(hpdamagebkp,8)
unregistersymbol(*)
dealloc(*)

