type = "script"
source = """
//Send@FearlessRevolution|Sintrix
define(address,"GameAssembly.dll"+A408D5)
define(bytes,48 89 BB 70 01 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,"GameAssembly.dll"+A408D5)

label(code)
label(return)

newmem:
cmp [rbx+480],1
jne @f
mov rdi,#999
mov [rbx+170],rdi
