jmp far newmem
nop 3
returnhere:



 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
"PRAGMATA.exe"+138FA6:
db FF C6 41 89 75 00 FF 47 38 40 B5 01 48 8B 4C 24 48
//inc esi
//mov [r13+00],esi
//inc [rdi+38]
//mov bpl,01
//mov rcx,[rsp+48]

unregistersymbol(bWalkKey)"""

