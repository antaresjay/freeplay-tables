name = "walk key"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

label(bWalkKey)
registersymbol(bWalkKey)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
push rax
push rbx
xor rbx,rbx
mov rcx,bWalkKey
cmp byte ptr [rcx],1
je @f
lea rcx,[rcx+8]
cmp byte ptr [rcx],1
je @f
jmp end
@@:
lea rcx,[rcx+4]
lea rax,[r15+rax+30]
cmp dword ptr [rax],3f800000
je doa
cmp dword ptr [rax],bf800000
je doa
jmp nexta

doa:
inc rbx
movss xmm6,[rax]
mulss xmm6,[rcx]
movss [rax],xmm6

nexta:
lea rax,[rax+4]
cmp dword ptr [rax],3f800000
je dob
cmp dword ptr [rax],bf800000
je dob
jmp end

dob:
movss xmm6,[rax]
mulss xmm6,[rcx]
movss [rax],xmm6
test rbx,rbx
jz @f
mov ecx,(float)1
mov ebx,(float)2
movd xmm14,ecx
movd xmm15,ebx
sqrtss xmm15,xmm15
divss xmm14,xmm15
mulss xmm6,xmm14
movss [rax],xmm6
mulss xmm14,[rax-4]
movss [rax-4],xmm14
xorps xmm14,xmm14
xorps xmm15,xmm15

end:
pop rbx
pop rax

originalcode:
inc esi
mov [r13+00],esi
inc [rdi+38]
mov bpl,01
mov rcx,[rsp+48]

exit:
jmp returnhere

///
bWalkKey:
dd 0
dd (float)0.5
dd 0
dd (float)0.288
///

