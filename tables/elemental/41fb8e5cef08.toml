//////////////////////////////////////////////

lblPlayerGrabber:
readmem(aobPlayerGrabber,4)
movsx r10,[iPlayerTeamID]
lea r10,[r10*8]
cmp rdi,r10
jne short lblPlayerGrabberSkip
cmp qword ptr [pPlayer],rbx
je short lblPlayerGrabberSkip
mov qword ptr [pPlayer],rbx
lblPlayerGrabberSkip:
readmem(aobPlayerGrabber+4,03)
jmp lblPlayerGrabberRet
aobPlayerGrabber_i:
readmem(aobPlayerGrabber,7)
align 8 00
iPlayerTeamID:
dq 0
pPlayer:
dq 0
iCityOwnerOffset:
readmem(aobCityOwnerOffset+03,1)
db 0
dw 0
dd 0

lblMovePointsCalc:
movsxd r10,[iUnitTeamOffset]
movsxd r11,[iPlayerTeamID]
cmp dword ptr [rdi+r10],r11d
jne short lblMovePointsCalcSkip
cmp dword ptr [bEnableInfiniteMovementPoints],1
jne short lblMovePointsCalcSkip
xor eax,eax
lblMovePointsCalcSkip:
readmem(aobMovePointsCalc,6)
jmp lblMovePointsCalcRet
aobMovePointsCalc_i:
readmem(aobMovePointsCalc,6)
align 8 00
iUnitTeamOffset:
readmem(aobUnitTeamOffset+05,4)
dd 0

lblTacticalAttack:
movsxd r10,[iUnitTeamOffset]
movsxd r11,[iPlayerTeamID]
cmp dword ptr [rsi+r10],r11d
je short lblTacticalAttackSkip
cmp dword ptr [bEnableWeakEnemies],1
jne short lblTacticalAttackSkip
movsxd r10,[aobTacticalAttack_i+03]
mov dword ptr [rsi+r10],1
lblTacticalAttackSkip:
readmem(aobTacticalAttack,7)
jmp lblTacticalAttackRet
aobTacticalAttack_i:
readmem(aobTacticalAttack,7)

lblTacticalUnitHealthUpdater:
movsxd r10,[iUnitTeamOffset]
movsxd r11,[iPlayerTeamID]
cmp dword ptr [rdi+r10],r11d
jne short lblTacticalUnitHealthUpdaterSkip
cmp dword ptr [bEnableStrongFriendlies],1
jne short lblTacticalUnitHealthUpdaterSkip
movsxd r10,[aobTacticalUnitHealthUpdater_i+02]
mov esi,[rdi+r10+04]
lblTacticalUnitHealthUpdaterSkip:
readmem(aobTacticalUnitHealthUpdater,6)
jmp lblTacticalUnitHealthUpdaterRet
aobTacticalUnitHealthUpdater_i:
readmem(aobTacticalUnitHealthUpdater,6)

lblXPGainCalc:
movsxd r10,[iUnitTeamOffset]
movsxd r11,[iPlayerTeamID]
cmp dword ptr [rbx+r10],r11d
jne short lblXPGainCalcSkip
cmp dword ptr [bEnableXPGainMod],1
jne short lblXPGainCalcSkip
cvtsi2ss xmm4,eax
mulss xmm4,[fXPGainMod]
cvtss2si eax,xmm4
lblXPGainCalcSkip:
readmem(aobXPGainCalc,5)
jmp lblXPGainCalcRet
aobXPGainCalc_i:
readmem(aobXPGainCalc,5)

lblResourceUpdater:
cmp qword ptr [pPlayer],r15
jne lblResourceUpdaterSkip
movsx r10,[aobResourceUpdater_i+08]
mov r11,'GoldType'
cmp qword ptr [rcx+08],r11
jne short @f
cmp dword ptr [bEnableMinGold],1
jne short @f
mov r11d,[fMinGold]
call lblResourceUpdaterTest
jmp lblResourceUpdaterSkip
@@:
mov r11,'Fame'
cmp dword ptr [rcx+08],r11d
jne short @f
cmp dword ptr [bEnableMinFame],1
jne short @f
mov r11d,[fMinFame]
call lblResourceUpdaterTest
jmp lblResourceUpdaterSkip
@@:
mov r11,'Mana'
cmp dword ptr [rcx+08],r11d
jne short @f
cmp dword ptr [bEnableMinMana],1
jne short @f
mov r11d,[fMinMana]
call lblResourceUpdaterTest
jmp lblResourceUpdaterSkip
@@:
mov r11,'CrystalT'
cmp qword ptr [rcx+08],r11
jne short @f
cmp dword ptr [bEnableMinCrystals],1
jne short @f
mov r11d,[fMinCrystals]
call lblResourceUpdaterTest
jmp lblResourceUpdaterSkip
@@:
lblResourceUpdaterSkip:
readmem(aobResourceUpdater,9)
jmp lblResourceUpdaterRet
lblResourceUpdaterTest:
cmp dword ptr [rcx+r10],r11d
jge short @f
xorps xmm1,xmm1
mov dword ptr [rcx+r10],r11d
@@:
ret
aobResourceUpdater_i:
readmem(aobResourceUpdater,9)

lblProductionRushChecker:
movsx r10,[iCityOwnerOffset]
mov r10,[rdi+r10]
cmp qword ptr [pPlayer],r10
jne short lblProductionRushCheckerSkip
cmp dword ptr [bEnableInfiniteProductionRush],1
jne short lblProductionRushCheckerSkip
movsxd r10,[aobProductionRushChecker_i+02]
cmp dword ptr [rdi+r10],0
je short lblProductionRushCheckerSkip
mov dword ptr [rdi+r10],0
lblProductionRushCheckerSkip:
readmem(aobProductionRushChecker,7)
jmp lblProductionRushCheckerRet
aobProductionRushChecker_i:
readmem(aobProductionRushChecker,7)

lblResearchCalc:
mov rax,[pPlayer]
cmp qword ptr [r14+10],rax
jne short lblResearchCalcSkip
cmp dword ptr [bEnableFastResearch],1
jne short lblResearchCalcSkip
movsx rax,[aobResearchCalc_i+04]
movss [rbx+rax],xmm1
lblResearchCalcSkip:
readmem(aobResearchCalc,5)
jmp lblResearchCalcRet
aobResearchCalc_i:
readmem(aobResearchCalc,5)

lblHealthReader:
movsxd r10,[iUnitTeamOffset]
movsxd r11,[iPlayerTeamID]
cmp dword ptr [r13+r10],r11d
je short lblHealthReaderSkip
cmp dword ptr [bEnableWeakEnemies],1
jne short lblHealthReaderSkip
movsxd r10,[aobHealthReader_i+05]
cmp dword ptr [r13+r10],1
jle short lblHealthReaderSkip
mov dword ptr [r13+r10],1
lblHealthReaderSkip:
readmem(aobHealthReader,9)
jmp lblHealthReaderRet
aobHealthReader_i:
readmem(aobHealthReader,9)

aobHealthReader:
