  mov [rsi+258],(float)180
  mov byte [rsi+262],0
  mov byte [rsi+266],1
  mov byte [rsi+267],1
  mov byte [rsi+28C],0

writeMove:
  cmp [infiniteMove],1
  jne code
  mov byte [rsi+EC],0
