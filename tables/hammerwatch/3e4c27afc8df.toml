type = "script"
source = """
{ Game   : Hammerwatch.exe
  Version: 1.3 STEAM *fix*
  Date   : 25/02/2015
  Author : AikonCWD

  This script search and dump the player structure

  DEBUG INFORMATION, IGNORE THIS
  cmp edx,1
  je StructureDump
  cmp edx,eax
  jne StructureDump
  cmp edx,edi
  jne StructureDump
}

[ENABLE]

aobscan(INJECT,89 46 40 80 7E 55 00)
alloc(newmem,$1000)

label(code)
label(return)
label(StructureDump)

globalalloc(pBase,4)

newmem:

code:
  mov [esi+40],eax
  cmp edx,1
  je StructureDump
  cmp byte ptr [esi+55],00
  jmp return

StructureDump:
  mov [pBase],esi
  cmp byte ptr [esi+55],00
  jmp return

INJECT:
  jmp code
  nop
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 89 46 40 80 7E 55 00

unregistersymbol(INJECT)
dealloc(newmem)
dealloc(pBase)
