[[cheat]]
id = "engine-power"
name = "Engine Power"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobScanModule(BHPAOB,F1_2020_dx12.exe, F3 0F 59 83 38 25 00 00)
alloc(BHPMem,512,BHPAOB)
label(Return)
label(BHPRate)
registersymbol(BHPRate)
registersymbol(BHPAOB)

BHPMem:
  mulss xmm0,[rbx+00002538]
  mov rax,[rbx+8]
  cmp dword ptr [rax+F0],1
  je Return
  mulss xmm0,[BHPRate]
  jmp Return

BHPRate:
  dd 3F800000

BHPAOB:
  jmp BHPMem
  db 90 90 90
Return:

[DISABLE]
BHPAOB:
  db F3 0F 59 83 38 25 00 00
unregistersymbol(BHPRate)
unregistersymbol(BHPAOB)
dealloc(BHPMem)"""

