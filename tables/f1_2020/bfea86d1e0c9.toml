source = """
[ENABLE]
aobScanModule(GripAOB,F1_2020_dx12.exe, F3 0F 11 84 BB 30 02 00 00)
alloc(GripMem,512,GripAOB)
label(Return)
label(CPUCode)
label(GripRate)
label(GripCPURate)
