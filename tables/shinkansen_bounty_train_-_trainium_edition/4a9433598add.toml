//53100701 - D9EE                  - fldz
// Character:Update+13
//53100703 - D9 9F 18010000        - fstp dword ptr [edi+00000118]
//53100709 - D9 45 0C              - fld dword ptr [ebp+0C]
//5310070C - 83 EC 08              - sub esp,08
//5310070F - 83 EC 04              - sub esp,04
//53100712 - D9 1C 24              - fstp dword ptr [esp]
aobscan(Character_searchedAOB, D9 9F 18 01 00 00 D9 45 0C 83 EC 08)

alloc(Character_newmem, 2048, Character_searchedAOB)


Character_newmem:
cmp dword ptr [Character_update_enable], #0
je Character_update_exit
// Characters in Engine only
cmp dword ptr [edi+28], #0
jne Character_update_exit
mov [Character_basepointer], edi
Character_update_exit:

// Non-enemy
cmp dword ptr [edi+16c], #1
je Character_statsset_exit

cmp dword ptr [Character_set_enable], #0
je Character_set_exit
Character_set_exit:

cmp dword ptr [Character_hpset_enable], #0
je Character_hpset_exit
fld [edi+184]
fadd [edi+188]
fstp [edi+180]
Character_hpset_exit:

cmp dword ptr [Character_moraleset_enable], #0
je Character_moraleset_exit
fld [edi+280]
fstp [edi+1b8]
Character_moraleset_exit:

cmp dword ptr [Character_staminaset_enable], #0
je Character_staminaset_exit
fld [edi+288]
fstp [edi+18c]
Character_staminaset_exit:

// Protagonist only
cmp dword ptr [edi+244], #1
jne Character_statsset_exit

cmp dword ptr [Character_statsset_enable], #0
je Character_statsset_exit
//mov [edi+190], (float)50
//mov [edi+194], (float)25
mov [edi+198], #999
mov [edi+19c], #999
mov [edi+1a0], #999
mov [edi+1a4], #999
Character_statsset_exit:


Character_originalcode:
db D9 9F 18 01 00 00
//fstp dword ptr [edi+00000118]


Character_exit:
jmp Character_returnhere


Character_searchedAOB:
Character_savedAOB:
jmp Character_newmem
nop
Character_returnhere:


[DISABLE]
Character_savedAOB:
db D9 9F 18 01 00 00
//fstp dword ptr [edi+00000118]

unregistersymbol(Character_savedAOB)

dealloc(Character_newmem)"""

