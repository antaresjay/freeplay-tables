[[cheat]]
id = "player-weapon-ctrl-numpad-1-shoot-weapon-to-populate-values"
name = "Player Weapon (Ctrl + Numpad 1) {Shoot weapon to populate values}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Motordoom.exe
// Author            : ndck76
// Executable Version: 2021.3.6.41869
// Game Version      : Build.15242715
// Script Date       : 2024-08-05


[ENABLE]

aobscanmodule(ammo,GameAssembly.dll,) //Weapons.Gun.Shoot
alloc(newmem,$1000,ammo)
alloc(data,8)
alloc(ammobkp,5)
registersymbol(data)
registersymbol(ammo)
registersymbol(ammobkp)
label(code)
label(return)

ammobkp:
  readmem(ammo,5)

newmem:
  mov [data],rbx

code:
  readmem(ammo,5)
  jmp return

ammo:
  jmp newmem
return:

[DISABLE]

ammo:
  readmem(ammobkp,5)

unregistersymbol(*)
dealloc(*)"""

