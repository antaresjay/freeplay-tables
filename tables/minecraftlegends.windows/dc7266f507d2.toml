[ENABLE]

aobscanmodule(resources_AOB,MinecraftLegends.Windows.exe,F3 ?? ?? ?? ?? 48 89 ?? ?? ?? ?? ?? ?? 0F 28 ?? 48 8D) // should be unique
alloc(newmem,$1000,resources_AOB)

label(code_res)
