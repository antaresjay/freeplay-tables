[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]



aobscan(health,03 00 00 D9 81 60 01 00 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
mov [ecx+00000160],(float)999
fld dword ptr [ecx+00000160]
jmp return

health+03:
jmp code
nop
return:
registersymbol(health)

[DISABLE]
health+03:
db D9 81 60 01 00 00

unregistersymbol(health)
dealloc(newmem)"""

