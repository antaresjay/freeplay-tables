source = """
//Send@ModEngine
[ENABLE]

aobscanregion(boost,MinMaxFloat:set_cur+4b,MinMaxFloat:set_cur+61,F3 0F 11 6E 14 48 8B 75)
alloc(newmem,$1000,boost)

label(code)
