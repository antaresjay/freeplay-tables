[[cheat]]
id = "prepare-cheats"
name = "Prepare Cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Castle Of Alchemists.exe
  Version: 
  Date   : 2023-05-18
  Author :

  This script does blah blah blah

}

[ENABLE]

aobscanregion(prepareplayercheats, SkillBarController:Update+2, SkillBarController:Update+250, F3 0F 10 90 B8 01 00 00) // should be unique
alloc(newmem,$1000,prepareplayercheats)

label(code)
label(return)
label(staminacd)
label(ammocd)
label(hammercd)
label(canoncd)
label(consumablecd)

label(playerPtr)
registersymbol(playerPtr)

label(healthFlag)
registersymbol(healthFlag)

label(staminaFlag)
registersymbol(staminaFlag)

label(ammoFlag)
registersymbol(ammoFlag)

label(hammerFlag)
registersymbol(hammerFlag)

label(canonFlag)
registersymbol(canonFlag)

label(consumableFlag)
registersymbol(consumableFlag)

newmem:
  mov [playerPtr], rax

  cmp dword ptr [healthFlag], 1
  jne staminacd

  fld dword ptr [rax+1B8]
  fstp dword ptr [rax+1B4]

staminacd:
  cmp dword ptr [staminaFlag], 1
  jne ammocd

  fld dword ptr [rax+1BC]
  fstp dword ptr [rax+1C0]

ammocd:
  cmp dword ptr [ammoFlag], 1
  jne hammercd

  mov [rax+19C], #9

hammercd:
  cmp dword ptr [hammerFlag], 1
  jne canoncd

  fld dword ptr [rax+270]
  fstp dword ptr [rax+274]

canoncd:
  cmp dword ptr [canonFlag], 1
  jne consumablecd

  mov [rax+2D0], #9

consumablecd:
  cmp dword ptr [consumableFlag], 1
  jne code

  mov [rax+2D4], #9

code:
  movss xmm2,[rax+000001B8]
  cvtss2sd xmm2,xmm2
  divsd xmm1,xmm2
  jmp return

playerPtr:
dq 0

healthFlag:
dd 0

staminaFlag:
dd 0

ammoFlag:
dd 0

hammerFlag:
dd 0

canonFlag:
dd 0

consumableFlag:
dd 0

prepareplayercheats:
  jmp far newmem
  nop 2
return:
registersymbol(prepareplayercheats)

[DISABLE]

prepareplayercheats:
  db F3 0F 10 90 B8 01 00 00 F3 0F 5A D2 F2 0F 5E CA

unregistersymbol(prepareplayercheats)
unregistersymbol(playerPtr)
unregistersymbol(healthFlag)
unregistersymbol(staminaFlag)
unregistersymbol(ammoFlag)
unregistersymbol(hammerFlag)
unregistersymbol(canonFlag)
unregistersymbol(consumableFlag)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: SkillBarController:Update+6c

SkillBarController:Update+3b: 48 89 45 A8              - mov [rbp-58],rax
SkillBarController:Update+3f: F3 0F 10 45 AC           - movss xmm0,[rbp-54]
SkillBarController:Update+44: F3 0F 5A C0              - cvtss2sd xmm0,xmm0
SkillBarController:Update+48: F3 0F 10 0D 60 02 00 00  - movss xmm1,[SkillBarController:Update+2b0]
SkillBarController:Update+50: F3 0F 5A C9              - cvtss2sd xmm1,xmm1
SkillBarController:Update+54: F2 0F 5E C1              - divsd xmm0,xmm1
SkillBarController:Update+58: 48 8B 46 58              - mov rax,[rsi+58]
SkillBarController:Update+5c: F3 0F 10 88 B4 01 00 00  - movss xmm1,[rax+000001B4]
SkillBarController:Update+64: F3 0F 5A C9              - cvtss2sd xmm1,xmm1
SkillBarController:Update+68: 48 8B 46 58              - mov rax,[rsi+58]
// ---------- INJECTING HERE ----------
SkillBarController:Update+6c: F3 0F 10 90 B8 01 00 00  - movss xmm2,[rax+000001B8]
SkillBarController:Update+74: F3 0F 5A D2              - cvtss2sd xmm2,xmm2
SkillBarController:Update+78: F2 0F 5E CA              - divsd xmm1,xmm2
// ---------- DONE INJECTING  ----------
SkillBarController:Update+7c: 66 0F 2F C8              - comisd xmm1,xmm0
SkillBarController:Update+80: 7A 06                    - jp SkillBarController:Update+88
SkillBarController:Update+82: 0F 84 B3 00 00 00        - je SkillBarController:Update+13b
SkillBarController:Update+88: 48 8B 46 28              - mov rax,[rsi+28]
SkillBarController:Update+8c: F3 0F 10 0D 0C 02 00 00  - movss xmm1,[SkillBarController:Update+2a0]
SkillBarController:Update+94: F3 0F 5A C9              - cvtss2sd xmm1,xmm1
SkillBarController:Update+98: F3 0F 10 05 F0 01 00 00  - movss xmm0,[SkillBarController:Update+290]
SkillBarController:Update+a0: F3 0F 5A C0              - cvtss2sd xmm0,xmm0
}"""

