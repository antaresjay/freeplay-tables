[[cheat]]
id = "weapon-exp-only-multiplier-always-1-0-exp-bias"
name = "Weapon EXP Only Multiplier (Always 1.0 EXP Bias)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
///  This is in the function DynamicVictoryUIController.SetCharacterAndWeaponXp
//aobscanmodule(WeaponEXPMultiplierAOB1,"GameAssembly.dll",66 41 0F 6E C7 0F 5B C0 0F 5B FF)
aobscanmodule(WeaponEXPMultiplierAOB1,"GameAssembly.dll",66 41 0F 6E C6 0F 5B C0 0F 5B FF)
registersymbol(WeaponEXPMultiplierAOB1)
alloc(newmem,1024,WeaponEXPMultiplierAOB1)

///
label(return)
label(fWeaponEXPMult)
registersymbol(fWeaponEXPMult)

newmem:
  mov r13d,r14d
  push r13d
  fild dword ptr [rsp]
  fmul dword ptr [fWeaponEXPMult]
  fistp dword ptr [rsp]
  pop r13d
  movd xmm0,r13d
  movss xmm1,[fEXPBias]
  jmp return

fWeaponEXPMult:
dq (float)10.0
fEXPBias:
dq (float)1.0
    
WeaponEXPMultiplierAOB1:
  jmp newmem
  return:

[DISABLE]

WeaponEXPMultiplierAOB1:
  db 66 41 0F 6E C6

unregistersymbol(WeaponEXPMultiplierAOB1)

dealloc(newmem)"""

