[[cheat]]
id = "mana-ui-ctrl-numpad-1-switch-to-the-game-to-populate-values"
name = "Mana UI (Ctrl + Numpad 1) {Switch to the game to populate values}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : AltheiaWrathOfAferi.exe
// Author            : ndck76
// Executable Version: 2022.3.62.62237
// Game Version      : v1.005
// Script Date       : 2025-08-31


[ENABLE]

aobscanmodule(thiscanvas,GameAssembly.dll,488Bxxxx4885xx74xx33xxE8xxxxxxxx0F57xx0F2Fxx76xx488Bxxxx4885xx74xx4533xxE8xxxxxxxx0F28) //ManaUI.Update
alloc(newmem,$1000,thiscanvas)
alloc(data2,8)
alloc(thiscanvasbkp,7)
registersymbol(data2)
registersymbol(thiscanvas)
registersymbol(thiscanvasbkp)
label(code)
label(return)

thiscanvasbkp:
  readmem(thiscanvas,7)

newmem:
  mov [data2],rdi

code:
  readmem(thiscanvas,7)
  jmp return

thiscanvas:
  jmp newmem
  nop 2
return:

[DISABLE]

thiscanvas:
  readmem(thiscanvasbkp,7)

unregistersymbol(*)
dealloc(*)"""

