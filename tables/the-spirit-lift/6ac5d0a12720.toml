[[cheat]]
id = "runmanager"
name = "RunManager"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : THE SPIRIT LIFT.exe
  Version: 
  Date   : 2026-02-01
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,prettysmart.RunManager:Update)
define(bytes,55 48 8B EC 48 83 EC 40)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,prettysmart.RunManager:Update)

label(code)
label(return)

newmem:
mov [runmanager_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,40
  jmp return

runmanager_ptr:
dq 0

address:
  jmp newmem
  nop 3
return:
registersymbol(runmanager_ptr)

[DISABLE]

address:
  db bytes
  // push rbp
  // mov rbp,rsp
  // sub rsp,40

dealloc(newmem)
unregistersymbol(runmanager_ptr)"""

