[[cheat]]
id = "active-trainer"
name = "Active Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)

label(lives)
label(health)
label(focus)
label(coins)

registersymbol(livesE)
registersymbol(healthE)
registersymbol(focusE)
registersymbol(coinsE)

label(livesE)
label(healthE)
label(focusE)
label(coinsE)

aobscan(activeaob,8B 48 10 8B C1 C1 E8 1F 03 C1 D1 F8 8B 4F 18 0F AF C1 48 50)
registersymbol(activeaob)
newmem: //this is allocated memory, you have read,write,execute access
//place your code here
{
c lives
10 health
14 focus
18 coins
}
health:
cmp [healthE],0
je lives
mov [eax+10],64
lives:
cmp [livesE],0
je focus
mov [eax+c],63
focus:
cmp [focusE],0
je coins
mov [eax+14],(float)100
coins:
cmp [coinsE],0
je originalcode
mov [eax+18],#9999
originalcode:
mov ecx,[eax+10]
mov eax,ecx
jmp returnhere
livesE:
dd 0
healthE:
dd 0
focusE:
dd 0
coinsE:
dd 0
activeaob://HealthAndFocus:Update+73:
jmp newmem
returnhere:
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
activeaob://
db 8B 48 10 8B C1
unregistersymbol(activeaob)
unregistersymbol(livesE)
unregistersymbol(healthE)
unregistersymbol(focusE)
unregistersymbol(coinsE)"""

