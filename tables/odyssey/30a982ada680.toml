{ Game   : Etrian Odyssey.exe
  Version: 
  Date   : 2023-06-01
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(pData_TotalGameData,GameAssembly.dll,48 8B 40 10 48 83 C4 28 C3 E8 7C AB) // should be unique
alloc(newmem,$1000,pData_TotalGameData)

alloc(pBase_TotalGameData,8)
