label(code)
label(return)

pBase_TotalGameData:
dd

newmem:

code:
  mov [pBase_TotalGameData],rax
  mov rax,[rax+10]
  add rsp,28
  jmp return

pData_TotalGameData:
  jmp newmem
  nop 3
return:
registersymbol(pData_TotalGameData pBase_TotalGameData)

[DISABLE]

pData_TotalGameData:
  db 48 8B 40 10 48 83 C4 28

unregistersymbol(*)
dealloc(*)"""

