[[cheat]]
id = "x-ka-reckoning-v1-0-0-1-script-1-0"
name = "[X] <== KA - Reckoning v1.0.0.1 Script 1.0"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
===========================================
 Game Title    : Kingdoms of Amatur: Reckoning
 Game Version  : Unknown
 Process Name  : Reckoning.exe
 Script Version: 1.0
 CE Version    : 6.1
 Release date  : 05-Feb-2012
 Author        : Recifense
 Features:
 - God Mode
 - Minimum Gold
 - Fast Mana Recover
===========================================
}

[ENABLE]
//=========================================
// Check if script is compatible to this game version
// If false the script will not be loaded

assert(Reckoning.exe+3b17df,8b 40 48 5f 5e)
assert(Reckoning.exe+3a1059,03 ce 89 4f 48)
assert(Reckoning.exe+7020ec,8b 80 64 03 00 00)
assert(Reckoning.exe+3b16ad,8b 80 84 00 00 00)

//=========================================
alloc(MyCode,1024)
//=========================================
// Declaration section
label(_MonHP)
label(_BackMH)
label(_ExitMH)
label(_GodMode)
label(_BackGM)
label(_ExitGM)
label(_MonGold)
label(_BackMG)
label(_ExitMG)
label(_MonMana)
label(_BackMM)
label(_ExitMM)
label(pHP)
label(pGold)
label(pMana)
label(iEnableGM)
label(iEnableMG)
label(iEnableMM)

//=========================================
// Registering Symbols
registersymbol(MyCode)
registersymbol(pHP)
registersymbol(pGold)
registersymbol(pMana)
registersymbol(iEnableGM)
registersymbol(iEnableMG)
registersymbol(iEnableMM)

//=========================================
MyCode:
//=========================================
// Activated when open status screen
_MonHP:
 cmp dword ptr [eax+40],0
 jne _ExitMH

 mov [pHP],eax

 cmp dword ptr [iEnableGM],0
 je _ExitMH                        // Jump if feature is disabled

 mov esi,[eax+4c]
 mov [eax+48],esi

_ExitMH:
 mov eax,[eax+48]                  // Original code
 pop edi                           // Original code
 pop esi                           // Original code
 jmp _BackMH                       // Back to main code

//=========================================
// Activated during a fight
_GodMode:
 cmp dword ptr [iEnableGM],0
 je _ExitGM                        // Jump if feature is disabled

 cmp edi,[pHP]
 jne _ExitGM

 test esi,esi
 jns _ExitGM

 xor esi,esi                       // value2decrease = 0
 mov ecx,[edi+4c]

_ExitGM:
 add ecx,esi                       // Original code
 mov [edi+48],ecx                  // Original code
 jmp _BackGM                       // Back to main code

//=========================================
// Activated when open status screen
_MonGold:
 mov ecx,[eax]
 cmp ecx,Reckoning.exe+7929c8
 jne _ExitMG

 mov [pGold],eax

 cmp dword ptr [iEnableMG],0
 je _ExitMG                        // Jump if feature is disabled

 mov ecx,#6100

 cmp ecx,[eax+00000364]
 jle _ExitMG

 mov [eax+00000364],ecx

_ExitMG:
 mov eax,[eax+00000364]            // Original code
 jmp _BackMG                       // Back to main code

//=========================================
// Activated on main screen
_MonMana:
 push ebx

 mov [pMana],eax

 cmp dword ptr [iEnableMM],0
 je _ExitMM                        // Jump if feature is disabled

 mov ebx,[eax+74]
 mov [eax+00000084],ebx

_ExitMM:
 pop ebx

 mov eax,[eax+00000084]            // Original code
 jmp _BackMM                       // Back to main code

//=========================================
 db '======================>'
 db 'CE6.1 Script by Recifense 020512'
//=========================================
// Variables
iEnableGM:
 dd 1
iEnableMG:
 dd 1
iEnableMM:
 dd 1
pHP:
 dd MyCode
pMana:
 dd 0
pGold:
 dd 0

//=========================================
// Hacking Points
Reckoning.exe+3b17df:
 jmp _MonHP
_BackMH:

Reckoning.exe+3a1059:
 jmp _GodMode
_BackGM:

Reckoning.exe+7020ec:
 jmp _MonGold
 nop
_BackMG:

Reckoning.exe+3b16ad:
 jmp _MonMana
 nop
_BackMM:

//=========================================
// Script for Restoring Original Codes
[DISABLE]
Reckoning.exe+3b17df:
// mov eax,[eax+48]
// pop edi
// pop esi
 db 8b 40 48 5f 5e

Reckoning.exe+3a1059:
// add ecx,esi
// mov [edi+48],ecx
 db 03 ce 89 4f 48

Reckoning.exe+7020ec:
// mov eax,[eax+00000364]
 db 8b 80 64 03 00 00

Reckoning.exe+3b16ad:
// mov eax,[eax+00000084]
 db 8b 80 84 00 00 00

//=========================================
// Unregistering Symbols
unregistersymbol(MyCode)
unregistersymbol(pHP)
unregistersymbol(pMana)
unregistersymbol(pGold)
unregistersymbol(iEnableGM)
unregistersymbol(iEnableMG)
unregistersymbol(iEnableMM)

//=========================================
dealloc(MyCode)
//============= Scripts End ===============

// ****************************************
// NOTES
// ****************************************
{
}"""

