[[cheat]]
id = "teleport"
name = "Teleport"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,$100,teleport)
label(condition storepoint)
registersymbol(condition storepoint)
label(code_bkp)
label(return)

newmem:
  pop rax
  //Write your code here:
  cmp byte ptr [condition],01
  jne @f
  movups xmm0,[rcx+1C]
  movaps [storepoint],xmm0
  @@:
  cmp byte ptr [condition],02
  jne code_bkp
  movaps xmm0,[storepoint]
  ptest xmm0,xmm0
  jz code_bkp
  movups [rcx+1C],xmm0
code_bkp:
  readmem(teleport,13)
  mov byte ptr [condition],00
  jmp return
 align 10,CC
storepoint:
  resb 20
condition:
  dd 00
teleport:
  push rax
  mov rax,newmem
  jmp rax
  
return:
registersymbol(code_bkp)

[DISABLE]

teleport:
  readmem(code_bkp,13)//db F2 0F 10 41 1C F2 0F 11 40 B0 8B 41 24

unregistersymbol(condition storepoint code_bkp)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: Aluna.exe+2A7856

Aluna.exe+2A784F: 0F 29 78 E8     - movaps [rax-18],xmm7
Aluna.exe+2A7853: 48 8B F9        - mov rdi,rcx
// ---------- INJECTING HERE ----------
Aluna.exe+2A7856: F2 0F 10 41 1C  - movsd xmm0,[rcx+1C]
// ---------- DONE INJECTING  ----------
Aluna.exe+2A785B: F2 0F 11 40 B0  - movsd [rax-50],xmm0
Aluna.exe+2A7860: 8B 41 24        - mov eax,[rcx+24]
}"""

