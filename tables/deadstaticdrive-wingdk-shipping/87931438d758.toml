type = "script"
source = """
// Game Executable   : DeadStaticDrive-WinGDK-Shipping.exe
// Author            : ndck76
// Executable Version: 4.27.2.0
// Game Version      : Build.20671580
// Script Date       : 2025-11-06


[ENABLE]

aobscanmodule(master,DeadStaticDrive-WinGDK-Shipping.exe,488Bxx488BxxFFxxxxxxxxxx84xx74xx488Bxx488BxxFFxxxxxxxxxx84xx0F84) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,6)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,6)

newmem:
  mov [data],rax

code:
  readmem(master,6)
  jmp return

master:
  jmp newmem
  nop
return:

[DISABLE]

master:
  readmem(masterbkp,6)

unregistersymbol(*)
dealloc(*)"""

