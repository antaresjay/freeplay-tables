[[cheat]]
id = "relations-click-on-a-portrait"
name = "Relations (click on a Portrait)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
define(char_relations,_Scripts.Managers:ParametersManager:GetCharacterRelation) // should be unique
alloc(newmem,$200)
alloc(relations,8)
registersymbol(relations)
registersymbol(char_relations)

label(code)
label(return)
label(relationread)
registersymbol(relationread)
label(LoopStart)
label(Found)
label(NotInList)

newmem:
code:
  readmem(char_relations,8)
  push rax
  push rbx
  push rcx
  push rdx
  push rsi                           // probably not needed - just to make sure
  mov rax,dword ptr[rdx+58]          // Character ID
  xor rcx,rcx                        // index
  mov rbx,[r8+10]                    // character list
  mov rsi,dword ptr[r8+18]           // list Size
  add rbx,20                        // jump to list item [0]

LoopStart:
  cmp ecx,esi
  jg NotInList                    // to avoid crashing
  mov rdx,[rbx+rcx*8]
  cmp eax,dword ptr[rdx+28]      // same ID in list?
  je short Found                // if yes jump out of loop and save the pointer
  inc rcx                      // increase counter
  jmp LoopStart               // check again until found

Found:
  mov [relations],rdx         // save pointer

NotInList:
  pop rsi
  pop rdx
  pop rcx
  pop rbx
  pop rax
  jmp return

relationread:
readmem(char_relations,8)

relations:
dq 0

char_relations:
  jmp newmem
  nop 3
return:


[DISABLE]

char_relations:
  readmem(relationread,8)

unregistersymbol(*)
dealloc(*)

