[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : ToM.exe
  Date   : 2025-10-08
  Author : Sianz
}

[ENABLE]

aobscanregion(health,Zaia.Player.HealthGauge.get_ValueCap,Zaia.Player.HealthGauge.get_ValueCap+200,F3 0F 10 4B 18 48 8B 41) // should be unique
alloc(newmem,$1000,health)
label(code)
label(return)

newmem:
code:
  mov [rbx+18],(float)999
  movss xmm1,[rbx+18]
  jmp return

health:
  jmp newmem
return:
registersymbol(health)

[DISABLE]

health:
  db F3 0F 10 4B 18

unregistersymbol(health)
dealloc(newmem)"""

[[cheat]]
id = "god-mode"
name = "God Mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : ToM.exe
  Date   : 2025-10-08
  Author : Sianz
}

[ENABLE]

aobscanmodule(invul,GameAssembly.dll,38 47 78 0F 85 85 0B 00 00) // should be unique
alloc(newmem,$1000,invul)

label(code)
label(return)

newmem:
code:
  mov byte ptr [rdi+78],1
  cmp [rdi+78],al
  jne GameAssembly.dll+B8422B
  jmp return

invul:
  jmp newmem
  nop 4
return:
registersymbol(invul)

[DISABLE]

invul:
  db 38 47 78 0F 85 85 0B 00 00

unregistersymbol(invul)
dealloc(newmem)"""
