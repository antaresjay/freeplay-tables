[[cheat]]
id = "instant-max-friendship"
name = "Instant Max Friendship"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(MaxFriendship,FriendShipManager:UpdateAllFriendship+2a,FriendShipManager:UpdateAllFriendship+83,F3 0F 10 41 38 F3 0F 5A C0 48)
alloc(newmem,$1000,MaxFriendship)

label(code)
label(return)

newmem:

code:
  mov [rcx+38],(float)100
  movss xmm0,[rcx+38]
  jmp return

MaxFriendship:
  jmp newmem
return:
registersymbol(MaxFriendship)

[DISABLE]

MaxFriendship:
  db F3 0F 10 41 38

unregistersymbol(*)
dealloc(*)"""

[[cheat]]
id = "player"
name = "→ Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
define(address,GameManager:Update)
define(bytes,55 48 8B EC 48 83 EC 30 48 89 75 F8 48 8B F1)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000)
registersymbol(2DPlayer)
label(code return 2DPlayer)

newmem:
mov [2DPlayer],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,30
  mov [rbp-08],rsi
  mov rsi,rcx
  jmp return

2DPlayer:
dw

address:
  jmp far newmem
  nop
return:

[DISABLE]

address:
  db bytes


  unregistersymbol(*)
  dealloc(*)"""
