id = "enable-pointer-s"
name = "Enable Pointer's"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Clicker Conquest.exe
  Version: 
  Date   : 2025-10-09
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,DayManager:Update)
define(bytes,48 83 EC 08 48 89 34 24)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,DayManager:Update)

label(code)
label(return)

newmem:
mov [daymanager_ptr],rcx

code:
  sub rsp,08
  mov [rsp],rsi
  jmp return

daymanager_ptr:
dq 0

address:
  jmp newmem
  nop 3
return:
registersymbol(daymanager_ptr)

[DISABLE]

address:
  db bytes
  // sub rsp,08
  // mov [rsp],rsi

dealloc(newmem)
unregistersymbol(daymanager_ptr)

{
// ORIGINAL CODE - INJECTION POINT: DayManager:Update

21A60BAB489: 04 02                 - add al,02
21A60BAB48B: 05 04 03 01 50        - add eax,50010304
21A60BAB490: 00 00                 - add [rax],al
21A60BAB492: 00 00                 - add [rax],al
21A60BAB494: 00 00                 - add [rax],al
21A60BAB496: 00 00                 - add [rax],al
21A60BAB498: 00 00                 - add [rax],al
21A60BAB49A: 00 00                 - add [rax],al
21A60BAB49C: 00 00                 - add [rax],al
21A60BAB49E: 00 00                 - add [rax],al
// ---------- INJECTING HERE ----------
DayManager:Update: 48 83 EC 08           - sub rsp,08
// ---------- DONE INJECTING  ----------
DayManager:Update+4: 48 89 34 24           - mov [rsp],rsi
DayManager:Update+8: 48 8B F1              - mov rsi,rcx
DayManager:Update+b: 48 8B 86 80 00 00 00  - mov rax,[rsi+00000080]
DayManager:Update+12: 48 63 80 38 01 00 00  - movsxd  rax,dword ptr [rax+00000138]
DayManager:Update+19: 85 C0                 - test eax,eax
DayManager:Update+1b: 7F 10                 - jg DayManager:Update+2d
DayManager:Update+1d: 48 8B 86 80 00 00 00  - mov rax,[rsi+00000080]
DayManager:Update+24: C6 80 3C 01 00 00 01  - mov byte ptr [rax+0000013C],01
DayManager:Update+2b: EB 0E                 - jmp DayManager:Update+3b
DayManager:Update+2d: 48 8B 86 80 00 00 00  - mov rax,[rsi+00000080]
