[[cheat]]
id = "impossible-house-ctrl-numpad-1"
name = "Impossible House (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : ProjectAIDA-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.5.1.0
// Game Version      : v1.0.0.6001
// Script Date       : 2025-12-01


[ENABLE]

aobscanmodule(master,ProjectAIDA-Win64-Shipping.exe,488Bxx488BxxFFxxxxxxxxxx4885xx74xx4805) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,6)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,6)

newmem:
  mov [data],rdi

code:
  readmem(master,6)
  jmp return

master:
  jmp newmem
  nop
return:

[DISABLE]

master:
  readmem(masterbkp,6)

unregistersymbol(*)
dealloc(*)"""

