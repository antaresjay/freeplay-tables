[[cheat]]
id = "super-money-reward"
name = "Super Money Reward"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(megamoney_aob,MonkeyCity-Win.exe,8D 45 EC 50 8D 8B 90 00 00 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
push (float)1000
fld [esp]
fstp qword ptr [ebp-14]
add esp,4
code:
lea eax,[ebp-14]
push eax
lea ecx,[ebx+00000090]
jmp return

megamoney_aob:
jmp newmem
nop 5
return:
registersymbol(megamoney_aob)

[DISABLE]

megamoney_aob:
db 8D 45 EC 50 8D 8B 90 00 00 00

unregistersymbol(megamoney_aob)
dealloc(newmem)"""

