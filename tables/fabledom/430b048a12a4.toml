name = "Resources Material Cart / Stockpile Unlimited"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : FabledomDemo.exe
  Version: 
  Date   : 2023-02-15
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanregion(pBase_MaterialCart,Utils_Resources:Total,Utils_Resources:Total+500,48 63 40 18 03 F8) // should be unique
alloc(newmem,$1000,pBase_MaterialCart)

label(code)
label(return)

newmem:
  mov dword ptr [rax+18],$999999         //Count

code:
  movsxd  rax,dword ptr [rax+18]
  add edi,eax
  jmp return

pBase_MaterialCart:
  jmp newmem
  nop
return:
registersymbol(pBase_MaterialCart)

[DISABLE]

pBase_MaterialCart:
  db 48 63 40 18 03 F8

unregistersymbol(pBase_MaterialCart)
dealloc(newmem)"""

