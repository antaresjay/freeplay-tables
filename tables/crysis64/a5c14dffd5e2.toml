type = "script"
source = """
{ Game   : Crysis64.exe
  Version: 
  Date   : 2020-08-25
  Author : Paul44

  Manages clipammo of selected weapon...
}

[ENABLE]
// all ammo seems to pass through these 2 routines...
aobscanmodule(AmmoClip,CryGame.dll,49 8B C8 49 8B 40 08 48 85 C0 74 25 48)
registersymbol(AmmoClip)
alloc(newmem,$100,$process)

aobscanmodule(AmmoInfo,cryaction.dll,C3 CC CC CC CC CC 48 8B 41 40 4C 8D 41 38)
registersymbol(AmmoInfo)
alloc(newmem2,$100,$process)

globalalloc(pAmmoClip,8,$process)
globalalloc(pAmmoOffset,4,$process)
globalalloc(pRiffleAmmo,8,$process)
globalalloc(pGrenade,8,$process)
globalalloc(pGrenadeSmoke,8,$process)


alloc(chkGrenade,0x9,$process)               // rsp+50: 'egrenade'
chkGrenade:
db 'egrenade',0

alloc(chkGrenadeSmoke,0xC,$process)          // rsp+50: 'smokegrenade'
chkGrenadeSmoke:
db 'smokegrenade',0


// 1st routine...
label(code)
label(return)

newmem:
  mov rcx,r8
  mov rax,[r8+08]
code:
  push rcx
  test r8,r8
  je short @f
  mov rcx,[r8+10]
  mov [pAmmoClip],rcx
@@:
  pop rcx
  jmp return

AmmoClip:
  jmp newmem
  db 90 90
return:


// 2nd routine...
label(code2)
label(code3)
label(return2)

newmem2:
code2:
  push rcx
  push rdi
  push rsi
  test rax,rax
  je code3
@@:
  mov ecx,0x8                             // string length...
  lea rsi,[rsp+70]                        // rsi pts to rsp+58 string... + init 'push'-es...
  mov rdi,chkGrenade                      // rdi pts to label string...
  rep cmpsb
  jne short @f
  mov [pGrenade],rax
  jmp code3
@@:
  mov ecx,0xB
  lea rsi,[rsp+68]
  mov rdi,chkGrenadeSmoke
  rep cmpsb
  jne short @f
  mov [pGrenadeSmoke],rax
  jmp code3
@@:
  cmp R13,0
  jne code3
  mov rcx,[rsp+10]
  mov [pRiffleAmmo],rax
code3:
  pop rsi
  pop rdi
  pop rcx
@@:
  mov rcx,rax
  mov rax,[rax+10]
  jmp return2

AmmoInfo+1C:
  jmp newmem2
  db 90 90
return2:

[DISABLE]

AmmoClip:
  db 49 8B C8 49 8B 40 08

unregistersymbol(AmmoClip)
dealloc(newmem)

// 2nd routine...
AmmoInfo+1C:
  db 48 8B C8 48 8B 40 10

unregistersymbol(AmmoInfo)
dealloc(newmem2)
dealloc(chkGrenade)
dealloc(chkGrenadeSmoke)


