category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
mov dword [edi+00000084],(float)0

originalcode:
comiss xmm0,[edi+00000084]

exit:
jmp returnhere

"CryGame.dll"+1ADED8:
jmp newmem
nop
nop
returnhere:


 
 
[DISABLE]
