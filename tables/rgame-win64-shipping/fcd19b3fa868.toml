[[cheat]]
id = "get-player"
name = "Get Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(PlayerControllerPtr,RGame-Win64-Shipping.exe,48 * * 44 * * * 0F * * 48 * * FF * * * * * EB * 49)
alloc(newmemPlayerControllerPtr,$100,PlayerControllerPtr)
alloc(GetPC,8,PlayerControllerPtr)
label(codePlayerControllerPtr returnPlayerControllerPtr)
//Send@Sintrix|FearlessRevolution
newmemPlayerControllerPtr:
mov [GetPC],rdi

codePlayerControllerPtr:
mov rax,[rdi]
movzx r8d,sil
jmp returnPlayerControllerPtr

GetPC:
dw
//Send@Sintrix|FearlessRevolution
PlayerControllerPtr+0:  
jmp newmemPlayerControllerPtr
nop 2
returnPlayerControllerPtr:
registersymbol(PlayerControllerPtr GetPC)

//Send@Sintrix|FearlessRevolution

[DISABLE]
//Send@Sintrix|FearlessRevolution
PlayerControllerPtr+0:
db 48 8B 07 44 0F B6 C6
unregistersymbol(PlayerControllerPtr GetPC)
dealloc(newmemPlayerControllerPtr GetPC)"""

