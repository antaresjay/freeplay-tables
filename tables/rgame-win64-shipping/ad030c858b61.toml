[[cheat]]
id = "ability-editor-ctrl-numpad-1-use-current-ability-to-populate-values"
name = "Ability Editor (Ctrl + Numpad 1) {Use current ability to populate values}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : RGame-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.5.1.0
// Game Version      : v1.0.1.50856
// Script Date       : 2025-08-15


[ENABLE]

aobscanmodule(mutator,RGame-Win64-Shipping.exe,39xxxxxxxxxx7Cxx488BxxE8xxxxxxxx84) // should be unique
alloc(newmem,$1000,mutator)
alloc(data2,8)
alloc(mutatorbkp,6)
registersymbol(data2)
registersymbol(mutator)
registersymbol(mutatorbkp)
label(code)
label(return)

mutatorbkp:
  readmem(mutator,6)

newmem:
  mov [data2],rdi

code:
  readmem(mutator,6)
  jmp return

mutator:
  jmp newmem
  nop
return:

[DISABLE]

mutator:
  readmem(mutatorbkp,6)

unregistersymbol(*)
dealloc(*)"""

