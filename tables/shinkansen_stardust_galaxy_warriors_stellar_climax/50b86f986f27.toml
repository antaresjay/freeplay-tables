source = """
[ENABLE]
label(SpecialAbility_savedAOB)
label(SpecialAbility_returnhere)
label(SpecialAbility_originalcode)
label(SpecialAbility_exit)

label(SpecialAbility_update_exit)
label(SpecialAbility_set_exit)

registersymbol(SpecialAbility_savedAOB)

//10752A6B - 83 EC 08              - sub esp,08
//10752A6E - 8B 45 08              - mov eax,[ebp+08]
// SpecialAbility:get_NormalizedDamage+9
//10752A71 - D9 40 40              - fld dword ptr [eax+40]
//10752A74 - DD 5D F8              - fstp qword ptr [ebp-08]
//10752A77 - 83 EC 0C              - sub esp,0C
//10752A7A - 50                    - push eax
//10752A7B - E8 C0FEFFFF           - call 10752940
//10752A80 - 83 C4 10              - add esp,10
aobscan(SpecialAbility_searchedAOB, D9 40 40 DD 5D F8 83 EC 0C 50)

alloc(SpecialAbility_newmem, 2048, SpecialAbility_searchedAOB)


SpecialAbility_newmem:
cmp dword ptr [SpecialAbility_update_enable], #0
je SpecialAbility_update_exit
mov [SpecialAbility_basepointer], eax
SpecialAbility_update_exit:

cmp dword ptr [SpecialAbility_set_enable], #0
je SpecialAbility_set_exit
mov [eax+40], (float)9999999
SpecialAbility_set_exit:


SpecialAbility_originalcode:
db D9 40 40 DD 5D F8
//fld dword ptr [eax+40]
//fstp qword ptr [ebp-08]


SpecialAbility_exit:
jmp SpecialAbility_returnhere


SpecialAbility_searchedAOB:
SpecialAbility_savedAOB:
