[[cheat]]
id = "playerhud-base-address-scan-initialization-activate-this-first"
name = "PlayerHUD Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlayerHUD_basepointer)
registersymbol(PlayerHUD_update_enable)
registersymbol(PlayerHUD_set_enable)
registersymbol(PlayerHUD_healthset_enable)
registersymbol(PlayerHUD_shieldset_enable)
registersymbol(PlayerHUD_resourcesset_enable)
registersymbol(PlayerHUD_weaponsset_enable)

alloc(PlayerHUD_basepointer, 4)
alloc(PlayerHUD_update_enable, 4)
alloc(PlayerHUD_set_enable, 4)
alloc(PlayerHUD_healthset_enable, 4)
alloc(PlayerHUD_shieldset_enable, 4)
alloc(PlayerHUD_resourcesset_enable, 4)
alloc(PlayerHUD_weaponsset_enable, 4)


[DISABLE]
unregistersymbol(PlayerHUD_basepointer)
unregistersymbol(PlayerHUD_update_enable)
unregistersymbol(PlayerHUD_set_enable)
unregistersymbol(PlayerHUD_healthset_enable)
unregistersymbol(PlayerHUD_shieldset_enable)
unregistersymbol(PlayerHUD_resourcesset_enable)
unregistersymbol(PlayerHUD_weaponsset_enable)

dealloc(PlayerHUD_basepointer)
dealloc(PlayerHUD_update_enable)
dealloc(PlayerHUD_set_enable)
dealloc(PlayerHUD_healthset_enable)
dealloc(PlayerHUD_shieldset_enable)
dealloc(PlayerHUD_resourcesset_enable)
dealloc(PlayerHUD_weaponsset_enable)"""

[[cheat]]
id = "playerhud-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerHUD Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerHUD_savedAOB)
label(PlayerHUD_returnhere)
label(PlayerHUD_originalcode)
label(PlayerHUD_exit)

label(PlayerHUD_update_exit)
label(PlayerHUD_set_exit)
label(PlayerHUD_healthset_exit)
label(PlayerHUD_shieldset_exit)
label(PlayerHUD_resourcesset_exit)
label(PlayerHUD_weaponsset_exit)

registersymbol(PlayerHUD_savedAOB)

//107272B6 - C7 85 88FEFFFF 00000000 - mov [ebp-00000178],00000000
//107272C0 - C7 85 8CFEFFFF 00000000 - mov [ebp-00000174],00000000
// PlayerHUD:Update+42
//107272CA - 8B 47 70              - mov eax,[edi+70]
//107272CD - 85 C0                 - test eax,eax
//107272CF - 0F84 50000000         - je 10727325
//107272D5 - 8B 47 58              - mov eax,[edi+58]
//107272D8 - 89 85 74FEFFFF        - mov [ebp-0000018C],eax
//107272DE - 8B 47 70              - mov eax,[edi+70]
aobscan(PlayerHUD_searchedAOB, 8B 47 70 85 C0 * * * * * * 8B 47 58)

alloc(PlayerHUD_newmem, 2048, PlayerHUD_searchedAOB)
alloc(PlayerHUD_temp1, 4, PlayerHUD_searchedAOB)
alloc(PlayerHUD_temp2, 4, PlayerHUD_searchedAOB)
alloc(PlayerHUD_temp3, 4, PlayerHUD_searchedAOB)


PlayerHUD_newmem:
mov [PlayerHUD_temp1], ebx
mov [PlayerHUD_temp2], ecx
mov [PlayerHUD_temp3], edx

cmp dword ptr [PlayerHUD_update_enable], #0
je PlayerHUD_update_exit
mov [PlayerHUD_basepointer], edi
PlayerHUD_update_exit:

cmp dword ptr [PlayerHUD_set_enable], #0
je PlayerHUD_set_exit
PlayerHUD_set_exit:

cmp dword ptr [PlayerHUD_healthset_enable], #0
je PlayerHUD_healthset_exit
cmp dword ptr [edi+60], #0
je PlayerHUD_healthset_exit
mov ebx, [edi+60]
mov [ebx+dc], (float)9999999
PlayerHUD_healthset_exit:

cmp dword ptr [PlayerHUD_shieldset_enable], #0
je PlayerHUD_shieldset_exit
cmp dword ptr [edi+60], #0
je PlayerHUD_shieldset_exit
mov ebx, [edi+60]
mov [ebx+e0], (float)9999999
PlayerHUD_shieldset_exit:

cmp dword ptr [edi+5c], #0
je PlayerHUD_weaponsset_exit
mov ebx, [edi+5c]
cmp dword ptr [ebx+3c], #0
je PlayerHUD_weaponsset_exit
mov ebx, [ebx+3c]

cmp dword ptr [PlayerHUD_resourcesset_enable], #0
je PlayerHUD_resourcesset_exit
mov [ebx+54], #9999999
mov [ebx+58], #9999999
PlayerHUD_resourcesset_exit:

cmp dword ptr [PlayerHUD_weaponsset_enable], #0
je PlayerHUD_weaponsset_exit
cmp dword ptr [ebx+10], #0
je PlayerHUD_weaponsset_exit
mov ecx, [ebx+10]
mov byte ptr [ecx+5c], #1
mov byte ptr [ecx+5d], #1
mov byte ptr [ecx+5e], #1
cmp dword ptr [ecx+8], #0
je PlayerHUD_weaponsset_exit
mov ecx, [ecx+8]
mov [ecx+6c], (float)9999999
mov [ecx+70], (float)20
cmp dword ptr [ebx+14], #0
je PlayerHUD_weaponsset_exit
mov ecx, [ebx+14]
mov byte ptr [ecx+5c], #1
mov byte ptr [ecx+5d], #1
mov byte ptr [ecx+5e], #1
cmp dword ptr [ecx+8], #0
je PlayerHUD_weaponsset_exit
mov ecx, [ecx+8]
mov [ecx+6c], (float)9999999
mov [ecx+70], (float)20
PlayerHUD_weaponsset_exit:

mov ebx, [PlayerHUD_temp1]
mov ecx, [PlayerHUD_temp2]
mov edx, [PlayerHUD_temp3]


PlayerHUD_originalcode:
db 8B 47 70 85 C0
//mov eax,[edi+70]
//test eax,eax


PlayerHUD_exit:
jmp PlayerHUD_returnhere


PlayerHUD_searchedAOB:
PlayerHUD_savedAOB:
jmp PlayerHUD_newmem
PlayerHUD_returnhere:


[DISABLE]
PlayerHUD_savedAOB:
db 8B 47 70 85 C0
//mov eax,[edi+70]
//test eax,eax

unregistersymbol(PlayerHUD_savedAOB)

dealloc(PlayerHUD_newmem)
dealloc(PlayerHUD_temp1)
dealloc(PlayerHUD_temp2)
dealloc(PlayerHUD_temp3)"""

