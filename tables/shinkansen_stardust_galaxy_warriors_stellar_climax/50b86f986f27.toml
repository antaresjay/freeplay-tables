nop
SpecialAbility_returnhere:


[DISABLE]
SpecialAbility_savedAOB:
db D9 40 40 DD 5D F8
//fld dword ptr [eax+40]
//fstp qword ptr [ebp-08]

unregistersymbol(SpecialAbility_savedAOB)

dealloc(SpecialAbility_newmem)"""

