[[cheat]]
id = "game-data-ctrl-numpad-1-kill-an-enemy-to-populate-values"
name = "Game Data (Ctrl + Numpad 1) {Kill an enemy to populate values}"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Souno's Curse.exe
// Author            : ndck76
// Executable Version: 2022.3.46.39813
// Game Version      : v1.0.0
// Script Date       : 2024-12-10


[ENABLE]

aobscanregion(exp,GameData:UpdateXpPoints,GameData:UpdateXpPoints+100,4863xxxx03xx89xxxx48xxxxxx3Dxxxxxxxx7ExxC7xxxxxxxxxxxxEBxx48xxxxxx85xx7Dxx) //GameData:UpdateXpPoints+1e
alloc(newmem,$1000,exp)
alloc(data3,8)
alloc(expbkp,6)
registersymbol(data3)
registersymbol(exp)
registersymbol(expbkp)
label(code)
label(return)

expbkp:
  readmem(exp,6)

newmem:
  mov [data3],rdi

code:
  readmem(exp,6)
  jmp return

exp:
  jmp newmem
  nop
return:

[DISABLE]

exp:
  readmem(expbkp,6)

unregistersymbol(*)
dealloc(*)"""

