[[cheat]]
id = "shop-stats-base-address-scan-initialization-activate-this-first"
name = "Shop Stats Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(shopstats_basepointer)
registersymbol(shopstats_update_enable)
registersymbol(shopstats_inventoryset_enable)
registersymbol(shopstats_inventoryset_value)

alloc(shopstats_basepointer, 8)
alloc(shopstats_update_enable, 4)
alloc(shopstats_inventoryset_enable, 4)
alloc(shopstats_inventoryset_value, 4)

shopstats_inventoryset_value:
dd #1001


[DISABLE]
unregistersymbol(shopstats_basepointer)
unregistersymbol(shopstats_update_enable)
unregistersymbol(shopstats_inventoryset_enable)
unregistersymbol(shopstats_inventoryset_value)

dealloc(shopstats_basepointer)
dealloc(shopstats_update_enable)
dealloc(shopstats_inventoryset_enable)
dealloc(shopstats_inventoryset_value)"""

[[cheat]]
id = "shop-stats-base-address-scan-to-update-visit-shop"
name = "Shop Stats Base Address Scan (To Update: Visit Shop)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(shopstats_savedAOB)
label(shopstats_returnhere)
label(shopstats_originalcode)
label(shopstats_exit)

label(shopstats_update_exit)
label(shopstats_inventoryset_loop1_exit)
label(shopstats_inventoryset_loop1_entry)
label(shopstats_inventoryset_loop1_continue)

registersymbol(shopstats_originalcode)
registersymbol(shopstats_savedAOB)

//13FF3E65D - 48 8B D7              - mov rdx,rdi
//13FF3E660 - E9 2A020000           - jmp 13FF3E88F
// Accesses Shop Item ID Slots
//13FF3E665 - 42 8B 7C A8 04        - mov edi,[rax+r13*4+04]
//13FF3E66A - 85 FF                 - test edi,edi
//13FF3E66C - 0F84 2F020000         - je 13FF3E8A1
//13FF3E672 - E8 896CDBFF           - call 13FCF5300
aobscan(shopstats_searchedAOB, 42 8B 7C A8 04 85 FF)

alloc(shopstats_newmem, 2048, shopstats_searchedAOB)
alloc(shopstats_temp1, 8, shopstats_searchedAOB)
alloc(shopstats_temp2, 8, shopstats_searchedAOB)
alloc(shopstats_temp3, 8, shopstats_searchedAOB)
alloc(shopstats_temp4, 8, shopstats_searchedAOB)
alloc(shopstats_temp5, 8, shopstats_searchedAOB)
alloc(shopstats_loop1_index, 8, shopstats_searchedAOB)
alloc(shopstats_loop1_base, 8, shopstats_searchedAOB)
alloc(shopstats_loop1_max, 8, shopstats_searchedAOB)


shopstats_newmem:
mov [shopstats_temp1], rax
mov [shopstats_temp2], rbx
mov [shopstats_temp3], rcx
mov [shopstats_temp4], rdx

cmp dword ptr [shopstats_update_enable], #0
je shopstats_update_exit
mov [shopstats_basepointer], rax
shopstats_update_exit:

cmp dword ptr [shopstats_inventoryset_enable], #0
je shopstats_inventoryset_loop1_exit
mov [shopstats_loop1_index], #0
mov [shopstats_loop1_max], #100
mov [shopstats_loop1_base], rax

shopstats_inventoryset_loop1_entry:
mov rbx, [shopstats_loop1_base]
mov rdx, [shopstats_loop1_index]

mov ecx, [shopstats_inventoryset_value]
add ecx, edx
mov [rbx+rdx*4+4], ecx

shopstats_inventoryset_loop1_continue:
mov rdx, [shopstats_loop1_index]
inc rdx
mov [shopstats_loop1_index], rdx
mov rcx, [shopstats_loop1_max]
cmp rcx, rdx
je shopstats_inventoryset_loop1_exit
jmp shopstats_inventoryset_loop1_entry
shopstats_inventoryset_loop1_exit:

mov rax, [shopstats_temp1]
mov rbx, [shopstats_temp2]
mov rcx, [shopstats_temp3]
mov rdx, [shopstats_temp4]


shopstats_originalcode:
readmem(shopstats_searchedAOB, 5)


shopstats_exit:
jmp shopstats_returnhere


shopstats_searchedAOB:
shopstats_savedAOB:
jmp shopstats_newmem
shopstats_returnhere:


[DISABLE]
shopstats_savedAOB:
readmem(shopstats_originalcode, 5)

unregistersymbol(shopstats_originalcode)
unregistersymbol(shopstats_savedAOB)

dealloc(shopstats_newmem)
dealloc(shopstats_temp1)
dealloc(shopstats_temp2)
dealloc(shopstats_temp3)
dealloc(shopstats_temp4)
dealloc(shopstats_temp5)
dealloc(shopstats_loop1_index)
dealloc(shopstats_loop1_base)
dealloc(shopstats_loop1_max)"""

