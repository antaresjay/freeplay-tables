[[cheat]]
id = "digimon-stats-base-address-scan-initialization-activate-this-first"
name = "Digimon Stats Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(digimonstats_basepointer)
registersymbol(digimonstats_update_enable)

alloc(digimonstats_basepointer, 8)
alloc(digimonstats_update_enable, 4)


[DISABLE]
unregistersymbol(digimonstats_basepointer)
unregistersymbol(digimonstats_update_enable)

dealloc(digimonstats_basepointer)
dealloc(digimonstats_update_enable)"""

[[cheat]]
id = "digimon-stats-base-address-scan-to-update-view-digimon-stats"
name = "Digimon Stats Base Address Scan (To Update: View Digimon Stats)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(digimonstats_savedAOB)
label(digimonstats_returnhere)
label(digimonstats_originalcode)
label(digimonstats_exit)

label(digimonstats_update_exit)

registersymbol(digimonstats_originalcode)
registersymbol(digimonstats_savedAOB)

//14006EBAF - 48 83 EB 01           - sub rbx,01
//14006EBB3 - 75 EB                 - jne 14006EBA0
//14006EBB5 - 48 8B 5E 50           - mov rbx,[rsi+50]
//14006EBB9 - 0FBF 43 68            - movsx eax,word ptr [rbx+68]
//14006EBBD - 89 44 24 60           - mov [rsp+60],eax
// Accesses HP
//14006EBC1 - 44 8B 6B 7C           - mov r13d,[rbx+7C]
//14006EBC5 - 48 8D 95 10050000     - lea rdx,[rbp+00000510]
//14006EBCC - 48 8B CB              - mov rcx,rbx
aobscan(digimonstats_searchedAOB, 48 8B 5E 50 0F BF 43 68 89 44 24 60 44 8B 6B 7C)

alloc(digimonstats_newmem, 2048, digimonstats_searchedAOB)
alloc(digimonstats_temp1, 8, digimonstats_searchedAOB)
alloc(digimonstats_temp2, 8, digimonstats_searchedAOB)
alloc(digimonstats_temp3, 8, digimonstats_searchedAOB)
alloc(digimonstats_temp4, 8, digimonstats_searchedAOB)
alloc(digimonstats_temp5, 8, digimonstats_searchedAOB)


digimonstats_newmem:
mov [digimonstats_temp1], rax
mov [digimonstats_temp2], rbx
mov [digimonstats_temp3], rcx
mov [digimonstats_temp4], rdx

cmp dword ptr [digimonstats_update_enable], #0
je digimonstats_update_exit
mov [digimonstats_basepointer], rsi
digimonstats_update_exit:

mov rax, [digimonstats_temp1]
mov rbx, [digimonstats_temp2]
mov rcx, [digimonstats_temp3]
mov rdx, [digimonstats_temp4]


digimonstats_originalcode:
readmem(digimonstats_searchedAOB, 8)


digimonstats_exit:
jmp digimonstats_returnhere


digimonstats_searchedAOB:
digimonstats_savedAOB:
jmp digimonstats_newmem
nop
nop
nop
digimonstats_returnhere:


[DISABLE]
digimonstats_savedAOB:
readmem(digimonstats_originalcode, 8)

unregistersymbol(digimonstats_originalcode)
unregistersymbol(digimonstats_savedAOB)

dealloc(digimonstats_newmem)
dealloc(digimonstats_temp1)
dealloc(digimonstats_temp2)
dealloc(digimonstats_temp3)
dealloc(digimonstats_temp4)
dealloc(digimonstats_temp5)"""

