[[cheat]]
id = "player-stats-base-address-scan-initialization-activate-this-first"
name = "Player Stats Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(playerstats_basepointer)
registersymbol(playerstats_update_enable)
registersymbol(playerstats_yenset_enable)
registersymbol(playerstats_coinsset_enable)
registersymbol(playerstats_itemsset_enable)
registersymbol(playerstats_digifarmset_enable)
registersymbol(playerstats_playtimeset_enable)

alloc(playerstats_basepointer, 8)
alloc(playerstats_update_enable, 4)
alloc(playerstats_yenset_enable, 4)
alloc(playerstats_coinsset_enable, 4)
alloc(playerstats_itemsset_enable, 4)
alloc(playerstats_digifarmset_enable, 4)
alloc(playerstats_playtimeset_enable, 4)


[DISABLE]
unregistersymbol(playerstats_basepointer)
unregistersymbol(playerstats_update_enable)
unregistersymbol(playerstats_yenset_enable)
unregistersymbol(playerstats_coinsset_enable)
unregistersymbol(playerstats_itemsset_enable)
unregistersymbol(playerstats_digifarmset_enable)
unregistersymbol(playerstats_playtimeset_enable)

dealloc(playerstats_basepointer)
dealloc(playerstats_update_enable)
dealloc(playerstats_yenset_enable)
dealloc(playerstats_coinsset_enable)
dealloc(playerstats_itemsset_enable)
dealloc(playerstats_digifarmset_enable)
dealloc(playerstats_playtimeset_enable)"""

[[cheat]]
id = "player-stats-base-address-scan-to-update-play-level"
name = "Player Stats Base Address Scan (To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstats_update_exit)
label(playerstats_yenset_exit)
label(playerstats_coinsset_exit)
label(playerstats_itemsset_loop1_exit)
label(playerstats_itemsset_loop1_entry)
label(playerstats_itemsset_loop1_continue)
label(playerstats_itemsset_loop1_execute)
label(playerstats_itemsset_loop1_execute2)
label(playerstats_digifarmset_exit)
label(playerstats_playtimeset_exit)

registersymbol(playerstats_originalcode)
registersymbol(playerstats_savedAOB)

//13FE39172 - 39 68 08              - cmp [rax+08],ebp
//13FE39175 - 75 22                 - jne 13FE39199
// Accesses Player Base Address
//13FE39177 - 48 8B 4B 30           - mov rcx,[rbx+30]
//13FE3917B - 48 85 C9              - test rcx,rcx
//13FE3917E - 74 05                 - je 13FE39185
//13FE39180 - E8 CB3FF0FF           - call 13FD3D150
//13FE39185 - 48 8B 4B 18           - mov rcx,[rbx+18]
//13FE39189 - 48 85 C9              - test rcx,rcx
//13FE3918C - 74 05                 - je 13FE39193
//13FE3918E - E8 6D83EEFF           - call 13FD21500
//13FE39193 - 48 8B 4B 40           - mov rcx,[rbx+40]
aobscan(playerstats_searchedAOB, 48 8B 4B 30 48 85 C9 74 05 * * * * * 48 8B 4B 18 48 85 C9 74 05)

alloc(playerstats_newmem, 2048, playerstats_searchedAOB)
alloc(playerstats_temp1, 8, playerstats_searchedAOB)
alloc(playerstats_temp2, 8, playerstats_searchedAOB)
alloc(playerstats_temp3, 8, playerstats_searchedAOB)
alloc(playerstats_temp4, 8, playerstats_searchedAOB)
alloc(playerstats_temp5, 8, playerstats_searchedAOB)
alloc(playerstats_loop1_index, 8, playerstats_searchedAOB)
alloc(playerstats_loop1_base, 8, playerstats_searchedAOB)
alloc(playerstats_loop1_max, 8, playerstats_searchedAOB)


playerstats_newmem:
mov [playerstats_temp1], rax
mov [playerstats_temp2], rbx
mov [playerstats_temp3], rcx
mov [playerstats_temp4], rdx

cmp dword ptr [playerstats_update_enable], #0
je playerstats_update_exit
mov [playerstats_basepointer], rbx
playerstats_update_exit:

cmp dword ptr [playerstats_yenset_enable], #0
je playerstats_yenset_exit
mov rax, [rbx+30]
test rax, rax
je playerstats_yenset_exit
mov [rax+40], #9999999
playerstats_yenset_exit:

cmp dword ptr [playerstats_coinsset_enable], #0
je playerstats_coinsset_exit
mov rax, [rbx+58]
test rax, rax
je playerstats_yenset_exit
mov [rax+14], #9999999
playerstats_coinsset_exit:

cmp dword ptr [playerstats_itemsset_enable], #0
je playerstats_itemsset_loop1_exit
mov [playerstats_loop1_index], #0
mov rcx, [rbx+20]
test rcx, rcx
je playerstats_itemsset_loop1_exit
mov rcx, [rcx+8]
test rcx, rcx
je playerstats_itemsset_loop1_exit
mov [playerstats_loop1_base], rcx

playerstats_itemsset_loop1_entry:
mov rcx, [playerstats_loop1_base]
mov rdx, [playerstats_loop1_index]
mov rax, [rcx+rdx*8]
test rax, rax
je playerstats_itemsset_loop1_exit

cmp [rax+c], #600
jl playerstats_itemsset_loop1_execute
cmp [rax+c], #999
jg playerstats_itemsset_loop1_execute
jmp playerstats_itemsset_loop1_continue

playerstats_itemsset_loop1_execute:
cmp [rax+c], #60
jl playerstats_itemsset_loop1_execute2
cmp [rax+c], #69
jg playerstats_itemsset_loop1_execute2
jmp playerstats_itemsset_loop1_continue

playerstats_itemsset_loop1_execute2:
mov byte ptr [rax+14], #90

playerstats_itemsset_loop1_continue:
mov rdx, [playerstats_loop1_index]
inc rdx
mov [playerstats_loop1_index], rdx
jmp playerstats_itemsset_loop1_entry
playerstats_itemsset_loop1_exit:

cmp dword ptr [playerstats_digifarmset_enable], #0
je playerstats_digifarmset_exit
mov rax, [rbx+18]
test rax, rax
je playerstats_digifarmset_exit
mov [rax+38], (float)10800
mov [rax+44], (float)10800
mov [rax+78], (float)10800
mov [rax+e0], (float)10800
mov [rax+ec], (float)10800
mov [rax+120], (float)10800
mov [rax+188], (float)10800
mov [rax+194], (float)10800
mov [rax+1c8], (float)10800
mov [rax+230], (float)10800
mov [rax+23c], (float)10800
mov [rax+270], (float)10800
mov [rax+2d8], (float)10800
mov [rax+2e4], (float)10800
mov [rax+318], (float)10800
playerstats_digifarmset_exit:

cmp dword ptr [playerstats_playtimeset_enable], #0
je playerstats_playtimeset_exit
mov rax, [rbx+30]
test rax, rax
je playerstats_playtimeset_exit
mov [rax+38], #0
mov [rax+3c], #0
playerstats_playtimeset_exit:

mov rax, [playerstats_temp1]
mov rbx, [playerstats_temp2]
mov rcx, [playerstats_temp3]
mov rdx, [playerstats_temp4]


playerstats_originalcode:
readmem(playerstats_searchedAOB, 7)


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB:
playerstats_savedAOB:
jmp playerstats_newmem
nop
nop
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
readmem(playerstats_originalcode, 7)

unregistersymbol(playerstats_originalcode)
unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)
dealloc(playerstats_temp1)
dealloc(playerstats_temp2)
dealloc(playerstats_temp3)
dealloc(playerstats_temp4)
dealloc(playerstats_temp5)
dealloc(playerstats_loop1_index)
dealloc(playerstats_loop1_base)
dealloc(playerstats_loop1_max)"""

