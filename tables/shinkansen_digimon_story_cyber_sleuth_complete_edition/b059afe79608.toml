[[cheat]]
id = "digibank-stats-base-address-scan-to-update-view-digibank"
name = "DigiBank Stats Base Address Scan (To Update: View DigiBank)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(digibankstats_savedAOB)
label(digibankstats_returnhere)
label(digibankstats_originalcode)
label(digibankstats_exit)

label(digibankstats_update_exit)
label(digibankstats_scanrateset_exit)

registersymbol(digibankstats_originalcode)
registersymbol(digibankstats_savedAOB)

//13F47F2DA - E8 A121E3FF           - call 13F2B1480
//13F47F2DF - 4C 8B C8              - mov r9,rax
// Accesses Scan Rate
//13F47F2E2 - 66 41 83 79 02 00     - cmp word ptr [r9+02],00
//13F47F2E8 - 0F8E AC000000         - jng 13F47F39A
//13F47F2EE - 0F57 C0               - xorps xmm0,xmm0
//13F47F2F1 - 66 0F7F 44 24 60      - movdqa [rsp+60],xmm0
//13F47F2F7 - 0F57 C9               - xorps xmm1,xmm1
aobscan(digibankstats_searchedAOB, 66 41 83 79 02 00 * * * * * * 0F 57 C0)

alloc(digibankstats_newmem, 2048, digibankstats_searchedAOB)
alloc(digibankstats_temp1, 8, digibankstats_searchedAOB)
alloc(digibankstats_temp2, 8, digibankstats_searchedAOB)
alloc(digibankstats_temp3, 8, digibankstats_searchedAOB)
alloc(digibankstats_temp4, 8, digibankstats_searchedAOB)
alloc(digibankstats_temp5, 8, digibankstats_searchedAOB)


digibankstats_newmem:
mov [digibankstats_temp1], rax
mov [digibankstats_temp2], rbx
mov [digibankstats_temp3], rcx
mov [digibankstats_temp4], rdx

cmp dword ptr [digibankstats_update_enable], #0
je digibankstats_update_exit
mov [digibankstats_basepointer], r9
digibankstats_update_exit:

cmp dword ptr [digibankstats_scanrateset_enable], #0
je digibankstats_scanrateset_exit
mov word ptr [r9+2], #200
digibankstats_scanrateset_exit:

mov rax, [digibankstats_temp1]
mov rbx, [digibankstats_temp2]
mov rcx, [digibankstats_temp3]
mov rdx, [digibankstats_temp4]


digibankstats_originalcode:
readmem(digibankstats_searchedAOB, 6)


digibankstats_exit:
jmp digibankstats_returnhere


digibankstats_searchedAOB:
digibankstats_savedAOB:
jmp digibankstats_newmem
nop
digibankstats_returnhere:


[DISABLE]
digibankstats_savedAOB:
readmem(digibankstats_originalcode, 6)

unregistersymbol(digibankstats_originalcode)
unregistersymbol(digibankstats_savedAOB)

dealloc(digibankstats_newmem)
dealloc(digibankstats_temp1)
dealloc(digibankstats_temp2)
dealloc(digibankstats_temp3)
dealloc(digibankstats_temp4)
dealloc(digibankstats_temp5)"""

