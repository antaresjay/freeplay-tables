[[cheat]]
id = "activate-me-to-get-base-adress-for-pointers"
name = "Activate Me !   -->       to get base adress for Pointers"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Holly.exe
  Version: 
  Date   : 2024-03-09
  Author : LIOBOSS

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(INJECT,GameAssembly.dll,8B 47 5C 89 45 08 8D) // should be unique
alloc(newmem,$1000)
alloc(base_adress,8)

label(code)
label(return)


base_adress:
dq 0


newmem:

code:
  mov [base_adress],edi
  mov eax,[edi+5C]
  mov [ebp+08],eax
  jmp return

INJECT:
  jmp newmem
  nop
return:
registersymbol(INJECT)
registersymbol(base_adress)
[DISABLE]

INJECT:
  db 8B 47 5C 89 45 08

unregistersymbol(INJECT)
unregistersymbol(base_adress)
dealloc(newmem)
dealloc(base_adress)"""

