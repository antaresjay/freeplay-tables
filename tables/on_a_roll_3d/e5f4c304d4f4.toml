name = "[Enable Table]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(scoreAOB,8B 15 xx xx xx xx FF 15 xx xx xx xx 6A 00) // should be unique
label(scorePTR)
scoreAOB+2:
