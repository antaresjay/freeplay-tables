type = "script"
source = """
[ENABLE]

aobscan(caloriescd,C5 FA 10 46 78 C5 FA 11 40 08 48 83 C4 20 5E C3)
alloc(newmem,$1000,caloriescd)

label(code)
label(return)

newmem:
code:
  mov [rsi+78], (float)2500.0
  vmovss xmm0,[rsi+78]
  jmp return

caloriescd:
  jmp newmem
return:
registersymbol(caloriescd)

[DISABLE]

caloriescd:
  db C5 FA 10 46 78

unregistersymbol(caloriescd)
dealloc(newmem)"""
