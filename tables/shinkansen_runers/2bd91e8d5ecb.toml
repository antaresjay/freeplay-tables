[[cheat]]
id = "player-stats-base-address-scan-initialization-activate-this-first"
name = "Player Stats Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

registersymbol(playerstats_basepointer)
registersymbol(playerstatsupdate_enable)
registersymbol(playerstatsset_enable)
registersymbol(playerstatslifeset_enable)
registersymbol(playerstatsstatsset_enable)
registersymbol(playerstatsrunesset_enable)
registersymbol(playerstatscombinersset_enable)

alloc(playerstats_basepointer,4)
alloc(playerstatsupdate_enable,4)
alloc(playerstatsset_enable,4)
alloc(playerstatslifeset_enable,4)
alloc(playerstatsstatsset_enable,4)
alloc(playerstatsrunesset_enable,4)
alloc(playerstatscombinersset_enable,4)


[DISABLE]

unregistersymbol(playerstats_basepointer)
unregistersymbol(playerstatsupdate_enable)
unregistersymbol(playerstatsset_enable)
unregistersymbol(playerstatslifeset_enable)
unregistersymbol(playerstatsstatsset_enable)
unregistersymbol(playerstatsrunesset_enable)
unregistersymbol(playerstatscombinersset_enable)

dealloc(playerstats_basepointer)
dealloc(playerstatsupdate_enable)
dealloc(playerstatsset_enable)
dealloc(playerstatslifeset_enable)
dealloc(playerstatsstatsset_enable)
dealloc(playerstatsrunesset_enable)
dealloc(playerstatscombinersset_enable)"""

[[cheat]]
id = "player-stats-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Player Stats Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstatsupdate_exit)
label(playerstatsset_exit)
label(playerstatslifeset_exit)
label(playerstatsstatsset_exit)
label(playerstatsrunesset_exit)
label(playerstatscombinersset_exit)

registersymbol(playerstats_savedAOB)

aobscan(playerstats_searchedAOB,D9 80 90 00 00 00 D8 B0 8C 00 00 00)

alloc(playerstats_newmem,2048) //2kb should be enough


playerstats_newmem:
cmp dword ptr [playerstatsupdate_enable], #0
je playerstatsupdate_exit
mov [playerstats_basepointer], eax
playerstatsupdate_exit:

cmp dword ptr [playerstatsset_enable], #0
je playerstatsstatsset_exit
playerstatsstatsset_exit:

cmp dword ptr [playerstatslifeset_enable], #0
je playerstatslifeset_exit
fld [eax+8c]
fstp [eax+90]
playerstatslifeset_exit:

cmp dword ptr [playerstatsstatsset_enable], #0
je playerstatsset_exit
mov [eax+12c], (float)1.5
mov [eax+134], (float)100
mov [eax+138], (float)0
mov [eax+13c], (float)100
mov [eax+140], (float)0
//mov [eax+144], (float)100
mov [eax+148], (float)100
mov [eax+150], (float)0
mov [eax+154], (float)100
mov [eax+15c], (float)100
mov [eax+160], (float)0
mov [eax+164], (float)100
mov [eax+168], (float)100
playerstatsset_exit:

cmp dword ptr [playerstatsrunesset_enable], #0
je playerstatsrunesset_exit
mov [eax+34c], #999
mov [eax+350], #999
mov [eax+354], #999
mov [eax+358], #999
mov [eax+35c], #999
mov [eax+360], #999
mov [eax+364], #999
mov [eax+368], #999
mov [eax+36c], #999
mov [eax+370], #999
playerstatsrunesset_exit:

cmp dword ptr [playerstatscombinersset_enable], #0
je playerstatscombinersset_exit
mov [eax+1e0],#999
mov [eax+1e4],#999
playerstatscombinersset_exit:


playerstats_originalcode:
db D9 80 90 00 00 00
//fld dword ptr [eax+00000090]


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB:
playerstats_savedAOB:
jmp playerstats_newmem
nop
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
db D9 80 90 00 00 00
//fld dword ptr [eax+00000090]

unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)"""

