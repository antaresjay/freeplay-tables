[[cheat]]
id = "infinite-mood"
name = "Infinite Mood"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(INJECT,UnitSlotManager:SetMood+154,UnitSlotManager:SetMood+194,8B 00 F3 0F 10 80 AC 00 00 00) // should be unique
alloc(newmem,$1000,INJECT)

label(code)
label(return)

newmem:
mov [rax+000000AC],(float)100
code:
  movss xmm0,[rax+000000AC]
  jmp return

INJECT+02:
  jmp newmem
  nop 3
return:
registersymbol(INJECT)

[DISABLE]

INJECT+02:
  db F3 0F 10 80 AC 00 00 00

unregistersymbol(INJECT)
dealloc(newmem)"""

