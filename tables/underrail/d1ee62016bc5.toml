name = "Fast Fishing"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Underrail
  Version:
  Date   : 2025-09-17
  Author : akrylowy


  there is fishing timer address
  it holds miliseconds of time left until next tick
  tick is either 'try to find fish if one isnt hooked'
  or 'unhook currently hooked fish'

  there are 2 separate codes that modify the timer
  this makes the timer for 'looking for fish' instant
  and leaves the 'timer to unhook the fish' untouched


}

[ENABLE]

aobscan(fishingTimer,75 DD 46 34 3A 47 10) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(zero)

newmem:

code:

  fld qword ptr [zero]
  cmp al,[edi+10]
  jmp return

zero:
  dq (double)0.00

fishingTimer+01:
  jmp newmem
  nop
return:
registersymbol(fishingTimer)

