[[cheat]]
id = "grab-game-data"
name = "Grab Game Data"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//PlayerInventory.Update
//Send@FearlessRevolution|Sintrix
define(address,PlayerInventory.Update)
define(bytes,40 53 48 83 EC 30)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,PlayerInventory.Update)
registersymbol(inv)
label(code return inv)


newmem:
mov [inv],rcx

code:
  push rbx
  sub rsp,30
  jmp return

inv:
dq 0

address:
  jmp newmem
  nop
return:

[DISABLE]

address:
  db bytes


unregistersymbol(*)
dealloc(*)"""

