[[cheat]]
id = "health"
name = "----> Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[Enable]

alloc(health,32,ZAT.exe)
aobscanmodule(health_aob1,ZAT.exe,0F 2F C8 F3 0F 11 46 34 72 0E)
registersymbol(health_aob1)
label(returnhere_health)

label(ih_1) //Infinite Health
label(ih_status)
registersymbol(ih_status)

label(ik_1) //Instant Kill
label(ik_status)
registersymbol(ik_status)

label(health_orig)

health:
cmp [esi+58],1
je ih_1
jmp ik_1
//--------------------------------------------------//
ih_1:
cmp [ih_status],0
je health_orig
comiss xmm1,xmm0
mov [esi+34],(float)200
jmp returnhere_health

ih_status:
dd 0
//--------------------------------------------------//
ik_1:
cmp [ik_status],0
je health_orig
comiss xmm1,xmm0
mov [esi+34],(float)0
jmp returnhere_health

ik_status:
dd 0
//--------------------------------------------------//
health_orig:
comiss xmm1,xmm0
movss [esi+34],xmm0
jmp returnhere_health
//--------------------------------------------------//

health_aob1:
jmp health
nop
nop
nop
returnhere_health:

[Disable]

health_aob1:
db 0F 2F C8 F3 0F 11 46 34
unregistersymbol(health_aob1)
dealloc(health)

unregistersymbol(ih_status)
unregistersymbol(ik_status)"""

