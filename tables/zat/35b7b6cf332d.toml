[[cheat]]
id = "teleport"
name = "----> Teleport"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[Enable]

alloc(teleport,1024,ZAT.exe)
aobscanmodule(teleport_aob1,ZAT.exe,0F 29 43 60 F3 0F 10 44 24 24)
registersymbol(teleport_aob1)
label(returnhere_teleport)

label(saveLocation) //Save Location
label(saveLocation_status)
registersymbol(saveLocation_status)
label(saved_X)
registersymbol(saved_X)
label(saved_Z)
registersymbol(saved_Z)
label(saved_Y)
registersymbol(saved_Y)

label(goToSaved) //Go To Saved
label(goToSaved_status)
registersymbol(goToSaved_status)

label(TEAS) //Trap Enemies At Saved
label(TEAS_status)
registersymbol(TEAS_status)

label(isZombie)

//--------------------------------------------------//
teleport:
cmp [ebx+1A8],20
je isZombie
cmp [saveLocation_status],1
je saveLocation
cmp [goToSaved_status],1
je goToSaved
movaps [ebx+60],xmm0
movss xmm0,[esp+24]
jmp returnhere_teleport
//--------------------------------------------------//
saveLocation:
movaps [ebx+60],xmm0
movss xmm0,[esp+24]
fld [ebx+60]
fstp [saved_X]
fld [ebx+64]
fstp [saved_Z]
fld [ebx+68]
fstp [saved_Y]
mov [saveLocation_status],0
jmp returnhere_teleport

saveLocation_status:
dd 0

saved_X:
dd 0

saved_Z:
dd 0

saved_Y:
dd 0
//--------------------------------------------------//
goToSaved:
movaps [ebx+60],xmm0
movss xmm0,[esp+24]
fld [saved_X]
fstp [ebx+60]
fld [saved_Z]
fstp [ebx+64]
fld [saved_Y]
fstp [ebx+68]
mov [goToSaved_status],0
jmp returnhere_teleport

goToSaved_status:
dd 0
//--------------------------------------------------//
TEAS:
movaps [ebx+60],xmm0
movss xmm0,[esp+24]
fld [saved_X]
fstp [ebx+60]
fld [saved_Z]
fstp [ebx+64]
fld [saved_Y]
fstp [ebx+68]
jmp returnhere_teleport

TEAS_status:
dd 0
//--------------------------------------------------//
isZombie:
cmp [TEAS_status],0
jne TEAS
movaps [ebx+60],xmm0
movss xmm0,[esp+24]
jmp returnhere_teleport
//--------------------------------------------------//

teleport_aob1:
jmp teleport
nop
nop
nop
nop
nop
returnhere_teleport:

[Disable]

teleport_aob1:
db 0F 29 43 60 F3 0F 10 44 24 24
unregistersymbol(teleport_aob1)
dealloc(teleport)

unregistersymbol(saveLocation_status)
unregistersymbol(saved_X)
unregistersymbol(saved_Y)
unregistersymbol(saved_Z)

unregistersymbol(goToSaved_status)

unregistersymbol(TEAS_status)"""

