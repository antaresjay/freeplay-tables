[[cheat]]
id = "unlimited-items"
name = "Unlimited Items"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(items,com.massivemonster.swordscouts:Inventory:updateItemAmmo,com.massivemonster.swordscouts:Inventory:updateItemAmmo+30,89 47 3C 85 C0 7F) // should be unique
alloc(newmem,$1000,items)

label(code)
label(return)

newmem:
  sub eax,[rbp-18]
code:
  mov [rdi+3C],eax
  test eax,eax
  jmp return

items:
  jmp newmem
return:
registersymbol(items)

[DISABLE]

items:
  db 89 47 3C 85 C0

unregistersymbol(items)
dealloc(newmem)"""
