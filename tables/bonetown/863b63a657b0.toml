name = "Camera Hook"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
globalalloc(cameraBase,4)
alloc(newmem,$1000)
aobscan(cameraBaseHook,D9 02 D9 5C 24 14 D9 42 04 D9 5C 24 18 D9 42 08 D9 5C 24 1C D9 40 0C D9 5C 24 28 D9 44 24 28) // should be unique
registersymbol(cameraBaseHook)

label(skip)
label(return)

newmem:
cmp ax, 5F3C
jne skip
  mov [cameraBase], eax
skip:
  fld dword ptr [edx]
  fstp dword ptr [esp+14]
  jmp return

cameraBaseHook:
  jmp newmem
  nop
return:

[DISABLE]
cameraBaseHook:
  db D9 02 D9 5C 24 14

unregistersymbol(cameraBaseHook)
dealloc(newmem)"""

