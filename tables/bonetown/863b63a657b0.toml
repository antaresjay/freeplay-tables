//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
//Create labels
label(returnhere)
label(skip)
label(exit)
//Scan to find location for modifications
aobscanmodule(EnableVac, BoneTown.exe, 89 8D C4 07 00 00 8B 0F 89 95 C8 07 00 00 8B 57 04 89 85 CC 07 00 00 8B 47 08)
//Register symbol for location
registersymbol(EnableVac)

newmem:
cmp byte ptr [00A20000], 0         //Check to see if position is set
je skip                            //If not set then skip
cmp [ebp+1C], C8                   //Test offset 1C for player value
je skip                            //If match then skip
push ebp                           //Store ebp as we need this register
mov ebp, [ebp+00000444]            //Checking Gender Pointer
cmp byte ptr [ebp+00000128], 01    //Checking Gender Pointer
pop ebp                            //Restore ebp original value
jne skip                           //If not correct gender then skip
mov ecx,[00A20000]                 //Set NPC X
mov edx,[00A20000+04]              //Set NPC Y
mov eax,[00A20000+08]              //Set NPC Z
skip:
mov [ebp+000007C4],ecx             //Original Instruction
exit:
jmp returnhere

EnableVac:
//JMP to Custom Routine
jmp newmem
nop
returnhere:

[DISABLE]
EnableVac:
//Restore Original Instruction
mov [ebp+000007C4],ecx

//Unregister symbol
unregistersymbol(EnableVac)

//Deallocate custom routine
dealloc(newmem)"""

