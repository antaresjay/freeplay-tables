[[cheat]]
id = "untouchable"
name = "Untouchable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//|******** Author: Abystus *********|
//|********** Game: BoneTown ********|
//|********* Build: 1.1.1.0 *********|

[ENABLE]
//Allocate space for custom routine
alloc(newmem,2048)
//Allocate space for originalbytes
alloc(originaluntouchablebytes, 6)
//Register symbol for originalbytes
Registersymbol(originaluntouchablebytes)
//Scan to find hook location for jump
aobscanmodule(Untouchable, BoneTown.exe, 0F 8? ?? ?? ?? ?? 80 BE 91 04 00 00 02 75 12 80 BE 93 04 00 00 00 74 09 6A 06 6A 02 E8 ?? ?? ?? ?? 8B 8E 08 09 00 00 8B 11 8B 42 0C FF D0)
//Register symbol for hook location
registersymbol(Untouchable)
//Initialize Exit location
label(exit)

//Store origial instruction bytes in originalbytes
originaluntouchablebytes:
readmem(Untouchable, 6)

//Handle splitting shared routine
newmem:

cmp [esi+1C], C8   //Test for player
je Untouchable+A9B //If player found jump
test al, al        //Test al, al
je Untouchable+A9B //If equal jump
jmp exit           //Exit routine

//Modify hook location for jump to custom routine
Untouchable:
jmp newmem
nop
//Exit JMP location
exit:
 
[DISABLE]
//Restore hook location with originalbytes
Untouchable:
readmem(originaluntouchablebytes, 6)

//Unregister symbol
unregistersymbol(originaluntouchablebytes)
//Unregister symbol
unregistersymbol(Untouchable)
//Deallocate custom routine
dealloc(newmem)
//Deallocate originalbytes
dealloc(originaluntouchablebytes)"""

