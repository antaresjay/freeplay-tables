type = "script"
source = """
{ Game   : BoneTown.exe

Launch game (shortcut) with "-console" parameter.

after game is loaded, try these commands in console window:
you will need to alt + tab or play in a windows to see the console;
and alt + enter to switch windowed / fullscreen mode

(not tested all)

vegasbaby(gamechar); //Gives you $99999 dollars.
alloftheabove(gamechar); //Gives you 100 of each substance and $99999 dollars.
goodtimes(gamechar); //Gives you 100 of each substance.
godlike(gamechar); //Makes you invincible.
CharacterCreator.Toggle //Opens the character creator, where you can make new babes, avatars, etc.
sweetMoves(gamechar); - Unlock all powermoves
SexyTimes(gamechar); - unlocks all the sex positions.
ICanDoThisAllNight(gamechar); - Infinite Stamina

pauseDaylight(1); //Pauses day/night cycle
setdaylight(noon);
setdaylight(dusk_shadowsoff);
setdaylight(dusk_lightson);
setdaylight(midnight);
setdaylight(dawn_lightsoff);
setdaylight(dawn_shadowson);

gamechar.setFightBuff(x); //Sets your combat level to the specified number. (I.E. setFightBuff (900);)
gamechar.setSexBuff(x); //Sets your stamina level to the specified number. (I.E. setSexBuff (900);)
gamechar.modifyMoney(x,1);
gamechar.modifyHealth(1,0); (restore health)
gamechar.modifyBallLevel(x,1);
gamechar.modifyBallSize(x,1);
gamechar.modifyStamina(1,1); // in sex only if u run out stamina
gamechar.modifySpeed(3,1); // run faster
gamechar.setJumpOverride(x); (modify your jump height, without weed, add to use this for the last mission since you are stuck if you don't get all the pipes before)
x = desired value; 1 to set; 0 to add; -1 to subtract;

CharacterCreator.Toggle();

weak(GameChar); // don't know what it do lol

}

