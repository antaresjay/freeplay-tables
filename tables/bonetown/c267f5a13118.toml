[[cheat]]
id = "getbaseaddrfrommoney-original"
name = "GetBaseAddrFromMoney (Original)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : BoneTown.exe
  This script finds the main stat base address using the money display
}

[ENABLE]

aobscanmodule(GetBaseAddrFromMoney,BoneTown.exe,8B 81 7C 04 00 00 C3) // should be unique
alloc(newmem,$1000)
alloc(baseAddr,8)
registersymbol(baseAddr)

label(code)
label(return)

baseAddr:
  dq 0

newmem:
mov [baseAddr],ecx

code:
  mov eax,[ecx+0000047C]
  jmp return

GetBaseAddrFromMoney:
  jmp newmem
  nop
return:
registersymbol(GetBaseAddrFromMoney)

[DISABLE]

GetBaseAddrFromMoney:
  db 8B 81 7C 04 00 00

unregistersymbol(baseAddr)
unregistersymbol(GetBaseAddrFromMoney)
dealloc(newmem)
dealloc(baseAddr)

{
// ORIGINAL CODE - INJECTION POINT: BoneTown.exe+1D83E0

BoneTown.exe+1D83D4: 5D                 - pop ebp
BoneTown.exe+1D83D5: C2 08 00           - ret 0008
BoneTown.exe+1D83D8: CC                 - int 3 
BoneTown.exe+1D83D9: CC                 - int 3 
BoneTown.exe+1D83DA: CC                 - int 3 
BoneTown.exe+1D83DB: CC                 - int 3 
BoneTown.exe+1D83DC: CC                 - int 3 
BoneTown.exe+1D83DD: CC                 - int 3 
BoneTown.exe+1D83DE: CC                 - int 3 
BoneTown.exe+1D83DF: CC                 - int 3 
// ---------- INJECTING HERE ----------
BoneTown.exe+1D83E0: 8B 81 7C 04 00 00  - mov eax,[ecx+0000047C]
// ---------- DONE INJECTING  ----------
BoneTown.exe+1D83E6: C3                 - ret 
BoneTown.exe+1D83E7: CC                 - int 3 
BoneTown.exe+1D83E8: CC                 - int 3 
BoneTown.exe+1D83E9: CC                 - int 3 
BoneTown.exe+1D83EA: CC                 - int 3 
BoneTown.exe+1D83EB: CC                 - int 3 
BoneTown.exe+1D83EC: CC                 - int 3 
BoneTown.exe+1D83ED: CC                 - int 3 
BoneTown.exe+1D83EE: CC                 - int 3 
BoneTown.exe+1D83EF: CC                 - int 3 
}"""

