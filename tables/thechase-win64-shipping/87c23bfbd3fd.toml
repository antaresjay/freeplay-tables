[[cheat]]
id = "player-base"
name = "Player_Base"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : KurtzPel: Bringer of Chaos
  Version:
  Date   : 2019-10-11
  Author : Anjinggila

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(myPlayer,TheChase-Win64-Shipping.exe,f3 44 0f 59 83 ? ? ? ? f3 44 0f 10 1d) // should be unique
alloc(newmem,$1000,myPlayer)
alloc(showStat,8)

label(code)
label(return)

newmem:
  mov [showStat],rbx

code:
  readmem(myPlayer,9)
  jmp return

myPlayer:
  jmp newmem
  nop 4
return:
registersymbol(showStat)
registersymbol(code)
registersymbol(myPlayer)

[DISABLE]

myPlayer:
  readmem(code,9)

unregistersymbol(showStat)
unregistersymbol(code)
unregistersymbol(myPlayer)
dealloc(showStat)
dealloc(newmem)"""

