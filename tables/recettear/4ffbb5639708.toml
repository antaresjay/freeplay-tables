[[cheat]]
id = "price-auto-haggle"
name = "Price, Auto Haggle"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : recettear.exe
  Version: 1.08 steam
  Date   : 2015-08-08
  Author : seronis
}

[ENABLE]
aobscanmodule(hookSelectCustomer,recettear.exe,89 0D 70 B5 30 07 0F)
aobscanmodule(hookSaleSetup,recettear.exe,FF 05 84 B5 30 07 5E C9 C3 55 8B EC 51)
aobscanmodule(hookBuySetup,recettear.exe, FF 05 84 B5 30 07 5E C9 C3 55 8B EC 83)

registersymbol(hookSelectCustomer)
registersymbol(hookSaleSetup)
registersymbol(hookBuySetup)

registersymbol(iPatience)

alloc(newmem,$2000)

//functions
label(codeSelectCustomer)
label(_hookSelectCustomer)

label(codeSale)
label(saleHaggleOffer)
label(saleFinalOffer)
label(saleCleanUp)
label(_hookSaleSetup)

label(codeBuy)
label(buyHaggleOffer)
label(buyFinalOffer)
label(buyCleanUp)
label(_hookBuySetup)

//variables
label(iPatience)


// Hook points

hookSelectCustomer:
  jmp codeSelectCustomer
  nop
_hookSelectCustomer:

hookSaleSetup:
  jmp codeSale
  nop
_hookSaleSetup:

hookBuySetup:
  jmp codeBuy
  nop
_hookBuySetup:


newmem:
//variables
iPatience:
  dd 0


//functions

codeSelectCustomer:
  mov [recettear.exe+6F0B570],ecx //original code

  //Compute Custumer Patience
  pushad
  pushfd

  call recettear.exe+60F16
  mov [iPatience],eax

  popfd
  popad
  jmp _hookSelectCustomer


codeSale:
  inc [recettear.exe+6F0B584]
  pushad
  pushfd
  //if patience limit is reached ...
  mov eax,[recettear.exe+6F0B584]
  cmp eax,[iPatience]
  je saleFinalOffer
saleHaggleOffer:
  mov eax,[recettear.exe+6F0B580]
  dec eax
  mov [recettear.exe+1C6BB8],eax
  jmp saleCleanUp
saleFinalOffer:
  //assigns to the most extreme accepted value
  mov eax,[recettear.exe+6F0B574]
  mov [recettear.exe+1C6BB8],eax
saleCleanUp:
  popfd
  popad
  jmp _hookSaleSetup


codeBuy:
  inc [recettear.exe+6F0B584]
  pushad
  pushfd
  //if patience limit is reached ...
  mov eax,[recettear.exe+6F0B584]
  cmp eax,[iPatience]
  je buyFinalOffer
buyHaggleOffer:
  mov eax,[recettear.exe+6F0B580]
  inc eax
  mov [recettear.exe+1C6BB8],eax
  jmp buyCleanUp
buyFinalOffer:
  //assigns to the most extreme accepted value
  mov eax,[recettear.exe+6F0B574]
  mov [recettear.exe+1C6BB8],eax
buyCleanUp:
  popfd
  popad
  jmp _hookBuySetup




[DISABLE]
//code from here till the end of the code will be used to disable the cheat
hookBuySetup:
  db FF 05 84 B5 30 07

hookSaleSetup:
  db FF 05 84 B5 30 07

hookSelectCustomer:
  db 89 0D 70 B5 30 07


unregistersymbol(iPatience)
unregistersymbol(hookBuySetup)
unregistersymbol(hookSaleSetup)
unregistersymbol(hookSelectCustomer)
dealloc(newmem)

{
