[[cheat]]
id = "p1-inf-health-instant-win"
name = "P1 Inf Health + Instant Win"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(HealthAOB,Injustice2.exe,F3 ** ** ** ** ** ** ** FF ** 3B ** ** 7C) // should be unique
alloc(newmem,$1000,HealthAOB)
alloc(one_hit,1)
alloc(infhp,1)
registersymbol(one_hit)
registersymbol(infhp)
label(aicheck)
label(playercheck)
label(code)
label(return)
label(p1)
label(p2)
newmem:
  cmp byte ptr [rdi+18],0
  je playercheck
  cmp byte ptr [rdi+18],1
  je aicheck
  jmp code
aicheck:
  cmp byte ptr [one_hit],1
  jne code
  jmp p2
playercheck:
  cmp byte ptr [infhp],1
  jne code
  jmp p1
p1:
  mov [rax+00000A44],(float)1
  addss xmm6,[rax+00000A44]
  jmp return
p2:
  mov [rax+00000A44],(float)0
  addss xmm6,[rax+00000A44]
  jmp return
code:
  addss xmm6,[rax+00000A44]
  jmp return
HealthAOB:
  jmp newmem
  nop 3
return:
registersymbol(HealthAOB)
[DISABLE]
HealthAOB:
  db F3 0F 58 B0 44 0A 00 00
unregistersymbol(HealthAOB)
dealloc(newmem)
unregistersymbol(one_hit)
unregistersymbol(infhp)
dealloc(one_hit,1)
dealloc(infhp,1)"""

