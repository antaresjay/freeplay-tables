[[cheat]]
id = "p1-max-multimeter-p2-no-multimeter"
name = "P1 Max Multimeter - P2 no Multimeter"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(MultimeterAOB,Injustice2.exe,0F 2E ** ** ** ** ** 7A ** 75 ** 33 ** 48 83 ** ** 5B)
alloc(newmem,$1000,MultimeterAOB)
alloc(maxp1,1)
alloc(zerop2,1)
registersymbol(maxp1)
registersymbol(zerop2)
label(multip1check)
label(multip2check)
label(code)
label(return)
label(p1multi)
label(p2multi)

newmem:
  cmp [rcx+08],00
  je multip1check
  cmp [rcx+08],01
  je multip2check
  jmp code

multip1check:
  cmp byte ptr [maxp1],1
  jne code
  jmp p1multi

multip2check:
  cmp byte ptr [zerop2],1
  jne code
  jmp p2multi

p1multi:
  mov [rbx+00000334],(float)1
  ucomiss xmm0,[rbx+00000334]
  jmp return

p2multi:
  mov [rbx+00000334],(float)0
  ucomiss xmm0,[rbx+00000334]
  jmp return

code:
  ucomiss xmm0,[rbx+00000334]
  jmp return

MultimeterAOB:
  jmp newmem
  nop 2
return:
registersymbol(MultimeterAOB)

[DISABLE]

MultimeterAOB:
  db 0F 2E 83 34 03 00 00

unregistersymbol(MultimeterAOB)
dealloc(newmem)
unregistersymbol(maxp1)
unregistersymbol(zerop2)
dealloc(maxp1,1)
dealloc(zerop2,1)"""

