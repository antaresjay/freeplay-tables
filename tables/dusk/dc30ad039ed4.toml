[[cheat]]
id = "inf-health"
name = "Inf Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
usemono()
define(address,PlayerHealthManagement:takedamage)
define(bytes,55 48 8B EC 48 81 EC F0 00 00 00)

[ENABLE]


assert(address,bytes)
alloc(newmem,$100,PlayerHealthManagement:takedamage)

label(code)
label(return)

newmem:
xorpd xmm1,xmm1

code:
  push rbp
  mov rbp,rsp
  sub rsp,000000F0
  jmp return

address:
  jmp newmem
  nop
  nop
  nop
  nop
  nop
  nop
return:

[DISABLE]

address:
  db bytes

dealloc(newmem)"""

