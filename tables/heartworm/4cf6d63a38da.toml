[[cheat]]
id = "game-manager-ctrl-numpad-1"
name = "Game Manager (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Heartworm.exe
// Author            : ndck76
// Executable Version: 2020.3.41.6620
// Game Version      : v1.1.0f3
// Script Date       : 2025-10-04


[ENABLE]

aobscanregion(gamepaused,GameManager:Update,GameManager:Update+300,0FB686xxxx000085xx0Fxxxxxxxxxx48xxxxxxxxxxxx48xxxx48xxxxxx48xxxxxxxxxxxx48xxxx) //GameManager:Update+27
alloc(newmem,$1000,gamepaused)
alloc(data,8)
alloc(gamepausedbkp,7)
registersymbol(data)
registersymbol(gamepaused)
registersymbol(gamepausedbkp)
label(code)
label(return)

gamepausedbkp:
  readmem(gamepaused,7)

newmem:
  mov [data],rsi

code:
  readmem(gamepaused,7)
  jmp return

gamepaused:
  jmp newmem
  nop 2
return:

[DISABLE]

gamepaused:
  readmem(gamepausedbkp,7)

unregistersymbol(*)
dealloc(*)"""

