// Game Executable   : U9-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 4.27.2.0
// Game Version      : Build.16069251
// Script Date       : 2024-10-19


[ENABLE]

aobscanmodule(enemy,U9-Win64-Shipping.exe,F3xxxxxxxxxxxxxx488BxxE8xxxxxxxx8Bxxxxxxxxxx89) // should be unique
alloc(newmem,$1000,enemy)
alloc(enemybkp,8)
registersymbol(enemy)
registersymbol(enemybkp)
label(code)
label(return)

enemybkp:
  readmem(enemy,8)

newmem:
  mov [rax+00000098],(float)1

code:
  readmem(enemy,8)
  jmp return

enemy:
  jmp newmem
  nop 3
return:

[DISABLE]

enemy:
  readmem(enemybkp,8)

unregistersymbol(*)
dealloc(*)"""
