[[cheat]]
id = "firearm-progressive-reloader-ctrl-numpad-1-shoot-to-populate-values"
name = "Firearm Progressive Reloader (Ctrl + Numpad 1) {Shoot to populate values}"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
define(address,SurvivalTemplatePro.WieldableSystem.FirearmReloaderBehaviour:get_IsMagazineEmpty+b)
define(bytes,48 63 46 4C 85 C0)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,SurvivalTemplatePro.WieldableSystem.FirearmReloaderBehaviour:get_IsMagazineEmpty+b)

label(code)
label(return)
label(data2)
registersymbol(data2)

newmem:

code:
  mov [data2],rsi
  movsxd  rax,dword ptr [rsi+4C]
  test eax,eax
  jmp return

data2:
  db

address:
  jmp newmem
  nop
return:

[DISABLE]

address:
  db bytes
  // movsxd  rax,dword ptr [rsi+4C]
  // test eax,eax

dealloc(*)
unregistersymbol(*)"""

