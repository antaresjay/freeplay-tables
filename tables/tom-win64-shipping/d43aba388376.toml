[[cheat]]
id = "get-player"
name = "Get Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(healthcd,ToM-Win64-Shipping.exe,48 8B 07 FF 90 F0 09 00 00 48 8D 8B 1C 05 00 00) // should be unique
alloc(newmem,$1000,healthcd)

label(staminacd)
label(code)
label(return)

label(playerPtr)
registersymbol(playerPtr)

label(healthFlag)
registersymbol(healthFlag)

label(staminaFlag)
registersymbol(staminaFlag)

newmem:
  mov [playerPtr], rdi
  push rbx
  cmp dword ptr [healthFlag], 1
  jne staminacd

  mov rbx, [rdi+538] // Health Offset?
  test rbx, rbx
  je staminacd

  fld dword ptr [rbx+B8] // Max Health?
  fstp dword ptr [rbx+BC] // Current Health ??

staminacd:
  cmp dword ptr [staminaFlag], 1
  jne code

  mov rbx, [rdi+540] // Stamina Offset?
  test rbx, rbx
  je code

  fld dword ptr [rbx+C8] // Max Stamina??
  fstp dword ptr [rbx+10C] // Stamina??

code:
  pop rbx
  mov rax,[rdi]
  call qword ptr [rax+000009F0]
  lea rcx,[rbx+0000051C]
  jmp return

playerPtr:
dq 0

healthFlag:
dd 0

staminaFlag:
dd 0

healthcd:
  jmp far newmem
  nop
  nop
return:
registersymbol(healthcd)

[DISABLE]

healthcd:
  db 48 8B 07 FF 90 F0 09 00 00 48 8D 8B 1C 05 00 00

unregistersymbol(healthcd)
unregistersymbol(playerPtr)
unregistersymbol(healthFlag)
unregistersymbol(staminaFlag)
dealloc(newmem)

