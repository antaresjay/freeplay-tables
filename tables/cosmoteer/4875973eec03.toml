type = "script"
source = """
[ENABLE]

aobscan(moniysig,8B 58 18 03 9E 84 02 00 00) // should be unique
alloc(newmem,$1000,moniysig)

label(code)
label(return)

newmem:
  mov [rax+18],#9999999
code:
  mov ebx,[rax+18]
  add ebx,[rsi+00000284]
  jmp return

moniysig:
  jmp newmem
