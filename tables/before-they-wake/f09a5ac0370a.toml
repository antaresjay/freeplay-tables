[[cheat]]
id = "audio-meter-system-ctrl-numpad-1"
name = "Audio Meter System (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Before They Wake.exe
// Author            : ndck76
// Executable Version: 2022.3.23.46071
// Game Version      : v1.0.0
// Script Date       : 2024-08-26


[ENABLE]

aobscanregion(metervalue,AudioMeterSystem:CheckEventTrigger,AudioMeterSystem:CheckEventTrigger+150,F30F1086xxxx0000F3xxxxxxF3xxxxxxxxF3xxxxxxF3xxxxxxxxF3xxxxxxF2xxxxxx66xxxxxx7Axx77xx0Fxxxxxxxxxxxx85xx75xx) //AudioMeterSystem:CheckEventTrigger+f
alloc(newmem,$1000,metervalue)
alloc(data,8)
alloc(metervaluebkp,8)
registersymbol(data)
registersymbol(metervalue)
registersymbol(metervaluebkp)
label(code)
label(return)

metervaluebkp:
  readmem(metervalue,8)

newmem:
  mov [data],rsi

code:
  readmem(metervalue,8)
  jmp return

metervalue:
  jmp newmem
  nop 3
return:

[DISABLE]

metervalue:
  readmem(metervaluebkp,8)

unregistersymbol(*)
dealloc(*)"""

