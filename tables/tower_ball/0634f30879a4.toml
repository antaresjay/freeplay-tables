[[cheat]]
id = "disable-anti-cheat"
name = "Disable Anti-Cheat"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
CodeStage.AntiCheat.Common.ACTk.GenerateBugReport:
db C3

CodeStage.AntiCheat.Common.ACTk.ConstructErrorForSupport:
db C3

CodeStage.AntiCheat.Detectors.InjectionDetector.Dispose:
db C3

System.ComponentModel.License.Dispose:
db C3

CodeStage.AntiCheat.Detectors.ObscuredCheatingDetector.TriggerDetection:
db C3


[DISABLE]
CodeStage.AntiCheat.Detectors.ObscuredCheatingDetector.TriggerDetection:
db 41 56

System.ComponentModel.License.Dispose:
db 48 83 EC 38

CodeStage.AntiCheat.Detectors.InjectionDetector.Dispose:
db 48 83 EC 38

CodeStage.AntiCheat.Common.ACTk.GenerateBugReport:
db 48 89 5C 24 08

CodeStage.AntiCheat.Common.ACTk.ConstructErrorForSupport:
db 48 89 5C 24 08"""

[[cheat]]
id = "infinite-weapon-range"
name = "* Infinite Weapon Range"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
//Send
[ENABLE]
aobscanmodule(Range,GameAssembly.dll,0F 10 40 14 8B 40 24)
alloc(newmem,$1000,Range)
label(code return)


newmem:
mov [rax+14],#0

code:
  movups xmm0,[rax+14]
  mov eax,[rax+24]
  jmp return

Range:
  jmp newmem
  nop 2
return:
registersymbol(Range)

[DISABLE]

Range:
  db 0F 10 40 14 8B 40 24

unregistersymbol(*)
dealloc(*)"""

