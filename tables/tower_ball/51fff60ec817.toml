id = "hit-all-targets"
name = "Hit All Targets"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@ModEngine
[ENABLE]

aobscanmodule(MaxTargets,GameAssembly.dll,89 83 F8 00 00 00 48 85)
alloc(newmem,$1000,MaxTargets)
label(code return)


newmem:

code:
  mov [rbx+000000F8],#1000
  jmp return

MaxTargets:
  jmp newmem
  nop
return:
registersymbol(MaxTargets)

[DISABLE]

MaxTargets:
  db 89 83 F8 00 00 00

unregistersymbol(*)
dealloc(*)"""
