[[cheat]]
id = "data-base-address-scan-initialization-activate-this-first"
name = "Data Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(data_basepointer)
registersymbol(data_update_enable)
registersymbol(data_set_enable)

registersymbol(data_1_basepointer)
registersymbol(data_1_id_value)
