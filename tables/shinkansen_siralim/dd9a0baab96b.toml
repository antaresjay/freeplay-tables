label(artifactstats_update_exit)
label(artifactstats_set_exit)

registersymbol(artifactstats_savedAOB)

//005099A9 - 59                    - pop ecx
//005099AA - C3                    - ret
//005099AB - DD 07                 - fld qword ptr [edi]
//005099AD - 3B FD                 - cmp edi,ebp
//005099AF - 5F                    - pop edi
//005099B0 - DD 1E                 - fstp qword ptr [esi]
//005099B2 - 5E                    - pop esi
//005099B3 - 5D                    - pop ebp
aobscan(artifactstats_searchedAOB, DD 07 3B FD 5F DD 1E)

alloc(artifactstats_newmem, 2048)


artifactstats_newmem:
cmp dword ptr [edi-18], #3131944971
jne artifactstats_set_exit
cmp dword ptr [esp+4], #2
jne artifactstats_set_exit

cmp dword ptr [artifactstats_update_enable], #0
je artifactstats_update_exit
mov [artifactstats_basepointer], edi
artifactstats_update_exit:

cmp dword ptr [artifactstats_set_enable], #0
je artifactstats_set_exit
artifactstats_set_exit:


artifactstats_originalcode:
db DD 07 3B FD 5F
//fld qword ptr [edi]
//cmp edi,ebp
//pop edi


artifactstats_exit:
jmp artifactstats_returnhere


artifactstats_searchedAOB:
artifactstats_savedAOB:
jmp artifactstats_newmem
artifactstats_returnhere:


[DISABLE]
artifactstats_savedAOB:
db DD 07 3B FD 5F
//fld qword ptr [edi]
//cmp edi,ebp
//pop edi

unregistersymbol(artifactstats_savedAOB)

dealloc(artifactstats_newmem)"""

