define(address,Service.ZoneHappiness.ZoneHappinessServiceImpl:Tick+4b)
define(bytes,4C 8B A8 A8 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Service.ZoneHappiness.ZoneHappinessServiceImpl:Tick+4b)

label(code)
label(return)

newmem:
push rax
