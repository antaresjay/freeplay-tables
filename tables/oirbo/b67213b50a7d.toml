[[cheat]]
id = "character-controller-ctrl-numpad-1"
name = "Character Controller (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Oirbo.exe
// Author            : ndck76
// Executable Version: 2021.2.14.40468
// Game Version      : v1.0.1
// Script Date       : 2025-02-13


define(address,Assets.Scripts.Core.Character.CharacterController:Update+a07)
define(bytes,F3 0F 10 8E 50 02 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Assets.Scripts.Core.Character.CharacterController:Update+a07)

label(code)
label(return)
label(data)
registersymbol(data)

newmem:

code:
  mov [data],rsi
  movss xmm1,[rsi+00000250]
  jmp return

data:
  db

address:
  jmp newmem
  nop 3
return:

[DISABLE]

address:
  db bytes
  // movss xmm1,[rsi+00000250]

dealloc(*)
unregistersymbol(*)"""

