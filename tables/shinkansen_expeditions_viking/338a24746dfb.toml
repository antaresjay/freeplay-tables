[[cheat]]
id = "scenecharacter-base-address-scan-initialization-activate-this-first"
name = "SceneCharacter Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(SceneCharacter_basepointer)
registersymbol(SceneCharacter_update_enable)
registersymbol(SceneCharacter_set_enable)
registersymbol(SceneCharacter_hpset_enable)
registersymbol(SceneCharacter_actionsset_enable)

alloc(SceneCharacter_basepointer, 8)
alloc(SceneCharacter_update_enable, 4)
alloc(SceneCharacter_set_enable, 4)
alloc(SceneCharacter_hpset_enable, 4)
alloc(SceneCharacter_actionsset_enable, 4)


[DISABLE]
unregistersymbol(SceneCharacter_basepointer)
unregistersymbol(SceneCharacter_update_enable)
unregistersymbol(SceneCharacter_set_enable)
unregistersymbol(SceneCharacter_hpset_enable)
unregistersymbol(SceneCharacter_actionsset_enable)

dealloc(SceneCharacter_basepointer)
dealloc(SceneCharacter_update_enable)
dealloc(SceneCharacter_set_enable)
dealloc(SceneCharacter_hpset_enable)
dealloc(SceneCharacter_actionsset_enable)"""

[[cheat]]
id = "scenecharacter-base-address-scan-to-activate-battle-to-update-battle"
name = "SceneCharacter Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(SceneCharacter_savedAOB)
label(SceneCharacter_returnhere)
label(SceneCharacter_originalcode)
label(SceneCharacter_exit)

label(SceneCharacter_update_exit)
label(SceneCharacter_set_exit)
label(SceneCharacter_hpset_exit)
label(SceneCharacter_actionsset_exit)

registersymbol(SceneCharacter_savedAOB)

//1DE938F5 - 48 83 EC 08           - sub rsp,08
//1DE938F9 - 48 8B F1              - mov rsi,rcx
// Character:SceneCharacter:Update+c
//1DE938FC - 48 8B 8E D0000000     - mov rcx,[rsi+000000D0]
//1DE93903 - 33 D2                 - xor edx,edx
//1DE93905 - 48 83 EC 20           - sub rsp,20
//1DE93909 - 49 BB B09D350500000000 - mov r11,0000000005359DB0 : [EC8B4855]
//1DE93913 - 41 FF D3              - call r11d
//1DE93916 - 48 83 C4 20           - add rsp,20
//1DE9391A - 85 C0                 - test eax,eax
//1DE9391C - 74 1B                 - je 1DE93939
//1DE9391E - 48 8B 86 D0000000     - mov rax,[rsi+000000D0]
//1DE93925 - 48 8B C8              - mov rcx,rax
aobscan(SceneCharacter_searchedAOB, 48 8B 8E D0 00 00 00 33 D2 48 83 EC 20 * * * * * * * * * * 41 FF D3 48 83 C4 20 85 C0 74 1B)

alloc(SceneCharacter_newmem, 2048, SceneCharacter_searchedAOB)
alloc(SceneCharacter_temp1, 8, SceneCharacter_searchedAOB)
alloc(SceneCharacter_temp2, 8, SceneCharacter_searchedAOB)
alloc(SceneCharacter_temp3, 8, SceneCharacter_searchedAOB)
alloc(SceneCharacter_temp4, 8, SceneCharacter_searchedAOB)
alloc(SceneCharacter_temp5, 8, SceneCharacter_searchedAOB)


SceneCharacter_newmem:
mov [SceneCharacter_temp1], rax
mov [SceneCharacter_temp2], rbx
mov [SceneCharacter_temp3], rcx
mov [SceneCharacter_temp4], rdx

mov rbx, [rsi+20]
test rbx, rbx
je SceneCharacter_actionsset_exit
cmp dword ptr [rbx+98], #1
je SceneCharacter_actionsset_exit

cmp dword ptr [SceneCharacter_update_enable], #0
je SceneCharacter_update_exit
cmp byte ptr [rsi+119], #1
jne SceneCharacter_update_exit
mov [SceneCharacter_basepointer], rsi
SceneCharacter_update_exit:

cmp dword ptr [SceneCharacter_set_enable], #0
je SceneCharacter_set_exit
SceneCharacter_set_exit:

cmp dword ptr [SceneCharacter_hpset_enable], #0
je SceneCharacter_hpset_exit
mov rbx, [rsi+78]
test rbx, rbx
je SceneCharacter_hpset_exit
mov [rbx+64], #9999
SceneCharacter_hpset_exit:

cmp dword ptr [SceneCharacter_actionsset_enable], #0
je SceneCharacter_actionsset_exit
mov rbx, [rsi+70]
test rbx, rbx
je SceneCharacter_actionsset_exit
mov [rbx+88], #0
mov byte ptr [rbx+8c], #0
mov byte ptr [rbx+8c], #0
mov byte ptr [rbx+8d], #0
mov byte ptr [rbx+8e], #0
SceneCharacter_actionsset_exit:

mov rax, [SceneCharacter_temp1]
mov rbx, [SceneCharacter_temp2]
mov rcx, [SceneCharacter_temp3]
mov rdx, [SceneCharacter_temp4]


SceneCharacter_originalcode:
db 48 8B 8E D0 00 00 00
//mov rcx,[rsi+000000D0]


SceneCharacter_exit:
jmp SceneCharacter_returnhere


SceneCharacter_searchedAOB:
SceneCharacter_savedAOB:
jmp SceneCharacter_newmem
nop
nop
SceneCharacter_returnhere:


[DISABLE]
SceneCharacter_savedAOB:
db 48 8B 8E D0 00 00 00
//mov rcx,[rsi+000000D0]

unregistersymbol(SceneCharacter_savedAOB)

dealloc(SceneCharacter_newmem)
dealloc(SceneCharacter_temp1)
dealloc(SceneCharacter_temp2)
dealloc(SceneCharacter_temp3)
dealloc(SceneCharacter_temp4)
dealloc(SceneCharacter_temp5)"""

