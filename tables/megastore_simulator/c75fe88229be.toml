name = "Infinite Money"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(cashcash, SoftCurrencyDisplay:UpdateMoney+180, SoftCurrencyDisplay:UpdateMoney+468, 83 39 00 F3 0F 10 40 3C F3 0F 5A C0 F2 0F 5A E8 F3 0F 11 6D A8)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov [rcx+3C], (float)999999.0

code:
  cmp dword ptr [rcx],00
  movss xmm0,[rax+3C]
  cvtss2sd xmm0,xmm0
  cvtsd2ss xmm5,xmm0
  jmp return

cashcash:
  jmp far newmem
  nop
  nop
return:
registersymbol(cashcash)

[DISABLE]

cashcash:
  db 83 39 00 F3 0F 10 40 3C F3 0F 5A C0 F2 0F 5A E8

unregistersymbol(cashcash)
dealloc(newmem)"""
