type = "script"
source = """
{ Game   : Torchlight.exe
  Version: 1.15 (GOG)
  Date   : 2017-07-07
  Author : Squall8
}

[ENABLE]

aobscanmodule(infhealth,Torchlight.exe,D9 9E 94 03 00 00 E8 D0)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  cmp [esi+24C],0
  jne return

code:
  fstp dword ptr [esi+00000394]
  jmp return

infhealth:
  jmp newmem
  nop
return:
registersymbol(infhealth)

[DISABLE]

