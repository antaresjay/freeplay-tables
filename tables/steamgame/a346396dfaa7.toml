[[cheat]]
id = "inf-heals-keys"
name = "inf Heals / keys"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : SteamGame.exe
  Version: 1.0.20.1525
  Date   : 2025-03-22
  Author : Oyyzj

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(Keys,SteamGame.exe,0F 4F F8 2B C7) // should be unique
alloc(newmem,$100,Keys)
registersymbol(Keys)
label(code)
label(return)
label(rKeys)
registersymbol(rKeys)
label(bHeals)
registersymbol(bHeals)
label(All)
label(Heals)
label(Heals_lockpick)
label(Heals_heal)
newmem:
  cmp [bHeals],1
  je Heals
  cmp [bHeals],2
  je All
code:
  pop rsi
  readmem(Keys,5)
  jmp return
All:
  cmovg edi,eax
  add eax,1
  sub eax,1
  jmp return
Heals:
  push rsi
  mov rsi,[rcx+10]
  cmp [rsi+34],6B636F4C
  je Heals_lockpick
  cmp [rsi+34],6B64654D
  je Heals_heal
  jmp code
Heals_lockpick:
  pop rsi
  cmovg edi,eax
  add eax,1
  sub eax,1
  jmp return
Heals_heal:
  pop rsi
  cmovg edi,eax
  add eax,1
  sub eax,1
  jmp return
rKeys:
  readmem(Keys,5)
bHeals:
  dd 1
Keys:
  jmp newmem
return:


[DISABLE]

Keys:
  readmem(rKeys,5)

unregistersymbol(*)
dealloc(*)"""

