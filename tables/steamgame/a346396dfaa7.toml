type = "script"
source = """
{ Game   : SteamGame.exe
  Version: 1.0.20.1525
  Date   : 2025-03-12
  Author : Oyyzj

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(Usables,SteamGame.exe,0F 4F 78 48 29 78 48) // should be unique
alloc(newmem,$100,Usables)
registersymbol(Usables)
label(code)
label(return)
label(rUsables)
registersymbol(rUsables)
newmem:

code:
  cmovg edi,[rax+48]
  add [rax+48],edi
  sub [rax+48],edi
  jmp return
rUsables:
  readmem(Usables,7)
Usables:
  jmp newmem
  db 90 90
return:


[DISABLE]

Usables:
