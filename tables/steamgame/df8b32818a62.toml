[[cheat]]
id = "weapon-ammo-scan"
name = "Weapon ammo scan"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game attach: SteamGame.exe
  Game Name: Haydee 2
  Version: 1.0.1.1034
  Date   : 2020-11-26
  Author : Oyyzj

  - Script will scan for ammo on any weapon at 4th slot. put your gun there!
  - Use the dropdown menu to get the MAX ammo possible, amount won't be show.
  - DO NOT RELOAD your cheated gun !
}

[ENABLE]

aobscanmodule(INJECT,SteamGame.exe,CC 8B 41 58 C3 CC) // should be unique
alloc(newmem,$100,INJECT)
alloc(pINJECT,4)
label(code)
label(return)

newmem:
cmp [rcx+1C],61684369
 jne code
  mov [pINJECT],rcx
code:
  db 8B 41 58 C3 CC
  jmp return

INJECT+01:
  jmp newmem
return:
registersymbol(INJECT)
registersymbol(pINJECT)
[DISABLE]

INJECT+01:
  db 8B 41 58 C3 CC

unregistersymbol(INJECT)
unregistersymbol(pINJECT)
dealloc(pINJECT)
dealloc(newmem)"""

