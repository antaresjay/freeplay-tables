[[cheat]]
id = "highscore-editor-ctrl-numpad-5"
name = "Highscore Editor (Ctrl + Numpad 5)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : nsgear.exe
// Author            : ndck76
// Game Version      : v1.2.0
// Script Date       : 2025-10-26


[ENABLE]

aobscanmodule(highscore,nsgear.exe,8BxxxxC3xxxxxxxxxxxxxxxxxxxxxx40534883xxxx488Bxxxxxxxxxx488Bxx33) // should be unique
alloc(newmem,$1000,highscore)
alloc(data4,8)
registersymbol(data4)

label(code)
label(return)

newmem:
  push rax
  lea rax,[rax+rdx*8]
  mov [data4],rax
  pop rax

code:
  mov eax,[rax+rdx*8]
  ret 
  int 3 
  jmp return

highscore:
  jmp newmem
return:
registersymbol(highscore)

[DISABLE]

highscore:
  db 8B 04 D0 C3 CC

unregistersymbol(*)
dealloc(*)"""

