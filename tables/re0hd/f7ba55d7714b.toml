[[cheat]]
id = "playtime"
name = "Playtime"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(Playtime_aob,re0hd.exe,F3 0F 11 46 3C 72)
registersymbol(Playtime_aob)
registersymbol(Playtime_temp)
alloc(Playtime,1024)
alloc(Playtime_temp,4)

label(return)

Playtime:
  movss [esi+3C],xmm0
  mov [Playtime_temp],esi
  jmp return

Playtime_aob:
  jmp Playtime
return:

[DISABLE]
Playtime_aob:
  db F3 0F 11 46 3C
unregistersymbol(Playtime_aob)
unregistersymbol(Playtime_temp)
dealloc(Playtime)
dealloc(Playtime_temp)"""

