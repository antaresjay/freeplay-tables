[[cheat]]
id = "infhealth"
name = "InfHealth"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(InfHealth_aob,re0hd.exe,89 81 30 10 00 00 C2)
aobscanmodule(CurePoison_aob,re0hd.exe,83 8F C4 68 00 00 01 FF)
registersymbol(InfHealth_aob)
registersymbol(CurePoison_aob)
alloc(InfHealth,1024)

label(Rebecca1)
label(Billy1)
label(CurePoison)
label(Rebecca2)
label(Billy2)
label(Origin)
label(exit)
label(return1)
label(return2)

InfHealth:
  cmp [ecx+100],3
  je Rebecca1
  cmp [ecx+100],5
  jne Origin
  jmp Billy1
Rebecca1:
  cmp [ecx+00001030],#150
  jae return1
  mov [ecx+00001030],#150
  jmp return1
Billy1:
  cmp [ecx+00001030],#250
  jae return1
  mov [ecx+00001030],#250
  jmp return1
Origin:
  mov [ecx+00001030],eax
  jmp return1
CurePoison:
  cmp [edi+100],3
  je Rebecca2
  cmp [edi+100],5
  jne exit
  jmp Billy2
Rebecca2:
  cmp [edi+000068C4],0
  je return2
  mov [edi+000068C4],0
  jmp return2
Billy2:
  cmp [edi+000068C4],0
  je return2
  mov [edi+000068C4],0
  jmp return2
exit:
  mov [edi+000068C4],01
  jmp return2

InfHealth_aob:
  jmp InfHealth
  nop
return1:

CurePoison_aob:
  jmp CurePoison
  nop
  nop
return2:

[DISABLE]
InfHealth_aob:
  db 89 81 30 10 00 00
CurePoison_aob:
  db 83 8F C4 68 00 00 01

unregistersymbol(InfHealth_aob)
unregistersymbol(CurePoison_aob)
dealloc(InfHealth)"""

[[cheat]]
id = "infammo"
name = "InfAmmo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(InfAmmo_aob,re0hd.exe,89 70 04 0F B7 C3)
registersymbol(InfAmmo_aob)
alloc(InfAmmo,1024)

label(code)
label(return)

InfAmmo:
  cmp [eax+04],esi
  jae code
  mov [eax+04],esi
code:
  movzx eax,bx
  jmp return

InfAmmo_aob:
  jmp InfAmmo
  nop
return:

[DISABLE]
InfAmmo_aob:
  db 89 70 04 0F B7 C3

unregistersymbol(InfAmmo_aob)
dealloc(InfAmmo)"""

[[cheat]]
id = "inventoryeditor"
name = "InventoryEditor"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(Inventory_aob,re0hd.exe,8B 6C 24 10 F3 0F 7E 44 24 1C)
registersymbol(Inventory_aob)
registersymbol(Inventory_Temp1)
registersymbol(Inventory_Temp2)
alloc(Inventory,1024)
alloc(Inventory_Temp1,4)
alloc(Inventory_Temp2,4)

label(Temp_Rebecca)
label(Temp_Billy)
label(exit)
label(return)

Inventory:
  mov ebp,[esp+10]
  cmp [ebp+68],0
  je Temp_Rebecca
  cmp [ebp+68],#15
  je Temp_Rebecca
  cmp [ebp+68],1
  je Temp_Billy
  cmp [ebp+68],#16
  jne exit
  jmp Temp_Billy
Temp_Rebecca:
  mov [Inventory_Temp1],ebp
  jmp exit
Temp_Billy:
  mov [Inventory_Temp2],ebp
exit:
  movq xmm0,[esp+1C]
  jmp return

Inventory_aob:
  jmp Inventory
return:

[DISABLE]
Inventory_aob:
  db 8B 6C 24 10 F3 0F 7E 44 24 1C

unregistersymbol(Inventory_aob)
unregistersymbol(Inventory_Temp1)
unregistersymbol(Inventory_Temp2)
dealloc(Inventory)"""

