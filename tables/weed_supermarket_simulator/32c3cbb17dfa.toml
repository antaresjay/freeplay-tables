[[cheat]]
id = "store"
name = "Store"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(modsss, DreamWayGames.WeedShop.SmokingWeedController:Update+4, DreamWayGames.WeedShop.SmokingWeedController:Update+117, 83 39 00 F3 0F 10 80 FC 00 00 00 F3 0F 5A C0)
alloc(newmem,$1000)

label(code)
label(return)
label(alwsys)
registersymbol(alwsys)

newmem:
  cmp dword ptr [alwsys], 1
  jne code

  mov [rcx+FC], (float)1.0
code:
  cmp dword ptr [rcx],00
  movss xmm0,[rax+000000FC]
  cvtss2sd xmm0,xmm0
  jmp return

alwsys:
dd 0

modsss:
  jmp far newmem
  nop
return:
registersymbol(modsss)

[DISABLE]

modsss:
  db 83 39 00 F3 0F 10 80 FC 00 00 00 F3 0F 5A C0

unregistersymbol(modsss)
unregistersymbol(alwsys)
dealloc(newmem)"""

