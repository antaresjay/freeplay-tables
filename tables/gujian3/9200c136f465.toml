"Gujian3.exe"+136A93: C7 02 03 00 00 00        -  mov [rdx],00000003
"Gujian3.exe"+136A99: 48 8B 40 50              -  mov rax,[rax+50]
// ---------- INJECTING HERE ----------
"Gujian3.exe"+136A9D: 48 8B 0C 01              -  mov rcx,[rcx+rax]
