[[cheat]]
id = "hook-player-exp-ptrs"
name = "Hook Player & Exp Ptrs"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(PLAYER,Gujian3.exe,48 8B 0C 01 B8 01 00 00 00 48 89 4A 18 C3 CC CC CC CC CC 40) // should be unique
alloc(newmem,$1000,"Gujian3.exe"+136A9D)

label(code)
label(return)

label(PlayerPtr)
registersymbol(PlayerPtr)

label(exp)
label(ExpPtr)
registersymbol(ExpPtr)

label(PlayerPtr1)
registersymbol(PlayerPtr1)
label(PlayerPtr2)
registersymbol(PlayerPtr2)
label(PlayerPtr3)
registersymbol(PlayerPtr3)
label(PlayerPtr4)
registersymbol(PlayerPtr4)
label(PlayerPtr5)
registersymbol(PlayerPtr5)
label(PlayerPtr6)
registersymbol(PlayerPtr6)
label(PlayerPtr7)
registersymbol(PlayerPtr7)
label(PlayerPtr8)
registersymbol(PlayerPtr8)
label(PlayerPtr9)
registersymbol(PlayerPtr9)

label(Temp)
registersymbol(Temp)

label(MonsterPtr)
registersymbol(MonsterPtr)

label(NewMemPtr)
registersymbol(NewMemPtr)

label(codeAA8)

newmem:
  jmp short code
  // rcx ~ PlayerPtr
  // rax ~ property offset
  // HP offset
  cmp rax, 0xAA8
  jne short exp

  // actor ptr
\tcmp [rcx+0x10], 0
  jz short codeAA8

  // refresh Temp ~ ptr to player 0
  mov rax, PlayerPtr
  mov [Temp], rax

  mov rax, [rcx+0x10]
  // templateID
  cmp byte ptr [rax+0x08], 0x09
  // max 9
  jg short monster

  mov rax, [rax+0x08]
  dec al
  // min 0
\tjs short codeAA8
  jz short skip

  // *8
  //lea rax, [rax*8]
  shl ax, 3
  add [Temp], eax

skip:
  mov rax, [Temp]
  mov [rax], rcx

  jmp short codeAA8

exp:
  // exp offset
  cmp rax, 0x98
  jne short code

  mov [ExpPtr], rcx

  jmp short code

monster:
  mov [MonsterPtr], rcx

codeAA8:
  mov rax, 0xAA8

code:
  mov rcx,[rcx+rax]
  mov eax,00000001
  jmp return

// Team ptrs
PlayerPtr:
PlayerPtr1:
  dq 0
PlayerPtr2:
  dq 0
PlayerPtr3:
  dq 0
PlayerPtr4:
  dq 0
PlayerPtr5:
  dq 0
PlayerPtr6:
  dq 0
PlayerPtr7:
  dq 0
PlayerPtr8:
  dq 0
PlayerPtr9:
  dq 0

MonsterPtr:
  dq 0

ExpPtr:
  dq 0

Temp:
  dq PlayerPtr

NewMemPtr:
  dq newmem

PLAYER:
  jmp newmem
  nop 4

return:
registersymbol(PLAYER)

[DISABLE]

PLAYER:
  db 48 8B 0C 01 B8 01 00 00 00

unregistersymbol(PlayerPtr1)
unregistersymbol(PlayerPtr2)
unregistersymbol(PlayerPtr3)
unregistersymbol(PlayerPtr4)
unregistersymbol(PlayerPtr5)
unregistersymbol(PlayerPtr6)
unregistersymbol(PlayerPtr7)
unregistersymbol(PlayerPtr8)
unregistersymbol(PlayerPtr9)

unregistersymbol(Temp)

unregistersymbol(MonsterPtr)

unregistersymbol(NewMemPtr)

unregistersymbol(PlayerPtr)
unregistersymbol(ExpPtr)
unregistersymbol(PLAYER)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: "Gujian3.exe"+136A9D

"Gujian3.exe"+136A89: CC                       -  int 3
