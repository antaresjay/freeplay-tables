[[cheat]]
id = "instant-built"
name = "Instant Built"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(rre3,66 0F D6 45 E0 8B 50 08) // should be unique
alloc(newmem,$100)
alloc(setV,4,rre3)

setV:
  dq (double)100

label(code)
label(return)

newmem:


code:
  //cvtsd2ss xmm0,[setV]
  mov [ebp-20],setV
  //movq [ebp-20],xmm0
  jmp return

rre3:
  jmp newmem
return:
registersymbol(rre3)
registersymbol(setV)

[DISABLE]

rre3:
  db 66 0F D6 45 E0

unregistersymbol(rre3)
dealloc(newmem)
unregistersymbol(setV)
dealloc(setV)"""
