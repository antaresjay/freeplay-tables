source = """
[ENABLE]

aobscanmodule(Set_Timer_AOB,DiceKingdom-Win64-Shipping.exe,F3 0F 11 83 D0 04 00 00 76)
alloc(newmem,$1000,Set_Timer_AOB)

label(code)
