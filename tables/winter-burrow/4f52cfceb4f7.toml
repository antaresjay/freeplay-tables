[[cheat]]
id = "the-weekday-manager-ctrl-numpad-1"
name = "The Weekday Manager (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Winter Burrow.exe
// Author            : ndck76
// Executable Version: 2022.3.62.28864
// Game Version      : Build.20740651
// Script Date       : 2025-11-15


[ENABLE]

aobscanregion(daytime,SurvivalEngine.TimeClockUIAnalog:Update,SurvivalEngine.TimeClockUIAnalog:Update+100,F30F10xxxxF3xxxxxx66xxxxxxxxxxxxxxF2xxxxxxF3xxxxxxxxF3xxxxxxxxF3xxxxxx48xxxxF2xxxxxxF2xxxxxx48xxxxxxxx9049BBxxxxxxxxxxxx0000) //SurvivalEngine.TimeClockUIAnalog:Update+32
alloc(newmem,$1000,daytime)
alloc(data5,8)
alloc(daytimebkp,5)
registersymbol(data5)
registersymbol(daytime)
registersymbol(daytimebkp)
label(code)
label(return)

daytimebkp:
  readmem(daytime,5)

newmem:
  mov [data5],rdi

code:
  readmem(daytime,5)
  jmp return

daytime:
  jmp newmem
return:

[DISABLE]

daytime:
  readmem(daytimebkp,5)

unregistersymbol(*)
dealloc(*)"""

