[[cheat]]
id = "enemy-base-address-scan-initialization-activate-this-first"
name = "Enemy Base Address Scan Initialization (Activate This First)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Enemy_basepointer)
registersymbol(Enemy_update_enable)
registersymbol(Enemy_set_enable)
