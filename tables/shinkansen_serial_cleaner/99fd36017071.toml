[[cheat]]
id = "enemy-base-address-scan-to-activate-start-level-to-update-restart-level"
name = "Enemy Base Address Scan (To Activate: Start Level, To Update: Restart Level)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Enemy_savedAOB)
label(Enemy_returnhere)
label(Enemy_originalcode)
label(Enemy_exit)

label(Enemy_update_exit)
label(Enemy_set_exit)
label(Enemy_sensorsset_exit)
label(Enemy_reactiontimeset_exit)
label(Enemy_speedset_exit)

registersymbol(Enemy_savedAOB)

//1053D5DA - 57                    - push edi
//1053D5DB - E8 3030EBF4           - call 053F0610
// Enemy:Start+1b
//1053D5E0 - 83 C4 10              - add esp,10
//1053D5E3 - 89 47 44              - mov [edi+44],eax
//1053D5E6 - BA 40574A0E           - mov edx,0E4A5740 : [0C47A558]
//1053D5EB - 83 EC 0C              - sub esp,0C
//1053D5EE - 57                    - push edi
//1053D5EF - E8 6435EBF4           - call 053F0B58
aobscan(Enemy_searchedAOB, 83 C4 10 89 47 44 * * * * * 83 EC 0C)

alloc(Enemy_newmem, 2048, Enemy_searchedAOB)
alloc(Enemy_temp1, 4, Enemy_searchedAOB)
alloc(Enemy_temp2, 4, Enemy_searchedAOB)
alloc(Enemy_temp3, 4, Enemy_searchedAOB)
alloc(Enemy_temp4, 4, Enemy_searchedAOB)
alloc(Enemy_temp5, 4, Enemy_searchedAOB)


Enemy_newmem:
mov [Enemy_temp1], eax
mov [Enemy_temp2], ebx
mov [Enemy_temp3], ecx
mov [Enemy_temp4], edx

cmp dword ptr [Enemy_update_enable], #0
je Enemy_update_exit
mov [Enemy_basepointer], edi
Enemy_update_exit:

cmp dword ptr [Enemy_set_enable], #0
je Enemy_set_exit
Enemy_set_exit:

cmp dword ptr [Enemy_sensorsset_enable], #0
je Enemy_sensorsset_exit
mov byte [edi+6a], #0
mov byte [edi+6b], #0
mov byte [edi+76], #0
Enemy_sensorsset_exit:

cmp dword ptr [Enemy_reactiontimeset_enable], #0
je Enemy_reactiontimeset_exit
mov [edi+5c], (float)9999
mov [edi+60], (float)0
mov [edi+64], (float)0
mov [edi+6c], (float)0
Enemy_reactiontimeset_exit:

cmp dword ptr [Enemy_speedset_enable], #0
je Enemy_speedset_exit
mov [edi+54], (float)1
mov [edi+58], (float)1
Enemy_speedset_exit:

mov eax, [Enemy_temp1]
mov ebx, [Enemy_temp2]
mov ecx, [Enemy_temp3]
mov edx, [Enemy_temp4]


Enemy_originalcode:
db 83 C4 10 89 47 44
//add esp,10
//mov [edi+44],eax


Enemy_exit:
jmp Enemy_returnhere


Enemy_searchedAOB:
Enemy_savedAOB:
jmp Enemy_newmem
nop
Enemy_returnhere:


[DISABLE]
Enemy_savedAOB:
db 83 C4 10 89 47 44
//add esp,10
//mov [edi+44],eax

unregistersymbol(Enemy_savedAOB)

dealloc(Enemy_newmem)
dealloc(Enemy_temp1)
dealloc(Enemy_temp2)
dealloc(Enemy_temp3)
dealloc(Enemy_temp4)
dealloc(Enemy_temp5)"""

