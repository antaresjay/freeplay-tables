[[cheat]]
id = "savedata-base-address-scan-initialization-activate-this-first"
name = "SaveData Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(SaveData_basepointer)
registersymbol(SaveData_update_enable)
registersymbol(SaveData_set_enable)

alloc(SaveData_basepointer, 4)
alloc(SaveData_update_enable, 4)
alloc(SaveData_set_enable, 4)


[DISABLE]
unregistersymbol(SaveData_basepointer)
unregistersymbol(SaveData_update_enable)
unregistersymbol(SaveData_set_enable)

dealloc(SaveData_basepointer)
dealloc(SaveData_update_enable)
dealloc(SaveData_set_enable)"""

[[cheat]]
id = "savedata-base-address-scan-to-activate-view-wardrobe-to-update-view-wardrobe"
name = "SaveData Base Address Scan (To Activate: View Wardrobe, To Update: View Wardrobe)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(SaveData_savedAOB)
label(SaveData_returnhere)
label(SaveData_originalcode)
label(SaveData_exit)

label(SaveData_update_exit)
label(SaveData_set_exit)

registersymbol(SaveData_savedAOB)

//0509E6BC - E8 EFDBFCFF           - call 0506C2B0
//0509E6C1 - 8B 40 08              - mov eax,[eax+08]
// UiWardrobeWindow:Refresh+164
//0509E6C4 - 8B 40 30              - mov eax,[eax+30]
//0509E6C7 - 85 C0                 - test eax,eax
//0509E6C9 - 7E 1F                 - jle 0509E6EA
//0509E6CB - 8B 46 0C              - mov eax,[esi+0C]
//0509E6CE - 3D 05000000           - cmp eax,00000005
aobscan(SaveData_searchedAOB, 8B 40 30 85 C0 7E 1F)

alloc(SaveData_newmem, 2048, SaveData_searchedAOB)


SaveData_newmem:
cmp dword ptr [SaveData_update_enable], #0
je SaveData_update_exit
mov [SaveData_basepointer], eax
SaveData_update_exit:

cmp dword ptr [SaveData_set_enable], #0
je SaveData_set_exit
mov [eax+30], #999
SaveData_set_exit:


SaveData_originalcode:
db 8B 40 30 85 C0
//mov eax,[eax+30]
//test eax,eax


SaveData_exit:
jmp SaveData_returnhere


SaveData_searchedAOB:
SaveData_savedAOB:
jmp SaveData_newmem
SaveData_returnhere:


[DISABLE]
SaveData_savedAOB:
db 8B 40 30 85 C0
//mov eax,[eax+30]
//test eax,eax

unregistersymbol(SaveData_savedAOB)

dealloc(SaveData_newmem)"""

