[[cheat]]
id = "resource-points"
name = "Resource Points"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobScanRegion(ResourceAOB, F1_2018.exe+4000000, F1_2018.exe+6FFFFFF, 8B 58 70 33 58 68 48)
alloc(ResourceMem,128,"F1_2018.exe"+53B4420)
label(Return)
label(Code)
label(AddCode)
label(SubtractCode)
label(AddResource)
registersymbol(AddResource)
registersymbol(ResourceAOB)

ResourceMem:
  cmp dword ptr [AddResource+0C],0
  je AddCode
  mov ebx,[AddResource+0C]
  mov [AddResource+4],0
  mov [AddResource+8],0
  mov [AddResource+0C],0
  xor ebx,[rax+70]
  mov [rax+68],ebx
  jmp Code

AddCode:
  cmp dword ptr [AddResource+4],0
  je SubtractCode
  mov ebx,[rax+70]
  xor ebx,[rax+68]
  add ebx,[AddResource+4]
  mov [AddResource+4],0
  mov [AddResource+8],0
  mov [AddResource+0C],0
  xor ebx,[rax+70]
  mov [rax+68],ebx
  jmp Code

SubtractCode:
  cmp dword ptr [AddResource+8],0
  je Code
  mov ebx,[rax+70]
  xor ebx,[rax+68]
  sub ebx,[AddResource+8]
  mov [AddResource+4],0
  mov [AddResource+8],0
  mov [AddResource+0C],0
  xor ebx,[rax+70]
  mov [rax+68],ebx

Code:
  mov ebx,[rax+70]
  xor ebx,[rax+68]
  mov [AddResource],ebx
  jmp Return

AddResource:
  dd 0

ResourceAOB:
  jmp ResourceMem
  nop
Return:

[DISABLE]
ResourceAOB:
  mov ebx,[rax+70]
  xor ebx,[rax+68]
unregistersymbol(AddResource)
unregistersymbol(ResourceAOB)
dealloc(ResourceMem)"""

