[[cheat]]
id = "get-fleet-base-addr-select-ship-to-reload-fleet-ap-health"
name = "Get Fleet Base Addr (Select Ship to Reload Fleet AP/Health)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(shipBase,83 EC 04 8B 45 08 8B 40 2C 89 45 F8 E8)
alloc(newmem,$1000)

label(ShpBaseR)
label(ShpBaseC)
label(ShpBaser)

newmem:
  push ecx
  mov ecx,[ebp+08]
  mov [ShpBaser] , ecx
  pop ecx
  mov eax,[ebp+20]
  cmp byte ptr [eax+3B8],#256
  jne ShpBaseC
  push ebx
  mov ebx, [ShpBaser]
  mov [ebx+2C] , #2
  mov [ebx+14] , #6
  pop ebx
  mov eax,[ebp+08]
  mov eax,[eax+2C]
  jmp ShpBaseR


ShpBaseC:
  mov eax,[ebp+08]
  mov eax,[eax+2C]
  jmp ShpBaseR

ShpBaser:
 dd 0

shipBase+3:
  jmp newmem
  nop
ShpBaseR:
registersymbol(shipBase)
registersymbol(ShpBaser)

[DISABLE]
shipBase+3:
  db 8B 45 08 8B 40 2C
unregistersymbol(shipBase)
unregistersymbol(ShpBaser)
dealloc(newmem)"""

