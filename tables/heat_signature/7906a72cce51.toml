source = """
[ENABLE]


aobscanmodule(oxygencd,Heat_Signature.exe,F2 0F 10 0B F2 0F 5C C8 F2 0F 11 0B B8 FF FF FF 00 03 84 24 BC)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:

  mov [ebx], 0
  mov [ebx+4], 40590000
  movsd xmm1,[ebx]
  subsd xmm1,xmm0
