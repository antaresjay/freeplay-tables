name = "Get Stats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048,"records.Update"+41)
label(returnhere)
label(originalcode)
label(exit)
label(recordsBaseAddr)
registersymbol(recordsBaseAddr)

newmem:
mov [recordsBaseAddr],rbx

originalcode:
movss [rbx+54],xmm0

exit:
jmp returnhere

recordsBaseAddr:
dd 0

"records.Update"+41:
jmp newmem
returnhere:

