type = "script"
source = """
[ENABLE]
aobscanmodule(PlayerControllerAOB,$process,?? 8B 04 ?? ?? 85 ?? 0F 84 ?? ?? ?? ?? ?? 8B ?? ?? 48 85 C9 0F 84)
alloc(newmem,$1000,PlayerControllerAOB)

label(PlayerControllerPtr)
label(PlayerControllerBkp)
label(return)

newmem:
  mov rdx,PlayerControllerPtr
  mov [rdx+08],r8 // LocalPlayer
  readmem(PlayerControllerAOB+0D,4)
  mov [rdx+00],rcx // PlayerController
  test rcx,rcx
  jmp return
PlayerControllerBkp:
  readmem(PlayerControllerAOB+0D,7)
  jmp return

align 10
PlayerControllerPtr:
  dq 0
  dq 0

PlayerControllerAOB+0D:
  jmp newmem
  nop 2
return:
registersymbol(PlayerControllerAOB)
registersymbol(PlayerControllerBkp)
registersymbol(PlayerControllerPtr)

[DISABLE]
PlayerControllerAOB+0D:
  readmem(PlayerControllerBkp,7)
unregistersymbol(PlayerControllerAOB)
unregistersymbol(PlayerControllerBkp)
unregistersymbol(PlayerControllerPtr)
dealloc(newmem)

