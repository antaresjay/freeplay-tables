[[cheat]]
id = "hero"
name = "Hero"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(_o,89 48 38 49 8B CD 66 66)
alloc(_0,8)
alloc(newmem,$1000,_o)
label(return)
registersymbol(_o _0)
newmem:
  mov [_0],rax
  mov [rax+38],ecx
  mov rcx,r13
  jmp return
_o:
  jmp newmem
  nop
return:
[DISABLE]
dealloc(*)
unregistersymbol(*)
_o:
  db 89 48 38 49 8B CD"""

