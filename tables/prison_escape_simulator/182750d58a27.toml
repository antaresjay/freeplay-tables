source = """
[ENABLE]

aobscanmodule(energy,GameAssembly.dll,F3 0F 10 70 28 F3 0F 5C)
alloc(newmem,$1000,energy)

label(code)
label(return)

newmem:
  mov [rax+28], (float)90
