[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(HP,F3 41 0F 11 6F 30 F3 41 0F 10 47)
alloc(newmem,$1000,HP)

label(code)
label(return)
label(enemy)

registersymbol(ohk)

newmem:

  push r12
  mov r12,[pMain]
  mov r12,[r12+20]
  mov r12,[r12+38]
  cmp r12,r15
  pop r12
  jne enemy
  movss xmm5,[r15+34]
  jmp code

enemy:
  cmp byte ptr [ohk],00
  je code
  xorps xmm5,xmm5

code:
  movss [r15+30],xmm5
  jmp return

ohk:
  db 0

HP:
  jmp newmem
  nop
return:
registersymbol(HP)

[DISABLE]

HP:
  db F3 41 0F 11 6F 30

unregistersymbol(*)
dealloc(newmem)"""

