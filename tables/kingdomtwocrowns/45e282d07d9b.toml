[[cheat]]
id = "find-player-pointer-pick-up-drop-a-coin"
name = "Find Player pointer (pick up/drop a coin ;)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

// aobscan(Coins,89 46 44 8B 46 20 83) // should be unique
aobscan(Coins,89 46 44 8B 46 20 83 EC 08 6A) // should be unique
alloc(newmem,$1000)
globalalloc(player_ptr,4)
registersymbol(inf_money)

label(inf_money)
label(original_code)
label(special)
label(special2)
label(return)
label(safe_return)

newmem:
  // if max coin amount not 1000 skip
  pushfd
  cmp [esi+2c],#1000
  jne original_code
  // else record player pointer
  mov [player_ptr],esi
  // if inf money
  cmp [inf_money], 0
  je original_code
  jmp special

original_code:
  mov [esi+44],eax
  mov eax,[esi+20]
  jmp safe_return

special:
  mov [esi+44],eax
  cmp [esi+44], #5
  jg special2
  mov [esi+44], #20

special2:
  mov eax,[esi+20]
  jmp safe_return


safe_return:
  popfd
  jmp return

inf_money:
  dd 0

Coins:
  jmp newmem
  nop
return:
registersymbol(Coins)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
Coins:
  db 89 46 44 8B 46 20

unregistersymbol(Coins)
unregistersymbol(inf_money)
dealloc(newmem)
dealloc(player_ptr)

{
// ORIGINAL CODE - INJECTION POINT: 453B1E5C

453B1E3B: E8 DC F4 48 BF        -  call 0484131C
