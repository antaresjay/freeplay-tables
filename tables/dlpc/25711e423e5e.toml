[[cheat]]
id = "duel-results"
name = "Duel Results"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[enable]
aobscanmodule(duelresult_aob,duel.dll,49 03 C3 44 89 42 FC 66 66 0F 1F 84 00 00 00 00 00 0F B7 08 48 8D 52 04 48 8D 40 02 89 4A FC 49 FF C8)
registersymbol(duelresult_aob)
alloc(newmem,$1000,duel.dll)


newmem:
add rax,r11
mov [rdx-04],r8d

mov rcx,2710

mov byte ptr [r11+6C],19
mov [r11+88],cx
mov [r11+8C],cx
mov [r11+98],cx
mov [r11+9C],cx
mov [rax+00],cx

mov r11,["duel.dll"+7B4368]
mov [r11+3578],1

lea r11,[mem]
xor rcx,rcx

mov [r11+94],cx

loop_start:
mov cx,[r11+r8*2]
cmp [rax+r8*2],cx
jae continue
mov [rax+r8*2],cx
continue:
dec r8
jne loop_start

mov r11,["duel.dll"+7B4318]//793320
mov r8d,3D
jmp return

mem:
db 10 27 10 27 10 27 00 00 00 00 00 00 19 00 19 00
db 19 00 19 00 19 00 19 00 19 00 19 00 19 00 19 00
db 19 00 19 00 19 00 19 00 19 00 19 00 19 00 19 00
db 19 00 19 00 19 00 19 00 19 00 19 00 19 00 19 00
db 19 00 19 00 19 00 19 00 19 00 19 00 19 00 19 00
db 19 00 19 00 19 00 19 00 19 00 19 00 19 00 19 00
db 19 00 19 00 19 00 19 00 19 00 19 00 19 00 19 00
db 19 00 19 00 19 00 19 00 19 00 19 00 19 00 19 00

duelresult_aob:
jmp newmem
nop
nop
return:


[disable]
duelresult_aob:
db 49 03 C3 44 89 42 FC
//add rax,r11
//mov [rdx-04],r8d

unregistersymbol(duelresult_aob)
dealloc(newmem)"""

