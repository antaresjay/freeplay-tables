[[cheat]]
id = "in-game-controller-ctrl-numpad-2-will-activate-during-game-play"
name = "In Game Controller (Ctrl + Numpad 2) {Will activate during game play}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Soul Demon Hunters.exe
// Author            : ndck76
// Executable Version: 2022.3.62.28864
// Game Version      : v1.0.1
// Script Date       : 2026-04-26


[ENABLE]

aobscanmodule(seconds,GameAssembly.dll,F3xxxxxxxxF3xxxxxxxxxxxxxx0Fxxxx76xxF3xxxxxxF3xxxxxxxx5E) //InGameController.Update
alloc(newmem,$1000)
alloc(data2,8)
alloc(secondsbkp,5)
registersymbol(data2)
registersymbol(seconds)
registersymbol(secondsbkp)
label(code)
label(return)

secondsbkp:
  readmem(seconds,5)

newmem:
  mov [data2],esi

code:
  readmem(seconds,5)
  jmp return

seconds:
  jmp newmem
return:

[DISABLE]

seconds:
  readmem(secondsbkp,5)

unregistersymbol(*)
dealloc(*)"""

