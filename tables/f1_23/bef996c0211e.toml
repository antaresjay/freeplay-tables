[[cheat]]
id = "engine-power"
name = "Engine Power"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobScanModule(BHPAOB,F1_23.exe, C5 FA 59 83 7C 25 00 00)
alloc(BHPMem,512,BHPAOB)
label(Return)
label(CPUCode)
label(BHPRate)
label(BHPCPURate)
registersymbol(BHPRate)
registersymbol(BHPCPURate)
registersymbol(BHPAOB)

BHPMem:
  vmulss xmm0,xmm0,[rbx+0000257C]
  mov rax,[rbx+8]
  cmp dword ptr [rax+F0],1
  je CPUCode
  vmulss xmm0,xmm0,[BHPRate]
  jmp Return

CPUCode:
  vmulss xmm0,xmm0,[BHPCPURate]
  jmp Return

BHPRate:
  dd 3F800000

BHPCPURate:
  dd 3F800000

BHPAOB:
  jmp BHPMem
  nop 3
Return:

[DISABLE]
BHPAOB:
  db C5 FA 59 83 7C 25 00 00
unregistersymbol(BHPRate)
unregistersymbol(BHPCPURate)
unregistersymbol(BHPAOB)
dealloc(BHPMem)"""

