source = """
[ENABLE]
aobScanModule(GripAOB,F1_23.exe, C4 A1 7A 11 84 B6 D0 05 00 00)
aobScanModule(TimeAOB,F1_23.exe, 49 8B 5E 30 49 8B 76 38 48 39 F3)
