[[cheat]]
id = "career"
name = "Career"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobScanModule(PerkFundAOB,F1_23.exe, 48 8B 89 B8 02 00 00 31 C0)
aobScanModule(TeamMoneyAOB,F1_23.exe, 48 8B 89 98 02 00 00 31 C0)
aobScanModule(ResourceAOB,F1_23.exe, 48 8B 00 8B 68 04)
aobScanModule(ResourceAddAOB,F1_23.exe, 4A 8D 0C C9 48 39 C1 74 54)
aobScanModule(RnDAOB,F1_23.exe, 48 8B 83 98 00 00 00 80 78 F8 03 75)
aobScanModule(RivalryAOB,F1_23.exe, 48 8B 56 30 41 8B 45 00)
aobScanModule(TAcclaimAOB,F1_23.exe, 49 8D 57 10 C4 C1 7A 10 47 38)
alloc(CareerMem,1024,ResourceAOB)
label(PerkFundReturn)
label(TeamMoneyReturn)
label(ResourceReturn)
label(ResourceAddReturn)
label(RnDReturn)
label(RivalryReturn)
label(TAcclaimReturn)
label(DAcclaimReturn)
label(PerkFundCode)
label(TeamMoneyCode)
label(ResourceCode)
label(ResourceAddCode)
label(ResourceAddCode2)
label(ResourceAddCPUCode)
label(RnDCode)
label(RivalryCode)
label(TAcclaimCode)
label(DAcclaimCode)
label(CareerData)
label(ResourceRate)
label(ResourceCPURate)
label(RnDEnable)
registersymbol(CareerData)
registersymbol(ResourceRate)
registersymbol(ResourceCPURate)
registersymbol(RnDEnable)
registersymbol(PerkFundAOB)
registersymbol(TeamMoneyAOB)
registersymbol(ResourceAOB)
registersymbol(ResourceAddAOB)
registersymbol(RnDAOB)
registersymbol(RivalryAOB)
registersymbol(TAcclaimAOB)

CareerMem:

PerkFundCode:
  mov [CareerData+10], rcx
  add eax,[rcx+10]
  add rcx,58
  jmp PerkFundReturn

TeamMoneyCode:
  mov [CareerData], rcx
  add eax,[rcx+10]
  add rcx,58
  jmp TeamMoneyReturn

ResourceCode:
  mov rax,[rax]
  mov [CareerData+20], rax
  mov ebp,[rax+04]
  jmp ResourceReturn

ResourceAddCode:
  test r8d,r8d
  js ResourceAddCode2
  cvtsi2sd xmm0,r8d
  mov rsi,[CareerData+20]
  cmp rsi,rax
  jne ResourceAddCPUCode
  mulsd xmm0,[ResourceRate]
  cvtsd2si r8d,xmm0
  xorps xmm0,xmm0
  jmp ResourceAddCode2

ResourceAddCPUCode:
  mulsd xmm0,[ResourceCPURate]
  cvtsd2si r8d,xmm0
  xorps xmm0,xmm0

ResourceAddCode2:
  add r8d,[rax+04]
  xor esi,esi
  jmp ResourceAddReturn

RnDCode:
  mov rax,[rbx+00000098]
  cmp dword ptr [RnDEnable],1
  jne RnDReturn
  mov rcx,r15d
  and rcx,1
  jz RnDReturn
  mov byte ptr [rax-08],03
  jmp RnDReturn

RivalryCode:
  mov [CareerData+50], r13
  mov rdx,[rsi+30]
  mov eax,[r13+00]
  jmp RivalryReturn

TAcclaimCode:
  lea rdx,[r15+10]
  vmovss xmm0,[r15+38]
  mov [CareerData+40], r15
  jmp TAcclaimReturn

DAcclaimCode:
  vmovss xmm0,[rcx+30]
  mov [CareerData+30], rcx
  jmp DAcclaimReturn

ResourceRate:
  dq 3FF0000000000000

ResourceCPURate:
  dq 3FF0000000000000

RnDEnable:
  dd 00000000

CareerData:
  dd 0

PerkFundAOB+199:
  jmp PerkFundCode
  nop 2
PerkFundReturn:

TeamMoneyAOB+199:
  jmp TeamMoneyCode
  nop 2
TeamMoneyReturn:

ResourceAOB:
  jmp ResourceCode
  nop
ResourceReturn:

ResourceAddAOB+C:
  jmp ResourceAddCode
  nop
ResourceAddReturn:

RnDAOB:
  jmp RnDCode
  nop 2
RnDReturn:

RivalryAOB:
  jmp RivalryCode
  nop 3
RivalryReturn:

TAcclaimAOB:
  jmp TAcclaimCode
  nop 5
TAcclaimReturn:

TAcclaimAOB+A8:
  jmp DAcclaimCode
DAcclaimReturn:

[DISABLE]
PerkFundAOB+199:
  db 03 41 10 48 83 C1 58
TeamMoneyAOB+199:
  db 03 41 10 48 83 C1 58
ResourceAOB:
  db 48 8B 00 8B 68 04
ResourceAddAOB+C:
  db 44 03 40 04 31 F6
RnDAOB:
  db 48 8B 83 98 00 00 00
RivalryAOB:
  db 48 8B 56 30 41 8B 45 00
TAcclaimAOB:
  db 49 8D 57 10 C4 C1 7A 10 47 38
TAcclaimAOB+A8:
  db C5 FA 10 41 30
unregistersymbol(CareerData)
unregistersymbol(ResourceRate)
unregistersymbol(ResourceCPURate)
unregistersymbol(RnDEnable)
unregistersymbol(PerkFundAOB)
unregistersymbol(TeamMoneyAOB)
unregistersymbol(ResourceAOB)
unregistersymbol(ResourceAddAOB)
unregistersymbol(RnDAOB)
unregistersymbol(RivalryAOB)
unregistersymbol(TAcclaimAOB)
dealloc(CareerMem)"""

