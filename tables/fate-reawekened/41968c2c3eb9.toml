source = """
define(address,Tableflip.MenuPlayer:LoadSaveCharacter+13c)
define(bytes,41 0F B6 97 94 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000)

label(code)
label(return)

alloc(play,4)
registersymbol(play)

newmem:

code:
  mov [play],r15
  movzx edx,byte ptr [r15+00000094]
  jmp return

address:
  jmp newmem
  nop 3
return:

[DISABLE]

address:
  db bytes
  // movzx edx,byte ptr [r15+0000008C]

dealloc(newmem)
dealloc(play,4)
unregistersymbol(play)"""

