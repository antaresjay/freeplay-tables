[[cheat]]
id = "stats"
name = "stats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,Tableflip.Character:StaminaPercentage+f)
define(bytes,F3 0F 10 86 3C 03 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000)

label(code)
label(return)
alloc(hero,4)
registersymbol(hero)

newmem:

code:
  mov [hero],rsi
  movss xmm0,[rsi+0000033C]
  jmp return

address:
  jmp newmem
  nop 3
return:

[DISABLE]

address:
  db bytes
  // movss xmm0,[rsi+0000033C]

dealloc(newmem)
dealloc(hero)
unregistersymbol(hero)"""

