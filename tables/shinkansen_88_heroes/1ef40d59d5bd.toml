[[cheat]]
id = "game-static-base-address-scan-initialization-activate-this-first"
name = "Game_static Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Game_static_basepointer)
registersymbol(Game_static_update_enable)
registersymbol(Game_static_set_enable)
registersymbol(Game_static_timeset_enable)

alloc(Game_static_basepointer, 4)
alloc(Game_static_update_enable, 4)
alloc(Game_static_set_enable, 4)
alloc(Game_static_timeset_enable, 4)


[DISABLE]
unregistersymbol(Game_static_basepointer)
unregistersymbol(Game_static_update_enable)
unregistersymbol(Game_static_set_enable)
unregistersymbol(Game_static_timeset_enable)

dealloc(Game_static_basepointer)
dealloc(Game_static_update_enable)
dealloc(Game_static_set_enable)
dealloc(Game_static_timeset_enable)"""

[[cheat]]
id = "game-static-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Game_static Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Game_static_savedAOB)
label(Game_static_returnhere)
label(Game_static_originalcode)
label(Game_static_exit)

label(Game_static_update_exit)
label(Game_static_set_exit)
label(Game_static_timeset_exit)

registersymbol(Game_static_savedAOB)

//0EB30D14 - 8B 0D AC0E3507        - mov ecx,[07350EAC] : [000003DC]
//0EB30D1A - 41                    - inc ecx
//0EB30D1B - B8 AC0E3507           - mov eax,07350EAC : [000003DC]
// com.bitmapbureau.heroes:Game:update+c8
//0EB30D20 - 89 08                 - mov [eax],ecx
//0EB30D22 - 83 EC 0C              - sub esp,0C
//0EB30D25 - 6A 01                 - push 01
//0EB30D27 - E8 D402FEFF           - call 0EB11000
//0EB30D2C - 83 C4 10              - add esp,10
//0EB30D2F - 0FB6 05 590E3507      - movzx eax,byte ptr [07350E59] : [01]
//0EB30D36 - 85 C0                 - test eax,eax
//0EB30D38 - 75 16                 - jne 0EB30D50
//0EB30D3A - 0FB6 05 5C0E3507      - movzx eax,byte ptr [07350E5C] : [00]
aobscan(Game_static_searchedAOB, 89 08 83 EC 0C 6A 01 * * * * * 83 C4 10 * * * * * * * 85 C0)

alloc(Game_static_newmem, 2048, Game_static_searchedAOB)
alloc(Game_static_temp1, 4, Game_static_searchedAOB)
alloc(Game_static_temp2, 4, Game_static_searchedAOB)
alloc(Game_static_temp3, 4, Game_static_searchedAOB)
alloc(Game_static_temp4, 4, Game_static_searchedAOB)
alloc(Game_static_temp5, 4, Game_static_searchedAOB)


Game_static_newmem:
mov [Game_static_temp1], eax
mov [Game_static_temp2], ebx
mov [Game_static_temp3], ecx
mov [Game_static_temp4], edx

mov ebx, [Game_static_savedAOB-4]
sub ebx, 9c

cmp dword ptr [Game_static_update_enable], #0
je Game_static_update_exit
mov [Game_static_basepointer], ebx
Game_static_update_exit:

cmp dword ptr [Game_static_set_enable], #0
je Game_static_set_exit
Game_static_set_exit:

cmp dword ptr [Game_static_timeset_enable], #0
je Game_static_timeset_exit
cmp dword ptr [ebx+98], #0
je Game_static_timeset_exit
mov edx, [ebx+98]
mov [edx+8], #99999
Game_static_timeset_exit:


mov eax, [Game_static_temp1]
mov ebx, [Game_static_temp2]
mov ecx, [Game_static_temp3]
mov edx, [Game_static_temp4]


Game_static_originalcode:
db 89 08 83 EC 0C
//mov [eax],ecx
//sub esp,0C


Game_static_exit:
jmp Game_static_returnhere


Game_static_searchedAOB:
Game_static_savedAOB:
jmp Game_static_newmem
Game_static_returnhere:


[DISABLE]
Game_static_savedAOB:
db 89 08 83 EC 0C
//mov [eax],ecx
//sub esp,0C

unregistersymbol(Game_static_savedAOB)

dealloc(Game_static_newmem)
dealloc(Game_static_temp1)
dealloc(Game_static_temp2)
dealloc(Game_static_temp3)
dealloc(Game_static_temp4)
dealloc(Game_static_temp5)"""

