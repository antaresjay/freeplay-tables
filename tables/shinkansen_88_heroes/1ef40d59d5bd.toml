[[cheat]]
id = "hero-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Hero Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Hero_savedAOB)
label(Hero_returnhere)
label(Hero_originalcode)
label(Hero_exit)

label(Hero_update_exit)
label(Hero_set_exit)
label(Hero_invincibleset_exit)
label(Hero_jumpset_exit)
label(Hero_massset_exit)

registersymbol(Hero_savedAOB)

//0EB35C7F - 85 C0                 - test eax,eax
//0EB35C81 - 0F84 0D020000         - je 0EB35E94
// com.bitmapbureau.heroes.sprites:Hero:update+1f
//0EB35C87 - DD 87 F0000000        - fld qword ptr [edi+000000F0]
//0EB35C8D - DD 05 98829D0C        - fld qword ptr [0C9D8298] : [(double)0.5000]
//0EB35C93 - DEC9                  - fmulp st(1),st(0)
//0EB35C95 - DD 9F F0000000        - fstp qword ptr [edi+000000F0]
//0EB35C9B - 0FB6 47 74            - movzx eax,byte ptr [edi+74]
//0EB35C9F - 85 C0                 - test eax,eax
//0EB35CA1 - 0F84 49000000         - je 0EB35CF0
aobscan(Hero_searchedAOB, DD 87 F0 00 00 00 * * * * * * DE C9 DD 9F F0 00 00 00 0F B6 47 74)

alloc(Hero_newmem, 2048, Hero_searchedAOB)
alloc(Hero_temp1, 4, Hero_searchedAOB)
alloc(Hero_temp2, 4, Hero_searchedAOB)
alloc(Hero_temp3, 4, Hero_searchedAOB)
alloc(Hero_temp4, 4, Hero_searchedAOB)
alloc(Hero_temp5, 4, Hero_searchedAOB)


Hero_newmem:
mov [Hero_temp1], eax
mov [Hero_temp2], ebx
mov [Hero_temp3], ecx
mov [Hero_temp4], edx

cmp dword ptr [Hero_update_enable], #0
je Hero_update_exit
mov [Hero_basepointer], edi
Hero_update_exit:

cmp dword ptr [Hero_set_enable], #0
je Hero_set_exit
Hero_set_exit:

cmp dword ptr [Hero_invincibleset_enable], #0
je Hero_invincibleset_exit
mov byte [edi+294], #1
Hero_invincibleset_exit:

cmp dword ptr [Hero_jumpset_enable], #0
je Hero_jumpset_exit
mov [edi+240], #0
mov [edi+244], #3224633344
Hero_jumpset_exit:

cmp dword ptr [Hero_massset_enable], #0
je Hero_massset_exit
mov [edi+c8], #0
mov [edi+cc], #1065353216
Hero_massset_exit:


mov eax, [Hero_temp1]
mov ebx, [Hero_temp2]
mov ecx, [Hero_temp3]
mov edx, [Hero_temp4]


Hero_originalcode:
db DD 87 F0 00 00 00
//fld qword ptr [edi+000000F0]


Hero_exit:
jmp Hero_returnhere


Hero_searchedAOB:
Hero_savedAOB:
jmp Hero_newmem
nop
Hero_returnhere:


[DISABLE]
Hero_savedAOB:
db DD 87 F0 00 00 00
//fld qword ptr [edi+000000F0]

unregistersymbol(Hero_savedAOB)

dealloc(Hero_newmem)
dealloc(Hero_temp1)
dealloc(Hero_temp2)
dealloc(Hero_temp3)
dealloc(Hero_temp4)
dealloc(Hero_temp5)"""

