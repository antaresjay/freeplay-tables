|       $$ \$$     \| $$  | $$ \$$    $$
 \$$$$$$$   \$$$$$$$ \$$   \$$  \$$$$$$$  }

[ENABLE]

aobscanmodule(hpdamageAOB,GameAssembly.dll,29 51 10 41 8B F0)
alloc(newmem,$1000,hpdamageAOB)
label(onehit)
label(onehitkill)
label(code)
label(return)
registersymbol(hpdamageAOB)
registersymbol(onehitkill)
newmem:
cmp dword ptr [rcx+50],00000000
jne onehit
mov [rcx+10],#999
jmp return

onehit:
cmp [onehitkill],1
jne code
sub [rcx+10],#99999
jmp code

onehitkill:
dq 0

code:
  sub [rcx+10],edx
  mov esi,r8d
  jmp return

hpdamageAOB:
  jmp newmem
  nop
return:


[DISABLE]

hpdamageAOB:
  db 29 51 10 41 8B F0

unregistersymbol(*)
dealloc(*)


