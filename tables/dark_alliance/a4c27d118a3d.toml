[[cheat]]
id = "max-combo"
name = "Max Combo"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(aobcombo,$process,8B 01 01 42 48 * 8D * * * 89) // should be unique
alloc(newmem,$1000,aobcombo)
label(code)
label(return)

newmem:
  mov eax,[rcx]
  cmp [rdx+48],#1999
  jge short @f
  mov eax,#1999
  sub eax,[rdx+48]

code:
  add [rdx+48],eax
  jmp return

aobcombo:
  jmp newmem
return:
registersymbol(aobcombo)

[DISABLE]

aobcombo:
  db 8B 01 01 42 48

dealloc(newmem)"""
