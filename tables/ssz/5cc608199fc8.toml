id = "inf-energy"
name = "inf_energy"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
label(energy_jmp)
registersymbol(energy_jmp)
