jmp end

@@:
mov eax,SpiritLLevelReadCallerAOB
lea eax,[eax+d]
cmp [esp+18],eax //"Deedlit in Wonder Labyrinth.exe"+30E50D
je @f
mov eax,SpiritRLevelReadCallerAOB
lea eax,[eax+d]
cmp [esp+18],eax //"Deedlit in Wonder Labyrinth.exe"+3109B4
je @f
jmp end

@@:
readmem(manyValuesRead1AOB,8)
//movsd xmm0,[edi]
maxsd xmm0,[qMinSpiritLvl]
readmem(manyValuesRead1AOB,2)
db 11
readmem(manyValuesRead1AOB+3,1)
//movsd [edi],xmm0

end:

originalcode_manyValuesRead1AOB:
readmem(manyValuesRead1AOB,8)
//movsd xmm0,[edi]
//lea eax,[esp+08]

exit:
jmp returnhere

///
pHealth:
dd 0
bFullMana:
dd 0
pMoney:
dd 0
pSpiritLLevel:
dd 0
pSpiritRLevel:
dd 0
qMinSpiritLvl:
dq (double)-1
///

manyValuesRead1AOB: //"Deedlit in Wonder Labyrinth.exe"+4C2ED5:
jmp newmem
nop 3
returnhere:

///****************************************///
aobscanmodule(manyWritesOnChangeAOB,"Deedlit in Wonder Labyrinth.exe",F2 0F ** ** F2 0F ** ** F2 0F ** ** 89)
