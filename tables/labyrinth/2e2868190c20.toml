readmem(originalcode_manyValuesRead1AOB,8)
//db F2 0F 10 07 8D 44 24 08
//Alt: movsd xmm0,[edi]
//Alt: lea eax,[esp+08]
unregistersymbol(originalcode_manyValuesRead1AOB)

unregistersymbol(pHealth)
unregistersymbol(bFullMana)
unregistersymbol(pMoney)
unregistersymbol(pSpiritLLevel)
unregistersymbol(pSpiritRLevel)
unregistersymbol(qMinSpiritLvl)

