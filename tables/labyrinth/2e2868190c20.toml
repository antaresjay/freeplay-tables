jne @f
cmp byte ptr [bFullMana],1
jne @f
readmem(manyValuesRead1AOB,8)
//movsd xmm0,[edi]
maxsd xmm0,[esi]
readmem(manyValuesRead1AOB,2)
db 11
readmem(manyValuesRead1AOB+3,1)
//movsd [edi],xmm0
jmp end

@@:
mov eax,moneyReadCallerAOB
lea eax,[eax+d]
cmp [esp+18],eax //"Deedlit in Wonder Labyrinth.exe"+30338B
jne @f
