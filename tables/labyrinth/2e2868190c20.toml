jne @f
maxsd xmm1,xmm0

@@:
subsd xmm1,xmm0

cmp [pHealth],esi
jne @f
maxsd xmm1,[qMinHealth]

@@:

end2:
movsd [esi],xmm1
jmp exit2

originalcode2_manyWritesOnChangeAOB:
readmem(manyWritesOnChangeAOB+4,8)
//subsd xmm1,xmm0
//movsd [esi],xmm1

exit2:
jmp returnhere2

///
bIgnoreMoney:
dd 0
qMinHealth:
dq (double)-1
///

manyWritesOnChangeAOB+4: //"Deedlit in Wonder Labyrinth.exe"+4DEA:
