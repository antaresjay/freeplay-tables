[[cheat]]
id = "invincible"
name = "Invincible"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,CharacterManager:CheckDamageAttackParam+236)
define(bytes,41 0F B6 86 72 03 00 00)
define(roll,MutekiBehaviour:OnBehaviourPause+25)
define(bytes_r,74)
[ENABLE]
assert(address,bytes)
alloc(newmem,$1000,CharacterManager:CheckDamageAttackParam+236)
label(code)
label(return)
label(player)
newmem:
  cmp rsi,01
  je player
  cmp rsi,01
  jne code
player:
  mov byte ptr [r14+00000372],01
  movzx eax,byte ptr [r14+00000372]
  jmp return
code:
  mov byte ptr [r14+00000372],00
  movzx eax,byte ptr [r14+00000372]
  jmp return
address:
  jmp newmem
  nop 3
return:
roll:
  db EB
[DISABLE]
address:
  db bytes
roll:
  db bytes_r
dealloc(newmem)"""

