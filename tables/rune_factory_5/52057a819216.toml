[[cheat]]
id = "get-current-item-on-hand"
name = "Get Current Item on Hand"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(fItemHoldUpdate,2048,HumanItemHold.UpdateState)
registersymbol(fItemHoldUpdate)
label(fItemHoldUpdate_Ret)
alloc(sItemOnHand,8)
registersymbol(sItemOnHand)

fItemHoldUpdate:
readmem(HumanItemHold.UpdateState,5)
mov rax,[rcx+OffsetsHumanItemHold.m_Human]
cmp [rax+OffsetsActorController.actorId],0
jne fItemHoldUpdate_Ret
mov rax,sItemOnHand
mov [rax],rcx
jmp fItemHoldUpdate_Ret

HumanItemHold.UpdateState:
jmp fItemHoldUpdate
fItemHoldUpdate_Ret:

[DISABLE]
dealloc(newmem)
HumanItemHold.UpdateState:
readmem(fItemHoldUpdate,5)"""

