[[cheat]]
id = "unlimited-health"
name = "Unlimited Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(PlayerHealth,GameAssembly.dll,F3 0F 11 47 18 48 85)
alloc(newmem,$1000,PlayerHealth)
label(code return)

newmem:

code:
  mov [rdi+18],(float)9999
  jmp return

PlayerHealth:
  jmp newmem
return:
registersymbol(PlayerHealth)

[DISABLE]

PlayerHealth:
  db F3 0F 11 47 18

unregistersymbol(PlayerHealth)
dealloc(newmem)"""

