[[cheat]]
id = "gamemanager-base-address-scan-initialization-activate-this-first"
name = "GameManager Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameManager_basepointer)
registersymbol(GameManager_update_enable)
registersymbol(GameManager_set_enable)
registersymbol(GameManager_godmodeset_enable)
registersymbol(GameManager_coinsset_enable)

alloc(GameManager_basepointer, 4)
alloc(GameManager_update_enable, 4)
alloc(GameManager_set_enable, 4)
alloc(GameManager_godmodeset_enable, 4)
alloc(GameManager_coinsset_enable, 4)


[DISABLE]
unregistersymbol(GameManager_basepointer)
unregistersymbol(GameManager_update_enable)
unregistersymbol(GameManager_set_enable)
unregistersymbol(GameManager_godmodeset_enable)
unregistersymbol(GameManager_coinsset_enable)

dealloc(GameManager_basepointer)
dealloc(GameManager_update_enable)
dealloc(GameManager_set_enable)
dealloc(GameManager_godmodeset_enable)
dealloc(GameManager_coinsset_enable)"""

[[cheat]]
id = "gamemanager-base-address-scan-to-activate-pause-game-to-update-pause-game"
name = "GameManager Base Address Scan (To Activate: Pause Game, To Update: Pause Game)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameManager_savedAOB)
label(GameManager_returnhere)
label(GameManager_originalcode)
label(GameManager_exit)

label(GameManager_update_exit)
label(GameManager_set_exit)
label(GameManager_godmodeset_exit)
label(GameManager_coinsset_exit)

registersymbol(GameManager_savedAOB)

//04DD789C - 83 EC 04              - sub esp,04
//04DD789F - 8B 45 08              - mov eax,[ebp+08]
// GameManager:OnPausePressed+a
//04DD78A2 - 8B 80 B4000000        - mov eax,[eax+000000B4]
//04DD78A8 - 8B F0                 - mov esi,eax
//04DD78AA - 4E                    - dec esi
//04DD78AB - 83 FE 06              - cmp esi,06
//04DD78AE - 73 2E                 - jae 04DD78DE
aobscan(GameManager_searchedAOB, 8B 80 B4 00 00 00 8B F0 4E)

alloc(GameManager_newmem, 2048, GameManager_searchedAOB)


GameManager_newmem:
cmp dword ptr [GameManager_update_enable], #0
je GameManager_update_exit
mov [GameManager_basepointer], eax
GameManager_update_exit:

cmp dword ptr [GameManager_set_enable], #0
je GameManager_set_exit
GameManager_set_exit:

cmp dword ptr [GameManager_godmodeset_enable], #0
je GameManager_godmodeset_exit
mov byte ptr [eax+11f], #1
GameManager_godmodeset_exit:

cmp dword ptr [GameManager_coinsset_enable], #0
je GameManager_coinsset_exit
mov [eax+e8], #9999999
GameManager_coinsset_exit:


GameManager_originalcode:
db 8B 80 B4 00 00 00
//mov eax,[eax+000000B4]


GameManager_exit:
jmp GameManager_returnhere


GameManager_searchedAOB:
GameManager_savedAOB:
jmp GameManager_newmem
nop
GameManager_returnhere:


[DISABLE]
GameManager_savedAOB:
db 8B 80 B4 00 00 00
//mov eax,[eax+000000B4]

unregistersymbol(GameManager_savedAOB)

dealloc(GameManager_newmem)"""

