[[cheat]]
id = "infinite-ammo-no-reload"
name = "Infinite ammo & no reload"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(infammo,DeadzoneSteam.exe,F3 0F 11 4B 08 E8)
alloc(newmem,$1000,infammo)
label(code)
label(return)

newmem:
code:
  nop
  nop
  nop
  nop
  nop
  jmp return

infammo:
  jmp newmem
return:
registersymbol(infammo)

[DISABLE]
infammo:
  db F3 0F 11 4B 08

unregistersymbol(infammo)
dealloc(newmem)"""

