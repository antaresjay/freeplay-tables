label(load1)
label(save2)
label(load2)
label(xpos)
label(ypos)
label(zpos)
label(xpos2)
label(ypos2)
label(zpos2)
label(enable_save_slot1)
label(enable_load_slot1)
label(enable_save_slot2)
label(enable_load_slot2)
label(code)
label(return)

find_coords:
dd 0

storecoords:
xpos:
  dq (double)0
ypos:
  dq (double)0
zpos:
  dq (double)0

enable_save_slot1:
  dd 0

enable_load_slot1:
  dd 0

storecoords2:
xpos2:
  dq (double)0
ypos2:
  dq (double)0
zpos2:
  dq (double)0

enable_save_slot2:
  dd 0

enable_load_slot2:
  dd 0

newmem:
  mov [find_coords],rdi
  cmp [enable_save_slot1],1
  je save1
  cmp [enable_load_slot1],1
  je load1
  cmp [enable_save_slot2],1
  je save2
  cmp [enable_load_slot2],1
  je load2
  jmp code

save1:
  mov [enable_save_slot1],0
  push r12
  mov r12,[rdi+1F8]
  mov [xpos],r12
  mov r12,[rdi+200]
  mov [ypos],r12
  mov r12,[rdi+208]
  mov [zpos],r12
  pop r12
  jmp code

load1:
  mov [enable_load_slot1],0
  push r12
  mov r12,[xpos]
  mov [rdi+1F8],r12
  mov r12,[ypos]
  mov [rdi+200],r12
  mov r12,[zpos]
  mov [rdi+208],r12
  pop r12
  jmp code

save2:
  mov [enable_save_slot2],0
