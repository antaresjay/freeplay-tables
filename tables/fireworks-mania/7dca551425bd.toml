  mov r12,[ypos2]
  mov [rdi+200],r12
  mov r12,[zpos2]
  mov [rdi+208],r12
  pop r12
  jmp code

code:
  movups xmm0,[rdi+000001F8]
  jmp return

COORDS:
  jmp newmem
  nop 2
return:
registersymbol(COORDS find_coords xpos ypos zpos xpos2 ypos2 zpos2 enable_save_slot1 enable_load_slot1 enable_save_slot2 enable_load_slot2)

[DISABLE]

COORDS:
  db 0F 10 87 F8 01 00 00

unregistersymbol(COORDS find_coords xpos ypos zpos xpos2 ypos2 zpos2 enable_save_slot1 enable_load_slot1 enable_save_slot2 enable_load_slot2)
dealloc(newmem)
dealloc(find_coords)
dealloc(storecoords)
