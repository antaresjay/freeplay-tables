{ Game   : Fireworks Mania.exe
  Version: 
  Date   : 2021-04-03
  Author : joeyc

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(COORDS,UnityPlayer.dll,0F 10 87 F8 01 00 00 0F 94) // should be unique
alloc(newmem,$1000,COORDS)
alloc(find_coords,10)
alloc(storecoords, 256)
alloc(storecoords2, 256)

