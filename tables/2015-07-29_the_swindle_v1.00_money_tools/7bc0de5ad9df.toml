[[cheat]]
id = "botconfuse-charge-fast-recall"
name = "BotConfuse_charge Fast Recall"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : TheSwindle
  Version: 1.00
  Date   : 2015-07-29
  Author : Bas9339

  How to : Use BotConfuse, activate script

  This script sets fast recall for BotConfuse_charge
}

[ENABLE]
aobscan(FastRBot,D9 58 30 83 EC 0C 50 E8 18)
alloc(newmem,$1000)
alloc(FullCharge,64)

label(code)
label(return)

FullCharge:
dd (float)100.0

newmem:

code:
  fld dword ptr[FullCharge]
  fstp dword ptr[eax+30]
  sub esp,0C
  jmp return

FastRBot:
  jmp code
  nop
return:
registersymbol(FastRBot)

[DISABLE]
FastRBot:
  db D9 58 30 83 EC 0C

unregistersymbol(FastRBot)
dealloc(newmem)
dealloc(FullCharge)"""

