alloc(newmem,$1000,PlayerData)

label(code)
label(return)
alloc(SetPlayerData,8)
registersymbol(SetPlayerData)
alloc(ChooseCard,4)
registersymbol(ChooseCard)
ChooseCard:
dd 20
newmem:
  mov [SetPlayerData],rax
code:
movsxd  rax,dword ptr [rax+70]
inc eax
  jmp return

PlayerData:
  jmp newmem
  nop
return:
registersymbol(PlayerData)

