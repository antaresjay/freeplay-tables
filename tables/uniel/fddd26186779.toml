[[cheat]]
id = "hp-exs"
name = "HP & EXS"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(hp_aob,UNIEL.exe,FF 77 5C 8B C8 E8 C7) // should be unique
aobscanmodule(hitminus_aob,UNIEL.exe,29 46 5C 8B 45 A0) // should be unique
alloc(newmem,2048)
alloc(hitminus_newmem,2048)
alloc(p1_base,4)
alloc(p2_base,4)
alloc(p1_fullhp,4)
alloc(p2_fullhp,4)
alloc(p1_fullexs,4)
alloc(p2_fullexs,4)
alloc(p1_nodeath,4)
alloc(p2_nodeath,4)

registersymbol(hp_aob)
registersymbol(p1_base)
registersymbol(p2_base)
registersymbol(p1_fullhp)
registersymbol(p2_fullhp)
registersymbol(p1_fullexs)
registersymbol(p2_fullexs)
registersymbol(hitminus_aob)
registersymbol(p1_nodeath)
registersymbol(p2_nodeath)

label(p2)
label(code)
label(return)

label(hitminus_p2)
label(hitminus_code)
label(hitminus_return)

newmem:
  test byte ptr [edi+4],1
  jnz p2
  mov [p1_base],edi
  cmp [p1_fullhp],#1
  jne @f
  mov [edi+5C],#15000
@@:
  cmp [p1_fullhp],#2
  jne @f
  mov [edi+5C],#2500
@@:
  cmp [p1_fullexs],#1
  jne @f
  mov [edi+74],#20000
@@:
  jmp code
p2:
  mov [p2_base],edi
  cmp [p2_fullhp],#1
  jne @f
  mov [edi+5C],#15000
@@:
  cmp [p2_fullhp],#2
  jne @f
  mov [edi+5C],#2500
@@:
  cmp [p2_fullexs],#1
  jne @f
  mov [edi+74],#20000
code:
  push [edi+5C]
  mov ecx,eax
  jmp return

hitminus_newmem:
  push ecx
  mov ecx,[esi+5c] //Stores old HP
  sub [esi+5C],eax //Original Code
  cmp esi,[p2_base]
  je hitminus_p2
  cmp [p1_nodeath],#1
  jne hitminus_code
  cmp [esi+5C],#0
  jg hitminus_code //Skip if greater than 0
  mov [esi+5C],ecx //Restore old HP
  jmp hitminus_code
hitminus_p2:
  cmp [p2_nodeath],#1
  jne hitminus_code
  cmp [esi+5C],#0
  jg hitminus_code //Skip if greater than 0
  mov [esi+5C],ecx //Restore old HP
hitminus_code:
  pop ecx
  mov eax,[ebp-60]
  jmp hitminus_return

hp_aob:
  jmp newmem
return:

hitminus_aob:
  jmp hitminus_newmem
  nop
hitminus_return:

[DISABLE]
hp_aob:
  db FF 77 5C 8B C8

hitminus_aob:
  db 29 46 5C 8B 45 A0

unregistersymbol(hp_aob)
unregistersymbol(p1_base)
unregistersymbol(p2_base)
unregistersymbol(p1_fullhp)
unregistersymbol(p2_fullhp)
unregistersymbol(p1_fullexs)
unregistersymbol(p2_fullexs)
unregistersymbol(hitminus_aob)
unregistersymbol(p1_nodeath)
unregistersymbol(p2_nodeath)
dealloc(newmem)
dealloc(p1_base)
dealloc(p2_base)
dealloc(p1_fullhp)
dealloc(p2_fullhp)
dealloc(p1_fullexs)
dealloc(p2_fullexs)
dealloc(hitminus_newmem)
dealloc(p1_nodeath)
dealloc(p2_nodeath)"""

