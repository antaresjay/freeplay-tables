[[cheat]]
id = "3-change-passives"
name = "[3] Change Passives"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Palworld-Win64-Shipping.exe
  Version: 
  Date   : 2025-04-02
  Author : MBRKiNG

  This script does blah blah blah
}
[ENABLE]
aobscanmodule(pal_passive_changer,$process,48 8B ?? ?? ?? ?? ?? 89 ?? ?? 85 ?? 75 ?? 89 ?? ?? 48 8B ?? 48 8B ?? ?? ?? 48 8B ?? ?? ?? 48 83 ?? ?? 5F C3 45 33 ?? 8B ?? 48 8B ?? E8 ?? ?? ?? ?? 48 8B ?? 4C ?? ?? 4D ?? ?? 48 8B ?? E8 ?? ?? ?? ?? 48 8B ?? ?? ?? 48 8B ?? 48 8B ?? ?? ?? 48 83 ?? ?? 5F C3 ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? 48 89)
alloc(newmem,$1000,pal_passive_changer)
label(code)
label(return)
label(pal_p)
newmem:
code:
  mov [pal_p],rcx
  mov rsi,[rcx+00000368]
  jmp return
pal_p:
  dq 0
pal_passive_changer:
  jmp newmem
  nop 2
return:
registersymbol(pal_passive_changer pal_p)
[DISABLE]
pal_passive_changer:
  db 48 8B B1 68 03 00 00
unregistersymbol(*)
dealloc(*)"""

