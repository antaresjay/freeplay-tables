[[cheat]]
id = "savegame-base-address-scan-initialization-activate-this-first"
name = "SaveGame Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(SaveGame_basepointer)
registersymbol(SaveGame_update_enable)
registersymbol(SaveGame_set_enable)

alloc(SaveGame_basepointer, 4)
alloc(SaveGame_update_enable, 4)
alloc(SaveGame_set_enable, 4)


[DISABLE]
unregistersymbol(SaveGame_basepointer)
unregistersymbol(SaveGame_update_enable)
unregistersymbol(SaveGame_set_enable)

dealloc(SaveGame_basepointer)
dealloc(SaveGame_update_enable)
dealloc(SaveGame_set_enable)"""

[[cheat]]
id = "savegame-base-address-scan-to-activate-visit-hangar-to-update-visit-hangar"
name = "SaveGame Base Address Scan (To Activate: Visit Hangar, To Update: Visit Hangar)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(SaveGame_savedAOB)
label(SaveGame_returnhere)
label(SaveGame_originalcode)
label(SaveGame_exit)

label(SaveGame_update_exit)
label(SaveGame_set_exit)

registersymbol(SaveGame_savedAOB)

//046C3CBC - 56                    - push esi
//046C3CBD - 83 EC 70              - sub esp,70
//046C3CC0 - 8B 7D 08              - mov edi,[ebp+08]
// SaveGame:Update+b
//046C3CC3 - 8B B7 FC000000        - mov esi,[edi+000000FC]
//046C3CC9 - 83 FE 0F              - cmp esi,0F
//046C3CCC - 0F83 89000000         - jae 046C3D5B
//046C3CD2 - 8B CE                 - mov ecx,esi
//046C3CD4 - C1 E1 02              - shl ecx,02
aobscan(SaveGame_searchedAOB, 50 8B 45 B8 52 51 50 39 00)

alloc(SaveGame_newmem, 2048, SaveGame_searchedAOB)
alloc(SaveGame_temp1, 4, SaveGame_searchedAOB)


SaveGame_newmem:
mov [SaveGame_temp1], ebx

mov ebx, [SaveGame_savedAOB-4]
sub ebx, 4

cmp dword ptr [SaveGame_update_enable], #0
je SaveGame_update_exit
mov [SaveGame_basepointer], ebx
SaveGame_update_exit:

cmp dword ptr [SaveGame_set_enable], #0
je SaveGame_set_exit
SaveGame_set_exit:

mov ebx, [SaveGame_temp1]


SaveGame_originalcode:
db 50 8B 45 B8 52
//push eax
//mov eax,[ebp-48]
//push edx


SaveGame_exit:
jmp SaveGame_returnhere


SaveGame_searchedAOB:
SaveGame_savedAOB:
jmp SaveGame_newmem
SaveGame_returnhere:


[DISABLE]
SaveGame_savedAOB:
db 50 8B 45 B8 52
//push eax
//mov eax,[ebp-48]
//push edx

unregistersymbol(SaveGame_savedAOB)

dealloc(SaveGame_newmem)
dealloc(SaveGame_temp1)"""

