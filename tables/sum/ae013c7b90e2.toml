fstp dword ptr [ecx+000005F8]
jmp returnhere

mymem:
nop
nop
nop
nop
nop
jmp returnhere

exit:
jmp returnhere

"Sum.exe"+50BC8:
jmp newmem
nop
returnhere:


 
 
