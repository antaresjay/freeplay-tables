name = "GOD MODE & ONE-HIT KILL"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
assert("Sum.exe"+50BC8,D9 99 F8 05 00 00)
alloc(newmem,1024)
alloc(mymem,1024)
alloc(ikill,8)
label(returnhere)
label(originalcode)
label(exit)

ikill:
dd (float)9999

newmem: //this is allocated memory, you have read,write,execute access
cmp [ecx+00000608],1
jne mymem



originalcode:
