type = "script"
source = """
[ENABLE]
aobscanmodule(get_deliveryDuration,GameAssembly.dll,F3 0F 10 73 28 * * E8 * * * * 48 85 C0 74) //Arrabbiata.Stock.get_deliveriesProgress
alloc(newmem,$1000,get_deliveryDuration)
label(return)

newmem:
mov [rbx+28],0
movss xmm6,[rbx+28]
jmp return

get_deliveryDuration:
  jmp newmem
return:
registersymbol(get_deliveryDuration)

[DISABLE]
get_deliveryDuration:
  db F3 0F 10 73 28

unregistersymbol(get_deliveryDuration)
dealloc(newmem)"""
