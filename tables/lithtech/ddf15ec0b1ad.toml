[[cheat]]
id = "float-up-down-press-x-shift-x-in-game"
name = "Float up/down (Press X/Shift-X in game)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{
  Game:    Tron 2.0
  Version: Patch v1.042
  Author:  gwodus (gwodusx@xsmail.com)

  There are two injection points. inject_FLOAT2 is entered
  evertime the player moves. Here we remember the pointer to
  the player's objects (sPlayerPos). The player consists of
  more then one object. Usually two (might be player + weapon).
  Changing coordinates here does not work. They are overwritten
  later.

  Injection point inject_FLOAT is called in a loop for every
  object. If it's one of the player's objects, then we check the
  keyboard and manipulate the object's coordinates accordingly.
}

[ENABLE]
aobscan(inject_FLOAT,8B 91 C8 00 00 00 89 10)
aobscan(inject_FLOAT2,8B 8C 24 40 05 00 00 51)
alloc(mem_FLOAT,2048)
label(code_FLOAT)
label(pPlayerPos1)
label(pPlayerPos2)
label(pPlayerPos3)
label(pPlayerPos4)
label(returnhere)
label(returnhere2)
label(originalcode)
label(originalcode2)
label(checkKeyPressedEnd)
label(iCounter)
label(fDirection)
label(fIncStep)
label(checkKeyPressed)
label(player)
label(nokey)
label(code_FLOAT2)
registersymbol(inject_FLOAT)
registersymbol(inject_FLOAT2)
registersymbol(mem_FLOAT)
registersymbol(code_FLOAT)
registersymbol(code_FLOAT2)
registersymbol(fIncStep)
registersymbol(pPlayerPos1)
registersymbol(pPlayerPos2)
registersymbol(pPlayerPos3)
registersymbol(pPlayerPos4)

mem_FLOAT:
fIncStep:
dd (float)0.7
fDirection:
dd 00
iCounter:
dd 00
pPlayerPos1:
dd 00
pPlayerPos2:
dd 00
pPlayerPos3:
dd 00
pPlayerPos4:
dd 00

// -------------------------------------------------------------------
// cheat code: Entered in a loop for all objects (ecx = object pointer).
// If the current object is on the mini stack, then let's handle it.
// -------------------------------------------------------------------

code_FLOAT:

cmp [pPlayerPos1], ecx
je player
cmp [pPlayerPos2], ecx
je player
cmp [pPlayerPos3], ecx
je player
cmp [pPlayerPos4], ecx
je player
jmp originalcode

player:
call checkKeyPressed

cmp [fDirection], (float)0
je originalcode

fld [ecx+000000CC]   // load num1 and push it onto the fpu stack
fld [fIncStep]       // load num2 and push it onto the fpu stack
fld [fDirection]     // load num2 and push it onto the fpu stack
fmulp
faddp                // pop two numbers, add them, push sum on the stack
fstp [ecx+000000CC]  // pop sum from the stack and store it in res
mov [ecx+000000E8], (float)0

originalcode:
mov edx,[ecx+000000C8]

jmp returnhere


// -------------------------------------------------------------------
// cheat code: Entered when player moves (only for player object).
// [esi+8] contains pointer to sPlayerPos. The routine is entered
// with more then one object here. Only one is the correct one. Since
// we don't know which, we store them all in some sort of mini stack
// (pPlayerPos1-4).
// -------------------------------------------------------------------

code_FLOAT2:

test esi, esi
jz originalcode2

mov ecx, [esi+8]
test ecx, ecx
jz originalcode2

// leave, if object is already on stack.
cmp [pPlayerPos1], ecx
je originalcode2
cmp [pPlayerPos2], ecx
je originalcode2
cmp [pPlayerPos3], ecx
je originalcode2
cmp [pPlayerPos4], ecx
je originalcode2

// otherwise push object pointer on stack.
push ecx
mov ecx, [pPlayerPos3]
mov [pPlayerPos4], ecx
mov ecx, [pPlayerPos2]
mov [pPlayerPos3], ecx
mov ecx, [pPlayerPos1]
mov [pPlayerPos2], ecx
pop ecx
mov [pPlayerPos1], ecx

originalcode2:
mov ecx,[esp+00000540]

jmp returnhere2



// -------------------------------------------------------------------
// subroutine checkKeyPressed
// -------------------------------------------------------------------

checkKeyPressed:

// We are in a loop which is called very often.
// It's not neccesary to check ever time.
add [iCounter], 1
cmp [iCounter], #20
jl checkKeyPressedEnd
mov [iCounter], 0

// save everything
pushad
pushfd

mov [fDirection], 0
//virtual key codes
push 'X'
call GetAsyncKeyState
shr ax,#15 //bit 15 is 1 if it is CURRENTLY down
jz nokey

mov [fDirection], (float)1

push A0 // VK_LSHIFT
call GetAsyncKeyState
shr ax,#15 //bit 15 is 1 if it is CURRENTLY down
jz nokey

mov [fDirection], (float)-1

nokey:
popfd
popad

checkKeyPressedEnd:
ret

// -------------------------------------------------------------------
// Code Injection Point
// -------------------------------------------------------------------

inject_FLOAT:
//"Lithtech.exe"+74D0:
jmp code_FLOAT
nop
returnhere:

inject_FLOAT2:
//"Lithtech.exe"+50228:
jmp code_FLOAT2
nop
nop
returnhere2:


 
[DISABLE]
inject_FLOAT:
//"Lithtech.exe"+74D0:
//mov edx,[ecx+000000C8]
db 8B 91 C8 00 00 00

inject_FLOAT2:
//"Lithtech.exe"+50228:
//mov ecx,[esp+00000540]
db 8B 8C 24 40 05 00 00

dealloc(mem_FLOAT)
unregistersymbol(inject_FLOAT)
unregistersymbol(inject_FLOAT2)
unregistersymbol(mem_FLOAT)
unregistersymbol(code_FLOAT)
unregistersymbol(code_FLOAT2)
unregistersymbol(fIncStep)
unregistersymbol(pPlayerPos1)
unregistersymbol(pPlayerPos2)
unregistersymbol(pPlayerPos3)
unregistersymbol(pPlayerPos4)"""

