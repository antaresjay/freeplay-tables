[[cheat]]
id = "enable-subroutine-trainer"
name = "Enable Subroutine Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
  Game:    Tron 2.0
  Version: Patch v1.042
  Author:  gwodus (gwodusx@xsmail.com)

  Register esi has a pointer to struct sTools. sTools+0x07C8 points
  to an array of pointers to sPayload (payload is a subroutine).
  The injection point is called for each payload upon entering the
  subroutine menu (F1). Address [esp+14] contains a pointer to the
  currently processed payload. sPayload contains the subroutine
  build state (alpha, beta, gold) and an infection state.
}

[ENABLE]
aobscan(inject_TOOLS,8B 42 0C 83 C9 FF 89 42 08)

alloc(mem_TOOLS,2048)
label(pTools)
label(bEnableDisinfect)
label(bEnableGold)
label(code_TOOLS)
label(returnhere)
label(originalcode)
label(exit)
label(endofhack)
label(nogold)
label(tool)
registersymbol(inject_TOOLS)
registersymbol(mem_TOOLS)
registersymbol(code_TOOLS)
registersymbol(pTools)
registersymbol(bEnableDisinfect)
registersymbol(bEnableGold)

mem_TOOLS:
pTools:
dd 00
bEnableDisinfect:
dd 01
bEnableGold:
dd 01

code_TOOLS:
mov [pTools], esi

mov eax, [esp+14]   // current pPayload
test eax, eax
jz originalcode

push ecx
// There are two special payloads which are not subroutines.
// 'bad_block' is a fragmented slot. And base_code is an
// empty slot. We ignore both.
mov ecx, [eax+0]         // pPayload->Type (string)
cmp [ecx], 5F646162      // 'bad_'block
je endofhack
cmp [ecx], 65736162      // 'base'_code
jne tool
cmp [ecx+4], 646F635F    // base'_cod'e
je endofhack

tool:
cmp [bEnableGold], 0
je nogold
mov [eax+4], 2           // 0=alpha,1=beta,2=gold
nogold:

cmp [bEnableDisinfect], 0
je endofhack
mov [eax+14], 0

endofhack:
pop ecx


originalcode:
mov eax,[edx+0C]
or ecx,-01

exit:
jmp returnhere

inject_TOOLS:
//"cshell.dll"+86F95:
jmp code_TOOLS
nop
returnhere:


[DISABLE]
inject_TOOLS:
//"cshell.dll"+86F95:
//mov eax,[edx+0C]
//or ecx,-01
db 8B 42 0C 83 C9 FF

dealloc(mem_TOOLS)
unregistersymbol(inject_TOOLS)
unregistersymbol(mem_TOOLS)
unregistersymbol(code_TOOLS)
unregistersymbol(pTools)
unregistersymbol(bEnableDisinfect)
unregistersymbol(bEnableGold)"""

