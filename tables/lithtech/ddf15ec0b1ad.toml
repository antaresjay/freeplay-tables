[[cheat]]
id = "insta-process"
name = "Insta-Process"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
  Game:    Tron 2.0
  Version: Patch v1.042
  Author:  gwodus (gwodusx@xsmail.com)

  At the injection point we get a pointer to struct sMain.
  sMain contains a pointer array to three processors (defrag,
  disinfect and port). Each processors (struct sProcessor) can
  have a payload (subroutine - struct sPayload) assigned. The
  progress of the task is in sPayload itself.
}

[ENABLE]
aobscan(inject_PROC,55 8B E9 56 8B 85)

alloc(mem_PROC,2048)
label(returnhere)
label(originalcode)
label(exit)
label(code_PROC)
label(pMain)
label(pPort)
label(pDefrag)
label(pDisinfect)
label(bInstaProcess)
label(doProgress)
label(doProgressEnd)
registersymbol(inject_PROC)
registersymbol(mem_PROC)
registersymbol(code_PROC)
registersymbol(pMain)
registersymbol(pPort)
registersymbol(pDisinfect)
registersymbol(pDefrag)
registersymbol(bInstaProcess)

mem_PROC:
pMain:
dd 00
pPort:
dd 00
pDisinfect:
dd 00
pDefrag:
dd 00
bInstaProcess:
dd 01

code_PROC:
push edx
mov [pMain], ecx
mov eax, [ecx+1134]   // pointer array to sProcessor
mov edx, [eax]
mov [pPort], edx
mov edx, [eax+4]
mov [pDisinfect], edx
mov edx, [eax+8]
mov [pDefrag], edx
pop edx
cmp [bInstaProcess], 1
jne originalcode

// set progress of all payloads to 100%
mov eax, [pPort]
call doProgress
mov eax, [pDisinfect]
call doProgress
mov eax, [pDefrag]
call doProgress
jmp originalcode

doProgress:
test eax, eax      // safety check processor
je doProgressEnd
mov eax, [eax+0138]
test eax, eax      // has payload assigned?
je doProgressEnd
mov [eax+10], (float)1.0  // progress 100%
doProgressEnd:
ret

originalcode:
push ebp
mov ebp,ecx
push esi
mov eax,[ebp+00001150]

exit:
jmp returnhere

inject_PROC:
//"cshell.dll"+9BF08:
jmp code_PROC
nop
nop
nop
nop
nop
returnhere:


[DISABLE]
inject_PROC:
//"cshell.dll"+9BF08:
//push ebp
//mov ebp,ecx
//push esi
//mov eax,[ebp+00001150]
db 55 8B E9 56 8B 85 50 11 00 00

dealloc(mem_PROC)
unregistersymbol(mem_PROC)
unregistersymbol(code_PROC)
unregistersymbol(pMain)
unregistersymbol(pPort)
unregistersymbol(pDisinfect)
unregistersymbol(pDefrag)
unregistersymbol(bInstaProcess)"""

