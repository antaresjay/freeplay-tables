[[cheat]]
id = "readme-double-click-on-script"
name = "README:  double click on <script> ---------> "
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
  Game:    Tron 2.0
  Version: Patch v1.042
  Author:  gwodus (gwodusx@xsmail.com)
  Date:    2014-05-08

  AoB scans are used. So it might work with other versions.

  Player Trainer:

  * Unlimited Health: Health will not decrease
  * Unlimited Energy: Energy will not decrease
  * One Shot Kill: Enemies are killed with one shot
  * Float up/down:
      Press X to float up
      Press Shift-X to float down

  Subroutine Trainer:

  * Auto-Disinfect Subroutine: All Subroutine are disinfected when
      you enter the subroutine menu (F1).
  * Auto-Gold Subroutines: Subroutines received are automatically
      converted to gold version.
  * Insta-Process: Defrag, Disinfect and Port take no time (you
      have to exit and re-enter the subroutine menu though).

  Light Cycle Trainer:

  * Power Light Cycle: The maximum speed is much higher and the
      minimum speed is almost a standstill.

  Notes:
     There is a fight in the Progress Bar where you have to
     protect Ma3a. You might want to turn off 'One Shot Kill',
     because Ma3a is also regarded as a NPC.

     You should enable Unlimited Health when using float up.
     Because the fall will kill you otherwise.
     Float-Up and Float-Down go though ceilings and floors. So if
     you get stuck above a ceiling when floating up, just press
     shift-X until you are free again.
}

[ENABLE]
[DISABLE]"""

[[cheat]]
id = "enable-player-trainer"
name = "Enable Player Trainer"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{
  Game:    Tron 2.0
  Version: Patch v1.042
  Author:  gwodus (gwodusx@xsmail.com)

  The injection point is called whenever a character is hit (player and NPC).
  Register esi contains a pointer to struct sPlayer, which holds Health
  and Energy. Offset pPlayer+0x88 is 0 for NPCs and 1 for the player.
}

[ENABLE]
aobscan(inject_HEALTH,D9 5E 64 F6 C4 44)
alloc(mem_HEALTH,2048)
label(code_HEALTH)
label(bEnableHealth)
label(bEnableOneShotKill)
label(pPlayer)
label(returnhere)
label(exit)
label(npc)
label(player)
registersymbol(inject_HEALTH)
registersymbol(mem_HEALTH)
registersymbol(code_HEALTH)
registersymbol(bEnableHealth)
registersymbol(bEnableOneShotKill)
registersymbol(pPlayer)

mem_HEALTH:
bEnableHealth:
dd 01
bEnableOneShotKill:
dd 01
pPlayer:
dd 00

code_HEALTH:
fstp dword ptr [esi+64]  // orig code: set health
push eax

cmp dword [esi+88], 1
je player
cmp dword [esi+88], 0
je npc
jmp exit

player:
mov [pPlayer], esi

cmp [bEnableHealth], 0
je exit
mov eax, [esi+60]        // max health
mov [esi+64], eax        // current health
jmp exit

npc:
cmp [bEnableOneShotKill], 0
je exit
mov [esi+64], (float)0    // current health

exit:
pop eax
test ah,44
jmp returnhere

inject_HEALTH:
//"object.lto"+DECC3:
jmp code_HEALTH
nop
returnhere:

[DISABLE]
//object.ObjectDLLSetup+3BD01 - D9 46 7C              - fld dword ptr [esi+7C]
//object.ObjectDLLSetup+3BD04 - D8 1D FC42720D        - fcomp dword ptr [0D7242FC] : [00000000]
//object.ObjectDLLSetup+3BD0A - D9 46 64              - fld dword ptr [esi+64]
//object.ObjectDLLSetup+3BD0D - D8 64 24 10           - fsub dword ptr [esp+10]
//object.ObjectDLLSetup+3BD11 - DFE0                  - fnstsw ax
//----------- Inject Here ------------------
//object.ObjectDLLSetup+3BD13 - D9 5E 64              - fstp dword ptr [esi+64]
//object.ObjectDLLSetup+3BD16 - F6 C4 44              - test ah,44
//----------- Inject Here ------------------
//object.ObjectDLLSetup+3BD19 - 7B 3C                 - jnp object.ObjectDLLSetup+3BD57
//object.ObjectDLLSetup+3BD1B - 8B CE                 - mov ecx,esi
//object.ObjectDLLSetup+3BD1D - E8 0EF7FFFF           - call object.ObjectDLLSetup+3B430

inject_HEALTH:
db D9 5E 64 F6 C4 44

dealloc(mem_HEALTH)
unregistersymbol(inject_HEALTH)
unregistersymbol(mem_HEALTH)
unregistersymbol(code_HEALTH)
unregistersymbol(bEnableHealth)
unregistersymbol(bEnableOneShotKill)
unregistersymbol(pPlayer)"""

