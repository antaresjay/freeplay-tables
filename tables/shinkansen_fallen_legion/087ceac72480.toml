//05C21623 - C7 85 DCFEFFFF 00000000 - mov [ebp-00000124],00000000
//05C2162D - C7 85 E0FEFFFF 00000000 - mov [ebp-00000120],00000000
// Actor:Update+b7
//05C21637 - 8B 87 EC000000        - mov eax,[edi+000000EC]
//05C2163D - 85 C0                 - test eax,eax
//05C2163F - 0F84 99000000         - je 05C216DE
//05C21645 - 8B 87 F0000000        - mov eax,[edi+000000F0]
//05C2164B - 89 85 90FEFFFF        - mov [ebp-00000170],eax
//05C21651 - 8B 87 EC000000        - mov eax,[edi+000000EC]
//05C21657 - 83 EC 08              - sub esp,08
aobscan(Actor_searchedAOB, 8B 87 EC 00 00 00 85 C0 * * * * * * 8B 87 F0 00 00 00 89 85 90 FE FF FF)

alloc(Actor_newmem, 2048, Actor_searchedAOB)
alloc(Actor_temp1, 4, Actor_searchedAOB)
alloc(Actor_temp2, 4, Actor_searchedAOB)
alloc(Actor_temp3, 4, Actor_searchedAOB)
alloc(Actor_temp4, 4, Actor_searchedAOB)
alloc(Actor_temp5, 4, Actor_searchedAOB)


