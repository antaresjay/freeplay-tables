mov [Actor_temp1], eax
mov [Actor_temp2], ebx
mov [Actor_temp3], ecx
mov [Actor_temp4], edx

cmp byte ptr [edi+40], #1
je Actor_statsset_exit

cmp dword ptr [Actor_update_enable], #0
je Actor_update_exit
mov [Actor_basepointer], edi
Actor_update_exit:

cmp dword ptr [Actor_set_enable], #0
je Actor_set_exit
Actor_set_exit:

cmp dword ptr [Actor_healthset_enable], #0
je Actor_healthset_exit
mov ebx, [edi+f4]
mov [edi+134], ebx
Actor_healthset_exit:

cmp dword ptr [Actor_apset_enable], #0
je Actor_apset_exit
mov [edi+138], (float)300
mov [edi+13c], #3
Actor_apset_exit:

cmp dword ptr [Actor_statsset_enable], #0
je Actor_statsset_exit
mov ebx, [edi+60]
test ebx, ebx
je Actor_statsset_exit
mov [ebx+5c], #9999
mov [ebx+60], #9999
mov [ebx+64], #9999
mov [ebx+68], #9999
mov [ebx+6c], #9999
mov [ebx+70], #9999
mov [ebx+74], #9999
Actor_statsset_exit:

mov eax, [Actor_temp1]
mov ebx, [Actor_temp2]
mov ecx, [Actor_temp3]
mov edx, [Actor_temp4]


Actor_originalcode:
db 8B 87 EC 00 00 00
//mov eax,[edi+000000EC]


Actor_exit:
jmp Actor_returnhere


Actor_searchedAOB:
Actor_savedAOB:
jmp Actor_newmem
nop
Actor_returnhere:


[DISABLE]
Actor_savedAOB:
db 8B 87 EC 00 00 00
//mov eax,[edi+000000EC]

unregistersymbol(Actor_savedAOB)

dealloc(Actor_newmem)
dealloc(Actor_temp1)
dealloc(Actor_temp2)
dealloc(Actor_temp3)
dealloc(Actor_temp4)
dealloc(Actor_temp5)"""

