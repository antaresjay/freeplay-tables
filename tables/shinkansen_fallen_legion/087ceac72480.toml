[[cheat]]
id = "battlemanager-base-address-scan-initialization-activate-this-first"
name = "BattleManager Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(BattleManager_basepointer)
registersymbol(BattleManager_update_enable)
registersymbol(BattleManager_set_enable)
registersymbol(BattleManager_manaset_enable)
registersymbol(BattleManager_stageset_enable)

alloc(BattleManager_basepointer, 4)
alloc(BattleManager_update_enable, 4)
alloc(BattleManager_set_enable, 4)
alloc(BattleManager_manaset_enable, 4)
alloc(BattleManager_stageset_enable, 4)


[DISABLE]
unregistersymbol(BattleManager_basepointer)
unregistersymbol(BattleManager_update_enable)
unregistersymbol(BattleManager_set_enable)
unregistersymbol(BattleManager_manaset_enable)
unregistersymbol(BattleManager_stageset_enable)

dealloc(BattleManager_basepointer)
dealloc(BattleManager_update_enable)
dealloc(BattleManager_set_enable)
dealloc(BattleManager_manaset_enable)
dealloc(BattleManager_stageset_enable)"""

[[cheat]]
id = "battlemanager-base-address-scan-to-activate-battle-to-update-battle"
name = "BattleManager Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(BattleManager_savedAOB)
label(BattleManager_returnhere)
label(BattleManager_originalcode)
label(BattleManager_exit)

label(BattleManager_update_exit)
label(BattleManager_set_exit)
label(BattleManager_manaset_exit)
label(BattleManager_stageset_exit)

registersymbol(BattleManager_savedAOB)

//05E15650 - 8B 7D 08              - mov edi,[ebp+08]
//05E15653 - 83 EC 0C              - sub esp,0C
//05E15656 - 68 E0AF1013           - push 1310AFE0 : [04D48B34]
//05E1565B - E8 486D3FFF           - call 0520C3A8
// BattleManager:Update+18
//05E15660 - 83 C4 10              - add esp,10
//05E15663 - 85 C0                 - test eax,eax
//05E15665 - 74 48                 - je 05E156AF
//05E15667 - 0FB6 87 C6020000      - movzx eax,byte ptr [edi+000002C6]
//05E1566E - 85 C0                 - test eax,eax
//05E15670 - 74 3D                 - je 05E156AF
aobscan(BattleManager_searchedAOB, 83 C4 10 85 C0 74 48 0F B6 87 C6 02 00 00)

alloc(BattleManager_newmem, 2048, BattleManager_searchedAOB)
alloc(BattleManager_temp1, 4, BattleManager_searchedAOB)
alloc(BattleManager_temp2, 4, BattleManager_searchedAOB)
alloc(BattleManager_temp3, 4, BattleManager_searchedAOB)
alloc(BattleManager_temp4, 4, BattleManager_searchedAOB)
alloc(BattleManager_temp5, 4, BattleManager_searchedAOB)


BattleManager_newmem:
mov [BattleManager_temp1], eax
mov [BattleManager_temp2], ebx
mov [BattleManager_temp3], ecx
mov [BattleManager_temp4], edx

cmp dword ptr [BattleManager_update_enable], #0
je BattleManager_update_exit
mov [BattleManager_basepointer], edi
BattleManager_update_exit:

cmp dword ptr [BattleManager_set_enable], #0
je BattleManager_set_exit
BattleManager_set_exit:

cmp dword ptr [BattleManager_manaset_enable], #0
je BattleManager_manaset_exit
mov [edi+258], #9999
mov [edi+25c], #9999
mov [edi+260], #9999
BattleManager_manaset_exit:

cmp dword ptr [BattleManager_stageset_enable], #0
je BattleManager_stageset_exit
mov [edi+2dc], #0
mov [edi+2e0], #0
mov [edi+2e8], #9999
mov [edi+2ec], #9999
mov [edi+2f0], #9999
mov [edi+2f4], #9999
mov [edi+2f8], #9999
mov [edi+2fc], #9999
BattleManager_stageset_exit:

mov eax, [BattleManager_temp1]
mov ebx, [BattleManager_temp2]
mov ecx, [BattleManager_temp3]
mov edx, [BattleManager_temp4]


BattleManager_originalcode:
db 83 C4 10 85 C0
//add esp,10
//test eax,eax


BattleManager_exit:
jmp BattleManager_returnhere


BattleManager_searchedAOB:
BattleManager_savedAOB:
jmp BattleManager_newmem
BattleManager_returnhere:


[DISABLE]
BattleManager_savedAOB:
db 83 C4 10 85 C0
//add esp,10
//test eax,eax

unregistersymbol(BattleManager_savedAOB)

dealloc(BattleManager_newmem)
dealloc(BattleManager_temp1)
dealloc(BattleManager_temp2)
dealloc(BattleManager_temp3)
dealloc(BattleManager_temp4)
dealloc(BattleManager_temp5)"""

