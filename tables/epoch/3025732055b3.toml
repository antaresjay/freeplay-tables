[[cheat]]
id = "select-item-roll-rarity"
name = "Select Item Roll Rarity"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Last Epoch.exe
  Version: 1.0
  Date   : 2020-12-11
  Author : Messy ( aka SinGul4ritY )
  Select Rarity To Roll
           2023-03-10 - 0.9 update
           2021-12-11 - enabled Legendaries
           2021-01-08 - fixed a bug
           2021-01-06 - Option to cycle through the higher rarities
                      - moved options to Globals
  0:random
  7:Uniques
  8:SETS
  9:9 <LEGENDARY?> NOT Supported
  1:1 experimental
  2:2 experimental
  3:3 experimental
  4:4 experimental
  5:5 experimental
  6:6 experimental
}
[ENABLE]
define(RANDOM, 0)
define(UNIQUE, 7)
define(SET, 8)
define(LEGENDARY, 9)
define(SKIP, FE)
define(EOL, FF)
define(INIT, 50)
aobscanmodule(hkGIRRarity,$MODULE_NAME,0f28xxxxxx48xxxxxxxx0f28xxxxxx44xxxxxxxxxx44)
alloc(newmem,256,hkGIRRarity)
registersymbol(hkGIRRarity)
label(orgchkGIRRarity)
registersymbol(orgchkGIRRarity)
label(GetRollRarity)
label(return)
label(CleanUp)
label(RarityIdx)
label(Rarities)
label(NextRarity)
label(NoInit)
newmem:
    call GetRollRarity
    mov al, byte ptr [optRollRarityToUse]
orgchkGIRRarity:
\treadmem(hkGIRRarity, 5)
\tjmp return
GetRollRarity:
    push rax
    push rdx
    push rcx
    mov  al, byte ptr [optRollRarity]
    cmp  byte ptr [optRollRarityCycleThrough], 0
    je   CleanUp
    lea   rdx, [Rarities]
    movzx ecx, byte ptr [RarityIdx]
    cmp   cl, INIT
    jb    NoInit
    movzx ecx, byte ptr [optRollRarity]
    cmp   cl, MAX_RARITY
    jbe   @F
    mov   cl, MAX_RARITY
    mov   byte ptr [optRollRarity], cl
NoInit:
NextRarity:
        mov   al, byte ptr [rdx+ecx]
        cmp   al, EOL
        jne   @F
        mov   cl, byte ptr [optRollRarity]
        jmp   short NextRarity
@@:
        inc   cl
        cmp   al, SKIP
        je    short NextRarity
    mov  byte ptr [RarityIdx], cl
CleanUp:
    mov  byte ptr [optRollRarityToUse], al
    pop  rcx
    pop  rdx
    pop  rax
    ret
align 10 CC
optRollRarityToUse:
    db    INIT
align 10 CC
RarityIdx:
    db    0
align 10 CC
Rarities:
    db   RANDOM
    db   SKIP
    db   SKIP
    db   SKIP
    db   SKIP
    db   SKIP
    db   SKIP
    db   UNIQUE
    db   SET
    db   EOL
hkGIRRarity:
\tjmp newmem
return:
[DISABLE]
hkGIRRarity:
\treadmem(orgchkGIRRarity, 5)
dealloc(newmem)
unregistersymbol(hkGIRRarity)
unregistersymbol(orgchkGIRRarity)"""

