type = "script"
source = """
[ENABLE]

aobscanmodule(ammo,VAL_MUL-Win64-Shipping.exe,48 8B 01 48 8B D9 FF 90 F0)
alloc(newmem,$1000,ammo)

label(code)
label(return)

newmem:
push rcx
mov rcx,[rcx+02D0]
test rcx,rcx
je @f
mov [rcx+11E4],#30

@@:
pop rcx

code:
  mov rax,[rcx]
