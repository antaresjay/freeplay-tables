  seeIsPuzzleWasTakedBefore:
  dd 0

  seeNumOfFoundedStars:
  dd 0

  seeIsPuzzleCollected:
  dd 0

  seeIsHelped:
  dd 0

StarsA:
  jmp newmem
  nop 2
return:
registersymbol(StarsA)

