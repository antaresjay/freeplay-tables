type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(godmode)
label(returnhere_godmode)
label(originalcode_godmode)
label(godmode0)
label(returnhere_godmode0)
label(originalcode_godmode0)
label(doit)
label(hero)
label(returnhere_hero)
label(energy)
label(originalcode_energy)
label(returnhere_energy)
label(ammo)
label(originalcode_ammo)
label(returnhere_ammo)
label(credits)
label(returnhere_credits)
label(originalcode_credits)
label(stamina)
label(returnhere_stamina)
label(originalcode_stamina)
label(praxis)
label(returnhere_praxis)
label(originalcode_praxis)
label(experience)
///////////////////////////////////////////////////////////////////////////////
label(adam)
label(_gm)
label(_ohk)
label(_energy)
label(_ammo)
label(_cr)
label(_stamina)
label(_praxis)
label(_xp)
///////////////////////////////////////////////////////////////////////////////
registersymbol(_gm)
registersymbol(_ohk)
registersymbol(_energy)
registersymbol(_ammo)
registersymbol(_cr)
registersymbol(_stamina)
registersymbol(_praxis)
registersymbol(_xp)
///////////////////////////////////////////////////////////////////////////////
newmem:
///////////////////////////////////////////////////////////////////////////////
hero:
push [ecx+64]
pop [adam]
mov ecx,[ecx+64]
test ecx,ecx
jmp returnhere_hero
///////////////////////////////////////////////////////////////////////////////
godmode:
cmp [adam],esi
je doit
cmp dword ptr [_ohk],1
jne originalcode_godmode
cmp [esi+5C],40000000
jle originalcode_godmode
mov [esi+5C],40000000
jmp originalcode_godmode

doit:
cmp dword ptr [_gm],1
jne originalcode_godmode
mov [esi+5C],(float)200
fld dword ptr [esi+5C]
mov [esp+10],0
fsub dword ptr [esp+10]
mov [esi+5C],(float)200
jmp returnhere_godmode

originalcode_godmode:
fld dword ptr [esi+5C]
fsub dword ptr [esp+10]
jmp returnhere_godmode

godmode0:
cmp dword ptr [_gm],1
jne originalcode_godmode0
mov [esi+5C],(float)200
originalcode_godmode0:
fld dword ptr [esi+5C]
fdiv dword ptr [eax+08]
jmp returnhere_godmode0
///////////////////////////////////////////////////////////////////////////////
energy:
cmp dword ptr [_energy],1
jne originalcode_energy
mov [ecx+04],(float)150
originalcode_energy:
fld dword ptr [ecx+04]
mov ecx,[ecx]
jmp returnhere_energy
///////////////////////////////////////////////////////////////////////////////
ammo:
cmp dword ptr [_ammo],1
jne originalcode_ammo
inc word ptr [eax+14]
originalcode_ammo:
dec word ptr [eax+14]
mov ecx,[esi+70]
jmp returnhere_ammo
///////////////////////////////////////////////////////////////////////////////
credits:
cmp dword ptr [_cr],1
jne originalcode_credits
push edx
mov edx,[ebx+60]
add [edx+60],#1000
pop edx
mov [_cr],0
originalcode_credits:
mov eax,[ebx+60]
mov ecx,[eax+14]
jmp returnhere_credits
///////////////////////////////////////////////////////////////////////////////
stamina:
cmp dword ptr [_stamina],1
jne originalcode_stamina
mov [ecx+30],0
originalcode_stamina:
fld dword ptr [ecx+30]
ret
int 3
jmp returnhere_stamina
///////////////////////////////////////////////////////////////////////////////
praxis:
push eax
mov eax,[edx+14]
cmp dword ptr [_praxis],1
jne experience
add [eax+140],1
mov [_praxis],0
experience:
cmp dword ptr [_xp],1
jne originalcode_praxis
add [eax+138],#1000
add [eax+13C],#1000
mov [_xp],0
originalcode_praxis:
pop eax
mov ecx,[edx+14]
call 004513E0
jmp returnhere_praxis
///////////////////////////////////////////////////////////////////////////////
adam:
dd 0

_gm:
dd 0

_ohk:
dd 0

_energy:
dd 0

_ammo:
dd 0

_cr:
dd 0

_stamina:
dd 0

_praxis:
dd 0

_xp:
dd 0
///////////////////////////////////////////////////////////////////////////////
dxhr.exe+1A9250:
jmp godmode
nop
nop
returnhere_godmode:

dxhr.exe+2799A:
jmp godmode0
nop
returnhere_godmode0:

dxhr.exe+2BD561:
jmp hero
returnhere_hero:

dxhr.exe+304C33:
jmp energy
returnhere_energy:

dxhr.exe+376048:
jmp ammo
nop
nop
returnhere_ammo:

dxhr.exe+D31FB:
jmp credits
nop
returnhere_credits:

dxhr.exe+1490F0:
jmp stamina
returnhere_stamina:

dxhr.exe+1E3C8A:
jmp praxis
nop
nop
nop
returnhere_praxis:
///////////////////////////////////////////////////////////////////////////////
[DISABLE]
dxhr.exe+1A9250:
fld dword ptr [esi+5C]
fsub dword ptr [esp+10]
//Alt: db D9 46 5C D8 64 24 10
dxhr.exe+2BD561:
mov ecx,[ecx+64]
test ecx,ecx
//Alt: db 8B 49 64 85 C9
dxhr.exe+304C33:
fld dword ptr [ecx+04]
mov ecx,[ecx]
//Alt: db D9 41 04 8B 09
dxhr.exe+376048:
dec word ptr [eax+14]
mov ecx,[esi+70]
//Alt: db 66 FF 48 14 8B 4E 70
dxhr.exe+D31FB:
mov eax,[ebx+60]
mov ecx,[eax+14]
//Alt: db 8B 43 60 8B 48 14
dxhr.exe+1490F0:
fld dword ptr [ecx+30]
ret
int 3
//Alt: db D9 41 30 C3 CC
dxhr.exe+2799A:
fld dword ptr [esi+5C]
fdiv dword ptr [eax+08]
//Alt: db D9 46 5C D8 70 08
dxhr.exe+1E3C8A:
mov ecx,[edx+14]
call 004513E0
//Alt: db 8B 4A 14 E8 4E D7 E6 FF

dealloc(newmem)
unregistersymbol(_gm)
unregistersymbol(_ohk)
unregistersymbol(_energy)
unregistersymbol(_ammo)
unregistersymbol(_cr)
unregistersymbol(_stamina)
unregistersymbol(_praxis)
unregistersymbol(_xp)"""

