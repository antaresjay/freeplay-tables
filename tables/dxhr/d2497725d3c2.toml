[[cheat]]
id = "infinite-health"
name = "INFINITE HEALTH"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(health)
label(returnhere)
registersymbol(health)
aobscan(aob_health,D9 46 5C D8 70 08 D9 5C 24 18 D8 44 24 18 D9 5C 24 1C)

newmem:
mov [esi+5C],(float)1000
fld dword ptr [esi+5C]
fdiv dword ptr [eax+08]
jmp returnhere

aob_health:
health:
jmp newmem
nop
returnhere:

[DISABLE]
dealloc(newmem)
unregistersymbol(health)
health:
fld dword ptr [esi+5C]
fdiv dword ptr [eax+08]"""

