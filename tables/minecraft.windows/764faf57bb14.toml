id = "give-item"
name = "Give Item"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Minecraft.Windows.exe
  Version: 
  Date   : 2022-01-07
  Author : Juan

  This script gets Inventory Box 1
  ***This is for Single player only in Adventure/Survival Mode NOT MULTI Player/REALMS***
}

[ENABLE]

aobscanmodule(InvBox,Minecraft.Windows.exe,42 80 7C 31 22 00) // should be unique
alloc(newmem,$1000,InvBox)
alloc(BoxPtr,4)

label(code)
label(return)

BoxPtr:
dd 0


newmem:
cmp [rsp+8],00007FF693573E99 // compares if value is internal/visual
jne code
mov [BoxPtr],rcx  // moves base address

code:
  cmp byte ptr [rcx+r14+22],00
  jmp return

InvBox:
  jmp newmem
  nop
return:
registersymbol(InvBox BoxPtr)

[DISABLE]

InvBox:
  db 42 80 7C 31 22 00

unregistersymbol(InvBox BoxPtr)
dealloc(newmem BoxPtr)

