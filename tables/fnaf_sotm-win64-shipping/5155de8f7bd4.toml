[[cheat]]
id = "player-character-ctrl-numpad-2"
name = "Player Character (Ctrl + Numpad 2)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : FNAF_SOTM-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 4.27.2.0
// Game Version      : Build.18774235
// Script Date       : 2025-06-14


[ENABLE]

aobscanmodule(master,FNAF_SOTM-Win64-Shipping.exe,488BxxF2xxxxxxxxxxFFxxxxxxxxxx0F28xxxxxx4883) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,9)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,9)

newmem:
  mov [data],rcx

code:
  readmem(master,9)
  jmp return

master:
  jmp newmem
  nop 4
return:

[DISABLE]

master:
  readmem(masterbkp,9)

unregistersymbol(*)
dealloc(*)"""

