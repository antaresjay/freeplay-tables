[[cheat]]
id = "lives-editor-ctrl-numpad-2"
name = "Lives Editor (Ctrl + Numpad 2)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Deathwish Enforcers.exe
// Author            : ndck76
// Executable Version: 2020.3.48.1457
// Game Version      : v1.2B
// Script Date       : 2024-02-18


[ENABLE]

aobscanregion(lives,hudData:LateUpdate,hudData:LateUpdate+40000,4863xx85xx0Fxxxxxxxxxx48B8xxxxxxxxxxxx00000Fxxxx85xx0Fxxxxxxxxxx48B8xxxxxxxxxxxx000048xxxx48B8xxxxxxxxxxxx000048xxxx48xxxxxxxx) //hudData:LateUpdate+1b92
alloc(newmem,$1000,lives)
alloc(data3,8)
alloc(livesbkp,5)
registersymbol(data3)
registersymbol(lives)
registersymbol(livesbkp)
label(code)
label(return)

livesbkp:
  readmem(lives,5)

newmem:
  mov [data3],rax

code:
  readmem(lives,5)
  jmp return

lives:
  jmp newmem
return:

[DISABLE]

lives:
  readmem(livesbkp,5)

unregistersymbol(*)
dealloc(*)"""

