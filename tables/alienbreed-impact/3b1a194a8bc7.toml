source = """
[ENABLE]

aobscanmodule(INJECT,AlienBreed-Impact.exe,F3 0F 10 07 F3 0F 58 44 24 10) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(infsta)

newmem:

