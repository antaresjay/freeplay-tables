[[cheat]]
id = "right-click-here-change-script-for-info"
name = "Right click HERE -> change script for info"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
Here's a nifty table for Team 17's "Alien Breed: Impact" as
sold on Steam (tested with a newer steam build as of the
7th of March 2017).

It includes a god mode script (which this time might work
exclusively for the player and NOT the final boss),
a script to always have 200 shots loaded no matter the
weapon and last but not least another script unlimited item
uses.

I've also included some pointers which ARE NOT verified to
work, at least all the time. Use at your own risk! Yes,
changing a wrong value could kill your (save)game.
Health, Stamina and Credits seem to be pretty stable, the
rest not so much, depending on level and your difficulty
setting (at least that's my assumption).

Known bugs:
-deactivating unlimited item uses might crash your game.

Yes, yes, I still know about the table extras, but leaving info
like this is my thing. Thanks for reading & enjoy - CyberD3m0n!
}

[ENABLE]
[DISABLE]"""

[[cheat]]
id = "true-god-mode"
name = "True god mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,AlienBreed-Impact.exe,29 03 8B 1B 8B 4C 24 14) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(player)

newmem:

code:
  cmp [ebx+0190],2
  je player
  sub [ebx],eax
  mov ebx,[ebx]
  mov ecx,[esp+14]
  jmp return

player:
  nop
  mov ebx,[ebx]
  mov ecx,[esp+14]
  jmp return

INJECT:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 29 03 8B 1B 8B 4C 24 14

unregistersymbol(INJECT)
dealloc(newmem)

AlienBreed-Impact.exe+BE9E8:
  sub [ebx],eax
  mov ebx,[ebx]
  mov ecx,[esp+14]"""

[[cheat]]
