[[cheat]]
id = "instant-stagger-on-parry"
name = "Instant Stagger on Parry"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobScanModule(NBSB06,$process,0F28xxF3xxxxxx0F2Fxx77xx0F57xxEBxxF3xxxxxxxxxxxxxxF3xxxxxx66)
alloc(memNBSB06,$400)

registerSymbol(NBSB06)
registerSymbol(NBSB06_bak)

label(NBSB06_bak)
label(NBSB06_n_code)
label(NBSB06_o_code)
label(NBSB06_exit)
label(NBSB06_return)

memNBSB06:
  NBSB06_bak:
    readMem(NBSB06,7)
\talign 10 CC
  NBSB06_n_code:
    cmp [rsi+10C],(int)100
    je NBSB06_o_code
    xorps xmm0,xmm0
    comiss xmm7,xmm0
    jae NBSB06_o_code
    xorps xmm7,xmm7
    subss xmm7,[rsi+14C]
  NBSB06_o_code:
    readMem(NBSB06,7)
  NBSB06_exit:
    jmp NBSB06_return

Trampolines+50:
  jmp far NBSB06_n_code
  align 10 CC
  
NBSB06:
  jmp Trampolines+50
  nop 2 
  NBSB06_return:

[DISABLE]
NBSB06:
  readMem(NBSB06_bak,7)

unregisterSymbol(*)
dealloc(*)"""

