[[cheat]]
id = "undead"
name = "undead"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanmodule(healthReadOnChangeAOB,$process,F3 * * * * * * 00 00 * * * 00 00 4* * * E8 * * * * * * 74 * F*)
registersymbol(healthReadOnChangeAOB)

label(dMinHealth)
registersymbol(dMinHealth)

alloc(newmem,2048)
label(returnhere)
label(originalcode_healthReadOnChangeAOB)
registersymbol(originalcode_healthReadOnChangeAOB)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
mov rcx,pPlayerStatsBase
cmp [rcx],rdi
jne @f
db 48 8D 8F
readmem(healthReadOnChangeAOB+5,4)
//lea rcx,[rdi+11c]
movss xmm8,[rcx+4]
maxss xmm8,[rcx+8]
mov rcx,dMinHealth
mulss xmm8,[rcx]
maxss xmm8,[rcx+4]
subss xmm8,xmm0
readmem(healthReadOnChangeAOB,3)
db 5F
readmem(healthReadOnChangeAOB+4,5)
//maxss xmm8,[rdi+11c]
readmem(healthReadOnChangeAOB,3)
db 11
readmem(healthReadOnChangeAOB+4,5)
//movss [rdi+11c],xmm8
@@:

originalcode_healthReadOnChangeAOB:
readmem(healthReadOnChangeAOB,14)
//movss xmm8,[rdi+0000011C]
//mov edx,0000001B

exit:
jmp returnhere

///
dMinHealth:
dd (float)0.3
dd (float)1
///

healthReadOnChangeAOB: //"SB-Win64-Shipping.exe"+1A31655:
jmp far newmem
returnhere:




[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
healthReadOnChangeAOB: //"SB-Win64-Shipping.exe"+1A31655:
readmem(originalcode_healthReadOnChangeAOB,14)
//db F3 44 0F 10 87 1C 01 00 00 BA 1B 00 00 00
//movss xmm8,[rdi+0000011C]
//mov edx,0000001B
unregistersymbol(originalcode_healthReadOnChangeAOB)

unregistersymbol(dMinHealth)"""

