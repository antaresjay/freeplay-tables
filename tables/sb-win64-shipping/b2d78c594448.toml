[[cheat]]
id = "money-on-gain"
name = "Money On Gain"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(MoneyOnGain,SB-Win64-Shipping.exe,44 03 71 6C 48 83 C5 10)
alloc(newmem,$1000,MoneyOnGain)
registersymbol(SetMoney)
label(code return SetMoney)

newmem:
push r8
mov r8,[SetMoney]
mov [rcx+6C],r8
jmp code

code:
  pop r8
  add r14d,[rcx+6C]
  add rbp,10
  jmp return

SetMoney:
dd #99999

MoneyOnGain:
  jmp newmem
  nop 3
return:
registersymbol(MoneyOnGain)

[DISABLE]

MoneyOnGain:
  db 44 03 71 6C 48 83 C5 10

unregistersymbol(*)
dealloc(*)"""

