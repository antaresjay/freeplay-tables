type = "script"
source = """
{ Game   : SB-Win64-Shipping.exe
  Version: DEMO
  Date   : 2025-06-01
  Author : Oyyzj

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(EVE,SB-Win64-Shipping.exe,F3 0F 2C 81 1C 01 00 00) // should be unique
alloc(newmem,$1000,EVE)
registersymbol(EVE)
alloc(pEVE,8)
registersymbol(pEVE)

label(return)
label(r_EVE)
registersymbol(r_EVE)

newmem:
  mov [pEVE],rcx
  readmem(EVE,8)
  jmp return
r_EVE:
  readmem(EVE,8)
EVE:
  jmp newmem
  db 90 90 90
return:


[DISABLE]

EVE:
  readmem(r_EVE,8)

unregistersymbol(*)
dealloc(*)"""

