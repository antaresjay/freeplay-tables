type = "script"
source = """
//

[ENABLE]

aobscanmodule(Super_XBooster,Mega Man X8 16-bit 1.0.0.9.exe,C8 FF FF F2 41 0F 10 47 08)
alloc(newmem,$100,Super_XBooster)
alloc(Booster,8)


label(code)
label(return)

newmem:
//---------------------ITS A MESS!!!!!!
cmp [rsp],r10
jne code
cmp [rsp+10],rbp
jne code
cmp [rsp+18],rsi
jne code
cmp [rsp+20],r10
jne code
cmp [rsp+28],r14
jne code
cmp [rsp+30],r10
jne code
cmp [rsp+80],r10
jne code
cmp [rsp+A8],r10
jne code
cmp [rsp+140],r10
jne code
cmp [rsp+150],r12
jne code
cmp [rsp+158],rdi
jne code
cmp [rsp+160],rbp
jne code
cmp [rsp+178],rsi
jne code
cmp [rsp+1B0],r14
jne code
cmp [rsp+1B8],r10
jne code
//-----------------------Injection here
fstp st(0)
fld qword ptr [Booster]
fstp qword ptr [r15+08]

code:
  movsd xmm0,[r15+08]
  jmp return

Super_XBooster+03:
  jmp newmem
  nop
return:

Booster:
 dq (double)5.00000026077032



registersymbol(Super_XBooster,Booster)

