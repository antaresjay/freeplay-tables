type = "script"
source = """
{ Game   : BeatBlast.exe
  Version: 
  Date   : 09/11/2021
  Author : LeFiXER

  Player
}

[ENABLE]

aobscanregion(aobPlayer,PlayerCharacter:CanBeHarmed,PlayerCharacter:CanBeHarmed+52,3E 00 00 00 48 8B 86 80 00 00 00)
alloc(newmem,$1000,aobPlayer)
alloc(player,8)
label(code)
label(return)

newmem:
  mov [player],rsi
code:
  mov rax,[rsi+00000080]
  jmp return

aobPlayer+04:
  jmp newmem
  nop 2
return:
registersymbol(aobPlayer)
registersymbol(player)
[DISABLE]

aobPlayer+04:
  db 48 8B 86 80 00 00 00

unregistersymbol(aobPlayer)
unregistersymbol(player)
dealloc(newmem)
dealloc(player)"""

