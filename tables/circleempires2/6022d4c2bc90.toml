// 2. ApplyTechOrder (执行层): 检查 HasResourcesFor(0) → 通过 → SpendResourceList(0) → GainTech

// ORIGINAL CODE - INJECTION POINT: GetTechPriceWithTechsAndPlayerStats+59
GetTechPrice+59: FF 50 B8              - call qword ptr [rax-48]  (GetDiscountedPriceList)
// ---------- INJECTING HERE ----------
GetTechPrice+5C: 48 8B 75 F0           - mov rsi,[rbp-10]
GetTechPrice+60: 48 8B 7D F8           - mov rdi,[rbp-08]
// ---------- DONE INJECTING  ----------
GetTechPrice+64: 48 8D 65 00           - lea rsp,[rbp+00]
