[[cheat]]
id = "free-tech-research-for-player"
name = "Free Tech Research For Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Circle Empires 2
  Version: 1.0
  Date   : 2026-07-15
  Author : CannonFodder

  功能: 人类玩家研究科技时不消耗资源
  原理: 直接注入 GetTechPriceWithTechsAndPlayerStats 方法本身
        该方法被 UI 层 TryAddBuyTechOrder 和执行层 ApplyTechOrder 共同调用
        在方法返回 List<int> 前，检查 this.player.isAIPlayer
        人类 → 清零 _items[]，所有调用者看到全零价格
        AI   → 保持原值不变

  前置条件: 需先在 CE 菜单中执行 Mono -> Activate mono features
}

[ENABLE]

// AOB: call [rax-48] (GetDiscountedPriceList)); mov rsi,[rbp-10]; mov rdi,[rbp-08]; lea rsp,[rbp+00]; pop rbp; ret
aobscanregion(INJECT, AreaNS.PlayerTech:GetTechPriceWithTechsAndPlayerStats+00, AreaNS.PlayerTech:GetTechPriceWithTechsAndPlayerStats+400, FF 50 B8 48 8B 75 F0 48 8B 7D F8 48 8D 65 00 5D C3)

// 注入点: mov rsi,[rbp-10] (AOB+3), 覆盖 8 字节
// 原始: mov rsi,[rbp-10] (4) + mov rdi,[rbp-08] (4)
define(INJECT_PT, INJECT+3)
// returnhere: lea rsp,[rbp+00] (AOB+11)
define(RET_HERE, INJECT+11)

alloc(newmem,$1000,INJECT_PT)

registersymbol(INJECT)

label(returnhere)

newmem:
  push r10
  push r11

  // rdi = this (PlayerTech), +18 = player, +10C = isAIPlayer
  mov r10, [rdi+18]
  cmp dword ptr [r10+10C], 0
  pop r11
  pop r10
  je @human

@ai:
  mov rsi, [rbp-10]
  mov rdi, [rbp-08]
  jmp returnhere

@human:
  push r10
  push r11
  push r12

  // rax = List<int>*, +10 = _items (int[]*)
  mov r10, [rax+10]
  test r10, r10
  jz @human_done

  // r11d = array.Length (+0x18)
  mov r11d, [r10+18]
  test r11d, r11d
  jz @human_done

  // 循环: element[i] (array+0x20 + i*4) = 0
  xor r12d, r12d
@zero_loop:
  mov dword ptr [r10+r12*4+20], 0
  inc r12d
  cmp r12d, r11d
  jl @zero_loop

@human_done:
  pop r12
  pop r11
  pop r10

  mov rsi, [rbp-10]
  mov rdi, [rbp-08]
  jmp returnhere

INJECT_PT:
  jmp newmem
  nop
  nop
  nop

returnhere:

[DISABLE]

INJECT_PT:
  db 48 8B 75 F0 48 8B 7D F8

unregistersymbol(INJECT)
dealloc(newmem)

{
// C# decompile:
