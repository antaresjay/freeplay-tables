GainXp+0B: 48 89 75 D8           - mov [rbp-28],rsi
GainXp+0F: 48 89 7D E0           - mov [rbp-20],rdi
GainXp+13: 4C 89 65 E8           - mov [rbp-18],r12
GainXp+17: 4C 89 75 F0           - mov [rbp-10],r14
GainXp+1B: 4C 89 7D F8           - mov [rbp-08],r15
