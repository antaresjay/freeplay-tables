type = "script"
source = """
[ENABLE]

aobscanregion(gotthemallgoing, CartMenuCanvas:SetupObjectsInShop+0, CartMenuCanvas:SetupObjectsInShop+307, 48 8B 47 38 48 89 85 30 FF FF FF 48 8B CD)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov [rdi+68], (float)0.0

code:
  mov rax,[rdi+38]
  mov [rbp-000000D0],rax
  mov rcx,rbp
  jmp return

gotthemallgoing:
  jmp far newmem
return:
registersymbol(gotthemallgoing)

[DISABLE]

gotthemallgoing:
  db 48 8B 47 38 48 89 85 30 FF FF FF 48 8B CD

unregistersymbol(gotthemallgoing)
dealloc(newmem)"""
