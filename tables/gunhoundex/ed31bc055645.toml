alloc(playerstats_boostset_enable, 4)
alloc(playerstats_speedset_enable, 4)
alloc(playerstats_ammoset_enable, 4)


[DISABLE]
unregistersymbol(playerstats_basepointer)
unregistersymbol(playerstats_update_enable)
unregistersymbol(playerstats_set_enable)
unregistersymbol(playerstats_armorset_enable)
unregistersymbol(playerstats_boostset_enable)
unregistersymbol(playerstats_speedset_enable)
unregistersymbol(playerstats_ammoset_enable)

dealloc(playerstats_basepointer)
dealloc(playerstats_update_enable)
dealloc(playerstats_set_enable)
dealloc(playerstats_armorset_enable)
dealloc(playerstats_boostset_enable)
dealloc(playerstats_speedset_enable)
dealloc(playerstats_ammoset_enable)"""

[[cheat]]
id = "player-stats-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Player Stats Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstats_update_exit)
label(playerstats_set_exit)
label(playerstats_armorset_exit)
label(playerstats_boostset_exit)
label(playerstats_speedset_exit)
label(playerstats_ammoset_exit)

registersymbol(playerstats_savedAOB)

//GunHoundEx.exe+1A93F - 74 2A                 - je GunHoundEx.exe+1A96B
//GunHoundEx.exe+1A941 - B9 50000000           - mov ecx,00000050
// Accesses Boost Gauge Used
//GunHoundEx.exe+1A946 - 2B 8D 74010000        - sub ecx,[ebp+00000174]
//GunHoundEx.exe+1A94C - B8 67666666           - mov eax,66666667
//GunHoundEx.exe+1A951 - 6B C9 64              - imul ecx,ecx,64
//GunHoundEx.exe+1A954 - F7 E9                 - imul ecx
aobscan(playerstats_searchedAOB, 2B 8D 74 01 00 00 B8 67 66 66 66)

alloc(playerstats_newmem, 2048, playerstats_searchedAOB)
alloc(playerstats_temp1, 4, playerstats_searchedAOB)
alloc(playerstats_temp2, 4, playerstats_searchedAOB)
alloc(playerstats_temp3, 4, playerstats_searchedAOB)
alloc(playerstats_temp4, 4, playerstats_searchedAOB)


playerstats_newmem:
mov [playerstats_temp1], eax
mov [playerstats_temp2], ebx
mov [playerstats_temp3], ecx
mov [playerstats_temp4], edx

cmp dword ptr [playerstats_update_enable], #0
je playerstats_update_exit
mov [playerstats_basepointer], ebp
playerstats_update_exit:

cmp dword ptr [playerstats_set_enable], #0
je playerstats_set_exit
playerstats_set_exit:

cmp dword ptr [playerstats_armorset_enable], #0
je playerstats_armorset_exit
mov [ebp+158], #10000
playerstats_armorset_exit:

cmp dword ptr [playerstats_boostset_enable], #0
je playerstats_boostset_exit
mov [ebp+174], #0
playerstats_boostset_exit:

cmp dword ptr [playerstats_speedset_enable], #0
je playerstats_speedset_exit
mov [ebp+188], #200
playerstats_speedset_exit:

cmp dword ptr [playerstats_ammoset_enable], #0
je playerstats_ammoset_exit
mov ebx, [ebp+598]
mov [ebp+594], ebx
mov ebx, [ebp+5f0]
mov [ebp+5ec], ebx
mov ebx, [ebp+61c]
mov [ebp+618], ebx
playerstats_ammoset_exit:

mov eax, [playerstats_temp1]
mov ebx, [playerstats_temp2]
mov ecx, [playerstats_temp3]
mov edx, [playerstats_temp4]


playerstats_originalcode:
db 2B 8D 74 01 00 00
//ssub ecx,[ebp+00000174]


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB:
playerstats_savedAOB:
jmp playerstats_newmem
nop
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
db 2B 8D 74 01 00 00
//ssub ecx,[ebp+00000174]

unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)
dealloc(playerstats_temp1)
dealloc(playerstats_temp2)
dealloc(playerstats_temp3)
dealloc(playerstats_temp4)"""

