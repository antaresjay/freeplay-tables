[[cheat]]
id = "stage-timer-ctrl-numpad-3"
name = "Stage Timer (Ctrl + Numpad 3)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Wild Dogs.exe
// Author            : ndck76
// Executable Version: 2021.3.18.10726
// Game Version      : v1.0.0
// Script Date       : 2023-07-11


define(address,GameController:SetTime+42)
define(bytes,F3 0F 10 01 F3 0F 5A C0)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,GameController:SetTime+42)

label(code)
label(return)
label(data)
registersymbol(data)

newmem:

code:
  mov [data],rcx
  movss xmm0,[rcx]
  cvtss2sd xmm0,xmm0
  jmp return

data:
  db

address:
  jmp newmem
  nop 3
return:

[DISABLE]

address:
  db bytes
  // movss xmm0,[rcx]
  // cvtss2sd xmm0,xmm0

dealloc(*)
unregistersymbol(*)"""

