[[cheat]]
id = "no-weapons-overheat"
name = "No Weapons Overheat"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(overheatcd,MassEffect.exe,F1 F3 0F 10 86 90 02 00 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  mov [esi+00000290], 0
  movss xmm0, [esi+00000290]
  jmp return

overheatcd+01:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(overheatcd)

[DISABLE]

overheatcd+01:
  db F3 0F 10 86 90 02 00 00

unregistersymbol(overheatcd)
dealloc(newmem)"""
