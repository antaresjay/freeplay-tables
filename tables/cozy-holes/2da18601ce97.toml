[[cheat]]
id = "pet-controller-ctrl-numpad-4-need-to-acquire-dog-to-populate-values"
name = "Pet Controller (Ctrl + Numpad 4) {Need to acquire 'Dog' to populate values}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Cozy Holes.exe
// Author            : ndck76
// Executable Version: 6000.0.67.41410
// Game Version      : Build.22110563
// Script Date       : 2026-03-30


[ENABLE]

aobscanregion(sincedig,PetController:Update,PetController:Update+300,F30F1086Cxxx0000F3xxxxxxF2xxxxxxxx48xxxxxxxx9049BBxxxxxxxxxxxx000041xxxxF3xxxxxxF2xxxxxxxxF2xxxxxxF2xxxxxx) //PetController:Update+17
alloc(newmem,$1000,sincedig)
alloc(data5,8)
alloc(sincedigbkp,8)
registersymbol(data5)
registersymbol(sincedig)
registersymbol(sincedigbkp)
label(code)
label(return)

sincedigbkp:
  readmem(sincedig,8)

newmem:
  mov [data5],rsi

code:
  readmem(sincedig,8)
  jmp return

sincedig:
  jmp newmem
  nop 3
return:

[DISABLE]

sincedig:
  readmem(sincedigbkp,8)

unregistersymbol(*)
dealloc(*)"""

