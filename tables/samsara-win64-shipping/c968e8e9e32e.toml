[[cheat]]
id = "health"
name = "Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(_health,$process,F3 0F 11 47 0C E8 91)
alloc(newmem,$100,_health)
label(code return)
registersymbol(_health)
newmem:
  cmp [rdi+1c0],(float)5
  jne code
  mov [rdi+c],(float)10000
  jmp return
code:
  movss [rdi+c],xmm0
  jmp return
_health:
  jmp newmem
return:
[DISABLE]
dealloc(newmem)
unregistersymbol(_health)
_health:
  db F3 0F 11 47 0C"""

