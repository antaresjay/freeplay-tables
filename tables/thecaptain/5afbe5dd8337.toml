[[cheat]]
id = "trading-options"
name = "Trading Options"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : TheCaptain.exe
  Version: 
  Date   : 17/09/2022
  Author : LeFiXER

  Free items
}

[ENABLE]

aobscanregion(aobPlayerWallet,TradePlanetLocationHotSpot:handleBuyDialogue+1a2,TradePlanetLocationHotSpot:handleBuyDialogue+1d0,2B CA 89 48 ?? 48) // should be unique
alloc(newmem,$1000,aobPlayerWallet)
alloc(freeitems,1)
alloc(walletstore,5)
alloc(money,4)
registersymbol(walletstore)
label(code)
label(return)
label(setmoney)
label(free)

walletstore:
  readmem(aobPlayerWallet,5)

newmem:
  cmp [money],0
  jg setmoney
  jmp free

setmoney:
  mov ecx,[money]
\t\tjmp free

free:
  cmp byte ptr [freeitems],0
  je code
  xor edx,edx
  sub ecx,edx
  jmp return

code:
  sub ecx,edx
  mov [rax+74],ecx
  jmp return

aobPlayerWallet:
  jmp newmem

return:
registersymbol(aobPlayerWallet)
registersymbol(freeitems)
registersymbol(money)
[DISABLE]

aobPlayerWallet:
   readmem(walletstore,5)

unregistersymbol(aobPlayerWallet)
unregistersymbol(freeitems)
unregistersymbol(walletstore)
unregistersymbol(money)
dealloc(newmem)
dealloc(freeitems)
dealloc(walletstore)
dealloc(money)"""

