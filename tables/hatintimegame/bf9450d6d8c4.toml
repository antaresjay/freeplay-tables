[[cheat]]
id = "pointers"
name = "Pointers"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// RDI == Base Addresses
// R8 == Offset
[ENABLE]
aobscanmodule(pointers_aob,HatinTimeGame.exe,4C 63 81 8C 00 00 00 4C 03 C7)
alloc(newmem,$100,"HatinTimeGame.exe"+3408D)

label(return)
label(pointerdata)
label(end)
registersymbol(pointerdata)

newmem:
// Original Code
movsxd r8,dword ptr [rcx+0000008C]
// My Code
// Ponds and Yarn
cmp r8,F8
jne short @f
  mov [pointerdata],rdi // Ponds
  jmp short end
@@:
// Timer
cmp r8,80
jne short @f
  cmp [rdi+78],50
  jne short @f
    mov [pointerdata+10],rdi
    jmp short end
@@:
// Rift Tokens
cmp r8,68
jne short @f
  test r9,r9
  je short @f
    cmp [rsp+228],HatinTimeGame.exe+9DAAC4
    jne short @f
      // Whole Inventory
      cmp [rdi+68],1
      je short @f
        mov [pointerdata+8],rdi // Rift Tokens
        jmp short end
// Ship Shape Stars
@@:
cmp r8,188
jne short @f
  cmp [rsp+208],HatinTimeGame.exe+609CB
  jne short @f
    mov [pointerdata+10],rdi
    jmp short end

@@:

// END
end:
jmp return

pointerdata:
dq 0,0,0,0

pointers_aob:
  jmp newmem
  nop
  nop
return:
registersymbol(pointers_aob)

[DISABLE]

pointers_aob:
  db 4C 63 81 8C 00 00 00

unregistersymbol(pointers_aob)
dealloc(newmem)
unregistersymbol(pointerdata)"""

