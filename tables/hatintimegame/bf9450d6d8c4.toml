[[cheat]]
id = "teleport-activation"
name = "Teleport Activation"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(teleportscript,HatinTimeGame.exe,F3 0F 58 BF 80 00 00 00 F3 0F 58)
alloc(newmem,$1000,"HatinTimeGame.exe"+377377)

label(code)
label(return)
label(teledata)
label(cleanup)
label(savecall)
label(loadcall)
registersymbol(teledata)

newmem:
// Setting Up Stuff
push rax
sub rsp,10
movdqu [rsp],xmm0
mov eax,[teledata+4]
cmp [teledata],1
je save
cmp [teledata],2
je load
jmp cleanup

//Save
save:
test eax,eax
je cleanup
cmp eax,1
jne short @f
movups xmm0,[rdi+80] // +80 = X-Coord +84 = Y-Coord +88 = Z-Coord +8C = 0?
call savecall
jmp cleanup

@@:
cmp eax,2
jne short @f
movups xmm0,[rdi+80]
call savecall
jmp cleanup

@@:
cmp eax,3
jne short @f
movups xmm0,[rdi+80]
call savecall
jmp cleanup

@@:
jmp cleanup

//Load
load:
test eax,eax
je cleanup
cmp eax,1
jne short @f
movups xmm0,[teledata+8] // Saved Coords 1
call loadcall
jmp cleanup

@@:
cmp eax,2
jne short @f
movups xmm0,[teledata+18] // Saved Coords 2
call loadcall
jmp cleanup

@@:
cmp eax,3
jne short @f
movups xmm0,[teledata+28] // Saved Coords 3
call loadcall
jmp cleanup

@@:
cmp eax,4
jne short @f
movups xmm0,[teledata+38] // Coords Selected by the Player
call loadcall
jmp cleanup

@@:
jmp cleanup

cleanup:
movdqu xmm0,[rsp]
add rsp,10
pop rax
mov [teledata],0
jmp code

code:
  // Original code
  addss xmm7,dword ptr [rdi+00000080]
  jmp return

savecall:
cmp eax,1
jne short @f
movups [teledata+8],xmm0 // Saved Coords 1
ret

@@:
cmp eax,2
jne short @f
movups [teledata+18],xmm0 // Saved Coords 2
ret

@@:
cmp eax,3
jne short @f
movups [teledata+28],xmm0 // Saved Coords 3
ret

@@:
ret

loadcall:
movss [rdi+80],xmm0
shufps xmm0,xmm0 39 // Rotate Elements in xmm0 left once
movss [rdi+84],xmm0
shufps xmm0,xmm0 39
movss [rdi+88],xmm0
ret

teledata:
dd 0 // Flag +0
dd 0 // Which was Selected +4
dd 0 // Saved X-Coord 1 +8
dd 0 // Saved Y-Coord 1 +C
dd 0 // Saved Z-Coord 1 +10
dd 0 // Place Holder +14
dd 0 // Saved X-Coord 2 +18
dd 0 // Saved Y-Coord 2 +1C
dd 0 // Saved Z-Coord 2 +20
dd 0 // Place Holder +24
dd 0 // Saved X-Coord 3 +28
dd 0 // Saved Y-Coord 3 +2C
dd 0 // Saved Z-Corrd 3 +30
dd 0 // Place Holder +34
dd 0 // Saved PX-Coord +38
dd 0 // Saved PY-Coord +3C
dd 0 // Saved PZ-Coord +40
dd 0 // Place Holder +44

teleportscript:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(teleportscript)

[DISABLE]

teleportscript:
  db F3 0F 58 BF 80 00 00 00

unregistersymbol(teleportscript)
unregistersymbol(teledata)
dealloc(newmem)"""

