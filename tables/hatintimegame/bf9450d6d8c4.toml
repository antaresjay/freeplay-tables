[[cheat]]
id = "inf-health"
name = "Inf Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(health,HatinTimeGame.exe,29 03 8B 03 48 8B 5C 24 40)
alloc(newmem,$100,health)

label(originalcode)
label(skip)
label(return)
label(one_hit_kill)
label(one_hit_kill_flag)
registersymbol(one_hit_kill_flag)

newmem:
ror rbx,20
test ebx,ebx
rol rbx,20
je skip

cmp [rbx+2C4],1
jne originalcode

mov [rbx],4
mov eax,[rbx]
mov rbx,[rsp+40]
jmp return

originalcode:
  cmp [one_hit_kill_flag],1
  je one_hit_kill
  skip:
  sub [rbx],eax
  mov eax,[rbx]
  mov rbx,[rsp+40]
  jmp return

one_hit_kill_flag:
dq 0

one_hit_kill:
ror rbp,20
test ebp,ebp
rol rbp,20
jne short skip
mov eax,[rbx]
sub [rbx],eax
mov eax,[rbx]
mov rbx,[rsp+40]
jmp return

health:
  jmp newmem
  nop
  nop
  nop
  nop
return:
registersymbol(health)

[DISABLE]

health:
  db 29 03 8B 03 48 8B 5C 24 40

unregistersymbol(health)
dealloc(newmem)
unregistersymbol(one_hit_kill_flag)"""

