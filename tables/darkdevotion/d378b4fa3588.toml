[[cheat]]
id = "player-stats-base-address-scan-initialization-activate-this-first"
name = "Player Stats Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(playerstats_basepointer)
registersymbol(playerstats_update_enable)
registersymbol(playerstats_healthset_enable)
registersymbol(playerstats_armorset_enable)
registersymbol(playerstats_staminaset_enable)
registersymbol(playerstats_faithset_enable)
registersymbol(playerstats_arrowsset_enable)
registersymbol(playerstats_consumablesset_enable)
registersymbol(playerstats_timeset_enable)

alloc(playerstats_basepointer, 4)
alloc(playerstats_update_enable, 4)
alloc(playerstats_healthset_enable, 4)
alloc(playerstats_armorset_enable, 4)
alloc(playerstats_staminaset_enable, 4)
alloc(playerstats_faithset_enable, 4)
alloc(playerstats_arrowsset_enable, 4)
alloc(playerstats_consumablesset_enable, 4)
alloc(playerstats_timeset_enable, 4)


[DISABLE]
unregistersymbol(playerstats_basepointer)
unregistersymbol(playerstats_update_enable)
unregistersymbol(playerstats_healthset_enable)
unregistersymbol(playerstats_armorset_enable)
unregistersymbol(playerstats_staminaset_enable)
unregistersymbol(playerstats_faithset_enable)
unregistersymbol(playerstats_arrowsset_enable)
unregistersymbol(playerstats_consumablesset_enable)
unregistersymbol(playerstats_timeset_enable)

dealloc(playerstats_basepointer)
dealloc(playerstats_update_enable)
dealloc(playerstats_healthset_enable)
dealloc(playerstats_armorset_enable)
dealloc(playerstats_staminaset_enable)
dealloc(playerstats_faithset_enable)
dealloc(playerstats_arrowsset_enable)
dealloc(playerstats_consumablesset_enable)
dealloc(playerstats_timeset_enable)"""

[[cheat]]
id = "player-stats-base-address-scan-to-update-play-level"
name = "Player Stats Base Address Scan (To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstats_update_exit)
label(playerstats_healthset_exit)
label(playerstats_armorset_exit)
label(playerstats_staminaset_exit)
label(playerstats_faithset_exit)
label(playerstats_arrowsset_exit)
label(playerstats_consumablesset_exit)
label(playerstats_timeset_exit)

registersymbol(playerstats_originalcode)
registersymbol(playerstats_savedAOB)

//DarkDevotion.exe+2459 - 0F85 70010000         - jne DarkDevotion.exe+25CF
// Accesses Base Pointer
//DarkDevotion.exe+245F - A1 043CD800           - mov eax,[DarkDevotion.exe+103C04]
//DarkDevotion.exe+2464 - 8B 80 BC030000        - mov eax,[eax+000003BC]
//DarkDevotion.exe+246A - F7 00 00000004        - test [eax],4000000
//DarkDevotion.exe+2470 - 0F84 59010000         - je DarkDevotion.exe+25CF
//DarkDevotion.exe+2476 - 8B 4E 4C              - mov ecx,[esi+4C]
//DarkDevotion.exe+2479 - 2B 4E 58              - sub ecx,[esi+58]
//DarkDevotion.exe+247C - 8B 46 60              - mov eax,[esi+60]
//DarkDevotion.exe+247F - 03 C1                 - add eax,ecx
//DarkDevotion.exe+2481 - 3B 87 C4010000        - cmp eax,[edi+000001C4]
//DarkDevotion.exe+2487 - 7C 27                 - jnge DarkDevotion.exe+24B0
aobscan(playerstats_searchedAOB, 8B 80 BC 03 00 00 F7 00 00 00 00 04 0F 84 59 01 00 00 8B 4E 4C 2B 4E 58 8B 46 60 03 C1)

alloc(playerstats_newmem, 2048, playerstats_searchedAOB)
alloc(playerstats_temp1, 4, playerstats_searchedAOB)
alloc(playerstats_temp2, 4, playerstats_searchedAOB)
alloc(playerstats_temp3, 4, playerstats_searchedAOB)
alloc(playerstats_temp4, 4, playerstats_searchedAOB)
alloc(playerstats_temp5, 4, playerstats_searchedAOB)


playerstats_newmem:
mov [playerstats_temp1], eax
mov [playerstats_temp2], ebx
mov [playerstats_temp3], ecx
mov [playerstats_temp4], edx

mov ebx, [playerstats_savedAOB-4]
test ebx, ebx
je playerstats_timeset_exit
mov ebx, [ebx]
test ebx, ebx
je playerstats_timeset_exit
mov ebx, [ebx+268]
test ebx, ebx
je playerstats_timeset_exit

cmp dword ptr [playerstats_update_enable], #0
je playerstats_update_exit
mov [playerstats_basepointer], ebx
playerstats_update_exit:

cmp dword ptr [playerstats_healthset_enable], #0
je playerstats_healthset_exit
mov [ebx+8], #99
playerstats_healthset_exit:

cmp dword ptr [playerstats_armorset_enable], #0
je playerstats_armorset_exit
mov [ebx+18], #99
playerstats_armorset_exit:

cmp dword ptr [playerstats_staminaset_enable], #0
je playerstats_staminaset_exit
mov [ebx+2c], (float)9
playerstats_staminaset_exit:

cmp dword ptr [playerstats_faithset_enable], #0
je playerstats_faithset_exit
mov ecx, [ebx+248]
mov [ebx+238], ecx
playerstats_faithset_exit:

cmp dword ptr [playerstats_arrowsset_enable], #0
je playerstats_arrowsset_exit
mov [ebx+1d8], #9
playerstats_arrowsset_exit:

cmp dword ptr [playerstats_consumablesset_enable], #0
je playerstats_consumablesset_exit
mov [ebx+d8], #9
mov [ebx+e8], #9
mov [ebx+f8], #9
mov [ebx+108], #9
playerstats_consumablesset_exit:

cmp dword ptr [playerstats_timeset_enable], #0
je playerstats_timeset_exit
mov [ebx+6a8], #0
mov [ebx+6ac], #0
playerstats_timeset_exit:

mov eax, [playerstats_temp1]
mov ebx, [playerstats_temp2]
mov ecx, [playerstats_temp3]
mov edx, [playerstats_temp4]


playerstats_originalcode:
readmem(playerstats_searchedAOB, 6)


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB:
playerstats_savedAOB:
jmp playerstats_newmem
nop
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
readmem(playerstats_originalcode, 6)

unregistersymbol(playerstats_originalcode)
unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)
dealloc(playerstats_temp1)
dealloc(playerstats_temp2)
dealloc(playerstats_temp3)
dealloc(playerstats_temp4)
dealloc(playerstats_temp5)"""

