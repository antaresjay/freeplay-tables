id = "infinite-legacy-points"
name = "Infinite Legacy Points"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

aobscanmodule(legacy,Ancestors-Win64-Shipping.exe,8B C5 48 8B 6C 24 40 48 8B 7C 24 48) // should be unique
alloc(newmem,$1000,legacy)

label(code)
label(return)

newmem:
code:
  mov ebp, #999
  mov eax,ebp
  mov rbp,[rsp+40]
  jmp return

legacy:
  jmp newmem
  nop
  nop
return:
registersymbol(legacy)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
legacy:
  db 8B C5 48 8B 6C 24 40

unregistersymbol(legacy)
dealloc(newmem)"""

