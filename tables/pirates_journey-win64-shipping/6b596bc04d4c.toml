[[cheat]]
id = "preplayer-activate-first"
name = "prePlayer ( Activate First )"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(prePlayer,Pirates_Journey-Win64-Shipping.exe,41 8B 87 80 02 00 00 C1 E8 * A8 *)
alloc(newmem,$1000,prePlayer)
label(code)
label(return)

label(pPlayer)

newmem:
mov [pPlayer],r15

code:
  mov eax,[r15+00000280]
  jmp return


pPlayer:
dq 0


prePlayer:
  jmp newmem
  nop 2
return:
registersymbol(prePlayer)
registersymbol(pPlayer)
[DISABLE]
prePlayer:
  db 41 8B 87 80 02 00 00
unregistersymbol(prePlayer)
unregistersymbol(pPlayer)
dealloc(newmem)"""

