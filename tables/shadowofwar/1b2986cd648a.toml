[[cheat]]
id = "new-tag1"
name = "NEW-tag1"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
registersymbol(counterattack1)
aobscanmodule(counterattack1,shadowofwar.exe,88 47 74 8B 43 58 89 47 68)
alloc(newmem,$100,counterattack1)
GLOBALALLOC(countertag,8)
GLOBALALLOC(keycountertag,8)
label(returnhere)
label(originalcode)
label(exit)
label(goodintime)
label(savekeypos)
newmem: //this is allocated memory, you have read,write,execute access
//place your code here
push rdx
push rbx
push rcx
mov rbx,countertag
mov rcx,keycountertag
mov rdx,[rdi+30]
test rdx,rdx
jz originalcode

mov rdx,[rdx+20]
test rdx,rdx
jz originalcode

cmp dword [rdx],'PC_C'
jne originalcode
cmp dword [rdx+4],'ount'
jne originalcode
cmp dword [rdx+8],'er_I'
je goodintime
cmp dword [rdx+8],0x00007265 // counter
je savekeypos

//cmp dword [rdx+8],'er_S' // counter
//jne originalcode
//cmp dword [rdx+C],'pide' // counter
//je savekeypos

jmp originalcode

savekeypos:
mov rdx,[rdi+18]
test rdx,rdx
jz originalcode

lea rdx,[rdx+38] // save address
mov [rcx],rdx
cmp [rdx+1e0],0 //mount or not
jne goodintime
jmp originalcode



goodintime:
mov [rbx],al
originalcode:
pop rcx
pop rbx
pop rdx
mov [rdi+74],al
mov eax,[rbx+58]

exit:
jmp returnhere

counterattack1:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
unregistersymbol(counterattack1)
counterattack1:
//mov [rdi+74],al
//mov eax,[rbx+58]
db 88 47 74 8B 43 58"""

