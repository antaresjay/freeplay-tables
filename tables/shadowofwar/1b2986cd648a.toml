[[cheat]]
id = "auto-press-key"
name = "Auto-press-key"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
registersymbol(counterattack3)
aobscanmodule(counterattack3,shadowofwar.exe,8A 84 11 08 02 00 00 88 44 11 08 48 FF C2)
alloc(newmem,2048,counterattack3)
GLOBALALLOC(times,4)
GLOBALALLOC(times2,4)
GLOBALALLOC(times3,4)
label(returnhere)
label(originalcode)
label(exit)
label(autocounter)
label(ekeycounter)

label(zero1)
label(zero2)
label(zero3)
label(intime)
label(red)
newmem: //this is allocated memory, you have read,write,execute access
//place your code here

push rbx
push rdi
push rax


cmp rdx,55  //counter key "U" intime counter
je intime

cmp rdx,4c //counter key "L" RED counter
je red

cmp rdx,4a //counter key "E" KEY counter
je ekeycounter

jmp originalcode

intime:
mov rbx,times2
mov rdi,[rbx]
cmp rdi,01 //delay loop
jge zero1
cmp byte [countertag],01
je autocounter
cmp byte [countertagsr1],01
je autocounter
mov byte [rcx+rdx+00000208],00
jmp originalcode

red:
mov rbx,times
mov rdi,[rbx]
cmp rdi,01 //delay loop
jge zero2

mov rax,[redcountertag]
test rax,rax
jz originalcode
cmp byte [rax],02
je autocounter
mov byte [rcx+rdx+00000208],00
jmp originalcode

ekeycounter:
mov rbx,times3
mov rdi,[rbx]
cmp rdi,01 //delay loop
jge zero3

cmp byte [countertagsre],01
je autocounter
mov byte [rcx+rdx+00000208],00
jmp originalcode

//autocounter2:
//inc rdi
//mov [rbx],rdi
//mov byte [rcx+rdx+00000208],01
//jmp originalcode

autocounter:
inc rdi
mov [rbx],rdi
mov byte [rcx+rdx+00000208],01
jmp originalcode

zero1:
mov byte [countertag],00
mov byte [countertagsr1],00
mov [rbx],0
xor rdi,rdi
mov byte [rcx+rdx+00000208],0
jmp originalcode

zero2:
mov [rbx],0
xor rdi,rdi
mov byte [rcx+rdx+00000208],0
jmp originalcode

zero3:
mov byte [countertagsre],00
mov [rbx],0
xor rdi,rdi
mov byte [rcx+rdx+00000208],0
jmp originalcode


originalcode:
pop rax
pop rdi
pop rbx
mov al,[rcx+rdx+00000208]
jmp exit

exit:
jmp returnhere

counterattack3:
jmp newmem
nop
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
unregistersymbol(counterattack3)
counterattack3:
//mov al,[rcx+rdx+00000208]
db 8A 84 11 08 02 00 00"""
