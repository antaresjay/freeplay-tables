[[cheat]]
id = "date-affection-cheats"
name = "[ Date Affection Cheats ]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanregion(get_addAffection,PuzzleStatus:AddResourceValue,PuzzleStatus:AddResourceValue+200,41 FF D3 41 89 46 5C)
alloc(newmem,$1000,get_addAffection)
label(code)
label(return)
label(incBonus)
alloc(_incBonus,3)
registersymbol(_incBonus)


newmem:
  call r11
  cmp byte ptr [r14+51],01
  je incBonus
  cmp byte ptr [_incBonus],01
  jne code
  mov eax,[r14+60]
  jmp code

incBonus:
  cmp byte ptr [_incBonus+1],01
  jne @f
  mov eax,[r14+60]
  jmp code
@@:
  cmp byte ptr [_incBonus+2],01
  je return

code:
  mov [r14+5C],eax
  jmp return

get_addAffection:
  jmp newmem
  nop 2
return:
registersymbol(get_addAffection)

[DISABLE]
get_addAffection:
  db 41 FF D3 41 89 46 5C

unregistersymbol(get_addAffection)
dealloc(newmem)"""

