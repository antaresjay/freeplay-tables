[[cheat]]
id = "infinite-date-moves"
name = "Infinite Date Moves"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanregion(get_setMoves,PuzzleStatus:set_movesRemaining,PuzzleStatus:set_movesRemaining+100,89 47 64 48 8B 7D F8)
alloc(newmem,$1000,get_setMoves)
label(code)
label(return)

newmem:
cmp [rdi+64],eax
jb code
mov rdi,[rbp-08]
jmp return

code:
  mov [rdi+64],eax
  mov rdi,[rbp-08]
  jmp return

get_setMoves:
  jmp newmem
  nop 2
return:
registersymbol(get_setMoves)

[DISABLE]
get_setMoves:
  db 89 47 64 48 8B 7D F8

unregistersymbol(get_setMoves)
dealloc(newmem)"""

