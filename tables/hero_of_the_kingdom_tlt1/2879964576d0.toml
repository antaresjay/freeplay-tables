[[cheat]]
id = "stats-reopen-inventory"
name = "Stats [reopen inventory]"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Hero_of_the_Kingdom_TLT2.exe
  Version: 1.2.9 (Steam)
  Date   : 2025-05-25
  Author : fenuzulage

  This script captures pointer to fame, health and gold so that these can be changed
  and sets the item stack size to 99 if flag is set
}

[ENABLE]

//aobscanmodule(INJECT,Hero_of_the_Kingdom_TLT2.exe,8B 50 58 41 B8 02 00 00 00 E8 70) // should be unique
aobscanmodule(INJECT,Hero_of_the_Kingdom_TLT2.exe,8B 50 58 41 B8 02 00 00 00 E8)
alloc(newmem,$100,INJECT)
alloc(fame,$8)
registersymbol(fame)
alloc(health,$8)
registersymbol(health)
alloc(gold,$8)
registersymbol(gold)
alloc(give_items_flag,$4)
registersymbol(give_items_flag)

label(code)
label(return)
label(originalcode)

give_items_flag:
  dd 0

newmem:

code:
  // rax: Inventory Item
  // rax+58: amount
  // rax+40: Index
  //         1 = Fame
  //         2 = Health
  //         3 = Gold

  // if item is fame, capture adress
  cmp [rax+40], 1
  jne @f              // to @@: which is the next case
  mov dword ptr [fame], rax
  jmp originalcode

@@:
  // if item is health, capture adress
  cmp [rax+40], 2
  jne @f              // to @@: which is the next case
  mov dword ptr [health], rax
  jmp originalcode

@@:
  // if item is gold, capture adress
  cmp [rax+40], 3
  jne @f              // to @@: which is the next case
  mov dword ptr [gold], rax
  jmp originalcode

@@:
  // default: if Flag is set, set item count to 99
  cmp [give_items_flag],1
  jne originalcode
  //rax+58 is amount. set it to 99
  mov [rax+58], (int)99

originalcode:
  mov edx,[rax+58]   // edx gets amount
  mov r8d,00000002
  jmp return

INJECT:
  jmp newmem
  nop 4

return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 8B 50 58 41 B8 02 00 00 00

unregistersymbol(INJECT)
dealloc(newmem)

dealloc(fame)
unregistersymbol(fame)
dealloc(health)
unregistersymbol(health)
dealloc(gold)
unregistersymbol(gold)
dealloc(give_items_flag)
unregistersymbol(give_items_flag)
{
// ORIGINAL CODE - INJECTION POINT: Hero_of_the_Kingdom_TLT1.exe+190852

Hero_of_the_Kingdom_TLT1.exe+19082D: 48 8B 55 40           - mov rdx,[rbp+40]
