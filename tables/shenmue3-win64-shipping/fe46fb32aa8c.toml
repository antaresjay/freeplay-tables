type = "script"
source = """
[ENABLE]


aobscanmodule(itemscd,Shenmue3-Win64-Shipping.exe,48 8B 43 28 8B 1C 88 EB)
alloc(newmem,$1000,"Shenmue3-Win64-Shipping.exe"+595457)

label(code)
label(return)

newmem:
code:
  mov rax, [rbx+28]
  mov rbx, rax
  mov ebx, [rax+rcx*4]

  cmp ebx,01
  jle return

  mov ebx, #99
  mov [rax+rcx*4], ebx
  jmp return

itemscd:
  jmp newmem
  nop
  nop
return:
registersymbol(itemscd)

[DISABLE]

itemscd:
  db 48 8B 43 28 8B 1C 88

unregistersymbol(itemscd)
dealloc(newmem)"""
