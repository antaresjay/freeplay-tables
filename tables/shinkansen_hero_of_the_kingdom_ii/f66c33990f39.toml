[[cheat]]
id = "player-inventory-base-address-scan-initialization-activate-this-first"
name = "Player Inventory Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(playerinventory_basepointer)
registersymbol(playerinventory_update_enable)
registersymbol(playerinventory_update_value)
registersymbol(playerinventory_set_enable)

alloc(playerinventory_basepointer,10000)
alloc(playerinventory_update_enable,4)
alloc(playerinventory_update_value,4)
alloc(playerinventory_set_enable,4)


[DISABLE]
unregistersymbol(playerinventory_basepointer)
unregistersymbol(playerinventory_update_enable)
unregistersymbol(playerinventory_update_value)
unregistersymbol(playerinventory_set_enable)

dealloc(playerinventory_basepointer)
dealloc(playerinventory_update_enable)
dealloc(playerinventory_update_value)
dealloc(playerinventory_set_enable)"""

[[cheat]]
id = "player-inventory-base-address-scan-to-update-show-inventory"
name = "Player Inventory Base Address Scan (To Update: Show Inventory)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerinventory_savedAOB)
label(playerinventory_returnhere)
label(playerinventory_originalcode)
label(playerinventory_exit)

label(playerinventory_update_exit)
label(playerinventory_set_exit)

registersymbol(playerinventory_savedAOB)

aobscan(playerinventory_searchedAOB,8B 46 34 85 C0 75 07)

alloc(playerinventory_newmem,2048)
alloc(playerinventory_temp1,4)


playerinventory_newmem:
mov [playerinventory_temp1], ebx

cmp dword ptr [playerinventory_update_enable], #0
je playerinventory_update_exit
mov ebx, [playerinventory_update_value]
add ebx, #1
mov [playerinventory_update_value], ebx

shl ebx, #4
add ebx, playerinventory_basepointer
mov [ebx], esi

cmp dword ptr [playerinventory_update_value], #140
jl playerinventory_update_exit
mov [playerinventory_update_enable], #0
mov [playerinventory_update_value], #0
playerinventory_update_exit:

cmp dword ptr [playerinventory_set_enable], #0
je playerinventory_set_exit
playerinventory_set_exit:

mov ebx, [playerinventory_temp1]


playerinventory_originalcode:
db 8B 46 34 85 C0
//mov eax,[esi+34]
//test eax,eax


playerinventory_exit:
jmp playerinventory_returnhere


playerinventory_searchedAOB:
playerinventory_savedAOB:
jmp playerinventory_newmem
playerinventory_returnhere:


[DISABLE]
playerinventory_savedAOB:
db 8B 46 34 85 C0
//mov eax,[esi+34]
//test eax,eax

unregistersymbol(playerinventory_savedAOB)

dealloc(playerinventory_newmem)
dealloc(playerinventory_temp1)"""

