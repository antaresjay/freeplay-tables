[[cheat]]
id = "no-recoil"
name = "No Recoil"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(RecoilSpeedReadInWpBaseCheckRecoilAOB,D9 87 3C 01 00 00 D9 ** ** ** ** ** 8D)
registersymbol(RecoilSpeedReadInWpBaseCheckRecoilAOB)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
fldz
jmp exit

originalcode:
fld dword ptr [edi+0000013C]

exit:
jmp returnhere

///

RecoilSpeedReadInWpBaseCheckRecoilAOB: //K2:WpBase:CheckRecoil+f3:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
RecoilSpeedReadInWpBaseCheckRecoilAOB: //K2:WpBase:CheckRecoil+f3:
db D9 87 3C 01 00 00
//Alt: fld dword ptr [edi+0000013C]"""

[[cheat]]
id = "no-spread-2"
name = "No Spread .2"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(SpreadRateMaxWriteInWpBaseSetPlayerStatusAOB,D9 9E 04 01 00 00 8B 46 1C)
registersymbol(SpreadRateMaxWriteInWpBaseSetPlayerStatusAOB)

label(bAllWeaponNoSpread)
registersymbol(bAllWeaponNoSpread)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
cmp byte ptr [bAllWeaponNoSpread],1
je @f

mov eax,[esi+18]
test eax,eax
jz @f

cmp word ptr [eax+12],0031 //shotgun
je originalcode

@@:
fstp st(0)
//fld dword ptr [esi+108]
fldz

originalcode:
fstp dword ptr [esi+00000104]

exit:
jmp returnhere

///
bAllWeaponNoSpread:
db 0
///

SpreadRateMaxWriteInWpBaseSetPlayerStatusAOB: //K2:WpBase:SetPlayerStatus+50b:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
SpreadRateMaxWriteInWpBaseSetPlayerStatusAOB: //K2:WpBase:SetPlayerStatus+50b:
db D9 9E 04 01 00 00
//Alt: fstp dword ptr [esi+00000104]

unregistersymbol(bAllWeaponNoSpread)"""

