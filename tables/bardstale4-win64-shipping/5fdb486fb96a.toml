type = "script"
source = """
[ENABLE]


aobscanmodule(actionpoints,BardsTale4-Win64-Shipping.exe,8B 41 30 2B C2)
alloc(newmem,$1000,"BardsTale4-Win64-Shipping.exe"+2BCD72)

label(code)
label(return)

newmem:
code:
  xor edx, edx
  mov eax, [rcx+30]
  sub eax, edx
  jmp return

actionpoints:
  jmp newmem
return:
registersymbol(actionpoints)

[DISABLE]

actionpoints:
  db 8B 41 30 2B C2

unregistersymbol(actionpoints)
dealloc(newmem)"""
