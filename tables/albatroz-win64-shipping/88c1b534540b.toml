[[cheat]]
id = "4-x-4-vehicle-ctrl-numpad-1-correct-values-will-populate-when-you-enter-the-vehicle"
name = "4 x 4 Vehicle (Ctrl + Numpad 1) {Correct values will populate when you enter the vehicle}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Albatroz-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 4.27.2.0
// Game Version      : Build.16282748
// Script Date       : 2024-11-07


[ENABLE]

aobscanmodule(master,Albatroz-Win64-Shipping.exe,498Bxx498BxxFFxxxxxxxxxx84xx0F84xxxxxxxx8Bxxxx3B) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,6)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,6)

newmem:
  mov [data],r8

code:
  readmem(master,6)
  jmp return

master:
  jmp newmem
  nop
return:

[DISABLE]

master:
  readmem(masterbkp,6)

unregistersymbol(*)
dealloc(*)"""

