[[cheat]]
id = "battle-status"
name = "Battle Status"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

 
 
aobscanregion(status,TOD:Player:UpdateStatusUI,TOD:Player:UpdateStatusUI+28,0F B6 86 E8 04 00 00 85) // should be unique
alloc(newmem,$100)
alloc(pstatus,8)

aobscanregion(pstatus2,TOD:DamagedBase:get_Life,TOD:DamagedBase:get_Life+13,48 63 40 30 48 83 C4 08) // should be unique
alloc(newmem2,$100)

aobscanregion(doprate_aob,TOD:EnemyBehaviour:OnAnimatorStateEnter,TOD:EnemyBehaviour:OnAnimatorStateEnter+F0,48 8B 86 D8 00 00 00) // should be unique
alloc(newmem3,$100)

label(code)
label(return)
label(code2)
label(return2)
label(code3)
label(return3)
label(hptype1)
label(stamina)
label(jump)
label(droprate)
label(iframe)
label(nodrop)

registersymbol(pstatus)
registersymbol(hptype1)
registersymbol(stamina)
registersymbol(jump)
registersymbol(droprate)
registersymbol(iframe)

newmem:
mov [pstatus],rsi

instamina:
cmp [stamina],#0
je @f
push ebx
mov ebx,dword ptr [rsi+580]
mov dword ptr [rsi+57c],ebx
pop ebx
@@:

injump:
cmp [jump],#0
je @f
mov [rsi+588],#2
@@:

code:
  movzx eax,byte ptr [rsi+000004E8]
  jmp return

stamina:
dd #0

jump:
dd #0

/////////////////////////////
newmem2:
cmp dword ptr [rax+18],#0
jne code2

plife1:
cmp [hptype1],#0
je @f
push ebx
mov ebx,dword ptr [rax+34]
mov dword ptr [rax+30],ebx
pop ebx
@@:

iframeon:
cmp [iframe],#0
je iframeoff
mov byte ptr [rax+3c],#1

iframeoff:
cmp [iframe],#0
jne @f
mov byte ptr [rax+3c],#0
@@:

code2:
  movsxd  rax,dword ptr [rax+30]
  add rsp,08
  jmp return2

hptype1:
dd #0

iframe:
dd #0

/////////////////////////////
newmem3:

setdroprate:
cmp [droprate],#0
je nodrop
push rbx
push rdx
mov rbx,dword ptr [rsi+F8]
mov rdx,dword ptr [rsi+F8]
cmp [rbx+38],0
je @f
mov rbx,[rbx+38]
mov rbx,[rbx+18]
mov rbx,[rbx+10]
mov rbx,[rbx+20]
mov [ebx+20],(float)100
@@:
cmp [rdx+38],0
je @f
mov rdx,[rdx+38]
mov rdx,[rdx+18]
mov rdx,[rdx+10]
mov rdx,[rdx+28]
mov [edx+20],(float)100
@@:
pop rdx
pop rbx

nodrop:

code3:
  mov rax,[rsi+000000D8]
  jmp return3

droprate:
dd #0

/////////////////////////////
status:
  jmp newmem
  nop
  nop
return:

pstatus2:
  jmp newmem2
  nop
  nop
  nop
return2:

doprate_aob:
  jmp newmem3
  nop
  nop
return3:

registersymbol(status)
registersymbol(pstatus2)
registersymbol(doprate_aob)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
status:
  db 0F B6 86 E8 04 00 00

pstatus2:
  db 48 63 40 30 48 83 C4 08

doprate_aob:
  db 48 8B 86 D8 00 00 00

unregistersymbol(status)
unregistersymbol(pstatus)
unregistersymbol(pstatus2)
unregistersymbol(hptype1)
unregistersymbol(stamina)
unregistersymbol(jump)
unregistersymbol(doprate_aob)
unregistersymbol(droprate)
unregistersymbol(iframe)
dealloc(pstatus)
dealloc(newmem3)
dealloc(newmem2)
dealloc(newmem)

