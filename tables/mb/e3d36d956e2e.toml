[[cheat]]
id = "active-trainer"
name = "Active Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)


label(bills)
label(stones)
label(wood)
label(food)
label(Clay)

registersymbol(avtive)
registersymbol(addbills)
registersymbol(addstones)
registersymbol(addwood)
registersymbol(addfood)
registersymbol(addClay)
label(addbills)
label(addstones)
label(addwood)
label(addfood)
label(addClay)


aobscan(avtive,8D 44 88 10 8B 00 8D 65 F4 5E 5F 5B C9 C3)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
//8D 44 88 10 8B 00 8D 65 F4 5E 5F 5B C9 C3

{
ecx
0 bills
1 stones
2 wood
3 food
4 Clay
5 workers
}
push esi
cmp ecx,0
je bills
cmp ecx,1
je stones
cmp ecx,2
je wood
cmp ecx,3
je food
cmp ecx,4
je Clay
jmp originalcode
bills:
mov esi,[addbills]
add [eax+ecx*4+10],esi
mov [addbills],0
jmp originalcode
stones:
mov esi,[addstones]
add [eax+ecx*4+10],esi
mov [addstones],0
jmp originalcode
wood:
mov esi,[addwood]
add [eax+ecx*4+10],esi
mov [addwood],0
jmp originalcode
food:
mov esi,[addfood]
add [eax+ecx*4+10],esi
mov [addfood],0
jmp originalcode
Clay:
mov esi,[addClay]
add [eax+ecx*4+10],esi
mov [addClay],0
jmp originalcode

originalcode:
lea eax,[eax+ecx*4+10]
mov eax,[eax]

exit:
jmp returnhere
addbills:
dd 0
addstones:
dd 0
addwood:
dd 0
addfood:
dd 0
addClay:
dd 0

avtive:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
avtive:
lea eax,[eax+ecx*4+10]
mov eax,[eax]
//Alt: db 8D 44 88 10 8B 00
unregistersymbol(avtive)
unregistersymbol(addbills)
unregistersymbol(addstones)
unregistersymbol(addwood)
unregistersymbol(addfood)
unregistersymbol(addClay)"""

