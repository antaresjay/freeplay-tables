[[cheat]]
id = "scenemanager-base-address-scan-initialization-activate-this-first-to-activate-play-level"
name = "SceneManager Base Address Scan Initialization (Activate This First, To Activate: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(SceneManager_basepointer)
registersymbol(SceneManager_Savedata_static_basepointer)
registersymbol(SceneManager_update_enable)
registersymbol(SceneManager_hpset_enable)
registersymbol(SceneManager_mpset_enable)
registersymbol(SceneManager_spset_enable)
registersymbol(SceneManager_chargeset_enable)
registersymbol(SceneManager_cooldownset_enable)
registersymbol(SceneManager_mobilityset_enable)
registersymbol(SceneManager_stealthset_enable)
registersymbol(SceneManager_soulsset_enable)

//05473F4C - 83 EC 04              - sub esp,04
//05473F4F - 8B 7D 08              - mov edi,[ebp+08]
// SceneManager:Update+a
//05473F52 - 8B 87 CC000000        - mov eax,[edi+000000CC]
//05473F58 - 83 EC 0C              - sub esp,0C
//05473F5B - 50                    - push eax
//05473F5C - E8 CF7EF8FF           - call 053FBE30
//05473F61 - 83 C4 10              - add esp,10
//05473F64 - 85 C0                 - test eax,eax
//05473F66 - 74 14                 - je 05473F7C
//05473F68 - 8B 87 CC000000        - mov eax,[edi+000000CC]
//05473F6E - 83 EC 08              - sub esp,08
aobscan(SceneManager_initialization_searchedAOB, 8B 87 CC 00 00 00 83 EC 0C 50 * * * * * 83 C4 10 85 C0 74 14)

alloc(SceneManager_basepointer, 4, SceneManager_initialization_searchedAOB)
alloc(SceneManager_Savedata_static_basepointer, 4, SceneManager_initialization_searchedAOB)
alloc(SceneManager_update_enable, 4, SceneManager_initialization_searchedAOB)
alloc(SceneManager_hpset_enable, 4, SceneManager_initialization_searchedAOB)
alloc(SceneManager_mpset_enable, 4, SceneManager_initialization_searchedAOB)
alloc(SceneManager_spset_enable, 4, SceneManager_initialization_searchedAOB)
alloc(SceneManager_chargeset_enable, 4, SceneManager_initialization_searchedAOB)
alloc(SceneManager_cooldownset_enable, 4, SceneManager_initialization_searchedAOB)
alloc(SceneManager_mobilityset_enable, 4, SceneManager_initialization_searchedAOB)
alloc(SceneManager_stealthset_enable, 4, SceneManager_initialization_searchedAOB)
alloc(SceneManager_soulsset_enable, 4, SceneManager_initialization_searchedAOB)


[DISABLE]
unregistersymbol(SceneManager_basepointer)
unregistersymbol(SceneManager_Savedata_static_basepointer)
unregistersymbol(SceneManager_update_enable)
unregistersymbol(SceneManager_hpset_enable)
unregistersymbol(SceneManager_mpset_enable)
unregistersymbol(SceneManager_spset_enable)
unregistersymbol(SceneManager_chargeset_enable)
unregistersymbol(SceneManager_cooldownset_enable)
unregistersymbol(SceneManager_mobilityset_enable)
unregistersymbol(SceneManager_stealthset_enable)
unregistersymbol(SceneManager_soulsset_enable)

dealloc(SceneManager_basepointer)
dealloc(SceneManager_Savedata_static_basepointer)
dealloc(SceneManager_update_enable)
dealloc(SceneManager_hpset_enable)
dealloc(SceneManager_mpset_enable)
dealloc(SceneManager_spset_enable)
dealloc(SceneManager_chargeset_enable)
dealloc(SceneManager_cooldownset_enable)
dealloc(SceneManager_mobilityset_enable)
dealloc(SceneManager_stealthset_enable)
dealloc(SceneManager_soulsset_enable)"""

[[cheat]]
id = "scenemanager-base-address-scan-to-activate-play-level-to-update-play-level"
name = "SceneManager Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(SceneManager_savedAOB)
label(SceneManager_returnhere)
label(SceneManager_originalcode)
label(SceneManager_exit)

label(SceneManager_update_exit)
label(SceneManager_hpset_exit)
label(SceneManager_mpset_exit)
label(SceneManager_spset_exit)
label(SceneManager_chargeset_exit)
label(SceneManager_cooldownset_exit)
label(SceneManager_mobilityset_exit)
label(SceneManager_stealthset_exit)
label(SceneManager_soulsset_exit)

registersymbol(SceneManager_originalcode)
registersymbol(SceneManager_savedAOB)

//05473F4C - 83 EC 04              - sub esp,04
//05473F4F - 8B 7D 08              - mov edi,[ebp+08]
// SceneManager:Update+a
//05473F52 - 8B 87 CC000000        - mov eax,[edi+000000CC]
//05473F58 - 83 EC 0C              - sub esp,0C
//05473F5B - 50                    - push eax
//05473F5C - E8 CF7EF8FF           - call 053FBE30
//05473F61 - 83 C4 10              - add esp,10
//05473F64 - 85 C0                 - test eax,eax
//05473F66 - 74 14                 - je 05473F7C
//05473F68 - 8B 87 CC000000        - mov eax,[edi+000000CC]
//05473F6E - 83 EC 08              - sub esp,08
aobscan(SceneManager_searchedAOB, 8B 87 CC 00 00 00 83 EC 0C 50 * * * * * 83 C4 10 85 C0 74 14)

alloc(SceneManager_newmem, 2048, SceneManager_searchedAOB)
alloc(SceneManager_temp1, 4, SceneManager_searchedAOB)
alloc(SceneManager_temp2, 4, SceneManager_searchedAOB)
alloc(SceneManager_temp3, 4, SceneManager_searchedAOB)
alloc(SceneManager_temp4, 4, SceneManager_searchedAOB)
alloc(SceneManager_temp5, 4, SceneManager_searchedAOB)


SceneManager_newmem:
mov [SceneManager_temp1], eax
mov [SceneManager_temp2], ebx
mov [SceneManager_temp3], ecx
mov [SceneManager_temp4], edx

mov ecx, [SceneManager_savedAOB+3b]
sub ecx, 14
test ecx, ecx
je SceneManager_soulsset_exit

cmp dword ptr [SceneManager_update_enable], #0
je SceneManager_update_exit
mov [SceneManager_basepointer], edi
mov [SceneManager_Savedata_static_basepointer], ecx
SceneManager_update_exit:

cmp dword ptr [SceneManager_hpset_enable], #0
je SceneManager_hpset_exit
mov ebx, [edi+38]
test ebx, ebx
je SceneManager_hpset_exit
fld [ebx+14]
fstp [ebx+18]
SceneManager_hpset_exit:

cmp dword ptr [SceneManager_mpset_enable], #0
je SceneManager_mpset_exit
mov ebx, [edi+38]
test ebx, ebx
je SceneManager_mpset_exit
fld [ebx+20]
fstp [ebx+24]
SceneManager_mpset_exit:

cmp dword ptr [SceneManager_spset_enable], #0
je SceneManager_spset_exit
mov ebx, [edi+38]
test ebx, ebx
je SceneManager_spset_exit
fld [ebx+2c]
fstp [ebx+30]
SceneManager_spset_exit:

cmp dword ptr [SceneManager_chargeset_enable], #0
je SceneManager_chargeset_exit
mov ebx, [edi+38]
test ebx, ebx
je SceneManager_chargeset_exit
mov [ebx+64], (float)9999
SceneManager_chargeset_exit:

cmp dword ptr [SceneManager_cooldownset_enable], #0
je SceneManager_cooldownset_exit
mov ebx, [edi+38]
test ebx, ebx
je SceneManager_cooldownset_exit
mov [ebx+68], (float)100
mov [ebx+6c], (float)100
mov [ebx+70], (float)100
mov [ebx+74], (float)100
SceneManager_cooldownset_exit:

cmp dword ptr [SceneManager_mobilityset_enable], #0
je SceneManager_mobilityset_exit
mov ebx, [edi+34]
test ebx, ebx
je SceneManager_mobilityset_exit
mov ebx, [ebx+10]
test ebx, ebx
je SceneManager_mobilityset_exit
mov [ebx+9c], (float)12
mov [ebx+b0], (float)15
SceneManager_mobilityset_exit:

cmp dword ptr [SceneManager_stealthset_enable], #0
je SceneManager_stealthset_exit
mov ebx, [edi+34]
test ebx, ebx
je SceneManager_stealthset_exit
mov byte ptr [ebx+3c], #1
SceneManager_stealthset_exit:

cmp dword ptr [SceneManager_soulsset_enable], #0
je SceneManager_soulsset_exit
mov [ecx+88], (float)99999
SceneManager_soulsset_exit:

mov eax, [SceneManager_temp1]
mov ebx, [SceneManager_temp2]
mov ecx, [SceneManager_temp3]
mov edx, [SceneManager_temp4]


SceneManager_originalcode:
readmem(SceneManager_searchedAOB, 6)


SceneManager_exit:
jmp SceneManager_returnhere


SceneManager_searchedAOB:
SceneManager_savedAOB:
jmp SceneManager_newmem
nop
SceneManager_returnhere:


[DISABLE]
SceneManager_savedAOB:
readmem(SceneManager_originalcode, 6)

unregistersymbol(SceneManager_originalcode)
unregistersymbol(SceneManager_savedAOB)

dealloc(SceneManager_newmem)
dealloc(SceneManager_temp1)
dealloc(SceneManager_temp2)
dealloc(SceneManager_temp3)
dealloc(SceneManager_temp4)
dealloc(SceneManager_temp5)"""

