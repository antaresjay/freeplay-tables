mov ebx, [ebx+c]
mov [ebx+14], (float)9999
cmp dword ptr [edi+28], #0
je BuildingManager_set_exit
mov ebx, [edi+28]
cmp dword ptr [ebx+8], #0
je BuildingManager_set_exit
mov ebx, [ebx+8]
cmp dword ptr [ebx+14], #0
je BuildingManager_set_exit
mov ebx, [ebx+14]
cmp dword ptr [ebx+c], #0
je BuildingManager_set_exit
mov ebx, [ebx+c]
mov [ebx+14], (float)9999
cmp dword ptr [edi+28], #0
je BuildingManager_set_exit
mov ebx, [edi+28]
cmp dword ptr [ebx+8], #0
je BuildingManager_set_exit
mov ebx, [ebx+8]
cmp dword ptr [ebx+18], #0
je BuildingManager_set_exit
mov ebx, [ebx+18]
cmp dword ptr [ebx+c], #0
je BuildingManager_set_exit
mov ebx, [ebx+c]
mov [ebx+14], (float)9999
