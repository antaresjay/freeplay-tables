//0F807908 - 83 EC 0C              - sub esp,0C
aobscan(BuildingManager_searchedAOB, D9 EE D9 5D F4 39 3F 8B 47 10 8B 40 18 85 C0)

alloc(BuildingManager_newmem, 2048, BuildingManager_searchedAOB)
alloc(BuildingManager_temp1, 4, BuildingManager_searchedAOB)


