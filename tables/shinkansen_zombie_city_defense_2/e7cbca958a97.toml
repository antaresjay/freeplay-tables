cmp dword ptr [ebx+c], #0
je BuildingManager_set_exit
mov ebx, [ebx+c]
mov [ebx+14], (float)9999
BuildingManager_set_exit:

mov ebx, [BuildingManager_temp1]


BuildingManager_originalcode:
db D9 EE D9 5D F4
//fldz
//fstp dword ptr [ebp-0C]


BuildingManager_exit:
jmp BuildingManager_returnhere


BuildingManager_searchedAOB:
BuildingManager_savedAOB:
