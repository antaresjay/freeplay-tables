[[cheat]]
id = "gamestate-base-address-scan-initialization-activate-this-first"
name = "GameState Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameState_basepointer)
registersymbol(GameState_update_enable)
registersymbol(GameState_set_enable)

alloc(GameState_basepointer, 4)
alloc(GameState_update_enable, 4)
alloc(GameState_set_enable, 4)


[DISABLE]
unregistersymbol(GameState_basepointer)
unregistersymbol(GameState_update_enable)
unregistersymbol(GameState_set_enable)

dealloc(GameState_basepointer)
dealloc(GameState_update_enable)
dealloc(GameState_set_enable)"""

[[cheat]]
id = "gamestate-base-address-scan-to-activate-load-campaign-to-update-load-campaign"
name = "GameState Base Address Scan (To Activate: Load Campaign, To Update: Load Campaign)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameState_savedAOB)
label(GameState_returnhere)
label(GameState_originalcode)
label(GameState_exit)

label(GameState_update_exit)
label(GameState_set_exit)

registersymbol(GameState_savedAOB)

//0F79021B - 56                    - push esi
//0F79021C - 83 EC 44              - sub esp,44
// GameState:RefreshState+7
//0F79021F - 8B 75 08              - mov esi,[ebp+08]
//0F790222 - 8B 45 0C              - mov eax,[ebp+0C]
//0F790225 - 89 46 24              - mov [esi+24],eax
//0F790228 - C7 46 10 40985811     - mov [esi+10],11589840 : [04CE1B1C]
//0F79022F - E8 AC020000           - call 0F7904E0
aobscan(GameState_searchedAOB, 8B 75 08 8B 45 0C 89 46 24)

alloc(GameState_newmem, 2048, GameState_searchedAOB)
alloc(GameState_temp1, 4, GameState_searchedAOB)


GameState_newmem:
mov [GameState_temp1], ebx

cmp dword ptr [GameState_update_enable], #0
je GameState_update_exit
mov [GameState_basepointer], esi
GameState_update_exit:

cmp dword ptr [GameState_set_enable], #0
je GameState_set_exit
cmp dword ptr [esi+c], #0
je GameState_set_exit
mov ebx, [esi+c]
cmp dword ptr [ebx+14], #0
je GameState_set_exit
mov ebx, [ebx+14]
cmp dword ptr [ebx+c], #0
je GameState_set_exit
mov ebx, [ebx+c]
mov [ebx+14], (float)9999999
cmp dword ptr [esi+c], #0
je GameState_set_exit
mov ebx, [esi+c]
cmp dword ptr [ebx+18], #0
je GameState_set_exit
mov ebx, [ebx+18]
cmp dword ptr [ebx+c], #0
je GameState_set_exit
mov ebx, [ebx+c]
mov [ebx+14], (float)9999
GameState_set_exit:

mov ebx, [GameState_temp1]


GameState_originalcode:
db 8B 45 0C 89 46 24
//mov eax,[ebp+0C]
//mov [esi+24],eax


GameState_exit:
jmp GameState_returnhere


GameState_searchedAOB + 3:
GameState_savedAOB:
jmp GameState_newmem
nop
GameState_returnhere:


[DISABLE]
GameState_savedAOB:
db 8B 45 0C 89 46 24
//mov eax,[ebp+0C]
//mov [esi+24],eax

unregistersymbol(GameState_savedAOB)

dealloc(GameState_newmem)
dealloc(GameState_temp1)"""

