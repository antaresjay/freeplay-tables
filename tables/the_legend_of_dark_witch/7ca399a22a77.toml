[[cheat]]
id = "one-hit-kill"
name = "One Hit Kill"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[Enable]
alloc(newmem,100)
label(returnhere)
label(exit)
label(OneHitKill)
registersymbol(OneHitKill)
aobscan(aob1, 29 81 3C 2E 4D 01 8B B1 3C 2E 4D 01)

newmem:
mov [ecx+The_Legend_of_Dark_Witch.exe+9B2E3C],#0
//sub [ecx+The_Legend_of_Dark_Witch.exe+9B2E3C],eax

exit:
jmp returnhere

aob1:
OneHitKill:
jmp newmem
nop
returnhere:

[Disable]
dealloc(newmem)
unregistersymbol(OneHitKill)
OneHitKill:
db 29 81 3C 2E 4D 01 8B B1 3C 2E 4D 01"""

