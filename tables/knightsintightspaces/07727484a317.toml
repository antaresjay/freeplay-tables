[[cheat]]
id = "unlimited-momentum-rollbacks-combo-always-max"
name = "Unlimited Momentum & Rollbacks & Combo Always Max"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : KnightsInTightSpaces.exe
  Version: 
  Date   : 2025-03-05
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(pData_Momentum,GameAssembly.dll,8B A8 B8 00 00 00 E8) // should be unique
alloc(newmem,$1000,pData_Momentum)

label(code)
label(return)

newmem:
  mov [rax+000000B8],#100       //_currentMomentum
  mov [rax+000000BC],#100       //_maxMomentum
  mov [rax+000000C4],#100       //_currentCombo
  mov [rax+000000C8],#100       //_maxCombo
  mov [rax+000000CC],#100       //_currentRollbacks

code:
  mov ebp,[rax+000000B8]
  jmp return

pData_Momentum:
  jmp newmem
  nop
return:
registersymbol(pData_Momentum)

[DISABLE]

pData_Momentum:
  db 8B A8 B8 00 00 00

unregistersymbol(pData_Momentum)
dealloc(newmem)"""

