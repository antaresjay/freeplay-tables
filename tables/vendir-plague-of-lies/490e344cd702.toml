aobscanmodule(INJGOLD,GameAssembly.dll,48 8B 48 10 48 85 C9 74 47 0F 29 74 24 30 0F 10 71 30) // should be unique
alloc(newmem,$1000,INJGOLD)

label(code)
label(return)
label(PTRGGM)

newmem:
  mov rcx,PTRGGM
  mov [rcx],rax

code:
  mov rcx,[rax+10]
  test rcx,rcx
  jmp return

// GlobalGameManager
PTRGGM:
  dq 0

INJGOLD:
  jmp newmem
  nop 2
return:
