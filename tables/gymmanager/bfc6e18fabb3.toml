[ENABLE]

aobscanmodule(satisfythatperson,GameAssembly.dll,F3 0F 10 41 18 F3 0F 5E 05)
alloc(newmem,$1000,satisfythatperson)

fullaccess(GameAssembly.dll+500,100)

label(jumpinjack)

label(code)
label(return)

newmem:
  mov [rcx+18], (float)100.0

code:
