[[cheat]]
id = "life-meter-ctrl-numpad-1"
name = "Life Meter (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Onibito No Kiki.exe
// Author            : ndck76
// Executable Version: 5.2.2.22320
// Game Version      : v1.03
// Script Date       : 2024-12-03


[ENABLE]

aobscanregion(waittimer,life_meter:Update,life_meter:Update+5000,F30F108618xx0000F3xxxxxxB8xxxxxxxxF2xxxxxx66xxxxxx7Axx0FxxxxxxxxxxF3xxxxxxxxxxxxxxF3xxxxxx) //life_meter:Update+4445
alloc(newmem,$1000,waittimer)
alloc(data,8)
alloc(waittimerbkp,8)
registersymbol(data)
registersymbol(waittimer)
registersymbol(waittimerbkp)
label(code)
label(return)

waittimerbkp:
  readmem(waittimer,8)

newmem:
  mov [data],rsi

code:
  readmem(waittimer,8)
  jmp return

waittimer:
  jmp newmem
  nop 3
return:

[DISABLE]

waittimer:
  readmem(waittimerbkp,8)

unregistersymbol(*)
dealloc(*)"""

