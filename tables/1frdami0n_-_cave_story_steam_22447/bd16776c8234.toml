[[cheat]]
id = "right-click-change-script-for-info"
name = "RIGHT CLICK -> Change script for info"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
The weapon entries might differ in reference to the order
you've picked them up, however you can still modify
their values - just check which weapon you're actually
editing. I've added theoretical ammo entries; some weapons
don't use ammunition or don't have depleting weapon
power, so these values can be ignored in some cases.

When using god mode, I'd advise to use "Variant 2", it
does nullify incoming damage of any kind. "Variant 1"
only sets your current health to 50 (or any other value
you enter after the "mov [CaveStory+.exe+C4054]," entry.
Remember, this uses hex values, so 15 = F, 32 = 50,
10 = A, just use your windows calculator set to programmer
if you can't figure out that system.

Thanks for reading, have fun! And don't cheat your ways
into any leaderboards or hack multiplayer shit. You'd
be a bad sad fuck for trying. - Dami0N
}

[ENABLE]
[DISABLE]"""

[[cheat]]
id = "god-mode-variant-1"
name = "God Mode (Variant 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,CaveStory+.exe,66 83 3D 54 40 23 01 00 7F) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov [CaveStory+.exe+C4054],32
  jmp return

INJECT:
  jmp code
  nop
  nop
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 66 83 3D 54 40 23 01 00

unregistersymbol(INJECT)
dealloc(newmem)"""

