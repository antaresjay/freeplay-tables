type = "script"
source = """
{ Game   : Trudograd_Win64.exe
  Version: 
  Date   : 2020-05-13
  Author : Khayman


  Set inventory weight to 0

  Inventory:get_TotalWeight+15a - 89 48 28              - mov [rax+28],ecx

}

[ENABLE]

