[[cheat]]
id = "unlimited-weapon-durability"
name = "Unlimited Weapon Durability"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(weaponDurability,Yakuza5.exe,83 78 24 FF 0F 45 FA) // should be unique
alloc(newmem,$1000,weaponDurability)

label(code)
label(return)

newmem:
  mov [rax+24],-01
code:
  cmp dword ptr [rax+24],-01
  cmovne edi,edx
  jmp return

weaponDurability:
  jmp newmem
  nop
  nop
return:
registersymbol(weaponDurability)

[DISABLE]

weaponDurability:
  db 83 78 24 FF 0F 45 FA

unregistersymbol(weaponDurability)
dealloc(newmem)"""
