type = "script"
source = """
[enable]
ijmscripts+0:
push r15
sub rsp,20

mov r15,flag+0

init_:
mov rcx,ptr_UIDeveloperTools
mov rcx,[rcx]
test rcx,rcx
je ndd

cmp byte ptr [r15],1
