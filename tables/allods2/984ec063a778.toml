[[cheat]]
id = "initialisation"
name = "Initialisation"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
globalalloc(_player_base,4)
globalalloc(_enable_HP_1HK,4)

globalalloc(_enable_HP,4)
globalalloc(_enable_1HK,4)

 
 
[DISABLE]
_enable_HP_1HK:
db 00

unregistersymbol(_enable_HP_1HK)
unregistersymbol(_player_base)

dealloc(_player_base)
dealloc(_enable_HP_1HK)


dealloc(_enable_HP)
dealloc(_enable_1HK)
unregistersymbol(_enable_HP)
unregistersymbol(_enable_1HK)"""

[[cheat]]
id = "player-base-scan-get-hit-to-update"
name = "Player base scan [get hit to update]"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,allods2.exe,66 89 8A 94 00 00 00 8B 45 08 83)
alloc(newmem,$1000)

label(code)
label(return)
label(health)
label(original)

newmem:
  cmp [edx+B0],000A0000
  jnae code
  mov [_player_base],edx

code:
  cmp [edx+B0],000A0000
  jae health
  cmp dword ptr [_enable_1HK],#0
  je original
  mov [edx+00000094],00
  jmp return

health:
  cmp dword ptr [_enable_HP],#0
  je original
  db 90 90 90 90 90 90 90
  cmp [edx+B0],000A0000
  jae return


original:
  mov [edx+00000094],cx
  jmp return

INJECT:
  jmp newmem
  nop
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 66 89 8A 94 00 00 00

_enable_HP:
db 00
_enable_1HK:
db 00

unregistersymbol(INJECT)

dealloc(newmem)"""

