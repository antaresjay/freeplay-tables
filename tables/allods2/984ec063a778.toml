source = """
[ENABLE]

aobscanmodule(INJECT,allods2.exe,89 50 3C 8B 4D F4 51 8B 4D F0) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov [eax+3C],#1000000
  //mov [eax+3C],edx
  mov ecx,[ebp-0C]
  jmp return

INJECT:
  jmp code
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 89 50 3C 8B 4D F4

unregistersymbol(INJECT)
dealloc(newmem)"""

