[[cheat]]
id = "claim-points"
name = "Claim Points"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(aobclaim,AraHistoryUntold.exe,80 7D 2D 00 0F 96 C2)
alloc(newmem,$1000,aobclaim)
label(code)
label(return)
label(claim)
registersymbol(claim)

newmem:
  push rdx
  mov edx,[claim]
  cmp edx,0
  jle code
  mov [claim],0
  cmp edx,#255
  cmovg edx,[max_byte]
  mov byte ptr [rbp+2D],dl
code:
  pop rdx
  cmp byte ptr [rbp+2D],00
  setbe dl
  jmp return

newmem+200:
claim:
dd 0

newmem+300:
max_byte:
dd #255

aobclaim:
  jmp newmem
  nop 2
return:
registersymbol(aobclaim)

[DISABLE]
aobclaim:
  db 80 7D 2D 00 0F 96 C2
dealloc(newmem)"""

