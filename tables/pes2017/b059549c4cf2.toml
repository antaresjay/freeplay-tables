[ENABLE]
aobscanmodule(data,PES2017.exe,0F B6 01 8B 4D 0C)
alloc(newmem,$1000)

label(code)
label(return)
label(data_ptr)

newmem:

code:
  mov [data_ptr],ecx
  movzx eax,byte ptr [ecx]
  mov ecx,[ebp+0C]
  jmp return

data_ptr:
  dd 0

data:
  jmp code
  nop
return:
registersymbol(data)
registersymbol(data_ptr)

