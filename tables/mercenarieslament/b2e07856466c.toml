[[cheat]]
id = "wip-dont-use-mousehovered-object-charobj-170-hp-168-exp-1cc-movestate"
name = "WIP Dont use mousehovered object (charobj + 170 = hp + 168 = exp + 1cc = movestate)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : MercenariesLament.exe
  Version:
  Date   : 2025-03-31
  Author : kunde

  This script saves RSI (the hovered character pointer) to an external allocated address
  only if RBX is not null.
}

[ENABLE]

aobscan(curchar,48 8B 06 48 8B 00 48 89 45 D8 48) // should be unique
alloc(newmem,$1000,curchar)
alloc(hoveredcharptr,8) // Allocate 8 bytes for storing RSI

label(code)
label(return)

newmem:

code:
  mov rax, [rsi]
  test rdx, rdx             // Check if RDX is not zero
  jnz skip_store            // If RDX is not zero, skip saving RSI
  test rbx, rbx             // Check if RBX is null
  jz skip_store             // If RBX is null, skip saving RSI
  mov [hoveredcharptr], rax  // Save RSI to hoveredcharptr

skip_store:
  mov rax, [rax]
  jmp return

curchar:
  jmp newmem
  nop
return:
registersymbol(curchar)
registersymbol(hoveredcharptr) // Make hoveredcharptr accessible

[DISABLE]

curchar:
  db 48 8B 06 48 8B 00

unregistersymbol(curchar)
unregistersymbol(hoveredcharptr)
dealloc(newmem)
dealloc(hoveredcharptr)"""

