[[cheat]]
id = "firemode-replacement-effect-end-with-new-mission-or-mission-restart"
name = "Firemode Replacement (Effect end with new mission or mission restart)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(code)
label(firemode)
registersymbol(firemode)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here

firemode:
db 00 00 00 00
/*
0 --> Full Auto
1 --> Semi Auto
2 --> Burst of 2
3 --> Burst of 3
4 --> Burst of 4
5 --> Sigle fire with Left or Right click. Click Both for AutoFire
6 or above --> Auto fire without mouse clicks

NOTE:
if you have "Auto Fire for every Weapon" enabled , mode 1 and 5 will be auto only.
   mode 2,3,4 will have automatic bursts
if you have "Single Fire for every Weapon" enabled, mode 0 and 5 will be single only
*/

code:
push eax
mov eax,[firemode]
mov [ecx+3C],eax
pop eax
cmp [ecx+3C],edi
je 004FAC9A
jmp returnhere

"iw4sp.exe"+FAC80:
jmp code
returnhere:

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
unregistersymbol(firemode)
dealloc(newmem)
"iw4sp.exe"+FAC80:
cmp [ecx+3C],edi
je 004FAC9A
//Alt: db 39 79 3C 74 15"""

