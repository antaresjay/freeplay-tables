[[cheat]]
id = "faster-elevator"
name = "Faster Elevator"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanregion(get_elevatorSpeed,ElevatorBrain:GoToPosition+100,ElevatorBrain:GoToPosition+400,89 86 * * 00 00 F3 0F 10 86 * * 00 00)
alloc(newmem,$1000)
label(return)
alloc(get_elevatorSpeedS,14)
registersymbol(get_elevatorSpeedS)

get_elevatorSpeedS:
readmem(get_elevatorSpeed,14)

newmem:
readmem(get_elevatorSpeed,6)
push [rsi]
mov [rsi],(float)5 //Be careful if you increase it, as a high number will make you go through the elevator roof
movss xmm0,[rsi]
pop [rsi]
jmp return

get_elevatorSpeed:
  jmp far newmem
return:
registersymbol(get_elevatorSpeed)

[DISABLE]
get_elevatorSpeed:
readmem(get_elevatorSpeedS,14)

unregistersymbol(get_elevatorSpeed)
dealloc(newmem)"""

