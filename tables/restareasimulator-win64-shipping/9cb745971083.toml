[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(modssss,RestAreaSimulator-Win64-Shipping.exe,48 8B 8E E8 02 00 00 48 8B 9C 24 A0 00 00 00)
alloc(newmem,$1000)

label(code)
label(return)

label(gimmep)
registersymbol(gimmep)


newmem:
  push r11

  mov r11, [rsi+860]
  test r11, r11
  je code

  mov [gimmep], rsi

code:
  pop r11

  mov rcx,[rsi+000002E8]
  mov rbx,[rsp+000000A0]
  jmp return

gimmep:
dq 0


modssss:
  jmp far newmem
  nop
return:
registersymbol(modssss)

[DISABLE]

modssss:
  db 48 8B 8E E8 02 00 00 48 8B 9C 24 A0 00 00 00

unregistersymbol(modssss)
unregistersymbol(gimmep)
dealloc(newmem)"""

