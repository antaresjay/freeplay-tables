[[cheat]]
id = "suitcase-initialization-activate-this-first"
name = "Suitcase Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Suitcase_basepointer)
registersymbol(Suitcase_update_enable)
registersymbol(Suitcase_set_enable)

alloc(Suitcase_basepointer, 4)
alloc(Suitcase_update_enable, 4)
alloc(Suitcase_set_enable, 4)


[DISABLE]
unregistersymbol(Suitcase_basepointer)
unregistersymbol(Suitcase_update_enable)
unregistersymbol(Suitcase_set_enable)

dealloc(Suitcase_basepointer)
dealloc(Suitcase_update_enable)
dealloc(Suitcase_set_enable)"""

