kb.exe+62A81: 89 51 0C              - mov [ecx+0C],edx
// ---------- DONE INJECTING  ----------
kb.exe+62A84: 8B 06                 - mov eax,[esi]
kb.exe+62A86: 8B 48 70              - mov ecx,[eax+70]
