[[cheat]]
id = "invinceable-troops"
name = "Invinceable troops"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : kb.exe
  Version: 1.2 build 5730
  Date   : 2024-05-09
  Author : fenuzulage

  This script makes your troops invinceable and sets enemy HP/Stacksize to 1
}

[ENABLE]

aobscanmodule(INJECT,kb.exe,89 51 0C 8B 06) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
{ distinguish me/opponent: ecx+...
\t104: me: 9             opp: 4
\t1dc: me: 1             opp: 4
\t1e0: me: 1             opp: 4
}
  cmp [ecx+1dc],1
  jne @f
  //me:
  mov edx,[ecx+0C]         // write old health to new health
  { to prevent loss of stack size:
    write actual stack size (ecx+10)
    to new stacksize (esi+14).
    Because in original code esi+14 (new troopsize) will overwrite ecx+10 (troopsize) }
  push edx
  mov edx, [ecx+10]
  mov [esi+14], edx
  pop edx
  // continue with original
  jmp code
@@:
  //opponent: set stacksize=0, health=0, but that does not kill the stack :(
  mov edx,1
  mov [esi+14],1
  jmp code

// original
code:
  // write new health (edx) to troop health
  mov [ecx+0C],edx
  mov eax,[esi]
  jmp return

INJECT:
  jmp newmem
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 89 51 0C 8B 06

unregistersymbol(INJECT)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: kb.exe+62A81

kb.exe+62A64: 8B 44 24 10           - mov eax,[esp+10]
