[[cheat]]
id = "max-mana-rage-wait-for-couple-seconds"
name = "Max Mana/Rage [wait for couple seconds]"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : kb.exe
  Version: 1.2 build 5730
  Date   : 2024-05-09
  Author : fenuzulage

  This script sets Mana and Rage to its maximum values when the game updates
  these (every some seconds).
  Works on adventure map and in a fight.
}

[ENABLE]

aobscanmodule(INJECT,kb.exe,8B 7C 24 10 C7 44 24 18 70 1A F9 00) // should be unique
alloc(newmem,$100)

label(code)
label(return)

newmem:
{
  The problem here ist, that the code that writes player stats is used for multiple stats.
  To change the wanted stat, one must determine what kind of stat the code is about to change.

  Another problem: the object containing the value (Stat) does not know its type.
  The Stat only contains a string count/limit/...
  A pair count/limit of a Stat (ie mana, rage) is kept in an array of pointers
  (statArray).

 - EBP+0C is Stat-Array base
 - [[edi]+4]+0c contains name of stat ie "mana"/"rage"
 - inside Stat-Array, count-Stat is index 0 and limit-Stat is index 1
 - ESP+1C is new value to write
 - a Stat has its value at +08
 - can use edi, because it gets written in original code
}

  // get the name of the stat
  mov edi,[edi+04]   // pointer to struct containing stat name
  mov edi,[edi+0c]   // name
  // check the name is mana or rage
  cmp edi,'mana'
  je @f
  cmp edi,'rage'
  je @f
  // otherwise: run original code
  jmp code

@@:
  // get the stat limit (index 1 in stat array)
  mov edi,[ebp+0C]   // array base == pointer to stat0 (count)
  mov edi,[edi+04]   // pointer to stat1==stat limit
  mov edi,[edi+08]   // value of limit
  // overwrite new value with limit
  mov [esp+1C],edi

// original
code:
  mov edi,[esp+10]
  mov [esp+18],kb.exe+B91A70
  jmp return

INJECT:
  jmp newmem
  nop 7
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 8B 7C 24 10 C7 44 24 18 70 1A F9 00

unregistersymbol(INJECT)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: kb.exe+8C899

kb.exe+8C878: 2B D8                    - sub ebx,eax
kb.exe+8C87A: 0F 85 9D 00 00 00        - jne kb.exe+8C91D
kb.exe+8C880: 5F                       - pop edi
kb.exe+8C881: 5D                       - pop ebp
kb.exe+8C882: C7 06 00 00 00 00        - mov [esi],00000000
kb.exe+8C888: C7 46 04 00 00 00 00     - mov [esi+04],00000000
kb.exe+8C88F: C6 46 14 00              - mov byte ptr [esi+14],00
kb.exe+8C893: 8B C6                    - mov eax,esi
kb.exe+8C895: 5B                       - pop ebx
kb.exe+8C896: C2 18 00                 - ret 0018
// ---------- INJECTING HERE ----------
kb.exe+8C899: 8B 7C 24 10              - mov edi,[esp+10]
// ---------- DONE INJECTING  ----------
kb.exe+8C89D: C7 44 24 18 70 1A F9 00  - mov [esp+18],kb.exe+B91A70
kb.exe+8C8A5: 38 5C 24 24              - cmp [esp+24],bl
kb.exe+8C8A9: 75 18                    - jne kb.exe+8C8C3
kb.exe+8C8AB: 8B 47 6C                 - mov eax,[edi+6C]
kb.exe+8C8AE: 3B C3                    - cmp eax,ebx
kb.exe+8C8B0: 74 11                    - je kb.exe+8C8C3
kb.exe+8C8B2: 8B 48 1C                 - mov ecx,[eax+1C]
kb.exe+8C8B5: C1 E9 03                 - shr ecx,03
kb.exe+8C8B8: 80 E1 01                 - and cl,01
kb.exe+8C8BB: 74 06                    - je kb.exe+8C8C3
}"""

[[cheat]]
id = "player-stats-open-hero"
name = "Player Stats [open hero]"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : kb.exe
  Version: 1.2 build 5730
  Date   : 2024-05-09
  Author : fenuzulage

  This script captures the adresses of Gold/Mana/Rage so they can be changed.
  Open the hero window to capture.
}

[ENABLE]

aobscanmodule(INJECT,kb.exe,8B 34 81 89 74 24 10 EB 06 89 5C 24 10 8B F3 0F) // should be unique
alloc(newmem,$100)
alloc(gold_base,$4)
registersymbol(gold_base)
alloc(rage_base,$4)
registersymbol(rage_base)
alloc(mana_base,$4)
registersymbol(mana_base)

label(code)
label(return)

gold_base:
  dd 0
mana_base:
  dd 0
rage_base:
  dd 0

newmem:
{
    - [ecx+eax*4] gives Stats base adress, +8 its value
    - can use esi because it will be written
    - StatsType stored in local variable ESP+30 [X+4]+c: name
    vs
    - StatsType is in [EDI+4]+c
}
  // capture money/count
  mov esi,[edi+04]    // pointer to struct containing stat name: mana/rage/money/.item/
  cmp [esi+0C],'mone' // 4byte-compare
  jne @f
  mov esi,[ecx+eax*4] // Stat
  mov esi,[esi+04]    // pointer to struct containing stat type: count/limit/...
  cmp [esi+0C],'count'
  jne @f
  mov esi,[ecx+eax*4] // Stat
  mov [gold_base], esi
  jmp code

@@:
  // capture rage/count
  mov esi,[edi+04]    // pointer to struct containing stat name: mana/rage/money/.item/
  cmp [esi+0C],'rage'
  jne @f
  mov esi,[ecx+eax*4] // Stat
  mov esi,[esi+04]    // pointer to struct containing stat type: count/limit/...
  cmp [esi+0C],'count'
  jne @f
  mov esi,[ecx+eax*4] // Stat
  mov [rage_base], esi
  jmp code

@@:
  // capture mana/count
  mov esi,[edi+04]    // pointer to struct containing stat name: mana/rage/money/.item/
  cmp [esi+0C],'mana'
  jne @f
  mov esi,[ecx+eax*4] // Stat
  mov esi,[esi+04]    // pointer to struct containing stat type: count/limit/...
  cmp [esi+0C],'count'
  jne @f
  mov esi,[ecx+eax*4] // Stat
  mov [mana_base], esi
  jmp code

@@:
  jmp code         // not needed, would fall through

code:
  mov esi,[ecx+eax*4]
  mov [esp+10],esi
  jmp return

INJECT:
  jmp newmem
  nop 2
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 8B 34 81 89 74 24 10

unregistersymbol(INJECT)
dealloc(newmem)

dealloc(gold_base)
unregistersymbol(gold_base)
dealloc(rage_base)
unregistersymbol(rage_base)
dealloc(mana_base)
unregistersymbol(mana_base)

