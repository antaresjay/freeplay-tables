kb.exe+62A8C: 89 51 10              - mov [ecx+10],edx
kb.exe+62A8F: 8B 4E 20              - mov ecx,[esi+20]
kb.exe+62A92: F6 C1 08              - test cl,08
kb.exe+62A95: 75 5F                 - jne kb.exe+62AF6
kb.exe+62A97: A1 2C 73 B7 01        - mov eax,[kb.exe+177732C]
