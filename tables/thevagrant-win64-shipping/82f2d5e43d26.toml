[[cheat]]
id = "activate-first"
name = "[ Activate First ]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(_AobPlayerBase,TheVagrant-Win64-Shipping.exe,0F 28 81 A0 01 00 00 0F 2E)
alloc(newmem,$1000,"TheVagrant-Win64-Shipping.exe)

label(code)
label(return)
label(Health)
label(Rage)
label(Gold)
label(Mana)
label(Attack)
label(Defense)
label(Critical)
label(Luck)


newmem:
  push rsi
  cmp dword ptr [rcx+000005E0],0
  je code
  mov rsi,[rcx+00000020]
  cmp rsi,1000000
  jna code
  mov rsi,[rsi+000007D8]
  cmp rsi,1000000
  jna code

  cmp [Health],0
  je LabelRage
  fild [rsi+00000118]
  fistp [rsi+00000148]

LabelRage:
  cmp [Rage],0
  je LabelGold
  fild [rsi+0000011C]
  fistp [rsi+0000014C]

LabelGold:
  cmp [Gold],0
  je LabelMana
  mov [rsi+00000150],#9999999

LabelMana:
  cmp [Mana],0
  je LabelAttack
  mov [rsi+00000154],#9999999

LabelAttack:
  cmp [Attack],0
  je LabelDefense
  mov [rsi+00000120],#999999

LabelDefense:
  cmp [Defense],0
  je LabelCritical
  mov [rsi+00000124],#999999

LabelCritical:
  cmp [Critical],0
  je LabelLuck
  mov [rsi+00000128],(float)9999

LabelLuck:
  cmp [Luck],0
  je code
  mov [rsi+0000012C],#999999

code:
  pop rsi
  movaps xmm0,[rcx+000001A0]
  jmp return

Health:
  dd 0

Rage:
  dd 0

Gold:
  dd 0

Mana:
  dd 0

Attack:
  dd 0

Defense:
  dd 0

Critical:
  dd 0

Luck:
  dd 0

_AobPlayerBase:
  jmp newmem
  nop
  nop
return:
registersymbol(_AobPlayerBase)
registersymbol(Health)
registersymbol(Rage)
registersymbol(Gold)
registersymbol(Mana)
registersymbol(Attack)
registersymbol(Defense)
registersymbol(Critical)
registersymbol(Luck)

[DISABLE]

_AobPlayerBase:
  db 0F 28 81 A0 01 00 00

unregistersymbol(_AobPlayerBase)
unregistersymbol(Health)
unregistersymbol(Rage)
unregistersymbol(Gold)
unregistersymbol(Mana)
unregistersymbol(Attack)
unregistersymbol(Defense)
unregistersymbol(Critical)
unregistersymbol(Luck)
dealloc(newmem)

