id = "get-hp-addresses"
name = "Get HP Addresses"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Seinarukana.exe
  Version: 
  Date   : 2017-05-12
  Author : ColonelRVH

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(Set_HP_AOB,Seinarukana.exe,89 41 54 83 7D 0C 00 7E) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(Cmp_Godmode_Flag)
label(Cmp_InstantKill_Flag)
label(Godmode)
label(InstantKill)
label(OriginalCode)

registersymbol(Godmode_Flag)
registersymbol(InstantKill_Flag)
alloc(Godmode_Flag,4)
alloc(InstantKill_Flag,4)

Godmode_Flag:
dd 0
Instantkill_Flag:
dd 0

newmem:
  cmp dword ptr [ecx+88],1
  je Cmp_Godmode_Flag
  jmp Cmp_InstantKill_Flag

Cmp_Godmode_Flag:
  cmp dword ptr [Godmode_Flag],1
  je Godmode
  jmp OriginalCode

Cmp_InstantKill_Flag:
  cmp dword ptr [InstantKill_Flag],1
  je InstantKill

OriginalCode:
  mov [ecx+54],eax

code:
  cmp dword ptr [ebp+0C],00
  jmp return

