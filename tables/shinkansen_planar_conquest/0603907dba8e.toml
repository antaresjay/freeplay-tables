[[cheat]]
id = "wfcity-base-address-scan-to-activate-play-map-to-update-play-map"
name = "WFCity Base Address Scan (To Activate: Play Map, To Update: Play Map)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(WFCity_savedAOB)
label(WFCity_returnhere)
label(WFCity_originalcode)
label(WFCity_exit)

label(WFCity_update_exit)
label(WFCity_set_exit)
label(WFCity_populationset_exit)
label(WFCity_buildset_exit)

registersymbol(WFCity_savedAOB)

//20C6D957 - D9 5D C0              - fstp dword ptr [ebp-40]
//20C6D95A - D9EE                  - fldz
// WFCity:CheckResources+34
//20C6D95C - D9 5D B4              - fstp dword ptr [ebp-4C]
//20C6D95F - 83 EC 0C              - sub esp,0C
//20C6D962 - 57                    - push edi
//20C6D963 - 8B 07                 - mov eax,[edi]
aobscan(WFCity_searchedAOB, D9 5D B4 83 EC 0C 57)

alloc(WFCity_newmem, 2048, WFCity_searchedAOB)
alloc(WFCity_temp1, 4, WFCity_searchedAOB)
alloc(WFCity_temp2, 4, WFCity_searchedAOB)


WFCity_newmem:
mov [WFCity_temp1], ebx
mov [WFCity_temp2], ecx

cmp dword ptr [edi+154], #0
je WFCity_buildset_exit
mov ebx, [edi+154]
cmp byte ptr [ebx+38], #1
jne WFCity_buildset_exit

cmp dword ptr [WFCity_update_enable], #0
je WFCity_update_exit
mov [WFCity_basepointer], edi
WFCity_update_exit:

cmp dword ptr [WFCity_set_enable], #0
je WFCity_set_exit
WFCity_set_exit:

cmp dword ptr [WFCity_populationset_enable], #0
je WFCity_populationset_exit
mov [edi+25c], (float)9999999
WFCity_populationset_exit:

cmp dword ptr [WFCity_buildset_enable], #0
je WFCity_buildset_exit
cmp dword ptr [edi+10c], #0
je WFCity_buildset_exit
mov ebx, [edi+10c]
cmp dword ptr [ebx+8], #0
je WFCity_buildset_exit
mov ebx, [ebx+8]
cmp dword ptr [ebx+10], #0
je WFCity_buildset_exit
mov ebx, [ebx+10]
mov [ebx+2c], (float)0
WFCity_buildset_exit:

mov ebx, [WFCity_temp1]
mov ecx, [WFCity_temp2]


WFCity_originalcode:
db D9 5D B4 83 EC 0C
//fstp dword ptr [ebp-4C]
//sub esp,0C


WFCity_exit:
jmp WFCity_returnhere


WFCity_searchedAOB:
WFCity_savedAOB:
jmp WFCity_newmem
nop
WFCity_returnhere:


[DISABLE]
WFCity_savedAOB:
db D9 5D B4 83 EC 0C
//fstp dword ptr [ebp-4C]
//sub esp,0C

unregistersymbol(WFCity_savedAOB)

dealloc(WFCity_newmem)
dealloc(WFCity_temp1)
dealloc(WFCity_temp2)"""

