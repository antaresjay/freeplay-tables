alloc(WFCity_populationset_enable, 4)
alloc(WFCity_buildset_enable, 4)


[DISABLE]
unregistersymbol(WFCity_basepointer)
unregistersymbol(WFCity_update_enable)
unregistersymbol(WFCity_set_enable)
unregistersymbol(WFCity_populationset_enable)
unregistersymbol(WFCity_buildset_enable)

