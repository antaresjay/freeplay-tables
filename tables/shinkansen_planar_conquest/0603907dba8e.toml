[[cheat]]
id = "mmlordcreatormanager-base-address-scan-to-activate-change-portrait-with-right-arrow-to-update-change-portrait-with-right-arrow"
name = "MMLordCreatorManager Base Address Scan (To Activate: Change Portrait with Right Arrow, To Update: Change Portrait with Right Arrow)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(MMLordCreatorManager_savedAOB)
label(MMLordCreatorManager_returnhere)
label(MMLordCreatorManager_originalcode)
label(MMLordCreatorManager_exit)

label(MMLordCreatorManager_update_exit)
label(MMLordCreatorManager_set_exit)

registersymbol(MMLordCreatorManager_savedAOB)

//21379F26 - 83 EC 1C              - sub esp,1C
//21379F29 - 8B 7D 08              - mov edi,[ebp+08]
// PCGUI.Mobile.Main:MMLordCreatorManager:NextLord+c
//21379F2C - 0FB6 87 54010000      - movzx eax,byte ptr [edi+00000154]
//21379F33 - 85 C0                 - test eax,eax
//21379F35 - 0F84 09020000         - je 2137A144
//21379F3B - 8B 87 58010000        - mov eax,[edi+00000158]
//21379F41 - 40                    - inc eax
//21379F42 - 8B 0D BC825A1C        - mov ecx,[1C5A82BC] : [208E68B8]
aobscan(MMLordCreatorManager_searchedAOB, 0F B6 87 54 01 00 00 85 C0 * * * * * * 8B 87 58 01 00 00)

alloc(MMLordCreatorManager_newmem, 2048, MMLordCreatorManager_searchedAOB)


MMLordCreatorManager_newmem:
cmp dword ptr [MMLordCreatorManager_update_enable], #0
je MMLordCreatorManager_update_exit
mov [MMLordCreatorManager_basepointer], edi
MMLordCreatorManager_update_exit:

cmp dword ptr [MMLordCreatorManager_set_enable], #0
je MMLordCreatorManager_set_exit
mov [edi+160], #9999
MMLordCreatorManager_set_exit:


MMLordCreatorManager_originalcode:
db 0F B6 87 54 01 00 00
//movzx eax,byte ptr [edi+00000154]


MMLordCreatorManager_exit:
jmp MMLordCreatorManager_returnhere


MMLordCreatorManager_searchedAOB:
MMLordCreatorManager_savedAOB:
jmp MMLordCreatorManager_newmem
nop
nop
MMLordCreatorManager_returnhere:


[DISABLE]
MMLordCreatorManager_savedAOB:
db 0F B6 87 54 01 00 00
//movzx eax,byte ptr [edi+00000154]

unregistersymbol(MMLordCreatorManager_savedAOB)

dealloc(MMLordCreatorManager_newmem)"""

