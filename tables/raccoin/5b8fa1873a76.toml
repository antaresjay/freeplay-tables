[[cheat]]
id = "infinite-tickets"
name = "Infinite Tickets"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(ShopTickets,GameAssembly.dll,89 93 14 02 00 00)
alloc(newmem,$1000,ShopTickets)
label(code return)

newmem:

code:
  mov [rbx+00000214],#999
  jmp return

ShopTickets:
  jmp newmem
  nop
return:
registersymbol(ShopTickets)

[DISABLE]

ShopTickets:
  db 89 93 14 02 00 00

unregistersymbol(ShopTickets)
dealloc(newmem)"""

