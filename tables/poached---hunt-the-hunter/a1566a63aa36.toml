[[cheat]]
id = "weapon-behavior"
name = "Weapon Behavior"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(_o,41 89 87 14 02 00 00 49 8B CF 49)
alloc(_0,8)
alloc(newmem,$1000,_o)
label(return)
registersymbol(_o _0)
newmem:
  mov [_0],r15
  mov [r15+214],eax
  jmp return
_o:
  jmp newmem
  nop 2
return:
[DISABLE]
dealloc(*)
unregistersymbol(*)
_o:
  db 41 89 87 14 02 00 00"""

