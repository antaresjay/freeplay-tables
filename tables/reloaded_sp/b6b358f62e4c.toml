[[cheat]]
id = "currency"
name = "Currency"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(_currency,GameAssembly.dll,8B 40 78 89 84 24 B8 04 00 00)
alloc(newmem,$100,_currency)
label(code)
label(return)
registersymbol(_currency)
newmem:
  mov [rax+78],(int)9999
code:
  mov eax,[rax+78]
  mov [rsp+4B8],eax
  jmp return
_currency:
  jmp newmem
  nop 5
return:
[DISABLE]
dealloc(newmem)
unregistersymbol(_currency)
_currency:
  db 8B 40 78 89 84 24 B8 04 00 00"""

