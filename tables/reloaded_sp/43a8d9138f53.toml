source = """
// Game Executable   : Reloaded_SP.exe
// Author            : ndck76
// Executable Version: 2023.1.16.44372
// Game Version      : v1.02
// Script Date       : 2023-12-13


[ENABLE]

aobscanmodule(ohk,GameAssembly.dll,) //Kape_Engine.Cast_Base.Calculate_NPC_Pain_Skins
alloc(newmem,$1000,ohk)
alloc(ohkbkp,8)
registersymbol(ohk)
registersymbol(ohkbkp)
label(code)
label(return)

ohkbkp:
  readmem(ohk,8)

newmem:
  mov [rax+000006F0],0

code:
  readmem(ohk,8)
  jmp return

ohk:
  jmp newmem
  nop 3
return:

[DISABLE]

ohk:
  readmem(ohkbkp,8)

unregistersymbol(*)
dealloc(*)"""
