[[cheat]]
id = "master-code"
name = "Master Code"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Borderlands.exe
  Version: 1.4.2.1
  Date   : 2018-06-22
  Author : Dante
}
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(GenRead,2048)
label(GenRead_rtn)
label(GenRead_OrgCode)
label(GenRead_exit)
registersymbol(GenRead)

alloc(Cheats,8)
registersymbol(Cheats)
// 0 God Mode -- 1 God Mode Vehicle -- 2 All Ammo -- 3 No Reload
// 4 Ability Cooldown -- 5 Quick Lvl Up -- 6 Always 999999$ Money
// 7 Super Weapon Sets Curr wep's damage 2000 Fire rate 0.1 Accuracy 0.01
Cheats:
db 00 00 00 00 00 00 00 00

Label(Assault_Rifle_Ammo)
alloc(Assault_Rifle_Ammo_Ptr,4)
registersymbol(Assault_Rifle_Ammo_Ptr)

Label(Boost)
alloc(BoostPtr,4)
registersymbol(BoostPtr)

Label(VehicleHealtht)
alloc(VehicleHealthtPtr,4)
registersymbol(VehicleHealthtPtr)

Label(XP_XP)
alloc(XP_XPPtr,4)
registersymbol(XP_XPPtr)

Label(QLvl_extt)
alloc(QLvl_ext2,64)
registersymbol(QLvl_ext2)
alloc(QLvl_ext3,64)
registersymbol(QLvl_ext3)

Label(Ability_Cooldown)
alloc(Ability_CooldownPtr,4)
registersymbol(Ability_CooldownPtr)

Label(Player_Health)
alloc(Player_Health_Ptr,4)
registersymbol(Player_Health_Ptr)

Label(Player_Shield)
alloc(Player_Shield_Ptr,4)
registersymbol(Player_Shield_Ptr)

Label(Grenades)
alloc(Grenades_Ptr,4)
registersymbol(Grenades_Ptr)

Label(Repeater_Ammo)
alloc(Repeater_Ammo_Ptr,4)
registersymbol(Repeater_Ammo_Ptr)

Label(Revolver_Ammo)
alloc(Revolver_Ammo_Ammo_Ptr,4)
registersymbol(Revolver_Ammo_Ammo_Ptr)

Label(SMG_Ammo)
alloc(SMG_Ammo_Ptr,4)
registersymbol(SMG_Ammo_Ptr)

Label(Shotgun_Ammo)
alloc(Shotgun_Ammo_Ammo_Ptr,4)
registersymbol(Shotgun_Ammo_Ammo_Ptr)

Label(Sniper_Ammo)
alloc(Sniper_Ammo_Ammo_Ptr,4)
registersymbol(Sniper_Ammo_Ammo_Ptr)

Label(Rocket_Ammo)
alloc(Rocket_Ammo_Ammo_Ptr,4)
registersymbol(Rocket_Ammo_Ammo_Ptr)

label(SkillPointsReader)
label(SkillPointsReader_rtn)
label(SkillPointsReader_OrgCode)
label(SkillPointsReader_exit)
registersymbol(SkillPointsReader)

alloc(SP_ptr,4)
registersymbol(SP_ptr)

label(No_Reload)
label(MagRead)
label(MagRead_rtn)
label(MagRead_exit)
registersymbol(MagRead)

alloc(Curr_Ammo_Ptr,4)
registersymbol(Curr_Ammo_Ptr)

label(cikis)
GenRead: //this is allocated memory, you have read,write,execute access
//place your code here
push eax

Boost://ebx,00000000
cmp ebx,00000000
jne short VehicleHealtht
cmp [ebp+94],(float)20
jne short VehicleHealtht
mov [BoostPtr],ebp
//movss xmm0,[ebp+68]
cmp byte ptr [Cheats+1],00
je short VehicleHealtht
mov eax,[ebp+54]
mov [ebp+68],eax

VehicleHealtht://ebx,00000001
cmp ebx,00000001
jne short XP_XP
mov eax,[esi]
cmp [ebp+94],(float)12
jne short XP_XP
mov [VehicleHealthtPtr],ebp
//movss xmm0,[ebp+68]
cmp byte ptr [Cheats+1],00
je short XP_XP
mov eax,[ebp+54]
mov [ebp+68],eax

XP_XP://ebx,00000002
cmp ecx,0
je short Ability_Cooldown
cmp ebx,00000002
jne short Ability_Cooldown
mov [XP_XPPtr],ebp
cmp byte ptr [Cheats+5],00
je short Ability_Cooldown
movss [QLvl_ext2],xmm1
mov ecx,[SP_ptr]
mov ecx,[ecx+288]
cvtsi2ss xmm1,ecx
mov [QLvl_ext3],(float)1
movss xmm0,[QLvl_ext3]
subss xmm1,xmm0

movss xmm0,[ebp+68]

comiss xmm0,xmm1
jae short QLvl_extt

movss [ebp+68],xmm1

QLvl_extt:
movss xmm1,[QLvl_ext2]
mov ecx,0
//mov eax,[ebp+54]
//mov [ebp+68],eax

Ability_Cooldown://ebx,00000003
cmp ebx,00000003
jne short Player_Health
mov [Ability_CooldownPtr],ebp
cmp byte ptr [Cheats+4],00
je short Player_Health
mov [ebp+68],(Float)0

Player_Health://ebx,00000005
cmp ebx,00000005
jne short Player_Shield
mov [Player_Health_Ptr],ebp
cmp byte ptr [Cheats],00
je short Player_Shield
mov eax,[ebp+54]
mov [ebp+68],eax

Player_Shield://ebx,00000006
cmp ebx,00000006
jne short Assault_Rifle_Ammo
mov [Player_Shield_Ptr],ebp
cmp byte ptr [Cheats],00
je short Assault_Rifle_Ammo
mov eax,[ebp+54]
mov [ebp+68],eax

Assault_Rifle_Ammo://ebx,00000007
cmp ebx,00000007
jne short Grenades
mov [Assault_Rifle_Ammo_Ptr],ebp
cmp byte ptr [Cheats+2],00
je short Grenades
mov eax,[ebp+54]
mov [ebp+68],eax

Grenades://ebx,00000008
cmp ebx,00000008
jne short Repeater_Ammo
mov [Grenades_Ptr],ebp
cmp byte ptr [Cheats+2],00
je short Repeater_Ammo
mov eax,[ebp+54]
mov [ebp+68],eax

Repeater_Ammo://ebx,00000009
cmp ebx,00000009
jne short Revolver_Ammo
mov [Repeater_Ammo_Ptr],ebp
cmp byte ptr [Cheats+2],00
je short Revolver_Ammo
mov eax,[ebp+54]
mov [ebp+68],eax

Revolver_Ammo://ebx,0000000A
cmp ebx,0000000A
jne short SMG_Ammo
mov [Revolver_Ammo_Ammo_Ptr],ebp
cmp byte ptr [Cheats+2],00
je short SMG_Ammo
mov eax,[ebp+54]
mov [ebp+68],eax

SMG_Ammo://ebx,0000000B
cmp ebx,0000000B
jne short Shotgun_Ammo
mov [SMG_Ammo_Ptr],ebp
cmp byte ptr [Cheats+2],00
je short Shotgun_Ammo
mov eax,[ebp+54]
mov [ebp+68],eax

Shotgun_Ammo://ebx,0000000C
cmp ebx,0000000C
jne short Sniper_Ammo
mov [Shotgun_Ammo_Ammo_Ptr],ebp
cmp byte ptr [Cheats+2],00
je short Sniper_Ammo
mov eax,[ebp+54]
mov [ebp+68],eax

Sniper_Ammo://ebx,0000000D
cmp ebx,0000000D
jne short Rocket_Ammo
mov [Sniper_Ammo_Ammo_Ptr],ebp
cmp byte ptr [Cheats+2],00
je short Rocket_Ammo
mov eax,[ebp+54]
mov [ebp+68],eax

Rocket_Ammo://ebx,0000000E
cmp ebx,0000000E
jne short cikis
mov [Rocket_Ammo_Ammo_Ptr],ebp
cmp byte ptr [Cheats+2],00
je short cikis
mov eax,[ebp+54]
mov [ebp+68],eax

cikis:
pop eax
GenRead_OrgCode:
movss xmm0,[ebp+68]

GenRead_exit:
jmp GenRead_rtn

SkillPointsReader: //this is allocated memory, you have read,write,execute access
//place your code here
mov [SP_ptr],eax
cmp byte ptr [Cheats+6],00
je short SkillPointsReader_OrgCode
mov,[eax+000002A4],#999999

SkillPointsReader_OrgCode:
cmp ecx,[eax+0000029C]

SkillPointsReader_exit:
jmp SkillPointsReader_rtn

MagRead: //this is allocated memory, you have read,write,execute access
//place your code here
mov [Curr_Ammo_Ptr],esi

cmp byte ptr [Cheats+7],00
je short No_Reload

mov [esi+000002bc],(float)2000 //Damage
mov [esi+000002ac],(float)0.01 //Accuracy
mov [esi+000002a8],(float)0.01 //Accuracy
mov [esi+00000298],(float)0.1  //Fire Rate

No_Reload:
cmp byte ptr [Cheats+3],00
je short MagRead_exit
mov eax,[esi+000003b0]
mov [esi+000003CC],eax
jmp MagRead_rtn

MagRead_exit:
mov eax,[esi+000003CC]
jmp MagRead_rtn

"Borderlands.exe"+1079AB4:
jmp MagRead
nop
MagRead_rtn:

"Borderlands.exe"+107EEA2:
jmp SkillPointsReader
nop
SkillPointsReader_rtn:

"Borderlands.exe"+8DC5C9:
jmp GenRead
GenRead_rtn:


[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(GenRead)
