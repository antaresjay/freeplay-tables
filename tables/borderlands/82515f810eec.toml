"Borderlands.exe"+8DC889: 8B 0D 18 3C FC 01        -  mov ecx,[Borderlands.exe+1BC3C18]
"Borderlands.exe"+8DC88F: E8 4C 31 D7 FF           -  call Borderlands.exe+64F9E0
"Borderlands.exe"+8DC894: D9 5C 24 0C              -  fstp dword ptr [esp+0C]
