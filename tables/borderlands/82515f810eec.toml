id = "instant-skill-cooldown"
name = "Instant skill cooldown"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(skillreset,Borderlands.exe,04 F3 0F 10 45 68 0F 2E 85 D8 00 00 00 9F F6 C4 44) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(playerskill)
label(normalout)

newmem:

code:
  cmp [ebp+0008],00100000 // Standard for all player chars
  jne normalout
  cmp [ebp+0070],(float)1 // Standard for all player chars
  jne normalout
  cmp [ebp+002C],(int)4926 // Standard for all player chars
  jne normalout
  cmp [ebp+000C],0
  jne normalout
  cmp [ebp+0100],(int)1
  jne normalout
  cmp [ebp+0018],0
  jne normalout
  cmp [ebp+007C],(int)17 // Standard for all player chars
  je playerskill
  jmp normalout

playerskill:
  mov [ebp+68],(float)0
  movss xmm0,[ebp+68]
  jmp return

normalout:
  movss xmm0,[ebp+68]
  jmp return

skillreset+01:
  jmp newmem
return:
registersymbol(skillreset)

[DISABLE]

skillreset+01:
  db F3 0F 10 45 68 0F 2E 85 D8 00 00 00 9F F6 C4 44

unregistersymbol(skillreset)
dealloc(newmem)

