source = """
{ Game   : icewind.exe
  Version: 
  Date   : 2021-08-14
  Author : Ich

  This script does blah blah blah


  RBX + 28  : 0 = we, 1 = they
  RBX + 12c : 1 = we, 0 = they
}

[ENABLE]

aobscanmodule(ohk_godmode,icewind.exe,66 29 83 7C 05 00 00) // should be unique
alloc(newmem,$1000,ohk_godmode)

label(code)
label(return)

newmem:
  mov eax,[rbx+12c]      // get our magic flag
  cmp eax,1              // check if party member
  jne @f                 // if not, jump to @@

  mov ax,#99             // load 99 and
  mov [rbx+0000057C],ax  // write to current health
  mov ax,0               // reduce current damage to 0
  jmp code               // continue with original code

@@:                // enemy code
  mov ax,7000      // dmg should be sufficient

code:
  sub [rbx+0000057C],ax
  jmp return

ohk_godmode:
  jmp newmem
  nop 2
return:
registersymbol(ohk_godmode)

[DISABLE]

ohk_godmode:
  db 66 29 83 7C 05 00 00

unregistersymbol(ohk_godmode)
