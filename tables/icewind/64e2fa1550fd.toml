[[cheat]]
id = "f5-godmode-and-one-hit-kill"
name = "F5: GodMode and One-Hit-Kill"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game   : icewind.exe
  Version: 
  Date   : 2021-08-14
  Author : Ich

  This script does blah blah blah


  RBX + 28  : 0 = we, 1 = they
  RBX + 12c : 1 = we, 0 = they
}

[ENABLE]

aobscanmodule(ohk_godmode,icewind.exe,66 29 83 7C 05 00 00) // should be unique
alloc(newmem,$1000,ohk_godmode)

label(code)
label(return)
label(godmode)
label(onehit)
label(godmode_on)
label(onehit_on)

newmem:
  mov eax,[rbx+12c]           // get our magic flag
  cmp eax,1                   // check if party member
  jne onehit                  // if not, jump to onehit

godmode:
  cmp byte ptr [godmode_on],1 // check if godmode is on
  jne code                    // if not, continue with normal code
  mov ax,0                    // reduce current damage to 0
  jmp code                    // continue with original code

onehit:
  cmp byte ptr [onehit_on],1   // check if OneHitKill is on
  jne code                     // if not, continue with normal code
  mov ax,7000                  // else make damage which should be sufficient

code:
  sub [rbx+0000057C],ax
  jmp return

godmode_on:
  db 0
onehit_on:
  db 0


ohk_godmode:
  jmp newmem
  nop 2
return:
registersymbol(ohk_godmode)
registersymbol(godmode_on)
registersymbol(onehit_on)

[DISABLE]

ohk_godmode:
  db 66 29 83 7C 05 00 00

unregistersymbol(*)
dealloc(newmem)

