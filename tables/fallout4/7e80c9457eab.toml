[[cheat]]
id = "inf-ap"
name = "inf AP"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Fallout4.exe
  Version: v1.10.980.0.1 (STEAM)
  Date   : 2024-04-26
  Author : Oyyzj

}

[ENABLE]
aobscanmodule(AP,Fallout4.exe,F3 0F 58 xx xx 00 83 FB 02 75) // should be unique
alloc(newmem,100,AP)
alloc(pAP,4)
label(code)
label(return)
label(rAP)
label(vAP)
newmem:
  cmp [rbp+e8],1
  jne code
  mov [pAP],rbp
  addss xmm6,[vAP]
  jmp return
code:
  readmem(AP,6)
  jmp return
rAP:
  readmem(AP,6)
vAP:
  dd (float)-1
AP:
  jmp newmem
  db 90
return:
registersymbol(AP)
registersymbol(pAP)
registersymbol(rAP)
registersymbol(vAP)
[DISABLE]
AP:
  readmem(rAP,6)
unregistersymbol(*)
dealloc(*)"""

