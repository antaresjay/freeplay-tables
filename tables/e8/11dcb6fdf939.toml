// 004C2E4C - 83 C4 08 - add esp,08
// 004C2E4F - C3 - ret
// 004C2E50 - 8B 4E 08  - mov ecx,[esi+08] <<
// 004C2E53 - 89 4C 24 08  - mov [esp+08],ecx
// 004C2E57 - DB 44 24 08  - fild dword ptr [esp+08]

  aobscan(consumable_searchedAOB, 8B 4E 08 89 4C 24 08)
