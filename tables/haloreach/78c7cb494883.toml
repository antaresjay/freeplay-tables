type = "script"
source = """
[ENABLE]


aobscanmodule(ammo_Aobs,haloreach.dll,66 2B CF 66 42 89 8C 32 C6 02 00 00)
alloc(newmem,$1000,ammo_Aobs)

label(code)
label(return)

newmem:

code:

mov cx,c8
mov [rdx+r14+000002C6],cx
jmp return

ammo_Aobs:
jmp newmem
nop 7
return:
