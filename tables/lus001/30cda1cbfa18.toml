[[cheat]]
id = "notes-on-faster-fade-not-working"
name = "notes on faster fade (not working)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
lus001.exe+81E30:
RETN


 
 
[DISABLE]
lus001.exe+81E30:
push ebp

/*
ALL functions containing this pattern are related to fade ins/outs
00481F1F     6A 1E          PUSH 1E
00481F21  |. 68 000000FF    PUSH FF000000                            ; |Arg1 = FF000000
00481F26     6A 0C          PUSH 0C
*/"""

