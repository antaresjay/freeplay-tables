source = """
{ Game   : Rail Route.exe
  Version: 
  Date   : 2026-04-21
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,Game.GameController:SparseFixedUpdate)
define(bytes,55 48 8B EC 48 83 EC 70)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Game.GameController:SparseFixedUpdate)

label(code)
label(return)

newmem:
mov [gamecontroller_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,70
  jmp return

gamecontroller_ptr:
dq 0

address:
  jmp newmem
  nop 3
return:
registersymbol(gamecontroller_ptr)

[DISABLE]

address:
  db bytes
  // push rbp
  // mov rbp,rsp
  // sub rsp,70

dealloc(newmem)
unregistersymbol(gamecontroller_ptr)"""

