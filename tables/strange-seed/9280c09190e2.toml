id = "inventory-item-ctrl-numpad-1-feed-to-populate-values"
name = "Inventory Item (Ctrl + Numpad 1) {Feed to populate values}"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Strange Seed.exe
// Author            : ndck76
// Executable Version: 2022.3.62.28864
// Game Version      : v1.0
// Script Date       : 2025-11-09


[ENABLE]

aobscanmodule(inventory,GameAssembly.dll,4401xxxx488Bxxxxxxxxxx4885xx74xx488Bxxxx488B) //ChronicleGames.Seedling.InventoryManager.AddItem
alloc(newmem,$1000,inventory)
alloc(data2,8)
alloc(inventorybkp,11)
registersymbol(data2)
registersymbol(inventory)
registersymbol(inventorybkp)
label(code)
label(return)

inventorybkp:
  readmem(inventory,11)

newmem:
  mov [data2],rax

code:
  readmem(inventory,11)
  jmp return

inventory:
  jmp newmem
  nop 6
return:

[DISABLE]

inventory:
  readmem(inventorybkp,11)

unregistersymbol(*)
dealloc(*)"""

