[[cheat]]
id = "right-click-here-change-script-for-info"
name = "Right click HERE -> change script for info"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
Here's a nifty table for Team 17's "Alien Breed 2: Assault"
as sold on Steam (tested with a newer steam build as of the
7th of March 2017).

It includes some pointers which work from time to time, but
don't count on them. Most of your needs should be satisfied
by the scripts. The "P1" and "P2" does NOT stand for player
number, it's just to label a different pointer which COULD
work.
THEY ARE NOT VERIFIED TO WORK AT ALL, they are just alright
from time to time. Freeze them at your own risk, as it
could fuck up your (save)game. Check if the values match
before entering/changing anything.

Included is a god mode (damage towards the player is
nullified), another variation of aforementioned god mode
(resetting Conrad's health to 999 after he is hit), a script
which keep your currently selected weapon at 200 ammo and
another script, which will give you 20 of the currently
selected item.

Some info:
Ammo, credits, stamina and health are stored as "4 byte values".
* Health starts at "100" and gets lowered once the player takes
damage.
* Stamina starts at "0" and increases to exorbitantly high
numbers once you stess Conrad. A value of "3215215530" means
he's pretty much powered out and gasps for air. It is usally
stored near the credits and health values.
Since all of the instructions used for stamina are handlling
other code as well I can't be absolutely sure that my script
for infinite stamina will work flawlessy/without crashing/all
of the time.

Anyways, have fun! - CyberD3m0n
}

[ENABLE]
[DISABLE]"""

[[cheat]]
id = "true-god-mode"
name = "True god mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,AlienBreed2Assault.exe,29 03 8B 1B 8B 4C 24 14) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(conrad)

newmem:

code:
  cmp [ebx+0190],2
  je conrad
  sub [ebx],eax
  mov ebx,[ebx]
  mov ecx,[esp+14]
  jmp return

conrad:
  nop
  mov ebx,[ebx]
  mov ecx,[esp+14]
  jmp return

INJECT:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 29 03 8B 1B 8B 4C 24 14

unregistersymbol(INJECT)
dealloc(newmem)

AlienBreed2Assault.exe+8148F1:
  sub [ebx],eax
  mov ebx,[ebx]
  mov ecx,[esp+14]"""

