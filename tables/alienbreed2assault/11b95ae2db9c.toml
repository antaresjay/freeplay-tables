[[cheat]]
id = "infinite-stamina"
name = "Infinite stamina"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,AlienBreed2Assault.exe,F3 0F 10 07 F3 0F 58 44 24 10) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(infstam)

newmem:

code:
  cmp [edi+0044],(float)64
  je infstam
  movss xmm0,[edi]
  addss xmm0,[esp+10]
  jmp return

infstam:
  nop
  addss xmm0,[esp+10]
  jmp return

INJECT:
  jmp newmem
  nop
  nop
  nop
  nop
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db F3 0F 10 07 F3 0F 58 44 24 10

unregistersymbol(INJECT)
dealloc(newmem)

AlienBreed2Assault.exe+8158B0:
  movss xmm0,[edi]
  addss xmm0,[esp+10]"""

