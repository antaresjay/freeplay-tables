type = "script"
source = """
// Game Executable   : recolored-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 4.27.2.0
// Game Version      : v758579
// Script Date       : 2024-09-24


[ENABLE]

aobscanmodule(master,recolored-Win64-Shipping.exe,48 8B 01 F3 0F 59 89 90 07 00 00) //488BxxF3xxxxxxxxxxxxxx48FFxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx4889xxxxxx574883xxxx488Bxx488Bxx0F29xxxxxx0F28xxFFxxxxxxxxxxF3xxxxxxxxxxxxxx488BxxF3xxxxxxxxxxxxxxF3xxxxxxxxxxxxxxF3xxxxxx488Bxxxxxxxxxx488Bxxxxxx0F28xxxxxx4883xxxx5F48FFxxxxxxxxxxxxxxxxxxxxxx4889xxxxxx57
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,11)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,11)

newmem:
  mov [data],rcx

code:
  readmem(master,11)
  jmp return

master:
  jmp newmem
  nop 6
return:

[DISABLE]

master:
  readmem(masterbkp,11)

