[[cheat]]
id = "undead"
name = "undead"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
define(minhealthdefault,1)

aobscanmodule(healthRead1OnDamageAOB,ff7remake_.exe,FF ** ** 41 ** ** ** 00 8B ** 0F 85)
