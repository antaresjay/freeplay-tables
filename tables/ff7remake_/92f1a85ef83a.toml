label(originalcode_healthRead1OnDamageAOB)
registersymbol(originalcode_healthRead1OnDamageAOB)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
cmp rcx,rsi
je notparty
mov ebx,eax
sub ebx,[r15]
cmp ebx,[dMinHealth]
jge @f
mov eax,[dMinHealth]
add eax,[r15]
@@:
jmp end

notparty:

end:

originalcode_healthRead1OnDamageAOB:
readmem(healthRead1OnDamageAOB+3,5)
//cmp byte ptr [r13+24],00

exit:
jmp returnhere

///
dMinHealth:
dd minhealthdefault
///

healthRead1OnDamageAOB+3: //"ff7remake_.exe"+9751EF:
jmp newmem
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
healthRead1OnDamageAOB+3: //"ff7remake_.exe"+9751EF:
