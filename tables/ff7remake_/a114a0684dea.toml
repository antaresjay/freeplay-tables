[[cheat]]
id = "enable-damage-modifier-options-god-mode-one-hit-kill-etc"
name = "Enable Damage Modifier Options (God Mode, One Hit Kill, etc.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

/// This is for ally hits
aobscanmodule(DamageModAOB,$process,0F B6 CB 48 C1 E1 06 89 7C 01 30) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,1024,DamageModAOB)

/// This is for enemy hits, but ally hits also appear here
aobscanmodule(DamageModAOB2,$process,8B D6 89 87 C4 04 00 00 48 8B 01 FF 50 50) // should be unique
registersymbol(DamageModAOB2)
alloc(newmem2,1024,DamageModAOB2)

///
label(return)
label(GodMode)
registersymbol(GodMode)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(fHeroHealingMult)
registersymbol(fHeroHealingMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

///
label(return2)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fEnemyHealingMult)
registersymbol(fEnemyHealingMult)

newmem:
  mov [R15Save],r15
  movzx ecx,bl
  shl rcx,06
  xor r15,r15
  mov r15d,[rcx+rax+30]
  sub r15d,edi
  cmp r15d,0
  jl HeroHealingHit
  jg HeroDamageHit
  jmp originalcode
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  push r15d
  fild dword ptr [rsp]
  fmul dword ptr [fHeroDamageMult]
  fistp dword ptr [rsp]
  pop r15d
  cmp r15d,0
  jne CheckGodMode
  mov r15d,1
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor r15d,r15d
  jmp MyCleanUp1
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne MyCleanUp1
  cmp edi,0
  jg @F
  xor r15d,r15d
@@:
  jmp MyCleanUp1  
HeroHealingHit:
  cmp [fHeroHealingMult],(float)0.0
  je MyCleanUp1
  neg r15d
  push r15d
  fild dword ptr [rsp]
  fmul dword ptr [fHeroHealingMult]
  fistp dword ptr [rsp]
  pop r15d
  neg r15d
  jmp MyCleanUp1

MyCleanUp1:  
  mov edi,[rcx+rax+30]
  sub edi,r15d
  cmp edi,[rcx+rax+34]
  jle SkipCheckMaxHP1
  mov edi,[rcx+rax+34]
SkipCheckMaxHP1:
  cmp edi,0
  jge SkipCheckMaxHP2
  xor edi,edi
SkipCheckMaxHP2:
originalcode:
  mov r15,[R15Save]
  jmp return

R15Save:
dq 0
GodMode:
dq 0
fHeroDamageMult:
dq (float)0.25
fHeroHealingMult:
dq (float)2.0
HeroCannotDie:
dq 1

newmem2:
  mov [R14Save2],r14
  mov [R15Save2],r15
  mov r14,[rcx]
  test r14,r14
  je originalcode2
  mov r14,[r14+50]
  test r14,r14
  je originalcode2
  mov r15d,C3185189
  cmp r15d,[r14]
  mov r14,[R14Save2]
  jne originalcode2
  xor r15,r15
  mov r15d,[rcx+18]
  sub r15d,esi
  cmp r15d,0
  jl EnemyHealingHit
  jg EnemyDamageHit
  jmp originalcode2
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckOneHitKill
  push r15d
  fild dword ptr [rsp]
  fmul dword ptr [fEnemyDamageMult]
  fistp dword ptr [rsp]
  pop r15d
  cmp r15d,0
  jne CheckOneHitKill
  mov r15d,1
CheckOneHitKill:
  cmp [OneHitKill],1
  jne MyCleanUp2
  mov r15d,[rcx+18]
  jmp MyCleanUp2
EnemyHealingHit:
  cmp [fEnemyHealingMult],(float)0.0
  je MyCleanUp2
  neg r15d
  push r15d
  fild dword ptr [rsp]
  fmul dword ptr [fEnemyHealingMult]
  fistp dword ptr [rsp]
  pop r15d
  neg r15d

MyCleanUp2:
  mov esi,[rcx+18]
  sub esi,r15d
  cmp esi,[rcx+1C]
  jle SkipCheckMaxHP3
  mov esi,[rcx+1C]
SkipCheckMaxHP3:
  cmp esi,0
  jge SkipCheckMaxHP4
  xor esi,esi
SkipCheckMaxHP4:
originalcode2:
  mov r15,[R15Save2]
  mov edx,esi
  mov [rdi+000004C4],eax
  jmp return2

R14Save2:
dq 0
R15Save2:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)2.0
fEnemyHealingMult:
dq (float)0.5

///
DamageModAOB:
  jmp newmem
  nop
  nop
return:

DamageModAOB2:
  jmp newmem2
  nop
  nop
  nop
return2:

[DISABLE]

DamageModAOB:
  db 0F B6 CB 48 C1 E1 06

unregistersymbol(DamageModAOB)
unregistersymbol(GodMode)
unregistersymbol(fHeroDamageMult)
unregistersymbol(fHeroHealingMult)

///
DamageModAOB2:
  db 8B D6 89 87 C4 04 00 00

unregistersymbol(DamageModAOB2)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fEnemyHealingMult)
  
///
dealloc(newmem)
dealloc(newmem2)"""

