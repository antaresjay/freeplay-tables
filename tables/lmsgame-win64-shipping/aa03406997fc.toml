[[cheat]]
id = "player-pawn-ctrl-numpad-1"
name = "Player Pawn (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : LMSGame-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.6.1.0
// Game Version      : v1.01
// Script Date       : 2026-04-04


[ENABLE]

aobscanmodule(master,LMSGame-Win64-Shipping.exe,488BxxFFxxxxxxxxxx488Bxxxxxxxxxx488Dxxxxxx488BxxE8xxxxxxxx4Cxxxx488Dxxxx488B) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,9)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,9)

newmem:
  mov [data],rcx

code:
  readmem(master,9)
  jmp return

master:
  jmp newmem
  nop 4
return:

[DISABLE]

master:
  readmem(masterbkp,9)

unregistersymbol(*)
dealloc(*)"""

