[[cheat]]
id = "set-cap-at-100"
name = "Set Cap at 100"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanregion(DependentCap,"DependentCap:ClampStat","DependentCap:ClampStat"+50,8B 7D 08 D9 47 18)
alloc(newmem,2048)
label(returnhere)
label(value)
registersymbol(DependentCap)

newmem:
mov edi,[ebp+08]
//fld dword ptr [edi+18]
fld dword ptr [value]
jmp returnhere
value:
dd (float)100
DependentCap:
jmp newmem
nop
returnhere:

[DISABLE]
dealloc(newmem)
DependentCap:
//mov edi,[ebp+08]
//fld dword ptr [edi+18]
db 8B 7D 08 D9 47 18
unregistersymbol(DependentCap)"""

