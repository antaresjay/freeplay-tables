define(address,EnemyStats:DAMAGE+984)
define(bytes,D9 46 68 D9 9E 84 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov [esi+68],0

code:
  fld dword ptr [esi+68]
  fstp dword ptr [esi+00000084]
  jmp return

address:
  jmp newmem
  nop 4
return:

[DISABLE]

address:
