[[cheat]]
id = "g-manager"
name = "G Manager"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Noobs Want To Live.exe
  Version: 
  Date   : 2023-03-22
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanregion(pData_GManagerData,Codes.GManager:Update,Codes.GManager:Update+500,F3 0F 10 8E B0 00 00 00 F3 0F 5A) // should be unique
alloc(newmem,$1000,pData_GManagerData)

alloc(pBase_GManagerData,8)
registersymbol(pBase_GManagerData)

label(code)
label(return)

pBase_GManagerData:
dd

newmem:

code:
  mov [pBase_GManagerData],rsi
  movss xmm1,[rsi+000000B0]
  jmp return

pData_GManagerData:
  jmp newmem
  nop 3
return:
registersymbol(pData_GManagerData pBase_GManagerData)

[DISABLE]

pData_GManagerData:
  db F3 0F 10 8E B0 00 00 00

unregistersymbol(*)
dealloc(*)"""

