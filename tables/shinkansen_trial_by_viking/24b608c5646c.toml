[[cheat]]
id = "playerstats-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerStats Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerStats_savedAOB)
label(PlayerStats_returnhere)
label(PlayerStats_originalcode)
label(PlayerStats_exit)

label(PlayerStats_update_exit)
label(PlayerStats_set_exit)
label(PlayerStats_healthset_exit)
label(PlayerStats_invulnerableset_exit)
label(PlayerStats_keyset_exit)

registersymbol(PlayerStats_savedAOB)

//046F9EEC - C7 45 90 00000000     - mov [ebp-70],00000000
//046F9EF3 - C7 45 94 00000000     - mov [ebp-6C],00000000
// PlayerStats:Update+22
//046F9EFA - 8D 47 44              - lea eax,[edi+44]
//046F9EFD - 8B 08                 - mov ecx,[eax]
//046F9EFF - 89 4D B4              - mov [ebp-4C],ecx
//046F9F02 - 8B 40 04              - mov eax,[eax+04]
aobscan(PlayerStats_searchedAOB, 8D 47 44 8B 08 89 4D B4)

alloc(PlayerStats_newmem, 2048, PlayerStats_searchedAOB)


PlayerStats_newmem:
cmp dword ptr [PlayerStats_update_enable], #0
je PlayerStats_update_exit
mov [PlayerStats_basepointer], edi
PlayerStats_update_exit:

cmp dword ptr [PlayerStats_set_enable], #0
je PlayerStats_set_exit
PlayerStats_set_exit:

cmp dword ptr [PlayerStats_healthset_enable], #0
je PlayerStats_healthset_exit
fld [edi+34]
fstp [edi+38]
PlayerStats_healthset_exit:

cmp dword ptr [PlayerStats_invulnerableset_enable], #0
je PlayerStats_invulnerableset_exit
mov byte ptr [edi+4d], #1
PlayerStats_invulnerableset_exit:

cmp dword ptr [PlayerStats_keyset_enable], #0
je PlayerStats_keyset_exit
mov byte ptr [edi+40], #200
PlayerStats_keyset_exit:


PlayerStats_originalcode:
db 8D 47 44 8B 08
//mlea eax,[edi+44]
//mov ecx,[eax]


PlayerStats_exit:
jmp PlayerStats_returnhere


PlayerStats_searchedAOB:
PlayerStats_savedAOB:
jmp PlayerStats_newmem
PlayerStats_returnhere:


[DISABLE]
PlayerStats_savedAOB:
db 8D 47 44 8B 08
//mlea eax,[edi+44]
//mov ecx,[eax]

unregistersymbol(PlayerStats_savedAOB)

dealloc(PlayerStats_newmem)"""

