id = "grab-player-data"
name = "Grab Player Data"
category = "player"
description = ""
hint = ""
type = "script"
source = """
//Send@FearlessRevolution|Sintrix

[ENABLE]

aobscanmodule(p_ptr,Avowed-Win64-Shipping.exe,48 8B 01 FF 90 A8 07 00 00 84 C0 75 14)
alloc(newmem,$1000,p_ptr)
registersymbol(play)
label(code return play)

newmem:
mov [play],rcx

code:
  mov rax,[rcx]
  call qword ptr [rax+000007A8]
  jmp return

play:
dq 0

p_ptr:
  jmp newmem
  nop 4
return:
registersymbol(p_ptr)

[DISABLE]

p_ptr:
  db 48 8B 01 FF 90 A8 07 00 00

unregistersymbol(*)
dealloc(*)"""

