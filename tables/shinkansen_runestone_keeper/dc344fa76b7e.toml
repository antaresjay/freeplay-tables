[[cheat]]
id = "hero-base-address-scan-initialization-activate-this-first"
name = "Hero Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Hero_basepointer)
registersymbol(Hero_update_enable)
registersymbol(Hero_set_enable)
registersymbol(Hero_healthset_enable)
registersymbol(Hero_manaset_enable)
registersymbol(Hero_statsset_enable)
registersymbol(Hero_godkillerset_enable)

alloc(Hero_basepointer, 4)
alloc(Hero_update_enable, 4)
alloc(Hero_set_enable, 4)
alloc(Hero_healthset_enable, 4)
alloc(Hero_manaset_enable, 4)
alloc(Hero_statsset_enable, 4)
alloc(Hero_godkillerset_enable, 4)


[DISABLE]
unregistersymbol(Hero_basepointer)
unregistersymbol(Hero_update_enable)
unregistersymbol(Hero_set_enable)
unregistersymbol(Hero_healthset_enable)
unregistersymbol(Hero_manaset_enable)
unregistersymbol(Hero_statsset_enable)
unregistersymbol(Hero_godkillerset_enable)

dealloc(Hero_basepointer)
dealloc(Hero_update_enable)
dealloc(Hero_set_enable)
dealloc(Hero_healthset_enable)
dealloc(Hero_manaset_enable)
dealloc(Hero_statsset_enable)
dealloc(Hero_godkillerset_enable)"""

[[cheat]]
id = "hero-base-address-scan-to-activate-load-level-to-update-play"
name = "Hero Base Address Scan (To Activate: Load Level, To Update: Play)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Hero_savedAOB)
label(Hero_returnhere)
label(Hero_originalcode)
label(Hero_exit)

label(Hero_update_exit)
label(Hero_set_exit)
label(Hero_healthset_exit)
label(Hero_manaset_exit)
label(Hero_statsset_exit)
label(Hero_godkillerset_exit)

registersymbol(Hero_savedAOB)

//04755759 - 8B 7D 08              - mov edi,[ebp+08]
//0475575C - C7 45 E4 00000000     - mov [ebp-1C],00000000
// Hero:Update+13
//04755763 - 8B 87 FC010000        - mov eax,[edi+000001FC]
//04755769 - 3D 3C000000           - cmp eax,0000003C
//0475576E - 7E 0A                 - jle 0475577A
//04755770 - C7 87 FC010000 00000000 - mov [edi+000001FC],00000000
//0475577A - 8B 87 FC010000        - mov eax,[edi+000001FC]
//04755780 - 40                    - inc eax
aobscan(Hero_searchedAOB, 8B 87 FC 01 00 00 3D 3C 00 00 00 * * C7 87 FC 01 00 00 00 00 00 00)

alloc(Hero_newmem, 2048)
alloc(Hero_temp1, 4)
alloc(Hero_temp2, 4)


Hero_newmem:
mov [Hero_temp1], ebx
mov [Hero_temp2], ecx

cmp dword ptr [Hero_update_enable], #0
je Hero_update_exit
mov [Hero_basepointer], edi
Hero_update_exit:

cmp dword ptr [Hero_set_enable], #0
je Hero_set_exit
Hero_set_exit:

cmp dword ptr [Hero_healthset_enable], #0
je Hero_healthset_exit
cmp dword ptr [edi+30], #0
je Hero_healthset_exit
mov ebx, [edi+30]
cmp dword ptr [edi+2c], #0
je Hero_healthset_exit
mov ecx, [edi+2c]
mov eax, [ebx+10]
mov [ecx+10], eax
mov eax, [edi+f4]
mov [edi+f0], eax
Hero_healthset_exit:

cmp dword ptr [Hero_manaset_enable], #0
je Hero_manaset_exit
cmp dword ptr [edi+30], #0
je Hero_healthset_exit
mov ebx, [edi+30]
cmp dword ptr [edi+2c], #0
je Hero_healthset_exit
mov ecx, [edi+2c]
mov eax, [ebx+20]
mov [ecx+20], eax
Hero_manaset_exit:

cmp dword ptr [Hero_statsset_enable], #0
je Hero_statsset_exit
cmp dword ptr [edi+28], #0
je Hero_healthset_exit
mov ecx, [edi+28]
mov [ecx+14], #999
mov [ecx+18], #999
mov [ecx+1c], #999
mov [ecx+24], #999
cmp dword ptr [edi+2c], #0
je Hero_healthset_exit
mov ecx, [edi+2c]
mov [ecx+14], #999
mov [ecx+18], #999
mov [ecx+1c], #999
mov [ecx+24], #999
cmp dword ptr [edi+30], #0
je Hero_healthset_exit
mov ecx, [edi+30]
mov [ecx+14], #999
mov [ecx+18], #999
mov [ecx+1c], #999
mov [ecx+24], #999
Hero_statsset_exit:

cmp dword ptr [Hero_godkillerset_enable], #0
je Hero_godkillerset_exit
mov byte ptr [edi+1d0], #1
mov byte ptr [edi+1d1], #1
Hero_godkillerset_exit:

mov ebx, [Hero_temp1]
mov ecx, [Hero_temp2]


Hero_originalcode:
db 8B 87 FC 01 00 00
//mov eax,[edi+000001FC]


Hero_exit:
jmp Hero_returnhere


Hero_searchedAOB:
Hero_savedAOB:
jmp Hero_newmem
nop
Hero_returnhere:


[DISABLE]
Hero_savedAOB:
db 8B 87 FC 01 00 00
//mov eax,[edi+000001FC]

unregistersymbol(Hero_savedAOB)

dealloc(Hero_newmem)
dealloc(Hero_temp1)
dealloc(Hero_temp2)"""

