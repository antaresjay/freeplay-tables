[[cheat]]
id = "damage-multiplier"
name = "Damage Multiplier"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanregion(mulAttackReadAOB,GameCharacter:SetAttackHit,GameCharacter:SetAttackHit+2c87,D9 ** ** ** ** ** 8B ** ** ** ** ** D9 80 ** ** ** ** DE C9 D9)
registersymbol(mulAttackReadAOB)

label(dLeaderAttackMultiplier)
registersymbol(dLeaderAttackMultiplier)
label(dMembersAttackMultiplier)
registersymbol(dMembersAttackMultiplier)

alloc(newmem,2048)
label(returnhere)
label(originalcode_attackmultiplier)
registersymbol(originalcode_attackmultiplier)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
cmp dword ptr [eax+4e8],0  //enemyIndex
jne end

cmp byte ptr [eax+5b4],1   //npc
je @f
fmul dword ptr [dLeaderAttackMultiplier]
jmp end

@@:
fmul dword ptr [dMembersAttackMultiplier]

end:

originalcode_attackmultiplier:
readmem(mulAttackReadAOB+12,8)
//fmulp st(1),st(0)
//fstp dword ptr [ebp-0000011C]

exit:
jmp returnhere

///
dLeaderAttackMultiplier:
dd (float)4
dMembersAttackMultiplier:
dd (float)1
///

mulAttackReadAOB+12: //GameCharacter:SetAttackHit+19a3:
jmp newmem
nop
nop
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
mulAttackReadAOB+12: //GameCharacter:SetAttackHit+19a3:
readmem(originalcode_attackmultiplier,8)
//db DE C9 D9 9D E4 FE FF FF
//Alt: fmulp st(1),st(0)
//Alt: fstp dword ptr [ebp-0000011C]
unregistersymbol(originalcode_attackmultiplier)

unregistersymbol(dLeaderAttackMultiplier)
unregistersymbol(dMembersAttackMultiplier)"""

