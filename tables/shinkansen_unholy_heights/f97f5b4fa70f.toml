db 3A 40 3C 8D 50 3C
//cmp al,[eax+3C]
//lea edx,[eax+3C]


cash_exit:
jmp cash_returnhere


searchedAOB:
cash_savedAOB:
jmp cash_newmem
nop
cash_returnhere:


[DISABLE]
cash_savedAOB:
db 3A 40 3C 8D 50 3C
//cmp al,[eax+3C]
//lea edx,[eax+3C]


unregistersymbol(cash_savedAOB)

dealloc(cash_newmem)"""

