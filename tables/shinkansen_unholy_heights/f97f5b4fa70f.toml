[[cheat]]
id = "cash-base-address-scan-to-activate-view-room-to-update-view-room"
name = "Cash Base Address Scan (To Activate: View Room, To Update: View Room)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(cash_savedAOB)
label(cash_returnhere)
label(cash_originalcode)
label(cash_exit)

label(cashupdate_exit)
label(cashset_exit)

registersymbol(cash_savedAOB)

aobscan(searchedAOB,3A 40 3C 8D 50 3C 39 09)

alloc(cash_newmem,2048) //2kb should be enough


cash_newmem:
cmp dword ptr [cashupdate_enable], #0
