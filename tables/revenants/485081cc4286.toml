[[cheat]]
id = "setap"
name = "SetAP"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(SetAP,Unit:set_AP,Unit:set_AP+44,89 B7 6C 05 00 00)
alloc(newmem,$256,SetAP)
alloc(SetPlayerAP,4)
alloc(SetEnemyAP,4)

label(code)
label(return)

registersymbol(SetAP SetPlayerAP SetEnemyAP)

SetPlayerAP:
dd 0

SetEnemyAP:
dd 0

newmem:

   cmp [rdi+0000034C],0
   jne @f
   cmp [SetPlayerAP],1
   jne code
   mov esi,[rdi+00000328]
   mov [rdi+0000056C],esi
   jmp return

@@:

   cmp [SetEnemyAP],1
   jne code
   mov esi,0

code:
  mov [rdi+0000056C],esi
  jmp return

SetAP:
  jmp newmem
  nop
return:


[DISABLE]

SetAP:
  db 89 B7 6C 05 00 00

unregistersymbol(*)
dealloc(*)"""

