[[cheat]]
id = "invincibility-untouchable"
name = "Invincibility/Untouchable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Invincible)
registersymbol(Invincible)
aobscan(Hook, E8 1D 88 01 00 5F 5E 83 C4 20 C3) //Find Call

Hook:
Invincible:
db 90 90 90 90 90 //Nop Call

[DISABLE]
Invincible:
db E8 1D 88 01 00 //Restore Call
unregistersymbol(Invincible)"""

