je save

//Item Slots
inc eax
cmp ebx, 1879F //Slot 1 Type
je save
inc eax
cmp ebx, 187A5 //Slot 1 Amount
je save
inc eax
cmp ebx, 187A0 //Slot 2 Type
je save
inc eax
cmp ebx, 187A6 //Slot 2 Amount
je save
inc eax
cmp ebx, 187A1 //Slot 3 Type
je save
inc eax
cmp ebx, 187A7 //Slot 3 Amount
je save
inc eax
cmp ebx, 187A2 //Slot 4 Type
je save
inc eax
cmp ebx, 187A8 //Slot 4 Amount
je save

//Equipment Slots
inc eax
cmp ebx, 186D7 //Weapon 1
je save
inc eax
cmp ebx, 186D8 //Weapon 2
je save
inc eax
cmp ebx, 18721 //Shield
je save
inc eax
cmp ebx, 1879C //Feather
je save
inc eax
cmp ebx, 18767 //Aura
je save
inc eax
