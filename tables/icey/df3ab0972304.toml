source = """
//Send@ModEngine
[ENABLE]

aobscanregion(energy,PlayerHurtAbility:UpdateShield+13,PlayerHurtAbility:UpdateShield+27,48 63 40 28 85 C0 0F 85 AB)
alloc(newmem,$1000,energy)

label(code)
