[[cheat]]
id = "inf-health"
name = "Inf Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : YakuzaKiwami.exe
  Version: 
  Date   : 2019-02-20
  Author : Jessie Kazama
}

[ENABLE]

aobscanmodule(health,YakuzaKiwami.exe,66 45 89 48 16)
alloc(newmem,$1000,health)

label(code)
label(return)

registersymbol(health)

newmem:
  cmp [r8+440],1
  jne code
  {cmp [r8+504],0
  jne code
  cmp [r8+564],0
  jne code
  cmp [r8+594],0
  jne code}
  jmp return

code:
  mov [r8+16],r9w
  jmp return

health:
  jmp newmem
return:

[DISABLE]

health:
  db 66 45 89 48 16

unregistersymbol(health)
dealloc(newmem)"""

