type = "script"
source = """
// Script Date       : 2020-03-31
[ENABLE]

aobscanregion(FreezeEnemy,7F000000000,7FFFFFFFFFFF,80 BE 5C 01 00 00 00 0F 84 F5)
alloc(newmem,$1000,FreezeEnemy)
alloc(isEnabled_FR,8)

label(code)
label(return)
