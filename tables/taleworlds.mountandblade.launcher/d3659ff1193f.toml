category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(OneHitKill,7F000000000,7FFFFFFFFFFF,48 8B 92 B0 00 00 00 48 8B CA)
alloc(newmem,$1000,OneHitKill)
alloc(val,8)
alloc(SaveValue,8)

