registersymbol(SaveValue)

val:
dq (float)0
SaveValue:
dq 0

newmem:
push r11
mov r11,[rdx+A8]
cmp r11,#0
je code
mov r11,[r11+A8]
cmp r11,#0
je code
mov r11,[r11+C0]\t\t \t  //C8
cmp r11,#0
je code
mov r11,[r11+A8]
cmp r11,#0
je code
mov r11,[r11+90]
mov [SaveValue],r11
mov r11,[rdx+A8]
cmp r11,#0
je code
mov r11,[r11+90]
cmp [SaveValue],r11
jne code
mov rdx,[rdx+000000B0]
pop r11
jmp return


{push r11   \t\t\t\t // R11 HOLDING TEAM
mov r11,[rdx+A8]\t\t // RDX BASEADDRESS
cmp r11,#0
je code\t  \t\t\t\t // R11 == NULL ? Jump to Code : Dont jump to Code
mov r11,[r11+90]
mov [SaveValue],r11

mov r11,[rdx+A8]
cmp r11,#0
je code\t  \t\t   \t\t // R11 == NULL ? Jump to Code : Dont jump to Code
mov r11,[r11+A8]
cmp r11,#0
je code\t  \t\t   \t\t // R11 == NULL ? Jump to Code : Dont jump to Code
mov r11,[r11+A8]
cmp r11,#0
je code\t  \t\t   \t\t // R11 == NULL ? Jump to Code : Dont jump to Code
mov r11,[r11+90]
cmp [SaveValue],r11 \t // 1 : 1 ? Jump to code when not : else OHK
jne code
mov rdx,[rdx+000000B0]
pop r11
jmp return
push r11}



code:
pop r11
movss xmm9,[val]
movss [rdx+16C],xmm9
mov rdx,[rdx+000000B0]
jmp return

OneHitKill:
jmp newmem
nop 2
return:
registersymbol(OneHitKill)

[DISABLE]

OneHitKill:
db 48 8B 92 B0 00 00 00

