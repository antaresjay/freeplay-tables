[[cheat]]
id = "max-buy-item"
name = "MAX Buy Item"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc(newmem,2048,GameAssembly.dll+6C60D2)
alloc(tomomon_item_buy_multiplier,4,GameAssembly.dll+6C60D2)

label(returnhere)
label(originalcode)
label(exit)

registersymbol(tomomon_item_buy_multiplier)

tomomon_item_buy_multiplier:
dd #666

newmem:

originalcode:
// 原逻辑：add edx,r14d
// 新逻辑：edx = 当前数量 + 购买数量 * 倍率
push rax
mov eax,r14d
imul eax,[tomomon_item_buy_multiplier]
add edx,eax
pop rax

// 原逻辑：mov [rsi+00000110],edx
mov [rsi+00000110],edx

exit:
jmp returnhere

GameAssembly.dll+6C60D2:
jmp newmem
nop 4
returnhere:

[DISABLE]

GameAssembly.dll+6C60D2:
db 41 03 D6 89 96 10 01 00 00

unregistersymbol(tomomon_item_buy_multiplier)
dealloc(tomomon_item_buy_multiplier)
dealloc(newmem)"""

