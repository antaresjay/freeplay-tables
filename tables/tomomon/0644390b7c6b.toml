[[cheat]]
id = "max-money"
name = "MAX Money"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc(newmem,2048,GameAssembly.dll+7A4990)
alloc(tomomon_bit_set_value,4,GameAssembly.dll+7A4990)

label(returnhere)
label(originalcode)
label(exit)

registersymbol(tomomon_bit_set_value)

tomomon_bit_set_value:
dd #99999

newmem:

originalcode:
// 先执行原本的购买扣钱逻辑
sub [rbx+00000138],edi

// 再把 bit 改成指定数值
push rax
mov eax,[tomomon_bit_set_value]
mov [rbx+00000138],eax
pop rax

exit:
jmp returnhere

GameAssembly.dll+7A4990:
jmp newmem
nop
returnhere:

[DISABLE]

GameAssembly.dll+7A4990:
db 29 BB 38 01 00 00

unregistersymbol(tomomon_bit_set_value)
dealloc(tomomon_bit_set_value)
dealloc(newmem)"""

