[[cheat]]
id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
//Send@ModEngine
[ENABLE]

aobscanmodule(ammo,game_x64.dll,43 89 84 81 80 0A 00 00)
alloc(newmem,$1000,ammo)
label(code return)

newmem:

code:
  mov [r9+r8*4+00000A80],#999
  jmp return

ammo:
  jmp newmem
  nop 3
return:
registersymbol(ammo)

[DISABLE]

ammo:
  db 43 89 84 81 80 0A 00 00

unregistersymbol(*)
dealloc(*)"""
