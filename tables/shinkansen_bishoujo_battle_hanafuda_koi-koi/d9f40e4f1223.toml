[[cheat]]
id = "gamemanager-base-address-scan-initialization-activate-this-first-to-activate-play-level"
name = "GameManager Base Address Scan Initialization (Activate This First, To Activate: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameManager_basepointer)
registersymbol(GameManager_update_enable)
registersymbol(GameManager_turnset_enable)
registersymbol(GameManager_quantityset_enable)
registersymbol(GameManager_drawset_enable)

//051A82D2 - C7 85 74FFFFFF 00000000 - mov [ebp-0000008C],00000000
//051A82DC - C7 85 78FFFFFF 00000000 - mov [ebp-00000088],00000000
// GameManager:UpdatePlayStep+4e
//051A82E6 - 8B 46 58              - mov eax,[esi+58]
//051A82E9 - 8B C8                 - mov ecx,eax
//051A82EB - 39 09                 - cmp [ecx],ecx
//051A82ED - 8B 40 10              - mov eax,[eax+10]
//051A82F0 - 8B 8E 8C000000        - mov ecx,[esi+0000008C]
//051A82F6 - 39 48 0C              - cmp [eax+0C],ecx
//051A82F9 - 0F86 D1140000         - jbe 051A97D0
//051A82FF - 8D 44 88 10           - lea eax,[eax+ecx*4+10]
//051A8303 - 8B 00                 - mov eax,[eax]
//051A8305 - 89 85 40FFFFFF        - mov [ebp-000000C0],eax
//051A830B - 8B 86 A4000000        - mov eax,[esi+000000A4]
//051A8311 - 40                    - inc eax
aobscan(GameManager_initialization_searchedAOB, 8B 46 58 8B C8 39 09 8B 40 10 8B 8E 8C 00 00 00 39 48 0C * * * * * * 8D 44 88 10 8B 00 89 85 40 FF FF FF)

alloc(GameManager_basepointer, 4, GameManager_initialization_searchedAOB)
alloc(GameManager_update_enable, 4, GameManager_initialization_searchedAOB)
alloc(GameManager_turnset_enable, 4, GameManager_initialization_searchedAOB)
alloc(GameManager_quantityset_enable, 4, GameManager_initialization_searchedAOB)
alloc(GameManager_drawset_enable, 4, GameManager_initialization_searchedAOB)


[DISABLE]
unregistersymbol(GameManager_basepointer)
unregistersymbol(GameManager_update_enable)
unregistersymbol(GameManager_turnset_enable)
unregistersymbol(GameManager_quantityset_enable)
unregistersymbol(GameManager_drawset_enable)

dealloc(GameManager_basepointer)
dealloc(GameManager_update_enable)
dealloc(GameManager_turnset_enable)
dealloc(GameManager_quantityset_enable)
dealloc(GameManager_drawset_enable)"""

[[cheat]]
id = "gamemanager-base-address-scan-to-activate-play-level-to-update-play-level"
name = "GameManager Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameManager_savedAOB)
label(GameManager_returnhere)
label(GameManager_originalcode)
label(GameManager_exit)

label(GameManager_update_exit)
label(GameManager_turnset_exit)
label(GameManager_quantityset_exit)
label(GameManager_drawset_exit)

registersymbol(GameManager_originalcode)
registersymbol(GameManager_savedAOB)

//051A82D2 - C7 85 74FFFFFF 00000000 - mov [ebp-0000008C],00000000
//051A82DC - C7 85 78FFFFFF 00000000 - mov [ebp-00000088],00000000
// GameManager:UpdatePlayStep+4e
//051A82E6 - 8B 46 58              - mov eax,[esi+58]
//051A82E9 - 8B C8                 - mov ecx,eax
//051A82EB - 39 09                 - cmp [ecx],ecx
//051A82ED - 8B 40 10              - mov eax,[eax+10]
//051A82F0 - 8B 8E 8C000000        - mov ecx,[esi+0000008C]
//051A82F6 - 39 48 0C              - cmp [eax+0C],ecx
//051A82F9 - 0F86 D1140000         - jbe 051A97D0
//051A82FF - 8D 44 88 10           - lea eax,[eax+ecx*4+10]
//051A8303 - 8B 00                 - mov eax,[eax]
//051A8305 - 89 85 40FFFFFF        - mov [ebp-000000C0],eax
//051A830B - 8B 86 A4000000        - mov eax,[esi+000000A4]
//051A8311 - 40                    - inc eax
aobscan(GameManager_searchedAOB, 8B 46 58 8B C8 39 09 8B 40 10 8B 8E 8C 00 00 00 39 48 0C * * * * * * 8D 44 88 10 8B 00 89 85 40 FF FF FF)

alloc(GameManager_newmem, 2048, GameManager_searchedAOB)
alloc(GameManager_temp1, 4, GameManager_searchedAOB)
alloc(GameManager_temp2, 4, GameManager_searchedAOB)
alloc(GameManager_temp3, 4, GameManager_searchedAOB)
alloc(GameManager_temp4, 4, GameManager_searchedAOB)
alloc(GameManager_temp5, 4, GameManager_searchedAOB)


GameManager_newmem:
mov [GameManager_temp1], eax
mov [GameManager_temp2], ebx
mov [GameManager_temp3], ecx
mov [GameManager_temp4], edx

cmp dword ptr [GameManager_update_enable], #0
je GameManager_update_exit
mov [GameManager_basepointer], esi
GameManager_update_exit:

cmp dword ptr [GameManager_turnset_enable], #0
je GameManager_turnset_exit
mov [esi+8c], #0
GameManager_turnset_exit:

cmp dword ptr [GameManager_quantityset_enable], #0
je GameManager_quantityset_exit
cmp dword ptr [esi+6c], #1
jg GameManager_quantityset_exit
mov [esi+6c], #24
GameManager_quantityset_exit:

cmp dword ptr [GameManager_drawset_enable], #0
je GameManager_drawset_exit
mov [GameManager_drawset_enable], #0
cmp dword ptr [esi+a4], #1
jne GameManager_drawset_exit
mov [esi+a4], #4
mov [esi+a8], #3
GameManager_drawset_exit:

mov eax, [GameManager_temp1]
mov ebx, [GameManager_temp2]
mov ecx, [GameManager_temp3]
mov edx, [GameManager_temp4]


GameManager_originalcode:
readmem(GameManager_searchedAOB, 5)


GameManager_exit:
jmp GameManager_returnhere


GameManager_searchedAOB:
GameManager_savedAOB:
jmp GameManager_newmem
GameManager_returnhere:


[DISABLE]
GameManager_savedAOB:
readmem(GameManager_originalcode, 5)

unregistersymbol(GameManager_originalcode)
unregistersymbol(GameManager_savedAOB)

dealloc(GameManager_newmem)
dealloc(GameManager_temp1)
dealloc(GameManager_temp2)
dealloc(GameManager_temp3)
dealloc(GameManager_temp4)
dealloc(GameManager_temp5)"""

