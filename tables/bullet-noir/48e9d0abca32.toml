[[cheat]]
id = "level-feats-ctrl-numpad-1-use-ammo-to-populate-values"
name = "Level Feats (Ctrl + Numpad 1) {Use ammo to populate values}"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Bullet Noir.exe
// Author            : ndck76
// Executable Version: 2020.3.15.63372
// Game Version      : v1.0
// Script Date       : 2025-09-11


[ENABLE]

aobscanregion(shots,MoreMountains.TopDownEngine.NemesisScoreTrackerV2:OnWeaponStateChange,MoreMountains.TopDownEngine.NemesisScoreTrackerV2:OnWeaponStateChange+100,8948xx83xxxx48xxxxxxxxxxxx89xxxxxxxxxx48xxxxxx48xxxxxx4Cxxxxxx4Cxxxxxx48xxxxxx5DC3) //MoreMountains.TopDownEngine.NemesisScoreTrackerV2:OnWeaponStateChange+b0
alloc(newmem,$1000,shots)
alloc(data2,8)
alloc(shotsbkp,6)
registersymbol(data2)
registersymbol(shots)
registersymbol(shotsbkp)
label(code)
label(return)

shotsbkp:
  readmem(shots,6)

newmem:
  mov [data2],rax

code:
  readmem(shots,6)
  jmp return

shots:
  jmp newmem
  nop
return:

[DISABLE]

shots:
  readmem(shotsbkp,6)

unregistersymbol(*)
dealloc(*)"""

