[[cheat]]
id = "no-cooldown"
name = "No Cooldown"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,BattleUnitSkillParameter.ExecuteSkillCoolTime)
define(bytes,40 53 48 83 EC 20)

[ENABLE]
// Send @ Sintrix | FearlessRevolution
assert(address,bytes)
alloc(newmem,$1000,BattleUnitSkillParameter.ExecuteSkillCoolTime)
label(code return)

newmem:
mov [rcx+28],#0
mov [rcx+2C],#0
// Send @ Sintrix | FearlessRevolution
code:
  push rbx
  sub rsp,20
  jmp return
// Send @ Sintrix | FearlessRevolution
address:
  jmp newmem
  nop
return:
// Send @ Sintrix | FearlessRevolution
[DISABLE]

address:
  db bytes
// Send @ Sintrix | FearlessRevolution
dealloc(newmem)"""

