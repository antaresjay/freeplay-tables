[[cheat]]
id = "invincible"
name = "invincible"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(inv,IWBTGR.exe,E8 20 FD FF FF 8B D8) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  nop
  jmp return

inv:
  jmp newmem
return:
registersymbol(inv)

[DISABLE]

inv:
  db E8 20 FD FF FF

unregistersymbol(inv)
dealloc(newmem)"""

[[cheat]]
id = "noclip"
name = "noclip"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(noclip,IWBTGR.exe,8D 8B B8 00 00 00 8B C7) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  nop
  jmp return

noclip:
  jmp newmem
  nop
return:
registersymbol(noclip)

[DISABLE]

noclip:
  db 8D 8B B8 00 00 00

unregistersymbol(noclip)
dealloc(newmem)"""

