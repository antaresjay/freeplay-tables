[[cheat]]
id = "activate-for-the-cheats"
name = "Activate for the cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : PixelPiracy.exe
  Version: 
  Date   : 2014-12-15
  Author : Dump

  This script does blah blah blah
}

[ENABLE]

aobscan(HP,F2 0F 10 85 60 FB FF FF F2 0F 2C C0 8B) // should be unique, real position is in -9
alloc(newmem,$1000)

label(bHealth)
label(bHunger)
label(bMorale)
label(hunger)
label(morale)
label(originalcode)
label(return)
label(TP_min)
label(TP_min_exit)
label(iTP_min)
label(bTP)

registersymbol(bHealth)
registersymbol(bHunger)
registersymbol(bMorale)
registersymbol(iTP_min)
registersymbol(bTP)

newmem:

       cmp dword ptr [eax+3c],0   //Player?
       jne originalcode           // no, return to normal code
       cmp [bHealth],0                 // health flag clear?
       je hunger                       // yes - do not max health
       fld dword ptr [eax+44]     //get max hp
       fstp dword ptr [eax+40]    //push eax+4c in actual health

hunger:

       cmp [bHunger],0
       je morale
       fld dword ptr [eax+4c]
       fstp dword ptr [eax+48]

morale:
       cmp [bMorale],0
       je TP_min
       fld dword ptr [eax+54]
       fstp dword ptr [eax+50]

TP_min:

       cmp [bTP],0                //is the option activate?
       je originalcode            // no? go to thr priginal code
       push ebx                    //take a registrator (registrador)
       mov ebx,[iTP_min]           // mov the minimum value (25) to ebx
       cmp dword ptr [eax+80],ebx  //compare with the actual tp value
       jg TP_min_exit              //yes? jump tp itp exit
       mov dword ptr [eax+80],ebx  //no? set the actua tp to 25

TP_min_exit:

            pop ebx               //clear ebx

originalcode:
  fld dword ptr [eax+40]
  fstp qword ptr [ebp-000004A0]

//  fstp qword ptr [ebp-10]
  jmp return

bHealth:
    dd 0          // health flag set by default

bHunger:
    dd 0          // hunger flag set by default

bMorale:
    dd 0          // morale flag set by default

bTP:
    dd 0          //Activate min TP

iTP_min:
    dd #25        // minimum TP is set to 25 by default

HP-9:
  jmp newmem
  nop
  nop
  nop
  nop
return:
registersymbol(HP)

[DISABLE]

HP-9:
  db D9 40 40 DD 9D 60 FB FF FF

unregistersymbol(HP)
dealloc(newmem)

