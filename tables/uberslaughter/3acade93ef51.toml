[[cheat]]
id = "weapon-ctrl-numpad-1-will-populate-when-obtaining-a-firearm"
name = "Weapon (Ctrl + Numpad 1) {Will populate when obtaining a firearm}"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : UBERSLAUGHTER.exe
// Author            : ndck76
// Executable Version: 2022.3.3.56361
// Game Version      : Build.15847162
// Script Date       : 2024-10-02


[ENABLE]

aobscanregion(ammo,Weapon:Update,Weapon:Update+1500,486386xxxx000085xx7Fxx48xxxxxxxxxxxx85xx7Exx0Fxxxxxxxxxxxx85xx75xx48xxxx) //Weapon:Update+5fe
alloc(newmem,$1000,ammo)
alloc(data,8)
alloc(ammobkp,7)
registersymbol(data)
registersymbol(ammo)
registersymbol(ammobkp)
label(code)
label(return)

ammobkp:
  readmem(ammo,7)

newmem:
  mov [data],rsi

code:
  readmem(ammo,7)
  jmp return

ammo:
  jmp newmem
  nop 2
return:

[DISABLE]

ammo:
  readmem(ammobkp,7)

unregistersymbol(*)
dealloc(*)"""

