[[cheat]]
id = "player"
name = "Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Damsel.exe
  Version: 1.0.0.306
  Date   : 2019-02-23
  Author : Abystus
}

[ENABLE]
aobscan(HealthRead,48 8B F1 48 63 46 70 85) // should be unique
alloc(newmem,$1000)

label(skip)
label(playerBase)
label(return)

newmem:
  mov rsi,rcx
  cmp [rsi+A4],1
  jne skip
  mov [playerBase],rsi
skip:
  movsxd  rax,dword ptr [rsi+70]
  jmp return
playerBase:
  dq 0

HealthRead:
  jmp newmem
  nop
  nop
return:


registersymbol(HealthRead)
registersymbol(playerBase)
[DISABLE]

HealthRead:
  db 48 8B F1 48 63 46 70

unregistersymbol(HealthRead)
unregistersymbol(playerBase)
dealloc(newmem)"""

