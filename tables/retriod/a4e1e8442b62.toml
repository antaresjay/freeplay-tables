type = "script"
source = """
{ Game   : Retriod.exe
  Date   : 2025-09-20
  Author : Sianz
}

[ENABLE]

aobscanregion(player,Unit.IsLive,Unit.IsLive+14,0F 2F 41 ?? 73) // should be unique
alloc(newmem,$1000,player)
alloc(stats,8)
label(code)
label(return)

newmem:
  cmp [rcx+20],0
  jne code
  test rcx,rcx
  je skip
  mov [stats],rcx
  skip:
code:
  comiss xmm0,[rcx+68]
  jae GameAssembly.dll+44B5C2
  jmp return

player:
  jmp newmem
  nop
return:
registersymbol(player stats)

[DISABLE]

player:
  db 0F 2F 41 68 73 03

unregistersymbol(*)
dealloc(*)"""
