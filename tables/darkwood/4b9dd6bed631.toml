[[cheat]]
id = "weapon-ammo-current"
name = "Weapon Ammo (Current)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[enable]
alloc(newmem, 128)
label(returnhere)
label(originalcode)

aobscan(weap_ammo_aob,8B 87 7C 01 00 00 8B 48 2C 49 89 48 2C)
registersymbol(weap_ammo_aob)
label(weap_ammo_en)
registersymbol(weap_ammo_en)
label(weap_ammo_add)
registersymbol(weap_ammo_add)
label(weap_ammo_amt)
registersymbol(weap_ammo_amt)

weap_ammo_aob+06:
jmp newmem
db 90 90
returnhere:

newmem:
mov [weap_ammo_add],eax
cmp [weap_ammo_en],1
jne originalcode
mov ecx,[weap_ammo_amt]
mov [eax+2C],ecx
jmp returnhere

originalcode:
db 8B 48 2C 49 89 48 2C
jmp returnhere
/*
10EB601C - 8B 48 2C              - mov ecx,[eax+2C]
10EB601F - 49                    - dec ecx
10EB6020 - 89 48 2C              - mov [eax+2C],ecx
*/

weap_ammo_en:
dd 0

weap_ammo_add:
dd 0

weap_ammo_amt:
dd #9

[disable]
weap_ammo_aob+06:
db 8B 48 2C 49 89 48 2C
/*
10EB6016 - 8B 87 7C010000        - mov eax,[edi+0000017C]
10EB601C - 8B 48 2C              - mov ecx,[eax+2C]
10EB601F - 49                    - dec ecx
10EB6020 - 89 48 2C              - mov [eax+2C],ecx
*/

unregistersymbol(weap_ammo_en)
unregistersymbol(weap_ammo_add)
unregistersymbol(weap_ammo_amt)
unregistersymbol(weap_ammo_aob)

dealloc(newmem)"""

