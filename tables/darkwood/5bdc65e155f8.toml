[[cheat]]
id = "last-item-picked-up"
name = "Last Item Picked Up"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(pickup,89 46 14 8B 47 08 89 46 08)
alloc(newmem,$1000)
alloc(pickup_ptr,4)

label(code)
label(return)

newmem:

code:
  mov [pickup_ptr],esi
  mov [esi+14],eax
  mov eax,[edi+08]
  jmp return

pickup:
  jmp code
  nop
return:
registersymbol(pickup)
registersymbol(pickup_ptr)

[DISABLE]
pickup:
  db 89 46 14 8B 47 08
unregistersymbol(pickup)
unregistersymbol(pickup_ptr)
dealloc(newmem)
dealloc(pickup_ptr)"""

