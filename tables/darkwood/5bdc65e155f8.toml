[[cheat]]
id = "unlimited-health"
name = "Unlimited Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(health,DE E9 83 EC 08 83 EC 04 D9 1C 24 57)
health:
  db DD D8
registersymbol(health)

[DISABLE]
health:
  db DE E9
unregistersymbol(health)"""

[[cheat]]
id = "unlimited-stamina-must-first-use-some-stamina"
name = "Unlimited Stamina (must first use some stamina)"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(stamina,DE F9 DE E9 D9 * * E8)
alloc(stamina_backup,3)
stamina_backup:
  readmem(stamina+4,3)
stamina+4:
  db DD D8 90
registersymbol(stamina)
registersymbol(stamina_backup)

[DISABLE]
stamina+4:
  readmem(stamina_backup,3)
unregistersymbol(stamina)
unregistersymbol(stamina_backup)
dealloc(stamina_backup)"""

