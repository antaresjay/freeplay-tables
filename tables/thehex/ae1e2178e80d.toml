[[cheat]]
id = "walk-speed-multiplier"
name = "Walk Speed Multiplier"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
{ Game   : TheHex.exe
  Version:
  Date   : 2024-07-13
  Author : Igromanru

  Walk Speed Multiplier
}

[ENABLE]
AOBScanRegion(walkSpeedMulti, CharacterMovement:LateUpdate+33, CharacterMovement:LateUpdate+ff, D9 47 ? D9 ? ? FF FF FF)
alloc(newmem,$100)

label(walkSpeedMultiBackUp)
label(walkSpeedMultiplier)
label(return)

newmem:
  readMem(walkSpeedMulti, 3)
  fld dword ptr [walkSpeedMultiplier]
  fmulp st(1), st(0)
  readMem(walkSpeedMulti+3, 6)
  jmp return
walkSpeedMultiBackUp:
  readMem(walkSpeedMulti, 9)
walkSpeedMultiplier:
  dd (float)2.0

walkSpeedMulti:
  jmp newmem
  nop 4
return:

registersymbol(walkSpeedMulti)
registersymbol(walkSpeedMultiBackUp)
registersymbol(walkSpeedMultiplier)

[DISABLE]
walkSpeedMulti:
  readMem(walkSpeedMultiBackUp, 9)

dealloc(newmem)
unregistersymbol(walkSpeedMulti)
unregistersymbol(walkSpeedMultiBackUp)
unregistersymbol(walkSpeedMultiplier)

