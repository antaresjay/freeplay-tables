[[cheat]]
id = "summonercontroller-base-address-scan-initialization-activate-this-first"
name = "SummonerController Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(SummonerController_basepointer)
registersymbol(SummonerController_update_enable)
registersymbol(SummonerController_set_enable)

alloc(SummonerController_basepointer, 4)
alloc(SummonerController_update_enable, 4)
alloc(SummonerController_set_enable, 4)


[DISABLE]
unregistersymbol(SummonerController_basepointer)
unregistersymbol(SummonerController_update_enable)
unregistersymbol(SummonerController_set_enable)

dealloc(SummonerController_basepointer)
dealloc(SummonerController_update_enable)
dealloc(SummonerController_set_enable)"""

[[cheat]]
id = "summonercontroller-base-address-scan-to-activate-play-level-to-update-play-level"
name = "SummonerController Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(SummonerController_savedAOB)
label(SummonerController_returnhere)
label(SummonerController_originalcode)
label(SummonerController_exit)

label(SummonerController_update_exit)
label(SummonerController_set_exit)

registersymbol(SummonerController_savedAOB)

//12A2C119 - 3D 01000000           - cmp eax,00000001
//12A2C11E - 0F84 37000000         - je 12A2C15B
// SummonerController:Update+4c
//12A2C124 - D9 87 0C030000        - fld dword ptr [edi+0000030C]
//12A2C12A - DD 9D 40FFFFFF        - fstp qword ptr [ebp-000000C0]
//12A2C130 - E8 635662F2           - call 05051798
//12A2C135 - DD 85 40FFFFFF        - fld qword ptr [ebp-000000C0]
//12A2C13B - D9C9                  - fxch st(1)
aobscan(SummonerController_searchedAOB, D9 87 0C 03 00 00 DD 9D 40 FF FF FF)

alloc(SummonerController_newmem, 2048, SummonerController_searchedAOB)


SummonerController_newmem:
cmp dword ptr [SummonerController_update_enable], #0
je SummonerController_update_exit
mov [SummonerController_basepointer], edi
SummonerController_update_exit:

cmp dword ptr [SummonerController_set_enable], #0
je SummonerController_set_exit
mov [edi+324], #9999
SummonerController_set_exit:


SummonerController_originalcode:
db D9 87 0C 03 00 00
//fld dword ptr [edi+0000030C]


SummonerController_exit:
jmp SummonerController_returnhere


SummonerController_searchedAOB:
SummonerController_savedAOB:
jmp SummonerController_newmem
nop
SummonerController_returnhere:


[DISABLE]
SummonerController_savedAOB:
db D9 87 0C 03 00 00
//fld dword ptr [edi+0000030C]

unregistersymbol(SummonerController_savedAOB)

dealloc(SummonerController_newmem)"""

