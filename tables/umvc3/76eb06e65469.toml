[[cheat]]
id = "control-trick-interruptible"
name = "Control Trick_Interruptible"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
assert(umvc3.exe+3BC90,40 56 57)
fullaccess(umvc3.exe,0x1000)

define(actionp1,umvc3.exe+0f00)
define(actionp2,umvc3.exe+0f04)
define(myhook_setaction,umvc3.exe+400)
define(swich_p2,umvc3.exe+480)

myhook_setaction:
call qword ptr [rax+000003E8]
test r9,r9
jne swich_p2
mov esi,[actionp1]
test esi,esi
je exit
mov eax,esi
xor esi,esi
mov [actionp1],esi
jmp exit

swich_p2:
mov esi,[actionp2]
test esi,esi
je exit
mov eax,esi
xor esi,esi
mov [actionp2],esi
jmp exit

label(exit)
umvc3.exe+3BCB3:
jmp myhook_setaction
nop
exit:

[DISABLE]
umvc3.exe+3BCB3:
call qword ptr [rax+000003E8]"""

