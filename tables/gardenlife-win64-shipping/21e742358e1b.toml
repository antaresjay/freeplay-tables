source = """
[ENABLE]

aobscanmodule(fluidzz,GardenLife-Win64-Shipping.exe,F3 0F 10 40 08 0F 57 C9 F3 0F 5C 03 0F 2F C1) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov [rax+08], (float)1.0

code:
  movss xmm0,[rax+08]
  xorps xmm1,xmm1
  subss xmm0,[rbx]
  comiss xmm0,xmm1
  jmp return

fluidzz:
  jmp far newmem
  nop
return:
registersymbol(fluidzz)

[DISABLE]

fluidzz:
  db F3 0F 10 40 08 0F 57 C9 F3 0F 5C 03 0F 2F C1

unregistersymbol(fluidzz)
dealloc(newmem)"""
