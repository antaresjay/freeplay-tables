[[cheat]]
id = "health"
name = "----> Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[Enable]

alloc(health_1,32)
aobscan(health_aob1,D9 45 0C D9 9E 08 02 00 00)
registersymbol(health_aob1)
label(returnhere_health_1)

label(ih_1)
label(ih_status)
registersymbol(ih_status)

label(ik_1)
label(ik_status)
registersymbol(ik_status)

label(health_orig)

//--------------------------------------------------//
health_1:
cmp [esi+150],0
je ih_1
jmp ik_1
//--------------------------------------------------//
ih_1:
cmp [ih_status],0
je health_orig
fld dword ptr [ebp+0C]
fstp dword ptr [esi+00000208]
mov [esi+208],(float)100
jmp returnhere_health_1

ih_status:
dd 0
//--------------------------------------------------//
ik_1:
cmp [ik_status],0
je health_orig
fld dword ptr [ebp+0C]
fstp dword ptr [esi+00000208]
mov [esi+208],(float)0
jmp returnhere_health_1

ik_status:
dd 0
//--------------------------------------------------//
health_orig:
fld dword ptr [ebp+0C]
fstp dword ptr [esi+00000208]
jmp returnhere_health_1
//--------------------------------------------------//

health_aob1:
jmp health_1
nop
nop
nop
nop
returnhere_health_1:

[Disable]

health_aob1:
db D9 45 0C D9 9E 08 02 00 00
unregistersymbol(health_aob1)
dealloc(health_1)

unregistersymbol(ih_status)
unregistersymbol(ik_status)

//150, 0
//17C, 1
//1E0, 1
//25C, 80"""

