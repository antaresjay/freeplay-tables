[[cheat]]
id = "energy-happy-no-decrease-stats-multi"
name = "Energy/Happy no decrease/Stats multi"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,GameAssembly.dll,8B 50 14 03 D5 89 50 14 83 FA 32 7D ** C7 40 14 32 00 00 00) // should be unique
alloc(newmem,$1000,INJECT)

label(return)
label(stats_multi)      // Declaramos la etiqueta de nuestra variable
registersymbol(stats_multi)

newmem:
  mov edx,[rax+14]    // Lee el valor actual de la estadística

  cmp ebp,0           // Compara el valor de ebp con 0
  jge @f     // Si es positivo, salta
  neg ebp             // Si es negativo, lo vuelve positivo

@@:
  push eax            // Guardamos el valor actual de eax para no romper nada en el juego
  mov eax, [stats_multi] // Cargamos tu multiplicador (2) en eax
  imul ebp, eax       // Multiplicamos ebp por eax (ebp = ebp * stats_multi)
  pop eax             // Restauramos el valor original de eax
  // ---------------------------------------------------------

  add edx,ebp         // Siempre suma para que todo suba
  jmp return

stats_multi:
  dd (int)1           // Tu variable guardada en memoria (puedes cambiar el 2 en la tabla)

INJECT:
  jmp newmem
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 8B 50 14 03 D5

unregistersymbol(INJECT)
unregistersymbol(stats_multi)
dealloc(newmem)"""

