[[cheat]]
id = "infinite-energy"
name = "Infinite Energy"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscan(energy,48 83 C4 08 89 04 19)
alloc(newmem,$1000,energy)

label(code)
label(return)

newmem:
code:
  cmp rbx, 84
  jne @F

  add rsp, 8
  mov [rcx+rbx], 3
  jmp return

@@:
  add rsp, 08
  mov [rcx+rbx], eax
  jmp return

energy:
  jmp newmem
  nop
  nop
return:
registersymbol(energy)

[DISABLE]

energy:
  db 48 83 C4 08 89 04 19

unregistersymbol(energy)
dealloc(newmem)"""
