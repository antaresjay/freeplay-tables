[[cheat]]
id = "bounty-gets-added-to-cash"
name = "Bounty Gets Added to Cash ()->"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
// NFS:MW v1.3 (2005) (Cash rewards for bounty v0.2)
// Bounty earnt in a chase will be added too youre cash (excludes milestone to make it fair)
// (saw problems with visuals, milestone bounty earnt wasnt showen too be added in the pop up display but was added too the players bounty when cheacked on)
[ENABLE]
alloc(BountyCode,512)
label(returnhere)
label(originalcode) //? do i really need this
label(exit)

BountyCode:
mov ecx,[esi-8A88] //moves cash value into ecx
mov eax,[esp+1C]   //moves earnt bounty value into eax
add ecx,eax        //Bang some rocks togeath to make a fire
mov [esi-8A88],ecx //moves the combined cash+earnt bounty back to the players wallet

originalcode:
mov ecx,[esi+10]   //ORG CODE: moves player bounty into ecx
mov eax,[esp+1C]   //ORG CODE: moves earnt bounty into eax

exit:
jmp returnhere

"speed.exe"+16F81B:
jmp BountyCode
nop
nop
returnhere:

//------------------------------------
[DISABLE]

"speed.exe"+16F81B:
mov ecx,[esi+10]
mov eax,[esp+1C]
//Alt: db 8B 4E 10 8B 44 24 1C
dealloc(BountyCode)"""

