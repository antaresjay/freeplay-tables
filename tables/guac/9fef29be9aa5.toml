source = """
{
  Game:    Guacamelee Gold Edition
  Version: Rev. 80034
  Author:  gwodus (gwodusx@xsmail.com)
  Date:    2014-05-01
}

[ENABLE]
aobscan(origcode_h,56 57 8B 7C 24 28 D9 87 B0 01 00 00)
alloc(mem_h,2048)

label(code_h)
label(returnhere)
label(originalcode)
label(exit)

registersymbol(origcode_h)
registersymbol(code_h)

mem_h:
code_h:
// check if this is the player
push eax
mov eax, [esp+24]
cmp eax, [pPlayer]
pop eax
jne originalcode

// return from current subroutine
// so all the 'damage' code will be skipped
add esp,18
ret

originalcode:
push esi
push edi
mov edi,[esp+28]

exit:
jmp returnhere

//"Guac.exe"+2BF406:
origcode_h:
jmp mem_h
nop
returnhere:

[DISABLE]
//"Guac.exe"+2BF406:
origcode_h:
//Guac.exe+2BF406 - 56                    - push esi
//Guac.exe+2BF407 - 57                    - push edi
//Guac.exe+2BF408 - 8B 7C 24 28           - mov edi,[esp+28]
//Guac.exe+2BF40C - D9 87 B0010000        - fld dword ptr [edi+000001B0]
db 56 57 8B 7C 24 28

unregistersymbol(origcode_h)
unregistersymbol(code_h)

dealloc(mem_h)"""

[[cheat]]
id = "floating-press-x-to-fly-up"
name = "Floating (Press X to fly up)"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
{
  Game:    Guacamelee Gold Edition
  Version: Rev. 80034
  Author:  gwodus (gwodusx@xsmail.com)
  Date:    2014-05-01
}

[ENABLE]
aobscan(origcode_f,8B CE D9 5C 24 40 D9 46 4C)

alloc(mem_f,2048)
label(code_f)
label(ypos_f)
label(enabled_f)
label(keypressed_f)
label(jumpstep_f)

label(returnhere)
label(exit)
label(keyDown)
label(endcheat)
label(checkKeyPressed)

registersymbol(origcode_f)
registersymbol(mem_f)
registersymbol(code_f)
registersymbol(ypos_f)
registersymbol(enabled_f)

// -------------------------------------------------------------------
// variable block
// -------------------------------------------------------------------

mem_f: //this is allocated memory, you have read,write,execute access

enabled_f:
dd 01
ypos_f:
dd 00
keypressed_f:
dd 00
jumpstep_f:
dd (float)0.4

// -------------------------------------------------------------------
// cheat code
// -------------------------------------------------------------------

code_f:
mov ecx,esi               // Original code
fstp dword ptr [esp+40]   // Original code

// check if this is the player's figure
cmp esi, [pFigure]
jne exit

call checkKeyPressed

push eax
cmp [enabled_f], 0x1
jne endcheat

cmp [keypressed_f], 0
jne keyDown

mov eax, [esi+38]
mov [ypos_f], eax
jmp endcheat

keyDown:
mov eax, [ypos_f]
mov [esi+38], eax

// add a value to y-pos
sub esp,10                // allocate 16bytes for original xmm0 register
movdqu [esp],xmm0         // save xmm0 (128 bit register, so 16 bytes)

movss xmm0,[esi+38]       // write the float value into xmm0 (note that the upper bits of xmm0 will get erased by doing this, which is why we use movdqu to save it and not movss)
addss xmm0,[jumpstep_f]   // increase xmm0 with the float constant
movss [esi+38],xmm0       // write the result of the calculation to esi+38

movdqu xmm0,[esp]         // restore with original
add esp,10                // free local variable space

mov eax, [esi+38]
mov [ypos_f], eax

endcheat:
pop eax

exit:
jmp returnhere

// -------------------------------------------------------------------
// subroutine checkKeyPressed
// -------------------------------------------------------------------

checkKeyPressed:

// save everything
pushad
pushfd

mov [keypressed_f], 0
//virtual key codes
push 'X'
call GetAsyncKeyState
shr ax,#15 //bit 15 is 1 if it is CURRENTLY down
mov [keypressed_f], ax

popfd
popad

ret

// -------------------------------------------------------------------
// Code Inject Point
// -------------------------------------------------------------------

//"Guac.exe"+4793FB:
origcode_f:
jmp code_f
nop
returnhere:


[DISABLE]
//"Guac.exe"+4793FB:
origcode_f:
//Guac.exe+4793FB - 8B CE                 - mov ecx,esi
//Guac.exe+4793FD - D9 5C 24 40           - fstp dword ptr [esp+40]
//Guac.exe+479401 - D9 46 4C              - fld dword ptr [esi+4C]
db 8B CE D9 5C 24 40

unregistersymbol(origcode_f)
unregistersymbol(mem_f)
unregistersymbol(code_f)
unregistersymbol(ypos_f)
unregistersymbol(enabled_f)

dealloc(mem_f)"""

