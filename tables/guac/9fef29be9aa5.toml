[[cheat]]
id = "readme-double-click-on-script"
name = "README:  double click on <script> ---------> "
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
  Cheat Table for Guacamelee. Tested with version:

  Game:    Guacamelee Gold Edition
  Version: Rev. 80034
  Author:  gwodus (gwodusx@xsmail.com)
  Date:    2014-05-01

  Activate 'Guacamelee Trainer' which enables further cheat functions:

  * Health: Skips part of the damage code. So health is not reduced
    and certain objects don't have any effect (thorns, flying bones).
  * Floating: Press X in game to float up. There are also two addresses
    X-Pos and Y-Pos which can be used to set the player's  coordinates
    manually.
  * Money: This is only a static address. So it might not work in
    other game versions. But it's easy to find. Just scan for a
    4-byte int value.

  Notes:
     The 'Health'- and 'Floating'-cheats are based on AoB scans.
     So they should work in other game versions too.

     There is a challenge in El Infierno where you die upon a single
     hit. So I am skipping part of the damage code instead of just
     overwriting the health value, which would have been easier.

     I created a couple structures in 'Dissect data/structures':

     * structWorld:
         Is pointed to from static address Guac.exe+763040. I don't know
         if it's really a world object. I just gave it that name in lieu
         of better knowledge. structWorld+$14 points to structPlayer.
     * structPlayer:
         Contains data about the player (health). structPlayer+$78 points
         to structFigure
     * structFigure:
         Contains data about the players screen object. The 2D coordinates
         are stored at structFigure+$34/$38
}

[ENABLE]
[DISABLE]"""

[[cheat]]
id = "guacamelee-trainer"
name = "Guacamelee Trainer "
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
  Game:    Guacamelee Gold Edition
  Version: Rev. 80034
  Author:  gwodus (gwodusx@xsmail.com)
  Date:    2014-05-01

  There is a point inside a loop at address loop_m which
  contains a pointer to some interesting structures.
  We store a couple pointers here for other scripts
}

[ENABLE]
aobscan(loop_m,8B 41 14 56 57)
//label(loop_m)

alloc(mem_m,1048)
label(returnhere)
label(originalcode)
label(exit_m)
label(clear1)
label(clear2)
label(clear3)

label(code_m)
label(pWorld)
label(pPlayer)
label(pFigure)

registersymbol(loop_m)
registersymbol(code_m)
registersymbol(pWorld)
registersymbol(pPlayer)
registersymbol(pFigure)

// -------------------------------------------------------------------
// variable block
// -------------------------------------------------------------------

mem_m: //this is allocated memory, you have read,write,execute access

// ptr to structWorld
// (not sure if really world, but contains pointer to structPlayer)
pWorld:
dd 0

// ptr to structPlayer (contains health, etc.)
pPlayer:
dd 0

// ptr to structFigure (contains player coordinates)
pFigure:
dd 0

// -------------------------------------------------------------------
// injected code
// -------------------------------------------------------------------

code_m:
mov eax, ecx           // ecx contains ptr to structWorld
test eax, eax
jz clear1
mov [pWorld], eax
mov eax,[eax+14]       // structWorld+14 contains ptr to structPlayer
test eax, eax
jz clear2
mov [pPlayer], eax
mov eax,[eax+78]       // structPlayer+78 contains ptr to structFigure
test eax, eax
jz clear3
mov [pFigure], eax
jmp originalcode

clear1:
mov [pWorld], 0
clear2:
mov [pPlayer], 0
clear3:
mov [pFigure], 0

originalcode:
mov eax,[ecx+14]
push esi
push edi

exit_m:
jmp returnhere

// -------------------------------------------------------------------
// Code Inject Point
// -------------------------------------------------------------------

//Guac.exe+31C910:
loop_m:
jmp code_m
returnhere:


[DISABLE]
//Guac.exe+31C910:
loop_m:
//Guac.exe+31C910 - 8B 41 14              - mov eax,[ecx+14]
//Guac.exe+31C913 - 56                    - push esi
//Guac.exe+31C914 - 57                    - push edi
//Guac.exe+31C915 - 85 C0                 - test eax,eax
db 8B 41 14 56 57

unregistersymbol(loop_m)
unregistersymbol(code_m)
unregistersymbol(pWorld)
unregistersymbol(pPlayer)
unregistersymbol(pFigure)

dealloc(mem_m)"""

