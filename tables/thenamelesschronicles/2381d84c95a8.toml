type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanregion(totalDamageCaledAOB,CharacterAttributes:ApplyDamage2,CharacterAttributes:ApplyDamage2+226,48 ** ** ** 49 BB ** ** ** ** ** ** ** ** 41 FF D3 48 ** ** ** 4C 8B F0 F3 0F 10)
