[[cheat]]
id = "inf-health"
name = "Inf+ Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{  Game Executable   : Source of Madness.exe
   Executable Version: 2019.4.29.60130
   Script Date       : 2021-09-24
   Author            : AlvinC
}

[ENABLE]
aobscanregion(aophealth,PlayerCharacter:Update+70,PlayerCharacter:Update+e3,48 63 80 ? ? ? ? f3 0f 2a c0 f3 0f 5a c0 f2 0f 11 85 ? ? ? ? 48 8b 86 ? ? ? ? 48)
alloc(nphealth,$1000,aophealth)
label(rphealth)
label(resphealth)
nphealth:
push ebx
mov ebx,[rax+000000E0]
mov [rax+0000013C],ebx
pop ebx
resphealth:
readmem(aophealth,7)
jmp rphealth
aophealth:
jmp nphealth
nop 2
rphealth:
registersymbol(aophealth)
registersymbol(resphealth)
[DISABLE]
aophealth:
readmem(resphealth,7)
unregistersymbol(aophealth)
unregistersymbol(resphealth)
dealloc(nphealth)"""

