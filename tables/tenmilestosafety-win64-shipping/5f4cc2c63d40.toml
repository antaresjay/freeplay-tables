[[cheat]]
id = "get-player"
name = "Get Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(playerbase_aob,TenMilesToSafety-Win64-Shipping.exe,48 8B 01 FF 90 50 07 00 00 84)
alloc(newmem,$1000,playerbase_aob)

label(code)
label(return)

registersymbol(player_Ptr)
registersymbol(statE)
label(statE)
label(player_Ptr)
newmem:
mov [player_Ptr],rcx



cmp [statE+c],0
je @f
mov rax,[rcx+a60]
cmp rax,100000
jna @f
cmp [rax+598],0
je @f
mov [rax+598],63
@@:

cmp [statE+8],0
je @f
mov rax,[rcx+a00]
cmp rax,100000
jna @f
mov [rax],#99
mov [rax+4],#99
mov [rax+8],#99
mov [rax]+c,#99
mov [rax+10],#99
mov [rax+14],#99
mov [rax+18],#99
mov [rax+1c],#99
mov [rax+20],#99
mov [rax+24],#99
mov [rax+28],#99

@@:
cmp [statE],0
je @f
mov [rcx+75c],(float)999

@@:
cmp [statE+4],0
je @f
mov [rcx+760],(float)999


@@:

cmp [statE+10],0
je @f
mov [rcx+944],(float)999
mov [rcx+9d8],(float)999





code:
mov rax,[rcx]
call qword ptr [rax+00000750]
jmp return
player_Ptr:
dq 0
statE:
dd 0
playerbase_aob:
jmp newmem
nop 4
return:
registersymbol(playerbase_aob)

[DISABLE]

playerbase_aob:
db 48 8B 01 FF 90 50 07 00 00
unregistersymbol(player_Ptr)
unregistersymbol(playerbase_aob)
dealloc(newmem)
unregistersymbol(statE)"""

