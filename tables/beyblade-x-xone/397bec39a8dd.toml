[[cheat]]
id = "character-fast-speed-chance-value-in-script"
name = "Character Fast Speed - [ Chance Value In Script ]"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
{ Game   : BEYBLADE X XONE.exe
  Version: 
  Date   : 2024-11-15
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(pData_CharaController,GameAssembly.dll,F3 0F 10 42 1C F3 0F 5C) // should be unique
alloc(newmem,$1000,pData_CharaController)

label(code)
label(return)

newmem:
  mov [rdx+1C],(float)10       //_walkSpeed_max    //_NormalSpeed 3

code:
  db F3 0F 10 42 1C
  jmp return

pData_CharaController:
  jmp newmem
return:
registersymbol(pData_CharaController)

[DISABLE]

pData_CharaController:
  db F3 0F 10 42 1C

unregistersymbol(pData_CharaController)
dealloc(newmem)"""

