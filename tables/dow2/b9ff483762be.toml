[[cheat]]
id = "invulnerability"
name = "Invulnerability"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(originalcode)
label(exit)
label(notplayer)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here

push eax
pushfd

mov eax,[ebx+10]
or eax,eax
jz originalcode

mov eax,[eax+34]
or eax,eax
jz originalcode

cmp [eax+8],#1000
jne notplayer

//it's the player
movss xmm1,[ebx+90]
jmp originalcode

notplayer:
//add a quick kill thingy if you like
//mov eax,(float)-1
//movss xmm1,[min1]

originalcode:
popfd
pop eax
movss [ebx+44],xmm1

exit:
jmp returnhere

"DOW2.exe"+3F21EF:
jmp newmem
returnhere:

 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
"DOW2.exe"+3F21EF:
movss [ebx+44],xmm1"""

[[cheat]]
id = "infinite-energy-for-units"
name = "Infinite energy for units"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(exit)


newmem:

fld dword ptr [eax]
fstp dword ptr [esi+14]

push eax

mov eax,[esi+10]
or eax,eax
jz short exit

mov eax,[eax+4c]
or eax,eax
jz short exit

cmp [eax+8],#1000
jne short exit

//still here, so player unit
mov [esi+14],(float)1000

exit:
pop eax
jmp returnhere

"DOW2.exe"+40C1CA:
