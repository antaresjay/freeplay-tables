[[cheat]]
id = "achive"
name = "achive"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048,"GameAssembly.dll"+72E9E0) 
label(returnhere)
label(originalcode)
label(exit)
label(base)
registersymbol(base)
newmem:

originalcode:
mov [base],rdi
mov rax,[rdi+00000288]

exit:
jmp returnhere

base:
  dq 0

"GameAssembly.dll"+72E9E0:
jmp newmem
nop 2
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
unregistersymbol(base)
"GameAssembly.dll"+72E9E0:
db 48 8B 87 88 02 00 00
//mov rax,[rdi+00000288]"""

