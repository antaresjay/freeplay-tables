type = "script"
source = """
[ENABLE]
aobscanmodule(knivescd,AssassinsCreed_Dx10.exe,89 BE 84 02 00 00 E8)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  mov edi, [esi+00000240]
  mov [esi+00000284], edi
  jmp return

knivescd:
  jmp newmem
  nop
return:
registersymbol(knivescd)

