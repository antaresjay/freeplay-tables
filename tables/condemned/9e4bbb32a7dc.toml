[Enable]
alloc(newmem, 128)
label(exit)

GameClient.dll+A8641:
jmp newmem
db 90 90 90
exit:

newmem:
mov ecx,[esp+38]
mov esi,[esp+20]
cmp [esp+2C],GameClient.dll+28BF6
je @f
cmp [esp+2C],GameClient.dll+29C36
