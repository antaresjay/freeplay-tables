source = """
{ Game   : Baldur's Gate - Dark Alliance.exe
  Version: 
  Date   : 2021-12-18
  Author : SanitKa

  This script multiplies added items x8
}

[ENABLE]

aobscanmodule(INJECT_ADD,Baldur's Gate - Dark Alliance.exe,0F B7 47 04 66 01 01) // should be unique
alloc(newmem,$1000,INJECT_ADD)

label(code)
label(return)

newmem:

code:
  movzx eax,word ptr [rdi+04] // item count [rdi+04] to be added store it in AX (EAX, RAX)
  shl rax,3                   // 1 ~ *2, 2 ~ *4, 3 ~ *8, 4 ~ *16, 5 ~ *32 ;)
  add [rcx],ax                // increase orginal item count [rcx] by AX
  jmp return

INJECT_ADD:
  jmp newmem
  nop 2
return:
registersymbol(INJECT_ADD)

[DISABLE]

INJECT_ADD:
  db 0F B7 47 04 66 01 01

unregistersymbol(INJECT_ADD)
