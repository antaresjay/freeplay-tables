[[cheat]]
id = "enable-fol-multiplier"
name = "Enable Fol Multiplier"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@modEngine
[ENABLE]

aobscanmodule(folmultiplier,SO6.exe,89 38 45 84 FF)
alloc(newmem,$1000,folmultiplier)
registersymbol(fol)
label(fol)
label(code)
label(return)

newmem:

code:
  imul edi,[fol]
  mov [rax],edi
  test r15b,r15b
  jmp return


fol:
dd 1

folmultiplier:
  jmp newmem
return:
registersymbol(folmultiplier)

[DISABLE]

folmultiplier:
  db 89 38 45 84 FF

unregistersymbol(*)
dealloc(*)"""

