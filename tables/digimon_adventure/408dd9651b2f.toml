[[cheat]]
id = "base"
name = "base"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(time,89 B4 3B 24 FE FF FF) // should be unique
alloc(newmem,$1000,time)
alloc(base,4)
registersymbol(base)
label(code)
label(return)

newmem:

code:
  mov [base],rbx
  mov [rbx+rdi-000001DC],esi
  jmp return

time:
  jmp newmem
  nop 2
return:
registersymbol(time)

[DISABLE]

time:
  db 89 B4 3B 24 FE FF FF

unregistersymbol(time)
dealloc(newmem)
unregistersymbol(base)
dealloc(base)"""

