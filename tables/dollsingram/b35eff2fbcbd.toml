[[cheat]]
id = "invincibility-untouchable"
name = "Invincibility/Untouchable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Invincible)
registersymbol(Invincible)
aobscan(Hook, C7 40 54 01 00 00 00 E8 5A 6C FB FF 8B 15 B4 10 55 00) //Find Mov

Hook:
Invincible:
db 90 90 90 90 90 90 90 //Nop Mov

[DISABLE]
Invincible:
db C7 40 54 01 00 00 00 //Restore Mov
unregistersymbol(Invincible)"""

