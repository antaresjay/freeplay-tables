[[cheat]]
id = "health-get-damage"
name = "Health: [get damage]"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(AOB_Health,F3 0F 11 68 1C 48 8B 83 98 01 00 00)

alloc(newmem,1024)
globalalloc(pJNFeaturesMain,8)
globalalloc(pJNClamped_Health,8)
globalalloc(bHealthCheat,4)
globalalloc(bEnemyHealthCheat,4)

label(newHealth)
label(codeHealth)
label(returnHealth)
label(enemyHealth)

newmem:

newHealth:
  cmp dword ptr [rbx+000001F4],0 // team check
  jne enemyHealth
  mov [pJNFeaturesMain],rbx // read
  mov [pJNClamped_Health],rax // read
  cmp dword ptr [bHealthCheat],1 // cheat check
  jne codeHealth
  movss xmm0,[rax+20] // get max health
  cvtss2sd xmm0,xmm0 // convert single to double
  cvtsd2ss,xmm5,xmm0 // convert double to single
  jmp codeHealth
enemyHealth:
  cmp dword ptr [bEnemyHealthCheat],1 // cheat check
  jne codeHealth
  movss xmm0,[rax+1C] // get current health
  cvtss2sd xmm0,xmm0 // convert single to double
  movss xmm1,[rax+1C] // get subtract amount
  cvtss2sd xmm1,xmm1 // convert single to double
  subsd xmm0,xmm1 // subtract
  cvtsd2ss,xmm5,xmm0 // convert double to single
  jmp codeHealth
codeHealth:
  movss [rax+1C],xmm5 // move health
  jmp returnHealth

AOB_Health: // JNFeaturesMain::ChangeHealth+19E1:
  jmp newHealth
returnHealth:
registersymbol(AOB_Health)


