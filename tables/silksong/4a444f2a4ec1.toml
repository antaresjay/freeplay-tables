[[cheat]]
id = "max-health"
name = "Max Health"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[enable]
ijmscripts+0:
push rbp
push rcx
push r15

mov rcx,ptr_PlayerData
mov rcx,[rcx]
test rcx,rcx
je @f
mov r15,rcx
mov r11,PlayerData:get_CurrentMaxHealth
call r11
test eax,eax
je @f
cmp dword ptr [r15+$PlayerDataC.health],eax
jge @f

mov rcx,ptr_HeroController
mov rcx,[rcx]
test rcx,rcx
je @f
mov r11,HeroController:RefillHealthToMax //HeroController:MaxHealth
call r11

@@:
pop r15
pop rcx
pop rbp
ret

[disable]
ijmscripts+0:
ret"""

