[[cheat]]
id = "last-item-picked"
name = "Last Item Picked"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : DyingLightGame.exe
  Version: 
  Date   : 2015-01-28
  Author : Nanobyte

  This script does Set item Quantity to certain amount
}

[ENABLE]

aobscanmodule(_craft,gamedll_x64_rwdi.dll,38 89 1F 48 8B 5C 24 30) // should be unique
alloc(newmem,$1000,"gamedll_x64_rwdi.dll"+5BA8D9)
globalalloc(value,16)
globalalloc(fcraft,8)
label(code)
label(return)

newmem:

code:
     cmp [fcraft],0
     je @f
     cmp [rdi],ebx
     ja @f
     add ebx,#[fcraft]
     @@:
  mov [rdi],ebx
  mov [value],rdi
  mov rbx,[rsp+30]
  jmp return

_craft+01:
  jmp code
  nop
  nop
return:
registersymbol(_craft)

[DISABLE]

_craft+01:
  db 89 1F 48 8B 5C 24 30

unregistersymbol(_craft)
unregistersymbol(value)
unregistersymbol(fcraft)
dealloc(fcraft)
dealloc(value)
dealloc(newmem)"""

