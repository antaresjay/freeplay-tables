[[cheat]]
id = "day-night-cycle-time"
name = "Day/Night Cycle Time"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
{}
alloc(wTime,96,"gamedll_x64_rwdi.dll"+33F883)
{}
label(wTimeExit)
label(wTimeAoBret)
{}
registersymbol(wTime)
registersymbol(wTimeAoBret)
{}
aobscanmodule(wTimeAoB,gamedll_x64_rwdi.dll,F3 0F 59 05 ** ** 57 01 72 0C 0F 28 C1 48 83 C4 ** 5B C3 0F 57 C0 48 83 C4 ** 5B C3)

//--------------------//
wTime+0:
dd 0

wTime+16:
dd 0

//--------------------//
wTime+32:
cmp [wTime+16],0
je wTime+74
movss [wTime+0],xmm0
cmp [wTime+16],(float)23.99
jbe wTime+60
add rsp,20
pop rbx
jmp wTimeExit

wTime+60:
movss xmm0,[wTime+16]
add rsp,20
pop rbx
jmp wTimeExit

wTime+74:
movss [wTime+16],xmm0
jmp wTime+32

wTimeAoB+16: //"gamedll_x64_rwdi.dll"+33F883:
wTimeAoBret:
jmp wTime+32
wTimeExit:

[DISABLE]
dealloc(wTime)
wTimeAoBret: //"gamedll_x64_rwdi.dll"+33F883:
db 48 83 C4 20 5B
{add rsp,20
pop rbx}
unregistersymbol(wTime)
unregistersymbol(wTimeAoBret)"""

