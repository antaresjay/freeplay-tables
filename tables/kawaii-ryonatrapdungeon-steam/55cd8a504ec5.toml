[[cheat]]
id = "no-player-damage"
name = "No Player Damage"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Invincible,GameAssembly.dll,80 B8 C0 01 00 00 00)
alloc(newmem,$1000,Invincible)
//Send@Sintrix|FearlessRevolution
label(code)
label(return)

newmem:

code:
  mov byte ptr [rax+000001C0],1
  jmp return

Invincible:
  jmp newmem
  nop 2
return:
registersymbol(Invincible)
//Send@Sintrix|FearlessRevolution
[DISABLE]

Invincible:
  db 80 B8 C0 01 00 00 00

unregistersymbol(*)
dealloc(*)"""

