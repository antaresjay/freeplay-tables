[[cheat]]
id = "no-recoil"
name = "No Recoil"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : farcry3_d3d11.exe
// Author            : gir489
// Executable Version: 1.5.0.0
// MD5 Signature     : F382EC7BD05605F150C52D8875A37C9C
// EXE Compile Date  : February 18, 2013 12:51 PM
// Script Date       : July 17, 2024 06:23 PM
[ENABLE]
aobscanmodule(aob_Recoil,FC3_d3d11.dll,0C 5D C3 55 8B EC 8B C1 8B 4D 08 D9 01)
registersymbol(aob_Recoil)
alloc(newmem_Recoil,1024,FC3_d3d11.dll)
label(return_Recoil)
label(zero)

newmem_Recoil:
  mov ecx,[ebp+08] //Original Code
  push edx //Preserve EDX to the stack
  mov edx, [ebp+4] //Move the return address in to EDX
  cmp byte ptr [edx],0x8D //Make sure it's for recoil.
  pop edx //Restore EDX from the stack
  jne short @f //Return if it's not recoil.
    mov ecx,zero //Give ECX the address to the zero label.
  @@:
  fld dword ptr [ecx]
  jmp return_Recoil
zero:
  db (float)0

aob_Recoil+08:
  jmp newmem_Recoil
return_Recoil:

[DISABLE]
aob_Recoil+08:
  db 8B 4D 08 D9 01

unregistersymbol(aob_Recoil)
dealloc(newmem_Recoil)"""

