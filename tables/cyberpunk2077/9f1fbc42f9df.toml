[[cheat]]
id = "inf-ammo"
name = "inf. ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanmodule(ammoCalOnChangeAOB,"Cyberpunk2077.exe",0F ** ** ** ** 00 00 66 ** ** 66 0F ** ** 66 ** ** 44 ** ** ** 48 ** ** ** ** 00 00 41 ** ** E8)
registersymbol(ammoCalOnChangeAOB)

alloc(newmem,2048,ammoCalOnChangeAOB+11) //"Cyberpunk2077.exe"+1A7E624)
label(returnhere)
label(originalcode_ammoCalOnChangeAOB)
registersymbol(originalcode_ammoCalOnChangeAOB)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
test cx,cx
jg @f
setle cl

originalcode_ammoCalOnChangeAOB:
readmem(ammoCalOnChangeAOB+11,11)
//movzx r12d,cx
//mov rcx,[rsi+00000398]

exit:
jmp returnhere

///

ammoCalOnChangeAOB+11: //"Cyberpunk2077.exe"+1A7E624:
jmp newmem
nop 6
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
ammoCalOnChangeAOB+11: //"Cyberpunk2077.exe"+1A7E624:
readmem(originalcode_ammoCalOnChangeAOB,11)
//db 44 0F B7 E1 48 8B 8E 98 03 00 00
//Alt: movzx r12d,cx
//Alt: mov rcx,[rsi+00000398]
unregistersymbol(originalcode_ammoCalOnChangeAOB)"""

