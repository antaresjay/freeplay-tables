[[cheat]]
id = "tower-health"
name = "Tower Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

aobscan(health,DE E9 D9 5E 40 D9 46 40 D9 46 44)
label(_health)
registersymbol(_health)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
fmul st(0),st(0)

originalcode:
faddp st(1),st(0)
fstp dword ptr [esi+40]

exit:
jmp returnhere

health:
_health:
jmp newmem
returnhere:

[DISABLE]
_health:
fsubp st(1),st(0)
fstp dword ptr [esi+40]

dealloc(newmem)
unregistersymbol(_health)"""

