[[cheat]]
id = "instant-research-resources"
name = "Instant Research + Resources"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmemsr,2048)
label(returnheresr)
label(originalcodesr)
label(exitsr)

aobscan(spellres,D9 00 DE E9 D9 5F 34 EB 04)
