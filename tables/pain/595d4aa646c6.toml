[[cheat]]
id = "godmode"
name = "Godmode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Ring Of Pain.exe
  Version: 1.3.14.0 | Windows Store
  Date   : 2021-10-13
  Author : SovietWristwatch.jpg
}

[ENABLE]
aobscanmodule(godmode,GameAssembly.dll,89 87 E0 00 00 00 48 8B 05)
alloc(newmem,$1000,godmode)

label(code)
label(return)

newmem:

code:
  mov [rdi+000000E0+4],#9999
  mov [rdi+000000E0],#9999
  jmp return

godmode:
  jmp newmem
  nop
return:
registersymbol(godmode)

[DISABLE]
godmode:
  db 89 87 E0 00 00 00

unregistersymbol(godmode)
dealloc(newmem)"""

