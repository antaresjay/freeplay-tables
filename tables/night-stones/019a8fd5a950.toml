[[cheat]]
id = "item-ctrl-numpad-1-hover-mouse-in-the-inventory-to-populate"
name = "Item (Ctrl + Numpad 1) {Hover mouse in the inventory to populate}"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Night Stones.exe
// Author            : ndck76
// Executable Version: 2021.3.24.4316
// Game Version      : v1.0.12
// Script Date       : 2024-11-19


[ENABLE]

aobscanmodule(config,GameAssembly.dll,488Bxxxx4885xx74xx488Bxxxx4883xxxxC3E8xxxxxxxxxxxxxxxxxx4889xxxxxx4889xxxxxx574883xxxx488Bxxxx488B) //Item.get_Name
alloc(newmem,$1000,config)
alloc(data2,8)
alloc(configbkp,7)
registersymbol(data2)
registersymbol(config)
registersymbol(configbkp)
label(code)
label(return)

configbkp:
  readmem(config,7)

newmem:
  mov [data2],rcx

code:
  readmem(config,7)
  jmp return

config:
  jmp newmem
  nop 2
return:

[DISABLE]

config:
  readmem(configbkp,7)

unregistersymbol(*)
dealloc(*)"""

