[[cheat]]
id = "zero-ability-cool-down"
name = "Zero Ability Cool Down"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(abilitycooldown,DragonAge2.exe,DF E0 F6 C4 41 0F 84 F6)
alloc(newmem,$1000)

label(code)
label(normalcode)
label(return)

newmem:
code:
  cmp eax, 0
  je normalcode

  cmp [eax+000000B0], (float)0.01
  jle normalcode

  mov [eax+000000B0], (float)0.01

normalcode:
  fnstsw ax
  test ah, 41
  jmp return

abilitycooldown:
  jmp newmem
return:
registersymbol(abilitycooldown)

[DISABLE]

abilitycooldown:
  db DF E0 F6 C4 41

unregistersymbol(abilitycooldown)
dealloc(newmem)"""
