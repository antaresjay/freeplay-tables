[[cheat]]
id = "inf-spare-ammo-gas-arrow-rock-tequila-dynamite-nitro-need-0-item"
name = "inf spare ammo  - gas - arrow - rock - tequila - dynamite - nitro (need  0<item)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(spare,Helldorado.exe,01 9C BE 08 05 00 00)
alloc(newmem,$100)

label(code)
label(return)


alloc(ammoamount, 4)
registersymbol(ammoamount)

ammoamount:
dd (int)200

newmem:
code:
  mov ebx,[ammoamount]
  mov [esi+edi*4+00000508],ebx
  jmp return

spare:
  jmp newmem
  nop 2
return:
registersymbol(spare)

[DISABLE]
spare:
  db 01 9C BE 08 05 00 00

unregistersymbol(spare)
dealloc(newmem)
unregistersymbol(ammoamount)
dealloc(ammoamount)
{
// ORIGINAL CODE - INJECTION POINT: Helldorado.operator>>+7124
}"""

