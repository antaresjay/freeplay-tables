[[cheat]]
id = "player-coords"
name = "Player Coords"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(PlayerBase,GlimpseGame.exe,0F28 xx xxxxxxxx  0F28 xx  F3 xxxx xx xx xx  0FC6 xx xx 0Fc6 xx xx F3 xxxx xx xx xx  F3 xxxx xx xx xx  EB xx 48 xx xx xx xx xxxxxxxx C7 xx xx xx xxxxxxxx 48 xx xx xx  8D xx xx  89 xx xx  3B xx xx  7E xx 8B xx  48 xx xx  E8 xxxxxxxx 48 xx xx  48 xx xx xx   48 xx xx xx   48 xx xx  74)
alloc(newmem,$50,PlayerBase)
alloc(_Player,08)
registersymbol(_Player)


label(code)
label(return)

newmem:

code:
mov [_Player],rcx
  movaps xmm1,[rcx+00000150]
  jmp return

PlayerBase:
  jmp newmem
  nop
  nop
return:
registersymbol(PlayerBase)

[DISABLE]

PlayerBase:
  db 0F 28 89 50 01 00 00

unregistersymbol(PlayerBase)
dealloc(newmem)
unregistersymbol(_Player)
dealloc(_Player)"""

