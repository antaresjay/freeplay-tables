[[cheat]]
id = "stats-basically-god-mode"
name = "Stats (basically God mode)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(God,GlimpseGame.exe,F3 0F 10 01 C3) // should be unique
alloc(newmem,$50,God)

label(code)
label(return)
label(skip)
label(skip0)
newmem:
cmp [rcx],#0
je skip0


cmp [rsp+94],#0
jne skip
cmp [rsp+AC],#0
jne skip
cmp [rsp+24],#0
jne skip

code:
mov [rcx],(float)10
  movss xmm0,[rcx]
  ret
  jmp return

skip:
  movss xmm0,[rcx]
  ret
  jmp return

skip0:
  movss xmm0,[rcx]
  ret
  jmp return

God:
  jmp newmem
return:
registersymbol(God)

[DISABLE]

God:
  db F3 0F 10 01 C3

unregistersymbol(God)
dealloc(newmem)"""

