newmemPlayerControllerGrabber:
// Player Controls
bEnableMoveSpeedMod:
dd 1
fMoveSpeedMod:
dd (float)1.75
bEnableJumpSpeedMod:
dd 1
fJumpSpeedMod:
dd (float)1.5
bEnableStaminaDrainMod:
dd 1
fStaminaDrainMod:
dd (float)0.2
bEnableVitalsDrainMod:
dd 1
fVitalsDrainMod:
dd (float)0.01
bEnableMinSkillPoints:
dd 0
iMinSkillPoints:
dd (int)15
bEnableWeightMod:
dd 1
fWeightMod:
dd (float)0.1

// Weapon Controls
bEnableMeleeSpeedMod:
dd 1
fMeleeSpeedMod:
dd (float)2.5
bEnableMaxDurability:
dd 1

// Misc Controls
bEnableInfiniteCrafting:
dd 1
bEnableInteractionTimeMod:
dd 1
fInteractionTimeMod:
dd (float)0.2
bEnableMinItemPickup:
dd 0
iMinItemPickup:
dd (int)10

lblPlayerControllerGrabber:
readmem(aobPlayerControllerGrabber,7)
je short lblPlayerControllerGrabberSkip
{$try}
mov qword ptr [pPlayerController],rcx
movsxd rbx,[iControllerPawnOffset]
mov rax,[rbx+rcx]
mov qword ptr [pPlayerPawn],rax
movsxd rbx,[iPawnMovementOffset]
test rax,rax
jz short lblPlayerControllerGrabberSkip
mov rbx,[rax+rbx]
mov qword ptr [pPlayerPawnMovement],rbx
movsxd rbx,[iPawnHealthOffset]
mov rbx,[rax+rbx]
mov qword ptr [pPlayerPawnHealth],rbx
movsxd rbx,[iPawnWeaponOffset]
mov rbx,[rax+rbx]
mov qword ptr [pPlayerPawnWeapon],rbx
{$except}
lblPlayerControllerGrabberSkip:
jmp lblPlayerControllerGrabberRet
aobPlayerControllerGrabber_i:
readmem(aobPlayerControllerGrabber,7)
pPlayerController:
dq 0
pPlayerPawn:
dq 0
pPlayerPawnMovement:
dq 0
pPlayerPawnHealth:
dq 0
pPlayerPawnWeapon:
dq 0
iControllerPawnOffset:
readmem(aobControllerPawnOffset+03,4)
iPawnMovementOffset:
readmem(aobPawnMovementOffset+03,4)
iPawnHealthOffset:
readmem(aobPawnHealthOffset+03,4)
iPawnCashOffset:
readmem(aobPawnCashOffset+04,4)
iPawnWeaponOffset:
readmem(aobPawnWeaponOffset+03,4)

lblSkillPointChecker:
push rbx
push rcx
cmp dword ptr [bEnableMinSkillPoints],1
jne short lblSkillPointCheckerSkip
movsxd rbx,[aobSkillPointChecker_i+02]
mov ecx,[iMinSkillPoints]
cmp dword ptr [rax+rbx],ecx
jge short lblSkillPointCheckerSkip
mov dword ptr [rax+rbx],ecx
lblSkillPointCheckerSkip:
pop rcx
pop rbx
readmem(aobSkillPointChecker,7)
jmp lblSkillPointCheckerRet
aobSkillPointChecker_i:
readmem(aobSkillPointChecker,7)

lblMoveSpeedCalc:
cmp qword ptr [pPlayerPawnMovement],rdi
jne short lblMoveSpeedCalcSkip
cmp dword ptr [bEnableMoveSpeedMod],1
jne short lblMoveSpeedCalcSkip
mulss xmm0,[fMoveSpeedMod]
lblMoveSpeedCalcSkip:
readmem(aobMoveSpeedCalc+08,5)
jmp lblMoveSpeedCalcRet
aobMoveSpeedCalc_i:
readmem(aobMoveSpeedCalc+08,5)

lblJumpSpeedCalc:
readmem(aobJumpSpeedCalc,6)
cmp dword ptr [pPlayerPawnMovement],rbx
jne short lblJumpSpeedCalcSkip
cmp dword ptr [bEnableJumpSpeedMod],1
jne short lblJumpSpeedCalcSkip
movd rcx,xmm0
movsxd rax,[aobJumpSpeedCalc_i+02]
movss xmm0,[rax+rbx]
mulss xmm0,[fJumpSpeedMod]
movss [rax+rbx],xmm0
movd xmm0,rcx
lblJumpSpeedCalcSkip:
jmp lblJumpSpeedCalcRet
aobJumpSpeedCalc_i:
readmem(aobJumpSpeedCalc,6)

lblStaminaDrainCalc:
pushfq
movd r8,xmm0
cmp dword ptr [pPlayerPawnHealth],rdi
jne short lblStaminaDrainCalcSkip
cmp dword ptr [bEnableStaminaDrainMod],1
jne short lblStaminaDrainCalcSkip
xorps xmm0,xmm0
comiss xmm0,xmm6
jbe short lblStaminaDrainCalcSkip
mulss xmm6,[fStaminaDrainMod]
lblStaminaDrainCalcSkip:
movd xmm0,r8
popfq
readmem(aobStaminaDrainCalc,7)
jmp lblStaminaDrainCalcRet
aobStaminaDrainCalc_i:
readmem(aobStaminaDrainCalc,7)

lblVitalsDrainCalc:
pushfq
cmp dword ptr [pPlayerPawnHealth],rdi
jne short lblVitalsDrainCalcSkip
cmp dword ptr [bEnableVitalsDrainMod],1
jne short lblVitalsDrainCalcSkip
comiss xmm6,xmm7
jbe short lblVitalsDrainCalcSkip
mulss xmm7,[fVitalsDrainMod]
lblVitalsDrainCalcSkip:
popfq
readmem(aobVitalsDrainCalc,7)
jmp lblVitalsDrainCalcRet
aobVitalsDrainCalc_i:
readmem(aobVitalsDrainCalc,7)

lblCraftingMaterialTaker:
cmp dword ptr [bEnableInfiniteCrafting],1
je short lblCraftingMaterialTakerSkip
readmem(aobCraftingMaterialTaker,7)
lblCraftingMaterialTakerSkip:
jmp lblCraftingMaterialTakerRet
aobCraftingMaterialTaker_i:
readmem(aobCraftingMaterialTaker,7)

lblInteractionTimeCalc:
cmp dword ptr [bEnableInteractionTimeMod],1
jne short lblInteractionTimeCalcSkip
movsxd rax,[aobInteractionTimeCalc_i+04]
movss xmm2,[rax+rcx-04]
mulss xmm2,[fInteractionTimeMod]
comiss xmm2,[rax+rcx]
ja short lblInteractionTimeCalcSkip
movss [rax+rcx],xmm2
lblInteractionTimeCalcSkip:
readmem(aobInteractionTimeCalc,8)
jmp lblInteractionTimeCalcRet
aobInteractionTimeCalc_i:
readmem(aobInteractionTimeCalc,8)

lblItemPickupCalc:
cmp r8d,0
jle short lblItemPickupCalcSkip
cmp dword ptr [bEnableMinItemPickup],1
jne short lblItemPickupCalcSkip
mov r14d,[iMinItemPickup]
cmp r8d,r14d
jge short lblItemPickupCalcSkip
mov r8d,r14d
lblItemPickupCalcSkip:
readmem(aobItemPickupCalc,6)
jmp lblItemPickupCalcRet
aobItemPickupCalc_i:
readmem(aobItemPickupCalc,6)

lblMeleeSpeedReader:
readmem(aobMeleeSpeedReader,8)
cmp qword ptr [pPlayerPawnWeapon],rsi
jne short lblMeleeSpeedReaderSkip
cmp dword ptr [bEnableMeleeSpeedMod],1
jne short lblMeleeSpeedReaderSkip
mulss xmm0,[fMeleeSpeedMod]
lblMeleeSpeedReaderSkip:
jmp lblMeleeSpeedReaderRet
aobMeleeSpeedReader_i:
readmem(aobMeleeSpeedReader,8)

lblWeaponDurabilityUpdater:
cmp qword ptr [pPlayerPawnWeapon],rbx
jne short lblWeaponDurabilityUpdaterSkip
cmp dword ptr [bEnableMaxDurability],1
jne short lblWeaponDurabilityUpdaterSkip
mov rax,(float)1.0
movq xmm0,rax
xorps xmm6,xmm6
lblWeaponDurabilityUpdaterSkip:
readmem(aobWeaponDurabilityUpdater,7)
jmp lblWeaponDurabilityUpdaterRet
aobWeaponDurabilityUpdater_i:
readmem(aobWeaponDurabilityUpdater,7)

lblWeightCalc:
cmp dword ptr [bEnableWeightMod],1
jne short lblWeightCalcSkip
mulss xmm6,[fWeightMod]
lblWeightCalcSkip:
readmem(aobWeightCalc,9)
jmp lblWeightCalcRet
aobWeightCalc_i:
readmem(aobWeightCalc,9)

aobWeightCalc:
aobWeightCalc_r:
jmp lblWeightCalc
nop 4
lblWeightCalcRet:

aobWeaponDurabilityUpdater:
aobWeaponDurabilityUpdater_r:
jmp lblWeaponDurabilityUpdater
nop 2
lblWeaponDurabilityUpdaterRet:

aobMeleeSpeedReader:
aobMeleeSpeedReader_r:
jmp lblMeleeSpeedReader
nop 3
lblMeleeSpeedReaderRet:

aobItemPickupCalc:
aobItemPickupCalc_r:
jmp lblItemPickupCalc
nop
lblItemPickupCalcRet:

aobInteractionTimeCalc:
aobInteractionTimeCalc_r:
jmp lblInteractionTimeCalc
nop 3
lblInteractionTimeCalcRet:

aobCraftingMaterialTaker:
aobCraftingMaterialTaker_r:
