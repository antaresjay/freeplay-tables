nop 2
lblVitalsDrainCalcRet:

aobStaminaDrainCalc:
aobStaminaDrainCalc_r:
jmp lblStaminaDrainCalc
nop 2
lblStaminaDrainCalcRet:

aobJumpSpeedCalc:
aobJumpSpeedCalc_r:
jmp lblJumpSpeedCalc
nop
lblJumpSpeedCalcRet:

aobMoveSpeedCalc+08:
aobMoveSpeedCalc_r:
jmp lblMoveSpeedCalc
lblMoveSpeedCalcRet:

aobSkillPointChecker:
aobSkillPointChecker_r:
jmp lblSkillPointChecker
nop
nop
lblSkillPointCheckerRet:

aobPlayerControllerGrabber:
aobPlayerControllerGrabber_r:
jmp lblPlayerControllerGrabber
nop
nop
lblPlayerControllerGrabberRet:

[DISABLE]
