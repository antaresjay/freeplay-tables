[[cheat]]
id = "auto-assemble-script"
name = "Auto Assemble script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanregion(jumpUpVelocityReadOnMoveAOB,PlayerMoveManager:CalcMoveSpeedVelocity,PlayerMoveManager:CalcMoveSpeedVelocity+336,F3 0F 10 80 78 01 00 00 F3 0F 5A C0 F2 0F 5A E8)
registersymbol(jumpUpVelocityReadOnMoveAOB)

alloc(newmem2,2048,jumpUpVelocityReadOnMoveAOB+8) //PlayerMoveManager:CalcMoveSpeedVelocity+163)
label(returnhere2)
label(originalcode2)
label(exit2)

newmem2: //this is allocated memory, you have read,write,execute access
//place your code here
mulss xmm0,[fJumpUpVelocityMultiplier]

originalcode2:
cvtss2sd xmm0,xmm0
cvtsd2ss xmm5,xmm0

exit2:
jmp returnhere2

///

jumpUpVelocityReadOnMoveAOB+8: //PlayerMoveManager:CalcMoveSpeedVelocity+163:
jmp newmem2
nop
nop
nop
returnhere2:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem2)
jumpUpVelocityReadOnMoveAOB+8: //PlayerMoveManager:CalcMoveSpeedVelocity+163:
db F3 0F 5A C0 F2 0F 5A E8
//Alt: cvtss2sd xmm0,xmm0
//Alt: cvtsd2ss xmm5,xmm0"""

