[[cheat]]
id = "one-hit-kill-enemies-structures"
name = "One Hit Kill (Enemies&Structures)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem1,100)
label(returnhere1)
label(enemies)
label(exit1)

alloc(newmem2,100)
label(returnhere2)
label(structures)
label(exit2)

newmem1:
cmp [esi+80],(float)0
je enemies
mov [esi+78],edi
pop edi
mov ecx,[esp+18]
jmp exit1

enemies:
mov edi,0
mov [esi+78],edi
pop edi
mov ecx,[esp+18]

exit1:
jmp returnhere1

"KivisUnderworld.exe"+8CAAA:
jmp newmem1
nop 3
returnhere1:

newmem2:

structures:
mov esi,0
mov [edi+78],esi
pop esi
pop edi

exit2:
jmp returnhere2

"KivisUnderworld.exe"+4E5E5:
jmp newmem2
returnhere2:

[DISABLE]
dealloc(newmem1)
"KivisUnderworld.exe"+8CAAA:
mov [esi+78],edi
pop edi
mov ecx,[esp+18]

dealloc(newmem2)
"KivisUnderworld.exe"+4E5E5:
mov [edi+78],esi
pop esi
pop edi"""

