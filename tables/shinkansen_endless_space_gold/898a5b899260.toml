[[cheat]]
id = "shipdesign-base-address-scan-to-activate-select-ship-design-to-update-select-ship-design"
name = "ShipDesign Base Address Scan (To Activate: Select Ship Design, To Update: Select Ship Design)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(ShipDesign_savedAOB)
label(ShipDesign_returnhere)
label(ShipDesign_originalcode)
label(ShipDesign_exit)

label(ShipDesign_update_exit)
label(ShipDesign_set_exit)

registersymbol(ShipDesign_savedAOB)

//2F8C3BD5 - 8B 85 78FFFFFF        - mov eax,[ebp-00000088]
//2F8C3BDB - 39 00                 - cmp [eax],eax
// ModuleSummaryItem:DisplayContent_Xp1+c5
//2F8C3BDD - 8B 40 74              - mov eax,[eax+74]
//2F8C3BE0 - 8D 4D A8              - lea ecx,[ebp-58]
//2F8C3BE3 - 83 EC 08              - sub esp,08
//2F8C3BE6 - 50                    - push eax
//2F8C3BE7 - 51                    - push ecx
//2F8C3BE8 - 39 00                 - cmp [eax],eax
aobscan(ShipDesign_searchedAOB, 8B 40 74 8D 4D A8 83 EC 08)

alloc(ShipDesign_newmem, 2048)


ShipDesign_newmem:
cmp dword ptr [ShipDesign_update_enable], #0
je ShipDesign_update_exit
mov [ShipDesign_basepointer], eax
ShipDesign_update_exit:

cmp dword ptr [ShipDesign_set_enable], #0
je ShipDesign_set_exit
cmp dword ptr [eax+6c], #0
je ShipDesign_set_exit
mov ecx, [eax+6c]
mov [ecx+60], (float)9999999
mov [ecx+64], (float)4
mov [ecx+74], (float)0
ShipDesign_set_exit:


ShipDesign_originalcode:
db 8B 40 74 8D 4D A8
//mov eax,[eax+74]
//lea ecx,[ebp-58]


ShipDesign_exit:
jmp ShipDesign_returnhere


ShipDesign_searchedAOB:
ShipDesign_savedAOB:
jmp ShipDesign_newmem
nop
ShipDesign_returnhere:


[DISABLE]
ShipDesign_savedAOB:
db 8B 40 74 8D 4D A8
//mov eax,[eax+74]
//lea ecx,[ebp-58]

unregistersymbol(ShipDesign_savedAOB)

dealloc(ShipDesign_newmem)"""

