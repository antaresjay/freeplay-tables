}

[ENABLE]
// Scan for the exact subtraction and the following mov instruction to ensure a unique hit
aobscanmodule(StatPointsGrabber,GameAssembly.dll,29 BB 78 01 00 00 48 8B 83 60 01 00 00)
alloc(newmem,$1000,StatPointsGrabber)

label(code)
label(return)
label(pStatPoints)

registersymbol(pStatPoints)
registersymbol(StatPointsGrabber)

newmem:
code:
  mov [pStatPoints],rbx      // Siphon the base address
  sub [rbx+00000178],edi     // Original instruction: subtract spent points
  jmp return

pStatPoints:
  dq 0

StatPointsGrabber:
  jmp newmem
  nop
return:

[DISABLE]
StatPointsGrabber:
  db 29 BB 78 01 00 00

unregistersymbol(pStatPoints)
unregistersymbol(StatPointsGrabber)
dealloc(newmem)"""

