source = """
[ENABLE]
// Fixed AOB: Added the missing '00' at the end of the cmp instruction wildcard
aobscanmodule(TrueGodRoll,GameAssembly.dll,55 55 56 57 41 56 48 8B EC 48 83 EC 78 80 3D ? ? ? ? 00 48 8B F9)
alloc(newmem,$1000,TrueGodRoll)

label(code)
label(return)
label(bForceGodRoll)

registersymbol(bForceGodRoll)
registersymbol(TrueGodRoll)

newmem:
  // Check our toggle
  cmp dword ptr [bForceGodRoll], 1
  jne code

  // Toggle is ON. RCX holds the RollDice structure pointer.
  // 1. Flip the developer's "alwaysNat20" switch (Offset 59)
  mov byte ptr [rcx+59], 1

  // 2. Force the ability modifier to +99 for visual disrespect (Offset 88)
  mov dword ptr [rcx+88], (int)99

code:
  // Execute the 6-byte prologue exactly as the engine wrote it
  db 55 55 56 57 41 56
  jmp return

// Variables
bForceGodRoll:
  dd 1                     // Defaults to ON.

TrueGodRoll:
  jmp newmem
  nop
return:

[DISABLE]
TrueGodRoll:
  db 55 55 56 57 41 56

unregistersymbol(bForceGodRoll)
unregistersymbol(TrueGodRoll)
dealloc(newmem)"""

