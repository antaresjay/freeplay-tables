[[cheat]]
id = "hp"
name = "HP"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Esoteric Ebb.exe
  Version:
  Date   : 2026-03-06
  Author : wajrak

  This script does blah blah blah
}


[ENABLE]
aobscanmodule(HPGrabber,GameAssembly.dll,01 BA EC 00 00 00 48 8B 46 58 48 85 C0)
alloc(newmem,$1000,HPGrabber)

label(code)
label(return)
label(check_heal)
label(pHealth)
label(bGodMode)
label(bHealMultEnable)
label(iHealMult)

registersymbol(pHealth)
registersymbol(bGodMode)
registersymbol(bHealMultEnable)
registersymbol(iHealMult)
registersymbol(HPGrabber)

newmem:
  mov [pHealth],rdx          // Siphon the base address

  test edi, edi              // Check if EDI is positive or negative
  jns check_heal             // If positive (Sign flag is 0), it's a heal. Jump to heal logic.

  // --- DAMAGE LOGIC ---
  cmp dword ptr [bGodMode], 1 // Are we taking damage AND is God Mode on?
  jne code                   // If God Mode is off, let the damage happen normally.

  xor edi, edi               // God Mode is ON. Nullify the damage by setting EDI to 0.
  jmp code

check_heal:
  // --- HEAL LOGIC ---
  cmp dword ptr [bHealMultEnable], 1
  jne code                   // If heal multiplier is off, proceed normally.

  imul edi,[iHealMult]       // Multiply the heal amount in EDI!

code:
  add [rdx+000000EC],edi     // Original instruction executes here
  jmp return

// Variables
pHealth:
  dq 0
bGodMode:
  dd 0                       // Default to 0 (Off)
bHealMultEnable:
  dd 0                       // Default to 0 (Off)
iHealMult:
  dd (int)10

HPGrabber:
  jmp newmem
  nop
return:

[DISABLE]
HPGrabber:
  db 01 BA EC 00 00 00

unregistersymbol(pHealth)
unregistersymbol(bGodMode)
unregistersymbol(bHealMultEnable)
unregistersymbol(iHealMult)
unregistersymbol(HPGrabber)
dealloc(newmem)"""

