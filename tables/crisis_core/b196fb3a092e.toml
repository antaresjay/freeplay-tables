[[cheat]]
id = "base"
name = "base"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(time,89 B4 03 B4 00 00 00 8B) // should be unique
alloc(newmem,$1000,time)
alloc(base,4)
registersymbol(base)
label(code)
label(return)

newmem:

code:
  mov [base],rbx
  mov [rbx+rax+000000B4],esi
  jmp return

time:
  jmp newmem
  nop 2
return:
registersymbol(time)

[DISABLE]

time:
  db 89 B4 03 B4 00 00 00

unregistersymbol(time)
dealloc(newmem)
unregistersymbol(base)
dealloc(base)"""

