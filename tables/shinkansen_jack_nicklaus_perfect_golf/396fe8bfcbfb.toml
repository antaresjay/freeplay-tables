[[cheat]]
id = "playerinfo-base-address-scan-initialization-activate-this-first"
name = "PlayerInfo Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlayerInfo_basepointer)
registersymbol(PlayerInfo_update_enable)
registersymbol(PlayerInfo_set_enable)
registersymbol(PlayerInfo_team_value)

alloc(PlayerInfo_basepointer, 4)
alloc(PlayerInfo_update_enable, 4)
alloc(PlayerInfo_set_enable, 4)
alloc(PlayerInfo_team_value, 4)

PlayerInfo_team_value:
dd #0


[DISABLE]
unregistersymbol(PlayerInfo_basepointer)
unregistersymbol(PlayerInfo_update_enable)
unregistersymbol(PlayerInfo_set_enable)
unregistersymbol(PlayerInfo_team_value)

dealloc(PlayerInfo_basepointer)
dealloc(PlayerInfo_update_enable)
dealloc(PlayerInfo_set_enable)
dealloc(PlayerInfo_team_value)"""

[[cheat]]
id = "playerinfo-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerInfo Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerInfo_savedAOB)
label(PlayerInfo_returnhere)
label(PlayerInfo_originalcode)
label(PlayerInfo_exit)

label(PlayerInfo_update_exit)
label(PlayerInfo_set_exit)

registersymbol(PlayerInfo_savedAOB)

//2312D989 - E8 0AD8FEFF           - call 2311B198
//2312D98E - 83 C4 10              - add esp,10
// PlayerInfo:Write+29
//2312D991 - 0FB6 46 14            - movzx eax,byte ptr [esi+14]
//2312D995 - 85 C0                 - test eax,eax
//2312D997 - 75 0C                 - jne 2312D9A5
//2312D999 - 0FB6 46 15            - movzx eax,byte ptr [esi+15]
//2312D99D - 85 C0                 - test eax,eax
aobscan(PlayerInfo_searchedAOB, 0F B6 46 14 85 C0 75 0C)

alloc(PlayerInfo_newmem, 2048, PlayerInfo_searchedAOB)
alloc(PlayerInfo_temp1, 4, PlayerInfo_searchedAOB)


PlayerInfo_newmem:
mov [PlayerInfo_temp1], ebx

cmp byte ptr [esi+14], #1
jne PlayerInfo_set_exit

mov ebx, [PlayerInfo_team_value]
cmp dword ptr [esi+6c], ebx
jne PlayerInfo_set_exit

cmp dword ptr [PlayerInfo_update_enable], #0
je PlayerInfo_update_exit
mov [PlayerInfo_basepointer], esi
PlayerInfo_update_exit:

cmp dword ptr [PlayerInfo_set_enable], #0
je PlayerInfo_set_exit
mov [esi+94], #0
PlayerInfo_set_exit:

mov ebx, [PlayerInfo_temp1]


PlayerInfo_originalcode:
db 0F B6 46 14 85 C0
//movzx eax,byte ptr [esi+14]
//test eax,eax


PlayerInfo_exit:
jmp PlayerInfo_returnhere


PlayerInfo_searchedAOB:
PlayerInfo_savedAOB:
jmp PlayerInfo_newmem
nop
PlayerInfo_returnhere:


[DISABLE]
PlayerInfo_savedAOB:
db 0F B6 46 14 85 C0
//movzx eax,byte ptr [esi+14]
//test eax,eax

unregistersymbol(PlayerInfo_savedAOB)

dealloc(PlayerInfo_newmem)
dealloc(PlayerInfo_temp1)"""

