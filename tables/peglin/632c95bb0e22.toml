[[cheat]]
id = "increased-critical-damage"
name = "Increased Critical Damage"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
//Send@ModEngine
[ENABLE]

aobscanregion(critdmg,Battle.Attacks.Attack:GetModifiedDamagePerPeg+f40,Battle.Attacks.Attack:GetModifiedDamagePerPeg+f61,F3 0F 10 87 BC 00 00 00 F3 0F 5A C0 F3)
alloc(newmem,$1000,critdmg)

label(code)
label(return)

newmem:
mov [rdi+00BC],(float)999999
code:
  movss xmm0,[rdi+000000BC]
  jmp return

critdmg:
  jmp newmem
  nop 3
return:
registersymbol(critdmg)

[DISABLE]

critdmg:
  db F3 0F 10 87 BC 00 00 00

unregistersymbol(critdmg)
dealloc(newmem)"""
