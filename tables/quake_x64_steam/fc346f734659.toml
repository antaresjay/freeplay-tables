[[cheat]]
id = "god-mode"
name = "God Mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048,Quake_x64_steam.exe+2180D3) 
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here

originalcode:
mov [rsi+00000198],(float)999
movss xmm0,[rsi+00000198]

exit:
jmp returnhere

Quake_x64_steam.exe+2180D3:
jmp newmem
nop 3
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
Quake_x64_steam.exe+2180D3:
db F3 0F 10 86 98 01 00 00
//movss xmm0,[rsi+00000198]"""

