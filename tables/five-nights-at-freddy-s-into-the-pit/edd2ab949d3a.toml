[[cheat]]
id = "increase-item-amount-on-consumtion-doesn-t-work-with-flashlight"
name = "Increase item amount on consumtion (doesn't work with flashlight)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Five Nights at Freddy's Into the Pit.exe
  Date   : 2024-08-10
  Author : igromanru

  Increase item amount on consumtion (doesn't work with flashlight)
}

[ENABLE]
AOBScanRegion(noItemConsume, addOwnedAmountWithSprite, addOwnedAmountWithSprite+53, 4C 8B C0 44 03 45 ? 49 8B)
alloc(newmem,$100,noItemConsume)

label(noItemConsumeBackUp)
label(return)

newmem:
  push rax
  db 48 8B // mov rax, [rbp-18] // [rbp-18] = addAmount
  readMem(noItemConsume+5, 2)
  cmp eax, 0
  pop rax
  jg noItemConsumeBackUp
  db C7 // mov [rbp-18], 1
  readMem(noItemConsume+5, 2)
  dd (int)1
noItemConsumeBackUp:
  readMem(noItemConsume, 7)
  jmp return

noItemConsume:
  jmp newmem
  nop 2
return:

registersymbol(noItemConsume)
registersymbol(noItemConsumeBackUp)

[DISABLE]
noItemConsume:
  readMem(noItemConsumeBackUp, 7)

dealloc(newmem)
unregistersymbol(noItemConsume)
unregistersymbol(noItemConsumeBackUp)

{
// ORIGINAL CODE - INJECTION POINT: GameSave:AddOwnedAmount+2b

GameSave:AddOwnedAmount+1: 48 8B EC                       - mov rbp,rsp
GameSave:AddOwnedAmount+4: 48 83 EC 40                    - sub rsp,40
GameSave:AddOwnedAmount+8: 4C 89 75 F0                    - mov [rbp-10],r14
GameSave:AddOwnedAmount+c: 4C 89 7D F8                    - mov [rbp-08],r15
GameSave:AddOwnedAmount+10: 4C 8B F1                       - mov r14,rcx
GameSave:AddOwnedAmount+13: 4C 8B FA                       - mov r15,rdx
GameSave:AddOwnedAmount+16: 4C 89 45 E8                    - mov [rbp-18],r8
GameSave:AddOwnedAmount+1a: 4C 89 4D E0                    - mov [rbp-20],r9
GameSave:AddOwnedAmount+1e: 49 BB F0 39 07 8C 39 01 00 00  - mov r11,GameSave:GetOwnedAmount
GameSave:AddOwnedAmount+28: 41 FF D3                       - call r11
// ---------- INJECTING HERE ----------
GameSave:AddOwnedAmount+2b: 4C 8B C0                       - mov r8,rax
GameSave:AddOwnedAmount+2e: 44 03 45 E8                    - add r8d,[rbp-18]
// ---------- DONE INJECTING  ----------
GameSave:AddOwnedAmount+32: 49 8B CE                       - mov rcx,r14
GameSave:AddOwnedAmount+35: 49 8B D7                       - mov rdx,r15
GameSave:AddOwnedAmount+38: 4C 8B 4D E0                    - mov r9,[rbp-20]
GameSave:AddOwnedAmount+3c: 66 90                          - nop 2
GameSave:AddOwnedAmount+3e: 49 BB C0 11 5B 8B 39 01 00 00  - mov r11,GameSave:SetOwnedItem
GameSave:AddOwnedAmount+48: 41 FF D3                       - call r11
GameSave:AddOwnedAmount+4b: 4C 8B 75 F0                    - mov r14,[rbp-10]
GameSave:AddOwnedAmount+4f: 4C 8B 7D F8                    - mov r15,[rbp-08]
GameSave:AddOwnedAmount+53: 48 8D 65 00                    - lea rsp,[rbp+00]
}"""
