[[cheat]]
id = "infinite-battery-in-flashlight"
name = "Infinite Battery in Flashlight"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
  Author : Igromanru

  Infinite Battery in Flashlight
}

[ENABLE]
AOBScanRegion(infBattery, BatterySystem:get_currentBattery, BatterySystem:get_currentBattery+48, F3 0F 10 80 ? ? ? 00 F3 0F 5A C0)
alloc(newmem,$100,infBattery)

label(infBatteryBackUp)
label(batteryValue)
label(return)

newmem:
  movss xmm0,[batteryValue]
  db F3 0F 11 // movss [rax+00000220], xmm0
  readMem(infBattery+3, 5)
infBatteryBackUp:
  readMem(infBattery, 8)
  jmp return
batteryValue:
  dd (float)100.0

infBattery:
  jmp newmem
  nop 3
return:

registersymbol(infBattery)
registersymbol(infBatteryBackUp)

[DISABLE]
infBattery:
  readMem(infBatteryBackUp, 8)

dealloc(newmem)
unregistersymbol(infBattery)
unregistersymbol(infBatteryBackUp)

