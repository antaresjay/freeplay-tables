  Date   : 2025-12-02
  Author : CannonFodder

  This script does blah blah blah
}

[ENABLE]

//aobscan(CharacterStarInject,89 47 48 48 8B CF 66) // should be unique
aobscanregion(CharacterStarInject,EquipmentManager:set_CharaStar,EquipmentManager:set_CharaStar+34,89 47 48 48 8B CF 66) // should be unique
alloc(newmem,$1000,CharacterStarInject)

label(code)
label(return)

newmem:
  mov eax,#99999 //max star
  mov [rdi+4C],#-99999//used star
code:
  mov [rdi+48],eax
  mov rcx,rdi
  jmp return

CharacterStarInject:
  jmp newmem
  nop
return:
registersymbol(CharacterStarInject)

[DISABLE]

CharacterStarInject:
  db 89 47 48 48 8B CF

unregistersymbol(CharacterStarInject)
dealloc(newmem)

