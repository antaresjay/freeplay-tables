[[cheat]]
id = "edit-the-time-disable-previous-script-first"
name = "Edit the time (disable previous script first)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Istari-Win64-Shipping.exe
  Version:
  Date   : 2026-02-23
  Author : wajrak

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(INJECT,Istari-Win64-Shipping.exe,F3 0F 11 81 E8 04 00 00)
alloc(newmem,$1000,INJECT)
alloc(timer_ptr, 8) // Allocates memory to store our pointer

label(code)
label(return)

newmem:
  // This line secretly copies the base address (rcx) into our pointer variable
  mov [timer_ptr], rcx

code:
  // We keep this commented out so the timer remains completely frozen
  // movss [rcx+000004E8],xmm0
  jmp return

INJECT:
  jmp newmem
  nop 3
return:

registersymbol(INJECT)
registersymbol(timer_ptr) // Registers the pointer so CE can see it

[DISABLE]

INJECT:
  db F3 0F 11 81 E8 04 00 00

unregistersymbol(INJECT)
unregistersymbol(timer_ptr)
dealloc(newmem)"""

