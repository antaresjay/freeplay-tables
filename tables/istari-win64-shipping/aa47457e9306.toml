[[cheat]]
id = "stop-timer"
name = "Stop Timer"
category = "game"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Istari-Win64-Shipping.exe
  Version: 
  Date   : 2026-02-23
  Author : wajrak

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(INJECT,Istari-Win64-Shipping.exe,F3 0F 11 81 E8 04 00 00) // should be unique
alloc(newmem,$1000,INJECT)

label(code)
label(return)

newmem:

code:
  // We simply comment out the write instruction.
  // The game does the math for the timer, but is blocked from actually saving it to memory!
  // movss [rcx+000004E8],xmm0
  jmp return

INJECT:
  jmp newmem
  nop 3
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  // Restoring the original bytes allows the clock to tick again
  db F3 0F 11 81 E8 04 00 00

unregistersymbol(INJECT)
dealloc(newmem)

{
