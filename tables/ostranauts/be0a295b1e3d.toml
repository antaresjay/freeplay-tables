[[cheat]]
id = "increase-stack-size"
name = "Increase Stack Size"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(stack,48 8B ?? ?? 2B ?? 33 ?? ?? 8B ?? ?? 3B)

alloc(newmem,$1000,stack)

label(max)
label(skip)
label(doit)
label(stackAll)
label(stackBkp)
label(return)

newmem:
stackAll:
  jmp @f
  mov rax,#999
  jmp return
@@:
  readmem(stack,4)
  cmp rax,1
  jle @f
  jmp max
@@:
  push rbx
  push rdx
  test rdi,rdi
  je skip
  mov rdx,[rdi+38]
  test rdx,rdx
  je skip
  mov rbx,006F0074006F004D // Motor
  cmp rbx,[rdx+14]
  jne @f
  mov ebx,00000072
  cmp ebx,[rdx+1C]
  jne skip
  jmp doit
@@:
  mov rbx,0065007200630053 // Screen
  cmp rbx,[rdx+14]
  jne @f
  mov ebx,006E0065
  cmp ebx,[rdx+1C]
  jne skip
  jmp doit
@@:
  mov rbx,00680074006F004D // Motherboard
  cmp rbx,[rdx+14]
  jne @f
  mov rbx,006F006200720065
  cmp rbx,[rdx+1C]
  jne skip
  jmp doit
@@:
  mov rbx,0074006100650048 // Heat Sink
  cmp rbx,[rdx+14]
  jne @f
  mov rbx,006E006900530020
  cmp rbx,[rdx+1C]
  jne skip
  jmp doit
skip:
  pop rdx
  pop rbx
  readmem(stack+04,2)
  jmp return
doit:
  pop rdx
  pop rbx
max:
  mov rax,#999
  jmp return
stackBkp:
  readmem(stack,6)
  jmp return

stack:
  jmp newmem
  nop
return:
registersymbol(stack)
registersymbol(stackBkp)
registersymbol(stackAll)

{
alloc(stackBkp,6)
stackBkp:
  readmem(stack,6)
stack:
  db 90 B8
  dd #999
registersymbol(stack)
registersymbol(stackBkp)
}

[DISABLE]
stack:
  readmem(stackBkp,6)
unregistersymbol(stack)
unregistersymbol(stackBkp)
unregistersymbol(stackAll)
dealloc(newmem)

