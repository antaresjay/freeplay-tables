[[cheat]]
id = "enemy-ctrl-numpad-1"
name = "Enemy (Ctrl + Numpad 1)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Claymores of the Lost Kingdom.exe
// Author            : ndck76
// Executable Version: 2021.3.32.40366
// Game Version      : v1.0.241112
// Script Date       : 2024-11-27


[ENABLE]

aobscanregion(hp1,EnemyDisplay:Update,EnemyDisplay:Update+300,4C63xxxx48xxxxxx48xxxxxx66xxxxxxF3xxxxxxxxxxxxxxF3xxxxxxF3xxxxxxxxxxxxxxF3xxxxxxF3xxxxxxxxxxxxxxF3xxxxxxF3xxxxxxxxxxxxxxF3xxxxxx) //EnemyDisplay:Update+31
alloc(newmem,$1000,hp1)
alloc(data2,8)
alloc(hp1bkp,8)
registersymbol(data2)
registersymbol(hp1)
registersymbol(hp1bkp)
label(code)
label(return)

hp1bkp:
  readmem(hp1,8)

newmem:
  mov [data2],rcx

code:
  readmem(hp1,8)
  jmp return

hp1:
  jmp newmem
  nop 3
return:

[DISABLE]

hp1:
  readmem(hp1bkp,8)

unregistersymbol(*)
dealloc(*)"""

