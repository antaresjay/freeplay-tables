[[cheat]]
id = "gun-pointer"
name = "Gun Pointer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
  Game   : Tunguska
  Author : LeFiXER
  Date   : 09/12/2023
}
[ENABLE]

aobscan(aobGun,48 8B 86 ?? ?? ?? ?? 48 63 ?? ?? 85 C0 0F 8E ?? ?? ?? ?? 0F B6)
alloc(gnewmem,$100,aobGun)
alloc(rmaobGun,7,aobGun)
alloc(gunbase,8)
alloc(weaponitem,8)
alloc(barrel,8)
alloc(mag,8)
alloc(ammoitem,8)
label(gReturn)
label(original)

rmaobGun:
  readmem(aobGun,7)

gnewmem:
  push rbx
  mov [gunbase],rsi
  mov rbx,[rsi+38]
  mov [weaponitem],rbx
  mov rbx,[rsi+C8]
  mov [mag],rbx
  mov rbx,[rsi+B8]
  mov [barrel],rbx
  mov rbx,[rsi+198]
  mov [ammoitem],rbx
  pop rbx

original:
  readmem(aobGun,7)
  {
  mov rax,[rsi+000000C8]
  }
  jmp gReturn

aobGun:
  jmp gnewmem
  nop 2
gReturn:
registersymbol(aobGun)
registersymbol(rmaobGun)
registersymbol(gunbase)
registersymbol(weaponitem)
registersymbol(mag)
registersymbol(ammoitem)
registersymbol(barrel)
[DISABLE]

aobGun:
  readmem(rmaobGun,7)

unregistersymbol(aobGun)
unregistersymbol(rmaobGun)
unregistersymbol(gunbase)
unregistersymbol(weaponitem)
unregistersymbol(mag)
unregistersymbol(ammoitem)
unregistersymbol(barrel)
dealloc(gnewmem)
dealloc(rmaobGun)
dealloc(gunbase)
dealloc(weaponitem)
dealloc(mag)
dealloc(ammoitem)
dealloc(barrel)"""

