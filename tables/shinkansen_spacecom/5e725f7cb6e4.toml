[[cheat]]
id = "galaxyatwarclient-base-address-scan-initialization-activate-this-first"
name = "GalaxyAtWarClient Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

registersymbol(GalaxyAtWarClient_basepointer)
registersymbol(GalaxyAtWarClient_update_enable)
registersymbol(GalaxyAtWarClient_set_enable)

alloc(GalaxyAtWarClient_basepointer,4)
alloc(GalaxyAtWarClient_update_enable,4)
alloc(GalaxyAtWarClient_set_enable,4)


[DISABLE]

unregistersymbol(GalaxyAtWarClient_basepointer)
unregistersymbol(GalaxyAtWarClient_update_enable)
unregistersymbol(GalaxyAtWarClient_set_enable)

dealloc(GalaxyAtWarClient_basepointer)
dealloc(GalaxyAtWarClient_update_enable)
dealloc(GalaxyAtWarClient_set_enable)"""

[[cheat]]
id = "galaxyatwarclient-base-address-scan-to-activate-play-map-to-update-play-map"
name = "GalaxyAtWarClient Base Address Scan (To Activate: Play Map, To Update: Play Map)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(GalaxyAtWarClient_savedAOB)
label(GalaxyAtWarClient_returnhere)
label(GalaxyAtWarClient_originalcode)
label(GalaxyAtWarClient_exit)

label(GalaxyAtWarClient_update_exit)
label(GalaxyAtWarClient_set_exit)

registersymbol(GalaxyAtWarClient_savedAOB)

aobscan(GalaxyAtWarClient_searchedAOB,0F B6 80 9A 00 00 00 * * * * * * * * * * * 8B 40 10)

alloc(GalaxyAtWarClient_newmem,2048) //2kb should be enough
alloc(GalaxyAtWarClient_temp1,4)


GalaxyAtWarClient_newmem:
mov [GalaxyAtWarClient_temp1], ebx

cmp dword ptr [GalaxyAtWarClient_update_enable], #0
je GalaxyAtWarClient_update_exit
mov [GalaxyAtWarClient_basepointer], eax
GalaxyAtWarClient_update_exit:

cmp dword ptr [GalaxyAtWarClient_set_enable], #0
je GalaxyAtWarClient_set_exit
mov ebx, [eax+70]
mov [ebx+40], #9999999
GalaxyAtWarClient_set_exit:

mov ebx, [GalaxyAtWarClient_temp1]


GalaxyAtWarClient_originalcode:
db 0F B6 80 9A 00 00 00
//movzx eax,byte ptr [eax+0000009A]


GalaxyAtWarClient_exit:
jmp GalaxyAtWarClient_returnhere


GalaxyAtWarClient_searchedAOB:
GalaxyAtWarClient_savedAOB:
jmp GalaxyAtWarClient_newmem
nop
nop
GalaxyAtWarClient_returnhere:


[DISABLE]
GalaxyAtWarClient_savedAOB:
db 0F B6 80 9A 00 00 00
//movzx eax,byte ptr [eax+0000009A]

unregistersymbol(GalaxyAtWarClient_savedAOB)

dealloc(GalaxyAtWarClient_newmem)
dealloc(GalaxyAtWarClient_temp1)"""

