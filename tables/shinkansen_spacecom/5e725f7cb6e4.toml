[[cheat]]
id = "planetsystem-base-address-scan-to-activate-play-map-to-update-play-map"
name = "PlanetSystem Base Address Scan (To Activate: Play Map, To Update: Play Map)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(PlanetSystem_savedAOB)
label(PlanetSystem_returnhere)
label(PlanetSystem_originalcode)
label(PlanetSystem_exit)

label(PlanetSystem_update_exit)
label(PlanetSystem_set_exit)
label(PlanetSystem_productionset_exit)
label(PlanetSystem_defenseset_exit)

registersymbol(PlanetSystem_savedAOB)

aobscan(PlanetSystem_searchedAOB,8B 47 10 85 C0 74 16 8B 47 44)

alloc(PlanetSystem_newmem,2048) //2kb should be enough
alloc(PlanetSystem_temp1,4)


PlanetSystem_newmem:
mov [PlanetSystem_temp1], ebx

// OwnerID Check
cmp dword ptr [edi+ac], #0
jne PlanetSystem_defenseset_exit

cmp dword ptr [PlanetSystem_update_enable], #0
je PlanetSystem_update_exit
mov [PlanetSystem_basepointer], edi
PlanetSystem_update_exit:

cmp dword ptr [PlanetSystem_set_enable], #0
je PlanetSystem_set_exit
PlanetSystem_set_exit:

cmp dword ptr [edi+10], #0
je PlanetSystem_productionset_exit
cmp dword ptr [PlanetSystem_productionset_enable], #0
je PlanetSystem_productionset_exit
mov ebx, [edi+10]
mov [ebx+10], #9999
PlanetSystem_productionset_exit:

cmp dword ptr [PlanetSystem_defenseset_enable], #0
je PlanetSystem_defenseset_exit
mov byte ptr [edi+74], #1
mov [edi+78], #999
mov byte ptr [edi+84], #1
mov [edi+88], #999
PlanetSystem_defenseset_exit:

mov ebx, [PlanetSystem_temp1]


PlanetSystem_originalcode:
db 8B 47 10 85 C0
//mov eax,[edi+10]
//test eax,eax


PlanetSystem_exit:
jmp PlanetSystem_returnhere


PlanetSystem_searchedAOB:
PlanetSystem_savedAOB:
jmp PlanetSystem_newmem
PlanetSystem_returnhere:


[DISABLE]
PlanetSystem_savedAOB:
db 8B 47 10 85 C0
//mov eax,[edi+10]
//test eax,eax

unregistersymbol(PlanetSystem_savedAOB)

dealloc(PlanetSystem_newmem)
dealloc(PlanetSystem_temp1)"""

