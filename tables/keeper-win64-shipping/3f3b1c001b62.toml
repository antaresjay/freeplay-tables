[[cheat]]
id = "lighthouse-ctrl-numpad-1"
name = "Lighthouse (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Keeper-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.5.4.0
// Game Version      : v1218000
// Script Date       : 2025-12-23


[ENABLE]

aobscanmodule(master,Keeper-Win64-Shipping.exe,498Bxx498BxxFFxxxxxxxxxx84xx0F84xxxxxxxx4Dxxxxxxxxxxxx4D) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,6)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,6)

newmem:
  mov [data],r15

code:
  readmem(master,6)
  jmp return

master:
  jmp newmem
  nop
return:

[DISABLE]

master:
  readmem(masterbkp,6)

unregistersymbol(*)
dealloc(*)"""

