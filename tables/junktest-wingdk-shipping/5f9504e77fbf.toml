[[cheat]]
id = "junker-character-ctrl-numpad-1"
name = "Junker Character (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : junkTest-WinGDK-Shipping.exe
// Author            : ndck76
// Executable Version: 4.27.2.0
// Game Version      : Build.23637744
// Script Date       : 2026-06-19


[ENABLE]

aobscanmodule(master,junkTest-WinGDK-Shipping.exe,4Cxxxx4Cxxxxxx488Bxx488Bxx41FFxxxxxxxxxx4883xxxx493Bxx0F85) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,7)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,7)

newmem:
  mov [data],rdi

code:
  readmem(master,7)
  jmp return

master:
  jmp newmem
  nop 2
return:

[DISABLE]

master:
  readmem(masterbkp,7)

unregistersymbol(*)
dealloc(*)"""

