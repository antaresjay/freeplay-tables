[[cheat]]
id = "character-component-ctrl-numpad-1-click-on-any-ally-character-s-image-to-populate-value"
name = "Character Component (Ctrl + Numpad 1) {Click on any ally character's image to populate value}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Thysiastery.exe
// Author            : ndck76
// Executable Version: 2021.3.45.63631
// Game Version      : v1.0.12
// Script Date       : 2026-03-11


[ENABLE]

aobscanregion(hp1,CharacterSheetMenu:menuCharacterSelected,CharacterSheetMenu:menuCharacterSelected+2000,496397C0xx00004Dxxxxxxxxxxxx49xxxxxxxxxxxx4Cxxxx41xxxxxx41xxxxxx44xxxx41xxxxxx48xxxx83xxxx48xxxxxxxxxxxx49BBxxxxxxxxxxxx0000) //CharacterSheetMenu:menuCharacterSelected+732
alloc(newmem,$1000)
alloc(data,8)
alloc(hp1bkp,14)
registersymbol(data)
registersymbol(hp1)
registersymbol(hp1bkp)
label(code)
label(return)

hp1bkp:
  readmem(hp1,14)

newmem:
  mov [data],r15

code:
  readmem(hp1,14)
  jmp return

hp1:
  jmp far newmem
return:

[DISABLE]

hp1:
  readmem(hp1bkp,14)

unregistersymbol(*)
dealloc(*)"""

