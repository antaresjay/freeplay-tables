//15BC8A23 - 85 C0                 - test eax,eax
//15BC8A25 - 0F84 D6010000         - je 15BC8C01
//15BC8A2B - F3 0F10 86 B4000000   - movss xmm0,[rsi+000000B4]
//15BC8A33 - F3 0F5A C0            - cvtss2sd xmm0,xmm0
//15BC8A37 - F2 0F11 45 F0         - movsd [rbp-10],xmm0
