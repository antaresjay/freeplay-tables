registersymbol(VehicleControlPref_savedAOB)

//188C7B75 - 48 83 EC 18           - sub rsp,18
//188C7B79 - 48 8B F1              - mov rsi,rcx
// Zombotron.Components.Vehicles:VehicleControlPref:UpdateSounds+c
//188C7B7C - 0FB6 86 7D010000      - movzx eax,byte ptr [rsi+0000017D]
//188C7B83 - 85 C0                 - test eax,eax
//188C7B85 - 0F84 EA000000         - je 188C7C75
//188C7B8B - 0FB6 86 86010000      - movzx eax,byte ptr [rsi+00000186]
//188C7B92 - 85 C0                 - test eax,eax
//188C7B94 - 74 2E                 - je 188C7BC4
//188C7B96 - 48 8B 86 E0000000     - mov rax,[rsi+000000E0]
//188C7B9D - 48 8B C8              - mov rcx,rax
aobscan(VehicleControlPref_searchedAOB, 0F B6 86 7D 01 00 00 85 C0 * * * * * * 0F B6 86 86 01 00 00 85 C0 74 2E)

alloc(VehicleControlPref_newmem, 2048, VehicleControlPref_searchedAOB)
alloc(VehicleControlPref_temp1, 8, VehicleControlPref_searchedAOB)
alloc(VehicleControlPref_temp2, 8, VehicleControlPref_searchedAOB)
alloc(VehicleControlPref_temp3, 8, VehicleControlPref_searchedAOB)
alloc(VehicleControlPref_temp4, 8, VehicleControlPref_searchedAOB)
alloc(VehicleControlPref_temp5, 8, VehicleControlPref_searchedAOB)


VehicleControlPref_newmem:
mov [VehicleControlPref_temp1], rax
mov [VehicleControlPref_temp2], rbx
mov [VehicleControlPref_temp3], rcx
mov [VehicleControlPref_temp4], rdx

cmp dword ptr [VehicleControlPref_update_enable], #0
je VehicleControlPref_update_exit
mov [VehicleControlPref_basepointer], rsi
VehicleControlPref_update_exit:

cmp dword ptr [VehicleControlPref_godset_enable], #0
je VehicleControlPref_godset_exit
mov rbx, [rsi+118]
test rbx, rbx
