[[cheat]]
id = "weatherdata-base-address-scan-to-activate-load-game-to-update-play-game"
name = "WeatherData Base Address Scan (To Activate: Load Game, To Update: Play Game)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(WeatherData_savedAOB)
label(WeatherData_returnhere)
label(WeatherData_originalcode)
label(WeatherData_exit)

label(WeatherData_update_exit)
label(WeatherData_set_exit)

registersymbol(WeatherData_savedAOB)

//1230BBBD - 83 EC 10              - sub esp,10
//1230BBC0 - 8B 7D 08              - mov edi,[ebp+08]
// WeatherData:get_FogDensity+b
//1230BBC3 - D9 47 0C              - fld dword ptr [edi+0C]
//1230BBC6 - D9EE                  - fldz
//1230BBC8 - DFF1                  - fcomip st(0),st(1)
//1230BBCA - DDD8                  - fstp st(0)
//1230BBCC - 76 36                 - jna 1230BC04
//1230BBCE - 8B 47 08              - mov eax,[edi+08]
aobscan(WeatherData_searchedAOB, D9 47 0C D9 EE DF F1 DD D8)

alloc(WeatherData_newmem, 2048, WeatherData_searchedAOB)


WeatherData_newmem:
cmp dword ptr [WeatherData_update_enable], #0
je WeatherData_update_exit
mov [WeatherData_basepointer], edi
WeatherData_update_exit:

cmp dword ptr [WeatherData_set_enable], #0
je WeatherData_set_exit
mov [edi+c], (float)0
mov [edi+10], (float)0
WeatherData_set_exit:


WeatherData_originalcode:
db D9 47 0C D9 EE
//fld dword ptr [edi+0C]
//fldz


WeatherData_exit:
jmp WeatherData_returnhere


WeatherData_searchedAOB:
WeatherData_savedAOB:
jmp WeatherData_newmem
WeatherData_returnhere:


[DISABLE]
WeatherData_savedAOB:
db D9 47 0C D9 EE
//fld dword ptr [edi+0C]
//fldz

unregistersymbol(WeatherData_savedAOB)

dealloc(WeatherData_newmem)"""

