[[cheat]]
id = "agentgamemodel-base-address-scan-initialization-activate-this-first"
name = "AgentGameModel Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(AgentGameModel_basepointer)
registersymbol(AgentGameModel_update_enable)
registersymbol(AgentGameModel_set_enable)
registersymbol(AgentGameModel_attributesset_enable)
registersymbol(AgentGameModel_eatingset_enable)
registersymbol(AgentGameModel_ordereffectivenessset_enable)

alloc(AgentGameModel_basepointer, 4)
alloc(AgentGameModel_update_enable, 4)
alloc(AgentGameModel_set_enable, 4)
alloc(AgentGameModel_attributesset_enable, 4)
alloc(AgentGameModel_eatingset_enable, 4)
alloc(AgentGameModel_ordereffectivenessset_enable, 4)


[DISABLE]
unregistersymbol(AgentGameModel_basepointer)
unregistersymbol(AgentGameModel_update_enable)
unregistersymbol(AgentGameModel_set_enable)
unregistersymbol(AgentGameModel_attributesset_enable)
unregistersymbol(AgentGameModel_eatingset_enable)
unregistersymbol(AgentGameModel_ordereffectivenessset_enable)

dealloc(AgentGameModel_basepointer)
dealloc(AgentGameModel_update_enable)
dealloc(AgentGameModel_set_enable)
dealloc(AgentGameModel_attributesset_enable)
dealloc(AgentGameModel_eatingset_enable)
dealloc(AgentGameModel_ordereffectivenessset_enable)"""

[[cheat]]
id = "agentgamemodel-base-address-scan-to-activate-view-passenger-to-update-view-passenger"
name = "AgentGameModel Base Address Scan (To Activate: View Passenger, To Update: View Passenger)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(AgentGameModel_savedAOB)
label(AgentGameModel_returnhere)
label(AgentGameModel_originalcode)
label(AgentGameModel_exit)

label(AgentGameModel_update_exit)
label(AgentGameModel_set_exit)
label(AgentGameModel_attributesset_exit)
label(AgentGameModel_eatingset_exit)
label(AgentGameModel_ordereffectivenessset_exit)

registersymbol(AgentGameModel_savedAOB)

//16F50063 - 83 EC 08              - sub esp,08
//16F50066 - 8B 45 08              - mov eax,[ebp+08]
// AgentGameModel:GetVAWG+9
//16F50069 - 8B 40 24              - mov eax,[eax+24]
//16F5006C - 83 EC 08              - sub esp,08
//16F5006F - FF 75 0C              - push [ebp+0C]
//16F50072 - 50                    - push eax
//16F50073 - 39 00                 - cmp [eax],eax
//16F50075 - E8 16B2F5FF           - call 16EAB290
//16F5007A - 83 C4 10              - add esp,10
//16F5007D - 89 45 FC              - mov [ebp-04],eax
//16F50080 - 8B 45 08              - mov eax,[ebp+08]
//16F50083 - 8B 40 2C              - mov eax,[eax+2C]
aobscan(AgentGameModel_searchedAOB, 8B 40 24 83 EC 08 FF 75 0C 50 39 00 * * * * * 83 C4 10 89 45 FC)

alloc(AgentGameModel_newmem, 2048, AgentGameModel_searchedAOB)
alloc(AgentGameModel_temp1, 4, AgentGameModel_searchedAOB)


AgentGameModel_newmem:
mov [AgentGameModel_temp1], ecx

cmp dword ptr [AgentGameModel_update_enable], #0
je AgentGameModel_update_exit
mov [AgentGameModel_basepointer], eax
AgentGameModel_update_exit:

cmp dword ptr [AgentGameModel_set_enable], #0
je AgentGameModel_set_exit
AgentGameModel_set_exit:

cmp dword ptr [AgentGameModel_attributesset_enable], #0
je AgentGameModel_attributesset_exit
cmp dword ptr [eax+24], #0
je AgentGameModel_attributesset_exit
mov ecx, [eax+24]
cmp dword ptr [ecx+14], #0
je AgentGameModel_attributesset_exit
mov ecx, [ecx+14]
mov [ecx+10], #9999
mov [ecx+14], #9999
mov [ecx+18], #9999
mov [ecx+1c], #9999
AgentGameModel_attributesset_exit:

cmp dword ptr [AgentGameModel_eatingset_enable], #0
je AgentGameModel_eatingset_exit
cmp dword ptr [eax+3c], #0
je AgentGameModel_eatingset_exit
mov ecx, [eax+3c]
mov [ecx+28], (float)0
AgentGameModel_eatingset_exit:

cmp dword ptr [AgentGameModel_ordereffectivenessset_enable], #0
je AgentGameModel_ordereffectivenessset_exit
cmp dword ptr [eax+3c], #0
je AgentGameModel_ordereffectivenessset_exit
mov ecx, [eax+3c]
cmp dword ptr [ecx+14], #0
je AgentGameModel_ordereffectivenessset_exit
mov ecx, [ecx+14]
cmp dword ptr [ecx+14], #0
je AgentGameModel_ordereffectivenessset_exit
mov ecx, [ecx+14]
mov [ecx+10], (float)99
mov [ecx+14], (float)99
mov [ecx+18], (float)99
mov [ecx+1c], (float)99
mov [ecx+20], (float)99
mov [ecx+24], (float)99
mov [ecx+28], (float)99
mov [ecx+2c], (float)99
mov [ecx+30], (float)99
cmp dword ptr [eax+3c], #0
je AgentGameModel_ordereffectivenessset_exit
mov ecx, [eax+3c]
cmp dword ptr [ecx+18], #0
je AgentGameModel_ordereffectivenessset_exit
mov ecx, [ecx+18]
cmp dword ptr [ecx+14], #0
je AgentGameModel_ordereffectivenessset_exit
mov ecx, [ecx+14]
mov [ecx+10], (float)99
mov [ecx+14], (float)99
mov [ecx+18], (float)99
mov [ecx+1c], (float)99
mov [ecx+20], (float)99
mov [ecx+24], (float)99
mov [ecx+28], (float)99
mov [ecx+2c], (float)99
mov [ecx+30], (float)99
AgentGameModel_ordereffectivenessset_exit:

mov ecx, [AgentGameModel_temp1]


AgentGameModel_originalcode:
db 8B 40 24 83 EC 08
//mov eax,[eax+24]
//sub esp,08


AgentGameModel_exit:
jmp AgentGameModel_returnhere


AgentGameModel_searchedAOB:
AgentGameModel_savedAOB:
jmp AgentGameModel_newmem
nop
AgentGameModel_returnhere:


[DISABLE]
AgentGameModel_savedAOB:
db 8B 40 24 83 EC 08
//mov eax,[eax+24]
//sub esp,08

unregistersymbol(AgentGameModel_savedAOB)

dealloc(AgentGameModel_newmem)
dealloc(AgentGameModel_temp1)"""

