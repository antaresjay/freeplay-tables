[[cheat]]
id = "playermanager-base-address-scan-to-activate-view-map-to-update-view-map"
name = "PlayerManager Base Address Scan (To Activate: View Map, To Update: View Map)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerManager_savedAOB)
label(PlayerManager_returnhere)
label(PlayerManager_originalcode)
label(PlayerManager_exit)

label(PlayerManager_update_exit)
label(PlayerManager_set_exit)
label(PlayerManager_healthset_exit)
label(PlayerManager_resourcesset_exit)
label(PlayerManager_expset_exit)

registersymbol(PlayerManager_savedAOB)

//04735A6D - C7 87 58010000 00000000 - mov [edi+00000158],00000000
//04735A77 - D9 47 78              - fld dword ptr [edi+78]
//PlayerManager:CheckMapIDPosition+3a2
//04735A7A - D9 9F 70010000        - fstp dword ptr [edi+00000170]
//04735A80 - D9EE                  - fldz
//04735A82 - D9 9F 14010000        - fstp dword ptr [edi+00000114]
//04735A88 - D9 87 7C010000        - fld dword ptr [edi+0000017C]
aobscan(PlayerManager_searchedAOB, D9 9F 70 01 00 00 D9 EE)

alloc(PlayerManager_newmem, 2048)
alloc(PlayerManager_temp1, 4)


PlayerManager_newmem:
mov [PlayerManager_temp1], ebx

cmp dword ptr [PlayerManager_update_enable], #0
je PlayerManager_update_exit
mov [PlayerManager_basepointer], edi
PlayerManager_update_exit:

cmp dword ptr [PlayerManager_set_enable], #0
je PlayerManager_set_exit
PlayerManager_set_exit:

cmp dword ptr [PlayerManager_healthset_enable], #0
je PlayerManager_healthset_exit
mov ebx, [edi+80]
mov [edi+7c], ebx
PlayerManager_healthset_exit:

cmp dword ptr [PlayerManager_resourcesset_enable], #0
je PlayerManager_resourcesset_exit
mov [edi+84], #9999
mov [edi+88], (float)9999
mov [edi+8c], #9999
mov [edi+90], #9999
mov [edi+94], #9999
mov [edi+98], (float)9999
PlayerManager_resourcesset_exit:

cmp dword ptr [PlayerManager_expset_enable], #0
je PlayerManager_expset_exit
mov [edi+9c], #9999
PlayerManager_expset_exit:

mov ebx, [PlayerManager_temp1]


PlayerManager_originalcode:
db D9 9F 70 01 00 00
//fstp dword ptr [edi+00000170]


PlayerManager_exit:
jmp PlayerManager_returnhere


PlayerManager_searchedAOB:
PlayerManager_savedAOB:
jmp PlayerManager_newmem
nop
PlayerManager_returnhere:


[DISABLE]
PlayerManager_savedAOB:
db D9 9F 70 01 00 00
//fstp dword ptr [edi+00000170]

unregistersymbol(PlayerManager_savedAOB)

dealloc(PlayerManager_newmem)
dealloc(PlayerManager_temp1)"""

