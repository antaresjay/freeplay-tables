[[cheat]]
id = "player-manager-ctrl-numpad-1"
name = "Player Manager (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(currentcharacter,GameAssembly.dll,488Bxxxxxxxxxx83xxxxxxxxxxxx75xxE8xxxxxxxx33xx488BxxE8xxxxxxxx84xx0F84xxxxxxxx80xxxxxxxxxxxx75xx488DxxxxxxxxxxE8xxxxxxxxC6xxxxxxxxxxxx488Bxxxxxxxxxx488Bxxxx83) //PF2.player.PlayerManager.Update
alloc(newmem,$1000,currentcharacter)
alloc(data,8)
alloc(currentcharacterbkp,7)
registersymbol(data)
registersymbol(currentcharacter)
registersymbol(currentcharacterbkp)
label(code)
label(return)

currentcharacterbkp:
  readmem(currentcharacter,7)

newmem:
  mov [data],rbx

code:
  readmem(currentcharacter,7)
  jmp return

currentcharacter:
  jmp newmem
  nop 2
return:

[DISABLE]

currentcharacter:
  readmem(currentcharacterbkp,7)

unregistersymbol(*)
dealloc(*)"""

