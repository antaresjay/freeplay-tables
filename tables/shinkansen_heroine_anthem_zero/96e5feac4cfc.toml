alloc(StateRecorder_temp4, 8, StateRecorder_searchedAOB)


StateRecorder_newmem:
mov [StateRecorder_temp1], rax
mov [StateRecorder_temp2], rbx
mov [StateRecorder_temp3], rcx
mov [StateRecorder_temp4], rdx

cmp dword ptr [StateRecorder_update_enable], #0
je StateRecorder_update_exit
mov [StateRecorder_basepointer], rcx
StateRecorder_update_exit:

cmp dword ptr [StateRecorder_set_enable], #0
je StateRecorder_set_exit
