//238CEBF1 - 41 FF D3              - call r11d
//238CEBF4 - 48 83 C4 20           - add rsp,20
//238CEBF8 - 48 8B 47 38           - mov rax,[rdi+38]
//238CEBFC - 48 89 47 48           - mov [rdi+48],rax
//238CEC00 - 48 8B 47 38           - mov rax,[rdi+38]
aobscan(StateRecorder_searchedAOB, 48 63 91 FC 00 00 00 48 8B C8 48 83 EC 20 83 38 00 * * * * * * * * * * * * * 48 83 C4 20 48 8B 47 38)

