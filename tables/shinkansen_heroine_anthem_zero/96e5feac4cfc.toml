[[cheat]]
id = "creaturebase-base-address-scan-initialization-activate-this-first"
name = "CreatureBase Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(CreatureBase_basepointer)
registersymbol(CreatureBase_update_enable)
registersymbol(CreatureBase_set_enable)
registersymbol(CreatureBase_invincibleset_enable)
registersymbol(CreatureBase_jumpset_enable)
registersymbol(CreatureBase_mobilityset_enable)

alloc(CreatureBase_basepointer, 8)
alloc(CreatureBase_update_enable, 4)
alloc(CreatureBase_set_enable, 4)
alloc(CreatureBase_invincibleset_enable, 4)
alloc(CreatureBase_jumpset_enable, 4)
alloc(CreatureBase_mobilityset_enable, 4)


[DISABLE]
unregistersymbol(CreatureBase_basepointer)
unregistersymbol(CreatureBase_update_enable)
unregistersymbol(CreatureBase_set_enable)
unregistersymbol(CreatureBase_invincibleset_enable)
unregistersymbol(CreatureBase_jumpset_enable)
unregistersymbol(CreatureBase_mobilityset_enable)

dealloc(CreatureBase_basepointer)
dealloc(CreatureBase_update_enable)
dealloc(CreatureBase_set_enable)
dealloc(CreatureBase_invincibleset_enable)
dealloc(CreatureBase_jumpset_enable)
dealloc(CreatureBase_mobilityset_enable)"""

[[cheat]]
id = "creaturebase-base-address-scan-to-activate-play-level-to-update-play-level"
name = "CreatureBase Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(CreatureBase_savedAOB)
label(CreatureBase_returnhere)
label(CreatureBase_originalcode)
label(CreatureBase_exit)

label(CreatureBase_update_exit)
label(CreatureBase_set_exit)
label(CreatureBase_invincibleset_exit)
label(CreatureBase_jumpset_exit)
label(CreatureBase_mobilityset_exit)

registersymbol(CreatureBase_savedAOB)

//173853A1 - 48 89 85 38FEFFFF     - mov [rbp-000001C8],rax
//173853A8 - 48 89 85 48FEFFFF     - mov [rbp-000001B8],rax
// DebugUI:LateUpdate+861
//173853AF - 49 63 84 24 58020000  - movsxd  rax,dword ptr [r12+00000258]
//173853B7 - 48 89 85 40FEFFFF     - mov [rbp-000001C0],rax
//173853BE - B9 48C57204           - mov ecx,0472C548 : [046E1648]
//173853C3 - 48 83 EC 20           - sub rsp,20
aobscan(CreatureBase_searchedAOB, 49 63 84 24 58 02 00 00 48 89 85 40 FE FF FF)

alloc(CreatureBase_newmem, 2048, CreatureBase_searchedAOB)
alloc(CreatureBase_temp1, 8, CreatureBase_searchedAOB)
alloc(CreatureBase_temp2, 8, CreatureBase_searchedAOB)
alloc(CreatureBase_temp3, 8, CreatureBase_searchedAOB)
alloc(CreatureBase_temp4, 8, CreatureBase_searchedAOB)


CreatureBase_newmem:
mov [CreatureBase_temp1], rax
mov [CreatureBase_temp2], rbx
mov [CreatureBase_temp3], rcx
mov [CreatureBase_temp4], rdx

cmp dword ptr [CreatureBase_update_enable], #0
je CreatureBase_update_exit
mov [CreatureBase_basepointer], r12
CreatureBase_update_exit:

cmp dword ptr [CreatureBase_set_enable], #0
je CreatureBase_set_exit
CreatureBase_set_exit:

cmp dword ptr [CreatureBase_invincibleset_enable], #0
je CreatureBase_invincibleset_exit
mov byte ptr [r12+1dc], #1
mov [r12+20c], (float)99
CreatureBase_invincibleset_exit:

cmp dword ptr [CreatureBase_jumpset_enable], #0
je CreatureBase_jumpset_exit
mov ebx, [r12+1ec]
mov [r12+1e8], ebx
CreatureBase_jumpset_exit:

cmp dword ptr [CreatureBase_mobilityset_enable], #0
je CreatureBase_mobilityset_exit
mov [r12+168], (float)16
mov [r12+170], (float)7
CreatureBase_mobilityset_exit:

mov rax, [CreatureBase_temp1]
mov rbx, [CreatureBase_temp2]
mov rcx, [CreatureBase_temp3]
mov rdx, [CreatureBase_temp4]


CreatureBase_originalcode:
db 49 63 84 24 58 02 00 00
//movsxd  rax,dword ptr [r12+00000258]


CreatureBase_exit:
jmp CreatureBase_returnhere


CreatureBase_searchedAOB:
CreatureBase_savedAOB:
jmp CreatureBase_newmem
nop
nop
nop
CreatureBase_returnhere:


[DISABLE]
CreatureBase_savedAOB:
db 49 63 84 24 58 02 00 00
//movsxd  rax,dword ptr [r12+00000258]

unregistersymbol(CreatureBase_savedAOB)

dealloc(CreatureBase_newmem)
dealloc(CreatureBase_temp1)
dealloc(CreatureBase_temp2)
dealloc(CreatureBase_temp3)
dealloc(CreatureBase_temp4)"""

