[[cheat]]
id = "movement-settings"
name = "Movement Settings"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
{ Game   : hotlava.exe
  Version: 
  Date   : 2019-09-20
  Author : Anjinggila

  This script does blah blah blah
}

[ENABLE]

aobscanregion(MovSpeed,MovementSettings:Decelerate,MovementSettings:Decelerate+88,7c ? 01 00 00 41 ? d3 f3 0f 5a c0 f2 0f 5a e8 f3 0f 11 6e)
alloc(newmem,$1000)
alloc(showspeed,8)

label(code)
label(return)

newmem:
  mov [showspeed],rsi

code:
  movss [rsi+78],xmm5
  jmp return

MovSpeed+10:
  jmp newmem
return:
registersymbol(showspeed)
registersymbol(MovSpeed)

[DISABLE]

MovSpeed+10:
  db F3 0F 11 6E 78

unregistersymbol(showspeed)
unregistersymbol(MovSpeed)
dealloc(showspeed)
dealloc(newmem)"""

