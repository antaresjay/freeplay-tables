hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(player,DBXV.exe,69 C9 BC 03 00 00 8B 94 01 * * * * 8D B4) // should be unique
alloc(newmem,$1000)
alloc(player_ptr,4)
alloc(shared_ptr,4)

label(code)
label(return)

newmem:

code:
  imul ecx,ecx,000003BC
  mov [shared_ptr],eax
  mov [player_ptr],eax
  add [player_ptr],ecx
  jmp return

player:
  jmp code
  nop
return:
registersymbol(player)
registersymbol(player_ptr)
registersymbol(shared_ptr)

[DISABLE]
