[[cheat]]
id = "combat-hacks-and-pointers"
name = "Combat Hacks and Pointers"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(battle,DBXV.exe,F3 0F 10 83 C4 00 00 00 F3 0F 5E 83 C8 00 00 00 F3 0F 10)
alloc(newmem,$1000)
alloc(battle_ptr,128)
alloc(ai_disable,1)

label(code)
label(return)

ai_disable:
  db 0

newmem:
  cmp [ebx+2C],0
  je code
  cmp byte ptr [ai_disable],1
  jne code
  mov [ebx+34],0

code:
  push eax
  mov eax,[ebx+2C]
  mov [battle_ptr+eax*4],ebx
  movss xmm0,[ebx+000000C4]
  pop eax
  jmp return

battle:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(battle)
registersymbol(battle_ptr)
registersymbol(ai_disable)

[DISABLE]
battle:
  db F3 0F 10 83 C4 00 00 00
unregistersymbol(battle)
unregistersymbol(battle_ptr)
unregistersymbol(ai_disable)
dealloc(newmem)
dealloc(battle_ptr)
dealloc(ai_disable)"""

