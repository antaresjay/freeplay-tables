[[cheat]]
id = "unlimited-health"
name = "Unlimited Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(health,DBXV.exe,0F 57 C9 0F 2F CA 76)
alloc(newmem,$1000)
alloc(onehit,1)
alloc(damage,4)

label(code)
label(return)
label(kill)

damage:
  dd (float)99999.9

onehit:
  db 0

newmem:
  cmp [eax+2C],0
  jne kill
  xorps xmm2,xmm2
  jmp code

kill:
  cmp byte ptr [onehit],1
  jne code
  movss xmm2,[damage]

code:
  xorps xmm1,xmm1
  comiss xmm1,xmm2
  jmp return

health:
  jmp newmem
  nop
return:
registersymbol(health)
registersymbol(onehit)

[DISABLE]
health:
  db 0F 57 C9 0F 2F CA
unregistersymbol(health)
unregistersymbol(onehit)
dealloc(newmem)"""

