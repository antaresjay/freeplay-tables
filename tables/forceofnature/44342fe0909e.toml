[[cheat]]
id = "one-hit-kill"
name = "+ One Hit Kill"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game   : ForceOfNature.exe
  Version: 
  Date   : 2017-07-21
  Author : Jason

  CAlled when taking damage (healing too?  probably not)

  ESI: StaminaParent (with health at 88) - 64
  ECX - ""
  Actual StaminaParent: 2EDF073C, ESI and ECX are 2EDF07A0
}

[ENABLE]

aobscan(INJECT_DAMAGE,D9 46 24 D8 45 0C 83) // should be unique
alloc(newmem,$1000)

label(code)
label(skip)
label(player)
label(return)

newmem:

code:
  push eax
  mov eax, [globals+1004] // saved player StaminaBase
  cmp eax,0
  je skip // player pointer not set, so skip
  add eax,64
  cmp eax,esi
  je player

  // monster, make sure they have at most 1.0 health
  mov eax,(float)1.0
  cmp eax,[esi+24]
  jg skip // already under 1 health
  mov [esi+24],eax
  jmp skip

player:
  // player, if change in health is negative, make it 0
  cmp [ebp+0c],0
  jg skip
  mov [ebp+0c],0 // no damage for player

skip:
  pop eax
  fld dword ptr [esi+24]  // original code, esi is StaminaBase+64
  fadd dword ptr [ebp+0C] // original code, [ebp+0c] is change in health (i.e. -2.5 for 2.5 damage)
  jmp return

INJECT_DAMAGE:
  jmp newmem
  nop
return:
registersymbol(INJECT_DAMAGE)

[DISABLE]

INJECT_DAMAGE:
  db D9 46 24 D8 45 0C

unregistersymbol(INJECT_DAMAGE)
dealloc(newmem)

