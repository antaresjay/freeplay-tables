[[cheat]]
id = "dupe-items-hold-shift"
name = "+ Dupe Items (hold SHIFT)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : ForceOfNature.exe
  Version: 
  Date   : 2017-07-19
  Author : Jason

  This seems to save a new value (from [edi+0c]) of the quantity of an item
  after it gets lowered.  I'm kind of at a loss though, it seems the caller
  loads edx with the value from the same location (edi == esi?).  Both locations
  are called for the same inventory offset, maybe at different times?
}

[ENABLE]

aobscan(INJECT_CRAFTING_ITEMS,89 56 0C 83 7E 04 00 74 13) // should be unique
alloc(newmem,$1000)
define(VK_SHIFT,10)
define(VK_CONTROL,11)

label(code)
label(skip)
label(return)

newmem:

code:
  pushad
  push VK_SHIFT
  call GetAsyncKeyState
  test ax,ax
  popad

  jns skip
  cmp edx,[esi+0c]
  jg skip
  mov edx,[esi+0c]
skip:
  mov [esi+0C],edx
  cmp dword ptr [esi+04],00      // original code
  jmp return

INJECT_CRAFTING_ITEMS:
  jmp newmem
  nop
  nop
return:
registersymbol(INJECT_CRAFTING_ITEMS)

[DISABLE]

INJECT_CRAFTING_ITEMS:
  db 89 56 0C 83 7E 04 00

unregistersymbol(INJECT_CRAFTING_ITEMS)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: 1BDB6176

""+1BDB615E: C3                    -  ret 
""+1BDB615F: 00 4C DD D8           -  add [ebp+ebx*8-28],cl
""+1BDB6163: 1B 00                 -  sbb eax,[eax]
