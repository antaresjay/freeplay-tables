[[cheat]]
id = "craft-time-1s"
name = "+ Craft Time = 1s"
category = "game"
description = ""
hint = ""
type = "script"
source = """
{ Game   : ForceOfNature.exe
  Version: 
  Date   : 2017-07-19
  Author : Jason

  I [THINK] that[ebp+08] is current time (in second, i.e. 4675.80), and that
  [edi+04] is a set completion time (i.e. 4829.867676).  So I think I should
  make everything take at most 1 second...
}

[ENABLE]

aobscan(INJECT_COMPLETE,D9 45 08 D8 67 04 DD) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  dd (float)1.0 // maximum second to complete
  dd 0 // will be 1 second after current time?

code:
  push eax
  fld dword ptr [ebp+08] // current time
  fadd dword ptr [newmem]
  fstp dword ptr [newmem+4]
  mov eax,[newmem+4]
  cmp eax,[edi+0c] // completion time
  jge skip
  mov [edi+0c],eax // completion time
skip:
  pop eax
  fld dword ptr [ebp+08]
  fsub dword ptr [edi+04]
  jmp return

INJECT_COMPLETE:
  jmp code
  nop
return:
registersymbol(INJECT_COMPLETE)

[DISABLE]

INJECT_COMPLETE:
  db D9 45 08 D8 67 04

unregistersymbol(INJECT_COMPLETE)
dealloc(newmem)

