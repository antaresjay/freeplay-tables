""+1BDB6167: 00 68 DD              -  add [eax-23],ch
""+1BDB616A: D8 1B                 -  fcomp dword ptr [ebx]
""+1BDB616C: 68 C4 D9 1B 55        -  push 551BD9C4
""+1BDB6171: 8B EC                 -  mov ebp,esp
""+1BDB6173: 56                    -  push esi
""+1BDB6174: 8B F1                 -  mov esi,ecx
// ---------- INJECTING HERE ----------
""+1BDB6176: 89 56 0C              -  mov [esi+0C],edx
""+1BDB6179: 83 7E 04 00           -  cmp dword ptr [esi+04],00
// ---------- DONE INJECTING  ----------
""+1BDB617D: 74 13                 -  je 1BDB6192
""+1BDB617F: 8B 4E 04              -  mov ecx,[esi+04]
""+1BDB6182: FF 35 68 10 F0 04     -  push [04F01068]
""+1BDB6188: 8B D6                 -  mov edx,esi
""+1BDB618A: 8B 41 0C              -  mov eax,[ecx+0C]
""+1BDB618D: 8B 49 04              -  mov ecx,[ecx+04]
""+1BDB6190: FF D0                 -  call eax
""+1BDB6192: 5E                    -  pop esi
""+1BDB6193: 5D                    -  pop ebp
