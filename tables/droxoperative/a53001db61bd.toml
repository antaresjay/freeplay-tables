type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
aobscan(active,8B 91 38 02 00 00 52 57 B1 01 B8 20 00 00 00)
registersymbol(active)
registersymbol(exp)
registersymbol(crew)
registersymbol(credit)
label(crew)
label(credit)
label(exp)

label(armor)
label(energy)


registersymbol(armorE)
registersymbol(energyE)
registersymbol(ShieldE)
label(armorE)
label(energyE)
label(ShieldE)




newmem: //this is allocated memory, you have read,write,execute access
//place your code here
{
238 shield  +4 FF
148 energy  +4 FF
244 armor plating +4 FF
15c exp  +4 FF
188 credit
17c crew points
}
cmp ebx,10000
jae originalcode
//data
push esi
mov esi,[crew]
add [ecx+17c],esi
mov [crew],0
mov esi,[credit]
add [ecx+188],esi
mov [credit],0
mov esi,[exp]
add [ecx+15c],esi
mov [exp],0
pop esi
/// Shield
cmp [ShieldE],0
je energy
fild dword ptr[ecx+0000023c]
fistp dword ptr[ecx+00000238]
///Energy
energy:
cmp [energyE],0
je armor
fild dword ptr[ecx+0000014c]
fistp dword ptr[ecx+148]
///Armor plating
armor:
cmp [armorE],0
je originalcode
fild dword ptr[ecx+248]
fistp dword ptr[ecx+244]
originalcode:
mov edx,[ecx+00000238]

exit:
jmp returnhere
crew:
dd 0
credit:
dd 0
exp:
dd 0
armorE:
dd 0
energyE:
dd 0
ShieldE:
dd 0
active://"DroxOperative.exe"+124134:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
active://
mov edx,[ecx+00000238]
//Alt: db 8B 91 38 02 00 00
unregistersymbol(active)
unregistersymbol(exp)
unregistersymbol(crew)
unregistersymbol(credit)
unregistersymbol(armorE)
unregistersymbol(energyE)
unregistersymbol(ShieldE)"""

