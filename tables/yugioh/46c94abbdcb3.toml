[[cheat]]
id = "infinite-normal-summons"
name = "Infinite Normal Summons"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
Game:               Yugioh Legacy of The Duelist: Link Evolution (Steam)
Game Version:       4815132 (Steam - Build ID)
Game Patch:         25 March 2020
Script Title:       Infinite Normal Summon/Set
Script Version:     v1.0 (Stable)
Date:               13 June 2026
Author:             Nikolaos

Acronyms:
NS = Normal Summon
NSet = Normal Set
H1 = Hook 1 is responsible for this feature.

Description:
- Allows the player to Normal Summon or Normal Set multiple times per turn.
- Prevents the player-side 0x80 NS/NSet restriction bit from being set.
- Preserves all other player action/state flags.
- Opponent NS/NSet restriction remains unchanged.
}

[ENABLE]

// =====================================
// H1 - Infinite Normal Summon/Set
// Skip Player 0x80 Restriction Bit
// =====================================

define(PlayerActionState,YuGiOh.exe+3497DD8)
define(OpponentActionState,YuGiOh.exe+3498B6C)

aobscanmodule(NSBit80Writer,YuGiOh.exe,0F BA E8 07 89 84 11 98 01 00 00 48 83 C4 30 5B C3)
alloc(newmem_ns,$1000,NSBit80Writer)

label(original_ns)
label(writeState_ns)
label(return_ns)

newmem_ns:

// ===================================================
// NS/NSet Side Check Section
// ===================================================

{
 Original instruction sequence:

 bts eax,07
 mov [rcx+rdx+00000198],eax

 This sets bit 7, which adds the 0x80 NS/NSet restriction flag.

 Effective action-state address being written:

 [rcx+rdx+198]

 Observed side/register behavior at this hook:

 Player:
   EBX = 0
   RCX = 0
   [RCX+RDX+198] = PlayerActionState

 Opponent:
   EBX = 1
   RCX = D94
   [RCX+RDX+198] = OpponentActionState
}

 test ebx,1
 jne original_ns

// =====================================
// Modified Code:
// Player side skips 0x80 restriction bit
// =====================================

{
 Player side:

 Skip bts eax,07 so the 0x80 NS/NSet restriction bit is not set.
 Then run the original write with all other flags preserved.
}

 jmp writeState_ns


// =====================================
// Original Code:
// Opponent side sets 0x80 normally
// =====================================

original_ns:

 bts eax,07


// =====================================
// Shared Write:
// Store final action-state value
// =====================================

writeState_ns:

 mov [rcx+rdx+00000198],eax
 jmp return_ns


// Return to game code, padded out gap till next instruction.

NSBit80Writer:
 jmp newmem_ns
 nop 6

return_ns:

registersymbol(NSBit80Writer)

[DISABLE]

// Restore H1

NSBit80Writer:
 db 0F BA E8 07 89 84 11 98 01 00 00

unregistersymbol(NSBit80Writer)
dealloc(newmem_ns)"""

[[cheat]]
id = "core-monster-bp-hooks"
name = "Core Monster BP Hooks"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
Game:               Yugioh Legacy of The Duelist: Link Evolution (Steam)
Game Version:       4815132 (Steam - Build ID)
Game Patch:         25 March 2020
Script Title:       Monster BP Core Hooks
Script Version:     v1.0 (Stable)
Date:               13 June 2026
Author:             Nikolaos

Acronyms:
BP = Battle Position
BP_CORE_ACTIVE = Shared flag set by this core script.
BP_INF_ACTIVE = Shared flag set by Infinite Atk/Def Position Changes.
BP_MULTI_ATTACK_ACTIVE = Shared flag set by Infinite Monster Attacks.
INSTANT_BP_ACTIVE = Shared flag set by Instant Monster Flip/Summon Position Changes.
INSTANT_BP_44_USED = Per-slot latch used by Instant BP for one-time 41h / 44h handling.

Description:
- Shared core hook script for monster BP features.
- Owns the standard BP restriction writer hook used by both Instant BP and Infinite BP.
- Owns the MP2 post-attack cleanup hook used by Infinite BP.
- Owns the final attack-used writer hook used by Infinite Monster Attacks.
- Owns the Instant BP legality hook used by Instant Monster Flip/Summon Position Changes.
- Does not enable Instant BP, Infinite BP, or Infinite Monster Attacks by itself.
- Must be enabled before using the child feature scripts.

H1:
- Watches the actual BP-change restriction writer.
- If Infinite BP is active, suppresses the standard 0x40 BP lock write for player monsters.
- If Instant BP is active, marks the per-slot face-up latch when a real BP change occurs
  from 41h or 44h so those states can be allowed once but not infinitely.

H2:
- Runs during MP2 transition.
- If Infinite BP is active, clears only the 0x40 BP restriction bit from player monsters.
- Preserves the 0x80 attack-state bit so monsters do not regain attacks from Infinite BP.

H3:
- Runs after the game sets bit 7 using:
    bts eax,07
    mov [rbx+rbp+60],eax
- If Infinite Monster Attacks is active, clears only the 0x80 attack-used bit
  from player monster zones.
- Preserves 0x40 so BP restriction behaviour remains separate from attack behaviour.

H4:
- Runs at the BP legality check.
- If Instant BP is active, bypasses fresh summon/set/flip BP restrictions for player monsters.
- Allows 4Ah, 50h, and 54h states immediately.
- Allows 41h and 44h once per slot using INSTANT_BP_44_USED.
- Allows 5Ah only when Infinite BP and Core Hooks are active.
- Preserves original TEST flags, JE behaviour, registers, FLIP effects, and summon processing.
}

[ENABLE]

// =====================================
// Shared Feature Flags / Latches
// =====================================

globalalloc(BP_CORE_ACTIVE,1)
globalalloc(BP_INF_ACTIVE,1)
globalalloc(BP_MULTI_ATTACK_ACTIVE,1)
globalalloc(INSTANT_BP_ACTIVE,1)
globalalloc(INSTANT_BP_44_USED,5)

// =====================================
// Player Monster Slot Flag Addresses
// =====================================

define(PlayerMonsterSlot1Flags,YuGiOh.exe+3497CA0)
define(PlayerMonsterSlot2Flags,YuGiOh.exe+3497CB8)
define(PlayerMonsterSlot3Flags,YuGiOh.exe+3497CD0)
define(PlayerMonsterSlot4Flags,YuGiOh.exe+3497CE8)
define(PlayerMonsterSlot5Flags,YuGiOh.exe+3497D00)

// =====================================
// Enable Core Hooks
// =====================================

BP_CORE_ACTIVE:
  db 01


// =====================================
// H1 - Shared Standard BP Switch Hook
//
// Original instruction:
//   or dword ptr [rax+rsi+03497CA0],40
//
// Responsibilities:
// - Infinite BP:
//   Suppress 0x40 lock writes for player
//   monster zones only.
//
// - Instant BP:
//   Mark face-up one-time latch when a real
//   BP change occurs from 41h or 44h.
// =====================================

aobscanmodule(INJECT_BP_CORE_H1,YuGiOh.exe,83 8C 30 A0 7C 49 03 40)
alloc(newmem_bp_core_h1,$1000,INJECT_BP_CORE_H1)

label(player_bp_core_h1)
label(mark44used_bp_core_h1)
label(checkinf_bp_core_h1)
label(original_bp_core_h1)
label(skip_bp_core_h1)
label(return_bp_core_h1)

label(slot1_bp_core_h1)
label(slot2_bp_core_h1)
label(slot3_bp_core_h1)
label(slot4_bp_core_h1)
label(slot5_bp_core_h1)

newmem_bp_core_h1:

  // Preserve CPU state
  pushfq
  push rax
  push rcx
  push rdx
  push r8

  // Effective slot flag address
  lea rdx,[rax+rsi+03497CA0]

  // Match exact player monster slot
  mov rax,PlayerMonsterSlot1Flags
  cmp rdx,rax
  je slot1_bp_core_h1

  mov rax,PlayerMonsterSlot2Flags
  cmp rdx,rax
  je slot2_bp_core_h1

  mov rax,PlayerMonsterSlot3Flags
  cmp rdx,rax
  je slot3_bp_core_h1

  mov rax,PlayerMonsterSlot4Flags
  cmp rdx,rax
  je slot4_bp_core_h1

  mov rax,PlayerMonsterSlot5Flags
  cmp rdx,rax
  je slot5_bp_core_h1

  // Not a player monster slot
  jmp original_bp_core_h1


slot1_bp_core_h1:
  mov r8,INSTANT_BP_44_USED
  jmp player_bp_core_h1

slot2_bp_core_h1:
  mov r8,INSTANT_BP_44_USED+1
  jmp player_bp_core_h1

slot3_bp_core_h1:
  mov r8,INSTANT_BP_44_USED+2
  jmp player_bp_core_h1

slot4_bp_core_h1:
  mov r8,INSTANT_BP_44_USED+3
  jmp player_bp_core_h1

slot5_bp_core_h1:
  mov r8,INSTANT_BP_44_USED+4
  jmp player_bp_core_h1


player_bp_core_h1:

  // Instant BP support:
  // If a real BP change occurs from 41h or 44h,
  // mark this slot's face-up latch as used.
  cmp byte ptr [INSTANT_BP_ACTIVE],1
  jne checkinf_bp_core_h1

  mov ecx,[rdx]

  // Fresh Face-Up Summon
  cmp ecx,41
  je mark44used_bp_core_h1

  // Fresh Face-Up Special Summon / 44h state
  cmp ecx,44
  je mark44used_bp_core_h1

  jmp checkinf_bp_core_h1


mark44used_bp_core_h1:

  mov byte ptr [r8],1


checkinf_bp_core_h1:

  // Infinite BP support:
  // If Infinite BP is active, skip the normal 0x40 lock write.
  cmp byte ptr [BP_INF_ACTIVE],1
  je skip_bp_core_h1

  jmp original_bp_core_h1


skip_bp_core_h1:

  // Restore CPU state
  pop r8
  pop rdx
  pop rcx
  pop rax
  popfq

  // Player slot + Infinite BP active:
  // Skip standard 0x40 restriction write.
  jmp return_bp_core_h1


original_bp_core_h1:

  // Restore CPU state
  pop r8
  pop rdx
  pop rcx
  pop rax
  popfq

  // Original instruction
  or dword ptr [rax+rsi+03497CA0],40

  jmp return_bp_core_h1


INJECT_BP_CORE_H1:
  jmp newmem_bp_core_h1
  nop 3

return_bp_core_h1:

registersymbol(INJECT_BP_CORE_H1)


// =====================================
// H2 - Shared MP2 Post-Attack Hook
//
// Original instruction:
//   and dword ptr [rax+rdi+60],FFFFFDFF
//
// Infinite BP support only.
// Preserves the game's original cleanup,
// then clears only 0x40 for player monster
// zones when Infinite BP is active.
// =====================================

aobscanmodule(INJECT_BP_CORE_H2,YuGiOh.exe,81 64 38 60 FF FD FF FF)
alloc(newmem_bp_core_h2,$1000,INJECT_BP_CORE_H2)

label(clear40_bp_core_h2)
label(skip_bp_core_h2)
label(return_bp_core_h2)

newmem_bp_core_h2:

  // Original instruction
  and dword ptr [rax+rdi+60],FFFFFDFF

  // Preserve CPU state after original flags are produced
  pushfq
  push rax
  push rcx
  push rdx

  // Only apply MP2 BP cleanup if Infinite BP is active
  cmp byte ptr [BP_INF_ACTIVE],1
  jne skip_bp_core_h2

  // Effective slot flag address
  lea rdx,[rax+rdi+60]

  // Match exact player monster slot
  mov rcx,PlayerMonsterSlot1Flags
  cmp rdx,rcx
  je clear40_bp_core_h2

  mov rcx,PlayerMonsterSlot2Flags
  cmp rdx,rcx
  je clear40_bp_core_h2

  mov rcx,PlayerMonsterSlot3Flags
  cmp rdx,rcx
  je clear40_bp_core_h2

  mov rcx,PlayerMonsterSlot4Flags
  cmp rdx,rcx
  je clear40_bp_core_h2

  mov rcx,PlayerMonsterSlot5Flags
  cmp rdx,rcx
  je clear40_bp_core_h2

  jmp skip_bp_core_h2


clear40_bp_core_h2:

  // Clear only 0x40 BP restriction bit.
  // Keep 0x80 so Infinite BP does not regain attack access.
  and dword ptr [rdx],FFFFFFBF


skip_bp_core_h2:

  // Restore CPU state
  pop rdx
  pop rcx
  pop rax
  popfq

  jmp return_bp_core_h2


INJECT_BP_CORE_H2:
  jmp newmem_bp_core_h2
  nop 3

return_bp_core_h2:

registersymbol(INJECT_BP_CORE_H2)


// =====================================
// H3 - Shared Multi-Attack Hook
//
// Original instructions:
//   mov [rbx+rbp+60],eax
//   jmp YuGiOh.exe+146DEC
//
// This hook runs after the game sets bit 7:
//   bts eax,07
//
// Infinite Monster Attacks support only.
// If active, clears only the 0x80 attack-used
// bit from player monster zones.
// =====================================

aobscanmodule(INJECT_BP_CORE_H3,YuGiOh.exe,89 44 2B 60 E9 A0 00 00 00)
alloc(newmem_bp_core_h3,$1000,INJECT_BP_CORE_H3)

label(clear80_bp_core_h3)
label(skip_bp_core_h3)
label(return_bp_core_h3)

newmem_bp_core_h3:

  // Original write after bts eax,07
  mov [rbx+rbp+60],eax

  // Preserve CPU state
  pushfq
  push rax
  push rcx
  push rdx

  // Only apply multi-attack cleanup if Infinite Monster Attacks is active
  cmp byte ptr [BP_MULTI_ATTACK_ACTIVE],1
  jne skip_bp_core_h3

  // Effective slot flag address
  lea rdx,[rbx+rbp+60]

  // Match exact player monster slot
  mov rcx,PlayerMonsterSlot1Flags
  cmp rdx,rcx
  je clear80_bp_core_h3

  mov rcx,PlayerMonsterSlot2Flags
  cmp rdx,rcx
  je clear80_bp_core_h3

  mov rcx,PlayerMonsterSlot3Flags
  cmp rdx,rcx
  je clear80_bp_core_h3

  mov rcx,PlayerMonsterSlot4Flags
  cmp rdx,rcx
  je clear80_bp_core_h3

  mov rcx,PlayerMonsterSlot5Flags
  cmp rdx,rcx
  je clear80_bp_core_h3

  jmp skip_bp_core_h3


clear80_bp_core_h3:

  // Clear only 0x80 attack-used bit.
  // Keep 0x40 so BP restriction behaviour stays separate.
  and dword ptr [rdx],FFFFFF7F


skip_bp_core_h3:

  // Restore CPU state
  pop rdx
  pop rcx
  pop rax
  popfq

  // Original overwritten jump destination
  jmp YuGiOh.exe+146DEC


INJECT_BP_CORE_H3:
  jmp newmem_bp_core_h3
  nop 4

return_bp_core_h3:

registersymbol(INJECT_BP_CORE_H3)


// =====================================
// H4 - Instant BP Legality Check Hook
//
// Original bytes:
//   je YuGiOh.exe+??????
//   mov eax,[YuGiOh.exe+3330284]
//
// Responsibilities:
// - If Instant BP is active, allow player
//   monsters through specific fresh summon,
//   set, flip, and flip-resolved BP checks.
// - Uses INSTANT_BP_44_USED for safe one-time
//   41h / 44h handling.
// - Preserves original TEST flags and JE logic.
// =====================================

aobscanmodule(INJECT_BP_CORE_H4,YuGiOh.exe,74 20 8B 05 2F 03 31 03)
alloc(newmem_bp_core_h4,$1000,INJECT_BP_CORE_H4)

label(original_bp_core_h4)
label(forceallow_bp_core_h4)
label(jumpallow_bp_core_h4)
label(return_bp_core_h4)

label(slotfound_bp_core_h4)
label(check5A_bp_core_h4)
label(not5A_bp_core_h4)
label(check41_bp_core_h4)
label(check44_bp_core_h4)
label(check_faceup_one_time_bp_core_h4)
label(check_faceup_core_bp_core_h4)

label(slot1_bp_core_h4)
label(slot2_bp_core_h4)
label(slot3_bp_core_h4)
label(slot4_bp_core_h4)
label(slot5_bp_core_h4)

newmem_bp_core_h4:

  // Preserve CPU state
  pushfq
  push rax
  push rcx
  push rdx

  // Only apply Instant BP legality bypass if Instant BP is active
  cmp byte ptr [INSTANT_BP_ACTIVE],1
  jne original_bp_core_h4

  // Effective slot flag address
  lea rax,[r12+r13+03497CA0]

  // Match exact player monster slot
  mov rcx,PlayerMonsterSlot1Flags
  cmp rax,rcx
  je slot1_bp_core_h4

  mov rcx,PlayerMonsterSlot2Flags
  cmp rax,rcx
  je slot2_bp_core_h4

  mov rcx,PlayerMonsterSlot3Flags
  cmp rax,rcx
  je slot3_bp_core_h4

  mov rcx,PlayerMonsterSlot4Flags
  cmp rax,rcx
  je slot4_bp_core_h4

  mov rcx,PlayerMonsterSlot5Flags
  cmp rax,rcx
  je slot5_bp_core_h4

  // Not a player monster slot
  jmp original_bp_core_h4


slot1_bp_core_h4:
  mov rdx,INSTANT_BP_44_USED
  jmp slotfound_bp_core_h4

slot2_bp_core_h4:
  mov rdx,INSTANT_BP_44_USED+1
  jmp slotfound_bp_core_h4

slot3_bp_core_h4:
  mov rdx,INSTANT_BP_44_USED+2
  jmp slotfound_bp_core_h4

slot4_bp_core_h4:
  mov rdx,INSTANT_BP_44_USED+3
  jmp slotfound_bp_core_h4

slot5_bp_core_h4:
  mov rdx,INSTANT_BP_44_USED+4
  jmp slotfound_bp_core_h4


slotfound_bp_core_h4:

  // Read slot flags
  mov ecx,[rax]

  // Do not reset the face-up latch while the monster is still in
  // a face-up instant BP state.
  cmp ecx,41
  je check5A_bp_core_h4

  cmp ecx,44
  je check5A_bp_core_h4

  // Reset this slot's face-up latch when it leaves 41h / 44h states.
  // This prevents stale latch data carrying into future summons.
  mov byte ptr [rdx],00


check5A_bp_core_h4:

  // Flip Resolved: 5Ah
  // Only bypass if Infinite BP and Core Hooks are active.
  cmp ecx,5A
  jne not5A_bp_core_h4

  cmp byte ptr [BP_INF_ACTIVE],1
  jne original_bp_core_h4

  cmp byte ptr [BP_CORE_ACTIVE],1
  je forceallow_bp_core_h4

  jmp original_bp_core_h4


not5A_bp_core_h4:

  // Fresh Flip: 4Ah
  cmp ecx,4A
  je forceallow_bp_core_h4

  // Fresh Set: 50h
  cmp ecx,50
  je forceallow_bp_core_h4

  // Fresh Face-Down Special Summon from Graveyard: 54h
  cmp ecx,54
  je forceallow_bp_core_h4


check41_bp_core_h4:

  // Fresh Face-Up Summon: 41h
  cmp ecx,41
  je check_faceup_one_time_bp_core_h4


check44_bp_core_h4:

  // Fresh Face-Up Special Summon / BP-restricted state: 44h
  cmp ecx,44
  jne original_bp_core_h4


check_faceup_one_time_bp_core_h4:

  // If Infinite BP is active, allow 41h / 44h freely.
  cmp byte ptr [BP_INF_ACTIVE],1
  jne check_faceup_core_bp_core_h4

  cmp byte ptr [BP_CORE_ACTIVE],1
  je forceallow_bp_core_h4


check_faceup_core_bp_core_h4:

  // Safe one-time 41h / 44h support requires Core Hooks.
  // H1 marks this latch after the real BP change occurs.
  cmp byte ptr [BP_CORE_ACTIVE],1
  jne original_bp_core_h4

  // If this slot's face-up instant BP change has not been used yet,
  // allow it once.
  cmp byte ptr [rdx],00
  je forceallow_bp_core_h4

  // 41h / 44h already used for this slot.
  jmp original_bp_core_h4


original_bp_core_h4:

  // Restore registers
  pop rdx
  pop rcx
  pop rax

  // Restore original TEST flags
  popfq

  // Original JE behaviour
  je jumpallow_bp_core_h4

  // Original overwritten instruction
  mov eax,[YuGiOh.exe+3330284]

  jmp return_bp_core_h4


forceallow_bp_core_h4:

  // Restore registers
  pop rdx
  pop rcx
  pop rax

  // Restore original TEST flags
  popfq

  // Force original JE destination
  jmp jumpallow_bp_core_h4


jumpallow_bp_core_h4:

  // Original JE destination
  jmp INJECT_BP_CORE_H4+22


INJECT_BP_CORE_H4:
  jmp newmem_bp_core_h4
  nop 3

return_bp_core_h4:

registersymbol(INJECT_BP_CORE_H4)


[DISABLE]

// =====================================
// Disable Core Hooks
// =====================================

BP_CORE_ACTIVE:
  db 00


// Restore H1

INJECT_BP_CORE_H1:
  db 83 8C 30 A0 7C 49 03 40

unregistersymbol(INJECT_BP_CORE_H1)
dealloc(newmem_bp_core_h1)


// Restore H2

INJECT_BP_CORE_H2:
  db 81 64 38 60 FF FD FF FF

unregistersymbol(INJECT_BP_CORE_H2)
dealloc(newmem_bp_core_h2)


// Restore H3

INJECT_BP_CORE_H3:
  db 89 44 2B 60 E9 A0 00 00 00

unregistersymbol(INJECT_BP_CORE_H3)
dealloc(newmem_bp_core_h3)


// Restore H4

INJECT_BP_CORE_H4:
  db 74 20 8B 05 2F 03 31 03

unregistersymbol(INJECT_BP_CORE_H4)
dealloc(newmem_bp_core_h4)"""

