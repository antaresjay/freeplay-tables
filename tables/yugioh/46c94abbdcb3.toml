type = "script"
source = """
{
Game:               Yugioh Legacy of The Duelist: Link Evolution (Steam)
Game Version:       4815132 (Steam - Build ID)
Game Patch:         25 March 2020
Script Title:       Same Turn - Set Quickplay Spell & Trap Activation
Script Version:     v1.0 (Stable)
Date:               13 June 2026
Author:             Nikolaos

Acronyms:
STTA = Same Turn Trap Activation

Description:
- When a player sets a Quickplay Spell or Trap, it can be activated on the turn
  it is played.
- This will not bypass card specific restrictions, i.e., if another card needs,
  to be present, or a specifc condition outside of the stadard fresh play
  restriction.
}

[ENABLE]

// =====================================
// H1 - Same Turn Trap Activation
// Prevent Player Fresh-Play Flag Set
// =====================================

define(PlayerSpellSlot1FreshFlag,YuGiOh.exe+3497D48)
define(PlayerSpellSlot2FreshFlag,YuGiOh.exe+3497D60)
define(PlayerSpellSlot3FreshFlag,YuGiOh.exe+3497D78)
define(PlayerSpellSlot4FreshFlag,YuGiOh.exe+3497D90)
define(PlayerSpellSlot5FreshFlag,YuGiOh.exe+3497DA8)

aobscanmodule(FreshSTFlagWrite,YuGiOh.exe,83 C9 10 83 E0 EF 85 ED 0F 45 C8 42 89 4C 26 60)
alloc(newmem,1024,FreshSTFlagWrite)

label(code)
label(checkSpellSlot)
label(skipFreshFlag)
label(return)

newmem:

// ===================================================
// Fresh Spell/Trap Flag Address Section
// ===================================================

{
 Target fresh-play flag address being written:
 [rsi+r12+60]

 Fresh-play flag bit:
 0x10
}

 lea r11,[rsi+r12+60]

// ===================================================
// Player Spell/Trap Fresh-Flag Compare Section
// ===================================================

checkSpellSlot:

{
 If the target fresh-play flag address matches one of the player's
 spell/trap slot fresh flags, skip adding the 0x10 fresh-play flag.
}

 mov r10,PlayerSpellSlot1FreshFlag
 cmp r11,r10
 je skipFreshFlag

 mov r10,PlayerSpellSlot2FreshFlag
 cmp r11,r10
 je skipFreshFlag

 mov r10,PlayerSpellSlot3FreshFlag
 cmp r11,r10
 je skipFreshFlag

 mov r10,PlayerSpellSlot4FreshFlag
 cmp r11,r10
 je skipFreshFlag

 mov r10,PlayerSpellSlot5FreshFlag
 cmp r11,r10
 je skipFreshFlag

// =====================================
// Original Code:
// Add fresh-play flag normally
// =====================================

code:
 or ecx,10
 and eax,-11
 jmp return

// =====================================
// Modified Code:
// Skip fresh-play flag for player slots
// =====================================

skipFreshFlag:
 and eax,-11
 jmp return

// Return to game code.

FreshSTFlagWrite:
 jmp newmem
 nop

return:

registersymbol(FreshSTFlagWrite)

[DISABLE]

// Restore H1

FreshSTFlagWrite:
 db 83 C9 10 83 E0 EF

unregistersymbol(FreshSTFlagWrite)
dealloc(newmem)"""

