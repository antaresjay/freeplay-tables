[[cheat]]
id = "orbitcam-base-address-scan-initialization-activate-this-first"
name = "OrbitCam Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(OrbitCam_basepointer)
registersymbol(OrbitCam_update_enable)
registersymbol(OrbitCam_set_enable)
registersymbol(OrbitCam_healthset_enable)
registersymbol(OrbitCam_goldset_enable)
registersymbol(OrbitCam_cargoset_enable)
registersymbol(OrbitCam_crewset_enable)

alloc(OrbitCam_basepointer, 8)
alloc(OrbitCam_update_enable, 4)
alloc(OrbitCam_set_enable, 4)
alloc(OrbitCam_healthset_enable, 4)
alloc(OrbitCam_goldset_enable, 4)
alloc(OrbitCam_cargoset_enable, 4)
alloc(OrbitCam_crewset_enable, 4)


[DISABLE]
unregistersymbol(OrbitCam_basepointer)
unregistersymbol(OrbitCam_update_enable)
unregistersymbol(OrbitCam_set_enable)
unregistersymbol(OrbitCam_healthset_enable)
unregistersymbol(OrbitCam_goldset_enable)
unregistersymbol(OrbitCam_cargoset_enable)
unregistersymbol(OrbitCam_crewset_enable)

dealloc(OrbitCam_basepointer)
dealloc(OrbitCam_update_enable)
dealloc(OrbitCam_set_enable)
dealloc(OrbitCam_healthset_enable)
dealloc(OrbitCam_goldset_enable)
dealloc(OrbitCam_cargoset_enable)
dealloc(OrbitCam_crewset_enable)"""

[[cheat]]
id = "orbitcam-base-address-scan-to-activate-play-level-to-update-play-level"
name = "OrbitCam Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(OrbitCam_savedAOB)
label(OrbitCam_returnhere)
label(OrbitCam_originalcode)
label(OrbitCam_exit)

label(OrbitCam_update_exit)
label(OrbitCam_set_exit)
label(OrbitCam_healthset_exit)
label(OrbitCam_goldset_exit)
label(OrbitCam_cargoset_exit)
label(OrbitCam_crewset_exit)

registersymbol(OrbitCam_savedAOB)

//290E1200 - 41 FF D3              - call r11d
//290E1203 - 48 83 C4 20           - add rsp,20
// OrbitCam:Update+27
//290E1207 - 48 63 80 00010000     - movsxd  rax,dword ptr [rax+00000100]
//290E120E - 83 F8 08              - cmp eax,08
//290E1211 - 75 18                 - jne 290E122B
//290E1213 - 48 8B CE              - mov rcx,rsi
//290E1216 - 48 83 EC 20           - sub rsp,20
aobscan(OrbitCam_searchedAOB, 48 63 80 00 01 00 00 83 F8 08 75 18)

alloc(OrbitCam_newmem, 2048, OrbitCam_searchedAOB)
alloc(OrbitCam_temp1, 8, OrbitCam_searchedAOB)
alloc(OrbitCam_temp2, 8, OrbitCam_searchedAOB)
alloc(OrbitCam_temp3, 8, OrbitCam_searchedAOB)
alloc(OrbitCam_temp4, 8, OrbitCam_searchedAOB)


OrbitCam_newmem:
mov [OrbitCam_temp1], rax
mov [OrbitCam_temp2], rbx
mov [OrbitCam_temp3], rcx
mov [OrbitCam_temp4], rdx

cmp dword ptr [OrbitCam_update_enable], #0
je OrbitCam_update_exit
mov [OrbitCam_basepointer], rsi
OrbitCam_update_exit:

cmp dword ptr [OrbitCam_set_enable], #0
je OrbitCam_set_exit
OrbitCam_set_exit:

cmp dword ptr [OrbitCam_healthset_enable], #0
je OrbitCam_healthset_exit
cmp dword ptr [rsi+78], #0
je OrbitCam_healthset_exit
cmp qword ptr [rsi+78], #0
je OrbitCam_healthset_exit
mov rax, [rsi+78]
cmp dword ptr [rax+70], #0
je OrbitCam_healthset_exit
cmp qword ptr [rax+70], #0
je OrbitCam_healthset_exit
mov rax, [rax+70]
cmp dword ptr [rax+88], #0
je OrbitCam_healthset_exit
cmp qword ptr [rax+88], #0
je OrbitCam_healthset_exit
mov rbx, [rax+88]
fld [rbx+90]
fstp [rbx+94]
OrbitCam_healthset_exit:

cmp dword ptr [rsi+78], #0
je OrbitCam_cargoset_exit
cmp qword ptr [rsi+78], #0
je OrbitCam_cargoset_exit
mov rax, [rsi+78]
cmp dword ptr [rax+88], #0
je OrbitCam_cargoset_exit
cmp qword ptr [rax+88], #0
je OrbitCam_cargoset_exit
mov rbx, [rax+88]

cmp dword ptr [OrbitCam_goldset_enable], #0
je OrbitCam_goldset_exit
mov [rbx+c4], #9999999
OrbitCam_goldset_exit:

cmp dword ptr [OrbitCam_cargoset_enable], #0
je OrbitCam_cargoset_exit
mov byte ptr [rbx+9a], #1
mov [rbx+c0], #100
OrbitCam_cargoset_exit:

cmp dword ptr [OrbitCam_crewset_exit], #0
je OrbitCam_crewset_exit
cmp dword ptr [rsi+78], #0
je OrbitCam_crewset_exit
cmp qword ptr [rsi+78], #0
je OrbitCam_crewset_exit
mov rcx, [rsi+78]
cmp dword ptr [rcx+98], #0
je OrbitCam_crewset_exit
cmp qword ptr [rcx+98], #0
je OrbitCam_crewset_exit
mov rcx, [rcx+98]
mov [rcx+98], #100
OrbitCam_crewset_exit:

mov rax, [OrbitCam_temp1]
mov rbx, [OrbitCam_temp2]
mov rcx, [OrbitCam_temp3]
mov rdx, [OrbitCam_temp4]


OrbitCam_originalcode:
db 48 63 80 00 01 00 00
//movsxd  rax,dword ptr [rax+00000100]


OrbitCam_exit:
jmp OrbitCam_returnhere


OrbitCam_searchedAOB:
OrbitCam_savedAOB:
jmp OrbitCam_newmem
nop
nop
OrbitCam_returnhere:


[DISABLE]
OrbitCam_savedAOB:
db 48 63 80 00 01 00 00
//movsxd  rax,dword ptr [rax+00000100]

unregistersymbol(OrbitCam_savedAOB)

dealloc(OrbitCam_newmem)
dealloc(OrbitCam_temp1)
dealloc(OrbitCam_temp2)
dealloc(OrbitCam_temp3)
dealloc(OrbitCam_temp4)"""

