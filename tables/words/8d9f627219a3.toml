[[cheat]]
id = "encountercontroller"
name = "EncounterController"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Cursed Words.exe
  Version: 
  Date   : 2026-04-06
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,EncounterController:SubmitWord)
define(bytes,55 48 8B EC 48 81 EC 30 01 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,EncounterController:SubmitWord)

label(code)
label(return)

newmem:
mov [encountercontroller_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,00000130
  jmp return

encountercontroller_ptr:
dq 0

address:
  jmp newmem
  nop 6
return:
registersymbol(encountercontroller_ptr)

[DISABLE]

address:
  db bytes
  // push rbp
  // mov rbp,rsp
  // sub rsp,00000130

dealloc(newmem)
unregistersymbol(encountercontroller_ptr)"""

