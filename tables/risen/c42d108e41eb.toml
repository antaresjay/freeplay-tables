  cmp [rsi+r14*4+138], #211
  je code2
  mov [rsi+r14*4+20],edi
  jmp return

code2:
  mov edi, #0
  mov [rsi+r14*4+20],edi
  jmp return

Health_OHK:
  jmp newmem
return:
registersymbol(Health_OHK)

[DISABLE]

