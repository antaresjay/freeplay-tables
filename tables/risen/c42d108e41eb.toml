type = "script"
source = """
{ Game   : Risen.exe
  Version: 
  Date   : 2023-02-25
  Author : ASUS

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(Health_OHK,Game.dll,42 89 7C B6 20) // should be unique
alloc(newmem,$1000,Health_OHK)

label(code)
label(code2)
label(return)

newmem:
cmp [rsi+r14*4+A4], #1 // Offset A4 = Gut Animals Skill--should be set to 1
//cmp [rsi+r14*4+138], #291
jne code
mov edi, [rsi+r14*4+34]
mov [rsi+r14*4+20],edi
jmp return

