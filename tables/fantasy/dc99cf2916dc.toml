[[cheat]]
id = "infinite-item-usage-set-minimum-amount-on-use-sell"
name = "Infinite Item Usage / Set Minimum Amount On Use/Sell"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

/// This is called on gain of item
//aobscanmodule(ItemUsageAOB,"GameAssembly.dll",45 33 C0 48 8B CF 8D 14 18 E8 ?? ?? ?? ??) // should be unique
aobscanmodule(ItemUsageAOB,"GameAssembly.dll",45 33 C0 48 8B CF 8D 14 28 E8 ?? ?? ?? ??) // should be unique
registersymbol(ItemUsageAOB)
alloc(newmem,1024,ItemUsageAOB)

/// This is called on subtract of item
aobscanmodule(ItemUsageAOB2,"GameAssembly.dll",41 2B C7 45 33 C0 8B D0 48 8B CB E8 ?? ?? ?? ??) // should be unique
registersymbol(ItemUsageAOB2)
alloc(newmem2,1024,ItemUsageAOB2)

/// This is called on use of item
//aobscanmodule(ItemUsageAOB3,"GameAssembly.dll",8D 50 FF 45 33 C0 48 8B CB E8 ?? ?? ?? ?? 33 D2) // should be unique
aobscanmodule(ItemUsageAOB3,"GameAssembly.dll",8D 50 FF 45 33 C0 48 8B CB E8 ?? ?? ?? ?? 33 C9) // should be unique
registersymbol(ItemUsageAOB3)
alloc(newmem3,1024,ItemUsageAOB3)

///
label(return)
label(iSetMinimumAmount)
registersymbol(iSetMinimumAmount)

///
label(return2)

///
label(return3)

newmem:
  cmp rbx,[iSetMinimumAmount]
  jge SkipSetMinimumAmount
  mov ebx,[iSetMinimumAmount]
SkipSetMinimumAmount:
  test eax,eax
  jns originalcode
  xor rax,rax
  
originalcode:
  xor r8d,r8d
  mov rcx,rdi
  // lea edx,[rax+rbx]
  jmp return  

iSetMinimumAmount:
dq #20

newmem2:
  cmp eax,[iSetMinimumAmount]
  jge SkipSetMinimumAmount2
  mov eax,[iSetMinimumAmount]
SkipSetMinimumAmount2:
  xor r15d,r15d

originalcode2:
  sub eax,r15d
  xor r8d,r8d
  jmp return2

newmem3:
  cmp eax,[iSetMinimumAmount]
  jge SkipSetMinimumAmount3
  mov eax,[iSetMinimumAmount]
SkipSetMinimumAmount3:
originalcode3:
  //lea edx,[rax-01]
  { We Want Infinite Item Usage, so skip the -01 }
  mov edx,eax
  xor r8d,r8d
  jmp return3

///  
ItemUsageAOB:
  jmp newmem
  nop
  return:

ItemUsageAOB2:
  jmp newmem2
  nop
  return2:

ItemUsageAOB3:
  jmp newmem3
  nop
  return3:
  
[DISABLE]

ItemUsageAOB:
  db 45 33 C0 48 8B CF
  
///
unregistersymbol(ItemUsageAOB)
unregistersymbol(iSetMinimumAmount)

ItemUsageAOB2:
  db 41 2B C7 45 33 C0

unregistersymbol(ItemUsageAOB2)

ItemUsageAOB3:
  db 8D 50 FF 45 33 C0

unregistersymbol(ItemUsageAOB3)
  
dealloc(newmem)
dealloc(newmem2)
dealloc(newmem3)"""

