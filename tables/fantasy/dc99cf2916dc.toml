[[cheat]]
id = "enable-damage-modifier-god-mode-one-hit-kill"
name = "Enable Damage Modifier (God Mode, One Hit Kill)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(InfHPAOB,"GameAssembly.dll",89 7B 14 48 8B CB 48 8B 03 48 8B 90 88 01 00 00) // should be unique
registersymbol(InfHPAOB)
alloc(newmem,1024,InfHPAOB)

///
label(return)
label(bGodMode)
registersymbol(bGodMode)
label(bOneHitKill)
registersymbol(bOneHitKill)

newmem:
  cmp [rbx+14],edi
  jle originalcode
  mov [R12Save],r12
  mov [R13Save],r13
  mov [R14Save],r14
  mov [R15Save],r15
  { Update Our Local Copy of Character Parameter Pointers From The Base Pointers We Have }
  xor r12,r12
  mov r13,CurrentPlayerCharacterParameterPtr
  mov r15,CurrentPlayerCharacterBasePtrs
StartUpdateParameterLoop:
  mov r14,[r15+r12*8]
  test r14,r14
  je MyCleanUp1
  mov r14,[r14+28]
  test r14,r14
  je MyCleanUp1
  mov r14,[r14+10]
  mov [r13+r12*8],r14
  inc r12
  cmp r12,4
  jl StartUpdateParameterLoop  
  cmp rbx,[r13]
  je DoInfHP
  cmp rbx,[r13+08]
  je DoInfHP
  cmp rbx,[r13+10]
  je DoInfHP
  cmp rbx,[r13+18]
  je DoInfHP
  jmp CheckOneHitKill
DoInfHP:
  cmp [bGodMode],1
  jne MyCleanUp1
  mov edi,[rbx+14]
  jmp MyCleanUp1
CheckOneHitKill:
  cmp [bOneHitKill],1
  jne MyCleanUp1
  xor edi,edi
  jmp MyCleanUp1
  
MyCleanUp1:
  mov r12,[R12Save]
  mov r13,[R13Save]
  mov r14,[R14Save]
  mov r15,[R15Save]
  jmp originalcode
  
originalcode:
  mov [rbx+14],edi
  mov rcx,rbx
  jmp return

R12Save:
dq 0
R13Save:
dq 0
R14Save:
dq 0
R15Save:
dq 0
bGodMode:
dq 1
bOneHitKill:
dq 0
CurrentPlayerCharacterParameterPtr:
dq 0
dq 0
dq 0
dq 0
dq 0
dq 0
dq 0
dq 0
dq 0
dq 0
dq 0
dq 0
dq 0
dq 0
dq 0
dq 0
  
///  
InfHPAOB:
  jmp newmem
  nop
  return:
  
[DISABLE]

InfHPAOB:
  db 89 7B 14 48 8B CB
  
unregistersymbol(InfHPAOB)
unregistersymbol(bGodMode)
unregistersymbol(bOneHitKill)

dealloc(newmem)"""

