[[cheat]]
id = "unlimited-scrap"
name = "Unlimited Scrap"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//send@fearlessrevolution.com
[ENABLE]

aobscanmodule(scrap,GameAssembly.dll,89 50 3C 81 FA 88 13 00 00)
alloc(newmem,$1000,scrap)

label(code)
label(return)

newmem:

code:
  mov [rax+3C],#99999999
  cmp edx,00001388
  jmp return

scrap:
  jmp newmem
  nop 4
return:
registersymbol(scrap)

[DISABLE]

scrap:
  db 89 50 3C 81 FA 88 13 00 00

unregistersymbol(*)
dealloc(*)"""

