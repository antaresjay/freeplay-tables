[[cheat]]
id = "god-mode"
name = "God Mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//send@fearlessrevolution.com
[ENABLE]

aobscanmodule(health,GameAssembly.dll,F3 41 0F 11 47 4C)
alloc(newmem,$1000,health)
label(onehit)
label(onehitkill)
label(code)
label(return)

registersymbol(health)
registersymbol(onehitkill)

newmem:
cmp dword ptr [r15+34],41700000
jne onehit
movss xmm0,[r15+48]
jmp return

onehit:
cmp byte ptr [onehitkill],1
jne code
xorps xmm0,xmm0
jmp code

onehitkill:
dq 0

code:
  movss [r15+4C],xmm0
  jmp return

health:
  jmp newmem
  nop
return:


[DISABLE]

health:
  db F3 41 0F 11 47 4C

unregistersymbol(*)
dealloc(*)"""

