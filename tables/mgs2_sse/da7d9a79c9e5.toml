[[cheat]]
id = "unlock-all-available-weapons"
name = "Unlock All Available Weapons"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(unlockallweapons,mgs2_sse.exe,90 90 8B 44 24 04 8B 0D * * * * 0F BF 04 41 C3)
alloc(newmem,$1000,unlockallweapons)

label(code)
label(return)

registersymbol(unlockallweapons)

newmem:
  cmp word ptr [ecx+eax*2+48],#9999
  je code
  cmp word ptr [ecx+eax*2+48],1
  je code
  push word ptr [ecx+eax*2+48]
  pop word ptr [ecx+eax*2]

code:
  movsx eax,word ptr [ecx+eax*2]
  ret 
  jmp return

unlockallweapons+0C:
  jmp newmem
return:

[DISABLE]

unlockallweapons+0C:
  db 0F BF 04 41 C3

unregistersymbol(unlockallweapons)
dealloc(newmem)"""

