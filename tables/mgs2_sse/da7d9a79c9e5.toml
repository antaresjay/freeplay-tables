[[cheat]]
id = "inf-health"
name = "Inf Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(infhealth,mgs2_sse.exe,66 01 86 72 07 00 00)
alloc(newmem,$1000)

label(code)
label(return)

registersymbol(infhealth)

newmem:

code:
  add [esi+00000772],ax
  mov [esi+00000772],#200
  jmp return

infhealth:
  jmp newmem
  nop
  nop
return:

[DISABLE]

infhealth:
  db 66 01 86 72 07 00 00

unregistersymbol(infhealth)
dealloc(newmem)"""

