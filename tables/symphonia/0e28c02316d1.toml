[[cheat]]
id = "game-manager-ctrl-numpad-1"
name = "Game Manager (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Symphonia.exe
// Author            : ndck76
// Executable Version: 2021.3.39.15227
// Game Version      : v1.1.0
// Script Date       : 2024-12-14


[ENABLE]

aobscanregion(gamestate,MainCamera:ComputeHandheldPosition,MainCamera:ComputeHandheldPosition+600,486380xxxx000083xxxx0Fxxxxxxxxxx48B8xxxxxxxxxxxx00000Fxxxx85xx0Fxxxxxxxxxx66xxxxxxF2xxxxxxF3xxxxxxxxxxxxxx) //MainCamera:ComputeHandheldPosition+4e
alloc(newmem,$1000,gamestate)
alloc(data,8)
alloc(gamestatebkp,7)
registersymbol(data)
registersymbol(gamestate)
registersymbol(gamestatebkp)
label(code)
label(return)

gamestatebkp:
  readmem(gamestate,7)

newmem:
  mov [data],rax

code:
  readmem(gamestate,7)
  jmp return

gamestate:
  jmp newmem
  nop 2
return:

[DISABLE]

gamestate:
  readmem(gamestatebkp,7)

unregistersymbol(*)
dealloc(*)"""

