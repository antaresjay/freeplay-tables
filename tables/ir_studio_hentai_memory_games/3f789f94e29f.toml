type = "script"
source = """
{ Date   : 01-08-2022
  Author : Glowmoss
}

[ENABLE]

aobscanregion(MatchAny,PlaymatController:Compare,PlaymatController:Compare+fa,E8 ? ? ? ? 85 C0)
alloc(origMatch,6)

registersymbol(MatchAny origMatch)

origMatch:
  readmem(MatchAny+07,6)

MatchAny+07:
  db 90 90 90 90 90 90

[DISABLE]

MatchAny+07:
