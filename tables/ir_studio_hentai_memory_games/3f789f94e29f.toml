dealloc(*)"""

[[cheat]]
id = "set-time"
name = "Set Time"
category = "game"
description = ""
hint = ""
type = "script"
source = """
{ Date   : 01-08-2022
  Author : Glowmoss
}

[ENABLE]

aobscanregion(SetTime,TimerController:UpdateTime,TimerController:UpdateTime+4c,D9 5F 18 8B 47 0C)
alloc(newmem,128)
alloc(timer,4)

registersymbol(SetTime timer)
label(code return)

newmem:

code:
  fstp st(0)
  fld [timer]
  fstp dword ptr [edi+18]
  mov eax,[edi+0C]
  jmp return

timer:
  dd 0

SetTime:
  jmp newmem
  db 90
return:

[DISABLE]

SetTime:
  db D9 5F 18 8B 47 0C

unregistersymbol(*)
dealloc(*)"""

