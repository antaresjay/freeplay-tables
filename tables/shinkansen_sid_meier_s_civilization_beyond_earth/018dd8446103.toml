[[cheat]]
id = "faction-stats-base-address-scan-initialization-activate-this-first"
name = "Faction Stats Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

registersymbol(factionstats_basepointer)
registersymbol(factionstats_update_enable)
registersymbol(factionstats_set_enable)
