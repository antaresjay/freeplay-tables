[[cheat]]
id = "faction-stats-base-address-scan-to-update-mouseover-culture"
name = "Faction Stats Base Address Scan (To Update: Mouseover Culture)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(factionstats_savedAOB)
label(factionstats_returnhere)
label(factionstats_originalcode)
label(factionstats_exit)

label(factionstats_update_exit)
label(factionstatsset_exit)
label(factionstatsresourcesset_exit)
label(factionstatscultureset_exit)
label(factionstatsenergyset_exit)

registersymbol(factionstats_savedAOB)

aobscan(factionstats_searchedAOB,75 EB 8B 86 9C 00 00 00 5E C3)

alloc(factionstats_newmem,2048)
alloc(factionstats_temp1,4)


factionstats_newmem:
mov [factionstats_temp1], ebx

cmp dword ptr [factionstats_update_enable], #0
je factionstats_update_exit
mov [factionstats_basepointer], esi
factionstats_update_exit:

cmp dword ptr [factionstats_set_enable], #0
je factionstatsset_exit
factionstatsset_exit:

cmp dword ptr [factionstats_resourcesset_enable], #0
je factionstatsresourcesset_exit
mov [factionstats_resourcesset_enable], #0
mov ebx, [esi+bc0]
mov [ebx], #9999
mov [ebx+4], #9999
mov [ebx+8], #9999
mov [ebx+c], #9999
mov [ebx+10], #9999
mov [ebx+14], #9999
mov [ebx+18], #9999
mov [ebx+1c], #9999
mov [ebx+20], #9999
mov [ebx+24], #9999
mov [ebx+28], #9999
mov [ebx+2c], #9999
mov [ebx+30], #9999
mov [ebx+34], #9999
mov [ebx+38], #9999
mov [ebx+3c], #9999
mov [ebx+40], #9999
mov [ebx+44], #9999
factionstatsresourcesset_exit:

cmp dword ptr [factionstats_cultureset_enable], #0
je factionstatscultureset_exit
mov [factionstats_cultureset_enable], #0
mov [esi+9c], #9999999
factionstatscultureset_exit:

cmp dword ptr [factionstats_energyset_enable], #0
je factionstatsenergyset_exit
mov [factionstats_energyset_enable], #0
mov ebx, [esi+f4a4]
mov [ebx+8], #999999900
factionstatsenergyset_exit:

mov ebx, [factionstats_temp1]


factionstats_originalcode:
db 8B 86 9C 00 00 00
//mov eax,[esi+0000009C]


factionstats_exit:
jmp factionstats_returnhere


factionstats_searchedAOB + 2:
factionstats_savedAOB:
jmp factionstats_newmem
nop
factionstats_returnhere:


[DISABLE]
factionstats_savedAOB:
db 8B 86 9C 00 00 00
//mov eax,[esi+0000009C]

unregistersymbol(factionstats_savedAOB)

dealloc(factionstats_newmem)
dealloc(factionstats_temp1)"""

