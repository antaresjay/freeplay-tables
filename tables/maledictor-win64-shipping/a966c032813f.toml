type = "script"
source = """
// Game Executable   : MALEDICTOR-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.2.1.0
// Game Version      : Build.24442864 (Early Access)
// Script Date       : 2026-07-31


[ENABLE]

aobscanmodule(master,MALEDICTOR-Win64-Shipping.exe,488Bxx488BxxFFxxxxxxxxxx84xx74xx488Bxx488BxxFFxxxxxxxxxx84xx0F84) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,6)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,6)

newmem:
  mov [data],rax

code:
  readmem(master,6)
  jmp return

master:
  jmp newmem
  nop
return:

[DISABLE]

master:
  readmem(masterbkp,6)

unregistersymbol(*)
dealloc(*)"""

