[[cheat]]
id = "open-script"
name = "Open script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
  Author      ; Loki
  Game        ; Terraria.exe
  Version     ; 1.3.5.3
  Description ; Open script defining stuff
  Notes       ; This is broken :thonk:
}

define(InitPlayerBasePtr,Terraria.Main::DrawInterface_Resources_Life+3B3)
define(bytes,8B 82 40 03 00 00)

[ENABLE]

assert(InitPlayerBasePtr,bytes)
alloc(newmem,$1000)
alloc(player_base_ptr,4)

label(code)
label(return)

newmem:

code:
  mov [player_base_ptr],edx
  mov eax,[edx+00000340]
  jmp return

InitPlayerBasePtr:
  jmp newmem
  nop
return:
registersymbol(player_base_ptr)

[DISABLE]

InitPlayerBasePtr:
  db bytes
  //mov eax,[edx+00000340]
dealloc(newmem)
unregistersymbol(player_base_ptr)"""

