id = "player-pointer"
name = "Player Pointer"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Terraria.exe
  Version:
  Date   : 2017-04-22
  Author : Marcus101RR

  This script does the player pointer.
}

define(plyBase,Terraria.Main::DoUpdate+C9F)
define(bytes,8B 74 90 08 8B 86 BC 00 00 00)

[ENABLE]

assert(plyBase,bytes)
alloc(newmem,$1024)
alloc(pBase,1024)
alloc(pIndex,32)

label(code)
label(return)

registersymbol(pBase)
registersymbol(pIndex)

pBase:
dd 0

pIndex:
db 0

newmem:

code:
  mov [pIndex], edx
  push edx
  mov edx,[pIndex]
  lea ebx,[eax+edx*4+08]
  mov [pBase],ebx
  pop edx
  mov esi,[eax+edx*4+08]
  mov eax,[esi+000000BC]
  jmp return

plyBase:
  jmp newmem
  nop
  nop
  nop
  nop
  nop
return:

[DISABLE]

plyBase:
  db bytes
  // mov esi,[eax+edx*4+08]
  // mov eax,[esi+000000BC]

dealloc(newmem)

