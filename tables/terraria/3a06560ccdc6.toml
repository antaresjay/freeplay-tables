[[cheat]]
id = "playereditor"
name = "PlayerEditor"
category = "player"
description = ""
hint = ""
type = "script"
source = """
define(array, Terraria.Main::get_LocalPlayer+1)
define(arraybytes, ?? ?? ?? ?? 8B 15 ?? ?? ?? ?? 3B 50 04)

define(address, Terraria.Main::get_LocalPlayer+10)
define(bytes, 8B 44 90 08 C3)

[ENABLE]

assert(address, bytes)
assert(array, arraybytes)

alloc(newmem, 1)

label(code)
label(return)
label(myPlayer)
label(players)

registersymbol(myPlayer)
registersymbol(players)
////////////////////
newmem:
code:
  mov eax,[eax+edx*4+08]
  mov [myPlayer],eax
  ret
  jmp return

  myPlayer:
    dd 0

address:
  jmp newmem
return:
////////////////////
array:
players:
////////////////////
[DISABLE]

address:
  db bytes
  // mov eax,[eax+edx*4+08]
  // ret

unregistersymbol(*)
dealloc(*)"""

