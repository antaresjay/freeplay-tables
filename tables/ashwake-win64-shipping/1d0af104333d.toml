[[cheat]]
id = "player-character-ctrl-numpad-1"
name = "Player Character (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : ASHWAKE-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.5.4.0
// Game Version      : Build.23905965 (Early Access)
// Script Date       : 2026-06-28


[ENABLE]

aobscanmodule(master,ASHWAKE-Win64-Shipping.exe,488Bxx410FxxxxF2xxxxxxxxxxFF) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,7)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,7)

newmem:
  mov [data],rsi

code:
  readmem(master,7)
  jmp return

master:
  jmp newmem
  nop 2
return:

[DISABLE]

master:
  readmem(masterbkp,7)

unregistersymbol(*)
dealloc(*)"""

