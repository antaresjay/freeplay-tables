[[cheat]]
id = "no-bar-bill-not-visual"
name = "No Bar Bill (Not Visual)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,GB.Bar.Bill:GBUpdate)
define(bytes,55 48 8B EC 48 81 EC A0 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,GB.Bar.Bill:GBUpdate)

label(code)
label(return)

newmem:
mov [rcx+48],0

code:
  push rbp
  mov rbp,rsp
  sub rsp,000000A0
  jmp return

address:
  jmp newmem
  nop 6
return:

[DISABLE]

address:
  db bytes

dealloc(*)"""
