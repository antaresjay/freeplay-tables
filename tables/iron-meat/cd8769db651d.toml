[[cheat]]
id = "score-editor-ctrl-numpad-1"
name = "Score Editor (Ctrl + Numpad 1)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Iron Meat.exe
// Author            : ndck76
// Executable Version: 2022.3.35.4614
// Game Version      : v1.0.2
// Script Date       : 2024-09-30


define(address,Points:Update+72)
define(bytes,4C 63 28 EB 0D)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Points:Update+72)

label(code)
label(return)
label(data2)
registersymbol(data2)

newmem:

code:
  mov [data2],rax
  movsxd  r13,dword ptr [rax]
  jmp Points:Update+84
  jmp return

data2:
  db

address:
  jmp newmem
return:

[DISABLE]

address:
  db bytes
  // movsxd  r13,dword ptr [rax]
  // jmp Points:Update+84

dealloc(*)
unregistersymbol(*)"""

