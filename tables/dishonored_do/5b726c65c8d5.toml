registersymbol(Enable_Load)

newmem:
  cmp [Enable_Save],1
  je Save
  cmp [Enable_Load],1
  je Load
  jmp code

Save:
  mov [Enable_Save],0
  push rbx // Borrowing R register for 8 Bytes.
  mov rbx,[rax+80]
  mov [XPos],rbx
  mov rbx,[rax+84]
  mov [ZPos],rbx
  mov rbx,[rax+88]
  mov [YPos],rbx
  pop rbx
  jmp code

Load:
  mov [Enable_Load],0
  push rbx // Borrowing R register for 8 Bytes.
  mov rbx,[XPos]
  mov [rax+80],rbx
  mov rbx,[ZPos]
  mov [rax+84],rbx
  mov rbx,[YPos]
  mov [rax+88],rbx
  pop rbx
  jmp code

code:
  movss xmm1,[rax+00000088]
  jmp return

Store_Coords:

XPos:
  dd 0

YPos:
  dd 0

ZPos:
  dd 0

Enable_Save:
  dd 0

Enable_Load:
  dd 0

Teleport:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(Teleport)

[DISABLE]

Teleport:
  db F3 0F 10 88 88 00 00 00

unregistersymbol(Teleport)
unregistersymbol(Enable_Save)
unregistersymbol(Enable_Load)
