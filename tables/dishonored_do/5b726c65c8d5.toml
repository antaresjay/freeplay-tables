source = """
{ Game   : Dishonored_DO.exe
  Version: 
  Date   : 2017-09-26
  Author : Kalas

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(Teleport,Dishonored_DO.exe,F3 0F 10 88 88 00 00 00 F3 0F 58)
alloc(newmem,$100,Teleport)
