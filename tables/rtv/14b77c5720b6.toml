[[cheat]]
id = "enable-0-1"
name = "Enable 0.1"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(StringString,$process,41 54 55 57 56 53 48 83 EC 50 48 8B 42 08 48 89 CB 48 89 D6 48 85 C0)
registersymbol(StringString)

aobscanmodule(GDScript_Reload,$process,41 57 41 56 41 55 41 54 55 57 56 53 48 81 EC E8 02 00 00 48 C7 44 24 50 00 00 00 00 48 89 CB 41 89 D6 4C 8D A1 50 03 00 00 48 83 B9 50 03 00 00 00)
registersymbol(GDScript_Reload)

aobscanmodule(ObjectSetScript,$process,FF 90 40 01 00 00 48 89 46) // should be unique
alloc(newmem,$1000,ObjectSetScript)

label(code)
label(return)
label(pScriptVT)
registersymbol(pScriptVT)
newmem:

code:
  call qword ptr [rax+00000140] // GDScript::Instance_Create
  cmp qword ptr[pScriptVT],0
  jne return
  mov r9,[rax+18] // ScriptInstance->Script
  mov r9,[r9]
  mov [pScriptVT],r9
  jmp return
pScriptVT:
dq 0

ObjectSetScript:
  jmp newmem
  nop
return:
registersymbol(ObjectSetScript)

[DISABLE]

ObjectSetScript:
  db FF 90 40 01 00 00

unregistersymbol(*)
dealloc(newmem)"""

