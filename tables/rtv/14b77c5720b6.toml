  mov r10,[rsp+268]
  mov r9,[rsp+260]
  mov r8,[rsp+258]
  mov rbp,[rsp+250]
  mov rdi,[rsp+240]
  mov rsi,[rsp+238]
  mov rdx,[rsp+230]
  mov rcx,[rsp+228]
  mov rbx,[rsp+220]
  fxrstor qword [rsp+20]
  mov rsp,[rsp+248] //restore rsp
  pop rax
  popfq

  mov rax,[rbp+230]
code:
  mov rax,[rax+28]
  test rax,rax
  jmp return
UTCompare:
 xor rbx,rbx
_Cmp:
 mov r8d,[rdx+rbx]
 mov r9d,[rcx+rbx]
 cmp r8d,r9d
 jne _Skip
 cmp r8d,0
 jne short @f
  mov eax,1
  ret
 @@:
