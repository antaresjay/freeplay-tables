{ Game   : RTV.exe
  Version: 
  Date   : 2026-04-09
  Author : cfemen

  This script does blah blah blah
}

[ENABLE]
aobscanmodule(aobReadVectorFromScriptInstance,$process,48 8B 40 28 48 85 C0 74 49) // should be unique
