label(code)
label(return)
label(UT32Controller)
label(pControllerScriptInstance)
registersymbol(pControllerScriptInstance)
label(pSimulationScriptInstance)
registersymbol(pSimulationScriptInstance)
newmem:
  pushfq //save flags
  push rax
  mov rax,rsp
  and rsp,fffffffffffffff0 //align stack
  sub rsp,2A0 //allocate local space for scratchspace, the registers, and sse registers. And keep alignment
  //store state
  fxsave qword [rsp+20]
  mov [rsp+220],rbx
  mov [rsp+228],rcx
  mov [rsp+230],rdx
  mov [rsp+238],rsi
  mov [rsp+240],rdi
  mov [rsp+248],rax //rsp
  mov [rsp+250],rbp
  mov [rsp+258],r8
  mov [rsp+260],r9
  mov [rsp+268],r10
  mov [rsp+270],r11
  mov [rsp+278],r12
  mov [rsp+280],r13
  mov [rsp+288],r14
  mov [rsp+290],r15

  mov rax,[rbp+230]
  mov rax,[rax+18] // Script
  mov rcx,[rax+350]
  mov rdx,UT32Controller
  call UTCompare
  test eax,eax
  je short @f
    mov rax,[rbp+230]
    mov [pControllerScriptInstance],rax
  @@:

  mov rax,[rbp+230]
  mov rax,[rax+18] // Script
  mov rcx,[rax+350]
  mov rdx,UT32Simulation
  call UTCompare
  test eax,eax
  je short @f
    mov rax,[rbp+230]
    mov [pSimulationScriptInstance],rax
