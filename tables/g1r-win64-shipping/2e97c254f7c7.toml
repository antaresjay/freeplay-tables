source = """
{ Game   : G1R-Win64-Shipping.exe
  Version: Nyras Prologue
  Date   : 2025-03-03
  Author : R_X
}

[ENABLE]

aobscanmodule(pBase,G1R-Win64-Shipping.exe,0F 10 80 F0 01 00 00 F3 0F 10 4F) // should be unique
alloc(newmem,$1000,pBase)
alloc(base,8)

label(code)
label(return)

base:
dq 0

newmem:

code:
  mov [base],rax
  movups xmm0,[rax+000001F0]
  jmp return

pBase:
  jmp newmem
  nop 2
return:
registersymbol(pBase base)

[DISABLE]

pBase:
  db 0F 10 80 F0 01 00 00

unregistersymbol(*)
dealloc(*)"""
