[ENABLE]

aobscanmodule(ohk,GameAssembly.dll,F3xxxxxxxx0F57xxF3xxxxxx0F2FxxF3xxxxxxxx400F) //Enemy.DealDamage
alloc(newmem,$1000,ohk)
alloc(ohkbkp,5)
