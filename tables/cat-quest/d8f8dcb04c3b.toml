[[cheat]]
id = "enable-trainer"
name = "Enable Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Cat Quest.exe
  Version: 
  Date   : 2017-11-28
  Author : ReDevoP

  This script does blah blah blah
}

[ENABLE]

aobscan(INJECT,55 8B EC 57 56 83 EC 40 8B 7D 08 8B) // should be unique
alloc(newmem,$1000)
globalalloc(gameAdress,4)
globalalloc(base,4)
globalalloc(currency,4)
globalalloc(currentHealth,4)
globalalloc(speed,4)
label(code)
label(return)

newmem:
  push eax
  push ecx
  mov eax,[esp+C]
  mov [gameAdress],eax
  //speed take
  push eax
  mov eax,[eax+2c]
  mov eax,[eax+8]
  mov eax,[eax+18]
  mov eax,[eax+20]
  mov [speed],eax
  pop eax
  //end of speed
  mov eax,[eax+24]
  mov eax,[eax+64]
  //ecx for gold
  mov ecx,[eax+C]
  mov [currency],ecx
  //return eax
  mov eax,[eax+10]
  mov [base],eax
  mov eax,[eax+8]
  mov [currentHealth],eax
  pop ecx
  pop eax
code:
  push ebp
  mov ebp,esp
  push edi
  push esi
  jmp return

INJECT:
  jmp newmem
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 55 8B EC 57 56

unregistersymbol(INJECT)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: 13B0EA00

""+13B0E9ED: 00 00                 -  add [eax],al
""+13B0E9EF: 00 68 18              -  add [eax+18],ch
""+13B0E9F2: 44                    -  inc esp
""+13B0E9F3: 6E                    -  outsb 
""+13B0E9F4: 0B E9                 -  or ebp,ecx
""+13B0E9F6: 2E 16                 -  push ss
""+13B0E9F8: 19 F1                 -  sbb ecx,esi
""+13B0E9FA: 00 00                 -  add [eax],al
""+13B0E9FC: 00 00                 -  add [eax],al
""+13B0E9FE: 00 00                 -  add [eax],al
// ---------- INJECTING HERE ----------
""+13B0EA00: 55                    -  push ebp
""+13B0EA01: 8B EC                 -  mov ebp,esp
""+13B0EA03: 57                    -  push edi
""+13B0EA04: 56                    -  push esi
// ---------- DONE INJECTING  ----------
""+13B0EA05: 83 EC 40              -  sub esp,40
""+13B0EA08: 8B 7D 08              -  mov edi,[ebp+08]
""+13B0EA0B: 8B 05 64 8F 8B 12     -  mov eax,[128B8F64]
""+13B0EA11: 8B C8                 -  mov ecx,eax
""+13B0EA13: 39 09                 -  cmp [ecx],ecx
""+13B0EA15: 8B 40 64              -  mov eax,[eax+64]
""+13B0EA18: 8B 40 0C              -  mov eax,[eax+0C]
""+13B0EA1B: 8B C8                 -  mov ecx,eax
""+13B0EA1D: 39 09                 -  cmp [ecx],ecx
""+13B0EA1F: 0F B6 40 16           -  movzx eax,byte ptr [eax+16]
}"""

