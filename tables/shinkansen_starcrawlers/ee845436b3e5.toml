[[cheat]]
id = "game-static-base-address-scan-initialization-activate-this-first"
name = "Game_static Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Game_static_basepointer)
registersymbol(Game_static_update_enable)
registersymbol(Game_static_set_enable)
registersymbol(Game_static_creditsset_enable)
registersymbol(Game_static_slotsset_enable)

alloc(Game_static_basepointer, 8)
alloc(Game_static_update_enable, 4)
alloc(Game_static_set_enable, 4)
alloc(Game_static_creditsset_enable, 4)
alloc(Game_static_slotsset_enable, 4)


[DISABLE]
unregistersymbol(Game_static_basepointer)
unregistersymbol(Game_static_update_enable)
unregistersymbol(Game_static_set_enable)
unregistersymbol(Game_static_creditsset_enable)
unregistersymbol(Game_static_slotsset_enable)

dealloc(Game_static_basepointer)
dealloc(Game_static_update_enable)
dealloc(Game_static_set_enable)
dealloc(Game_static_creditsset_enable)
dealloc(Game_static_slotsset_enable)"""

[[cheat]]
id = "game-static-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Game_static Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Game_static_savedAOB)
label(Game_static_returnhere)
label(Game_static_originalcode)
label(Game_static_exit)

label(Game_static_update_exit)
label(Game_static_set_exit)
label(Game_static_creditsset_exit)
label(Game_static_slotsset_exit)

registersymbol(Game_static_savedAOB)

//05455D56 - 48 8B F1              - mov rsi,rcx
//05455D59 - 33 C0                 - xor eax,eax
// Game_static:Update+1b
//05455D5B - 48 89 85 48FFFFFF     - mov [rbp-000000B8],rax
//05455D62 - 89 85 50FFFFFF        - mov [rbp-000000B0],eax
//05455D68 - 48 89 85 58FFFFFF     - mov [rbp-000000A8],rax
//05455D6F - 89 85 60FFFFFF        - mov [rbp-000000A0],eax
//05455D75 - B9 61000000           - mov ecx,00000061
//05455D7A - 48 83 EC 20           - sub rsp,20
aobscan(Game_static_searchedAOB, 48 0F B6 00 85 C0 * * * * * * * * * * * F3 0F 10 00 F3 0F 5A C0 F2 0F 11 45 F0)

alloc(Game_static_newmem, 2048, Game_static_searchedAOB)
alloc(Game_static_temp1, 8, Game_static_searchedAOB)
alloc(Game_static_temp2, 8, Game_static_searchedAOB)
alloc(Game_static_temp3, 8, Game_static_searchedAOB)
alloc(Game_static_temp4, 8, Game_static_searchedAOB)
alloc(Game_static_temp5, 8, Game_static_searchedAOB)


Game_static_newmem:
mov [Game_static_temp1], rax
mov [Game_static_temp2], rbx
mov [Game_static_temp3], rcx
mov [Game_static_temp4], rdx

mov rdx, rax
sub rdx, 70

cmp dword ptr [Game_static_update_enable], #0
je Game_static_update_exit
mov [Game_static_basepointer], rdx
Game_static_update_exit:

cmp dword ptr [Game_static_set_enable], #0
je Game_static_set_exit
Game_static_set_exit:

cmp dword ptr [Game_static_creditsset_enable], #0
je Game_static_creditsset_exit
mov rbx, [rdx+f0]
test rbx, rbx
je Game_static_creditsset_exit
mov rbx, [rbx+38]
test rbx, rbx
je Game_static_creditsset_exit
mov rbx, [rbx+28]
test rbx, rbx
je Game_static_creditsset_exit
mov ecx, [rbx+24]
mov [rbx+20], ecx
Game_static_creditsset_exit:

cmp dword ptr [Game_static_slotsset_enable], #0
je Game_static_slotsset_exit
mov rbx, [rdx+f0]
test rbx, rbx
je Game_static_slotsset_exit
mov rbx, [rbx+38]
test rbx, rbx
je Game_static_slotsset_exit
mov rbx, [rbx+28]
test rbx, rbx
je Game_static_slotsset_exit
mov [rbx+28], #9999
Game_static_slotsset_exit:

mov rax, [Game_static_temp1]
mov rbx, [Game_static_temp2]
mov rcx, [Game_static_temp3]
mov rdx, [Game_static_temp4]


Game_static_originalcode:
db 48 0F B6 00 85 C0
//movzx rax,byte ptr [rax]
//test eax,eax


Game_static_exit:
jmp Game_static_returnhere


Game_static_searchedAOB:
Game_static_savedAOB:
jmp Game_static_newmem
nop
Game_static_returnhere:


[DISABLE]
Game_static_savedAOB:
db 48 0F B6 00 85 C0
//movzx rax,byte ptr [rax]
//test eax,eax

unregistersymbol(Game_static_savedAOB)

dealloc(Game_static_newmem)
dealloc(Game_static_temp1)
dealloc(Game_static_temp2)
dealloc(Game_static_temp3)
dealloc(Game_static_temp4)
dealloc(Game_static_temp5)"""

