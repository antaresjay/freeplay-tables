// iSize  : 6
[ENABLE]
aobscan(UpdateBuildingAOB,8B 80 48 01 00 00 89 45 EC)
registersymbol(UpdateBuildingAOB)
alloc(UpdateBuilding,1024)
label(return)

label(DoInstant)

UpdateBuilding:
  push edx
  mov edx,[[_user]+78] //Get our player ID
  cmp [eax+6C],edx //Does this building belong to us?
