[[cheat]]
id = "find-user-base-start-in-game"
name = "Find User Base (Start In-Game)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game   : Empire Architect.exe
// Version:
// Date   :
// Author : _
// iSize  : 6
[ENABLE]
aobscan(UpdateBaseAOB,8B 80 84 00 00 00 89 45 E4)
registersymbol(UpdateBaseAOB)
alloc(UpdateBase,1024)
label(return)

label(_user)
registersymbol(_user)

UpdateBase:
  mov [_user],eax
  mov eax,[eax+00000084]
  jmp return

_user:

UpdateBaseAOB:
//mov eax,[eax+00000114]
  jmp UpdateBase
  nop
return:

[DISABLE]
UpdateBaseAOB:
  db 8B 80 84 00 00 00

unregistersymbol(UpdateBaseAOB)
unregistersymbol(_user)
dealloc(UpdateBase)"""

