lblSetSelectedState:
readmem(aobSetSelectedState,7)
mov rcx,[rdi+000001D8]
test rcx,rcx
jz short lblSetSelectedStateSkip
cmp dword ptr [bEnableSelectionPatcher],1
jne short lblSetSelectedStateSkip
cmp dword ptr [bZeroAllPoints],1
jne short lblSetSelectedStateSkipZeroAll
mov dword ptr [rcx+0000013C],0
mov dword ptr [rcx+00000140],0
mov dword ptr [rcx+00000144],0
jmp short lblSetSelectedStateSkip
lblSetSelectedStateSkipZeroAll:
cmp dword ptr [bPatchAttributePoints],1
jne short lblSetSelectedStateSkipAttPts
mov edx,[iMinAttributePoints]
cmp dword ptr [rcx+0000013C],edx
jge short lblSetSelectedStateSkipAttPts
mov dword ptr [rcx+0000013C],edx
lblSetSelectedStateSkipAttPts:
cmp dword ptr [bPatchSkillPoints],1
jne short lblSetSelectedStateSkipSklPts
mov edx,[iMinSkillPoints]
