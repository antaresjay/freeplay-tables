[[cheat]]
id = "wasteland-2-dc-aob-script-main"
name = "Wasteland 2 DC AOB script, main"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game   : WL2.exe
// Version:
// Date   :
// Author : Cs
[ENABLE]
aobscan(aobPartyGrabber,48 8B 80 ?? ?? 00 00 48 8B CD 48 83 C1 ?? 48 8B D0 48 83 EC ?? 83 38 00 49 BB ?? ?? ?? ?? 00 00 00 00 41 FF D3 48 83 C4 ?? EB)
aobscan(aobMoveSpeedReader,F2 0F 59 C1 F2 44 0F 5A F8 F3 44 0F 11 7D EC F3 0F 10 45 EC F3 0F 5A C0 F2 0F 5A C0 48 8B 75 F8 C9 C3)
aobscan(aobSkillTimerCalc,F2 44 0F 5A F8 F3 44 0F 11 BD ?? ?? ?? ?? 0F B6 87 ?? ?? 00 00 85 C0 74 ?? F3 0F 10 85)
aobscan(aobWeightReader,48 8B 46 ?? F3 0F 10 40 68 F3 0F 5A C0)
aobscan(aobActionPointReader,48 63 80 ?? ?? 00 00 48 89 85 ?? ?? ?? ?? 48 8B CE 48 83 EC)

alloc(newmemPartyGrabber,4096,aobPartyGrabber)

label(aobPartyGrabber_r)
label(aobPartyGrabber_i)
registersymbol(aobPartyGrabber_r)
registersymbol(aobPartyGrabber_i)

label(lblPartyGrabber)
label(lblPartyGrabberRet)

label(bEnableMinScraps)
label(iMinScraps)
label(bEnableMinWater)
label(iMinWater)
registersymbol(bEnableMinScraps)
registersymbol(iMinScraps)
registersymbol(bEnableMinWater)
registersymbol(iMinWater)

label(pGame)
label(pParty)
registersymbol(pGame)
registersymbol(pParty)

label(aobMoveSpeedReader_r)
label(aobMoveSpeedReader_i)
registersymbol(aobMoveSpeedReader_r)
registersymbol(aobMoveSpeedReader_i)

label(lblMoveSpeedReader)
label(lblMoveSpeedReaderSkip)
label(lblMoveSpeedReaderRet)

label(bEnableMoveSpeedMod)
label(fMoveSpeedMod)
registersymbol(bEnableMoveSpeedMod)
registersymbol(fMoveSpeedMod)

label(aobSkillTimerCalc_r)
label(aobSkillTimerCalc_i)
registersymbol(aobSkillTimerCalc_r)
registersymbol(aobSkillTimerCalc_i)

label(lblSkillTimerCalc)
label(lblSkillTimerCalcSkip)
label(lblSkillTimerCalcRet)

label(bEnableSkillTimerMod)
label(fSkillTimerMod)
registersymbol(bEnableSkillTimerMod)
registersymbol(fSkillTimerMod)

label(aobWeightReader_r)
label(aobWeightReader_i)
registersymbol(aobWeightReader_r)
registersymbol(aobWeightReader_i)

label(lblWeightReader)
label(lblWeightReaderSkip)
label(lblWeightReaderRet)

label(bEnableWeightMod)
label(fWeightMod)
registersymbol(bEnableWeightMod)
registersymbol(fWeightMod)

label(aobActionPointReader_r)
label(aobActionPointReader_i)
registersymbol(aobActionPointReader_r)
registersymbol(aobActionPointReader_i)

label(lblActionPointReader)
label(lblActionPointReaderSkip)
label(lblActionPointReaderRet)

label(bEnableMinActionPoints)
label(iMinActionPoints)
registersymbol(bEnableMinActionPoints)
registersymbol(iMinActionPoints)

newmemPartyGrabber:
bEnableMinActionPoints:
dd 1
iMinActionPoints:
dd (int)20
bEnableMinScraps:
dd 1
iMinScraps:
dd (int)999
bEnableMinWater:
dd 1
iMinWater:
dd (int)40
bEnableMoveSpeedMod:
dd 1
fMoveSpeedMod:
dd (float)1.75
bEnableSkillTimerMod:
dd 1
fSkillTimerMod:
dd (float)0.1
bEnableWeightMod:
dd 1
fWeightMod:
dd (float)0.01

lblPartyGrabber:
push rbx
mov qword ptr [pGame],rax

cmp dword ptr [bEnableMinScraps],1
jne short @f
mov ebx,[iMinScraps]
mov rcx,[rax+180]
movsxd rdx,[rcx+28]
mov rcx,[rcx+10]
mov rcx,[rcx+30]
add rcx,20
cmp dword ptr [rcx+rdx*4],ebx
jge short @f
mov dword ptr [rcx+rdx*4],ebx
@@:

cmp dword ptr [bEnableMinWater],1
jne short @f
mov ebx,[iMinWater]
mov rcx,[rax+188]
movsxd rdx,[rcx+28]
mov rcx,[rcx+10]
mov rcx,[rcx+30]
add rcx,20
cmp dword ptr [rcx+rdx*4],ebx
jge short @f
mov dword ptr [rcx+rdx*4],ebx
@@:
pop rbx
readmem(aobPartyGrabber,7)
mov qword ptr [pParty],rax
jmp lblPartyGrabberRet
aobPartyGrabber_i:
readmem(aobPartyGrabber,7)
pGame:
dq 0
pParty:
dq 0

lblMoveSpeedReader:
readmem(aobMoveSpeedReader+0f,5)
cmp dword ptr [bEnableMoveSpeedMod],1
jne short lblMoveSpeedReaderSkip
mulss xmm0,[fMoveSpeedMod]
lblMoveSpeedReaderSkip:
jmp lblMoveSpeedReaderRet
aobMoveSpeedReader_i:
readmem(aobMoveSpeedReader+0f,5)

lblSkillTimerCalc:
readmem(aobSkillTimerCalc,5)
cmp dword ptr [bEnableSkillTimerMod],1
jne short lblSkillTimerCalcSkip
mulss xmm15,[fSkillTimerMod]
lblSkillTimerCalcSkip:
jmp lblSkillTimerCalcRet
aobSkillTimerCalc_i:
readmem(aobSkillTimerCalc,5)

lblWeightReader:
readmem(aobWeightReader+4,5)
cmp dword ptr [bEnableWeightMod],1
jne short lblWeightReaderSkip
mulss xmm0,[fWeightMod]
lblWeightReaderSkip:
jmp lblWeightReaderRet
aobWeightReader_i:
readmem(aobWeightReader+4,5)

lblActionPointReader:
cmp dword ptr [bEnableMinActionPoints],1
jne short lblActionPointReaderSkip
mov ecx,[iMinActionPoints]
cmp dword ptr [rax+0000015C],ecx
jge short lblActionPointReaderSkip
mov dword ptr [rax+0000015C],ecx
lblActionPointReaderSkip:
readmem(aobActionPointReader,7)
jmp lblActionPointReaderRet
aobActionPointReader_i:
readmem(aobActionPointReader,7)

aobActionPointReader:
aobActionPointReader_r:
jmp lblActionPointReader
nop
nop
lblActionPointReaderRet:

aobWeightReader+4:
aobWeightReader_r:
jmp lblWeightReader
lblWeightReaderRet:

aobSkillTimerCalc:
aobSkillTimerCalc_r:
jmp lblSkillTimerCalc
lblSkillTimerCalcRet:

aobMoveSpeedReader+0f:
aobMoveSpeedReader_r:
jmp lblMoveSpeedReader
lblMoveSpeedReaderRet:

aobPartyGrabber:
aobPartyGrabber_r:
jmp lblPartyGrabber
nop
nop
lblPartyGrabberRet:

[DISABLE]
aobPartyGrabber_r:
readmem(aobPartyGrabber_i,7)

unregistersymbol(aobPartyGrabber_r)
unregistersymbol(aobPartyGrabber_i)

unregistersymbol(bEnableMinScraps)
unregistersymbol(iMinScraps)
unregistersymbol(bEnableMinWater)
unregistersymbol(iMinWater)

unregistersymbol(pGame)
unregistersymbol(pParty)

aobMoveSpeedReader_r:
readmem(aobMoveSpeedReader_i,5)

unregistersymbol(aobMoveSpeedReader_r)
unregistersymbol(aobMoveSpeedReader_i)

unregistersymbol(bEnableMoveSpeedMod)
unregistersymbol(fMoveSpeedMod)

aobSkillTimerCalc_r:
readmem(aobSkillTimerCalc_i,5)

unregistersymbol(aobSkillTimerCalc_r)
unregistersymbol(aobSkillTimerCalc_i)

unregistersymbol(bEnableSkillTimerMod)
unregistersymbol(fSkillTimerMod)

aobWeightReader_r:
readmem(aobWeightReader_i,5)

unregistersymbol(aobWeightReader_r)
unregistersymbol(aobWeightReader_i)

unregistersymbol(bEnableWeightMod)
unregistersymbol(fWeightMod)

aobActionPointReader_r:
readmem(aobActionPointReader_i,7)

unregistersymbol(aobActionPointReader_r)
unregistersymbol(aobActionPointReader_i)

unregistersymbol(bEnableMinActionPoints)
unregistersymbol(iMinActionPoints)

dealloc(newmemPartyGrabber)"""

