source = """
// Game   : WL2.exe
// Version:
// Date   :
// Author : Cs
[ENABLE]
aobscan(aobSetSelectedState,C6 87 ?? ?? 00 00 01 48 8B CF BA 01 00 00 00 48 83 EC 20 48 8B 07)

alloc(newmemSetSelectedState,4096,aobSetSelectedState)

label(aobSetSelectedState_r)
label(aobSetSelectedState_i)
registersymbol(aobSetSelectedState_r)
registersymbol(aobSetSelectedState_i)

label(lblSetSelectedState)
label(lblSetSelectedStateSkipZeroAll)
label(lblSetSelectedStateSkipAttPts)
label(lblSetSelectedStateSkipSklPts)
