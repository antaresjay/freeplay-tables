id = "wasteland-2-dc-aob-script-combat-requires-enabling-main-script"
name = "Wasteland 2 DC AOB script, combat (requires enabling main script)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
// Game   : WL2.exe
// Version:
// Date   :
// Author : Cs
[ENABLE]
aobscan(aobAmmoTaker,48 63 4D F0 89 48 30 48 8B 7D F8 C9 C3)
aobscan(aobHealthUpdater,48 63 85 ?? ?? ?? ?? 85 C0 7C ?? F3 41 0F 10 44 24 ?? F3 0F 5A C0)

alloc(newmemAmmoTaker,4096,aobAmmoTaker)

label(aobAmmoTaker_r)
label(aobAmmoTaker_i)
registersymbol(aobAmmoTaker_r)
registersymbol(aobAmmoTaker_i)

label(lblAmmoTaker)
label(lblAmmoTakerSkip)
label(lblAmmoTakerRet)

label(bEnableInfiniteAmmo)
registersymbol(bEnableInfiniteAmmo)

label(aobHealthUpdater_r)
label(aobHealthUpdater_i)
registersymbol(aobHealthUpdater_r)
registersymbol(aobHealthUpdater_i)

label(lblHealthUpdater)
label(lblHealthUpdaterLoop)
label(lblHealthUpdaterSkip)
label(lblHealthUpdaterRet)
label(lblHealthUpdaterNonParty)

label(bEnablePartyDamageMod)
label(fPartyDamageMod)
label(bEnableNonPartyDamageMod)
label(fNonPartyDamageMod)
registersymbol(bEnablePartyDamageMod)
registersymbol(fPartyDamageMod)
registersymbol(bEnableNonPartyDamageMod)
registersymbol(fNonPartyDamageMod)

newmemAmmoTaker:
bEnableInfiniteAmmo:
dd 1
bEnablePartyDamageMod:
dd 1
fPartyDamageMod:
dd (float)0.1
bEnableNonPartyDamageMod:
dd 1
fNonPartyDamageMod:
dd (float)5.0

lblAmmoTaker:
cmp dword ptr [bEnableInfiniteAmmo],1
jne short lblAmmoTakerSkip
jmp lblAmmoTakerRet
lblAmmoTakerSkip:
readmem(aobAmmoTaker,7)
jmp lblAmmoTakerRet
aobAmmoTaker_i:
readmem(aobAmmoTaker,7)

lblHealthUpdater:
mov rax,[pParty]
test rax,rax
jz short lblHealthUpdaterSkip
movsxd rdx,[rax+18]
mov rax,[rax+10]
test rax,rax
jz short lblHealthUpdaterSkip
lblHealthUpdaterLoop:
dec rdx
cmp rdx,0
jl short lblHealthUpdaterNonParty
mov rcx,[rax+rdx*8+20]
cmp rcx,r12
jne short lblHealthUpdaterLoop
cmp dword ptr [bEnablePartyDamageMod],1
jne short lblHealthUpdaterSkip
readmem(aobHealthUpdater,7)
cvtsi2ss xmm0,eax
mulss xmm0,[fPartyDamageMod]
cvtss2si eax,xmm0
movsxd rdx,[aobHealthUpdater_i+3]
mov dword ptr [rbp+rdx],rax
lblHealthUpdaterSkip:
readmem(aobHealthUpdater,7)
jmp lblHealthUpdaterRet
lblHealthUpdaterNonParty:
cmp dword ptr [bEnableNonPartyDamageMod],1
jne short lblHealthUpdaterSkip
readmem(aobHealthUpdater,7)
cvtsi2ss xmm0,eax
mulss xmm0,[fNonPartyDamageMod]
cvtss2si eax,xmm0
movsxd rdx,[aobHealthUpdater_i+3]
mov dword ptr [rbp+rdx],rax
jmp short lblHealthUpdaterSkip
aobHealthUpdater_i:
readmem(aobHealthUpdater,7)

aobHealthUpdater:
aobHealthUpdater_r:
jmp lblHealthUpdater
nop
nop
lblHealthUpdaterRet:

aobAmmoTaker:
aobAmmoTaker_r:
jmp lblAmmoTaker
nop
nop
lblAmmoTakerRet:

[DISABLE]
aobAmmoTaker_r:
readmem(aobAmmoTaker_i,7)

unregistersymbol(aobAmmoTaker_r)
unregistersymbol(aobAmmoTaker_i)

unregistersymbol(bEnableInfiniteAmmo)

aobHealthUpdater_r:
readmem(aobHealthUpdater_i,7)

unregistersymbol(aobHealthUpdater_r)
unregistersymbol(aobHealthUpdater_i)

unregistersymbol(bEnablePartyDamageMod)
unregistersymbol(fPartyDamageMod)
unregistersymbol(bEnableNonPartyDamageMod)
unregistersymbol(fNonPartyDamageMod)

dealloc(newmemAmmoTaker)"""

