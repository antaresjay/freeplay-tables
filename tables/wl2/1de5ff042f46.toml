unregistersymbol(aobSetSelectedState_r)
unregistersymbol(aobSetSelectedState_i)

unregistersymbol(bEnableSelectionPatcher)

unregistersymbol(bZeroAllPoints)
unregistersymbol(bPatchAttributePoints)
