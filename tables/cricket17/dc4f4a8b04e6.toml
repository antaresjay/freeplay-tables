[[cheat]]
id = "unlimited-skills"
name = "Unlimited Skills"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(skills,cricket17.exe,63 C2 0F B7 04 41 C3)
alloc(newmem,$1000,skills)

label(code)
label(return)

newmem:
mov word ptr [rcx+rax*2], 64
code:
movzx eax,word ptr [rcx+rax*2]
ret
jmp return

skills+02:
jmp newmem
return:
registersymbol(skills)

[DISABLE]

skills+02:
db 0F B7 04 41 C3

unregistersymbol(skills)
dealloc(newmem)"""
