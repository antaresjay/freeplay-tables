mov ebx, [abilitystats_temp2]
mov ecx, [abilitystats_temp3]
mov edx, [abilitystats_temp4]


abilitystats_originalcode:
readmem(abilitystats_searchedAOB, 6)


abilitystats_exit:
jmp abilitystats_returnhere


abilitystats_searchedAOB:
abilitystats_savedAOB:
