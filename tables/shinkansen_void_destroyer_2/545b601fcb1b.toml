// Accesses Activated Flag
//01591FFA - 0FB6 51 30            - movzx edx,byte ptr [ecx+30]
//01591FFE - 85 D2                 - test edx,edx
//01592000 - 0F84 27020000         - je 0159222D
//01592006 - 8B 45 70              - mov eax,[ebp+70]
//01592009 - 8B 48 04              - mov ecx,[eax+04]
//0159200C - 8B 55 70              - mov edx,[ebp+70]
aobscan(abilitystats_searchedAOB, 0F B6 51 30 85 D2 * * * * * * 8B 45 70)

alloc(abilitystats_newmem, 2048, abilitystats_searchedAOB)
alloc(abilitystats_temp1, 4, abilitystats_searchedAOB)
alloc(abilitystats_temp2, 4, abilitystats_searchedAOB)
alloc(abilitystats_temp3, 4, abilitystats_searchedAOB)
alloc(abilitystats_temp4, 4, abilitystats_searchedAOB)
alloc(abilitystats_temp5, 4, abilitystats_searchedAOB)


