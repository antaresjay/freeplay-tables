cmp dword ptr [abilitystats_abilityset_enable], #0
je abilitystats_abilityset_exit
mov [ecx+28], (float)0
cmp dword ptr [ecx+2c], (float)0
je abilitystats_abilityset_exit
mov [ecx+2c], (float)999
