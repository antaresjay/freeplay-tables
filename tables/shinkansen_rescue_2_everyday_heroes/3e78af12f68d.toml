[[cheat]]
id = "gamemanager-base-address-scan-initialization-activate-this-first"
name = "GameManager Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameManager_basepointer)
registersymbol(GameManager_update_enable)
registersymbol(GameManager_set_enable)
registersymbol(GameManager_moneyset_enable)
registersymbol(GameManager_reputationset_enable)

alloc(GameManager_basepointer,4)
alloc(GameManager_update_enable,4)
alloc(GameManager_set_enable,4)
alloc(GameManager_moneyset_enable,4)
alloc(GameManager_reputationset_enable,4)


[DISABLE]
unregistersymbol(GameManager_basepointer)
unregistersymbol(GameManager_update_enable)
unregistersymbol(GameManager_set_enable)
unregistersymbol(GameManager_moneyset_enable)
unregistersymbol(GameManager_reputationset_enable)

dealloc(GameManager_basepointer)
dealloc(GameManager_update_enable)
dealloc(GameManager_set_enable)
dealloc(GameManager_moneyset_enable)
dealloc(GameManager_reputationset_enable)"""

[[cheat]]
id = "gamemanager-base-address-scan-to-activate-click-station-picture-to-update-click-station-picture"
name = "GameManager Base Address Scan (To Activate: Click Station Picture, To Update: Click Station Picture)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameManager_savedAOB)
label(GameManager_returnhere)
label(GameManager_originalcode)
label(GameManager_exit)

label(GameManager_update_exit)
label(GameManager_set_exit)
label(GameManager_moneyset_exit)
label(GameManager_reputationset_exit)

registersymbol(GameManager_savedAOB)

// Fragment.R2.GUI:StationGUIView:UpdateButtons+96
aobscan(GameManager_searchedAOB,8B 40 1C 8B C8 39 09 8B 40 18 8B C8 39 09 8B 48 08 8B 57 5C)

alloc(GameManager_newmem,2048)


GameManager_newmem:
cmp dword ptr [GameManager_update_enable], #0
je GameManager_update_exit
mov [GameManager_basepointer], eax
GameManager_update_exit:

cmp dword ptr [GameManager_set_enable], #0
je GameManager_set_exit
GameManager_set_exit:

cmp dword ptr [GameManager_moneyset_enable], #0
je GameManager_moneyset_exit
cmp dword ptr [eax+1c], #0
je GameManager_moneyset_exit
mov ecx, [eax+1c]
cmp dword ptr [ecx+18], #0
je GameManager_moneyset_exit
mov ecx, [ecx+18]
mov [ecx+8], #9999999
GameManager_moneyset_exit:

cmp dword ptr [GameManager_reputationset_enable], #0
je GameManager_reputationset_exit
cmp dword ptr [eax+1c], #0
je GameManager_reputationset_exit
mov ecx, [eax+1c]
mov [ecx+20], #9999999
GameManager_reputationset_exit:


GameManager_originalcode:
db 8B 40 1C 8B C8
//mov eax,[eax+1C]
//mov ecx,eax


GameManager_exit:
jmp GameManager_returnhere


GameManager_searchedAOB:
GameManager_savedAOB:
jmp GameManager_newmem
GameManager_returnhere:


[DISABLE]
GameManager_savedAOB:
db 8B 40 1C 8B C8
//mov eax,[eax+1C]
//mov ecx,eax

unregistersymbol(GameManager_savedAOB)

dealloc(GameManager_newmem)"""

