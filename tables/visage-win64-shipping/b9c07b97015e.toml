{ Game : Visage-Win64-Shipping.exe
Version:
Date : 2022-02-19
Author : Glowmoss
This script does blah blah blah
}
[ENABLE]
aobscanmodule(P_base,Visage-Win64-Shipping.exe,7E 49 8B 00 49 8B C8)
