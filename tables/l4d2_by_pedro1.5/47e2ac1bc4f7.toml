[[cheat]]
id = "one-hit-kill"
name = "One Hit Kill "
category = "combat"
description = ""
hint = ""
type = "script"
source = """
//Author: Pedro BR HUEHUEHUE
//Created: September 14, 2017
//Left 4 Dead 2
[ENABLE]

aobscanmodule(healthhh,server.dll,89 37 5F B8 01 00 00 00) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  cmp [edi+3B4],0
  je code
  mov [edi],esi
  pop edi
  mov eax,1
  jmp return
code:
  mov [edi],0
  pop edi
  mov eax,00000001
  jmp return

healthhh:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(healthhh)

[DISABLE]

healthhh:
  db 89 37 5F B8 01 00 00 00

unregistersymbol(healthhh)
dealloc(newmem)"""

