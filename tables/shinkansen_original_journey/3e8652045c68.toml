[[cheat]]
id = "chestpanel-base-address-scan-to-activate-open-chest-to-update-open-chest"
name = "ChestPanel Base Address Scan (To Activate: Open Chest, To Update: Open Chest)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(ChestPanel_savedAOB)
label(ChestPanel_returnhere)
label(ChestPanel_originalcode)
label(ChestPanel_exit)

label(ChestPanel_update_exit)
label(ChestPanel_set_exit)
label(ChestPanel_materialsset_exit)
label(ChestPanel_materialsset_entry)
label(ChestPanel_chipsset_exit)
label(ChestPanel_chipsset_entry)

registersymbol(ChestPanel_savedAOB)

//05508A4B - 85 C0                 - test eax,eax
//05508A4D - 0F84 E0010000         - je 05508C33
// ChestPanel:Update+3b
//05508A53 - 8B B7 E8000000        - mov esi,[edi+000000E8]
//05508A59 - 83 EE 02              - sub esi,02
//05508A5C - 83 FE 03              - cmp esi,03
//05508A5F - 0F83 CE010000         - jae 05508C33
//05508A65 - 8B CE                 - mov ecx,esi
aobscan(ChestPanel_searchedAOB, 8B B7 E8 00 00 00 83 EE 02 83 FE 03)

alloc(ChestPanel_newmem, 2048, ChestPanel_searchedAOB)
alloc(ChestPanel_temp1, 4, ChestPanel_searchedAOB)
alloc(ChestPanel_temp2, 4, ChestPanel_searchedAOB)
alloc(ChestPanel_temp3, 4, ChestPanel_searchedAOB)
alloc(ChestPanel_temp4, 4, ChestPanel_searchedAOB)
alloc(ChestPanel_temp5, 4, ChestPanel_searchedAOB)


ChestPanel_newmem:
mov [ChestPanel_temp1], eax
mov [ChestPanel_temp2], ebx
mov [ChestPanel_temp3], ecx
mov [ChestPanel_temp4], edx

cmp dword ptr [ChestPanel_update_enable], #0
je ChestPanel_update_exit
mov [ChestPanel_basepointer], edi
ChestPanel_update_exit:

cmp dword ptr [ChestPanel_set_enable], #0
je ChestPanel_set_exit
ChestPanel_set_exit:

cmp dword ptr [ChestPanel_materialsset_enable], #0
je ChestPanel_materialsset_exit
mov edx, 0
mov ebx, [edi+84]
test ebx, ebx
je ChestPanel_materialsset_exit
mov ecx, [ebx+c]
test ecx, ecx
je ChestPanel_materialsset_exit
ChestPanel_materialsset_entry:
mov eax, [ebx+edx*4+10]
test eax, eax
je ChestPanel_materialsset_exit
mov [eax+c], #999
inc edx
cmp ecx, edx
je ChestPanel_materialsset_exit
jmp ChestPanel_materialsset_entry
ChestPanel_materialsset_exit:

cmp dword ptr [ChestPanel_chipsset_enable], #0
je ChestPanel_chipsset_exit
mov edx, 0
mov ebx, [edi+8c]
test ebx, ebx
je ChestPanel_chipsset_exit
mov ecx, [ebx+c]
test ecx, ecx
je ChestPanel_chipsset_exit
ChestPanel_chipsset_entry:
mov eax, [ebx+edx*4+10]
test eax, eax
je ChestPanel_chipsset_exit
mov [eax+c], #999
inc edx
cmp ecx, edx
je ChestPanel_chipsset_exit
jmp ChestPanel_chipsset_entry
ChestPanel_chipsset_exit:

mov eax, [ChestPanel_temp1]
mov ebx, [ChestPanel_temp2]
mov ecx, [ChestPanel_temp3]
mov edx, [ChestPanel_temp4]


ChestPanel_originalcode:
db 8B B7 E8 00 00 00
//mov esi,[edi+000000E8]


ChestPanel_exit:
jmp ChestPanel_returnhere


ChestPanel_searchedAOB:
ChestPanel_savedAOB:
jmp ChestPanel_newmem
nop
ChestPanel_returnhere:


[DISABLE]
ChestPanel_savedAOB:
db 8B B7 E8 00 00 00
//mov esi,[edi+000000E8]

unregistersymbol(ChestPanel_savedAOB)

dealloc(ChestPanel_newmem)
dealloc(ChestPanel_temp1)
dealloc(ChestPanel_temp2)
dealloc(ChestPanel_temp3)
dealloc(ChestPanel_temp4)
dealloc(ChestPanel_temp5)"""

