[[cheat]]
id = "guimanager-base-address-scan-initialization-activate-this-first"
name = "GUIManager Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GUIManager_basepointer)
registersymbol(GUIManager_AttributeManager_static_basepointer)
registersymbol(GUIManager_update_enable)
registersymbol(GUIManager_set_enable)
registersymbol(GUIManager_lifeset_enable)
registersymbol(GUIManager_invincibleset_enable)
registersymbol(GUIManager_suitset_enable)
registersymbol(GUIManager_bulletsset_enable)
registersymbol(GUIManager_crystalsset_enable)

alloc(GUIManager_basepointer, 4)
alloc(GUIManager_AttributeManager_static_basepointer, 4)
alloc(GUIManager_update_enable, 4)
alloc(GUIManager_set_enable, 4)
alloc(GUIManager_lifeset_enable, 4)
alloc(GUIManager_invincibleset_enable, 4)
alloc(GUIManager_suitset_enable, 4)
alloc(GUIManager_bulletsset_enable, 4)
alloc(GUIManager_crystalsset_enable, 4)


[DISABLE]
unregistersymbol(GUIManager_basepointer)
unregistersymbol(GUIManager_AttributeManager_static_basepointer)
unregistersymbol(GUIManager_update_enable)
unregistersymbol(GUIManager_set_enable)
unregistersymbol(GUIManager_lifeset_enable)
unregistersymbol(GUIManager_invincibleset_enable)
unregistersymbol(GUIManager_suitset_enable)
unregistersymbol(GUIManager_bulletsset_enable)
unregistersymbol(GUIManager_crystalsset_enable)

dealloc(GUIManager_basepointer)
dealloc(GUIManager_AttributeManager_static_basepointer)
dealloc(GUIManager_update_enable)
dealloc(GUIManager_set_enable)
dealloc(GUIManager_lifeset_enable)
dealloc(GUIManager_invincibleset_enable)
dealloc(GUIManager_suitset_enable)
dealloc(GUIManager_bulletsset_enable)
dealloc(GUIManager_crystalsset_enable)"""

[[cheat]]
id = "guimanager-base-address-scan-to-activate-play-level-to-update-play-level"
name = "GUIManager Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GUIManager_savedAOB)
label(GUIManager_returnhere)
label(GUIManager_originalcode)
label(GUIManager_exit)

label(GUIManager_update_exit)
label(GUIManager_set_exit)
label(GUIManager_lifeset_exit)
label(GUIManager_invincibleset_exit)
label(GUIManager_suitset_exit)
label(GUIManager_bulletsset_exit)
label(GUIManager_crystalsset_exit)

registersymbol(GUIManager_savedAOB)

//054BCEFE - 89 45 98              - mov [ebp-68],eax
//054BCF01 - 8B 05 689FD003        - mov eax,[03D09F68] : [03D0FA50]
// GUI:GUIManager:Update+2df
//054BCF07 - 05 08000000           - add eax,00000008
//054BCF0C - 83 EC 0C              - sub esp,0C
//054BCF0F - 50                    - push eax
//054BCF10 - E8 ABD8FAFF           - call 0546A7C0
//054BCF15 - 83 C4 10              - add esp,10
//054BCF18 - 8B C8                 - mov ecx,eax
//054BCF1A - 8B 45 98              - mov eax,[ebp-68]
//054BCF1D - 83 EC 08              - sub esp,08
//054BCF20 - 51                    - push ecx
//054BCF21 - 50                    - push eax
aobscan(GUIManager_searchedAOB, 05 08 00 00 00 83 EC 0C 50 * * * * * 83 C4 10 8B C8 8B 45 98 83 EC 08)

alloc(GUIManager_newmem, 2048, GUIManager_searchedAOB)
alloc(GUIManager_temp1, 4, GUIManager_searchedAOB)
alloc(GUIManager_temp2, 4, GUIManager_searchedAOB)
alloc(GUIManager_temp3, 4, GUIManager_searchedAOB)
alloc(GUIManager_temp4, 4, GUIManager_searchedAOB)
alloc(GUIManager_temp5, 4, GUIManager_searchedAOB)


GUIManager_newmem:
mov [GUIManager_temp1], eax
mov [GUIManager_temp2], ebx
mov [GUIManager_temp3], ecx
mov [GUIManager_temp4], edx

mov ebx, [GUIManager_savedAOB-4]
sub ebx, 18

cmp dword ptr [GUIManager_update_enable], #0
je GUIManager_update_exit
mov [GUIManager_basepointer], rdi
mov [GUIManager_AttributeManager_static_basepointer], ebx
GUIManager_update_exit:

cmp dword ptr [GUIManager_set_enable], #0
je GUIManager_set_exit
GUIManager_set_exit:

cmp dword ptr [GUIManager_lifeset_enable], #0
je GUIManager_lifeset_exit
mov eax, [edi+10]
test eax, eax
je GUIManager_lifeset_exit
fld [eax+4c]
fstp [eax+48]
GUIManager_lifeset_exit:

cmp dword ptr [GUIManager_invincibleset_enable], #0
je GUIManager_invincibleset_exit
mov eax, [edi+10]
test eax, eax
je GUIManager_lifeset_exit
mov [eax+54], (float)999
mov byte ptr [eax+99], #1
GUIManager_invincibleset_exit:

cmp dword ptr [GUIManager_suitset_enable], #0
je GUIManager_suitset_exit
mov [ebx+c], #9999
mov [ebx+10], #9999
mov [ebx+14], #9999
GUIManager_suitset_exit:

cmp dword ptr [GUIManager_bulletsset_enable], #0
je GUIManager_bulletsset_exit
mov eax, [ebx+18]
test eax, eax
je GUIManager_bulletsset_exit
mov [eax+18], #9999
mov [eax+20], #9999
GUIManager_bulletsset_exit:

cmp dword ptr [GUIManager_crystalsset_enable], #0
je GUIManager_crystalsset_exit
mov eax, [ebx+18]
test eax, eax
je GUIManager_crystalsset_exit
mov [eax+38], #99999
GUIManager_crystalsset_exit:

mov eax, [GUIManager_temp1]
mov ebx, [GUIManager_temp2]
mov ecx, [GUIManager_temp3]
mov edx, [GUIManager_temp4]


GUIManager_originalcode:
db 05 08 00 00 00
//add eax,00000008


GUIManager_exit:
jmp GUIManager_returnhere


GUIManager_searchedAOB:
GUIManager_savedAOB:
jmp GUIManager_newmem
GUIManager_returnhere:


[DISABLE]
GUIManager_savedAOB:
db 05 08 00 00 00
//add eax,00000008

unregistersymbol(GUIManager_savedAOB)

dealloc(GUIManager_newmem)
dealloc(GUIManager_temp1)
dealloc(GUIManager_temp2)
dealloc(GUIManager_temp3)
dealloc(GUIManager_temp4)
dealloc(GUIManager_temp5)"""

