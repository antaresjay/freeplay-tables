[[cheat]]
id = "inf-stamina"
name = "Inf Stamina"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Murder House.exe
  Version: 
  Date   : 2021-10-17
  Author : Glowmoss

  This script gives the player infinite stamina.
}

[ENABLE]

aobscan(InfStam,D9 9F A8 01 00 00 EB)
alloc(newmem,$1000)

label(code)
label(return)
label(Stamina)

newmem:

code:
  fstp st(0)
  fld dword ptr [Stamina]
  fstp dword ptr [edi+000001A8]
  jmp return

 Stamina:
  dq (float)1

InfStam:
  jmp newmem
  nop
return:
registersymbol(InfStam)

[DISABLE]

InfStam:
  db D9 9F A8 01 00 00

unregistersymbol(InfStam)
dealloc(newmem)"""

