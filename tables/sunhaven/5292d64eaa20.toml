define(address,Wish.Profession:set_experience+1b)
define(bytes,F2 0F 5A E8 F3 0F 11 6E 18 48 8B 34 24 48 83 C4 18)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000)
registersymbol(pXPMult)
label(code return pXPMult)

newmem:

code:
  mulss xmm0,[pXPMult]
  cvtsd2ss xmm5,xmm0
  movss [rsi+18],xmm5
  mov rsi,[rsp]
  add rsp,18
  jmp return

pXPMult:
dd (float)2

address:
  jmp far newmem
  nop 3
return:

[DISABLE]

address:
  db bytes

  unregistersymbol(*)
  dealloc(*)"""

