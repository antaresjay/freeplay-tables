[[cheat]]
id = "add-attributes-activate-character-sheet-screen-edit-before-to-enter-battle"
name = "Add Attributes Activate character sheet screen & Edit BEFORE to enter battle"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : GalaxyOfPenAndPaper.exe
  Version: 1.0.4b1
  Date   : 2017-08-04
  Author : nighn4
}
[ENABLE]
aobscan(INJECT,8B 57 18 03 CA 39 00 89 48 18 39 36 ) // should be unique
alloc(newmem,$1000)
globalalloc(charlist,4)
label(code)
label(return)
newmem:
mov [charlist],edi
  jmp code
code:
mov edx,[edi+18]
add ecx,edx
  jmp return
INJECT:
  jmp newmem
return:
registersymbol(INJECT)
[DISABLE]
INJECT:
  db 8B 57 18 03 CA
unregistersymbol(INJECT)
dealloc(newmem)"""

