[[cheat]]
id = "damage-modifier-script-god-mode-one-hit-kill-etc"
name = "Damage Modifier Script (God Mode, One Hit Kill, etc.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

//aobscanmodule(DamageModAOB,$process,44 8B F2 48 8B F9 74 25 0F B7 91 32 04 00 00) // should be unique
aobscanmodule(DamageModAOB,$process,44 8B F2 48 8B F1 74 25 0F B7 91 8A 04 00 00) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,4096,DamageModAOB)

label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fEnemyHealingMult)
registersymbol(fEnemyHealingMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(fHeroHealingMult)
registersymbol(fHeroHealingMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

newmem:
  cmp dword ptr [rcx+B0],0
  jne EnemyHit
HeroHit:
  cmp edx,0
  jl HeroHealingHit
  jg HeroDamageHit
  jmp CleanUp
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [fHeroDamageMult]
  fistp dword ptr [rsp]
  pop edx
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor edx,edx
  jmp CleanUp
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne CleanUp
  cmp edx,dword ptr [rcx+3AC]
  jl @F
  xor edx,edx
@@:
  jmp CleanUp  
HeroHealingHit:
  cmp [fHeroHealingMult],(float)0.0
  je CleanUp
  neg edx
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [fHeroHealingMult]
  fistp dword ptr [rsp]
  pop edx
  neg edx
  jmp CleanUp
EnemyHit:
  cmp edx,0
  jl EnemyHealingHit
  jg EnemyDamageHit
  jmp CheckOneHitKill
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckOneHitKill
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [fEnemyDamageMult]
  fistp dword ptr [rsp]
  pop edx
CheckOneHitKill:
  cmp [OneHitKill],1
  jne CleanUp
  mov edx,dword ptr [rcx+3AC]
  jmp CleanUp
EnemyHealingHit:
  cmp [fEnemyHealingMult],(float)0.0
  je CleanUp
  neg edx
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [fEnemyHealingMult]
  fistp dword ptr [rsp]
  pop edx
  neg edx

CleanUp:  
  mov r14d,edx
  mov rsi,rcx
  test [rcx+000003A8],00200000
  jmp return

GodMode:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)1.4
fEnemyHealingMult:
dq (float)0.25
fHeroDamageMult:
dq (float)0.25
fHeroHealingMult:
dq (float)2.0
HeroCannotDie:
dq 1

DamageModAOB:
  jmp newmem
  nop
return:

[DISABLE]

DamageModAOB:
  db 44 8B F2 48 8B F1

unregistersymbol(DamageModAOB)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fEnemyHealingMult)
unregistersymbol(fHeroDamageMult)
unregistersymbol(fHeroHealingMult)

dealloc(newmem)"""

