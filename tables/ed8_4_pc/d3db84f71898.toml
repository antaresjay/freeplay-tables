  jae NextCheck
  jmp originalcode
NextCheck:
  mov ebx,#2250
  cmp dx,bx
  jb DoOverrideItemID
  mov ebx,#2400
  cmp dx,bx
  ja NextCheck2
  jmp originalcode
NextCheck2:
  mov ebx,#3200
  cmp dx,bx
  jb DoOverrideItemID
  mov ebx,#3250
  cmp dx,bx
  ja DoOverrideItemID
  jmp originalcode
DoOverrideItemID:
  mov ebx,FFFFFFFF
  cmp [OverrideItemID],bx
  je originalcode
  mov dx,[OverrideItemID]
  mov r8w,[OverrideQty]
  
originalcode:
  mov [rbp+00000340],rax
  jmp return

OverrideItemID:
dq FFFF
OverrideQty:
dq 1

OverrideItemIDAOB:
  jmp newmem
  nop
  nop
  return:
  
