[[cheat]]
id = "activate-trainer"
name = "Activate Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(cheater,2048)
label(iCheat)
registersymbol(iCheat)
label(retHealth)
label(orgHealth)
label(chtHealth)
label(setDante)
label(setVergil)
label(pHero)
registersymbol(pHero)

cheater:
iCheat:
 db 00 00  //byte:Health,Devil Trigger.
pHero:
 dd 00
chtHealth:
 pushfd
 push eax
 push ebx
 cmp [esi+000007D0],00
 je short orgHealth
 cmp byte ptr [iCheat],00 //Infinite Health.
 je short setDante
 mov eax,[esi+00000844]
 mov [esi+00000840],eax
setDante:
 mov eax,[esi+38]
 mov [pHero],eax     //Save devil pointer.
 cmp byte ptr [iCheat+1],00 //Infinite Devil Trigger
 je short orgHealth
 mov eax,[eax+68]
 mov ebx,[eax+80]
 cmp ebx (float)99
 jna short setVergil
 mov [eax+84],ebx
 jmp short orgHealth
setVergil:
 mov eax,[esi+38]
 mov eax,[eax+54]
 mov ebx,[eax+80]
 cmp ebx,(float)99
 jna short orgHealth
 mov [eax+84],ebx
orgHealth:
 pop ebx
 pop eax
 popfd
 comiss xmm0,[esi+00000840]
 jmp retHealth

{----------------------------------Hacked-------------------------------------}
locHealth:
 jmp chtHealth
 db 90 90
retHealth:

[DISABLE]
locHealth:
 db 0F 2F 86 40 08 00 00
unregistersymbol(iCheat)
unregistersymbol(pHero)
dealloc(cheater)"""

