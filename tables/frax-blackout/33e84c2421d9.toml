[[cheat]]
id = "time-manager-ctrl-numpad-1"
name = "Time Manager (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : FRAX BLACKOUT.exe
// Author            : ndck76
// Executable Version: 2022.3.8.60156
// Game Version      : v1.0.0 (Early Access)
// Script Date       : 2026-04-07


[ENABLE]

aobscanregion(isactive,TimeManager:Update,TimeManager:Update+500,0FB6869xxx000085xx0Fxxxxxxxxxx48B8xxxxxxxxxxxx000048xxxx0Fxxxxxx85xx0Fxxxxxxxxxx48B8xxxxxxxxxxxx000048xxxx0Fxxxxxxxxxxxx85xx) //TimeManager:Update+12
alloc(newmem,$1000,isactive)
alloc(data2,8)
alloc(isactivebkp,7)
registersymbol(data2)
registersymbol(isactive)
registersymbol(isactivebkp)
label(code)
label(return)

isactivebkp:
  readmem(isactive,7)

newmem:
  mov [data2],rsi

code:
  readmem(isactive,7)
  jmp return

isactive:
  jmp newmem
  nop 2
return:

[DISABLE]

isactive:
  readmem(isactivebkp,7)

unregistersymbol(*)
dealloc(*)"""

