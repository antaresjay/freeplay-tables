source = '''
{ Game   : Eternamine.exe
  Version: 
  Date   : 2023-07-21
  Author : Leunsel

  Address of signature = 0xF97AD20000F94EF1
  "\xD9\x40\x00\xB8", "xx?x"
  "D9 40 ? B8"
}

[ENABLE]


aobscanregion(Godmode,PlayerHealthBar:Update+2,PlayerHealthBar:Update+62,D9xxxxxxxxxxxxxxD9xxxxxxD9xxxxxxxxxxD9xxxxxxxxxx89xxxx8B) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

alloc(HealthValue,4)

HealthValue:
  dd (float)50

newmem:

code:
  fld dword ptr [HealthValue]
  fstp dword ptr [eax+C]
  mov eax,[HealthValue]
  jmp return

Godmode:
  jmp newmem
  nop 3
