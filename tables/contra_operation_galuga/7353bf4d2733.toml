type = "script"
source = """
[ENABLE]
aobscanmodule(speed,GameAssembly.dll,F3 44 0F 10 86 38 01 00 00) // should be unique
alloc(newmem,$1000,speed)

label(code)
label(return)
alloc(base,4)
registersymbol(base)
newmem:
mov [base],rsi
code:
  movss xmm8,[rsi+00000138]
  jmp return

speed:
  jmp newmem
  nop 4
return:
registersymbol(speed)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
speed:
