GameAssembly.dll.il2cpp+90A86D: EB 09                       - jmp GameAssembly.dll.il2cpp+90A878
// ---------- INJECTING HERE ----------
GameAssembly.dll.il2cpp+90A86F: F3 44 0F 10 86 38 01 00 00  - movss xmm8,[rsi+00000138]
// ---------- DONE INJECTING  ----------
