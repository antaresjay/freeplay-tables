[[cheat]]
id = "perk"
name = "Perk"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(perkperkperk, SkillPage:SelectSkill+980, SkillPage:SelectSkill+e86, 48 05 C8 00 00 00 48 63 08 89 8D F8 FE FF FF)
alloc(newmem,$1000)

label(code)
label(return)

label(blahblahblahblah)
registersymbol(blahblahblahblah)

newmem:
  add rax,000000C8

  cmp dword ptr [blahblahblahblah], 0
  jle code

  push rbx
  mov ebx, [blahblahblahblah]
  mov dword ptr [rax+4], 0
  mov dword ptr [rax+8], ebx
  mov dword ptr [rax+C], ebx
  pop rbx

code:
  movsxd  rcx,dword ptr [rax]
  mov [rbp-00000108],ecx
  jmp return

blahblahblahblah:
dd 0

perkperkperk:
  jmp far newmem
  nop
return:
registersymbol(perkperkperk)

[DISABLE]

perkperkperk:
  db 48 05 C8 00 00 00 48 63 08 89 8D F8 FE FF FF

unregistersymbol(perkperkperk)
unregistersymbol(blahblahblahblah)
dealloc(newmem)"""

