[[cheat]]
id = "player-stats-base-address-scan-initialization-activate-this-first"
name = "Player Stats Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(playerstats_basepointer)
registersymbol(playerstats_update_enable)
registersymbol(playerstats_set_enable)
registersymbol(playerstats_zeniset_enable)
registersymbol(playerstats_timeset_enable)

alloc(playerstats_basepointer, 8)
alloc(playerstats_update_enable, 4)
alloc(playerstats_set_enable, 4)
alloc(playerstats_zeniset_enable, 4)
alloc(playerstats_timeset_enable, 4)


[DISABLE]
unregistersymbol(playerstats_basepointer)
unregistersymbol(playerstats_update_enable)
unregistersymbol(playerstats_set_enable)
unregistersymbol(playerstats_zeniset_enable)
unregistersymbol(playerstats_timeset_enable)

dealloc(playerstats_basepointer)
dealloc(playerstats_update_enable)
dealloc(playerstats_set_enable)
dealloc(playerstats_zeniset_enable)
dealloc(playerstats_timeset_enable)"""

[[cheat]]
id = "player-stats-base-address-scan-to-update-visit-shop-items"
name = "Player Stats Base Address Scan (To Update: Visit Shop Items)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstats_update_exit)
label(playerstats_set_exit)
label(playerstats_zeniset_exit)
label(playerstats_timeset_exit)

registersymbol(playerstats_savedAOB)

//SKEstivalVersus.exe+1A0354 - 41 F6 C1 04           - test r9l,04
//SKEstivalVersus.exe+1A0358 - 0F84 94000000         - je SKEstivalVersus.exe+1A03F2
//SKEstivalVersus.exe+1A035E - 41 0FB7 40 FC         - movzx eax,word ptr [r8-04]
//SKEstivalVersus.exe+1A0363 - 66 83 F8 FF           - cmp ax,-01
//SKEstivalVersus.exe+1A0367 - 74 1D                 - je SKEstivalVersus.exe+1A0386
//SKEstivalVersus.exe+1A0369 - 48 0FBF C0            - movsx rax,ax
//SKEstivalVersus.exe+1A036D - 48 8B D0              - mov rdx,rax
//SKEstivalVersus.exe+1A0370 - 24 1F                 - and al,1F
//SKEstivalVersus.exe+1A0372 - 48 C1 FA 05           - sar rdx,05
//SKEstivalVersus.exe+1A0376 - 0FB6 C8               - movzx ecx,al
// Accesses Item Purchased
//SKEstivalVersus.exe+1A0379 - 41 8B 84 97 AC260400  - mov eax,[r15+rdx*4+000426AC]
//SKEstivalVersus.exe+1A0381 - 0FA3 C8               - bt eax,ecx
//SKEstivalVersus.exe+1A0384 - 72 28                 - jb SKEstivalVersus.exe+1A03AE
//SKEstivalVersus.exe+1A0386 - 41 0FB7 40 FE         - movzx eax,word ptr [r8-02]
//SKEstivalVersus.exe+1A038B - 66 83 F8 FF           - cmp ax,-01
aobscan(playerstats_searchedAOB, 41 0F B7 40 FC 66 83 F8 FF 74 1D)

alloc(playerstats_newmem, 2048, playerstats_searchedAOB)
alloc(playerstats_temp1, 8, playerstats_searchedAOB)
alloc(playerstats_temp2, 8, playerstats_searchedAOB)
alloc(playerstats_temp3, 8, playerstats_searchedAOB)
alloc(playerstats_temp4, 8, playerstats_searchedAOB)


playerstats_newmem:
mov [playerstats_temp1], rax
mov [playerstats_temp2], rbx
mov [playerstats_temp3], rcx
mov [playerstats_temp4], rdx

cmp dword ptr [playerstats_update_enable], #0
je playerstats_update_exit
mov [playerstats_basepointer], r15
playerstats_update_exit:

cmp dword ptr [playerstats_set_enable], #0
je playerstats_set_exit
playerstats_set_exit:

cmp dword ptr [playerstats_zeniset_enable], #0
je playerstats_zeniset_exit
mov [r15+8], #9999999
playerstats_zeniset_exit:

cmp dword ptr [playerstats_timeset_enable], #0
je playerstats_timeset_exit
mov [r15+4], (float)0
playerstats_timeset_exit:

mov rax, [playerstats_temp1]
mov rbx, [playerstats_temp2]
mov rcx, [playerstats_temp3]
mov rdx, [playerstats_temp4]


playerstats_originalcode:
db 41 0F B7 40 FC
//movzx eax,word ptr [r8-04]


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB:
playerstats_savedAOB:
jmp playerstats_newmem
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
db 41 0F B7 40 FC
//movzx eax,word ptr [r8-04]

unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)
dealloc(playerstats_temp1)
dealloc(playerstats_temp2)
dealloc(playerstats_temp3)
dealloc(playerstats_temp4)"""

