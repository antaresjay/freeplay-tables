[[cheat]]
id = "x-chronostorm-v1-01-script"
name = "[X] <== Chronostorm v1.01 Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
===========================================
 Game Title    : Chronostorm
 Game Version  : 1.01
 Script Version: 1.0
 CE Version    : 6.1
 Release date  : 01-Oct-2011
 Author        : Recifense
 Features:
 - God Mode
 - Minimum Resource
===========================================
}

[ENABLE]
//=========================================
// Check if script is compatible to this game version
// If false the script will not be loaded

assert(Chronostorm.exe+18266a,8b 50 24 33 ff)
assert(Chronostorm.exe+1385d9,d9 9e 1c 01 00 00)
assert(Chronostorm.exe+0d21ca,53 89 7c 24 38)

//=========================================
alloc(MyCode,1024)
//=========================================
// Declaration section
label(_MonPlayer)
label(_BackMP)
label(_ExitMP)
label(_GodMode)
label(_GodM0)
label(_BackGM)
label(_ExitGM)
label(_MonEnd)
label(_BackME)
label(pUnit)
label(pPlayer)
label(iEnableGM)
label(iEnableMR)
label(iMinMoney)

//=========================================
// Registering Symbols
registersymbol(MyCode)
registersymbol(pUnit)
registersymbol(pPlayer)
registersymbol(iEnableGM)
registersymbol(iEnableMR)
registersymbol(iMinMoney)

//=========================================
MyCode:
//=========================================
_MonPlayer:
 mov [pPlayer],eax

 cmp dword ptr [iEnableMR],0
 je _ExitMP                        // Jump if feature is disabled

 mov edx,[iMinMoney]
 cmp edx,[eax+24]
 jle _ExitMP

 mov [eax+24],edx

_ExitMP:
 mov edx,[eax+24]                  // Original code
 xor edi,edi                       // Original code
 jmp _BackMP                       // Back to main code

//=========================================
_GodMode:
 push eax
 mov [pUnit],esi                   // Save ptr for debugging

 fstp dword ptr [esi+0000011C]     // Original code

 mov eax,[esp+10]
 cmp eax,Chronostorm.exe+1388c2
 je _GodM0

 mov eax,[esp+18]
 cmp eax,Chronostorm.exe+1388c2
 jne _ExitGM

_GodM0:
 cmp dword ptr [iEnableGM],0
 je _ExitGM                        // Jump if feature is disabled

 mov eax,[esi+0000016c]            // Get pointer to owner
 cmp eax,[pPlayer]
 jne _ExitGM

 mov eax,[esi+00000118]            // Get Maximum HP
 mov [esi+0000011c],eax            // Update Current HP

_ExitGM:
 pop eax
 jmp _BackGM                       // Back to main code

//=========================================
_MonEnd:
 mov dword ptr [pPlayer],55555555

 push ebx                          // Original code
 mov [esp+38],edi                  // Original code
 jmp _BackME                       // Back to main code
//=========================================
 db '================>'
 db 'CE6.1 Script by Recifense 100111'
//=========================================
// Variables
iEnableGM:
 dd 1
iEnableMR:
 dd 1
pUnit:
 dd 0
pPlayer:
 dd MyCode
iMinMoney:
 dd #5000

//=========================================
// Hacking Points
Chronostorm.exe+18266a:
 jmp _MonPlayer
_BackMP:

Chronostorm.exe+1385d9:
 jmp _GodMode
 nop
_BackGM:

Chronostorm.exe+0d21ca:
 jmp _MonEnd
_BackME:

//=========================================
// Script for Restoring Original Codes
[DISABLE]
Chronostorm.exe+18266a:
// mov edx,[eax+24]
// xor edi,edi
 db 8b 50 24 33 ff

Chronostorm.exe+1385d9:
// fstp dword ptr [esi+0000011C]
 db d9 9e 1c 01 00 00

Chronostorm.exe+0d21ca:
// push ebx
// mov [esp+38],edi
 db 53 89 7c 24 38

//=========================================
// Unregistering Symbols
unregistersymbol(MyCode)
unregistersymbol(pUnit)
unregistersymbol(iEnableGM)
unregistersymbol(iEnableMR)
unregistersymbol(pPlayer)
unregistersymbol(iMinMoney)

//=========================================
dealloc(MyCode)
//============= Scripts End ===============

// ****************************************
// NOTES
// ****************************************
{
Chronostorm:

struct PLAYER:
0000 = 006147a8
0004 = aPlayerID
0024 = iMoney
00b4 = imEnergy
00b8 = icEnergy

struct UNIT:
0000 = 00622eDC
0118 = fmHP\t (building = 5000)
011c = fcHP
016c = pOwner
}"""

