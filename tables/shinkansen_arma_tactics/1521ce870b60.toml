[[cheat]]
id = "inventoryslotcontent-base-address-scan-initialization-activate-this-first"
name = "InventorySlotContent Base Address Scan Initialization (Activate This First)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(InventorySlotContent_basepointer)
registersymbol(InventorySlotContent_update_enable)
registersymbol(InventorySlotContent_set_enable)

