[[cheat]]
id = "cchardata-base-address-scan-to-activate-select-battle-operator-to-update-select-battle-operator"
name = "CCharData Base Address Scan (To Activate: Select Battle Operator, To Update: Select Battle Operator)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(CCharData_savedAOB)
label(CCharData_returnhere)
label(CCharData_originalcode)
label(CCharData_exit)

label(CCharData_update_exit)
label(CCharData_set_exit)
label(CCharData_hpset_exit)
label(CCharData_apset_exit)
label(CCharData_invincibleset_exit)
label(CCharData_invisibleset_exit)
label(CCharData_skillset_exit)
label(CCharData_ammoset_exit)

registersymbol(CCharData_savedAOB)

//04B34ABB - 8B C8                 - mov ecx,eax
//04B34ABD - 39 09                 - cmp [ecx],ecx
// CCharacterManager:GetActiveCharAP+f
//04B34ABF - 8B 40 5C              - mov eax,[eax+5C]
//04B34AC2 - 8B C8                 - mov ecx,eax
//04B34AC4 - 39 09                 - cmp [ecx],ecx
//04B34AC6 - 8B 40 44              - mov eax,[eax+44]
//04B34AC9 - C9                    - leave
//04B34ACA - C3                    - ret
aobscan(CCharData_searchedAOB, 8B 40 5C 8B C8 39 09 8B 40 44 C9 C3)

alloc(CCharData_newmem, 2048)
alloc(CCharData_temp1, 4)
alloc(CCharData_temp2, 4)


CCharData_newmem:
mov [CCharData_temp1], ebx
mov [CCharData_temp2], edx

cmp dword ptr [CCharData_update_enable], #0
je CCharData_update_exit
mov [CCharData_basepointer], eax
CCharData_update_exit:

cmp dword ptr [CCharData_set_enable], #0
je CCharData_set_exit
CCharData_set_exit:

// Check for Operator
cmp dword ptr [eax+24], #0
jne CCharData_ammoset_exit

cmp dword ptr [CCharData_hpset_enable], #0
je CCharData_hpset_exit
fild [eax+2c]
fstp [eax+28]
CCharData_hpset_exit:

cmp dword ptr [CCharData_apset_enable], #0
je CCharData_apset_exit
mov ebx, [eax+48]
add ebx, [eax+48]
mov [eax+44], ebx
CCharData_apset_exit:

cmp dword ptr [CCharData_invincibleset_enable], #0
je CCharData_invincibleset_exit
cmp dword ptr [eax+10], #0
je CCharData_invincibleset_exit
mov ebx, [eax+10]
mov byte ptr [ebx+d0], #1
CCharData_invincibleset_exit:

cmp dword ptr [CCharData_invisibleset_enable], #0
je CCharData_invisibleset_exit
cmp dword ptr [eax+10], #0
je CCharData_invisibleset_exit
mov ebx, [eax+10]
mov [ebx+e8], #1
mov [ebx+ec], #1
mov [ebx+f0], #1
mov [ebx+f4], #1
cmp dword ptr [eax+10], #0
je CCharData_ammoset_exit
mov ebx, [eax+10]
cmp dword ptr [ebx+50], #0
je CCharData_ammoset_exit
mov ebx, [ebx+50]
mov byte ptr [ebx+61], #1
CCharData_invisibleset_exit:

cmp dword ptr [CCharData_skillset_enable], #0
je CCharData_skillset_exit
cmp dword ptr [eax+10], #0
je CCharData_skillset_exit
mov ebx, [eax+10]
cmp dword ptr [ebx+6c], #0
je CCharData_skillset_exit
mov ebx, [ebx+6c]
cmp dword ptr [ebx+14], #0
je CCharData_skillset_exit
mov ebx, [ebx+14]
mov [ebx+10], #999
mov [ebx+14], #999
mov [ebx+18], #999
mov [ebx+1c], #999
mov [ebx+20], #999
mov [ebx+24], #999
mov [ebx+28], #999
mov [ebx+2c], #999
mov [ebx+30], #999
mov [ebx+34], #999
CCharData_skillset_exit:

cmp dword ptr [CCharData_ammoset_enable], #0
je CCharData_ammoset_exit
cmp dword ptr [eax+10], #0
je CCharData_ammoset_exit
mov ebx, [eax+10]
cmp dword ptr [ebx+50], #0
je CCharData_ammoset_exit
mov ebx, [ebx+50]
mov edx, [ebx+44]
mov [ebx+38], edx
CCharData_ammoset_exit:

mov ebx, [CCharData_temp1]
mov edx, [CCharData_temp2]


CCharData_originalcode:
db 39 09 8B 40 44
//cmp [ecx],ecx
//mov eax,[eax+44]


CCharData_exit:
jmp CCharData_returnhere


CCharData_searchedAOB + 5:
CCharData_savedAOB:
jmp CCharData_newmem
CCharData_returnhere:


[DISABLE]
CCharData_savedAOB:
db 39 09 8B 40 44
//cmp [ecx],ecx
//mov eax,[eax+44]

unregistersymbol(CCharData_savedAOB)

dealloc(CCharData_newmem)
dealloc(CCharData_temp1)
dealloc(CCharData_temp2)"""

