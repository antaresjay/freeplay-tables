[[cheat]]
id = "inventoryslotcontent-base-address-scan-to-activate-select-armory-item-to-update-select-armory-item"
name = "InventorySlotContent Base Address Scan (To Activate: Select Armory Item, To Update: Select Armory Item)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(InventorySlotContent_savedAOB)
label(InventorySlotContent_returnhere)
label(InventorySlotContent_originalcode)
label(InventorySlotContent_exit)

label(InventorySlotContent_update_exit)
label(InventorySlotContent_set_exit)

registersymbol(InventorySlotContent_savedAOB)

//04C3056A - C1 E1 04              - shl ecx,04
//04C3056D - 03 C1                 - add eax,ecx
//CArmory:GetAvailableItemCount+81
//04C3056F - 05 10000000           - add eax,00000010
//04C30574 - 8B 40 08              - mov eax,[eax+08]
//04C30577 - 8B 0D A03D5703        - mov ecx,[03573DA0] : [03D3F330]
//04C3057D - 39 71 0C              - cmp [ecx+0C],esi
aobscan(InventorySlotContent_searchedAOB, 05 10 00 00 00 8B 40 08)

alloc(InventorySlotContent_newmem, 2048)
alloc(InventorySlotContent_temp1, 4)


InventorySlotContent_newmem:
mov [InventorySlotContent_temp1], ebx

mov ebx, eax
add ebx, #16

cmp dword ptr [InventorySlotContent_update_enable], #0
je InventorySlotContent_update_exit
mov [InventorySlotContent_basepointer], ebx
InventorySlotContent_update_exit:

cmp dword ptr [InventorySlotContent_set_enable], #0
je InventorySlotContent_set_exit
mov [ebx+8], #9999999
InventorySlotContent_set_exit:

mov ebx, [InventorySlotContent_temp1]


InventorySlotContent_originalcode:
db 05 10 00 00 00
//add eax,00000010


InventorySlotContent_exit:
jmp InventorySlotContent_returnhere


InventorySlotContent_searchedAOB:
InventorySlotContent_savedAOB:
jmp InventorySlotContent_newmem
InventorySlotContent_returnhere:


[DISABLE]
InventorySlotContent_savedAOB:
db 05 10 00 00 00
//add eax,00000010

unregistersymbol(InventorySlotContent_savedAOB)

dealloc(InventorySlotContent_newmem)
dealloc(InventorySlotContent_temp1)"""

