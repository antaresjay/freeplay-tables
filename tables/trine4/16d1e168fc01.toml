[[cheat]]
id = "undead"
name = "undead"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanmodule(healthCalOnChangeAOB,trine4.exe,8B ** ** 48 ** ** 41 ** ** E8 ** ** ** ** 48 ** ** 48)
registersymbol(healthCalOnChangeAOB)

label(dMinHealth)
registersymbol(dMinHealth)

alloc(newmem,2048,healthCalOnChangeAOB) //"trine4.exe"+13EF690)
label(returnhere)
label(originalcode_healthCalOnChangeAOB)
registersymbol(originalcode_healthCalOnChangeAOB)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
//+350 0,p
//+358 0,p
//+428 p,0
//+58c 1,0

cmp dword ptr [rdi+428],0
jne @f
cmp dword ptr [rdi+42c],0
je ise
@@:
mov rax,dMinHealth
mov eax,[rax]
readmem(healthCalOnChangeAOB,3)
//mov edx,[rdi+rcx*4]
readmem(healthCalOnChangeAOB+6,3)
//add edx,r14d
cmp edx,eax
jge @f
sub eax,r14d
db 89 04
readmem(healthCalOnChangeAOB+2,1)
//mov [rdi+rcx*4],eax
jmp end

ise:

end:

originalcode_healthCalOnChangeAOB:
readmem(healthCalOnChangeAOB,6)
//mov edx,[rdi+rcx*4]
//mov rcx,rdi

exit:
jmp returnhere

///
dMinHealth:
dd #20
///

healthCalOnChangeAOB: //"trine4.exe"+13EF690:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
healthCalOnChangeAOB: //"trine4.exe"+13EF690:
readmem(originalcode_healthCalOnChangeAOB,6)
//db 8B 14 8F 48 8B CF
//Alt: mov edx,[rdi+rcx*4]
//Alt: mov rcx,rdi
unregistersymbol(originalcode_healthCalOnChangeAOB)

unregistersymbol(dMinHealth)"""

