[[cheat]]
id = "levelscene-base-address-scan-initialization-activate-this-first-to-activate-play-level"
name = "LevelScene Base Address Scan Initialization (Activate This First, To Activate: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(LevelScene_basepointer)
registersymbol(LevelScene_update_enable)
registersymbol(LevelScene_invincibleset_enable)
registersymbol(LevelScene_hpset_enable)
registersymbol(LevelScene_ammoset_enable)
registersymbol(LevelScene_weaponset_enable)

//1C27A653 - 83 EC 08              - sub esp,08
//1C27A656 - E8 0DEA15E8           - call 043D9068
// ZGame:ZChar:get_isHero+b
//1C27A65B - 8B 40 14              - mov eax,[eax+14]
//1C27A65E - 83 EC 08              - sub esp,08
//1C27A661 - 50                    - push eax
//1C27A662 - FF 75 08              - push [ebp+08]
//1C27A665 - E8 AEFE12E8           - call 043AA518
//1C27A66A - 83 C4 10              - add esp,10
//1C27A66D - C9                    - leave
//1C27A66E - C3                    - ret
aobscan(LevelScene_initialization_searchedAOB, 8B 40 14 83 EC 08 50 FF 75 08 * * * * * 83 C4 10 C9 C3)

alloc(LevelScene_basepointer, 4, LevelScene_initialization_searchedAOB)
alloc(LevelScene_update_enable, 4, LevelScene_initialization_searchedAOB)
alloc(LevelScene_invincibleset_enable, 4, LevelScene_initialization_searchedAOB)
alloc(LevelScene_hpset_enable, 4, LevelScene_initialization_searchedAOB)
alloc(LevelScene_ammoset_enable, 4, LevelScene_initialization_searchedAOB)
alloc(LevelScene_weaponset_enable, 4, LevelScene_initialization_searchedAOB)


[DISABLE]
unregistersymbol(LevelScene_basepointer)
unregistersymbol(LevelScene_update_enable)
unregistersymbol(LevelScene_invincibleset_enable)
unregistersymbol(LevelScene_hpset_enable)
unregistersymbol(LevelScene_ammoset_enable)
unregistersymbol(LevelScene_weaponset_enable)

dealloc(LevelScene_basepointer)
dealloc(LevelScene_update_enable)
dealloc(LevelScene_invincibleset_enable)
dealloc(LevelScene_hpset_enable)
dealloc(LevelScene_ammoset_enable)
dealloc(LevelScene_weaponset_enable)"""

[[cheat]]
id = "levelscene-base-address-scan-to-activate-play-level-to-update-play-level"
name = "LevelScene Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(LevelScene_savedAOB)
label(LevelScene_returnhere)
label(LevelScene_originalcode)
label(LevelScene_exit)

label(LevelScene_update_exit)
label(LevelScene_invincibleset_exit)
label(LevelScene_hpset_exit)
label(LevelScene_ammoset_exit)
label(LevelScene_weaponset_exit)

registersymbol(LevelScene_originalcode)
registersymbol(LevelScene_savedAOB)

//1C27A653 - 83 EC 08              - sub esp,08
//1C27A656 - E8 0DEA15E8           - call 043D9068
// ZGame:ZChar:get_isHero+b
//1C27A65B - 8B 40 14              - mov eax,[eax+14]
//1C27A65E - 83 EC 08              - sub esp,08
//1C27A661 - 50                    - push eax
//1C27A662 - FF 75 08              - push [ebp+08]
//1C27A665 - E8 AEFE12E8           - call 043AA518
//1C27A66A - 83 C4 10              - add esp,10
//1C27A66D - C9                    - leave
//1C27A66E - C3                    - ret
aobscan(LevelScene_searchedAOB, 8B 40 14 83 EC 08 50 FF 75 08 * * * * * 83 C4 10 C9 C3)

alloc(LevelScene_newmem, 2048, LevelScene_searchedAOB)
alloc(LevelScene_temp1, 4, LevelScene_searchedAOB)
alloc(LevelScene_temp2, 4, LevelScene_searchedAOB)
alloc(LevelScene_temp3, 4, LevelScene_searchedAOB)
alloc(LevelScene_temp4, 4, LevelScene_searchedAOB)
alloc(LevelScene_temp5, 4, LevelScene_searchedAOB)


LevelScene_newmem:
mov [LevelScene_temp1], eax
mov [LevelScene_temp2], ebx
mov [LevelScene_temp3], ecx
mov [LevelScene_temp4], edx

cmp dword ptr [LevelScene_update_enable], #0
je LevelScene_update_exit
mov [LevelScene_basepointer], eax
LevelScene_update_exit:

cmp dword ptr [LevelScene_invincibleset_enable], #0
je LevelScene_invincibleset_exit
mov ebx, [eax+14]
test ebx, ebx
je LevelScene_invincibleset_exit
mov byte ptr [ebx+99], #1
LevelScene_invincibleset_exit:

cmp dword ptr [LevelScene_hpset_enable], #0
je LevelScene_hpset_exit
mov ebx, [eax+14]
test ebx, ebx
je LevelScene_hpset_exit
mov ecx, [ebx+a0]
mov [ebx+c4], ecx
LevelScene_hpset_exit:

cmp dword ptr [LevelScene_ammoset_enable], #0
je LevelScene_ammoset_exit
mov ebx, [eax+14]
test ebx, ebx
je LevelScene_ammoset_exit
mov ebx, [ebx+118]
test ebx, ebx
je LevelScene_ammoset_exit
mov ebx, [ebx+2c]
test ebx, ebx
je LevelScene_ammoset_exit
mov ebx, [ebx+10]
test ebx, ebx
je LevelScene_ammoset_exit
mov ecx, [ebx+184]
mov [ebx+134], ecx
LevelScene_ammoset_exit:

cmp dword ptr [LevelScene_weaponset_enable], #0
je LevelScene_weaponset_exit
mov ebx, [eax+14]
test ebx, ebx
je LevelScene_weaponset_exit
mov ebx, [ebx+118]
test ebx, ebx
je LevelScene_weaponset_exit
mov ebx, [ebx+2c]
test ebx, ebx
je LevelScene_weaponset_exit
mov ebx, [ebx+10]
test ebx, ebx
je LevelScene_weaponset_exit
mov [ebx+13c], (float)9
mov [ebx+174], #2
mov [ebx+17c], #999
mov [ebx+188], (float)99
LevelScene_weaponset_exit:

mov eax, [LevelScene_temp1]
mov ebx, [LevelScene_temp2]
mov ecx, [LevelScene_temp3]
mov edx, [LevelScene_temp4]


LevelScene_originalcode:
readmem(LevelScene_searchedAOB, 6)


LevelScene_exit:
jmp LevelScene_returnhere


LevelScene_searchedAOB:
LevelScene_savedAOB:
jmp LevelScene_newmem
nop
LevelScene_returnhere:


[DISABLE]
LevelScene_savedAOB:
readmem(LevelScene_originalcode, 6)

unregistersymbol(LevelScene_originalcode)
unregistersymbol(LevelScene_savedAOB)

dealloc(LevelScene_newmem)
dealloc(LevelScene_temp1)
dealloc(LevelScene_temp2)
dealloc(LevelScene_temp3)
dealloc(LevelScene_temp4)
dealloc(LevelScene_temp5)"""

