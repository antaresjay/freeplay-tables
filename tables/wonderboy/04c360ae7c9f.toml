[[cheat]]
id = "no-hp-drop"
name = "No Hp Drop"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : WonderBoy.exe
  Version: 
  Date   : 2019-09-16
  Author : Anjinggila

  This script does blah blah blah
}

[ENABLE]
aobscanregion(uwrheirggsb,WBplayer:TakeDamage,WBplayer:TakeDamage+75,f2 0f 5c c1 f2 0f 5a e8 f3 0f 11 ae)
alloc(ywrheirggsb,$1000,uwrheirggsb)
label(uwrheirqgsb)
label(return)
registersymbol(uwrheirqgsb)
registersymbol(uwrheirggsb)
ywrheirggsb:
cvtsd2ss xmm5,xmm0
jmp return
uwrheirqgsb:
readmem(uwrheirggsb,8)
jmp return
uwrheirggsb:
jmp ywrheirggsb
nop 3
return:
[DISABLE]
uwrheirggsb:
readmem(uwrheirqgsb,8)
unregistersymbol(uwrheirqgsb)
unregistersymbol(uwrheirggsb)
dealloc(ywrheirggsb)"""

