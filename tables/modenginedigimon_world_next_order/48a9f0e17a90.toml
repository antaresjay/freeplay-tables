[[cheat]]
id = "infinite-mood"
name = "Infinite Mood"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(Mood,GameAssembly.dll,2B 47 64 85 C0)
alloc(newmem,$1000,Mood)
label(return)

newmem:
mov eax,#100
mov ebx,#100
sub eax,[rdi+64]
test eax,eax
jmp return

Mood:
  jmp newmem
return:
registersymbol(Mood)

[DISABLE]
Mood:
  db 2B 47 64 85 C0

unregistersymbol(Mood)
dealloc(newmem)"""

