[[cheat]]
id = "enable"
name = "[ ENABLE ]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(getG,EtherLoop.exe,8B 00 5F 5E 5B C2 04 00 8B 35 * * * * 85 F6 74 09 8B 06 A3 * * * * EB 2D 8B 35 * * * * 85 F6 75 10 B9 * * * * E8 * * * * 8B 35 * * * * FF 0D * * * * FF 05 * * * * 8B 06 A3 * * * * 8B 4F 54 56 89 4E 0C C7 06 00 00 00 00 8B)
alloc(InfiniteMoney,$1000)
alloc(_InfiniteMoney,8)
label(InfiniteMoneyExit)
label(ImmortalExit)
label(RapidFireExit)
label(code)
label(return)
globalalloc(cInfiniteMoney,4)
globalalloc(cImmortal,4)
globalalloc(cRapidFire,4)

_InfiniteMoney:
dq (double)900000

_Immortal:
dq (double)10

_RapidFire:
dq (double)20

InfiniteMoney:
cmp [eax+4],#239
jne InfiniteMoneyExit
cmp [cInfiniteMoney],#0
je InfiniteMoneyExit
push esi
mov esi,[eax]
fld qword ptr [_InfiniteMoney]
fstp qword ptr [esi]
pop esi
InfiniteMoneyExit:

cmp [eax+4],#857
jne ImmortalExit
cmp [cImmortal],#0
je ImmortalExit
push esi
mov esi,[eax]
fld qword ptr [_Immortal]
fstp qword ptr [esi]
pop esi
ImmortalExit:

cmp [eax+4],#423 //Projectile Speed = 908 / Crit Multipler = 235 (Near of each other anyways. Better to alloc blah blah...)
jne RapidFireExit
cmp [cRapidFire],#0
je RapidFireExit
push esi
mov esi,[eax]
fld qword ptr [_RapidFire]
fstp qword ptr [esi]
pop esi
RapidFireExit:

code:
  mov eax,[eax]
  pop edi
  pop esi
  pop ebx
  jmp return

getG:
  jmp InfiniteMoney
return:
registersymbol(getG)

[DISABLE]
getG:
  db 8B 00 5F 5E 5B

unregistersymbol(getG)
dealloc(InfiniteMoney)"""

