type = "script"
source = """
//Send@ModEngine
[ENABLE]

aobscan(critchance,49 63 94 24 FC 0A 00 00)
alloc(newmem,$1000,critchance)
label(code return)

newmem:
mov [r12+0AFC],#100

code:
  movsxd  rdx,dword ptr [r12+00000AFC]
  jmp return

critchance:
  jmp newmem
  nop 3
return:
registersymbol(critchance)

[DISABLE]

critchance:
  db 49 63 94 24 FC 0A 00 00

unregistersymbol(*)
dealloc(*)"""
