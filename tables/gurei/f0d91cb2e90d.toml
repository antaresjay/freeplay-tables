[ENABLE]

aobscanregion(combogroundedtime,PlayerState:CheckBasicComboTime,PlayerState:CheckBasicComboTime+100,F30F1088xxxx0000F3xxxxxxF2xxxxxxF3xxxxxxxxF3xxxxxxxxF3xxxxxx48xxxxxxF3xxxxxxxxxxxxxxF3xxxxxxF2xxxxxx66xxxxxx0Fxxxxxxxxxx0Fxxxxxxxxxx) //PlayerState:CheckBasicComboTime+31
