alloc(data,8)
alloc(combogroundedtimebkp,8)
registersymbol(data)
registersymbol(combogroundedtime)
registersymbol(combogroundedtimebkp)
label(code)
label(return)

combogroundedtimebkp:
  readmem(combogroundedtime,8)

newmem:
  mov [data],rax

code:
  readmem(combogroundedtime,8)
  jmp return

combogroundedtime:
  jmp newmem
  nop 3
return:

[DISABLE]

combogroundedtime:
  readmem(combogroundedtimebkp,8)

unregistersymbol(*)
dealloc(*)"""
