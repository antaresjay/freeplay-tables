[game]
name = "Mount and Blade - With Fire and Sword"
exe = "mb_wfas.exe"
notes = "Converted from a Cheat Engine table by STN. Source: https://fearlessrevolution.com/viewtopic.php?t=1973"
verified = []
author = "STN"

[meta]
source = "community"
