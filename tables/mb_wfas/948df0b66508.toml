[[cheat]]
id = "mb-wfas-v1-138-script"
name = "<- MB wFaS V1.138 Script "
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
===========================================
 Mount&Blade With Fire and Sword
 Game Version  : 1.138
 Script Version: 1.0
 CE Version    : 6.0
 Gode Mode and Money(thaler) and Ammo
 04-May-2011
 By Recifense
===========================================
}

[ENABLE]
//=========================================
// Check if script is compatible to this game version
// If false the script will not be loaded

assert(mb_wfas.exe+253ff1,d9 87 e4 6f 00 00)
assert(mb_wfas.exe+0f9eac,8b 80 dc 40 01 00)
assert(mb_wfas.exe+0efe44,d9 96 e4 6f 00 00)
assert(mb_wfas.exe+10664A,81 e1 ff 00 00 00)

//=========================================
alloc(MyCode,1024)
//=========================================
// Declaration section
label(_MonHero)
label(_BackMH)
label(_ExitMH)
label(_MonHero1)
label(_BackMH1)
label(_ExitMH1)
label(_GodMode)
label(_GodM0)
label(_BackGM)
label(_ExitGM)
label(_MonAmmo)
label(_BackMA)
label(_ExitMA)
label(pSel)
label(pUnitHP)
label(pUnitInfo)
label(iEnableGM)
label(iEnableMM)
label(iEnableMA)
label(iPlayerID)

registersymbol(MyCode)
registersymbol(pSel)
registersymbol(pUnitHP)
registersymbol(pUnitInfo)
registersymbol(iEnableGM)
registersymbol(iEnableMM)
registersymbol(iEnableMA)
registersymbol(iPlayerID)

//=========================================
MyCode:
//=========================================
_MonHero:
 mov [pUnitHP],edi

 cmp dword ptr [iEnableGM],0
 je _ExitMH                        // Jump if feature is disabled

 mov eax,[edi+00006Fe0]            // Get max HP
 mov [edi+00006FE4],eax            // Upd Cur HP

_ExitMH:
 fld dword ptr [edi+00006FE4]      // Original code (rds HP)
 jmp _BackMH                       // Back to main code

//=========================================
_MonHero1:
 mov eax,[eax+000140DC]            // Original code
 mov [pUnitInfo],eax

 cmp dword ptr [iEnableMM],0
 je _ExitMH1                       // Jump if feature is disabled

 cmp dword ptr [eax+000005d0],#50000 // Thaler
 jge _ExitMH1

 mov dword ptr [eax+000005d0],#50000

_ExitMH1:
 jmp _BackMH1                      // Back to main code

//=========================================
_GodMode:
 cmp dword ptr [iEnableGM],0
 je _ExitGM                        // Jump if feature is disabled

 cmp esi,[pUnitHP]
 je _GodM0

 cmp dword ptr [esi+00006fd4],0
 je _ExitGM

// cmp dword ptr [esi+00006f88],2    // Include companions
// jne _ExitGM

_GodM0:
 fstp st(0)

 fld dword ptr [esi+00006FE0]

_ExitGM:
 fst dword ptr [esi+00006FE4]      // Original code (upd HP)
 jmp _BackGM                       // Back to main code

//=========================================
_MonAmmo:
 cmp dword ptr [iEnableMA],0
 je _ExitMA                        // Jump if feature is disabled

 mov ecx,[esp+10]
 cmp dword ptr [ecx+00006fd4],0
 je _ExitMA

 xor ecx,ecx
 mov [esi+04],ecx                  // Make spent_ammo = 0
 mov [esi-04],ecx                  // Reload ammo

_ExitMA:
 mov ecx,[esi+04]                  // Restore ECX
 and ecx,000000FF                  // Original code
 jmp _BackMA                       // Back to main code

//=========================================
// Variables
iEnableGM:
 dd 1
iEnableMM:
 dd 1
iEnableMA:
 dd 1
pSel:
 dd 0
pUnitHP:
 dd 0
pUnitInfo:
 dd 0
iPlayerID:
 dd 0

//=========================================
// Hacking Points
mb_wfas.exe+253ff1:
 jmp _MonHero
 nop
_BackMH:

mb_wfas.exe+0f9eac:
 jmp _MonHero1
 nop
_BackMH1:

mb_wfas.exe+0efe44:
 jmp _GodMode
 nop
_BackGM:

mb_wfas.exe+10664A:
 jmp _MonAmmo
 nop
_BackMA:

//=========================================
// Original Codes
[DISABLE]
mb_wfas.exe+253ff1:
 fld dword ptr [edi+00006FE4]

mb_wfas.exe+0f9eac:
 mov eax,[eax+000140DC]

mb_wfas.exe+0efe44:
 fst dword ptr [esi+00006FE4]

mb_wfas.exe+10664A:
 and ecx,000000FF

unregistersymbol(MyCode)
unregistersymbol(pSel)
unregistersymbol(pUnitHP)
unregistersymbol(pUnitInfo)
unregistersymbol(iEnableGM)
unregistersymbol(iEnableMM)
unregistersymbol(iEnableMA)
unregistersymbol(iPlayerID)

dealloc(MyCode)"""

