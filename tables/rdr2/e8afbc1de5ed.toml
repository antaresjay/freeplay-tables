type = "script"
source = """
[ENABLE]
aobscanmodule(speed,RDR2.exe,41 40 66 0F 6B F6 0F 5C E9 0F 28 CA 0F C6 EB) //"RDR2.exe"+27876E2
alloc(newmem,1024,speed)

label(code)
label(return)

registersymbol(speed)

//-------------------------
label(multiplier)
registersymbol(multiplier)
label(_multiplier)
registersymbol(_multiplier)
//-------------------------

newmem:
  pushfq
  push rsi
  sub rsp,20

  mov esi,[_multiplier]
  mov [multiplier],esi
  mov [multiplier+4],esi
  mov [multiplier+4+4],esi

  mov rsi,[baseM]
  cmp rcx,rsi
  jne code

  movdqu [rsp],xmm7
  movdqu [rsp+10],xmm0

  movdqu xmm0,[rcx+70]
  punpckhwd xmm0,xmm0
  psrad xmm0,10
  cvtdq2ps xmm0,xmm0
  pshufd xmm7,xmm0,-12
  mulps xmm7,[RDR2.exe+3239AC0]
  addps xmm7,[rcx+70]

  subps xmm5,xmm7
  movdqu xmm0,[multiplier]
  mulps xmm5,xmm0
  addps xmm5,xmm7

  movdqu xmm7,[rsp]
  movdqu xmm0,[rsp+10]

code:
  add rsp,20
  pop rsi
  popfq
  packssdw xmm6,xmm6
  subps xmm5,xmm1
  jmp return

_multiplier:
  dd (float)2
multiplier:
  dd (float)2
  dd (float)2
  dd (float)2
  dd (float)1

speed+02:
  jmp newmem
  nop 2
return:

[DISABLE]
speed+02:
  db 66 0F 6B F6 0F 5C E9

unregistersymbol(speed)
unregistersymbol(multiplier)
unregistersymbol(_multiplier)
dealloc(newmem)

