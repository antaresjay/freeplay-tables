[[cheat]]
id = "mechs-movement-on-grid-100"
name = "Mechs Movement on Grid +100"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Into the Breach
  Author : plaxor
}

[ENABLE]
aobScanModule(getMoveSpeed, Breach.exe, 56 8B F1 8B 06 8B * * FF D0 84 C0 75)
alloc(newmem, $1000)

newmem:
  call isPlayer
  test al al
  je short getMoveSpeed_bytes
  mov eax #100
  ret

getMoveSpeed_bytes:
  readMem(getMoveSpeed, 5)
  jmp return

getMoveSpeed:
  jmp newmem
return:
registersymbol(getMoveSpeed getMoveSpeed_bytes)

[DISABLE]
getMoveSpeed:
  readMem(getMoveSpeed_bytes, 5)

unregistersymbol(getMoveSpeed getMoveSpeed_bytes)
dealloc(newmem)"""

