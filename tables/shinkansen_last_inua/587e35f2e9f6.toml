[[cheat]]
id = "platformercontroller-base-address-scan-initialization-activate-this-first"
name = "PlatformerController Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlatformerController_basepointer)
registersymbol(PlatformerController_update_enable)
registersymbol(PlatformerController_set_enable)
registersymbol(PlatformerController_jumpset_enable)
registersymbol(PlatformerController_godmodeset_enable)
registersymbol(PlatformerController_healthset_enable)
registersymbol(PlatformerController_positionset_enable)
registersymbol(PlatformerController_positionsetx_value)
registersymbol(PlatformerController_positionsety_value)

alloc(PlatformerController_basepointer,4)
alloc(PlatformerController_update_enable,4)
alloc(PlatformerController_set_enable,4)
alloc(PlatformerController_jumpset_enable,4)
alloc(PlatformerController_godmodeset_enable,4)
alloc(PlatformerController_healthset_enable,4)
alloc(PlatformerController_positionset_enable,4)
alloc(PlatformerController_positionsetx_value,4)
alloc(PlatformerController_positionsety_value,4)


[DISABLE]
unregistersymbol(PlatformerController_basepointer)
unregistersymbol(PlatformerController_update_enable)
unregistersymbol(PlatformerController_set_enable)
unregistersymbol(PlatformerController_jumpset_enable)
unregistersymbol(PlatformerController_godmodeset_enable)
unregistersymbol(PlatformerController_healthset_enable)
unregistersymbol(PlatformerController_positionset_enable)
unregistersymbol(PlatformerController_positionsetx_value)
unregistersymbol(PlatformerController_positionsety_value)

dealloc(PlatformerController_basepointer)
dealloc(PlatformerController_update_enable)
dealloc(PlatformerController_set_enable)
dealloc(PlatformerController_jumpset_enable)
dealloc(PlatformerController_godmodeset_enable)
dealloc(PlatformerController_healthset_enable)
dealloc(PlatformerController_positionset_enable)
dealloc(PlatformerController_positionsetx_value)
dealloc(PlatformerController_positionsety_value)"""

[[cheat]]
id = "platformercontroller-base-address-scan-to-activate-play-to-update-play"
name = "PlatformerController Base Address Scan (To Activate: Play, To Update: Play)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlatformerController_savedAOB)
label(PlatformerController_returnhere)
label(PlatformerController_originalcode)
label(PlatformerController_exit)

label(PlatformerController_update_exit)
label(PlatformerController_set_exit)
label(PlatformerController_jumpset_exit)
label(PlatformerController_healthset_exit)
label(PlatformerController_godmodeset_exit)
label(PlatformerController_positionset_exit)
label(PlatformerController_positionsave_exit)

registersymbol(PlatformerController_savedAOB)

// PlatformerController:CustomUpdate+447
aobscan(PlatformerController_searchedAOB,0F B6 87 8C 00 00 00 85 C0 * * * * * * 8B 47 24 89 85 40 FF FF FF 8D 8D 64 FF FF FF)

alloc(PlatformerController_newmem,2048)
alloc(PlatformerController_temp1,4)


PlatformerController_newmem:
mov [PlatformerController_temp1], ebx

cmp dword ptr [PlatformerController_update_enable], #0
je PlatformerController_update_exit
cmp byte ptr [edi+7c], #1
jne PlatformerController_update_exit
mov [PlatformerController_basepointer], edi
PlatformerController_update_exit:

cmp dword ptr [PlatformerController_set_enable], #0
je PlatformerController_set_exit
PlatformerController_set_exit:

cmp dword ptr [PlatformerController_jumpset_enable], #0
je PlatformerController_jumpset_exit
cmp dword ptr [edi+48], #0
je PlatformerController_jumpset_exit
mov ebx, [edi+48]
cmp dword ptr [ebx+10], #0
je PlatformerController_jumpset_exit
mov ebx, [ebx+10]
cmp dword ptr [ebx+3c], #0
je PlatformerController_jumpset_exit
mov ebx, [ebx+3c]
mov [ebx+4c], (float)29.391485214
cmp dword ptr [edi+58], #0
je PlatformerController_jumpset_exit
mov ebx, [edi+58]
mov [ebx+10], (float)100
mov [ebx+14], (float)100
PlatformerController_jumpset_exit:

cmp dword ptr [PlatformerController_godmodeset_enable], #0
je PlatformerController_godmodeset_exit
mov byte ptr [edi+8e], #1
PlatformerController_godmodeset_exit:

cmp dword ptr [PlatformerController_healthset_enable], #0
je PlatformerController_healthset_exit
mov [edi+ac], #100
PlatformerController_healthset_exit:

cmp dword ptr [PlatformerController_positionset_enable], #0
je PlatformerController_positionset_exit

cmp dword ptr [edi+24], #0
je PlatformerController_positionset_exit
mov ebx, [edi+24]
cmp dword ptr [ebx+c], #0
je PlatformerController_positionset_exit
mov ebx, [ebx+c]

cmp byte ptr [edi+7c], #1
jne PlatformerController_positionsave_exit

fld [ebx+2c]
fstp [PlatformerController_positionsetx_value]
fld [ebx+30]
fstp [PlatformerController_positionsety_value]
jmp PlatformerController_positionset_exit
PlatformerController_positionsave_exit:

mov [PlatformerController_positionset_enable], #0
fld [PlatformerController_positionsetx_value]
fstp [ebx+2c]
fld [PlatformerController_positionsety_value]
fstp [ebx+30]
PlatformerController_positionset_exit:


mov ebx, [PlatformerController_temp1]


PlatformerController_originalcode:
db 0F B6 87 8C 00 00 00
//movzx eax,byte ptr [edi+0000008C]


PlatformerController_exit:
jmp PlatformerController_returnhere


PlatformerController_searchedAOB:
PlatformerController_savedAOB:
jmp PlatformerController_newmem
nop
nop
PlatformerController_returnhere:


[DISABLE]
PlatformerController_savedAOB:
db 0F B6 87 8C 00 00 00
//movzx eax,byte ptr [edi+0000008C]

unregistersymbol(PlatformerController_savedAOB)

dealloc(PlatformerController_newmem)
dealloc(PlatformerController_temp1)"""

