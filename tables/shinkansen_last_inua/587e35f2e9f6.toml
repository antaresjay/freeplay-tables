[[cheat]]
id = "freezeskill-base-address-scan-initialization-activate-this-first"
name = "FreezeSkill Base Address Scan Initialization (Activate This First)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(FreezeSkill_basepointer)
registersymbol(FreezeSkill_update_enable)
registersymbol(FreezeSkill_set_enable)

alloc(FreezeSkill_basepointer,4)
alloc(FreezeSkill_update_enable,4)
alloc(FreezeSkill_set_enable,4)


[DISABLE]
unregistersymbol(FreezeSkill_basepointer)
unregistersymbol(FreezeSkill_update_enable)
unregistersymbol(FreezeSkill_set_enable)

dealloc(FreezeSkill_basepointer)
dealloc(FreezeSkill_update_enable)
dealloc(FreezeSkill_set_enable)"""

[[cheat]]
id = "freezeskill-base-address-scan-to-activate-play-to-update-play"
name = "FreezeSkill Base Address Scan (To Activate: Play, To Update: Play)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(FreezeSkill_savedAOB)
label(FreezeSkill_returnhere)
label(FreezeSkill_originalcode)
label(FreezeSkill_exit)

label(FreezeSkill_update_exit)
label(FreezeSkill_set_exit)

registersymbol(FreezeSkill_savedAOB)

// FreezeSkill:FixedUpdate+9
aobscan(FreezeSkill_searchedAOB,C6 40 50 00 C9 C3)

alloc(FreezeSkill_newmem,2048)


FreezeSkill_newmem:
cmp dword ptr [FreezeSkill_update_enable], #0
je FreezeSkill_update_exit
mov [FreezeSkill_basepointer], eax
FreezeSkill_update_exit:

cmp dword ptr [FreezeSkill_set_enable], #0
je FreezeSkill_set_exit
mov [eax+3c], (float)100
FreezeSkill_set_exit:


FreezeSkill_originalcode:
db C6 40 50 00 C9
//mov byte ptr [eax+50],00
//leave


FreezeSkill_exit:
jmp FreezeSkill_returnhere


FreezeSkill_searchedAOB:
FreezeSkill_savedAOB:
jmp FreezeSkill_newmem
FreezeSkill_returnhere:


[DISABLE]
FreezeSkill_savedAOB:
db C6 40 50 00 C9
//mov byte ptr [eax+50],00
//leave

unregistersymbol(FreezeSkill_savedAOB)

dealloc(FreezeSkill_newmem)"""

