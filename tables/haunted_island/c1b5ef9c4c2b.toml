[[cheat]]
id = "gold-gems-pick-up-gold-to-activate-pointers"
name = "Gold & Gems [Pick up Gold to Activate Pointers]"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(gold, 89 48 58 83 EC 0C)
alloc(newmem, $1000)
label(code)
label(return)

globalalloc(goldbase, 4)

newmem:

code:
mov [goldbase], eax
mov [eax+58], ecx
sub esp, 0C
jmp return

gold:
jmp code
nop

return:
registersymbol(gold)

[DISABLE]
gold:
db 89 48 58 83 EC 0C
unregistersymbol(gold)
dealloc(newmem)
dealloc(goldbase)"""

