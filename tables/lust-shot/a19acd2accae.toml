[[cheat]]
id = "focus-the-game-to-update-the-pointer"
name = "𝗥𝗼𝘂𝗻𝗱𝘀𝗦𝘆𝘀𝘁𝗲𝗺 𝗣𝗼𝗶𝗻𝘁𝗲𝗿 (focus the game to update the pointer)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Date   : 2024-08-07
  Author : Igromanru

  RoundsSystem Pointer
}

[ENABLE]
AOBScanRegion(updateRoundsSys, "RoundsSystem:Update", "RoundsSystem:Update"+34, 48 8B F1 48 8B ? ? 48 8B C8)
alloc(newmem,$100,updateRoundsSys)

label(updateRoundsSysBackUp)
label(roundsSystemPtr)
label(return)

newmem:
updateRoundsSysBackUp:
  readMem(updateRoundsSys, 7)
  mov [roundsSystemPtr], rsi
  jmp return

roundsSystemPtr:
  dq 0

updateRoundsSys:
  jmp newmem
  nop 2
return:

registersymbol(updateRoundsSys)
registersymbol(updateRoundsSysBackUp)
registersymbol(roundsSystemPtr)

[DISABLE]
updateRoundsSys:
  readMem(updateRoundsSysBackUp, 7)

dealloc(newmem)
unregistersymbol(updateRoundsSys)
unregistersymbol(updateRoundsSysBackUp)
unregistersymbol(roundsSystemPtr)

{
// ORIGINAL CODE - INJECTION POINT: RoundsSystem:Update+c

RoundsSystem:Update: 55                       - push rbp
RoundsSystem:Update+1: 48 8B EC                 - mov rbp,rsp
RoundsSystem:Update+4: 48 83 EC 40              - sub rsp,40
RoundsSystem:Update+8: 48 89 75 F8              - mov [rbp-08],rsi
// ---------- INJECTING HERE ----------
RoundsSystem:Update+c: 48 8B F1                 - mov rsi,rcx
RoundsSystem:Update+f: 48 8B 46 20              - mov rax,[rsi+20]
// ---------- DONE INJECTING  ----------
RoundsSystem:Update+13: 48 8B C8                 - mov rcx,rax
RoundsSystem:Update+16: 83 39 00                 - cmp dword ptr [rcx],00
RoundsSystem:Update+19: F3 0F 10 40 20           - movss xmm0,[rax+20]
RoundsSystem:Update+1e: F3 0F 5A C0              - cvtss2sd xmm0,xmm0
RoundsSystem:Update+22: F2 0F 5A E8              - cvtsd2ss xmm5,xmm0
RoundsSystem:Update+26: F3 0F 11 6D F4           - movss [rbp-0C],xmm5
RoundsSystem:Update+2b: F3 0F 10 45 F4           - movss xmm0,[rbp-0C]
RoundsSystem:Update+30: F3 0F 5A C0              - cvtss2sd xmm0,xmm0
RoundsSystem:Update+34: F3 0F 10 0D 34 01 00 00  - movss xmm1,[RoundsSystem:Update+170]
}"""

