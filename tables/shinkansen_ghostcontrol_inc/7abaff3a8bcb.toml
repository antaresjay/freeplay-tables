dealloc(money_basepointer)
dealloc(moneyupdate_enable)
dealloc(moneyset_enable)"""

[[cheat]]
id = "money-base-address-scan-to-activate-sell-ectoplasm-to-update-sell-ectoplasm"
name = "Money Base Address Scan (To Activate: Sell Ectoplasm, To Update: Sell Ectoplasm)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(money_savedAOB)
label(money_returnhere)
label(money_originalcode)
label(money_exit)

label(moneyupdate_exit)
label(moneyset_exit)

registersymbol(money_savedAOB)

aobscan(searchedAOB,83 EC 24 8B 5D 08 8B 43 08 03 45 0C)

alloc(money_newmem,2048) //2kb should be enough


money_newmem:
cmp dword ptr [moneyupdate_enable], #0
je moneyupdate_exit
mov [money_basepointer], ebx
moneyupdate_exit:

cmp dword ptr [moneyset_enable], #0
mov [ebx+8], #99999999
je moneyset_exit
moneyset_exit:


money_originalcode:
db 8B 43 08 03 45 0C
//mov eax,[ebx+08]
//add eax,[ebp+0C]


money_exit:
jmp money_returnhere


searchedAOB + 6:
money_savedAOB:
jmp money_newmem
nop
money_returnhere:


[DISABLE]
money_savedAOB:
db 8B 43 08 03 45 0C
//mov eax,[ebx+08]
//add eax,[ebp+0C]

unregistersymbol(money_savedAOB)

dealloc(money_newmem)"""

