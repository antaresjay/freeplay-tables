[[cheat]]
id = "money-base-address-scan-initialization-activate-this-first"
name = "Money Base Address Scan Initialization (Activate This First)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

registersymbol(money_basepointer)
registersymbol(moneyupdate_enable)
registersymbol(moneyset_enable)

alloc(money_basepointer,4)
alloc(moneyupdate_enable,4)
alloc(moneyset_enable,4)


[DISABLE]

