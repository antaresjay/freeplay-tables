[[cheat]]
id = "instant-unit-build"
name = "Instant Unit build"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(aobGetProgress,90 66 8B 41 08 C3 90)

alloc(newmem,2048) //2kb should be enough

label(aobGetProgress_r)
label(lblGetProgress)
label(lblGetProgressDone)

registersymbol(aobGetProgress_r)

newmem:
lblGetProgress:
mov ax,[ecx+08] // Original code
pushfd
cmp ax, 1
jle short lblGetProgressDone
mov ax,1
mov [ecx+08],ax
lblGetProgressDone:
popfd
ret             // Original code

//"SpellForce.exe"+38D1D0:
aobGetProgress+1:
aobGetProgress_r:
jmp lblGetProgress

[DISABLE]
//"SpellForce.exe"+38D1D0:
aobGetProgress_r:
//Alt: mov ax,[ecx+08]
//Alt: ret
db 66 8B 41 08 C3

unregistersymbol(aobGetProgress_r)

dealloc(newmem)"""
