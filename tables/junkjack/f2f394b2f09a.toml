[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(infiniteHealth,F3 0F 10 8B 20 01 00 00 F3 0F 59 C6 F3 0F 5C C8)
registersymbol(infiniteHealth)

infiniteHealth+C:
  db 90 90 90 90 //nops

[DISABLE]
