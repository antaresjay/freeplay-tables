source = """
[ENABLE]
alloc(newmem,4096)
alloc(buffer,512)
aobscan(aobEnergy,F3 0F 7E 87 48 01 00 00 8B 48 10)

label(aobEnergy_r)
label(lblEnergy)
label(lblEnergyEnergyUpOk)
