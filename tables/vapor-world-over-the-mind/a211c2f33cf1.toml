[[cheat]]
id = "vapor-editor-ctrl-numpad-1-will-only-populate-when-vapor-is-depleted"
name = "Vapor Editor (Ctrl + Numpad 1) {Will only populate when 'Vapor' is depleted}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Vapor World Over The Mind.exe
// Author            : ndck76
// Executable Version: 2021.2.14.40468
// Game Version      : Build.13010005 (Demo)
// Script Date       : 2023-12-23


[ENABLE]
//using SCRIPTASSEMBLY Image
aobscanregion(vapor,PointController:Add,PointController:Add+500,F30F10xxxxF3xxxxxx49xxxxF2xxxxxxF2xxxxxx41xxxxxx48xxxxxx48xxxxxx4Cxxxxxx48xxxxxx5DC3) //PointController:Add+31e
alloc(newmem,$1000,vapor)
alloc(data2,8)
alloc(vaporbkp,5)
registersymbol(data2)
registersymbol(vapor)
registersymbol(vaporbkp)
label(code)
label(return)

vaporbkp:
  readmem(vapor,5)

newmem:
  mov [data2],rsi

code:
  readmem(vapor,5)
  jmp return

vapor:
  jmp newmem
return:

[DISABLE]

vapor:
  readmem(vaporbkp,5)

unregistersymbol(*)
dealloc(*)"""

