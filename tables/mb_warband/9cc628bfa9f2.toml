[[cheat]]
id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(ammo,mb_warband.exe,8B 4E 04 81 E1 FF 00 00 00 2B C1 74)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  mov [esi+04], 0
  mov ecx, [esi+04]
  and ecx, 000000FF
  jmp return

ammo:
  jmp newmem
  nop
  nop
  nop
  nop
return:
registersymbol(ammo)

[DISABLE]

ammo:
  db 8B 4E 04 81 E1 FF 00 00 00

unregistersymbol(ammo)
dealloc(newmem)"""
