Memory:
push eax
lea eax,[edx+ebx+04]
sub eax,04
mov [var0],eax
mov eax,[eax+7B4]
mov [iPlayerTeam],eax
lea eax,[edx+ebx+04]
sub eax,04
cmp [vINFIT],1
jne short NoSpread
cmp [eax+7D8],#100
jae short @F
mov [eax+7D8],0
@@:
cmp [eax+7E0],#100
jae short NoSpread
mov [eax+7E0],0
NoSpread:
cmp [vNOSPR],1
jne short @F
mov [eax+5E58],0
mov [eax+5E5C],0
@@:
pop eax
Exit:
mov edx,[esi+20]
mov ecx,eax
jmp ReturnM

Stats:
cmp [ecx+000000A4],'Play'
jne short STExit
mov [var1],ecx
STExit:
fild dword ptr [ecx+00000274]
jmp ReturnST

GodMode:
cmp dword ptr [edi+00005EA0],00
call KillsEnemy
pushfd
pushad
mov eax,[var0]
test eax,eax
je short GM_False
mov ecx,[iPlayerTeam]
cmp [edi+7B4],ecx
jne short GM_False
cmp edi,eax
je short gPlayer
cmp [vGMa],1
jne short @F
jmp GM_True
@@:
jmp GM_False
gPlayer:
cmp [vGM],1
jne short GM_False
jmp GM_True
GM_False:
popad
popfd
je ReturnGM+22E0
cmp [vOHK],1
jne short OHK_Exit
push eax
mov eax,[iPlayerTeam]
cmp [edi+7B4],eax
pop eax
je short OHK_Exit
cmp [edi+7B4],FFFFFFFF
je short OHK_Exit
fld dword ptr [edi+5FFC]
fstp dword ptr [Variable]
fld dword ptr [Variable]
jmp ReturnGM+C
OHK_Exit:
jmp ReturnGM+6
GM_True:
xor ecx,ecx
mov [edi+00005EA0],ecx
popad
popfd
jmp ReturnGM+22E0

KillsEnemy:
pushfd
pushad
cmp [vKill],1
jne short KE_Exit
mov eax,[var0]
test eax,eax
je short KE_Exit
//cmp edi,eax
//je short KE_Exit
mov ecx,[iPlayerTeam]
cmp [edi+7B4],ecx
je short KE_Exit
cmp [edi+7B4],FFFFFFFF
je short KE_Exit
mov [vKill],0
mov dword ptr [edi+00005EA0],1
mov dword ptr [edi+00005EF4],FFFFFFFF
mov dword ptr [edi+00005EDC],0
fild dword ptr [eax+00000008]
fistp dword ptr [edi+00005EA8]
fld dword ptr [edi+00005FFC]
fstp dword ptr [edi+00005EE8]
KE_Exit:
popad
popfd
ret

Horse:
mov [var2],edi
HR_Exit:
fld dword ptr [edi+00006000]
jmp ReturnHR

Archery:
cmp byte ptr [esp+13],00
pushfd
pushad
mov eax,[var0]
test eax,eax
je short AC_Exit
mov ecx,[eax+08]
cmp ecx,[ebp+08]
jne short AC_Exit
cmp [vRPF],1
jne short AC_Exit
popad
popfd
jne ReturnAC+419
jmp ReturnAC+6
AC_Exit:
popad
popfd
jmp ReturnAC

Throwing:
push eax
cmp [vRPF],1
jne short TW_Exit
mov eax,[var0]
test eax,eax
je short TW_Exit
cmp ebp,eax
jne short TW_Exit
pop eax
mov [ebp+00005DFC],00000002
jmp ReturnTW

TW_Exit:
pop eax
mov [ebp+00005DFC],00000006
jmp ReturnTW

