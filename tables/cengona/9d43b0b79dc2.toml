[[cheat]]
id = "upgrade-config-ctrl-numpad-2-go-to-the-save-station-and-select-upgrades-and-hover-over-any-upgrade"
name = "Upgrade Config (Ctrl + Numpad 2) {Go to the 'Save Station' and select 'Upgrades' and hover over any upgrade}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Cengona.exe
// Author            : ndck76
// Executable Version: 2022.3.62.28864
// Game Version      : v161.5.1.f
// Script Date       : 2025-12-07


[ENABLE]

aobscanregion(basecost,Game.Logic.Runtime.UpgradeData:GetCost,Game.Logic.Runtime.UpgradeData:GetCost+100,4863xxxx48xxxxxx48xxxxxx0Fxxxx03xx48xxxxxx48xxxxxx5DC3) //Game.Logic.Runtime.UpgradeData:GetCost+26
alloc(newmem,$1000,basecost)
alloc(data4,8)
alloc(basecostbkp,8)
registersymbol(data4)
registersymbol(basecost)
registersymbol(basecostbkp)
label(code)
label(return)

basecostbkp:
  readmem(basecost,8)

newmem:
  mov [data4],rax

code:
  readmem(basecost,8)
  jmp return

basecost:
  jmp newmem
  nop 3
return:

[DISABLE]

basecost:
  readmem(basecostbkp,8)

unregistersymbol(*)
dealloc(*)"""

