type = "script"
source = """
[ENABLE]

aobscanmodule(durable,GameAssembly.dll,4C 8B 40 28 48 8B D1 48 8B 48 40 FF 50 18 48 83 C4 28 C3 CC CC CC CC CC CC CC CC CC 48)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov [rcx+28], (float)100.0

code:
  mov r8,[rax+28]
  mov rdx,rcx
  mov rcx,[rax+40]
  call qword ptr [rax+18]
  jmp return

durable:
  jmp far newmem
return:
registersymbol(durable)

[DISABLE]

durable:
  db 4C 8B 40 28 48 8B D1 48 8B 48 40 FF 50 18

unregistersymbol(durable)
dealloc(newmem)"""
