[[cheat]]
id = "get-player"
name = "Get Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
define(address,Player_Motor:Update)
define(bytes,55 48 8B EC 48 83 EC 30)

define(address2,TimeManager:Update)
define(bytes2,48 83 EC 08 48 83 C4 08)

define(address3,StockMarketManager:UpdateUI)
define(bytes3,55 48 8B EC 48 81 EC C0 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Player_Motor:Update)
label(code return Motor)
registersymbol(Motor)

newmem:
mov [Motor],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,30
  jmp return

Motor:
dq 0

address:
  jmp newmem
  nop 3
return:

assert(address2,bytes2)
alloc(newmem2,$1000,TimeManager:Update)
registersymbol(Time)
label(code2 return2 Time)

newmem2:
mov [Time],rcx

code2:
  sub rsp,08
  add rsp,08
  jmp return2

Time:
dq 0

address2:
  jmp newmem2
  nop 3
return2:

assert(address3,bytes3)
alloc(newmem3,$1000,StockMarketManager:UpdateUI)
registersymbol(Stock)
label(code3 return3 Stock)

newmem3:
mov [Stock],rcx

code3:
  push rbp
  mov rbp,rsp
  sub rsp,000000C0
  jmp return3

Stock:
dq 0

address3:
  jmp newmem3
  nop 6
return3:

[DISABLE]

address:
  db bytes
address2:
  db bytes2
address3:
  db bytes3

  unregistersymbol(*)
  dealloc(*)"""
