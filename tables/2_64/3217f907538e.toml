// Game Executable   : Ultimate Zombie Defense 2_64.exe
// Author            : ndck76
// Executable Version: 2022.3.39.6927
// Game Version      : v0.6.1 (Early Access)
// Script Date       : 2024-10-02


[ENABLE]

aobscanmodule(ammo,GameAssembly.dll,F3xxxxxxxx33xx488Bxx89) //HQFPSTemplate.Equipment.ProjectileWeapon.UpdateAmmoInfo
alloc(newmem,$1000,ammo)
alloc(ammobkp,5)
registersymbol(ammo)
registersymbol(ammobkp)
label(code)
label(return)

ammobkp:
  readmem(ammo,5)

newmem:
  mov [rax+24],(float)99

code:
  readmem(ammo,5)
  jmp return

ammo:
  jmp newmem
return:

[DISABLE]

ammo:
  readmem(ammobkp,5)

unregistersymbol(*)
dealloc(*)"""
