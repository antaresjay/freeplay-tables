[[cheat]]
id = "npcbase-base-address-scan-initialization-activate-this-first"
name = "NpcBase Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(NpcBase_basepointer)
registersymbol(NpcBase_update_enable)
registersymbol(NpcBase_set_enable)
registersymbol(NpcBase_playerset_enable)
registersymbol(NpcBase_speedset_enable)
registersymbol(NpcBase_weaponset_enable)
registersymbol(NpcBase_victimset_enable)

alloc(NpcBase_basepointer, 4)
alloc(NpcBase_update_enable, 4)
alloc(NpcBase_set_enable, 4)
alloc(NpcBase_playerset_enable, 4)
alloc(NpcBase_speedset_enable, 4)
alloc(NpcBase_weaponset_enable, 4)
alloc(NpcBase_victimset_enable, 4)


[DISABLE]
unregistersymbol(NpcBase_basepointer)
unregistersymbol(NpcBase_update_enable)
unregistersymbol(NpcBase_set_enable)
unregistersymbol(NpcBase_playerset_enable)
unregistersymbol(NpcBase_speedset_enable)
unregistersymbol(NpcBase_weaponset_enable)
unregistersymbol(NpcBase_victimset_enable)

dealloc(NpcBase_basepointer)
dealloc(NpcBase_update_enable)
dealloc(NpcBase_set_enable)
dealloc(NpcBase_playerset_enable)
dealloc(NpcBase_speedset_enable)
dealloc(NpcBase_weaponset_enable)
dealloc(NpcBase_victimset_enable)"""

[[cheat]]
id = "npcbase-base-address-scan-to-activate-load-level-to-update-play-level"
name = "NpcBase Base Address Scan (To Activate: Load Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(NpcBase_savedAOB)
label(NpcBase_returnhere)
label(NpcBase_originalcode)
label(NpcBase_exit)

label(NpcBase_update_exit)
label(NpcBase_set_exit)
label(NpcBase_playerset_exit)
label(NpcBase_speedset_exit)
label(NpcBase_weaponset_exit)
label(NpcBase_victimset_entry)
label(NpcBase_victimset_exit)

registersymbol(NpcBase_savedAOB)

//1745D60E - EE                    - out dx,al
//1745D60F - D9 9D 40FFFFFF        - fstp dword ptr [ebp-000000C0]
// Assets.Scripts.Npc:NpcBase:UpdateRayVisionTarget+62
//1745D615 - 0FB6 87 CC000000      - movzx eax,byte ptr [edi+000000CC]
//1745D61C - 85 C0                 - test eax,eax
//1745D61E - 0F84 F4020000         - je 1745D918
//1745D624 - 8B 47 58              - mov eax,[edi+58]
//1745D627 - 83 EC 08              - sub esp,08
//1745D62A - 6A 00                 - push 00
aobscan(NpcBase_searchedAOB, 0F B6 87 CC 00 00 00 85 C0 * * * * * * 8B 47 58)

alloc(NpcBase_newmem, 2048)
alloc(NpcBase_temp1, 4)


NpcBase_newmem:
mov [NpcBase_temp1], ebx

cmp dword ptr [edi+c], #0
je NpcBase_victimset_exit
mov ebx, [edi+c]
cmp byte ptr [ebx+33], #1
jne NpcBase_victimset_entry

cmp dword ptr [NpcBase_update_enable], #0
je NpcBase_update_exit
mov [NpcBase_basepointer], edi
NpcBase_update_exit:

cmp dword ptr [NpcBase_set_enable], #0
je NpcBase_set_exit
NpcBase_set_exit:

cmp dword ptr [NpcBase_playerset_enable], #0
je NpcBase_playerset_exit
cmp dword ptr [edi+c], #0
je NpcBase_playerset_exit
mov ebx, [edi+c]
mov byte ptr [ebx+81], #1
mov byte ptr [ebx+82], #1
NpcBase_playerset_exit:

cmp dword ptr [NpcBase_speedset_enable], #0
je NpcBase_speedset_exit
cmp dword ptr [edi+10], #0
je NpcBase_speedset_exit
mov ebx, [edi+10]
mov [ebx+38], (float)2
mov [ebx+40], (float)2
mov [ebx+44], (float)2
NpcBase_speedset_exit:

cmp dword ptr [NpcBase_weaponset_enable], #0
je NpcBase_weaponset_exit
cmp dword ptr [edi+14], #0
je NpcBase_weaponset_exit
mov ebx, [edi+14]
mov [ebx+24], #999
mov byte ptr [ebx+44], #0
NpcBase_weaponset_exit:

jmp NpcBase_victimset_exit

NpcBase_victimset_entry:
cmp dword ptr [NpcBase_victimset_enable], #0
je NpcBase_victimset_exit
cmp dword ptr [edi+c], #0
je NpcBase_victimset_exit
mov ebx, [edi+c]
mov [ebx+50], #0
mov byte ptr [ebx+65], #0
mov byte ptr [ebx+67], #0
mov byte ptr [ebx+69], #1
mov byte ptr [ebx+6a], #1
mov byte ptr [ebx+6c], #0
mov byte ptr [ebx+84], #0
NpcBase_victimset_exit:

mov ebx, [NpcBase_temp1]


NpcBase_originalcode:
db 0F B6 87 CC 00 00 00
//movzx eax,byte ptr [edi+000000CC]


NpcBase_exit:
jmp NpcBase_returnhere


NpcBase_searchedAOB:
NpcBase_savedAOB:
jmp NpcBase_newmem
nop
nop
NpcBase_returnhere:


[DISABLE]
NpcBase_savedAOB:
db 0F B6 87 CC 00 00 00
//movzx eax,byte ptr [edi+000000CC]

unregistersymbol(NpcBase_savedAOB)

dealloc(NpcBase_newmem)
dealloc(NpcBase_temp1)"""

