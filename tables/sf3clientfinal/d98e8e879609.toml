jne short lblResourceReaderSkipBlessedLenya
cmp dword ptr [r12+10],0
jne short lblResourceReaderSkipBlessedLenya
cmp dword ptr [bEnableMinBlessedLenya],1
jne short lblResourceReaderSkipBlessedLenya
mov esi,[iMinBlessedLenya]
