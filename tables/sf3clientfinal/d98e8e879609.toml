cmp dword ptr [bEnableGodMode],1
jne short lblHealthUpdaterSkipHealth
movsxd rdx,[aobHealthUpdater_i+0B]
movsxd rcx,[r15+rdx-0C]
lblHealthUpdaterSkipHealth:
lblHealthUpdaterSkip:
jmp lblHealthUpdaterRet
aobHealthUpdater_i:
readmem(aobHealthUpdater,15)

