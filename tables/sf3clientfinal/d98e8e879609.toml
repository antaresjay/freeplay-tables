lblHealthUpdater:
readmem(aobHealthUpdater,8)
mov rdx,[r15+00000458]
test rdx,rdx
jz lblHealthUpdaterSkip
cmp dword ptr [r15+00000460],rdx
je lblHealthUpdaterSkip
mov rdx,[rdx]
test rdx,rdx
jz lblHealthUpdaterSkip
cmp byte ptr [rdx-F0],0
jne lblHealthUpdaterSkip
mov rdx,135
cmp dword ptr [bPatchMinStrength],1
jne short lblHealthUpdaterSkipStrength
mov cl,[iMinStrength]
cmp byte ptr [r15+rdx],cl
jge short lblHealthUpdaterSkipStrength
mov byte ptr [r15+rdx],cl
lblHealthUpdaterSkipStrength:
add rdx,3
cmp dword ptr [bPatchMinDexterity],1
jne short lblHealthUpdaterSkipDexterity
mov cl,[iMinDexterity]
cmp byte ptr [r15+rdx],cl
jge short lblHealthUpdaterSkipDexterity
mov byte ptr [r15+rdx],cl
lblHealthUpdaterSkipDexterity:
add rdx,3
cmp dword ptr [bPatchMinIntelligence],1
jne short lblHealthUpdaterSkipIntelligence
mov cl,[iMinIntelligence]
