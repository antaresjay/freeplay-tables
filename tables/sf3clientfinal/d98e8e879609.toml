mov esi,[iMinAryaCask]
cmp dword ptr [r12+04],esi
jge short lblResourceReaderSkipAryaCask
mov dword ptr [r12+04],esi
lblResourceReaderSkipAryaCask:
cmp dword ptr [r12],T_ARYAPOTION
jne short lblResourceReaderSkipAryaPotion
