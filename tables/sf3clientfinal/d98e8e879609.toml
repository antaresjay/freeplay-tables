lblResourceReader:
push rsi
movsxd rsi,[aobResourceReader_i+3]
mov r10,[rax+rsi]
sub rsi,08
mov r12,[rax+rsi]
add rsi,40
cmp byte ptr [rax+rsi],0
jne lblResourceReaderSkip
lblResourceReaderLoop:
cmp r10,r12
je lblResourceReaderSkip
cmp dword ptr [r12],T_WOOD
jne short lblResourceReaderSkipWood
cmp dword ptr [r12+10],0
jne short lblResourceReaderSkipWood
cmp dword ptr [bEnableMinWood],1
jne short lblResourceReaderSkipWood
mov esi,[iMinWood]
cmp dword ptr [r12+04],esi
jge short lblResourceReaderSkipWood
mov dword ptr [r12+04],esi
lblResourceReaderSkipWood:
cmp dword ptr [r12],T_STONE
jne short lblResourceReaderSkipStone
cmp dword ptr [r12+10],0
jne short lblResourceReaderSkipStone
cmp dword ptr [bEnableMinStone],1
jne short lblResourceReaderSkipStone
mov esi,[iMinStone]
cmp dword ptr [r12+04],esi
jge short lblResourceReaderSkipStone
mov dword ptr [r12+04],esi
lblResourceReaderSkipStone:
cmp dword ptr [r12],T_IRON
jne short lblResourceReaderSkipIron
cmp dword ptr [r12+10],0
jne short lblResourceReaderSkipIron
cmp dword ptr [bEnableMinIron],1
jne short lblResourceReaderSkipIron
mov esi,[iMinIron]
cmp dword ptr [r12+04],esi
jge short lblResourceReaderSkipIron
mov dword ptr [r12+04],esi
lblResourceReaderSkipIron:
cmp dword ptr [r12],T_IRONBAR
