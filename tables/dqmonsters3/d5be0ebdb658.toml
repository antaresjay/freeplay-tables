[[cheat]]
id = "activate-trainer-2-controls-damage-mod-mp-damage-mod-always-critical-hit"
name = "Activate Trainer 2 (Controls Damage Mod, MP Damage Mod, Always Critical Hit)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
///
aobscanregion(DamageModAOB2,Scene.Battle.Monsters.set,Scene.Battle.Monsters.set+100,48 89 5C 24 10 48 89 74 24 18 57 41 54 41 55 41 56 41 57 48 83 EC *)
registersymbol(DamageModAOB2)
alloc(newmem2,1024)

///
label(return2)
label(DamageModAOB2Save)
registersymbol(DamageModAOB2Save)

///
newmem2:
  mov [R11Save2],r11
  mov [R12Save2],r12
  mov [R13Save2],r13
  mov [R14Save2],r14
  mov [R15Save2],r15
  cmp dword ptr [rdx+20],0
  je DoPlayerTeam
  jmp DoEnemyTeam
DoPlayerTeam:
  mov r14,PlayerPartyBodyPtr
  jmp DoSetPointers
DoEnemyTeam:
  mov r14,EnemyPartyBodyPtr
  jmp DoSetPointers
DoSetPointers:
  mov r15,rdx
  mov r15,[r15+10]
  xor r13,r13
StartPartyLoop:
  cmp r13d,4
  jge DonePartyLoop
  mov r12,[r15+r13*8+20]
  test r12,r12
  je SkipNextStep
  mov r12,[r12+50]
SkipNextStep:
  mov [r14+r13*8],r12
  inc r13d
  jmp StartPartyLoop
DonePartyLoop:
  mov r15,rdx
  mov r15,[r15+18]
  xor r13,r13
StartStandbyLoop:
  cmp r13d,4
  jge DoneStandbyLoop
  mov r11,4
  add r11d,r13d
  mov r12,[r15+r13*8+20]
  test r12,r12
  je SkipNextStep2
  mov r12,[r12+50]
SkipNextStep2:
  mov [r14+r11*8],r12
  inc r13d
  jmp StartStandbyLoop
DoneStandbyLoop:
  mov r11,[R11Save2]
  mov r12,[R12Save2]
  mov r13,[R13Save2]
  mov r14,[R14Save2]
  mov r15,[R15Save2]
  jmp originalcode2

originalcode2:
DamageModAOB2Save:
  readmem(DamageModAOB2,15)
  jmp DamageModAOB2+0F

R11Save2:
dq 0
R12Save2:
dq 0
R13Save2:
dq 0
R14Save2:
dq 0
R15Save2:
dq 0

///
DamageModAOB2:
  jmp newmem2
  return2:
  
[DISABLE]

///
DamageModAOB2:
  readmem(DamageModAOB2Save,15)

unregistersymbol(DamageModAOB2)
unregistersymbol(DamageModAOB2Save)

///
dealloc(newmem2)"""

