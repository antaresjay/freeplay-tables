  mov [R15Save],r15
  xor r13,r13
  mov r14,EnemyPartyBodyPtr
StartCheckIfEnemyLoop:
  cmp r13d,8
  jge NotEnemy
  mov r11,[r14+r13*8]
  cmp r11,rcx
  je FoundEnemy
  inc r13d
  jmp StartCheckIfEnemyLoop
FoundEnemy:
  jmp EnemyHit
NotEnemy:
  jmp HeroHit  
HeroHit:
  // Get Current HP
  mov r15,[rcx+38]
  test r15,r15
  je SkipEntireCode
  xor r14,r14
  mov r14d,[r15+14]
  xor r14d,[r15+10]
  mov r11,r14
  sub r14d,edx
  cmp r11,0
  je SkipEntireCode
  cmp r14d,0
  jg HeroDamageHit
  jl HeroHealingHit
  jmp SkipEntireCode
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
