  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor r14d,r14d
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne MyCleanUp1
  cmp r11d,r14d
  jg @F
  xor r14d,r14d
@@:
  jmp MyCleanUp1
HeroHealingHit:
  cmp [fHeroHealingMult],(float)0.0
  je MyCleanUp1
  neg r14d
  push r14d
  fild dword ptr [esp]
  fmul dword ptr [fHeroHealingMult]
  fistp dword ptr [esp]
  pop r14d
  // Minimum of 1
  cmp r14d,1
  jge @F
  mov r14d,1
@@:
  neg r14d
  jmp MyCleanUp1
EnemyHit:
  // Get Current HP
  mov r15,[rcx+38]
  test r15,r15
  je SkipEntireCode
  xor r14,r14
  mov r14d,[r15+14]
  xor r14d,[r15+10]
  mov r11,r14
  sub r14d,edx
  cmp r11,0
  je SkipEntireCode
  cmp r14d,0
  jg EnemyDamageHit
  jl EnemyHealingHit
  jmp SkipEntireCode
EnemyDamageHit:
  cmp [OneHitKill],1
  jne SkipOneHitKill
  mov r14d,r11d
  jmp MyCleanUp1
SkipOneHitKill:
  cmp [fEnemyDamageMult],(float)0.0
  je MyCleanUp1
  push r14d
  fild dword ptr [esp]
  fmul dword ptr [fEnemyDamageMult]
  fistp dword ptr [esp]
  pop r14d
  // Minimum of 1
  cmp r14d,1
  jge MyCleanUp1
  mov r14d,1
  jmp MyCleanUp1
EnemyHealingHit:
  cmp [fEnemyHealingMult],(float)0.0
  je MyCleanUp1
  neg r14d
  push r14d
  fild dword ptr [esp]
  fmul dword ptr [fEnemyHealingMult]
  fistp dword ptr [esp]
  pop r14d
  // Minimum of 1
  cmp r14d,1
  jge @F
  mov r14d,1
@@:
  neg r14d
  jmp MyCleanUp1

MyCleanUp1:
  mov edx,r11d
  sub edx,r14d
SkipEntireCode:
  mov r11,[R11Save]
  mov r12,[R12Save]
  mov r13,[R13Save]
  mov r14,[R14Save]
  mov r15,[R15Save]
  jmp originalcode
  
originalcode:
DamageModAOB1Save:
  readmem(DamageModAOB1,15)
  jmp DamageModAOB1+0F

R11Save:
dq 0
R12Save:
dq 0
R13Save:
dq 0
R14Save:
dq 0
R15Save:
dq 0
GodMode:
dq 0
fHeroDamageMult:
dq (float)0.25
fHeroHealingMult:
dq (float)2.0
HeroCannotDie:
dq 1
fEnemyDamageMult:
dq (float)2.0
fEnemyHealingMult:
dq (float)0.25
OneHitKill:
dq 0

///
DamageModAOB1:
  jmp newmem
  return:
   
[DISABLE]

///
DamageModAOB1:
  readmem(DamageModAOB1Save,14)
  
unregistersymbol(GodMode)
unregistersymbol(fHeroDamageMult)
unregistersymbol(fHeroHealingMult)
unregistersymbol(HeroCannotDie)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fEnemyHealingMult)
unregistersymbol(OneHitKill)
unregistersymbol(DamageModAOB1)
unregistersymbol(DamageModAOB1Save)

