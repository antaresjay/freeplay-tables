source = """
{ Game   : Zomborg.exe
  Version: 
  Date   : 2025-10-05
  Author : BabyGroot

  This script does blah blah blah
}

define(address,GameData:LoadGameData+33)
define(bytes,0F B6 46 2D 85 C0)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,GameData:LoadGameData+33)

label(code)
label(return)

alloc(pBase_Game,4)
registersymbol(pBase_Game)

newmem:

code:
  mov [pBase_Game],rsi
  movzx eax,byte ptr [rsi+2D]
  test eax,eax
  jmp return

pBase_Game:
dq

address:
  jmp newmem
  nop
return:

[DISABLE]

address:
  db bytes
  // movzx eax,byte ptr [rsi+2D]
  // test eax,eax

dealloc(newmem)
dealloc(pBase_Game)
unregistersymbol(pBase_Game)"""

