[[cheat]]
id = "god-mode-massive-damage"
name = "GOD MODE + MASSIVE DAMAGE"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat



aobscanmodule(hp,septerra.exe,29 9D 2E 01 00 00) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
cmp [ebp-8],0
jne code
//sub [ebp+0000012E],ebx
jmp return

code:
add ebx,#200
  sub [ebp+0000012E],ebx
  jmp return

hp:
  jmp newmem
  nop
return:
registersymbol(hp)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
hp:
  db 29 9D 2E 01 00 00

unregistersymbol(hp)
dealloc(newmem)"""

