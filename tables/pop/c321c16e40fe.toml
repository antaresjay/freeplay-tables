[[cheat]]
id = "drinking-djinn-water-maximizes-health"
name = "Drinking Djinn water maximizes health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[enable]
alloc(newmem,512)
label(returnhere)
newmem:
mov [esi+11F8],edx
add [esi+11F8], 80
jmp returnhere
POP.exe+213D64:
jmp newmem
nop
returnhere:
[disable]
dealloc(newmem)
POP.exe+213D64:
mov [esi+000011F8],edx"""

