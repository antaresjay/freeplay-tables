ProductionPanelSmall_newmem:
mov [ProductionPanelSmall_temp1], eax
mov [ProductionPanelSmall_temp2], ebx
mov [ProductionPanelSmall_temp3], ecx
mov [ProductionPanelSmall_temp4], edx

cmp dword ptr [ProductionPanelSmall_update_enable], #0
je ProductionPanelSmall_update_exit
mov [ProductionPanelSmall_basepointer], eax
ProductionPanelSmall_update_exit:

cmp dword ptr [ProductionPanelSmall_set_enable], #0
je ProductionPanelSmall_set_exit
ProductionPanelSmall_set_exit:

cmp dword ptr [eax+54], #0
je ProductionPanelSmall_resourcesset_exit
mov ebx, [eax+54]
cmp dword ptr [ebx+c], #0
je ProductionPanelSmall_resourcesset_exit
mov ecx, [ebx+c]
cmp dword ptr [ecx+88], #0
jne ProductionPanelSmall_resourcesset_exit

cmp dword ptr [ProductionPanelSmall_resourcesset_enable], #0
je ProductionPanelSmall_resourcesset_exit
cmp dword ptr [ebx+1c], #0
je ProductionPanelSmall_resourcesset_exit
mov ecx, [ebx+1c]
mov [ecx+14], #9999999
ProductionPanelSmall_resourcesset_exit:


mov eax, [ProductionPanelSmall_temp1]
mov ebx, [ProductionPanelSmall_temp2]
mov ecx, [ProductionPanelSmall_temp3]
mov edx, [ProductionPanelSmall_temp4]


ProductionPanelSmall_originalcode:
db 0F B6 80 8C 00 00 00
//movzx eax,byte ptr [eax+0000008C]


ProductionPanelSmall_exit:
jmp ProductionPanelSmall_returnhere


ProductionPanelSmall_searchedAOB:
ProductionPanelSmall_savedAOB:
jmp ProductionPanelSmall_newmem
nop
nop
ProductionPanelSmall_returnhere:


[DISABLE]
ProductionPanelSmall_savedAOB:
db 0F B6 80 8C 00 00 00
//movzx eax,byte ptr [eax+0000008C]

unregistersymbol(ProductionPanelSmall_savedAOB)

dealloc(ProductionPanelSmall_newmem)
dealloc(ProductionPanelSmall_temp1)
dealloc(ProductionPanelSmall_temp2)
dealloc(ProductionPanelSmall_temp3)
dealloc(ProductionPanelSmall_temp4)
dealloc(ProductionPanelSmall_temp5)"""

