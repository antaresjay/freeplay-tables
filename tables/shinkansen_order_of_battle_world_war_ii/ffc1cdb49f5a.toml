[[cheat]]
id = "productionpanelsmall-base-address-scan-to-activate-view-purchase-to-update-view-purchase"
name = "ProductionPanelSmall Base Address Scan (To Activate: View Purchase, To Update: View Purchase)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(ProductionPanelSmall_savedAOB)
label(ProductionPanelSmall_returnhere)
label(ProductionPanelSmall_originalcode)
label(ProductionPanelSmall_exit)

label(ProductionPanelSmall_update_exit)
label(ProductionPanelSmall_set_exit)
label(ProductionPanelSmall_resourcesset_exit)

registersymbol(ProductionPanelSmall_savedAOB)

//13092333 - 83 EC 08              - sub esp,08
//13092336 - 8B 45 08              - mov eax,[ebp+08]
// ProductionPanelSmall:Update+9
//13092339 - 0FB6 80 8C000000      - movzx eax,byte ptr [eax+0000008C]
//13092340 - 85 C0                 - test eax,eax
//13092342 - 74 1B                 - je 1309235F
//13092344 - B8 846F0704           - mov eax,04076F84 : [00000001]
//13092349 - C6 00 00              - mov byte ptr [eax],00
aobscan(ProductionPanelSmall_searchedAOB, 0F B6 80 8C 00 00 00 85 C0 74 1B)

alloc(ProductionPanelSmall_newmem, 2048, ProductionPanelSmall_searchedAOB)
alloc(ProductionPanelSmall_temp1, 4, ProductionPanelSmall_searchedAOB)
alloc(ProductionPanelSmall_temp2, 4, ProductionPanelSmall_searchedAOB)
alloc(ProductionPanelSmall_temp3, 4, ProductionPanelSmall_searchedAOB)
alloc(ProductionPanelSmall_temp4, 4, ProductionPanelSmall_searchedAOB)
