[[cheat]]
id = "player-pointer"
name = "Player Pointer"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(GetPlayerController,$process,48 8B 40 ?? 48 85 C0 74 ?? F6 80 ?? ?? ?? ?? 02)
alloc(newmem,$1000,GetPlayerController)

label(GetPlayerControllerBkp)
label(LocalPlayerPtr)
label(PlayerControllerPtr)
label(return)

newmem:
  mov [LocalPlayerPtr],rax
GetPlayerControllerBkp:
  readmem(GetPlayerController,7)
  mov [PlayerControllerPtr],rax
  jmp return

LocalPlayerPtr:
  dq 0

PlayerControllerPtr:
  dq 0

GetPlayerController:
  jmp newmem
  nop 2
return:
registersymbol(GetPlayerController)
registersymbol(GetPlayerControllerBkp)
registersymbol(LocalPlayerPtr)
registersymbol(PlayerControllerPtr)

[DISABLE]
GetPlayerController:
  readmem(GetPlayerControllerBkp,7)
unregistersymbol(GetPlayerController)
unregistersymbol(GetPlayerControllerBkp)
unregistersymbol(LocalPlayerPtr)
unregistersymbol(PlayerControllerPtr)
dealloc(newmem)"""

