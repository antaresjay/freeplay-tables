source = """
// Game Executable   : AtlasFallen (VK).exe
// Author            : ndck76
// Executable Version: Unknown
// Game Version      : Build.11865295
// Script Date       : 2023-08-11


[ENABLE]

aobscanmodule(ohk,$process,F3xxxxxxxx488Bxx0F28xxxxxx4883xxxx5B48FFxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx48FF) // should be unique
alloc(newmem,$1000,ohk)
alloc(ohkbkp,5)
registersymbol(ohk)
registersymbol(ohkbkp)
label(code)
label(return)

ohkbkp:
  readmem(ohk,5)

newmem:

code:
  mov [rax+rcx*4],0
  jmp return

ohk:
  jmp newmem
return:

[DISABLE]

ohk:
  readmem(ohkbkp,5)

unregistersymbol(*)
dealloc(*)"""
