[[cheat]]
id = "playerdata-base-address-scan-initialization-activate-this-first"
name = "PlayerData Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlayerData_basepointer)
registersymbol(PlayerData_update_enable)
registersymbol(PlayerData_set_enable)
registersymbol(PlayerData_hpset_enable)
registersymbol(PlayerData_foodset_enable)
registersymbol(PlayerData_armorset_enable)
registersymbol(PlayerData_breathset_enable)
registersymbol(PlayerData_staminaset_enable)
registersymbol(PlayerData_weightset_enable)

alloc(PlayerData_basepointer, 8)
alloc(PlayerData_update_enable, 4)
alloc(PlayerData_set_enable, 4)
alloc(PlayerData_hpset_enable, 4)
alloc(PlayerData_foodset_enable, 4)
alloc(PlayerData_armorset_enable, 4)
alloc(PlayerData_breathset_enable, 4)
alloc(PlayerData_staminaset_enable, 4)
alloc(PlayerData_weightset_enable, 4)


[DISABLE]
unregistersymbol(PlayerData_basepointer)
unregistersymbol(PlayerData_update_enable)
unregistersymbol(PlayerData_set_enable)
unregistersymbol(PlayerData_hpset_enable)
unregistersymbol(PlayerData_foodset_enable)
unregistersymbol(PlayerData_armorset_enable)
unregistersymbol(PlayerData_breathset_enable)
unregistersymbol(PlayerData_staminaset_enable)
unregistersymbol(PlayerData_weightset_enable)

dealloc(PlayerData_basepointer)
dealloc(PlayerData_update_enable)
dealloc(PlayerData_set_enable)
dealloc(PlayerData_hpset_enable)
dealloc(PlayerData_foodset_enable)
dealloc(PlayerData_armorset_enable)
dealloc(PlayerData_breathset_enable)
dealloc(PlayerData_staminaset_enable)
dealloc(PlayerData_weightset_enable)"""

[[cheat]]
id = "playerdata-base-address-scan-to-activate-play-map-to-update-play-map"
name = "PlayerData Base Address Scan (To Activate: Play Map, To Update: Play Map)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerData_savedAOB)
label(PlayerData_returnhere)
label(PlayerData_originalcode)
label(PlayerData_exit)

label(PlayerData_update_exit)
label(PlayerData_set_exit)
label(PlayerData_hpset_exit)
label(PlayerData_foodset_exit)
label(PlayerData_armorset_exit)
label(PlayerData_breathset_exit)
label(PlayerData_staminaset_exit)
label(PlayerData_weightset_exit)

registersymbol(PlayerData_savedAOB)

//0E088B26 - 34 24                 - xor al,24
//0E088B28 - 48 8B F2              - mov rsi,rdx
// BattleHUD:CheckHPState+b
//0E088B2B - 48 8B 46 30           - mov rax,[rsi+30]
//0E088B2F - 0FB7 40 10            - movzx eax,word ptr [rax+10]
//0E088B33 - 85 C0                 - test eax,eax
//0E088B35 - 75 0A                 - jne 0E088B41
//0E088B37 - B8 02000000           - mov eax,00000002
//0E088B3C - E9 4B000000           - jmp 0E088B8C
aobscan(PlayerData_searchedAOB, 0F B6 86 41 01 00 00 85 C0 * * * * * * 48 8B CE)

alloc(PlayerData_newmem, 2048, PlayerData_searchedAOB)


PlayerData_newmem:
cmp dword ptr [PlayerData_update_enable], #0
je PlayerData_update_exit
mov [PlayerData_basepointer], rsi
PlayerData_update_exit:

cmp dword ptr [PlayerData_set_enable], #0
je PlayerData_set_exit
PlayerData_set_exit:

cmp dword ptr [PlayerData_hpset_enable], #0
je PlayerData_hpset_exit
mov ebx, [rsi+e8]
mov [rsi+12c], ebx
PlayerData_hpset_exit:

cmp dword ptr [PlayerData_foodset_enable], #0
je PlayerData_foodset_exit
mov ebx, [rsi+ec]
mov [rsi+130], ebx
PlayerData_foodset_exit:

cmp dword ptr [PlayerData_armorset_enable], #0
je PlayerData_armorset_exit
mov ebx, [rsi+f0]
mov [rsi+134], ebx
PlayerData_armorset_exit:

cmp dword ptr [PlayerData_breathset_enable], #0
je PlayerData_breathset_exit
mov ebx, [rsi+f8]
mov [rsi+138], ebx
PlayerData_breathset_exit:

cmp dword ptr [PlayerData_staminaset_enable], #0
je PlayerData_staminaset_exit
mov ebx, [rsi+fc]
mov [rsi+13c], ebx
PlayerData_staminaset_exit:

cmp dword ptr [PlayerData_weightset_enable], #0
je PlayerData_weightset_exit
mov [rsi+f4], (float)9999999
PlayerData_weightset_exit:


PlayerData_originalcode:
db 0F B6 86 41 01 00 00
//movzx eax,byte ptr [rsi+00000141]


PlayerData_exit:
jmp PlayerData_returnhere


PlayerData_searchedAOB:
PlayerData_savedAOB:
jmp PlayerData_newmem
nop
nop
PlayerData_returnhere:


[DISABLE]
PlayerData_savedAOB:
db 0F B6 86 41 01 00 00
//movzx eax,byte ptr [rsi+00000141]

unregistersymbol(PlayerData_savedAOB)

dealloc(PlayerData_newmem)"""

