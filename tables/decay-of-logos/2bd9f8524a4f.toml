type = "script"
source = """
{ Game   : Decay of Logos.exe
  Version: 
  Date   : 2019-08-31
  Author : Anjinggila

  This script does blah blah blah
}

define(INJECT,PlayerStats:giveDamage+a2f)
define(bytes,F3 41 0F 11 AE 88 00 00 00)

[ENABLE]

assert(INJECT,bytes)
alloc(newmem,$1000,PlayerStats:giveDamage+a2f)

label(code)
label(return)
alloc(player_stats,8)
registersymbol(player_stats)

newmem:

code:
  mov [player_stats],r14
  movss [r14+00000088],xmm5
  jmp return

INJECT:
  jmp newmem
  nop 4
return:

[DISABLE]

INJECT:
  db bytes

dealloc(newmem)
unregistersymbol(player_stats)
dealloc(player_stats)"""

