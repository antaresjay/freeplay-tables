[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@ModEngine
[ENABLE]

aobscanmodule(health,LEGOMARVELAvengers_DX11.exe,88 91 31 08 00 00)
alloc(newmem,$1000,health)
registersymbol(IHP OHK)
label(code return onehit)

newmem:
cmp [IHP],1
jne onehit
cmp [rcx+01AC],(float)1
jne code
mov [rcx+0831],(int)8

onehit:
cmp [OHK],1
jne code
cmp [rcx+01AC],(float)0
jne code
mov [rcx+0831],(int)0
code:
  mov [rcx+00000831],dl
  jmp return

IHP:
dd 0

OHK:
dd 0

health:
  jmp newmem
  nop
return:
registersymbol(health)

[DISABLE]

health:
  db 88 91 31 08 00 00

unregistersymbol(*)
dealloc(*)"""

