[[cheat]]
id = "infinite-health-one-hit-kill"
name = "Infinite Health & One Hit Kill"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(OneHitKill,LEGOMARVELAvengers_DX11.EXE,88 91 31 08 00 00)
alloc(newmem,$1000,"LEGOMARVELAvengers_DX11.EXE"+74DBF0)

label(Cheat)
label(OHK)
label(code)
label(return)

newmem:

Cheat:
  cmp [rcx+000001AC],(float)1
  jne OHK
  mov [rcx+00000831],(int)8
  jmp return

OHK:
  cmp [rcx+000001AC],(float)2
  jne code
  mov [rcx+00000831],(int)0
  jmp return

code:
  mov [rcx+00000831],dl
  jmp return

OneHitKill:
  jmp Cheat
  nop
return:
registersymbol(OneHitKill)

[DISABLE]

OneHitKill:
  db 88 91 31 08 00 00

unregistersymbol(OneHitKill)
dealloc(newmem)"""

