[[cheat]]
id = "right-click-change-script-for-info"
name = "Right click -> change Script for info"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
Hiya, hiya, pleased ta meetcha! (does anyony even get that reference
anymore?)

Here's another table with some neat scripts, this time for
Duke Nukem Forever as sold on Steam; made with the most current
release on the 30th of March 2017.

It seems to work with the "The Dr. Who Cloned Me" DLC, but it takes
a while for the scripts to work. I dunno why.

Included are the following scripts:

-- Healt cheats --

"Keep health at 200" and "keep health at 999" bascially do they
same, they use a constantly running instruction which updates
your health value to 200/999. The 999 health cheat might also
work better than the god mode explained below, as some explosions
won't kill you - even your own.

-- Two variations of god mode --

* God mode (no damage) will nullify any damage Duke would be getting
from bullets, lasers, explosions, whatever. This should work for
all damage except scripted events or maybe some pitfalls.
 - One peculiarity: your own rockets if thrown back at you
   by octabrains can kill you. Same goes for pipebombs and the
   likes.

* God mode (reset health to max) will restore your maximum ego
after Duke has been hit - BUT !!! - if the incoming damage is
greater than your current maximum ego, YOU WILL DIE. Because
explosions and shit. For reasons.

One script for your breath/air or whatever you want to call it:

* Unlimited O2 (keeps your breath meter full)

-- Ammo cheats --

Freeze weapon ammo will keep your backup ammo at 200 all the time.
Weapons without clips (Alien Laser or RPG for example) don't need
to reload.
HINT: You might just not be able to activate these scripts in
levels without weapons (Dukes Titty City for example).

Unlimited ammo in clip will keep you gunning without ever having
to reload when using weapons that utilize clips/cartridges.

-- Item cheats --

Unlimited trips/pipe bombs does what it says. Keep in mind
that the way the script is coded currently will also keep
you from picking up additional pipe bombs or trip mines once
the script has been activated.
However: if you have none and pick one up you'll still
have one which you can use without it ever "depleting".

STILL, I'D SAY THIS SCRIPT IS BUGGED AND CAN CRASH YOUR
GAME! For more information take a look at the "known bugs"
entry below.

-- Miscellanious --

* Unlimited booster power (car):

The booster of your RC car/truck won't need a to recharge.
Infinite speeding, yeehaw!

* Instant boost recharge (car):

Your booster power will instantly revert to full once you let
go of the right mouse button.

* Instant boost recharge (car) V2:

Does the same as the above script but uses another instruction.
If the first one fails, try this.

> Both following scripts have not been tested outside of the games <

Unlimited pinball balls:
I haven't fully tested the "unlimited pinball balls" (that's
a double load of balls!) one, but it seemed to work. I've tested
it with the machine in Dukes Gym right at the beginning.
I hated those annoying minigames but still wanted to get the
ego boost and for the pinball at least you can do something to
make it easier on yourself. If you want to find the "balls" value
on your own, it is saved as a 4 byte value. 3 balls = 3 balls.

Air hockey opponent can't score (Duke's Titty City):
This script is run as soon as the puck has disappeared into the
"goal zone" of a player. Since there's a "reserved area" for
Duke (home player) and another one for "that guy" (visitor)
I changed the instruction so that it will reset the visitor's
points to 0 each time the script is run - which is basically
every goal.
For this script to work it seems the opponent has to score
at least one time. Don't worry, after activating it his
goals will be reset to 0 once he scores again, allowing you
to get the 7-0 achievement.

Known bugs:

- Unlimited trips/pipe bombs disallows you to change the
  angle of some turrets and fuck up some other shit. FOR SHAME!
  Unluckily I'm not sure if I can find a way to circumvent that.
  Use at your own risk!

- Deactivating some of the scripts MIGHT crash your game. So
  decide for yourself which ones you want to use.

Enjoy! ~CyberD3m0n
}
[ENABLE]
[DISABLE]"""

[[cheat]]
id = "keep-health-at-200"
name = "Keep health at 200"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,dnGame.DLL,D9 80 30 0A 00 00) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov [eax+00000A30],(float)200
  fld dword ptr [eax+00000A30]
  jmp return

INJECT:
  jmp newmem
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db D9 80 30 0A 00 00

unregistersymbol(INJECT)
dealloc(newmem)

dnGame.DLL+33304:
  fld dword ptr [eax+00000A30]"""

