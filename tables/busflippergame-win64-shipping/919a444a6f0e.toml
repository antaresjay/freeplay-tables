[[cheat]]
id = "enable-player"
name = "Enable Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(itsplayertime,BusFlipperGame-Win64-Shipping.exe,48 8B 4E 30 48 8B 01 FF 90 A8 07 00 00 48 89 87 68 01 00 00)
alloc(newmem,$1000)

label(code)
label(return)

label(maxjmp)
label(instatjmp)

label(give_player)
registersymbol(give_player)

label(perkinf)
registersymbol(perkinf)

label(max_level)
registersymbol(max_level)

label(instant_up)
registersymbol(instant_up)

newmem:
  push r11
  push r12

  mov [give_player], rsi

  mov r11, [rsi+30]
  test r11, r11
  je code

  mov r12, [r11+868]
  test r12, r12
  je code

  cmp dword ptr [perkinf], 1
  jne maxjmp

  mov [r12+B4], #99

maxjmp:
  cmp dword ptr [max_level], 1
  jne instatjmp

  mov [r12+B8], #12

instatjmp:
  cmp dword ptr [instant_up], 1
  jne code

  fild dword ptr [r12+C0]
  fistp dword ptr [r12+BC]

code:
  pop r12
  pop r11

  mov rcx,[rsi+30]
  mov rax,[rcx]
  call qword ptr [rax+000007A8]
  mov [rdi+00000168],rax
  jmp return

give_player:
dq 0

perkinf:
dd 0

max_level:
dd 0

instant_up:
dd 0

itsplayertime:
  jmp far newmem
  nop 6
return:
registersymbol(itsplayertime)

[DISABLE]

itsplayertime:
  db 48 8B 4E 30 48 8B 01 FF 90 A8 07 00 00 48 89 87 68 01 00 00

unregistersymbol(itsplayertime)
unregistersymbol(give_player)
unregistersymbol(perkinf)
unregistersymbol(max_level)
unregistersymbol(instant_up)
dealloc(newmem)"""

