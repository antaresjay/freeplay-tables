[ENABLE]
aobscanmodule(itemTooltip,$process,48 89 4C 24 ?? 45 ?? ?? 75 ?? 48 8D)
alloc(newmem,$1000,itemTooltip)

label(itemTooltipBkp)
label(itemTooltipPtr)
label(return)

newmem:
  //lea rcx,[rcx]
  mov rax,itemTooltipPtr
  mov [rax],rcx
itemTooltipBkp:
  readmem(itemTooltip,5)
  jmp return

align 10
itemTooltipPtr:
  dq 0

itemTooltip:
  jmp newmem
return:
registersymbol(itemTooltip)
registersymbol(itemTooltipBkp)
registersymbol(itemTooltipPtr)

[DISABLE]
itemTooltip:
  readmem(itemTooltipBkp,5)
unregistersymbol(itemTooltip)
unregistersymbol(itemTooltipBkp)
unregistersymbol(itemTooltipPtr)
dealloc(newmem)

