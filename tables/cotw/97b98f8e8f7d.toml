[[cheat]]
id = "inf-orb-use-inf-mana-use"
name = "inf. Orb use / inf. Mana use"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Cotw.exe
  Version: 1.0 ?
  Date   : 2025-06-23
  Author : Oyyzj

  inf. Orb / inf. Mana
}

[ENABLE]

aobscanmodule(OrbUse,Cotw.exe,8B 40 xx 29 41 xx 5D C2) // should be unique
alloc(newmem,$100)
registersymbol(OrbUse)
label(code)
label(return)
label(cheat)
label(r_OrbUse)
registersymbol(r_OrbUse)
newmem:
  mov eax,[eax+08]
  cmp dword [ecx-288],1 //Mana
  je cheat
  cmp dword [ecx-98],1 //orb
  je cheat
  jmp code
code:
  sub [ecx+08],eax
  jmp return
cheat:
  mov eax,0
  sub [ecx+08],eax
  jmp return
r_OrbUse:
  readmem(OrbUse,6)
OrbUse:
  jmp newmem
  nop
return:


[DISABLE]

OrbUse:
  readmem(r_OrbUse,6)

unregistersymbol(*)
dealloc(*)"""

