[[cheat]]
id = "hero-stats-not-in-menu"
name = "Hero stats (not in MENU)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Cotw.exe
  Version: 1.0 ?
  Date   : 2025-06-23
  Author : Oyyzj

  scan Hero pointer. don't freeze values
}

[ENABLE]

aobscanmodule(Hero,Cotw.exe,8B 49 xx 33 C0 3B 4A xx 0F 9E) // should be unique
alloc(newmem,$100)
registersymbol(Hero)
alloc(p_Hero,$4)
registersymbol(p_Hero)
label(code)
label(return)
label(r_Hero)
registersymbol(r_Hero)
newmem:
  cmp [ecx-68],1
  jne code
  mov [p_Hero],ecx
code:
  mov ecx,[ecx+08]
  xor eax,eax
  jmp return
r_Hero:
  readmem(Hero,5)
Hero:
  jmp newmem
return:


[DISABLE]

Hero:
  readmem(r_Hero,5)

unregistersymbol(*)
dealloc(*)"""

