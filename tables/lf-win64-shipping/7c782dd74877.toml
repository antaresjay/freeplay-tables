[[cheat]]
id = "one-hit-kills"
name = "one hit kills"
category = "game"
description = ""
hint = ""
type = "script"
source = """
{  Game Executable   : LF-Win64-Shipping.exe
   Executable Version: 4.25.3.0
   Script Date       : 2020-08-29
   Author            : Astor
}

[ENABLE]
aobscanmodule(aozombies,LF-Win64-Shipping.exe,F3 0F 11 83 * 00 00 00 EB * 39)
alloc(nzombies,$1000,aozombies)
label(czombies)
label(rzombies)
label(reszombies)
label(ohk)
nzombies:
czombies:
movss xmm0,[ohk]
movss [rbx+000000D8],xmm0
jmp rzombies
reszombies:
readmem(aozombies,8)
ohk:
dq 0x0
aozombies:
jmp nzombies
nop 3
rzombies:
registersymbol(aozombies)
registersymbol(reszombies)
[DISABLE]
aozombies:
readmem(reszombies,8)
unregistersymbol(aozombies)
unregistersymbol(reszombies)
dealloc(nzombies)"""

