[[cheat]]
id = "cheat-max-durability"
name = "Cheat: Max Durability"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : DyingLightGame_x64_rwdi.exe
  Version: 
  Date   : 2022-09-06
  Author : jason

  Seems to execute when durability changes and makes sure an item's durability
  doesn't exceed max.  To do this it does a min of the current durability and
  the max, and stores the result.   For this we change the min to a max so that
  it will update the current durability to max if current is lower.   Don't
  know how durability would ever get higher, maybe when repairing?
}

[ENABLE]


aobscanmodule(INJECT_DURABILITY,gamedll_ph_x64_rwdi.dll,F3 0F 5D C6 0F 28 F0 0F 28 7C) // should be unique
assert(INJECT_DURABILITY,F3 0F 5D C6)

INJECT_DURABILITY:
  maxss xmm0,xmm6
return:
registersymbol(INJECT_DURABILITY)

[DISABLE]

INJECT_DURABILITY:
  db F3 0F 5D C6

unregistersymbol(INJECT_DURABILITY)

