[[cheat]]
id = "artes-usage"
name = "Artes Usage"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Tales of Berseria Remastered_Game.exe
  Version:
  Date   : 2026-02-27
  Author : wajrak

  This script does blah blah blah
}


[ENABLE]
// Scan for the exact 8-byte write instruction and the mov right after it
aobscanmodule(ArteHook, TLSampleViewerTO12.dll, 66 41 89 80 08 0B 00 00 4D 8B 09)
alloc(newmem, $1000, ArteHook)

alloc(bMaxArte, 4)
alloc(bArteMult, 4)
alloc(iArteMult, 4)

registersymbol(ArteHook)
registersymbol(bMaxArte)
registersymbol(bArteMult)
registersymbol(iArteMult)

bMaxArte:
  dd 0
bArteMult:
  dd 1
iArteMult:
  dd 10 // Default 10x multiplier (You get 10 uses per 1 actual use)

label(check_mult)
label(calc_delta)
label(skip_mult)
label(code)
label(return)

newmem:
  // --- INSTANT MAX CHECK ---
  cmp dword ptr [bMaxArte], 1
  jne check_mult
  mov ax, #9999 // Force to 9999 instantly
  jmp code

check_mult:
  // --- MULTIPLIER CHECK ---
  cmp dword ptr [bArteMult], 1
  jne code

calc_delta:
  // Save registers we are about to use for math
  push rcx
  push rbx

  // Old value is still sitting in [r8+00000B08]
  // New value is in ax
  movzx ecx, word ptr [r8+00000B08]
  movzx ebx, ax

  sub ebx, ecx // Calculate the gain (New - Old)
  cmp ebx, 0
  jle skip_mult // If no gain, skip math

  imul ebx, [iArteMult] // Multiply the gain
  add ecx, ebx          // Add multiplied gain back to the old value
  mov ax, cx            // Move our new supercharged value back into ax

  // Safety Cap Check (Don't let the multiplier blow past 9999)
  cmp ax, #9999
  jle skip_mult
  mov ax, #9999

skip_mult:
  // Restore our registers
  pop rbx
  pop rcx

code:
  // --- ORIGINAL INSTRUCTION ---
  mov [r8+00000B08], ax
  jmp return

// We hook exactly 8 bytes
ArteHook:
  jmp newmem
  nop
  nop
  nop
return:

[DISABLE]
ArteHook:
  db 66 41 89 80 08 0B 00 00

unregistersymbol(ArteHook)
unregistersymbol(bMaxArte)
unregistersymbol(bArteMult)
unregistersymbol(iArteMult)

dealloc(newmem)
dealloc(bMaxArte)
dealloc(bArteMult)
dealloc(iArteMult)"""

