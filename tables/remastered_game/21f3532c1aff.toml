[[cheat]]
id = "gald"
name = "Gald"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Tales of Berseria Remastered_Game.exe
  Version: 
  Date   : 2026-02-27
  Author : wajrak

  This script does blah blah blah
}

[ENABLE]
// Scan for the exact Gald writing instruction
aobscanmodule(GaldHook, TLSampleViewerTO12.dll, 89 10 4C 8B 4B 10 41 8B 09)
alloc(newmem, $1000, GaldHook)

// 1. Allocate our Cheat Engine Variables
alloc(pGald, 8)
alloc(bMaxGald, 4)
alloc(bEnableMultiplier, 4)
alloc(iMultiplier, 4)

// 2. Register them for the user interface
registersymbol(GaldHook)
registersymbol(pGald)
registersymbol(bMaxGald)
registersymbol(bEnableMultiplier)
registersymbol(iMultiplier)

// 3. Set default values (0 = off, 1 = on)
bMaxGald:
  dd 0
bEnableMultiplier:
  dd 0
iMultiplier:
  dd 2 // Default to a 2x multiplier

label(check_mult)
label(calculate_delta)
label(cap_check)
label(write_code)
label(return)

newmem:
  // --- POINTER STEALER ---
  mov [pGald], rax

  // --- MAX GALD CHECK ---
  cmp dword ptr [bMaxGald], 1
  jne check_mult
  mov edx, 3B9AC9FF // If enabled, force Gald to 999,999,999
  jmp write_code

check_mult:
  // --- MULTIPLIER CHECK ---
  cmp dword ptr [bEnableMultiplier], 1
  jne write_code

calculate_delta:
  // --- THE DELTA CALCULATOR ---
  mov r10d, [rax]      // r10d = Old Gald balance
  mov r11d, edx        // r11d = New incoming Gald balance
  sub r11d, r10d       // r11d = Delta (New minus Old)

  cmp r11d, 0          // Did we actually gain money?
  jle write_code       // If it's 0 or negative (spending money), skip the multiplier

  // We gained money. Let's multiply the gain.
  imul r11d, [iMultiplier]
  add r10d, r11d       // Add the multiplied gain to the old balance
  mov edx, r10d        // Move our calculated total back into EDX for the final write

cap_check:
  // --- OVERFLOW PREVENTION ---
  cmp edx, 3B9AC9FF
  jle write_code
  mov edx, 3B9AC9FF    // Cap it so we don't crash the game

write_code:
  // --- ORIGINAL INSTRUCTION ---
  mov [rax], edx
  mov r9, [rbx+10]
  jmp return

GaldHook:
  jmp newmem
  nop
return:

[DISABLE]
GaldHook:
  db 89 10 4C 8B 4B 10

unregistersymbol(GaldHook)
unregistersymbol(pGald)
unregistersymbol(bMaxGald)
unregistersymbol(bEnableMultiplier)
unregistersymbol(iMultiplier)

dealloc(newmem)
dealloc(pGald)
dealloc(bMaxGald)
dealloc(bEnableMultiplier)
dealloc(iMultiplier)"""

