  // --- MULTIPLIER CHECK ---
  cmp dword ptr [bExpMult], 1
  jne write_code

calc_delta:
  // --- DELTA CALCULATOR ---
  mov r10d, [rax+1C] // Grab your old EXP
  mov r11d, r15d     // Grab the new incoming EXP total
