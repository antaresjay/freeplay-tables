[[cheat]]
id = "activation"
name = "Activation"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
// This is located a bit before the Automatic "press enter to continue" option.
// 03 E7 stands for 999 - instant.
// This is the reason it has to be set to instant
aobscan(creation, 00 ?? ?? ?? 00 00 00 ?? 00 00 44 9? 00 00 02 ?? 00 00 03 E7)
label(_creation)
registersymbol(_creation)

creation:
_creation:

// This is located between "Carrying capacity" and "Question-asked"
// No clue what this one is about, but it's one of the only AOB's
// that is actually unique.
aobscan(showmeme, 00 00 00 00 00 00 00 00 00 7? ?? ?? 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 FF FF FF FF 00 00 00 00 00 00 00 01)
label(_showmeme)
registersymbol(_showmeme)

showmeme:
_showmeme:

[DISABLE]
unregistersymbol(_creation)
unregistersymbol(_showmeme)"""

