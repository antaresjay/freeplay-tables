source = """
{ Game   : CITW-Win64-Shipping.exe
  Version: 
  Date   : 2019-09-08
  Author : Anjinggila

  This script does blah blah blah
}

[ENABLE]

aobscan(HEALTH,83 b9 ? ? ? ? ? 49 8b d8 48 8b f9 0f 8e) //if doesnt work change it to 83 B9 C0 08 00 00 00 49
alloc(newmem,$1000,HEALTH)

label(code)
label(return)
registersymbol(p_hp)
label(p_hp)

newmem:
  mov [p_hp],rcx

code:
  cmp dword ptr [rcx+000008C0],00
  jmp return

p_hp:
dq

HEALTH:
  jmp newmem
  nop 2
return:
registersymbol(HEALTH)

[DISABLE]

HEALTH:
  db 83 B9 C0 08 00 00 00

unregistersymbol(HEALTH)
unregistersymbol(p_hp)
dealloc(newmem)"""

