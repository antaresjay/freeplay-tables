[[cheat]]
id = "get-debug-menu"
name = "Get Debug Menu"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,CheatManager:Update)
define(bytes,55 8B EC 56 83 EC **)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000)

aobscanregion(aobToggle,CheatManager:ToggleCheatMenu,CheatManager:ToggleCheatMenu+5,55)

alloc(origUpdate,7)
registersymbol(origUpdate)

origUpdate:
readmem(CheatManager:Update,7)

label(code)
label(trigger)
registersymbol(trigger)

newmem:

code:
  readmem(CheatManager:Update,7)

  cmp byte ptr[trigger],1
  jne return

  sub esp,4
  mov eax,aobToggle
  call eax
  add esp,4
  mov byte ptr[trigger],0

  jmp return
trigger:
db 0

address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  readmem(origUpdate,7)

dealloc(newmem)"""

