[[cheat]]
id = "godmode-1hko"
name = "Godmode + 1HKO"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,100)
label(returnhere)
label(Godmode)
label(Instakill)
label(exit)

newmem:

Godmode:
cmp [esi+0C],00037D02
jne Instakill
mov [esi+CC],(float)200
jmp exit

Instakill:
mov [esi+CC],(float)0
exit:
jmp returnhere

"Engine.dll"+F5CFC:
jmp newmem
nop
returnhere:

[DISABLE]
dealloc(newmem)
dealloc(Godmode)
dealloc(Instakill)
"Engine.dll"+F5CFC:
fstp dword ptr [esi+CC]"""
