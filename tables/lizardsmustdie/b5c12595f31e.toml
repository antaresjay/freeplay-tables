[[cheat]]
id = "playerstats"
name = "Playerstats"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(PlayerStats,GameAssembly.dll,8B 7B 60 48 85 C9 0F 84 DC)
alloc(newmem,$1000,PlayerStats)

label(code)
label(return)
label(PSHook)
newmem:
mov [PSHook],rbx
code:
  mov edi,[rbx+60]
  test rcx,rcx
  jmp return
PSHook:
dq 0
PlayerStats:
  jmp newmem
  nop
return:
registersymbol(PlayerStats PSHook)

[DISABLE]

PlayerStats:
  db 8B 7B 60 48 85 C9

unregistersymbol(PlayerStats)
unregistersymbol(PSHook)
dealloc(newmem)"""

