[[cheat]]
id = "score-manager-ctrl-numpad-1-earn-score-to-populate-value"
name = "Score Manager (Ctrl + Numpad 1) {Earn score to populate value}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : cgo.exe
// Author            : ndck76
// Executable Version: 2022.3.48.62620
// Game Version      : Build.19566423
// Script Date       : 2025-08-13


[ENABLE]

aobscanregion(score,ScoreManager:AddScore,ScoreManager:AddScore+100,4863xxxx48xxxxxx48xxxxxx48xxxx48xxxx83xxxx48xxxxxxxx90) //ScoreManager:AddScore+3b
alloc(newmem,$1000,score)
alloc(data2,8)
alloc(scorebkp,8)
registersymbol(data2)
registersymbol(score)
registersymbol(scorebkp)
label(code)
label(return)

scorebkp:
  readmem(score,8)

newmem:
  mov [data2],rdi

code:
  readmem(score,8)
  jmp return

score:
  jmp newmem
  nop 3
return:

[DISABLE]

score:
  readmem(scorebkp,8)

unregistersymbol(*)
dealloc(*)"""

