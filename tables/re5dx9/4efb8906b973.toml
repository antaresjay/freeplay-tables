[[cheat]]
id = "inf-health"
name = "Inf. Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
//Author: Pedro BR HUEHUEHUE
//Created: August 9, 2017
//Resident Evil 5 Steam
[ENABLE]

aobscanmodule(Health,re5dx9.exe,66 29 8E 64 13 00 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  sub [esi+00001364],cx


Health:
  db 90 90 90 90 90 90 90

return:
registersymbol(Health)

[DISABLE]

Health:
  db 66 29 8E 64 13 00 00

unregistersymbol(Health)
dealloc(newmem)"""

