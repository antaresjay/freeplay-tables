[[cheat]]
id = "activate-me-first"
name = "Activate Me First!!!"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//a script to disable xlive's memory check protection
//made by geri with cheat engine 6.0
//18th may, 2011

[enable]
label(xlivekiller)
registersymbol(xlivekiller)
aobscan(aobxlive,74 14 ff 75 14 8b ce ff 75 10 53 e8)

aobxlive:
xlivekiller:
db eb 14

[disable]
dealloc(newmem)
xlivekiller:
db 74 14
unregistersymbol(xlivekiller)"""

