[[cheat]]
id = "disable-anticheats"
name = "Disable Anticheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//A script to disable Xlive's memory check protection
//Made by Geri with Cheat Engine 6.0
//18th May, 2011
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(xlivekiller)
registersymbol(xlivekiller)

aobscanmodule(aobxlive,xlive.dll,74 14 FF 75 14 8B CE FF 75 10 53 E8 )


aobxlive:
xlivekiller:
db EB 14

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
xlivekiller:
db 74 14
unregistersymbol(xlivekiller)"""

