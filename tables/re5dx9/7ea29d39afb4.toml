[[cheat]]
id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[Enable]
AoBScan(AmmoCompareIfOut, 0F 8F ? ? ? ? 8B 7E 2C )
AoBScan(SubAmmo, 29 6E 08 5F 5E 5D  )
registersymbol(AmmoCompareIfOut)
registersymbol(SubAmmo)

AmmoCompareIfOut:
db 90 E9

SubAmmo:
db 90 90 90

[Disable]
unregistersymbol(AmmoCompareIfOut)
unregistersymbol(SubAmmo)

AmmoCompareIfOut:
db 0F 8F

SubAmmo:
sub [esi+8],ebp"""

