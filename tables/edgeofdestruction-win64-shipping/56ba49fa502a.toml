[[cheat]]
id = "third-person-character-ctrl-numpad-1"
name = "Third Person Character (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : EdgeofDestruction-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.5.1.0
// Game Version      : Build.24095532 (Early Access)
// Script Date       : 2026-08-01


[ENABLE]

aobscanmodule(master,EdgeofDestruction-Win64-Shipping.exe,488Bxx33xx4Cxxxxxxxxxxxx488Bxx41FFxx84xx74xx488Bxx488B) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,5)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,5)

newmem:
  mov [data],rax

code:
  readmem(master,5)
  jmp return

master:
  jmp newmem
return:

[DISABLE]

master:
  readmem(masterbkp,5)

unregistersymbol(*)
dealloc(*)"""

