je playerstats_skillsset_exit
jmp playerstats_skillsset_entry
playerstats_skillsset_exit:

cmp dword ptr [playerstats_spellsset_enable], #0
je playerstats_spellsset_exit
mov edx, 0
mov ecx, #47
playerstats_spellsset_entry:
mov word ptr [ebx+edx*2+246c88], #999
mov [ebx+edx*4+246a20], #999
inc edx
cmp ecx, edx
je playerstats_spellsset_exit
jmp playerstats_spellsset_entry
playerstats_spellsset_exit:

cmp dword ptr [playerstats_seaponskillsset_enable], #0
je playerstats_seaponskillsset_exit
mov edx, 0
mov ecx, #19
playerstats_seaponskillsset_entry:
imul eax, edx, #72
mov [ebx+eax+247dc0], #15
inc edx
cmp ecx, edx
je playerstats_seaponskillsset_exit
jmp playerstats_seaponskillsset_entry
playerstats_seaponskillsset_exit:

cmp dword ptr [playerstats_timeset_enable], #0
je playerstats_timeset_exit
mov [ebx+e4], #0
mov [ebx+e8], #0
mov [ebx+9fcf0], #0
mov [ebx+9fcf4], #0
mov [ebx+9fcf8], #0
mov [ebx+9fcfc], #0
mov [ebx+9fd00], #0
playerstats_timeset_exit:

cmp dword ptr [playerstats_flagset_enable], #0
je playerstats_flagset_exit
mov [ebx+9fb50], #0
mov [ebx+9fd58], #0
playerstats_flagset_exit:

cmp dword ptr [playerstats_visibilityset_enable], #0
je playerstats_visibilityset_exit
mov [ebx+22c], #9
playerstats_visibilityset_exit:

mov eax, [playerstats_temp1]
mov ebx, [playerstats_temp2]
mov ecx, [playerstats_temp3]
mov edx, [playerstats_temp4]


playerstats_originalcode:
db 6B C0 64 99 F7 F9
//imul eax,eax,64
//cdq
//idiv ecx


playerstats_exit:
