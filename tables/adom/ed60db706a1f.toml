id = "attributes-limiter-removed-to-update-play-level"
name = "Attributes Limiter Removed (To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(attributeslimiter_savedAOB1)

registersymbol(attributeslimiter_savedAOB1)

//adom.exe+11CB35 - 5F                    - pop edi
//adom.exe+11CB36 - 5E                    - pop esi
// Limits Attribute
//adom.exe+11CB37 - B8 63000000           - mov eax,00000063
//adom.exe+11CB3C - C7 44 24 14 00000000  - mov [esp+14],00000000
//adom.exe+11CB44 - 5B                    - pop ebx
//adom.exe+11CB45 - 8B E5                 - mov esp,ebp
//adom.exe+11CB47 - 5D                    - pop ebp
//adom.exe+11CB48 - C3                    - ret
aobscan(attributeslimiter_searchedAOB1, B8 63 00 00 00 C7 44 24 14 00 00 00 00 5B 8B E5 5D C3)


attributeslimiter_searchedAOB1:
attributeslimiter_savedAOB1:
db 90 90 90 90 90


[DISABLE]
attributeslimiter_savedAOB1:
db B8 63 00 00 00
//mov eax,00000063


unregistersymbol(attributeslimiter_savedAOB1)"""

