label(playerstats_visibilityset_exit)

registersymbol(playerstats_savedAOB)

//adom.exe+10B809 - E8 02A20200           - call adom.exe+135A10
//adom.exe+10B80E - 8B C8                 - mov ecx,eax
// Accesses HP
//adom.exe+10B810 - A1 182F1A01           - mov eax,[adom.exe+862F18]
//adom.exe+10B815 - 6B C0 64              - imul eax,eax,64
//adom.exe+10B818 - 99                    - cdq
//adom.exe+10B819 - F7 F9                 - idiv ecx
//adom.exe+10B81B - 85 C0                 - test eax,eax
//adom.exe+10B81D - 79 04                 - jns adom.exe+10B823
//adom.exe+10B81F - 33 C0                 - xor eax,eax
//adom.exe+10B821 - EB 0A                 - jmp adom.exe+10B82D
aobscan(playerstats_searchedAOB, 6B C0 64 99 F7 F9 85 C0 79 04)

alloc(playerstats_newmem, 2048, playerstats_searchedAOB)
alloc(playerstats_temp1, 4, playerstats_searchedAOB)
alloc(playerstats_temp2, 4, playerstats_searchedAOB)
alloc(playerstats_temp3, 4, playerstats_searchedAOB)
alloc(playerstats_temp4, 4, playerstats_searchedAOB)
alloc(playerstats_temp5, 4, playerstats_searchedAOB)


playerstats_newmem:
mov [playerstats_temp1], eax
mov [playerstats_temp2], ebx
mov [playerstats_temp3], ecx
mov [playerstats_temp4], edx

mov ebx, [playerstats_savedAOB-4]

cmp dword ptr [playerstats_update_enable], #0
je playerstats_update_exit
mov [playerstats_basepointer], ebx
playerstats_update_exit:

cmp dword ptr [playerstats_set_enable], #0
je playerstats_set_exit
playerstats_set_exit:

cmp dword ptr [playerstats_hpset_enable], #0
je playerstats_hpset_exit
mov ecx, [ebx+4]
add ecx, [ebx+14c]
add ecx, [ebx+154]
add ecx, [ebx+15c]
mov [ebx], ecx
playerstats_hpset_exit:

cmp dword ptr [playerstats_ppset_enable], #0
je playerstats_ppset_exit
imul ecx, [ebx+e0], #00400
add ecx, [ebx+154]
add ecx, [ebx+168]
add ecx, [ebx+9f9e8]
mov [ebx+9f920], ecx
playerstats_ppset_exit:

cmp dword ptr [playerstats_depletablesset_enable], #0
je playerstats_depletablesset_exit
//mov [ebx-56b314], #-1
mov [ebx+200], #0
mov [ebx+204], #0
mov [ebx+208], #0
mov [ebx+20c], #0
mov [ebx+210], #0
mov [ebx+214], #0
