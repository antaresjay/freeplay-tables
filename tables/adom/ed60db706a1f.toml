[[cheat]]
id = "item-stats-base-address-scan-to-update-mouseover-item"
name = "Item Stats Base Address Scan (To Update: Mouseover Item)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(itemstats_savedAOB)
label(itemstats_returnhere)
label(itemstats_originalcode)
label(itemstats_exit)

label(itemstats_update_exit)
label(itemstats_set_exit)
label(itemstats_statusset_exit)
label(itemstats_proofset_exit)
label(itemstats_negativesset_exit)

registersymbol(itemstats_savedAOB)

//adom.exe+10D05C - 53                    - push ebx
//adom.exe+10D05D - FF D6                 - call esi
// Accesses Item Quantity
//adom.exe+10D05F - 8B 8F 90000000        - mov ecx,[edi+00000090]
//adom.exe+10D065 - 83 C4 0C              - add esp,0C
//adom.exe+10D068 - 51                    - push ecx
//adom.exe+10D069 - 68 D0E2BD00           - push adom.exe+29E2D0
//adom.exe+10D06E - 53                    - push ebx
aobscan(itemstats_searchedAOB, 8B 8F 90 00 00 00 83 C4 0C 51)

alloc(itemstats_newmem, 2048, itemstats_searchedAOB)
alloc(itemstats_temp1, 4, itemstats_searchedAOB)
alloc(itemstats_temp2, 4, itemstats_searchedAOB)
alloc(itemstats_temp3, 4, itemstats_searchedAOB)
alloc(itemstats_temp4, 4, itemstats_searchedAOB)
alloc(itemstats_temp5, 4, itemstats_searchedAOB)


itemstats_newmem:
mov [itemstats_temp1], eax
mov [itemstats_temp2], ebx
mov [itemstats_temp3], ecx
mov [itemstats_temp4], edx

cmp dword ptr [itemstats_update_enable], #0
je itemstats_update_exit
mov [itemstats_basepointer], edi
itemstats_update_exit:

cmp dword ptr [itemstats_set_enable], #0
je itemstats_set_exit
itemstats_set_exit:

cmp dword ptr [itemstats_statusset_enable], #0
je itemstats_statusset_exit
mov [edi+1c], #2
itemstats_statusset_exit:

cmp dword ptr [itemstats_proofset_enable], #0
je itemstats_proofset_exit
mov ebx, [edi+b0]
or ebx, #1
mov [edi+b0], ebx
itemstats_proofset_exit:

cmp dword ptr [itemstats_negativesset_enable], #0
je itemstats_negativesset_exit
mov [edi+98], #0
mov [edi+9c], #0
mov [edi+a0], #0
itemstats_negativesset_exit:

mov eax, [itemstats_temp1]
mov ebx, [itemstats_temp2]
mov ecx, [itemstats_temp3]
mov edx, [itemstats_temp4]


itemstats_originalcode:
db 8B 8F 90 00 00 00
//mov ecx,[edi+00000090]


itemstats_exit:
jmp itemstats_returnhere


itemstats_searchedAOB:
itemstats_savedAOB:
jmp itemstats_newmem
nop
itemstats_returnhere:


[DISABLE]
itemstats_savedAOB:
db 8B 8F 90 00 00 00
//mov ecx,[edi+00000090]

unregistersymbol(itemstats_savedAOB)

dealloc(itemstats_newmem)
dealloc(itemstats_temp1)
dealloc(itemstats_temp2)
dealloc(itemstats_temp3)
dealloc(itemstats_temp4)
dealloc(itemstats_temp5)"""

