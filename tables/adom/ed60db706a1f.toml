mov [ebx+21c], #0
mov [ebx+220], #0
mov [ebx+224], #9999
mov [ebx+228], #9999
mov [ebx+230], #0
mov [ebx+234], #0
mov [ebx+23c], #0
mov [ebx+9fa0c], #1500
mov [ebx+9fa28], #0
mov [ebx+9fa2c], #0
mov [ebx+9fa60], #1000000
mov [ebx+9fa64], #0
mov [ebx+9fa68], #1000000
mov [ebx+9fa6c], #0
mov [ebx+9fa70], #1000000
mov [ebx+9fa74], #0
mov [ebx+9fce4], #9999
mov [ebx+9fce8], #9999
mov [ebx+9fd34], #99999
mov [ebx+10f7dc], #0
mov word ptr [ebx+10f82c], #0
mov edx, 0
mov ecx, #20
playerstats_depletablesset_entry:
mov [ebx+edx*4+247d48], #0
inc edx
cmp ecx, edx
je playerstats_depletablesset_exit
jmp playerstats_depletablesset_entry
playerstats_depletablesset_exit:

cmp dword ptr [playerstats_corruptionset_enable], #0
je playerstats_corruptionset_exit
mov [ebx+9fc50], #0
mov [ebx+9fc54], #0
playerstats_corruptionset_exit:

cmp dword ptr [playerstats_corruptionintrinsicsset_enable], #0
je playerstats_corruptionintrinsicsset_exit
mov [ebx+9fc58], #2163252218
mov [ebx+9fc5c], #20
mov [ebx+9fc60], #0
playerstats_corruptionintrinsicsset_exit:

cmp dword ptr [playerstats_statsset_enable], #0
je playerstats_statsset_exit
mov [ebx+4], #9999
mov [ebx+d0], #1
mov [ebx+d4], #1
mov [ebx+9fa30], #99999
mov [ebx+9fa48], #0
mov [ebx+9f9e8], #9999
mov [ebx+9fd30], #9999
mov [ebx+14c], #99999
mov [ebx+170], #99999
mov edx, 0
mov ecx, #8
playerstats_statsset_entry:
mov [ebx+edx*4+150], #999
mov [ebx+edx*4+174], #999
inc edx
cmp ecx, edx
je playerstats_statsset_exit
jmp playerstats_statsset_entry
playerstats_statsset_exit:

cmp dword ptr [playerstats_intrinsicsset_enable], #0
je playerstats_intrinsicsset_exit
mov [ebx+9fa14], #134216127
playerstats_intrinsicsset_exit:

cmp dword ptr [playerstats_talentsset_enable], #0
je playerstats_talentsset_exit
mov edx, 0
mov ecx, #100
playerstats_talentsset_entry:
