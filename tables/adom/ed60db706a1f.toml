//adom.exe+18148F - 0FBF 05 F82F1A01      - movsx eax,word ptr [adom.exe+862FF8]
//adom.exe+181496 - 3B C2                 - cmp eax,edx
//adom.exe+181498 - 0F8E C7010000         - jng adom.exe+181665
//adom.exe+18149E - E8 CDD5F2FF           - call adom.exe+AEA70
//adom.exe+1814A3 - E8 0807F3FF           - call adom.exe+B1BB0
//adom.exe+1814A8 - 8B D8                 - mov ebx,eax
//adom.exe+1814AA - 39 7B 1C              - cmp [ebx+1C],edi
//adom.exe+1814AD - 75 07                 - jne adom.exe+1814B6
//adom.exe+1814AF - C7 43 1C 01000000     - mov [ebx+1C],00000001
//adom.exe+1814B6 - E8 65A9F9FF           - call adom.exe+11BE20
//adom.exe+1814BB - 83 F8 02              - cmp eax,02
aobscan(precrownlevellimiter_searchedAOB1, 8B D8 39 7B 1C 75 07 C7 43 1C 01 00 00 00)


