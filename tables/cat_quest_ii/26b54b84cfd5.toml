[[cheat]]
id = "loads-money-when-opening-inventory-works"
name = "loads money when opening inventory works"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(cheatmode,48 63 36 33 C0 48 89 45 A8 48 89 45 B0 48 8B FD 48 83 C7 A8 45 33 FF)

alloc(newmem,$1000)
alloc(address,$1000)
alloc(money_added,$1000)
alloc(cache,$1000)
label(returnhere)
label(originalcode)
label(exit)
registersymbol(cheatmode)
registersymbol(money_added)

money_added:
db #0

newmem: //this is allocated memory, you have read,write,execute access
//place your code here

mov [cache],edx
mov edx,[money_added]
add [rsi],edx
mov edx,[cache]

originalcode:

movsxd  rsi,dword ptr [rsi]

xor eax,eax
/*
mov [rbp-58],rax
mov [rbp-50],rax
mov rdi,rbp

for two nops, was with the error of the original jmp to newmem not being allocated correctly
*/

exit:
jmp returnhere

cheatmode:
jmp newmem

returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
dealloc(money_added)
dealloc(cache)
dealloc(address)
cheatmode:
db 48 63 36 33 C0 48 89 45 A8 48 89 45 B0 48 8B FD 48 83 C7 A8 45 33 FF
unregistersymbol(cheatmode)
unregistersymbol(money_added)
//movsxd  rsi,dword ptr [rsi]
//xor eax,eax"""

