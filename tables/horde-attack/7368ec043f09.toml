[[cheat]]
id = "player-activate-enter-town"
name = "[Player] (Activate: Enter Town)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Horde attack.exe
  Version: 
  Date   : 2017-11-05
  Author : Kalas

  This script does blah blah blah
}

[ENABLE]

aobscan(_CityController,FF C0 89 46 70 B9 F0 AD E5 0D 48 63)
alloc(newmem,$1000,_CityController)

label(code)
label(return)
label(_ptrBase)

newmem:
  push rbx
  mov rbx, _ptrBase
  mov [rbx], rsi
  pop rbx

code:
  inc eax
  mov [rsi+70],eax
  jmp return

_ptrBase:
  dq 0

_CityController:
  jmp newmem
return:
registersymbol(_CityController)
registersymbol(_ptrBase)

[DISABLE]

_CityController:
  db FF C0 89 46 70

unregistersymbol(_CityController)
unregistersymbol(_ptrBase)
dealloc(newmem)"""

