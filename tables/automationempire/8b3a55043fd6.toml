[[cheat]]
id = "player-pointer"
name = "Player Pointer"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(playerAob,48 63 49 2C 3B C1 0F 84)
alloc(newmem,$1000,playerAob)

label(code)
label(return)
label(playerPtr)

newmem:
  push rax
  mov rax,playerPtr
  mov [rax],rcx
  pop rax
code:
  movsxd  rcx,dword ptr [rcx+2C]
  cmp eax,ecx
  jmp return

playerPtr:
  dq 0

playerAob:
  jmp newmem
  nop
return:
registersymbol(playerAob)
registersymbol(playerPtr)

[DISABLE]
playerAob:
  db 48 63 49 2C 3B C1
unregistersymbol(playerAob)
unregistersymbol(playerPtr)
dealloc(newmem)

