[[cheat]]
id = "required-autoassembler"
name = "required: autoAssembler"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc(newmem,$1000,read_player)
label(code_player,player_ptr)
registersymbol(code_player,player_ptr)

newmem:
  code_player:
    readmem(read_player,7)
    mov [player_ptr],rax
    jmp return
    align 10 CC

  player_ptr:
    dq 0

read_player:
  jmp code_player
  nop 2
return:

[DISABLE]

read_player:
  readmem(code_player,7)

unregistersymbol(*)
dealloc(*)"""

