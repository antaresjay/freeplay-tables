[[cheat]]
id = "damage-multiplier"
name = "Damage Multiplier"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc(newmem,$1000,trace_damage)
label(code_damage,damage_multiplier)
registersymbol(code_damage,damage_multiplier)

newmem:
  code_damage:
    readmem(trace_damage,5)
    cmp [player_ptr],r12
    jne return
    mulss xmm12,[damage_multiplier]
    jmp return
    align 10 CC

  damage_multiplier:
    dd (float)10.0

trace_damage:
  jmp code_damage
return:

[DISABLE]

trace_damage:
  readmem(code_damage,5)

unregistersymbol(*)
dealloc(*)"""

