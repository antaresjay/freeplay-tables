[[cheat]]
id = "party-members-modifier"
name = "Party Members Modifier"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc(newmem,$1000,trace_party)
label(code_party,party_flag_ptr)
label(code_party_frame,party_frame_ptr)
registersymbol(code_party,party_flag_ptr)
registersymbol(code_party_frame,party_frame_ptr)

newmem:
  code_party:
    readmem(trace_party,7)
    cmp r11,0201
    jne return1
    push rbp
    db 4A 8D AC 98
    readmem(trace_party+0B,4)
    sub rbp,04
    mov [party_flag_ptr],rbp
    pop rbp
    jmp return1
    align 10 CC

  code_party_frame:
    readmem(read_party_frame,7)
    mov [party_frame_ptr],rcx
    jmp return2
    align 10 CC

  party_flag_ptr:
    dq 0

  party_frame_ptr:
    dq 0

trace_party:
  jmp code_party
  nop 2
return1:

read_party_frame:
  jmp code_party_frame
  nop 2
return2:

[DISABLE]

trace_party:
  readmem(code_party,7)

read_party_frame:
  readmem(code_party_frame,7)

unregistersymbol(code_party,party_flag_ptr)
unregistersymbol(code_party_frame,party_frame_ptr)
dealloc(newmem)"""

