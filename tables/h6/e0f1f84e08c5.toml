[[cheat]]
id = "aobresourceticker"
name = "--aobResourceTicker"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
// Game   : H6.exe
// Version:
// Date   :
// Author : Cs
[ENABLE]
aobscan(aobResourceTicker,89 46 ?? 8B 46 ?? 85 C0 74 27 8B 46 ??)

alloc(newmemResourceTicker,4096,aobResourceTicker)

label(aobResourceTicker_r)
label(aobResourceTicker_i)
registersymbol(aobResourceTicker_r)
registersymbol(aobResourceTicker_i)

label(lblResourceTicker)
label(lblResourceTickerSkipCrew)
label(lblResourceTickerSkipMaterials)
label(lblResourceTickerSkipDarkMatter)
label(lblResourceTickerSkipFuel)
label(lblResourceTickerSkip)
label(lblResourceTickerRet)

label(bEnableMinResources)
label(fMinCrew)
label(fMinMaterials)
label(fMinFuel)
label(fMinDarkMatter)
registersymbol(bEnableMinResources)
registersymbol(fMinCrew)
registersymbol(fMinMaterials)
registersymbol(fMinDarkMatter)
registersymbol(fMinFuel)

newmemResourceTicker:
bEnableMinResources:
dd 1
fMinCrew:
dd (float)500
fMinMaterials:
dd (float)1000
fMinDarkMatter:
dd (float)2500
fMinFuel:
dd (float)100

lblResourceTicker:
readmem(aobResourceTicker,3)
mov eax,[esi+08]
cmp dword ptr [eax+18],esi
jne lblResourceTickerSkip
cmp dword ptr [bEnableMinResources],1
jne short lblResourceTickerSkip
mov eax,[esi+40]
mov eax,[eax+14]
mov eax,[eax+14]
push edx

mov edx,[fMinCrew]
cmp dword ptr [eax+10],edx
jge short lblResourceTickerSkipCrew
mov dword ptr [eax+10],edx
lblResourceTickerSkipCrew:

mov edx,[fMinMaterials]
cmp dword ptr [eax+14],edx
jge short lblResourceTickerSkipMaterials
mov dword ptr [eax+14],edx
lblResourceTickerSkipMaterials:

mov edx,[fMinDarkMatter]
cmp dword ptr [eax+1C],edx
jge short lblResourceTickerSkipDarkMatter
mov dword ptr [eax+1C],edx
lblResourceTickerSkipDarkMatter:

mov edx,[fMinFuel]
cmp dword ptr [eax+18],edx
jge short lblResourceTickerSkipFuel
mov dword ptr [eax+18],edx
lblResourceTickerSkipFuel:

pop edx
lblResourceTickerSkip:
readmem(aobResourceTicker+3,3)
jmp lblResourceTickerRet
aobResourceTicker_i:
readmem(aobResourceTicker,6)

aobResourceTicker:
aobResourceTicker_r:
jmp lblResourceTicker
nop
lblResourceTickerRet:

[DISABLE]
aobResourceTicker_r:
readmem(aobResourceTicker_i,6)

unregistersymbol(aobResourceTicker_r)
unregistersymbol(aobResourceTicker_i)

unregistersymbol(bEnableMinResources)
unregistersymbol(fMinCrew)
unregistersymbol(fMinMaterials)
unregistersymbol(fMinDarkMatter)
unregistersymbol(fMinFuel)

dealloc(newmemResourceTicker)"""

