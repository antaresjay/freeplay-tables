[[cheat]]
id = "aobcombatticker"
name = "--aobCombatTicker"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
// Game   : H6.exe
// Version:
// Date   :
// Author : Cs
[ENABLE]
aobscan(aobCombatTicker,8B 41 78 8B D0 39 12 8B 40 4C)

alloc(newmemCombatTicker,4096,aobCombatTicker)

label(aobCombatTicker_r)
label(aobCombatTicker_i)
registersymbol(aobCombatTicker_r)
registersymbol(aobCombatTicker_i)

label(lblCombatTicker)
label(lblCombatTickerSkip)
label(lblCombatTickerRet)
label(lblCombatTickerEnemy)

label(bEnableGodMode)
label(bEnableWeakEnemies)
registersymbol(bEnableGodMode)
registersymbol(bEnableWeakEnemies)

newmemCombatTicker:
bEnableGodMode:
dd 1
bEnableWeakEnemies:
dd 1

lblCombatTicker:
readmem(aobCombatTicker,3)
mov edx,[eax+08]
mov edx,[edx+18]
cmp dword ptr [eax+4c],edx
jne lblCombatTickerEnemy
cmp dword ptr [bEnableGodMode],1
jne short lblCombatTickerSkip
mov edx,[eax+d4]
mov dword ptr [eax+9c],edx
lblCombatTickerSkip:
readmem(aobCombatTicker+3,2)
jmp lblCombatTickerRet
lblCombatTickerEnemy:
cmp dword ptr [bEnableWeakEnemies],1
jne short lblCombatTickerSkip
cmp dword ptr [eax+9c],(float)1.0
jle short lblCombatTickerSkip
mov dword ptr [eax+9c],(float)1.0
jmp short lblCombatTickerSkip

aobCombatTicker_i:
readmem(aobCombatTicker,5)

aobCombatTicker:
aobCombatTicker_r:
jmp lblCombatTicker
lblCombatTickerRet:

[DISABLE]
aobCombatTicker_r:
readmem(aobCombatTicker_i,5)

unregistersymbol(aobCombatTicker_r)
unregistersymbol(aobCombatTicker_i)

unregistersymbol(bEnableGodMode)
unregistersymbol(bEnableWeakEnemies)

dealloc(newmemCombatTicker)"""

