[[cheat]]
id = "active-trainer"
name = "Active Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
aobscanmodule(trainerbase,PCM.exe,D9 41 5C D9 5C 24 08 e8 * * * * D9 5C 24 0C D9 44 24 04 D9 44 24 08 D8 74 24 0C DE E9)
registersymbol(trainerbase)
label(heartbeat)
label(water)
label(stamina)
label(resistance)
label(sprint)
label(heartbeatE)
label(waterE)
label(staminaE)
label(resistanceE)
label(springE)
registersymbol(heartbeatE)
registersymbol(waterE)
registersymbol(staminaE)
registersymbol(resistanceE)
registersymbol(springE)
//



newmem: //this is allocated memory, you have read,write,execute access
//place your code here
//esi base -- 144--1c heart beat
//esi base -- 144--5c  water used = 0
//esi base -- 144--40 stamina
//esi base -- 144--4c max stamina
//esi base -- 144--44 Resistance
//esi base -- 144--54 max Resistance
//esi base -- 144--48 Sprint
//esi base -- 144--58 max Sprint
stamina:
cmp [staminaE],0
je resistance
fld [ecx+4c]
fadd [ecx+4c]
fstp [ecx+40]
resistance:
cmp [resistanceE],0
je sprint
fld [ecx+54]
fadd [ecx+54]
fstp [ecx+44]
sprint:
cmp [springE],0
je water
fld [ecx+58]
fadd [ecx+58]
fstp [ecx+48]
water:
cmp [waterE],0
je heartbeat
mov [ecx+5c],0
heartbeat:
cmp [heartbeatE],0
je originalcode
mov [ecx+1c],0
originalcode:

fld dword ptr [ecx+5C]
fstp dword ptr [esp+08]
jmp returnhere
heartbeatE:
dd 0
waterE:
dd 0
staminaE:
dd 0
resistanceE:
dd 0
springE:
dd 0
trainerbase://"PCM.exe"+274BFA:
jmp newmem
nop
nop
returnhere:









[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
trainerbase://
db D9 41 5C D9 5C 24 08
unregistersymbol(trainerbase)
unregistersymbol(heartbeatE)
unregistersymbol(waterE)
unregistersymbol(staminaE)
unregistersymbol(resistanceE)
unregistersymbol(springE)"""

