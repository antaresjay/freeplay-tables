[[cheat]]
id = "battle-damage-multiplier"
name = "Battle Damage Multiplier"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(damage,$process,488B??482B??488B??????????E8????????84)
alloc(al_damage,$256,damage)
alloc(mem_damage,6)
alloc(playerDamageMultiplier,4)
alloc(allyDamageMultiplier,4)
alloc(enemyDamageMultiplier,4)
alloc(_xmm15,16)
label(re_damage)
registersymbol(damage mem_damage playerDamageMultiplier allyDamageMultiplier enemyDamageMultiplier)

mem_damage:
  readmem(damage,6)

playerDamageMultiplier:
  dd (float)1.0

allyDamageMultiplier:
  dd (float)1.0

enemyDamageMultiplier:
  dd (float)1.0

al_damage:
  movups [_xmm15],xmm15
  cmp [rdi+B0],1
  je player
  cmp [rdi+B0],2
  je ally
  cmp [rdi+B0],3
  je enemy
  jmp normalProcess

player:
  cvtsi2ss xmm15,rbx
  mulss xmm15,[playerDamageMultiplier]
  cvtss2si rbx,xmm15
  jmp normalProcess

ally:
  cvtsi2ss xmm15,rbx
  mulss xmm15,[allyDamageMultiplier]
  cvtss2si rbx,xmm15
  jmp normalProcess

enemy:
  cvtsi2ss xmm15,rbx
  mulss xmm15,[enemyDamageMultiplier]
  cvtss2si rbx,xmm15
  jmp normalProcess

normalProcess:
  movups xmm15,[_xmm15]
  readmem(damage,6)
  jmp re_damage

damage:
  jmp al_damage
  nop
re_damage:

[DISABLE]
damage:
  readmem(mem_damage,6)

dealloc(*)
unregistersymbol(*)"""

