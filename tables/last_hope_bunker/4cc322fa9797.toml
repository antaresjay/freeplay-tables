[[cheat]]
id = "infinite-filter"
name = "Infinite Filter"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(purifythyair,GameAssembly.dll,F3 0F 10 48 24 45 33 C0 F3 0F 5C CF 48 8B C8)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  push r11

  mov r11, [rax+28]
  test r11,r11
  je code

  fld dword ptr [r11+2C]
  fstp dword ptr [rax+24]

code:
  pop r11

  movss xmm1,[rax+24]
  xor r8d,r8d
  subss xmm1,xmm7
  mov rcx,rax
  jmp return

purifythyair:
  jmp far newmem
  nop
return:
registersymbol(purifythyair)

[DISABLE]

purifythyair:
  db F3 0F 10 48 24 45 33 C0 F3 0F 5C CF 48 8B C8

unregistersymbol(purifythyair)
dealloc(newmem)"""
