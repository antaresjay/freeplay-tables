[[cheat]]
id = "mycharacter-base-address-scan-initialization-activate-this-first"
name = "MyCharacter Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(MyCharacter_basepointer)
registersymbol(MyCharacter_update_enable)
registersymbol(MyCharacter_update_value)
registersymbol(MyCharacter_set_enable)
registersymbol(MyCharacter_hpset_enable)
registersymbol(MyCharacter_styleset_enable)
registersymbol(MyCharacter_hyperset_enable)
registersymbol(MyCharacter_statsset_enable)
registersymbol(MyCharacter_abilitiesset_enable)
registersymbol(MyCharacter_creditsset_enable)

alloc(MyCharacter_basepointer, 4)
alloc(MyCharacter_update_enable, 4)
alloc(MyCharacter_update_value, 32)
alloc(MyCharacter_set_enable, 4)
alloc(MyCharacter_hpset_enable, 4)
alloc(MyCharacter_styleset_enable, 4)
alloc(MyCharacter_hyperset_enable, 4)
alloc(MyCharacter_statsset_enable, 4)
alloc(MyCharacter_abilitiesset_enable, 4)
alloc(MyCharacter_creditsset_enable, 4)

MyCharacter_update_value:
db 41 00 6C 00 79 00 73 00 73 00 61 00 00


[DISABLE]
unregistersymbol(MyCharacter_basepointer)
unregistersymbol(MyCharacter_update_enable)
unregistersymbol(MyCharacter_update_value)
unregistersymbol(MyCharacter_set_enable)
unregistersymbol(MyCharacter_hpset_enable)
unregistersymbol(MyCharacter_styleset_enable)
unregistersymbol(MyCharacter_hyperset_enable)
unregistersymbol(MyCharacter_statsset_enable)
unregistersymbol(MyCharacter_abilitiesset_enable)
unregistersymbol(MyCharacter_creditsset_enable)

dealloc(MyCharacter_basepointer)
dealloc(MyCharacter_update_enable)
dealloc(MyCharacter_update_value)
dealloc(MyCharacter_set_enable)
dealloc(MyCharacter_hpset_enable)
dealloc(MyCharacter_styleset_enable)
dealloc(MyCharacter_hyperset_enable)
dealloc(MyCharacter_statsset_enable)
dealloc(MyCharacter_abilitiesset_enable)
dealloc(MyCharacter_creditsset_enable)"""

[[cheat]]
id = "mycharacter-base-address-scan-to-activate-play-level-to-update-play-level"
name = "MyCharacter Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(MyCharacter_savedAOB)
label(MyCharacter_returnhere)
label(MyCharacter_originalcode)
label(MyCharacter_exit)

label(MyCharacter_update_exit)
label(MyCharacter_set_exit)
label(MyCharacter_hpset_exit)
label(MyCharacter_styleset_exit)
label(MyCharacter_hyperset_exit)
label(MyCharacter_statsset_exit)
label(MyCharacter_abilitiesset_exit)
label(MyCharacter_creditsset_exit)

registersymbol(MyCharacter_savedAOB)

//052B80A4 - 83 EC 14              - sub esp,14
//052B80A7 - 8B 7D 08              - mov edi,[ebp+08]
// MyCharacter:Update+a
//052B80AA - 8B 87 00010000        - mov eax,[edi+00000100]
//052B80B0 - 85 C0                 - test eax,eax
//052B80B2 - 75 16                 - jne 052B80CA
//052B80B4 - 8B 87 58020000        - mov eax,[edi+00000258]
//052B80BA - 85 C0                 - test eax,eax
aobscan(MyCharacter_searchedAOB, 8B 87 00 01 00 00 85 C0 75 16)

alloc(MyCharacter_newmem, 2048, MyCharacter_searchedAOB)
alloc(MyCharacter_temp1, 4, MyCharacter_searchedAOB)
alloc(MyCharacter_temp2, 4, MyCharacter_searchedAOB)
alloc(MyCharacter_temp3, 4, MyCharacter_searchedAOB)
alloc(MyCharacter_temp4, 4, MyCharacter_searchedAOB)
alloc(MyCharacter_temp5, 4, MyCharacter_searchedAOB)


MyCharacter_newmem:
mov [MyCharacter_temp1], eax
mov [MyCharacter_temp2], ebx
mov [MyCharacter_temp3], ecx
mov [MyCharacter_temp4], edx

cmp dword ptr [MyCharacter_update_enable], #0
je MyCharacter_update_exit
cmp dword ptr [edi+c], #0
je MyCharacter_update_exit
mov ebx, [edi+c]
mov ecx, [MyCharacter_update_value]
cmp dword ptr [ebx+c], ecx
jne MyCharacter_update_exit
mov ecx, [MyCharacter_update_value+4]
cmp dword ptr [ebx+10], ecx
jne MyCharacter_update_exit
mov [MyCharacter_basepointer], edi
MyCharacter_update_exit:

// Enemy
cmp byte ptr [edi+d4], #1
jne MyCharacter_creditsset_exit

cmp dword ptr [MyCharacter_set_enable], #0
je MyCharacter_set_exit
MyCharacter_set_exit:

cmp dword ptr [MyCharacter_hpset_enable], #0
je MyCharacter_hpset_exit
mov ebx, [edi+104]
mov [edi+100], ebx
MyCharacter_hpset_exit:

cmp dword ptr [MyCharacter_styleset_enable], #0
je MyCharacter_styleset_exit
mov ebx, [edi+110]
mov [edi+10c], ebx
add [edi+10c], ebx
add [edi+10c], ebx
add [edi+10c], ebx
add [edi+10c], ebx
MyCharacter_styleset_exit:

cmp dword ptr [MyCharacter_hyperset_enable], #0
je MyCharacter_hyperset_exit
mov ebx, [edi+11c]
mov [edi+118], ebx
mov [edi+120], ebx
MyCharacter_hyperset_exit:

cmp dword ptr [MyCharacter_statsset_enable], #0
je MyCharacter_statsset_exit
mov [edi+f0], #9999
mov [edi+f4], #9999
mov [edi+f8], #9999
mov [edi+fc], #9999
mov [edi+1a4], #9999999
mov [edi+1a8], #9999999
mov [edi+1ac], #9999999
mov [edi+1b0], #9999999
mov [edi+1b4], #9999999
mov [edi+1b8], #9999999
mov [edi+1bc], #9999999
mov [edi+1c0], #9999999
mov [edi+1c4], #9999999
mov [edi+1c8], #9999999
MyCharacter_statsset_exit:

cmp dword ptr [MyCharacter_abilitiesset_enable], #0
je MyCharacter_abilitiesset_exit
cmp dword ptr [edi+84], #0
je MyCharacter_abilitiesset_exit
mov ebx, [edi+84]
mov byte ptr [ebx+10], #1
mov byte ptr [ebx+11], #1
mov byte ptr [ebx+12], #1
mov byte ptr [ebx+13], #1
mov byte ptr [ebx+14], #1
mov byte ptr [ebx+15], #1
mov byte ptr [ebx+16], #1
mov byte ptr [ebx+17], #1
mov byte ptr [ebx+18], #1
mov byte ptr [ebx+19], #1
cmp dword ptr [edi+94], #0
je MyCharacter_abilitiesset_exit
mov ebx, [edi+94]
mov byte ptr [ebx+10], #1
mov byte ptr [ebx+11], #1
mov byte ptr [ebx+12], #1
mov byte ptr [ebx+13], #1
mov byte ptr [ebx+14], #1
mov byte ptr [ebx+15], #1
MyCharacter_abilitiesset_exit:

cmp dword ptr [MyCharacter_creditsset_enable], #0
je MyCharacter_creditsset_exit
cmp dword ptr [edi+b8], #0
je MyCharacter_abilitiesset_exit
mov ebx, [edi+b8]
mov [ebx+240], #9999999
MyCharacter_creditsset_exit:

mov eax, [MyCharacter_temp1]
mov ebx, [MyCharacter_temp2]
mov ecx, [MyCharacter_temp3]
mov edx, [MyCharacter_temp4]


MyCharacter_originalcode:
db 8B 87 00 01 00 00
//mov eax,[edi+00000100]


MyCharacter_exit:
jmp MyCharacter_returnhere


MyCharacter_searchedAOB:
MyCharacter_savedAOB:
jmp MyCharacter_newmem
nop
MyCharacter_returnhere:


[DISABLE]
MyCharacter_savedAOB:
db 8B 87 00 01 00 00
//mov eax,[edi+00000100]

unregistersymbol(MyCharacter_savedAOB)

dealloc(MyCharacter_newmem)
dealloc(MyCharacter_temp1)
dealloc(MyCharacter_temp2)
dealloc(MyCharacter_temp3)
dealloc(MyCharacter_temp4)
dealloc(MyCharacter_temp5)"""

