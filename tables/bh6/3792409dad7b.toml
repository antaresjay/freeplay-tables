[[cheat]]
id = "infinite-ammo-infinite-healing-things"
name = "Infinite Ammo / Infinite healing things"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
aobscan(ammo, 79 07 33 D2 66 89 54 41 )

[ENABLE]
alloc(newmem,64)

ammo-5:
jmp newmem

newmem:
cmp [esp+1C],0x11D//Healing tablets is Item ID #285
je ammo
cmp ebx,#0 //Reload
je ammo
sub [ecx+eax*2+0A],dx //Do original if grenades or clip call.
jmp ammo

[DISABLE]
dealloc(newmem)

ammo-5:
sub [ecx+eax*2+0A],dx"""

