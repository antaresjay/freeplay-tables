[[cheat]]
id = "infinite-ammo-herb"
name = "Infinite Ammo & Herb"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(aob1,0F BF 44 41 0A C2 * * 8B FF)
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
label(Ammo)
registersymbol(Ammo)

newmem:
mov word ptr [ecx+eax*2+0A],#100

originalcode:
movsx eax,word ptr [ecx+eax*2+0A]

exit:
jmp returnhere

aob1:
Ammo:
jmp newmem
returnhere:

 
[DISABLE]
dealloc(newmem)
unregistersymbol(Ammo)
Ammo:
db 0F BF 44 41 0A"""

