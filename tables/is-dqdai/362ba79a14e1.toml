// Game Executable   : IS-DQDai.exe
// Author            : ndck76
// Executable Version: 1.0.0.0
// Game Version      : v1.0.3
// Script Date       : 2024-03-27


[ENABLE]

aobscanmodule(power,IS-DQDai.exe,F3xxxxxxxxxxxxxxF3xxxxxxxxxxxxxx0F2Fxx72xxB0) // should be unique
alloc(newmem,$1000,power)
alloc(powerbkp,8)
registersymbol(power)
registersymbol(powerbkp)
label(code)
label(return)

powerbkp:
  readmem(power,8)

newmem:
  mov [rcx+00000080],(float)9999//1000

code:
  readmem(power,8)
  jmp return

power:
  jmp newmem
  nop 3
return:

[DISABLE]

power:
  readmem(powerbkp,8)

unregistersymbol(*)
dealloc(*)"""
