[[cheat]]
id = "pe-never-change"
name = "PE Never Change"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(PE_AOB,GameAssembly.dll,E8 * * * * 44 2B F6 0F) // should be unique

alloc(PE_CodeSave,5)
PE_CodeSave:
  readmem(PE_AOB,5)
registersymbol(PE_CodeSave)

PE_AOB:
  nop 5

registersymbol(PE_AOB)

[DISABLE]

PE_AOB:
  readmem(PE_CodeSave,5)

unregistersymbol(PE_AOB)
unregistersymbol(PE_CodeSave)
dealloc(PE_CodeSave)"""

[[cheat]]
id = "unlimited-item"
name = "Unlimited Item"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Item_Set_AOB,GameAssembly.dll,89 91 F4 00 00 00 48) // should be unique
alloc(newmem,$1000,Item_Set_AOB)

label(code)
label(return)

newmem:
  mov edx,#500
code:
  mov [rcx+000000F4],edx
  jmp return

Item_Set_AOB:
  jmp newmem
  nop
return:
registersymbol(Item_Set_AOB)

[DISABLE]

Item_Set_AOB:
  db 89 91 F4 00 00 00

unregistersymbol(Item_Set_AOB)
dealloc(newmem)"""
