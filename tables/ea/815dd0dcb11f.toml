[[cheat]]
id = "player-manager-ctrl-numpad-1"
name = "Player Manager (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Coven - EA.exe
// Author            : ndck76
// Executable Version: 2022.3.25.2784
// Game Version      : Build.14b (Early Access)
// Script Date       : 2024-10-28


[ENABLE]

aobscanregion(ispaused,Slowmo:Update,Slowmo:Update+1000,0FB680xxxx000085xx0Fxxxxxxxxxx48xxxxxx0Fxxxxxxxxxxxx85xx0Fxxxxxxxxxx48xxxxxxxxxxxx49BBxxxxxxxxxxxx000041xxxxF3xxxxxxF2xxxxxxF3xxxxxxxx48xxxxxxxx90) //Slowmo:Update+75
alloc(newmem,$1000,ispaused)
alloc(data,8)
alloc(ispausedbkp,7)
registersymbol(data)
registersymbol(ispaused)
registersymbol(ispausedbkp)
label(code)
label(return)

ispausedbkp:
  readmem(ispaused,7)

newmem:
  mov [data],rax

code:
  readmem(ispaused,7)
  jmp return

ispaused:
  jmp newmem
  nop 2
return:

[DISABLE]

ispaused:
  readmem(ispausedbkp,7)

unregistersymbol(*)
dealloc(*)"""

