[[cheat]]
id = "no-reload"
name = "No Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(noreloadcd,Synthetik.exe,FF 50 08 89 46 28 68 00 00 D0 3F 6A 00 FF B6)
alloc(newmem,$1000)

label(code)
label(return)
label(Ammo)

newmem:
code:
  call dword ptr [eax+08]
  fld qword ptr [Ammo]
  fstp qword ptr [eax]
  mov [esi+28],eax
  jmp return

Ammo:
dq (double)20

noreloadcd:
  jmp newmem
  nop
return:
registersymbol(noreloadcd)

[DISABLE]

noreloadcd:
  db FF 50 08 89 46 28

unregistersymbol(noreloadcd)
dealloc(newmem)"""
