[[cheat]]
id = "mana-health-attack"
name = ">>>>>Mana/Health/Attack %<<<<<"
category = "player"
description = ""
hint = ""
type = "script"
source = """
define(HlthMna,"DesktopDungeons.exe")

[ENABLE]
alloc(Usememory,2048,HlthMna)
label(mana)
label(health)
label(sethlt)
label(setmana)
label(returnhere)
label(returnhere1)
label(originalcode)
label(originalcode1)
registersymbol(Usememory)
label(aob_1)
label(aob_2)
label(eHlt)
label(aHlt)
label(eMna)
label(aMna)
registersymbol(aob_1)
registersymbol(aob_2)
registersymbol(eHlt)
registersymbol(aHlt)
registersymbol(eMna)
registersymbol(aMna)
aobscan(aob1,89 48 60 C9 C3 00 55 8B EC 83 EC 08)
aobscan(aob2,89 46 54 85 C0 7D 07 C7 46 54 00 00 00 00)

Usememory:

eHlt:
dd 1

aHlt:
dd 64

eMna:
dd 1

aMna:
dd 14

// Adjust Mana
mana:
cmp [eMna],0
je originalcode
cmp [eMna],2
je setmana
push edx
mov edx,[eax+64]
mov ecx,edx
pop edx
jmp originalcode

setmana:
mov ecx,[aMna]
jmp originalcode

originalcode:
mov [eax+60],ecx
leave 
ret 
jmp returnhere

// Adjust Health
health:
cmp [eHlt],0
je originalcode1
cmp [eHlt],2
je sethlt
push ebx
mov ebx,[esi+58] // Max
mov eax,ebx
pop ebx
jmp originalcode1

sethlt:
mov eax,[aHlt]
jmp originalcode1

originalcode1:
mov [esi+54],eax
test eax,eax
jmp returnhere1


aob1:
aob_1:
jmp mana
returnhere:

aob2:
aob_2:
jmp health
returnhere1:

 
[DISABLE]
aob_1:
db 89 48 60 C9 C3
aob_2:
db 89 46 54 85 C0
unregistersymbol(aob_1)
unregistersymbol(aob_2)
unregistersymbol(eHlt)
unregistersymbol(aHlt)
unregistersymbol(eMna)
unregistersymbol(aMna)
unregistersymbol(Usememory)
dealloc(Usememory)
//mov [eax+60],ecx
//leave
//ret
//Alt: db 89 48 60 C9 C3 - 00 55 8B EC 83 EC 08
//
//mov [esi+54],eax
//test eax,eax
//Alt: db 89 46 54 85 C0 - 7D 07 C7 46 54 00 00 00 00"""

