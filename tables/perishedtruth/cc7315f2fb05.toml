source = """
// Game Executable   : PerishedTruth.exe
// Author            : ndck76
// Executable Version: 2021.3.14.57736
// Game Version      : v40
// Script Date       : 2026-02-03


[ENABLE]

aobscanmodule(ohk,GameAssembly.dll,F3xxxxxxxxxxxxxxF3xxxxxxF3xxxxxxxxxxxxxx75xx488Bxxxxxxxxxx4885) //Zombie.TakeDamageAndStun
alloc(newmem,$1000,ohk)
alloc(ohkbkp,8)
registersymbol(ohk)
registersymbol(ohkbkp)
label(code)
label(return)

ohkbkp:
  readmem(ohk,8)

newmem:
  mov [rbx+000000F8],0

code:
  readmem(ohk,8)
  jmp return

ohk:
  jmp newmem
  nop 3
return:

[DISABLE]

ohk:
  readmem(ohkbkp,8)

unregistersymbol(*)
dealloc(*)"""
