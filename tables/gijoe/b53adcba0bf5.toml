[[cheat]]
id = "gethealth"
name = "getHealth"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : GIJOE.exe
  Version: 
  Date   : 2022-02-10
  Author : Rhark

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(healthAOB,GIJOE.exe,488B??FF??????????80????????488B??0F84) // should be unique
alloc(healthHook,0x1000)
registersymbol(healthHook)

label( jumptrampolineaddress )
label( jumpaddressback )
label(code_health)
registersymbol(code_health)

label(hpflag)
label(armorflag)
label(exit)

registersymbol(hpflag)
registersymbol(armorflag)

healthHook:
  push rax
  mov rax,PlayerCharacter
  mov rax,[rax]
  test rax,rax
  jz short exit
  mov rax,[rax+6A8] //HealthComponent
  test rax,rax
  jz short exit
  cmp rdx,rax
  jne exit

@@:
  cmp [hpflag],1
  jne @f
  movss xmm15,[rax+E0]
  movss [rax+E4],xmm15

@@:
  cmp [armorflag],1
  jne @f
  movss xmm14,[rax+10C]
  movss [rax+110],xmm14

exit:
  pop rax

code_health:
  readmem(healthAOB,9)
  {mov rax,[rdx]
  call qword ptr [rax+00000150]}
jmp [jumpaddressback]
jumpaddressback:
dq healthAOB+9

align 10 CC

hpflag:
 dd 0

align 10 CC

armorflag:
  dd 0

align 10 CC

Trampolines+10:
jmp [jumptrampolineaddress]
jumptrampolineaddress:
dq healthHook

align 10 CC

healthAOB:
  jmp Trampolines+10
  nop 4

registersymbol(healthAOB)

[DISABLE]

healthAOB:
  readmem(code_health,9) //db 48 8B 02 FF 90 50 01 00 00

unregistersymbol(healthAOB)
unregistersymbol(hpflag)
unregistersymbol(armorflag)
unregistersymbol(code_health)
unregistersymbol(healthHook)
dealloc(healthHook)

