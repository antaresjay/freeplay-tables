[[cheat]]
id = "ammo"
name = "Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(ammooo,MindsEye-Win64-Shipping.exe,48 8B 44 24 ?? 42 8B 14 F0 E8) // should be unique
alloc(newmem,$1000,ammooo)

label(code)
label(return)

label(enemyammcd)

label(me)
registersymbol(me)

label(enemy)
registersymbol(enemy)

newmem:
  push rdx

  mov rdx, playerPtr
  test rdx,rdx
  je code

  mov rdx, [rdx]
  test rdx,rdx
  je code

  cmp qword ptr [rcx+140], rdx
  jne enemyammcd

  cmp dword ptr [me], 1
  jne code

  mov rax,[rsp+28]
  mov dword ptr [rax+r14*8], #20
  jmp code

enemyammcd:
  cmp dword ptr [enemy], 1
  jne code
  mov rax,[rsp+28]
  mov dword ptr [rax+r14*8], #0

code:
  pop rdx
  mov rax,[rsp+20]
  jmp return

me:
dd 0

enemy:
dd 0

ammooo:
  jmp newmem
return:
registersymbol(ammooo)

[DISABLE]

ammooo:
  db 48 8B 44 24 20

unregistersymbol(ammooo)
unregistersymbol(me)
unregistersymbol(enemy)
dealloc(newmem)"""

