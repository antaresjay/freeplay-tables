[[cheat]]
id = "infinite-ammo-magazine"
name = "Infinite Ammo (Magazine)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(infammomag,89 48 18 49 63 47 44 FF C0 41 89 47 44 B8 01 00 00 00 E9 B4)
alloc(newmem,$1000,infammomag)

label(code)
label(return)

newmem:

code:
  mov [rax+18],#100
  movsxd  rax,dword ptr [r15+44]
  jmp return

infammomag:
  jmp newmem
  nop 2
return:
registersymbol(infammomag)

[DISABLE]

infammomag:
  db 89 48 18 49 63 47 44

unregistersymbol(infammomag)
dealloc(newmem)"""

