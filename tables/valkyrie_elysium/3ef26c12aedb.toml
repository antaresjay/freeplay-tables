type = "script"
source = """
[ENABLE]

aobscanmodule(walkspeed,VALKYRIE_ELYSIUM.exe,F3 0F 11 87 8C 01 00 00 44)
alloc(newmem,$1000,walkspeed)
registersymbol(walk)
label(code)
label(return)

newmem:

code:
  movss xmm0,[walk]
  movss [rdi+0000018C],xmm0
  jmp return

walk:
dd (float)150

walkspeed:
  jmp newmem
  nop 3
return:
registersymbol(walkspeed)

[DISABLE]

walkspeed:
  db F3 0F 11 87 8C 01 00 00

unregistersymbol(*)
dealloc(*)"""

