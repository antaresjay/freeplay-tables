[[cheat]]
id = "player-sanity-controller-ctrl-numpad-1"
name = "Player Sanity Controller (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(issanity,PlayerSanityController:Update,PlayerSanityController:Update+200,0FB6464x85xx0FxxxxxxxxxxF3xxxxxxxxF3xxxxxxF3xxxxxxxxF3xxxxxxF2xxxxxxF2xxxxxxxx49BBxxxxxxxxxxxx000041xxxxF3xxxxxxF2xxxxxxxx66xxxxxx0Fxxxxxxxxxx) //PlayerSanityController:Update+f
alloc(newmem,$1000,issanity)
alloc(data,8)
alloc(issanitybkp,6)
registersymbol(data)
registersymbol(issanity)
registersymbol(issanitybkp)
label(code)
label(return)

issanitybkp:
  readmem(issanity,6)

newmem:
  mov [data],rsi

code:
  readmem(issanity,6)
  test eax,eax
  jmp return

issanity:
  jmp newmem
  nop
return:

[DISABLE]

issanity:
  readmem(issanitybkp,6)

unregistersymbol(*)
dealloc(*)"""

