[[cheat]]
id = "debug-mode"
name = "Debug mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Secrets Of Grindea.exe
  Version: 
  Date   : 2024-03-28
  Author : Igromanru

  Debug mode
}

[ENABLE]
AOBScanRegion(setDebugFlag, "SoG.CAS.IsDebugFlagSet", "SoG.CAS.IsDebugFlagSet"+24, 80 B8 ? ? ? ? 00 75)
alloc(newmem,$100, setDebugFlag)

label(setDebugFlagBackUp)
label(setDebugFlagValue)
label(return)

newmem:
  push ebx
  mov ebx, [setDebugFlagValue]
  db 89 98 // mov [eax+23A], ebx
  readMem(setDebugFlag+2, 4) // [x+23A] part
  pop ebx
setDebugFlagBackUp:
  readMem(setDebugFlag, 7)
  jmp return
setDebugFlagValue:
  dd 1

setDebugFlag:
  jmp newmem
  nop 2
return:

registerSymbol(setDebugFlag)
registerSymbol(setDebugFlagBackUp)
registerSymbol(setDebugFlagValue)

[DISABLE]
setDebugFlag:
  readMem(setDebugFlagBackUp, 7)

dealloc(newmem)
unregisterSymbol(setDebugFlag)
unregisterSymbol(setDebugFlagBackUp)
unregisterSymbol(setDebugFlagValue)

