[[cheat]]
id = "character-stamina-ctrl-numpad-1"
name = "Character Stamina (Ctrl + Numpad 1)"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : puppy.exe
// Author            : ndck76
// Executable Version: 2022.3.60.25597
// Game Version      : v1.0.2517.124175
// Script Date       : 2025-11-11


[ENABLE]

aobscanmodule(stamina,GameAssembly.dll,F3xxxxxxxxxxF3xxxxxxxx83xxxxxxxxxxxx75xxE8xxxxxxxx0F57) //Puppy.CharStamina.SetStaminaValue
alloc(newmem,$1000,stamina)
alloc(data,8)
alloc(staminabkp,6)
registersymbol(data)
registersymbol(stamina)
registersymbol(staminabkp)
label(code)
label(return)

staminabkp:
  readmem(stamina,6)

newmem:
  mov [data],rbx

code:
  readmem(stamina,6)
  jmp return

stamina:
  jmp newmem
  nop
return:

[DISABLE]

stamina:
  readmem(staminabkp,6)

unregistersymbol(*)
dealloc(*)"""

