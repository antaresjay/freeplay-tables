[[cheat]]
id = "saves-count-save-or-load-once-to-get"
name = "Saves count (save or load once to get)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : TormentedSouls.exe
  Version: 
  Date   : 2021-09-20
  Author : Dante

save or load once to Get save count

}

[ENABLE]

aobscan(Get_Save_Count,48 63 49 44 FF C1 89 48 44 B8 01 00 00 00 E9 90) // should be unique
alloc(Get_Save_Count_Code,$100,Get_Save_Count)
registersymbol(Get_Save_Count)
label(return)
label(Not_Save_file)
label(Save_count)
registersymbol(Save_count)

Get_Save_Count_Code:

  cmp r13,1
  jne Not_Save_file
  mov [Save_count],rcx
  add [Save_count],44

Not_Save_file:
  movsxd  rcx,dword ptr [rcx+44]
  inc ecx
  jmp return

Save_count:


Get_Save_Count:
  jmp Get_Save_Count_Code
  nop
return:

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
Get_Save_Count:
  db 48 63 49 44 FF C1

unregistersymbol(Get_Save_Count)
unregistersymbol(Save_count)
dealloc(Get_Save_Count_Code)

