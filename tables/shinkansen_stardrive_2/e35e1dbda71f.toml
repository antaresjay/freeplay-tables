[[cheat]]
id = "shipmodule-all-base-address-scan-to-activate-select-shipyard-to-update-select-shipyard"
name = "ShipModule_All Base Address Scan (To Activate: Select Shipyard, To Update: Select Shipyard)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(ShipModule_All_savedAOB)
label(ShipModule_All_returnhere)
label(ShipModule_All_originalcode)
label(ShipModule_All_exit)

label(ShipModule_All_update_exit)
label(ShipModule_All_set_exit)

registersymbol(ShipModule_All_savedAOB)

//0454D87D - FF 90 F8000000        - call qword ptr [rax+000000F8]
//0454D883 - 48 83 C4 20           - add rsp,20
// ShipModule__TypeMetadata:WriteObjectData+437
//0454D887 - 49 63 95 CC000000     - movsxd  rdx,dword ptr [r13+000000CC]
//0454D88E - 48 8B CF              - mov rcx,rdi
//0454D891 - 48 83 EC 20           - sub rsp,20
//0454D895 - 48 8B 07              - mov rax,[rdi]
aobscan(ShipModule_All_searchedAOB, 49 63 95 CC 00 00 00 48 8B CF)

alloc(ShipModule_All_newmem, 2048, ShipModule_All_searchedAOB)


ShipModule_All_newmem:
cmp dword ptr [ShipModule_All_update_enable], #0
je ShipModule_All_update_exit
mov [ShipModule_All_basepointer], r13
ShipModule_All_update_exit:

cmp dword ptr [ShipModule_All_set_enable], #0
je ShipModule_All_set_exit
mov [r13+cc], #1
mov [r13+d0], #1
ShipModule_All_set_exit:


ShipModule_All_originalcode:
db 49 63 95 CC 00 00 00
//movsxd  rdx,dword ptr [r13+000000CC]


ShipModule_All_exit:
jmp ShipModule_All_returnhere


ShipModule_All_searchedAOB:
ShipModule_All_savedAOB:
jmp ShipModule_All_newmem
nop
nop
ShipModule_All_returnhere:


[DISABLE]
ShipModule_All_savedAOB:
db 49 63 95 CC 00 00 00
//movsxd  rdx,dword ptr [r13+000000CC]

unregistersymbol(ShipModule_All_savedAOB)

dealloc(ShipModule_All_newmem)"""

