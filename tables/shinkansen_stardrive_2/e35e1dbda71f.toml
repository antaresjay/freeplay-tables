[[cheat]]
id = "empiredata-base-address-scan-to-activate-view-empire-management-empire-to-update-view-empire-management-empire"
name = "EmpireData Base Address Scan (To Activate: View Empire Management Empire, To Update: View Empire Management Empire)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(EmpireData_savedAOB)
label(EmpireData_returnhere)
label(EmpireData_originalcode)
