[[cheat]]
id = "raceselectionmenu-base-address-scan-initialization-activate-this-first"
name = "RaceSelectionMenu Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(RaceSelectionMenu_basepointer)
registersymbol(RaceSelectionMenu_update_enable)
registersymbol(RaceSelectionMenu_set_enable)

alloc(RaceSelectionMenu_basepointer, 8)
alloc(RaceSelectionMenu_update_enable, 4)
alloc(RaceSelectionMenu_set_enable, 4)


[DISABLE]
unregistersymbol(RaceSelectionMenu_basepointer)
unregistersymbol(RaceSelectionMenu_update_enable)
unregistersymbol(RaceSelectionMenu_set_enable)

dealloc(RaceSelectionMenu_basepointer)
dealloc(RaceSelectionMenu_update_enable)
dealloc(RaceSelectionMenu_set_enable)"""

[[cheat]]
id = "raceselectionmenu-base-address-scan-to-activate-customize-race-to-update-customize-race"
name = "RaceSelectionMenu Base Address Scan (To Activate: Customize Race, To Update: Customize Race)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(RaceSelectionMenu_savedAOB)
label(RaceSelectionMenu_returnhere)
label(RaceSelectionMenu_originalcode)
label(RaceSelectionMenu_exit)

label(RaceSelectionMenu_update_exit)
label(RaceSelectionMenu_set_exit)

registersymbol(RaceSelectionMenu_savedAOB)

//0D3B4E45 - 41 FF D3              - call r11d
//0D3B4E48 - 48 83 C4 20           - add rsp,20
// RaceSelectionMenu:DrawTrait+158c
//0D3B4E4C - 49 63 8F D8010000     - movsxd  rcx,dword ptr [r15+000001D8]
//0D3B4E53 - 3B C1                 - cmp eax,ecx
//0D3B4E55 - 0F8E 31000000         - jng 0D3B4E8C
//0D3B4E5B - 49 8B 47 30           - mov rax,[r15+30]
//0D3B4E5F - 48 8B C8              - mov rcx,rax
aobscan(RaceSelectionMenu_searchedAOB, 49 63 8F D8 01 00 00 3B C1 0F 8E 31 00 00 00)

alloc(RaceSelectionMenu_newmem, 2048, RaceSelectionMenu_searchedAOB)


RaceSelectionMenu_newmem:
cmp dword ptr [RaceSelectionMenu_update_enable], #0
je RaceSelectionMenu_update_exit
mov [RaceSelectionMenu_basepointer], r15
RaceSelectionMenu_update_exit:

cmp dword ptr [RaceSelectionMenu_set_enable], #0
je RaceSelectionMenu_set_exit
mov [r15+1d8], #9999999
mov [r15+1dc], #0
RaceSelectionMenu_set_exit:


RaceSelectionMenu_originalcode:
db 49 63 8F D8 01 00 00
//movsxd  rcx,dword ptr [r15+000001D8]


RaceSelectionMenu_exit:
jmp RaceSelectionMenu_returnhere


RaceSelectionMenu_searchedAOB:
RaceSelectionMenu_savedAOB:
jmp RaceSelectionMenu_newmem
nop
nop
RaceSelectionMenu_returnhere:


[DISABLE]
RaceSelectionMenu_savedAOB:
db 49 63 8F D8 01 00 00
//movsxd  rcx,dword ptr [r15+000001D8]

unregistersymbol(RaceSelectionMenu_savedAOB)

dealloc(RaceSelectionMenu_newmem)"""

