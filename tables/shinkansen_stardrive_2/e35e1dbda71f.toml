[[cheat]]
id = "planet-base-address-scan-to-activate-mouseover-planet-to-update-mouseover-planet"
name = "Planet Base Address Scan (To Activate: Mouseover Planet, To Update: Mouseover Planet)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Planet_savedAOB)
label(Planet_returnhere)
label(Planet_originalcode)
label(Planet_exit)

label(Planet_update_exit)
label(Planet_set_exit)

registersymbol(Planet_savedAOB)

//27037175 - 48 83 EC 08           - sub rsp,08
//27037179 - 48 8B F1              - mov rsi,rcx
// Planet:OnMouseOver+c
//2703717C - F3 0F10 86 34030000   - movss xmm0,[rsi+00000334]
//27037184 - F3 0F5A C0            - cvtss2sd xmm0,xmm0
//27037188 - F2 0F11 45 F0         - movsd [rbp-10],xmm0
//2703718D - 48 83 EC 20           - sub rsp,20
aobscan(Planet_searchedAOB, F3 0F 10 86 34 03 00 00 F3 0F 5A C0)

alloc(Planet_newmem, 2048, Planet_searchedAOB)


Planet_newmem:
cmp dword ptr [Planet_update_enable], #0
je Planet_update_exit
mov [Planet_basepointer], rsi
Planet_update_exit:

cmp dword ptr [Planet_set_enable], #0
je Planet_set_exit
Planet_set_exit:


Planet_originalcode:
db F3 0F 10 86 34 03 00 00
//movss xmm0,[rsi+00000334]


Planet_exit:
jmp Planet_returnhere


Planet_searchedAOB:
Planet_savedAOB:
jmp Planet_newmem
nop
nop
nop
Planet_returnhere:


[DISABLE]
Planet_savedAOB:
db F3 0F 10 86 34 03 00 00
//movss xmm0,[rsi+00000334]

unregistersymbol(Planet_savedAOB)

dealloc(Planet_newmem)"""

