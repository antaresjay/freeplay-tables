dealloc(CampaignDefinition_basepointer)
dealloc(CampaignDefinition_update_enable)
dealloc(CampaignDefinition_set_enable)"""

[[cheat]]
id = "campaigndefinition-base-address-scan-to-activate-view-deploy-to-update-view-deploy"
name = "CampaignDefinition Base Address Scan (To Activate: View Deploy, To Update: View Deploy)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(CampaignDefinition_savedAOB)
label(CampaignDefinition_returnhere)
label(CampaignDefinition_originalcode)
label(CampaignDefinition_exit)

label(CampaignDefinition_update_exit)
label(CampaignDefinition_set_exit)

registersymbol(CampaignDefinition_savedAOB)

//0449ABB8 - 48 89 4D F8           - mov [rbp-08],rcx
//0449ABBC - 48 8B C1              - mov rax,rcx
// System:Int32:ToString+f
//0449ABBF - 48 63 08              - movsxd  rcx,dword ptr [rax]
//0449ABC2 - 33 D2                 - xor edx,edx
//0449ABC4 - 48 83 EC 20           - sub rsp,20
//0449ABC8 - 49 BB 30AC490400000000 - mov r11,000000000449AC30 : [EC8B4855]
//0449ABD2 - 41 FF D3              - call r11d
aobscan(CampaignDefinition_searchedAOB, 48 63 08 33 D2 48 83 EC 20)

alloc(CampaignDefinition_newmem, 2048, CampaignDefinition_searchedAOB)


CampaignDefinition_newmem:
cmp dword ptr [CampaignDefinition_update_enable], #0
je CampaignDefinition_update_exit
mov rcx, rax
sub rcx, bc
mov [CampaignDefinition_basepointer], rcx
CampaignDefinition_update_exit:

cmp dword ptr [CampaignDefinition_set_enable], #0
je CampaignDefinition_set_exit
mov [CampaignDefinition_set_enable], #0
mov [rax], #9999999
CampaignDefinition_set_exit:


CampaignDefinition_originalcode:
db 48 63 08 33 D2
//movsxd  rcx,dword ptr [rax]


CampaignDefinition_exit:
jmp CampaignDefinition_returnhere


CampaignDefinition_searchedAOB:
CampaignDefinition_savedAOB:
jmp CampaignDefinition_newmem
CampaignDefinition_returnhere:


[DISABLE]
CampaignDefinition_savedAOB:
db 48 63 08 33 D2
//movsxd  rcx,dword ptr [rax]

unregistersymbol(CampaignDefinition_savedAOB)

dealloc(CampaignDefinition_newmem)"""

