label(EmpireData_spyset_exit)
label(EmpireData_foodset_exit)
label(EmpireData_productionset_exit)
label(EmpireData_researchset_exit)

registersymbol(EmpireData_savedAOB)

//1A981208 - 48 8B 85 C0ECFFFF     - mov rax,[rbp-00001340]
//1A98120F - F2 44 0F5A F8         - cvtsd2ss xmm15,xmm0
// StrategicGUI:DoSummaryView+c94
//1A981214 - F3 44 0F11 B8 44020000  - movss [rax+00000244],xmm15
//1A98121D - F3 0F10 85 90EEFFFF   - movss xmm0,[rbp-00001170]
//1A981225 - F3 0F5A C0            - cvtss2sd xmm0,xmm0
//1A981229 - F2 44 0F5A F8         - cvtsd2ss xmm15,xmm0
aobscan(EmpireData_searchedAOB, F3 44 0F 11 B8 44 02 00 00 F3 0F 10 85 90 EE FF)

alloc(EmpireData_newmem, 2048, EmpireData_searchedAOB)


EmpireData_newmem:
cmp dword ptr [EmpireData_update_enable], #0
je EmpireData_update_exit
mov [EmpireData_basepointer], rax
EmpireData_update_exit:

cmp dword ptr [EmpireData_set_enable], #0
je EmpireData_set_exit
EmpireData_set_exit:

cmp dword ptr [EmpireData_shipset_enable], #0
je EmpireData_shipset_exit
mov [rax+200], #9999
mov [rax+204], #200
mov [rax+20c], #9999
EmpireData_shipset_exit:

cmp dword ptr [EmpireData_spyset_enable], #0
je EmpireData_spyset_exit
mov [rax+258], (float)9999
mov [rax+25c], (float)9999
EmpireData_spyset_exit:

cmp dword ptr [EmpireData_foodset_enable], #0
je EmpireData_foodset_exit
mov [rax+270], (float)9999
EmpireData_foodset_exit:

cmp dword ptr [EmpireData_productionset_enable], #0
je EmpireData_productionset_exit
mov [rax+274], (float)9999
EmpireData_productionset_exit:

cmp dword ptr [EmpireData_researchset_enable], #0
je EmpireData_researchset_exit
mov [rax+278], (float)9999
EmpireData_researchset_exit:


EmpireData_originalcode:
db F3 44 0F 11 B8 44 02 00 00
//movss [rax+00000244],xmm15


EmpireData_exit:
jmp EmpireData_returnhere


EmpireData_searchedAOB:
EmpireData_savedAOB:
jmp EmpireData_newmem
nop
nop
nop
nop
EmpireData_returnhere:


[DISABLE]
EmpireData_savedAOB:
db F3 44 0F 11 B8 44 02 00 00
//movss [rax+00000244],xmm15

unregistersymbol(EmpireData_savedAOB)

dealloc(EmpireData_newmem)"""

