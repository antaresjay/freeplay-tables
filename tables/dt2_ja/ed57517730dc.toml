type = "script"
source = """
{ Game   : DT2_ja.log
  Version:
  Date   : 2023-06-09
  Author : cybertron

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(charPtrAOB,DT2_ja.log,46 04 8B 42 04 89 41 04) // should be unique
aobscanmodule(charAddSkillPtrAOB,DT2_ja.log,8B 81 1C 01 00 00) // should be unique code2 & return2
alloc(newmem,$1000)

label(code2)
label(return2)

label(char)
label(code)
label(return)

newmem:
char:
  dd 0

code2:
  mov [char],ecx
  mov eax,[ecx+0000011C]
  jmp return2

code:
  mov [char],edx
  mov eax,[edx+04]
  mov [ecx+04],eax
  jmp return

charPtrAOB+02:
  jmp code
  nop
return:

charAddSkillPtrAOB:
  jmp code2
  nop
return2:

registersymbol(charPtrAOB)
registersymbol(char)
registersymbol(charAddSkillPtrAOB)

[DISABLE]

charPtrAOB+02:
  db 8B 42 04 89 41 04

charAddSkillPtrAOB:
  db 8B 81 1C 01 00 00

unregistersymbol(char)
unregistersymbol(charPtrAOB)
unregistersymbol(charAddSkillPtrAOB)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: DT2_ja.log+C5F79

DT2_ja.log+C5F5C: 0F 57 C0        - xorps xmm0,xmm0
DT2_ja.log+C5F5F: 6A 00           - push 00
DT2_ja.log+C5F61: 57              - push edi
DT2_ja.log+C5F62: 0F 11 40 0C     - movups [eax+0C],xmm0
DT2_ja.log+C5F66: E8 95 8D 0A 00  - call DT2_ja.log+16ED00
DT2_ja.log+C5F6B: 8B 55 08        - mov edx,[ebp+08]
DT2_ja.log+C5F6E: 83 C4 0C        - add esp,0C
DT2_ja.log+C5F71: 8B 06           - mov eax,[esi]
DT2_ja.log+C5F73: 8B 4D F0        - mov ecx,[ebp-10]
DT2_ja.log+C5F76: 89 46 04        - mov [esi+04],eax
// ---------- INJECTING HERE ----------
DT2_ja.log+C5F79: 8B 42 04        - mov eax,[edx+04]
// ---------- DONE INJECTING  ----------
DT2_ja.log+C5F7C: 89 41 04        - mov [ecx+04],eax
DT2_ja.log+C5F7F: 8B 42 08        - mov eax,[edx+08]
DT2_ja.log+C5F82: 89 41 08        - mov [ecx+08],eax
DT2_ja.log+C5F85: 8B 42 0C        - mov eax,[edx+0C]
DT2_ja.log+C5F88: 89 41 0C        - mov [ecx+0C],eax
DT2_ja.log+C5F8B: 8B 42 10        - mov eax,[edx+10]
DT2_ja.log+C5F8E: 89 41 10        - mov [ecx+10],eax
DT2_ja.log+C5F91: 8B 42 14        - mov eax,[edx+14]
DT2_ja.log+C5F94: 89 41 14        - mov [ecx+14],eax
DT2_ja.log+C5F97: 8B 42 18        - mov eax,[edx+18]
}"""

