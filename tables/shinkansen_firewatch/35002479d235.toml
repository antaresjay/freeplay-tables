[[cheat]]
id = "vgplayercontroller-base-address-scan-initialization-activate-this-first"
name = "vgPlayerController Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(vgPlayerController_basepointer)
registersymbol(vgPlayerController_update_enable)
registersymbol(vgPlayerController_set_enable)
registersymbol(vgPlayerController_walkspeedset_enable)
registersymbol(vgPlayerController_walkspeedset_value)
registersymbol(vgPlayerController_jogspeedset_enable)
registersymbol(vgPlayerController_jogspeedset_value)
registersymbol(vgPlayerController_cameraset_enable)

alloc(vgPlayerController_basepointer, 8)
alloc(vgPlayerController_update_enable, 4)
alloc(vgPlayerController_set_enable, 4)
alloc(vgPlayerController_walkspeedset_enable, 4)
alloc(vgPlayerController_walkspeedset_value, 4)
alloc(vgPlayerController_jogspeedset_enable, 4)
alloc(vgPlayerController_jogspeedset_value, 4)
alloc(vgPlayerController_cameraset_enable, 4)

vgPlayerController_walkspeedset_value:
dd (float)10

vgPlayerController_jogspeedset_value:
dd (float)10


[DISABLE]
unregistersymbol(vgPlayerController_basepointer)
unregistersymbol(vgPlayerController_update_enable)
unregistersymbol(vgPlayerController_set_enable)
unregistersymbol(vgPlayerController_walkspeedset_enable)
unregistersymbol(vgPlayerController_walkspeedset_value)
unregistersymbol(vgPlayerController_jogspeedset_enable)
unregistersymbol(vgPlayerController_jogspeedset_value)
unregistersymbol(vgPlayerController_cameraset_enable)

dealloc(vgPlayerController_basepointer)
dealloc(vgPlayerController_update_enable)
dealloc(vgPlayerController_set_enable)
dealloc(vgPlayerController_walkspeedset_enable)
dealloc(vgPlayerController_walkspeedset_value)
dealloc(vgPlayerController_jogspeedset_enable)
dealloc(vgPlayerController_jogspeedset_value)
dealloc(vgPlayerController_cameraset_enable)"""

[[cheat]]
id = "vgplayercontroller-base-address-scan-to-activate-play-level-to-update-play-level"
name = "vgPlayerController Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(vgPlayerController_savedAOB)
label(vgPlayerController_returnhere)
label(vgPlayerController_originalcode)
label(vgPlayerController_exit)

label(vgPlayerController_update_exit)
label(vgPlayerController_set_exit)
label(vgPlayerController_walkspeedset_exit)
label(vgPlayerController_jogspeedset_exit)
label(vgPlayerController_cameraset_exit)

registersymbol(vgPlayerController_savedAOB)

//15FB8B65 - 48 83 EC 18           - sub rsp,18
//15FB8B69 - 48 8B F1              - mov rsi,rcx
// vgPlayerController:Update+c
//15FB8B6C - 0FB6 86 89010000      - movzx eax,byte ptr [rsi+00000189]
//15FB8B73 - 85 C0                 - test eax,eax
//15FB8B75 - 74 31                 - je 15FB8BA8
//15FB8B77 - 48 8B 04 25 280F3105  - mov rax,[05310F28] : [0D6CD780]
//15FB8B7F - 48 8B 96 90000000     - mov rdx,[rsi+00000090]
aobscan(vgPlayerController_searchedAOB, 0F B6 86 89 01 00 00 85 C0 74 31)

alloc(vgPlayerController_newmem, 2048, vgPlayerController_searchedAOB)
alloc(vgPlayerController_temp1, 8, vgPlayerController_searchedAOB)
alloc(vgPlayerController_default_walkSpeed, 4, vgPlayerController_searchedAOB)
alloc(vgPlayerController_default_walkBackwardSpeed, 4, vgPlayerController_searchedAOB)
alloc(vgPlayerController_default_strafeSpeed, 4, vgPlayerController_searchedAOB)
alloc(vgPlayerController_default_jogSpeed, 4, vgPlayerController_searchedAOB)
alloc(vgPlayerController_default_jogBackwardSpeed, 4, vgPlayerController_searchedAOB)
alloc(vgPlayerController_default_jogStrafeSpeed, 4, vgPlayerController_searchedAOB)

vgPlayerController_default_walkSpeed:
dd (float)3

vgPlayerController_default_walkBackwardSpeed:
dd (float)2

vgPlayerController_default_strafeSpeed:
dd (float)3

vgPlayerController_default_jogSpeed:
dd (float)6

vgPlayerController_default_jogBackwardSpeed:
dd (float)4

vgPlayerController_default_jogStrafeSpeed:
dd (float)6

vgPlayerController_newmem:
mov [vgPlayerController_temp1], rbx

cmp dword ptr [vgPlayerController_update_enable], #0
je vgPlayerController_update_exit
mov [vgPlayerController_basepointer], rsi
vgPlayerController_update_exit:

cmp dword ptr [vgPlayerController_set_enable], #0
je vgPlayerController_set_exit
vgPlayerController_set_exit:

cmp dword ptr [vgPlayerController_walkspeedset_enable], #0
je vgPlayerController_walkspeedset_exit
cmp dword ptr [rsi+88], #0
je vgPlayerController_walkspeedset_exit
mov rbx, [rsi+88]
fld [vgPlayerController_default_walkSpeed]
fmul [vgPlayerController_walkspeedset_value]
fstp [rbx+138]
fld [vgPlayerController_default_walkBackwardSpeed]
fmul [vgPlayerController_walkspeedset_value]
fstp [rbx+13c]
fld [vgPlayerController_default_strafeSpeed]
fmul [vgPlayerController_walkspeedset_value]
fstp [rbx+140]
vgPlayerController_walkspeedset_exit:

cmp dword ptr [vgPlayerController_jogspeedset_enable], #0
je vgPlayerController_jogspeedset_exit
cmp dword ptr [rsi+88], #0
je vgPlayerController_jogspeedset_exit
mov rbx, [rsi+88]
fld [vgPlayerController_default_jogSpeed]
fmul [vgPlayerController_jogspeedset_value]
fstp [rbx+144]
fld [vgPlayerController_default_jogBackwardSpeed]
fmul [vgPlayerController_jogspeedset_value]
fstp [rbx+148]
fld [vgPlayerController_default_jogStrafeSpeed]
fmul [vgPlayerController_jogspeedset_value]
fstp [rbx+14c]
vgPlayerController_jogspeedset_exit:

cmp dword ptr [vgPlayerController_cameraset_enable], #0
je vgPlayerController_cameraset_exit
mov [rsi+19c], #999
vgPlayerController_cameraset_exit:

mov rbx, [vgPlayerController_temp1]


vgPlayerController_originalcode:
db 0F B6 86 89 01 00 00
//movzx eax,byte ptr [rsi+00000189]


vgPlayerController_exit:
jmp vgPlayerController_returnhere


vgPlayerController_searchedAOB:
vgPlayerController_savedAOB:
jmp vgPlayerController_newmem
nop
nop
vgPlayerController_returnhere:


[DISABLE]
vgPlayerController_savedAOB:
db 0F B6 86 89 01 00 00
//movzx eax,byte ptr [rsi+00000189]

unregistersymbol(vgPlayerController_savedAOB)

dealloc(vgPlayerController_newmem)
dealloc(vgPlayerController_temp1)"""

