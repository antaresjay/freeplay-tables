[[cheat]]
id = "god-mode-always-have-200-health"
name = "God Mode (Always have 200 health)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,Doom95.exe,8B 40 20 A3 84 68 46 00) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov [eax+20],C8
  mov eax,[eax+20]
  mov [Doom95.exe+66884],eax
  jmp return

INJECT:
  jmp code
  nop
  nop
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 8B 40 20 A3 84 68 46 00

unregistersymbol(INJECT)
dealloc(newmem)"""

