[[cheat]]
id = "unlimited-health"
name = "Unlimited Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(healthMem,12)
alloc(playerMem,10)

aobscanmodule(AOBHealth,O2-Win64-Shipping.exe,F3 0F 5C C6 F3 0F 5F 87 B4 00 00 00) // should be unique
alloc(newmem,$1000,AOBHealth)

aobscanmodule(AOBPlayerPointer,O2-Win64-Shipping.exe,F3 0F 58 81 04 01 00 00 C3 CC) // should be unique
alloc(newmemPP,$1000,AOBPlayerPointer)

label(return code oneShot normalCode)
label(playerBasePointer codePP returnPP)

healthMem:
readmem(AOBHealth,12)

playerMem:
readmem(AOBPlayerPointer,10)

newmem:
  cmp byte ptr [rdi+180],0 // This is the Player.
  jne oneShot
  movss xmm0,[rdi+B0] // Move in Max Health
  jmp code

oneShot:
  cmp [enableOneShotKill],1
  jne normalCode
  xorps xmm0,xmm0
  jmp code

normalCode:
  subss xmm0,xmm6

code:
  maxss xmm0,[rdi+000000B4]
  jmp return

newmemPP:
  cmp byte ptr [rcx+130],0 // This is the Player.
  jne codePP
  mov [playerBasePointer],rcx

codePP:
  addss xmm0,[rcx+104]
  jmp returnPP

playerBasePointer:
  dq 0

enableOneShotKill:
  dd 1 // Enabled. Change to 0 then save if you wish this to be diabled by default.

AOBPlayerPointer:
  jmp newmemPP
  nop 3
returnPP:
registersymbol(AOBPlayerPointer playerBasePointer playerMem)

AOBHealth:
  jmp newmem
  nop 7
return:
registersymbol(AOBHealth healthMem enableOneShotKill)

