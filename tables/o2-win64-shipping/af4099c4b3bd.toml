[[cheat]]
id = "god-mode"
name = "God Mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{send@fearlessrevolution.com}
[ENABLE]

aobscanmodule(godmodeaobsteam,O2-Win64-Shipping.exe,F3 0F 11 87 04 01 00 00 48 8B 07)
alloc(newmem,$1000,godmodeaobsteam)
label(newhp)
label(code)
label(return)

newmem:
cmp byte ptr [rdi+140],2
jne code
movss xmm0,[newhp]
movss [rdi+104],xmm0
jmp return

code:
  movss [rdi+00000104],xmm0
  jmp return

newhp:
dd (float)500.0

godmodeaobsteam:
  jmp newmem
  nop 3
return:
registersymbol(godmodeaobsteam)

[DISABLE]

godmodeaobsteam:
  db F3 0F 11 87 04 01 00 00

unregistersymbol(*)
dealloc(*)"""

