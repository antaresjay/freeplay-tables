label(return)
label(1hit)

newmem:
pushfd
cmp ecx,1
je 1hit
popfd

code:
  movss [esi+00000860],xmm0
  jmp return

1hit:
popfd
movss [esi+00000860],xmm0
mov [esi+00000860],(float)0
jmp return

onehitkill+0F:
  jmp newmem
  nop 3
return:
