type = "script"
source = """
{ Game   : Titan Quest Anniversary Edition
  Version: 
  Date   : 2023-09-23
  Author : Apocalypticx

  This script does one hit kill
}

[ENABLE]

aobscanmodule(onehitkill,Game.dll,C8 72 28 F3 0F 10 86 60 08 00 00 F3 0F 5C C1 F3 0F 11 86 60 08 00 00) // should be unique
