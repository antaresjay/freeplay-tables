// ---------- INJECTING HERE ----------
global_dlc1:FixedUpdate+13: 48 63 8E A4 00 00 00           - movsxd  rcx,dword ptr [rsi+000000A4]
// ---------- DONE INJECTING  ----------
global_dlc1:FixedUpdate+1a: 48 63 C9                       - movsxd  rcx,ecx
global_dlc1:FixedUpdate+1d: 39 48 18                       - cmp [rax+18],ecx
global_dlc1:FixedUpdate+20: 0F 86 0C 02 00 00              - jbe global_dlc1:FixedUpdate+232
global_dlc1:FixedUpdate+26: 48 8D 44 C8 20                 - lea rax,[rax+rcx*8+20]
global_dlc1:FixedUpdate+2b: 48 8B 00                       - mov rax,[rax]
global_dlc1:FixedUpdate+2e: 48 8B C8                       - mov rcx,rax
global_dlc1:FixedUpdate+31: 83 38 00                       - cmp dword ptr [rax],00
