1D61B02DBAA: 00 00                          - add [rax],al
1D61B02DBAC: 00 00                          - add [rax],al
1D61B02DBAE: 00 00                          - add [rax],al
global_dlc1:FixedUpdate: 55                             - push rbp
global_dlc1:FixedUpdate+1: 48 8B EC                       - mov rbp,rsp
