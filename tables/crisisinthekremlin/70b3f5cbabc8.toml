[[cheat]]
id = "dlc-changed-values-will-update-after-next-turn"
name = "DLC (Changed Values will update after next turn)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

define(global_dlc_One,global_dlc1:FixedUpdate) // should be unique
alloc(newmem,$100,global_dlc_One)
alloc(dlc_one,8)

label(code)
label(return)
label(dlc_oneread)
registersymbol(dlc_one)
registersymbol(dlc_oneread)

newmem:

code:
  mov [dlc_one], rcx
  readmem(global_dlc_One,8)
  jmp return

dlc_oneread:
readmem(global_dlc_One,8)

global_dlc_One:
  jmp newmem
  nop 3
return:
registersymbol(global_dlc_One)

[DISABLE]

global_dlc_One:
  readmem(dlc_oneread,8)

unregistersymbol(*)
dealloc(*)



