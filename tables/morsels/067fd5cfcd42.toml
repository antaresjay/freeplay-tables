type = "script"
source = """
// Game Executable   : Morsels.exe
// Author            : ndck76
// Executable Version: 2022.3.67.60858
// Game Version      : v0.30.748
// Script Date       : 2025-11-21


[ENABLE]

aobscanregion(stamina,Softbodies.Logic.Stamina:get_Percent,Softbodies.Logic.Stamina:get_Percent+100,F30F10xxxxF3xxxxxxF2xxxxxxxx48xxxxxx48xxxx83xxxx48xxxxxxxxxxxx49BBxxxxxxxxxxxx000041xxxxF3xxxxxxF2xxxxxxxxF2xxxxxxF2xxxxxx) //Softbodies.Logic.Stamina:get_Percent+f
alloc(newmem,$1000,stamina)
alloc(data2,8)
alloc(staminabkp,5)
registersymbol(data2)
registersymbol(stamina)
registersymbol(staminabkp)
label(code)
label(return)

staminabkp:
  readmem(stamina,5)

newmem:
  mov [data2],rsi

code:
  readmem(stamina,5)
  jmp return

stamina:
  jmp newmem
return:

[DISABLE]

stamina:
  readmem(staminabkp,5)

unregistersymbol(*)
dealloc(*)"""

