[[cheat]]
id = "enable-activate-in-menu"
name = "Enable (Activate in menu)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : RelicHuntersZero.exe
  Version: update 15
  Date   : 2017-06-21
  Author : wcz

  Scipt made by Bl00dWolf and modify , update by wcz.
}

[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

label(check)
label(health)
label(health2)
//label(stars)

alloc(mine,16)
alloc(count,16)
alloc(_do_inf_hp,8)
alloc(_do_inf_ammo,8)
alloc(temp,8)
//globalalloc(pstar,4)
registersymbol(mine)
registersymbol(count)
registersymbol(_do_inf_hp)
registersymbol(_do_inf_ammo)

newmem: //this is allocated memory, you have read,write,execute access
cmp [esp+c],000186cf
je check
cmp [esp+c],0001872E
je health
//cmp [esp+c],00018600
//je stars
jmp originalcode

check: // inf ammo too
cmp [_do_inf_ammo],01
jne originalcode
fstp st(0)
mov [temp],63
fild [temp]
fstp qword ptr [edi]
jmp exit

///////////////////////////////////////////////////////////////////////////////
health:
cmp [_do_inf_hp],01
jne originalcode
cmp [count],01
je health2

fstp st(0)
fldl2t
fmul st(0)
fmul st(0)

fstp qword ptr [edi]
mov [count],01
jmp exit
///////////////////////////////////////////////////////////////////////////////

originalcode:
fstp qword ptr [edi]


exit:
pop edi
pop esi
pop ebp
jmp returnhere

///////////////////////////////////////////////////////////////////////////////
health2:
cmp [edi+04],405E71A6
jne originalcode

fstp st(0)
fldl2t
fmul st(0)
fmul st(0)

fstp qword ptr [edi]
jmp exit
///////////////////////////////////////////////////////////////////////////////
//stars:
//cmp [esp],7
//jne originalcode
//cmp edx,7
//jne originalcode
//mov [pstar],edi
//jmp originalcode

///////////////////////////////////////////////////////////////////////////////
_do_inf_hp:
db 0

_do_inf_ammo:
db 0

///////////////////////////////////////////////////////////////////////////////
"RelicHuntersZero.exe"+1292c6:
jmp newmem
returnhere:




[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
dealloc(mine)
dealloc(count)
dealloc(_do_inf_hp)
dealloc(_do_inf_ammo)
dealloc(temp)
unregistersymbol(mine)
unregistersymbol(count)
unregistersymbol(_do_inf_hp)
unregistersymbol(_do_inf_ammo)
"RelicHuntersZero.exe"+1292c6:
fstp qword ptr [edi]
pop edi
pop esi
pop ebp
//Alt: db DD 1F 5F 5E 5D"""

