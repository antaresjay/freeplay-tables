type = "script"
source = """
// Game Executable   : CMW_Win64.exe
// Author            : ndck76
// Executable Version: 2021.3.27.16379
// Game Version      : Build.12972441
// Script Date       : 2023-12-19


[ENABLE]

aobscanmodule(ammo2,GameAssembly.dll,8Bxxxxxxxxxx3Dxxxxxxxx74xx2B) //Robo_Arm.attackMain
alloc(newmem,$1000,ammo2)
alloc(ammo2bkp,6)
registersymbol(ammo2)
registersymbol(ammo2bkp)
label(code)
label(return)

ammo2bkp:
  readmem(ammo2,6)

newmem:
  mov [rbx+000003F8],(int)9999

code:
  readmem(ammo2,6)
  jmp return

ammo2:
  jmp newmem
  nop
return:

[DISABLE]

ammo2:
  readmem(ammo2bkp,6)

unregistersymbol(*)
dealloc(*)"""

