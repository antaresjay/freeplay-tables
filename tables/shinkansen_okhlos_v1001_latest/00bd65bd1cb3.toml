id = "unit-base-address-scan-to-activate-mouseover-unit-to-update-mouseover-unit"
name = "Unit Base Address Scan (To Activate: Mouseover Unit, To Update: Mouseover Unit)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Unit_savedAOB)
label(Unit_returnhere)
label(Unit_originalcode)
