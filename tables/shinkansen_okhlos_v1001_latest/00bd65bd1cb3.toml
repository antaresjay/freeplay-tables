label(Unit_update_exit)
label(Unit_set_exit)
label(Unit_healthset_exit)
label(Unit_statsset_exit)
label(Unit_experienceset_exit)
label(Unit_miscset_exit)
label(Unit_indestructibleset_exit)

registersymbol(Unit_savedAOB)

//1C80ABB6 - 14 8B                 - adc al,-75
//1C80ABB8 - 7D 08                 - jnl 1C80ABC2
// Unit:GetCurrentHealthRatio+a
//1C80ABBA - D9 87 6C020000        - fld dword ptr [edi+0000026C]
//1C80ABC0 - D9 5D F8              - fstp dword ptr [ebp-08]
//1C80ABC3 - D9 45 F8              - fld dword ptr [ebp-08]
//1C80ABC6 - D9EE                  - fldz
//1C80ABC8 - DFF1                  - fcomip st(0),st(1)
//1C80ABCA - DDD8                  - fstp st(0)
//1C80ABCC - 76 04                 - jna 1C80ABD2
aobscan(Unit_searchedAOB, D9 87 6C 02 00 00 D9 5D F8 D9 45 F8 D9 EE DF F1)

alloc(Unit_newmem, 2048, Unit_searchedAOB)


Unit_newmem:
cmp dword ptr [Unit_update_enable], #0
je Unit_update_exit
mov [Unit_basepointer], edi
Unit_update_exit:

cmp dword ptr [Unit_set_enable], #0
je Unit_set_exit
Unit_set_exit:

cmp dword ptr [Unit_healthset_enable], #0
je Unit_healthset_exit
fild [edi+1e4]
fstp [edi+26c]
Unit_healthset_exit:

cmp dword ptr [Unit_statsset_enable], #0
je Unit_statsset_exit
mov [edi+1ec], (float)999
mov [edi+1f8], (float)999
mov [edi+20c], (float)20
mov [edi+214], (float)999
mov [edi+21c], (float)999
mov [edi+224], #999
Unit_statsset_exit:

cmp dword ptr [Unit_experienceset_enable], #0
je Unit_experienceset_exit
fild [edi+200]
fstp [edi+204]
Unit_experienceset_exit:

cmp dword ptr [Unit_miscset_enable], #0
je Unit_miscset_exit
mov byte ptr [edi+22a], #1
mov byte ptr [edi+22d], #1
Unit_miscset_exit:

cmp dword ptr [Unit_indestructibleset_enable], #0
je Unit_indestructibleset_exit
mov byte ptr [edi+230], #1
Unit_indestructibleset_exit:


Unit_originalcode:
db D9 87 6C 02 00 00
//fld dword ptr [edi+0000026C]


Unit_exit:
jmp Unit_returnhere


Unit_searchedAOB:
Unit_savedAOB:
jmp Unit_newmem
nop
Unit_returnhere:


[DISABLE]
Unit_savedAOB:
db D9 87 6C 02 00 00
//fld dword ptr [edi+0000026C]

unregistersymbol(Unit_savedAOB)

dealloc(Unit_newmem)"""

