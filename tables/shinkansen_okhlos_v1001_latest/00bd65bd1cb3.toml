[[cheat]]
id = "mob-base-address-scan-initialization-activate-this-first"
name = "Mob Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Mob_basepointer)
registersymbol(Mob_update_enable)
registersymbol(Mob_set_enable)
registersymbol(Mob_limitset_enable)
registersymbol(Mob_modifiersset_enable)
registersymbol(Mob_powersset_enable)
registersymbol(Mob_invulnerableset_enable)

alloc(Mob_basepointer, 4)
alloc(Mob_update_enable, 4)
alloc(Mob_set_enable, 4)
alloc(Mob_limitset_enable, 4)
alloc(Mob_modifiersset_enable, 4)
alloc(Mob_powersset_enable, 4)
alloc(Mob_invulnerableset_enable, 4)


[DISABLE]
unregistersymbol(Mob_basepointer)
unregistersymbol(Mob_update_enable)
unregistersymbol(Mob_set_enable)
unregistersymbol(Mob_limitset_enable)
unregistersymbol(Mob_modifiersset_enable)
unregistersymbol(Mob_powersset_enable)
unregistersymbol(Mob_invulnerableset_enable)

dealloc(Mob_basepointer)
dealloc(Mob_update_enable)
dealloc(Mob_set_enable)
dealloc(Mob_limitset_enable)
dealloc(Mob_modifiersset_enable)
dealloc(Mob_powersset_enable)
dealloc(Mob_invulnerableset_enable)"""

[[cheat]]
id = "mob-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Mob Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Mob_savedAOB)
label(Mob_returnhere)
label(Mob_originalcode)
label(Mob_exit)

label(Mob_update_exit)
label(Mob_set_exit)
label(Mob_limitset_exit)
label(Mob_modifiersset_exit)
label(Mob_powersset_exit)
label(Mob_invulnerableset_exit)

registersymbol(Mob_savedAOB)

//1C829870 - C7 45 D0 00000000     - mov [ebp-30],00000000
//1C829877 - C7 45 D4 00000000     - mov [ebp-2C],00000000
// Mob:Update+26
//1C82987E - D9 87 14010000        - fld dword ptr [edi+00000114]
//1C829884 - DD 5D B8              - fstp qword ptr [ebp-48]
//1C829887 - E8 BCF4F4FF           - call 1C778D48
//1C82988C - DD 45 B8              - fld qword ptr [ebp-48]
//1C82988F - D9C9                  - fxch st(1)
//1C829891 - DEE9                  - fsubp st(1),st(0)
aobscan(Mob_searchedAOB, D9 87 14 01 00 00 DD 5D B8)

alloc(Mob_newmem, 2048, Mob_searchedAOB)


Mob_newmem:
cmp dword ptr [Mob_update_enable], #0
je Mob_update_exit
mov [Mob_basepointer], edi
Mob_update_exit:

cmp dword ptr [Mob_set_enable], #0
je Mob_set_exit
Mob_set_exit:

cmp dword ptr [Mob_limitset_enable], #0
je Mob_limitset_exit
mov [edi+d0], #9999
Mob_limitset_exit:

cmp dword ptr [Mob_modifiersset_enable], #0
je Mob_modifiersset_exit
mov [edi+e8], (float)99
mov [edi+ec], (float)99
mov [edi+f0], (float)20
mov [edi+f4], (float)99
mov [edi+f8], (float)99
mov [edi+fc], (float)99
mov [edi+100], (float)99
mov [edi+104], (float)99
Mob_modifiersset_exit:

cmp dword ptr [Mob_powersset_enable], #0
je Mob_powersset_exit
mov byte ptr [edi+108], #1
mov byte ptr [edi+109], #1
mov byte ptr [edi+10a], #1
mov byte ptr [edi+10b], #1
mov byte ptr [edi+10c], #1
mov byte ptr [edi+10d], #1
mov byte ptr [edi+10e], #1
mov byte ptr [edi+10f], #1
mov byte ptr [edi+110], #1
mov byte ptr [edi+111], #1
Mob_powersset_exit:

cmp dword ptr [Mob_invulnerableset_enable], #0
je Mob_invulnerableset_exit
mov [edi+114], (float)999
Mob_invulnerableset_exit:


Mob_originalcode:
db D9 87 14 01 00 00
//fld dword ptr [edi+00000114]


Mob_exit:
jmp Mob_returnhere


Mob_searchedAOB:
Mob_savedAOB:
jmp Mob_newmem
nop
Mob_returnhere:


[DISABLE]
Mob_savedAOB:
db D9 87 14 01 00 00
//fld dword ptr [edi+00000114]

unregistersymbol(Mob_savedAOB)

dealloc(Mob_newmem)"""

