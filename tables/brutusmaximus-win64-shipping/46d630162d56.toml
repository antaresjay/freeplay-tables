[[cheat]]
id = "player-ctrl-numpad-1"
name = "Player (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : BRUTUSMAXIMUS-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.6.1.0
// Game Version      : v1.0.24.2
// Script Date       : 2026-04-23


[ENABLE]

aobscanmodule(master,BRUTUSMAXIMUS-Win64-Shipping.exe,488BxxFFxxxxxxxxxx0F10xx0F11xxF2xxxxxxxxF2xxxxxxxx4883xxxx5BC3xxxxxxxxxxxxxxxxxxxxxxxxxxxx488Bxx4889xxxx4889) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,9)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,9)

newmem:
  mov [data],rcx

code:
  readmem(master,9)
  jmp return

master:
  jmp newmem
  nop 4
return:

[DISABLE]

master:
  readmem(masterbkp,9)

unregistersymbol(*)
dealloc(*)"""

