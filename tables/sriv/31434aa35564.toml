[[cheat]]
id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(ammo,sriv.exe,FF CC CC CC CC CC CC CC CC CC CC CC CC 8B 41 08 C3 CC) // should be unique
alloc(newmem2,$1000,ammo) //"sriv.exe"+91F730)

define(midjumpmem, $process+520)
fullaccess(midjumpmem, $1000)

label(code2)
label(return2)
label(gun)
registersymbol(gun)

newmem2:
  mov [gun],rcx
  mov [rcx+08],#9999
code2:
  mov eax,[rcx+08]
  ret 
  int 3 
  jmp return2

gun:
  dq 0

ammo+0D:
  jmp newmem2
return2:
registersymbol(ammo)

[DISABLE]


ammo+0D:
  db 8B 41 08 C3 CC

unregistersymbol(ammo)
unregistersymbol(gun)
dealloc(newmem2)"""
