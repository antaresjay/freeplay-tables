type = "script"
source = """
//Send@Sintrix|FearlessRevolution
define(address,EngineScript+<Counter>d__42:MoveNext+1e4)
define(bytes,F3 41 0F 10 8F D8 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,EngineScript+<Counter>d__42:MoveNext+1e4)
label(code return)

newmem:

code:
  movss xmm1,[r15+000000D8]
