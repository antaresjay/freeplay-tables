[[cheat]]
id = "timer-stamina-editor-ctrl-numpad-4"
name = "Timer/Stamina Editor (Ctrl + Numpad 4)"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : ShinShinonome.exe
// Author            : ndck76
// Executable Version: 2022.3.36.42017
// Game Version      : v1.1.1
// Script Date       : 2026-03-28


[ENABLE]

aobscanmodule(timer,GameAssembly.dll,F3xxxxxxxxF3xxxxxxxxxxxxxxxxF3xxxxxxxxE8xxxxxxxxF3xxxxxxxx0F57) //Wald.Field.Ui.Timer.AddTime
alloc(newmem,$1000,timer)
alloc(data2,8)
alloc(timerbkp,5)
registersymbol(data2)
registersymbol(timer)
registersymbol(timerbkp)
label(code)
label(return)

timerbkp:
  readmem(timer,5)

newmem:
  mov [data2],rbx

code:
  readmem(timer,5)
  jmp return

timer:
  jmp newmem
return:

[DISABLE]

timer:
  readmem(timerbkp,5)

unregistersymbol(*)
dealloc(*)"""

