type = "script"
source = """
{ Game   : Monster Crown.exe
  Version: [STEAM] 1.2.7 Build ID 16275945
  Date   : 2026-06-28
  Author : Oyyzj

  buy or sell something to merchant
}

[ENABLE]

aobscanregion(_Money,scriptFinances:TakeBucks+2a,scriptFinances:TakeBucks+3f,2B C7 41 89 47 ?? B8 01 00 00 00)
alloc(newmem,$100,_Money)
registersymbol(_Money)
alloc(_pMoney,4)
registersymbol(_pMoney)
label(code)
label(return)
label(_rMoney)
registersymbol(_rMoney)
label(_eMoney)
registersymbol(_eMoney)
label(_vMoney)
registersymbol(_vMoney)
newmem:
  cmp [_eMoney],1
  jne short code
  mov [_pMoney],r15
  cmp eax,[_vMoney]
  jg short code
  xor edi,edi
  jmp short code
code:
  readmem(_Money,6)
  jmp return
_rMoney:
  readmem(_Money,6)
_eMoney:
  dd 1
_vMoney:
  dd (int)300 //minimum .. adjustable
_Money:
  jmp newmem
  nop
return:


[DISABLE]

_Money:
  readmem(_Money,6)

unregistersymbol(*)
dealloc(*)"""

