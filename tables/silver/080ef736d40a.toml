[[cheat]]
id = "silver-aob-script"
name = "Silver AOB script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : silver.exe
// Author            : Cs
// Executable Version: 
// Module Version    : 
// Script Date       : 2020-05-28
// Created with      : customAOBInjectionTemplates version: 1.3.6
[ENABLE]
aobscanmodule(aobInvStackBase,silver.exe,A1 ?? ?? ?? ?? 8B 40 04 FF 70 04)
aobscanmodule(aobChargeChecker,silver.exe,0F 2F 86 ?? ?? 00 00 76 ?? C7)
aobscanmodule(aobHealthUpdater,silver.exe,29 57 ?? 83 7F ?? 00)
aobscanmodule(aobManaCalc,silver.exe,03 C2 33 D2 85 C0 0F)

alloc(newmemPlayerGrabber,4096,aobHealthUpdater)

label(bEnableGodMode)
label(bEnableOneHitKill)
label(bEnableInfiniteMana)
registersymbol(bEnableGodMode)
registersymbol(bEnableOneHitKill)
registersymbol(bEnableInfiniteMana)

label(iInvStackBase)
registersymbol(iInvStackBase)

label(aobChargeChecker_r)
label(aobChargeChecker_i)
registersymbol(aobChargeChecker_r)
registersymbol(aobChargeChecker_i)

label(lblChargeChecker)
label(lblChargeCheckerSkip)
label(lblChargeCheckerRet)

label(bEnableInfiniteCharge)
registersymbol(bEnableInfiniteCharge)

label(aobHealthUpdater_r)
label(aobHealthUpdater_i)
registersymbol(aobHealthUpdater_r)
registersymbol(aobHealthUpdater_i)

label(lblHealthUpdater)
label(lblHealthUpdaterSkip)
label(lblHealthUpdaterRet)
label(lblHealthUpdaterNonPlayer)

label(aobManaCalc_r)
label(aobManaCalc_i)
registersymbol(aobManaCalc_r)
registersymbol(aobManaCalc_i)

label(lblManaCalc)
label(lblManaCalcSkip)
label(lblManaCalcRet)

newmemPlayerGrabber:
bEnableGodMode:
dd 1
bEnableOneHitKill:
dd 1
bEnableInfiniteMana:
dd 1
bEnableInfiniteCharge:
dd 1

lblChargeChecker:
cmp dword ptr [bEnableInfiniteCharge],1
jne short lblChargeCheckerSkip
mov eax,[esi+04]
test eax,eax
jz short lblChargeCheckerSkip
mov eax,[aobChargeChecker_i+03]
mov dword ptr [eax+esi],(float)1.0
lblChargeCheckerSkip:
readmem(aobChargeChecker,7)
jmp lblChargeCheckerRet
aobChargeChecker_i:
readmem(aobChargeChecker,7)

lblHealthUpdater:
test byte ptr [esi+20],04
je short lblHealthUpdaterNonPlayer
cmp dword ptr [bEnableGodMode],1
jne short lblHealthUpdaterSkip
xor edx,edx
lblHealthUpdaterSkip:
readmem(aobHealthUpdater,7)
jmp lblHealthUpdaterRet
aobHealthUpdater_i:
readmem(aobHealthUpdater,7)
lblHealthUpdaterNonPlayer:
cmp dword ptr [bEnableOneHitKill],1
jne short lblHealthUpdaterSkip
mov edx,[edi+1C]
jmp short lblHealthUpdaterSkip

iInvStackBase:
readmem(aobInvStackBase+01,4)

lblManaCalc:
test byte ptr [edi+20],04
je short lblManaCalcSkip
cmp dword ptr [bEnableInfiniteMana],1
jne short lblManaCalcSkip
xor eax,eax
lblManaCalcSkip:
readmem(aobManaCalc,6)
jmp lblManaCalcRet
aobManaCalc_i:
readmem(aobManaCalc,6)

aobManaCalc:
aobManaCalc_r:
jmp lblManaCalc
nop
lblManaCalcRet:

aobHealthUpdater:
aobHealthUpdater_r:
jmp lblHealthUpdater
nop 2
lblHealthUpdaterRet:

aobChargeChecker:
aobChargeChecker_r:
jmp lblChargeChecker
nop 2
lblChargeCheckerRet:

[DISABLE]
unregistersymbol(bEnableGodMode)
unregistersymbol(bEnableOneHitKill)
unregistersymbol(bEnableInfiniteMana)

unregistersymbol(iInvStackBase)

aobChargeChecker_r:
readmem(aobChargeChecker_i,7)

unregistersymbol(aobChargeChecker_r)
unregistersymbol(aobChargeChecker_i)

unregistersymbol(bEnableInfiniteCharge)

aobHealthUpdater_r:
readmem(aobHealthUpdater_i,7)

unregistersymbol(aobHealthUpdater_r)
unregistersymbol(aobHealthUpdater_i)

aobManaCalc_r:
readmem(aobManaCalc_i,6)

unregistersymbol(aobManaCalc_r)
unregistersymbol(aobManaCalc_i)

dealloc(newmemPlayerGrabber)"""

