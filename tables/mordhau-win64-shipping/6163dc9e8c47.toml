[[cheat]]
id = "playerhook"
name = "PlayerHook"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(charHook,Mordhau-Win64-Shipping.exe,48 8B 01 FF A0 F8 09 00 00)
alloc(newmem,$1000,charHook)
label(code)
label(return)
alloc(turncap,8,charHook)

label(lplayer)

newmem:
mov [lplayer],rcx

code:
  mov rax,[rcx]
  jmp qword ptr [rax+000009F8]
  jmp return

lplayer:
dd 00

turncap:
dq 00

charHook:
  jmp newmem
  nop 4
return:
registersymbol(charHook lplayer turncap)

[DISABLE]

charHook:
  db 48 8B 01 FF A0 F8 09 00 00

unregistersymbol(*)
dealloc(*)"""

