[[cheat]]
id = "get-playercharacter"
name = "Get PlayerCharacter"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(PlayerCharacterAOB,$process,F2 0F 10 44 24 ?? 48 85 C0 F3 0F 10 ?? 24 ?? 48 8B CE 40)
alloc(newmem,$1000,PlayerCharacterAOB)

label(PlayerCharacterBKP)
label(PlayerCharacterPTR)
label(return)

newmem:
  mov rcx,PlayerCharacterPTR
  mov [rcx],rsi
PlayerCharacterBKP:
  readmem(PlayerCharacterAOB,6)
  jmp return

PlayerCharacterPTR:
  dq 0

PlayerCharacterAOB:
  jmp newmem
  nop
return:
registersymbol(PlayerCharacterAOB)
registersymbol(PlayerCharacterBKP)
registersymbol(PlayerCharacterPTR)

[DISABLE]
PlayerCharacterAOB:
  readmem(PlayerCharacterBKP,6)
unregistersymbol(PlayerCharacterAOB)
unregistersymbol(PlayerCharacterBKP)
unregistersymbol(PlayerCharacterPTR)
dealloc(newmem)"""

