[[cheat]]
id = "player-script-ctrl-numpad-1"
name = "Player Script (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Shotgun Cop Man.exe
// Author            : ndck76
// Executable Version: 2022.3.47.49783
// Game Version      : Build.18300831
// Script Date       : 2025-05-03


[ENABLE]

aobscanregion(groundtimer,PlayerScript:LateUpdate,PlayerScript:LateUpdate+20000,F30F1086xxxx0000F3xxxxxxF3xxxxxxxxxxxxxxF3xxxxxx66xxxxxx0Fxxxxxxxxxx0Fxxxxxxxxxx0Fxxxxxxxxxxxx85xx) //PlayerScript:LateUpdate+14b5d
alloc(newmem,$1000,groundtimer)
alloc(data,8)
alloc(groundtimerbkp,8)
registersymbol(data)
registersymbol(groundtimer)
registersymbol(groundtimerbkp)
label(code)
label(return)

groundtimerbkp:
  readmem(groundtimer,8)

newmem:
  mov [data],rsi

code:
  readmem(groundtimer,8)
  jmp return

groundtimer:
  jmp newmem
  nop 3
return:

[DISABLE]

groundtimer:
  readmem(groundtimerbkp,8)

unregistersymbol(*)
dealloc(*)"""

