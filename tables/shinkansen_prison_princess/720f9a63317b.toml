[[cheat]]
id = "appmain-base-address-scan-initialization-activate-this-first-to-activate-play-level"
name = "AppMain Base Address Scan Initialization (Activate This First, To Activate: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(AppMain_basepointer)
registersymbol(AppMain_update_enable)
registersymbol(AppMain_magicset_enable)

//063F3A16 - 83 EC 6C              - sub esp,6C
//063F3A19 - 8B 7D 08              - mov edi,[ebp+08]
// Orgesta.Framework:AppMain:Update+c
//063F3A1C - D9 47 2C              - fld dword ptr [edi+2C]
//063F3A1F - D9 5D EC              - fstp dword ptr [ebp-14]
//063F3A22 - D9 45 EC              - fld dword ptr [ebp-14]
//063F3A25 - DD 5D B8              - fstp qword ptr [ebp-48]
//063F3A28 - 8D 6D 00              - lea ebp,[ebp+00]
//063F3A2B - E8 90010000           - call 063F3BC0
//063F3A30 - DD 45 B8              - fld qword ptr [ebp-48]
aobscan(AppMain_initialization_searchedAOB, D9 47 2C D9 5D EC D9 45 EC DD 5D B8 8D 6D 00)

alloc(AppMain_basepointer, 4, AppMain_initialization_searchedAOB)
alloc(AppMain_update_enable, 4, AppMain_initialization_searchedAOB)
alloc(AppMain_magicset_enable, 4, AppMain_initialization_searchedAOB)


[DISABLE]
unregistersymbol(AppMain_basepointer)
unregistersymbol(AppMain_update_enable)
unregistersymbol(AppMain_magicset_enable)

dealloc(AppMain_basepointer)
dealloc(AppMain_update_enable)
dealloc(AppMain_magicset_enable)"""

[[cheat]]
id = "appmain-base-address-scan-to-activate-play-level-to-update-play-level"
name = "AppMain Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(AppMain_savedAOB)
label(AppMain_returnhere)
label(AppMain_originalcode)
label(AppMain_exit)

label(AppMain_update_exit)
label(AppMain_magicset_exit)

registersymbol(AppMain_originalcode)
registersymbol(AppMain_savedAOB)

//063F3A16 - 83 EC 6C              - sub esp,6C
//063F3A19 - 8B 7D 08              - mov edi,[ebp+08]
// Orgesta.Framework:AppMain:Update+c
//063F3A1C - D9 47 2C              - fld dword ptr [edi+2C]
//063F3A1F - D9 5D EC              - fstp dword ptr [ebp-14]
//063F3A22 - D9 45 EC              - fld dword ptr [ebp-14]
//063F3A25 - DD 5D B8              - fstp qword ptr [ebp-48]
//063F3A28 - 8D 6D 00              - lea ebp,[ebp+00]
//063F3A2B - E8 90010000           - call 063F3BC0
//063F3A30 - DD 45 B8              - fld qword ptr [ebp-48]
aobscan(AppMain_searchedAOB, D9 47 2C D9 5D EC D9 45 EC DD 5D B8 8D 6D 00)

alloc(AppMain_newmem, 2048, AppMain_searchedAOB)
alloc(AppMain_temp1, 4, AppMain_searchedAOB)
alloc(AppMain_temp2, 4, AppMain_searchedAOB)
alloc(AppMain_temp3, 4, AppMain_searchedAOB)
alloc(AppMain_temp4, 4, AppMain_searchedAOB)
alloc(AppMain_temp5, 4, AppMain_searchedAOB)


AppMain_newmem:
mov [AppMain_temp1], eax
mov [AppMain_temp2], ebx
mov [AppMain_temp3], ecx
mov [AppMain_temp4], edx

cmp dword ptr [AppMain_update_enable], #0
je AppMain_update_exit
mov [AppMain_basepointer], edi
AppMain_update_exit:

cmp dword ptr [AppMain_magicset_enable], #0
je AppMain_magicset_exit
mov ebx, [edi+10]
test ebx, ebx
je AppMain_magicset_exit
mov ebx, [ebx+70]
test ebx, ebx
je AppMain_magicset_exit
mov [ebx+20], #12
AppMain_magicset_exit:

mov eax, [AppMain_temp1]
mov ebx, [AppMain_temp2]
mov ecx, [AppMain_temp3]
mov edx, [AppMain_temp4]


AppMain_originalcode:
readmem(AppMain_searchedAOB, 6)


AppMain_exit:
jmp AppMain_returnhere


AppMain_searchedAOB:
AppMain_savedAOB:
jmp AppMain_newmem
nop
AppMain_returnhere:


[DISABLE]
AppMain_savedAOB:
readmem(AppMain_originalcode, 6)

unregistersymbol(AppMain_originalcode)
unregistersymbol(AppMain_savedAOB)

dealloc(AppMain_newmem)
dealloc(AppMain_temp1)
dealloc(AppMain_temp2)
dealloc(AppMain_temp3)
dealloc(AppMain_temp4)
dealloc(AppMain_temp5)"""

