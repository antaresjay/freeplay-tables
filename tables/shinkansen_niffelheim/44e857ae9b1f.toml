[[cheat]]
id = "player-base-address-scan-initialization-activate-this-first"
name = "Player Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Player_basepointer)
registersymbol(Player_update_enable)
registersymbol(Player_variablesset_enable)
registersymbol(Player_characteristicsset_enable)
registersymbol(Player_moneyset_enable)
registersymbol(Player_dragonset_enable)

//06C8B37C - 89 34 24              - mov [esp],esi
//06C8B37F - E8 0C010000           - call 06C8B490
// Ellada.Game.Actors:ActorManager:get_cameraTarget+24
//06C8B384 - 8B 80 70010000        - mov eax,[eax+00000170]
//06C8B38A - C7 44 24 04 00000000  - mov [esp+04],00000000
//06C8B392 - 89 04 24              - mov [esp],eax
//06C8B395 - 8B C0                 - mov eax,eax
//06C8B397 - E8 5442E8FE           - call 05B0F5F0
//06C8B39C - 85 C0                 - test eax,eax
//06C8B39E - 0F84 48000000         - je 06C8B3EC
//06C8B3A4 - 89 34 24              - mov [esp],esi
aobscan(Player_initialization_searchedAOB, 8B 80 70 01 00 00 C7 44 24 04 00 00 00 00 89 04 24 8B C0)

alloc(Player_basepointer, 4, Player_initialization_searchedAOB)
alloc(Player_update_enable, 4, Player_initialization_searchedAOB)
alloc(Player_variablesset_enable, 4, Player_initialization_searchedAOB)
alloc(Player_characteristicsset_enable, 4, Player_initialization_searchedAOB)
alloc(Player_moneyset_enable, 4, Player_initialization_searchedAOB)
alloc(Player_dragonset_enable, 4, Player_initialization_searchedAOB)


[DISABLE]
unregistersymbol(Player_basepointer)
unregistersymbol(Player_update_enable)
unregistersymbol(Player_variablesset_enable)
unregistersymbol(Player_characteristicsset_enable)
unregistersymbol(Player_moneyset_enable)
unregistersymbol(Player_dragonset_enable)

dealloc(Player_basepointer)
dealloc(Player_update_enable)
dealloc(Player_variablesset_enable)
dealloc(Player_characteristicsset_enable)
dealloc(Player_moneyset_enable)
dealloc(Player_dragonset_enable)"""

[[cheat]]
id = "player-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Player Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Player_savedAOB)
label(Player_returnhere)
label(Player_originalcode)
label(Player_exit)

label(Player_update_exit)
label(Player_variablesset_loop1_exit)
label(Player_variablesset_loop1_entry)
label(Player_variablesset_loop1_continue)
label(Player_characteristicsset_loop1_exit)
label(Player_characteristicsset_loop1_entry)
label(Player_characteristicsset_loop1_continue)
label(Player_moneyset_exit)
label(Player_dragonset_exit)

registersymbol(Player_originalcode)
registersymbol(Player_savedAOB)

//06C8B37C - 89 34 24              - mov [esp],esi
//06C8B37F - E8 0C010000           - call 06C8B490
// Ellada.Game.Actors:ActorManager:get_cameraTarget+24
//06C8B384 - 8B 80 70010000        - mov eax,[eax+00000170]
//06C8B38A - C7 44 24 04 00000000  - mov [esp+04],00000000
//06C8B392 - 89 04 24              - mov [esp],eax
//06C8B395 - 8B C0                 - mov eax,eax
//06C8B397 - E8 5442E8FE           - call 05B0F5F0
//06C8B39C - 85 C0                 - test eax,eax
//06C8B39E - 0F84 48000000         - je 06C8B3EC
//06C8B3A4 - 89 34 24              - mov [esp],esi
aobscan(Player_searchedAOB, 8B 80 70 01 00 00 C7 44 24 04 00 00 00 00 89 04 24 8B C0)

alloc(Player_newmem, 2048, Player_searchedAOB)
alloc(Player_temp1, 4, Player_searchedAOB)
alloc(Player_temp2, 4, Player_searchedAOB)
alloc(Player_temp3, 4, Player_searchedAOB)
alloc(Player_temp4, 4, Player_searchedAOB)
alloc(Player_temp5, 4, Player_searchedAOB)
alloc(Player_loop1_index, 4, Player_searchedAOB)
alloc(Player_loop1_base, 4, Player_searchedAOB)
alloc(Player_loop1_max, 4, Player_searchedAOB)


Player_newmem:
mov [Player_temp1], eax
mov [Player_temp2], ebx
mov [Player_temp3], ecx
mov [Player_temp4], edx

test eax, eax
je Player_dragonset_exit

cmp dword ptr [Player_update_enable], #0
je Player_update_exit
mov [Player_basepointer], eax
Player_update_exit:

cmp dword ptr [Player_variablesset_enable], #0
je Player_variablesset_loop1_exit
mov [Player_loop1_index], #0
mov ebx, [eax+1c]
test ebx, ebx
je Player_variablesset_loop1_exit
mov ebx, [ebx+14]
test ebx, ebx
je Player_variablesset_loop1_exit
mov ebx, [ebx+8]
test ebx, ebx
je Player_variablesset_loop1_exit
mov [Player_loop1_base], ebx
mov ecx, [ebx+c]
test ecx, ecx
je Player_variablesset_loop1_exit
mov [Player_loop1_max], ecx

Player_variablesset_loop1_entry:
mov ebx, [Player_loop1_base]
mov edx, [Player_loop1_index]
mov ecx, [ebx+edx*4+10]
test ecx, ecx
je Player_variablesset_loop1_continue
mov [ecx+14], #9999999

Player_variablesset_loop1_continue:
mov edx, [Player_loop1_index]
inc edx
mov [Player_loop1_index], edx
mov ecx, [Player_loop1_max]
cmp ecx, edx
je Player_variablesset_loop1_exit
jmp Player_variablesset_loop1_entry
Player_variablesset_loop1_exit:

cmp dword ptr [Player_characteristicsset_enable], #0
je Player_characteristicsset_loop1_exit
mov [Player_loop1_index], #0
mov ebx, [eax+18]
test ebx, ebx
je Player_characteristicsset_loop1_exit
mov ebx, [ebx+14]
test ebx, ebx
je Player_characteristicsset_loop1_exit
mov ebx, [ebx+8]
test ebx, ebx
je Player_characteristicsset_loop1_exit
mov [Player_loop1_base], ebx
mov ecx, [ebx+c]
test ecx, ecx
je Player_characteristicsset_loop1_exit
mov [Player_loop1_max], ecx

Player_characteristicsset_loop1_entry:
mov ebx, [Player_loop1_base]
mov edx, [Player_loop1_index]
mov ecx, [ebx+edx*4+10]
test ecx, ecx
je Player_characteristicsset_loop1_continue
mov [ecx+14], #9999

Player_characteristicsset_loop1_continue:
mov edx, [Player_loop1_index]
inc edx
mov [Player_loop1_index], edx
mov ecx, [Player_loop1_max]
cmp ecx, edx
je Player_characteristicsset_loop1_exit
jmp Player_characteristicsset_loop1_entry
Player_characteristicsset_loop1_exit:

cmp dword ptr [Player_moneyset_enable], #0
je Player_moneyset_exit
mov [eax+11c], #99999
Player_moneyset_exit:

cmp dword ptr [Player_dragonset_enable], #0
je Player_dragonset_exit
mov [eax+124], (float)99
Player_dragonset_exit:

mov eax, [Player_temp1]
mov ebx, [Player_temp2]
mov ecx, [Player_temp3]
mov edx, [Player_temp4]


Player_originalcode:
readmem(Player_searchedAOB, 6)


Player_exit:
jmp Player_returnhere


Player_searchedAOB:
Player_savedAOB:
jmp Player_newmem
nop
Player_returnhere:


[DISABLE]
Player_savedAOB:
readmem(Player_originalcode, 6)

unregistersymbol(Player_savedAOB)

dealloc(Player_newmem)
dealloc(Player_temp1)
dealloc(Player_temp2)
dealloc(Player_temp3)
dealloc(Player_temp4)
dealloc(Player_temp5)
dealloc(Player_loop1_index)
dealloc(Player_loop1_base)
dealloc(Player_loop1_max)"""

