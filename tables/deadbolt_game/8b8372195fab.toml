[[cheat]]
id = "enable-3"
name = "Enable .3"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(someRet1AOB,83 C4 10 ** ** ** ** ** ** ** 88 44 24 17)
registersymbol(someRet1AOB)

///***************************************************///

aobscan(someRead1AOB,DD 45 00 5F DD 1E 5E)
registersymbol(someRead1AOB)

label(pCurrentAmmo)
registersymbol(pCurrentAmmo)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
cmp dword ptr [esp+24],someRet1AOB //deadbolt_game.exe+11b85c
jne originalcode
cmp dword ptr [ebp+4c],0
je originalcode
cmp dword ptr [ebp+4c],00ffffff
je originalcode

mov [pCurrentAmmo],ebp
//fld qword ptr [ebp+00]
//pop edi
//fstp qword ptr [esi]
//jmp exit

originalcode:
fld qword ptr [ebp+00]
pop edi
fstp qword ptr [esi]

exit:
jmp returnhere

///
pCurrentAmmo:
///

someRead1AOB: //"deadbolt_game.exe"+109510:
jmp newmem
nop
returnhere:

///******************************************************///

aobscan(someWrite1AOB,DD 00 DD 1F 5F 5E 5D 5B 59 C3)
registersymbol(someWrite1AOB)

label(bInfAmmo)
registersymbol(bInfAmmo)
label(bUndead)
registersymbol(bUndead)
label(bChangeWeapon)
registersymbol(bChangeWeapon)
label(dChangeWeaponList)
registersymbol(dChangeWeaponList)

alloc(newmem2,2048)
label(returnhere2)
label(originalcode2)
label(exit2)
label(dominvalue2)
label(iscurrentweapontype2)

newmem2: //this is allocated memory, you have read,write,execute access
//place your code here
fld qword ptr [eax]

cmp byte ptr [bInfAmmo],1
jne @f
cmp [pCurrentAmmo],edi
je dominvalue2

@@:
cmp byte ptr [bUndead],1
jne @f
push eax
lea eax,[edi+30]
cmp [pCurrentAmmo],eax
pop eax
je dominvalue2

@@:
cmp byte ptr [bChangeWeapon],1
jne @f
push eax
lea eax,[edi-c0]
cmp [pCurrentAmmo],eax
pop eax
je iscurrentweapontype2

@@:
jmp originalcode2

dominvalue2:
//fld qword ptr [edi]
//fstp st(0)
fld1
fcomip st(0),st(1)
jbe originalcode2
fstp st(0)
fld1
fst qword ptr [eax]
jmp originalcode2

iscurrentweapontype2:
push ebx
xor ebx,ebx
pushad
push 'Z'
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
je @f

inc ebx
pushad
push 'X'
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
je @f

inc ebx
pushad
push 'C'
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
je @f

inc ebx
pushad
push 'V'
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
je @f

inc ebx
pushad
push 'B'
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
je @f

inc ebx
pushad
push 31      //1 Key
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
je @f

inc ebx
pushad
push 32      //2 Key
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
je @f

inc ebx
pushad
push 33      //3 Key
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
je @f

inc ebx
pushad
push 34      //4 Key
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
je @f

inc ebx
pushad
push 35      //5 Key
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
je @f

pop ebx
jmp originalcode2

@@:
fstp st(0)
fld qword ptr [dChangeWeaponList+ebx*8]
pop ebx
jmp originalcode2

originalcode2:
//fld qword ptr [eax]
fstp qword ptr [edi]
pop edi

exit2:
jmp returnhere2

///
bInfAmmo:
dd 0
bUndead:
dd 0
bChangeWeapon:
dd 0
dChangeWeaponList:
dq (double)6      //SUPPRESSED 9mm PISTOL
dq (double)16     //HEADHUNTER
dq (double)31     //SUPPRESSED SHOTGUN
dq (double)30     //SEMI-AUTO SHOTGUN
dq (double)32     //SCYTHE
dq (double)11     //FLASHBANG
dq (double)23     //THROWING STAR
dq (double)18     //CROSSBOW
dq (double)33     //AUTO GRENADE LAUNCHER
dq (double)29     //SEVERED LICH ARM

///

someWrite1AOB: //"deadbolt_game.exe"+109F01:
jmp newmem2
returnhere2:


 
 
[DISABLE]
