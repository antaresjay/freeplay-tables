[[cheat]]
id = "no-reload"
name = "No reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(ammo)
label(returnhere)
registersymbol(ammo)
aobscan(aob_ammo,89 47 28 85 DB 0F 84 9D 00 00 00 8B CB)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
add,eax,02
mov [edi+28],eax
test ebx,ebx
jmp returnhere

aob_ammo:
ammo:
jmp newmem
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
unregistersymbol(ammo)
ammo:
mov [edi+28],eax
test ebx,ebx
//Alt: db 89 47 28 85 DB"""

