source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(aMoveModKeys)
registersymbol(aMoveModKeys)

alloc(newmem,2048,"GameAssembly.dll"+1BD6B7E)
label(returnhere)
label(originalcode)
