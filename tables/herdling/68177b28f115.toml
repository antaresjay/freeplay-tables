xor rax,rax
mov rcx,aMoveModKeys
cmp byte ptr [rcx+rax],1
je @f
inc rax
cmp byte ptr [rcx+rax],1
je @f
jmp end

@@:
mulss xmm11,[rcx+rax*4+4]

end:
pop rax

originalcode:
