// ---------- INJECTING HERE ----------
""+4AEF4F66: 8B 47 54           -  mov eax,[edi+54]
""+4AEF4F69: 83 EC 0C           -  sub esp,0C
// ---------- DONE INJECTING  ----------
""+4AEF4F6C: 50                 -  push eax
