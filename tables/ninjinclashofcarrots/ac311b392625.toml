[[cheat]]
id = "inf-health-lose-health-first"
name = "inf Health [Lose Health First]"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(Health,89 88 48 01 00 00 8B 8D)
alloc(newmem,$1000)

label(code)
label(return)

alloc(getPointer_1,4)
registersymbol(getPointer_1)

alloc(infHealth,1)
registersymbol(infHealth)

newmem:
  cmp byte ptr [infHealth],1
  jne code
  mov [eax+00000148],ecx
  mov ecx,#100
code:
  mov [getPointer_1],eax
  mov [eax+00000148],ecx
  jmp return

infHealth:
 db 0

Health:
  jmp newmem
  nop
return:
registersymbol(Health)

[DISABLE]

Health:
  db 89 88 48 01 00 00
unregistersymbol(infHealth)
unregistersymbol(getPointer_1)
unregistersymbol(Health)
dealloc(newmem)
dealloc(getPointer_1)
dealloc(infHealth)"""

