[[cheat]]
id = "inf-hp"
name = "Inf HP"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : COTM.exe
  Version: 
  Date   : 2018-05-24
  Author : Squall8
}

[ENABLE]

aobscanmodule(health,COTM.exe,89 B1 DC 03 00 00)
alloc(newmem,$1000,health)

label(code)
label(return)

registersymbol(health)

newmem:
  cmp [ecx+14],0
  jne code
  jmp return

code:
  mov [ecx+000003DC],esi
  jmp return

health:
  jmp newmem
  nop
return:

[DISABLE]

health:
  db 89 B1 DC 03 00 00

unregistersymbol(health)
dealloc(newmem)"""

