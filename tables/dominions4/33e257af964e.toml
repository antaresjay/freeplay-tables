[[cheat]]
id = "godly-magic-skill-takes-1-month"
name = "Godly magic skill (takes 1 month)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(PLAYERSKILL,Dominions4.exe,0F BE B4 2A 22 A6 BE 04) // should be unique
alloc(newmem,$64)

label(loo)
label(return)

newmem:
  push eax
  mov al, byte ptr [empowermentP]
  cmp al,64
  jl loo
  mov al,63
loo:
  mov byte ptr [edx+ebp+Dominions4.exe+3EFA622],al
  movsx esi,byte ptr [edx+ebp+Dominions4.exe+3EFA622]
  pop eax
  jmp return

PLAYERSKILL:
  jmp newmem
  nop 3
return:
registersymbol(PLAYERSKILL)

[DISABLE]

PLAYERSKILL:
  db 0F BE B4 2A 22 A6 BE 04

unregistersymbol(PLAYERSKILL)
dealloc(newmem)"""

