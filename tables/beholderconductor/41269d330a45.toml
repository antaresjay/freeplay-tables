[[cheat]]
id = "item-inventory-ctrl-numpad-1-select-an-item-in-the-inventory-to-populate-values"
name = "Item Inventory (Ctrl + Numpad 1) {Select an item in the inventory to populate values}"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : BeholderConductor.exe
// Author            : ndck76
// Executable Version: 2022.3.30.21890
// Game Version      : v1.0.0.243
// Script Date       : 2025-04-25


[ENABLE]

aobscanmodule(onitemclick,GameAssembly.dll,488Bxxxxxxxxxx4885xx74xx4Cxxxxxx488Bxxxxxxxxxx488Bxxxx4883xxxx5B48FFxxxx4883xxxx5BC3xxxxxxxxxxxxxxxx83) //BeholderConductor.UI.InventoryItemUI.OnItemClicked
alloc(newmem,$1000,onitemclick)
alloc(data2,8)
alloc(onitemclickbkp,7)
registersymbol(data2)
registersymbol(onitemclick)
registersymbol(onitemclickbkp)
label(code)
label(return)

onitemclickbkp:
  readmem(onitemclick,7)

newmem:
  mov [data2],rbx

code:
  readmem(onitemclick,7)
  jmp return

onitemclick:
  jmp newmem
  nop 2
return:

[DISABLE]

onitemclick:
  readmem(onitemclickbkp,7)

unregistersymbol(*)
dealloc(*)"""

