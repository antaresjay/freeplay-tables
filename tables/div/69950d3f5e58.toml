[[cheat]]
id = "character-pointers"
name = "Character Pointers"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : div.exe
  Version: GOG 1.506
  Date   : 2017-05-27
  Author : Squall8
}

[ENABLE]

aobscanmodule(chp,div.exe,8B 47 70 56 BA 12 00 00 00)
alloc(newmem,$1000)

label(code)
label(return)
label(chpp)

registersymbol(chp)
registersymbol(chpp)

aobscanmodule(skillpoints,div.exe,8B 14 81 89 54 24 14)
alloc(newmem2,$1000)

label(code2)
label(return2)
label(spp)

registersymbol(skillpoints)
registersymbol(spp)

aobscanmodule(chp2,div.exe,8B 40 0C 50 6A 13)
alloc(newmem3,$1000)

label(code3)
label(return3)
label(chpp2)

registersymbol(chp2)
registersymbol(chpp2)

aobscanmodule(chp3,div.exe,8B 83 34 04 00 00 52)
alloc(newmem4,$1000)

label(code4)
label(return4)
label(chpp3)

registersymbol(chp3)
registersymbol(chpp3)
//------------------------------------------------------------------//
newmem:
  mov [chpp],edi

code:
  mov eax,[edi+70]
  push esi
  mov edx,00000012
  jmp return

chpp:
  dd 0
//------------------------------------------------------------------//
newmem2:
  push ebx
  lea ebx,[ecx+eax*4]
  mov [spp],ebx
  pop ebx

code2:
  mov edx,[ecx+eax*4]
  mov [esp+14],edx
  jmp return2

spp:
  dd 0
//------------------------------------------------------------------//
newmem3:
  mov [chpp2],eax

code3:
  mov eax,[eax+0C]
  push eax
  push 13
  jmp return3

chpp2:
  dd 0
//------------------------------------------------------------------//
newmem4:
  mov [chpp3],ebx

code4:
  mov eax,[ebx+00000434]
  jmp return4

chpp3:
  dd 0
//------------------------------------------------------------------//
chp:
  jmp newmem
  nop
  nop
  nop
  nop
return:

skillpoints:
  jmp newmem2
  nop
  nop
return2:

chp2:
  jmp newmem3
  nop
return3:

chp3:
  jmp newmem4
  nop
return4:

[DISABLE]

chp:
  db 8B 47 70 56 BA 12 00 00 00

unregistersymbol(chp)
unregistersymbol(chpp)
dealloc(newmem)

skillpoints:
  db 8B 14 81 89 54 24 14

unregistersymbol(skillpoints)
unregistersymbol(spp)
dealloc(newmem2)

chp2:
  db 8B 40 0C 50 6A 13

unregistersymbol(chp2)
unregistersymbol(chpp2)
dealloc(newmem3)

chp3:
  db 8B 83 34 04 00 00

unregistersymbol(chp3)
unregistersymbol(chpp3)
dealloc(newmem4)"""

