[[cheat]]
id = "invulnerability"
name = "Invulnerability"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(health,div.exe,8B 46 0C 39 46 04 7E) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov eax,[esi+0C] // load full health
  mov [esi+04],eax // copy to current health

code:
  cmp [esi+04],eax
  jmp return

health:
  jmp newmem
  nop
return:
registersymbol(health)

[DISABLE]

health:
  db 8B 46 0C 39 46 04

unregistersymbol(health)
dealloc(newmem)

{
