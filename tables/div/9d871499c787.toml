[[cheat]]
id = "bonus-points-thanks-to-exor-for-the-code-you-need-to-get-at-least-one-to-work"
name = "Bonus Points (thanks to EXOR for the code!) you need to get at least one to work)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : div.exe
  Version: 
  Date   : 2020-06-01
  Author : maxie

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(bonus_points,div.exe,8B 04 81 5E C3) // should be unique
alloc(newmem,$1000)
alloc(bonus,8)

label(code)
label(return)

bonus:
dq 0

newmem:
 enter 4,0
 lea esp,[ecx+eax*4]
 mov [bonus],esp
 leave

// the newmem code is supplied by EXOR, thanks to him!

code:
  mov eax,[ecx+eax*4]
  pop esi
  ret 
  jmp return

bonus_points:
  jmp newmem
return:
registersymbol(bonus_points bonus)

[DISABLE]

bonus_points:
  db 8B 04 81 5E C3

unregistersymbol(bonus_points bonus)
dealloc(newmem bonus)

