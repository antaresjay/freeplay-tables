[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]



aobscanmodule(health_aob,cnc3game.dat,8B 88 C0 02 00 00 85 C9 74 09)
alloc(newmem,$1000)

label(code)
label(return)

registersymbol(healthE)
registersymbol(healthE2)
label(healthE2)
label(healthE)
newmem:


mov ecx,[eax+000002C0]
test ecx,ecx
jz code
cmp [healthE],0
je @F
dec [healthE]
mov [ecx+8],(float)999999999
mov [ecx+10],(float)99999999
@@:
cmp [healthE2],0
je @F
dec [healthE2]

mov [ecx+8],(float)1
mov [ecx+10],(float)1

code:
jmp return
healthE:
dd 0
healthE2:
dd 0
health_aob:
jmp newmem
nop
return:
registersymbol(health_aob)

[DISABLE]
health_aob:
db 8B 88 C0 02 00 00
unregistersymbol(healthE)
unregistersymbol(health_aob)
dealloc(newmem)
unregistersymbol(healthE2)"""

