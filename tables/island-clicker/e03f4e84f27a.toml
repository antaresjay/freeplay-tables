  This script does blah blah blah
}

[ENABLE]

aobscanmodule(pData_UnlimitedResources,GameAssembly.dll,F2 0F 11 49 10 48 8B 49) // should be unique
alloc(newmem,$1000,pData_UnlimitedResources)

label(code)
label(return)

