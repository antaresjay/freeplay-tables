[ENABLE]


aobscanmodule(ItemPointer,GameAssembly.dll,7C E3 FF C6 05 * * * * 01 48 8B 83 08 01 00 00)
alloc(newmem,$1000,ItemPointer)
label(code return GetItemQuantity)

newmem:
push rsi
lea rsi,[rbx+108]
mov [GetItemQuantity],rbx
pop rsi
// Send  @ Sintrix | FearlessRevolution
