[[cheat]]
id = "get-player-data"
name = "Get Player Data"
category = "player"
description = ""
hint = ""
type = "script"
source = """
define(address,Ambertail.Game.PlayerData.OnUpdate)
define(bytes,48 89 5C 24 08)

[ENABLE]
// Send  @ Sintrix | FearlessRevolution
assert(address,bytes)
alloc(newmem,$1000,Ambertail.Game.PlayerData.OnUpdate)
label(code return getPlayer)
registersymbol(getPlayer)

newmem:
mov [getPlayer],rcx

code:
  mov [rsp+08],rbx
  jmp return

getPlayer:
dq

address:
  jmp newmem
return:
// Send  @ Sintrix | FearlessRevolution
[DISABLE]

address:
  db bytes
  unregistersymbol(*)
  dealloc(*)"""

