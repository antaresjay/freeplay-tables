// PlayerView:MoveByController+b1
//1BF324C9 - D9 40 14              - fld dword ptr [eax+14]
//1BF324CC - D9 5D E4              - fstp dword ptr [ebp-1C]
//1BF324CF - D9 45 E4              - fld dword ptr [ebp-1C]
//1BF324D2 - 8D 45 9C              - lea eax,[ebp-64]
//1BF324D5 - 83 EC 0C              - sub esp,0C
aobscan(PlayerManager_searchedAOB, D9 40 14 D9 5D E4 D9 45 E4)

alloc(PlayerManager_newmem, 2048, PlayerManager_searchedAOB)
alloc(PlayerManager_temp1, 4, PlayerManager_searchedAOB)
alloc(PlayerManager_temp2, 4, PlayerManager_searchedAOB)
alloc(PlayerManager_temp3, 4, PlayerManager_searchedAOB)
alloc(PlayerManager_temp4, 4, PlayerManager_searchedAOB)
alloc(PlayerManager_temp5, 4, PlayerManager_searchedAOB)


PlayerManager_newmem:
mov [PlayerManager_temp1], eax
mov [PlayerManager_temp2], ebx
mov [PlayerManager_temp3], ecx
mov [PlayerManager_temp4], edx

cmp dword ptr [PlayerManager_update_enable], #0
je PlayerManager_update_exit
mov [PlayerManager_basepointer], eax
PlayerManager_update_exit:

cmp dword ptr [PlayerManager_hpset_enable], #0
je PlayerManager_hpset_exit
mov ebx, [eax+c]
test ebx, ebx
je PlayerManager_hpset_exit
fld [ebx+4c]
fstp [ebx+50]
PlayerManager_hpset_exit:

cmp dword ptr [PlayerManager_statsset_enable], #0
je PlayerManager_statsset_exit
mov ebx, [eax+c]
test ebx, ebx
je PlayerManager_statsset_exit
mov [ebx+4c], (float)9999
mov [ebx+54], (float)9999
mov [ebx+58], (float)0.01
PlayerManager_statsset_exit:

cmp dword ptr [PlayerManager_cooldownsset_enable], #0
je PlayerManager_cooldownsset_exit
mov ebx, [eax+10]
test ebx, ebx
je PlayerManager_statsset_exit
mov ebx, [ebx+b0]
test ebx, ebx
je PlayerManager_statsset_exit
mov ebx, [ebx+8]
test ebx, ebx
je PlayerManager_statsset_exit
mov [ebx+10], (float)0
mov [ebx+14], (float)0
mov [ebx+18], (float)0
PlayerManager_cooldownsset_exit:

mov eax, [PlayerManager_temp1]
mov ebx, [PlayerManager_temp2]
mov ecx, [PlayerManager_temp3]
mov edx, [PlayerManager_temp4]


PlayerManager_originalcode:
readmem(PlayerManager_searchedAOB, 6)


PlayerManager_exit:
jmp PlayerManager_returnhere


PlayerManager_searchedAOB:
PlayerManager_savedAOB:
jmp PlayerManager_newmem
nop
PlayerManager_returnhere:


[DISABLE]
PlayerManager_savedAOB:
readmem(PlayerManager_originalcode, 6)

unregistersymbol(PlayerManager_originalcode)
unregistersymbol(PlayerManager_savedAOB)

