[[cheat]]
id = "gamemanager-base-address-scan-initialization-activate-this-first"
name = "GameManager Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameManager_basepointer)
registersymbol(GameManager_update_enable)
registersymbol(GameManager_statsset_enable)
registersymbol(GameManager_expset_enable)

alloc(GameManager_basepointer, 4)
alloc(GameManager_update_enable, 4)
alloc(GameManager_statsset_enable, 4)
alloc(GameManager_expset_enable, 4)


[DISABLE]
unregistersymbol(GameManager_basepointer)
unregistersymbol(GameManager_update_enable)
unregistersymbol(GameManager_statsset_enable)
unregistersymbol(GameManager_expset_enable)

dealloc(GameManager_basepointer)
dealloc(GameManager_update_enable)
dealloc(GameManager_statsset_enable)
dealloc(GameManager_expset_enable)"""

[[cheat]]
id = "gamemanager-base-address-scan-to-activate-view-main-menu-to-update-view-main-menu"
name = "GameManager Base Address Scan (To Activate: View Main Menu, To Update: View Main Menu)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameManager_savedAOB)
label(GameManager_returnhere)
label(GameManager_originalcode)
label(GameManager_exit)

label(GameManager_update_exit)
label(GameManager_statsset_loop1_exit)
label(GameManager_statsset_loop1_entry)
label(GameManager_statsset_loop1_continue)
label(GameManager_expset_loop1_exit)
label(GameManager_expset_loop1_entry)
label(GameManager_expset_loop1_continue)

registersymbol(GameManager_originalcode)
registersymbol(GameManager_savedAOB)

//049503F0 - C6 40 54 01           - mov byte ptr [eax+54],01
//049503F4 - 8B 0D 60CFE700        - mov ecx,[00E7CF60] : [00E90FC0]
// UIHome:OnShowComplete+1a
//049503FA - 8B 49 14              - mov ecx,[ecx+14]
//049503FD - 0FB6 49 64            - movzx ecx,byte ptr [ecx+64]
//04950401 - 83 EC 08              - sub esp,08
//04950404 - 51                    - push ecx
//04950405 - 50                    - push eax
//04950406 - E8 15000000           - call 04950420
//0495040B - 83 C4 10              - add esp,10
aobscan(GameManager_searchedAOB, 8B 49 14 0F B6 49 64 83 EC 08 51 50)

alloc(GameManager_newmem, 2048, GameManager_searchedAOB)
alloc(GameManager_temp1, 4, GameManager_searchedAOB)
alloc(GameManager_temp2, 4, GameManager_searchedAOB)
alloc(GameManager_temp3, 4, GameManager_searchedAOB)
alloc(GameManager_temp4, 4, GameManager_searchedAOB)
alloc(GameManager_temp5, 4, GameManager_searchedAOB)
alloc(GameManager_loop1_index, 4, GameManager_searchedAOB)
alloc(GameManager_loop1_base, 4, GameManager_searchedAOB)
alloc(GameManager_loop1_max, 4, GameManager_searchedAOB)


GameManager_newmem:
mov [GameManager_temp1], eax
mov [GameManager_temp2], ebx
mov [GameManager_temp3], ecx
mov [GameManager_temp4], edx

cmp dword ptr [GameManager_update_enable], #0
je GameManager_update_exit
mov [GameManager_basepointer], ecx
GameManager_update_exit:

cmp dword ptr [GameManager_statsset_enable], #0
je GameManager_statsset_loop1_exit
mov [GameManager_loop1_index], #0
mov ebx, [ecx+28]
test ebx, ebx
je GameManager_statsset_loop1_exit
mov ebx, [ebx+14]
test ebx, ebx
je GameManager_statsset_loop1_exit
mov [GameManager_loop1_base], ebx
mov eax, [ebx+c]
test eax, eax
je GameManager_statsset_loop1_exit
mov [GameManager_loop1_max], eax

GameManager_statsset_loop1_entry:
mov ebx, [GameManager_loop1_base]
mov edx, [GameManager_loop1_index]
mov eax, [ebx+edx*4+10]
test eax, eax
je GameManager_statsset_loop1_continue

mov [eax+34], #9999
mov [eax+38], #9999
mov [eax+3c], #9999
mov [eax+44], #0
mov [eax+48], #9999

GameManager_statsset_loop1_continue:
mov edx, [GameManager_loop1_index]
inc edx
mov [GameManager_loop1_index], edx
mov eax, [GameManager_loop1_max]
cmp eax, edx
je GameManager_statsset_loop1_exit
jmp GameManager_statsset_loop1_entry
GameManager_statsset_loop1_exit:

cmp dword ptr [GameManager_expset_enable], #0
je GameManager_expset_loop1_exit
mov [GameManager_loop1_index], #0
mov ebx, [ecx+28]
test ebx, ebx
je GameManager_expset_loop1_exit
mov ebx, [ebx+14]
test ebx, ebx
je GameManager_expset_loop1_exit
mov [GameManager_loop1_base], ebx
mov eax, [ebx+c]
test eax, eax
je GameManager_expset_loop1_exit
mov [GameManager_loop1_max], eax

GameManager_expset_loop1_entry:
mov ebx, [GameManager_loop1_base]
mov edx, [GameManager_loop1_index]
mov eax, [ebx+edx*4+10]
test eax, eax
je GameManager_expset_loop1_continue

mov [eax+20], (float)1

GameManager_expset_loop1_continue:
mov edx, [GameManager_loop1_index]
inc edx
mov [GameManager_loop1_index], edx
mov eax, [GameManager_loop1_max]
cmp eax, edx
je GameManager_expset_loop1_exit
jmp GameManager_expset_loop1_entry
GameManager_expset_loop1_exit:

mov eax, [GameManager_temp1]
mov ebx, [GameManager_temp2]
mov ecx, [GameManager_temp3]
mov edx, [GameManager_temp4]


GameManager_originalcode:
readmem(GameManager_searchedAOB, 7)


GameManager_exit:
jmp GameManager_returnhere


GameManager_searchedAOB:
GameManager_savedAOB:
jmp GameManager_newmem
nop
nop
GameManager_returnhere:


[DISABLE]
GameManager_savedAOB:
readmem(GameManager_originalcode, 7)

unregistersymbol(GameManager_originalcode)
unregistersymbol(GameManager_savedAOB)

dealloc(GameManager_newmem)
dealloc(GameManager_temp1)
dealloc(GameManager_temp2)
dealloc(GameManager_temp3)
dealloc(GameManager_temp4)
dealloc(GameManager_temp5)
dealloc(GameManager_loop1_index)
dealloc(GameManager_loop1_base)
dealloc(GameManager_loop1_max)"""

