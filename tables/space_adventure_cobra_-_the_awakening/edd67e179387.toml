[[cheat]]
id = "game-controller-ctrl-numpad-1"
name = "Game Controller (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Space_Adventure_Cobra_-_The_Awakening.exe
// Author            : ndck76
// Executable Version: 2022.3.60.25597
// Game Version      : Build.19651952
// Script Date       : 2025-08-27


[ENABLE]

aobscanregion(multilaunched,GameController:Update,GameController:Update+500,0FB686xxxx000085xx0Fxxxxxxxxxx48xxxxxxxxxxxx83xxxx0Fxxxxxxxxxx48xxxxxxxxxxxx48xxxxxxxxxxxxxxxxB9xxxxxxxx45xxxx) //GameController:Update+53
alloc(newmem,$1000,multilaunched)
alloc(data2,8)
alloc(multilaunchedbkp,7)
registersymbol(data2)
registersymbol(multilaunched)
registersymbol(multilaunchedbkp)
label(code)
label(return)

multilaunchedbkp:
  readmem(multilaunched,7)

newmem:
  mov [data2],rsi

code:
  readmem(multilaunched,7)
  jmp return

multilaunched:
  jmp newmem
  nop 2
return:

[DISABLE]

multilaunched:
  readmem(multilaunchedbkp,7)

unregistersymbol(*)
dealloc(*)"""

