[[cheat]]
id = "player-stats-base-address-scan-initialization-activate-this-first"
name = "Player Stats Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(playerstats_basepointer)
registersymbol(playerstats_update_enable)
registersymbol(playerstats_set_enable)

alloc(playerstats_basepointer, 4)
alloc(playerstats_update_enable, 4)
alloc(playerstats_set_enable, 4)


[DISABLE]
unregistersymbol(playerstats_basepointer)
unregistersymbol(playerstats_update_enable)
unregistersymbol(playerstats_set_enable)

dealloc(playerstats_basepointer)
dealloc(playerstats_update_enable)
dealloc(playerstats_set_enable)"""

[[cheat]]
id = "player-stats-base-address-scan-to-update-view-profile"
name = "Player Stats Base Address Scan (To Update: View Profile)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstats_update_exit)
label(playerstats_set_exit)

registersymbol(playerstats_savedAOB)

//00C0A36C - C7 84 24 7C030000 32000000 - mov [esp+0000037C],00000032
//00C0A377 - 0F84 5E0B0000         - je 00C0AEDB
//00C0A37D - 8B 4B 4C              - mov ecx,[ebx+4C]
//00C0A380 - 8B 53 44              - mov edx,[ebx+44]
//00C0A383 - 51                    - push ecx
//00C0A384 - 8B 4B 40              - mov ecx,[ebx+40]
//00C0A387 - 52                    - push edx
//00C0A388 - 8B 53 04              - mov edx,[ebx+04]
//00C0A38B - 51                    - push ecx
//00C0A38C - 8B 4B 3C              - mov ecx,[ebx+3C]
//00C0A38F - 52                    - push edx
//00C0A390 - 8B 53 38              - mov edx,[ebx+38]
//00C0A393 - 51                    - push ecx
//00C0A394 - 8B 4B 18              - mov ecx,[ebx+18]
//00C0A397 - 52                    - push edx
//00C0A398 - 8B 53 30              - mov edx,[ebx+30]
//00C0A39B - 51                    - push ecx
//00C0A39C - 8B 4B 34              - mov ecx,[ebx+34]
//00C0A39F - 52                    - push edx
//00C0A3A0 - 8B 53 28              - mov edx,[ebx+28]
//00C0A3A3 - 51                    - push ecx
// Pointer to Profile Stats
//00C0A3A4 - 8B 4B 1C              - mov ecx,[ebx+1C]
//00C0A3A7 - 52                    - push edx
// Pointer to Campaign Stats
//00C0A3A8 - 8B 53 14              - mov edx,[ebx+14]
//00C0A3AB - 51                    - push ecx
//00C0A3AC - 8B 4B 10              - mov ecx,[ebx+10]
//00C0A3AF - 52                    - push edx
//00C0A3B0 - 8B 53 0C              - mov edx,[ebx+0C]
aobscan(playerstats_searchedAOB, 8B 4B 4C 8B 53 44 51)

alloc(playerstats_newmem, 2048)
alloc(playerstats_temp1, 4)


playerstats_newmem:
mov [playerstats_temp1], eax

cmp dword ptr [playerstats_update_enable], #0
je playerstats_update_exit
mov [playerstats_basepointer], ebx
playerstats_update_exit:

cmp dword ptr [playerstats_set_enable], #0
je playerstats_set_exit
mov eax, [ebx+1c]
mov [eax+24c], (float)999999
playerstats_set_exit:

mov eax, [playerstats_temp1]


playerstats_originalcode:
db 8B 4B 4C 8B 53 44
//mov ecx,[ebx+4C]
//mov edx,[ebx+44]


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB:
playerstats_savedAOB:
jmp playerstats_newmem
nop
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
db 8B 4B 4C 8B 53 44
//mov ecx,[ebx+4C]
//mov edx,[ebx+44]

unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)
dealloc(playerstats_temp1)"""

