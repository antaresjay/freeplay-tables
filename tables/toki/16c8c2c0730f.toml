[[cheat]]
id = "unlimited-lives-aob"
name = "Unlimited_Lives [AoB]"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(Lives,49 89 48 08 8B C0 E8 64) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
//  dec ecx
  mov ecx,(Int)4
  mov [eax+08],ecx
  mov eax,eax
  jmp return

Lives:
  jmp newmem
  nop
return:
registersymbol(Lives)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
Lives:
  db 49 89 48 08 8B C0

unregistersymbol(Lives)
dealloc(newmem)"""
