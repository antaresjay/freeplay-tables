[[cheat]]
id = "grantitem"
name = "GrantItem"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(aobCallFunctionWithArguments,SystemReShock-Win64-Shipping.exe,40 55 53 56 57 41 54 41 55 41 56 41 57 48 81 EC 98) // should be unique
alloc(newmem,$1000,aobCallFunctionWithArguments)

label(code)
label(return)

newmem:

code:
  mov rcx,pGEngine
  mov rcx,[rcx]
  mov rcx,[rcx+D28] // game instance
  mov rcx,[rcx+38] // localplayer array
  mov rcx,[rcx] // localplayer[0]
  mov rcx,[rcx+30] // playercontroller
  mov rcx,[rcx+250] // pawn
  mov rcx,[rcx+688] // inventory

  push rbp
  push rbx
  push rsi
  push rdi
  jmp return

aobCallFunctionWithArguments:
  jmp newmem
return:
registersymbol(aobCallFunctionWithArguments)

[DISABLE]

aobCallFunctionWithArguments:
  db 40 55 53 56 57

unregistersymbol(aobCallFunctionWithArguments)
dealloc(newmem)"""

