type = "script"
source = """
define(address,CookingDevice:FixedUpdate)
define(bytes,55 48 8B EC 48 81 EC E0 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,CookingDevice:FixedUpdate)

label(code)
label(return)

newmem:
mov [rcx+F0],(float)100
code:
  push rbp
  mov rbp,rsp
