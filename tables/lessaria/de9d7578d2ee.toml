define(address,RTS_Engine.Core.Scripts.Health.EntityHealth:AddLocal+52a)
define(bytes,0F B6 87 51 01 00 00 85)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,address)

label(code)
label(return)

newmem:
  movzx eax,byte ptr [rdi+00000151] // original code

  push rbx

  mov rbx, rdi
  mov rbx, [rbx+1A0]
  mov rbx, [rbx+1A4]
