[[cheat]]
id = "godmode"
name = "GodMode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,RTSEngine.Health.FactionEntityHealth:CanAdd+50)
define(bytes,0F B6 86 62 01 00 00 85 C0 75 07 B8)


[ENABLE]
assert(address,bytes)
alloc(newmem,$1000,address)

label(code)
label(return)

newmem:
  movzx eax,byte ptr [rsi+00000162] // original code

  push rbx

  mov rbx, rsi
  mov rbx, [rbx+1A0]
  mov rbx, [rbx+1A4]
  cmp ebx, 0
  jne code
  mov eax, 0 // NoDecrease

code:
  pop rbx
  jmp return

address:
  jmp newmem
  nop 2
return:

[DISABLE]
address:
  db 0F B6 86 62 01 00 00

dealloc(newmem)"""

