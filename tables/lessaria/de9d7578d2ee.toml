  push rax
  push rbx

  mov rax, rcx
  mov rax, [rax+40]
  mov rax, [rax+1a4]

  mov rbx, rcx
  mov rbx, [rbx+40]
  mov rbx, [rbx+e0]
  mov rbx, [rbx+58]
  mov rbx, [rbx+a4]

  cmp rax, rbx
  jne newmem_exit

  mov rax, [rcx+38]
  mov rax, [rax+20]

