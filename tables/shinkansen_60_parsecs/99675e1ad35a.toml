[[cheat]]
id = "playercontroller-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerController Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerController_savedAOB)
label(PlayerController_returnhere)
label(PlayerController_originalcode)
label(PlayerController_exit)

label(PlayerController_update_exit)
label(PlayerController_set_exit)
label(PlayerController_timeset_exit)

registersymbol(PlayerController_savedAOB)

//1C544E9C - 33 C0                 - xor eax,eax
//1C544E9E - 48 89 45 C8           - mov [rbp-38],rax
// RG.Parsecs.Scavenge:PlayerController:Update+12
//1C544EA2 - 0FB6 86 88000000      - movzx eax,byte ptr [rsi+00000088]
//1C544EA9 - 85 C0                 - test eax,eax
//1C544EAB - 0F85 22040000         - jne 1C5452D3
//1C544EB1 - 48 8B 46 58           - mov rax,[rsi+58]
//1C544EB5 - 48 8B C8              - mov rcx,rax
//1C544EB8 - 83 39 00              - cmp dword ptr [rcx],00
aobscan(PlayerController_searchedAOB, 0F B6 86 88 00 00 00 85 C0 * * * * * * 48 8B 46 58)

alloc(PlayerController_newmem, 2048, PlayerController_searchedAOB)
alloc(PlayerController_temp1, 8, PlayerController_searchedAOB)
alloc(PlayerController_temp2, 8, PlayerController_searchedAOB)
alloc(PlayerController_temp3, 8, PlayerController_searchedAOB)
alloc(PlayerController_temp4, 8, PlayerController_searchedAOB)
alloc(PlayerController_temp5, 8, PlayerController_searchedAOB)


PlayerController_newmem:
mov [PlayerController_temp1], rax
mov [PlayerController_temp2], rbx
mov [PlayerController_temp3], rcx
mov [PlayerController_temp4], rdx

cmp dword ptr [PlayerController_update_enable], #0
je PlayerController_update_exit
mov [PlayerController_basepointer], rsi
PlayerController_update_exit:

cmp dword ptr [PlayerController_set_enable], #0
je PlayerController_set_exit
PlayerController_set_exit:

cmp dword ptr [PlayerController_timeset_enable], #0
je PlayerController_timeset_exit
mov rbx, [rsi+48]
test rbx, rbx
je PlayerController_timeset_exit
mov rbx, [rbx+80]
test rbx, rbx
je PlayerController_timeset_exit
mov [rbx+38], #30
je PlayerController_timeset_exit
PlayerController_timeset_exit:

mov rax, [PlayerController_temp1]
mov rbx, [PlayerController_temp2]
mov rcx, [PlayerController_temp3]
mov rdx, [PlayerController_temp4]


PlayerController_originalcode:
db 0F B6 86 88 00 00 00
//movzx eax,byte ptr [rsi+00000088]


PlayerController_exit:
jmp PlayerController_returnhere


PlayerController_searchedAOB:
PlayerController_savedAOB:
jmp PlayerController_newmem
nop
nop
PlayerController_returnhere:


[DISABLE]
PlayerController_savedAOB:
db 0F B6 86 88 00 00 00
//movzx eax,byte ptr [rsi+00000088]

unregistersymbol(PlayerController_savedAOB)

dealloc(PlayerController_newmem)
dealloc(PlayerController_temp1)
dealloc(PlayerController_temp2)
dealloc(PlayerController_temp3)
dealloc(PlayerController_temp4)
dealloc(PlayerController_temp5)"""

