[[cheat]]
id = "infinite-item-usage-set-minimum-amount-on-use-sell"
name = "Infinite Item Usage / Set Minimum Amount On Use/Sell"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(InfItemUsageAOB1,$process,8B 7F 08 48 83 C3 D8 48 8B CB 48 89 6C 24 30 8B D6 E8 ?? ?? ?? ??) // should be unique
registersymbol(InfItemUsageAOB1)
alloc(newmem,1024,InfItemUsageAOB1)

///
//aobscanmodule(InfItemUsageAOB2,$process,41 FF 50 40 29 E8 79 04 31 DB) // should be unique
aobscanmodule(InfItemUsageAOB2,$process,41 FF 50 40 2B C5 79 04 33 DB) // should be unique
registersymbol(InfItemUsageAOB2)
alloc(newmem2,1024,InfItemUsageAOB2)

///
label(return)
label(SetMinimumAmt)
registersymbol(SetMinimumAmt)

///
label(return2)

///
newmem:
  { Do Infinite Item}
  test r14d,r14d
  js SkipInfItem
  xor r14,r14
  { Now Do Minimum Item Amount }
SkipInfItem:
originalcode:
  mov [R15Save],r15
  mov r15,rdi
  mov edi,[rdi+08]
  add rbx,-28
  cmp edi,[SetMinimumAmt]
  jge MyCleanUp1
  mov edi,[SetMinimumAmt]
  mov [r15+08],edi
  jmp MyCleanUp1

MyCleanUp1:
  mov r15,[R15Save]
  jmp return
  
R15Save:
dq 0
SetMinimumAmt:
dq #10

newmem2:
  test ebp,ebp
  js SkipInfItem2
  xor ebp,ebp
SkipInfItem2:
originalcode2:
  call qword ptr [r8+40]
  cmp eax,[SetMinimumAmt]
  jge SkipSetMinimumAmt2
  mov eax,[SetMinimumAmt]
SkipSetMinimumAmt2:
  sub eax,ebp
  jmp return2
  
///
InfItemUsageAOB1:
  jmp newmem
  nop
  nop
  return:

InfItemUsageAOB2:
  jmp newmem2
  nop
  return2:
  
[DISABLE]

///
InfItemUsageAOB1:
 db 8B 7F 08 48 83 C3 D8

unregistersymbol(InfItemUsageAOB1)
unregistersymbol(SetMinimumAmt)

///
InfItemUsageAOB2:
  db 41 FF 50 40 2B C5

unregistersymbol(InfItemUsageAOB2)
  
dealloc(newmem)
dealloc(newmem2)"""

