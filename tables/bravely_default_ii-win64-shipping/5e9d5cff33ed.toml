[[cheat]]
id = "always-drop-item-either-common-rare-or-override-item-id"
name = "Always Drop Item (Either Common, Rare, Or Override Item ID)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

{ This is where item drop is determined }
aobscanmodule(AlwaysDropAOB1,$process,0F 9E C0 84 C0 74 3C 8B 85 8C 01 00 00) // should be unique
registersymbol(AlwaysDropAOB1)
alloc(newmem,1024,AlwaysDropAOB1)

///
label(return)

///
newmem:
  mov rax,iOverrideItemID
  mov rax,[rax]
  cmp rax,0
  jne OverrideDropItem
  mov rax,bRareItemDrop
  mov rax,[rax]
  cmp eax,1
  je ItemDropRare
  jmp ItemDropCommon
ItemDropCommon:
  xor rax,rax
  mov eax,[rbp+0000018C]
  jmp return
ItemDropRare:
  xor rax,rax
  mov eax,[rbp+00000184]
  jmp return
OverrideDropItem:
  mov [R15Save],r15
  mov r15,iOverrideItemID
  mov qword ptr [r15],0
  mov r15,[R15Save]
  jmp return

R15Save:
dq 0
  
///
AlwaysDropAOB1:
  jmp newmem
  nop
  nop
  nop
  nop
  nop
  nop
  nop
  nop
  return:
  
[DISABLE]
 
///
AlwaysDropAOB1:
 db 0F 9E C0 84 C0 74 3C 8B 85 8C 01 00 00

unregistersymbol(AlwaysDropAOB1)
  
dealloc(newmem)"""

