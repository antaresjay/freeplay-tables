[[cheat]]
id = "active-trainer"
name = "Active Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)

aobscan(Active,D9 87 48 02 00 00 DE E9 83 EC 08 83 EC 04 D9 1C 24 50 39 00)
registersymbol(Active)

registersymbol(hungerE)
registersymbol(infectionE)
registersymbol(staminaE)
registersymbol(healthE)
label(healthE)
label(staminaE)
label(infectionE)
label(hungerE)

label(stamina)
label(infection)
label(hunger)
//
newmem: //t//his is allocated memory, you have read,write,execute access
//place your code here


cmp [healthE],0
je stamina
mov [edi+c8],(float)100
stamina:
cmp [staminaE],0
je infection
mov [edi+248],(float)1
infection:
cmp [infectionE],0
je hunger
mov [edi+264],(float)0
hunger:
cmp [hungerE],0
je originalcode
mov [edi+244],(float)1

originalcode:
fld dword ptr [edi+00000248]
//244 hungry f1
//248 stamina f1
//264 infection f0
//c8 health f100
jmp returnhere
healthE:
dd 0
staminaE:
dd 0
infectionE:
dd 0
hungerE:
dd 0
Active:
jmp newmem
nop
returnhere:

//TDLPlayer:SetHeadBobTargets+8f
 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
Active:
fld dword ptr [edi+00000248]
//Alt: db D9 87 48 02 00 00
unregistersymbol(hungerE)
unregistersymbol(infectionE)
unregistersymbol(staminaE)
unregistersymbol(healthE)
unregistersymbol(Active)"""

