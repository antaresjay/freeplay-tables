fld dword ptr [edi+19c]
jmp returnhere

consstruction:
jmp newmem
nop
returnhere:




[DISABLE]
dealloc(newmem)
consstruction:
fld dword ptr [edi+19c]
unregistersymbol(consstruction)"""
