source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
aobscanmodule(consstruction,generals.exe,D9 87 9C 01 00 00 8B 0D)
registersymbol(consstruction)


newmem:
push esi
mov esi,[edi+174]
cmp esi,100000
jng originalcode
fld [esi+14]
fstp [esi+8]
