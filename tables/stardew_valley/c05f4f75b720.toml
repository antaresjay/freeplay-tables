[[cheat]]
id = "junimo-kart-game-pointer"
name = "Junimo Kart Game Pointer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(mineCart,55 8B EC 57 56 53 81 EC 70 06) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

// Custom code caves & flags
alloc(mineCart_ptr,64)
alloc(lives_enable,64)
alloc(fly_enable,64)
alloc(speed_enable,64)

label(livesCode)
label(flyCode)
label(speedCode)

// New code

newmem:
livesCode:
  cmp [lives_enable],1
  jne flyCode
  mov [ecx+8c],#9

flyCode:
  cmp [fly_enable],1
  jne speedCode
  mov [ecx+9c], (float)-120

speedCode:
  cmp [speed_enable],1
  jne speedDisable
  mov [ecx+48], (float)1
  jmp code

speedDisable:
  cmp [speed_enable],0
  jne code
  mov [ecx+48], (float)0.085

code:
  mov [mineCart_ptr], ecx
  push ebp
  mov ebp,esp
  push edi
  push esi
  jmp return

mineCart:
  jmp newmem
return:
registersymbol(mineCart)
registersymbol(mineCart_ptr)

registersymbol(lives_enable)
registersymbol(fly_enable)
registersymbol(speed_enable)

[DISABLE]

mineCart:
  db 55 8B EC 57 56

unregistersymbol(mineCart)
unregistersymbol(mineCart_ptr)

unregistersymbol(lives_enable)
unregistersymbol(fly_enable)
unregistersymbol(speed_enable)
dealloc(newmem)
dealloc(mineCart_ptr)
dealloc(lives_enable)
dealloc(fly_enable)
dealloc(speed_enable)

