alloc(newmem,$1000)

label(code)
label(return)
label(stackable_ptr)

newmem:
  mov [stackable_ptr], ecx

code:
  push ebp
  mov ebp,esp
  push esi
  mov esi,ecx
  jmp return

stackable_ptr:
  dd 0

stack:
  jmp newmem
  nop
return:
registersymbol(stack)
registersymbol(stackable_ptr)

[DISABLE]

stack:
  db 55 8B EC 56 8B F1

unregistersymbol(stack)
unregistersymbol(stackable_ptr)
