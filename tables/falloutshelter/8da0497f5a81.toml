[[cheat]]
id = "add-max-happiness"
name = "Add Max Happiness"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@ModEngine
[ENABLE]

aobscan(happiness,F3 0F 11 6E 18 48 8D)
alloc(newmem,$1000,happiness)

label(code)
label(return)

newmem:

code:
  movss xmm5,[new]
  movss [rsi+18],xmm5
  jmp return

new:
dd (float)100

happiness:
  jmp newmem
return:
registersymbol(happiness)

[DISABLE]

happiness:
  db F3 0F 11 6E 18

unregistersymbol(happiness)
dealloc(newmem)"""
