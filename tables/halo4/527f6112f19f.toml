[[cheat]]
id = "no-reload"
name = "No Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]



aobscanmodule(reload_aob,halo4.dll,66 29 AB ae 05 00 00) // should be unique
alloc(newmem,$1000,reload_aob)

label(code)
label(return)

newmem:

code:
  jmp return

reload_aob:
  jmp newmem
  nop 2
return:
registersymbol(reload_aob)

[DISABLE]

reload_aob:
  db 66 29 AB ae 05 00 00

unregistersymbol(reload_aob)
dealloc(newmem)"""

