[[cheat]]
id = "player-base-address-scan-initialization-activate-this-first-to-activate-play-level"
name = "Player Base Address Scan Initialization (Activate This First, To Activate: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Player_basepointer)
registersymbol(Player_update_enable)
registersymbol(Player_healthset_enable)
registersymbol(Player_manaset_enable)
registersymbol(Player_shuffleset_enable)
registersymbol(Player_statsset_enable)
registersymbol(Player_resourcesset_enable)
registersymbol(Player_lootset_enable)

//09840863 - B8 D46A4A15           - mov eax,154A6AD4 : [3C3467ED]
//09840868 - D9 00                 - fld dword ptr [eax]
// Player:Update+32
//0984086A - D9 9F C0010000        - fstp dword ptr [edi+000001C0]
//09840870 - 8B 47 40              - mov eax,[edi+40]
//09840873 - B9 D86A4A15           - mov ecx,154A6AD8 : [(float)1.0000]
//09840878 - D9 01                 - fld dword ptr [ecx]
//0984087A - D9 5C 24 04           - fstp dword ptr [esp+04]
//0984087E - 89 04 24              - mov [esp],eax
aobscan(Player_initialization_searchedAOB, D9 9F C0 01 00 00 8B 47 40 * * * * * D9 01)

alloc(Player_basepointer, 4, Player_initialization_searchedAOB)
alloc(Player_update_enable, 4, Player_initialization_searchedAOB)
alloc(Player_healthset_enable, 4, Player_initialization_searchedAOB)
alloc(Player_manaset_enable, 4, Player_initialization_searchedAOB)
alloc(Player_shuffleset_enable, 4, Player_initialization_searchedAOB)
alloc(Player_statsset_enable, 4, Player_initialization_searchedAOB)
alloc(Player_resourcesset_enable, 4, Player_initialization_searchedAOB)
alloc(Player_lootset_enable, 4, Player_initialization_searchedAOB)


[DISABLE]
unregistersymbol(Player_basepointer)
unregistersymbol(Player_update_enable)
unregistersymbol(Player_healthset_enable)
unregistersymbol(Player_manaset_enable)
unregistersymbol(Player_shuffleset_enable)
unregistersymbol(Player_statsset_enable)
unregistersymbol(Player_resourcesset_enable)
unregistersymbol(Player_lootset_enable)

dealloc(Player_basepointer)
dealloc(Player_update_enable)
dealloc(Player_healthset_enable)
dealloc(Player_manaset_enable)
dealloc(Player_shuffleset_enable)
dealloc(Player_statsset_enable)
dealloc(Player_resourcesset_enable)
dealloc(Player_lootset_enable)"""

[[cheat]]
id = "player-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Player Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Player_savedAOB)
label(Player_returnhere)
label(Player_originalcode)
label(Player_exit)

label(Player_update_exit)
label(Player_healthset_exit)
label(Player_manaset_exit)
label(Player_shuffleset_exit)
label(Player_statsset_exit)
label(Player_resourcesset_exit)
label(Player_lootset_exit)

registersymbol(Player_originalcode)
registersymbol(Player_savedAOB)

//09840863 - B8 D46A4A15           - mov eax,154A6AD4 : [3C3467ED]
//09840868 - D9 00                 - fld dword ptr [eax]
// Player:Update+32
//0984086A - D9 9F C0010000        - fstp dword ptr [edi+000001C0]
//09840870 - 8B 47 40              - mov eax,[edi+40]
//09840873 - B9 D86A4A15           - mov ecx,154A6AD8 : [(float)1.0000]
//09840878 - D9 01                 - fld dword ptr [ecx]
//0984087A - D9 5C 24 04           - fstp dword ptr [esp+04]
//0984087E - 89 04 24              - mov [esp],eax
aobscan(Player_searchedAOB, D9 9F C0 01 00 00 8B 47 40 * * * * * D9 01)

alloc(Player_newmem, 2048, Player_searchedAOB)
alloc(Player_temp1, 4, Player_searchedAOB)
alloc(Player_temp2, 4, Player_searchedAOB)
alloc(Player_temp3, 4, Player_searchedAOB)
alloc(Player_temp4, 4, Player_searchedAOB)
alloc(Player_temp5, 4, Player_searchedAOB)


Player_newmem:
mov [Player_temp1], eax
mov [Player_temp2], ebx
mov [Player_temp3], ecx
mov [Player_temp4], edx

cmp dword ptr [Player_update_enable], #0
je Player_update_exit
mov [Player_basepointer], edi
Player_update_exit:

cmp dword ptr [Player_healthset_enable], #0
je Player_healthset_exit
mov ebx, [edi+3c]
test ebx, ebx
je Player_healthset_exit
fld [ebx+24]
fstp [ebx+20]
mov [ebx+28], #9999
Player_healthset_exit:

cmp dword ptr [Player_manaset_enable], #0
je Player_manaset_exit
fild [edi+198]
fst [edi+1a4]
mov ebx, [edi+158]
test ebx, ebx
je Player_manaset_exit
fstp [ebx+98]
Player_manaset_exit:

cmp dword ptr [Player_shuffleset_enable], #0
je Player_shuffleset_exit
mov ebx, [edi+158]
test ebx, ebx
je Player_shuffleset_exit
mov [ebx+88], (float)-1
Player_shuffleset_exit:

cmp dword ptr [Player_statsset_enable], #0
je Player_statsset_exit
mov [edi+194], #9999
mov [edi+1ac], #9999
mov ebx, [edi+10]
test ebx, ebx
je Player_statsset_exit
mov ebx, [ebx+10c]
test ebx, ebx
je Player_statsset_exit
mov [ebx+108], (float)9999

mov ebx, [edi+cc]
test ebx, ebx
je Player_statsset_exit
mov [ebx+b0], #9999
mov [ebx+c4], #9999
mov [ebx+d0], #9
mov [ebx+e4], #9999

Player_statsset_exit:

cmp dword ptr [Player_resourcesset_enable], #0
je Player_resourcesset_exit
mov ebx, [edi+10]
test ebx, ebx
je Player_resourcesset_exit
mov ebx, [ebx+110]
test ebx, ebx
je Player_resourcesset_exit
mov [ebx+140], #9999999
mov ebx, [edi+18]
test ebx, ebx
je Player_resourcesset_exit
mov ebx, [ebx+1c]
test ebx, ebx
je Player_resourcesset_exit
mov [ebx+94], #9999
mov [ebx+98], #9999
Player_resourcesset_exit:

cmp dword ptr [Player_lootset_enable], #0
je Player_lootset_exit
mov ebx, [edi+10]
test ebx, ebx
je Player_lootset_exit
mov [ebx+164], (float)9999
mov ebx, [ebx+10c]
test ebx, ebx
je Player_lootset_exit
mov [ebx+10c], (float)9999
mov [ebx+110], #5
//mov [ebx+114], #5
mov [ebx+118], #5
Player_lootset_exit:

mov eax, [Player_temp1]
mov ebx, [Player_temp2]
mov ecx, [Player_temp3]
mov edx, [Player_temp4]


Player_originalcode:
readmem(Player_searchedAOB, 6)


Player_exit:
jmp Player_returnhere


Player_searchedAOB:
Player_savedAOB:
jmp Player_newmem
nop
Player_returnhere:


[DISABLE]
Player_savedAOB:
readmem(Player_originalcode, 6)

unregistersymbol(Player_originalcode)
unregistersymbol(Player_savedAOB)

dealloc(Player_newmem)
dealloc(Player_temp1)
dealloc(Player_temp2)
dealloc(Player_temp3)
dealloc(Player_temp4)
dealloc(Player_temp5)"""

