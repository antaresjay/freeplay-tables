[[cheat]]
id = "hell-time-effect"
name = "Hell-time Effect"
category = "game"
description = ""
hint = ""
type = "script"
source = """
{ Process: Doom3BFG.exe
  Version: 1.1400.34.1428
  Date   : 2015-07-25
  Author : gameplayer
}

[ENABLE]
aobscan(_HTEA,6A 05 8B CF E8 ? ? ? ? 84 C0 75 0B)
aobscan(_ASE1,6A 04 8B CE E8 ? ? ? ? 84 C0 74 07)
aobscan(_ASE2,6A 06 8B C8 E8 ? ? ? ? 84 C0 74 03 B0 01 C3)
aobscan(_ASE3,8B 81 F4 17 00 00 8B 4D 08 BA 01 00 00 00 D3 E2 23 C2 F7 D8 1B C0 F7 D8 50 E8)
alloc(mCopy,$400)
label(StatusCheck)

mCopy:
readmem(_HTEA,$10)
readmem(_ASE1,$10)
readmem(_ASE2,$10)
StatusCheck:
mov eax,[0108c9e4]
test eax,eax
je +01
ret
mov ecx,[00D0DC48]
mov eax,[ecx+00002318]
and eax,00000FFF
mov ecx,[00D0DC48+eax*4]
mov al,[ecx+000008B8]
movsx eax,al
ret

_HTEA:
call StatusCheck
test eax,eax
jne _HTEA+0D
jmp _HTEA+18
db 90 90

_ASE1:
or eax,-01
pop esi
ret
db 90 90 90 90

_ASE2:
xor al,al
ret

_ASE3:
mov eax,31
db 90

registersymbol(_HTEA)
registersymbol(_ASE1)
registersymbol(_ASE2)
registersymbol(_ASE3)
registersymbol(mCopy)

[DISABLE]
_HTEA:
readmem(mCopy,$0D)

_ASE1:
readmem(mCopy+10,$0D)

_ASE2:
readmem(mCopy+20,$0D)

_ASE3:
db 8B 81 F4 17 00 00

unregistersymbol(_HTEA)
unregistersymbol(_ASE1)
unregistersymbol(_ASE2)
unregistersymbol(_ASE3)
unregistersymbol(mCopy)
dealloc(mCopy)"""

