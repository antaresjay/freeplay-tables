[[cheat]]
id = "firing-rate-adjustments"
name = "Firing Rate Adjustments"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
Process: Doom3BFG.exe
Version: 1.1400.34.1428
Date   : 2015-07-09
Author : gameplayer
This script reduces cooldown duration.
Weapons: pistol, rocket laucher, machine gun, plasma gun.
Warning: For safety reason, only small adjustments have been used.
}

[ENABLE]
aobscanmodule(_Cooldown,Doom3BFG.exe,8B 57 08 8B 4A 04 8B 50 04 D9 04 11 8B 45 F0 D9 18 E9)
alloc(newmem,$1000)

label(code)
label(_fail)
label(_CWP)
newmem:
_CWP:
dd 0 //pointer storage
dd 0 //disabled
dd (float)1.0 //pistol (no. 2)
dd (float)0.5 //it doesn't work with shotgun (no. 3)
dd (float)1.5 //super shotgun (no. 4)
dd (float)0.09375 //machine gun (no. 5)
dd 0 //disabled
dd 0 //disabled
dd (float)0.1 //plasma gun (no. 8)
dd (float)1.5 //rocket launcher (no. 9)
dd 0 //disabled
dd 0
dd 0
dd 0
dd 0
code:
mov ecx,[00D0DC48]
mov edx,[ecx+00002318]
mov ecx,edx
and edx,00000FFF
sar ecx,0C
cmp [edx*4+00D11C48],ecx
jne _fail
mov ecx,[edx*4+00D0DC48]
mov [_CWP],ecx
add ecx,A8
cmp ecx,eax
jne _fail
mov edx,[edi+08]
mov ecx,[edx+04]
mov edx,[eax+04]
cmp ecx,40
jne +07
fldz
jmp _Cooldown+0C
fld dword ptr [ecx+edx]
cmp ecx,20
jne _Cooldown+0C
mov eax,[00D0DC48]
mov eax,[eax+0000293C]
cmp eax,02
jb _Cooldown+0C
cmp eax,0A
ja _Cooldown+0C
cmp dword ptr [_CWP+eax*4],00
je _Cooldown+0C
fsub [_CWP+eax*4]
jmp _Cooldown+0C
_fail:
mov edx,[edi+08]
mov ecx,[edx+04]
mov edx,[eax+04]
fld dword ptr [ecx+edx]
jmp _Cooldown+0C

_Cooldown:
  jmp code
  nop

registersymbol(_Cooldown)
registersymbol(_CWP)

[DISABLE]
_Cooldown:
  db 8B 57 08 8B 4A 04 8B 50 04 D9 04 11 8B 45 F0 D9 18 E9

unregistersymbol(_CWP)
unregistersymbol(_Cooldown)
dealloc(newmem)"""

