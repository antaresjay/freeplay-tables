[[cheat]]
id = "trivial-fix"
name = "Trivial Fix"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Process: Doom3BFG.exe
  Version: 1.1400.34.1428
  Date   : 2015-07-12
  Author : gameplayer

  This script fixes a trivial problem about switching weapons after Soul Cube is used.
  Problem occurs after one switches back to Soul Cube from PDA screen.
}

[ENABLE]
aobscanmodule(_WTA,Doom3BFG.exe,8B 86 3C 29 00 00 3B 86 44 23 00 00 74 29 6A 00 50) // should be unique
alloc(newmem,$800)

label(code)
label(return)

newmem:
dd 0
code:
lea eax,[esi+0000293C]
mov edx,[esi+00002344]
cmp edx,[eax+04]
jne +0E
mov edx,[eax+0C]
mov [newmem],edx
jmp return
mov eax,[eax]
cmp eax,edx
jne return
mov edx,[newmem]
mov [esi+00002948],edx
jmp return+29

_WTA:
  jmp code
  db 90 90 90 90 90 90 90 90 90
return:
registersymbol(_WTA)

[DISABLE]
_WTA:
  db 8B 86 3C 29 00 00 3B 86 44 23 00 00 74 29 6A 00 50

unregistersymbol(_WTA)
dealloc(newmem)"""

