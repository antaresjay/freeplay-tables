[[cheat]]
id = "god-mode-keep-health-at-200"
name = "God mode (keep health at 200)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,Doom3BFG.exe,8B 86 D8 00 00 00 50) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov [esi+000000D8],C8
  mov eax,[esi+000000D8]
  jmp return

INJECT:
  jmp newmem
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 8B 86 D8 00 00 00

unregistersymbol(INJECT)
dealloc(newmem)

Doom3BFG.exe+1FF87B:
  mov eax,[esi+000000D8]"""

