[[cheat]]
id = "right-click-change-script-for-info-here"
name = "Right click -> change script for info HERE"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{

Doom 3 BFG Main Game scripts:
"God mode (refined)" means, that in this script your health will be
reset to 200 once you've been damaged. I've included this variant
because with the other one - which "nullifies" the damage - makes the
screen fade out if your health is low and/or you get heavy damage. This
might be because the game thinks you SHOULD be dead, but you are not.

"No nightmare damage" changes the amount of damage you get every
few seconds in a hardcore game to zero. You're still vulnerable
to everything else tho.

"Unlimited ammo (loaded)" gives your weapons unlimited ammo, no
need to reload.
"Unlimited ammo (total)" won't decrease your total ammo once
you're reloading.

The stuff and yada yada:
-health, ammo and armor are saved as a 4 byte value, however
 you might get multiple results and have to find the one which
 actually changes your current amount
-stamina is saved as a float value (24 for full)
-oxygen and flashlight are saved as 4 byte values (30000 when full)

--- --- --- --- --- --- --- --- --- --- --- --- --- --- --- --- ---

Doom 3 BFG Edition: Doom 1 & Doom 2 stuff:
The pointers seem good. To freeze your health at a specific value
(I would recommend using a higher one than 100 on the higher
difficulties) you have  to freeze BOTH, the display AND the
"internal" value.
Same goes for the scripts, if you don't activate both, it won't
work. YOU WILL DIE! :O
Also I'd recommend using the scripts and not freezing the pointers
for health, as at least the pointer for "Health (internal)" seems
a bit jumpy.
Deactivating the scripts might not work... yeah, I MIGHT be
fixing that.

Kill a caco for me! ~CyberD3m0n

}
[ENABLE]
[DISABLE]"""

