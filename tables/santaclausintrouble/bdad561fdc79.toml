[[cheat]]
id = "float-gravity"
name = "Float/Gravity"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(_gravity,SantaClausInTrouble.exe,D9 42 04 D8 85 A0 FE FF FF)
alloc(newmem,$1000)
label(return)
registersymbol(_gravity)
newmem:
  mov [edx+04],(float).5
  fld dword ptr [edx+04]
  fadd dword ptr [ebp-160]
  jmp return
_gravity:
  jmp newmem
  nop 4
return:
[DISABLE]
dealloc(newmem)
unregistersymbol(_gravity)
_gravity:
  db D9 42 04 D8 85 A0 FE FF FF"""

