[[cheat]]
id = "drakensang-the-dark-eye-aob-script-works-but-not-updating-stats-correctly-the-same-index-may-be-of-use-at-multiple-chars"
name = "Drakensang The Dark Eye AOB script (works, but not updating stats correctly; the same index may be of use at multiple chars!)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game   : drakensang.exe
// Version:
// Date   :
// Author : Cs
[ENABLE]
aobscanmodule(aobGrabPointerPerSec,drakensang.exe,89 45 AC 8B 4D AC E8 ?? ?? ?? ?? 89 45 F4 83 7D F4 00)
aobscanmodule(aobUpdater,drakensang.exe,8B 4D 10 89 08 8B 45 EC 0F B6 80 ?? ?? 00 00 85 C0)

alloc(newmemUpdater,4096,aobUpdater)

label(aobGrabPointerPerSec_r)
label(aobGrabPointerPerSec_i)
registersymbol(aobGrabPointerPerSec_r)
registersymbol(aobGrabPointerPerSec_i)

label(lblGrabPointerPerSec)
label(lblGrabPointerPerSecSkip)
label(lblGrabPointerPerSecRet)

label(pPointerBase)
label(pPCArray)
label(iCurrentChar)
label(iSize)
label(iCount)
label(pCurrentChar)
registersymbol(pPointerBase)
registersymbol(pPCArray)
registersymbol(iCurrentChar)
registersymbol(iSize)
registersymbol(iCount)
registersymbol(pCurrentChar)

label(aobUpdater_r)
label(aobUpdater_i)
registersymbol(aobUpdater_r)
registersymbol(aobUpdater_i)

label(lblUpdater)
label(lblUpdaterSkipVitality)
label(lblUpdaterSkipEndurance)
label(lblUpdaterSkipAstralEnergy)
label(lblUpdaterSkipAP)
label(lblUpdaterSkipXP)
label(lblUpdaterSkip)
label(lblUpdaterDone)
label(lblUpdaterRet)

label(bEnableVIHack)
label(bEnableEDHack)
label(bEnableAEHack)
label(bEnableAPHack)
label(bEnableXPHack)
label(iDesiredAP)
label(iDesiredXP)

registersymbol(bEnableVIHack)
registersymbol(bEnableEDHack)
registersymbol(bEnableAEHack)
registersymbol(bEnableAPHack)
registersymbol(bEnableXPHack)
registersymbol(iDesiredAP)
registersymbol(iDesiredXP)

newmemUpdater:
bEnableVIHack:
dd 1
bEnableEDHack:
dd 1
bEnableAEHack:
dd 1
bEnableAPHack:
dd 0
bEnableXPHack:
dd 0
iDesiredAP:
dd (int)20000
iDesiredXP:
dd (int)20000

lblGrabPointerPerSec:
mov dword ptr [pPointerBase],eax
push ebx
mov ebx,[eax+20]
test ebx,ebx
jz short lblGrabPointerPerSecSkip
cmp word ptr [ebx+c],'PC'
jne short lblGrabPointerPerSecSkip
cmp dword ptr [ebx+34],2
jne short lblGrabPointerPerSecSkip
push ebx
mov ebx,[ebx+44]
mov dword ptr [iCurrentChar],ebx
pop ebx
mov ebx,[ebx+40]
test ebx,ebx
jz short lblGrabPointerPerSecSkip
mov dword ptr [pPointerBase],ebx
push ecx
mov ecx,[ebx+A4]
mov dword ptr [pPCArray],ecx
mov ecx,[ebx+9c]
mov dword ptr [iCount],ecx
mov ecx,[ebx+98]
mov dword ptr [iSize],ecx
mov ebx,[iCurrentChar]
imul ebx,[iSize]
add ebx,[pPCArray]
mov dword ptr [pCurrentChar],ebx
pop ecx
lblGrabPointerPerSecSkip:
pop ebx
readmem(aobGrabPointerPerSec,6)
jmp lblGrabPointerPerSecRet
aobGrabPointerPerSec_i:
readmem(aobGrabPointerPerSec,6)
pPointerBase:
dd 0
pPCArray:
dd 0
iCurrentChar:
dd 0
iSize:
dd 0
iCount:
dd 0
pCurrentChar:
dd 0

lblUpdater:
pushad
sub eax,[pPCArray]
js lblUpdaterSkip
mov ebx,[iSize]
test ebx,ebx
jz lblUpdaterSkip
xor edx,edx
div bx
movsx ecx,ax
cmp dword ptr [iCount],ecx
jl lblUpdaterSkip
mov eax,[pPCArray]
mov ebx,[iSize]
imul ebx,ecx
lea ebx,[eax+ebx]
mov eax,[ebp-04]
mov ecx,[ebp+10]
cmp edx,354
jne short lblUpdaterSkipVitality
cmp dword ptr [bEnableVIHack],1
jne lblUpdaterSkip
mov edx,[ebx+334]
mov [eax],edx
jmp lblUpdaterDone
lblUpdaterSkipVitality:
cmp edx,358
jne short lblUpdaterSkipEndurance
cmp dword ptr [bEnableEDHack],1
jne lblUpdaterSkip
mov edx,[ebx+33c]
mov [eax],edx
jmp lblUpdaterDone
lblUpdaterSkipEndurance:
cmp edx,35c
jne short lblUpdaterSkipAstralEnergy
cmp dword ptr [bEnableAEHack],1
jne lblUpdaterSkip
mov edx,[ebx+340]
mov [eax],edx
jmp lblUpdaterDone
lblUpdaterSkipAstralEnergy:
cmp edx,404
jne short lblUpdaterSkipAP
cmp dword ptr [bEnableAPHack],1
jne lblUpdaterSkip
mov edx,[iDesiredAP]
cmp ecx,edx
jge lblUpdaterSkip
mov [eax],edx
jmp lblUpdaterDone
lblUpdaterSkipAP:
cmp edx,408
jne short lblUpdaterSkipXP
cmp dword ptr [bEnableXPHack],1
jne lblUpdaterSkip
mov edx,[iDesiredXP]
cmp ecx,edx
jge lblUpdaterSkip
mov [eax],edx
jmp lblUpdaterDone
lblUpdaterSkipXP:
lblUpdaterSkip:
popad
readmem(aobUpdater,5)
jmp lblUpdaterRet
lblUpdaterDone:
mov [ebp+10],edx
popad
jmp lblUpdaterRet
aobUpdater_i:
readmem(aobUpdater,5)

aobUpdater:
aobUpdater_r:
jmp lblUpdater
lblUpdaterRet:

aobGrabPointerPerSec:
aobGrabPointerPerSec_r:
jmp lblGrabPointerPerSec
nop
lblGrabPointerPerSecRet:

[DISABLE]
aobGrabPointerPerSec_r:
readmem(aobGrabPointerPerSec_i,6)

unregistersymbol(aobGrabPointerPerSec_r)
unregistersymbol(aobGrabPointerPerSec_i)

unregistersymbol(pPointerBase)
unregistersymbol(pPCArray)
unregistersymbol(iCurrentChar)
unregistersymbol(iSize)
unregistersymbol(iCount)
unregistersymbol(pCurrentChar)

aobUpdater_r:
readmem(aobUpdater_i,5)

unregistersymbol(aobUpdater_r)
unregistersymbol(aobUpdater_i)

unregistersymbol(bEnableVIHack)
unregistersymbol(bEnableEDHack)
unregistersymbol(bEnableAEHack)
unregistersymbol(bEnableAPHack)
unregistersymbol(bEnableXPHack)
unregistersymbol(iDesiredAP)
unregistersymbol(iDesiredXP)

dealloc(newmemUpdater)"""

