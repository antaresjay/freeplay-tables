[[cheat]]
id = "right-click-here-change-script-for-info"
name = "Right click HERE -> change script for info!"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
Hiya and welcome to another table! This one is made for the "Dead Island"
main game/definitive edition on Steam. I've tested and created it with
Steam Build #1837542 in mind.
It also seems to work on Dead Island: Riptide, Steam Build #1837531.
Definitive Edition of course.

Since pointer scans weren't very satisfactory I've just sticked to some
scripts. Contained are the following ones:

* Freeze health ('god mode'):
  This one won't allow your current health to change. Activate it
  when you're at full health, as you won't be able to heal up.

  PROBLEM: Pitfalls and excessive damage (suiciders) can still kill
  you. Your best bet is to reload the last checkpoint once that
  happens because the game will think you're not really dead, kill
  you again and again and take your hard earned money from you.

* Keep health at 250:
  To 'simulate' a god mode I've used a very commonly running instruction
  which changes the health value to 250 every microsecond. Ok I dunno
  if it is at every microsecond, but it's triggered very often in a
  moments time.

  PROBLEM: See above.

* Fury always full:
  My try to keep fury at an amount so you can always trigger it. Seems to
  work, I didn't test it that much however.

* Keep health at 999:
  This is me having a try to push your health up so far that even
  suiciders won't kill you. Pitfalls still will do though.

  PROBLEM: See "Freeze health ('god mode').

* Unlimited stamina:
  Your stamina won't decrease when you're running. Actually, the script
  resets it back to full once you start rushing around.

* Unlimited items:
  Your items (medkits, molotovs, grenades) won't decrease once you
  use them. -> NEED TO CHECK FOR CRAFTING MATERIALS <-

* Unlimited ammo (weapons):
  With this script you won't run out of ammo. You can keep shooting
  without your (loaded) ammo count going down. If you're manually
  reloading, you'll still lose ammo from your stash if your magazine
  wasn't full.

* Unlimited flashlight power:
  Does what it says; your flashlight won't run out of power.

* Unlimited durability:
  Your weapons will repair after hitting one enemy (or doing
  something that usually would damage your weapon). I've
  selected a float of "100" as the new durability your weapon
  would have, although most weapons won't come close to
  this amount.

* Faster leveling (5K XP for every increase):
  Should your experience increase you'll get 5.000 XP for whatever
  you did (killing a zombie, finishing a quest, dismembering a
  limb et cetera). It just overrides what you'd get normally.
  So if let's say a quest would give you 20.000 XP you'd still
  only get 5K. So choose the script that's to your liking.

* Faster leveling (10K XP for every increase):
  See above.

* Faster leveling (20K XP for every increase):
  See above.

* Faster leveling (50K XP for every increase):
  See above.

* Opening inventory grants 25K money:
  You'll get 25K dollars every time you open your inventory or
  complete an "inventory action" (selling, buying, clicking
  through menus could all trigger this script).

* Opening inventory grants 50K money:
  You'll get 50K dollars every time you open your inventory or
  complete an "inventory action" (selling, buying, clicking
  through menus could all trigger this script).

* Opening inventory grants 100K money:
  You'll get 100K dollars every time you open your inventory or
  complete an "inventory action" (selling, buying, clicking
  through menus could all trigger this script).

I've fiddled around with those for an extended time period, however
I can't guarantee that they won't cause some issues here and there.

Curious, the original Dead Island release used the Valve Anti-Cheat system,
the definitive edition doesn't seem to utilize it. However, I'd still advise
you NOT to use this table in multiplayer games for various reasons... like
cheating in MP sucks except all the players are okay with it. Don't cheat
your way into leaderboards or use them to humiliate other players. That
would make you a scumfuck. Thanks for reading & enjoy! ~ CyberD3m0n
}

[ENABLE]
[DISABLE]"""

