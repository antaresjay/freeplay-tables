[[cheat]]
id = "godmode-ohk"
name = "Godmode + OHK"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Nightwolf.exe
  Version:
  Date   : 2019-06-13
  Author : Anjinggila

  This script does blah blah blah
}

[ENABLE]

aobscan(carHealth,F3 0F 11 AE BC 00 00 00 F3 0F 10 86 BC) // should be unique
alloc(newmem,$100,carHealth)

label(code)
label(return)
label(health_base)
label(health_check)
label(kill)
label(one_hit)
registersymbol(health_base)
registersymbol(one_hit)

newmem:
  cmp [rsi+90],00
  je health_check

  cmp [rsi+94],00
  je health_check

  mov [health_base],rsi
  mov [rsi+000000BC],(float)0
  jmp return

one_hit:
  dd 1

health_check:
  cmp [one_hit],01
  je kill

code:
  movss [rsi+000000BC],xmm5
  jmp return

kill:
  mov [rsi+F8],(float)100
  jmp return

health_base:
dd 1

carHealth:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(carHealth)

[DISABLE]

carHealth:
  db F3 0F 11 AE BC 00 00 00

unregistersymbol(carHealth)
unregistersymbol(health_base)
unregistersymbol(one_hit)
dealloc(newmem)
dealloc(one_hit)"""
