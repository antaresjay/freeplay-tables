[[cheat]]
id = "god-mode-x"
name = "god mode  [X]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(nodam1,mb_warband_wse2.exe,F3 0F 5C 45 E8 F3 0F 11 87 DC 6F 00 00)
registersymbol(nodam1)
aobscanmodule(BatHpPtr,mb_warband_wse2.exe,F3 0F 10 8F DC 6F 00 00)
registersymbol(BatHpPtr)

alloc(newmem,$1000)

registersymbol(godmodeid)
label(godmodeid)
label(return1)
label(return2)

newmem:
mov [godmodeid],edi
  movss xmm1,[edi+6FDC]
push eax
mov eax,[edi+7b8]
mov [godmodeid+c],eax
pop eax
  jmp return1

nodam2:
cmp edi,[godmodeid] // pc [edi+268] = ch id
jne short @f
movss xmm0,[edi+00006FD8]
jmp return2

@@:
cmp [godmodeid+8],1
jne short @f
mov eax,[godmodeid+4]
cmp [edi+24],eax // [edi+24] horses
je short asbkz
mov eax,[godmodeid+c]
cmp [edi+7b8],eax // [edi+7b8] banner#
je short asbkz
@@:
  subss xmm0,[ebp-18]
asbkz:
  jmp return2
align 8
godmodeid:
dd 0 1 8 //

BatHpPtr:
  jmp newmem
  nop 3
return1:

nodam1:
  jmp nodam2
return2:

[DISABLE]

BatHpPtr:
  db F3 0F 10 8F DC 6F 00 00

nodam1:
  db F3 0F 5C 45 E8 F3 0F 11 87 DC 6F 00 00
unregistersymbol(godmodeid)
unregistersymbol(BatHpPtr)
dealloc(newmem)

