[[cheat]]
id = "coin-tank-cleanness-exp-event"
name = "Coin / Tank Cleanness / Exp / Event"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Tiny Aquarium.exe
  Version: 
  Date   : 2026-05-01
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,"GameAssembly.dll"+48B530)
define(bytes,48 83 EC 28 8B 41 14)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,"GameAssembly.dll"+48B530)

label(code)
label(return)

newmem:
mov [stat_ptr],rcx

code:
  sub rsp,28
  mov eax,[rcx+14]
  jmp return

stat_ptr:
dq 0

address:
  jmp newmem
  nop 2
return:
registersymbol(stat_ptr)

[DISABLE]

address:
  db bytes
  // sub rsp,28
  // mov eax,[rcx+14]

dealloc(newmem)
unregistersymbol(stat_ptr)"""

