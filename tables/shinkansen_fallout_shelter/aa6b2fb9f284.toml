[[cheat]]
id = "vault-base-address-scan-initialization-activate-this-first"
name = "Vault Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Vault_basepointer)
registersymbol(Vault_update_enable)
registersymbol(Vault_set_enable)
registersymbol(Vault_capsset_enable)
registersymbol(Vault_basicset_enable)
registersymbol(Vault_dwellerset_enable)
registersymbol(Vault_colaset_enable)
registersymbol(Vault_rushset_enable)

alloc(Vault_basepointer, 8)
alloc(Vault_update_enable, 4)
alloc(Vault_set_enable, 4)
alloc(Vault_capsset_enable, 4)
alloc(Vault_basicset_enable, 4)
alloc(Vault_dwellerset_enable, 4)
alloc(Vault_colaset_enable, 4)
alloc(Vault_rushset_enable, 4)


[DISABLE]
unregistersymbol(Vault_basepointer)
unregistersymbol(Vault_update_enable)
unregistersymbol(Vault_set_enable)
unregistersymbol(Vault_capsset_enable)
unregistersymbol(Vault_basicset_enable)
unregistersymbol(Vault_dwellerset_enable)
unregistersymbol(Vault_colaset_enable)
unregistersymbol(Vault_rushset_enable)

dealloc(Vault_basepointer)
dealloc(Vault_update_enable)
dealloc(Vault_set_enable)
dealloc(Vault_capsset_enable)
dealloc(Vault_basicset_enable)
dealloc(Vault_dwellerset_enable)
dealloc(Vault_colaset_enable)
dealloc(Vault_rushset_enable)"""

[[cheat]]
id = "vault-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Vault Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Vault_savedAOB)
label(Vault_returnhere)
label(Vault_originalcode)
label(Vault_exit)

label(Vault_update_exit)
label(Vault_set_exit)
label(Vault_capsset_exit)
label(Vault_basicset_exit)
label(Vault_dwellerset_exit)
label(Vault_colaset_exit)
label(Vault_rushset_exit)

registersymbol(Vault_savedAOB)

//0CA8DC8E - 85 C0                 - test eax,eax
//0CA8DC90 - 0F84 B50C0000         - je 0CA8E94B
// Vault:Update+b4
//0CA8DC96 - F3 0F10 86 10020000   - movss xmm0,[rsi+00000210]
//0CA8DC9E - F3 0F5A C0            - cvtss2sd xmm0,xmm0
//0CA8DCA2 - F2 0F11 45 90         - movsd [rbp-70],xmm0
//0CA8DCA7 - 48 83 EC 20           - sub rsp,20
//0CA8DCAB - 49 BB 9035BF0400000000 - mov r11,0000000004BF3590 : [EC8B4855]
aobscan(Vault_searchedAOB, F3 0F 10 86 10 02 00 00 F3 0F 5A C0 F2 0F 11 45 90)

alloc(Vault_newmem, 2048, Vault_searchedAOB)
alloc(Vault_temp1, 8, Vault_searchedAOB)
alloc(Vault_temp2, 8, Vault_searchedAOB)


Vault_newmem:
mov [Vault_temp1], rbx
mov [Vault_temp2], rcx

cmp dword ptr [Vault_update_enable], #0
je Vault_update_exit
mov [Vault_basepointer], rsi
Vault_update_exit:

cmp dword ptr [Vault_set_enable], #0
je Vault_set_exit
Vault_set_exit:

cmp dword ptr [Vault_capsset_enable], #0
je Vault_capsset_exit
cmp dword ptr [rsi+b8], #0
je Vault_capsset_exit
cmp qword ptr [rsi+b8], #0
je Vault_capsset_exit
mov rbx, [rsi+b8]
cmp dword ptr [rbx+18], #0
je Vault_capsset_exit
cmp qword ptr [rbx+18], #0
je Vault_capsset_exit
mov rbx, [rbx+18]
cmp dword ptr [rbx+10], #0
je Vault_capsset_exit
cmp qword ptr [rbx+10], #0
je Vault_capsset_exit
mov rbx, [rbx+10]
mov [rbx+20], (float)9999999
Vault_capsset_exit:

cmp dword ptr [Vault_basicset_enable], #0
je Vault_basicset_exit
cmp dword ptr [rsi+b8], #0
je Vault_basicset_exit
cmp qword ptr [rsi+b8], #0
je Vault_basicset_exit
mov rbx, [rsi+b8]
cmp dword ptr [rbx+18], #0
je Vault_basicset_exit
cmp qword ptr [rbx+18], #0
je Vault_basicset_exit
mov rbx, [rbx+18]
cmp dword ptr [rbx+10], #0
je Vault_basicset_exit
cmp qword ptr [rbx+10], #0
je Vault_basicset_exit
mov rbx, [rbx+10]
mov [rbx+24], (float)9999999
mov [rbx+28], (float)9999999
mov [rbx+2c], (float)9999999
Vault_basicset_exit:

cmp dword ptr [Vault_dwellerset_enable], #0
je Vault_dwellerset_exit
cmp dword ptr [rsi+b8], #0
je Vault_dwellerset_exit
cmp qword ptr [rsi+b8], #0
je Vault_dwellerset_exit
mov rbx, [rsi+b8]
cmp dword ptr [rbx+18], #0
je Vault_dwellerset_exit
cmp qword ptr [rbx+18], #0
je Vault_dwellerset_exit
mov rbx, [rbx+18]
cmp dword ptr [rbx+10], #0
je Vault_dwellerset_exit
cmp qword ptr [rbx+10], #0
je Vault_dwellerset_exit
mov rbx, [rbx+10]
mov [rbx+30], (float)9999999
mov [rbx+34], (float)9999999
Vault_dwellerset_exit:

cmp dword ptr [Vault_colaset_enable], #0
je Vault_colaset_exit
cmp dword ptr [rsi+b8], #0
je Vault_colaset_exit
cmp qword ptr [rsi+b8], #0
je Vault_colaset_exit
mov rbx, [rsi+b8]
cmp dword ptr [rbx+18], #0
je Vault_colaset_exit
cmp qword ptr [rbx+18], #0
je Vault_colaset_exit
mov rbx, [rbx+18]
cmp dword ptr [rbx+10], #0
je Vault_colaset_exit
cmp qword ptr [rbx+10], #0
je Vault_colaset_exit
mov rbx, [rbx+10]
mov [rbx+4c], (float)9999999
Vault_colaset_exit:

cmp dword ptr [Vault_rushset_enable], #0
je Vault_rushset_exit
mov [rsi+204], (float)-9999999
Vault_rushset_exit:

mov rbx, [Vault_temp1],
mov rcx, [Vault_temp2],


Vault_originalcode:
db F3 0F 10 86 10 02 00 00
//movss xmm0,[rsi+00000210]


Vault_exit:
jmp Vault_returnhere


Vault_searchedAOB:
Vault_savedAOB:
jmp Vault_newmem
nop
nop
nop
Vault_returnhere:


[DISABLE]
Vault_savedAOB:
db F3 0F 10 86 10 02 00 00
//movss xmm0,[rsi+00000210]

unregistersymbol(Vault_savedAOB)

dealloc(Vault_newmem)
dealloc(Vault_temp1)
dealloc(Vault_temp2)"""

