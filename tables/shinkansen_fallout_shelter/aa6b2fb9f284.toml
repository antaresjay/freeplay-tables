id = "room-base-address-scan-to-activate-play-level-to-update-play-level-view-room"
name = "Room Base Address Scan (To Activate: Play Level, To Update: Play Level / View Room)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Room_savedAOB)
label(Room_returnhere)
label(Room_originalcode)
label(Room_exit)

label(Room_update_exit)
label(Room_set_exit)
label(Room_bonusset_exit)
label(Room_healthset_exit)
label(Room_disasterset_exit)
label(Room_radioset_exit)

registersymbol(Room_savedAOB)

//2D725136 - 41 57                 - push r15
//2D725138 - 48 83 EC 18           - sub rsp,18
// Room:Update+c
//2D72513C - 48 8B F1              - mov rsi,rcx
//2D72513F - 48 8B 86 10010000     - mov rax,[rsi+00000110]
//2D725146 - 48 85 C0              - test rax,rax
//2D725149 - 0F84 08010000         - je 2D725257
//2D72514F - 48 8B 86 10010000     - mov rax,[rsi+00000110]
//2D725156 - 48 8B C8              - mov rcx,rax
//2D725159 - 48 83 EC 20           - sub rsp,20
//2D72515D - 83 38 00              - cmp dword ptr [rax],00
aobscan(Room_searchedAOB, 48 8B F1 48 8B 86 10 01 00 00 48 85 C0 * * * * * * 48 8B 86 10 01 00 00 48 8B C8)

alloc(Room_newmem, 2048, Room_searchedAOB)
alloc(Room_temp1, 8, Room_searchedAOB)


Room_newmem:
mov [Room_temp1], rbx

cmp dword ptr [Room_update_enable], #0
je Room_update_exit
cmp byte ptr [rsi+1c8], #1
jne Room_update_exit
mov [Room_basepointer], rsi
Room_update_exit:

cmp dword ptr [Room_set_enable], #0
je Room_set_exit
Room_set_exit:

cmp dword ptr [Room_bonusset_enable], #0
je Room_bonusset_exit
// Skip Non-production
cmp dword ptr [rsi+d8], #0
je Room_bonusset_exit
cmp qword ptr [rsi+d8], #0
je Room_bonusset_exit
mov rbx, [rsi+d8]
cmp dword ptr [rbx+d4], #1
jne Room_bonusset_exit
mov [rsi+244], (float)9999999
mov [rsi+248], (float)9999999
Room_bonusset_exit:

cmp dword ptr [Room_healthset_enable], #0
je Room_healthset_exit
// Skip Fake Wasteland
cmp dword ptr [rsi+d8], #0
je Room_healthset_exit
cmp qword ptr [rsi+d8], #0
je Room_healthset_exit
mov rbx, [rsi+d8]
cmp dword ptr [rbx+d0], #13
je Room_healthset_exit
cmp dword ptr [rsi+f8], #0
je Room_healthset_exit
cmp qword ptr [rsi+f8], #0
je Room_healthset_exit
mov rbx, [rsi+f8]
mov [rbx+18], (float)0
Room_healthset_exit:

cmp dword ptr [Room_disasterset_enable], #0
je Room_disasterset_exit
// Skip Non-production
cmp dword ptr [rsi+d8], #0
je Room_disasterset_exit
cmp qword ptr [rsi+d8], #0
je Room_disasterset_exit
mov rbx, [rsi+d8]
cmp dword ptr [rbx+d4], #1
jne Room_disasterset_exit
mov [rsi+240], (float)-9999999
Room_disasterset_exit:

cmp dword ptr [Room_radioset_enable], #0
je Room_radioset_exit
// Skip Non-Radio
cmp dword ptr [rsi+d8], #0
je Room_radioset_exit
cmp qword ptr [rsi+d8], #0
je Room_radioset_exit
mov rbx, [rsi+d8]
cmp dword ptr [rbx+d0], #17
jne Room_radioset_exit
mov byte ptr [rsi+201], #1
Room_radioset_exit:

mov rbx, [Room_temp1],


Room_originalcode:
db 48 8B 86 10 01 00 00
//mov rax,[rsi+00000110]


Room_exit:
jmp Room_returnhere


Room_searchedAOB + 3:
Room_savedAOB:
jmp Room_newmem
nop
nop
Room_returnhere:


[DISABLE]
Room_savedAOB:
db 48 8B 86 10 01 00 00
//mov rax,[rsi+00000110]

unregistersymbol(Room_savedAOB)

dealloc(Room_newmem)
dealloc(Room_temp1)"""

