_BackGM:

[DISABLE]
_aobManaBase_lbl: //mov ecx,[eax+7C]//mov eax,ebx
 db 8B 48 7C 8B C3
unregistersymbol(_aobManaBase_lbl)
dealloc(MyCode)"""

