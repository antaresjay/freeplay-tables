[[cheat]]
id = "all-characters-cards-unlocked"
name = "All Characters/Cards Unlocked"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(cardselect,GameAssembly.dll,FF CC CC CC CC CC CC CC CC CC CC CC CC CC 40 53 48 83 EC 60 80)
alloc(newmem,$1000,cardselect)

label(code)
label(return)

newmem:
mov [rcx+58],1

code:
  push rbx
  sub rsp,60
  jmp return

cardselect+0E:
  jmp newmem
  nop
return:
registersymbol(cardselect)

[DISABLE]

cardselect+0E:
  db 40 53 48 83 EC 60

unregistersymbol(*)
dealloc(*)"""

[[cheat]]
id = "enable-built-in-cheats-click-battlefield-to-populate"
name = "Enable Built-In Cheats (Click Battlefield To Populate)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@FearlessRevolution|Sintrix
[ENABLE]

aobscanmodule(godlikecheat,GameAssembly.dll,80 78 10 00 74 14)
alloc(newmem,$1000,godlikecheat)
registersymbol(bic)
label(code return bic)

newmem:
mov [bic],rax

code:
  cmp byte ptr [rax+10],00
  je GameAssembly.dll+430CF7
  jmp return

bic:
dq 0

godlikecheat:
  jmp newmem
  nop
return:
registersymbol(godlikecheat)

[DISABLE]

godlikecheat:
  db 80 78 10 00 74 14

unregistersymbol(*)
dealloc(*)"""
