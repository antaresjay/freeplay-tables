type = "script"
source = """
//Send@ModEngine
[ENABLE]

aobscanmodule(consumption,Frozenheim-Win64-Shipping.exe,48 8B 06 48 8D 54 24 20 48 8B CE FF 90 88 06)
alloc(newmem,$1000,consumption)

label(code)
label(return)

newmem:
push rsi
mov rsi,[rsi+250]
test rsi,rsi
je @f
mov rsi,[rsi+02C0] //ConsumptionComponent
mov [rsi+00B8],(float)0 //Unit
mov [rsi+00BC],(float)0 //Villager
mov [rsi+00C0],(float)0 //Weather
mov [rsi+00C4],(float)0 //General
mov [rsi+00DC],(float)0 //Current

@@:
pop rsi

code:
  mov rax,[rsi]
  lea rdx,[rsp+20]
  jmp return

consumption:
  jmp newmem
  nop 3
return:
registersymbol(consumption)

[DISABLE]

consumption:
  db 48 8B 06 48 8D 54 24 20

unregistersymbol(consumption)
dealloc(newmem)"""
