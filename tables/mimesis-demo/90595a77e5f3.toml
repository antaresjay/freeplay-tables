[[cheat]]
id = "get-player"
name = "Get Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
define(address,VPlayer:Update)
define(bytes,55 48 8B EC 48 83 EC 40)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,VPlayer:Update)
registersymbol(GetVPlayer)
label(code return GetVPlayer)

newmem:
mov [GetVPlayer],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,40
  jmp return

GetVPlayer:
dw

address:
  jmp newmem
  nop 3
return:

[DISABLE]

address:
  db bytes
unregistersymbol(*)
dealloc(*)"""
