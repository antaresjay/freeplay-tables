[[cheat]]
id = "infinite-item-ammo"
name = "Infinite Item Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(ItemStuff,EquipmentItemElement:toItemInfo+39,EquipmentItemElement:toItemInfo+87,48 63 4E 38 83 38 00 89 48 *)
alloc(newmem,$1000,ItemStuff)
label(code return)

newmem:


code:
  mov [rsI+38],#99
  movsxd  rcx,dword ptr [rsi+38]
  cmp dword ptr [rax],00
  jmp return

item:
dw

ItemStuff:
  jmp newmem
  nop 2
return:
registersymbol(ItemStuff)

[DISABLE]

ItemStuff:
  db 48 63 4E 38 83 38 00

unregistersymbol(ItemStuff)
dealloc(newmem)"""

