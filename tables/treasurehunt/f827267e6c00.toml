type = "script"
source = """
{ Game   : TreasureHunt.exe
  Version: 2.1.11080.0 Windows Store
  Date   : 2020-02-10
  Author : SovietWristwatch.jpg
}

[ENABLE]
aobscanmodule(dfgghdfghgfh,TreasureHunt.dll,8B 42 30 89 41 20)
alloc(newmem,$1000)

label(code)
label(return)
label(lives)
label(_doubleCoins)
label(doubleCoins)
label(noDoubleCoins)

newmem:
  mov eax,[edx+30]
  mov [ecx+20],eax
  jmp lives

lives:
  /// arrows ///
  push eax
  mov eax,[edx+90]
  mov [edx+6C],eax
  pop eax
  /// keys ///
  push eax
  mov eax,[edx+90]
  mov [edx+5C],eax
  pop eax
  /// shields ///
  push eax
  mov eax,[edx+90]
  mov [edx+68],eax
  pop eax
  /// pickaxes ///
  push eax
  mov eax,[edx+84]
  mov [edx+78],eax
  pop eax
  /// dynamite ///
  push eax
  mov eax,[edx+88]
  mov [edx+74],eax
  pop eax
  /// maps ///
  push eax
  mov eax,[edx+8C]
  mov [edx+70],eax
  pop eax
  jmp doubleCoins

doubleCoins:
  cmp [_doubleCoins],0
  je noDoubleCoins
  mov [edx+60],#1
  jmp return

noDoubleCoins:
  mov [edx+60],#0
  jmp return

code:
  mov eax,[edx+30]
  mov [ecx+20],eax
  jmp return

_doubleCoins:
  dd 0

dfgghdfghgfh:
  jmp newmem
  nop
return:
registersymbol(dfgghdfghgfh)
registersymbol(_doubleCoins)

[DISABLE]
