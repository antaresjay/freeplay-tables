[[cheat]]
id = "player-stats-base-address-scan-initialization-activate-this-first"
name = "Player Stats Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(playerstats_basepointer)
registersymbol(playerstats_update_enable)
registersymbol(playerstats_set_enable)
registersymbol(playerstats_invincibilityset_enable)
registersymbol(playerstats_jumpset_enable)
registersymbol(playerstats_jumpset_value)
registersymbol(playerstats_jumpset_counter)
registersymbol(playerstats_healthset_enable)
registersymbol(playerstats_airset_enable)
registersymbol(playerstats_gunset_enable)

alloc(playerstats_basepointer, 4)
alloc(playerstats_update_enable, 4)
alloc(playerstats_set_enable, 4)
alloc(playerstats_invincibilityset_enable, 4)
alloc(playerstats_jumpset_enable, 4)
alloc(playerstats_jumpset_value, 4)
alloc(playerstats_jumpset_counter, 4)
alloc(playerstats_healthset_enable, 4)
alloc(playerstats_airset_enable, 4)
alloc(playerstats_gunset_enable, 4)

playerstats_jumpset_value:
dd #5

playerstats_jumpset_counter:
dd #0


[DISABLE]
unregistersymbol(playerstats_basepointer)
unregistersymbol(playerstats_update_enable)
unregistersymbol(playerstats_set_enable)
unregistersymbol(playerstats_invincibilityset_enable)
unregistersymbol(playerstats_jumpset_enable)
unregistersymbol(playerstats_jumpset_value)
unregistersymbol(playerstats_jumpset_counter)
unregistersymbol(playerstats_healthset_enable)
unregistersymbol(playerstats_airset_enable)
unregistersymbol(playerstats_gunset_enable)

dealloc(playerstats_basepointer)
dealloc(playerstats_update_enable)
dealloc(playerstats_set_enable)
dealloc(playerstats_invincibilityset_enable)
dealloc(playerstats_jumpset_enable)
dealloc(playerstats_jumpset_value)
dealloc(playerstats_jumpset_counter)
dealloc(playerstats_healthset_enable)
dealloc(playerstats_airset_enable)
dealloc(playerstats_gunset_enable)"""

[[cheat]]
id = "player-stats-base-address-scan-to-update-play-level"
name = "Player Stats Base Address Scan (To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstats_update_exit)
label(playerstats_set_exit)
label(playerstats_invincibilityset_exit)
label(playerstats_jumpset_exit)
label(playerstats_healthset_exit)
label(playerstats_airset_exit)
label(playerstats_gunset_exit)

registersymbol(playerstats_savedAOB)

//Iconoclasts.exe+5F0986 - 0F84 92000000         - je Iconoclasts.exe+5F0A1E
//Iconoclasts.exe+5F098C - F2 0F10 05 C0941A01   - movsd xmm0,[Iconoclasts.exe+8694C0]
//Iconoclasts.exe+5F0994 - 8B 83 28080000        - mov eax,[ebx+00000828]
//Iconoclasts.exe+5F099A - 8B 40 28              - mov eax,[eax+28]
// Accesses Health
//Iconoclasts.exe+5F099D - F2 0F10 88 50060000   - movsd xmm1,[eax+00000650]
//Iconoclasts.exe+5F09A5 - 66 0F2F C8            - comisd xmm1,xmm0
//Iconoclasts.exe+5F09A9 - 77 07                 - ja Iconoclasts.exe+5F09B2
//Iconoclasts.exe+5F09AB - 0F57 C0               - xorps xmm0,xmm0
//Iconoclasts.exe+5F09AE - F2 0F5F C1            - maxsd xmm0,xmm1
aobscan(playerstats_searchedAOB, 8B 83 28 08 00 00 8B 40 28 F2 0F 10 88 50 06 00 00 66 0F 2F C8 77 07)

alloc(playerstats_newmem, 2048, playerstats_searchedAOB)
alloc(playerstats_temp1, 4, playerstats_searchedAOB)
alloc(playerstats_temp2, 4, playerstats_searchedAOB)
alloc(playerstats_temp3, 4, playerstats_searchedAOB)
alloc(playerstats_temp4, 4, playerstats_searchedAOB)
alloc(playerstats_temp5, 4, playerstats_searchedAOB)


playerstats_newmem:
mov [playerstats_temp1], eax
mov [playerstats_temp2], ebx
mov [playerstats_temp3], ecx
mov [playerstats_temp4], edx

cmp dword ptr [playerstats_update_enable], #0
je playerstats_update_exit
mov [playerstats_basepointer], ebx
playerstats_update_exit:

cmp dword ptr [playerstats_set_enable], #0
je playerstats_set_exit
playerstats_set_exit:

cmp dword ptr [playerstats_invincibilityset_enable], #0
je playerstats_invincibilityset_exit
mov eax, [ebx+4a8]
test eax, eax
je playerstats_invincibilityset_exit
mov eax, [eax+28]
test eax, eax
je playerstats_invincibilityset_exit
mov [playerstats_temp5], #9
fild [playerstats_temp5]
fstp qword [eax+6d8]
playerstats_invincibilityset_exit:

cmp dword ptr [playerstats_jumpset_enable], #0
je playerstats_jumpset_exit
mov eax, [ebx+4a8]
test eax, eax
je playerstats_jumpset_exit
mov eax, [eax+28]
test eax, eax
je playerstats_jumpset_exit
cmp dword ptr [eax+66c], #0
jne playerstats_jumpset_exit
mov ecx, [playerstats_jumpset_counter]
dec ecx
mov [playerstats_jumpset_counter], ecx
cmp dword ptr [playerstats_jumpset_counter], #0
jge playerstats_jumpset_exit
mov ecx, [playerstats_jumpset_value]
mov [playerstats_jumpset_counter], ecx
mov [playerstats_temp5], #0
fild [playerstats_temp5]
fstp qword [eax+658]
playerstats_jumpset_exit:

cmp dword ptr [playerstats_healthset_enable], #0
je playerstats_healthset_exit
mov eax, [ebx+828]
test eax, eax
je playerstats_healthset_exit
mov eax, [eax+28]
test eax, eax
je playerstats_healthset_exit
mov [playerstats_temp5], #999
fild [playerstats_temp5]
fstp qword [eax+650]
playerstats_healthset_exit:

cmp dword ptr [playerstats_airset_enable], #0
je playerstats_airset_exit
mov eax, [ebx+838]
test eax, eax
je playerstats_airset_exit
mov eax, [eax+28]
test eax, eax
je playerstats_airset_exit
mov [playerstats_temp5], #9999
fild [playerstats_temp5]
fstp qword [eax+698]
playerstats_airset_exit:

cmp dword ptr [playerstats_gunset_enable], #0
je playerstats_gunset_exit
mov eax, [ebx+918]
test eax, eax
je playerstats_gunset_exit
mov eax, [eax+28]
test eax, eax
je playerstats_gunset_exit
mov [playerstats_temp5], #0
fild [playerstats_temp5]
fst qword [eax+610]
fstp qword [eax+658]
playerstats_gunset_exit:

mov eax, [playerstats_temp1]
mov ebx, [playerstats_temp2]
mov ecx, [playerstats_temp3]
mov edx, [playerstats_temp4]


playerstats_originalcode:
db 8B 83 28 08 00 00
//mov eax,[ebx+00000828]


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB:
playerstats_savedAOB:
jmp playerstats_newmem
nop
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
db 8B 83 28 08 00 00
//mov eax,[ebx+00000828]

unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)
dealloc(playerstats_temp1)
dealloc(playerstats_temp2)
dealloc(playerstats_temp3)
dealloc(playerstats_temp4)
dealloc(playerstats_temp5)"""

