[[cheat]]
id = "inf-mana-for-telekinetic-object-control-aob"
name = "Inf. Mana for Telekinetic Object Control (AOB)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(manaWriteAOB,D9 98 B4 00 00 00 EB 13)
registersymbol(manaWriteAOB)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
fld dword ptr [fMinMana]
fcomip st(0),st(1)
jbe originalcode
fstp st(0)
fld dword ptr [fMinMana]
fst dword ptr [edi+18]

originalcode:
fstp dword ptr [eax+000000B4]

exit:
jmp returnhere

///

manaWriteAOB: //28D2F53C:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
manaWriteAOB: //28D2F53C:
db D9 98 B4 00 00 00
//Alt: fstp dword ptr [eax+000000B4]
unregistersymbol(manaWriteAOB)"""

