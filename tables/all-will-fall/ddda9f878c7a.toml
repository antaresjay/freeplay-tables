[[cheat]]
id = "game-state-data"
name = "Game State Data"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : All Will Fall.exe
  Version:
  Date   : 2025-02-05
  Author : BabyGroot

  This script does blah blah blah
}

define(address,GameStateManager:Update+f)
define(bytes,48 8B 46 20 48 8B C8)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,GameStateManager:Update+f)

label(code)
label(return)

alloc(GamSta,8)
registersymbol(GamSta)

newmem:

code:
  mov [GamSta],rsi
  mov rax,[rsi+20]
  mov rcx,rax
  jmp return

GamSta:
dq

address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  db bytes
  // mov rax,[rsi+20]
  // mov rcx,rax

dealloc(newmem)
dealloc(GamSta)
unregistersymbol(GamSta)"""

