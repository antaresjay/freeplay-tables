[[cheat]]
id = "has-been-heroes-aob-script"
name = "Has-Been Heroes AOB script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game   : hasbeenheroes_64bit.exe
// Version:
// Date   :
// Author : Cs
[ENABLE]
aobscanmodule(aobCharacterHandler,hasbeenheroes_64bit.exe,48 83 B9 ?? ?? 00 00 00 74 ?? F3 0F 10 ?? ?? ?? 00 00 0F 57)
aobscanmodule(aobStashReader,hasbeenheroes_64bit.exe,48 8B 97 ?? ?? 00 00 0F B7 4A ?? 8B 05 ?? ?? ?? ?? 48 03 C8 8B 14 8A 48 8D 4D)
aobscanmodule(aobMeleeProgressReader,hasbeenheroes_64bit.exe,F3 0F 10 34 90 74 ?? 0F 2F)

alloc(newmemCharacterHandler,4096,aobCharacterHandler)

label(aobCharacterHandler_r)
label(aobCharacterHandler_i)
registersymbol(aobCharacterHandler_r)
registersymbol(aobCharacterHandler_i)

label(lblCharacterHandler)
label(lblCharacterHandlerSkipGodMode)
label(lblCharacterHandlerSkipHitsPerCombo)
label(lblCharacterHandlerSkip)
label(lblCharacterHandlerRet)
label(lblCharacterHandlerEnemy)
label(lblCharacterHandlerSkipWeakEnemies)

label(bEnableGodMode)
label(bEnableWeakEnemies)
label(bEnableMinHitsPerCombo)
label(iMinHitsPerCombo)
registersymbol(bEnableGodMode)
registersymbol(bEnableWeakEnemies)
registersymbol(bEnableMinHitsPerCombo)
registersymbol(iMinHitsPerCombo)

label(aobStashReader_r)
label(aobStashReader_i)
registersymbol(aobStashReader_r)
registersymbol(aobStashReader_i)

label(lblStashReader)
label(lblStashReaderSkip)
label(lblStashReaderRet)

label(pStash)
registersymbol(pStash)

label(aobMeleeProgressReader_r)
label(aobMeleeProgressReader_i)
registersymbol(aobMeleeProgressReader_r)
registersymbol(aobMeleeProgressReader_i)

label(lblMeleeProgressReader)
label(lblMeleeProgressReaderSkip)
label(lblMeleeProgressReaderRet)

label(bEnableInstantMeleeCycle)
registersymbol(bEnableInstantMeleeCycle)

newmemCharacterHandler:
bEnableGodMode:
dd 1
bEnableWeakEnemies:
dd 1
bEnableMinHitsPerCombo:
dd 0
iMinHitsPerCombo:
dd (int)5
bEnableInstantMeleeCycle:
dd 1

lblCharacterHandler:
push r10
push r11
push rdx
movsxd r10,[aobCharacterHandler_i+3]
mov r11,[rcx+r10]
test r11,r11
jz lblCharacterHandlerSkip
cmp qword ptr [rcx+r10+18],00
jz lblCharacterHandlerEnemy
cmp dword ptr [bEnableGodMode],1
jne short lblCharacterHandlerSkipGodMode
movsxd rdx,[r11+0000029C]
mov dword ptr [r11+00000298],edx
movsxd rdx,[r11+000002B8]
mov dword ptr [r11+000002B4],edx
lblCharacterHandlerSkipGodMode:
cmp dword ptr [bEnableMinHitsPerCombo],1
jne short lblCharacterHandlerSkip
movsxd rdx,[iMinHitsPerCombo]
cmp dword ptr [r11+000002EC],edx
jge short lblCharacterHandlerSkipHitsPerCombo
mov dword ptr [r11+000002EC],edx
lblCharacterHandlerSkipHitsPerCombo:
lblCharacterHandlerSkip:
pop rdx
pop r11
pop r10
readmem(aobCharacterHandler,8)
jmp lblCharacterHandlerRet
lblCharacterHandlerEnemy:
mov r10,[rcx+r10+20]
test r10,r10
jz short lblCharacterHandlerSkip
cmp qword ptr [r10+00000210],0
jne short lblCharacterHandlerSkip
cmp dword ptr [bEnableWeakEnemies],1
jne short lblCharacterHandlerSkipWeakEnemies
mov dword ptr [r11+000002B4],0
mov dword ptr [r11+000002B8],0
cmp dword ptr [r11+00000298],(float)1
jle short lblCharacterHandlerSkipWeakEnemies
mov dword ptr [r11+00000298],(float)1
lblCharacterHandlerSkipWeakEnemies:
jmp lblCharacterHandlerSkip
aobCharacterHandler_i:
readmem(aobCharacterHandler,8)

lblMeleeProgressReader:
pushfq
cmp dword ptr [bEnableInstantMeleeCycle],1
jne short lblMeleeProgressReaderSkip
cmp dword ptr [rax+rdx*4],(float)1.0
jge short lblMeleeProgressReaderSkip
mov dword ptr [rax+rdx*4],(float)1.0
lblMeleeProgressReaderSkip:
popfq
readmem(aobMeleeProgressReader,5)
jmp lblMeleeProgressReaderRet
aobMeleeProgressReader_i:
readmem(aobMeleeProgressReader,5)

lblStashReader:
readmem(aobStashReader,7)
mov qword ptr [pStash],rdx
lblStashReaderSkip:
jmp lblStashReaderRet
aobStashReader_i:
readmem(aobStashReader,7)
pStash:
dq 0

aobMeleeProgressReader:
aobMeleeProgressReader_r:
jmp lblMeleeProgressReader
lblMeleeProgressReaderRet:

aobStashReader:
aobStashReader_r:
jmp lblStashReader
nop
nop
lblStashReaderRet:

aobCharacterHandler:
aobCharacterHandler_r:
jmp lblCharacterHandler
nop
nop
nop
lblCharacterHandlerRet:

[DISABLE]
aobCharacterHandler_r:
readmem(aobCharacterHandler_i,8)

unregistersymbol(aobCharacterHandler_r)
unregistersymbol(aobCharacterHandler_i)

unregistersymbol(bEnableGodMode)
unregistersymbol(bEnableWeakEnemies)
unregistersymbol(bEnableMinHitsPerCombo)
unregistersymbol(iMinHitsPerCombo)

aobStashReader_r:
readmem(aobStashReader_i,7)

unregistersymbol(aobStashReader_r)
unregistersymbol(aobStashReader_i)

unregistersymbol(pStash)

aobMeleeProgressReader_r:
readmem(aobMeleeProgressReader_i,5)

unregistersymbol(aobMeleeProgressReader_r)
unregistersymbol(aobMeleeProgressReader_i)

unregistersymbol(bEnableInstantMeleeCycle)

dealloc(newmemCharacterHandler)"""

