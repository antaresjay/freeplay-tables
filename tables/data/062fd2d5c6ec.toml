  FLD DWORD PTR [EBP+08]
  FADDP
  FSTP DWORD PTR [EBP+08]
  FLD DWORD PTR [EBP+08]
  FCOS
  FMUL DWORD PTR [EBP+10]
  FSTP DWORD PTR [ESP]
  FLD DWORD PTR [EBP+08]
  FSIN
  FMUL DWORD PTR [EBP+10]
  FSTP DWORD PTR [ESP+08]
  MOV EAX,[ESP]
