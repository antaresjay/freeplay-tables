_COPY:
  PUSH EBP
  MOV EBP,ESP
  PUSHAD
  CMP BYTE PTR [EBP+0C],00
  JL _COPY_EXIT
  XOR EDI,EDI
  MOV ECX,[EBP+08]
  MOV EAX,[EBP+0C]
  CMP BYTE PTR [EBP+10],01
  JE SHORT _COPY_LOOP1

_COPY_LOOP0:
  MOV EDX,[ECX+04]
  XCHG [ECX],EDX
  MOV [ECX+04],EDX
  ADD ECX,04
  INC EDI
