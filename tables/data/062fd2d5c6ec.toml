_ONHIT4:
  POPAD
  PUSHAD
  MOV ECX,[EAX+00000130]
  MOV EDX,[ECX]
  MOV EDX,[EDX+00000008]
  CALL EDX
  CMP EAX,01
  JNE _ONHIT_TRUE
  POPAD
  PUSHAD
  MOV ESI,EAX
  MOV EBX,[EAX+00000130]
  MOV EDX,[EBX]
  MOV EDX,[EDX+000000A4]
  MOV ECX,EBX
  CALL EDX
  TEST AL,AL
  JE SHORT _ONHIT4_ONEHITKILL
  MOV EAX,[ESI+0000012C]
  MOV EDX,[EAX+0000008C]
  CALL GETCHAHITBYOBJ
  CMP EAX,[ESI+00000130]
  JE _ONHIT_TRUE
  CMP BYTE PTR [PLAYER.GODMODE.ENABLE],01
  JNE _ONHIT_TRUE
  JMP _ONHIT_FALSE

_ONHIT4_ONEHITKILL:
