name = "Infinite Attribute Points (Spend 1 Point to activate.)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(attribute,89 46 4C 48 63 46 50 FF C0)
alloc(newmem,$1000,attribute)

label(code)
label(return)

newmem:

code:
  mov [rsi+4C],#66
  movsxd  rax,dword ptr [rsi+50]
  jmp return

attribute:
