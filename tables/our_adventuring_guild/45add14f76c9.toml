[[cheat]]
id = "god-mode-get-hit-to-activate"
name = "God Mode (Get hit to activate.)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// send @ fearlessrevolution.com
[ENABLE]

aobscan(dmgmod,89????4863????85??7D)
alloc(newmem,$1000,dmgmod)
label(onehit)
label(onehitkill)
label(code)
label(return)
registersymbol(dmgmod)
registersymbol(onehitkill)

newmem:
cmp dword ptr [rdi+0280],FFFFFFFF
jne onehit
mov [rdi+0044],eax
jmp return

onehit:
cmp byte ptr [onehitkill],1
jne code
xor eax,eax
jmp code

onehitkill:
dq 0

code:
  mov [rdi+5C],eax
  movsxd  rax,dword ptr [rdi+5C]
  jmp return

dmgmod:
  jmp newmem
  nop 2
return:



[DISABLE]

dmgmod:
  db 89 47 5C 48 63 47 5C

unregistersymbol(*)
dealloc(*)"""

