[[cheat]]
id = "custom-checkpoint"
name = "Custom CheckPoint"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(personalCP,naezith.exe,8B 99 A8 11)
alloc(personalCPMem,$100)

alloc(personalCPFlag,1)
registersymbol(personalCPFlag)

label(code)
label(return)

personalCPFlag:
  db 0

personalCPMem:
  cmp [personalCPFlag],1
  jne code
  mov [naezith.exe+20F598],2
  push eax
  mov eax,[naezith.exe+1F5D7C]
  mov [naezith.exe+1F5D64],eax
  mov eax,[naezith.exe+1F5D80]
  mov [naezith.exe+1F5D68],eax
  pop eax
  mov [personalCPFlag],0
  jmp code

code:
  mov ebx,[rcx+000011A8]
  jmp return

personalCP:
  jmp personalCPMem
  nop
return:
registersymbol(personalCP)

[DISABLE]

personalCP:
  db 8B 99 A8 11 00 00

dealloc(personalCPFlag)
unregistersymbol(personalCPFlag)

unregistersymbol(personalCP)
dealloc(personalCPMem)"""

