[[cheat]]
id = "randomize-hooks-color"
name = "Randomize Hooks Color"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(rhc,naezith.exe,C6 83 10 CB 00 00 00 C7)
alloc(randomizeHooksColor,$50)

label(code)
label(return)

randomizeHooksColor:
  pushf
  push rax
  push rcx
  push rdx
  mov rcx,A
  rdtsc
  xor rdx,rdx
  idiv rcx
  mov [naezith.exe+210AB4],rdx
  xor rdx,rdx
  shr rax,1
  idiv rcx
  mov [naezith.exe+210AB8],rdx
  pop rdx
  pop rcx
  pop rax
  popf
  jmp code

code:
  mov byte ptr [rbx+0000CB10],00
  jmp return

rhc:
  jmp randomizeHooksColor
  nop
  nop
return:
registersymbol(rhc)

[DISABLE]

rhc:
  db C6 83 10 CB 00 00 00

unregistersymbol(rhc)
dealloc(randomizeHooksColor)"""

