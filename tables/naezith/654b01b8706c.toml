[[cheat]]
id = "god-mod"
name = "God Mod"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(deathType1,C6 83 10 CB 00 00 01 E9 ?? ?? ?? ?? 0F)//water
aobscan(deathType2,41 C6 85 10)//regular
aobscan(deathType3,C6 81 10 CB 00 00 01)//uncommon

registersymbol(deathType1)
