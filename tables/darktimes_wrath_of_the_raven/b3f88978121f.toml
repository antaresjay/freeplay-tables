[[cheat]]
id = "player-ctrl-numpad-1"
name = "Player (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(stamina,Player:set_Stamina,Player:set_Stamina+300,F30F1086xxxx0000F3xxxxxxF2xxxxxxxx48xxxx66xx49BBxxxxxxxxxxxx000041xxxxF2xxxxxxxxF3xxxxxxxxxxxxxxF3xxxxxx66xxxxxx75xx) //Player:set_Stamina+200
alloc(newmem,$1000,stamina)
alloc(data,8)
alloc(staminabkp,8)
registersymbol(data)
registersymbol(stamina)
registersymbol(staminabkp)
label(code)
label(return)

staminabkp:
  readmem(stamina,8)

newmem:
  mov [data],rsi

code:
  readmem(stamina,8)
  jmp return

stamina:
  jmp newmem
  nop 3
return:

[DISABLE]

stamina:
  readmem(staminabkp,8)

unregistersymbol(*)
dealloc(*)"""

