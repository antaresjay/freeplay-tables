[[cheat]]
id = "invincibility"
name = "Invincibility"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,$100,invincibility)

label(code)
label(return)

newmem:

code:
  mov rax,[rbx+20]
  test rax,rax
  lahf
  bts ax,E
  sahf
  jmp return

invincibility:
  jmp newmem
  nop 2
return:


[DISABLE]

invincibility:
  db 48 8B 43 20 48 85 C0

dealloc(newmem)"""

