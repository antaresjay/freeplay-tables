label(ProgressCloudManager_update_exit)
label(ProgressCloudManager_set_exit)
label(ProgressCloudManager_progressset_exit)

registersymbol(ProgressCloudManager_savedAOB)

//20639925 - 48 83 EC 08           - sub rsp,08
//20639929 - 48 8B F1              - mov rsi,rcx
// Fragment.UE:ProgressCloudManager:get_CurrentInventionID+c
//2063992C - 48 8B 4E 20           - mov rcx,[rsi+20]
//20639930 - 33 D2                 - xor edx,edx
//20639932 - 48 83 EC 20           - sub rsp,20
//20639936 - 49 BB E058C30400000000 - mov r11,0000000004C358E0 : [EC8B4855]
//20639940 - 41 FF D3              - call r11d
//20639943 - 48 83 C4 20           - add rsp,20
//20639947 - 85 C0                 - test eax,eax
//20639949 - 74 0A                 - je 20639955
//2063994B - 48 8B 46 20           - mov rax,[rsi+20]
//2063994F - 48 8B 40 20           - mov rax,[rax+20]
//20639953 - EB 05                 - jmp 2063995A
//20639955 - B8 C0DF7F00           - mov eax,007FDFC0 : [04899DE8]
aobscan(ProgressCloudManager_searchedAOB, 48 8B 4E 20 33 D2 48 83 EC 20 * * * * * * * * * * 41 FF D3 48 83 C4 20 85 C0 74 0A 48 8B 46 20 48 8B 40 20)

