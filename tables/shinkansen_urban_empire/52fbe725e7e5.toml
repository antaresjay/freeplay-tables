movss xmm1, [rbx+130]
comiss xmm0, xmm1
jb ProgressCloudManager_progressset_exit
mov [ProgressCloudManager_temp5], (float)1
subss xmm0, [ProgressCloudManager_temp5]
movss [rbx+130], xmm0
ProgressCloudManager_progressset_exit:

mov rax, [ProgressCloudManager_temp1]
mov rbx, [ProgressCloudManager_temp2]
mov rcx, [ProgressCloudManager_temp3]
mov rdx, [ProgressCloudManager_temp4]


