alloc(ProgressCloudManager_temp3, 8, ProgressCloudManager_searchedAOB)
alloc(ProgressCloudManager_temp4, 8, ProgressCloudManager_searchedAOB)
alloc(ProgressCloudManager_temp5, 8, ProgressCloudManager_searchedAOB)


ProgressCloudManager_newmem:
mov [ProgressCloudManager_temp1], rax
mov [ProgressCloudManager_temp2], rbx
mov [ProgressCloudManager_temp3], rcx
mov [ProgressCloudManager_temp4], rdx

