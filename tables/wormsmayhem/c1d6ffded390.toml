[[cheat]]
id = "information"
name = "* Information *"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
/*
â™¦ Invulnerability during enemy turns - Cancelates any damage during enemy turns.

â™¦ Turn/match/challenge variables - Allows you to freeze, increase or decrease time variables.
[+] Set turn time to 90 minutes
[-] End turn (useful during enemy turns)
[*] Set math time to 50 minutes

â™¦ Weapon uses - Lets you set weapon uses for any weapon for player one. Set "255" for infinite uses.
[0] Set all weapon uses to infinite
*/

[ENABLE]
[DISABLE]"""

[[cheat]]
id = "invulnerability-during-enemy-turns"
name = "Invulnerability during enemy turns"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem:
// Check playing team
cmp [[WormsMayhem.exe+00560D5C]+EC],0
// If team is not first skip damage
jne exit

originalcode:
mov [ebp+0000011E],ax

exit:
jmp returnhere

"WormsMayhem.exe"+1AC019:
jmp newmem
nop
nop
returnhere:


[DISABLE]
dealloc(newmem)
"WormsMayhem.exe"+1AC019:
mov [ebp+0000011E],ax"""

