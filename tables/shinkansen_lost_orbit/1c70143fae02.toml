[[cheat]]
id = "locomotion-base-address-scan-initialization-activate-this-first"
name = "Locomotion Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Locomotion_basepointer)
registersymbol(Locomotion_update_enable)
registersymbol(Locomotion_set_enable)
registersymbol(Locomotion_speedset_enable)
registersymbol(Locomotion_speedset_value)
registersymbol(Locomotion_brakeset_enable)
registersymbol(Locomotion_megaboostset_enable)

alloc(Locomotion_basepointer,4)
alloc(Locomotion_update_enable,4)
alloc(Locomotion_set_enable,4)
alloc(Locomotion_speedset_enable,4)
alloc(Locomotion_speedset_value,4)
alloc(Locomotion_brakeset_enable,4)
alloc(Locomotion_megaboostset_enable,4)

Locomotion_speedset_value:
dd (float)8

[DISABLE]
unregistersymbol(Locomotion_basepointer)
unregistersymbol(Locomotion_update_enable)
unregistersymbol(Locomotion_set_enable)
unregistersymbol(Locomotion_speedset_enable)
unregistersymbol(Locomotion_speedset_value)
unregistersymbol(Locomotion_brakeset_enable)
unregistersymbol(Locomotion_megaboostset_enable)

dealloc(Locomotion_basepointer)
dealloc(Locomotion_update_enable)
dealloc(Locomotion_set_enable)
dealloc(Locomotion_speedset_enable)
dealloc(Locomotion_speedset_value)
dealloc(Locomotion_brakeset_enable)
dealloc(Locomotion_megaboostset_enable)"""

[[cheat]]
id = "locomotion-base-address-scan-to-activate-load-game-to-update-play"
name = "Locomotion Base Address Scan (To Activate: Load Game, To Update: Play)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Locomotion_savedAOB)
label(Locomotion_returnhere)
label(Locomotion_originalcode)
label(Locomotion_exit)

label(Locomotion_update_exit)
label(Locomotion_set_exit)
label(Locomotion_speedset_exit)
label(Locomotion_brakeset_exit)
label(Locomotion_megaboostset_exit)

registersymbol(Locomotion_savedAOB)

// Locomotion:IsInOrbit+a
aobscan(Locomotion_searchedAOB,8B 80 C4 01 00 00 3D 03 00 00 00 74 18)

alloc(Locomotion_newmem,2048)


Locomotion_newmem:
cmp dword ptr [Locomotion_update_enable], #0
je Locomotion_update_exit
mov [Locomotion_basepointer], eax
Locomotion_update_exit:

cmp dword ptr [Locomotion_set_enable], #0
je Locomotion_set_exit
Locomotion_set_exit:

cmp dword ptr [Locomotion_speedset_enable], #0
je Locomotion_speedset_exit
fld [Locomotion_speedset_value]
fstp [eax+e0]
Locomotion_speedset_exit:

cmp dword ptr [Locomotion_brakeset_enable], #0
je Locomotion_brakeset_exit
mov [eax+268], (float)1
Locomotion_brakeset_exit:

cmp dword ptr [Locomotion_megaboostset_enable], #0
je Locomotion_megaboostset_exit
mov [eax+288], (float)0
Locomotion_megaboostset_exit:


Locomotion_originalcode:
db 8B 80 C4 01 00 00
//mov eax,[eax+000001C4]


Locomotion_exit:
jmp Locomotion_returnhere


Locomotion_searchedAOB:
Locomotion_savedAOB:
jmp Locomotion_newmem
nop
Locomotion_returnhere:


[DISABLE]
Locomotion_savedAOB:
db 8B 80 C4 01 00 00
//mov eax,[eax+000001C4]

unregistersymbol(Locomotion_savedAOB)

dealloc(Locomotion_newmem)"""

