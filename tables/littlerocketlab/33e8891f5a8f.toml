  This script does blah blah blah
}

define(address,"GameAssembly.dll"+5D777D)
define(bytes,80 BF E0 02 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,"GameAssembly.dll"+5D777D)

label(code)
label(return)

alloc(Game,8)
registersymbol(Game)

newmem:

code:
