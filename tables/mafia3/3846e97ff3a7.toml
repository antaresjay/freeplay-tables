[[cheat]]
id = "no-recoil"
name = "No Recoil"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(recoill,mafia3.exe,F3 0F 11 93 04 01 00 00 F3) // should be unique
alloc(newmem,$1000,recoill)

label(code)
label(return)

newmem:
xorps xmm2, xmm2
code:
  movss [rbx+00000104],xmm2
  jmp return

recoill:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(recoill)

[DISABLE]

recoill:
  db F3 0F 11 93 04 01 00 00

unregistersymbol(recoill)
dealloc(newmem)"""
