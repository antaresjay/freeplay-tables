[[cheat]]
id = "enable-experience-multiplier"
name = "Enable Experience Multiplier"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@ModEngine
[ENABLE]

aobscanregion(experiencemultiplier,RCG.Rollback.Components.CombatEntity:AddExperience,RCG.Rollback.Components.CombatEntity:AddExperience+1e,48 8B EC 48 81 EC A0 00 00 00 48 89 75 F0 48 89 7D F8 48 8B F9 48 8B F2 F3 0F 11 55 90)
alloc(newmem,$1000,experiencemultiplier)
registersymbol(expmulti)
label(expmulti)
label(code)
label(return)

newmem:
mulss xmm2,[expmulti]

code:
  mov rbp,rsp
  sub rsp,000000A0
  jmp return

expmulti:
dd (float)1

experiencemultiplier:
  jmp newmem
  nop 5
return:
registersymbol(experiencemultiplier)

[DISABLE]

experiencemultiplier:
  db 48 8B EC 48 81 EC A0 00 00 00

unregistersymbol(*)
dealloc(*)"""

