type = "script"
source = """
[ENABLE]

aobscanmodule("GameAssembly.dll"+3D080A,GameAssembly.dll,F3 0F 11 76 50 48 8B 0D)
alloc(newmem,$1000,"GameAssembly.dll"+3D080A)

label(code)
label(return)

newmem:

code:
  movss xmm6,[new]
  movss [rsi+50],xmm6
  jmp return

new:
dd (float)0

"GameAssembly.dll"+3D080A:
  jmp newmem
return:
registersymbol("GameAssembly.dll"+3D080A)

[DISABLE]

"GameAssembly.dll"+3D080A:
  db F3 0F 11 76 50

unregistersymbol(*)
dealloc(*)"""
