[[cheat]]
id = "tooltip-pointer"
name = "Tooltip Pointer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(tooltip,GameAssembly.dll,48 8B ?? ?? 48 89 ?? ?? 48 8D ?? ?? E8 ?? ?? ?? ?? 48 8B ?? ?? 0F 57)
alloc(newmem,$1000,tooltip)

label(tooltipPtr)
label(tooltipBkp)
label(return)

newmem:
  mov rax,tooltipPtr
  mov [rax],rdx
tooltipBkp:
  readmem(tooltip,8)
  jmp return

align 10
tooltipPtr:
  dq 0

tooltip:
  jmp newmem
  nop 3
return:
registersymbol(tooltip)
registersymbol(tooltipBkp)
registersymbol(tooltipPtr)

[DISABLE]
tooltip:
  readmem(tooltipBkp,8)
unregistersymbol(tooltip)
unregistersymbol(tooltipBkp)
unregistersymbol(tooltipPtr)
dealloc(newmem)

