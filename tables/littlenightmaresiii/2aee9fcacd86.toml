[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(enableaob,$process,40 53 48 83 EC 20 48 8B 01 48 8B D9 FF 90 C8 06 00 00 84 C0 74 3E) // should be unique
alloc(newmem,$1000)

fullaccess($process+500, 20)

label(code)
label(return)

label(playerPtr)
registersymbol(playerPtr)


newmem:
  mov [playerPtr], rcx
  push rdx
  mov rdx, [rcx+130] // RootComponent
  test rdx, rdx
  je code


code:
  pop rdx
  push rbx
  sub rsp,20
  jmp return

playerPtr:
dq 0

$process+500:
jumpHelper:
  jmp far newmem

enableaob:
  jmp jumpHelper
  nop
return:
registersymbol(enableaob)

[DISABLE]

enableaob:
  db 40 53 48 83 EC 20

unregistersymbol(enableaob)
unregistersymbol(playerPtr)
dealloc(newmem)"""

