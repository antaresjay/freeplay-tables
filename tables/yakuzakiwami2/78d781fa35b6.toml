[[cheat]]
id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(ammo,YakuzaKiwami2.exe,8B 81 D4 00 00 00 83) // should be unique
alloc(newmem,$1000,ammo)

label(code)
label(return)

newmem:
  mov [rcx+D4],63
code:
  mov eax,[rcx+000000D4]
  jmp return

ammo:
  jmp newmem
  nop
return:
registersymbol(ammo)

[DISABLE]

ammo:
  db 8B 81 D4 00 00 00

unregistersymbol(ammo)
dealloc(newmem)"""
