[[cheat]]
id = "game-manager-ctrl-numpad-1"
name = "Game Manager (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : CROWDED_FOLLOWED.exe
// Author            : ndck76
// Executable Version: 2021.3.5.60218
// Game Version      : Build.16155548
// Script Date       : 2025-01-04


[ENABLE]

aobscanregion(timeplayed,GameManager:Update,GameManager:Update+5000,F30F1086C0xx0000F3xxxxxxF2xxxxxxxx48xxxxxxxx9049BBxxxxxxxxxxxx000041xxxxF3xxxxxx) //GameManager:Update+f
alloc(newmem,$1000,timeplayed)
alloc(data,8)
alloc(timeplayedbkp,8)
registersymbol(data)
registersymbol(timeplayed)
registersymbol(timeplayedbkp)
label(code)
label(return)

timeplayedbkp:
  readmem(timeplayed,8)

newmem:
  mov [data],rsi

code:
  readmem(timeplayed,8)
  jmp return

timeplayed:
  jmp newmem
  nop 3
return:

[DISABLE]

timeplayed:
  readmem(timeplayedbkp,8)

unregistersymbol(*)
dealloc(*)"""

