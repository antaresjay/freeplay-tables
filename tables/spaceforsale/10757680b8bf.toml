type = "script"
source = """
{ Game   : SpaceForSale.exe
  Version:
  Date   : 2024-08-04
  Author : Kurar

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(InfResources,GameAssembly.dll,49 89 5C F0 20) // should be unique
alloc(newmem,$1000,InfResources)

label(code)
label(return)

alloc(myAddress, 8)  // Allocate 8 bytes for the address

myAddress:           // This is where the address will be stored
dq 0                 // Initialize with 0

newmem:
  //mov [r8+rsi*8+20], rbx  // Execute the original instruction
  cmp r11, 1
  jne code
  push rax
  mov rax, r8             // Move the address in r8 to rax
  mov [myAddress], rax    // Store the address in the allocated memory
  pop rax
  //jmp return

code:
  mov [r8+rsi*8+20], rbx
  jmp return

InfResources:
  jmp newmem
  nop 3  // Fill the remaining bytes with NOPs (No Operation)

return:

registersymbol(InfResources)
registersymbol(myAddress)  // Register the address symbol for access

[DISABLE]

InfResources:
  db 49 89 5C F0 20

unregistersymbol(InfResources)
unregistersymbol(myAddress)
