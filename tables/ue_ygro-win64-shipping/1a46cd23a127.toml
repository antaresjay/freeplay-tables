id = "jump-height-and-run-speed"
name = "jump height and run speed"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(player,00 60 9F 44 00 60 9F 44 00 60 9F 44)

player+8:
  dd (float)2500 // jump height
player-48:
  dd (float)1500 // run speed
player+a8:
  dd (float)1.0 // air control

registersymbol(player)

[DISABLE]

player+8:
  dd (float)1275
player-48:
  dd (float)750
player+a8:
  dd (float)0.1

unregistersymbol(player)"""

