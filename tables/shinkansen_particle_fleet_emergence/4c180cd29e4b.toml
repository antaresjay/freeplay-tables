[[cheat]]
id = "gamespace-base-address-scan-initialization-activate-this-first"
name = "GameSpace Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameSpace_basepointer)
registersymbol(GameSpace_update_enable)
registersymbol(GameSpace_set_enable)
registersymbol(GameSpace_energyset_enable)
registersymbol(GameSpace_ampgemsset_enable)
registersymbol(GameSpace_godset_enable)

alloc(GameSpace_basepointer, 4)
alloc(GameSpace_update_enable, 4)
alloc(GameSpace_set_enable, 4)
alloc(GameSpace_energyset_enable, 4)
alloc(GameSpace_ampgemsset_enable, 4)
alloc(GameSpace_godset_enable, 4)


[DISABLE]
unregistersymbol(GameSpace_basepointer)
unregistersymbol(GameSpace_update_enable)
unregistersymbol(GameSpace_set_enable)
unregistersymbol(GameSpace_energyset_enable)
unregistersymbol(GameSpace_ampgemsset_enable)
unregistersymbol(GameSpace_godset_enable)

dealloc(GameSpace_basepointer)
dealloc(GameSpace_update_enable)
dealloc(GameSpace_set_enable)
dealloc(GameSpace_energyset_enable)
dealloc(GameSpace_ampgemsset_enable)
dealloc(GameSpace_godset_enable)"""

[[cheat]]
id = "gamespace-base-address-scan-to-activate-play-level-to-update-play-level"
name = "GameSpace Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameSpace_savedAOB)
label(GameSpace_returnhere)
label(GameSpace_originalcode)
label(GameSpace_exit)

label(GameSpace_update_exit)
label(GameSpace_set_exit)
label(GameSpace_energyset_exit)
label(GameSpace_ampgemsset_exit)
label(GameSpace_godset_exit)

registersymbol(GameSpace_savedAOB)

//323C2916 - E8 DD010000           - call 323C2AF8
//323C291B - 83 C4 10              - add esp,10
// GameSpace:Update+16
//323C291E - 8B 87 CC000000        - mov eax,[edi+000000CC]
//323C2924 - 83 EC 0C              - sub esp,0C
//323C2927 - 50                    - push eax
//323C2928 - 39 00                 - cmp [eax],eax
//323C292A - E8 49040000           - call 323C2D78
//323C292F - 83 C4 10              - add esp,10
//323C2932 - 8B 87 D0000000        - mov eax,[edi+000000D0]
//323C2938 - 83 EC 0C              - sub esp,0C
//323C293B - 50                    - push eax
aobscan(GameSpace_searchedAOB, 8B 87 CC 00 00 00 83 EC 0C 50 39 00 * * * * * 83 C4 10 8B 87 D0 00 00 00)

alloc(GameSpace_newmem, 2048, GameSpace_searchedAOB)


GameSpace_newmem:
cmp dword ptr [GameSpace_update_enable], #0
je GameSpace_update_exit
mov [GameSpace_basepointer], edi
GameSpace_update_exit:

cmp dword ptr [GameSpace_set_enable], #0
je GameSpace_set_exit
GameSpace_set_exit:

cmp dword ptr [GameSpace_energyset_enable], #0
je GameSpace_energyset_exit
mov [rdi+640], (float)9999
GameSpace_energyset_exit:

cmp dword ptr [GameSpace_ampgemsset_enable], #0
je GameSpace_ampgemsset_exit
mov [rdi+658], #99
GameSpace_ampgemsset_exit:

cmp dword ptr [GameSpace_godset_enable], #0
je GameSpace_godset_exit
mov byte ptr [rdi+5db], #1
GameSpace_godset_exit:


GameSpace_originalcode:
db 8B 87 CC 00 00 00
//mov eax,[edi+000000CC]


GameSpace_exit:
jmp GameSpace_returnhere


GameSpace_searchedAOB:
GameSpace_savedAOB:
jmp GameSpace_newmem
nop
GameSpace_returnhere:


[DISABLE]
GameSpace_savedAOB:
db 8B 87 CC 00 00 00
//mov eax,[edi+000000CC]

unregistersymbol(GameSpace_savedAOB)

dealloc(GameSpace_newmem)"""

