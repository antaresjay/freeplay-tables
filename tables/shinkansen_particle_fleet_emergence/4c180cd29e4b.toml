label(CommandModule_update_exit)
label(CommandModule_set_exit)
label(CommandModule_hullset_exit)
label(CommandModule_energyset_exit)
label(CommandModule_weaponsset_exit)

registersymbol(CommandModule_savedAOB)

//421A0C11 - E8 DA040000           - call 421A10F0
//421A0C16 - 83 C4 10              - add esp,10
// CommandModule:Update+19
//421A0C19 - 8B 87 88000000        - mov eax,[edi+00000088]
//421A0C1F - 83 EC 08              - sub esp,08
//421A0C22 - 6A 00                 - push 00
//421A0C24 - 50                    - push eax
//421A0C25 - E8 1E6D14C3           - call 052E7948
//421A0C2A - 83 C4 10              - add esp,10
//421A0C2D - 85 C0                 - test eax,eax
//421A0C2F - 0F84 E9010000         - je 421A0E1E
//421A0C35 - 8B 87 88000000        - mov eax,[edi+00000088]
//421A0C3B - 83 EC 0C              - sub esp,0C
//421A0C3E - 50                    - push eax
aobscan(CommandModule_searchedAOB, 8B 87 88 00 00 00 83 EC 08 6A 00 50 * * * * * 83 C4 10 85 C0 * * * * * * 8B 87 88 00 00 00)

alloc(CommandModule_newmem, 2048, CommandModule_searchedAOB)


CommandModule_newmem:
cmp dword ptr [CommandModule_update_enable], #0
je CommandModule_update_exit
mov [CommandModule_basepointer], edi
CommandModule_update_exit:

cmp dword ptr [CommandModule_set_enable], #0
je CommandModule_set_exit
CommandModule_set_exit:

cmp dword ptr [CommandModule_hullset_enable], #0
je CommandModule_hullset_exit
mov [edi+c4], (float)0
mov [edi+c8], (float)0
CommandModule_hullset_exit:

cmp dword ptr [CommandModule_energyset_enable], #0
je CommandModule_energyset_exit
fild [edi+fc]
fstp [edi+15c]
CommandModule_energyset_exit:

cmp dword ptr [CommandModule_weaponsset_enable], #0
je CommandModule_weaponsset_exit
mov [edi+cc], (float)99
mov [edi+d8], #1
CommandModule_weaponsset_exit:


CommandModule_originalcode:
db 8B 87 88 00 00 00
//mov eax,[edi+00000088]


CommandModule_exit:
jmp CommandModule_returnhere


CommandModule_searchedAOB:
CommandModule_savedAOB:
jmp CommandModule_newmem
nop
CommandModule_returnhere:


[DISABLE]
CommandModule_savedAOB:
db 8B 87 88 00 00 00
//mov eax,[edi+00000088]

unregistersymbol(CommandModule_savedAOB)

dealloc(CommandModule_newmem)"""

