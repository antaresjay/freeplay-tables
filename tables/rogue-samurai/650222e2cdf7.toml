[[cheat]]
id = "time-manager-ctrl-numpad-1"
name = "Time Manager (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Rogue Samurai.exe
// Author            : ndck76
// Executable Version: 2022.3.1.36364
// Game Version      : v1.0
// Script Date       : 2024-11-14


[ENABLE]

aobscanregion(second,TimeManager:OnSecondPassed,TimeManager:OnSecondPassed+100,4863xxxxFFxx89xxxx48xxxxxx83xxxx75xx48B8xxxxxxxxxxxx0000) //TimeManager:OnSecondPassed+f
alloc(newmem,$1000,second)
alloc(data2,8)
alloc(secondbkp,6)
registersymbol(data2)
registersymbol(second)
registersymbol(secondbkp)
label(code)
label(return)

secondbkp:
  readmem(second,6)

newmem:
  mov [data2],rsi

code:
  readmem(second,6)
  jmp return

second:
  jmp newmem
  nop
return:

[DISABLE]

second:
  readmem(secondbkp,6)

unregistersymbol(*)
dealloc(*)"""

