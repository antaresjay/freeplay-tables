[[cheat]]
id = "timer-editor-activate-the-script-when-the-timer-is-falling"
name = "Timer Editor {Activate the script when the timer is falling}"
category = "game"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Alice_Landing.exe
// Author            : ndck76
// Executable Version: 2022.3.2.18231
// Game Version      : Build.22845809
// Script Date       : 2026-05-12


[ENABLE]

aobscan(timer,F30F10xxxxF3xxxxxxF2xxxxxxxx66xxxx49BBxxxxxxxxxxxx000041xxxxF3xxxxxxF2xxxxxxxxF2xxxxxxF2xxxxxxF3xxxxxxxx) // should be unique
alloc(newmem,$1000,timer)
alloc(data3,8)
alloc(timerbkp,5)
registersymbol(data3)
registersymbol(timer)
registersymbol(timerbkp)
label(code)
label(return)

timerbkp:
  readmem(timer,5)

newmem:
  mov [data3],rsi

code:
  readmem(timer,5)
  jmp return

timer:
  jmp newmem
return:

[DISABLE]

timer:
  readmem(timerbkp,5)

unregistersymbol(*)
dealloc(*)"""

