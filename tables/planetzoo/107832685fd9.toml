[[cheat]]
id = "inf-health-registers-after-hp-lose"
name = "inf Health [Registers After HP Lose]"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(infHp,89 83 A4 00 00 00 8B 05)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov eax,#99
code:
  mov [ebx+000000A4],eax
  jmp return

infHp:
  jmp newmem
  nop
return:
registersymbol(infHp)

[DISABLE]

infHp:
  db 89 83 A4 00 00 00

unregistersymbol(infHp)
dealloc(newmem)"""

