[[cheat]]
id = "god-mode"
name = "God Mode"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Exorcist.exe
  Date   : 2022-01-11
  Author : Glowmoss
}

[ENABLE]

aobscanregion(godmode,BaseAgent:get_IsInvicible,BaseAgent:get_IsInvicible+8a,F3 0F 5A C9 66 0F 2F C8 0F 87 50)
alloc(newmem,256,godmode)

registersymbol(godmode)
label(code return godmode1)

newmem:
  cmp [rcx+278],0
  je code
  cvtss2sd xmm1,xmm1
  comisd xmm1,xmm0
  jmp godmode1

code:
  cvtss2sd xmm1,xmm1
  comisd xmm1,xmm0
  jmp return

godmode1:
  mov edi,00000001
  mov rax,rdi
  lea rsp,[rbp-10]
  pop rdi
  pop rsi
  leave
  ret

godmode:
  jmp newmem
  db 90 90 90
return:

[DISABLE]

godmode:
  db F3 0F 5A C9 66 0F 2F C8

unregistersymbol(*)
dealloc(*)"""

