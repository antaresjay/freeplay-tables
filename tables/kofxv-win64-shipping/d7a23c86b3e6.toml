type = "script"
source = """
{ Game   : KOFXV-Win64-Shipping.exe
  Version: 1
  Date   : 2026-05-27
  Author : mushpi
}

define(address,"KOFXV-Win64-Shipping.exe"+10A74C5)
define(bytes,89 0E 48 8B 05 92 43 2E 04)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,"KOFXV-Win64-Shipping.exe"+10A74C5)

label(code)
label(return)

newmem:
cmp dword ptr [rsi+338],0x00000000
  jne code
  mov word ptr [rsi],0x0000
  mov word ptr [rsi+2],0x1388
  mov rax,["KOFXV-Win64-Shipping.exe"+538B860]
