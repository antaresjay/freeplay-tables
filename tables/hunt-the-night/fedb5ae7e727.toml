label(code)
label(return)

pBase_PlayerData:
dd

newmem:

code:
  mov [pBase_PlayerData],rsi
  mov rcx,[rsi+50]
  nop 3
  jmp return

pData_PlayerData:
  jmp newmem
  nop 2
return:
registersymbol(pData_PlayerData pBase_PlayerData)

[DISABLE]

pData_PlayerData:
  db 48 8B 4E 50 66 66 90

unregistersymbol(*)
dealloc(*)"""
