[ENABLE]

aobscanregion(pData_PlayerData,Code.FunctionalLogic.Models.Characters.Character:StopMovement,Code.FunctionalLogic.Models.Characters.Character:StopMovement+100,48 8B 4E 50 66 66 90) // should be unique
