source = """
// Game Executable   : skindeep.exe
// Author            : ndck76
// Game Version      : Build.18309765
// Script Date       : 2025-05-05


[ENABLE]

aobscanmodule(enemyhp,skindeep.exe,418BxxxxxxxxxxFFxx3Bxx7F) // should be unique
alloc(newmem,$1000,enemyhp)
alloc(enemyhpbkp,7)
registersymbol(enemyhp)
registersymbol(enemyhpbkp)
label(code)
label(return)

enemyhpbkp:
  readmem(enemyhp,7)

newmem:
  mov [r14+00000158],(int)1

code:
  readmem(enemyhp,7)
  jmp return

enemyhp:
  jmp newmem
  nop 2
return:

[DISABLE]

enemyhp:
  readmem(enemyhpbkp,7)

unregistersymbol(*)
dealloc(*)"""
