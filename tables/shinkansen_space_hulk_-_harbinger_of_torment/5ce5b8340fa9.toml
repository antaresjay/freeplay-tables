[[cheat]]
id = "squad-member-base-address-scan-initialization-activate-this-first"
name = "Squad Member Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

registersymbol(squadmember_basepointer)
