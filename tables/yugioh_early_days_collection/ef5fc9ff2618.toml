id = "12-world-championship-tournament-2004-us"
name = "[12] World Championship Tournament 2004 [US]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(DM98,yugioh_early_days_collection.exe,44 88 04 02 C3 CC CC CC CC CC CC)
alloc(newmem,$1000,DM98)

label(code)
label(return)
label(GetLP)
label(GetLPOffset)
label(InputPlayerLP)
label(InputOpponentLP)
label(FindLP)
label(OP)
label(CardSelect)
label(CardDescription)

newmem:

code:
//Store RDI stack
  push rdi

//OG code
  mov [rdx+rax],r8b

//Combine Addresses before stacking
  mov rdi,rax
  add rdi,rdx

//Store RDX and RAX to stack
  push rdx
  push rax

// Adjust values and apply changes by shifting [IOpponentLP] across 24 times.
  mov rdx,[InputOpponentLP]
  mov rax,[InputPlayerLP]
  shl rdx,(int)24
  add rdx,rax

//Check Conditions
  cmp [rdi],rdx

//Return stacks to RAX and RDX
  pop rax
  pop rdx

//Check Conditions
  jne OP
  cmp [FindLP],1
  je OP
  mov [FindLP],1

//Set values
  mov [GetLP],rax
  mov [GetLPOffset],rdx
  jmp OP

OP:
//Return stack to EBX
  pop rdi

//OG code
  ret
  jmp return

GetLP:
dq 0

GetLPOffset:
dq 0

FindLP:
