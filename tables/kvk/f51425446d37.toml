[[cheat]]
id = "always-99-food-at-the-end-of-the-turn"
name = "always 99 food at the end of the turn"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(food,0D 00 00 48 8B 40 20 48 63 48 4C 03 CF 89 48 4C) // should be unique
alloc(newmem,$1000,food)

label(code)
label(return)

newmem:
  mov ecx,#99
code:
  // add ecx,edi
  mov [rax+4C],ecx
  jmp return

food+0B:
  jmp newmem
return:
registersymbol(food)

