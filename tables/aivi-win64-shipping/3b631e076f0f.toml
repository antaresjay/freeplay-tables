[[cheat]]
id = "player-character-ctrl-numpad-1"
name = "Player Character (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : AIVI-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.4.4.0
// Game Version      : Build.22403135
// Script Date       : 2026-03-24


[ENABLE]

aobscanmodule(master,AIVI-Win64-Shipping.exe,488Bxx33xx4Cxxxxxxxxxxxx488Bxx41FFxx84xx74xx488Bxx488B) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,5)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,5)

newmem:
  mov [data],rax

code:
  readmem(master,5)
  jmp return

master:
  jmp newmem
return:

[DISABLE]

master:
  readmem(masterbkp,5)

unregistersymbol(*)
dealloc(*)"""

