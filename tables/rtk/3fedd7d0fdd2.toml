[[cheat]]
id = "find-gold"
name = "Find Gold"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(gold,RtK.exe,8B 48 50 89 4D E0 83) // should be unique
alloc(newmem,$1000)
globalalloc(goldaddy,4)

label(code)
label(return)

goldaddy:
  dw 0

newmem:
  mov [goldaddy],eax
code:
  mov ecx,[eax+50]
  mov [ebp-20],ecx
  jmp return

gold:
  jmp newmem
  nop
return:
registersymbol(gold)

[DISABLE]

gold:
  db 8B 48 50 89 4D E0

unregistersymbol(gold)
dealloc(newmem)
dealloc(goldaddy)

{
