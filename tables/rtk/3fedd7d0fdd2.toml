// ---------- DONE INJECTING  ----------
RtK.exe+141B45: 89 4D E0              - mov [ebp-20],ecx
RtK.exe+141B48: 83 3D BC D2 66 00 00  - cmp dword ptr [RtK.exe+26D2BC],00
RtK.exe+141B4F: 74 14                 - je RtK.exe+141B65
