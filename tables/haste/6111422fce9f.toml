[[cheat]]
id = "player-pointers"
name = "→ Player Pointers"
category = "player"
description = ""
hint = ""
type = "script"
source = """
//Send@FearlessRevolution|Sintrix
define(address,Player:Update)
define(bytes,55 48 8B EC 48 83 EC 30)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Player:Update)
registersymbol(pPlayer)
label(code return pPlayer)

newmem:
mov [pPlayer],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,30
  jmp return

pPlayer:
dw

address:
  jmp newmem
  nop 3
return:

[DISABLE]

address:
  db bytes

unregistersymbol(*)
dealloc(*)"""
