[[cheat]]
id = "max-spark-pickup-range"
name = "Max Spark Pickup Range"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(sparkPickup,SparkHandler:Update+316,SparkHandler:Update+3a8,00 48 8B C8 83 39 00 F3 0F 10 40 10)
alloc(newmem,$1000,sparkPickup)

label(code)
label(return)

newmem:

code:
  mov [rax+10],(float)10000
  movss xmm0,[rax+10]
  jmp return

sparkPickup+07:
  jmp newmem
return:
registersymbol(sparkPickup)

[DISABLE]

sparkPickup+07:
  db F3 0F 10 40 10

unregistersymbol(*)
dealloc(*)"""

