[[cheat]]
id = "god-mode-one-hit-kill-infinite-player-health"
name = "God Mode (One Hit Kill / Infinite Player Health)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : murphy-Win64-Shipping.exe (paused)
  Version: 
  Date   : 2023-09-23
  Author : relentlesstech

  This script enables one hit kills and infinite player HP
}

[ENABLE]

aobscanmodule(godmode,murphy-Win64-Shipping.exe,29 73 50 83 7B 50 00)
alloc(newmem,$100,godmode)

label(code)
label(return)

newmem:
  cmp [rbx+64],0
  jne code
  mov [rbx+50],#999
  cmp dword ptr [rbx+50],00
  jmp return

code:
  mov [rbx+50],0
  cmp dword ptr [rbx+50],00
  jmp return

godmode:
  jmp newmem
  nop 2
return:
registersymbol(godmode)

[DISABLE]

godmode:
  db 29 73 50 83 7B 50 00

unregistersymbol(godmode)
dealloc(newmem)"""

