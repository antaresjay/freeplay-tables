type = "script"
source = """
[ENABLE]
aobscanmodule(arcade_story_ammo_weapons,shakedown.bin,66 89 01 75 3D)
alloc(newmem,$100)
alloc(ammo,4)
label(code)
label(return)
aobscanmodule(arcade_story_ammo_weapons_stamina,shakedown.bin,88 45 1A 80 7D 1A 00)
alloc(newmemx,$100)
alloc(stamina,4)
label(codex)
label(returnx)
ammo:
  db 0
newmem:
  mov [ammo],ax
  jne shakedown.bin+C9ABF
  jmp return
code:
  mov [ecx],ax
  jne shakedown.bin+C9ABF
  jmp return
arcade_story_ammo_weapons:
  jmp newmem
return:
registersymbol(arcade_story_ammo_weapons)
stamina:
  db 0
newmemx:
  mov [stamina],al
  cmp byte ptr [ebp+1A],00
  jmp returnx
codex:
  mov [ebp+1A],al
  cmp byte ptr [ebp+1A],00
  jmp returnx
arcade_story_ammo_weapons_stamina:
  jmp newmemx
  nop 2
returnx:
registersymbol(arcade_story_ammo_weapons_stamina)
[DISABLE]
arcade_story_ammo_weapons:
  db 66 89 01 75 3D
unregistersymbol(arcade_story_ammo_weapons)
dealloc(newmem)
arcade_story_ammo_weapons_stamina:
  db 88 45 1A 80 7D 1A 00
unregistersymbol(arcade_story_ammo_weapons_stamina)
dealloc(newmemx)"""

