[[cheat]]
id = "infinite-heatlh"
name = "Infinite heatlh"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : gta-sa.exe
  Version: 
  Date   : 2020-06-04
  Author : Typer

  This script does blah blah blah
}

[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

 
 
aobscanmodule(healthBase,gta-sa.exe,D8 63 04 D9 5D 08 D9 45) // should be unique
alloc(newmem,$1000)

label(code)
label(cjHealthToSub)
label(playerAddress)
label(setPlayerAddress)
label(return)

newmem:

  cmp [playerAddress], 0 // se ainda nao achou o cj
  je setPlayerAddress
  cmp [playerAddress], esi // se for o CJ nao subtrai sangue
  je code
  fsub dword ptr [ebx+04]
  jmp code

setPlayerAddress:
  mov [playerAddress], esi
  jmp code

code:
//  fsub dword ptr [ebx+04]
  fsub dword ptr [cjHealthToSub]
  fstp dword ptr [ebp+08]
  jmp return

cjHealthToSub:
  dd (float)0.0

playerAddress:
  dd 0

healthBase:
  jmp newmem
  nop

return:
registersymbol(healthBase)
registersymbol(playerAddress)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
healthBase:
  db D8 63 04 D9 5D 08

unregistersymbol(healthBase)
unregistersymbol(playerAddress)
dealloc(newmem)

{
