mov [inventorystats_temp1], eax
mov [inventorystats_temp2], ebx
mov [inventorystats_temp3], ecx
mov [inventorystats_temp4], edx

mov ebx, [inventorystats_savedAOB-4]

cmp dword ptr [inventorystats_update_enable], #0
je inventorystats_update_exit
mov [inventorystats_basepointer], ebx
inventorystats_update_exit:

cmp dword ptr [inventorystats_set_enable], #0
je inventorystats_set_exit
inventorystats_set_exit:

mov eax, [inventorystats_temp1]
mov ebx, [inventorystats_temp2]
mov ecx, [inventorystats_temp3]
mov edx, [inventorystats_temp4]


inventorystats_originalcode:
db 8B 40 08 C3 CC
//mov eax,[eax+08]
//ret
//int 3


inventorystats_exit:
jmp inventorystats_returnhere


inventorystats_searchedAOB:
inventorystats_savedAOB:
jmp inventorystats_newmem
inventorystats_returnhere:


[DISABLE]
inventorystats_savedAOB:
db 8B 40 08 C3 CC
//mov eax,[eax+08]
//ret
//int 3

unregistersymbol(inventorystats_savedAOB)

