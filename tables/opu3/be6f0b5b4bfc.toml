//OPU3.exe+43D92 - C1 E0 04              - shl eax,04
//OPU3.exe+43D95 - 03 05 C0A68400        - add eax,[OPU3.exe+62A6C0]
// Accesses Money
//OPU3.exe+43D9B - 8B 40 08              - mov eax,[eax+08]
//OPU3.exe+43D9E - C3                    - ret
//OPU3.exe+43D9F - CC                    - int 3
//OPU3.exe+43DA0 - 55                    - push ebp
//OPU3.exe+43DA1 - 8B EC                 - mov ebp,esp
//OPU3.exe+43DA3 - 8B 91 88040000        - mov edx,[ecx+00000488]
//OPU3.exe+43DA9 - FF B1 30170000        - push [ecx+00001730]
//OPU3.exe+43DAF - 8B 42 1C              - mov eax,[edx+1C]
//OPU3.exe+43DB2 - 2B 45 08              - sub eax,[ebp+08]
aobscan(inventorystats_searchedAOB, 8B 40 08 C3 CC 55 8B EC 8B 91 88 04 00 00 FF B1 30 17 00 00)

alloc(inventorystats_newmem, 2048, inventorystats_searchedAOB)
