[[cheat]]
id = "cheat-4"
name = "骁将历练"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

// 骁将历练进度
aobscanmodule(WarriorTrialProgressWrite,GameAssembly.dll,89 8E BC 00 00 00 44 8B 86 C0 00 00 00)
alloc(newmem,2048,WarriorTrialProgressWrite)
alloc(WarriorTrialProgressAddr,8)

label(returnhere)
registersymbol(WarriorTrialProgressWrite)
registersymbol(WarriorTrialProgressAddr)

newmem:
  push rbx
  lea rbx,[rsi+000000BC]
  mov [WarriorTrialProgressAddr],rbx
  pop rbx

  mov [rsi+000000BC],ecx
  jmp returnhere

WarriorTrialProgressWrite:
  jmp newmem
  nop
returnhere:

[DISABLE]

WarriorTrialProgressWrite:
  db 89 8E BC 00 00 00

unregistersymbol(WarriorTrialProgressWrite)
unregistersymbol(WarriorTrialProgressAddr)
dealloc(WarriorTrialProgressAddr)
dealloc(newmem)"""

