[[cheat]]
id = "cheat"
name = "铜钱反加"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(GoldSpend,GameAssembly.dll,29 5E 48 48 8D 54 24 78)
alloc(newmem,2048,GoldSpend)

label(returnhere)
registersymbol(GoldSpend)

newmem:
  add [rsi+48],ebx
  lea rdx,[rsp+78]
  jmp returnhere

GoldSpend:
  jmp newmem
  nop 3
returnhere:

[DISABLE]

GoldSpend:
  db 29 5E 48 48 8D 54 24 78

unregistersymbol(GoldSpend)
dealloc(newmem)"""

