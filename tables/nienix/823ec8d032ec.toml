[[cheat]]
id = "shop-pointer"
name = "Shop Pointer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(shop,41 B8 01 00 00 00 E8 ?? ?? ?? ?? 48 8D ?? ?? ?? 48 BA)
alloc(newmem,$1000,shop)

label(shopPtr)
label(shopBkp)
label(return)

newmem:
  mov rcx,shopPtr
  mov [rcx],rbx
shopBkp:
  readmem(shop+0B,5)
  jmp return

align 10
shopPtr:
  dq 0

shop+0B:
  jmp newmem
return:
registersymbol(shop)
registersymbol(shopBkp)
registersymbol(shopPtr)

[DISABLE]
