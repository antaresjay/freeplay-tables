id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
AoBScanModule(GunFireCallback, BorderlandsPreSequel.exe, F3 0F 58 41 ? F3 0F 58 45 ? 51 )
RegisterSymbol(GunFireCallback)
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem:
cmp [ebp+8],BF800000
jne originalcode
mov [ecx+6C],(float)999

originalcode:
addss xmm0,[ecx+6C]

exit:
jmp returnhere

//BorderlandsPreSequel.GetStackOwnerClass+17B1AB:
GunFireCallback:
jmp newmem
returnhere:

[DISABLE]
dealloc(GunFireCallback)
dealloc(returnhere)
dealloc(originalcode)
dealloc(exit)
UnRegisterSymbol(GunFireCallback)
GunFireCallback:
addss xmm0,[ecx+6C]"""
