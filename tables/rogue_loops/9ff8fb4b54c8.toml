name = "One Hit Kill"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
define(address,EnemyHpBehaviour:takeDamage)
define(bytes,55 48 8B EC 48 81 EC C0 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,EnemyHpBehaviour:takeDamage)

label(code)
label(return)
//Send@FearlessRevolution|Sintrix

newmem:
mov [rcx+148],(float)0
mov [rcx+14C],(float)0

