[[cheat]]
id = "max-population"
name = "Max Population"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(maxPopulation,$process,2B 98 68 02 00 00 E8 6D) // should be unique
alloc(newmem,$1000,maxPopulation)

label(code)
label(return)

newmem:
  cmp byte ptr [rax+60],00
  jne code
  mov [rax+268],ebx
code:
  sub ebx,[rax+00000268]
  jmp return

maxPopulation:
  jmp newmem
  nop
return:
registersymbol(maxPopulation)

[DISABLE]

maxPopulation:
  db 2B 98 68 02 00 00

unregistersymbol(maxPopulation)
dealloc(newmem)"""
