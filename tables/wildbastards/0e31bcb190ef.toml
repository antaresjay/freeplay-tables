[ENABLE]

aobscanregion(playercharacter,WeaponController:get_playerCharacter,WeaponController:get_playerCharacter+100,488B8EA0xx000033xx48xxxxxxxx9049BBxxxxxxxxxxxx000041xxxx85xx0Fxxxxxxxxxx49BAxxxxxxxxxxxx000048xxxx48xxxxxxxx90) //WeaponController:get_playerCharacter+f
alloc(newmem,$1000,playercharacter)
alloc(data,8)
alloc(playercharacterbkp,7)
registersymbol(data)
registersymbol(playercharacter)
registersymbol(playercharacterbkp)
label(code)
label(return)


playercharacterbkp:
  readmem(playercharacter,7)

newmem:
  mov [data],rsi

code:
  readmem(playercharacter,7)
  jmp return

playercharacter:
  jmp newmem
  nop 2
return:

[DISABLE]

playercharacter:
  readmem(playercharacterbkp,7)

unregistersymbol(*)
dealloc(*)"""
