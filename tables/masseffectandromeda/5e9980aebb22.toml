[[cheat]]
id = "no-weapon-overheat"
name = "No Weapon Overheat"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(energyWepAmmo,MassEffectAndromeda.exe,8D 4A FF 66 3B CA)
alloc(newmem,$50,"MassEffectAndromeda.exe"+6FFCAA)

label(code)
label(return)

newmem:

code:
lea ecx,[rdx]
cmp cx,dx
jmp return

energyWepAmmo:
jmp newmem
nop

return:

registersymbol(energyWepAmmo)

[DISABLE]

energyWepAmmo:
db 8D 4A FF 66 3B CA

unregistersymbol(energyWepAmmo)
dealloc(newmem)"""

[[cheat]]
