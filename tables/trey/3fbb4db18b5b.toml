[[cheat]]
id = "infinite-sp"
name = "Infinite Sp"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(SpA,GameAssembly.dll,8B ?? 89 ?? C3 90 49 ?? ?? ?? 77 ?? F3 ?? ?? ?? F3 ?? ?? ?? ?? ?? ?? F3 ?? ?? ?? F3 ?? ?? ?? ?? ?? ?? C3 4E ?? ?? ?? 48 ?? ?? 4C ?? ?? ?? 49 ?? ?? 0F ?? ?? ?? ?? ?? 83 ?? ?? ?? ?? ?? ?? 0F ?? ?? ?? ?? ?? 49 ?? ?? ?? ?? ?? ?? 76 ?? 49 ?? ?? ?? ?? ?? ?? 77 ?? 4C ?? ?? ?? 48 ?? ?? 4C ?? ?? ?? 4C ?? ?? 77 ?? F6 ?? ?? ?? ?? ?? ?? 0F ?? ?? ?? ?? ?? C5 ?? ?? ?? C4) // should be unique
alloc(newmem,$1000,SpA)

label(code)
label(return)
label(skip)

registersymbol(SpA)

newmem:
  push rax
  // resolve pointer chain with null-checks
  mov rax,[GameAssembly.dll+02A0DE18]
  test rax,rax
  jz skip
  mov rax,[rax+B8]
  test rax,rax
  jz skip
  mov rax,[rax+00]
  test rax,rax
  jz skip
  mov rax,[rax+10]
  test rax,rax
  jz skip
  mov rax,[rax+20]
  test rax,rax
  jz skip
  mov rax,[rax+D8]
  test rax,rax
  jz skip
  mov rax,[rax+18]
  test rax,rax
  jz skip
  add rax,2C                  // final Sp address
  cmp rdx,rax
  pop rax
  jne code
  mov [rdx],(int)12
  jmp code

skip:
  pop rax

code:
  mov ecx,[rdx]
  mov [rax],ecx
  ret
  jmp return

SpA:
  jmp newmem
  nop
return:

[DISABLE]
SpA:
  db 8B 0A 89 08 C3
unregistersymbol(SpA)
dealloc(newmem)"""

[[cheat]]
id = "infinite-tp"
name = "Infinite Tp"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(TpZa,GameAssembly.dll,8B ?? 89 ?? C3 90 49 ?? ?? ?? 77 ?? F3 ?? ?? ?? F3 ?? ?? ?? ?? ?? ?? F3 ?? ?? ?? F3 ?? ?? ?? ?? ?? ?? C3 4E ?? ?? ?? 48 ?? ?? 4C ?? ?? ?? 49 ?? ?? 0F ?? ?? ?? ?? ?? 83 ?? ?? ?? ?? ?? ?? 0F ?? ?? ?? ?? ?? 49 ?? ?? ?? ?? ?? ?? 76 ?? 49 ?? ?? ?? ?? ?? ?? 77 ?? 4C ?? ?? ?? 48 ?? ?? 4C ?? ?? ?? 4C ?? ?? 77 ?? F6 ?? ?? ?? ?? ?? ?? 0F ?? ?? ?? ?? ?? C5 ?? ?? ?? C4) // should be unique
alloc(newmem,$1000,TpZa)
label(code)
label(return)
label(skip)
newmem:
  push rbx
  // resolve Sp pointer chain with null-checks (base +02A0DE18)
  mov rbx,[GameAssembly.dll+02A0DE18]
  test rbx,rbx
  jz skip
  mov rbx,[rbx+B8]
  test rbx,rbx
  jz skip
  mov rbx,[rbx+00]
  test rbx,rbx
  jz skip
  mov rbx,[rbx+10]
  test rbx,rbx
  jz skip
  mov rbx,[rbx+20]
  test rbx,rbx
  jz skip
  mov rbx,[rbx+D0]
  test rbx,rbx
  jz skip
  mov rbx,[rbx+18]
  test rbx,rbx
  jz skip
  add rbx,2C            // final Sp address
  cmp rax,rbx           // dest addr in rax
  jne skip
  mov dword ptr [rdx],(int)99   // force source value only for Sp
skip:
  pop rbx
code:
  mov ecx,[rdx]
  mov [rax],ecx
  ret
  jmp return
TpZa:
  jmp newmem
return:
registersymbol(TpZa)
[DISABLE]
TpZa:
  db 8B 0A 89 08 C3
unregistersymbol(TpZa)
dealloc(newmem)"""

