source = """
[ENABLE]
label(Bob_savedAOB)
label(Bob_returnhere)
label(Bob_originalcode)
label(Bob_exit)

label(Bob_update_exit)
label(Bob_set_exit)
label(Bob_needsset_exit)
label(Bob_damageset_exit)
label(Bob_ageset_exit)

registersymbol(Bob_savedAOB)

//08D8023D - 48 89 85 F0FDFFFF     - mov [rbp-00000210],rax
//08D80244 - 89 85 F8FDFFFF        - mov [rbp-00000208],eax
// lib:Bob:UpdateRotation+5a
//08D8024A - 48 63 86 48040000     - movsxd  rax,dword ptr [rsi+00000448]
//08D80251 - 83 E8 03              - sub eax,03
//08D80254 - 48 89 85 80FDFFFF     - mov [rbp-00000280],rax
//08D8025B - 83 F8 06              - cmp eax,06
//08D8025E - 0F83 390B0000         - jae 08D80D9D
//08D80264 - 48 8B 85 80FDFFFF     - mov rax,[rbp-00000280]
aobscan(Bob_searchedAOB, 48 63 86 48 04 00 00 83 E8 03 48 89 85 80 FD FF FF 83 F8 06)

alloc(Bob_newmem, 2048, Bob_searchedAOB)
alloc(Bob_temp1, 8, Bob_searchedAOB)


Bob_newmem:
mov [Bob_temp1], (float)1600

cmp dword ptr [Bob_update_enable], #0
je Bob_update_exit
mov [Bob_basepointer], rsi
Bob_update_exit:

cmp dword ptr [Bob_set_enable], #0
je Bob_set_exit
Bob_set_exit:

cmp dword ptr [Bob_needsset_enable], #0
je Bob_needsset_exit
mov [rsi+4cc], (float)1
mov [rsi+4d0], (float)1
mov [rsi+4d8], (float)1
mov [rsi+4e0], (float)1
mov [rsi+4e4], (float)1
mov [rsi+4ec], (float)1
mov [rsi+4f0], (float)0
mov [rsi+4f8], (float)1
mov [rsi+4fc], (float)1
Bob_needsset_exit:

cmp dword ptr [Bob_damageset_enable], #0
je Bob_damageset_exit
mov [rsi+e8], (float)1
mov [rsi+530], (float)0
Bob_damageset_exit:

cmp dword ptr [Bob_ageset_enable], #0
je Bob_ageset_exit
fld [rsi+4c8]
fld [Bob_temp1]
fcomi ST(0), ST(1)
fstp ST(0)
fstp ST(0)
ja Bob_ageset_exit
mov [rsi+4c8], (float)1500
Bob_ageset_exit:


Bob_originalcode:
db 48 63 86 48 04 00 00
//movsxd  rax,dword ptr [rsi+00000448]


Bob_exit:
jmp Bob_returnhere


Bob_searchedAOB:
Bob_savedAOB:
jmp Bob_newmem
nop
nop
Bob_returnhere:


[DISABLE]
Bob_savedAOB:
db 48 63 86 48 04 00 00
//movsxd  rax,dword ptr [rsi+00000448]

unregistersymbol(Bob_savedAOB)

dealloc(Bob_newmem)
dealloc(Bob_temp1)"""

