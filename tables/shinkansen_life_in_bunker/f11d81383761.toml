source = """
[ENABLE]
label(Storage_savedAOB)
label(Storage_returnhere)
label(Storage_originalcode)
label(Storage_exit)

label(Storage_update_exit)
label(Storage_set_exit)
label(Storage_foodset_entry)
label(Storage_otherset_entry)
label(Storage_garbageset_entry)

registersymbol(Storage_savedAOB)

//2683A584 - 48 89 34 24           - mov [rsp],rsi
//2683A588 - 48 8B F1              - mov rsi,rcx
// lib:Storage:get_storageType+1b
//2683A58B - 48 8B 86 90010000     - mov rax,[rsi+00000190]
//2683A592 - 48 85 C0              - test rax,rax
//2683A595 - 75 04                 - jne 2683A59B
//2683A597 - 33 C0                 - xor eax,eax
//2683A599 - EB 11                 - jmp 2683A5AC
//2683A59B - 48 8B 86 90010000     - mov rax,[rsi+00000190]
//2683A5A2 - 48 8B C8              - mov rcx,rax
//2683A5A5 - 83 39 00              - cmp dword ptr [rcx],00
//2683A5A8 - 48 63 40 10           - movsxd  rax,dword ptr [rax+10]
//2683A5AC - 48 8B 34 24           - mov rsi,[rsp]
//2683A5B0 - 48 83 C4 08           - add rsp,08
aobscan(Storage_searchedAOB, 48 8B 86 90 01 00 00 48 85 C0 75 04 33 C0 EB 11 48 8B 86 90 01 00 00 48 8B C8 83 39 00 48 63 40 10)

alloc(Storage_newmem, 2048, Storage_searchedAOB)
alloc(Storage_temp1, 8, Storage_searchedAOB)


Storage_newmem:
mov [Storage_temp1], rbx

cmp dword ptr [Storage_update_enable], #0
je Storage_update_exit
mov [Storage_basepointer], rsi
Storage_update_exit:

cmp dword ptr [Storage_set_enable], #0
je Storage_set_exit
cmp qword ptr [rsi+190], #0
je Storage_set_exit
cmp dword ptr [rsi+190], #0
je Storage_set_exit
mov rbx, [rsi+190]

// Food
cmp dword ptr [rbx+10], #1
je Storage_foodset_entry
cmp dword ptr [rbx+10], #2
je Storage_foodset_entry
cmp dword ptr [rbx+10], #3
je Storage_foodset_entry
cmp dword ptr [rbx+10], #4
je Storage_foodset_entry

// Other
cmp dword ptr [rbx+10], #10
je Storage_otherset_entry
cmp dword ptr [rbx+10], #11
je Storage_otherset_entry

// Garbage
cmp dword ptr [rbx+10], #15
je Storage_garbageset_entry

jmp Storage_set_exit

Storage_foodset_entry:
mov [rbx+14], #35
jmp Storage_set_exit

Storage_otherset_entry:
mov [rbx+14], #490
jmp Storage_set_exit

Storage_garbageset_entry:
mov [rbx+14], #0
jmp Storage_set_exit

Storage_set_exit:

mov rbx, [Storage_temp1]


Storage_originalcode:
db 48 8B 86 90 01 00 00
//mov rax,[rsi+00000190]


Storage_exit:
jmp Storage_returnhere


Storage_searchedAOB:
Storage_savedAOB:
jmp Storage_newmem
nop
nop
Storage_returnhere:


[DISABLE]
Storage_savedAOB:
db 48 8B 86 90 01 00 00
//mov rax,[rsi+00000190]

unregistersymbol(Storage_savedAOB)

dealloc(Storage_newmem)
dealloc(Storage_temp1)"""

