[[cheat]]
id = "world-base-address-scan-initialization-activate-this-first"
name = "World Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(World_basepointer)
registersymbol(World_update_enable)
registersymbol(World_set_enable)
registersymbol(World_immortalset_enable)
registersymbol(World_researchset_enable)
registersymbol(World_timeset_enable)

alloc(World_basepointer, 8)
alloc(World_update_enable, 4)
alloc(World_set_enable, 4)
alloc(World_immortalset_enable, 4)
alloc(World_researchset_enable, 4)
alloc(World_timeset_enable, 4)


[DISABLE]
unregistersymbol(World_basepointer)
unregistersymbol(World_update_enable)
unregistersymbol(World_set_enable)
unregistersymbol(World_immortalset_enable)
unregistersymbol(World_researchset_enable)
unregistersymbol(World_timeset_enable)

dealloc(World_basepointer)
dealloc(World_update_enable)
dealloc(World_set_enable)
dealloc(World_immortalset_enable)
dealloc(World_researchset_enable)
dealloc(World_timeset_enable)"""

[[cheat]]
id = "world-base-address-scan-to-activate-load-level-to-update-play-level"
name = "World Base Address Scan (To Activate: Load Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(World_savedAOB)
label(World_returnhere)
label(World_originalcode)
label(World_exit)

label(World_update_exit)
label(World_set_exit)
label(World_immortalset_exit)
label(World_researchset_exit)
label(World_timeset_exit)

registersymbol(World_savedAOB)

//08D8AE53 - F2 0F5A E8            - cvtsd2ss xmm5,xmm0
//08D8AE57 - F3 0F11 6D 9C         - movss [rbp-64],xmm5
// lib:World:Update+7c
//08D8AE5C - F3 0F10 86 B8020000   - movss xmm0,[rsi+000002B8]
//08D8AE64 - F3 0F5A C0            - cvtss2sd xmm0,xmm0
//08D8AE68 - F3 0F10 4D 9C         - movss xmm1,[rbp-64]
//08D8AE6D - F3 0F5A C9            - cvtss2sd xmm1,xmm1
//08D8AE71 - F2 0F58 C1            - addsd xmm0,xmm1
//08D8AE75 - F2 0F5A E8            - cvtsd2ss xmm5,xmm0
aobscan(World_searchedAOB, F3 0F 10 86 B8 02 00 00 F3 0F 5A C0 F3 0F 10 4D 9C)

alloc(World_newmem, 2048, World_searchedAOB)


World_newmem:
cmp dword ptr [World_update_enable], #0
je World_update_exit
mov [World_basepointer], rsi
World_update_exit:

cmp dword ptr [World_set_enable], #0
je World_set_exit
World_set_exit:

cmp dword ptr [World_immortalset_enable], #0
je World_immortalset_exit
mov byte ptr [rsi+3c9], #1
World_immortalset_exit:

cmp dword ptr [World_researchset_enable], #0
je World_researchset_exit
mov [rsi+2cc], #999999
World_researchset_exit:

cmp dword ptr [World_timeset_enable], #0
je World_timeset_exit
mov [rsi+2b8], (float)0
World_timeset_exit:


World_originalcode:
db F3 0F 10 86 B8 02 00 00
//movss xmm0,[rsi+000002B8]


World_exit:
jmp World_returnhere


World_searchedAOB:
World_savedAOB:
jmp World_newmem
nop
nop
nop
World_returnhere:


[DISABLE]
World_savedAOB:
db F3 0F 10 86 B8 02 00 00
//movss xmm0,[rsi+000002B8]

unregistersymbol(World_savedAOB)

dealloc(World_newmem)"""

