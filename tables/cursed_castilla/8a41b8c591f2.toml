[[cheat]]
id = "double-jump-effect-run-speed-read-extra-table"
name = "Double Jump Effect + Run Speed (Read Extra Table)"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,48)
label(returnhere)
label(_banana)
registersymbol(_banana)
newmem:
mov edx,[edi+10]
lea ecx,[eax+eax*2]
cmp [esp+10],1D
jne returnhere
mov [_banana],edi
jmp returnhere
_banana:
dd 0
"Cursed_Castilla.exe"+3F566:
jmp newmem
nop
returnhere:
[DISABLE]
dealloc(newmem)
"Cursed_Castilla.exe"+3F566:
db 8B 57 10 8D 0C 40
unregistersymbol(_banana)
//mov edx,[edi+10]
//lea ecx,[eax+eax*2]"""

