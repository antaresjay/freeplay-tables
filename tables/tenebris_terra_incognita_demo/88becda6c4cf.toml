[[cheat]]
id = "all-hero-stats-chance-in-script"
name = "All Hero Stats - [ Chance In Script ]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Tenebris Terra Incognita (Demo).exe
  Version: 
  Date   : 2023-05-11
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(pData_TechnicusHeroes,GameAssembly.dll,F3 0F 10 82 2C 01 00 00 F3 0F 59) // should be unique
alloc(newmem,$1000,pData_TechnicusHeroes)

label(code)
label(return)

newmem:
  mov [rdx+0000012C],(float)1500           //healthMax
  mov [rdx+00000130],(float)1500           //armorMax
  mov [rdx+00000194],(float)1500           //HealthCurrent
  mov [rdx+00000198],(float)150            //initiative
  mov [rdx+000001A0],(float)50             //Speed
  mov [rdx+000001A4],(float)100            //Dodge
  mov [rdx+000001A8],(float)100            //Accuracy
  mov [rdx+000001AC],(float)1000           //crit_chance

code:
  movss xmm0,[rdx+0000012C]
  jmp return

pData_TechnicusHeroes:
  jmp newmem
  nop 3
return:
registersymbol(pData_TechnicusHeroes)

[DISABLE]

pData_TechnicusHeroes:
  db F3 0F 10 82 2C 01 00 00

unregistersymbol(pData_TechnicusHeroes)
dealloc(newmem)"""

