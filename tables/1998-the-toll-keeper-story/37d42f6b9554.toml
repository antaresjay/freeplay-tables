[[cheat]]
id = "game-manager-ctrl-numpad-1-click-on-the-lady-diary-to-populate-values"
name = "Game Manager (Ctrl + Numpad 1) {Click on the Lady/Diary to populate values}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : 1998 The Toll Keeper Story.exe
// Author            : ndck76
// Executable Version: 2021.3.13.32088
// Game Version      : v1.0.8f3
// Script Date       : 2025-12-24


[ENABLE]

aobscanregion(playerdatamanager,Days.DiaryWindow:OnOpenWindow,Days.DiaryWindow:OnOpenWindow+200,488Bxxxx48xxxxxx48xxxxxx83xxxx48xxxxxx48xxxxxx48xxxx83xxxx48xxxxxx48xxxxxx48xxxxxx48xxxx0Fxxxxxxxxxx) //Days.DiaryWindow:OnOpenWindow+2b
alloc(newmem,$1000,playerdatamanager)
alloc(data,8)
alloc(playerdatamanagerbkp,8)
registersymbol(data)
registersymbol(playerdatamanager)
registersymbol(playerdatamanagerbkp)
label(code)
label(return)

playerdatamanagerbkp:
  readmem(playerdatamanager,8)

newmem:
  mov [data],rax

code:
  readmem(playerdatamanager,8)
  jmp return

playerdatamanager:
  jmp newmem
  nop 3
return:

[DISABLE]

playerdatamanager:
  readmem(playerdatamanagerbkp,8)

unregistersymbol(*)
dealloc(*)"""

