[[cheat]]
id = "max-proficiency"
name = "MAX proficiency 术法满熟练度"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(PROF_AOB,48 63 48 24 03 CF 89 48 24 48 63 40 24 48 89 85 ?? ?? ?? ?? 49 8B CF 41 83 3F 00)
alloc(newmem,2048,PROF_AOB)

label(returnhere)
registersymbol(PROF_AOB)

newmem:
  // 保存临时寄存器
  push r11

  // r11d = edi * 100
  // 64 是十六进制，即十进制 100
  imul r11d,edi,64

  // 原本是 ecx = ecx + edi
  // 修改为 ecx = ecx + edi * 100
  add ecx,r11d

  pop r11

  // 执行被覆盖的第二条原始指令
  mov [rax+24],ecx
  jmp returnhere

// PROF_AOB 指向：movsxd rcx,[rax+24]
// +4 后指向：add ecx,edi
PROF_AOB+4:
  jmp newmem

returnhere:


[DISABLE]

PROF_AOB+4:
  db 03 CF 89 48 24
  // add ecx,edi
  // mov [rax+24],ecx

unregistersymbol(PROF_AOB)
dealloc(newmem)"""

