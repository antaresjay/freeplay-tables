[ENABLE]

aobscanmodule(ohk,GameAssembly.dll,44 0F 2F 6F 68) //440Fxxxxxx0F82xxxxxxxx33xxE8xxxxxxxxF3xxxxxxxxxxxxxxF3xxxxxxxxxxxxxx0F2F//Pawn.DamageEvent
