[[cheat]]
id = "infinite-ninja-power"
name = "Infinite Ninja Power"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanregion(get_infNinjaPower,Paris.Game.Actor.Player::TryStartAttack,Paris.Game.Actor.Player::TryStartAttack+1000,8B 10 EB * 48)
registersymbol(get_infNinjaPower)
alloc(get_infNinjaPowerS,2)
registersymbol(get_infNinjaPowerS)

get_infNinjaPowerS:
readmem(get_infNinjaPower+2,2)

get_infNinjaPower+2:
db 90 90
 
[DISABLE]
get_infNinjaPower+2:
readmem(get_infNinjaPowerS,2)

dealloc(*)
unregistersymbol(*)"""

