type = "script"
source = """
[ENABLE]

aobscanmodule(LocalPlayerPtr,PE-Win64-Shipping.exe,49 8B 07 48 8D 95 60 03 00 00)
alloc(newmem,$1000,LocalPlayerPtr)
registersymbol(gLocal)
label(code return gLocal)

newmem:
mov [gLocal],r15

code:
  mov rax,[r15]
  lea rdx,[rbp+00000360]
  jmp return

gLocal:
dw

