aobscan(char,8B 48 3C 83 EC 04 51) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(char_ptr)

newmem:
  mov [char_ptr],eax
code:
  mov ecx,[eax+3C]
  sub esp,04
  jmp return

char_ptr:
  dd 0

char:
  jmp newmem
  nop
return:
registersymbol(char)
registersymbol(char_ptr)

[DISABLE]

char:
  db 8B 48 3C 83 EC 04

unregistersymbol(*)
dealloc(newmem)

