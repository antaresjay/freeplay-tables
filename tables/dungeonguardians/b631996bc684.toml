[[cheat]]
id = "full-health"
name = "Full Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : DungeonGuardians.exe
  Version:
  Date   : 2021-08-21
  Author : Marc

  Original cheat by Zanzer, updated by Marc
}

[ENABLE]

aobscan(health,8B 40 40 50 DB 04 24) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  push ebx               // save EBX
  mov ebx,[eax+88]       // load pointer from eax+88
  fld dword ptr [ebx+24] // get [eax+88]+24 = max life
  fistp [eax+40]         // save it into eax+40 als integer
  pop ebx                // restore our original EBX
code:
  mov eax,[eax+40]
  push eax
  fild dword ptr [esp]
  jmp return

health:
  jmp newmem
  nop 2
return:
registersymbol(health)

[DISABLE]

health:
  db 8B 40 40 50 DB 04 24

unregistersymbol(health)
dealloc(newmem)

