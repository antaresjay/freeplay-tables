  This script does blah blah blah
}

[ENABLE]

aobscanregion(pData_PlayerStateController,SodaDen.Pacha.PlayerStateController:Update,SodaDen.Pacha.PlayerStateController:Update+250,0F B6 86 35 04 00 00 85 C0 0F) // should be unique
alloc(newmem,$1000,pData_PlayerStateController)

alloc(pBase_PlayerStateController,8)
registersymbol(pBase_PlayerStateController)

label(code)
label(return)

pBase_PlayerStateController:
dd

newmem:

code:
  mov [pBase_PlayerStateController],rsi
  movzx eax,byte ptr [rsi+00000435]
  jmp return

pData_PlayerStateController:
  jmp newmem
  nop 2
return:
registersymbol(pData_PlayerStateController pBase_PlayerStateController)

[DISABLE]

pData_PlayerStateController:
  db 0F B6 86 35 04 00 00

unregistersymbol(*)
dealloc(*)"""

