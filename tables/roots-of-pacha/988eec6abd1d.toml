[[cheat]]
id = "max-friendships-open-npc-or-animal-relationship-list"
name = "Max Friendships (Open NPC or Animal relationship list)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,SodaDen.Pacha.Friendship:CurrentFriendshipWith)
define(bytes,55 48 8B EC 48 83 EC 40 48 89 7D F8 48 8B F9)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  push rbp
  mov rbp,rsp
  sub rsp,40
  mov [rbp-08],rdi
  mov rdi,rcx

   push rax
   push rbx
   push rcx
   push rdx
   push rbp
   push rdi
   push rsi
   push r8
   push r9
   push r10
   push r11
   push r12
   push r13
   push r14
   push r15

     sub rsp,78
     mov r8,#10000 // this value gets added to the current friendship value
     mov r11,"Friendship:UpdateFriendship"
     call r11
     add rsp,78

   pop r15
   pop r14
   pop r13
   pop r12
   pop r11
   pop r10
   pop r9
   pop r8
   pop rsi
   pop rdi
   pop rbp
   pop rdx
   pop rcx
   pop rbx
   pop rax

  jmp return

address:
  jmp far newmem
  nop
return:

[DISABLE]

address:
  db bytes
  // push rbp
  // mov rbp,rsp
  // sub rsp,40
  // mov [rbp-08],rdi
  // mov rdi,rcx"""

