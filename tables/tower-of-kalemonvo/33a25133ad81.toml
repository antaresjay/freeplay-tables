[[cheat]]
id = "life-and-mana-manager-ctrl-numpad-1"
name = "Life And Mana Manager (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Tower of Kalemonvo.exe
// Author            : ndck76
// Executable Version: 2019.4.40.50731
// Game Version      : v1.0
// Script Date       : 2026-07-01


[ENABLE]

aobscanregion(alive,Combat_Arts_UI:Update,Combat_Arts_UI:Update+300,0FB680xxxx000085xx0Fxxxxxxxxxx8Bxxxx0Fxxxxxxxxxxxx85xx0Fxxxxxxxxxx33xxE9xxxxxxxx8Dxxxx) //Combat_Arts_UI:Update+11d
alloc(newmem,$1000)
alloc(data,8)
alloc(alivebkp,7)
registersymbol(data)
registersymbol(alive)
registersymbol(alivebkp)
label(code)
label(return)

alivebkp:
  readmem(alive,7)

newmem:
  mov [data],eax

code:
  readmem(alive,7)
  jmp return

alive:
  jmp newmem
  nop 2
return:

[DISABLE]

alive:
  readmem(alivebkp,7)

unregistersymbol(*)
dealloc(*)"""

