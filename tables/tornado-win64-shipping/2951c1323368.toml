[[cheat]]
id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(ammocd,$process,44 8B A6 0C 04 00 00 48 8D 4C 24 20 44 89 B6 08 04 00 00) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

  mov dword ptr [rsi+40C], #99

code:
  mov r12d,[rsi+0000040C]
  lea rcx,[rsp+20]
  mov [rsi+00000408],r14d
  jmp return

ammoFlag:
dd 0

ammocd:
  jmp far newmem
  nop
  nop
  nop
  nop
  nop
return:
registersymbol(ammocd)

[DISABLE]

ammocd:
  db 44 8B A6 0C 04 00 00 48 8D 4C 24 20 44 89 B6 08 04 00 00

unregistersymbol(ammocd)
unregistersymbol(ammoFlag)
dealloc(newmem)"""
