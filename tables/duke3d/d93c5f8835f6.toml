[[cheat]]
id = "invulnerability-main-game"
name = "Invulnerability (Main Game)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,duke3d.exe,0F BF 88 8A 4B ?? ?? 85 C9 7E 74) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov [eax+duke3d.sprite+2A],C8
  movsx ecx,word ptr [eax+duke3d.sprite+2A]
  jmp return

INJECT:
  jmp code
  nop
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 0F BF 88 8A 4B DB 01

unregistersymbol(INJECT)
dealloc(newmem)

duke3d.exe+E4A7E:
  movsx ecx,word ptr [eax+duke3d.exe+19D4B8A]"""

