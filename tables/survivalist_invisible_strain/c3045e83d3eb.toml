//Send@ModEngine
[ENABLE]

aobscanregion(sleep,Character:SimulateSurvivalFactors+410e,Character:SimulateSurvivalFactors+4131,C1 F2 0F 5A E8 F3 0F 11 AE 38 07 00 00)
