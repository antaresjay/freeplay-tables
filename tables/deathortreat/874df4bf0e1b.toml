[[cheat]]
id = "prepare-cheats"
name = "Prepare Cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(preparecheatscd, SaonaStudios.Core:Character:UpdateAnimators+205, SaonaStudios.Core:Character:UpdateAnimators+35f, 39 00 0F B6 40 50) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(chargecd)

label(playerPtr)
registersymbol(playerPtr)

label(healthPtr)
registersymbol(healthPtr)

label(healthFlag)
registersymbol(healthFlag)

label(chargeFlag)
registersymbol(chargeFlag)


newmem:
  push ebx
  push ecx

  mov ebx,eax
  test ebx,ebx
  je code

  mov ebx,[ebx+C]
  test ebx,ebx
  je code

  cmp dword ptr [ebx+C], 6B0053 // SkillAbility (Unicode)
  jne code

  mov [playerPtr], eax

  mov ecx,[eax+2C]
  test ecx,ecx
  je code

  mov [healthPtr], ecx

  cmp dword ptr [healthFlag], 1
  jne chargecd

  fld dword ptr [ecx+3C] // BaseMaximumHealth
  fstp dword ptr [ecx+34] // _currentHealth

chargecd:

  cmp dword ptr [chargeFlag], 1
  jne code

  mov [eax+88], (float)400

code:
  pop ecx
  pop ebx
  cmp [eax],eax
  movzx eax,byte ptr [eax+50]
  jmp return

playerPtr:
dd 0

healthPtr:
dd 0

healthFlag:
dd 0

chargeFlag:
dd 0

preparecheatscd:
  jmp newmem
  nop
return:
registersymbol(preparecheatscd)

[DISABLE]

preparecheatscd:
  db 39 00 0F B6 40 50

unregistersymbol(preparecheatscd)
unregistersymbol(playerPtr)
unregistersymbol(healthPtr)
unregistersymbol(healthFlag)
unregistersymbol(chargeFlag)
dealloc(newmem)

