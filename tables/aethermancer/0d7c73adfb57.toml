[[cheat]]
id = "cheat"
name = "𝐏𝐥𝐚𝐲𝐞𝐫"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{  Game Executable   : Aethermancer.exe
   Script Date       : 2025-09-25
   Author            : Sianz
}

[ENABLE]
aobscanregion(aobplayer,PlayerController:Update,PlayerController:Update+50,48 8B 80 ?? 00 00 00)
alloc(memplayer,$1000,aobplayer)
alloc(l_player,8)
label(s_player codplayer)
registersymbol(aobplayer codplayer l_player)
memplayer:
test rax,rax
je s_player
mov [l_player],rax
s_player:
codplayer:
readmem(aobplayer,7)
jmp retplayer
aobplayer:
jmp memplayer
nop 2
retplayer:
[DISABLE]
aobplayer:
readmem(codplayer,7)
unregistersymbol(*)
dealloc(*)"""

