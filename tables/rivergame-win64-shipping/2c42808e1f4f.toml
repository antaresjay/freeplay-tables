[[cheat]]
id = "resource"
name = "物资修改 Resource"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Resources,RiverGame-Win64-Shipping.exe,48 63 56 08 44 8B D7) // should be unique
alloc(newmem,$1000,Resources)

label(code)
label(return)
alloc(ResourcesValues,4)
registersymbol(ResourcesValues)
newmem:

  mov [ResourcesValues],rsi

code:
  movsxd  rdx,dword ptr [rsi+08]
  mov r10d,edi
  jmp return

Resources:
  jmp newmem
  nop 2
return:
registersymbol(Resources)

[DISABLE]

Resources:
  db 48 63 56 08 44 8B D7

unregistersymbol(Resources ResourcesValues)
dealloc(newmem ResourcesValues)"""

