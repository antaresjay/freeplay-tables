[[cheat]]
id = "main-game-script-ctrl-numpad-1"
name = "Main Game Script (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : KemonoHeroes.exe
// Author            : ndck76
// Executable Version: 2022.3.29.20748
// Game Version      : Build.14977058
// Script Date       : 2026-07-03


[ENABLE]

aobscanregion(pausetime,Assets.Scripts.MainGameScript:ActivatePause,Assets.Scripts.MainGameScript:ActivatePause+400,F30F1086xxxx0000F3xxxxxxF3xxxxxxxxF3xxxxxxF2xxxxxxF2xxxxxxF3xxxxxxxxxxxxxx48xxxxxxxxxxxx83xxxx0Fxxxxxxxxxx33xx) //Assets.Scripts.MainGameScript:ActivatePause+46
alloc(newmem,$1000,pausetime)
alloc(data,8)
alloc(pausetimebkp,8)
registersymbol(data)
registersymbol(pausetime)
registersymbol(pausetimebkp)
label(code)
label(return)

pausetimebkp:
  readmem(pausetime,8)

newmem:
  mov [data],rsi

code:
  readmem(pausetime,8)
  jmp return

pausetime:
  jmp newmem
  nop 3
return:

[DISABLE]

pausetime:
  readmem(pausetimebkp,8)

unregistersymbol(*)
dealloc(*)"""

