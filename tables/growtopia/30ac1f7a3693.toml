[[cheat]]
id = "long-place"
name = "Long Place"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048,"Growtopia.exe"+3AF1A6) 
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here

originalcode:
add eax,70
movd xmm0,eax

exit:
jmp returnhere

"Growtopia.exe"+3AF1A6:
jmp newmem
nop 2
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
"Growtopia.exe"+3AF1A6:
add eax,02
movd xmm0,eax
//Alt: db 83 C0 02 66 0F 6E C0"""

