[[cheat]]
id = "always-have-5000-gold"
name = "Always have 5000 gold"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(INJECT,8B 40 68 83 EC 0C 50 E8) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov [eax+68],1388
  mov eax,[eax+68]
  sub esp,0C
  jmp return

INJECT:
  jmp code
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 8B 40 68 83 EC 0C

unregistersymbol(INJECT)
dealloc(newmem)"""

