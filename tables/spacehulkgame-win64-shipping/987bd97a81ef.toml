type = "script"
source = """
[ENABLE]

aobscanmodule(ammo,SpaceHulkGame-Win64-Shipping.exe,c2 89 81 2C 04 00 00)
alloc(newmem,$1000,ammo)

label(code)
label(return)

newmem:

code:
