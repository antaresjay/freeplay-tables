[[cheat]]
id = "shields-base-address-scan-to-activate-battle-to-update-battle"
name = "Shields Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Shields_savedAOB)
label(Shields_returnhere)
label(Shields_originalcode)
label(Shields_exit)

label(Shields_update_exit)
label(Shields_set_exit)

registersymbol(Shields_savedAOB)

// EnergyBar:Update+14
aobscan(Shields_searchedAOB,8B 47 38 8B C8 39 09 D9 40 1C D9 5D D8)

alloc(Shields_newmem,2048)


Shields_newmem:
cmp dword ptr [Shields_update_enable], #0
je Shields_update_exit
mov [Shields_basepointer], edi
Shields_update_exit:

cmp dword ptr [Shields_set_enable], #0
je Shields_set_exit
cmp dword ptr [edi+38], #0
je Shields_set_exit
mov eax, [edi+38]
fld [eax+10]
fstp [eax+1c]
Shields_set_exit:


Shields_originalcode:
db 8B 47 38 8B C8
//mov eax,[edi+38]
//mov ecx,eax


Shields_exit:
jmp Shields_returnhere


Shields_searchedAOB:
Shields_savedAOB:
jmp Shields_newmem
Shields_returnhere:


[DISABLE]
Shields_savedAOB:
db 8B 47 38 8B C8
//mov eax,[edi+38]
//mov ecx,eax

unregistersymbol(Shields_savedAOB)

dealloc(Shields_newmem)"""

