registersymbol(playerstats_gasset_enable)
registersymbol(playerstats_evaset_enable)
registersymbol(playerstats_temperatureset_enable)
registersymbol(playerstats_powerset_enable)
registersymbol(playerstats_moduledamageset_enable)
