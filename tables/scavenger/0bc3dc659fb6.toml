alloc(playerstats_basepointer, 4)
alloc(playerstats_update_enable, 4)
alloc(playerstats_set_enable, 4)
alloc(playerstats_damageset_enable, 4)
alloc(playerstats_gasset_enable, 4)
alloc(playerstats_evaset_enable, 4)
alloc(playerstats_temperatureset_enable, 4)
alloc(playerstats_powerset_enable, 4)
alloc(playerstats_moduledamageset_enable, 4)
alloc(playerstats_moduleresearchset_enable, 4)


[DISABLE]
unregistersymbol(playerstats_basepointer)
unregistersymbol(playerstats_update_enable)
unregistersymbol(playerstats_set_enable)
unregistersymbol(playerstats_damageset_enable)
unregistersymbol(playerstats_gasset_enable)
unregistersymbol(playerstats_evaset_enable)
unregistersymbol(playerstats_temperatureset_enable)
unregistersymbol(playerstats_powerset_enable)
unregistersymbol(playerstats_moduledamageset_enable)
unregistersymbol(playerstats_moduleresearchset_enable)

dealloc(playerstats_basepointer)
dealloc(playerstats_update_enable)
dealloc(playerstats_set_enable)
dealloc(playerstats_damageset_enable)
dealloc(playerstats_gasset_enable)
dealloc(playerstats_evaset_enable)
dealloc(playerstats_temperatureset_enable)
dealloc(playerstats_powerset_enable)
dealloc(playerstats_moduledamageset_enable)
dealloc(playerstats_moduleresearchset_enable)"""

[[cheat]]
id = "player-stats-base-address-scan-to-update-play-level"
name = "Player Stats Base Address Scan (To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstats_update_exit)
label(playerstats_set_exit)
label(playerstats_damageset_exit)
label(playerstats_gasset_exit)
label(playerstats_evaset_exit)
label(playerstats_temperatureset_exit)
label(playerstats_powerset_exit)
label(playerstats_moduledamageset_exit)
label(playerstats_moduledamageset_entry)
label(playerstats_moduleresearchset_exit)
label(playerstats_moduleresearchset_entry)

registersymbol(playerstats_savedAOB)

//Scavenger.exe+DFB8 - E8 60C70500           - call Scavenger.exe+6A71D
// Accesses Radiation
//Scavenger.exe+DFBD - 8B 1D 501E5C00        - mov ebx,[Scavenger.exe+1C1E50]
//Scavenger.exe+DFC3 - 89 D8                 - mov eax,ebx
//Scavenger.exe+DFC5 - B9 B80B0000           - mov ecx,00000BB8
//Scavenger.exe+DFCA - 99                    - cdq
//Scavenger.exe+DFCB - F7 F9                 - idiv ecx
//Scavenger.exe+DFCD - 89 D3                 - mov ebx,edx
//Scavenger.exe+DFCF - 83 FB 64              - cmp ebx,64
//Scavenger.exe+DFD2 - 7E 12                 - jle Scavenger.exe+DFE6
//Scavenger.exe+DFD4 - 68 01000000           - push 00000001
//Scavenger.exe+DFD9 - 68 07000000           - push 00000007
aobscan(playerstats_searchedAOB, 89 D8 B9 B8 0B 00 00 99 F7 F9 89 D3 83 FB 64 7E 12)

alloc(playerstats_newmem, 2048, playerstats_searchedAOB)
alloc(playerstats_temp1, 4, playerstats_searchedAOB)
alloc(playerstats_temp2, 4, playerstats_searchedAOB)
alloc(playerstats_temp3, 4, playerstats_searchedAOB)
alloc(playerstats_temp4, 4, playerstats_searchedAOB)
alloc(playerstats_temp5, 4, playerstats_searchedAOB)


playerstats_newmem:
mov [playerstats_temp1], eax
mov [playerstats_temp2], ebx
mov [playerstats_temp3], ecx
mov [playerstats_temp4], edx

mov ebx, [playerstats_savedAOB-4]

cmp dword ptr [playerstats_update_enable], #0
je playerstats_update_exit
mov [playerstats_basepointer], ebx
playerstats_update_exit:

cmp dword ptr [playerstats_set_enable], #0
je playerstats_set_exit
playerstats_set_exit:

cmp dword ptr [playerstats_damageset_enable], #0
je playerstats_damageset_exit
//mov [ebx-114c8], (float)0
mov [ebx-62c], (float)0
mov [ebx-5f8], (float)-9999999
mov [ebx-55c], (float)0
mov [ebx-1fc], (float)0
mov [ebx-128], (float)-9999999
mov ecx, [ebx]
mov [ebx+168], ecx
playerstats_damageset_exit:

cmp dword ptr [playerstats_gasset_enable], #0
je playerstats_gasset_exit
mov [ebx+3c], #2000000000
playerstats_gasset_exit:

cmp dword ptr [playerstats_evaset_enable], #0
je playerstats_evaset_exit
mov [ebx-3f8], #1500000
playerstats_evaset_exit:

cmp dword ptr [playerstats_temperatureset_enable], #0
je playerstats_temperatureset_exit
mov [ebx-528], (float)0
playerstats_temperatureset_exit:

cmp dword ptr [playerstats_powerset_enable], #0
je playerstats_powerset_exit
mov [ebx-11900], (float)9999
playerstats_powerset_exit:

cmp dword ptr [playerstats_moduledamageset_enable], #0
je playerstats_moduledamageset_exit
mov edx, #311
mov eax, [ebx+6f4]
test eax, eax
je playerstats_moduledamageset_exit
playerstats_moduledamageset_entry:
mov byte ptr [eax+edx], #0
dec edx
cmp edx, #0
je playerstats_moduledamageset_exit
jmp playerstats_moduledamageset_entry
playerstats_moduledamageset_exit:

cmp dword ptr [playerstats_moduleresearchset_enable], #0
je playerstats_moduleresearchset_exit
mov edx, #311
mov eax, [ebx+6a0]
test eax, eax
je playerstats_moduleresearchset_exit
playerstats_moduleresearchset_entry:
mov [eax+edx*4], #99999
dec edx
cmp edx, #0
je playerstats_moduleresearchset_exit
jmp playerstats_moduleresearchset_entry
playerstats_moduleresearchset_exit:

mov eax, [playerstats_temp1]
mov ebx, [playerstats_temp2]
mov ecx, [playerstats_temp3]
mov edx, [playerstats_temp4]


playerstats_originalcode:
db 89 D8 B9 B8 0B 00 00
//mov eax,ebx
//mov ecx,00000BB8


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB:
playerstats_savedAOB:
jmp playerstats_newmem
nop
nop
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
db 89 D8 B9 B8 0B 00 00
//mov eax,ebx
//mov ecx,00000BB8

unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)
dealloc(playerstats_temp1)
dealloc(playerstats_temp2)
dealloc(playerstats_temp3)
dealloc(playerstats_temp4)
dealloc(playerstats_temp5)"""

