[[cheat]]
id = "player"
name = "player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
define(address,PlayCore:PlayState+a)
define(bytes,0F B6 47 74 85 C0)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000)

label(code)
label(return)

alloc(core,4)
registersymbol(core)

newmem:

code:
  mov [core],edi
  movzx eax,byte ptr [edi+74]
  test eax,eax
  jmp return

address:
  jmp newmem
  nop
return:

[DISABLE]

address:
  db bytes
  // movzx eax,byte ptr [edi+74]
  // test eax,eax

dealloc(newmem)
dealloc(core)
unregistersymbol(core)"""

