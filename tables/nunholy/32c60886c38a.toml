type = "script"
source = """
{ Game   : Nunholy.exe
  Version: 
  Date   : 2025-01-17
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanregion(pData_Character,Cha:IsUIOpened,Cha:IsUIOpened+70,0F B6 86 CD 00 00 00 85) // should be unique
alloc(newmem,$1000,pData_Character)

alloc(pBase_Character,8)
registersymbol(pBase_Character)

label(code)
label(return)

pBase_Character:
dd

newmem:

code:
  mov [pBase_Character],rsi
  movzx eax,byte ptr [rsi+000000CD]
  jmp return

pData_Character:
  jmp newmem
  nop 2
return:
registersymbol(pData_Character pBase_Character)

[DISABLE]

pData_Character:
  db 0F B6 86 CD 00 00 00

unregistersymbol(*)
dealloc(*)"""

