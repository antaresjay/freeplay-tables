[[cheat]]
id = "stop-timer"
name = "Stop Timer"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(stoptimer2,D9 46 18 D9 1C 24 E8 * * * * D9 04 24)
alloc(newmem,$100)

label(code)
label(return)
label(timervalue)

newmem:

code:
  fld dword ptr [timervalue]
  fstp dword ptr [esp]
  jmp return

timervalue:
dq (double)100

stoptimer2:
  jmp newmem
  nop
return:
registersymbol(stoptimer2)

[DISABLE]

stoptimer2:
  db D9 46 18 D9 1C 24

unregistersymbol(stoptimer2)
dealloc(newmem)"""

[[cheat]]
