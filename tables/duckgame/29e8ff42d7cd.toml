[[cheat]]
id = "disable-wall-collions-godmode"
name = "Disable Wall Collions / Godmode "
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,DuckGame.Thing::set_collisionSize+8)
define(bytes,D9 44 24 04 D9 18)

[ENABLE]

assert(address,bytes)
alloc(newmem,$100)

alloc(_collsion,4)

label(originalcode)
label(return)

_collsion:
dd 0

newmem:
cmp [eax+43C],00
je originalcode

fld dword ptr [_collsion]
fstp dword ptr [eax]
jmp return

originalcode:
  fld dword ptr [esp+04]
  fstp dword ptr [eax]
  jmp return

address:
  jmp newmem
  nop
return:

[DISABLE]

address:
  db bytes

dealloc(newmem)"""

