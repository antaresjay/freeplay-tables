[[cheat]]
id = "item"
name = "item"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : re8.exe
  Version: Gold
  Date   : 2023-03-11
  Author : Oyyzj

  Have atleast 2, otherwise quest item will not disappear.
  Affecting following:
    - matz for crafting
    - ammo inside inventory
    - herbs for rose
}

[ENABLE]
aobscanmodule(ItemNoSub,re8.exe,2B F0 89 71 4C) // should be unique
alloc(newmem,100,ItemNoSub)
alloc(pItemNoSub,4)
label(code)
label(return)
label(greater)
label(rItemNoSub)
newmem:
  mov [pItemNoSub],rcx
  cmp esi,02
  jl code
  cmp esi,0B
  jg greater
  xor eax,eax
  mov [rcx+4C],esi
  jmp return
greater:
  dec [rcx+4C]
  jmp return
code:
  sub esi,eax
  mov [rcx+4C],esi
  jmp return
rItemNoSub:
  readmem(ItemNoSub,5)
ItemNoSub:
  jmp newmem
return:
registersymbol(ItemNoSub)
registersymbol(rItemNoSub)
registersymbol(pItemNoSub)
[DISABLE]
ItemNoSub:
  readmem(rItemNoSub,5)
unregistersymbol(rItemNoSub)
unregistersymbol(pItemNoSub)
unregistersymbol(ItemNoSub)
dealloc(pItemNoSub,4)
dealloc(newmem)"""

