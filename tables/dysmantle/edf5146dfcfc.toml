[[cheat]]
id = "break-anything-with-any-weapon-select-one-or-both-options-below-after-activating"
name = "Break Anything With Any Weapon (Select One or Both Options Below After Activating)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{bypass damage type check and damage limit check on destructible objects
544 = damage type (ex. #788)(set to -1 to accept all)
4B8 = damage threshold (ex. (float)75)(set to 0 to bypass)

}


[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanmodule(destroyer,prog.dll,B8 01 00 00 00 48 D3 E0 49 85 84 D6 30 01 00 00 0F 95) // should be unique
alloc(newmem,$1000,destroyer)
label(anydamagetype)
label(nodamagethreshold)
label(code)
label(return)

newmem:
push rcx
mov rcx,anydamagetype
cmp byte ptr [rcx],1
jne @f //jumps to next @@ if player hasn't enabled
mov [r14+00000544],#4294967295 //-1 to accept all damage types

@@:
mov rcx,nodamagethreshold
cmp byte ptr [rcx],1
jne @f //jumps to next @@ if player hasn't enabled
mov [r14+000004B8],(float)0 //set damage threshold to 0

@@:
pop rcx
code:
  mov eax,00000001
  jmp return

anydamagetype:
db 0

nodamagethreshold:
db 0

destroyer:
  jmp newmem
return:
registersymbol(anydamagetype)
registersymbol(nodamagethreshold)
registersymbol(destroyer)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
destroyer:
  db B8 01 00 00 00
unregistersymbol(anydamagetype)
unregistersymbol(nodamagethreshold)
