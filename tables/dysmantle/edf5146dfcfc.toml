[[cheat]]
id = "god-mode"
name = "God Mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
03Apr23:
OLD//130 = Player Detector (Typically 20000000 when player)
134 = 65537 (working?)
4A4 = Speed
4BC = Health (was 4A4)
4C0 = Health Max
}

[ENABLE]
aobscanmodule(god,prog.dll,F3 0F 11 83 BC 04 00 00 48) // should be unique
alloc(newmem,$1000,god)
label(zero)
label(code)
label(return)

newmem:
cmp [rbx+00000134],#131074 //player detector
jne code
movss xmm1,[zero]
jmp return
code:
  movss [rbx+000004BC],xmm0 //4bc is current health
  jmp return

zero:
dd (float)100

