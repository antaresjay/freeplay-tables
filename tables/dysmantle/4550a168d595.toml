[[cheat]]
id = "player-inventory-main"
name = "Player Inventory Main"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,$100,pInvBase)

label(pInvBSRstr pInventory)
label(return)

newmem:
pInvBSRstr:
  readmem(pInvBase,7)
  mov [pInventory],rsi
  mov rdx,rbp
  jmp return
pInventory:
  dq 0

pInvBase:
  jmp newmem
  nop 2
return:
registersymbol(pInventory pInvBSRstr)

[DISABLE]

pInvBase:
  readmem(pInvBSRstr,7)

unregistersymbol(*)
dealloc(newmem)"""

[[cheat]]
id = "item-ids"
name = "Item IDs"
category = "resources"
description = ""
hint = ""
