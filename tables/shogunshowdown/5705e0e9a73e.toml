[[cheat]]
id = "hero-data"
name = "Hero Data"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : ShogunShowdown.exe
  Version:
  Date   : 2023-06-28
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanregion(pData_HeroData,CombatManager:Update,CombatManager:Update+150,48 8B 40 28 48 63 40 18 85 C0 7E 0E) // should be unique
alloc(newmem,$1000,pData_HeroData)

alloc(pBase_HeroData,8)
registersymbol(pBase_HeroData)

label(code)
label(return)

pBase_HeroData:
dd

newmem:

code:
  mov [pBase_HeroData],rax
  mov rax,[rax+28]
  movsxd  rax,dword ptr [rax+18]
  jmp return

pData_HeroData:
  jmp newmem
  nop 3
return:
registersymbol(pData_HeroData pBase_HeroData)

[DISABLE]

pData_HeroData:
  db 48 8B 40 28 48 63 40 18

unregistersymbol(*)
dealloc(*)"""

