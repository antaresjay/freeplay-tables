[[cheat]]
id = "item-giver"
name = "Item-Giver"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : DD2.exe
  Version: 
  Date   : 2024-03-23
  Author : cfe

  This script does blah blah blah
}

[ENABLE]
aobscanmodule(aob_ItemManagerAddStorage,$process,44 89 4C 24 20 48 89 54 24 10 55 53 56 57 41 54 41 55 41 56 48 8D 6C 24 F9)
registersymbol(aob_ItemManagerAddStorage)

// app.ItemManager.makeDuplicateList(System.Collections.Generic.List`1<app.ItemManager.StorageMasterData>)
aobscanmodule(aobItemManager,DD2.exe,48 89 5C 24 08 48 89 6C 24 10 48 89 74 24 18 57 41 56 41 57 48 83 EC 60 41 8B 58 18 49 8B E8) // should be unique
alloc(newmem2,$1000)

Trampoline+20:
jmp far newmem2

label(code2)
label(return2)
label(bDo)
registersymbol(bDo)
label(iItemID)
registersymbol(iItemID)
label(iItemType)
registersymbol(iItemType)
label(iQty)
registersymbol(iQty)
newmem2:

code2:
cmp byte ptr[bDo],0
je Skip

  mov [prsp],rsp
  sub rsp,80
  and rsp,-10

  push rbx
  push rcx
  push rdx
  push r8
  push r9
  push rsi
  push rdi

  sub rsp,88

  mov r8,[iItemID]
  mov r9d,[iQty]
  mov rax,pstack
  mov [rsp+20],rax // stack 0 0 1
  mov rax,pStaticCharacterManager
  mov rax,[rax]
  test rax,rax
  je Skip
  mov rax,[rax+10]
  mov rax,[rax+AB0]
  mov [rsp+28],rax
  mov eax,[iItemType]
  mov [rsp+30],eax // ID?
  mov [rsp+58],5E
  mov [rsp+50],1
  mov [rsp+48],1
  mov [rsp+40],0
  mov [rsp+38],1

  call aob_ItemManagerAddStorage

  add rsp,88

  pop rdi
  pop rsi
  pop r9
  pop r8
  pop rdx
  pop rcx
  pop rbx

  mov rsp,[prsp]

  mov byte ptr[bDo],0
  mov [iQty],1
Skip:
  mov [rsp+08],rbx
  jmp far return2
align 16 00
prsp:
dq 0
iItemID:
dd 1 // apple default
iItemType:
dd 0 // consume?
iQty:
dd 1
bDo:
db 0
pstack:
dd 0
dd 0
dd 1

aobItemManager:
  jmp Trampoline+20
return2:
registersymbol(aobItemManager)

[DISABLE]

aobItemManager:
  db 48 89 5C 24 08

dealloc(newmem2)

unregistersymbol(aobReadLocalCharacterEnum)"""

