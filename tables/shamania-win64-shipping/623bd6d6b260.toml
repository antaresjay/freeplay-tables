type = "script"
source = """
[ENABLE]

aobscanmodule(LocalPlayerHook,Shamania-Win64-Shipping.exe,48 8B 40 30 48 85 C0 74 0C)
alloc(newmem,$1000,LocalPlayerHook)
registersymbol(gPlayer)
label(code return gPlayer)

newmem:
mov [gPlayer],rax

code:
  mov rax,[rax+30]
  test rax,rax
  jmp return

gPlayer:
dq

LocalPlayerHook:
  jmp newmem
  nop 2
return:
registersymbol(LocalPlayerHook)

[DISABLE]

LocalPlayerHook:
  db 48 8B 40 30 48 85 C0

unregistersymbol(*)
dealloc(*)"""
