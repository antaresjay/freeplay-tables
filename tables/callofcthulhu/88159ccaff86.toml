[[cheat]]
id = "infinite-lamp"
name = "Infinite Lamp"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,"CallOfCthulhu.exe"+21655C)
define(bytes,F3 0F 5C C6 0F 2F F7)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,"CallOfCthulhu.exe"+21655C)

label(code)
label(return)

newmem:
  subss xmm0,xmm6
  movss xmm7, [minFuel]

  comiss xmm0, xmm7
  ja code
  movss xmm0, xmm7
  jmp code

code:
  xorps xmm7, xmm7
  comiss xmm6,xmm7
  jmp return

minFuel:
dd (float)50

address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  db bytes
  // subss xmm0,xmm6
  // comiss xmm6,xmm7

dealloc(newmem)"""
