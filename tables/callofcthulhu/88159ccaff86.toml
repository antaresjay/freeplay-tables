[[cheat]]
id = "edit-character-points-scan-by-add-deduct"
name = "Edit Character Points (Scan by Add / Deduct)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,"CallOfCthulhu.exe"+2E7D39)
define(bytes,48 8B D8 83 78 68 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,"CallOfCthulhu.exe"+2E7D39)

label(code)
label(return)

label(pSkillPoint)
registerSymbol(pSkillPoint)

newmem:
  mov [pSkillPoint], rax
code:
  mov rbx,rax
  cmp dword ptr [rax+68],00
  jmp return

pSkillPoint:
dq 0
address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  db bytes
  // mov rbx,rax
  // cmp dword ptr [rax+68],00
unregisterSymbol(pSkillPoint)
dealloc(newmem)"""

