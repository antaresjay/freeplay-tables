[[cheat]]
id = "guns-never-overheat"
name = "Guns Never OverHeat"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Overheat_Set_AOB,GameAssembly.dll,8B 4D 08 8B 45 0C 89 81 38)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
mov ecx,[ebp+08]
mov eax,[ebp+0C]
xor eax,eax
jmp return

Overheat_Set_AOB:
jmp newmem
nop
return:
registersymbol(Overheat_Set_AOB)

[DISABLE]

Overheat_Set_AOB:
db 8B 4D 08 8B 45 0C

unregistersymbol(Overheat_Set_AOB)
dealloc(newmem)"""
