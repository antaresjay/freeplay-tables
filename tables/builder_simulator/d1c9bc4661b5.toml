name = "Easy Skill Level Up"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(skillexp,89 46 14 48 8B CE 83 3E 00 48 8D 6D 00 49 BB 60 F9 BE B5 24 01 00 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov [rsi+14],#99999999999999
  mov rcx,rsi
  cmp dword ptr [rsi],00
  lea rbp,[rbp+00]
  mov r11,Gameplay.SkillsSystem.SkillData:OnExperienceIncrease
  jmp return

skillexp:
  jmp far newmem
  nop 9
return:
registersymbol(skillexp)

[DISABLE]

skillexp:
  db 89 46 14 48 8B CE 83 3E 00 48 8D 6D 00 49 BB 60 F9 BE B5 24 01 00 00

unregistersymbol(*)
dealloc(*)"""
