[[cheat]]
id = "refill-stats"
name = "Refill Stats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

assert(Stat:Tick+6FC,F3 0F 11 6E ? F3 0F 10 46 ? F3 0F 5A C0 66 0F 57 C9 66 0F 2F C8 ? ? ? ? ? ? ? ? ? ? ? ? 48 63 46 ? 83 F8 ? ? ? ? ? ? ? 48 8B)
define(core,Stat:Tick+6FC)
registersymbol(core stmFlag foodFlag wtrFlag)

alloc(newmem,2048)
alloc(stmFlag,4)
alloc(foodFlag,4)
alloc(wtrFlag,4)

label(originalCode)
label(return)

stmFlag:
  db 1

foodFlag:
  db 1

wtrFlag:
  db 1

newmem:
  cmp [rsi+18],1
  je stamina
  cmp [rsi+18],2
  je food
  cmp [rsi+18],3
  je water
  jmp originalCode

stamina:
  cmp [stmFlag],0
  jz originalCode
  movss xmm5,[rsi+2C]
  movss [rsi+20],xmm5
  movss xmm0,[rsi+3C]
  cvtss2sd xmm0,xmm0
  jmp return

food:
  cmp [foodFlag],0
  jz originalCode
  movss xmm5,[rsi+2C]
  movss [rsi+20],xmm5
  movss xmm0,[rsi+3C]
  cvtss2sd xmm0,xmm0
  jmp return

water:
  cmp [wtrFlag],0
  jz originalCode
  movss xmm5,[rsi+2C]
  movss [rsi+20],xmm5
  movss xmm0,[rsi+3C]
  cvtss2sd xmm0,xmm0
  jmp return

originalCode:
  movss [rsi+20],xmm5
  movss xmm0,[rsi+3C]
  cvtss2sd xmm0,xmm0
  jmp return

core:
  jmp far newmem
return:

[DISABLE]

core:
  db F3 0F 11 6E 20 F3 0F 10 46 3C F3 0F 5A C0

unregistersymbol(*)
dealloc(*)"""

