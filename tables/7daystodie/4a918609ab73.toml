[[cheat]]
id = "ultra-conservative"
name = "Ultra Conservative"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

assert(Bag:DecItem+21C,2B CB 89 48 ? 44 2B FB 48 63 C7 39 46)
define(bag,Bag:DecItem+21C)
registersymbol(bag limit consumption)

alloc(newmem,2048,bag)
alloc(consumption,4,bag)
alloc(limit,4,bag)

label(originalCode)
label(return)

consumption:
  dd #0                  // counter start

limit:
  dd #10

newmem:
  push edx
  mov edx,[limit]
  mov ebx,0
  cmp [consumption],edx // counter limit
  jl @@2
@@1:
  mov ebx,1
  mov [consumption],#0  // counter reset
@@2:
  sub ecx,ebx
  mov [rax+18],ecx
  inc [consumption]
  pop edx
  jmp return

originalCode:
  //sub ecx,ebx
  //mov [rax+18],ecx
  //jmp return

bag:
  jmp newmem
return:

assert(Inventory:DecHoldingItem+81,2B 4D ? 89 48 ? 48 8B 47 ? 48 63 8F)
define(hold,Inventory:DecHoldingItem+81)
registersymbol(hold limit2 consumption2)

alloc(newmem2,2048,hold)
alloc(consumption2,4,hold)
alloc(limit2,4,hold)

label(originalCode2)
label(return2)

consumption2:
  dd #0                  // counter start

limit2:
  dd #10

newmem2:
  push edx
  mov edx,[limit2]
  mov [rbp-18],0
  cmp [consumption2],edx // counter limit
  jl @@4
@@3:
  mov [rbp-18],1
  mov [consumption2],#0  // counter reset
@@4:
  sub ecx,[rbp-18]
  mov [rax+18],ecx
  inc [consumption2]
  pop edx
  jmp return2

originalCode2:
  //sub ecx,[rbp-18]
  //mov [rax+18],ecx
  //jmp return2

hold:
  jmp newmem2
  nop
return2:

[DISABLE]

bag:
  db 2B CB 89 48 18

hold:
  db 2B 4D E8 89 48 18

unregistersymbol(*)
dealloc(*)"""

