[[cheat]]
id = "userprogress-base-address-scan-to-activate-view-gold-to-update-view-gold"
name = "UserProgress Base Address Scan (To Activate: View Gold, To Update: View Gold)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(UserProgress_savedAOB)
label(UserProgress_returnhere)
label(UserProgress_originalcode)
label(UserProgress_exit)

label(UserProgress_update_exit)
label(UserProgress_goldset_exit)

registersymbol(UserProgress_originalcode)
registersymbol(UserProgress_savedAOB)

//05DE8C1E - 90                    - nop
//05DE8C1F - E8 DCC8CDFF           - call 05AC5500
// GoldCounter:get_Value+c
//05DE8C24 - 8B C8                 - mov ecx,eax
//05DE8C26 - 39 09                 - cmp [ecx],ecx
//05DE8C28 - 8B 40 30              - mov eax,[eax+30]
//05DE8C2B - C9                    - leave
//05DE8C2C - C3                    - ret
aobscan(UserProgress_searchedAOB, 8B C8 39 09 8B 40 30 C9 C3)

alloc(UserProgress_newmem, 2048, UserProgress_searchedAOB)
alloc(UserProgress_temp1, 4, UserProgress_searchedAOB)
alloc(UserProgress_temp2, 4, UserProgress_searchedAOB)
alloc(UserProgress_temp3, 4, UserProgress_searchedAOB)
alloc(UserProgress_temp4, 4, UserProgress_searchedAOB)
alloc(UserProgress_temp5, 4, UserProgress_searchedAOB)


UserProgress_newmem:
mov [UserProgress_temp1], eax
mov [UserProgress_temp2], ebx
mov [UserProgress_temp3], ecx
mov [UserProgress_temp4], edx

cmp dword ptr [UserProgress_update_enable], #0
je UserProgress_update_exit
mov [UserProgress_basepointer], eax
UserProgress_update_exit:

cmp dword ptr [UserProgress_goldset_enable], #0
je UserProgress_goldset_exit
mov [eax+30], #99999
UserProgress_goldset_exit:

mov eax, [UserProgress_temp1]
mov ebx, [UserProgress_temp2]
mov ecx, [UserProgress_temp3]
mov edx, [UserProgress_temp4]


UserProgress_originalcode:
readmem(UserProgress_searchedAOB, 7)


UserProgress_exit:
jmp UserProgress_returnhere


UserProgress_searchedAOB:
UserProgress_savedAOB:
jmp UserProgress_newmem
nop
nop
UserProgress_returnhere:


[DISABLE]
UserProgress_savedAOB:
readmem(UserProgress_originalcode, 7)

unregistersymbol(UserProgress_originalcode)
unregistersymbol(UserProgress_savedAOB)

dealloc(UserProgress_newmem)
dealloc(UserProgress_temp1)
dealloc(UserProgress_temp2)
dealloc(UserProgress_temp3)
dealloc(UserProgress_temp4)
dealloc(UserProgress_temp5)"""

