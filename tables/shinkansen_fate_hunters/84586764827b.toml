[[cheat]]
id = "card-base-address-scan-initialization-activate-this-first"
name = "Card Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Card_basepointer)
registersymbol(Card_update_enable)
registersymbol(Card_hpset_enable)
registersymbol(Card_shieldset_enable)
registersymbol(Card_rageset_enable)
registersymbol(Card_specialsset_enable)
registersymbol(Card_cardsset_enable)
registersymbol(Card_damageset_enable)

alloc(Card_basepointer, 4)
alloc(Card_update_enable, 4)
alloc(Card_hpset_enable, 4)
alloc(Card_shieldset_enable, 4)
alloc(Card_rageset_enable, 4)
alloc(Card_specialsset_enable, 4)
alloc(Card_cardsset_enable, 4)
alloc(Card_damageset_enable, 4)


[DISABLE]
unregistersymbol(Card_basepointer)
unregistersymbol(Card_update_enable)
unregistersymbol(Card_hpset_enable)
unregistersymbol(Card_shieldset_enable)
unregistersymbol(Card_rageset_enable)
unregistersymbol(Card_specialsset_enable)
unregistersymbol(Card_cardsset_enable)
unregistersymbol(Card_damageset_enable)

dealloc(Card_basepointer)
dealloc(Card_update_enable)
dealloc(Card_hpset_enable)
dealloc(Card_shieldset_enable)
dealloc(Card_rageset_enable)
dealloc(Card_specialsset_enable)
dealloc(Card_cardsset_enable)
dealloc(Card_damageset_enable)"""

[[cheat]]
id = "card-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Card Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Card_savedAOB)
label(Card_returnhere)
label(Card_originalcode)
label(Card_exit)

label(Card_update_exit)
label(Card_hpset_exit)
label(Card_shieldset_exit)
label(Card_rageset_exit)
label(Card_specialsset_exit)
label(Card_cardsset_exit)
label(Card_damageset_exit)

registersymbol(Card_originalcode)
registersymbol(Card_savedAOB)

//0657B78D - C7 85 68FFFFFF 00000000 - mov [ebp-00000098],00000000
//0657B797 - C7 85 6CFFFFFF 00000000 - mov [ebp-00000094],00000000
// Card:LateUpdate+91
//0657B7A1 - 8B 47 40              - mov eax,[edi+40]
//0657B7A4 - 8B C8                 - mov ecx,eax
//0657B7A6 - 39 09                 - cmp [ecx],ecx
//0657B7A8 - 8B 40 0C              - mov eax,[eax+0C]
//0657B7AB - 85 C0                 - test eax,eax
//0657B7AD - 0F84 A0030000         - je 0657BB53
//0657B7B3 - 8B 47 40              - mov eax,[edi+40]
//0657B7B6 - C7 44 24 04 00000000  - mov [esp+04],00000000
//0657B7BE - 89 04 24              - mov [esp],eax
//0657B7C1 - 39 00                 - cmp [eax],eax
//0657B7C3 - E8 403284FE           - call 04DBEA08
//0657B7C8 - 89 04 24              - mov [esp],eax
//0657B7CB - 39 00                 - cmp [eax],eax
//0657B7CD - 8B C0                 - mov eax,eax
aobscan(Card_searchedAOB, 8B 47 40 8B C8 39 09 8B 40 0C 85 C0 * * * * * * 8B 47 40 C7 44 24 04 00 00 00 00 89 04 24 39 00 * * * * * 89 04 24)

alloc(Card_newmem, 2048, Card_searchedAOB)
alloc(Card_temp1, 4, Card_searchedAOB)
alloc(Card_temp2, 4, Card_searchedAOB)
alloc(Card_temp3, 4, Card_searchedAOB)
alloc(Card_temp4, 4, Card_searchedAOB)
alloc(Card_temp5, 4, Card_searchedAOB)


Card_newmem:
mov [Card_temp1], eax
mov [Card_temp2], ebx
mov [Card_temp3], ecx
mov [Card_temp4], edx

cmp dword ptr [Card_update_enable], #0
je Card_update_exit
mov [Card_basepointer], edi
Card_update_exit:

cmp dword ptr [Card_hpset_enable], #0
je Card_hpset_exit
mov ebx, [edi+14]
test ebx, ebx
je Card_hpset_exit
mov ecx, [ebx+c0]
mov [ebx+bc], ecx
Card_hpset_exit:

cmp dword ptr [Card_shieldset_enable], #0
je Card_shieldset_exit
mov ebx, [edi+14]
test ebx, ebx
je Card_shieldset_exit
mov byte ptr [ebx+ca], #1
Card_shieldset_exit:

cmp dword ptr [Card_rageset_enable], #0
je Card_rageset_exit
mov ebx, [edi+14]
test ebx, ebx
je Card_rageset_exit
mov ecx, [ebx+1a4]
mov [ebx+1a0], ecx
Card_rageset_exit:

cmp dword ptr [Card_specialsset_enable], #0
je Card_specialsset_exit
mov ebx, [edi+14]
test ebx, ebx
je Card_specialsset_exit
mov byte ptr [ebx+169], #1
mov byte ptr [ebx+17c], #1
mov byte ptr [ebx+194], #1
mov byte ptr [ebx+1b8], #1
mov [ebx+1bc], (float)1
mov [ebx+1c0], (float)0
Card_specialsset_exit:

cmp dword ptr [Card_cardsset_enable], #0
je Card_cardsset_exit
mov ebx, [edi+14]
test ebx, ebx
je Card_cardsset_exit
mov [ebx+16c], #15
Card_cardsset_exit:

cmp dword ptr [Card_damageset_enable], #0
je Card_damageset_exit
mov ebx, [edi+14]
test ebx, ebx
je Card_damageset_exit
mov [ebx+188], #9
mov [ebx+18c], #9
mov [ebx+190], #9
mov [ebx+1ac], #9
mov [ebx+1b0], #9
mov [ebx+1b4], #9
Card_damageset_exit:

mov eax, [Card_temp1]
mov ebx, [Card_temp2]
mov ecx, [Card_temp3]
mov edx, [Card_temp4]


Card_originalcode:
readmem(Card_searchedAOB, 5)


Card_exit:
jmp Card_returnhere


Card_searchedAOB:
Card_savedAOB:
jmp Card_newmem
Card_returnhere:


[DISABLE]
Card_savedAOB:
readmem(Card_originalcode, 5)

unregistersymbol(Card_originalcode)
unregistersymbol(Card_savedAOB)

dealloc(Card_newmem)
dealloc(Card_temp1)
dealloc(Card_temp2)
dealloc(Card_temp3)
dealloc(Card_temp4)
dealloc(Card_temp5)"""

