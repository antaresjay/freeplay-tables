[[cheat]]
id = "player-base-address-scan-initialization-activate-this-first"
name = "Player Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Player_basepointer)
registersymbol(Player_update_enable)
registersymbol(Player_set_enable)
registersymbol(Player_healthset_enable)
registersymbol(Player_energyset_enable)
registersymbol(Player_fuelreserveset_enable)
registersymbol(Player_thrusterset_enable)
registersymbol(Player_transmissionset_enable)
registersymbol(Player_fuelset_enable)
registersymbol(Player_speedset_enable)

alloc(Player_basepointer, 4)
alloc(Player_update_enable, 4)
alloc(Player_set_enable, 4)
alloc(Player_healthset_enable, 4)
alloc(Player_energyset_enable, 4)
alloc(Player_fuelreserveset_enable, 4)
alloc(Player_thrusterset_enable, 4)
alloc(Player_transmissionset_enable, 4)
alloc(Player_fuelset_enable, 4)
alloc(Player_speedset_enable, 4)


[DISABLE]
unregistersymbol(Player_basepointer)
unregistersymbol(Player_update_enable)
unregistersymbol(Player_set_enable)
unregistersymbol(Player_healthset_enable)
unregistersymbol(Player_energyset_enable)
unregistersymbol(Player_fuelreserveset_enable)
unregistersymbol(Player_thrusterset_enable)
unregistersymbol(Player_transmissionset_enable)
unregistersymbol(Player_fuelset_enable)
unregistersymbol(Player_speedset_enable)

dealloc(Player_basepointer)
dealloc(Player_update_enable)
dealloc(Player_set_enable)
dealloc(Player_healthset_enable)
dealloc(Player_energyset_enable)
dealloc(Player_fuelreserveset_enable)
dealloc(Player_thrusterset_enable)
dealloc(Player_transmissionset_enable)
dealloc(Player_fuelset_enable)
dealloc(Player_speedset_enable)"""

[[cheat]]
id = "player-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Player Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Player_savedAOB)
label(Player_returnhere)
label(Player_originalcode)
label(Player_exit)

label(Player_update_exit)
label(Player_set_exit)
label(Player_healthset_exit)
label(Player_energyset_exit)
label(Player_fuelreserveset_exit)
label(Player_thrusterset_exit)
label(Player_transmissionset_exit)
label(Player_fuelset_exit)
label(Player_speedset_exit)

registersymbol(Player_savedAOB)

//1025B36D - 85 C0                 - test eax,eax
//1025B36F - 0F85 3C0D0000         - jne 1025C0B1
// Player:Update+4d
//1025B375 - 8B 87 98000000        - mov eax,[edi+00000098]
//1025B37B - 8B C8                 - mov ecx,eax
//1025B37D - 39 09                 - cmp [ecx],ecx
//1025B37F - 8B 40 0C              - mov eax,[eax+0C]
//1025B382 - 85 C0                 - test eax,eax
//1025B384 - 0F9F C0               - setg al
aobscan(Player_searchedAOB, 8B 87 98 00 00 00 8B C8 39 09 8B 40 0C)

alloc(Player_newmem, 2048, Player_searchedAOB)
alloc(Player_temp1, 4, Player_searchedAOB)
alloc(Player_temp2, 4, Player_searchedAOB)
alloc(Player_temp3, 4, Player_searchedAOB)
alloc(Player_temp4, 4, Player_searchedAOB)


Player_newmem:
mov [Player_temp1], eax
mov [Player_temp2], ebx
mov [Player_temp3], ecx
mov [Player_temp4], edx

cmp dword ptr [Player_update_enable], #0
je Player_update_exit
mov [Player_basepointer], edi
Player_update_exit:

cmp dword ptr [Player_set_enable], #0
je Player_set_exit
Player_set_exit:

cmp dword ptr [Player_healthset_enable], #0
je Player_healthset_exit
cmp dword ptr [edi+98], #0
je Player_healthset_exit
mov ebx, [edi+98]
mov ecx, [ebx+14]
mov [ebx+c], ecx
mov [edi+154], (float)0
Player_healthset_exit:

cmp dword ptr [Player_energyset_enable], #0
je Player_energyset_exit
cmp dword ptr [edi+9c], #0
je Player_energyset_exit
mov ebx, [edi+9c]
mov ecx, [ebx+14]
mov [ebx+c], ecx
Player_energyset_exit:

cmp dword ptr [Player_fuelreserveset_enable], #0
je Player_fuelreserveset_exit
cmp dword ptr [edi+a0], #0
je Player_fuelreserveset_exit
mov ebx, [edi+a0]
mov ecx, [ebx+14]
mov [ebx+c], ecx
Player_fuelreserveset_exit:

cmp dword ptr [Player_thrusterset_enable], #0
je Player_thrusterset_exit
cmp dword ptr [edi+a4], #0
je Player_thrusterset_exit
mov ebx, [edi+a4]
mov ecx, [ebx+14]
mov [ebx+c], ecx
Player_thrusterset_exit:

cmp dword ptr [Player_transmissionset_enable], #0
je Player_transmissionset_exit
cmp dword ptr [edi+a8], #0
je Player_transmissionset_exit
mov ebx, [edi+a8]
mov ecx, [ebx+14]
mov [ebx+c], ecx
Player_transmissionset_exit:

cmp dword ptr [Player_fuelset_enable], #0
je Player_fuelset_exit
mov ecx, [edi+d4]
mov [edi+d8], ecx
Player_fuelset_exit:

cmp dword ptr [Player_speedset_enable], #0
je Player_speedset_exit
mov [edi+cc], (float)10
Player_speedset_exit:

mov eax, [Player_temp1]
mov ebx, [Player_temp2]
mov ecx, [Player_temp3]
mov edx, [Player_temp4]


Player_originalcode:
db 8B 87 98 00 00 00
//mov eax,[edi+00000098]


Player_exit:
jmp Player_returnhere


Player_searchedAOB:
Player_savedAOB:
jmp Player_newmem
nop
Player_returnhere:


[DISABLE]
Player_savedAOB:
db 8B 87 98 00 00 00
//mov eax,[edi+00000098]

unregistersymbol(Player_savedAOB)

dealloc(Player_newmem)
dealloc(Player_temp1)
dealloc(Player_temp2)
dealloc(Player_temp3)
dealloc(Player_temp4)"""

