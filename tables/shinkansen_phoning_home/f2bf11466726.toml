alloc(Item_temp1, 4, Item_searchedAOB)
alloc(Item_temp2, 4, Item_searchedAOB)
alloc(Item_temp3, 4, Item_searchedAOB)
alloc(Item_temp4, 4, Item_searchedAOB)


