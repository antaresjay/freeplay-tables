//102FC34B - 8B 40 1C              - mov eax,[eax+1C]
// CompassObjectCluster:IsUnlocked+1e
//102FC34E - 0FB6 80 94000000      - movzx eax,byte ptr [eax+00000094]
//102FC355 - 85 C0                 - test eax,eax
//102FC357 - 74 26                 - je 102FC37F
//102FC359 - 8B 45 08              - mov eax,[ebp+08]
//102FC35C - 8B 40 10              - mov eax,[eax+10]
aobscan(Item_searchedAOB, 0F B6 80 94 00 00 00 85 C0 74 26)

