Item_searchedAOB:
Item_savedAOB:
jmp Item_newmem
nop
nop
Item_returnhere:


[DISABLE]
Item_savedAOB:
db 0F B6 80 94 00 00 00
//movzx eax,byte ptr [eax+00000094]

unregistersymbol(Item_savedAOB)

dealloc(Item_newmem)
dealloc(Item_temp1)
dealloc(Item_temp2)
dealloc(Item_temp3)
dealloc(Item_temp4)"""

