[[cheat]]
id = "ani-base-address-scan-to-activate-play-level-with-ani-to-update-play-level-with-ani"
name = "ANI Base Address Scan (To Activate: Play Level with ANI, To Update: Play Level with ANI)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(ANI_savedAOB)
label(ANI_returnhere)
label(ANI_originalcode)
label(ANI_exit)

label(ANI_update_exit)
label(ANI_set_exit)
label(ANI_healthset_exit)
label(ANI_rustset_exit)
label(ANI_rustprotectionset_exit)

registersymbol(ANI_savedAOB)

//0E8D0C6C - 83 EC 64              - sub esp,64
//0E8D0C6F - 8B 7D 08              - mov edi,[ebp+08]
// ANI:Update+a
//0E8D0C72 - 8B 47 64              - mov eax,[edi+64]
//0E8D0C75 - 8B C8                 - mov ecx,eax
//0E8D0C77 - 39 09                 - cmp [ecx],ecx
//0E8D0C79 - 8B 40 0C              - mov eax,[eax+0C]
//0E8D0C7C - 85 C0                 - test eax,eax
//0E8D0C7E - 0F9F C0               - setg al
//0E8D0C81 - 0FB6 C0               - movzx eax,al
//0E8D0C84 - 85 C0                 - test eax,eax
aobscan(ANI_searchedAOB, 8B 47 64 8B C8 39 09 8B 40 0C 85 C0 0F 9F C0)

alloc(ANI_newmem, 2048, ANI_searchedAOB)
alloc(ANI_temp1, 4, ANI_searchedAOB)
alloc(ANI_temp2, 4, ANI_searchedAOB)
alloc(ANI_temp3, 4, ANI_searchedAOB)
alloc(ANI_temp4, 4, ANI_searchedAOB)


ANI_newmem:
mov [ANI_temp1], eax
mov [ANI_temp2], ebx
mov [ANI_temp3], ecx
mov [ANI_temp4], edx

cmp dword ptr [ANI_update_enable], #0
je ANI_update_exit
mov [ANI_basepointer], edi
ANI_update_exit:

cmp dword ptr [ANI_set_enable], #0
je ANI_set_exit
ANI_set_exit:

cmp dword ptr [ANI_healthset_enable], #0
je ANI_healthset_exit
cmp dword ptr [edi+64], #0
je ANI_healthset_exit
mov ebx, [edi+64]
mov ecx, [ebx+14]
mov [ebx+c], ecx
ANI_healthset_exit:

cmp dword ptr [ANI_rustset_enable], #0
je ANI_rustset_exit
cmp dword ptr [edi+68], #0
je ANI_rustset_exit
mov ebx, [edi+68]
mov [ebx+c], #0
mov [edi+1cc], (float)0
ANI_rustset_exit:

cmp dword ptr [ANI_rustprotectionset_enable], #0
je ANI_rustprotectionset_exit
cmp dword ptr [edi+6c], #0
je ANI_rustprotectionset_exit
mov ebx, [edi+6c]
mov ecx, [ebx+14]
mov [ebx+c], ecx
ANI_rustprotectionset_exit:

mov eax, [ANI_temp1]
mov ebx, [ANI_temp2]
mov ecx, [ANI_temp3]
mov edx, [ANI_temp4]


ANI_originalcode:
db 8B 47 64 8B C8
//mov eax,[edi+64]
//mov ecx,eax


ANI_exit:
jmp ANI_returnhere


ANI_searchedAOB:
ANI_savedAOB:
jmp ANI_newmem
ANI_returnhere:


[DISABLE]
ANI_savedAOB:
db 8B 47 64 8B C8
//mov eax,[edi+64]
//mov ecx,eax

unregistersymbol(ANI_savedAOB)

dealloc(ANI_newmem)
dealloc(ANI_temp1)
dealloc(ANI_temp2)
dealloc(ANI_temp3)
dealloc(ANI_temp4)"""

