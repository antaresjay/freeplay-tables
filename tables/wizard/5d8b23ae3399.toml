[[cheat]]
id = "general-editor"
name = "General Editor"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Started: 2021-02-10
[ENABLE]
aobscanmodule(charAcc,wizard.exe,8B 87 F4 00 01 00)
registersymbol(charAcc_o)
alloc(charAccMem,$1000)

registersymbol(charAcc)
label(charAcc_o)
label(retTocharAcc)

label(char2)
registersymbol(char2)

charAccMem:
mov [char2],edi
charAcc_o:
readmem(charAcc,06)
jmp retTocharAcc

align 04 90
char2:
resb 4

charAcc:
jmp charAccMem
nop
retTocharAcc:

[DISABLE]
charAcc:
readmem(charAcc_o,06)

unregistersymbol(charAcc)
unregistersymbol(charAcc_o)
unregistersymbol(char2)
dealloc(charAccMem)"""

