[[cheat]]
id = "acquire-menu-editor"
name = "Acquire Menu Editor"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Started: 2021-02-10
[ENABLE]
aobscanmodule(charAcq,wizard.exe,8B 1E 69 DB F8 00 00 00)
registersymbol(charAcq)
alloc(charAcqMem,4096)

label(charAcq_o)
registersymbol(charAcq_o)
label(retTocharAcq)

label(char)
registersymbol(char)
label(index0)
label(arr0)
label(index1)
label(arr1)
registersymbol(index0)
registersymbol(arr0)
registersymbol(index1)
registersymbol(arr1)

charAcqMem:
mov [char],esi
charAcq_o:
readmem(charAcq,08)
jmp retTocharAcq

align 04 90
char:
dd 00
arr0:
dd 00
index0:
dd 01
arr1:
dd 00
index1:
dd 01

charAcq:
jmp charAcqMem
nop 3
retTocharAcq:

[DISABLE]
charAcq:
readmem(charAcq_o,08)

unregistersymbol(char)
unregistersymbol(index0)
unregistersymbol(arr0)
unregistersymbol(index1)
unregistersymbol(arr1)
unregistersymbol(charAcq)
unregistersymbol(charAcq_o)
dealloc(charAcqMem)"""

