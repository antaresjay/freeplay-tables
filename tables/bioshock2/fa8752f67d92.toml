[[cheat]]
id = "alternate-ammo-trainer"
name = "Alternate Ammo Trainer"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(inject_XAMMO1, F3 0F 2A 85 F4 04 00 00)
aobscan(inject_XAMMO2, 8B 48 4C 3B D9 7F 02)
aobscan(inject_XAMMO3, 8B 08 8B 54 24 04 89 0A C2 0C 00 33 D2)
alloc(mem_XAMMO,2048)

label(code_XAMMO1)
label(code_XAMMO2)
label(code_XAMMO3)
label(originalcode1)
label(originalcode2)
label(originalcode3)
label(returnhere1)
label(returnhere2)
label(returnhere3)
label(drill)
label(pXAmmo1)
label(pXAmmo2)
label(pXAmmo3)
label(bEnableXAmmo)
label(bEnableXFuel)

registersymbol(inject_XAMMO1)
registersymbol(inject_XAMMO2)
registersymbol(inject_XAMMO3)
registersymbol(mem_XAMMO)
registersymbol(code_XAMMO1)
registersymbol(code_XAMMO2)
registersymbol(code_XAMMO3)
registersymbol(pXAmmo1)
registersymbol(pXAmmo2)
registersymbol(pXAmmo3)
registersymbol(bEnableXAmmo)
registersymbol(bEnableXFuel)

// -------------------------------------------------------------------
// Variables
// -------------------------------------------------------------------

mem_XAMMO:
pXAmmo1:
dd 00
pXAmmo2:
dd 00
pXAmmo3:
dd 00
bEnableXAmmo:
dd 00
bEnableXFuel:
dd 00

// -------------------------------------------------------------------
// Ammo Code 1: Rounds in chamber
// -------------------------------------------------------------------

code_XAMMO1:
mov [pXAmmo1], ebp

originalcode1:
cvtsi2ss xmm0,[ebp+000004F4]
jmp returnhere1

// -------------------------------------------------------------------
// Ammo Code 2: Total Rounds / Fuel
// -------------------------------------------------------------------

code_XAMMO2:
mov [pXAmmo2], eax
cmp [eax+20], 1  // 1 = Drill
je drill
cmp [bEnableXAmmo], 0
je originalcode2
mov [eax+4c], 258
xor ebx, ebx
jmp originalcode2

drill:
cmp [bEnableXFuel], 0
je originalcode2
mov [eax+4c], 12C
xor ebx, ebx

originalcode2:
mov ecx,[eax+4C]
cmp ebx,ecx
jmp returnhere2

// -------------------------------------------------------------------
// Ammo Code 3: Loop
// -------------------------------------------------------------------

code_XAMMO3:
push ecx
mov ecx, [pXAmmo1]
add ecx, 4f4
cmp eax, ecx
pop ecx
jne originalcode3

mov [pXAmmo3], eax
cmp [bEnableXAmmo], 0
je originalcode3
mov [eax], 65

originalcode3:
mov ecx,[eax]
mov edx,[esp+04]
jmp returnhere3

// -------------------------------------------------------------------
// injection points
// -------------------------------------------------------------------

inject_XAMMO1:
//"Bioshock2.exe"+540ED0:
jmp code_XAMMO1
nop
nop
nop
returnhere1:

inject_XAMMO2:
//"Bioshock2.exe"+5E17DD:
jmp code_XAMMO2
returnhere2:

inject_XAMMO3:
//"Bioshock2.exe"+42DF0C:
jmp code_XAMMO3
nop
returnhere3:


// -------------------------------------------------------------------
// DISABLE Block
// -------------------------------------------------------------------

[DISABLE]
inject_XAMMO1:
//"Bioshock2.exe"+540ED0:
//cvtsi2ss xmm0,[ebp+000004F4]
db F3 0F 2A 85 F4 04 00 00

inject_XAMMO2:
//"Bioshock2.exe"+5E17DD:
//mov ecx,[eax+4C]
//cmp ebx,ecx
db 8B 48 4C 3B D9

inject_XAMMO3:
//"Bioshock2.exe"+42DF0C:
//mov ecx,[eax]
//mov edx,[esp+04]
db 8B 08 8B 54 24 04

dealloc(mem_XAMMO)
unregistersymbol(inject_XAMMO1)
unregistersymbol(inject_XAMMO2)
unregistersymbol(inject_XAMMO3)
unregistersymbol(mem_XAMMO)
unregistersymbol(code_XAMMO1)
