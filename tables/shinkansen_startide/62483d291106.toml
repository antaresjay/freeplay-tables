[[cheat]]
id = "playersmanager-base-address-scan-initialization-activate-this-first"
name = "PlayersManager Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlayersManager_basepointer)
registersymbol(PlayersManager_update_enable)
registersymbol(PlayersManager_set_enable)
registersymbol(PlayersManager_hpset_enable)
registersymbol(PlayersManager_shieldset_enable)

alloc(PlayersManager_basepointer, 8)
alloc(PlayersManager_update_enable, 4)
alloc(PlayersManager_set_enable, 4)
alloc(PlayersManager_hpset_enable, 4)
alloc(PlayersManager_shieldset_enable, 4)


[DISABLE]
unregistersymbol(PlayersManager_basepointer)
unregistersymbol(PlayersManager_update_enable)
unregistersymbol(PlayersManager_set_enable)
unregistersymbol(PlayersManager_hpset_enable)
unregistersymbol(PlayersManager_shieldset_enable)

dealloc(PlayersManager_basepointer)
dealloc(PlayersManager_update_enable)
dealloc(PlayersManager_set_enable)
dealloc(PlayersManager_hpset_enable)
dealloc(PlayersManager_shieldset_enable)"""

[[cheat]]
id = "playersmanager-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayersManager Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayersManager_savedAOB)
label(PlayersManager_returnhere)
label(PlayersManager_originalcode)
label(PlayersManager_exit)

label(PlayersManager_update_exit)
label(PlayersManager_set_exit)
label(PlayersManager_hpset_exit)
label(PlayersManager_shieldset_exit)

registersymbol(PlayersManager_savedAOB)

//263C146A - 48 8D 64 24 00        - lea rsp,[rsp+00]
//263C146F - 90                    - nop
// PlayersManager:OnManagerUpdate+20
//263C1470 - 48 8B 46 30           - mov rax,[rsi+30]
//263C1474 - 48 63 CF              - movsxd  rcx,edi
//263C1477 - 39 48 18              - cmp [rax+18],ecx
//263C147A - 0F86 FC010000         - jbe 263C167C
//263C1480 - 48 8D 44 C8 20        - lea rax,[rax+rcx*8+20]
//263C1485 - 48 8B 00              - mov rax,[rax]
//263C1488 - F3 0F10 80 48010000   - movss xmm0,[rax+00000148]
aobscan(PlayersManager_searchedAOB, 48 8B 46 30 48 63 CF 39 48 18 * * * * * * 48 8D 44 C8 20 48 8B 00)

alloc(PlayersManager_newmem, 2048, PlayersManager_searchedAOB)
alloc(PlayersManager_temp1, 8, PlayersManager_searchedAOB)
alloc(PlayersManager_temp2, 8, PlayersManager_searchedAOB)
alloc(PlayersManager_temp3, 8, PlayersManager_searchedAOB)
alloc(PlayersManager_temp4, 8, PlayersManager_searchedAOB)
alloc(PlayersManager_temp5, 8, PlayersManager_searchedAOB)


PlayersManager_newmem:
mov [PlayersManager_temp1], rax
mov [PlayersManager_temp2], rbx
mov [PlayersManager_temp3], rcx
mov [PlayersManager_temp4], rdx

cmp dword ptr [PlayersManager_update_enable], #0
je PlayersManager_update_exit
mov [PlayersManager_basepointer], rsi
PlayersManager_update_exit:

cmp dword ptr [PlayersManager_set_enable], #0
je PlayersManager_set_exit
PlayersManager_set_exit:

cmp dword ptr [PlayersManager_hpset_enable], #0
je PlayersManager_hpset_exit
mov rbx, [rsi+30]
test rbx, rbx
je PlayersManager_hpset_exit
mov rbx, [rbx+20]
test rbx, rbx
je PlayersManager_hpset_exit
mov [rbx+140], #9999
mov [rbx+160], (float)9999
PlayersManager_hpset_exit:

cmp dword ptr [PlayersManager_shieldset_enable], #0
je PlayersManager_shieldset_exit
mov rbx, [rsi+30]
test rbx, rbx
je PlayersManager_shieldset_exit
mov rbx, [rbx+20]
test rbx, rbx
je PlayersManager_shieldset_exit
mov [rbx+144], #9999
mov [rbx+154], $9999
PlayersManager_shieldset_exit:

mov rax, [PlayersManager_temp1]
mov rbx, [PlayersManager_temp2]
mov rcx, [PlayersManager_temp3]
mov rdx, [PlayersManager_temp4]


PlayersManager_originalcode:
db 48 8B 46 30 48 63 CF
//mov rax,[rsi+30]
//movsxd  rcx,edi


PlayersManager_exit:
jmp PlayersManager_returnhere


PlayersManager_searchedAOB:
PlayersManager_savedAOB:
jmp PlayersManager_newmem
nop
nop
PlayersManager_returnhere:


[DISABLE]
PlayersManager_savedAOB:
db 48 8B 46 30 48 63 CF
//mov rax,[rsi+30]
//movsxd  rcx,edi

unregistersymbol(PlayersManager_savedAOB)

dealloc(PlayersManager_newmem)
dealloc(PlayersManager_temp1)
dealloc(PlayersManager_temp2)
dealloc(PlayersManager_temp3)
dealloc(PlayersManager_temp4)
dealloc(PlayersManager_temp5)"""

