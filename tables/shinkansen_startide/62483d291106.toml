[[cheat]]
id = "playerbulletfire-base-address-scan-to-activate-shoot-to-update-shoot"
name = "PlayerBulletFire Base Address Scan (To Activate: Shoot, To Update: Shoot)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerBulletFire_savedAOB)
label(PlayerBulletFire_returnhere)
label(PlayerBulletFire_originalcode)
label(PlayerBulletFire_exit)

label(PlayerBulletFire_update_exit)
label(PlayerBulletFire_set_exit)
label(PlayerBulletFire_rofset_exit)

registersymbol(PlayerBulletFire_savedAOB)

//2B3BC404 - 48 89 34 24           - mov [rsp],rsi
//2B3BC408 - 48 8B F1              - mov rsi,rcx
// PlayerBulletFire:resumeShooting+b
//2B3BC40B - 0FB6 86 04010000      - movzx eax,byte ptr [rsi+00000104]
//2B3BC412 - 85 C0                 - test eax,eax
//2B3BC414 - 75 07                 - jne 2B3BC41D
//2B3BC416 - C6 86 FC000000 01     - mov byte ptr [rsi+000000FC],01
//2B3BC41D - 0FB6 86 D0000000      - movzx eax,byte ptr [rsi+000000D0]
aobscan(PlayerBulletFire_searchedAOB, 0F B6 86 04 01 00 00 85 C0 75 07)

alloc(PlayerBulletFire_newmem, 2048, PlayerBulletFire_searchedAOB)
alloc(PlayerBulletFire_temp1, 8, PlayerBulletFire_searchedAOB)
alloc(PlayerBulletFire_temp2, 8, PlayerBulletFire_searchedAOB)
alloc(PlayerBulletFire_temp3, 8, PlayerBulletFire_searchedAOB)
alloc(PlayerBulletFire_temp4, 8, PlayerBulletFire_searchedAOB)
alloc(PlayerBulletFire_temp5, 8, PlayerBulletFire_searchedAOB)


PlayerBulletFire_newmem:
mov [PlayerBulletFire_temp1], rax
mov [PlayerBulletFire_temp2], rbx
mov [PlayerBulletFire_temp3], rcx
mov [PlayerBulletFire_temp4], rdx

cmp dword ptr [PlayerBulletFire_update_enable], #0
je PlayerBulletFire_update_exit
mov [PlayerBulletFire_basepointer], rsi
PlayerBulletFire_update_exit:

cmp dword ptr [PlayerBulletFire_set_enable], #0
je PlayerBulletFire_set_exit
PlayerBulletFire_set_exit:

cmp dword ptr [PlayerBulletFire_rofset_enable], #0
je PlayerBulletFire_rofset_exit
mov [rsi+98], (float)0
mov [rsi+9c], (float)0
mov [rsi+a0], (float)0
mov [rsi+a4], (float)0
mov [rsi+a8], (float)0
PlayerBulletFire_rofset_exit:

mov rax, [PlayerBulletFire_temp1]
mov rbx, [PlayerBulletFire_temp2]
mov rcx, [PlayerBulletFire_temp3]
mov rdx, [PlayerBulletFire_temp4]


PlayerBulletFire_originalcode:
db 0F B6 86 04 01 00 00
//movzx eax,byte ptr [rsi+00000104]


PlayerBulletFire_exit:
jmp PlayerBulletFire_returnhere


PlayerBulletFire_searchedAOB:
PlayerBulletFire_savedAOB:
jmp PlayerBulletFire_newmem
nop
nop
PlayerBulletFire_returnhere:


[DISABLE]
PlayerBulletFire_savedAOB:
db 0F B6 86 04 01 00 00
//movzx eax,byte ptr [rsi+00000104]

unregistersymbol(PlayerBulletFire_savedAOB)

dealloc(PlayerBulletFire_newmem)
dealloc(PlayerBulletFire_temp1)
dealloc(PlayerBulletFire_temp2)
dealloc(PlayerBulletFire_temp3)
dealloc(PlayerBulletFire_temp4)
dealloc(PlayerBulletFire_temp5)"""

