source = """
[ENABLE]
label(DriversManager_savedAOB)
label(DriversManager_returnhere)
label(DriversManager_originalcode)
label(DriversManager_exit)

label(DriversManager_update_exit)
label(DriversManager_set_exit)
label(DriversManager_driverset_exit)

registersymbol(DriversManager_savedAOB)

//2B3D9398 - 48 89 7C 24 08        - mov [rsp+08],rdi
//2B3D939D - 48 8B F9              - mov rdi,rcx
//2B3D93A0 - 48 8B F2              - mov rsi,rdx
//2B3D93A3 - 85 F6                 - test esi,esi
//2B3D93A5 - 75 1A                 - jne 2B3D93C1
//2B3D93A7 - 48 63 87 B8010000     - movsxd  rax,dword ptr [rdi+000001B8]
//2B3D93AE - 48 63 8F B4010000     - movsxd  rcx,dword ptr [rdi+000001B4]
//2B3D93B5 - 3B C1                 - cmp eax,ecx
//2B3D93B7 - 40 0F94 C6            - sete sil
aobscan(DriversManager_searchedAOB, 48 8B F2 85 F6 75 1A 48 63 87 B8 01 00 00 48 63 8F B4 01 00 00)

alloc(DriversManager_newmem, 2048, DriversManager_searchedAOB)
alloc(DriversManager_temp1, 8, DriversManager_searchedAOB)
alloc(DriversManager_temp2, 8, DriversManager_searchedAOB)
alloc(DriversManager_temp3, 8, DriversManager_searchedAOB)
alloc(DriversManager_temp4, 8, DriversManager_searchedAOB)
alloc(DriversManager_temp5, 8, DriversManager_searchedAOB)


DriversManager_newmem:
mov [DriversManager_temp1], rax
mov [DriversManager_temp2], rbx
mov [DriversManager_temp3], rcx
mov [DriversManager_temp4], rdx

cmp dword ptr [DriversManager_update_enable], #0
je DriversManager_update_exit
mov [DriversManager_basepointer], rdi
DriversManager_update_exit:

cmp dword ptr [DriversManager_set_enable], #0
je DriversManager_set_exit
DriversManager_set_exit:

cmp dword ptr [DriversManager_driverset_enable], #0
je DriversManager_driverset_exit
mov ebx, [rdi+1b4]
add ebx, [rdi+1b4]
mov [rdi+1b0], ebx
mov [rdi+1b8], ebx
mov [rdi+1bc], ebx
DriversManager_driverset_exit:

mov rax, [DriversManager_temp1]
mov rbx, [DriversManager_temp2]
mov rcx, [DriversManager_temp3]
mov rdx, [DriversManager_temp4]


DriversManager_originalcode:
db 48 8B F2 85 F6
//mov rsi,rdx
//test esi,esi


DriversManager_exit:
jmp DriversManager_returnhere


DriversManager_searchedAOB:
DriversManager_savedAOB:
jmp DriversManager_newmem
DriversManager_returnhere:


[DISABLE]
DriversManager_savedAOB:
db 48 8B F2 85 F6
//mov rsi,rdx
//test esi,esi

unregistersymbol(DriversManager_savedAOB)

dealloc(DriversManager_newmem)
dealloc(DriversManager_temp1)
dealloc(DriversManager_temp2)
dealloc(DriversManager_temp3)
dealloc(DriversManager_temp4)
dealloc(DriversManager_temp5)"""

