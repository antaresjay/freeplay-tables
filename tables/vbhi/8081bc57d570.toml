[[cheat]]
id = "project-kamihime"
name = "Project Kamihime"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Kamihime,VBHI.exe,29 01 8B 42 04 19 41 04 59)
alloc(newmem,$100)
alloc(player_hp,8)
alloc(enemy_hp,8)

label(code)
label(return)

registersymbol(Kamihime,player_hp,enemy_hp)
//RTX_ON
player_hp:
dd 0
enemy_hp:
dd 0
//RTX_OFF
newmem:
cmp [ebp+4],VBHI.exe+EC46B
jne code
cmp [ebp+1F4],VBHI.exe+D1A80
jne code
//cmp [ebp+314],VBHI.exe+D0A80
//jne code
cmp [ecx+0C],00
jne @f
cmp [player_hp],0
je code
add [ecx],eax
mov eax,[edx+04]
jmp return

@@:
  cmp [enemy_hp],0
  je code
  mov [ecx],00
  mov eax,[edx+04]
  jmp return

code:
  sub [ecx],eax
  mov eax,[edx+04]
  jmp return

Kamihime:
  jmp newmem
return:

[DISABLE]

Kamihime:
  db 29 01 8B 42 04

unregistersymbol(*)
dealloc(*)"""

