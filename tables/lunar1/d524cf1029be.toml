[[cheat]]
id = "enable-damage-modifier-god-mode-one-hit-kill-etc"
name = "Enable Damage Modifier (God Mode, One Hit Kill, etc.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DamageModAOB,$process,45 0F B7 84 49 80 3F 0D 03 0F B7 02 66 44 3B C0) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,1024,DamageModAOB)

label(return)
label(DamageModAOBSave)
registersymbol(DamageModAOBSave)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

newmem:
DamageModAOBSave:
  readmem(DamageModAOB,12)
  cmp byte ptr [rdx+0000002D],FF
  je HeroHit
  jmp EnemyHit
HeroHit:
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  push r8d
  fild dword ptr [esp]
  fmul dword ptr [fHeroDamageMult]
  fistp dword ptr [esp]
  pop r8d
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor r8d,r8d
  jmp MyCleanUp1
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne MyCleanUp1
  cmp r8d,eax
  jl @F
  xor r8d,r8d
@@:
  jmp MyCleanUp1
EnemyHit:
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckOneHitKill
  push r8d
  fild dword ptr [esp]
  fmul dword ptr [fEnemyDamageMult]
  fistp dword ptr [esp]
  pop r8d
CheckOneHitKill:
  cmp [OneHitKill],1
  jne MyCleanUp1
  mov r8d,eax
  jmp MyCleanUp1
MyCleanUp1:
  jmp DamageModAOB+0C

GodMode:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)2.0
fHeroDamageMult:
dq (float)0.25
HeroCannotDie:
dq 1

DamageModAOB:
  jmp newmem
  return:

[DISABLE]

DamageModAOB:
  readmem(DamageModAOBSave,12)

unregistersymbol(DamageModAOB)
unregistersymbol(DamageModAOBSave)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fHeroDamageMult)
unregistersymbol(HeroCannotDie)

dealloc(newmem)"""

