[[cheat]]
id = "enable-battle-mp-options-infinite-mp-etc"
name = "Enable Battle MP Options (Infinite MP, etc.)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
///
aobscanmodule(BattleMPModAOB1,$process,66 42 29 44 02 04 E9 * * * * 48 6B D0 3E) // should be unique
registersymbol(BattleMPModAOB1)
alloc(newmem,1024,BattleMPModAOB1)

/// Outside Battle
aobscanmodule(BattleMPModAOB2,$process,66 29 54 01 04 48 83 C4 28 C3) // should be unique
registersymbol(BattleMPModAOB2)
alloc(newmem2,1024,BattleMPModAOB2)

///
label(return)
label(BattleMPModAOB1Save)
registersymbol(BattleMPModAOB1Save)
label(InfiniteBattleMP)
registersymbol(InfiniteBattleMP)
label(fEnemyBattleMPMult)
registersymbol(fEnemyBattleMPMult)
label(fHeroBattleMPMult)
registersymbol(fHeroBattleMPMult)

///
label(return2)
label(BattleMPModAOB2Save)
registersymbol(BattleMPModAOB2Save)

///
newmem:
  cmp byte ptr [rdx+r8+0000002D],FF
  je HeroMPHit1
  jmp EnemyMPHit1
HeroMPHit1:
HeroBattleMPHit1:
  cmp [fHeroBattleMPMult],(float)0.0
  je CheckInfBattleMP1
  push eax
  fild dword ptr [rsp]
  fmul dword ptr [fHeroBattleMPMult]
  fistp dword ptr [rsp]
  pop eax
CheckInfBattleMP1:
  cmp [InfiniteBattleMP],1
  jne MPCleanUp1
  xor eax,eax
  jmp MPCleanUp1
EnemyMPHit1:
EnemyBattleMPHit1:
  cmp [fEnemyBattleMPMult],(float)0.0
  je MPCleanUp1
  push eax
  fild dword ptr [rsp]
  fmul dword ptr [fEnemyBattleMPMult]
  fistp dword ptr [rsp]
  pop eax

MPCleanUp1:
BattleMPModAOB1Save:
  readmem(BattleMPModAOB1,6)
  jmp BattleMPModAOB1+06

InfiniteBattleMP:
dq 1
fEnemyBattleMPMult:
dq (float)2.0
fHeroBattleMPMult:
dq (float)0.25

newmem2:
HeroMPHit2:
HeroBattleMPHit2:
  cmp [fHeroBattleMPMult],(float)0.0
  je CheckInfBattleMP2
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [fHeroBattleMPMult]
  fistp dword ptr [rsp]
  pop edx
CheckInfBattleMP2:
  cmp [InfiniteBattleMP],1
  jne MPCleanUp2
  xor edx,edx
  jmp MPCleanUp2

MPCleanUp2:
BattleMPModAOB2Save:
  readmem(BattleMPModAOB2,5)
  jmp BattleMPModAOB2+05

///
BattleMPModAOB1:
  jmp newmem
  return:

///
BattleMPModAOB2:
  jmp newmem2
  return2:

[DISABLE]

BattleMPModAOB1:
  readmem(BattleMPModAOB1Save,6)

unregistersymbol(BattleMPModAOB1)
unregistersymbol(BattleMPModAOB1Save)
unregistersymbol(InfiniteBattleMP)
unregistersymbol(fEnemyBattleMPMult)
unregistersymbol(fHeroBattleMPMult)

///
BattleMPModAOB2:
  readmem(BattleMPModAOB2Save,5)

unregistersymbol(BattleMPModAOB2)
unregistersymbol(BattleMPModAOB2Save)

///
dealloc(newmem)
dealloc(newmem2)"""

