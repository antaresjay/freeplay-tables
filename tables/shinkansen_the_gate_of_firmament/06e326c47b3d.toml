[[cheat]]
id = "gamedatasystem-base-address-scan-initialization-activate-this-first"
name = "GameDataSystem Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameDataSystem_basepointer)
registersymbol(GameDataSystem_update_enable)
registersymbol(GameDataSystem_set_enable)

alloc(GameDataSystem_basepointer, 4)
