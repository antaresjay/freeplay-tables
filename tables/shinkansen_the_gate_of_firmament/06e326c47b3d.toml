[[cheat]]
id = "gamedatasystem-base-address-scan-to-activate-play-to-update-play"
name = "GameDataSystem Base Address Scan (To Activate: Play, To Update: Play)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameDataSystem_savedAOB)
label(GameDataSystem_returnhere)
label(GameDataSystem_originalcode)
label(GameDataSystem_exit)

label(GameDataSystem_update_exit)
label(GameDataSystem_set_exit)

registersymbol(GameDataSystem_savedAOB)

//1F4EA89C - 83 EC 14              - sub esp,14
//1F4EA89F - 8B 7D 08              - mov edi,[ebp+08]
// GameDataSystem:Update+e
//1F4EA8A2 - 0FB6 87 84000000      - movzx eax,byte ptr [edi+00000084]
//1F4EA8A9 - 85 C0                 - test eax,eax
//1F4EA8AB - 0F84 56000000         - je 1F4EA907
//1F4EA8B1 - D9 47 60              - fld dword ptr [edi+60]
//1F4EA8B4 - DD 5D E8              - fstp qword ptr [ebp-18]
//1F4EA8B7 - E8 344E63E5           - call 04B1F6F0
aobscan(GameDataSystem_searchedAOB, 0F B6 87 84 00 00 00 85 C0 * * * * * * D9 47 60)

alloc(GameDataSystem_newmem, 2048, GameDataSystem_searchedAOB)


GameDataSystem_newmem:
cmp dword ptr [GameDataSystem_update_enable], #0
je GameDataSystem_update_exit
mov [GameDataSystem_basepointer], edi
GameDataSystem_update_exit:

cmp dword ptr [GameDataSystem_set_enable], #0
je GameDataSystem_set_exit
mov [edi+38], #9999999
GameDataSystem_set_exit:


GameDataSystem_originalcode:
db 0F B6 87 84 00 00 00
//movzx eax,byte ptr [edi+00000084]


GameDataSystem_exit:
jmp GameDataSystem_returnhere


GameDataSystem_searchedAOB:
GameDataSystem_savedAOB:
jmp GameDataSystem_newmem
nop
nop
GameDataSystem_returnhere:


[DISABLE]
GameDataSystem_savedAOB:
db 0F B6 87 84 00 00 00
//movzx eax,byte ptr [edi+00000084]

unregistersymbol(GameDataSystem_savedAOB)

dealloc(GameDataSystem_newmem)"""

