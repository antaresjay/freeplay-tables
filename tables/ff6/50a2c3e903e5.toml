id = "battle-assistant"
name = "Battle Assistant"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(GenericWriterAOB,FF6.exe,8A 45 0C 88 01 5D C3)
alloc(start,$2048)
globalalloc(Enable_Health,4)
globalalloc(Enable_FastATB,4)
globalalloc(Enable_EasyKill,4)
globalalloc(Enable_ExtraExp,4)
globalalloc(Extra_Exp,4)
label(DoFastATB)
label(EndFastATB)
label(DoHealth)
label(EndHealth)
label(DoEasyKill)
label(EndEasyKill)
label(DoExtraExp)
label(EndExtraExp)
label(exit)
label(code)
label(return)

Enable_Health:
  dd 1
Enable_FastATB:
  dd 1
Enable_EasyKill:
  dd 1
Enable_ExtraExp:
  dd 0
Extra_Exp:
  dd #10000

start:
  mov al,[ebp+0C]
  mov [ecx],al

// Check if we're in battle
  cmp word ptr [FF6.exe+1058280], 0
  jz EndHealth

// Health/Mana Cheat
  cmp [Enable_Health], 0
  je EndHealth

  cmp word ptr [FF6.exe+105C61C], FFFF
  je EndHealth
  cmp ecx, FF6.exe+105D390
  jb EndHealth
  cmp ecx, FF6.exe+105D396
  jna DoHealth
  cmp ecx, FF6.exe+105D3A4
  jb EndHealth
  cmp ecx, FF6.exe+105D3AB
  ja EndHealth

DoHealth:
  push word ptr [FF6.exe+105D3B8]
  pop  word ptr [FF6.exe+105D390]
  push word ptr [FF6.exe+105D3BA]
  pop  word ptr [FF6.exe+105D392]
  push word ptr [FF6.exe+105D3BC]
  pop  word ptr [FF6.exe+105D394]
  push word ptr [FF6.exe+105D3BE]
  pop  word ptr [FF6.exe+105D396]

  push word ptr [FF6.exe+105D3CC]
  pop  word ptr [FF6.exe+105D3A4]
  push word ptr [FF6.exe+105D3CE]
  pop  word ptr [FF6.exe+105D3A6]
  push word ptr [FF6.exe+105D3D0]
  pop  word ptr [FF6.exe+105D3A8]
  push word ptr [FF6.exe+105D3D2]
  pop  word ptr [FF6.exe+105D3AA]

EndHealth:

// Easy Kill Cheat
  cmp [Enable_EasyKill], 0
  je EndEasyKill
  cmp ecx, FF6.exe+105D398
  jb EndEasyKill
  cmp ecx, FF6.exe+105D3A5
  ja EndEasyKill

DoEasyKill:
  mov word ptr [FF6.exe+105D398], 0
  mov word ptr [FF6.exe+105D39A], 0
  mov word ptr [FF6.exe+105D39C], 0
  mov word ptr [FF6.exe+105D39E], 0
  mov word ptr [FF6.exe+105D3A0], 0
  mov word ptr [FF6.exe+105D3A2], 0
//  mov word ptr [FF6.exe+105D3A4], 0

EndEasyKill:


// Check if we're in battle
  cmp word ptr [FF6.exe+1058280], 0
  jz EndFastATB
// Fast ATB Cheat
  cmp [Enable_FastATB], 0
  je EndFastATB

  cmp ecx, FF6.exe+105C9B5
  je DoFastATB
  cmp ecx, FF6.exe+105C9B7
  je DoFastATB
  cmp ecx, FF6.exe+105C9B9
  je DoFastATB
  cmp ecx, FF6.exe+105C9BB
  je DoFastATB
  jmp EndFastATB

DoFastATB:
  cmp byte ptr [ecx], #2
  jb EndFastATB
  mov byte ptr [ecx], #254

EndFastATB:

// Check if we're in battle
  cmp word ptr [FF6.exe+1058280], 0
  jz EndExtraExp
// Extra Exp Cheat
  cmp [Enable_ExtraExp], 0
  je EndExtraExp

DoExtraExp:
  cmp ecx, FF6.exe+105C6D3
  jne EndExtraExp
  mov edx, dword ptr [FF6.exe+105C6D1]
  and edx, 00FFFFFF
  add edx, [Extra_Exp]
  movzx eax, byte ptr [FF6.exe+105C6D4]
  or edx, eax
  mov dword ptr [FF6.exe+105C6D1], edx

EndExtraExp:

code:
  jmp return

exit:

GenericWriterAOB:
  jmp start
return:
registersymbol(GenericWriterAOB)

[DISABLE]

GenericWriterAOB:
  db 8A 45 0C 88 01

unregistersymbol(GenericWriterAOB)
dealloc(start)
dealloc(Enable_Health)
dealloc(Enable_FastATB)
dealloc(Enable_EasyKill)
dealloc(Enable_ExtraExp)
dealloc(Extra_Exp)


