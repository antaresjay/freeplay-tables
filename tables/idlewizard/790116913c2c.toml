{ Game   : IdleWizard.exe
  Version: 
  Date   : 2022-02-16
  Author : Cole

  This script does blah blah blah
}

[ENABLE]

aobscan(maxshardcost,E4 F3 0F 10 86 94 00 00 00) // should be unique
alloc(newmem,$1000,maxshardcost)

label(code)
label(return)

newmem:
  mov [rsi+00000094], (float)1
code:
  movss xmm0,[rsi+00000094]
  jmp return

maxshardcost+01:
  jmp newmem
  nop 3
return:
registersymbol(maxshardcost)

[DISABLE]

maxshardcost+01:
  db F3 0F 10 86 94 00 00 00

unregistersymbol(maxshardcost)
dealloc(newmem)

{
