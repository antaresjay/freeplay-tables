[[cheat]]
id = "monster-character-ctrl-numpad-1"
name = "Monster Character (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Kaiju_2025-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 4.27.2.0
// Game Version      : v1.0.5 (Early Access)
// Script Date       : 2026-06-26


[ENABLE]

aobscanmodule(master,Kaiju_2025-Win64-Shipping.exe,4Cxxxx4Cxxxxxxxx488Bxx488Bxx41FFxxxxxxxxxx4883) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,8)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,8)

newmem:
  mov [data],rdi

code:
  readmem(master,8)
  jmp return

master:
  jmp newmem
  nop 3
return:

[DISABLE]

master:
  readmem(masterbkp,8)

unregistersymbol(*)
dealloc(*)"""

