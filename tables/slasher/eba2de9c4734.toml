[[cheat]]
id = "game-ctrl-numpad-1"
name = "Game (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Slasher.exe
// Author            : ndck76
// Executable Version: 2022.3.41.39041
// Game Version      : Build.17173425
// Script Date       : 2025-02-05


[ENABLE]

aobscanmodule(seconds,GameAssembly.dll,F3xxxxxxxxxxxxxxF3xxxxxxF3xxxxxxxxxxxxxx89xxxxxxxxxx89xxxxxxxxxxE8) //game.setta_txt_tempo
alloc(newmem,$1000,seconds)
alloc(data,8)
alloc(secondsbkp,8)
registersymbol(data)
registersymbol(seconds)
registersymbol(secondsbkp)
label(code)
label(return)

secondsbkp:
  readmem(seconds,8)

newmem:
  mov [data],rdi

code:
  readmem(seconds,8)
  jmp return

seconds:
  jmp newmem
  nop 3
return:

[DISABLE]

seconds:
  readmem(secondsbkp,8)

unregistersymbol(*)
dealloc(*)"""

