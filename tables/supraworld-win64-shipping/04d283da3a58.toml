type = "script"
source = """
[ENABLE]

aobscanmodule(coincoin,Supraworld-Win64-Shipping.exe,F3 0F 10 8C 24 C0 00 00 00 F3 0F 10 79 08)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  movss xmm1,[rsp+000000C0]

  cmp r13, 0
  jne code

  cmp r15, 0
  jne code

  mov [rcx+08], (float)9999
  movss xmm1, [rcx+08]
code:
  movss xmm7,[rcx+08]
  jmp return

coincoin:
  jmp far newmem
return:
registersymbol(coincoin)

[DISABLE]

coincoin:
  db F3 0F 10 8C 24 C0 00 00 00 F3 0F 10 79 08

unregistersymbol(coincoin)
dealloc(newmem)"""
