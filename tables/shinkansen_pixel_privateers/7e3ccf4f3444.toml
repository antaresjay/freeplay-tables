registersymbol(Character_statsset_enable)
registersymbol(Character_trainingset_enable)

alloc(Character_basepointer, 4)
alloc(Character_update_enable, 4)
alloc(Character_set_enable, 4)
alloc(Character_invincibleset_enable, 4)
alloc(Character_healthset_enable, 4)
alloc(Character_statsset_enable, 4)
alloc(Character_trainingset_enable, 4)


[DISABLE]
unregistersymbol(Character_basepointer)
unregistersymbol(Character_update_enable)
unregistersymbol(Character_set_enable)
unregistersymbol(Character_invincibleset_enable)
unregistersymbol(Character_healthset_enable)
unregistersymbol(Character_statsset_enable)
unregistersymbol(Character_trainingset_enable)

dealloc(Character_basepointer)
dealloc(Character_update_enable)
dealloc(Character_set_enable)
dealloc(Character_invincibleset_enable)
dealloc(Character_healthset_enable)
dealloc(Character_statsset_enable)
dealloc(Character_trainingset_enable)"""

[[cheat]]
id = "character-base-address-scan-to-activate-explore-planet-to-update-explore-planet"
name = "Character Base Address Scan (To Activate: Explore Planet, To Update: Explore Planet)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Character_savedAOB)
label(Character_returnhere)
label(Character_originalcode)
label(Character_exit)

label(Character_update_exit)
label(Character_set_exit)
label(Character_invincibleset_exit)
label(Character_healthset_exit)
label(Character_statsset_exit)
label(Character_trainingset_exit)

registersymbol(Character_savedAOB)

//0D539445 - 56                    - push esi
//0D539446 - 81 EC 9C000000        - sub esp,0000009C
//0D53944C - 8B 7D 08              - mov edi,[ebp+08]
// Character:Update+f
//0D53944F - D9EE                  - fldz
//0D539451 - D9 5D D0              - fstp dword ptr [ebp-30]
//0D539454 - C7 45 98 00000000     - mov [ebp-68],00000000
//0D53945B - C7 45 9C 00000000     - mov [ebp-64],00000000
//0D539462 - C7 45 A0 00000000     - mov [ebp-60],00000000
aobscan(Character_searchedAOB, D9 EE D9 5D D0 C7 45 98 00 00 00 00)

alloc(Character_newmem, 2048, Character_searchedAOB)
alloc(Character_temp1, 4, Character_searchedAOB)
alloc(Character_temp2, 4, Character_searchedAOB)
alloc(Character_temp3, 4, Character_searchedAOB)
alloc(Character_temp4, 4, Character_searchedAOB)


Character_newmem:
mov [Character_temp1], eax
mov [Character_temp2], ebx
mov [Character_temp3], ecx
mov [Character_temp4], edx

cmp dword ptr [Character_update_enable], #0
je Character_update_exit
cmp byte ptr [edi+3e0], #1
jne Character_update_exit
mov [Character_basepointer], edi
Character_update_exit:

cmp dword ptr [Character_set_enable], #0
je Character_set_exit
Character_set_exit:

cmp byte ptr [edi+30c], #1
jne Character_trainingset_exit

cmp dword ptr [Character_invincibleset_enable], #0
je Character_invincibleset_exit
mov byte ptr [edi+2e1], #1
Character_invincibleset_exit:

cmp dword ptr [edi+134], #0
je Character_trainingset_exit
mov ebx, [edi+134]

cmp dword ptr [Character_healthset_enable], #0
je Character_healthset_exit
mov [ebx+16c], (float)9999999
Character_healthset_exit:

cmp dword ptr [ebx+8], #0
je Character_trainingset_exit
mov ecx, [ebx+8]

cmp dword ptr [Character_statsset_enable], #0
je Character_statsset_exit
mov [ecx+58], (float)9999
mov [ecx+5c], (float)9999
mov [ecx+60], (float)9999
mov [ecx+64], (float)9999
mov [ecx+68], (float)9999
mov [ecx+6c], (float)9999
Character_statsset_exit:

cmp dword ptr [Character_trainingset_enable], #0
je Character_trainingset_exit
mov [ecx+38], #9999999
Character_trainingset_exit:

mov eax, [Character_temp1]
mov ebx, [Character_temp2]
mov ecx, [Character_temp3]
mov edx, [Character_temp4]


Character_originalcode:
db D9 EE D9 5D D0
//fldz
//fstp dword ptr [ebp-30]


Character_exit:
jmp Character_returnhere


Character_searchedAOB:
Character_savedAOB:
jmp Character_newmem
Character_returnhere:


[DISABLE]
Character_savedAOB:
db D9 EE D9 5D D0
//fldz
//fstp dword ptr [ebp-30]

unregistersymbol(Character_savedAOB)

dealloc(Character_newmem)
dealloc(Character_temp1)
dealloc(Character_temp2)
dealloc(Character_temp3)
dealloc(Character_temp4)"""

