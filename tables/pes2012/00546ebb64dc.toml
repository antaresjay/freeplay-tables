[[cheat]]
id = "money-activate-me"
name = "Money (Activate me)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(originalcode)
label(_BLMoney)
registersymbol(_BLMoney)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
cmp [_BLMoney],1
jne short originalcode
add [eax+08],#10000000
mov [_BLMoney],0
originalcode:
mov ecx,[eax+08]
mov [esp+08],ecx
jmp returnhere

_BLMoney:
dd 0

"pes2012.exe"+7D3E8E:
jmp newmem
nop
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
"pes2012.exe"+7D3E8E:
mov ecx,[eax+08]
mov [esp+08],ecx
dealloc(newmem)
unregistersymbol(_BLMoney)
//Alt: db 8B 48 08 89 4C 24 08"""

