[[cheat]]
id = "enable-achievement-unlocker"
name = "Enable Achievement Unlocker"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Rubber Bandits.exe
  Version: 1.0.2.13943 | Windows Store
  Date   : 2021-12-06
  Author : SvT
}

[ENABLE]
aobscanmodule(getID,GameAssembly.dll,8B 46 38 B9 34 00 00 00)
alloc(newmem,$1000,getID)

label(code)
label(return)
label(baseAddr)
label(_flag)
registersymbol(getID)
registersymbol(baseAddr)
registersymbol(_flag)

newmem:
  cmp [rsi+38],#1 // check for _repetitions (achievement requirement)
  jne code
  cmp [_flag],#1 // check if flag set
  je code
  mov [_flag],#1 // set flag so acheivement "id" isn't replaced later
  mov [baseAddr],rsi

code:
  mov eax,[rsi+38]
  mov ecx,00000034
  jmp return

baseAddr:
  dq 0

_flag:
  dq 0

getID:
  jmp newmem
  nop 3
return:

[DISABLE]
getID:
  db 8B 46 38 B9 34 00 00 00

unregistersymbol(getID)
unregistersymbol(baseAddr)
unregistersymbol(_flag)
dealloc(newmem)"""

