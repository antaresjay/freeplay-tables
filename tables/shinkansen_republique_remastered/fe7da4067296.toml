[[cheat]]
id = "networkmode-base-address-scan-to-activate-play-level-to-update-play-level"
name = "NetworkMode Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(NetworkMode_savedAOB)
label(NetworkMode_returnhere)
label(NetworkMode_originalcode)
label(NetworkMode_exit)

label(NetworkMode_update_exit)
label(NetworkMode_set_exit)

registersymbol(NetworkMode_savedAOB)

//218047BD - 56                    - push esi
//218047BE - 81 EC BC000000        - sub esp,000000BC
//218047C4 - 8B 7D 08              - mov edi,[ebp+08]
// NetworkMode:Update+f
//218047C7 - C7 85 64FFFFFF 00000000 - mov [ebp-0000009C],00000000
//218047D1 - C7 85 68FFFFFF 00000000 - mov [ebp-00000098],00000000
//218047DB - C7 85 6CFFFFFF 00000000 - mov [ebp-00000094],00000000
//218047E5 - C7 85 70FFFFFF 00000000 - mov [ebp-00000090],00000000
//218047EF - C7 85 74FFFFFF 00000000 - mov [ebp-0000008C],00000000
//218047F9 - C7 85 78FFFFFF 00000000 - mov [ebp-00000088],00000000
//21804803 - C7 85 7CFFFFFF 00000000 - mov [ebp-00000084],00000000
aobscan(NetworkMode_searchedAOB, 8B 7D 08 C7 85 64 FF FF FF 00 00 00 00 C7 85 68 FF FF FF 00 00 00 00 C7 85 6C FF FF FF 00 00 00 00 C7 85 70 FF FF FF 00 00 00 00)

alloc(NetworkMode_newmem, 2048, NetworkMode_searchedAOB)


NetworkMode_newmem:
cmp dword ptr [NetworkMode_update_enable], #0
je NetworkMode_update_exit
mov [NetworkMode_basepointer], edi
NetworkMode_update_exit:

cmp dword ptr [NetworkMode_set_enable], #0
je NetworkMode_set_exit
fld [edi+cc]
fstp [edi+c8]
NetworkMode_set_exit:


NetworkMode_originalcode:
db C7 85 64 FF FF FF 00 00 00 00
//mov [ebp-0000009C],00000000


NetworkMode_exit:
jmp NetworkMode_returnhere


NetworkMode_searchedAOB + 3:
NetworkMode_savedAOB:
jmp NetworkMode_newmem
nop
nop
nop
nop
nop
NetworkMode_returnhere:


[DISABLE]
NetworkMode_savedAOB:
db C7 85 64 FF FF FF 00 00 00 00
//mov [ebp-0000009C],00000000

unregistersymbol(NetworkMode_savedAOB)

dealloc(NetworkMode_newmem)"""

