[[cheat]]
id = "activate-first"
name = "[ Activate First ]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(_PlayerBase,DisasterReport4-Win64-Shipping.exe,48 8B 01 FF 50 30 65)
alloc(newmem,$1000,DisasterReport4-Win64-Shipping.exe)

label(code)
label(return)
label(Health)
label(Stress)
label(Hunger)
label(Money)
label(Moral)
label(ResetMoral)
label(imMoral)
label(ResetimMoral)
label(Bathroom)
label(Thirst)
label(Other)

newmem:
push rsi
mov [Other],rcx
mov rsi,[rcx+50]
cmp rsi,1000000
jna code
mov rsi,[rsi+170]
cmp rsi,1000000
jna code

cmp [Health],0
je LStress
fld [rsi+00000520]
fstp [rsi+0000051C]

LStress:
cmp [Stress],0
je LHunger
mov [rsi+00000524],(float)0

LHunger:
cmp [Hunger],0
je LMoney
mov [rsi+0000052C],(float)100

LMoney:
cmp [Money],0
je LMoral
mov [rsi+00000448],#99999999

LMoral:
cmp [Moral],0
je LResetMoral
mov [Moral],0
add [rsi+00000450],A

LResetMoral:
cmp [ResetMoral],0
je LimMoral
mov [ResetMoral],0
mov [rsi+00000450],0

LimMoral:
cmp [imMoral],0
je LResetimMoral
mov [imMoral],0
add [rsi+00000454],A

LResetimMoral:
cmp [ResetimMoral],0
je LBathroom
mov [ResetimMoral],0
mov [rsi+00000454],0

LBathroom:
cmp [Bathroom],0
je LThirst
mov [rsi+00000530],(float)0

LThirst:
cmp [Thirst],0
je code
mov [rsi+00000528],(float)0
jmp code

code:
  pop rsi
  mov rax,[rcx]
  call qword ptr [rax+30]
  jmp return

Health:
dd 0

Stress:
dd 0

Hunger:
dd 0

Money:
dd 0

Moral:
dd 0

ResetMoral:
dd 0

imMoral:
dd 0

ResetimMoral:
dd 0

Bathroom:
dd 0

Thirst:
dd 0

Other:
dd 0

_PlayerBase:
  jmp newmem
  nop
return:
registersymbol(_PlayerBase)
registersymbol(Health)
registersymbol(Stress)
registersymbol(Hunger)
registersymbol(Money)
registersymbol(Moral)
registersymbol(ResetMoral)
registersymbol(imMoral)
registersymbol(ResetimMoral)
registersymbol(Bathroom)
registersymbol(Thirst)
registersymbol(Other)

[DISABLE]

_PlayerBase:
  db 48 8B 01 FF 50 30

unregistersymbol(_PlayerBase)
unregistersymbol(Health)
unregistersymbol(Stress)
unregistersymbol(Hunger)
unregistersymbol(Money)
unregistersymbol(Moral)
unregistersymbol(ResetMoral)
unregistersymbol(imMoral)
unregistersymbol(ResetimMoral)
unregistersymbol(Bathroom)
unregistersymbol(Thirst)
unregistersymbol(Other)
dealloc(newmem)

