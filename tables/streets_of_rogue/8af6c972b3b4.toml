[[cheat]]
id = "one-hit-kill"
name = "One Hit Kill"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(ohk,F3 0F 11 A8 80 0A 00 00 33)
alloc(newmem,$1000,ohk)

label(code)
label(return)
label(_ohk)

newmem:
  cmp [rax+00000A80+38],(float)99999
  jne enemy
  mov [rax+00000A80],(float)99999
  jmp return

enemy:
  mov [rax+00000A80],(float)-1
  jmp return

code:
  movss [rax+00000A80],xmm5
  jmp return

_ohk:
  dd 0

ohk:
  jmp newmem
  nop 3
return:
registersymbol(ohk)
registersymbol(_ohk)

[DISABLE]
godmode:
  db F3 0F 11 A8 80 0A 00 00

unregistersymbol(ohk)
unregistersymbol(_ohk)
dealloc(newmem)"""

