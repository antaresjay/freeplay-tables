[ENABLE]
//=========================================
AOBScan(aobMonColony,8b 40 14 3b 70 04 ?? ?? 0f bf 44 70 08 b9 64 00 00 00)

//=========================================
alloc(MyCodeP,1024)
//=========================================
// Declaration section
label(pMonColony)
label(_MonColony)
label(_BackMC)
label(_ExitMC)
label(pColony)
label(iEnableMP)

registersymbol(MyCodeP)
registersymbol(pColony)
registersymbol(iEnableMP)
registersymbol(pMonColony)

//=========================================
MyCodeP:
//=========================================
_MonColony:
 push ebx
 push ecx
 push edx

 mov [pColony],eax                 // Save ptr for debugging

 mov ecx,[eax+08]
 test ecx,ecx
 jz _ExitMC

 cmp dword ptr [ecx+00000090],0
 jne _ExitMC

 cmp dword ptr [iEnableMP],0
 je _ExitMC                        // Jump if feature is disabled

 mov ebx,[ecx+0c]
 test ebx,ebx
 jz _ExitMC

 mov ebx,[ebx+38]                  // Get RaceID

 mov ecx,[eax+14]
 test ecx,ecx
 jz _ExitMC

 cmp ebx,[ecx+04]
 jge _ExitMC

 mov edx,#5000
 cmp dx,[ecx+ebx*2+08]
 jle _ExitMC

 sub dx,[ecx+ebx*2+08]

 add [ecx+ebx*2+08],dx
 add [eax+60],edx

_ExitMC:
 pop edx
 pop ecx
 pop ebx

 mov eax,[eax+14]                  // Original code
 cmp esi,[eax+04]                  // Original code
 jmp _BackMC                       // Back to main code

//=========================================
// Variables
iEnableMP:
 dd 1
pColony:
 dd 0

//=========================================
// Hacking Points
aobMonColony:
pMonColony:
 jmp _MonColony
 nop
_BackMC:

//=========================================
// Original Codes
[DISABLE]
pMonColony:
// mov eax,[eax+14]
// cmp esi,[eax+04]
 db 8b 40 14 3b 70 04

unregistersymbol(MyCodeP)
unregistersymbol(pColony)
unregistersymbol(iEnableMP)
unregistersymbol(pMonColony)

dealloc(MyCodeP)"""

