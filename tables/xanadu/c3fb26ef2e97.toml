[[cheat]]
id = "god-mode"
name = "God mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(godmode_aobscan,xanadu.exe,83 C4 04 3C 03 75 11 F6 84 24 E0 00 00 00 04 74 07 21 8C 24 E0 00 00 00 8B 9C 24 DC 00 00 00)
registersymbol(godmode_aobscan)
alloc(newmem,$100)
alloc(megadamage_flag,4)
registersymbol(megadamage_flag)

label(is_player)
label(original_code)
label(return)

megadamage_flag:
db 01

newmem:
cmp [esi-1C],00000000
jg is_player
cmp byte ptr [megadamage_flag],01
jne original_code
mov [esp+DC],7FFFFFFF
jmp original_code
is_player:
mov [esp+DC],00000000
original_code:
mov ebx,[esp+DC]
jmp return

godmode_aobscan+18:
jmp newmem
nop
nop
return:

[DISABLE]
godmode_aobscan+18:
db 8B 9C 24 DC 00 00 00

unregistersymbol(godmode_aobscan)
unregistersymbol(megadamage_flag)
dealloc(megadamage_flag)
dealloc(newmem)"""

