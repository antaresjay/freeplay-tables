id = "gameoption-base-address-scan-initialization-activate-this-first"
name = "GameOption Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameOption_basepointer)
registersymbol(GameOption_update_enable)
registersymbol(GameOption_set_enable)

alloc(GameOption_basepointer, 8)
alloc(GameOption_update_enable, 4)
alloc(GameOption_set_enable, 4)


[DISABLE]
unregistersymbol(GameOption_basepointer)
unregistersymbol(GameOption_update_enable)
unregistersymbol(GameOption_set_enable)

dealloc(GameOption_basepointer)
dealloc(GameOption_update_enable)
dealloc(GameOption_set_enable)"""

[[cheat]]
id = "gameoption-base-address-scan-to-activate-view-options-to-update-view-options"
name = "GameOption Base Address Scan (To Activate: View Options, To Update: View Options)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameOption_savedAOB)
label(GameOption_returnhere)
label(GameOption_originalcode)
label(GameOption_exit)

label(GameOption_update_exit)
label(GameOption_set_exit)

registersymbol(GameOption_savedAOB)

//04BE4572 - 41 FF D3              - call r11d
//04BE4575 - 48 83 C4 20           - add rsp,20
// GameOption:ApplyGameSettings+29
//04BE4579 - 48 63 56 74           - movsxd  rdx,dword ptr [rsi+74]
//04BE457D - 48 8B C8              - mov rcx,rax
//04BE4580 - 48 83 EC 20           - sub rsp,20
//04BE4584 - 83 38 00              - cmp dword ptr [rax],00
//04BE4587 - 49 BB 5069BE0400000000 - mov r11,0000000004BE6950 : [EC8B4855]
aobscan(GameOption_searchedAOB, 48 63 56 74 48 8B C8 48 83 EC 20)

alloc(GameOption_newmem, 2048, GameOption_searchedAOB)
alloc(GameOption_temp1, 8, GameOption_searchedAOB)
alloc(GameOption_temp2, 8, GameOption_searchedAOB)
alloc(GameOption_temp3, 8, GameOption_searchedAOB)
alloc(GameOption_temp4, 8, GameOption_searchedAOB)


GameOption_newmem:
mov [GameOption_temp1], rax
mov [GameOption_temp2], rbx
mov [GameOption_temp3], rcx
mov [GameOption_temp4], rdx

cmp dword ptr [GameOption_update_enable], #0
je GameOption_update_exit
mov [GameOption_basepointer], rsi
GameOption_update_exit:

cmp dword ptr [GameOption_set_enable], #0
je GameOption_set_exit
GameOption_set_exit:

mov rax, [GameOption_temp1]
mov rbx, [GameOption_temp2]
mov rcx, [GameOption_temp3]
mov rdx, [GameOption_temp4]


GameOption_originalcode:
db 48 63 56 74 48 8B C8
//movsxd  rdx,dword ptr [rsi+74]
//mov rcx,rax


GameOption_exit:
jmp GameOption_returnhere


GameOption_searchedAOB:
GameOption_savedAOB:
jmp GameOption_newmem
nop
nop
GameOption_returnhere:


[DISABLE]
GameOption_savedAOB:
db 48 63 56 74 48 8B C8
//movsxd  rdx,dword ptr [rsi+74]
//mov rcx,rax

unregistersymbol(GameOption_savedAOB)

dealloc(GameOption_newmem)
dealloc(GameOption_temp1)
dealloc(GameOption_temp2)
dealloc(GameOption_temp3)
dealloc(GameOption_temp4)"""

