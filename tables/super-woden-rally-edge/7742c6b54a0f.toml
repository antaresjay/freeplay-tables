name = "Countdown Editor (Ctrl + Numpad 1) {For Arcade Stage}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Super Woden Rally Edge.exe
// Author            : ndck76
// Executable Version: 6000.3.3.1049
// Game Version      : Build.21537172
// Script Date       : 2026-01-19


[ENABLE]

aobscanmodule(timeleft,GameAssembly.dll,F3xxxxxxxx33xxE8xxxxxxxxF3xxxxxxxx33xxF3) //CountDown.Update
alloc(newmem,$1000,timeleft)
alloc(data3,8)
alloc(timeleftbkp,5)
registersymbol(data3)
registersymbol(timeleft)
registersymbol(timeleftbkp)
label(code)
label(return)

timeleftbkp:
  readmem(timeleft,5)

newmem:
  mov [data3],rbx

code:
  readmem(timeleft,5)
  jmp return

timeleft:
  jmp newmem
return:

[DISABLE]

timeleft:
  readmem(timeleftbkp,5)

unregistersymbol(*)
dealloc(*)"""

