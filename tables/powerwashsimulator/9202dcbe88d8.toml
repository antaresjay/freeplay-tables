[[cheat]]
id = "super-washer-cycle-to-different-nozzle"
name = "Super Washer (cycle to different nozzle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048,"PWS.WasherClassNozzleSettings.GetCombined"+ED)
label(returnhere)
label(originalcode)
label(exit)

newmem:
mov [rcx+18],(float)75 // horizontalAngle
mov [rcx+1C],(float)1 // verticalAngle
mov [rcx+20],(float)99999 // range
mov [rcx+2C],(float)99999 // power
mov [rcx+30],(float)99999 // m_surfaceCleaningModifier
mov [rcx+34],(float)99999 // m_encrustedCleaningModifier
mov [rcx+38],(float)99999 // m_embeddedCleaningModifier
mov [rcx+3C],(float)99999 // m_toughCleaningModifier
mov [rcx+40],(float)99999 // m_stubbornCleaningModifier
mov [rcx+44],(float)99999 // m_ingrainedCleaningModifier
mov [rcx+48],(float)99999 // m_oilyCleaningModifier

originalcode:
mulss xmm0,[rcx+1C]

exit:
jmp returnhere

"PWS.WasherClassNozzleSettings.GetCombined"+ED:
jmp newmem
returnhere:

[DISABLE]
dealloc(newmem)
"PWS.WasherClassNozzleSettings.GetCombined"+ED:
mulss xmm0,[rcx+1C]"""

