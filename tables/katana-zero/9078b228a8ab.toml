[[cheat]]
id = "freeze-time"
name = "Freeze Time"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(timecd,Katana ZERO.exe,F2 0F 11 0E EB 21)
alloc(newmem,$1000)

label(code)
label(return)
label(applyvalcd)
label(timevalue)

newmem:
  cmp [esi-C], 40AF4000
  je applyvalcd

  cmp [esi-C], 40B77000
  je applyvalcd

  cmp [esi-C], 40BFA400
  je applyvalcd

  cmp [esi-C], 40BB5800
  je applyvalcd

  jmp code

applyvalcd:
  movq xmm1, [timevalue]

code:
  movsd [esi],xmm1
  jmp timecd+27
  jmp return

timevalue:
dq (double)8000

timecd:
  jmp newmem
  nop
return:
registersymbol(timecd)

[DISABLE]

timecd:
  db F2 0F 11 0E EB 21

unregistersymbol(timecd)
dealloc(newmem)"""
