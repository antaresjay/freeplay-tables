[[cheat]]
id = "ammo-reload-off"
name = "Ammo   [Reload off]  "
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(inventory_ammo_capacity,game_x86_rwdi.dll,F0 2B C6 89 84 BB 5C 0A 00 00)
alloc(newmem,$100)
label(return)
aobscanmodule(inventory_ammo_used,game_x86_rwdi.dll,FF 48 20 83 C0 20)
alloc(newmemx,$100)
label(codex)
label(returnx)
newmem:
  mov [ebx+edi*4+A5C],3E7
  jmp return
inventory_ammo_capacity+03:
  jmp newmem
  nop 2
return:
registersymbol(inventory_ammo_capacity)
newmemx:
  mov [eax+20],63
  add eax,20
  jmp returnx
codex:
  dec [eax+20]
  add eax,20
  jmp returnx
inventory_ammo_used:
  jmp newmemx
  nop
returnx:
registersymbol(inventory_ammo_used)
[DISABLE]
inventory_ammo_capacity+03:
  db 89 84 BB 5C 0A 00 00
unregistersymbol(inventory_ammo_capacity)
dealloc(newmem)
inventory_ammo_used:
  db FF 48 20 83 C0 20
unregistersymbol(inventory_ammo_used)
dealloc(newmemx)"""

