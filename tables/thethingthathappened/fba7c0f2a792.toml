[[cheat]]
id = "player-character-ctrl-numpad-1"
name = "Player Character (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : TheThingThatHappened.exe
// Author            : ndck76
// Executable Version: 5.2.1.0
// Game Version      : v1.00
// Script Date       : 2026-07-23


[ENABLE]

aobscanmodule(master,TheThingThatHappened.exe,4Cxxxx4Cxxxxxxxx488Bxx488Bxx41FFxxxxxxxxxx488Bxxxxxx4883xxxx5FC3xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx4889xxxxxx574883xxxxF3) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,8)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,8)

newmem:
  mov [data],rbx

code:
  readmem(master,8)
  jmp return

master:
  jmp newmem
  nop 3
return:

[DISABLE]

master:
  readmem(masterbkp,8)

unregistersymbol(*)
dealloc(*)"""

