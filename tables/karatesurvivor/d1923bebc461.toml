[[cheat]]
id = "kill-teeth-count-ctrl-numpad-1"
name = "Kill/Teeth Count (Ctrl + Numpad 1)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : KarateSurvivor.exe
// Author            : ndck76
// Executable Version: 2022.3.33.51283
// Game Version      : v1.0.0.208
// Script Date       : 2024-11-03


[ENABLE]

aobscanmodule(killcount,GameAssembly.dll,8Bxxxx488Bxxxx03xx89xxxx4885xx74xx4C) //Core.Stats.SimpleCountHandler.Handle
alloc(newmem,$1000,killcount)
alloc(data2,8)
alloc(killcountbkp,7)
registersymbol(data2)
registersymbol(killcount)
registersymbol(killcountbkp)
label(code)
label(return)

killcountbkp:
  readmem(killcount,7)

newmem:
  mov [data2],rbx

code:
  readmem(killcount,7)
  jmp return

killcount:
  jmp newmem
  nop 2
return:

[DISABLE]

killcount:
  readmem(killcountbkp,7)

unregistersymbol(*)
dealloc(*)"""

