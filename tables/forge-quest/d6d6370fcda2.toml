[[cheat]]
id = "godmode"
name = "GodMode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(noDmg,8B 80 28 01 00 00 0F 2F 80 3C 03 00 00 0F 83)
alloc(newmem,$1000)

label(noDmgR)
label(baseAdd)

newmem:
  mov eax,[eax+00000128]
  cmp dword ptr [eax+68],'player'
  jne noDmgR
  mov [baseAdd], eax
  push ebx
  mov ebx, [eax+1FC]
  mov [eax+0000033C], ebx
  pop ebx
  jmp noDmgR

baseAdd:
 dd 0

noDmg:
  jmp newmem
  nop
noDmgR:

registersymbol(noDmg)
registersymbol(baseAdd)

[DISABLE]
noDmg:
  db 8B 80 28 01 00 00
unregistersymbol(noDmg)
unregistersymbol(baseAdd)
dealloc(newmem)"""

