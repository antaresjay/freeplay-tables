[[cheat]]
id = "skip-door"
name = "skip door"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(skipdoor,bhd.exe,C7 86 84 00 00 00 00 00 00 00 5F 6A 01)
registersymbol(skipdoor)
alloc(newmem,$1000)

label(return)

newmem:
  mov [esi+00000084],00000003
  jmp return

skipdoor:
  jmp newmem
  nop
  nop
  nop
  nop
  nop
return:

[DISABLE]

skipdoor:
  db C7 86 84 00 00 00 00 00 00 00

unregistersymbol(skipdoor)
