[[cheat]]
id = "regular-zombie-auto-shake-off"
name = "regular zombie auto shake off"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : bhd.exe
  Version:
  Date   : 2015-01-25
  Author : mgr.inz.Player
}

[ENABLE]
aobscanmodule(autoface_zombie,bhd.exe,74 35 0F 28 05 * * * * 6a 00) // should be unique
aobscanmodule(regzombie_frontgrab,bhd.exe,6A 00 6A 02 6A 01 6A 02 8B CE E8 * * * * 6A) // should be unique

registersymbol(autoface_zombie)
registersymbol(regzombie_frontgrab)

autoface_zombie:
  db 90 90

regzombie_frontgrab:
  push 0
  push 8           // 6-push, 8-forcepush, 9-stungun, b-dagger, f-flash grenade
  push 1
  push 2
regzombie_frontgrab+f:
  push 8


[DISABLE]
autoface_zombie:
  db 74 35

regzombie_frontgrab:
  push 00
  push 02
  push 01
  push 02
regzombie_frontgrab+f:
  push 02

unregistersymbol(autoface_zombie)
unregistersymbol(regzombie_frontgrab)"""

