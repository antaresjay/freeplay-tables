[[cheat]]
id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(ammo,bhd.exe,29 81 FC 0F 00 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  mov eax, [ecx+00001000]
  mov [ecx+00000FFC], eax
  xor eax, eax
  sub [ecx+00000FFC], eax
  jmp return

ammo:
  jmp newmem
  nop
return:
registersymbol(ammo)

[DISABLE]

ammo:
  db 29 81 FC 0F 00 00

unregistersymbol(ammo)
dealloc(newmem)"""
