[[cheat]]
id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(ammohook,512)
label(ammoreturn)
AoBScanModule(Ammo, bhd.exe, 89 39 89 41 04 80 7E 1C 00 )
AoBScanModule(AmmoReturnAddress, bhd.exe, A1 ? ? ? ? 8B 4C 24 28 05 )
registersymbol(Ammo)

Ammo:
jmp ammohook
ammoreturn:

ammohook:
mov [ecx],edi
mov [ecx+04],eax
cmp [esp+8],AmmoReturnAddress
jne ammoreturn
add eax,[esp+50]
mov [ecx+04],eax
jmp ammoreturn

[DISABLE]
dealloc(Ammo)
dealloc(ammohook)
dealloc(ammoreturn)
dealloc(AmmoReturnAddress)
unregistersymbol(Ammo)

Ammo:
mov [ecx],edi
mov [ecx+04],eax"""

