[[cheat]]
id = "score-editor-ctrl-numpad-2"
name = "Score Editor (Ctrl + Numpad 2)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : SonicColorsUltimate.exe
// Author            : ndck76
// Executable Version: 1.0.0.0
// Game Version      : v1.0.0.0
// Script Date       : 2025-12-31


[ENABLE]

aobscanmodule(score,SonicColorsUltimate.exe,4539xxxx450Fxxxxxx488Dxxxxxxxxxx488D) // should be unique
alloc(newmem,$1000,score)
alloc(data4,8)
alloc(scorebkp,9)
registersymbol(data4)
registersymbol(score)
registersymbol(scorebkp)
label(code)
label(return)

scorebkp:
  readmem(score,9)

newmem:
  mov [data4],r15

code:
  readmem(score,9)
  jmp return

score:
  jmp newmem
  nop 4
return:

[DISABLE]

score:
  readmem(scorebkp,9)

unregistersymbol(*)
dealloc(*)"""

