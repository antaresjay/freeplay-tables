name = "Player Coord"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Coord,ParadiseLost-Win64-Shipping.exe,0F 10 BF D0 01 00 00 45) // should be unique
alloc(newmem,$1000,Coord)
alloc(_PlayerCoord,4)
label(code)
label(return)

newmem:
mov [_PlayerCoord],rdi
code:
  movups xmm7,[rdi+000001D0]
  jmp return

Coord:
  jmp newmem
  nop 2
return:
registersymbol(Coord)
registersymbol(_PlayerCoord)
[DISABLE]

Coord:
  db 0F 10 BF D0 01 00 00

unregistersymbol(Coord)
dealloc(newmem)
unregistersymbol(_PlayerCoord)
dealloc(_PlayerCoord)"""
