// Script Date       : 2026-05-17


define(address,GoldManager:AddGold+16)
define(bytes,48 63 47 48 03 C6)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,GoldManager:AddGold+16)

label(code)
label(return)
label(data3)
