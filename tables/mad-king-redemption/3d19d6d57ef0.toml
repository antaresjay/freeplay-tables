  movsxd  rax,dword ptr [rdi+48]
  add eax,esi
  jmp return

data3:
  db

address:
  jmp newmem
  nop
return:

[DISABLE]

address:
  db bytes
  // movsxd  rax,dword ptr [rdi+48]
  // add eax,esi

dealloc(*)
unregistersymbol(*)"""

