type = "script"
source = """
[ENABLE]

aobscanmodule(ItemDurability,GameAssembly.dll,F3 0F 11 40 20 48 8B 8F 38)
alloc(newmem,$1000,ItemDurability)

label(code)
label(return)

newmem:

code:
  movss xmm0,[ItemDurabilityNew]
  movss [rax+20],xmm0
  jmp return

ItemDurabilityNew:
dd (float)9999

ItemDurability:
  jmp newmem
return:
registersymbol(ItemDurability)

[DISABLE]

ItemDurability:
  db F3 0F 11 40 20

unregistersymbol(*)
dealloc(*)

{
// ---------- INJECTING HERE ----------
GameAssembly.dll+420FF7: F3 0F 11 40 20           - movss [rax+20],xmm0
// ---------- DONE INJECTING  ----------

}"""
