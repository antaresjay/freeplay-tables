id = "campaignscreenlistener-base-address-scan-initialization-activate-this-first"
name = "CampaignScreenListener Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(CampaignScreenListener_basepointer)
registersymbol(CampaignScreenListener_update_enable)
registersymbol(CampaignScreenListener_set_enable)

alloc(CampaignScreenListener_basepointer, 4)
alloc(CampaignScreenListener_update_enable, 4)
alloc(CampaignScreenListener_set_enable, 4)


[DISABLE]
unregistersymbol(CampaignScreenListener_basepointer)
unregistersymbol(CampaignScreenListener_update_enable)
