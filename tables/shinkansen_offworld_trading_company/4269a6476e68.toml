[[cheat]]
id = "campaignscreenlistener-base-address-scan-to-activate-view-hire-staff-to-update-view-hire-staff"
name = "CampaignScreenListener Base Address Scan (To Activate: View Hire Staff, To Update: View Hire Staff)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(CampaignScreenListener_savedAOB)
label(CampaignScreenListener_returnhere)
label(CampaignScreenListener_originalcode)
label(CampaignScreenListener_exit)

label(CampaignScreenListener_update_exit)
label(CampaignScreenListener_set_exit)

registersymbol(CampaignScreenListener_savedAOB)

//151FD064 - 83 EC 24              - sub esp,24
//151FD067 - 8B 7D 08              - mov edi,[ebp+08]
// CampaignScreenListener:Update+a
//151FD06A - 8B 87 90000000        - mov eax,[edi+00000090]
//151FD070 - 89 45 E0              - mov [ebp-20],eax
//151FD073 - B9 01000000           - mov ecx,00000001
//151FD078 - B8 641D5311           - mov eax,11531D64 : [11365F10]
aobscan(CampaignScreenListener_searchedAOB, 8B 87 90 00 00 00 89 45 E0)

alloc(CampaignScreenListener_newmem, 2048, CampaignScreenListener_searchedAOB)
alloc(CampaignScreenListener_temp1, 4, CampaignScreenListener_searchedAOB)


CampaignScreenListener_newmem:
mov [CampaignScreenListener_temp1], ebx

cmp dword ptr [CampaignScreenListener_update_enable], #0
je CampaignScreenListener_update_exit
mov [CampaignScreenListener_basepointer], edi
CampaignScreenListener_update_exit:

cmp dword ptr [CampaignScreenListener_set_enable], #0
je CampaignScreenListener_set_exit
cmp dword ptr [edi+f8], #0
je CampaignScreenListener_set_exit
mov ebx, [edi+f8]
cmp dword ptr [ebx+14], #0
je CampaignScreenListener_set_exit
mov ebx, [ebx+14]
cmp dword ptr [ebx+8], #0
je CampaignScreenListener_set_exit
mov ebx, [ebx+8]
cmp dword ptr [ebx+10], #0
je CampaignScreenListener_set_exit
mov ebx, [ebx+10]
mov [ebx+40], #999999999
mov [ebx+44], #0
CampaignScreenListener_set_exit:

mov ebx, [CampaignScreenListener_temp1]


CampaignScreenListener_originalcode:
db 8B 87 90 00 00 00
//mov eax,[edi+00000090]


CampaignScreenListener_exit:
jmp CampaignScreenListener_returnhere


CampaignScreenListener_searchedAOB:
CampaignScreenListener_savedAOB:
jmp CampaignScreenListener_newmem
nop
CampaignScreenListener_returnhere:


[DISABLE]
CampaignScreenListener_savedAOB:
db 8B 87 90 00 00 00
//mov eax,[edi+00000090]

unregistersymbol(CampaignScreenListener_savedAOB)

dealloc(CampaignScreenListener_newmem)
dealloc(CampaignScreenListener_temp1)"""

