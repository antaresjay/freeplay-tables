[[cheat]]
id = "activate-trainer"
name = "Activate Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(Active,PearlGame.exe,83 BB 78 03 00 00 00 7E A1)
registersymbol(Active)
alloc(newmem,2048,Active)
label(returnhere)
label(originalcode)






label(Reload)
label(Ammo)
label(Cooldown)
label(Health)


label(ReloadE)
label(AmmoE)
label(CooldownE)
label(HealthE)
registersymbol(ReloadE)
registersymbol(AmmoE)
registersymbol(CooldownE)
registersymbol(HealthE)
newmem: //this is allocated memory, you have read,write,execute access
//place your code here
//498 3c0 reload
//498 3c4 ammo
//70 18 40 124 cooldown
//bc speed
push rsi
Health:
cmp [HealthE],0
je Cooldown
mov [rbx+00000378],#1000
Cooldown:
cmp [CooldownE],0
je Ammo
mov rsi,[rbx+70]
cmp rsi,1000000
jng Ammo
mov rsi,[rsi+18]
cmp rsi,1000000
jng Ammo
mov rsi,[rsi+40]
cmp rsi,1000000
jng Ammo
mov [rsi+124],(float)100
Ammo:
mov rsi,[rbx+498]
cmp rsi,100000
jng originalcode
cmp [AmmoE],0
je Reload
mov [rsi+3c4],#99
Reload:
cmp [ReloadE],0
je originalcode
mov [rsi+3c0],0
originalcode:
pop rsi
cmp dword ptr [rbx+00000378],00
jmp returnhere
ReloadE:
dd 0
AmmoE:
dd 0
CooldownE:
dd 0
HealthE:
dd 0
Active://"PearlGame.exe"+2321D23:
jmp newmem
nop
nop
returnhere:
//83 BB 78 03 00 00 00 7E ?? 48 8B 8B 60 02 00 00

 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
Active://
 db 83 BB 78 03 00 00 00
unregistersymbol(Active)
unregistersymbol(ReloadE)
unregistersymbol(AmmoE)
unregistersymbol(CooldownE)
unregistersymbol(HealthE)"""

