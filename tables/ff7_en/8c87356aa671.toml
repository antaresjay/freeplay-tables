type = "script"
source = """
[ENABLE]


aobscanmodule(mana,FF7_EN.exe,66 8B 81 04 B1 9A 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  mov word ptr [ecx+FF7_EN.exe+5AB104], #1000
  mov ax, [ecx+FF7_EN.exe+5AB104]
  jmp return

mana:
