id = "infinite-stamina"
name = "Infinite Stamina"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(staminacd,gta-vc.exe,25 D9 85 00 06 00 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  mov [ebp+00000600], (float)350
  fld dword ptr [ebp+00000600]
  jmp return

staminacd+01:
  jmp newmem
  nop
return:
registersymbol(staminacd)

[DISABLE]

staminacd+01:
  db D9 85 00 06 00 00

unregistersymbol(staminacd)
dealloc(newmem)"""
