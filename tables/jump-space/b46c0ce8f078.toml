[[cheat]]
id = "one-hit-kills"
name = "One Hit Kills"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Jump Space.exe
  Date   : 2025-09-21
  Author : Sianz
}

[ENABLE]

aobscanregion(ohk,HealthComponent_Base.DealDamageToHealth,HealthComponent_Base.DealDamageToHealth+100,F3 0F 5C F7) // should be unique
alloc(newmem,$1000,ohk)
alloc(weakenemy,8)
