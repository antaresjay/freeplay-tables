  nop 2
return:
registersymbol(ohk weakenemy)

[DISABLE]

ohk:
  db F3 0F 5C F7 0F 57 C9

unregistersymbol(*)
dealloc(*)"""

[[cheat]]
id = "cheat"
name = "𝐑𝐞𝐬𝐨𝐮𝐫𝐜𝐞 𝟏"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Jump Space.exe
  Date   : 2025-09-25
  Author : Sianz
}

[ENABLE]

alloc(newmem,$1000,Pathfinding.LinkGraph.CountNodes)
alloc(myammo,8)
alloc(mymateria,8)
label(code)
label(return)
label(ammocost)
registersymbol(ammocost myammo mymateria)

newmem:
  test rcx,rcx
  je code
  cmp dword ptr [rcx+58],0
  je code
  cmp [rcx+120],#1
  jne @f
  mov [myammo],rcx
  cmp byte ptr [ammocost],1
  jne @f
  mov [rcx+58],#100
  @@:
  cmp [rcx+118],#4000
  jne @f
  mov [mymateria],rcx
  @@:
code:
  mov eax,[rcx+58]
  ret 
  int 3 
  jmp return
  ammocost:
  db 0

Pathfinding.LinkGraph.CountNodes:
  jmp newmem
return:

[DISABLE]

Pathfinding.LinkGraph.CountNodes:
  db 8B 41 58 C3 CC

unregistersymbol(*)
dealloc(*)"""

