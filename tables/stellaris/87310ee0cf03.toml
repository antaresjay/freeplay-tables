[[cheat]]
id = "x-enable-console-dev-mode-in-ironman"
name = "[X] <== Enable Console/Dev Mode in Ironman"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//=========================================
 [ENABLE]
//=========================================
define(LUDO,"stellaris.exe")

label(CHP1)
label(CHP2)
label(CHP3)
label(CHP4)
registersymbol(CHP1)
registersymbol(CHP2)
registersymbol(CHP3)
registersymbol(CHP4)

//enable console
aobscan(aob1, 80 7F 54 00 74 ?? 80 7F 55 00 74 ??)
aobscan(aob2, 80 7F 55 00 74 ?? 6A 35 68 ?? ?? ??)
//enable developer commands
aobscan(aob3, 75 ?? 80 7F 54 00 74 ?? 68 ?? ?? ??)
//enable commands in ironman
aobscan(aob4, E9 ?? ?? ?? ?? 80 7F 55 00 74 ?? 6A 35 68 ?? ?? ??)

//=========================================
// Actual script
//=========================================

aob1:
CHP1:
 cmp eax,eax
 nop
 nop

aob2:
CHP2:
 cmp eax,eax
 nop
 nop

aob3+2:
CHP3:
 cmp eax,eax
 nop
 nop

aob4+5:
CHP4:
 cmp eax,eax
 nop
 nop

//=========================================
 [DISABLE]
//=========================================

CHP1:
//cmp byte ptr [edi+54],00
 db 80 7F 54 00

//cmp byte ptr [edi+55],00
CHP2:
 db 80 7F 55 00

CHP3:
//cmp byte ptr [edi+54],00
 db 80 7F 54 00

//cmp byte ptr [edi+55],00
CHP4:
 db 80 7F 55 00

unregistersymbol(CHP1)
unregistersymbol(CHP2)
unregistersymbol(CHP3)
unregistersymbol(CHP4)"""

