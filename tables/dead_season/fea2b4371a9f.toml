[[cheat]]
id = "infinite-survivor-health"
name = "Infinite Survivor Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
//Send
[ENABLE]
//survivor.sethealthpoints
aobscanmodule(survivor_health,GameAssembly.dll,8B 47 38 85 C0)
alloc(newmem,$1000,survivor_health)

label(code)
label(return)

newmem:

code:
  mov [rdi+38],#4
  mov eax,[rdi+38]
  test eax,eax
  jmp return

survivor_health:
  jmp newmem
return:
registersymbol(survivor_health)

[DISABLE]

survivor_health:
  db 8B 47 38 85 C0

unregistersymbol(survivor_health)
dealloc(newmem)"""

