[[cheat]]
id = "item-set-to-20-when-use-in-battle"
name = "Item set to 20 when use in battle"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(aobnolimit,89 4C 9E 40 BF ?? 00 00 00)
alloc(newmem,4096)
label(injectnolimit)
label(entrynolimit)
label(processnolimit)
label(returnnolimit)
registersymbol(injectnolimit)


newmem:
// Entries
  entrynolimit:
  jmp processnolimit

// Process
  processnolimit:
  mov ecx,14
  mov [esi+ebx*4+40],ecx
  mov edi,E9
  jmp returnnolimit

  // Injection Points
aobnolimit:
injectnolimit:
  jmp entrynolimit
  nop
  nop
  nop
  nop
returnnolimit:


[DISABLE]
injectnolimit:
  mov [esi+ebx*4+40],ecx
  mov edi,E9

dealloc(newmem)
unregistersymbol(injectnolimit)"""

