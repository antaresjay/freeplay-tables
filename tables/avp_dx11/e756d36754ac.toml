type = "script"
source = """
//Send
[ENABLE]

aobscanmodule(ammo,AvP_DX11.exe,F3 0F 11 41 10 C2 04 00 CC CC F6)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  movss xmm0,[newammo]
  movss [ecx+10],xmm0
  jmp return

newammo:
dd (float)99

ammo:
  jmp newmem
return:
registersymbol(ammo)

[DISABLE]

ammo:
  db F3 0F 11 41 10

unregistersymbol(*)
dealloc(*)

