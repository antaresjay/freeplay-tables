[[cheat]]
id = "fortitude-solved"
name = "Fortitude(Solved)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(MaxFortitude,GameAssembly.dll,F3 0F 11 B7 8C 00 00 00)
alloc(newmem,$100,MaxFortitude)

label(code)
label(return)
alloc(PFortitude,4)
alloc(EnemyF,4)
alloc(PlayerF,4)
alloc(EFortitude,4)

registersymbol(MaxFortitude EnemyF PlayerF PFortitude EFortitude)

EnemyF:
dd 0

PlayerF:
dd 0

PFortitude:
dq (float)1

EFortitude:
dq (float)0

newmem:
  cmp [rdi+000002AC],1   //detect if enemy (by "shearerc")
  je @f
  cmp [PlayerF],0
  je code
  movss xmm6,[PFortitude]
  movss [rdi+0000008C],xmm6
  jmp return

@@:
   cmp [EnemyF],0
   je code
   movSS xmm6,[EFortitude]


code:
  movss [rdi+0000008C],xmm6
  jmp return

MaxFortitude:
  jmp newmem
  nop 3
return:

[DISABLE]

MaxFortitude:
  db F3 0F 11 B7 8C 00 00 00

unregistersymbol(*)
dealloc(*)"""

