[[cheat]]
id = "zombiebehaviour-base-address-scan-to-activate-play-level-to-update-play-level"
name = "ZombieBehaviour Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(ZombieBehaviour_savedAOB)
label(ZombieBehaviour_returnhere)
label(ZombieBehaviour_originalcode)
label(ZombieBehaviour_exit)

label(ZombieBehaviour_update_exit)
label(ZombieBehaviour_set_exit)
label(ZombieBehaviour_invincibleset_exit)
label(ZombieBehaviour_statsset_exit)

registersymbol(ZombieBehaviour_savedAOB)

//05E13356 - 83 EC 0C              - sub esp,0C
//05E13359 - 8B 7D 08              - mov edi,[ebp+08]
// ZombieBehaviour:Update+c
//05E1335C - 8B 5F 44              - mov ebx,[edi+44]
//05E1335F - 8B C3                 - mov eax,ebx
//05E13361 - 3D 04000000           - cmp eax,00000004
//05E13366 - 74 0E                 - je 05E13376
//05E13368 - 83 FB 05              - cmp ebx,05
aobscan(ZombieBehaviour_searchedAOB, 8B 5F 44 8B C3 3D 04 00 00 00)

alloc(ZombieBehaviour_newmem, 2048, ZombieBehaviour_searchedAOB)
alloc(ZombieBehaviour_temp1, 4, ZombieBehaviour_searchedAOB)


ZombieBehaviour_newmem:
mov [ZombieBehaviour_temp1], ecx

cmp dword ptr [ZombieBehaviour_update_enable], #0
je ZombieBehaviour_update_exit
mov [ZombieBehaviour_basepointer], edi
ZombieBehaviour_update_exit:

cmp dword ptr [ZombieBehaviour_set_enable], #0
je ZombieBehaviour_set_exit
ZombieBehaviour_set_exit:

cmp dword ptr [ZombieBehaviour_invincibleset_enable], #0
je ZombieBehaviour_invincibleset_exit
cmp dword ptr [edi+30], #0
je ZombieBehaviour_invincibleset_exit
mov ecx, [edi+30]
cmp dword ptr [ecx+3c], #0
je ZombieBehaviour_invincibleset_exit
mov ecx, [ecx+3c]
cmp dword ptr [ecx+10], #0
je ZombieBehaviour_invincibleset_exit
mov ecx, [ecx+10]
mov byte ptr [ecx+5c], #1
ZombieBehaviour_invincibleset_exit:

cmp dword ptr [ZombieBehaviour_statsset_enable], #0
je ZombieBehaviour_statsset_exit
//mov [edi+a4], (float)5
//mov byte ptr [edi+118], #1
//mov byte ptr [edi+14d], #1
ZombieBehaviour_statsset_exit:

mov ecx, [ZombieBehaviour_temp1]


ZombieBehaviour_originalcode:
db 8B 5F 44 8B C3
//mov ebx,[edi+44]
//mov eax,ebx


ZombieBehaviour_exit:
jmp ZombieBehaviour_returnhere


ZombieBehaviour_searchedAOB:
ZombieBehaviour_savedAOB:
jmp ZombieBehaviour_newmem
ZombieBehaviour_returnhere:


[DISABLE]
ZombieBehaviour_savedAOB:
db 8B 5F 44 8B C3
//mov ebx,[edi+44]
//mov eax,ebx

unregistersymbol(ZombieBehaviour_savedAOB)

dealloc(ZombieBehaviour_newmem)
dealloc(ZombieBehaviour_temp1)"""

