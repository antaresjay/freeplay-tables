[[cheat]]
id = "mutationbutton-base-address-scan-initialization-activate-this-first"
name = "MutationButton Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(MutationButton_basepointer)
registersymbol(MutationButton_update_enable)
registersymbol(MutationButton_set_enable)
registersymbol(MutationButton_quantityset_enable)
registersymbol(MutationButton_dnaset_enable)
registersymbol(MutationButton_availableset_enable)

alloc(MutationButton_basepointer, 4)
alloc(MutationButton_update_enable, 4)
alloc(MutationButton_set_enable, 4)
alloc(MutationButton_quantityset_enable, 4)
alloc(MutationButton_dnaset_enable, 4)
alloc(MutationButton_availableset_enable, 4)


[DISABLE]
unregistersymbol(MutationButton_basepointer)
unregistersymbol(MutationButton_update_enable)
unregistersymbol(MutationButton_set_enable)
unregistersymbol(MutationButton_quantityset_enable)
unregistersymbol(MutationButton_dnaset_enable)
unregistersymbol(MutationButton_availableset_enable)

dealloc(MutationButton_basepointer)
dealloc(MutationButton_update_enable)
dealloc(MutationButton_set_enable)
dealloc(MutationButton_quantityset_enable)
dealloc(MutationButton_dnaset_enable)
dealloc(MutationButton_availableset_enable)"""

[[cheat]]
id = "mutationbutton-base-address-scan-to-activate-mouseover-mutation-to-update-mouseover-mutation"
name = "MutationButton Base Address Scan (To Activate: Mouseover Mutation, To Update: Mouseover Mutation)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(MutationButton_savedAOB)
label(MutationButton_returnhere)
label(MutationButton_originalcode)
label(MutationButton_exit)

label(MutationButton_update_exit)
label(MutationButton_set_exit)
label(MutationButton_quantityset_exit)
label(MutationButton_dnaset_exit)
label(MutationButton_availableset_exit)

registersymbol(MutationButton_savedAOB)

//0EDFD22C - 83 EC 04              - sub esp,04
//0EDFD22F - 8B 45 08              - mov eax,[ebp+08]
// MutationButton:get_Interactable+a
//0EDFD232 - 8B 40 60              - mov eax,[eax+60]
//0EDFD235 - 85 C0                 - test eax,eax
//0EDFD237 - 74 15                 - je 0EDFD24E
//0EDFD239 - 8B 45 08              - mov eax,[ebp+08]
//0EDFD23C - 8B 40 60              - mov eax,[eax+60]
//0EDFD23F - 3D 01000000           - cmp eax,00000001
//0EDFD244 - 0F94 C0               - sete al
aobscan(MutationButton_searchedAOB, 8B 40 60 85 C0 74 15 8B 45 08)

alloc(MutationButton_newmem, 2048, MutationButton_searchedAOB)
alloc(MutationButton_temp1, 4, MutationButton_searchedAOB)
alloc(MutationButton_temp2, 4, MutationButton_searchedAOB)


MutationButton_newmem:
mov [MutationButton_temp1], ebx
mov [MutationButton_temp2], ecx

cmp dword ptr [MutationButton_update_enable], #0
je MutationButton_update_exit
mov [MutationButton_basepointer], eax
MutationButton_update_exit:

cmp dword ptr [MutationButton_set_enable], #0
je MutationButton_set_exit
MutationButton_set_exit:

cmp dword ptr [MutationButton_quantityset_enable], #0
je MutationButton_quantityset_exit
cmp dword ptr [eax+54], #0
je MutationButton_quantityset_exit
mov ebx, [eax+54]
cmp dword ptr [ebx+38], #0
je MutationButton_quantityset_exit
mov ebx, [ebx+38]
cmp dword ptr [ebx+14], #0
je MutationButton_quantityset_exit
mov ebx, [ebx+14]
mov [ebx+10], #999
mov [ebx+14], #999
mov [ebx+18], #999
mov [ebx+1c], #999
mov [ebx+20], #999
mov [ebx+24], #999
mov [ebx+28], #999
mov [ebx+2c], #999
mov [ebx+30], #999
mov [ebx+34], #999
mov [ebx+38], #999
mov [ebx+3c], #999
MutationButton_quantityset_exit:

cmp dword ptr [MutationButton_dnaset_enable], #0
je MutationButton_dnaset_exit
cmp dword ptr [eax+54], #0
je MutationButton_quantityset_exit
mov ebx, [eax+54]
mov ecx, [ebx+48]
mov [ebx+50], ecx
MutationButton_dnaset_exit:

cmp dword ptr [MutationButton_availableset_enable], #0
je MutationButton_availableset_exit
cmp dword ptr [eax+54], #0
je MutationButton_availableset_exit
mov ebx, [eax+54]
cmp dword ptr [ebx+34], #0
je MutationButton_availableset_exit
mov ebx, [ebx+34]
cmp dword ptr [ebx+14], #0
je MutationButton_availableset_exit
mov ebx, [ebx+14]
mov byte ptr [ebx+10], #1
mov byte ptr [ebx+11], #1
mov byte ptr [ebx+12], #1
mov byte ptr [ebx+13], #1
mov byte ptr [ebx+14], #1
mov byte ptr [ebx+15], #1
mov byte ptr [ebx+16], #1
mov byte ptr [ebx+17], #1
mov byte ptr [ebx+18], #1
mov byte ptr [ebx+19], #1
mov byte ptr [ebx+1a], #1
mov byte ptr [ebx+1b], #1
cmp dword ptr [eax+60], #1
je MutationButton_availableset_exit
mov [eax+60], #0
MutationButton_availableset_exit:

mov ebx, [MutationButton_temp1]
mov ecx, [MutationButton_temp2]


MutationButton_originalcode:
db 8B 40 60 85 C0
//mov eax,[eax+60]
//test eax,eax


MutationButton_exit:
jmp MutationButton_returnhere


MutationButton_searchedAOB:
MutationButton_savedAOB:
jmp MutationButton_newmem
MutationButton_returnhere:


[DISABLE]
MutationButton_savedAOB:
db 8B 40 60 85 C0
//mov eax,[eax+60]
//test eax,eax

unregistersymbol(MutationButton_savedAOB)

dealloc(MutationButton_newmem)
dealloc(MutationButton_temp1)
dealloc(MutationButton_temp2)"""

