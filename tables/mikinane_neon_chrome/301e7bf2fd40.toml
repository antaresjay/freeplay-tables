[[cheat]]
id = "one-hit-kill"
name = "One Hit Kill"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[Enable]
alloc(newmem,100)
label(returnhere)
label(exit)
label(Enemy)
registersymbol(Enemy)
aobscan(aob1, F3 0F 10 86 94 04 00 00 0F 57 C9 0F 2F C1 0F 86 64 02 00 00)

newmem:
mov [esi+00000494],(float)1.0 //set to 0 for enemy completely ignore you at first of mission
movss xmm0,[esi+00000494]

exit:
jmp returnhere

aob1:
Enemy:
jmp newmem
nop
nop
nop
returnhere:

[Disable]
dealloc(newmem)
unregistersymbol(Enemy)
Enemy:
db F3 0F 10 86 94 04 00 00 0F 57 C9 0F 2F C1 0F 86 64 02 00 00"""

