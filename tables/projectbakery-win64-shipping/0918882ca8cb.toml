name = "→ Infinite Jumps"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//Send@Sintrix|FearlessRevolution
aobscanmodule(MaxJumpCount_AOB,$process,8Bxxxxxxxxxx39xxxxxxxxxx0F9Cxx84)
