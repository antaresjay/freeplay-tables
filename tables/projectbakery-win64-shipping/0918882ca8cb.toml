type = "script"
source = """
[ENABLE]
//Send@Sintrix|FearlessRevolution
aobscanmodule(MaxSpeedAOB,$process,F3xxxxxxxxxxxxxx4883xxxx5BC3F3xxxxxxxxxxxxxx4883xxxx5BC3F3xxxxxxxxxxxxxx4883xxxx5BC3F3xxxxxxxxxxxxxx4883xxxx5BC30F57xx4883xxxx5BC390)
alloc(newmem,$1000,MaxSpeedAOB)
registersymbol(SetPlayerSpeed)
label(code return SetPlayerSpeed)

newmem:

code:
