[[cheat]]
id = "3-activate-me-base-adress-for-pointers"
name = "3) Activate me !           Base adress for pointers"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Valfaris Mecha Therion.exe
  Version: 
  Date   : 2024-02-10
  Author : LIOBOSS

  This script does blah blah blah
}

[ENABLE]

aobscan(pbase,83 39 00 0F B6 80 04 01 00 00 85 C0 74 13) // should be unique
alloc(newmem,$1000,pbase)
alloc(base_adress,8)


label(code)
label(return)


base_adress:
dq 0


newmem:

code:
  mov [base_adress],rcx
  cmp dword ptr [rcx],00
  movzx eax,byte ptr [rax+00000104]
  jmp return

pbase:
  jmp newmem
  nop 5
return:
registersymbol(pbase base_adress)

[DISABLE]

pbase:
  db 83 39 00 0F B6 80 04 01 00 00

unregistersymbol(pbase)
unregistersymbol(base_adress)
dealloc(newmem)
dealloc(base_adress)"""

