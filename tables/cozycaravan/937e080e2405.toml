[[cheat]]
id = "day-night-manager-ctrl-numpad-2"
name = "Day Night Manager (Ctrl + Numpad 2)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : CozyCaravan.exe
// Author            : ndck76
// Executable Version: 6000.0.59.10268
// Game Version      : v1.0.0
// Script Date       : 2026-01-10


[ENABLE]

aobscanregion(state,Game.DayNightManager:get_TimePeriod,Game.DayNightManager:get_TimePeriod+100,488B46xx48xxxxxx48xxxx48xxxxxx49BBxxxxxxxxxxxx000041xxxx48xxxxxx48xxxxxx5DC3) //Game.DayNightManager:get_TimePeriod+f
alloc(newmem,$1000,state)
alloc(data3,8)
alloc(statebkp,8)
registersymbol(data3)
registersymbol(state)
registersymbol(statebkp)
label(code)
label(return)

statebkp:
  readmem(state,8)

newmem:
  mov [data3],rsi

code:
  readmem(state,8)
  jmp return

state:
  jmp newmem
  nop 3
return:

[DISABLE]

state:
  readmem(statebkp,8)

unregistersymbol(*)
dealloc(*)"""

