[[cheat]]
id = "gold"
name = "Gold"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
define(FPGOLD,Dominions5.exe+13311B)
define(FPGBYTES,41 2B C6 41 89 04 24)
define(FPGSAVEADDY,Dominions5.exe+1A8584)
define(FPGSABYTES,42 8B 84 31 E0 78 75 02)
define(FPGSCONSTANT,027578E0) // FPGSABYTES LAST 4 BYTES REVERSED
define(FPGRESGADDY,Dominions5.exe+1B05A8)
define(FPGRESGBYTES,BD 0A 00 00 00 48 8B)
define(DOMSKIP,Dominions5.exe+133230) // need to edit whenever new version comes out


[ENABLE]
assert(FPGOLD,FPGBYTES)
assert(FPGSAVEADDY,FPGSABYTES)
assert(FPGRESGADDY,FPGRESGBYTES)
alloc(gAddy,8,FPGOLD)
alloc(gTrue,1,FPGOLD)
alloc(gNoInc,1,FPGOLD)
alloc(newmem,$50,FPGOLD)
label(noIncome)
label(skip)
label(return)

gAddy:
db 00 00 00 00 00 00 00 00
gTrue:
db 00
gNoInc:
db 00

newmem:
  cmp byte ptr[gTrue],01
  jne skip
  cmp r12,[gAddy]
  je skip
  cmp byte ptr [gNoInc],01
  je noIncome
  sub eax,r14d
  mov [r12],eax
  jns DOMSKIP
  jmp return
noIncome:
  mov eax,00
  sub eax,r14d
  mov [r12],eax
  jns DOMSKIP
  jmp return
skip:
  mov [r12],FFFFFF
  jmp DOMSKIP
  jmp return

FPGOLD:
  jmp newmem
  nop 2
return:
registersymbol(gAddy)
registersymbol(gTrue)
registersymbol(gNoInc)

alloc(newmem2,$64,FPGSAVEADDY)

label(code2)
label(skip2)
label(return2)

newmem2:

code2:
  xor rax,rax  //check if 0
  cmp qword ptr [gAddy],rax
  jne skip2
  mov rax,rcx
  add rax,r14
  add rax,FPGSCONSTANT
  mov [gAddy],rax
skip2:
  mov eax,[rcx+r14+FPGSCONSTANT]
  jmp return2

FPGSAVEADDY:
  jmp newmem2
  nop 3
return2:

alloc(newmem3,$32,FPGRESGADDY)

label(code3)
label(return3)

newmem3:

code3:
  xor rbp,rbp
  mov [gAddy],rbp
  mov ebp,0000000A
  jmp return3

FPGRESGADDY:
  jmp newmem3
return3:

[DISABLE]

FPGOLD:
  db FPGBYTES

unregistersymbol(gAddy)
unregistersymbol(gTrue)
unregistersymbol(gNoInc)
dealloc(newmem)
dealloc(gNoInc)
dealloc(gTrue)
dealloc(gAddy)

FPGSAVEADDY:
  db FPGSABYTES

dealloc(newmem2)

FPGRESGADDY:
  db FPGRESGBYTES

dealloc(newmem3)"""

