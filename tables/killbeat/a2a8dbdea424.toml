[[cheat]]
id = "player-ctrl-numpad-1"
name = "Player (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : KILLBEAT.exe
// Author            : ndck76
// Executable Version: 6000.0.45.7123
// Game Version      : Build.19297257
// Script Date       : 2025-07-26


[ENABLE]

aobscanmodule(aimdirection,GameAssembly.dll,F2xxxxxxxxxxxxxx448BxxxxxxxxxxF2xxxxxxxxF2) //MBPlayer.UpdateAnimatorValues
alloc(newmem,$1000,aimdirection)
alloc(data,8)
alloc(aimdirectionbkp,8)
registersymbol(data)
registersymbol(aimdirection)
registersymbol(aimdirectionbkp)
label(code)
label(return)

aimdirectionbkp:
  readmem(aimdirection,8)

newmem:
  mov [data],rdi

code:
  readmem(aimdirection,8)
  jmp return

aimdirection:
  jmp newmem
  nop 3
return:

[DISABLE]

aimdirection:
  readmem(aimdirectionbkp,8)

unregistersymbol(*)
dealloc(*)"""

