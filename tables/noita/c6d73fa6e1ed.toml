id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : noita.exe
  Version: 
  Date   : 2019-09-25
  Author : cfe

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(aobPoint,noita.exe,F3 0F 10 48 48 F3 0F 10 05) // 48 - 4C
alloc(newmem,$1000)

label(code)
label(pBase)
registersymbol(pBase)
label(infH)
registersymbol(infH)
label(hpReg)
registersymbol(hpReg)
label(addamount)
registersymbol(addamount)
label(addamountintern)
registersymbol(addamountintern)
label(return)
label(dAddAm)
registersymbol(dAddAm)
newmem:

code:
  pushf
  mov [pBase],eax
  cmp dword ptr [infH],1
  jne @f
  push ebx
  mov ebx,[eax+4C]
  movss xmm1,[eax+4C]
  mov [eax+48],ebx
  pop ebx
  @@:
  movss xmm1,[eax+48]
  cmp [dAddAm],(float)0
  je end
  push ebx
  mov ebx,[eax+4C]
  cmp [eax+48],ebx
  jge @f
  addss xmm1,[dAddAm]
  movss [eax+48],xmm1
  @@:
  pop ebx

  end:
  popf
  jmp return
pBase:
dd 0
infH:
dd 0
hpReg:
dd (float)1
addamount:
dd (float)3//0.12
addamountintern:
dd (float)0//0.12
dAddAm:
dd (float)0
aobPoint:
  jmp newmem
return:
registersymbol(aobPoint)


//


aobscanmodule(aobGlobalRegionCheck,noita.exe,80 3D ** ** ** ** 00 0F 84 ** ** ** ** 6A 01 6A 40 6A 0A ) // should be unique
alloc(newmem2,$1000)

alloc(origCheck,7)
registersymbol(origCheck)

origCheck:
readmem(aobGlobalRegionCheck,7)

label(code2)
label(return2)
label(bDebugMode)
registersymbol(bDebugMode)

newmem2:

code2:
  push eax
  push ebx
  db B8
  readmem(aobGlobalRegionCheck+2,4)
  sub eax,2
  mov bl,[bDebugMode]
  mov byte ptr[eax],bl
  pop ebx
  pop eax
  readmem(aobGlobalRegionCheck,7)
  //cmp byte ptr [noita.exe+11D785B],00
  jmp return2
bDebugMode:
db 0
aobGlobalRegionCheck:
  jmp newmem2
  nop 2
return2:
registersymbol(aobGlobalRegionCheck)


aobscanmodule(aobHealthMethod,noita.exe,F3 0F 11 46 48 0F) // should be unique
registersymbol(aobHealthMethod)

[DISABLE]

aobPoint:
  db F3 0F 10 48 48

unregistersymbol(aobPoint)
dealloc(newmem)

//


aobGlobalRegionCheck:
  readmem(origCheck,7)

unregistersymbol(aobGlobalRegionCheck)
dealloc(newmem2)"""

