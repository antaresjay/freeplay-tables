//Send@ModEngine
[ENABLE]

aobscanmodule(infhover,noita.exe,F3 0F 11 82 10 01 00 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
mov [edx+0110],(float)3
jmp return
code:

  movss [edx+00000110],xmm0
