[ENABLE]

aobscanregion(metalworld,Player:Update,Player:Update+1500,0FB686xxxx000085xx0Fxxxxxxxxxx48xxxxxxxxxxxx33xx66xx49BBxxxxxxxxxxxx000041xxxx85xx0Fxxxxxxxxxx) //Player:Update+dc
alloc(newmem,$1000,metalworld)
alloc(data,8)
alloc(metalworldbkp,7)
registersymbol(data)
registersymbol(metalworld)
registersymbol(metalworldbkp)
label(code)
label(return)

metalworldbkp:
  readmem(metalworld,7)

newmem:
  mov [data],rsi

code:
  readmem(metalworld,7)
  jmp return

metalworld:
  jmp newmem
  nop 2
return:

[DISABLE]

metalworld:
  readmem(metalworldbkp,7)

unregistersymbol(*)
dealloc(*)"""
