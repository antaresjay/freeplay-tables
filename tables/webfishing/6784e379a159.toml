[[cheat]]
id = "auto-assemble-script"
name = "Auto Assemble script"
category = "misc"
description = ""
hint = ""
type = "script"
source = '''
//Target:  webfishing.exe
//Author:  Salis
//Credit to METHOS for custom Template LUA

[ENABLE]

////////////////////////  testscript  \\\\\\\\\\\\\\\\\\\\\\\\

aobscanmodule(address,webfishing.exe,48 89 43 08 E9 F2 02 00 00)
alloc(newmem,1024,webfishing.exe)
alloc(obytes_testscript, 10)
label(return originalcode)

registersymbol(obytes_testscript)

obytes_testscript:
readmem(address, 10)

newmem:

originalcode:
 mov [rbx+08],rax
 cmp [rbx+b6],#4
 jne end
 mov [rbx+08],#30
 jmp end

end:
 jmp webfishing.exe+1A94913
 jmp return

address:
 jmp newmem
 nop 4
return:


[DISABLE]

address:
readmem(obytes_testscript, 10)

dealloc(*)
unregistersymbol(*)'''
