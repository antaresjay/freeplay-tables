[[cheat]]
id = "playeranimationcontroller-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerAnimationController Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerAnimationController_savedAOB)
label(PlayerAnimationController_returnhere)
label(PlayerAnimationController_originalcode)
label(PlayerAnimationController_exit)

label(PlayerAnimationController_update_exit)
label(PlayerAnimationController_set_exit)
label(PlayerAnimationController_healthset_exit)
label(PlayerAnimationController_kiset_exit)
label(PlayerAnimationController_manaset_exit)
label(PlayerAnimationController_invulnerableset_exit)
label(PlayerAnimationController_comboset_exit)
label(PlayerAnimationController_jumpset_exit)
label(PlayerAnimationController_chargeset_exit)

registersymbol(PlayerAnimationController_savedAOB)

//10D899AE - 81 EC 9C0B0000        - sub esp,00000B9C
//10D899B4 - 8B 7D 08              - mov edi,[ebp+08]
// PlayerAnimationController:Update+f
//10D899B7 - D9EE                  - fldz
//10D899B9 - D9 5D EC              - fstp dword ptr [ebp-14]
//10D899BC - D9EE                  - fldz
//10D899BE - D9 9D DCF4FFFF        - fstp dword ptr [ebp-00000B24]
//10D899C4 - C7 85 E0F4FFFF 00000000 - mov [ebp-00000B20],00000000
//10D899CE - C7 85 E4F4FFFF 00000000 - mov [ebp-00000B1C],00000000
aobscan(PlayerAnimationController_searchedAOB, D9 EE D9 5D EC D9 EE D9 9D DC F4 FF FF)

alloc(PlayerAnimationController_newmem, 2048, PlayerAnimationController_searchedAOB)
alloc(PlayerAnimationController_temp1, 4, PlayerAnimationController_searchedAOB)
alloc(PlayerAnimationController_temp2, 4, PlayerAnimationController_searchedAOB)


PlayerAnimationController_newmem:
mov [PlayerAnimationController_temp1], ebx
mov [PlayerAnimationController_temp2], ecx

cmp dword ptr [PlayerAnimationController_update_enable], #0
je PlayerAnimationController_update_exit
mov [PlayerAnimationController_basepointer], edi
PlayerAnimationController_update_exit:

cmp dword ptr [PlayerAnimationController_set_enable], #0
je PlayerAnimationController_set_exit
PlayerAnimationController_set_exit:

cmp dword ptr [edi+110], #0
je PlayerAnimationController_comboset_exit
mov ebx, [edi+110]

cmp dword ptr [PlayerAnimationController_healthset_enable], #0
je PlayerAnimationController_healthset_exit
fld [ebx+44]
fstp [ebx+28]
PlayerAnimationController_healthset_exit:

cmp dword ptr [PlayerAnimationController_kiset_enable], #0
je PlayerAnimationController_kiset_exit
fld [ebx+70]
fstp [ebx+6c]
PlayerAnimationController_kiset_exit:

cmp dword ptr [PlayerAnimationController_manaset_enable], #0
je PlayerAnimationController_manaset_exit
fld [ebx+78]
fstp [ebx+74]
PlayerAnimationController_manaset_exit:

cmp dword ptr [PlayerAnimationController_invulnerableset_enable], #0
je PlayerAnimationController_invulnerableset_exit
mov byte ptr [ebx+34], #1
PlayerAnimationController_invulnerableset_exit:

cmp dword ptr [PlayerAnimationController_comboset_enable], #0
je PlayerAnimationController_comboset_exit
cmp dword ptr [ebx+1c], #0
je PlayerAnimationController_comboset_exit
mov ebx, [ebx+1c]
mov [ebx+d4], (float)9999
PlayerAnimationController_comboset_exit:

cmp dword ptr [PlayerAnimationController_jumpset_enable], #0
je PlayerAnimationController_jumpset_exit
mov [edi+74], (float)1
mov [edi+150], (float)6
mov [edi+154], (float)9
PlayerAnimationController_jumpset_exit:

cmp dword ptr [PlayerAnimationController_chargeset_enable], #0
je PlayerAnimationController_chargeset_exit
mov [edi+1f4], #9999999
PlayerAnimationController_chargeset_exit:

mov ebx, [PlayerAnimationController_temp1]
mov ecx, [PlayerAnimationController_temp2]


PlayerAnimationController_originalcode:
db D9 EE D9 5D EC
//fldz
//fstp dword ptr [ebp-14]

PlayerAnimationController_exit:
jmp PlayerAnimationController_returnhere


PlayerAnimationController_searchedAOB:
PlayerAnimationController_savedAOB:
jmp PlayerAnimationController_newmem
PlayerAnimationController_returnhere:


[DISABLE]
PlayerAnimationController_savedAOB:
db D9 EE D9 5D EC
//fldz
//fstp dword ptr [ebp-14]

unregistersymbol(PlayerAnimationController_savedAOB)

dealloc(PlayerAnimationController_newmem)
dealloc(PlayerAnimationController_temp1)
dealloc(PlayerAnimationController_temp2)"""

