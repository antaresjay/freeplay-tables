[[cheat]]
id = "persistentdata-base-address-scan-initialization-activate-this-first"
name = "PersistentData Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PersistentData_basepointer)
registersymbol(PersistentData_update_enable)
registersymbol(PersistentData_set_enable)
registersymbol(PersistentData_existencepointsset_enable)
registersymbol(PersistentData_skillpointsset_enable)

alloc(PersistentData_basepointer, 4)
alloc(PersistentData_update_enable, 4)
alloc(PersistentData_set_enable, 4)
alloc(PersistentData_existencepointsset_enable, 4)
alloc(PersistentData_skillpointsset_enable, 4)


[DISABLE]
unregistersymbol(PersistentData_basepointer)
unregistersymbol(PersistentData_update_enable)
unregistersymbol(PersistentData_set_enable)
unregistersymbol(PersistentData_existencepointsset_enable)
unregistersymbol(PersistentData_skillpointsset_enable)

dealloc(PersistentData_basepointer)
dealloc(PersistentData_update_enable)
dealloc(PersistentData_set_enable)
dealloc(PersistentData_existencepointsset_enable)
dealloc(PersistentData_skillpointsset_enable)"""

[[cheat]]
id = "persistentdata-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PersistentData Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PersistentData_savedAOB)
label(PersistentData_returnhere)
label(PersistentData_originalcode)
label(PersistentData_exit)

label(PersistentData_update_exit)
label(PersistentData_set_exit)
label(PersistentData_existencepointsset_exit)
label(PersistentData_skillpointsset_exit)

registersymbol(PersistentData_savedAOB)

//15ECE53B - 83 EC 08              - sub esp,08
//15ECE53E - 8B 45 08              - mov eax,[ebp+08]
// PersistentData:Update+9
//15ECE541 - 0FB6 80 F8000000      - movzx eax,byte ptr [eax+000000F8]
//15ECE548 - 85 C0                 - test eax,eax
//15ECE54A - 74 29                 - je 15ECE575
//15ECE54C - E8 3F000000           - call 15ECE590
//15ECE551 - 8B 45 08              - mov eax,[ebp+08]
aobscan(PersistentData_searchedAOB, 0F B6 80 F8 00 00 00 85 C0 74 29)

alloc(PersistentData_newmem, 2048, PersistentData_searchedAOB)


PersistentData_newmem:
cmp dword ptr [PersistentData_update_enable], #0
je PersistentData_update_exit
mov [PersistentData_basepointer], eax
PersistentData_update_exit:

cmp dword ptr [PersistentData_set_enable], #0
je PersistentData_set_exit
PersistentData_set_exit:

cmp dword ptr [PersistentData_existencepointsset_enable], #0
je PersistentData_existencepointsset_exit
mov [eax+174], #9999999
PersistentData_existencepointsset_exit:

cmp dword ptr [PersistentData_skillpointsset_enable], #0
je PersistentData_skillpointsset_exit
mov [eax+bc], #9999999
mov [eax+c0], #9999999
PersistentData_skillpointsset_exit:


PersistentData_originalcode:
db 0F B6 80 F8 00 00 00
//movzx eax,byte ptr [eax+000000F8]


PersistentData_exit:
jmp PersistentData_returnhere


PersistentData_searchedAOB:
PersistentData_savedAOB:
jmp PersistentData_newmem
nop
nop
PersistentData_returnhere:


[DISABLE]
PersistentData_savedAOB:
db 0F B6 80 F8 00 00 00
//movzx eax,byte ptr [eax+000000F8]

unregistersymbol(PersistentData_savedAOB)

dealloc(PersistentData_newmem)"""

