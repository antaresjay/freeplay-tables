[[cheat]]
id = "kingdom-rush-origins-aob-script"
name = "Kingdom Rush Origins AOB script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game   : Kingdom Rush Origins.exe
// Version:
// Date   :
// Author : Cs
[ENABLE]
aobscanmodule(aobLuaVarReader,lua51.dll,8B 29 8B 49 04 89 2C)

alloc(newmemLuaVarReader,4096,aobLuaVarReader)

label(aobLuaVarReader_r)
label(aobLuaVarReader_i)
registersymbol(aobLuaVarReader_r)
registersymbol(aobLuaVarReader_i)

label(lblLuaVarReader)
label(lblLuaVarReaderSkipStars)
label(lblLuaVarReaderCheckStarsSpent)
label(lblLuaVarReaderSkipStarsSpent)
label(lblLuaVarReaderSkipGold)
label(lblLuaVarReaderSkipLives)
label(lblLuaVarReaderSkip)
label(lblLuaVarReaderRet)

label(bEnableHackStars)
label(iMinTotalStars)
label(bEnableMinGold)
label(iMinGold)
label(bEnableMinLives)
label(iMinLives)
registersymbol(bEnableHackStars)
registersymbol(iMinTotalStars)
registersymbol(bEnableMinGold)
registersymbol(iMinGold)
registersymbol(bEnableMinLives)
registersymbol(iMinLives)

newmemLuaVarReader:
bEnableHackStars:
dd 1
iMinTotalStars:
dd (int)75
bEnableMinGold:
dd 1
iMinGold:
dd (int)9999
bEnableMinLives:
dd 1
iMinLives:
dd (int)5

lblLuaVarReader:
push ebx
mov ebx,[ecx+08]
test ebx,ebx
jz lblLuaVarReaderSkip

cmp dword ptr [bEnableMinGold],1
jne short lblLuaVarReaderSkipGold
cmp dword ptr [ebx+0c],(int)11
jne short lblLuaVarReaderSkipGold
cmp dword ptr [ebx+17],'gold'
jne short lblLuaVarReaderSkipGold
fld qword ptr [ecx]
fild dword ptr [iMinGold]
fcomip st(0),st(1)
fstp st(0)
jp lblLuaVarReaderSkipGold
jb lblLuaVarReaderSkipGold
fild dword ptr [iMinGold]
fstp qword ptr [ecx]
lblLuaVarReaderSkipGold:

cmp dword ptr [bEnableHackStars],1
jne short lblLuaVarReaderSkipStars
cmp dword ptr [ebx+0c],(int)11
jne short lblLuaVarReaderSkipStars
cmp dword ptr [ebx+16],'star'
jne short lblLuaVarReaderSkipStars
cmp dword ptr [ebx+10],'tota'
jne lblLuaVarReaderCheckStarsSpent
fld qword ptr [ecx]
fild dword ptr [iMinTotalStars]
fcomip st(0),st(1)
fstp st(0)
jp lblLuaVarReaderSkipStars
jb lblLuaVarReaderSkipStars
fild dword ptr [iMinTotalStars]
fstp qword ptr [ecx]
lblLuaVarReaderSkipStars:

cmp dword ptr [bEnableMinLives],1
jne short lblLuaVarReaderSkipLives
cmp dword ptr [ebx+0c],(int)5
jne short lblLuaVarReaderSkipLives
cmp dword ptr [ebx+11],'ives'
jne short lblLuaVarReaderSkipLives
fld qword ptr [ecx]
fild dword ptr [iMinLives]
fcomip st(0),st(1)
fstp st(0)
jp lblLuaVarReaderSkipLives
jb lblLuaVarReaderSkipLives
fild dword ptr [iMinLives]
fstp qword ptr [ecx]
lblLuaVarReaderSkipLives:

lblLuaVarReaderSkip:
pop ebx
readmem(aobLuaVarReader,5)
jmp lblLuaVarReaderRet
aobLuaVarReader_i:
readmem(aobLuaVarReader,5)

lblLuaVarReaderCheckStarsSpent:
cmp dword ptr [ebx+10],'spen'
jne short lblLuaVarReaderSkipStarsSpent
mov dword ptr [ecx],0
mov dword ptr [ecx+04],0
lblLuaVarReaderSkipStarsSpent:
jmp lblLuaVarReaderSkipStars

aobLuaVarReader:
aobLuaVarReader_r:
jmp lblLuaVarReader
lblLuaVarReaderRet:

[DISABLE]
aobLuaVarReader_r:
readmem(aobLuaVarReader_i,5)

unregistersymbol(aobLuaVarReader_r)
unregistersymbol(aobLuaVarReader_i)

unregistersymbol(bEnableHackStars)
unregistersymbol(iMinTotalStars)
unregistersymbol(bEnableMinGold)
unregistersymbol(iMinGold)
unregistersymbol(bEnableMinLives)
unregistersymbol(iMinLives)

dealloc(newmemLuaVarReader)"""

