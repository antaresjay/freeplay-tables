[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048,"HE2_PC.exe"+158C79) 
label(returnhere)
label(originalcode)
label(exit)
alloc(wupindizhi,4)
registersymbol(wupindizhi)

newmem:

originalcode:
mov [wupindizhi],r8
mov rax,[r8+28]
lea r15,[rax+rdx*8]

exit:
jmp returnhere

"HE2_PC.exe"+158C79:
jmp newmem
nop 3
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
dealloc(wupindizhi)
unregistersymbol(wupindizhi)

"HE2_PC.exe"+158C79:
db 49 8B 40 28 4C 8D 3C D0
//mov rax,[r8+28]
//lea r15,[rax+rdx*8]"""

