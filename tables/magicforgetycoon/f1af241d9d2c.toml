[[cheat]]
id = "get-player-data"
name = "Get Player Data"
category = "player"
description = ""
hint = ""
type = "script"
source = """
define(address,CTS.MFT.PlayerData:get_TotalTimePlayed)
define(bytes,55 48 8B EC 48 83 EC 70)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,CTS.MFT.PlayerData:get_TotalTimePlayed)
label(code return getPlayerData)
registersymbol(getPlayerData)

newmem:
mov [getPlayerData],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,70
  jmp return

getPlayerData:
dq 0

address:
  jmp newmem
  nop 3
return:

[DISABLE]

address:
  db bytes

  unregistersymbol(*)
  dealloc(*)"""
