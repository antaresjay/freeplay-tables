[[cheat]]
id = "health-shield-pointers"
name = "Health/Shield Pointers"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : CrimsonEarth.exe
  Version: 1.0.0.124
  Date   : 2017-06-11
  Author : Squall8
}

[ENABLE]

aobscan(health,F3 0F 11 6E 54 E9)
alloc(newmem,$1000)

label(code)
label(return)
label(healthp)

newmem:
  mov [healthp],rsi

code:
  movss [rsi+54],xmm5
  jmp return

healthp:
  dq 0

health:
  jmp newmem
return:
registersymbol(health)
registersymbol(healthp)

[DISABLE]

health:
  db F3 0F 11 6E 54

unregistersymbol(health)
unregistersymbol(healthp)
dealloc(newmem)"""

