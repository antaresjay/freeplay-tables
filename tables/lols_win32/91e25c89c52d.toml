[[cheat]]
id = "character-creation-stats-base-address-scan-initialization-activate-this-first"
name = "Character Creation Stats Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(creationstats_basepointer)
registersymbol(creationstats_update_enable)

//LoLS_win32.exe+107DBD - BF 01000000           - mov edi,00000001
//LoLS_win32.exe+107DC2 - B9 F17C3700           - mov ecx,LoLS_win32.exe+1D7CF1
// Accesses STR
//LoLS_win32.exe+107DC7 - 8A 46 0E              - mov al,[esi+0E]
//LoLS_win32.exe+107DCA - 3A 41 FF              - cmp al,[ecx-01]
//LoLS_win32.exe+107DCD - 72 49                 - jb LoLS_win32.exe+107E18
//LoLS_win32.exe+107DCF - 8A 46 0F              - mov al,[esi+0F]
//LoLS_win32.exe+107DD2 - 3A 01                 - cmp al,[ecx]
aobscan(creationstats_initialization_searchedAOB, 8A 46 0E 3A 41 FF 72 49)

alloc(creationstats_basepointer, 4, creationstats_initialization_searchedAOB)
alloc(creationstats_update_enable, 4, creationstats_initialization_searchedAOB)


[DISABLE]
unregistersymbol(creationstats_basepointer)
unregistersymbol(creationstats_update_enable)

dealloc(creationstats_basepointer)
dealloc(creationstats_update_enable)"""

[[cheat]]
id = "character-creation-stats-base-address-scan-to-update-view-assign-bonus-points"
name = "Character Creation Stats Base Address Scan (To Update: View Assign Bonus Points)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(creationstats_savedAOB)
label(creationstats_returnhere)
label(creationstats_originalcode)
label(creationstats_exit)

label(creationstats_update_exit)

registersymbol(creationstats_originalcode)
registersymbol(creationstats_savedAOB)

//LoLS_win32.exe+107DBD - BF 01000000           - mov edi,00000001
//LoLS_win32.exe+107DC2 - B9 F17C3700           - mov ecx,LoLS_win32.exe+1D7CF1
// Accesses STR
//LoLS_win32.exe+107DC7 - 8A 46 0E              - mov al,[esi+0E]
//LoLS_win32.exe+107DCA - 3A 41 FF              - cmp al,[ecx-01]
//LoLS_win32.exe+107DCD - 72 49                 - jb LoLS_win32.exe+107E18
//LoLS_win32.exe+107DCF - 8A 46 0F              - mov al,[esi+0F]
//LoLS_win32.exe+107DD2 - 3A 01                 - cmp al,[ecx]
aobscan(creationstats_searchedAOB, 8A 46 0E 3A 41 FF 72 49)

alloc(creationstats_newmem, 2048, creationstats_searchedAOB)
alloc(creationstats_temp1, 4, creationstats_searchedAOB)
alloc(creationstats_temp2, 4, creationstats_searchedAOB)
alloc(creationstats_temp3, 4, creationstats_searchedAOB)
alloc(creationstats_temp4, 4, creationstats_searchedAOB)
alloc(creationstats_temp5, 4, creationstats_searchedAOB)


creationstats_newmem:
mov [creationstats_temp1], eax
mov [creationstats_temp2], ebx
mov [creationstats_temp3], ecx
mov [creationstats_temp4], edx

cmp dword ptr [creationstats_update_enable], #0
je creationstats_update_exit
mov [creationstats_basepointer], esi
creationstats_update_exit:

mov eax, [creationstats_temp1]
mov ebx, [creationstats_temp2]
mov ecx, [creationstats_temp3]
mov edx, [creationstats_temp4]


creationstats_originalcode:
readmem(creationstats_searchedAOB, 6)


creationstats_exit:
jmp creationstats_returnhere


creationstats_searchedAOB:
creationstats_savedAOB:
jmp creationstats_newmem
nop
creationstats_returnhere:


[DISABLE]
creationstats_savedAOB:
readmem(creationstats_originalcode, 6)

unregistersymbol(creationstats_originalcode)
unregistersymbol(creationstats_savedAOB)

dealloc(creationstats_newmem)
dealloc(creationstats_temp1)
dealloc(creationstats_temp2)
dealloc(creationstats_temp3)
dealloc(creationstats_temp4)
dealloc(creationstats_temp5)"""

