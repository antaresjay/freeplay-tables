[[cheat]]
id = "party-stats-base-address-scan-initialization-activate-this-first"
name = "Party Stats Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(partystats_basepointer)
registersymbol(partystats_update_enable)
registersymbol(partystats_buffsset_enable)

//LoLS_win32.exe+12C7C5 - 89 44 24 1C           - mov [esp+1C],eax
//LoLS_win32.exe+12C7C9 - 8B F8                 - mov edi,eax
// Accesses Direction
//LoLS_win32.exe+12C7CB - 0FB6 77 37            - movzx esi,byte ptr [edi+37]
//LoLS_win32.exe+12C7CF - 83 E6 0F              - and esi,0F
//LoLS_win32.exe+12C7D2 - 89 4C 24 14           - mov [esp+14],ecx
//LoLS_win32.exe+12C7D6 - 89 4C 24 18           - mov [esp+18],ecx
//LoLS_win32.exe+12C7DA - 89 4C 24 20           - mov [esp+20],ecx
aobscan(partystats_initialization_searchedAOB, 0F B6 77 37 83 E6 0F 89 4C 24 14)

alloc(partystats_basepointer, 4, partystats_initialization_searchedAOB)
alloc(partystats_update_enable, 4, partystats_initialization_searchedAOB)
alloc(partystats_buffsset_enable, 4, partystats_initialization_searchedAOB)


[DISABLE]
unregistersymbol(partystats_basepointer)
unregistersymbol(partystats_update_enable)
unregistersymbol(partystats_buffsset_enable)

dealloc(partystats_basepointer)
dealloc(partystats_update_enable)
dealloc(partystats_buffsset_enable)"""

[[cheat]]
id = "party-stats-base-address-scan-to-update-play-level"
name = "Party Stats Base Address Scan (To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(partystats_savedAOB)
label(partystats_returnhere)
label(partystats_originalcode)
label(partystats_exit)

label(partystats_update_exit)
label(partystats_buffsset_exit)

registersymbol(partystats_originalcode)
registersymbol(partystats_savedAOB)

//LoLS_win32.exe+12C7C5 - 89 44 24 1C           - mov [esp+1C],eax
//LoLS_win32.exe+12C7C9 - 8B F8                 - mov edi,eax
// Accesses Direction
//LoLS_win32.exe+12C7CB - 0FB6 77 37            - movzx esi,byte ptr [edi+37]
//LoLS_win32.exe+12C7CF - 83 E6 0F              - and esi,0F
//LoLS_win32.exe+12C7D2 - 89 4C 24 14           - mov [esp+14],ecx
//LoLS_win32.exe+12C7D6 - 89 4C 24 18           - mov [esp+18],ecx
//LoLS_win32.exe+12C7DA - 89 4C 24 20           - mov [esp+20],ecx
aobscan(partystats_searchedAOB, 0F B6 77 37 83 E6 0F 89 4C 24 14)

alloc(partystats_newmem, 2048, partystats_searchedAOB)
alloc(partystats_temp1, 4, partystats_searchedAOB)
alloc(partystats_temp2, 4, partystats_searchedAOB)
alloc(partystats_temp3, 4, partystats_searchedAOB)
alloc(partystats_temp4, 4, partystats_searchedAOB)
alloc(partystats_temp5, 4, partystats_searchedAOB)


partystats_newmem:
mov [partystats_temp1], eax
mov [partystats_temp2], ebx
mov [partystats_temp3], ecx
mov [partystats_temp4], edx

cmp dword ptr [partystats_update_enable], #0
je partystats_update_exit
mov [partystats_basepointer], edi
partystats_update_exit:

cmp dword ptr [partystats_buffsset_enable], #0
je partystats_buffsset_exit
mov byte ptr [edi+33], #255
mov bl, byte ptr [edi+3e]
or bl, #207
mov byte ptr [edi+3e], bl
mov byte ptr [edi+40], #255
mov byte ptr [edi+41], #255
partystats_buffsset_exit:

mov eax, [partystats_temp1]
mov ebx, [partystats_temp2]
mov ecx, [partystats_temp3]
mov edx, [partystats_temp4]


partystats_originalcode:
readmem(partystats_searchedAOB, 7)


partystats_exit:
jmp partystats_returnhere


partystats_searchedAOB:
partystats_savedAOB:
jmp partystats_newmem
nop
nop
partystats_returnhere:


[DISABLE]
partystats_savedAOB:
readmem(partystats_originalcode, 7)

unregistersymbol(partystats_originalcode)
unregistersymbol(partystats_savedAOB)

dealloc(partystats_newmem)
dealloc(partystats_temp1)
dealloc(partystats_temp2)
dealloc(partystats_temp3)
dealloc(partystats_temp4)
dealloc(partystats_temp5)"""

