type = "script"
source = """
{ Game   : FAG-Win64-Shipping.exe
  Version: 
  Date   :
  Author :

}

[ENABLE]

aobscanmodule(INJECT,FAG-Win64-Shipping.exe,4C 8B 0F 4C 8B C6 48 8B D0 48 8B CF 48 8B 5C 24 30) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(shieldcd)




label(duckyduck)
registersymbol(duckyduck)

label(healthBuggy)
registersymbol(healthBuggy)

label(shieldz)
registersymbol(shieldz)


newmem:
  push r12
  push r11
  push r10

  mov [duckyduck], rdi

  mov r12, rdi
  test r12,r12
  je code

  mov r10, rdi
  test r10,r10
  je code

  mov r11, rdi
  test r11,r11
  je code

  cmp dword ptr [healthBuggy], 1
  jne shieldcd

  mov [r12+60C], #99999999999

shieldcd:
  cmp dword ptr [shieldz], 1
  jne code
  mov [r12+61C], #99999999999
code:
  pop r10
  pop r11
  pop r12

  mov r9,[rdi]
  mov r8,rsi
  mov rdx,rax
  mov rcx,rdi
  mov rbx,[rsp+30]
  jmp return

duckyduck:
dq 0

healthBuggy:
dd 0

shieldz:
dd 0


INJECT:
  jmp far newmem
  nop 3

return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 4C 8B 0F 4C 8B C6 48 8B D0 48 8B CF 48 8B 5C 24 30

unregistersymbol(INJECT)
unregistersymbol(duckyduck)
unregistersymbol(healthBuggy)
unregistersymbol(shieldz)
dealloc(newmem)"""

