[[cheat]]
id = "mod-controller-requires-mod-dll"
name = "Mod. Controller (Requires Mod. DLL)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Monster Sanctuary.exe
  Version: 
  Date   : 2020-04-14
  Author : cfe

  This script does blah blah blah
}

[ENABLE]

aobscanregion(aobCheatMenuUpdate,CheatMenu:Update,CheatMenu:Update+200,BA E7 03 00 00 48 8D) // should be unique
alloc(newmem,$1000,aobCheatMenuUpdate)

label(code)
label(return)
label(iItemID)
registersymbol(iItemID)

newmem:

code:
  mov edx,[iItemID]
  jmp return

iItemID:
dd 0
aobCheatMenuUpdate:
  jmp newmem
return:
registersymbol(aobCheatMenuUpdate)

//

aobscanregion(aobAddMonster,CheatMenu:AddMonsters,CheatMenu:AddMonsters+50,41 B8 01 00 00 00 83) // should be unique
alloc(newmem2,$1000,aobAddMonster)

label(code2)
label(return2)
label(dMonsterID)
label(dMonsterLevel)
registersymbol(dMonsterID)
registersymbol(dMonsterLevel)

newmem2:

code2:
  mov edx,[dMonsterID]
  mov r8d,[dMonsterLevel]
  jmp return2
dMonsterID:
dd 0
dMonsterLevel:
dd 1
aobAddMonster:
  jmp newmem2
  nop
return2:
registersymbol(aobAddMonster)

[DISABLE]

aobCheatMenuUpdate:
  db BA E7 03 00 00

unregistersymbol(aobCheatMenuUpdate)
dealloc(newmem)
aobAddMonster:
  db 41 B8 01 00 00 00

unregistersymbol(aobAddMonster)
dealloc(newmem2)"""

