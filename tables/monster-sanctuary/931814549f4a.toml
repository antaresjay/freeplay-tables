define(bytes,48 83 EC 08 48 83 C4 08)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,SkillManager:Update)
aobscanregion(activate,SkillResetter:Use,SkillResetter:Use+5,55)

label(code)
label(return)
label(activ)
newmem:

code:
  sub rsp,08
  add rsp,08

  mov rcx,[mBase+8]
  sub rsp,20
  mov r11,"SkillResetter:Use"
  cmp [activ],0
  je @f
  call r11
  @@:
  add rsp,20
  jmp return
