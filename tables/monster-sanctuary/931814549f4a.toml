[[cheat]]
id = "inf-health-in-fights"
name = "Inf. Health In Fights"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Monster Sanctuary.exe
  Version: 
  Date   : 2019-12-15
  Author : cfe

  This script does blah blah blah
}

[ENABLE]

aobscanregion(aobmonohealth,Monster:ModifyHealth,Monster:ModifyHealth+100,89 87 ** ** ** ** 48) // should be unique
alloc(newmem,$1000,aobmonohealth)

alloc(origModifyHealth,6)
registersymbol(origModifyHealth)

origModifyHealth:
readmem(aobmonohealth,6)

getmonostruct(Monster)
registersymbol(Monster.<BelongsToPlayer>k__BackingField)
registersymbol(Monster.<CurrentHealth>k__BackingField)

label(code)
label(return)

newmem:

code:
  push rax
  xor rax,rax
  mov eax,Monster.<BelongsToPlayer>k__BackingField
  cmp byte ptr [rdi+rax],1
  pop rax
  je return
  readmem(aobmonohealth,6)
  jmp return

aobmonohealth:
  jmp newmem
  nop
return:
registersymbol(aobmonohealth)

[DISABLE]

aobmonohealth:
  readmem(origModifyHealth,6)

unregistersymbol(aobmonohealth)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: 2B0BEE7606B

2B0BEE7604B: 00 00                          -  add [rax],al
2B0BEE7604D: 00 00                          -  add [rax],al
2B0BEE7604F: 00 48 83                       -  add [rax-7D],cl
2B0BEE76052: EC                             -  in al,dx
2B0BEE76053: 18 48 89                       -  sbb [rax-77],cl
2B0BEE76056: 3C 24                          -  cmp al,24
2B0BEE76058: 48 8B F9                       -  mov rdi,rcx
2B0BEE7605B: 48 89 54 24 08                 -  mov [rsp+08],rdx
2B0BEE76060: 48 63 87 8C 01 00 00           -  movsxd  rax,dword ptr [rdi+0000018C]
2B0BEE76067: 03 44 24 08                    -  add eax,[rsp+08]
// ---------- INJECTING HERE ----------
2B0BEE7606B: 89 87 8C 01 00 00              -  mov [rdi+0000018C],eax
// ---------- DONE INJECTING  ----------
2B0BEE76071: 48 85 FF                       -  test rdi,rdi
2B0BEE76074: 0F 84 56 00 00 00              -  je 2B0BEE760D0
2B0BEE7607A: 48 63 8F E4 01 00 00           -  movsxd  rcx,dword ptr [rdi+000001E4]
2B0BEE76081: 3B C1                          -  cmp eax,ecx
2B0BEE76083: 7E 16                          -  jle 2B0BEE7609B
2B0BEE76085: 48 85 FF                       -  test rdi,rdi
2B0BEE76088: 0F 84 2B 00 00 00              -  je 2B0BEE760B9
2B0BEE7608E: 48 63 87 E4 01 00 00           -  movsxd  rax,dword ptr [rdi+000001E4]
2B0BEE76095: 89 87 8C 01 00 00              -  mov [rdi+0000018C],eax
2B0BEE7609B: 48 63 87 8C 01 00 00           -  movsxd  rax,dword ptr [rdi+0000018C]
}"""

