[[cheat]]
id = "god-mode"
name = "God Mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,PlayerHealth:Update)
define(bytes,55 48 8B EC 48 81 EC 90 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,PlayerHealth:Update)
label(code return)

newmem:
mov [rcx+C0],1 //ignoreDamage
mov [rcx+DC],0 //canTakeDamage
mov [rcx+115],1 //godModeEnabled
