id = "never-get-shot"
name = "Never Get Shot"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[Enable]

//Never Get Shot
alloc(ngs_1,32,BEGame.exe)
aobscanmodule(ngs_aob1,BEGame.exe,F3 0F 5C 44 24 60 F3 0F 11 07)
registersymbol(ngs_aob1)
label(returnhere_ngs_1)

label(notTime)

//--------------------------------------------------//
ngs_1:
cmp [rdi+4],(float)1
jne notTime
jmp returnhere_ngs_1
//--------------------------------------------------//
notTime:
subss xmm0,[rsp+60]
jmp returnhere_ngs_1
//--------------------------------------------------//

ngs_aob1:
jmp ngs_1
nop
returnhere_ngs_1:

[Disable]

ngs_aob1:
db F3 0F 5C 44 24 60
unregistersymbol(ngs_aob1)
dealloc(ngs_1)"""

