[[cheat]]
id = "grab-hero-data"
name = "Grab Hero Data"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@FearlessRevolution|Sintrix
define(address,Hero:FrameUpdate+17)
define(bytes,48 8B F1 48 8D 6D 00)

[ENABLE]


assert(address,bytes)
alloc(newmem,$1000,Hero:FrameUpdate+17)
registersymbol(hero)
label(code return hero)

newmem:
mov [hero],rcx

code:
  mov rsi,rcx
  lea rbp,[rbp+00]
  jmp return

hero:
dq 0

address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  db bytes


unregistersymbol(*)
dealloc(*)"""

