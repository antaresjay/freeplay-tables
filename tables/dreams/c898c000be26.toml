[[cheat]]
id = "max-health"
name = "Max Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[enable]
ijmscripts+0:
sub rsp,28
push rcx
push r15
mov r15,ptr_Hero
mov r15,[r15]
test r15,r15
je @f
mov r15,[r15+$HeroC.Status]
test r15,r15
je @f
mov rcx,r15
movss xmm1,[r15+$EntityStatusC.maxHealth]
mov r11,"EntityStatus:SetHealth"
call r11
@@:
pop r15
pop rcx
add rsp,28
ret

[disable]
ijmscripts+0:
ret"""

