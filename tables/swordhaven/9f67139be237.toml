[[cheat]]
id = "disabled-weight"
name = "Disabled Weight"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Swordhaven.exe
  Version:
  Date   : 2024-12-20
  Author : BabyGroot

  This script does blah blah blah
}

define(address,Inventory:TotalWeight+33)
define(bytes,89 47 30 C6 47 34 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Inventory:TotalWeight+33)

label(code)
label(return)

label(pBase_TotalWeight)
registersymbol(pBase_TotalWeight)

newmem:

code:
  mov eax,[pBase_TotalWeight]
  mov [rdi+30],eax
  mov byte ptr [rdi+34],00
  jmp return

pBase_TotalWeight:
dd 0

address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  db bytes
  // mov [rdi+30],eax
  // mov byte ptr [rdi+34],00

dealloc(newmem)
unregistersymbol(pBase_TotalWeight)"""

