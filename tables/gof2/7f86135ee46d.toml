[[cheat]]
id = "perfect-mining"
name = "Perfect Mining"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(MyCode,2048)
label(_DRILL_W)
label(_BackDRILL_W)
label(_ExitDRILL_W)
label(_DRILL_H)
label(_BackDRILL_H)
label(_ExitDRILL_H)

MyCode:

_DRILL_W:
 fadd dword ptr [edi+10]
 fstp dword ptr [edi+10]
 {========================================
  value = Game Screen Width / 2
  e.g.) Resolution : 1600 x 900
        1600 / 2 = 800.0
 ========================================}
 mov [edi+10],(float)800.0 //EDIT ME!

_ExitDRILL_W:
 jmp _BackDRILL_W

_DRILL_H:
 fadd dword ptr [edi+14]
 fstp dword ptr [edi+14]
 {========================================
  value = (Game Screen Height / 2) + 15
  e.g.) Resolution : 1600 x 900
        900 / 2 + 15 = 465.0
 ========================================}
 mov [edi+14],(float)465.0 //EDIT ME!

_ExitDRILL_H:
 jmp _BackDRILL_H

"GoF2.exe"+97EFC:
 jmp _DRILL_W
 nop
_BackDRILL_W:

"GoF2.exe"+97F14:
 jmp _DRILL_H
 nop
_BackDRILL_H:

[DISABLE]
dealloc(MyCode)
"GoF2.exe"+97EFC:
 db D8 47 10 D9 5F 10
"GoF2.exe"+97F14:
 db D8 47 14 D9 5F 14"""

