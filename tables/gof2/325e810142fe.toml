[[cheat]]
id = "readme"
name = "=====>>>>> README <<<<<====="
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
 Click the '=====>>>>> CHEATS <<<<<=====' box to expand the cheats

 Keyboard:
     SHIFT->FAST makes you go 4x max speed
     SHIFT->No Inventory Change (Shop) - Hold shift while buying/selling
     SHIFT->No Inventory Change (Blueprint) - Hold shift while creating blueprint
     CTRL->Crosshair ship loves you, ALT->Heal constant as ships under crosshairs
 Fast On Autopilot - Just what it says, 4x boost to waypoints, station, jump gates
 Everybody likes me! - Enter Status screen to reset faction like/dislike
 Abuse them all you want - Yellow ships don't get mad by damage (still mad at EMP)
 Cargo: 100k - Who doesn't want more space?
 Health: 10k ship, armor, shields - set when leaving station
 Computer Drilling - drill bit always centered
 Missiles, Missiles, Missiles! - 250ms load time, special damage (see script)
 Lasers, Lasers, Lasers! - 200ms fire delay, tear them up!
 Cloak Charging - Instant cloak when you need it
 One Hit Kill And God:
     God - Player doesn't take damage
     GodFriends - Green ships don't take damage
     OneHitKill - Red ships die after any damage (player or not)


The rest are for if you are interested in writing your own table or cheats:

Find Pointers:
    Investigate Lock - script I used to find the pointers for targetting ships
        and asteroids

Experimental: - actually just trash items I was working with for testing

----->Misc<-----: Just some things I found debugging injection points

----->Known Statics<-----: Static pointers I know and might be useful
    Scan Structure-Locked Ship-ShipHealth - locked ship ShipHealth pointer,
        use in structure dissector if you want to investigate more

FIND: Don't remember, can use to put addresses you're investigating to keep the table uncluttered

Statics: Some various statics I found and chains I can see when looking at a
    pointer to maybe see more easily where it came from

Finding Statics: Script that should do an AOB scan through code and find the
    current address of the static that is at GoF2.exe+20AD6C in version 1.0.3.
    It sets the user-defined symbol STATIC_20AD6C to point to the address where
    the actual value can be found in code.  You can use it to reset
    the statics if the game code changes in a newer version.
}
[ENABLE]
[DISABLE]"""

