id = "high-k-o"
name = "High K.O "
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(aob_KOs,OPPW4.exe,41 8B 94 00 4C 04 00 00)
registersymbol(aob_KOs)
alloc(newmem_KOs,1024,OPPW4.exe)
