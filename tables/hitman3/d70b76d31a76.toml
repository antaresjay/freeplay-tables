[[cheat]]
id = "inifnite-ammo"
name = "Inifnite ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048,"hitman3.exe"+7B70E9) 
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
add edi,ebx

originalcode:
add r8d,edi
mov [rbp-20],r8d

exit:
jmp returnhere

"hitman3.exe"+7B70E9:
jmp newmem
nop 2
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
"hitman3.exe"+7B70E9:
db 44 03 C7 44 89 45 E0
//add r8d,edi
//mov [rbp-20],r8d"""

