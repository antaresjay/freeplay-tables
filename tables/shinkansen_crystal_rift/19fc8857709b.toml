[[cheat]]
id = "gamestate-base-address-scan-to-activate-play-level-to-update-play-level"
name = "GameState Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameState_savedAOB)
label(GameState_returnhere)
label(GameState_originalcode)
label(GameState_exit)

label(GameState_update_exit)
label(GameState_set_exit)
label(GameState_lifesset_exit)
label(GameState_swordset_exit)

registersymbol(GameState_savedAOB)

//1925DE97 - 0F85 54000000         - jne 1925DEF1
//1925DE9D - B8 B4FEDA02           - mov eax,02DAFEB4 : [(float)1066.0000]
// <updatePlayedTime>c__IteratorD:MoveNext+52
//1925DEA2 - F3 0F10 00            - movss xmm0,[rax]
//1925DEA6 - F3 0F5A C0            - cvtss2sd xmm0,xmm0
//1925DEAA - F3 0F10 0D CE000000   - movss xmm1,[1925DF80] : [(float)1.0000]
//1925DEB2 - F3 0F5A C9            - cvtss2sd xmm1,xmm1
//1925DEB6 - F2 0F58 C1            - addsd xmm0,xmm1
//1925DEBA - B8 B4FEDA02           - mov eax,02DAFEB4 : [(float)1066.0000]
//1925DEBF - F2 0F5A E8            - cvtsd2ss xmm5,xmm0
aobscan(GameState_searchedAOB, F3 0F 10 00 F3 0F 5A C0 * * * * * * * * F3 0F 5A C9 F2 0F 58 C1)

alloc(GameState_newmem, 2048, GameState_searchedAOB)
alloc(GameState_temp1, 8, GameState_searchedAOB)
alloc(GameState_temp2, 8, GameState_searchedAOB)


GameState_newmem:
mov [GameState_temp1], rbx
mov [GameState_temp2], rdx

movsxd rbx, [GameState_savedAOB-4]
sub rbx, 54

cmp dword ptr [GameState_update_enable], #0
je GameState_update_exit
mov [GameState_basepointer], rbx
GameState_update_exit:

cmp dword ptr [GameState_set_enable], #0
je GameState_set_exit
GameState_set_exit:

cmp dword ptr [GameState_lifesset_enable], #0
je GameState_lifesset_exit
mov edx, [rbx+84]
mov [rbx+80], edx
GameState_lifesset_exit:

cmp dword ptr [GameState_swordset_enable], #0
je GameState_swordset_exit
cmp qword ptr [rbx+70], #0
je GameState_swordset_exit
cmp dword ptr [rbx+70], #0
je GameState_swordset_exit
mov rdx, [rbx+70]
mov [rdx+20], #1
mov [rdx+21], #1
mov [rdx+22], #1
mov [rdx+23], #1
mov [rdx+24], #1
mov [rdx+25], #1
mov [rdx+26], #1
GameState_swordset_exit:

mov rbx, [GameState_temp1]
mov rdx, [GameState_temp2]


GameState_originalcode:
db F3 0F 10 00 F3 0F 5A C0
//movss xmm0,[rax]
//cvtss2sd xmm0,xmm0


GameState_exit:
jmp GameState_returnhere


GameState_searchedAOB:
GameState_savedAOB:
jmp GameState_newmem
nop
nop
nop
GameState_returnhere:


[DISABLE]
GameState_savedAOB:
db F3 0F 10 00 F3 0F 5A C0
//movss xmm0,[rax]
//cvtss2sd xmm0,xmm0

unregistersymbol(GameState_savedAOB)

dealloc(GameState_newmem)
dealloc(GameState_temp1)
dealloc(GameState_temp2)"""

