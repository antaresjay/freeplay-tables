[[cheat]]
id = "god-mode-1-hit-kills"
name = "God Mode & 1-hit kills"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048,"barony.exe"+293BED) 
label(returnhere)
label(originalcode)
label(nodie)
label(onehitkill)
label(fixhunger)
label(exit)
alloc(godMode,4,"barony.exe"+293BED)
alloc(oneHitKill,4,"barony.exe"+293BED)

godMode:
dd 1
registersymbol(godMode)

oneHitKill:
dd 0
registersymbol(oneHitKill)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here

cmp [rbx+510],(int)100  //Is a NPC?
je onehitkill //If so, go to oneHitKill check


//First failed attempt, this is race flag, no humans could die
//cmp [rbx],1  //Is a player?
//jne onehitkill //If not, go to oneHitKill check

cmp [godMode],1 //Check if god mode flag is on
jne originalcode //If it's off, pass along to original code

//mov ecx,[rbx+00000144] // old, set current health to max  health
cmp ecx,1  // is the end total less than or equal to 1?
jle nodie  // If it is, change it to 1 instead to prevent death
mov [rbx+00000140],ecx
cmp [rbx+00000178],(int)249
jle fixhunger
jmp exit

nodie:
mov ecx,1
mov [rbx+00000140],ecx
cmp [rbx+00000178],(int)249
jle fixhunger
jmp exit

onehitkill:
cmp [oneHitKill],1  // Check if oneHitKill option is selected in table
jne originalcode
mov ecx,0   //To make a 1-hit kill on non-players

originalcode:
mov [rbx+00000140],ecx
jmp exit

fixhunger:
//mov ecx,(int)249
mov [rbx+00000178],(int)249

exit:
jmp returnhere

"barony.exe"+293BED:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
dealloc(oneHitKill)
dealloc(godMode)

unregistersymbol(oneHitKill)
unregistersymbol(godMode)

"barony.exe"+293BED:
db 89 8B 40 01 00 00
//mov [rbx+00000140],ecx"""

