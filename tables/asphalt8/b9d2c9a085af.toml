[[cheat]]
id = "credits-hack-v4-4-0j"
name = "Credits Hack ( v4.4.0j )"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(Credits,Asphalt8.exe,8B CE F7 D1 89 15 ?? ?? ?? ??)
alloc(newmem,$1000)
globalalloc(lidl,4)
label(code)
label(return)
label(lidl)
newmem:
code:
  mov esi,[lidl]
  mov ecx,esi
  not ecx
  mov [Asphalt8.exe+1C06B70],edx
  jmp return
lidl:
  dd 989680
Credits:
  jmp newmem
  db 90 90 90 90 90
return:
registersymbol(Credits)
registersymbol(lidl)
[DISABLE]
Credits:
  mov ecx,esi
  not ecx
  mov [Asphalt8.exe+1C06B70],edx
unregistersymbol(Credits)
unregistersymbol(lidl)
dealloc(newmem)
dealloc(lidl)"""

