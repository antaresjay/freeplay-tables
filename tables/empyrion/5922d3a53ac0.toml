[[cheat]]
id = "instant-craft"
name = "Instant Craft"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(aobBP,EC F3 0F 10 46 58)
alloc(newmem,$100,aobBP)

label(code)
label(return)

newmem:
  mov dword ptr [rsi+58],(float)0
code:
  movss xmm0,[rsi+58]
  jmp return

aobBP+01:
  jmp newmem
return:
registersymbol(aobBP)

[DISABLE]

aobBP+01:
  db F3 0F 10 46 58

unregistersymbol(aobBP)
dealloc(newmem)"""

[[cheat]]
id = "cash-editor"
name = "Cash Editor"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(aobCredit,F2 0F 11 86 98 05 00 00)
alloc(newmem,$1000,CCF6DC6D)

label(code)
label(return)

alloc(Credit_ptr,8)
registersymbol(Credit_ptr)

newmem:

code:
  push rax
  lea rax,[rsi+598]
  mov [Credit_ptr],rax
  pop rax
  movsd [rsi+00000598],xmm0
  jmp return

aobCredit:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(aobCredit)

[DISABLE]

aobCredit:
  db F2 0F 11 86 98 05 00 00

unregistersymbol(aobCredit)
unregistersymbol(Credit_ptr)
dealloc(newmem)"""

