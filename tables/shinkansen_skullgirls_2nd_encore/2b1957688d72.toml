[[cheat]]
id = "player-stats-base-address-scan-initialization-activate-this-first"
name = "Player Stats Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(playerstats_basepointer)
registersymbol(playerstats_update_enable)
registersymbol(playerstats_lifeset_enable)
registersymbol(playerstats_tensionset_enable)
registersymbol(playerstats_dramaset_enable)
registersymbol(playerstats_damageset_enable)
registersymbol(playerstats_timeset_enable)

//00058099 - 89 44 24 6C           - mov [esp+6C],eax
//0005809D - 8B 00                 - mov eax,[eax]
// Accesses Base Pointer
//0005809F - 8B 84 83 04030000     - mov eax,[ebx+eax*4+00000304]
//000580A6 - 33 F6                 - xor esi,esi
//000580A8 - C6 44 24 70 00        - mov byte ptr [esp+70],00
//000580AD - C6 44 24 68 00        - mov byte ptr [esp+68],00
aobscan(playerstats_initialization_searchedAOB, 8B 84 83 04 03 00 00 33 F6)

alloc(playerstats_basepointer, 4, playerstats_initialization_searchedAOB)
alloc(playerstats_update_enable, 4, playerstats_initialization_searchedAOB)
alloc(playerstats_lifeset_enable, 4, playerstats_initialization_searchedAOB)
alloc(playerstats_tensionset_enable, 4, playerstats_initialization_searchedAOB)
alloc(playerstats_dramaset_enable, 4, playerstats_initialization_searchedAOB)
alloc(playerstats_damageset_enable, 4, playerstats_initialization_searchedAOB)
alloc(playerstats_timeset_enable, 4, playerstats_initialization_searchedAOB)


[DISABLE]
unregistersymbol(playerstats_basepointer)
unregistersymbol(playerstats_update_enable)
unregistersymbol(playerstats_lifeset_enable)
unregistersymbol(playerstats_tensionset_enable)
unregistersymbol(playerstats_dramaset_enable)
unregistersymbol(playerstats_damageset_enable)
unregistersymbol(playerstats_timeset_enable)

dealloc(playerstats_basepointer)
dealloc(playerstats_update_enable)
dealloc(playerstats_lifeset_enable)
dealloc(playerstats_tensionset_enable)
dealloc(playerstats_dramaset_enable)
dealloc(playerstats_damageset_enable)
dealloc(playerstats_timeset_enable)"""

[[cheat]]
id = "player-stats-base-address-scan-to-update-play-level"
name = "Player Stats Base Address Scan (To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstats_update_exit)
label(playerstats_lifeset_exit)
label(playerstats_tensionset_exit)
label(playerstats_dramaset_exit)
label(playerstats_damageset_exit)
label(playerstats_timeset_exit)

registersymbol(playerstats_originalcode)
registersymbol(playerstats_savedAOB)

//00058099 - 89 44 24 6C           - mov [esp+6C],eax
//0005809D - 8B 00                 - mov eax,[eax]
// Accesses Base Pointer
//0005809F - 8B 84 83 04030000     - mov eax,[ebx+eax*4+00000304]
//000580A6 - 33 F6                 - xor esi,esi
//000580A8 - C6 44 24 70 00        - mov byte ptr [esp+70],00
//000580AD - C6 44 24 68 00        - mov byte ptr [esp+68],00
aobscan(playerstats_searchedAOB, 8B 84 83 04 03 00 00 33 F6)

alloc(playerstats_newmem, 2048, playerstats_searchedAOB)
alloc(playerstats_temp1, 4, playerstats_searchedAOB)
alloc(playerstats_temp2, 4, playerstats_searchedAOB)
alloc(playerstats_temp3, 4, playerstats_searchedAOB)
alloc(playerstats_temp4, 4, playerstats_searchedAOB)
alloc(playerstats_temp5, 4, playerstats_searchedAOB)


playerstats_newmem:
mov [playerstats_temp1], eax
mov [playerstats_temp2], ebx
mov [playerstats_temp3], ecx
mov [playerstats_temp4], edx

cmp dword ptr [playerstats_update_enable], #0
je playerstats_update_exit
mov [playerstats_basepointer], ebx
playerstats_update_exit:

cmp dword ptr [playerstats_lifeset_enable], #0
je playerstats_lifeset_exit
mov ecx, [ebx+304]
test ecx, ecx
je playerstats_lifeset_exit
mov [ecx+f8], (float)99999
mov [ecx+fc], (float)99999
mov ecx, [ebx+308]
test ecx, ecx
je playerstats_lifeset_exit
mov [ecx+f8], (float)99999
mov [ecx+fc], (float)99999
mov ecx, [ebx+30c]
test ecx, ecx
je playerstats_lifeset_exit
mov [ecx+f8], (float)99999
mov [ecx+fc], (float)99999
playerstats_lifeset_exit:

cmp dword ptr [playerstats_tensionset_enable], #0
je playerstats_tensionset_exit
mov ecx, [ebx+304]
test ecx, ecx
je playerstats_tensionset_exit
mov [ecx+100], (float)99999
mov ecx, [ebx+308]
test ecx, ecx
je playerstats_tensionset_exit
mov [ecx+100], (float)99999
mov ecx, [ebx+30c]
test ecx, ecx
je playerstats_tensionset_exit
mov [ecx+100], (float)99999
playerstats_tensionset_exit:

cmp dword ptr [playerstats_dramaset_enable], #0
je playerstats_dramaset_exit
mov ecx, [ebx+304]
test ecx, ecx
je playerstats_dramaset_exit
mov [ecx+98], (float)99999
mov ecx, [ebx+308]
test ecx, ecx
je playerstats_dramaset_exit
mov [ecx+98], (float)99999
mov ecx, [ebx+30c]
test ecx, ecx
je playerstats_dramaset_exit
mov [ecx+98], (float)99999
playerstats_dramaset_exit:

cmp dword ptr [playerstats_damageset_enable], #0
je playerstats_damageset_exit
mov ecx, [ebx+304]
test ecx, ecx
je playerstats_damageset_exit
mov [ecx+108], (float)99999
mov ecx, [ebx+308]
test ecx, ecx
je playerstats_damageset_exit
mov [ecx+108], (float)99999
mov ecx, [ebx+30c]
test ecx, ecx
je playerstats_damageset_exit
mov [ecx+108], (float)99999
playerstats_damageset_exit:

cmp dword ptr [playerstats_timeset_enable], #0
je playerstats_timeset_exit
mov [ebx+4ec], #12374
playerstats_timeset_exit:

mov eax, [playerstats_temp1]
mov ebx, [playerstats_temp2]
mov ecx, [playerstats_temp3]
mov edx, [playerstats_temp4]


playerstats_originalcode:
readmem(playerstats_searchedAOB, 7)


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB:
playerstats_savedAOB:
jmp playerstats_newmem
nop
nop
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
readmem(playerstats_originalcode, 7)

unregistersymbol(playerstats_originalcode)
unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)
dealloc(playerstats_temp1)
dealloc(playerstats_temp2)
dealloc(playerstats_temp3)
dealloc(playerstats_temp4)
dealloc(playerstats_temp5)"""

