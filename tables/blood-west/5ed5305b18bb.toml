[[cheat]]
id = "pointers"
name = "[Pointers]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Blood West.exe
  Version: 
  Date   : 2023-11-27
  Author : cfe

  This script does blah blah blah
}

define(address,Game.Realm.PlayerCharacter:Update )

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000)

label(origUpdate)
registersymbol(origUpdate)
label(code)
label(return)
label(pPlayerCharacter)
registersymbol(pPlayerCharacter)

newmem:

code:
  origUpdate:
  readmem(address,14)
  mov [pPlayerCharacter],rcx
  jmp return
pPlayerCharacter:
dq 0

address:
  jmp far newmem
return:

[DISABLE]

address:
  readmem(origUpdate,14)

dealloc(newmem)"""

