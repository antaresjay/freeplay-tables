[[cheat]]
id = "stamina-flight"
name = "Stamina flight"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(stamina_flight,NyxQuest.exe,89 90 80 02 00 00 6A)
alloc(newmem,$100)
alloc(flight,4)
label(code)
label(return)
flight:
  db 0
newmem:
  mov [flight],edx
  jmp return
code:
  mov [eax+00000280],edx
  jmp return
stamina_flight:
  jmp newmem
  nop
return:
registersymbol(stamina_flight)
[DISABLE]
stamina_flight:
  db 89 90 80 02 00 00
unregistersymbol(stamina_flight)
dealloc(newmem)"""

