[[cheat]]
id = "rise-of-legends-script"
name = "Rise of Legends Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//=========================================
// Rise of Nations: Rise of Legends
// Game Version  : 0.13.04.1602 (0.0604.1602.0000.13.0)
// Script Version: 1.0
// CE Version    : 5.5
// GodMode and Resources
// 26-Dec-2009
//=========================================

[ENABLE]
alloc(MyCode,1024)

//=========================================
// Declaration section
label(_GodMode)
label(_BackGM)
label(_ExitGM)
label(_MonRes)
label(_BackMR)
label(_ExitMR)
label(_MonR0)
label(_MonR1)
label(iEnableGM)
label(iEnableMR)

registersymbol(MyCode)
registersymbol(iEnableGM)
registersymbol(iEnableMR)

//=========================================
// Hacking Points
legends.exe+12ee30:
 jmp _GodMode
_BackGM:

legends.exe+5674e9:
 jmp _MonRes
 nop
_BackMR: 

MyCode:
//=========================================
_GodMode:
 cmp dword ptr [iEnableGM],0
 je _ExitGM                     // Jump if feature is disabled
 
 cmp word ptr [esi+0000017c],0  // Is it a player�s Unit?
 jne _ExitGM                    // Jump if false

 mov dword ptr [esi+44],0       // Make damage = 0
 movss xmm0,[esi+44]            // Get current Damage

_ExitGM:
 movss [esi+44],xmm0            // Original code
 jmp _BackGM                    // Back to main code

//=========================================
_MonRes:
 cmp dword ptr [iEnableMR],0
 je _ExitMR                     // Jump if feature is disabled
 
 mov ecx,[eax]                  // Get Timonium
 xor ecx,00008221               // Decrypt it
 cmp ecx,#5000
 jge _MonR0
 
 mov ecx,#5000                  // Timonium = 5000
 xor ecx,00008221               // Encrypt it
 mov [eax],ecx                  // Update it

_MonR0: 
 mov ecx,[eax+04]               // Get Wealth
 xor ecx,00008221               // Decrypt it
 cmp ecx,#5000
 jge _MonR1
 
 mov ecx,#5000                  // Wealth = 5000
 xor ecx,00008221               // Encrypt it
 mov [eax+04],ecx               // Update it

_MonR1: 
 mov ecx,[eax+0c]               // Get Energy
 xor ecx,00008221               // Decrypt it
 cmp ecx,#5000
 jge _ExitMR
 
 mov ecx,#5000                  // Energy = 5000
 xor ecx,00008221               // Encrypt it
 mov [eax+0c],ecx               // Update it

_ExitMR:
 mov ecx,[eax+ebp*4]            // Get resource
 xor ecx,00008221               // Original code
 jmp _BackMR                    // Back to main code

//=========================================
// Variables
iEnableGM:
 dd 1
iEnableMR:
 dd 1

//=========================================
// Original Codes
[DISABLE]
legends.exe+12ee30:
 movss [esi+44],xmm0

legends.exe+5674e9:
 xor ecx,00008221

dealloc(MyCode)
unregistersymbol(MyCode)
unregistersymbol(iEnableGM)
unregistersymbol(iEnableMR)"""

