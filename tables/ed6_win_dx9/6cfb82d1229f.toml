[[cheat]]
id = "damage-modifier-script-god-mode-one-hit-kill-etc"
name = "Damage Modifier Script (God Mode, One Hit Kill, etc)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DamageModAOB,ed6_win_DX9.exe,2B C1 EB 02 33 C0 66 89 86 08 02 00 00) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,2048,DamageModAOB)

label(originalcode)
label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

newmem:
  add eax,ecx
  cmp byte ptr [esi+A],FF
  jne HeroHit
EnemyHit:
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckOneHitKill
  push ecx
  fild dword ptr [esp]
  fmul dword ptr [fEnemyDamageMult]
  fistp dword ptr [esp]
  pop ecx
CheckOneHitKill:
  cmp [OneHitKill],1
  jne CleanUp
  mov ecx,#99999
  jmp CleanUp
HeroHit:
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  push ecx
  fild dword ptr [esp]
  fmul dword ptr [fHeroDamageMult]
  fistp dword ptr [esp]
  pop ecx
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor ecx,ecx
  jmp CleanUp
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne CleanUp
  cmp ecx,eax
  jl @F
  xor ecx,ecx
@@:
  jmp CleanUp  
CleanUp:
  cmp eax,ecx
  ja originalcode
  mov eax,0
  mov [esi+0000208],ax
  jmp return

originalcode:
  sub eax,ecx
  mov [esi+0000208],ax
  jmp return

GodMode:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)2.0
fHeroDamageMult:
dq (float)0.25
HeroCannotDie:
dq 1

DamageModAOB+6:
  jmp newmem
  nop
  nop
return:

[DISABLE]

DamageModAOB+6:
  db 66 89 86 08 02 00 00

unregistersymbol(DamageModAOB)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fHeroDamageMult)
unregistersymbol(HeroCannotDie)

dealloc(newmem)"""

