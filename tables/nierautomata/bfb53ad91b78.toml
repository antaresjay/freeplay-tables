[[cheat]]
id = "02-inf-items"
name = "02. Inf Items"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : NieRAutomata.exe
  Version: STEAM
  Date   : 2018-03-04
  Author : Oyyzj

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(UseItems,NieRAutomata.exe,44 01 40 08 83 78 08 00) // should be unique
alloc(newmem,$32,UseItems)

label(code)
label(return)

newmem:
  cmp r8d,9D
  jge code
  mov [rax+08],#98
code:
  //add [rax+08],r8d
  cmp dword ptr [rax+08],00
  jmp return

UseItems:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(UseItems)

[DISABLE]

UseItems:
  db 44 01 40 08 83 78 08 00

unregistersymbol(UseItems)
dealloc(newmem)"""

