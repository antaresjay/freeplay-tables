[[cheat]]
id = "damage-modifier-script-god-mode-one-hit-kill-etc"
name = "Damage Modifier Script (God Mode, One Hit Kill, etc.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DamageModAOB,$process,8B 47 6C 39 F0 7C 04 29 F0) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,4096,DamageModAOB)

label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

newmem:
  mov eax,[rdi+6C]
  cmp word ptr [rdi+60],0
  je EnemyHit
HeroHit:
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  push esi
  fild dword ptr [rsp]
  fmul dword ptr [fHeroDamageMult]
  fistp dword ptr [rsp]
  pop esi
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor esi,esi
  jmp CleanUp
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne CleanUp
  cmp esi,eax
  jl @F
  xor esi,esi
@@:
  jmp CleanUp  
EnemyHit:
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckOneHitKill
  push esi
  fild dword ptr [rsp]
  fmul dword ptr [fEnemyDamageMult]
  fistp dword ptr [rsp]
  pop esi
CheckOneHitKill:
  cmp [OneHitKill],1
  jne CleanUp
  mov esi,#99999
  jmp CleanUp

CleanUp:    
  cmp eax,esi
  jmp return

GodMode:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)0.0
fHeroDamageMult:
dq (float)0.5
HeroCannotDie:
dq 1

DamageModAOB:
  jmp newmem
return:

[DISABLE]

DamageModAOB:
  db 8B 47 6C 39 F0

unregistersymbol(DamageModAOB)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fHeroDamageMult)

dealloc(newmem)"""

