[[cheat]]
id = "level-game-manager-ctrl-numpad-1"
name = "Level Game Manager (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Klaus_Lee-Thunderballs.exe
// Author            : ndck76
// Executable Version: 2022.3.19.19314
// Game Version      : v1.4.0
// Script Date       : 2025-07-02


[ENABLE]

aobscanregion(currenttime,Nukklear.LevelGameManager:Update,Nukklear.LevelGameManager:Update+200,F30F11AExxxx000048xxxx49BBxxxxxxxxxxxx000041xxxx48B8xxxxxxxxxxxx000048xxxx48xxxxxx66xx49BBxxxxxxxxxxxx0000) //Nukklear.LevelGameManager:Update+173
alloc(newmem,$1000,currenttime)
alloc(data,8)
alloc(currenttimebkp,8)
registersymbol(data)
registersymbol(currenttime)
registersymbol(currenttimebkp)
label(code)
label(return)

currenttimebkp:
  readmem(currenttime,8)

newmem:
  mov [data],rsi

code:
  readmem(currenttime,8)
  jmp return

currenttime:
  jmp newmem
  nop 3
return:

[DISABLE]

currenttime:
  readmem(currenttimebkp,8)

unregistersymbol(*)
dealloc(*)"""

