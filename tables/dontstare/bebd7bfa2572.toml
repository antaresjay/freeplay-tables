[[cheat]]
id = "aura-player-component-ctrl-numpad-1-will-populate-when-interacting-with-people"
name = "Aura Player Component (Ctrl + Numpad 1) {Will populate when interacting with people}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : DontStare.exe
// Author            : ndck76
// Executable Version: 2022.3.4.28988
// Game Version      : Build.15598886
// Script Date       : 2025-01-21


[ENABLE]

aobscanregion(changeaurasize,Ascended.Dontstare.Gameplay.AuraPlayerComponent:UpdateSocialBarEventCallback,Ascended.Dontstare.Gameplay.AuraPlayerComponent:UpdateSocialBarEventCallback+200,0FB686xxxx000085xx0FxxxxxxxxxxF3xxxxxxxxF3xxxxxxF3xxxxxxxxF3xxxxxxF2xxxxxx48xxxxF2xxxxxxF2xxxxxx66xxxx) //Ascended.Dontstare.Gameplay.AuraPlayerComponent:UpdateSocialBarEventCallback+53
alloc(newmem,$1000,changeaurasize)
alloc(data,8)
alloc(changeaurasizebkp,7)
registersymbol(data)
registersymbol(changeaurasize)
registersymbol(changeaurasizebkp)
label(code)
label(return)

changeaurasizebkp:
  readmem(changeaurasize,7)

newmem:
  mov [data],rsi

code:
  readmem(changeaurasize,7)
  jmp return

changeaurasize:
  jmp newmem
  nop 2
return:

[DISABLE]

changeaurasize:
  readmem(changeaurasizebkp,7)

unregistersymbol(*)
dealloc(*)"""

