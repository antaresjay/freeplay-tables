[[cheat]]
id = "stamina"
name = "stamina"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Steelrising.exe
  Version: [STEAM] 10819451
  Date   : 2022-09-10
  Author : Oyyzj

  update : 2026-06-27
}

[ENABLE]

aobscanmodule(Stamina,GameSteelrising.dll,F3 0F 11 73 ?? 0F 28 C8) // should be unique
alloc(newmem,$1000,Stamina)
registersymbol(Stamina)
alloc(pStamina,8)
registersymbol(pStamina)
label(code)
label(return)
label(rStamina)
registersymbol(rStamina)
label(eStamina)
registersymbol(eStamina)
label(oStamina)
registersymbol(oStamina)
label(mStamina)
label(cStamina)
label(cRegen)
label(cBuffdura)
label(cClip)
newmem:
  cmp [eStamina],1
  jne short code
  cmp rdi,CD
  je short cStamina
  cmp rdi,4E
  je short cRegen
  cmp rdi,5A
  je short cBuffdura
  cmp rdi,5C
  je short cBuffdura
  cmp rdi,5E
  je short cBuffdura
  cmp rdi,60
  je short cBuffdura
  cmp rdi,CB
  je short cClip
  jmp short code
code:
  readmem(Stamina,5)
  jmp return
rStamina:
  readmem(Stamina,5)
eStamina:
  dd 1
oStamina:
  dd 0 //1=no stamina, 2=no regen, 3=no buff
mStamina:
  dd (float)100 //don't touch this
cStamina:
  cmp [oStamina],1
  je short code
  mov [pStamina],rbx
  movss xmm15,[rbx+C8]
  movss xmm14,[mStamina]
  addss xmm14,xmm15
  movss [rbx+08],xmm14
  jmp return
cRegen:
  cmp [oStamina],2
  je short code
  mov [rbx+08],(float)600
  jmp return
cBuffdura:
  cmp [oStamina],3
  je short code
  mov [rbx+08],(float)1800
  jmp return
cClip:
  mov [rbx+08],(float)5
  jmp return
Stamina:
  jmp newmem
return:

[DISABLE]

Stamina:
  readmem(rStamina,5)

unregistersymbol(*)
dealloc(*)"""

