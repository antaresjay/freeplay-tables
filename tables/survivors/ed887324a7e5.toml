name = "Option 2 -- Find Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
aobscan(aob1,8B 5F 60 8D 5B 01 89 5F 60)
label(aob1_jmp)
registersymbol(aob1_jmp)
globalalloc(pPlayer,4)

newmem:
mov [pPlayer],edi

originalcode:
mov ebx,[edi+60]
lea ebx,[ebx+01]

exit:
jmp returnhere

aob1:
aob1_jmp:
jmp newmem
nop
returnhere:

[DISABLE]
dealloc(newmem)
aob1_jmp:
//mov ebx,[edi+60]
//lea ebx,[ebx+01]
db 8B 5F 60 8D 5B 01
dealloc(pPlayer)"""

