[[cheat]]
id = "enable-energy-mana-multiplier-loss-and-gain"
name = "Enable Energy/Mana Multiplier (Loss and Gain)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

///
/// Meta.ProfilePlayer.SpendMana
//aobscanregion(ManaLossMultiplierAOB1,Meta.ProfilePlayer.SpendMana,Meta.ProfilePlayer.SpendMana+50,48 89 5C 24 08 48 89 6C 24 10 48 89 74 24 18 48 89 7C 24 20 41 56 48 83 EC ??)
aobscanregion(ManaLossMultiplierAOB1,Meta.ProfilePlayer.SpendMana,Meta.ProfilePlayer.SpendMana+50,48 89 5C 24 18 48 89 74 24 20 57 41 56 41 57 48 83 EC ??)
registersymbol(ManaLossMultiplierAOB1)
alloc(newmem,1024)

/// Meta.ProfilePlayer.AddMana
aobscanregion(ManaGainMultiplierAOB2,Meta.ProfilePlayer.AddMana,Meta.ProfilePlayer.AddMana+50,48 89 5C 24 10 48 89 6C 24 18 48 89 74 24 20 41 54 41 56 41 57 48 83 EC ??)
registersymbol(ManaGainMultiplierAOB2)
alloc(newmem2,1024)

///
label(return)
label(fManaLossMult)
registersymbol(fManaLossMult)
label(ManaLossMultiplierAOB1Save)
registersymbol(ManaLossMultiplierAOB1Save)

///
label(return2)
label(fManaGainMult)
registersymbol(fManaGainMult)
label(ManaGainMultiplierAOB2Save)
registersymbol(ManaGainMultiplierAOB2Save)

///
newmem:
DoLossMult:
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [fManaLossMult]
  fistp dword ptr [rsp]
  pop edx
  jmp originalcode
    
originalcode:
ManaLossMultiplierAOB1Save:
  readmem(ManaLossMultiplierAOB1,19)
  jmp ManaLossMultiplierAOB1+13

fManaLossMult:
dq (float)0.25

///
newmem2:
DoGainMult:
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [fManaGainMult]
  fistp dword ptr [rsp]
  pop edx
  jmp originalcode2
    
originalcode2:
ManaGainMultiplierAOB2Save:
  readmem(ManaGainMultiplierAOB2,15)
  jmp ManaGainMultiplierAOB2+0F
  
fManaGainMult:
dq (float)2.0
  
///
ManaLossMultiplierAOB1:
  jmp newmem
  return:

///
ManaGainMultiplierAOB2:
  jmp newmem2
  return2:
    
[DISABLE]

///
ManaLossMultiplierAOB1:
  readmem(ManaLossMultiplierAOB1Save,19)
  
unregistersymbol(fManaLossMult)
unregistersymbol(ManaLossMultiplierAOB1)
unregistersymbol(ManaLossMultiplierAOB1Save)

///
ManaGainMultiplierAOB2:
  readmem(ManaGainMultiplierAOB2Save,15)
  
unregistersymbol(fManaGainMult)
unregistersymbol(ManaGainMultiplierAOB2)
unregistersymbol(ManaGainMultiplierAOB2Save)

dealloc(newmem)
dealloc(newmem2)"""

