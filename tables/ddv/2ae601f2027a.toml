[[cheat]]
id = "enable-currency-multiplier-loss-and-gain"
name = "Enable Currency Multiplier (Loss and Gain)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

///
/// Meta.ProfilePlayer.SpendCurrency
aobscanregion(CurrencyLossMultiplierAOB1,funcSpendCurrency,funcSpendCurrency+50,48 89 5C 24 20 56 41 54 41 56 48 83 EC 30)
registersymbol(CurrencyLossMultiplierAOB1)
alloc(newmem,1024,CurrencyLossMultiplierAOB1)

/// Meta.ProfilePlayer.AddCurrency
aobscanregion(CurrencyGainMultiplierAOB1,Meta.ProfilePlayer.AddCurrency,Meta.ProfilePlayer.AddCurrency+50,48 89 5C 24 10 48 89 6C 24 18 56 41 56 41 57 48 83 EC ??)
registersymbol(CurrencyGainMultiplierAOB1)
alloc(newmem2,1024)

/// Meta.ProfilePlayer.SpendStoreFrontSpecificCurrency
aobscanregion(CurrencyLossMultiplierAOB2,Meta.ProfilePlayer.SpendStoreFrontSpecificCurrency,Meta.ProfilePlayer.SpendStoreFrontSpecificCurrency+50,48 89 5C 24 08 48 89 6C 24 10 48 89 74 24 18 48 89 7C 24 20 41 56 48 83 EC ??)
registersymbol(CurrencyLossMultiplierAOB2)
alloc(newmem3,1024)

{
/// Meta.ProfilePlayer.AddCurrency (Check for Negative Amount)
aobscanmodule(CurrencyGainMultiplierAOB2,GameAssembly.dll,8B D3 48 8B CE 44 8D 04 38 E8 ?? ?? ?? ?? 4? 85 ??)
registersymbol(CurrencyGainMultiplierAOB2)
alloc(newmem4,1024,CurrencyGainMultiplierAOB2)
}

///
label(return)
label(fCurrencyLossMult)
registersymbol(fCurrencyLossMult)
label(CurrencyLossMultiplierAOB1Save)
registersymbol(CurrencyLossMultiplierAOB1Save)

///
label(return2)
label(CurrencyGainMultiplierAOB1Save)
registersymbol(CurrencyGainMultiplierAOB1Save)
label(fCurrencyGainMult)
registersymbol(fCurrencyGainMult)

///
label(return3)
label(CurrencyLossMultiplierAOB2Save)
registersymbol(CurrencyLossMultiplierAOB2Save)
label(fCurrencyLossMult2)
registersymbol(fCurrencyLossMult2)

{
///
label(return4)
}

///
newmem:
DoLossMult:
  push r8d
  fild dword ptr [rsp]
  fmul dword ptr [fCurrencyLossMult]
  fistp dword ptr [rsp]
  pop r8d
  jmp originalcode
    
originalcode:
CurrencyLossMultiplierAOB1Save:
  readmem(CurrencyLossMultiplierAOB1,14)
  jmp CurrencyLossMultiplierAOB1+0E

fCurrencyLossMult:
dq (float)0.25

///
newmem2:
DoGainMult:
  push r8d
  fild dword ptr [rsp]
  fmul dword ptr [fCurrencyGainMult]
  fistp dword ptr [rsp]
  pop r8d
  cmp r8d,[iMaxAddAmount]
  jle originalcode2
  mov r8d,[iMaxAddAmount]
  jmp originalcode2
    
originalcode2:
CurrencyGainMultiplierAOB1Save:
  readmem(CurrencyGainMultiplierAOB1,15)
  jmp CurrencyGainMultiplierAOB1+0F
  
fCurrencyGainMult:
dq (float)2.0
iMaxAddAmount:
dq #1000000

///
newmem3:
  mov [R14Save3],r14
  mov [R15Save3],r15
  mov r15,fCurrencyLossMult
  mov r15,[r15]
  mov r14,fCurrencyLossMult2
  mov [r14],r15
  mov r14,[R14Save3]
  mov r15,[R15Save3]
DoLossMult3:
  push r8d
  fild dword ptr [rsp]
  fmul dword ptr [fCurrencyLossMult2]
  fistp dword ptr [rsp]
  pop r8d
  jmp originalcode3
    
originalcode3:
CurrencyLossMultiplierAOB2Save:
  readmem(CurrencyLossMultiplierAOB2,15)
  jmp CurrencyLossMultiplierAOB2+0F

R14Save3:
dq 0
R15Save3:
dq 0
fCurrencyLossMult2:
dq (float)0.25

{
newmem4:
  lea r8d,[rax+rdi]
  cmp r8d,0
  jge SkipResetAmount
  xor rax,rax
  xor rdi,rdi
  add edi,#20000
SkipResetAmount:
  jmp originalcode4

originalcode4:
  mov edx,ebx
  mov rcx,rsi
  // lea r8d,[rax+rdi]
  jmp CurrencyGainMultiplierAOB2+05  
}
  
///
CurrencyLossMultiplierAOB1:
  jmp newmem
  return:

///
CurrencyGainMultiplierAOB1:
  jmp newmem2
  return2:

///
CurrencyLossMultiplierAOB2:
  jmp newmem3
  return3:

{
///
CurrencyGainMultiplierAOB2:
  jmp newmem4
  return4:
}
    
[DISABLE]

///
CurrencyLossMultiplierAOB1:
  readmem(CurrencyLossMultiplierAOB1Save,14)
  
unregistersymbol(fCurrencyLossMult)
unregistersymbol(CurrencyLossMultiplierAOB1)
unregistersymbol(CurrencyLossMultiplierAOB1Save)

///
CurrencyGainMultiplierAOB1:
  readmem(CurrencyGainMultiplierAOB1Save,15)
  
unregistersymbol(fCurrencyGainMult)
unregistersymbol(CurrencyGainMultiplierAOB1)
unregistersymbol(CurrencyGainMultiplierAOB1Save)

///
CurrencyLossMultiplierAOB2:
  readmem(CurrencyLossMultiplierAOB2Save,15)

unregistersymbol(CurrencyLossMultiplierAOB2)
unregistersymbol(CurrencyLossMultiplierAOB2Save)

{
///
CurrencyGainMultiplierAOB2:
  db 8B D3 48 8B CE

unregistersymbol(CurrencyGainMultiplierAOB2)
}
  
dealloc(newmem)
dealloc(newmem2)
dealloc(newmem3)
{dealloc(newmem4)}"""

