[[cheat]]
id = "beggarcamp-base-address-scan-to-activate-add-beggar-to-update-add-beggar"
name = "BeggarCamp Base Address Scan (To Activate: Add Beggar, To Update: Add Beggar)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(BeggarCamp_savedAOB)
label(BeggarCamp_returnhere)
label(BeggarCamp_originalcode)
label(BeggarCamp_exit)

label(BeggarCamp_update_exit)
label(BeggarCamp_set_exit)

registersymbol(BeggarCamp_savedAOB)

// BeggarCamp:AddBeggar
aobscan(BeggarCamp_searchedAOB, 55 8B EC 83 EC 08 8B 45 08 8B 40 10 83 EC 08 FF 75 0C 50 39 00 * * * * * 83 C4 10 C9 C3)

alloc(BeggarCamp_newmem, 2048, BeggarCamp_searchedAOB)


BeggarCamp_newmem:
cmp dword ptr [BeggarCamp_update_enable], #0
je BeggarCamp_update_exit
mov [BeggarCamp_basepointer], eax
BeggarCamp_update_exit:

cmp dword ptr [BeggarCamp_set_enable], #0
je BeggarCamp_set_exit
mov [eax+14], #20
mov [eax+18], (float)0.1
BeggarCamp_set_exit:


BeggarCamp_originalcode:
db 8B 40 10 83 EC 08
//mov eax,[eax+10]
//sub esp,08


BeggarCamp_exit:
jmp BeggarCamp_returnhere


BeggarCamp_searchedAOB + 9:
BeggarCamp_savedAOB:
jmp BeggarCamp_newmem
nop
BeggarCamp_returnhere:


[DISABLE]
BeggarCamp_savedAOB:
db 8B 40 10 83 EC 08
//mov eax,[eax+10]
//sub esp,08

unregistersymbol(BeggarCamp_savedAOB)

dealloc(BeggarCamp_newmem)"""

