[[cheat]]
id = "enable-damage-modifier-options-god-mode-one-hit-kill-etc"
name = "Enable Damage Modifier Options (God Mode, One Hit Kill, etc.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

///
aobscanmodule(DamageModAOB1,$process,48 89 5C 24 08 57 48 83 EC 20 33 DB 48 8B F9 03 51 0C)
registersymbol(DamageModAOB1)
alloc(newmem,1024)

///
label(return)
label(DamageModAOB1Save)
registersymbol(DamageModAOB1Save)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fEnemyHealingMult)
registersymbol(fEnemyHealingMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(fHeroHealingMult)
registersymbol(fHeroHealingMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

///
newmem:
  mov [R11Save],r11
  mov [R12Save],r12
  mov [R13Save],r13
  mov [R14Save],r14
  mov [R15Save],r15  
  xor r11,r11
  mov r11d,edx
  cmp dword ptr [rcx+04],2
  je EnemyHit
  cmp dword ptr [rcx+04],1
  je HeroHit
  jmp MyCleanUp1
HeroHit:
  cmp edx,0
  jl HeroDamageHit
  jg HeroHealingHit
  jmp MyCleanUp1
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  neg edx
  push edx
  fild dword ptr [esp]
  fmul dword ptr [fHeroDamageMult]
  fistp dword ptr [esp]
  pop edx
  neg edx
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor edx,edx
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne MyCleanUp1
  neg edx
  cmp edx,[rcx+0C]
  jl @F
  xor edx,edx
@@:
  neg edx
  jmp MyCleanUp1
HeroHealingHit:
  cmp [fHeroHealingMult],(float)0.0
  je MyCleanUp1
  push edx
  fild dword ptr [esp]
  fmul dword ptr [fHeroHealingMult]
  fistp dword ptr [esp]
  pop edx
  jmp MyCleanUp1
EnemyHit:
  cmp edx,0
  jl EnemyDamageHit
  jg EnemyHealingHit
  jmp MyCleanUp1
EnemyDamageHit:
  cmp [OneHitKill],1
  jne SkipOneHitKill
  mov edx,[rcx+0C]
  neg edx
  jmp MyCleanUp1
SkipOneHitKill:
  cmp [fEnemyDamageMult],(float)0.0
  je MyCleanUp1
  neg edx
  push edx
  fild dword ptr [esp]
  fmul dword ptr [fEnemyDamageMult]
  fistp dword ptr [esp]
  pop edx
  // Do Some Checks To Make Sure We Don't Bypass Battle
  cmp [fEnemyDamageMult],(float)1.0
  je SkipExtraChecks
  cmp edx,[rcx+0C]
  jl SkipExtraChecks
  cmp r11d,[rcx+0C]
  jge SkipExtraChecks
  cmp dword ptr [rcx+0C],1
  jle SkipExtraChecks
  // Make It So HP Gets To 1 First Before Killing The Enemy
  mov edx,[rcx+0C]
  dec edx
SkipExtraChecks:
  neg edx
  jmp MyCleanUp1
EnemyHealingHit:
  cmp [fEnemyHealingMult],(float)0.0
  je MyCleanUp1
  push edx
  fild dword ptr [esp]
  fmul dword ptr [fEnemyHealingMult]
  fistp dword ptr [esp]
  pop edx
  jmp MyCleanUp1

MyCleanUp1:
  mov r11,[R11Save]
  mov r12,[R12Save]
  mov r13,[R13Save]
  mov r14,[R14Save]
  mov r15,[R15Save]
  jmp originalcode
  
originalcode:
DamageModAOB1Save:
  readmem(DamageModAOB1,15)
  jmp DamageModAOB1+0F

R11Save:
dq 0
R12Save:
dq 0
R13Save:
dq 0
R14Save:
dq 0
R15Save:
dq 0
GodMode:
dq 0
fHeroDamageMult:
dq (float)0.25
fHeroHealingMult:
dq (float)2.0
HeroCannotDie:
dq 1
fEnemyDamageMult:
dq (float)2.0
fEnemyHealingMult:
dq (float)0.5
OneHitKill:
dq 0
  
///
DamageModAOB1:
  jmp newmem
  return:
   
[DISABLE]

///
DamageModAOB1:
  readmem(DamageModAOB1Save,15)
  
unregistersymbol(GodMode)
unregistersymbol(fHeroDamageMult)
unregistersymbol(fHeroHealingMult)
unregistersymbol(HeroCannotDie)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fEnemyHealingMult)
unregistersymbol(OneHitKill)
unregistersymbol(DamageModAOB1)
unregistersymbol(DamageModAOB1Save)

///
dealloc(newmem)"""

