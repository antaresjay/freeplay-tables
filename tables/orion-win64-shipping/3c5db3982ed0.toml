type = "script"
source = """
{ Game   : Orion-Win64-Shipping.exe
  Version: 0.9
  Date   : 2023-03-07
  Author : DeBug

  This script extracts current address for abilities
  to make them available for any character.
}

[ENABLE]
aobscanmodule(invisibility,Orion-Win64-Shipping.exe,80 BF 97 02 00 00 00) // should be unique
alloc(newmem,$1000,invisibility)
label(return)
label(cloak_save)
label(cloak_pointer)

newmem:

cloak_save:
  push rdi
  db 48 81 C7 // add rdi,____
  readmem(invisibility+2,4)
  mov [cloak_pointer],rdi
  pop rdi
  cmp byte ptr [rdi+00000297],00
