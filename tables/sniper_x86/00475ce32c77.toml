[[cheat]]
id = "recoil"
name = "Recoil..."
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Sniper_x86.exe
  Version:
  Date   : 2020-08-14
  Author : Paul44

  Dis/enable recoil...
}

[ENABLE]

aobscanmodule(Recoil,GameDLL_x86.dll,D9 84 86 98 10 00 00)
registersymbol(Recoil)
alloc(newmem,$100,$process)

aobscanmodule(Crosshair,GameDLL_x86.dll,D9 1F 83 C4 1C C3 DD)
registersymbol(Crosshair)
alloc(newmem1,$100,$process)

globalalloc(bSpread,1,$process)

bSpread:
db 1

// recoil routine...
label(code)
label(return)

newmem:
  mov [esi+eax*4+00001098],(float)0
code:
  fld dword ptr [esi+eax*4+00001098]
  jmp return

Recoil:
  jmp newmem
  db 90 90
return:

// crosshair routine...
label(code1)
label(return1)

newmem1:
  fstp dword ptr [edi]
  add esp,1C
code1:
  cmp [bSpread],0
  jne short @f
  mov [edi],0
@@:
  jmp return1

Crosshair:
  jmp newmem1
return1:


[DISABLE]

// recoil routine...
Recoil:
  db D9 84 86 98 10 00 00

unregistersymbol(Recoil)
dealloc(newmem)

// crosshair routine...
Crosshair:
  db D9 1F 83 C4 1C

unregistersymbol(Crosshair)
dealloc(newmem1)

