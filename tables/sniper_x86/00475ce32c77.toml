[[cheat]]
id = "enable-cheats-after-save-has-fully-loaded"
name = "Enable cheats... (after save has fully loaded)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Sniper_x86.exe
  Version:
  Date   : 2020-08-12
  Author : Paul44

  Health v1
}

[ENABLE]

aobscanmodule(Health,GameDLL_x86.dll,D9 81 10 01 00 00 C3)
registersymbol(Health)
alloc(newmem,$100,$process)

globalalloc(pHealth,4,$process)
globalalloc(pCreateWin,4,$process)

label(code)
label(return)

newmem:
  mov [pHealth],ecx
code:
  fld dword ptr [ecx+00000110]
  jmp return

Health:
  jmp newmem
  nop
return:


[DISABLE]

Health:
  db D9 81 10 01 00 00

unregistersymbol(Health)
dealloc(newmem)

