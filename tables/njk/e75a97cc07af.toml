// Game Executable   : NJK.exe
// Author            : ndck76
// Executable Version: 2021.3.24.4316
// Game Version      : v1.01
// Script Date       : 2024-12-02


define(address,ActorEnemy:Damage+3d8)
define(bytes,F3 0F 10 8F FC 01 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,ActorEnemy:Damage+3d8)

label(code)
label(return)

newmem:
  mov [rdi+000001FC],0

code:
  movss xmm1,[rdi+000001FC]
  jmp return

address:
  jmp newmem
  nop 3
return:

[DISABLE]

address:
  db bytes
