type = "script"
source = """
// Game Executable   : Mango-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.6.0.0
// Game Version      : Build.21284316
// Script Date       : 2025-12-26


[ENABLE]

aobscanmodule(master,Mango-Win64-Shipping.exe,498BxxFFxxxxxxxxxx0F10xx0F11xxF2) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,9)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,9)

newmem:
  mov [data],r14

code:
  readmem(master,9)
  jmp return

master:
  jmp newmem
  nop 4
return:

[DISABLE]

master:
  readmem(masterbkp,9)

unregistersymbol(*)
dealloc(*)"""

