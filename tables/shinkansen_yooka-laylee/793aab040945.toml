source = """
[ENABLE]
label(SavegameManager_savedAOB)
label(SavegameManager_returnhere)
label(SavegameManager_originalcode)
label(SavegameManager_exit)

label(SavegameManager_update_exit)
label(SavegameManager_set_exit)

registersymbol(SavegameManager_savedAOB)

//12BF98E6 - 48 83 EC 10           - sub rsp,10
//12BF98EA - 48 8B F1              - mov rsi,rcx
// SavegameManager:Update+d
//12BF98ED - 48 8B 46 18           - mov rax,[rsi+18]
//12BF98F1 - 48 85 C0              - test rax,rax
//12BF98F4 - 74 1B                 - je 12BF9911
//12BF98F6 - 48 8B 46 18           - mov rax,[rsi+18]
//12BF98FA - 48 8B C8              - mov rcx,rax
aobscan(SavegameManager_searchedAOB, 48 8B 46 18 48 85 C0 74 1B)

alloc(SavegameManager_newmem, 2048, SavegameManager_searchedAOB)
alloc(SavegameManager_temp1, 8, SavegameManager_searchedAOB)
alloc(SavegameManager_temp2, 8, SavegameManager_searchedAOB)
alloc(SavegameManager_temp3, 8, SavegameManager_searchedAOB)
alloc(SavegameManager_temp4, 8, SavegameManager_searchedAOB)
alloc(SavegameManager_temp5, 8, SavegameManager_searchedAOB)


SavegameManager_newmem:
mov [SavegameManager_temp1], rax
mov [SavegameManager_temp2], rbx
mov [SavegameManager_temp3], rcx
mov [SavegameManager_temp4], rdx

cmp dword ptr [SavegameManager_update_enable], #0
je SavegameManager_update_exit
mov [SavegameManager_basepointer], rcx
SavegameManager_update_exit:

cmp dword ptr [SavegameManager_set_enable], #0
je SavegameManager_set_exit
SavegameManager_set_exit:


mov rax, [SavegameManager_temp1]
mov rbx, [SavegameManager_temp2]
mov rcx, [SavegameManager_temp3]
mov rdx, [SavegameManager_temp4]


SavegameManager_originalcode:
db 48 8B 46 18 48 85 C0
//mov rax,[rsi+18]
//test rax,rax


SavegameManager_exit:
jmp SavegameManager_returnhere


SavegameManager_searchedAOB:
SavegameManager_savedAOB:
jmp SavegameManager_newmem
nop
nop
SavegameManager_returnhere:


[DISABLE]
SavegameManager_savedAOB:
db 48 8B 46 18 48 85 C0
//mov rax,[rsi+18]
//test rax,rax

unregistersymbol(SavegameManager_savedAOB)

dealloc(SavegameManager_newmem)
dealloc(SavegameManager_temp1)
dealloc(SavegameManager_temp2)
dealloc(SavegameManager_temp3)
dealloc(SavegameManager_temp4)
dealloc(SavegameManager_temp5)"""

