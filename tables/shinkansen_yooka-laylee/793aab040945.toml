mov [Timer_basepointer], rsi
Timer_update_exit:

cmp dword ptr [Timer_set_enable], #0
je Timer_set_exit
Timer_set_exit:

cmp dword ptr [Timer_neverelapseset_enable], #0
je Timer_neverelapseset_exit
mov [rsi+18], (float)0
Timer_neverelapseset_exit:

cmp dword ptr [Timer_instantelapseset_enable], #0
je Timer_instantelapseset_exit
fld [rsi+10]
fstp [rsi+18]
Timer_instantelapseset_exit:


mov rax, [Timer_temp1]
