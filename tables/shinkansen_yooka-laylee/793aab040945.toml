// Timer:Update+c
//21113A0C - F3 0F10 46 10         - movss xmm0,[rsi+10]
//21113A11 - F3 0F5A C0            - cvtss2sd xmm0,xmm0
//21113A15 - 66 0F57 C9            - xorpd xmm1,xmm1
//21113A19 - 66 0F2F C8            - comisd xmm1,xmm0
//21113A1D - 7A 06                 - jp 21113A25
//21113A1F - 0F84 7F000000         - je 21113AA4
//21113A25 - 0FB6 46 1C            - movzx eax,byte ptr [rsi+1C]
aobscan(Timer_searchedAOB, F3 0F 10 46 10 F3 0F 5A C0 66 0F 57 C9 66 0F 2F C8 7A 06)

alloc(Timer_newmem, 2048, Timer_searchedAOB)
