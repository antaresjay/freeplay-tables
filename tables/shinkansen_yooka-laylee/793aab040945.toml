[[cheat]]
id = "playerlogic-base-address-scan-initialization-activate-this-first"
name = "PlayerLogic Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlayerLogic_basepointer)
registersymbol(PlayerLogic_update_enable)
registersymbol(PlayerLogic_set_enable)
registersymbol(PlayerLogic_healthset_enable)
registersymbol(PlayerLogic_powerset_enable)
registersymbol(PlayerLogic_jumpset_enable)
registersymbol(PlayerLogic_jumpset_value)
registersymbol(PlayerLogic_shoottimerset_enable)

alloc(PlayerLogic_basepointer, 8)
alloc(PlayerLogic_update_enable, 4)
alloc(PlayerLogic_set_enable, 4)
alloc(PlayerLogic_healthset_enable, 4)
alloc(PlayerLogic_powerset_enable, 4)
alloc(PlayerLogic_jumpset_enable, 4)
alloc(PlayerLogic_jumpset_value, 4)
alloc(PlayerLogic_shoottimerset_enable, 4)

PlayerLogic_jumpset_value:
dd (float)30


[DISABLE]
unregistersymbol(PlayerLogic_basepointer)
unregistersymbol(PlayerLogic_update_enable)
unregistersymbol(PlayerLogic_set_enable)
unregistersymbol(PlayerLogic_healthset_enable)
unregistersymbol(PlayerLogic_powerset_enable)
unregistersymbol(PlayerLogic_jumpset_enable)
unregistersymbol(PlayerLogic_jumpset_value)
unregistersymbol(PlayerLogic_shoottimerset_enable)

dealloc(PlayerLogic_basepointer)
dealloc(PlayerLogic_update_enable)
dealloc(PlayerLogic_set_enable)
dealloc(PlayerLogic_healthset_enable)
dealloc(PlayerLogic_powerset_enable)
dealloc(PlayerLogic_jumpset_enable)
dealloc(PlayerLogic_jumpset_value)
dealloc(PlayerLogic_shoottimerset_enable)"""

[[cheat]]
id = "playerlogic-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerLogic Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerLogic_savedAOB)
label(PlayerLogic_returnhere)
label(PlayerLogic_originalcode)
label(PlayerLogic_exit)

label(PlayerLogic_update_exit)
label(PlayerLogic_set_exit)
label(PlayerLogic_healthset_exit)
label(PlayerLogic_powerset_exit)
label(PlayerLogic_jumpset_exit)
label(PlayerLogic_shoottimerset_exit)

registersymbol(PlayerLogic_savedAOB)

//1DEBDAEA - 41 FF D3              - call r11d
//1DEBDAED - 48 83 C4 20           - add rsp,20
// PlayerLogic:FixedUpdate+21
//1DEBDAF1 - 48 8B 46 40           - mov rax,[rsi+40]
//1DEBDAF5 - 48 8B C8              - mov rcx,rax
//1DEBDAF8 - 48 83 EC 20           - sub rsp,20
//1DEBDAFC - 83 38 00              - cmp dword ptr [rax],00
//1DEBDAFF - 49 BB 00E5EB1D00000000 - mov r11,000000001DEBE500 : [EC8B4855]
//1DEBDB09 - 41 FF D3              - call r11d
//1DEBDB0C - 48 83 C4 20           - add rsp,20
//1DEBDB10 - 48 8B 86 80000000     - mov rax,[rsi+00000080]
//1DEBDB17 - 48 8B C8              - mov rcx,rax
//1DEBDB1A - 48 83 EC 20           - sub rsp,20
aobscan(PlayerLogic_searchedAOB, 48 8B 46 40 48 8B C8 48 83 EC 20 83 38 00 * * * * * * * * * * * * * 48 83 C4 20 48 8B 86 80 00 00 00)

alloc(PlayerLogic_newmem, 2048, PlayerLogic_searchedAOB)
alloc(PlayerLogic_temp1, 8, PlayerLogic_searchedAOB)
alloc(PlayerLogic_temp2, 8, PlayerLogic_searchedAOB)
alloc(PlayerLogic_temp3, 8, PlayerLogic_searchedAOB)
alloc(PlayerLogic_temp4, 8, PlayerLogic_searchedAOB)
alloc(PlayerLogic_temp5, 8, PlayerLogic_searchedAOB)


PlayerLogic_newmem:
mov [PlayerLogic_temp1], rax
mov [PlayerLogic_temp2], rbx
mov [PlayerLogic_temp3], rcx
mov [PlayerLogic_temp4], rdx

cmp dword ptr [PlayerLogic_update_enable], #0
je PlayerLogic_update_exit
mov [PlayerLogic_basepointer], rsi
PlayerLogic_update_exit:

cmp dword ptr [PlayerLogic_set_enable], #0
je PlayerLogic_set_exit
PlayerLogic_set_exit:

cmp dword ptr [PlayerLogic_healthset_enable], #0
je PlayerLogic_healthset_exit
cmp qword ptr [rsi+188], #0
je PlayerLogic_healthset_exit
cmp dword ptr [rsi+188], #0
je PlayerLogic_healthset_exit
mov rbx, [rsi+188]
mov ecx, [rbx+20]
mov [rbx+24], ecx
PlayerLogic_healthset_exit:

cmp dword ptr [PlayerLogic_powerset_enable], #0
je PlayerLogic_powerset_exit
cmp qword ptr [rsi+190], #0
je PlayerLogic_powerset_exit
cmp dword ptr [rsi+190], #0
je PlayerLogic_powerset_exit
mov rbx, [rsi+190]
fld [rbx+20]
fstp [rbx+4c]
PlayerLogic_powerset_exit:

cmp dword ptr [PlayerLogic_jumpset_enable], #0
je PlayerLogic_jumpset_exit
cmp qword ptr [rsi+58], #0
je PlayerLogic_jumpset_exit
cmp dword ptr [rsi+58], #0
je PlayerLogic_jumpset_exit
mov rbx, [rsi+58]
cmp qword ptr [rbx+20], #0
je PlayerLogic_jumpset_exit
cmp dword ptr [rbx+20], #0
je PlayerLogic_jumpset_exit
mov rbx, [rbx+20]
fld [PlayerLogic_jumpset_value]
fstp [rbx+10]
PlayerLogic_jumpset_exit:

cmp dword ptr [PlayerLogic_shoottimerset_enable], #0
je PlayerLogic_shoottimerset_exit
cmp qword ptr [rsi+158], #0
je PlayerLogic_powerset_exit
cmp dword ptr [rsi+158], #0
je PlayerLogic_powerset_exit
mov rbx, [rsi+158]
mov [rbx+20], (float)20
PlayerLogic_shoottimerset_exit:


mov rax, [PlayerLogic_temp1]
mov rbx, [PlayerLogic_temp2]
mov rcx, [PlayerLogic_temp3]
mov rdx, [PlayerLogic_temp4]


PlayerLogic_originalcode:
db 48 8B 46 40 48 8B C8
//mov rax,[rsi+40]
//mov rcx,rax


PlayerLogic_exit:
jmp PlayerLogic_returnhere


PlayerLogic_searchedAOB:
PlayerLogic_savedAOB:
jmp PlayerLogic_newmem
nop
nop
PlayerLogic_returnhere:


[DISABLE]
PlayerLogic_savedAOB:
db 48 8B 46 40 48 8B C8
//mov rax,[rsi+40]
//mov rcx,rax

unregistersymbol(PlayerLogic_savedAOB)

dealloc(PlayerLogic_newmem)
dealloc(PlayerLogic_temp1)
dealloc(PlayerLogic_temp2)
dealloc(PlayerLogic_temp3)
dealloc(PlayerLogic_temp4)
dealloc(PlayerLogic_temp5)"""

