[[cheat]]
id = "arcadegamecontroller-base-address-scan-to-activate-play-arcade-to-update-play-arcade"
name = "ArcadeGameController Base Address Scan (To Activate: Play Arcade, To Update: Play Arcade)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(ArcadeGameController_savedAOB)
label(ArcadeGameController_returnhere)
label(ArcadeGameController_originalcode)
label(ArcadeGameController_exit)

label(ArcadeGameController_update_exit)
label(ArcadeGameController_set_exit)
label(ArcadeGameController_livesset_exit)
label(ArcadeGameController_gametimeset_exit)
label(ArcadeGameController_spawnset_exit)

registersymbol(ArcadeGameController_savedAOB)

//0D6C1D3D - 48 8B F1              - mov rsi,rcx
//0D6C1D40 - C7 45 CC 00000000     - mov [rbp-34],00000000
// ArcadeGameController:Update+17
//0D6C1D47 - 48 63 86 40010000     - movsxd  rax,dword ptr [rsi+00000140]
//0D6C1D4E - 4C 8B F0              - mov r14,rax
//0D6C1D51 - 41 FF CE              - dec r14d
//0D6C1D54 - 41 83 FE 04           - cmp r14d,04
aobscan(ArcadeGameController_searchedAOB, 48 63 86 40 01 00 00 4C 8B F0)

alloc(ArcadeGameController_newmem, 2048, ArcadeGameController_searchedAOB)
alloc(ArcadeGameController_temp1, 8, ArcadeGameController_searchedAOB)
alloc(ArcadeGameController_temp2, 8, ArcadeGameController_searchedAOB)
alloc(ArcadeGameController_temp3, 8, ArcadeGameController_searchedAOB)
alloc(ArcadeGameController_temp4, 8, ArcadeGameController_searchedAOB)
alloc(ArcadeGameController_temp5, 8, ArcadeGameController_searchedAOB)


ArcadeGameController_newmem:
mov [ArcadeGameController_temp1], rax
mov [ArcadeGameController_temp2], rbx
mov [ArcadeGameController_temp3], rcx
mov [ArcadeGameController_temp4], rdx

cmp dword ptr [ArcadeGameController_update_enable], #0
je ArcadeGameController_update_exit
mov [ArcadeGameController_basepointer], rsi
ArcadeGameController_update_exit:

cmp dword ptr [ArcadeGameController_set_enable], #0
je ArcadeGameController_set_exit
ArcadeGameController_set_exit:

cmp dword ptr [ArcadeGameController_livesset_enable], #0
je ArcadeGameController_livesset_exit
mov ebx, [rsi+108]
mov [rsi+10c], ebx
ArcadeGameController_livesset_exit:

cmp dword ptr [ArcadeGameController_gametimeset_enable], #0
je ArcadeGameController_gametimeset_exit
mov [rsi+13c], (float)0
ArcadeGameController_gametimeset_exit:

cmp dword ptr [ArcadeGameController_spawnset_enable], #0
je ArcadeGameController_spawnset_exit
mov byte ptr [rsi+118], #1
mov [rsi+11c], (float)9999
ArcadeGameController_spawnset_exit:


mov rax, [ArcadeGameController_temp1]
mov rbx, [ArcadeGameController_temp2]
mov rcx, [ArcadeGameController_temp3]
mov rdx, [ArcadeGameController_temp4]


ArcadeGameController_originalcode:
db 48 63 86 40 01 00 00
//movsxd  rax,dword ptr [rsi+00000140]


ArcadeGameController_exit:
jmp ArcadeGameController_returnhere


ArcadeGameController_searchedAOB:
ArcadeGameController_savedAOB:
jmp ArcadeGameController_newmem
nop
nop
ArcadeGameController_returnhere:


[DISABLE]
ArcadeGameController_savedAOB:
db 48 63 86 40 01 00 00
//movsxd  rax,dword ptr [rsi+00000140]

unregistersymbol(ArcadeGameController_savedAOB)

dealloc(ArcadeGameController_newmem)
dealloc(ArcadeGameController_temp1)
dealloc(ArcadeGameController_temp2)
dealloc(ArcadeGameController_temp3)
dealloc(ArcadeGameController_temp4)
dealloc(ArcadeGameController_temp5)"""

