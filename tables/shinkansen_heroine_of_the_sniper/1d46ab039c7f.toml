[[cheat]]
id = "bullets-base-address-scan-initialization-activate-this-first"
name = "Bullets Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Bullets_basepointer)
registersymbol(Bullets_update_enable)
registersymbol(Bullets_ammoset_enable)

alloc(Bullets_basepointer, 4)
alloc(Bullets_update_enable, 4)
alloc(Bullets_ammoset_enable, 4)


[DISABLE]
unregistersymbol(Bullets_basepointer)
unregistersymbol(Bullets_update_enable)
unregistersymbol(Bullets_ammoset_enable)

dealloc(Bullets_basepointer)
dealloc(Bullets_update_enable)
dealloc(Bullets_ammoset_enable)"""

[[cheat]]
id = "bullets-base-address-scan-to-activate-shoot-to-update-shoot"
name = "Bullets Base Address Scan (To Activate: Shoot, To Update: Shoot)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Bullets_savedAOB)
label(Bullets_returnhere)
label(Bullets_originalcode)
label(Bullets_exit)

label(Bullets_update_exit)
label(Bullets_ammoset_exit)

registersymbol(Bullets_originalcode)
registersymbol(Bullets_savedAOB)

//0549E3AF - 8B 7D 08              - mov edi,[ebp+08]
//0549E3B2 - C7 45 F8 00000000     - mov [ebp-08],00000000
// Kd.Stage:Bullets:OnShot+11
//0549E3B9 - 0FB6 47 25            - movzx eax,byte ptr [edi+25]
//0549E3BD - 85 C0                 - test eax,eax
//0549E3BF - 0F84 4D000000         - je 0549E412
//0549E3C5 - 8B 47 18              - mov eax,[edi+18]
//0549E3C8 - 89 45 F4              - mov [ebp-0C],eax
//0549E3CB - 8B 47 1C              - mov eax,[edi+1C]
aobscan(Bullets_searchedAOB, 0F B6 47 25 85 C0 * * * * * * 8B 47 18)

alloc(Bullets_newmem, 2048, Bullets_searchedAOB)
alloc(Bullets_temp1, 4, Bullets_searchedAOB)
alloc(Bullets_temp2, 4, Bullets_searchedAOB)
alloc(Bullets_temp3, 4, Bullets_searchedAOB)
alloc(Bullets_temp4, 4, Bullets_searchedAOB)
alloc(Bullets_temp5, 4, Bullets_searchedAOB)


Bullets_newmem:
mov [Bullets_temp1], eax
mov [Bullets_temp2], ebx
mov [Bullets_temp3], ecx
mov [Bullets_temp4], edx

cmp dword ptr [Bullets_update_enable], #0
je Bullets_update_exit
mov [Bullets_basepointer], edi
Bullets_update_exit:

cmp dword ptr [Bullets_ammoset_enable], #0
je Bullets_ammoset_exit
mov ebx, [edi+1c]
test ebx, ebx
je Bullets_ammoset_exit
mov ecx, [ebx+64]
mov [ebx+60], ecx
mov [edi+28], ecx
Bullets_ammoset_exit:

mov eax, [Bullets_temp1]
mov ebx, [Bullets_temp2]
mov ecx, [Bullets_temp3]
mov edx, [Bullets_temp4]


Bullets_originalcode:
readmem(Bullets_searchedAOB, 6)


Bullets_exit:
jmp Bullets_returnhere


Bullets_searchedAOB:
Bullets_savedAOB:
jmp Bullets_newmem
nop
Bullets_returnhere:


[DISABLE]
Bullets_savedAOB:
readmem(Bullets_originalcode, 6)

unregistersymbol(Bullets_originalcode)
unregistersymbol(Bullets_savedAOB)

dealloc(Bullets_newmem)
dealloc(Bullets_temp1)
dealloc(Bullets_temp2)
dealloc(Bullets_temp3)
dealloc(Bullets_temp4)
dealloc(Bullets_temp5)"""

