[[cheat]]
id = "stagemanager-base-address-scan-initialization-activate-this-first"
name = "StageManager Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(StageManager_basepointer)
