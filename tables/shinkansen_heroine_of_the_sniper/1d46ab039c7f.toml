dealloc(StageManager_kickset_enable)
dealloc(StageManager_timeset_enable)
dealloc(StageManager_missesset_enable)
dealloc(StageManager_retriesset_enable)"""

[[cheat]]
id = "stagemanager-base-address-scan-to-activate-play-level-to-update-play-level"
name = "StageManager Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(StageManager_savedAOB)
label(StageManager_returnhere)
label(StageManager_originalcode)
label(StageManager_exit)

label(StageManager_update_exit)
label(StageManager_invincibleset_exit)
label(StageManager_hpset_exit)
label(StageManager_noiseset_exit)
label(StageManager_breathset_exit)
label(StageManager_kickset_exit)
label(StageManager_timeset_exit)
label(StageManager_missesset_exit)
label(StageManager_retriesset_exit)

registersymbol(StageManager_originalcode)
registersymbol(StageManager_savedAOB)

//05488303 - 83 EC 18              - sub esp,18
//05488306 - 8B 45 08              - mov eax,[ebp+08]
// Kd.Stage:StageManager:Update+9
//05488309 - 0FB6 40 2C            - movzx eax,byte ptr [eax+2C]
//0548830D - 85 C0                 - test eax,eax
//0548830F - 74 21                 - je 05488332
//05488311 - 8B 45 08              - mov eax,[ebp+08]
//05488314 - 8B 40 18              - mov eax,[eax+18]
aobscan(StageManager_searchedAOB, 0F B6 40 2C 85 C0 74 21)

alloc(StageManager_newmem, 2048, StageManager_searchedAOB)
alloc(StageManager_temp1, 4, StageManager_searchedAOB)
alloc(StageManager_temp2, 4, StageManager_searchedAOB)
alloc(StageManager_temp3, 4, StageManager_searchedAOB)
alloc(StageManager_temp4, 4, StageManager_searchedAOB)
alloc(StageManager_temp5, 4, StageManager_searchedAOB)


StageManager_newmem:
mov [StageManager_temp1], eax
mov [StageManager_temp2], ebx
mov [StageManager_temp3], ecx
mov [StageManager_temp4], edx

cmp dword ptr [StageManager_update_enable], #0
je StageManager_update_exit
mov [StageManager_basepointer], eax
StageManager_update_exit:

cmp dword ptr [StageManager_invincibleset_enable], #0
je StageManager_invincibleset_exit
mov byte ptr [eax+2d], #1
mov ebx, [eax+10]
test ebx, ebx
je StageManager_invincibleset_exit
mov [ebx+4c], (float)99
StageManager_invincibleset_exit:

cmp dword ptr [StageManager_hpset_enable], #0
je StageManager_hpset_exit
mov ebx, [eax+10]
test ebx, ebx
je StageManager_hpset_exit
mov [ebx+44], #9
StageManager_hpset_exit:

cmp dword ptr [StageManager_noiseset_enable], #0
je StageManager_noiseset_exit
mov ebx, [eax+10]
test ebx, ebx
je StageManager_noiseset_exit
mov ebx, [ebx+10]
test ebx, ebx
je StageManager_noiseset_exit
mov [ebx+4c], (float)0
mov [ebx+50], (float)0
mov [ebx+9c], (float)0
mov [ebx+a0], (float)0
StageManager_noiseset_exit:

cmp dword ptr [StageManager_breathset_enable], #0
je StageManager_breathset_exit
mov ebx, [eax+10]
test ebx, ebx
je StageManager_breathset_exit
mov ebx, [ebx+10]
test ebx, ebx
je StageManager_breathset_exit
mov [ebx+ec], (float)0
StageManager_breathset_exit:

cmp dword ptr [StageManager_kickset_enable], #0
je StageManager_kickset_exit
mov ebx, [eax+10]
test ebx, ebx
je StageManager_kickset_exit
mov ebx, [ebx+1c]
test ebx, ebx
je StageManager_kickset_exit
mov [ebx+34], (float)0
StageManager_kickset_exit:

cmp dword ptr [StageManager_timeset_enable], #0
je StageManager_timeset_exit
mov ebx, [eax+18]
test ebx, ebx
je StageManager_timeset_exit
mov [ebx+1c], (float)0
StageManager_timeset_exit:

cmp dword ptr [StageManager_missesset_enable], #0
je StageManager_missesset_exit
mov ebx, [eax+18]
test ebx, ebx
je StageManager_missesset_exit
mov [ebx+c], #0
StageManager_missesset_exit:

cmp dword ptr [StageManager_retriesset_enable], #0
je StageManager_retriesset_exit
mov ebx, [eax+18]
test ebx, ebx
je StageManager_retriesset_exit
mov [ebx+18], #0
StageManager_retriesset_exit:

mov eax, [StageManager_temp1]
mov ebx, [StageManager_temp2]
mov ecx, [StageManager_temp3]
mov edx, [StageManager_temp4]


StageManager_originalcode:
readmem(StageManager_searchedAOB, 6)


StageManager_exit:
jmp StageManager_returnhere


StageManager_searchedAOB:
StageManager_savedAOB:
jmp StageManager_newmem
nop
StageManager_returnhere:


[DISABLE]
StageManager_savedAOB:
readmem(StageManager_originalcode, 6)

unregistersymbol(StageManager_originalcode)
unregistersymbol(StageManager_savedAOB)

dealloc(StageManager_newmem)
dealloc(StageManager_temp1)
dealloc(StageManager_temp2)
dealloc(StageManager_temp3)
dealloc(StageManager_temp4)
dealloc(StageManager_temp5)"""

