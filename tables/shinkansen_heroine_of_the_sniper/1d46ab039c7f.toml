alloc(StageManager_basepointer, 4)
alloc(StageManager_update_enable, 4)
alloc(StageManager_invincibleset_enable, 4)
alloc(StageManager_hpset_enable, 4)
alloc(StageManager_noiseset_enable, 4)
alloc(StageManager_breathset_enable, 4)
alloc(StageManager_kickset_enable, 4)
alloc(StageManager_timeset_enable, 4)
alloc(StageManager_missesset_enable, 4)
