[[cheat]]
id = "gameobject-manager-base-address-scan-initialization-activate-this-first"
name = "GAMEOBJECT_MANAGER Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GAMEOBJECT_MANAGER_basepointer)
registersymbol(GAMEOBJECT_MANAGER_update_enable)
registersymbol(GAMEOBJECT_MANAGER_set_enable)
registersymbol(GAMEOBJECT_MANAGER_combotimerset_enable)
registersymbol(GAMEOBJECT_MANAGER_skillpointsset_enable)

alloc(GAMEOBJECT_MANAGER_basepointer, 8)
alloc(GAMEOBJECT_MANAGER_update_enable, 4)
alloc(GAMEOBJECT_MANAGER_set_enable, 4)
alloc(GAMEOBJECT_MANAGER_combotimerset_enable, 4)
alloc(GAMEOBJECT_MANAGER_skillpointsset_enable, 4)


[DISABLE]
unregistersymbol(GAMEOBJECT_MANAGER_basepointer)
unregistersymbol(GAMEOBJECT_MANAGER_update_enable)
unregistersymbol(GAMEOBJECT_MANAGER_set_enable)
unregistersymbol(GAMEOBJECT_MANAGER_combotimerset_enable)
unregistersymbol(GAMEOBJECT_MANAGER_skillpointsset_enable)

dealloc(GAMEOBJECT_MANAGER_basepointer)
dealloc(GAMEOBJECT_MANAGER_update_enable)
dealloc(GAMEOBJECT_MANAGER_set_enable)
dealloc(GAMEOBJECT_MANAGER_combotimerset_enable)
dealloc(GAMEOBJECT_MANAGER_skillpointsset_enable)"""

[[cheat]]
id = "gameobject-manager-base-address-scan-to-activate-play-level-to-update-play-level"
name = "GAMEOBJECT_MANAGER Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GAMEOBJECT_MANAGER_savedAOB)
label(GAMEOBJECT_MANAGER_returnhere)
label(GAMEOBJECT_MANAGER_originalcode)
label(GAMEOBJECT_MANAGER_exit)

label(GAMEOBJECT_MANAGER_update_exit)
label(GAMEOBJECT_MANAGER_set_exit)
label(GAMEOBJECT_MANAGER_combotimerset_exit)
label(GAMEOBJECT_MANAGER_skillpointsset_exit)

registersymbol(GAMEOBJECT_MANAGER_savedAOB)

//0467A137 - 41 FF D3              - call r11d
//0467A13A - 48 83 C4 20           - add rsp,20
//0467A13E - 48 8B 04 25 403E7105  - mov rax,[05713E40] : [05732E60]
// INTERFACE_HUD:Update+536
//0467A146 - 48 8B C8              - mov rcx,rax
//0467A149 - 83 39 00              - cmp dword ptr [rcx],00
//0467A14C - 0FB6 40 40            - movzx eax,byte ptr [rax+40]
//0467A150 - 85 C0                 - test eax,eax
//0467A152 - 0F84 AB010000         - je 0467A303
//0467A158 - 0FB6 86 A2000000      - movzx eax,byte ptr [rsi+000000A2]
//0467A15F - 85 C0                 - test eax,eax
//0467A161 - 0F85 9C010000         - jne 0467A303
aobscan(GAMEOBJECT_MANAGER_searchedAOB, 48 8B C8 83 39 00 0F B6 40 40 85 C0 * * * * * * 0F B6 86 A2 00 00 00)

alloc(GAMEOBJECT_MANAGER_newmem, 2048, GAMEOBJECT_MANAGER_searchedAOB)
alloc(GAMEOBJECT_MANAGER_temp1, 8, GAMEOBJECT_MANAGER_searchedAOB)
alloc(GAMEOBJECT_MANAGER_temp2, 8, GAMEOBJECT_MANAGER_searchedAOB)


GAMEOBJECT_MANAGER_newmem:
mov [GAMEOBJECT_MANAGER_temp1], rbx
mov [GAMEOBJECT_MANAGER_temp2], rdx

movsxd rbx, [GAMEOBJECT_MANAGER_savedAOB-4]

cmp dword ptr [GAMEOBJECT_MANAGER_update_enable], #0
je GAMEOBJECT_MANAGER_update_exit
mov [GAMEOBJECT_MANAGER_basepointer], rbx
GAMEOBJECT_MANAGER_update_exit:

cmp dword ptr [GAMEOBJECT_MANAGER_set_enable], #0
je GAMEOBJECT_MANAGER_set_exit
GAMEOBJECT_MANAGER_set_exit:

cmp dword ptr [GAMEOBJECT_MANAGER_combotimerset_enable], #0
je GAMEOBJECT_MANAGER_combotimerset_exit
cmp qword ptr [rbx+8], #0
je GAMEOBJECT_MANAGER_combotimerset_exit
cmp dword ptr [rbx+8], #0
je GAMEOBJECT_MANAGER_combotimerset_exit
mov rdx, [rbx+8]
mov [rdx+6c], (float)0
GAMEOBJECT_MANAGER_combotimerset_exit:

cmp dword ptr [GAMEOBJECT_MANAGER_skillpointsset_enable], #0
je GAMEOBJECT_MANAGER_skillpointsset_exit
cmp qword ptr [rbx+58], #0
je GAMEOBJECT_MANAGER_skillpointsset_exit
cmp dword ptr [rbx+58], #0
je GAMEOBJECT_MANAGER_skillpointsset_exit
mov rdx, [rbx+58]
mov [rdx+d4], #999
GAMEOBJECT_MANAGER_skillpointsset_exit:

mov rbx, [GAMEOBJECT_MANAGER_temp1]
mov rdx, [GAMEOBJECT_MANAGER_temp2]


GAMEOBJECT_MANAGER_originalcode:
db 48 8B C8 83 39 00
//mov rcx,rax
//cmp dword ptr [rcx],00


GAMEOBJECT_MANAGER_exit:
jmp GAMEOBJECT_MANAGER_returnhere


GAMEOBJECT_MANAGER_searchedAOB:
GAMEOBJECT_MANAGER_savedAOB:
jmp GAMEOBJECT_MANAGER_newmem
nop
GAMEOBJECT_MANAGER_returnhere:


[DISABLE]
GAMEOBJECT_MANAGER_savedAOB:
db 48 8B C8 83 39 00
//mov rcx,rax
//cmp dword ptr [rcx],00

unregistersymbol(GAMEOBJECT_MANAGER_savedAOB)

dealloc(GAMEOBJECT_MANAGER_newmem)
dealloc(GAMEOBJECT_MANAGER_temp1)
dealloc(GAMEOBJECT_MANAGER_temp2)"""

