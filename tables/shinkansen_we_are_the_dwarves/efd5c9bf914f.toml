[[cheat]]
id = "characterstats-base-address-scan-initialization-activate-this-first"
name = "CharacterStats Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(CharacterStats_basepointer)
registersymbol(CharacterStats_update_enable)
registersymbol(CharacterStats_set_enable)
registersymbol(CharacterStats_hpset_enable)
registersymbol(CharacterStats_armorset_enable)
registersymbol(CharacterStats_damagebonusset_enable)
registersymbol(CharacterStats_speedsset_enable)

alloc(CharacterStats_basepointer, 8)
alloc(CharacterStats_update_enable, 4)
alloc(CharacterStats_set_enable, 4)
alloc(CharacterStats_hpset_enable, 4)
alloc(CharacterStats_armorset_enable, 4)
alloc(CharacterStats_damagebonusset_enable, 4)
alloc(CharacterStats_speedsset_enable, 4)


[DISABLE]
unregistersymbol(CharacterStats_basepointer)
unregistersymbol(CharacterStats_update_enable)
unregistersymbol(CharacterStats_set_enable)
unregistersymbol(CharacterStats_hpset_enable)
unregistersymbol(CharacterStats_armorset_enable)
unregistersymbol(CharacterStats_damagebonusset_enable)
unregistersymbol(CharacterStats_speedsset_enable)

dealloc(CharacterStats_basepointer)
dealloc(CharacterStats_update_enable)
dealloc(CharacterStats_set_enable)
dealloc(CharacterStats_hpset_enable)
dealloc(CharacterStats_armorset_enable)
dealloc(CharacterStats_damagebonusset_enable)
dealloc(CharacterStats_speedsset_enable)"""

[[cheat]]
id = "characterstats-base-address-scan-to-activate-load-level-to-update-play-level"
name = "CharacterStats Base Address Scan (To Activate: Load Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(CharacterStats_savedAOB)
label(CharacterStats_returnhere)
label(CharacterStats_originalcode)
label(CharacterStats_exit)

label(CharacterStats_update_exit)
label(CharacterStats_set_exit)
label(CharacterStats_hpset_exit)
label(CharacterStats_armorset_exit)
label(CharacterStats_damagebonusset_exit)
label(CharacterStats_speedsset_exit)

registersymbol(CharacterStats_savedAOB)

//2EF5DE08 - 48 8B F1              - mov rsi,rcx
//2EF5DE0B - 83 3E 00              - cmp dword ptr [rsi],00
// Assets.Code.Actors.Stats:CharacterStats:Uget_MaxHP+e
//2EF5DE0E - 48 8B 46 38           - mov rax,[rsi+38]
//2EF5DE12 - 33 C9                 - xor ecx,ecx
//2EF5DE14 - 48 63 C9              - movsxd  rcx,ecx
//2EF5DE17 - 39 48 18              - cmp [rax+18],ecx
//2EF5DE1A - 0F86 38000000         - jbe 2EF5DE58
//2EF5DE20 - 48 8D 44 C8 20        - lea rax,[rax+rcx*8+20]
//2EF5DE25 - 48 8B 00              - mov rax,[rax]
//2EF5DE28 - 48 8B C8              - mov rcx,rax
//2EF5DE2B - 83 39 00              - cmp dword ptr [rcx],00
//2EF5DE2E - F3 0F10 40 38         - movss xmm0,[rax+38]
//2EF5DE33 - F3 0F5A C0            - cvtss2sd xmm0,xmm0
aobscan(CharacterStats_searchedAOB, 48 8B 46 38 33 C9 48 63 C9 39 48 18 * * * * * * 48 8D 44 C8 20 48 8B 00 48 8B C8 83 39 00)

alloc(CharacterStats_newmem, 2048, CharacterStats_searchedAOB)
alloc(CharacterStats_temp1, 8, CharacterStats_searchedAOB)
alloc(CharacterStats_temp2, 8, CharacterStats_searchedAOB)


CharacterStats_newmem:
mov [CharacterStats_temp1], rbx
mov [CharacterStats_temp2], rdx

cmp dword ptr [CharacterStats_update_enable], #0
je CharacterStats_update_exit
mov [CharacterStats_basepointer], rsi
CharacterStats_update_exit:

cmp dword ptr [CharacterStats_set_enable], #0
je CharacterStats_set_exit
CharacterStats_set_exit:

cmp qword ptr [rsi+38], #0
je CharacterStats_speedsset_exit
cmp dword ptr [rsi+38], #0
je CharacterStats_speedsset_exit
mov rbx, [rsi+38]

cmp dword ptr [CharacterStats_hpset_enable], #0
je CharacterStats_hpset_exit
cmp qword ptr [rbx+20], #0
je CharacterStats_hpset_exit
cmp dword ptr [rbx+20], #0
je CharacterStats_hpset_exit
mov rdx, [rbx+20]
fld [rdx+38]
fst [rdx+28]
fst [rdx+2c]
fstp [rdx+34]
CharacterStats_hpset_exit:

cmp dword ptr [CharacterStats_armorset_enable], #0
je CharacterStats_armorset_exit
cmp qword ptr [rbx+38], #0
je CharacterStats_armorset_exit
cmp dword ptr [rbx+38], #0
je CharacterStats_armorset_exit
mov rdx, [rbx+38]
fld [rdx+38]
fst [rdx+28]
fst [rdx+2c]
fstp [rdx+34]
CharacterStats_armorset_exit:

cmp dword ptr [CharacterStats_damagebonusset_enable], #0
je CharacterStats_damagebonusset_exit
cmp qword ptr [rbx+40], #0
je CharacterStats_damagebonusset_exit
cmp dword ptr [rbx+40], #0
je CharacterStats_damagebonusset_exit
mov rdx, [rbx+40]
fld [rdx+38]
fst [rdx+28]
fst [rdx+2c]
fstp [rdx+34]
CharacterStats_damagebonusset_exit:

cmp dword ptr [CharacterStats_speedsset_enable], #0
je CharacterStats_speedsset_exit
cmp qword ptr [rbx+28], #0
je CharacterStats_speedsset_exit
cmp dword ptr [rbx+28], #0
je CharacterStats_speedsset_exit
mov rdx, [rbx+28]
fld [rdx+38]
fst [rdx+28]
fst [rdx+2c]
fstp [rdx+34]
cmp qword ptr [rbx+48], #0
je CharacterStats_speedsset_exit
cmp dword ptr [rbx+48], #0
je CharacterStats_speedsset_exit
mov rdx, [rbx+48]
fld [rdx+38]
fst [rdx+28]
fst [rdx+2c]
fstp [rdx+34]
CharacterStats_speedsset_exit:

mov rbx, [CharacterStats_temp1]
mov rdx, [CharacterStats_temp2]


CharacterStats_originalcode:
db 48 8B 46 38 33 C9
//mov rax,[rsi+38]
//xor ecx,ecx


CharacterStats_exit:
jmp CharacterStats_returnhere


CharacterStats_searchedAOB:
CharacterStats_savedAOB:
jmp CharacterStats_newmem
nop
CharacterStats_returnhere:


[DISABLE]
CharacterStats_savedAOB:
db 48 8B 46 38 33 C9
//mov rax,[rsi+38]
//xor ecx,ecx

unregistersymbol(CharacterStats_savedAOB)

dealloc(CharacterStats_newmem)
dealloc(CharacterStats_temp1)
dealloc(CharacterStats_temp2)"""

