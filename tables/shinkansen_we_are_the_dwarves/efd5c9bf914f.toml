//0C46E9B4 - 48 89 34 24           - mov [rsp],rsi
//0C46E9B8 - 48 8B F1              - mov rsi,rcx
// Assets.Code.Players:SuitCell:get_HP+b
//0C46E9BB - 0FB6 46 10            - movzx eax,byte ptr [rsi+10]
//0C46E9BF - 85 C0                 - test eax,eax
//0C46E9C1 - 74 0C                 - je 0C46E9CF
//0C46E9C3 - 66 0F57 C0            - xorpd xmm0,xmm0
//0C46E9C7 - F2 0F11 44 24 08      - movsd [rsp+08],xmm0
aobscan(SuitCell_searchedAOB, 0F B6 46 10 85 C0 74 0C)

alloc(SuitCell_newmem, 2048, SuitCell_searchedAOB)


SuitCell_newmem:
