cmp dword ptr [SuitCell_set_enable], #0
je SuitCell_set_exit
SuitCell_set_exit:

cmp dword ptr [SuitCell_hpset_enable], #0
je SuitCell_hpset_exit
fld [rsi+18]
fstp [rsi+14]
SuitCell_hpset_exit:

cmp dword ptr [SuitCell_armorset_enable], #0
je SuitCell_armorset_exit
mov [rsi+20], (float)9999999
SuitCell_armorset_exit:

cmp dword ptr [SuitCell_cooldownset_enable], #0
je SuitCell_cooldownset_exit
mov [rsi+28], (float)0.01
SuitCell_cooldownset_exit:

cmp dword ptr [SuitCell_accessoriesset_enable], #0
je SuitCell_accessoriesset_exit
mov byte ptr [rsi+1c], #1
mov byte ptr [rsi+2c], #1
mov byte ptr [rsi+2d], #1
mov byte ptr [rsi+2e], #1
SuitCell_accessoriesset_exit:


SuitCell_originalcode:
db 0F B6 46 10 85 C0
//movzx eax,byte ptr [rsi+10]
//test eax,eax


SuitCell_exit:
jmp SuitCell_returnhere


SuitCell_searchedAOB:
SuitCell_savedAOB:
jmp SuitCell_newmem
nop
SuitCell_returnhere:


[DISABLE]
SuitCell_savedAOB:
db 0F B6 46 10 85 C0
//movzx eax,byte ptr [rsi+10]
//test eax,eax

unregistersymbol(SuitCell_savedAOB)

dealloc(SuitCell_newmem)"""

