[[cheat]]
id = "activate-when-is-my-turn-only"
name = "Activate when is my turn only"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here

originalcode:
mov [esi],(int)0
sub eax,edi
pop edi

exit:
jmp returnhere

"GameAssembly.dll"+5CAB7C:
jmp newmem
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
"GameAssembly.dll"+5CAB7C:
mov [esi],eax
sub eax,edi
pop edi
//Alt: db 89 06 2B C7 5F"""

