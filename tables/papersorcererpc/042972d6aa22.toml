[[cheat]]
id = "gems-script-buy-or-sell-something"
name = "Gems Script (Buy Or Sell Something)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
define(MONEY,"PaperSorcererPC.exe")

[ENABLE]
alloc(Change,2048,MONEY)
label(gemsB)
label(gemsS)
label(returnhere)
label(returnhere2)
label(originalcode)
label(originalcode2)
registersymbol(Change)
//
label(Setme)
registersymbol(Setme)
// AOB
label(gems_aobB) // Buy
label(gems_aobS) // Sell
registersymbol(gems_aobB)
registersymbol(gems_aobS)
aobscan(aobB_gems,2B 4D 08 89 48 70 83) // Buy
aobscan(aobS_gems,03 4D 08 89 48 70 E8)// Sell

Change:

Setme:
dd 0

//----------------------Buy----------------------
gemsB:
cmp [Setme],0
jne originalcode
mov [Setme],eax
add [Setme],70


originalcode:
sub ecx,[ebp+08]
mov [eax+70],ecx
jmp returnhere
//----------------------Sell-----------------------
gemsS:
cmp [Setme],0
jne originalcode2
mov [Setme],eax
add [Setme],70

originalcode2:
add ecx,[ebp+08]
mov [eax+70],ecx
jmp returnhere2



// When Buy
aobB_gems:
gems_aobB:
jmp gemsB
nop
returnhere:

// When Sell
aobS_gems:
gems_aobS:
jmp gemsS
nop
returnhere2:


 
[DISABLE]
// Buy
gems_aobB:
db 2B 4D 08 89 48 70
// Sell
gems_aobS:
db 03 4D 08 89 48 70
unregistersymbol(gems_aobB)
unregistersymbol(gems_aobS)
unregistersymbol(Setme)
unregistersymbol(Change)
dealloc(Change)
// Buy
//sub ecx,[ebp+08]
//mov [eax+70],ecx
//Alt: db 2B 4D 08 89 48 70 - 83
// Sell
//add ecx,[ebp+08]
//mov [eax+70],ecx
//Alt: db 03 4D 08 89 48 70 - E8"""

