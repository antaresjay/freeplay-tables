[[cheat]]
id = "basic-stats-reader-enter-default-menu"
name = "Basic Stats Reader (Enter Default Menu)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(STATS,"PaperSorcererPC.exe")

[ENABLE]
alloc(Pointrs,$1000,STATS)
label(charbase)
label(returnhere)
label(originalcode)
registersymbol(Pointrs)
// Specific Char Section Here
label(char1CHT)
label(char1CEN)
label(char2CHT)
label(char2CEN)
label(char3CHT)
label(char3CEN)
label(char4CHT)
label(char4CEN)
//---------Where Ignored Cycles Go----------
label(Othercycle)
//-----------------AOB----------------------
label(aob_stats)
registersymbol(aob_stats)
aobscan(stats_aob,8B 40 30 89 45 C4 8D)
//--------------Cycle Only------------------
label(cycle)
registersymbol(cycle)
//----------Variables------------
label(chr1bht) // Sorcerer Health
label(chr1ben) // Sorcerer Energy
label(chr2bht) // Minion 1 Health
label(chr2ben) // Minion 1 Energy
label(chr3bht) // Minion 2 Health
label(chr3ben) // Minion 2 Energy
label(chr4bht) // Minion 3 Health
label(chr4ben) // Minion 3 Energy
registersymbol(chr1bht)
registersymbol(chr1ben)
registersymbol(chr2bht)
registersymbol(chr2ben)
registersymbol(chr3bht)
registersymbol(chr3ben)
registersymbol(chr4bht)
registersymbol(chr4ben)

Pointrs:

// Cycle Set/Reset
cycle:
dd 1
// Sorcerer Variables
chr1bht:
dd 0

chr1ben:
dd 0
// Character 2, First Minion
chr2bht:
dd 0

chr2ben:
dd 0
// Character 3, Second Minion
chr3bht:
dd 0

chr3ben:
dd 0
// Character 4, Third Minion
chr4bht:
dd 0

chr4ben:
dd 0


//-----------Check What It Should Do-----------
charbase:
cmp [cycle],0 // Disabled, Already Mapped
je originalcode
//----------To Advance But Ignore------------
cmp [cycle],2
je Othercycle
cmp [cycle],4
je Othercycle
cmp [cycle],6
je Othercycle
cmp [cycle],8
je Othercycle
cmp [cycle],A
je Othercycle
cmp [cycle],C
je Othercycle
cmp [cycle],E
je Othercycle
//-------------Sorcerer----------------------
cmp [cycle],1 // Sorcer Current Health
je char1CHT
cmp [cycle],3 // Sorcer Current Energy
je char1CEN
//--------Second Character, Minion 1---------
cmp [cycle],5 // Minion 1 Current Health
je char2CHT
cmp [cycle],7 // Minion 1 Current Energy
je char2CEN
//--------Third Character, Minion 2---------
cmp [cycle],9 // Minion 2 Current Health
je char3CHT
cmp [cycle],B // Minion 2 Current Energy
je char3CEN
//--------Fourth Character, Minion 3---------
cmp [cycle],D // Minion 3 Current Health
je char4CHT
cmp [cycle],F // Minion 3 Current Energy
je char4CEN

//------------Ignored Cycles--------------
Othercycle:
inc [cycle]
jmp originalcode

//----------Sorcerer, Current Health------
char1CHT:
mov [chr1bht],eax
add [chr1bht],30
inc [cycle]
// Orig, Quicker This Way
mov eax,[eax+30]
mov [ebp-3C],eax
jmp returnhere
//---------Sorcerer, Current Energy--------
char1CEN:
mov [chr1ben],eax
add [chr1ben],30
inc [cycle]
// Orig, Quicker This Way
mov eax,[eax+30]
mov [ebp-3C],eax
jmp returnhere
//------------Minion 1, Current Health----------
char2CHT:
mov [chr2bht],eax
add [chr2bht],30
inc [cycle]
// Orig, Quicker This Way
mov eax,[eax+30]
mov [ebp-3C],eax
jmp returnhere
//------------Minion 1, Current Energy----------
char2CEN:
mov [chr2ben],eax
add [chr2ben],30
inc [cycle]
// Orig, Quicker This Way
mov eax,[eax+30]
mov [ebp-3C],eax
jmp returnhere
//------------Minion 2, Current Health----------
char3CHT:
mov [chr3bht],eax
add [chr3bht],30
inc [cycle]
// Orig, Quicker This Way
mov eax,[eax+30]
mov [ebp-3C],eax
jmp returnhere
//------------Minion 2, Current Energy----------
char3CEN:
mov [chr3ben],eax
add [chr3ben],30
inc [cycle]
// Orig, Quicker This Way
mov eax,[eax+30]
mov [ebp-3C],eax
jmp returnhere
//------------Minion 3, Current Health----------
char4CHT:
mov [chr4bht],eax
add [chr4bht],30
inc [cycle]
// Orig, Quicker This Way
mov eax,[eax+30]
mov [ebp-3C],eax
jmp returnhere
//------------Minion 3, Current Energy----------
char4CEN:
mov [chr4ben],eax
add [chr4ben],30
mov [cycle],0
// Orig, Quicker This Way
mov eax,[eax+30]
mov [ebp-3C],eax
jmp returnhere


originalcode:
mov eax,[eax+30]
mov [ebp-3C],eax
jmp returnhere



stats_aob:
aob_stats:
jmp charbase
nop
returnhere:


 
 
[DISABLE]
aob_stats:
db 8B 40 30 89 45 C4
unregistersymbol(Pointrs)
unregistersymbol(cycle)
unregistersymbol(chr1bht)
unregistersymbol(chr1ben)
unregistersymbol(chr2bht)
unregistersymbol(chr2ben)
unregistersymbol(chr3bht)
unregistersymbol(chr3ben)
unregistersymbol(chr4bht)
unregistersymbol(chr4ben)
unregistersymbol(aob_stats)
dealloc(Pointrs)
//mov eax,[eax+30]
//mov [ebp-3C],eax
//Alt: db 8B 40 30 89 45 C4 - 8D 45 C4 83 EC 0C"""

