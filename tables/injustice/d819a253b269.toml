[[cheat]]
id = "log-fnv1-hashes"
name = "Log FNV1 hashes"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(FNV1Hasher_aob,85 D2 74 14 8B 89 AC 00 00 00)
registersymbol(FNV1Hasher_aob)

alloc(code,2048)
//places
label(LogHash)
label(LogHash_Return)
//data
label(FileName)
label(LogFormat)
label(LogLine)
label(DummyVariable)



FNV1Hasher_aob-5:
jmp LogHash
LogHash_Return:

code:
LogHash:
  pushad                    //save all registers
  push dword [esp+30]       //the hashed string
  push esi                  //the hash
  push LogFormat
  push LogLine
  call msvcrt.sprintf
  mov ebx,eax //store the length of LogLine in ebx
  add esp,10 //pop all sprintf's arguments
  //open logfile
  push 0
  push 80 //FILE_ATTRIBUTE_NORMAL
  push 4  //OPEN_ALWAYS
  push 0
  push 3 //FILE_SHARE_READ | FILE_SHARE_WRITE -> allow other programs to read and write
  push C //GENERIC_READ | GENERIC_WRITE
  push FileName
  call CreateFileA
  //move to its end
  push eax //save the file handle
  push 2 //FILE_END
  push 0
  push 0
  push eax
  call SetFilePointer
  mov eax,dword [esp] //restore the file handle
  //log the new line
  push 0
  push DummyVariable //lpNumberOfBytesWritten
  push ebx
  push LogLine
  push eax
  call WriteFile
  //close the file
  //pop eax //restore the file handle
  //push eax
  call CloseHandle
  popad

  //original code
  MOV EDX,DWORD [ECX+24]
  XOR EAX,EAX
jmp LogHash_Return


DummyVariable:
dd 0
FileName:
db 'FNV1Log.txt',00
LogFormat:
db '%.8X = %s',0d,0a,00
LogLine:

[DISABLE]
FNV1Hasher_aob-5:
MOV EDX,DWORD [ECX+24]
XOR EAX,EAX


unregistersymbol(FNV1Hasher_aob)
dealloc(code)"""

