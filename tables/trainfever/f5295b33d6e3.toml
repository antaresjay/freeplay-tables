id = "use-production-ratio"
name = "Use production ratio"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(NewMem,2048)
label(productionRatio)
REGISTERSYMBOL(productionRatio)

TrainFever.exe+8B444A:
jmp NewMem

NewMem:
// push xmm2
movss [productionRatio+16], xmm2
// push xmm3
movss [productionRatio+32], xmm3
movss xmm3, [productionRatio]
movss xmm2, [rax+04]
divss xmm2,xmm3
//divss xmm0,[rax+04]
divss xmm0,xmm2
//pop xmm3
movss xmm3, [productionRatio+32]
//pop xmm2
movss xmm2, [productionRatio+16]
addss xmm8,xmm7
movss [rbp-6C],xmm8
addss xmm9,xmm0
jmp TrainFever.exe+8B445F


productionRatio:
dd (float)2.0

[DISABLE]
TrainFever.exe+8B444A:
divss xmm0, [rax+04]
addss xmm8,xmm7
movss [rbp-6C],xmm8
addss xmm9,xmm0

dealloc(NewMem)
UNREGISTERSYMBOL(productionRatio)"""

