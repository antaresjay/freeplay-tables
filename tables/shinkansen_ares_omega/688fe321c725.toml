[[cheat]]
id = "varplayer-base-address-scan-initialization-activate-this-first"
name = "VarPlayer Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(VarPlayer_basepointer)
registersymbol(VarPlayer_update_enable)
registersymbol(VarPlayer_set_enable)
registersymbol(VarPlayer_healthshieldset_enable)
registersymbol(VarPlayer_creditsset_enable)
registersymbol(VarPlayer_skillpointsset_enable)
registersymbol(VarPlayer_inventoryset_enable)
registersymbol(VarPlayer_weaponset_enable)

alloc(VarPlayer_basepointer, 4)
alloc(VarPlayer_update_enable, 4)
alloc(VarPlayer_set_enable, 4)
alloc(VarPlayer_healthshieldset_enable, 4)
alloc(VarPlayer_creditsset_enable, 4)
alloc(VarPlayer_skillpointsset_enable, 4)
alloc(VarPlayer_inventoryset_enable, 4)
alloc(VarPlayer_weaponset_enable, 4)


[DISABLE]
unregistersymbol(VarPlayer_basepointer)
unregistersymbol(VarPlayer_update_enable)
unregistersymbol(VarPlayer_set_enable)
unregistersymbol(VarPlayer_healthshieldset_enable)
unregistersymbol(VarPlayer_creditsset_enable)
unregistersymbol(VarPlayer_skillpointsset_enable)
unregistersymbol(VarPlayer_inventoryset_enable)
unregistersymbol(VarPlayer_weaponset_enable)

dealloc(VarPlayer_basepointer)
dealloc(VarPlayer_update_enable)
dealloc(VarPlayer_set_enable)
dealloc(VarPlayer_healthshieldset_enable)
dealloc(VarPlayer_creditsset_enable)
dealloc(VarPlayer_skillpointsset_enable)
dealloc(VarPlayer_inventoryset_enable)
dealloc(VarPlayer_weaponset_enable)"""

[[cheat]]
id = "varplayer-base-address-scan-to-activate-play-level-to-update-play-level"
name = "VarPlayer Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(VarPlayer_savedAOB)
label(VarPlayer_returnhere)
label(VarPlayer_originalcode)
label(VarPlayer_exit)

label(VarPlayer_update_exit)
label(VarPlayer_set_exit)
label(VarPlayer_healthshieldset_exit)
label(VarPlayer_creditsset_exit)
label(VarPlayer_skillpointsset_exit)
label(VarPlayer_inventoryset_exit)
label(VarPlayer_weaponset_exit)

registersymbol(VarPlayer_savedAOB)

//18F34872 - C7 45 DC 00000000     - mov [ebp-24],00000000
//18F34879 - C7 45 E0 00000000     - mov [ebp-20],00000000
// VarPlayer:Update+18
//18F34880 - 8B 87 30010000        - mov eax,[edi+00000130]
//18F34886 - 85 C0                 - test eax,eax
//18F34888 - 7D 0A                 - jnl 18F34894
//18F3488A - C7 87 30010000 00000000 - mov [edi+00000130],00000000
//18F34894 - 8B 87 30010000        - mov eax,[edi+00000130]
//18F3489A - 8B 8F 34010000        - mov ecx,[edi+00000134]
aobscan(VarPlayer_searchedAOB, 8B 87 30 01 00 00 85 C0 * * C7 87 30 01 00 00 00 00 00 00)

alloc(VarPlayer_newmem, 2048, VarPlayer_searchedAOB)
alloc(VarPlayer_temp1, 4, VarPlayer_searchedAOB)
alloc(VarPlayer_temp2, 4, VarPlayer_searchedAOB)


VarPlayer_newmem:
mov [VarPlayer_temp1], ebx
mov [VarPlayer_temp2], edx

cmp dword ptr [VarPlayer_update_enable], #0
je VarPlayer_update_exit
mov [VarPlayer_basepointer], edi
VarPlayer_update_exit:

cmp dword ptr [VarPlayer_set_enable], #0
je VarPlayer_set_exit
VarPlayer_set_exit:

cmp dword ptr [VarPlayer_healthshieldset_enable], #0
je VarPlayer_healthshieldset_exit
mov edx, [edi+124]
mov [edi+11c], edx
mov [edi+120], edx
mov edx, [edi+134]
mov [edi+12c], edx
mov [edi+130], edx
VarPlayer_healthshieldset_exit:

cmp dword ptr [VarPlayer_creditsset_enable], #0
je VarPlayer_creditsset_exit
mov [edi+148], #9999999
mov [edi+14c], #9999999
mov [edi+150], #9999999
VarPlayer_creditsset_exit:

cmp dword ptr [VarPlayer_skillpointsset_enable], #0
je VarPlayer_skillpointsset_exit
mov [edi+154], #9999999
VarPlayer_skillpointsset_exit:

cmp dword ptr [VarPlayer_inventoryset_enable], #0
je VarPlayer_inventoryset_exit
cmp dword ptr [edi+3c], #0
je VarPlayer_inventoryset_exit
mov ebx, [edi+3c]
mov edx, [ebx+400]
mov [ebx+3fc], edx
mov [ebx+404], edx
mov edx, [ebx+410]
mov [ebx+414], edx
mov edx, [ebx+420]
mov [ebx+424], edx
mov edx, [ebx+458]
mov [ebx+428], edx
mov edx, [ebx+45c]
mov [ebx+42c], edx
mov edx, [ebx+460]
mov [ebx+430], edx
mov edx, [ebx+464]
mov [ebx+434], edx
mov edx, [ebx+468]
mov [ebx+438], edx
mov edx, [ebx+46c]
mov [ebx+43c], edx
mov edx, [ebx+470]
mov [ebx+440], edx
mov edx, [ebx+474]
mov [ebx+444], edx
mov edx, [ebx+478]
mov [ebx+448], edx
mov edx, [ebx+47c]
mov [ebx+44c], edx
mov edx, [ebx+480]
mov [ebx+450], edx
mov edx, [ebx+484]
mov [ebx+454], edx
VarPlayer_inventoryset_exit:

cmp dword ptr [VarPlayer_weaponset_enable], #0
je VarPlayer_weaponset_exit
cmp dword ptr [edi+3c], #0
je VarPlayer_weaponset_exit
mov ebx, [edi+3c]
mov [ebx+3cc], (float)0.05
mov [ebx+3d4], (float)100
mov [ebx+3d8], (float)100
mov [ebx+3e4], (float)100
mov [ebx+3e8], (float)100
mov [ebx+400], #100
VarPlayer_weaponset_exit:

mov ebx, [VarPlayer_temp1]
mov edx, [VarPlayer_temp2]


VarPlayer_originalcode:
db 8B 87 30 01 00 00
//mov eax,[edi+00000130]


VarPlayer_exit:
jmp VarPlayer_returnhere


VarPlayer_searchedAOB:
VarPlayer_savedAOB:
jmp VarPlayer_newmem
nop
VarPlayer_returnhere:


[DISABLE]
VarPlayer_savedAOB:
db 8B 87 30 01 00 00
//mov eax,[edi+00000130]

unregistersymbol(VarPlayer_savedAOB)

dealloc(VarPlayer_newmem)
dealloc(VarPlayer_temp1)
dealloc(VarPlayer_temp2)"""

