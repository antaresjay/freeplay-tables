type = "script"
source = """
{ Game   : I, Zombie.exe
  Date   : 2014-12-09
  Author : AikonCWD

  This script set timer to 0.01
  PERFECT TIME!
}

[ENABLE]

aobscan(INJECT1,D9 9B C0 01 00 00) // should be unique
alloc(newmem1,$1000)

label(code1)
label(return1)

newmem1:

code1:
  fstp dword ptr [ebx+000001C0]
  mov [ebx+000001C0],(float)0.1
  jmp return1

INJECT1:
  jmp code1
  nop
return1:
registersymbol(INJECT1)

[DISABLE]

INJECT1:
  db D9 9B C0 01 00 00

unregistersymbol(INJECT1)
dealloc(newmem1)

