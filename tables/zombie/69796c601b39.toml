[[cheat]]
id = "search-player-base-structure"
name = "Search Player Base Structure"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : I, Zombie.exe
  Version: 
  Date   : 2014-12-09
  Author : Usuario

  This script dumps all the zombie structure
}

[ENABLE]

aobscan(INJECT2,8B 46 4C 3B 46 50 7D) // should be unique
alloc(newmem2,$1000)

label(code2)
label(return2)
label(ENEMY)

globalalloc(pBase,4)

newmem2:

code2:
  mov eax,[esi+4C]
  cmp esi,edx
  je ENEMY
  mov [pBase],esi
  cmp eax,[esi+50]
  jmp return2

ENEMY:
  cmp eax,[esi+50]
  jmp return2

INJECT2:
  jmp code2
  nop
return2:
registersymbol(INJECT2)

[DISABLE]

INJECT2:
  db 8B 46 4C 3B 46 50

unregistersymbol(INJECT2)
dealloc(newmem2)
dealloc(pBase)

