[[cheat]]
id = "helo-inventory-generic-ammo-ctrl-numpad-2-use-missile-to-populate-values"
name = "Helo Inventory Generic Ammo (Ctrl + Numpad 2) {Use missile to populate values}"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : ClearedHot.exe
// Author            : ndck76
// Executable Version: 6000.0.58.57061
// Game Version      : v0.2.4 (Early Access)
// Script Date       : 2025-11-24


[ENABLE]

aobscanmodule(miss,GameAssembly.dll,418Bxxxx488Bxxxx85xx7Exx488B) //Cfinger.KAS.UI.UIDeviceSelectorPanel.Refresh
alloc(newmem,$1000,miss)
alloc(data2,8)
alloc(missbkp,8)
registersymbol(data2)
registersymbol(miss)
registersymbol(missbkp)
label(code)
label(return)

missbkp:
  readmem(miss,8)

newmem:
  mov [data2],r8

code:
  readmem(miss,8)
  jmp return

miss:
  jmp newmem
  nop 3
return:

[DISABLE]

miss:
  readmem(missbkp,8)

unregistersymbol(*)
dealloc(*)"""

