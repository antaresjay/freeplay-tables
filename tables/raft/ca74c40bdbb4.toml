[[cheat]]
id = "get-player"
name = "Get Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
define(address,Player:Update)
define(bytes,55 48 8B EC 48 81 EC 00 01 00 00 48 89 75 E0)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000)
registersymbol(Player)
label(code return Player)

newmem:
mov [Player],rcx
code:
  push rbp
  mov rbp,rsp
  sub rsp,00000100
  mov [rbp-20],rsi
  jmp return

Player:
dd 0


address:
  jmp far newmem
  nop
return:

[DISABLE]

address:
  db bytes
  unregistersymbol(*)
dealloc(*)"""
