[[cheat]]
id = "prepare-player-cheats"
name = "Prepare Player Cheats"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(cheats,Zombiesoup-Win64-Shipping.exe,48 8B 01 F2 0F 11 44 24 40 FF 90 00 07 00 00) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(enrgyrr)
label(currencyrr)
label(grenadesrr)
label(ammunitionrr)
label(ammunitionoffrr)
label(gundrr)
label(gundoffrr)
label(meleedrr)
label(meleedoffrr)

label(ppdouglas)
registersymbol(ppdouglas)

label(hpdouglas)
registersymbol(hpdouglas)

label(energydouglas)
registersymbol(energydouglas)

label(moneydouglas)
