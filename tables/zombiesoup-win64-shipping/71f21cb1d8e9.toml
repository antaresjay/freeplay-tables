label(meleeddouglas)
registersymbol(meleeddouglas)

newmem:
  push rbx

  mov [ppdouglas], rcx

  mov rbx, [rcx+240]
  test rbx,rbx
  je code

  cmp dword ptr [hpdouglas], 1
  jne enrgyrr

  fld dword ptr [rcx+77C]
  fstp dword ptr [rbx+33C]

enrgyrr:
  cmp dword ptr [energydouglas], 1
  jne currencyrr

  fld dword ptr [rcx+788]
  fstp dword ptr [rbx+340]

currencyrr:
  cmp dword ptr [moneydouglas], 1
  jne grenadesrr

  mov [rbx+3C0], #10000000

grenadesrr:
  cmp dword ptr [grenadedouglas], 1
  jne ammunitionrr

  fld dword ptr [rbx+344]
  fstp dword ptr [rbx+348]

ammunitionrr:
  mov rbx, [rcx+630]
  test rbx, rbx
  je code

  cmp dword ptr [ammunitiondouglas], 1
  jne ammunitionoffrr

  mov byte ptr [rbx+388], 1

ammunitionoffrr:
  cmp dword ptr [ammunitiondouglas], 2
  jne gundrr

  mov byte ptr [rbx+388], 0
  mov [ammunitiondouglas], 0

gundrr:
  cmp dword ptr [gunddouglas], 1
  jne gundoffrr

  mov byte ptr [rbx+389], 1

gundoffrr:
  cmp dword ptr [gunddouglas], 2
  jne meleedrr

  mov byte ptr [rbx+389], 0
  mov [gunddouglas], 0

meleedrr:
  mov rbx, [rcx+638]
  test rbx,rbx
  je code

  cmp dword ptr [meleeddouglas], 1
  jne meleedoffrr

  mov byte ptr [rbx+389], 1

meleedoffrr:
  cmp dword ptr [meleeddouglas], 2
  jne code

  mov [meleeddouglas], 0
  mov byte ptr [rbx+389], 0

code:
  pop rbx

  mov rax,[rcx]
  movsd [rsp+40],xmm0
  call qword ptr [rax+00000700]
  jmp return

ppdouglas:
dq 0

hpdouglas:
dd 0

energydouglas:
dd 0

moneydouglas:
dd 0

grenadedouglas:
dd 0

ammunitiondouglas:
dd 0

gunddouglas:
dd 0

meleeddouglas:
dd 0

cheats:
  jmp far newmem
  nop
return:
registersymbol(cheats)

[DISABLE]

cheats:
