[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(health_aob,GameAssembly.dll,8B 43 78 83 F8 02 74) // should be unique
alloc(newmem,$1000,health_aob)

label(code)
label(return)

newmem:

code:
  push 3e8
  fild [rsp]

  fstp [rbx+6C]
 add rsp,8
  mov eax,[rbx+78]
  cmp eax,02
  jmp return

health_aob:
  jmp newmem
  nop
return:
registersymbol(health_aob)

[DISABLE]

health_aob:
  db 8B 43 78 83 F8 02

unregistersymbol(health_aob)
dealloc(newmem)"""

