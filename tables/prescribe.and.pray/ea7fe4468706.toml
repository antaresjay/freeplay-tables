[[cheat]]
id = "calm"
name = "∞ Calm"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,Prescribe.and.Pray.exe,F2 0F 11 07 66 0F 2E 13 7A 17 75 15)
alloc(newmem,1024,INJECT)

label(code)
label(return)
label(value9995)
label(value10000)

newmem:
  // old value must be exactly 10000
  ucomisd xmm2,[value10000]
  jne code
  jp code

  // new value must be exactly 9995
  ucomisd xmm0,[value9995]
  jne code
  jp code

  // force it back to 10000
  movsd xmm0,[value10000]

code:
  movsd [rdi],xmm0
  ucomisd xmm2,[rbx]
  jmp return

align 8
value9995:
  dq (double)9995.0
value10000:
  dq (double)10000.0

INJECT:
  jmp newmem
  nop 3
return:

[DISABLE]

INJECT:
  db F2 0F 11 07 66 0F 2E 13

dealloc(newmem)"""
