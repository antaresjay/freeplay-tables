// Author: SenaBlue
[ENABLE]


AobScanModule(xmasdnbnlb,Escape the Underground.exe,8B 00 5F 5E 5B 8B 4D F4 64 89 0D 00 00 00 00 8B E5 5D C2 04 00 8B)
AobScanModule(jngjfsealr,Escape the Underground.exe,F2 0F 10 01 F2 0F 11 47 F0)
RegisterSymbol(xmasdnbnlb)
RegisterSymbol(jngjfsealr)
Alloc(nygejuuhri,128)
Alloc(msadtsasnp,128)
Label(jrkcpwvtxs)
Label(sbfoxkqrqy)
Label(aywtktchdz)
Label(wypkmxyrrv)
GlobalAlloc(sgwqorbsge,4)
GlobalAlloc(ywjchbqcya,4)


nygejuuhri:
  pushf
  cmp [eax+CC],0x0
  je jrkcpwvtxs
  cmp [eax+D0],0x0
  je jrkcpwvtxs
  mov [sgwqorbsge],eax
jrkcpwvtxs:
  popf
  mov eax,[eax]
  pop edi
  pop esi
  pop ebx
  jmp sbfoxkqrqy
xmasdnbnlb:
  jmp nygejuuhri
sbfoxkqrqy:


msadtsasnp:
  pushf
  cmp byte ptr [ecx+7B8],(byte)6
  jne aywtktchdz
  cmp byte ptr [ecx+7E8],(byte)6
  jne aywtktchdz
  popf
  mov [ywjchbqcya],ecx
  movsd xmm0,[ecx]
  movsd [edi-10],xmm0
  jmp wypkmxyrrv
aywtktchdz:
