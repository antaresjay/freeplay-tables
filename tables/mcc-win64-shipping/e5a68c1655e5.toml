[[cheat]]
id = "special-weapons"
name = "special weapons"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game   : mcc-win64-shipping.exe
  Version: 1.0
  Date   : 2024-02-28
  Author : Gear2

  Usable special weapons.
  Energy Sword.
  Fuel Rod Gun.
}

[ENABLE]

aobscanmodule(mod1,halo1.dll,0F BE 09 FF 15 91 47 CB 00)
alloc(newmem1,$1024,mod1)

label(code1)
label(specialWeapon)
label(return1)

newmem1:
  movsx ecx,byte ptr [rcx]
  cmp ecx,66
  je specialWeapon
  call qword ptr [halo1.dll+17521D8]
  jmp return1

specialWeapon:
  mov cl,70
  call qword ptr [halo1.dll+17521D8]
  jmp return1

code1:
  movsx ecx,byte ptr [rcx]
  call qword ptr [halo1.dll+17521D8]
  jmp return1

mod1:
  jmp newmem1
  nop 4
return1:
registersymbol(mod1)

aobscanmodule(mod2,halo1.dll,0F BE 0C 2E FF 15 64 47 CB 00)
alloc(newmem2,$1024,mod2)

label(code2)
label(fuelRod)
label(energySword)
label(return2)

newmem2:
  movsx ecx,byte ptr [rsi+rbp]
  cmp ecx,72
  je fuelRod
  cmp ecx,62
  je energySword
  call qword ptr [halo1.dll+17521D8]
  jmp return2

fuelRod:
  mov cl,70
  call qword ptr [halo1.dll+17521D8]
  jmp return2

energySword:
  mov cl,70
  call qword ptr [halo1.dll+17521D8]
  jmp return2

code2:
  movsx ecx,byte ptr [rsi+rbp]
  call qword ptr [halo1.dll+17521D8]
  jmp return2

mod2:
  jmp newmem2
  nop 5
return2:
registersymbol(mod2)

[DISABLE]

mod1:
  db 0F BE 09 FF 15 91 47 CB 00

mod2:
  db 0F BE 0C 2E FF 15 64 47 CB 00

unregistersymbol(*)
dealloc(*)"""

