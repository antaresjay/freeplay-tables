[[cheat]]
id = "activate"
name = "Activate"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(base,2048)
registersymbol(base)
alloc(player,2048)
registersymbol(player)
alloc(p_vehicle,2048)
registersymbol(p_vehicle)
alloc(p_weapon,2048)
registersymbol(p_weapon)
alloc(v_weapon,2048)
registersymbol(v_weapon)

base:
dd 0

player:
dd FFFFFFFF

player+8:
dd 0

player+10:
dd 0

player+18:
dd FFFFFFFF

p_vehicle:
dd FFFFFFFF

p_vehicle+8:
dd 0

p_vehicle+10:
dd 0

p_vehicle+18:
dd FFFFFFFF

p_weapon:
dd FFFFFFFF

p_weapon+8:
dd FFFFFFFF

p_weapon+10:
dd FFFFFFFF

p_weapon+18:
dd FFFFFFFF

v_weapon:
