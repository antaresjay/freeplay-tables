v_weapon+18:
dd FFFFFFFF

aobscanmodule(activate,haloreach.dll,8B FE 65) // should be unique
registersymbol(activate)
alloc(newmem,2048,activate)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
push rax
push rbx
push rcx
mov rax,gs:[00000058]
mov rax,[rax+rbp*8]
mov rbx,[rax+8]
mov rbx,[rbx+50]
mov [base],rbx
mov rax,[rax+168]
xor rbx,rbx
mov bx,si
mov bx,[rax+rbx*4+4]
cmp bx,-1
je originalcode
mov bx,[rax+rbx*4+74]
cmp bx,-1
je originalcode
mov eax,[rax+rbx*4+14]
cmp eax,-1
je originalcode
mov [player],eax
xor rbx,rbx
mov bx,[player]
lea rbx,[rbx+rbx*2]
mov rax,[base]
mov rax,[rax+rbx*8+10]
mov [player+8],rax
movsx rbx,word ptr [rax+18A]
add rax,rbx
mov [player+10],rax
mov rax,[player+8]
mov eax,[rax+1CC]
mov [player+18],eax
mov rax,[player+8]
mov eax,[rax+14]
cmp eax,-1
je no_vehicle
jmp vehicle

no_vehicle:
mov [p_vehicle],FFFFFFFF
mov [p_vehicle+8],0
mov [p_vehicle+10],0
mov [p_vehicle+18],FFFFFFFF
mov [v_weapon],FFFFFFFF
mov [v_weapon+8],FFFFFFFF
mov [v_weapon+10],FFFFFFFF
mov [v_weapon+18],FFFFFFFF
xor rbx,rbx
mov rax,[player+8]
jmp player_weapon

vehicle:
mov [p_vehicle],eax
mov rax,[base]
xor rbx,rbx
mov bx,[p_vehicle]
lea rbx,[rbx+rbx*2]
mov rax,[rax+rbx*8+10]
movsx rbx,word ptr [rax+18A]
mov [p_vehicle+8],rax
add rax,rbx
mov [p_vehicle+10],rax
mov rax,[p_vehicle+8]
mov eax,[rax+1CC]
mov [p_vehicle+18],eax
xor rbx,rbx
mov rax,[p_vehicle+8]
jmp vehicle_weapon

vehicle_weapon:
cmp rbx,3
jg vehicle_weapon_exit
mov ecx,[rax+rbx*4+350]
lea rax,[v_weapon]
mov [rax+rbx*8],ecx
add rbx,1
mov rax,[p_vehicle+8]
jmp vehicle_weapon
vehicle_weapon_exit:
xor rbx,rbx
mov rax,[player+8]
jmp player_weapon

player_weapon:
cmp rbx,3
jg exit
mov ecx,[rax+rbx*4+350]
lea rax,[p_weapon]
mov [rax+rbx*8],ecx
add rbx,1
mov rax,[player+8]
jmp player_weapon

originalcode:
mov [player],FFFFFFFF
mov [player+8],0
