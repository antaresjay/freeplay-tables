[[cheat]]
id = "flight"
name = "Flight"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(Flight,halo1.dll,F2 0F 11 02 8B 47 08 89 42 08 48)
alloc(n_Flight,$1000,Flight)
label(c_Flight)
label(r_Flight)
label(FlySpeed)

label(Maybe_Down)
label(High)
label(Down)
label(Maybe_Ahead)
label(Ahead)
label(Maybe_Behind)
label(Behind)
label(Maybe_Right)
label(Right)
label(Maybe_Left)
label(Left)
label(_skip_ahead)
label(_skip_behind)
label(_skip_right)
label(_skip_left)
label(End ForegroundPID StoredPID)

n_Flight:
  cmp qword ptr [Player], 0
  je c_Flight

  push rax
  mov rax,[Player]
  add rax,18
  cmp rdx,rax
  pop rax
  jne c_Flight

  push rbx
  push r8
  push r9
  push r10
  push r11
  push rcx
  push rdx
  push rax
  mov rbx,rsp
  and rsp,-10
  sub rsp,20

  mov eax,[StoredPID]
  test eax,eax
  jne pid_already_stored
  call GetCurrentProcessId
  mov [StoredPID],eax

pid_already_stored:
  call GetForegroundWindow
  test rax,rax
  je skip_all_keys

  mov rcx,rax
  lea rdx,[ForegroundPID]
  call GetWindowThreadProcessId

  mov eax,[ForegroundPID]
  cmp eax,[StoredPID]
  jne skip_all_keys

  mov rsp,rbx
  pop rax
  pop rdx
  pop rcx
  pop r11
  pop r10
  pop r9
  pop r8
  pop rbx
  jmp check_keys


skip_all_keys:
  mov rsp,rbx
  pop rax
  pop rdx
  pop rcx
  pop r11
  pop r10
  pop r9
  pop r8
  pop rbx
  jmp c_Flight


check_keys:
  push rbx
  push r8
  push r9
  push r10
  push r11
  push rcx
  push rdx
  push rax          // Sécurité RAX
  mov rbx,rsp
  and rsp,-10
  sub rsp,20
  mov ecx,20        // Espace
  call GetAsyncKeyState
  mov rsp,rbx
  test ax,8000
  pop rax           // Restauration RAX
  pop rdx
  pop rcx
  pop r11
  pop r10
  pop r9
  pop r8
  pop rbx
  je Maybe_Down

High:
  push rdx
  mov rdx,[Player]
  movss xmm1,[FlySpeed]
  movss xmm2,[rdx+20]
  addss xmm2,xmm1
  movss [rdx+20],xmm2
  pop rdx
  // Pas de saut ici, on continue vers la touche Ctrl

Maybe_Down:
  // --- CTRL (DESCENDRE) ---
  push rbx
  push r8
  push r9
  push r10
  push r11
  push rcx
  push rdx
  push rax
  mov rbx,rsp
  and rsp,-10
  sub rsp,20
  mov ecx,11        // Ctrl (A2 pour Ctrl Gauche si besoin)
  call GetAsyncKeyState
  mov rsp,rbx
  test ax,8000
  pop rax
  pop rdx
  pop rcx
  pop r11
  pop r10
  pop r9
  pop r8
  pop rbx
  je Maybe_Ahead

Down:
  push rdx
  mov rdx,[Player]
  movss xmm1,[FlySpeed]
  movss xmm2,[rdx+20]
  subss xmm2,xmm1
  movss [rdx+20],xmm2
  pop rdx

Maybe_Ahead:
  // --- Z (AVANCER) ---
  push rbx
  push r8
  push r9
  push r10
  push r11
  push rcx
  push rdx
  push rax
  mov rbx,rsp
  and rsp,-10
  sub rsp,20
  mov ecx,5A        // Z
  call GetAsyncKeyState
  mov rsp,rbx
  test ax,8000
  pop rax
  pop rdx
  pop rcx
  pop r11
  pop r10
  pop r9
  pop r8
  pop rbx
  je Maybe_Behind

Ahead:
  push rdx
  push rax
  mov rdx,[Player]
  mov rax,[V_Angles]
  test rax,rax
  je _skip_ahead

  // Axe Z (Hauteur via Pitch)
  fld dword ptr [rax+0C]
  fsin
  fmul dword ptr [FlySpeed]
  fadd dword ptr [rdx+20]
  fstp dword ptr [rdx+20]

  // Axes Y et X (Yaw)
  fld dword ptr [rax+8]
  fsincos
  fmul dword ptr [FlySpeed]
  fxch st(1)
  fmul dword ptr [FlySpeed]
  fadd dword ptr [rdx+1C]
  fstp dword ptr [rdx+1C]
  fadd dword ptr [rdx+18]
  fstp dword ptr [rdx+18]

_skip_ahead:
  pop rax
  pop rdx

Maybe_Behind:
  // --- S (RECULER) ---
  push rbx
  push r8
  push r9
  push r10
  push r11
  push rcx
  push rdx
  push rax
  mov rbx,rsp
  and rsp,-10
  sub rsp,20
  mov ecx,53        // S
  call GetAsyncKeyState
  mov rsp,rbx
  test ax,8000
  pop rax
  pop rdx
  pop rcx
  pop r11
  pop r10
  pop r9
  pop r8
  pop rbx
  je Maybe_Right

Behind:
  push rdx
  push rax
  mov rdx,[Player]
  mov rax,[V_Angles]
  test rax,rax
  je _skip_behind

  // Axe Z (Hauteur)
  fld dword ptr [rax+0C]
  fsin
  fmul dword ptr [FlySpeed]
  fchs
  fadd dword ptr [rdx+20]
  fstp dword ptr [rdx+20]

  // Axes Y et X
  fld dword ptr [rax+8]
  fsincos
  fmul dword ptr [FlySpeed]
  fchs
  fxch st(1)
  fmul dword ptr [FlySpeed]
  fchs
  fadd dword ptr [rdx+1C]
  fstp dword ptr [rdx+1C]
  fadd dword ptr [rdx+18]
  fstp dword ptr [rdx+18]

_skip_behind:
  pop rax
  pop rdx

Maybe_Right:
  // --- D (DROITE) ---
  push rbx
  push r8
  push r9
  push r10
  push r11
  push rcx
  push rdx
  push rax
  mov rbx,rsp
  and rsp,-10
  sub rsp,20
  mov ecx,44        // D
  call GetAsyncKeyState
  mov rsp,rbx
  test ax,8000
  pop rax
  pop rdx
  pop rcx
  pop r11
  pop r10
  pop r9
  pop r8
  pop rbx
  je Maybe_Left

Right:
  push rdx
  push rax
  mov rdx,[Player]
  mov rax,[V_Angles]
  test rax,rax
  je _skip_right

  fld dword ptr [rax+8]
  fsincos
  fmul dword ptr [FlySpeed]
  fchs
  fxch st(1)
  fmul dword ptr [FlySpeed]
  fadd dword ptr [rdx+18]
  fstp dword ptr [rdx+18]
  fadd dword ptr [rdx+1C]
  fstp dword ptr [rdx+1C]

_skip_right:
  pop rax
  pop rdx

Maybe_Left:
  // --- Q (GAUCHE) ---
  push rbx
  push r8
  push r9
  push r10
  push r11
  push rcx
  push rdx
  push rax
  mov rbx,rsp
  and rsp,-10
  sub rsp,20
  mov ecx,51        // Q
  call GetAsyncKeyState
  mov rsp,rbx
  test ax,8000
  pop rax
  pop rdx
  pop rcx
  pop r11
  pop r10
  pop r9
  pop r8
  pop rbx
  je End

Left:
  push rdx
  push rax
  mov rdx,[Player]
  mov rax,[V_Angles]
  test rax,rax
  je _skip_left

  fld dword ptr [rax+8]
  fsincos
  fmul dword ptr [FlySpeed]
  fxch st(1)
  fmul dword ptr [FlySpeed]
  fchs
  fadd dword ptr [rdx+18]
  fstp dword ptr [rdx+18]
  fadd dword ptr [rdx+1C]
  fstp dword ptr [rdx+1C]

_skip_left:
  pop rax
  pop rdx

End:
  // Seule instruction originale requise si le vol est actif
  mov eax,[rdi+08]
  jmp r_Flight

c_Flight:
  // Code original standard (quand le vol est inactif)
  movsd [rdx],xmm0
  mov eax,[rdi+08]
  jmp r_Flight

FlySpeed:
  dd (float)1.5

ForegroundPID:
  dq 0

StoredPID:
  dq 0

Flight:
  jmp n_Flight
  nop 2
r_Flight:

