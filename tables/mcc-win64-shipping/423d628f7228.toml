name = "activeFlag_Godmode_y_Damage_Shields_Multiplier"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(Shield_Damage_Multiplier,halo1.dll,F3 0F 5C CA F3 41 0F 11 0E) // should be unique
alloc(n_Shield_Damage_Multiplier,$1000,Shield_Damage_Multiplier)
alloc(Lockness,8)
alloc(LeiaOrgana,8)
alloc(Luke_Skywalker,8)
alloc(Ctsm_Value_Shields,8)
label(c_Shield_Damage_Multiplier)
label(r_Shield_Damage_Multiplier)

n_Shield_Damage_Multiplier:
  cmp byte ptr [LeiaOrgana],1 //flag damage multiplier for shields
  jne godmode_Shields
  cmp [Player],0
  je c_Shield_Damage_Multiplier
  push rax
  mov rax,[Player]
  add rax,A0 //shields offset
  cmp r14,rax
  pop rax
  je Player_Damage
  cmp byte ptr [r14+1e0],4
  je Covenant_Damage
  jmp godmode_Shields

Player_Damage:
  cmp byte ptr [Lockness+1],1
  jne @f
  mulss xmm2,[Ctsm_Value_Shields+4]
  jmp godmode_Shields

@@:
  cmp byte ptr [Lockness+2],1
  jne godmode_Shields
  divss xmm2,[Ctsm_Value_Shields+8]
  jmp godmode_Shields

Covenant_Damage:
  cmp byte ptr [Lockness+3],1
  jne @f
  mulss xmm2,[Ctsm_Value_Shields+c]
  jmp godmode_Shields

@@:
  cmp byte ptr [Lockness+4],1
  jne godmode_Shields
  divss xmm2,[Ctsm_Value_Shields+10]
  jmp godmode_Shields

godmode_Shields:
  cmp byte ptr [Luke_Skywalker],1
  jne c_Shield_Damage_Multiplier
  cmp [Player],0
  je c_Shield_Damage_Multiplier
  push rax
  mov rax,[Player]
  add rax,A0 //shields offset
  cmp r14,rax
  pop rax
  je set_godmode_Shields_Player
  cmp byte ptr [r14+1e0],4
  je set_godmode_Shields_Covenant
  jmp c_Shield_Damage_Multiplier

set_godmode_Shields_Player:
  cmp byte ptr [Lockness+5],1
  jne @f
  jmp r_Shield_Damage_Multiplier

@@:
  cmp byte ptr [Lockness+6],1
  jne c_Shield_Damage_Multiplier
  xorpd xmm1,xmm1
  jmp c_Shield_Damage_Multiplier

set_godmode_Shields_Covenant:
  cmp byte ptr [Lockness+7],1
  jne @f
  jmp r_Shield_Damage_Multiplier

@@:
  cmp byte ptr [Lockness+8],1
  jne c_Shield_Damage_Multiplier
  xorpd xmm1,xmm1
  jmp c_Shield_Damage_Multiplier

c_Shield_Damage_Multiplier:
  subss xmm1,xmm2
  movss [r14],xmm1
  jmp r_Shield_Damage_Multiplier

Ctsm_Value_Shields:
dd (float)3
dd (float)3
dd (float)3
dd (float)3
dd (float)3
dd (float)3
dd (float)3

Shield_Damage_Multiplier:
  jmp n_Shield_Damage_Multiplier
  nop 4
r_Shield_Damage_Multiplier:
registersymbol(Shield_Damage_Multiplier Lockness Ctsm_Value_Shields LeiaOrgana Luke_Skywalker)

[DISABLE]

Shield_Damage_Multiplier:
  db F3 0F 5C CA F3 41 0F 11 0E

unregistersymbol(*)
dealloc(*)

{
// ORIGINAL CODE - INJECTION POINT: halo1.dll+BA0475
}"""

