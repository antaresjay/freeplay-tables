type = "script"
source = """
// Game Executable   : Hood Story Kaito Yamazaki.exe
// Author            : ndck76
// Executable Version: 2021.3.38.12197
// Game Version      : v1.00
// Script Date       : 2024-06-04


[ENABLE]

aobscanmodule(special,GameAssembly.dll,F3xxxxxxxx488Bxxxxxx4883xxxxC3E8xxxxxxxxxxxxxxxxxxxx4889) //UnitAnimator.AddSpecial
alloc(newmem,$1000,special)
alloc(data3,8)
alloc(specialbkp,5)
registersymbol(data3)
registersymbol(special)
registersymbol(specialbkp)
label(code)
label(return)

specialbkp:
  readmem(special,5)

newmem:
  mov [data3],rbx

code:
  readmem(special,5)
  jmp return

special:
  jmp newmem
return:

[DISABLE]

special:
  readmem(specialbkp,5)

unregistersymbol(*)
dealloc(*)"""

