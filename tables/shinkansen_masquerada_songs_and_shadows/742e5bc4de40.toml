[[cheat]]
id = "objectsimpleunit-base-address-scan-initialization-activate-this-first"
name = "ObjectSimpleUnit Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(ObjectSimpleUnit_basepointer)
registersymbol(ObjectSimpleUnit_update_enable)
registersymbol(ObjectSimpleUnit_update_value)
registersymbol(ObjectSimpleUnit_set_enable)
registersymbol(ObjectSimpleUnit_healthset_enable)
registersymbol(ObjectSimpleUnit_foicusset_enable)
registersymbol(ObjectSimpleUnit_maskset_enable)
registersymbol(ObjectSimpleUnit_speedset_enable)
registersymbol(ObjectSimpleUnit_statsset_enable)

alloc(ObjectSimpleUnit_basepointer, 4)
alloc(ObjectSimpleUnit_update_enable, 4)
alloc(ObjectSimpleUnit_update_value, 4)
alloc(ObjectSimpleUnit_set_enable, 4)
alloc(ObjectSimpleUnit_healthset_enable, 4)
alloc(ObjectSimpleUnit_foicusset_enable, 4)
alloc(ObjectSimpleUnit_maskset_enable, 4)
alloc(ObjectSimpleUnit_speedset_enable, 4)
alloc(ObjectSimpleUnit_statsset_enable, 4)

ObjectSimpleUnit_update_value:
dd #0


[DISABLE]
unregistersymbol(ObjectSimpleUnit_basepointer)
unregistersymbol(ObjectSimpleUnit_update_enable)
unregistersymbol(ObjectSimpleUnit_update_value)
unregistersymbol(ObjectSimpleUnit_set_enable)
unregistersymbol(ObjectSimpleUnit_healthset_enable)
unregistersymbol(ObjectSimpleUnit_foicusset_enable)
unregistersymbol(ObjectSimpleUnit_maskset_enable)
unregistersymbol(ObjectSimpleUnit_speedset_enable)
unregistersymbol(ObjectSimpleUnit_statsset_enable)

dealloc(ObjectSimpleUnit_basepointer)
dealloc(ObjectSimpleUnit_update_enable)
dealloc(ObjectSimpleUnit_update_value)
dealloc(ObjectSimpleUnit_set_enable)
dealloc(ObjectSimpleUnit_healthset_enable)
dealloc(ObjectSimpleUnit_foicusset_enable)
dealloc(ObjectSimpleUnit_maskset_enable)
dealloc(ObjectSimpleUnit_speedset_enable)
dealloc(ObjectSimpleUnit_statsset_enable)"""

[[cheat]]
id = "objectsimpleunit-base-address-scan-to-activate-play-level-to-update-play-level"
name = "ObjectSimpleUnit Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(ObjectSimpleUnit_savedAOB)
label(ObjectSimpleUnit_returnhere)
label(ObjectSimpleUnit_originalcode)
label(ObjectSimpleUnit_exit)

label(ObjectSimpleUnit_update_exit)
label(ObjectSimpleUnit_set_exit)
label(ObjectSimpleUnit_healthset_exit)
label(ObjectSimpleUnit_foicusset_exit)
label(ObjectSimpleUnit_maskset_exit)
label(ObjectSimpleUnit_speedset_exit)
label(ObjectSimpleUnit_statsset_exit)

registersymbol(ObjectSimpleUnit_savedAOB)

//33F141BF - C7 45 C8 00000000     - mov [ebp-38],00000000
//33F141C6 - C7 45 CC 00000000     - mov [ebp-34],00000000
// ObjectSimpleUnit:Update+25
//33F141CD - 0FB6 87 B0010000      - movzx eax,byte ptr [edi+000001B0]
//33F141D4 - 85 C0                 - test eax,eax
//33F141D6 - 74 17                 - je 33F141EF
//33F141D8 - 83 EC 0C              - sub esp,0C
aobscan(ObjectSimpleUnit_searchedAOB, 0F B6 87 B0 01 00 00 85 C0)

alloc(ObjectSimpleUnit_newmem, 2048, ObjectSimpleUnit_searchedAOB)
alloc(ObjectSimpleUnit_temp1, 4, ObjectSimpleUnit_searchedAOB)
alloc(ObjectSimpleUnit_temp2, 4, ObjectSimpleUnit_searchedAOB)
alloc(ObjectSimpleUnit_temp3, 4, ObjectSimpleUnit_searchedAOB)


ObjectSimpleUnit_newmem:
mov [ObjectSimpleUnit_temp1], ebx
mov [ObjectSimpleUnit_temp2], ecx
mov [ObjectSimpleUnit_temp3], edx

cmp dword ptr [ObjectSimpleUnit_update_enable], #0
