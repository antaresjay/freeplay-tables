[[cheat]]
id = "savegamedata-base-address-scan-initialization-activate-this-first"
name = "SaveGameData Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(SaveGameData_basepointer)
registersymbol(SaveGameData_update_enable)
registersymbol(SaveGameData_set_enable)

alloc(SaveGameData_basepointer, 4)
alloc(SaveGameData_update_enable, 4)
alloc(SaveGameData_set_enable, 4)


[DISABLE]
unregistersymbol(SaveGameData_basepointer)
unregistersymbol(SaveGameData_update_enable)
unregistersymbol(SaveGameData_set_enable)

dealloc(SaveGameData_basepointer)
dealloc(SaveGameData_update_enable)
dealloc(SaveGameData_set_enable)"""

[[cheat]]
id = "savegamedata-getcharacteratslot-base-address-scan-to-activate-view-codex-to-update-view-codex"
name = "SaveGameData GetCharacterAtSlot Base Address Scan (To Activate: View Codex, To Update: View Codex)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(SaveGameData_savedAOB)
label(SaveGameData_returnhere)
label(SaveGameData_originalcode)
label(SaveGameData_exit)

label(SaveGameData_update_exit)
label(SaveGameData_set_exit)

registersymbol(SaveGameData_savedAOB)

//345D69A1 - 8B 7D 08              - mov edi,[ebp+08]
//345D69A4 - E8 6769C0D0           - call 051DD310
// MenuCodexScript:init+14
//345D69A9 - 8B 40 0C              - mov eax,[eax+0C]
//345D69AC - C6 40 55 00           - mov byte ptr [eax+55],00
//345D69B0 - 8B 05 608E0A01        - mov eax,[010A8E60] : [34C9DB68]
//345D69B6 - 83 EC 04              - sub esp,04
//345D69B9 - 6A 00                 - push 00
//345D69BB - 6A 04                 - push 04
aobscan(SaveGameData_searchedAOB, 8B 40 0C C6 40 55 00 * * * * * * 83 EC 04)

alloc(SaveGameData_newmem, 2048, SaveGameData_searchedAOB)
alloc(SaveGameData_temp1, 4, SaveGameData_searchedAOB)


SaveGameData_newmem:
mov [SaveGameData_temp1], ebx

mov ebx, [eax+c]

cmp dword ptr [SaveGameData_update_enable], #0
je SaveGameData_update_exit
mov [SaveGameData_basepointer], ebx
SaveGameData_update_exit:

cmp dword ptr [SaveGameData_set_enable], #0
je SaveGameData_set_exit
SaveGameData_set_exit:

mov ebx, [SaveGameData_temp1]


SaveGameData_originalcode:
db 8B 40 0C C6 40 55 00
//mov eax,[eax+0C]
//mov byte ptr [eax+55],00


SaveGameData_exit:
jmp SaveGameData_returnhere


SaveGameData_searchedAOB:
