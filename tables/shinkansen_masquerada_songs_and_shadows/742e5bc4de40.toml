fstp [ebx+8]
cmp dword ptr [edi+ac], #0
je ObjectSimpleUnit_speedset_exit
mov ebx, [edi+ac]
fld [ebx+18]
fstp [ebx+8]
ObjectSimpleUnit_speedset_exit:

cmp dword ptr [ObjectSimpleUnit_statsset_enable], #0
je ObjectSimpleUnit_statsset_exit

cmp dword ptr [edi+48], #0
je ObjectSimpleUnit_statsset_exit
mov ebx, [edi+48]
fld [ebx+14]
fstp [ebx+8]

cmp dword ptr [edi+58], #0
je ObjectSimpleUnit_statsset_exit
mov ebx, [edi+58]
fld [ebx+14]
fstp [ebx+8]

cmp dword ptr [edi+5c], #0
je ObjectSimpleUnit_statsset_exit
mov ebx, [edi+5c]
fld [ebx+18]
fstp [ebx+8]

cmp dword ptr [edi+60], #0
je ObjectSimpleUnit_statsset_exit
mov ebx, [edi+60]
fld [ebx+18]
fstp [ebx+8]

cmp dword ptr [edi+68], #0
je ObjectSimpleUnit_statsset_exit
mov ebx, [edi+68]
fld [ebx+18]
fstp [ebx+8]

cmp dword ptr [edi+6c], #0
je ObjectSimpleUnit_statsset_exit
mov ebx, [edi+6c]
