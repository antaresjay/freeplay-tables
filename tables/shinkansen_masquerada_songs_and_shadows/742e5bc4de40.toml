mov ebx, [edi+40]
fld [ebx+18]
fstp [ebx+8]
ObjectSimpleUnit_healthset_exit:

cmp dword ptr [ObjectSimpleUnit_foicusset_enable], #0
je ObjectSimpleUnit_foicusset_exit
cmp dword ptr [edi+44], #0
je ObjectSimpleUnit_foicusset_exit
