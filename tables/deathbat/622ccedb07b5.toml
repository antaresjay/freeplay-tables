type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)

aobscan(active,D9 80 08 01 00 00 DD 9D 20 FF FF FF)
registersymbol(active)

//LevelManager:Update+586

label(magic)
label(health)
label(lives)



registersymbol(magicE)
registersymbol(healthE)
registersymbol(livesE)

label(magicE)
label(healthE)
label(livesE)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
{
float
max mgic 110
magic 108
max health 100
health f8
Int
lives cc
max lives d0

}



health:
cmp [healthE],0
je magic
fld [eax+100]
fstp [eax+f8]
magic:
cmp [magicE],0
je lives
fld [eax+110]
fstp [eax+108]
lives:
cmp [livesE],0
je originalcode
fild [eax+d0]
fistp [eax+cc]

originalcode:
fld dword ptr [eax+00000108]
jmp returnhere
magicE:
dd 0
healthE:
dd 0
livesE:
dd 0
active:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
