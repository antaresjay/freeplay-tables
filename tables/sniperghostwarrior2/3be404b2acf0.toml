id = "inf-health"
name = "inf.health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(health)
label(returnhere)
registersymbol(health)
aobscan(aob_health,F3 0F 10 81 94 00 00 00 0F 2F 05 00 80 3E 38 76 06)

newmem:
mov [ecx+00000094],(float)999
movss xmm0,[ecx+00000094]
jmp returnhere

