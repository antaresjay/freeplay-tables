[[cheat]]
id = "always-first-num-1-toggle-on-off"
name = "Always First___________________(NUM 1 - Toggle On/Off)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(originalcode)
label(exit)


label(always_first)
registersymbol(always_first)

aobscan(always_first_aob,89 7A 0C ** ** ** 82 ** ** ** ** 80 7D 08 00)

newmem:
mov edi,0

originalcode:
mov [edx+0C],edi
cmp esi,eax

exit:
jmp returnhere

always_first_aob:
always_first:
jmp newmem
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
always_first:
mov [edx+0C],edi
cmp esi,eax
//Alt: db 89 7A 0C 3B F0

unregistersymbol(always_first)"""

