[[cheat]]
id = "node-weapon-clip"
name = "node Weapon Clip"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game   : LEFTALIVE.exe
  Version: 1.0.3.0
  Date   : 2025-05-24
  Author : Oyyzj

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(WpnClip,LEFTALIVE.exe,FF 09 44 8B 09 3C 01 0F) // should be unique
alloc(newmem,$100,WpnClip)
registersymbol(WpnClip)
label(code)
label(return)
label(rWpnClip)
registersymbol(rWpnClip)
newmem:
  cmp byte [ecx+2c],101
  jne code
  cmp [rcx],3
  jne code
  mov r9d,[rcx]
  jmp return
code:
  dec [rcx]
  mov r9d,[rcx]
  jmp return
rWpnClip:
  readmem(WpnClip,5)
WpnClip:
  jmp newmem
return:


[DISABLE]

WpnClip:
  readmem(rWpnClip,5)

unregistersymbol(*)
dealloc(*)"""

