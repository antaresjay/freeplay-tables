[[cheat]]
id = "game-manager-ctrl-numpad-3"
name = "Game Manager (Ctrl + Numpad 3)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Dive The Depths.exe
// Author            : ndck76
// Executable Version: 2022.3.13.37029
// Game Version      : v0.1.0a
// Script Date       : 2026-07-09


[ENABLE]

aobscanregion(timesince,GameManager:Update,GameManager:Update+300,F30F1086xxxx0000F3xxxxxx66xxxxxx66xxxxxx0Fxxxxxxxxxx48xxxxxxxxxxxx83xxxx75xx66xxxxxx) //GameManager:Update+ab
alloc(newmem,$1000,timesince)
alloc(data,8)
alloc(timesincebkp,8)
registersymbol(data)
registersymbol(timesince)
registersymbol(timesincebkp)
label(code)
label(return)

timesincebkp:
  readmem(timesince,8)

newmem:
  mov [data],rsi

code:
  readmem(timesince,8)
  jmp return

timesince:
  jmp newmem
  nop 3
return:

[DISABLE]

timesince:
  readmem(timesincebkp,8)

unregistersymbol(*)
dealloc(*)"""

