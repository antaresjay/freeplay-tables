[[cheat]]
id = "god-mode"
name = "God Mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : AGE.EXE
  Version:
  Date   : 2026-02-25
  Author : wajrak

  This script does blah blah blah
}

[ENABLE]
alloc(newmem,$1000)

label(code)
label(check_sp)
label(block_write)
label(original_code)
label(return)

// Declare our labels so CE knows they exist
label(Party_Size)
label(Enable_GodMode)
label(Enable_InfSP)

registersymbol(Party_Size)
registersymbol(Enable_GodMode)
registersymbol(Enable_InfSP)

newmem:
  // Jump over the variables so the engine doesn't run them as code!
  jmp code

// --- INITIALIZED VARIABLES ---
Party_Size:
  dd 3
Enable_GodMode:
  dd 1
Enable_InfSP:
  dd 1
// -----------------------------

code:
  push edx
  push ebx
  push edi

  // 1. Did we catch the Leader's Base Address?
  mov edx, [pCharacterBase]
  cmp edx, 0
  je original_code

  // Calculate Umbrella Width in EBX = (Party_Size - 1) * 4 bytes
  mov ebx, [Party_Size]
  dec ebx
  shl ebx, 2

  // --- HP CHECK ---
  cmp dword ptr [Enable_GodMode], 1
  jne check_sp // If God Mode is off, skip to checking SP

  mov edi, edx
  add edi, 3750 // Start of HP Array
  cmp eax, edi
  jl check_sp

  add edi, ebx // End of HP Array
  cmp eax, edi
  jg check_sp

  // BINGO! IN HP ARRAY!
  jmp block_write

check_sp:
  // --- SP CHECK ---
  cmp dword ptr [Enable_InfSP], 1
  jne original_code // If Inf SP is off, write normally

  mov edi, edx
  add edi, 37F0 // Start of SP Array
  cmp eax, edi
  jl original_code

  add edi, ebx // End of SP Array
  cmp eax, edi
  jg original_code

  // BINGO! IN SP ARRAY!
  jmp block_write

block_write:
  pop edi
  pop ebx
  pop edx
  mov esp,ebp // Simply skip the write!
  pop ebp
  jmp return

original_code:
  pop edi
  pop ebx
  pop edx
  mov [eax],ecx   // Original code: Write the stat to memory
  mov esp,ebp
  pop ebp
  jmp return

// Direct hook
AGE.EXE+65A19:
  jmp newmem
return:

[DISABLE]
AGE.EXE+65A19:
  db 89 08 8B E5 5D
unregistersymbol(Party_Size)
unregistersymbol(Enable_GodMode)
unregistersymbol(Enable_InfSP)
dealloc(newmem)"""

