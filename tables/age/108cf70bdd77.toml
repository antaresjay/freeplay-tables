id = "coin"
name = "Coin"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : AGE.EXE
  Version:
  Date   : 2026-02-25
  Author : wajrak

  This script does blah blah blah
}

[ENABLE]
// The Holy Grail: Pointer Stealer + Dynamic VM Encryption Hijack
aobscanmodule(UltimateGoldHook,AGE.EXE,8B 10 8B 45 0C 89 04 91 8B E5 5D)
alloc(newmem,$1000)
alloc(pAgeBase,8)
label(code)
label(cleanup)
label(return)

newmem:
  cmp edx, 001101B4       // Is the engine writing to the Gold ID?
  jne code                // If no, skip to normal code

  // WE FOUND GOLD.
  mov [pAgeBase], ecx     // 1. Steal the base pointer for the community table!

  // 2. The Dynamic Forgery
  push eax                // Save the original EAX so we don't break anything
  mov eax, #9999999       // The raw decimal value the community gets (9.9 million)

  // Replicating AliceSoft's exact encryption natively:
  ror eax, 07             // Step 1: Rotate right
  xor eax, [ebp+08]       // Step 2: XOR against the live dynamic key
  rol eax, 15             // Step 3: Rotate left

  mov [ecx+edx*4], eax    // Write our beautifully forged, encrypted gold to memory!
  pop eax                 // Restore the original EAX
  jmp cleanup             // Skip the original write instruction

code:
  mov [ecx+edx*4],eax     // Original game code (for non-gold variables)

cleanup:
  mov esp,ebp             // Original game code
  jmp return

UltimateGoldHook+05:      // Hook exactly at the 89 04 91 write instruction
  jmp newmem
return:
registersymbol(UltimateGoldHook)
registersymbol(pAgeBase)

[DISABLE]
UltimateGoldHook+05:
  db 89 04 91 8B E5
unregistersymbol(UltimateGoldHook)
unregistersymbol(pAgeBase)
dealloc(newmem)
dealloc(pAgeBase)"""

