[[cheat]]
id = "gameinshopmain-base-address-scan-to-activate-view-shop-to-update-view-shop"
name = "GameInShopMain Base Address Scan (To Activate: View Shop, To Update: View Shop)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameInShopMain_savedAOB)
label(GameInShopMain_returnhere)
label(GameInShopMain_originalcode)
label(GameInShopMain_exit)

label(GameInShopMain_update_exit)
label(GameInShopMain_fundsset_exit)
label(GameInShopMain_coinset_exit)
label(GameInShopMain_gaugeset_exit)

registersymbol(GameInShopMain_originalcode)
registersymbol(GameInShopMain_savedAOB)

//19A466FA - 41 FF D3              - call r11d
//19A466FD - 48 83 C4 20           - add rsp,20
// GameInShopMain:Update+2f
//19A46701 - 48 63 46 38           - movsxd  rax,dword ptr [rsi+38]
//19A46705 - 83 F8 05              - cmp eax,05
//19A46708 - 0F85 5E000000         - jne 19A4676C
//19A4670E - 48 8B 46 58           - mov rax,[rsi+58]
//19A46712 - 48 8B C8              - mov rcx,rax
//19A46715 - 48 83 EC 20           - sub rsp,20
aobscan(GameInShopMain_searchedAOB, 48 63 46 38 83 F8 05 * * * * * * 48 8B 46 58)

alloc(GameInShopMain_newmem, 2048, GameInShopMain_searchedAOB)
alloc(GameInShopMain_temp1, 8, GameInShopMain_searchedAOB)
alloc(GameInShopMain_temp2, 8, GameInShopMain_searchedAOB)
alloc(GameInShopMain_temp3, 8, GameInShopMain_searchedAOB)
alloc(GameInShopMain_temp4, 8, GameInShopMain_searchedAOB)
alloc(GameInShopMain_temp5, 8, GameInShopMain_searchedAOB)


GameInShopMain_newmem:
mov [GameInShopMain_temp1], rax
mov [GameInShopMain_temp2], rbx
mov [GameInShopMain_temp3], rcx
mov [GameInShopMain_temp4], rdx

cmp dword ptr [GameInShopMain_update_enable], #0
je GameInShopMain_update_exit
mov [GameInShopMain_basepointer], rsi
GameInShopMain_update_exit:

cmp dword ptr [GameInShopMain_fundsset_enable], #0
je GameInShopMain_fundsset_exit
mov rbx, [rsi+88]
test rbx, rbx
je GameInShopMain_fundsset_exit
mov [rbx+a8], #999999999
GameInShopMain_fundsset_exit:

cmp dword ptr [GameInShopMain_coinset_enable], #0
je GameInShopMain_coinset_exit
mov rbx, [rsi+88]
test rbx, rbx
je GameInShopMain_coinset_exit
mov [rbx+b0], #999999999
GameInShopMain_coinset_exit:

cmp dword ptr [GameInShopMain_gaugeset_enable], #0
je GameInShopMain_gaugeset_exit
mov rbx, [rsi+88]
test rbx, rbx
je GameInShopMain_gaugeset_exit
mov [rbx+c0], #100
GameInShopMain_gaugeset_exit:

mov rax, [GameInShopMain_temp1]
mov rbx, [GameInShopMain_temp2]
mov rcx, [GameInShopMain_temp3]
mov rdx, [GameInShopMain_temp4]


GameInShopMain_originalcode:
readmem(GameInShopMain_searchedAOB, 7)


GameInShopMain_exit:
jmp GameInShopMain_returnhere


GameInShopMain_searchedAOB:
GameInShopMain_savedAOB:
jmp GameInShopMain_newmem
nop
nop
GameInShopMain_returnhere:


[DISABLE]
GameInShopMain_savedAOB:
readmem(GameInShopMain_originalcode, 7)

unregistersymbol(GameInShopMain_originalcode)
unregistersymbol(GameInShopMain_savedAOB)

dealloc(GameInShopMain_newmem)
dealloc(GameInShopMain_temp1)
dealloc(GameInShopMain_temp2)
dealloc(GameInShopMain_temp3)
dealloc(GameInShopMain_temp4)
dealloc(GameInShopMain_temp5)"""

