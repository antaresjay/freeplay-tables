[[cheat]]
id = "maid-base-address-scan-initialization-activate-this-first"
name = "Maid Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Maid_basepointer)
registersymbol(Maid_update_enable)
registersymbol(Maid_parameterset_enable)
registersymbol(Maid_hparameterset_enable)
registersymbol(Maid_trainingset_enable)
registersymbol(Maid_yotogiplayset_enable)

alloc(Maid_basepointer, 8)
alloc(Maid_update_enable, 4)
alloc(Maid_parameterset_enable, 4)
alloc(Maid_hparameterset_enable, 4)
alloc(Maid_trainingset_enable, 4)
alloc(Maid_yotogiplayset_enable, 4)


[DISABLE]
unregistersymbol(Maid_basepointer)
unregistersymbol(Maid_update_enable)
unregistersymbol(Maid_parameterset_enable)
unregistersymbol(Maid_hparameterset_enable)
unregistersymbol(Maid_trainingset_enable)
unregistersymbol(Maid_yotogiplayset_enable)

dealloc(Maid_basepointer)
dealloc(Maid_update_enable)
dealloc(Maid_parameterset_enable)
dealloc(Maid_hparameterset_enable)
dealloc(Maid_trainingset_enable)
dealloc(Maid_yotogiplayset_enable)"""

[[cheat]]
id = "maid-base-address-scan-to-activate-visible-maid-model-to-update-visible-maid-model"
name = "Maid Base Address Scan (To Activate: Visible Maid Model, To Update: Visible Maid Model)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Maid_savedAOB)
label(Maid_returnhere)
label(Maid_originalcode)
label(Maid_exit)

label(Maid_update_exit)
label(Maid_parameterset_exit)
label(Maid_hparameterset_exit)
label(Maid_trainingset_loop1_exit)
label(Maid_trainingset_loop1_entry)
label(Maid_trainingset_loop1_continue)
label(Maid_yotogiplayset_exit)

registersymbol(Maid_originalcode)
registersymbol(Maid_savedAOB)

//18FD5625 - 48 83 EC 08           - sub rsp,08
//18FD5629 - 48 8B F1              - mov rsi,rcx
// Maid:LateUpdate+c
//18FD562C - 0FB6 86 15010000      - movzx eax,byte ptr [rsi+00000115]
//18FD5633 - 85 C0                 - test eax,eax
//18FD5635 - 0F85 C8010000         - jne 18FD5803
//18FD563B - 48 8B 46 40           - mov rax,[rsi+40]
//18FD563F - 48 8B C8              - mov rcx,rax
//18FD5642 - 83 39 00              - cmp dword ptr [rcx],00
aobscan(Maid_searchedAOB, 0F B6 86 15 01 00 00 85 C0 * * * * * * 48 8B 46 40)

alloc(Maid_newmem, 2048, Maid_searchedAOB)
alloc(Maid_temp1, 8, Maid_searchedAOB)
alloc(Maid_temp2, 8, Maid_searchedAOB)
alloc(Maid_temp3, 8, Maid_searchedAOB)
alloc(Maid_temp4, 8, Maid_searchedAOB)
alloc(Maid_temp5, 8, Maid_searchedAOB)
alloc(Maid_loop1_index, 8, Maid_searchedAOB)
alloc(Maid_loop1_base, 8, Maid_searchedAOB)
alloc(Maid_loop1_max, 8, Maid_searchedAOB)


Maid_newmem:
mov [Maid_temp1], rax
mov [Maid_temp2], rbx
mov [Maid_temp3], rcx
mov [Maid_temp4], rdx

cmp dword ptr [Maid_update_enable], #0
je Maid_update_exit
mov [Maid_basepointer], rsi
Maid_update_exit:

cmp dword ptr [Maid_parameterset_enable], #0
je Maid_parameterset_exit
mov rbx, [rsi+20]
test rbx, rbx
je Maid_parameterset_exit
mov word ptr [rbx+13c], #9999
mov word ptr [rbx+13e], #9999
mov word ptr [rbx+154], #9999
mov word ptr [rbx+156], #9999
mov word ptr [rbx+158], #9999
mov word ptr [rbx+15a], #9999
mov word ptr [rbx+15c], #9999
mov word ptr [rbx+15e], #9999
mov word ptr [rbx+160], #9999
mov word ptr [rbx+162], #9999
mov word ptr [rbx+164], #9999
mov word ptr [rbx+16e], #9999
Maid_parameterset_exit:

cmp dword ptr [Maid_hparameterset_enable], #0
je Maid_hparameterset_exit
mov rbx, [rsi+20]
test rbx, rbx
je Maid_hparameterset_exit
mov word ptr [rbx+166], #9999
mov word ptr [rbx+168], #9999
mov word ptr [rbx+16a], #9999
mov word ptr [rbx+16c], #9999
Maid_hparameterset_exit:

cmp dword ptr [Maid_trainingset_enable], #0
je Maid_trainingset_loop1_exit
mov [Maid_loop1_index], #0
mov rbx, [rsi+20]
test rbx, rbx
je Maid_trainingset_loop1_exit
mov rbx, [rbx+78]
test rbx, rbx
je Maid_trainingset_loop1_exit
mov rbx, [rbx+10]
test rbx, rbx
je Maid_trainingset_loop1_exit
mov rbx, [rbx+28]
test rbx, rbx
je Maid_trainingset_loop1_exit
mov [Maid_loop1_base], rbx
mov rcx, [rbx+18]
test rcx, rcx
je Maid_trainingset_loop1_exit
mov [Maid_loop1_max], rcx

Maid_trainingset_loop1_entry:
mov rbx, [Maid_loop1_base]
mov rdx, [Maid_loop1_index]
mov rax, [rbx+rdx*8+20]
test rax, rax
je Maid_trainingset_loop1_continue
mov [rax+14], #3
mov [rax+18], #30

Maid_trainingset_loop1_continue:
mov rdx, [Maid_loop1_index]
inc rdx
mov [Maid_loop1_index], rdx
mov rcx, [Maid_loop1_max]
cmp rcx, rdx
je Maid_trainingset_loop1_exit
jmp Maid_trainingset_loop1_entry
Maid_trainingset_loop1_exit:

cmp dword ptr [Maid_yotogiplayset_enable], #0
je Maid_yotogiplayset_exit
mov rbx, [rsi+20]
test rbx, rbx
je Maid_yotogiplayset_exit
mov [rbx+140], #300
mov [rbx+144], #600
mov word ptr [rbx+148], #999
mov cx, [rbx+14c]
mov word ptr [rbx+14c], #999
mov cx, [rbx+14c]
mov word ptr [rbx+14e], cx
Maid_yotogiplayset_exit:

mov rax, [Maid_temp1]
mov rbx, [Maid_temp2]
mov rcx, [Maid_temp3]
mov rdx, [Maid_temp4]


Maid_originalcode:
readmem(Maid_searchedAOB, 7)


Maid_exit:
jmp Maid_returnhere


Maid_searchedAOB:
Maid_savedAOB:
jmp Maid_newmem
nop
nop
Maid_returnhere:


[DISABLE]
Maid_savedAOB:
readmem(Maid_originalcode, 7)

unregistersymbol(Maid_originalcode)
unregistersymbol(Maid_savedAOB)

dealloc(Maid_newmem)
dealloc(Maid_temp1)
dealloc(Maid_temp2)
dealloc(Maid_temp3)
dealloc(Maid_temp4)
dealloc(Maid_temp5)
dealloc(Maid_loop1_index)
dealloc(Maid_loop1_base)
dealloc(Maid_loop1_max)"""

