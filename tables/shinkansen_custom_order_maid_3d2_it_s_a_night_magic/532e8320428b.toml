[[cheat]]
id = "sceneedit-base-address-scan-to-activate-edit-new-maid-to-update-edit-new-maid"
name = "SceneEdit Base Address Scan (To Activate: Edit New Maid, To Update: Edit New Maid)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(SceneEdit_savedAOB)
label(SceneEdit_returnhere)
label(SceneEdit_originalcode)
label(SceneEdit_exit)

label(SceneEdit_update_exit)
label(SceneEdit_maidpointsset_exit)

registersymbol(SceneEdit_originalcode)
registersymbol(SceneEdit_savedAOB)

//30415407 - 85 C0                 - test eax,eax
//30415409 - 75 16                 - jne 30415421
// SceneEdit:Update+49b
//3041540B - 48 8B 46 18           - mov rax,[rsi+18]
//3041540F - 48 8B C8              - mov rcx,rax
//30415412 - 83 39 00              - cmp dword ptr [rcx],00
//30415415 - 48 8B 80 C0000000     - mov rax,[rax+000000C0]
//3041541C - 48 85 C0              - test rax,rax
//3041541F - 75 09                 - jne 3041542A
aobscan(SceneEdit_searchedAOB, 48 8B 46 18 48 8B C8 83 39 00 48 8B 80 C0 00 00 00 48 85 C0)

alloc(SceneEdit_newmem, 2048, SceneEdit_searchedAOB)
alloc(SceneEdit_temp1, 8, SceneEdit_searchedAOB)
alloc(SceneEdit_temp2, 8, SceneEdit_searchedAOB)
alloc(SceneEdit_temp3, 8, SceneEdit_searchedAOB)
alloc(SceneEdit_temp4, 8, SceneEdit_searchedAOB)
alloc(SceneEdit_temp5, 8, SceneEdit_searchedAOB)


SceneEdit_newmem:
mov [SceneEdit_temp1], rax
mov [SceneEdit_temp2], rbx
mov [SceneEdit_temp3], rcx
mov [SceneEdit_temp4], rdx

cmp dword ptr [SceneEdit_update_enable], #0
je SceneEdit_update_exit
mov [SceneEdit_basepointer], rsi
SceneEdit_update_exit:

cmp dword ptr [SceneEdit_maidpointsset_enable], #0
je SceneEdit_maidpointsset_exit
mov [rsi+1b0], #9999
SceneEdit_maidpointsset_exit:

mov rax, [SceneEdit_temp1]
mov rbx, [SceneEdit_temp2]
mov rcx, [SceneEdit_temp3]
mov rdx, [SceneEdit_temp4]


SceneEdit_originalcode:
readmem(SceneEdit_searchedAOB, 7)


SceneEdit_exit:
jmp SceneEdit_returnhere


SceneEdit_searchedAOB:
SceneEdit_savedAOB:
jmp SceneEdit_newmem
nop
nop
SceneEdit_returnhere:


[DISABLE]
SceneEdit_savedAOB:
readmem(SceneEdit_originalcode, 7)

unregistersymbol(SceneEdit_originalcode)
unregistersymbol(SceneEdit_savedAOB)

dealloc(SceneEdit_newmem)
dealloc(SceneEdit_temp1)
dealloc(SceneEdit_temp2)
dealloc(SceneEdit_temp3)
dealloc(SceneEdit_temp4)
dealloc(SceneEdit_temp5)"""

