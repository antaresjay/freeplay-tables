[[cheat]]
id = "gold-renown-difficulty-when-open-menu"
name = "Gold, Renown, Difficulty (when open menu)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanregion(BasedataInject,hInstance,hInstance+08000000,75 ?? 48 ?? ?? ?? ?? ?? ?? ?? ?? ?? 8B ?? ?? ?? 48 ?? ?? ?? 48 ?? ?? ?? ?? 48 ?? ?? ?? 48 ?? ?? 48 ?? ?? ?? ?? ?? ?? 48 ?? ?? ?? ?? ?? ?? 48 ?? ?? ?? ?? ?? ?? EB) // should be unique
alloc(newmem,$1000)
alloc(BasedataOrigin,32)

label(code)
label(return)
label(AddrBasedata)

BasedataOrigin:
  readmem(BasedataInject+0x0C,17)

align 8
newmem:
  cmp [AddrBasedata],0
  jne code
  lea rbp,[rax+rcx]
  mov [AddrBasedata],rbp

code:
  //mov ecx,[rax+rcx+10]
  //mov rbp,[rax+rdx]
  //mov rax,[rax+rdx+08]
  //add rdx,10
  readmem(BasedataInject+0x0C,17)
  jmp return

align 8
AddrBasedata:
  dq 0

BasedataInject+0C:
  jmp far newmem
  nop 3
return:
registersymbol(BasedataInject)
registersymbol(BasedataOrigin)
registersymbol(AddrBasedata)

[DISABLE]
BasedataInject+0C:
  readmem(BasedataOrigin,17)

unregistersymbol(*)
dealloc(*)

