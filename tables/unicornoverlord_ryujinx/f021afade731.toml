type = "script"
source = """
[ENABLE]
aobscanregion(hInstance,020000000000,080000000000,53 48 ?? ?? ?? 48 ?? ?? 48 ?? ?? ?? ?? ?? ?? 48 ?? ?? ?? ?? ?? ?? ?? ?? ?? 48 ?? ?? FF D2 48 89 D9 48 83 ?? ?? 5B FF E0) // should be unique
