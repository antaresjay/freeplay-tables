name = "Monster Drop All Items Plus Optional Override Item ID"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DropItemAOB,"Digimon Story CS.exe",89 84 24 D0 00 00 00 49 BE A9)
registersymbol(DropItemAOB)
alloc(newmem,2048,DropItemAOB)

aobscanmodule(DropItemAOB2,"Digimon Story CS.exe",44 8B 45 80 41 8B D7 E8)
registersymbol(DropItemAOB2)
alloc(newmem2,1024,DropItemAOB2)

aobscanmodule(DropItemCallAOB,"Digimon Story CS.exe",48 8B C4 56 57 41 56 48 83 EC 50 48 C7 40 C8 FE FF FF FF 48 89 58 08 R8 89 68 10 41 8B F0 8B DA 4C 8B F1)
registersymbol(DropItemCallAOB)

///
label(originalcode)
label(return)
label(OverrideDropItemID)
registersymbol(OverrideDropItemID)
label(AddAllMedals)
registersymbol(AddAllMedals)
label(NumExtraDropItems)
label(ExtraDropItemIDS)

///
label(return2)
label(RAXSave)
label(RCXSave)
label(R8Save)
label(R10Save)
label(R11Save)

///
newmem:
OverrideDropExtra:
  cmp [OverrideDropItemID],0
  je CommonDropExtra
  movzx eax, word ptr [OverrideDropItemID]
  push r10
  push r11
  movzx r10,byte ptr [NumExtraDropItems]
  mov r11,ExtraDropItemIDS
  mov [r11+r10*4],eax
  inc [NumExtraDropItems]
  pop r11
  pop r10
CommonDropExtra:
  mov rax,[rbp+000000C0]
  movzx eax,word ptr [rax+64]
  push r10
  push r11
  movzx r10,byte ptr [NumExtraDropItems]
  mov r11,ExtraDropItemIDS
  mov [r11+r10*4],eax
  inc [NumExtraDropItems]
  pop r11
  pop r10
RareDropItem:
  mov rax,[rbp+000000C0]
  cmp word ptr [rax+68],-1
  je CommonDropItem
  movzx eax,word ptr [rax+68]
  jmp originalcode
CommonDropItem:
  mov rax,[rbp+000000C0]
  movzx eax,word ptr [rax+64]
  
originalcode:
  mov [rsp+000000D0],eax
  jmp return

AddAllMedals:
dq 0
NumberofAllMedals:
dq #700
AllMedalsStartID:
dq #1001
OverrideDropItemID:
dq 0
NumExtraDropItems:
dq 0
ExtraDropItemIDS:
dq 0
dq 0
dq 0
dq 0

newmem2:
  mov [RAXSave],rax
  mov [RCXSave],rcx
  mov [R10Save],r10
  mov [R11Save],r11
  mov r8d,[rbp-80]
  mov [R8Save],r8
StartLoop:
  mov rax,[RAXSave]
  mov rcx,[RCXSave]
  mov r8,[R8Save]
  mov r10,[R10Save]
  mov r11,[R11Save]
  cmp [NumExtraDropItems],0
  jle DoneLoop
  dec [NumExtraDropItems]
  movzx r8,byte ptr [NumExtraDropItems]
  push rcx
  mov rcx,ExtraDropItemIDS
  xor rdx,rdx
  mov edx,[rcx+r8*4]
  mov dword ptr [rcx+r8*4],00000000
  pop rcx
  mov r8,[R8Save]
  call DropItemCallAOB
  jmp StartLoop
DoneLoop:
  cmp dword ptr [AddAllMedals],1
  jne DoneAddAllMedals
  mov dword ptr [AddAllMedals],0
  mov [NumberofAllMedals],#700
  mov [AllMedalsStartID],#1001
StartAddAllMedalsLoop:
  mov rax,[RAXSave]
  mov rcx,[RCXSave]
  mov r8,[R8Save]
  mov r10,[R10Save]
  mov r11,[R11Save]
  cmp [NumberofAllMedals],0
  jle DoneAddAllMedals
  dec [NumberofAllMedals]
  mov edx,[AllMedalsStartID]
  add edx,[NumberofAllMedals]
  call DropItemCallAOB
  jmp StartAddAllMedalsLoop
DoneAddAllMedals:
  mov edx,r15d
  call DropItemCallAOB
  jmp DropItemAOB2+C

RAXSave:
dq 0
RCXSave:
dq 0
R8Save:
dq 0
R10Save:
dq 0
R11Save:
dq 0
  
DropItemAOB:
  jmp newmem
  nop
  nop
  return:

DropItemAOB2:
  jmp newmem2
  nop
  nop
  return2:
  
[DISABLE]

DropItemAOB:
  db 89 84 24 D0 00 00 00

unregistersymbol(DropItemAOB)
unregistersymbol(OverrideDropItemID)
unregistersymbol(AddAllMedals)

///
DropItemAOB2:
  db 44 8B 45 80 41 8B D7

unregistersymbol(DropItemAOB2)
unregistersymbol(DropItemCallAOB)
 
dealloc(newmem)"""

