[[cheat]]
id = "damage-modifier-god-mode-one-hit-kill-etc"
name = "Damage Modifier (God Mode, One Hit Kill, etc.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DamageModAOB,"Digimon Story CS.exe",29 B9 B8 02 00 00 83 B9 B8 02 00 00 00)
registersymbol(DamageModAOB)
alloc(newmem,2048,DamageModAOB)

///
label(originalcode)
label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(EnemyDamageMultiplier)
registersymbol(EnemyDamageMultiplier)
label(HeroDamageMultiplier)
registersymbol(HeroDamageMultiplier)
label(EnemyHealingMultiplier)
registersymbol(EnemyHealingMultiplier)
label(HeroHealingMultiplier)
registersymbol(HeroHealingMultiplier)
label(HeroCannotDie)
registersymbol(HeroCannotDie)
  
///
newmem:
  push rdx
  mov rdx,CurrentPartyBattlePtr
  cmp [rdx],rcx
  je HeroHit
  cmp [rdx+8],rcx
  je HeroHit
  cmp [rdx+10],rcx
  je HeroHit
  jmp EnemyHit
HeroHit:
  pop rdx
  cmp edi,0
  jge HeroDamageHit
  jmp originalcode
HeroDamageHit:
  cmp [HeroDamageMultiplier],(float)0.0
  je CheckGodMode
  push edi
  fild dword ptr [rsp]
  fmul dword ptr [HeroDamageMultiplier]
  fistp dword ptr [rsp]
  pop edi
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor edi,edi
  jmp originalcode
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne originalcode
  cmp edi,dword ptr [rcx+000002B8]
  jl @F
  xor edi,edi
@@:
  jmp originalcode
EnemyHit:
  pop rdx
  cmp edi,0
  jge EnemyDamageHit
  jmp CheckOneHitKill
EnemyDamageHit:
  cmp [EnemyDamageMultiplier],(float)0.0
  je CheckOneHitKill
  push edi
  fild dword ptr [rsp]
  fmul dword ptr [EnemyDamageMultiplier]
  fistp dword ptr [rsp]
  pop edi
CheckOneHitKill:
  cmp [OneHitKill],1
  jne originalcode
  mov edi,[rcx+000002B8]
  jmp originalcode

originalcode:
  sub [rcx+000002B8],edi
  jmp return

GodMode:
dq 0
OneHitKill:
dq 0
EnemyDamageMultiplier:
dq (float)2.0
HeroDamageMultiplier:
dq (float)0.25
EnemyHealingMultiplier:
dq (float)0.0
HeroHealingMultiplier:
dq (float)2.0
HeroCannotDie:
dq 1

DamageModAOB:
  jmp newmem
  nop
  return:
  
[DISABLE]

DamageModAOB:
  db 29 B9 B8 02 00 00

unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(EnemyDamageMultiplier)
unregistersymbol(HeroDamageMultiplier)
unregistersymbol(HeroCannotDie)
unregistersymbol(DamageModAOB)

dealloc(newmem)"""

