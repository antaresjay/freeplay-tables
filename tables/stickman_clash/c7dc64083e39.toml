[[cheat]]
id = "inf-coins-after-round"
name = "Inf Coins after round"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(INJECT,89 54 39 14 8B 91 FC FB 33 00)
alloc(m,$1000,INJECT)

label(L0)
label(L1)

m:
push rax
push rbx
xor eax,eax
add eax,2
sub eax,2
pop rbx
pop rax

xor edx,edx
add edx,7530
add edx,7530
add edx,9C3F
L0:
mov [rcx+rdi+14],edx
mov edx,[rcx+0033FBFC]
jmp L1

INJECT:
jmp m
nop 5
L1:
registersymbol(INJECT)

[DISABLE]

INJECT:
db 89 54 39 14 8B 91 FC FB 33 00

unregistersymbol(INJECT)
dealloc(m)"""

