[[cheat]]
id = "godmode-ohk"
name = "Godmode + OHK"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(Q1,C5 FA 11 44 11 10 8B 55 DC 0F B6 5C 11 4C 85 DB 0F 85 3A 00 00 00 8B 55 DC 8B 5C 11 2C 48 8B 55 E8 83 42 63 02 89 45 D0 C5 FA 11 45 D8 8B C3 C5 F2 10 C8 33 D2 E8 ?? ?? ?? FE)

alloc(X,$1000,Q1)

label(Z)
label(Aq)
label(Bq)
label(Cq)
label(Dz)

X:
push rax
push rbx

mov eax,[rcx+rdx+0C]
test eax,eax
jne Bq

mov bl,[P]
test bl,bl
jz Cq

movss xmm0,[V]
jmp Dz

Bq:
mov bl,[K]
test bl,bl
jnz Aq
jmp Cq

Aq:
movss xmm0,[W]
jmp Dz

Cq:
vmovss [rcx+rdx+10],xmm0
pop rbx
pop rax
jmp Z

Dz:
vmovss [rcx+rdx+10],xmm0
pop rbx
pop rax
jmp Z

V:
dd (float)1

W:
dd (float)-1

P:
db 0

K:
db 0

Q1:
jmp X
nop
Z:

registersymbol(Q1)
registersymbol(P)
registersymbol(K)

[DISABLE]

Q1:
db C5 FA 11 44 11 10

unregistersymbol(Q1)
unregistersymbol(P)
unregistersymbol(K)

dealloc(X)"""

