[[cheat]]
id = "player-save-data-record-ctrl-numpad-1"
name = "Player Save Data Record (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : ReplayleeWin64.exe
// Author            : ndck76
// Executable Version: 6000.0.46.37820
// Game Version      : v1.0
// Script Date       : 2025-10-11


[ENABLE]

aobscanmodule(special,GameAssembly.dll,) //Playtonic.Game.SavegameManagerExtensions.GetAllSpecialExtenderTokenCount
alloc(newmem,$1000,special)
alloc(data2,8)
alloc(specialbkp,7)
registersymbol(data2)
registersymbol(special)
registersymbol(specialbkp)
label(code)
label(return)

specialbkp:
  readmem(special,7)

newmem:
  mov [data2],rax

code:
  readmem(special,7)
  jmp return

special:
  jmp newmem
  nop 2
return:

[DISABLE]

special:
  readmem(specialbkp,7)

unregistersymbol(*)
dealloc(*)"""

