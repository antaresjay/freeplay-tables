id = "never-hungry"
name = "Never Hungry"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(hunger,GameAssembly.dll,F3 0F 11 83 D8 02 00 00 48 85 C0 0F 84 4E) // should be unique
alloc(newmem,$1000,hunger)

label(code)
label(return)

newmem:

code:
  mov [rbx+000002D8],(float)1000
  jmp return

hunger:
  jmp newmem
  nop 3
return:
registersymbol(hunger)

[DISABLE]

hunger:
  db F3 0F 11 83 D8 02 00 00

unregistersymbol(hunger)
dealloc(newmem)"""
