[[cheat]]
id = "resource-points"
name = "Resource Points"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(ResourceAOB,F1_2017.exe,33 03 48 83 C4 20)
alloc(ResourceMem,128,"F1_2017.exe"+4A0CAE)
label(Return)
label(Code)
label(AddCode)
label(AddResource)
registersymbol(AddResource)
registersymbol(ResourceAOB)

ResourceMem:
  cmp dword ptr [AddResource+8],0
  je AddCode
  push edx
  mov edx,[rbx]
  xor edx,eax
  mov edx,[AddResource+8]
  mov [AddResource+4],0
  mov [AddResource+8],0
  xor edx,eax
  mov [rbx],edx
  pop edx
  jmp Code

AddCode:
  cmp dword ptr [AddResource+4],0
  je Code
  push edx
  mov edx,[rbx]
  xor edx,eax
  add edx,[AddResource+4]
  mov [AddResource+4],0
  mov [AddResource+8],0
  xor edx,eax
  mov [rbx],edx
  pop edx

Code:
  xor eax,[rbx]
  mov [AddResource],eax
  add rsp,20
  jmp Return

AddResource:
  dd 0

ResourceAOB:
  jmp ResourceMem
  nop
Return:

[DISABLE]
ResourceAOB:
  xor eax,[rbx]
  add rsp,20
unregistersymbol(AddResource)
unregistersymbol(ResourceAOB)
dealloc(ResourceMem)"""

