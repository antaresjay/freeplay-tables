[[cheat]]
id = "engine-wear"
name = "Engine Wear"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(Engine_MGUK_AOB,F1_2017.exe,41 33 04 1E)
aobscanmodule(Engine_ES_AOB,F1_2017.exe,33 04 2B)
aobscanmodule(Engine_CE1_AOB,F1_2017.exe,F3 41 0F 59 FB F3 0F 58 FE)
aobscanmodule(Engine_CE2_AOB,F1_2017.exe,33 83 60 08 00 00)
aobscanmodule(Engine_ICE_AOB,F1_2017.exe,F3 41 0F 59 CB F3 0F 58 8B)
aobscanmodule(Engine_MGUH_AOB,F1_2017.exe,F3 41 0F 59 C3 F3 0F 58 83 94 0A)
aobscanmodule(Engine_TC_AOB,F1_2017.exe,8B CF F3 0F 10 84 24)
aobscanmodule(Engine_Gearbox_AOB,F1_2017.exe,F3 0F 59 87 F4 0C 00 00 F3 0F 58 F8 80 BB)
alloc(EngineMem,4096,"F1_2017.exe"+DC098F)
label(Engine_MGUK)
label(Engine_ES)
label(Engine_CE1)
label(Engine_CE2)
label(Engine_ICE)
label(Engine_MGUH)
label(Engine_TC)
label(Engine_Gearbox)
label(Return_MGUK)
label(Return_ES)
label(Return_CE1)
label(Return_CE2)
label(Return_ICE)
label(Return_MGUH)
label(Return_TC)
label(Return_Gearbox)
label(EngineRate)
registersymbol(EngineRate)
registersymbol(Engine_MGUK_AOB)
registersymbol(Engine_ES_AOB)
registersymbol(Engine_CE1_AOB)
registersymbol(Engine_CE2_AOB)
registersymbol(Engine_ICE_AOB)
registersymbol(Engine_MGUH_AOB)
registersymbol(Engine_TC_AOB)
registersymbol(Engine_Gearbox_AOB)

EngineMem:

Engine_MGUK:
  mulss xmm0,xmm11
  mulss xmm0,[EngineRate]
  jmp Return_MGUK

Engine_ES:
  mulss xmm0,xmm11
  mulss xmm0,[EngineRate]
  jmp Return_ES

Engine_CE1:
  mulss xmm7,xmm11
  mulss xmm7,[EngineRate]
  jmp Return_CE1

Engine_CE2:
  mulss xmm0,xmm11
  mulss xmm0,[EngineRate]
  jmp Return_CE2

Engine_ICE:
  push rsi
  lea rsi,[rbx+A98]
  mov [EngineRate+10],rsi
  lea rsi,[rbx+A88]
  mov [EngineRate+20],rsi
  lea rsi,[rbx+AA4]
  mov [EngineRate+30],rsi
  lea rsi,[rbx+A80]
  mov [EngineRate+40],rsi
  lea rsi,[rbx+A94]
  mov [EngineRate+50],rsi
  lea rsi,[rbx+A84]
  mov [EngineRate+60],rsi
  pop rsi
  mulss xmm1,xmm11
  mulss xmm1,[EngineRate]
  jmp Return_ICE

Engine_MGUH:
  mulss xmm0,xmm11
  mulss xmm0,[EngineRate]
  jmp Return_MGUH

Engine_TC:
  mulss xmm0,xmm11
  mulss xmm0,[EngineRate]
  jmp Return_TC

Engine_Gearbox:
  push rsi
  lea rsi,[rbx+1CC]
  mov [EngineRate+70],rsi
  pop rsi
  mulss xmm0,[rdi+00000CF4]
  mulss xmm0,[EngineRate]
  jmp Return_Gearbox

EngineRate:
  dd 3F800000

Engine_MGUK_AOB+14:
  jmp Engine_MGUK
Return_MGUK:

Engine_ES_AOB+13:
  jmp Engine_ES
Return_ES:

Engine_CE1_AOB:
  jmp Engine_CE1
Return_CE1:

Engine_CE2_AOB+1F:
  jmp Engine_CE2
Return_CE2:

Engine_ICE_AOB:
  jmp Engine_ICE
Return_ICE:

Engine_MGUH_AOB:
  jmp Engine_MGUH
Return_MGUH:

Engine_TC_AOB+10:
  jmp Engine_TC
Return_TC:

Engine_Gearbox_AOB:
  jmp Engine_Gearbox
  db 90 90 90
Return_Gearbox:

[DISABLE]
Engine_MGUK_AOB+14:
  db F3 41 0F 59 C3
Engine_ES_AOB+13:
  db F3 41 0F 59 C3
Engine_CE1_AOB:
  db F3 41 0F 59 FB
Engine_CE2_AOB+1F:
  db F3 41 0F 59 C3
Engine_ICE_AOB:
  db F3 41 0F 59 CB
Engine_MGUH_AOB:
  db F3 41 0F 59 C3
Engine_TC_AOB+10:
  db F3 41 0F 59 C3
Engine_Gearbox_AOB:
  db F3 0F 59 87 F4 0C 00 00
unregistersymbol(EngineRate)
unregistersymbol(Engine_MGUK_AOB)
unregistersymbol(Engine_ES_AOB)
unregistersymbol(Engine_CE1_AOB)
unregistersymbol(Engine_CE2_AOB)
unregistersymbol(Engine_ICE_AOB)
unregistersymbol(Engine_MGUH_AOB)
unregistersymbol(Engine_TC_AOB)
unregistersymbol(Engine_Gearbox_AOB)
dealloc(EngineMem)"""

