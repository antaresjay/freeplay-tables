type = "script"
source = """
[ENABLE]
aobscanmodule(health,Ace7Game.exe,CE 02 00 00 66 0F 6E 81 30 0B 00 00)
alloc(newmem,1024,health)

label(code)
label(return)
label(temp)

registersymbol(health)

newmem:
  fld [temp]
  fld [rcx+000004C4]
  fmulp
  fistp [rcx+00000B30]

code:
