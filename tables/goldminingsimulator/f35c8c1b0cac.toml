[[cheat]]
id = "god-mode"
name = "God Mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,Player:Update)
define(bytes,55 48 8B EC 48 81 EC D0 00 00 00)
//Send@Sintrix|FearlessRevolution
[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Player:Update)

label(code)
label(return)

newmem:
mov [rcx+B2],1 //God

code:
  push rbp
  mov rbp,rsp
  sub rsp,000000C0
  jmp return

address:
  jmp newmem
  nop 6
return:

[DISABLE]
//Send@Sintrix|FearlessRevolution
address:
  db bytes


dealloc(*)"""

