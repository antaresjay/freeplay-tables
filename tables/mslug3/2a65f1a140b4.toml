[[cheat]]
id = "activate-script-click-me-first"
name = "Activate Script CLICK ME FIRST"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(bombcheck)
label(livescheck)
label(prisoncheck)
label(exit)
label(ammoflag)
registersymbol(ammoflag)
label(bombsflag)
registersymbol(bombsflag)
label(livesflag)
registersymbol(livesflag)
label(prisonflag)
registersymbol(prisonflag)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
mov eax,[mslug3.exe+DF1F8]
cmp byte ptr [ammoflag], 1
jne bombcheck
mov dword ptr [eax+eafa], #65535
bombcheck:
cmp byte ptr [bombsflag], 1
jne livescheck
mov byte ptr [eax+EAF4], #10
livescheck:
cmp byte ptr [livesflag], 1
jne prisoncheck
mov byte ptr [eax+2BA], #10
prisoncheck:
cmp byte ptr [prisonflag], 1
jne originalcode
mov byte ptr [eax+ED04], #10
mov byte ptr [prisonflag], 0
originalcode:


exit:
jmp returnhere

newmem+200:
ammoflag:
dd 0
bombsflag:
dd 0
livesflag:
dd 0
prisonflag:
dd 0

"mslug3.exe"+5BD03:
jmp newmem
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
unregistersymbol(ammoflag)
unregistersymbol(bombsflag)
unregistersymbol(livesflag)
unregistersymbol(prisonflag)

"mslug3.exe"+5BD03:
mov eax,[mslug3.exe+DF1F8]
//Alt: db A1 F8 F1 4D 00"""

