[[cheat]]
id = "hp"
name = "hp"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(hp,1B 89 91 9C 00 00 00) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov [ecx+0000009C],78
  jmp return

hp+01:
  jmp newmem
  nop
return:
registersymbol(hp)

[DISABLE]

hp+01:
  db 89 91 9C 00 00 00

unregistersymbol(hp)
dealloc(newmem)"""

