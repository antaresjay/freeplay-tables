[[cheat]]
id = "insta-level-hack"
name = "Insta level hack"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[Enable]
alloc(newmem,2048)
label(returnhere)
label(exit)

newmem:
push eax
//load base pointer
mov eax, ["Fate-WT.exe"+0089BBE8]
//add offsets
add eax, 278
mov eax, [eax]
add eax, 668
mov eax, [eax]
add eax, 5e8
mov eax, [eax]
add eax, 5a8
//Load max exp from constructed pointer
mov eax, [eax]
//Replace current exp with max
mov [esi+000003D4],eax

//Cleanup
pop eax

exit:
jmp returnhere

"Fate-WT.exe"+15F022:
jmp newmem
nop
returnhere:



[Disable]
dealloc(newmem)
"Fate-WT.exe"+15F022:
mov [esi+000003D4],ecx
//Alt: db 89 8E D4 03 00 00"""

