[[cheat]]
id = "infinite-robot-tp"
name = "Infinite Robot TP"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(robot, Interactable.RobotController:GetCurrentTP+2, Interactable.RobotController:GetCurrentTP+1a, 48 63 86 40 01 00 00 48 8B 34 24 48 83 C4 08)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov [rsi+140], #99999
code:
  movsxd  rax,dword ptr [rsi+00000140]
  mov rsi,[rsp]
  add rsp,08
  jmp return

robot:
  jmp far newmem
  nop
return:
registersymbol(robot)

[DISABLE]

robot:
  db 48 63 86 40 01 00 00 48 8B 34 24 48 83 C4 08

unregistersymbol(robot)
dealloc(newmem)"""
