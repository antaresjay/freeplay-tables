[[cheat]]
id = "player-pointers"
name = "Player Pointers"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobScanModule(NBLOTF01,$process,488Bxxxxxxxxxx4885xx0F84xxxxxxxxE8xxxxxxxx488Bxxxx4Cxxxxxx4863xxxx3Bxxxx0F8Fxxxxxxxx488Bxx488Bxxxx4Cxxxxxx0F85xxxxxxxx488Bxxxxxxxxxx4885xx0F84xxxxxxxx488B)
alloc(memNBLOTF01,$400,NBLOTF01)

registerSymbol(NBLOTF01)
registerSymbol(NBLOTF01_bak)
registerSymbol(NBLOTF01_flt)
registerSymbol(NBLOTF01_flg)
registerSymbol(NBLOTF01_ptr)

label(NBLOTF01_bak)
label(NBLOTF01_flt)
label(NBLOTF01_flg)
label(NBLOTF01_ptr)
label(NBLOTF01_n_code)
label(NBLOTF01_o_code)
label(NBLOTF01_exit)
label(NBLOTF01_return)

memNBLOTF01:
  NBLOTF01_bak:
    readMem(NBLOTF01,7)
\talign 10
  NBLOTF01_flt:
    dd (float)0
\talign 10
  NBLOTF01_flg:
    db 00
\talign 10
  NBLOTF01_ptr:
    dq 0
\talign 10 CC
  NBLOTF01_n_code:
    mov rdi,NBLOTF01_ptr
    mov [rdi],rax
  NBLOTF01_o_code:
    readMem(NBLOTF01,7)
  NBLOTF01_exit:
    jmp NBLOTF01_return

NBLOTF01:
  jmp NBLOTF01_n_code
  nop 2
  NBLOTF01_return:

[DISABLE]
NBLOTF01:
  readMem(NBLOTF01_bak,7)

unregisterSymbol(*)
dealloc(*)"""

