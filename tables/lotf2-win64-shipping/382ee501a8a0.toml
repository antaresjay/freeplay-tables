[[cheat]]
id = "currency-pointer"
name = "Currency Pointer"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobScanModule(NBLOTF21,$process,488Bxx488BxxE8xxxxxxxx448BxxB2)
alloc(memNBLOTF21,$400,NBLOTF21)

registerSymbol(NBLOTF21)
registerSymbol(NBLOTF21_bak)
registerSymbol(NBLOTF21_ptr)

label(NBLOTF21_bak)
label(NBLOTF21_ptr)
label(NBLOTF21_n_code)
label(NBLOTF21_o_code)
label(NBLOTF21_exit)
label(NBLOTF21_return)

memNBLOTF21:
  NBLOTF21_bak:
    readMem(NBLOTF21,6)
\talign 10
  NBLOTF21_ptr:
    dq 0
\talign 10 CC
  NBLOTF21_n_code:
    mov rbx,NBLOTF21_ptr
    mov rcx,[rax]
    mov [rbx],rcx
  NBLOTF21_o_code:
    readMem(NBLOTF21,6)
  NBLOTF21_exit:
    jmp NBLOTF21_return
  
NBLOTF21:
  jmp NBLOTF21_n_code
  nop
  NBLOTF21_return:

[DISABLE]
NBLOTF21:
  readMem(NBLOTF21_bak,6)

unregisterSymbol(*)
dealloc(*)"""

