[[cheat]]
id = "playercontroller-base-address-scan-initialization-activate-this-first"
name = "PlayerController Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlayerController_basepointer)
registersymbol(PlayerController_update_enable)
registersymbol(PlayerController_set_enable)
registersymbol(PlayerController_lifeset_enable)
registersymbol(PlayerController_attributesset_enable)
registersymbol(PlayerController_statusset_enable)
registersymbol(PlayerController_invincibleset_enable)

alloc(PlayerController_basepointer, 8)
alloc(PlayerController_update_enable, 4)
alloc(PlayerController_set_enable, 4)
alloc(PlayerController_lifeset_enable, 4)
alloc(PlayerController_attributesset_enable, 4)
alloc(PlayerController_statusset_enable, 4)
alloc(PlayerController_invincibleset_enable, 4)


[DISABLE]
unregistersymbol(PlayerController_basepointer)
unregistersymbol(PlayerController_update_enable)
unregistersymbol(PlayerController_set_enable)
unregistersymbol(PlayerController_lifeset_enable)
unregistersymbol(PlayerController_attributesset_enable)
unregistersymbol(PlayerController_statusset_enable)
unregistersymbol(PlayerController_invincibleset_enable)

dealloc(PlayerController_basepointer)
dealloc(PlayerController_update_enable)
dealloc(PlayerController_set_enable)
dealloc(PlayerController_lifeset_enable)
dealloc(PlayerController_attributesset_enable)
dealloc(PlayerController_statusset_enable)
dealloc(PlayerController_invincibleset_enable)"""

[[cheat]]
id = "playercontroller-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerController Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerController_savedAOB)
label(PlayerController_returnhere)
label(PlayerController_originalcode)
label(PlayerController_exit)

label(PlayerController_update_exit)
label(PlayerController_set_exit)
label(PlayerController_lifeset_exit)
label(PlayerController_attributesset_exit)
label(PlayerController_statusset_exit)
label(PlayerController_invincibleset_exit)

registersymbol(PlayerController_savedAOB)

//04BE8156 - C7 85 60FDFFFF 00000000 - mov [ebp-000002A0],00000000
//04BE8160 - C7 85 64FDFFFF 00000000 - mov [ebp-0000029C],00000000
// PlayerController:Update+e2
//04BE816A - C7 85 68FDFFFF 00000000 - mov [ebp-00000298],00000000
//04BE8174 - 0FB6 87 34010000      - movzx eax,byte ptr [edi+00000134]
//04BE817B - 85 C0                 - test eax,eax
//04BE817D - 0F85 6E010000         - jne 04BE82F1
//04BE8183 - BA D89AFC0A           - mov edx,0AFC9AD8 : [09B26EB0]
aobscan(PlayerController_searchedAOB, 48 8B F1 48 8B 46 68 48 8B C8 BA 02 00 00 00 48 83 EC 20 83 38 00 * * * * * * * * * * * * * 48 83 C4 20)

alloc(PlayerController_newmem, 2048, PlayerController_searchedAOB)
alloc(PlayerController_temp1, 8, PlayerController_searchedAOB)
alloc(PlayerController_temp2, 8, PlayerController_searchedAOB)


PlayerController_newmem:
mov [PlayerController_temp1], rbx
mov [PlayerController_temp2], rdx

cmp dword ptr [PlayerController_update_enable], #0
je PlayerController_update_exit
mov [PlayerController_basepointer], rsi
PlayerController_update_exit:

cmp dword ptr [PlayerController_set_enable], #0
je PlayerController_set_exit
PlayerController_set_exit:

cmp dword ptr [PlayerController_lifeset_enable], #0
je PlayerController_lifeset_exit
mov [rsi+d4], (float)100
PlayerController_lifeset_exit:

cmp dword ptr [PlayerController_attributesset_enable], #0
je PlayerController_attributesset_exit
mov [rsi+d8], (float)100
mov [rsi+dc], (float)100
mov [rsi+e0], (float)100
PlayerController_attributesset_exit:

cmp dword ptr [PlayerController_statusset_enable], #0
je PlayerController_statusset_exit
cmp qword ptr [rsi+68], #0
je PlayerController_statusset_exit
cmp dword ptr [rsi+68], #0
je PlayerController_statusset_exit
mov rbx, [rsi+68]
cmp qword ptr [rbx+10], #0
je PlayerController_statusset_exit
cmp dword ptr [rsi+10], #0
je PlayerController_statusset_exit
mov rbx, [rbx+10]

cmp qword ptr [rbx+20], #0
je PlayerController_statusset_exit
cmp dword ptr [rsi+20], #0
je PlayerController_statusset_exit
mov rdx, [rbx+20]
mov [rdx+14], (float)0

cmp qword ptr [rbx+28], #0
je PlayerController_statusset_exit
cmp dword ptr [rsi+28], #0
je PlayerController_statusset_exit
mov rdx, [rbx+28]
mov [rdx+14], (float)0

cmp qword ptr [rbx+30], #0
je PlayerController_statusset_exit
cmp dword ptr [rsi+30], #0
je PlayerController_statusset_exit
mov rdx, [rbx+30]
mov [rdx+14], (float)0

cmp qword ptr [rbx+38], #0
je PlayerController_statusset_exit
cmp dword ptr [rsi+38], #0
je PlayerController_statusset_exit
mov rdx, [rbx+38]
mov [rdx+14], (float)0

cmp qword ptr [rbx+40], #0
je PlayerController_statusset_exit
cmp dword ptr [rsi+40], #0
je PlayerController_statusset_exit
mov rdx, [rbx+40]
mov [rdx+14], (float)0

cmp qword ptr [rbx+48], #0
je PlayerController_statusset_exit
cmp dword ptr [rsi+48], #0
je PlayerController_statusset_exit
mov rdx, [rbx+48]
mov [rdx+14], (float)0

cmp qword ptr [rbx+50], #0
je PlayerController_statusset_exit
cmp dword ptr [rsi+50], #0
je PlayerController_statusset_exit
mov rdx, [rbx+50]
mov [rdx+14], (float)0

cmp qword ptr [rbx+58], #0
je PlayerController_statusset_exit
cmp dword ptr [rsi+58], #0
je PlayerController_statusset_exit
mov rdx, [rbx+58]
mov [rdx+14], (float)0
PlayerController_statusset_exit:

cmp dword ptr [PlayerController_invincibleset_enable], #0
je PlayerController_invincibleset_exit
mov byte ptr [rsi+120], #1
PlayerController_invincibleset_exit:

mov rbx, [PlayerController_temp1]
mov rdx, [PlayerController_temp2]


PlayerController_originalcode:
db 48 8B 46 68 48 8B C8
//mov rax,[rsi+68]
//mov rcx,rax


PlayerController_exit:
jmp PlayerController_returnhere


PlayerController_searchedAOB + 3:
PlayerController_savedAOB:
jmp PlayerController_newmem
nop
nop
PlayerController_returnhere:


[DISABLE]
PlayerController_savedAOB:
db 48 8B 46 68 48 8B C8
//mov rax,[rsi+68]
//mov rcx,rax

unregistersymbol(PlayerController_savedAOB)

dealloc(PlayerController_newmem)
dealloc(PlayerController_temp1)
dealloc(PlayerController_temp2)"""

