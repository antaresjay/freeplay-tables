[[cheat]]
id = "infinite-ship-health"
name = "Infinite Ship Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

 
 
aobscan(shiphealth,0F B6 87 13 01 00 00) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
mov eax,[edi+18]
cmp eax,100000
jna code
mov eax,[eax+28]
cmp eax,100000
jna code
fld [eax+bc]
fstp [eax+c0]
code:
  movzx eax,byte ptr [edi+00000113]
  jmp return

shiphealth:
  jmp newmem
  nop
  nop
return:
registersymbol(shiphealth)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
shiphealth:
  db 0F B6 87 13 01 00 00

unregistersymbol(shiphealth)
dealloc(newmem)"""

