source = """
// Game Executable   : Diceomancer.exe
// Author            : ndck76
// Executable Version: 2022.3.3.37772
// Game Version      : v1.0.9
// Script Date       : 2025-01-09


define(address,RollNumber.RNumber:NumberChangeEffect+9b)
define(bytes,0F B6 87 90 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,RollNumber.RNumber:NumberChangeEffect+9b)

label(code)
label(return)
label(data2)
registersymbol(data2)

newmem:

code:
  mov [data2],rdi
  movzx eax,byte ptr [rdi+00000090]
  jmp return

data2:
  db

address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  db bytes
  // movzx eax,byte ptr [rdi+00000090]

dealloc(*)
unregistersymbol(*)"""

