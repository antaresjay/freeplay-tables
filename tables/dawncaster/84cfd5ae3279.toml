[[cheat]]
id = "player-handler-ctrl-numpad-2-click-on-the-player-avatar-on-the-lower-left-to-populate-values"
name = "Player Handler (Ctrl + Numpad 2) {Click on the player avatar on the lower left to populate values}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Dawncaster.exe
// Author            : ndck76
// Executable Version: 2022.3.62.28864
// Game Version      : v1.17.007
// Script Date       : 2026-02-11


[ENABLE]

aobscanregion(strength,TalentPanel:LoadCharacterData,TalentPanel:LoadCharacterData+4000,486380xxxx000044xxxx0Fxxxxxxxxxx48B8xxxxxxxxxxxx000048xxxx48xxxx83xxxx66xx) //TalentPanel:LoadCharacterData+1c39
alloc(newmem,$1000,strength)
alloc(data,8)
alloc(strengthbkp,7)
registersymbol(data)
registersymbol(strength)
registersymbol(strengthbkp)
label(code)
label(return)

strengthbkp:
  readmem(strength,7)

newmem:
  mov [data],rax

code:
  readmem(strength,7)
  jmp return

strength:
  jmp newmem
  nop 2
return:

[DISABLE]

strength:
  readmem(strengthbkp,7)

unregistersymbol(*)
dealloc(*)"""

