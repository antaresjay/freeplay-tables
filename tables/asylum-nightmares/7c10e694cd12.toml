newmem:
  mov [data],rax

code:
  readmem(isgrounded,7)
  jmp return

isgrounded:
  jmp newmem
  nop 2
return:

[DISABLE]

isgrounded:
  readmem(isgroundedbkp,7)

unregistersymbol(*)
dealloc(*)"""
