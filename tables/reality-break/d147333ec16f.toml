type = "script"
source = """
// Game Executable   : Reality Break.exe
// Author            : ndck76
// Executable Version: 2019.4.31.23231
// Game Version      : v1.00.1
// Script Date       : 2025-04-07


[ENABLE]

aobscanmodule(combattime,GameAssembly.dll,F3xxxxxxxxxxxxxx33xx488BxxE8xxxxxxxx33xx488BxxE8xxxxxxxx488Bxxxxxxxxxx488B) //CPlayer.OnUpdate
alloc(newmem,$1000,combattime)
alloc(data,8)
alloc(combattimebkp,8)
registersymbol(data)
registersymbol(combattime)
registersymbol(combattimebkp)
label(code)
label(return)

combattimebkp:
  readmem(combattime,8)

newmem:
  mov [data],rdi

code:
  readmem(combattime,8)
  jmp return

combattime:
  jmp newmem
  nop 3
return:

[DISABLE]

combattime:
  readmem(combattimebkp,8)

unregistersymbol(*)
dealloc(*)"""

