[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Othercide.exe
  Version: 
  Date   : 2020-07-29
  Author : 

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(hpmouseover,GameAssembly.dll,44 8B 70 10 33 D2 48 8B CF) // should be unique
alloc(newmem,$1000,hpmouseover)

label(code)
label(return)

label(fhealth)
registersymbol(fhealth)
label(apflag)
registersymbol(apflag)
label(fdodge)
registersymbol(fdodge)
label(farmor)
registersymbol(farmor)
label(fohk)
registersymbol(fohk)
label(fzerododge)
registersymbol(fzerododge)
label(fzeroarmor)
registersymbol(fzeroarmor)

newmem:
push rdx
push rcx
cmp [rdi+B8], 0
je code
mov rcx, [rdi+B8]
cmp [rcx+20],1
jne enemycheck

cmp [fhealth], 1
jne @F
cmp [rdi+90], 0 // Health
je code
mov rdx, [rdi+90]
mov [rcx+28], #9999 //max health
mov [rdx+10], #9999 //current health

@@:
cmp [apflag], 1
jne @F
cmp [rdi+98], 0 // AP
je code
mov rdx, [rdi+98]
mov [rdx+10], (float)100 //current AP

@@:
cmp [fdodge], 1
jne @F
cmp [rdi+A0], 0 // Dodge
je code
mov rdx, [rdi+A0]
mov [rdx+10], (float)1 //current Dodge

@@:
cmp [farmor], 1
jne code
cmp [rdi+A8], 0 // Armor
je code
mov rdx, [rdi+A8]
mov [rdx+10], #100 //current Armor
mov [rcx+4C], #100 //max armor
jmp code

enemycheck:

cmp [fohk], 1
jne @F
cmp [rdi+90], 0 // Easy Kills
je code
mov rdx, [rdi+90]
mov [rcx+28], #1
mov [rdx+10], #1

@@:
cmp [fzerododge], 1
jne @F
cmp [rdi+A0], 0 // Enemy Zero Dodge
je code
mov rdx, [rdi+A0]
mov [rdx+10], 0

@@:
cmp [fzeroarmor], 1
jne code
cmp [rdi+A8], 0 // Enemy Zero Armor
je code
mov rdx, [rdi+A8]
mov [rdx+10], 0
mov [rcx+4C], 0

code:
pop rcx
pop rdx
  mov r14d,[rax+10]
  xor edx,edx
  jmp return

fhealth:
dd 0
apflag:
dd 0
fdodge:
dd 0
farmor:
dd 0
fohk:
dd 0
fzerododge:
dd 0
fzeroarmor:
dd 0

hpmouseover:
  jmp newmem
  nop
return:
registersymbol(hpmouseover)

[DISABLE]

hpmouseover:
  db 44 8B 70 10 33 D2

unregistersymbol(hpmouseover)
dealloc(newmem)

