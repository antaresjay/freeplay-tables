type = "script"
source = """
[ENABLE]
registersymbol(Player_JumpScript_basepointer)
registersymbol(Player_JumpScript_update_enable)
registersymbol(Player_JumpScript_set_enable)

alloc(Player_JumpScript_basepointer, 8)
