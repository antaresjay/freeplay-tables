[[cheat]]
id = "game-manager-ctrl-numpad-1"
name = "Game Manager (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : CampZ.exe
// Author            : ndck76
// Executable Version: 2021.2.14.40468
// Game Version      : Build.17838867
// Script Date       : 2025-05-04


[ENABLE]

aobscanregion(stoptimer,GameManager:Update,GameManager:Update+100,0FB6xxxx85xx0Fxxxxxxxxxx0Fxxxxxx85xx0FxxxxxxxxxxF3xxxxxxxxF3xxxxxxF2xxxxxxxx90) //GameManager:Update+23
alloc(newmem,$1000,stoptimer)
alloc(data,8)
alloc(stoptimerbkp,6)
registersymbol(data)
registersymbol(stoptimer)
registersymbol(stoptimerbkp)
label(code)
label(return)

stoptimerbkp:
  readmem(stoptimer,6)

newmem:
  mov [data],rsi

code:
  readmem(stoptimer,6)
  jmp return

stoptimer:
  jmp newmem
  nop
return:

[DISABLE]

stoptimer:
  readmem(stoptimerbkp,6)

unregistersymbol(*)
dealloc(*)"""

