[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(modsssssss,Medic_PacificWar-Win64-Shipping.exe,48 89 5C 24 20 48 8B 98 D0 02 00 00 48 85 DB)
alloc(newmem,$1000)

label(code)
label(return)


label(gimmep)
registersymbol(gimmep)


newmem:
  mov [rsp+20],rbx

  push r11
  push rcx

  mov [gimmep], rax

code:
  pop rcx
  pop r11

  mov rbx,[rax+000002D0]
  test rbx,rbx
  jmp return

gimmep:
dq 0


modsssssss:
  jmp far newmem
  nop
return:
registersymbol(modsssssss)

[DISABLE]

modsssssss:
  db 48 89 5C 24 20 48 8B 98 D0 02 00 00 48 85 DB

unregistersymbol(modsssssss)
unregistersymbol(gimmep)
dealloc(newmem)"""

