[[cheat]]
id = "gems"
name = "Gems"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(gemAOB,8b 46 08 39 f8 x x 2b c7 89 46 08)

label(basePointer)
registersymbol(basePointer)
registersymbol(gemAOB)

alloc(newmem,2048)
label(returnhere)
label(exit)

newmem:
mov [basePointer],esi
mov eax,[esi+08]
cmp eax,edi

jmp exit

exit:
jmp returnhere

///
basePointer:
dd 0
///

gemAOB:
jmp newmem
returnhere:

[DISABLE]
dealloc(newmem)
gemAOB:
mov eax,[esi+08]
cmp eax,edi

unregistersymbol(basePointer)
unregistersymbol(gemAOB)"""

