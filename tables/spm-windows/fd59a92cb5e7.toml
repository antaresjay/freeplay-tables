[[cheat]]
id = "infinite-money"
name = "Infinite Money"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
aobscan(money,D9 87 AC 00 00 00 D9 5D B0 D9 45 B0 83 EC 0C 83 EC 04 D9 1C 24)
registersymbol(money)
newmem: //this is allocated memory, you have read,write,execute access
//place your code here
cmp [edi+000000AC],(float)999999999
ja originalcode
mov [edi+000000AC],(float)999999999
originalcode:
fld dword ptr [edi+000000AC]

jmp returnhere

money://InGameBaseScreen:RefreshBarsInfo+177:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
money://
  db D9 87 AC 00 00 00
unregistersymbol(money)"""

