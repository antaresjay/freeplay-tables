[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(herohealthcheckzeroAOB,83 BE E4 02 00 00 00 0F 8E ** ** ** ** 80 BE 94 00 00 00 01)
registersymbol(herohealthcheckzeroAOB)
aobscan(somesubAOB,29 03 8B 1B 8B 4C 24 14)
registersymbol(somesubAOB)
aobscan(somewriteAOB,89 0A 5E 59 C2 08 00)
registersymbol(somewriteAOB)

label(pHero)
registersymbol(pHero)
label(bUndead)
registersymbol(bUndead)
label(bInfAmmo)
registersymbol(bInfAmmo)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

label(newmem2)
label(returnhere2)
label(originalcode2)
label(exit2)
label(checkBUndead2)
label(checkPHero2)
label(checkBInfAmmo2)
label(doInfAmmo2)

label(newmem6)
label(returnhere6)
label(originalcode6)
label(exit6)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
mov [pHero],esi

originalcode:
cmp dword ptr [esi+000002E4],00

exit:
jmp returnhere

newmem2: //this is allocated memory, you have read,write,execute access
//place your code here
sub [ebx],eax
pushfd

checkBUndead2:
cmp byte ptr [bUndead],1
je checkPHero2

checkBInfAmmo2:
cmp byte ptr [bInfAmmo],1
je doInfAmmo2

jmp originalcode2

checkPHero2:
mov ecx,[pHero]
lea ecx,[ecx+2e4]
cmp ebx,ecx
jne checkBInfAmmo2
cmp [ebx],1
jge originalcode2
mov [ebx],1
jmp originalcode2

doInfAmmo2:
cmp [ebx-4],64
jne originalcode2
cmp eax,1
je originalcode2
mov [ebx],64
jmp originalcode2

originalcode2:
popfd
//sub [ebx],eax
mov ebx,[ebx]
mov ecx,[esp+14]

exit2:
jmp returnhere2

///

newmem6:
mov [edx],ecx
pushfd
mov esi,[pHero]
lea esi,[esi+2e4]
cmp edx,esi
jne originalcode6
cmp [edx],1
jge originalcode6
mov [edx],1

originalcode6:
popfd
//mov [edx],ecx
pop esi
pop ecx
ret 0008

exit6:
jmp returnhere6

///
pHero:
dd 0
bUndead:
db 0
bInfAmmo:
db 0
///

herohealthcheckzeroAOB: //"Flashback.exe"+B0AE75:
jmp newmem
nop
nop
returnhere:

somesubAOB: //"Flashback.exe"+4CF61:
jmp newmem2
nop
nop
nop
returnhere2:

somewriteAOB: //"Flashback.exe"+4C675:
jmp newmem6
nop
nop
returnhere6:




[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
herohealthcheckzeroAOB: //"Flashback.exe"+B0AE75:
db 83 BE E4 02 00 00 00
//Alt: cmp dword ptr [esi+000002E4],00
somesubAOB: //"Flashback.exe"+4CF61:
db 29 03 8B 1B 8B 4C 24 14
//Alt: sub [ebx],eax
//Alt: mov ebx,[ebx]
//Alt: mov ecx,[esp+14]
somewriteAOB: //"Flashback.exe"+4C675:
db 89 0A 5E 59 C2 08 00
//Alt: mov [edx],ecx
//Alt: pop esi
//Alt: pop ecx
//Alt: ret 0008
unregistersymbol(herohealthcheckzeroAOB)
unregistersymbol(somesubAOB)
unregistersymbol(somewriteAOB)
unregistersymbol(pHero)
unregistersymbol(bUndead)
unregistersymbol(bInfAmmo)"""

