[[cheat]]
id = "easy-heavy-shot-fast-charge"
name = "Easy Heavy Shot (fast charge)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(chargepreandafterwriteAOB,89 41 18 8B 44 24 08 F3 0F 11 00 C2 08 00)
registersymbol(chargepreandafterwriteAOB)
aobscan(chargingwriteAOB,F3 0F 58 44 24 10 8B 44 24 14 F3 0F 11 07 5F)
registersymbol(chargingwriteAOB)

label(pCharge)
registersymbol(pCharge)
label(bAlwaysChargedShot)
registersymbol(bAlwaysChargedShot)
label(fChargeMultiplier)
registersymbol(fChargeMultiplier)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

label(newmem2)
label(returnhere2)
label(originalcode2)
label(exit2)
label(setFull2)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
cmp [esp+8],edi
jne originalcode
lea eax,[eax-328]
cmp [esp+C],eax
mov eax,[esp+8]
jne originalcode
mov [pCharge],eax

originalcode:
movss [eax],xmm0
ret 0008

exit:
jmp returnhere

///

newmem2:
cmp [pCharge],edi
jne originalcode2
cmp byte ptr [bAlwaysChargedShot],1
je setFull2
movss [edi],xmm0
fld dword ptr [edi]
fmul dword ptr [fChargeMultiplier]
fstp dword ptr [edi]
movss xmm0,[edi]
jmp originalcode2

setFull2:
movss xmm0,[edi-4]

originalcode2:
movss [edi],xmm0
pop edi

exit2:
jmp returnhere2

///
pCharge:
dd 0
bAlwaysChargedShot:
db 0
fChargeMultiplier:
dd (float)2.0
///

chargepreandafterwriteAOB+7: //"Flashback.exe"+4B2F5:
jmp newmem
nop
nop
returnhere:

chargingwriteAOB+a: //"Flashback.exe"+4DF4E:
jmp newmem2
returnhere2:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
chargepreandafterwriteAOB+7: //"Flashback.exe"+4B2F5:
db F3 0F 11 00 C2 08 00
//Alt: movss [eax],xmm0
//Alt: ret 0008
chargingwriteAOB+a: //"Flashback.exe"+4DF4E:
db F3 0F 11 07 5F
//Alt: movss [edi],xmm0
//Alt: pop edi
unregistersymbol(chargepreandafterwriteAOB)
unregistersymbol(chargingwriteAOB)
unregistersymbol(pCharge)
unregistersymbol(bAlwaysChargedShot)
unregistersymbol(fChargeMultiplier)"""

