[[cheat]]
id = "exp-multiplier"
name = "EXP Multiplier"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : TRINITY TRIGGER.exe
  Version:
  Date   : 2024-05-09
  Author : Silver-Cavan

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(EXP,GameAssembly.dll,03 C3 33 D2 89 44 F7 2C) // should be unique
alloc(newmem,$1000,EXP)
alloc(EXPMultiplier,4)
registersymbol(EXPMultiplier)
label(code)
label(return)

EXPMultiplier:
  dd (int)10

newmem:

code:
  imul eax,[EXPMultiplier]
  add eax,ebx
  xor edx,edx
  mov [rdi+rsi*8+2C],eax
  jmp return

EXP:
  jmp newmem
  nop 3
return:
registersymbol(EXP)

[DISABLE]

EXP:
  db 03 C3 33 D2 89 44 F7 2C

unregistersymbol(*)
dealloc(*)"""

