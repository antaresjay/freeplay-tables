[[cheat]]
id = "godmode-9999hp-on-hit"
name = "GodMode (9999HP on hit)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : TRINITY TRIGGER.exe
  Version:
  Date   : 2024-05-08
  Author : Silver-Cavan

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(GodMode,GameAssembly.dll,41 33 C1 89 41 10) // should be unique
alloc(newmem,$1000,GodMode)
alloc(EnableMonsterDamage, 4)
registersymbol(EnableMonsterDamage)
alloc(MonsterHP, 4)
registersymbol(MonsterHP)
label(NormalCode)
label(return)
label(PlayerCheck)
label(MonsterDamage)


EnableMonsterDamage:
  db (int)1

MonsterHP:
  db (int)0


newmem:


PlayerCheck:
  cmp [rbx+16C],0
  je MonsterDamage
  mov eax,270F
  jmp NormalCode

MonsterDamage:
  cmp [EnableMonsterDamage],0
  jne NormalCode
  mov eax,[MonsterHP]
  jmp NormalCode

NormalCode:
  xor eax,r9d
  mov [rcx+10],eax
  jmp return

GodMode:
  jmp newmem
  nop

return:
registersymbol(GodMode)

[DISABLE]

GodMode:
  db 41 33 C1 89 41 10

unregistersymbol(*)
dealloc(*)"""

