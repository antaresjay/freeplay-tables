[[cheat]]
id = "player-stats-base-address-scan-initialization-activate-this-first"
name = "Player Stats Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(playerstats_basepointer)
registersymbol(playerstats_update_enable)
registersymbol(playerstats_invincibilityset_enable)
registersymbol(playerstats_livesset_enable)
registersymbol(playerstats_bombsset_enable)
registersymbol(playerstats_powerupsset_enable)
registersymbol(playerstats_chargeset_enable)

//00FD5981 - 8B EC                 - mov ebp,esp
//00FD5983 - 69 45 08 9C000000     - imul eax,[ebp+08],0000009C
// Accesses Score
//00FD598A - 8B 80 C0C86003        - mov eax,[eax+0360C8C0]
//00FD5990 - 5D                    - pop ebp
//00FD5991 - C3                    - ret
aobscan(playerstats_initialization_searchedAOB, 8B 80 C0 C8 60 03 5D C3)

alloc(playerstats_basepointer, 4, playerstats_initialization_searchedAOB)
alloc(playerstats_update_enable, 4, playerstats_initialization_searchedAOB)
alloc(playerstats_invincibilityset_enable, 4, playerstats_initialization_searchedAOB)
alloc(playerstats_livesset_enable, 4, playerstats_initialization_searchedAOB)
alloc(playerstats_bombsset_enable, 4, playerstats_initialization_searchedAOB)
alloc(playerstats_powerupsset_enable, 4, playerstats_initialization_searchedAOB)
alloc(playerstats_chargeset_enable, 4, playerstats_initialization_searchedAOB)


[DISABLE]
unregistersymbol(playerstats_basepointer)
unregistersymbol(playerstats_update_enable)
unregistersymbol(playerstats_invincibilityset_enable)
unregistersymbol(playerstats_livesset_enable)
unregistersymbol(playerstats_bombsset_enable)
unregistersymbol(playerstats_powerupsset_enable)
unregistersymbol(playerstats_chargeset_enable)

dealloc(playerstats_basepointer)
dealloc(playerstats_update_enable)
dealloc(playerstats_invincibilityset_enable)
dealloc(playerstats_livesset_enable)
dealloc(playerstats_bombsset_enable)
dealloc(playerstats_powerupsset_enable)
dealloc(playerstats_chargeset_enable)"""

[[cheat]]
id = "player-stats-base-address-scan-to-update-play-level"
name = "Player Stats Base Address Scan (To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstats_update_exit)
label(playerstats_invincibilityset_exit)
label(playerstats_livesset_exit)
label(playerstats_bombsset_exit)
label(playerstats_powerupsset_exit)
label(playerstats_chargeset_exit)

registersymbol(playerstats_originalcode)
registersymbol(playerstats_savedAOB)

//00FD5981 - 8B EC                 - mov ebp,esp
//00FD5983 - 69 45 08 9C000000     - imul eax,[ebp+08],0000009C
// Accesses Score
//00FD598A - 8B 80 C0C86003        - mov eax,[eax+0360C8C0]
//00FD5990 - 5D                    - pop ebp
//00FD5991 - C3                    - ret
aobscan(playerstats_searchedAOB, 8B 80 C0 C8 60 03 5D C3)

alloc(playerstats_newmem, 2048, playerstats_searchedAOB)
alloc(playerstats_temp1, 4, playerstats_searchedAOB)
alloc(playerstats_temp2, 4, playerstats_searchedAOB)
alloc(playerstats_temp3, 4, playerstats_searchedAOB)
alloc(playerstats_temp4, 4, playerstats_searchedAOB)
alloc(playerstats_temp5, 4, playerstats_searchedAOB)


playerstats_newmem:
mov [playerstats_temp1], eax
mov [playerstats_temp2], ebx
mov [playerstats_temp3], ecx
mov [playerstats_temp4], edx

cmp dword ptr [playerstats_update_enable], #0
je playerstats_update_exit
mov [playerstats_basepointer], eax
playerstats_update_exit:

cmp dword ptr [playerstats_invincibilityset_enable], #0
je playerstats_invincibilityset_exit
mov word ptr [eax+360c8f6], #315
playerstats_invincibilityset_exit:

cmp dword ptr [playerstats_livesset_enable], #0
je playerstats_livesset_exit
mov byte ptr [eax+360c8bc], #100
playerstats_livesset_exit:

cmp dword ptr [playerstats_bombsset_enable], #0
je playerstats_bombsset_exit
mov byte ptr [eax+360c8be], #99
playerstats_bombsset_exit:

cmp dword ptr [playerstats_powerupsset_enable], #0
je playerstats_powerupsset_exit
mov byte ptr [eax+360c8e1], #4
mov byte ptr [eax+360c8e2], #4
playerstats_powerupsset_exit:

cmp dword ptr [playerstats_chargeset_enable], #0
je playerstats_chargeset_exit
mov word ptr [eax+360c912], #18982
playerstats_chargeset_exit:

mov eax, [playerstats_temp1]
mov ebx, [playerstats_temp2]
mov ecx, [playerstats_temp3]
mov edx, [playerstats_temp4]


playerstats_originalcode:
readmem(playerstats_searchedAOB, 6)


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB:
playerstats_savedAOB:
jmp playerstats_newmem
nop
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
readmem(playerstats_originalcode, 6)

unregistersymbol(playerstats_originalcode)
unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)
dealloc(playerstats_temp1)
dealloc(playerstats_temp2)
dealloc(playerstats_temp3)
dealloc(playerstats_temp4)
dealloc(playerstats_temp5)"""

