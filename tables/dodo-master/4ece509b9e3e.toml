[[cheat]]
id = "brain-dodo-ctrl-numpad-1"
name = "Brain Dodo (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Dodo Master.exe
// Author            : ndck76
// Executable Version: 2022.3.62.28864
// Game Version      : Build.21189150
// Script Date       : 2025-12-30


[ENABLE]

aobscanregion(controller,BRAIN_dodo:dodoMovement,BRAIN_dodo:dodoMovement+1000,488Bxxxx48xxxx83xxxx66xx49BBxxxxxxxxxxxx000041xxxx40xxxxxxxxxxxx48xxxxxxxxxxxx0Fxxxxxx85xx74xx66xxxxxx) //BRAIN_dodo:dodoMovement+1a
alloc(newmem,$1000,controller)
alloc(data,8)
alloc(controllerbkp,7)
registersymbol(data)
registersymbol(controller)
registersymbol(controllerbkp)
label(code)
label(return)

controllerbkp:
  readmem(controller,7)

newmem:
  mov [data],rsi

code:
  readmem(controller,7)
  jmp return

controller:
  jmp newmem
  nop 2
return:

[DISABLE]

controller:
  readmem(controllerbkp,7)

unregistersymbol(*)
dealloc(*)"""

