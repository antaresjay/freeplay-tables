[[cheat]]
id = "no-ammo-ability-reload"
name = "No Ammo Ability Reload"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(DarriusAmmo,Kingmaker.UnitLogic.Abilities.AbilityData:get_AmmoRequired,Kingmaker.UnitLogic.Abilities.AbilityData:get_AmmoRequired+140,48 63 80 8C 01 00 00)
alloc(newmem,$1000,DarriusAmmo)

label(code)
label(return)

newmem:
mov [rax+18C],#6

code:
  movsxd  rax,dword ptr [rax+0000018C]
  jmp return

DarriusAmmo:
  jmp newmem
  nop 2
return:
registersymbol(DarriusAmmo)

[DISABLE]

DarriusAmmo:
  db 48 63 80 8C 01 00 00

unregistersymbol(DarriusAmmo)
dealloc(newmem)"""
