type = "script"
source = """
[ENABLE]

aobscanmodule(cashcash,GameAssembly.dll, 41 89 5C B0 20 FF 47 1C 48 8B 5C 24 30 48 8B 74 24 38)
alloc(newmem,$1000,cashcash)

label(code)
label(return)

newmem:
  push rdx

  mov rdx, #99999
  mov ebx, edx

code:
  pop rdx

  mov [r8+rsi*4+20],ebx
  inc [rdi+1C]
  mov rbx,[rsp+30]
  mov rsi,[rsp+38]
  jmp return

cashcash:
  jmp far newmem
  nop
  nop
  nop
  nop
return:
registersymbol(cashcash)

[DISABLE]

cashcash:
  db 41 89 5C B0 20 FF 47 1C 48 8B 5C 24 30 48 8B 74 24 38

unregistersymbol(cashcash)
dealloc(newmem)"""
