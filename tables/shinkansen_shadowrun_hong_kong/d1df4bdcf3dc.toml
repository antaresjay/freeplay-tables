registersymbol(Player_savedAOB)

//1461110C - 8B 7D 08              - mov edi,[ebp+08]
//1461110F - D9EE                  - fldz
// Player:Update+11
//14611111 - D9 9D D8FDFFFF        - fstp dword ptr [ebp-00000228]
//14611117 - C7 85 DCFDFFFF 00000000 - mov [ebp-00000224],00000000
//14611121 - C7 85 E0FDFFFF 00000000 - mov [ebp-00000220],00000000
//1461112B - C7 85 E4FDFFFF 00000000 - mov [ebp-0000021C],00000000
//14611135 - C7 85 E8FDFFFF 00000000 - mov [ebp-00000218],00000000
//1461113F - C7 85 ECFDFFFF 00000000 - mov [ebp-00000214],00000000
//14611149 - C7 85 F0FDFFFF 00000000 - mov [ebp-00000210],00000000
//14611153 - C7 85 F4FDFFFF 00000000 - mov [ebp-0000020C],00000000
//1461115D - C7 85 F8FDFFFF 00000000 - mov [ebp-00000208],00000000
//14611167 - C7 85 FCFDFFFF 00000000 - mov [ebp-00000204],00000000
//14611171 - C7 85 00FEFFFF 00000000 - mov [ebp-00000200],00000000
//1461117B - C7 85 04FEFFFF 00000000 - mov [ebp-000001FC],00000000
//14611185 - C7 85 08FEFFFF 00000000 - mov [ebp-000001F8],00000000
//1461118F - C7 85 0CFEFFFF 00000000 - mov [ebp-000001F4],00000000
//14611199 - C7 85 10FEFFFF 00000000 - mov [ebp-000001F0],00000000
//146111A3 - C7 85 14FEFFFF 00000000 - mov [ebp-000001EC],00000000
//146111AD - C7 85 18FEFFFF 00000000 - mov [ebp-000001E8],00000000
//146111B7 - C7 85 1CFEFFFF 00000000 - mov [ebp-000001E4],00000000
//146111C1 - C7 85 20FEFFFF 00000000 - mov [ebp-000001E0],00000000
//146111CB - 8D 85 24FEFFFF        - lea eax,[ebp-000001DC]
//146111D1 - 83 EC 04              - sub esp,04
//146111D4 - 6A 1C                 - push 1C
//146111D6 - 6A 00                 - push 00
//146111D8 - 50                    - push eax
//146111D9 - E8 EA0C05F0           - call 04661EC8
//146111DE - 83 C4 10              - add esp,10
// Accesses IsNPC
//146111E1 - 0FB6 87 08020000      - movzx eax,byte ptr [edi+00000208]
aobscan(Player_searchedAOB, D9 9D D8 FD FF FF C7 85 DC FD FF FF 00 00 00 00)

alloc(Player_newmem, 2048)
alloc(Player_temp1, 4)
alloc(Player_temp2, 4)


Player_newmem:
mov [Player_temp1], ebx
mov [Player_temp2], ecx

// Is NPC check
cmp byte ptr [edi+20c], #0
jne Player_statsset_exit

cmp dword ptr [Player_update_enable], #0
je Player_update_exit
//mov [Player_basepointer], edi
Player_update_exit:

cmp dword ptr [Player_set_enable], #0
je Player_set_exit
Player_set_exit:

cmp dword ptr [Player_hpset_enable], #0
je Player_hpset_exit
cmp dword ptr [edi+98], #0
je Player_hpset_exit
mov ebx, [edi+98]
mov ecx, [ebx+30]
mov [ebx+164], #0
mov [edi+c8], ecx
Player_hpset_exit:

cmp dword ptr [Player_apset_enable], #0
je Player_apset_exit
mov byte ptr [edi+24c], #0
cmp dword ptr [edi+98], #0
je Player_apset_exit
mov ebx, [edi+98]
cmp dword ptr [ebx+34], #0
je Player_apset_exit
mov ecx, [ebx+34]
mov [edi+c4], ecx
Player_apset_exit:

cmp dword ptr [Player_karmaset_enable], #0
