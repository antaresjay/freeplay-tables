cmp dword ptr [edi+130], #0
je Player_karmaset_exit
mov ebx, [edi+130]
mov [ebx+130], #9999
Player_karmaset_exit:

cmp dword ptr [Player_statsset_enable], #0
je Player_statsset_exit
// Attributes
cmp dword ptr [edi+98], #0
je Player_statsset_exit
mov ebx, [edi+98]
mov [ebx+c], #17
mov [ebx+10], #11
mov [ebx+14], #15
mov [ebx+18], #12
mov [ebx+1c], #9
mov [ebx+20], #11
