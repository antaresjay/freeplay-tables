[[cheat]]
id = "item-base-address-scan-to-activate-battle-to-update-battle"
name = "Item Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Item_savedAOB)
label(Item_returnhere)
label(Item_originalcode)
label(Item_exit)

label(Item_update_exit)
label(Item_set_exit)

registersymbol(Item_savedAOB)

//3048DA23 - 8B C8                 - mov ecx,eax
//3048DA25 - 39 09                 - cmp [ecx],ecx
// WeaponGroupEntry:UpdateWeapon+3ff
//3048DA27 - 8B 40 38              - mov eax,[eax+38]
//3048DA2A - 50                    - push eax
//3048DA2B - DB 04 24              - fild dword ptr [esp]
//3048DA2E - D9 1C 24              - fstp dword ptr [esp]
//3048DA31 - D9 04 24              - fld dword ptr [esp]
//3048DA34 - 83 C4 04              - add esp,04
//3048DA37 - 8B 47 30              - mov eax,[edi+30]
//3048DA3A - 8B 40 08              - mov eax,[eax+08]
//3048DA3D - 8B C8                 - mov ecx,eax
aobscan(Item_searchedAOB, 8B 40 38 50 DB 04 24 D9 1C 24 D9 04 24 83 C4 04 8B 47 30)

alloc(Item_newmem, 2048)


Item_newmem:
cmp dword ptr [Item_update_enable], #0
je Item_update_exit
mov [Item_basepointer], eax
Item_update_exit:

cmp dword ptr [Item_set_enable], #0
je Item_set_exit
mov [eax+38], #999
Item_set_exit:


Item_originalcode:
db 8B 40 38 50 DB 04 24
//mov eax,[eax+38]
//push eax
//fild dword ptr [esp]


Item_exit:
jmp Item_returnhere


Item_searchedAOB:
Item_savedAOB:
jmp Item_newmem
nop
nop
Item_returnhere:


[DISABLE]
Item_savedAOB:
db 8B 40 38 50 DB 04 24
//mov eax,[eax+38]
//push eax
//fild dword ptr [esp]

unregistersymbol(Item_savedAOB)

dealloc(Item_newmem)"""

