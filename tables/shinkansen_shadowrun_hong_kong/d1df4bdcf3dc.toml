je Player_statsset_exit
mov ebx, [edi+130]
mov [ebx+15c], #170
// Skills
cmp dword ptr [edi+a0], #0
je Player_statsset_exit
mov ebx, [edi+a0]
mov [ebx+c], #11
mov [ebx+10], #15
mov [ebx+14], #15
mov [ebx+18], #11
mov [ebx+1c], #9
mov [ebx+24], #12
mov [ebx+28], #12
mov [ebx+38], #9
mov [ebx+48], #9
mov [ebx+4c], #11
mov [ebx+58], #1
mov [ebx+5c], #1
mov [ebx+60], #1
mov [ebx+64], #1
mov [ebx+68], #1
mov [ebx+6c], #1
mov [ebx+70], #1
mov [ebx+74], #1
mov [ebx+78], #1
mov [ebx+7c], #11
mov [ebx+88], #7
// Specializations
cmp dword ptr [edi+a4], #0
je Player_statsset_exit
mov ebx, [edi+a4]
mov [ebx+18], #11
mov [ebx+1c], #11
mov [ebx+20], #11
mov [ebx+24], #11
mov [ebx+2c], #15
mov [ebx+34], #15
mov [ebx+5c], #12
mov [ebx+60], #9
mov [ebx+64], #9
mov [ebx+68], #7
Player_statsset_exit:

mov ebx, [Player_temp1]
mov ecx, [Player_temp2]


Player_originalcode:
db D9 9D D8 FD FF FF
//fstp dword ptr [ebp-00000228]


Player_exit:
jmp Player_returnhere


Player_searchedAOB:
Player_savedAOB:
jmp Player_newmem
nop
Player_returnhere:


[DISABLE]
Player_savedAOB:
db D9 9D D8 FD FF FF
//fstp dword ptr [ebp-00000228]

unregistersymbol(Player_savedAOB)

dealloc(Player_newmem)
dealloc(Player_temp1)
dealloc(Player_temp2)"""

