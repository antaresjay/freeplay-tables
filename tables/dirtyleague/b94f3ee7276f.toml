type = "script"
source = """
//Send@Sintrix|FearlessRevolution
define(address,Modules.Battle.Battler:get_hp)
define(bytes,48 83 EC 08 48 89 34 24)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Modules.Battle.Battler:get_hp)

label(code)
label(return)

newmem:
push rcx
mov rcx,[rcx+40]
mov rcx,[rcx+30]
mov [rcx+AC],9999

code:
  pop rcx
  sub rsp,08
  mov [rsp],rsi
  jmp return

address:
  jmp newmem
  nop 3
return:

[DISABLE]

address:
  db bytes


dealloc(*)"""

