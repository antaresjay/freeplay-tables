[[cheat]]
id = "x-sol-exodus-script-1-2-read-table-extras"
name = "[X] <== SOL Exodus Script 1.2  (Read Table Extras)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
===========================================
 Game Title    : SOL Exodus
 Game Version  : 1.11.4831
 Proces Name   : SOLExodus.exe
 Script Version: 1.2
 CE Version    : 6.1
 Release date  : 26-Feb-2012
 Author        : Recifense
 Features:
 - God Mode
 - Super Reinforced Friends;
 - Instantly Cool Down;
 - Unlimited Afterburn;
 - Minimum Missiles;
===========================================
}

[ENABLE]
//=========================================
// Check if script is compatible to this game version
// If false the script will not be loaded

assert(SOLExodus.exe+8281c6,d9 86 a4 02 00 00)
assert(SOLExodus.exe+09ef7d,8b 44 24 10 29 03)

//=========================================
alloc(MyCode,1024)
//=========================================
// Declaration section
label(_MonPlayer)
label(_MonP0)
label(_MonP1)
label(_MonP2)
label(_BackMP)
label(_ExitMP)
label(_GodMode)
label(_BackGM)
label(_ExitGM)
label(pHP)
label(pCommon)
label(pPlayer)
label(iEnableGM)
label(iEnableMU)
label(iEnableCD)
label(iEnableAB)
label(iEnableMM)
label(fXMM1)
label(fMinHP)

//=========================================
// Registering Symbols
registersymbol(MyCode)
registersymbol(pHP)
registersymbol(pPlayer)
registersymbol(iEnableGM)
registersymbol(iEnableMU)
registersymbol(iEnableCD)
registersymbol(iEnableAB)
registersymbol(iEnableMM)

//=========================================
MyCode:
//=========================================
_MonPlayer:
 cmp dword ptr [esi+000006fc],0    // 00000724
 jne _ExitMP

 cmp dword ptr [esi+00000710],0    // 00000738
 jne _MonP0

 mov [pPlayer],esi

 lea edi,[esi+000002f0]
 mov [pHP],edi

 mov edi,[esi+000007c4]            // 000007ec
 mov [pCommon],edi

 cmp dword ptr [iEnableCD],0
 je _MonP1                         // Jump if feature is disabled

 mov dword ptr [esi+00000888],0    // Cooldown = ready (000008b0)

_MonP1:
 cmp dword ptr [iEnableAB],0
 je _MonP2                         // Jump if feature is disabled

 mov dword ptr [esi+0000089c],0    // Afterburn = ready 000008C4

_MonP2:
 cmp dword ptr [iEnableMM],0
 je _MonP0                         // Jump if feature is disabled

 cmp dword ptr [esi+000006f8],0    // 00000720
 je _MonP0

 mov edi,#50
 cmp edi,[esi+000006f8]
 jle _MonP0

 mov [esi+000006f8],edi

_MonP0:
 cmp dword ptr [iEnableMU],0
 je _ExitMP                        // Jump if feature is disabled

 movss [fXMM1],xmm1

 movss xmm1,[fMinHP]
 movss [esi+00000788],xmm1         // 000007b0
 cvtss2si edi,xmm1
 mov [esi+000002f0],edi

 movss xmm1,[fXMM1]

_ExitMP:
 fld dword ptr [esi+000002A4]      // Original code
 jmp _BackMP                       // Back to main code

//=========================================
// Vehicles
_GodMode:
 cmp dword ptr [iEnableGM],0
 je _ExitGM                        // Jump if feature is disabled

 cmp ebx,[pHP]
 jne _ExitGM

 xor eax,eax
 mov [esp+10],eax                  // value2decrease = 0

_ExitGM:
 mov eax,[esp+10]                  // Original code
 sub [ebx],eax                     // Original code
 jmp _BackGM                       // Back to main code

//=========================================
 db '============================>'
 db 'CE6.1 Script by Recifense 022612'
//=========================================
// Variables
iEnableGM:
 dd 0
iEnableMU:
 dd 0
iEnableCD:
 dd 0
iEnableAB:
 dd 0
iEnableMM:
 dd 0
pHP:
 dd MyCode
pCommon:
 dd MyCode
pPlayer:
 dd MyCode
fMinHP:
 dd (float)610000
fXMM1:
 dd 0

//=========================================
// Hacking Points
SOLExodus.exe+8281c6:
 jmp _MonPlayer
 nop
_BackMP:

SOLExodus.exe+09ef7d:
 jmp _GodMode
 nop
_BackGM:

//=========================================
// Script for Restoring Original Codes
[DISABLE]
SOLExodus.exe+8281c6:
// fld dword ptr [esi+000002A4]
 db d9 86 a4 02 00 00

SOLExodus.exe+09ef7d:
// mov eax,[esp+10]
// sub [ebx],eax
 db 8b 44 24 10 29 03

//=========================================
// Unregistering Symbols
unregistersymbol(MyCode)
unregistersymbol(pHP)
unregistersymbol(iEnableGM)
unregistersymbol(iEnableMU)
unregistersymbol(iEnableCD)
unregistersymbol(iEnableAB)
unregistersymbol(iEnableMM)
unregistersymbol(pPlayer)

//=========================================
dealloc(MyCode)
//============= Scripts End ===============

// ****************************************
// NOTES
// ****************************************
{
}"""

