[[cheat]]
id = "cooldown-timer-toggle"
name = "Cooldown Timer Toggle"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(originalcode)
label(exit)
label(CooldownTimer)
registersymbol(CooldownTimer)
aobscan(AOB1,d9 9d f0 00 00 00 d9 85 f4 00 00 00 8b 85 84 00 00 00)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here

originalcode:
fstp dword ptr [ebp+000000F0]
mov [ebp+000000F0],(float)0

exit:
jmp returnhere

AOB1:
CooldownTimer:
jmp newmem
nop
returnhere:

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
CooldownTimer:
fstp dword ptr [ebp+000000F0]
//Alt: db D9 9D F0 00 00 00
unregistersymbol(CooldownTimer)"""
