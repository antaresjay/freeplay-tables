[[cheat]]
id = "globalwork-base-address-scan-initialization-activate-this-first"
name = "GlobalWork Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GlobalWork_basepointer)
registersymbol(GlobalWork_update_enable)
registersymbol(GlobalWork_confidenceset_enable)

alloc(GlobalWork_basepointer, 4)
alloc(GlobalWork_update_enable, 4)
alloc(GlobalWork_confidenceset_enable, 4)


[DISABLE]
unregistersymbol(GlobalWork_basepointer)
unregistersymbol(GlobalWork_update_enable)
unregistersymbol(GlobalWork_confidenceset_enable)

dealloc(GlobalWork_basepointer)
dealloc(GlobalWork_update_enable)
dealloc(GlobalWork_confidenceset_enable)"""

[[cheat]]
id = "globalwork-base-address-scan-to-activate-play-level-to-update-play-level"
name = "GlobalWork Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GlobalWork_savedAOB)
label(GlobalWork_returnhere)
label(GlobalWork_originalcode)
label(GlobalWork_exit)

label(GlobalWork_update_exit)
label(GlobalWork_confidenceset_exit)

registersymbol(GlobalWork_originalcode)
registersymbol(GlobalWork_savedAOB)

//0F5984D5 - 85 C0                 - test eax,eax
//0F5984D7 - 8B 05 DC7E3809        - mov eax,[09387EDC] : [09C22EE0]
// GSMain:Mess_window_main+1d
//0F5984DD - 8B 80 C4000000        - mov eax,[eax+000000C4]
//0F5984E3 - 85 C0                 - test eax,eax
//0F5984E5 - 39 3F                 - cmp [edi],edi
//0F5984E7 - 0FB6 47 5F            - movzx eax,byte ptr [edi+5F]
//0F5984EB - 8B F0                 - mov esi,eax
//0F5984ED - 83 FE 0B              - cmp esi,0B
aobscan(GlobalWork_searchedAOB, 8B 80 C4 00 00 00 85 C0 39 3F 0F B6 47 5F)

alloc(GlobalWork_newmem, 2048, GlobalWork_searchedAOB)
alloc(GlobalWork_temp1, 4, GlobalWork_searchedAOB)
alloc(GlobalWork_temp2, 4, GlobalWork_searchedAOB)
alloc(GlobalWork_temp3, 4, GlobalWork_searchedAOB)
alloc(GlobalWork_temp4, 4, GlobalWork_searchedAOB)
alloc(GlobalWork_temp5, 4, GlobalWork_searchedAOB)


GlobalWork_newmem:
mov [GlobalWork_temp1], eax
mov [GlobalWork_temp2], ebx
mov [GlobalWork_temp3], ecx
mov [GlobalWork_temp4], edx

cmp dword ptr [GlobalWork_update_enable], #0
je GlobalWork_update_exit
mov [GlobalWork_basepointer], eax
GlobalWork_update_exit:

cmp dword ptr [GlobalWork_confidenceset_enable], #0
je GlobalWork_confidenceset_exit
cmp byte ptr [eax+3c], #4
je GlobalWork_confidenceset_exit
mov byte ptr [eax+cb], #5
mov word ptr [eax+a2], #80
mov word ptr [eax+a4], #80
GlobalWork_confidenceset_exit:

mov eax, [GlobalWork_temp1]
mov ebx, [GlobalWork_temp2]
mov ecx, [GlobalWork_temp3]
mov edx, [GlobalWork_temp4]


GlobalWork_originalcode:
readmem(GlobalWork_searchedAOB, 6)


GlobalWork_exit:
jmp GlobalWork_returnhere


GlobalWork_searchedAOB:
GlobalWork_savedAOB:
jmp GlobalWork_newmem
nop
GlobalWork_returnhere:


[DISABLE]
GlobalWork_savedAOB:
readmem(GlobalWork_originalcode, 6)

unregistersymbol(GlobalWork_originalcode)
unregistersymbol(GlobalWork_savedAOB)

dealloc(GlobalWork_newmem)
dealloc(GlobalWork_temp1)
dealloc(GlobalWork_temp2)
dealloc(GlobalWork_temp3)
dealloc(GlobalWork_temp4)
dealloc(GlobalWork_temp5)"""

