[[cheat]]
id = "reset-stop-hack-timer"
name = "Reset/Stop Hack Timer"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule( HackTimer, Prey.exe, 83BF????????0674??488D4F??E8 )
registersymbol( HackTimer )
alloc( Hook, 0x1000, Prey.exe )
label( back )

Hook:
cmp dword ptr [rdi+F0],5
jne @f
  push rax                  // save register state
  push rbx                  // save register state
  mov eax,[rdi+88]          // get timer offset
  mov rbx,[rdi+110]         // get timer properties base
  lea rax,[rax+rax*2]       // get to default timer value
  movss xmm0,[rbx+rax*8+8]  // overwrite xmm0
  pop rbx                   // restore register state
  pop rax                   // restore register state
  movss [rdi+78],xmm0       // update display timer
  movss [rdi+7C],xmm0       // update timer
@@:
cmp dword ptr [rdi+F0],6
jmp back

HackTimer:
jmp Hook
db 90 90
back:

[DISABLE]

HackTimer:
db 83 BF F0 00 00 00 06

unregistersymbol( HackTimer )
dealloc( Hook )"""

[[cheat]]
id = "freeze-mission-timer"
name = "Freeze Mission Timer"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule( MissionTimer, Prey.exe, 488D4D??0F28C8E8????????4C )
registersymbol( MissionTimer )
alloc( Hook, 0x1000, Prey.exe )
label( back )

Hook:
addss xmm0,xmm1       // add back the subtracted amount
movss [rcx+48],xmm0   // refresh mission timer value
@@:
lea rcx,[rbp+30]
movaps xmm1,xmm0
jmp back

MissionTimer:
jmp Hook
db 90 90
back:

[DISABLE]

MissionTimer:
db 48 8D 4D 30 0F 28 C8

unregistersymbol( MissionTimer )
dealloc( Hook )"""

[[cheat]]
