type = "script"
source = """
[ENABLE]

aobscanmodule( InventoryReader, Prey.exe, FF92F00000008BF8488B0D????????48 )
registersymbol( InventoryReader )
alloc( Hook, 0x1000, Prey.exe )
label( back )
label( pItem )
registersymbol( pItem )

Hook:
mov [pItem],rcx
call [rdx+F0]
jmp back

pItem:
dq 0

InventoryReader:
jmp Hook
db 90
back:

[DISABLE]

InventoryReader:
db FF 92 F0 00 00 00

unregistersymbol( pItem )
unregistersymbol( MissionTimer )
dealloc( Hook )"""

