[[cheat]]
id = "inventory-item-editor"
name = "Inventory Item Editor"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule( InventoryReader, PreyDll.dll, FF92F0000000894518488D452848 )
registersymbol( InventoryReader )
alloc( Hook, 0x1000, PreyDll.dll )
label( back )
label( pItem )
registersymbol( pItem )

Hook:
mov [pItem],rcx
call [rdx+F0]
jmp back

pItem:
dq 0

InventoryReader:
jmp Hook
db 90
back:

[DISABLE]

InventoryReader:
db FF 92 F0 00 00 00

unregistersymbol( pItem )
unregistersymbol( InventoryReader )
dealloc( Hook )"""

