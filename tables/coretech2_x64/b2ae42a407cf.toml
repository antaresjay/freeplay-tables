MyCode:
//========================================= ok
// RTS - ALL Units
_MonHP:
 push rdi
 push rsi
 push r15

 push r12                          // Armengue because of CE61
 pop rsi

 mov rdi,[rsi+000000f0]            // pTroop
 test rdi,rdi
 jz _ExitMH

 mov rdi,[rdi+00000140]            // pOwner
 test rdi,rdi
 jz _ExitMH

 mov ebx,[rdi+00000160]            // ID
 and ebx,000000ff
 jnz _ExitMH

 mov r15,pOwner
 mov [r15],rdi

 mov r15,iEnableGM
 cmp dword ptr [r15],0
 je _MonH0                         // Jump if feature is disabled

 mov edi,#610050
 mov [rsi+00000104],edi
 mov edi,#87150
 mov [rsi+10],edi

_MonH0:
 mov r15,iEnableMU
 cmp dword ptr [r15],0
 je _ExitMH                        // Jump if feature is disabled

 mov edi,#2000
 cmp dword ptr [rsi+20],0
 je _MonH1

 mov edi,#4000

_MonH1:
 cmp edi,[rsi+14]
 jle _ExitMH

 mov [rsi+14],edi

_ExitMH:
 mov rbp,[rsi+000000F0]            // Original code

 pop r15
 pop rsi
 pop rdi
 jmp _BackMH                       // Back to main code

//========================================= ok
// RTS - Under attack
_GodMode:
 push r15

 mov r15,iEnableGM
 cmp dword ptr [r15],0
 je _ExitGM                        // Jump if feature is disabled

 mov rax,[rsi+000000f0]            // pTroop
 test rax,rax
 jz _ExitGM

 mov rax,[rax+00000140]            // pOwner
 test rax,rax
 jz _ExitGM

 mov eax,[rax+00000160]            // ID
 and eax,000000ff
 jnz _ExitGM

 mov eax,#610050
 mov [rsi+00000104],eax
 mov eax,#87150
 mov [rsi+10],eax

 xor ebp,ebp                       // value2decrease = 0

_ExitGM:
 pop r15

 sub [rsi+00000104],ebp            // Original code
 jmp _BackGM                       // Back to main code

//========================================= ok
// RTS - when spending Mana
_MonMana:
 push r15

 test edx,edx
 jns _ExitMM

 mov r15,iEnableMM
 cmp dword ptr [r15],0
 je _ExitMM                        // Jump if feature is disabled

 mov rax,[rcx+00000200]            // pTroop (Base-110)
 test rax,rax
 jz _ExitMM

 mov rax,[rax+00000140]            // pOwner
 test rax,rax
 jz _ExitMM

 mov eax,[rax+00000160]            // ID
 and eax,000000ff
 jne _ExitMM

 mov eax,[rcx+00000660]            // SpentMana
 add [rcx+00000578],eax

 xor eax,eax                       // Value2decrease = 0
 mov edx,eax

 mov [rcx+00000660],eax            // SpentMana = 0

_ExitMM:
 pop r15

 add [rcx+00000578],edx            // Original code
 jmp _BackMM                       // Back to main code

//========================================= ok NHP
// RTS - Minimum = 50
_MonShield:
 push r15

 mov r15,iEnableMS
 cmp dword ptr [r15],0
 je _ExitMS                        // Jump if feature is disabled

 mov rax,[rcx+10]                  // pOwner
 test rax,rax
 jz _ExitMS

 mov eax,[rax+00000160]            // ID
 and eax,000000ff
 jnz _ExitMS

 mov eax,#50
 cmp eax,[rcx+18]
 jle _ExitMS

 mov [rcx+18],eax                  // Shield = 50

_ExitMS:
 pop r15

 mov rbx,rcx                       // Original code
 mov eax,[rcx+18]                  // Original code Shield
 jmp _BackMS                       // Back to main code

//========================================= ok
// RTS - when decreasing Will
_MonWill:
 push r15
 push rdi

 mov r15,iEnableMW
 cmp dword ptr [r15],0
 je _ExitMW                        // Jump if feature is disabled

 mov rdi,[rbx+00000140]            // pOwner
 test rdi,rdi
 jz _ExitMW

 mov eax,[rdi+00000160]            // ID
 and eax,000000ff
 jnz _ExitMW

 xor edx,edx                       // Value2decrease = 0

 mov edi,[rbx+10]
 mov [rbx+000001a4],edi            // Max Will
 mov edi,[rbx+000001a8]
 test edi,edi
 jns _ExitMW

 mov [rbx+000001a8],edx            // Negative Will = 0

_ExitMW:
 pop rdi
 pop r15

 sub [rbx+000001A4],edx            // Original code
 jmp _BackMW                       // Back to main code

//========================================= ok
// TBS - Select Troop Info Screen
_MonTroop:
 push r15

 mov r11,[rsi+000001F0]            // Original code

 mov r15,pUnit
 mov [r15],r11

 mov rdx,[r11+08]
 test rdx,rdx
 jz _ExitMT

 mov r15,iEnableMT
 cmp dword ptr [r15],0
 je _MonT00                        // Jump if feature is disabled

 mov r8d,[rdx+34]                  // Get max size
 mov [r11+00000158],r8d            // Update Size

_MonT00:
 mov r15,iEnableMMp
 cmp dword ptr [r15],0
 je _ExitMT                        // Jump if feature is disabled

 mov rdx,[r11+00000140]            // pArmy
 test rdx,rdx
 jz _ExitMT

 mov r8d,#8000
 cmp r8d,[rdx+0000011c]
 jle _ExitMT

 mov [rdx+0000011c],r8d

_ExitMT:
 pop r15
 jmp _BackMT                       // Back to main code

//========================================= ok NHP
// TBS Main Screen
_MonGold:
