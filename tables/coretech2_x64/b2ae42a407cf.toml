_ExitMHr:
 pop r15

 mov edx,[rbx+00000584]            // Original code (skill points)
 jmp _BackMHr                      // Back to main code

//========================================= ok
// TBS Main Screen
_MonMP:
 push r15
 push rax

 mov r15,iEnableMMp
 cmp dword ptr [r15],0
 je _ExitMMp                       // Jump if feature is disabled

 mov rax,[rdi+68]
 mov r15,pGold
