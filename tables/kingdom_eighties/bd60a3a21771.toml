type = "script"
source = """
[ENABLE]

aobscanmodule(Stamina_AOB,GameAssembly.dll,0F 2F 80 94 03 00 00 73) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov [eax+00000394],(float)1
code:
  comiss xmm0,[eax+00000394]
  jmp return

Stamina_AOB:
  jmp newmem
  nop 2
return:
registersymbol(Stamina_AOB)

[DISABLE]

Stamina_AOB:
  db 0F 2F 80 94 03 00 00

unregistersymbol(Stamina_AOB)
dealloc(newmem)"""
