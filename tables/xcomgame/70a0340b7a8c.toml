aobscan(AOB_ActiveSoldier,8B 45 0 A3 * * * * 39 BE)
label(STATIC_ActiveSoldier)
registersymbol(STATIC_ActiveSoldier)
AOB_ActiveSoldier+4:
STATIC_ActiveSoldier:

