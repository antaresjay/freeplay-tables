[[cheat]]
id = "readme"
name = "<<<<<----------  README  ---------->>>>>"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
 Game: XCOM: Enemy Unknown
 Table Author: Jason Goemaat

------------------------------------------------------------------------------
BARRACKS SOLDIER EDITOR
------------------------------------------------------------------------------
HP/Aim/Defense/Will - self explanatory
Movement - Squares you can normally move, change from 12 to 48 to be able to
    move 4x as far
Selected Soldier Address - copy this value, hit CTRL+M to bring up memory
    viewer, hit CTRL+D to bring up structure dissector, paste address into
    text box, select "Barracks Soldier" from the Structures menu.  CTRL+A will
    add another column, right-click on address and pick 'LOCK' to save the
    values somewhere else in memory, you can then enter a description into
    the address box if you want.  Right-click and organize into groups
    to see differences.
EDIT NAMES AT YOUR OWN RISK, they are there to verify which soldier you are
    working on, changing them could crash your game or corrupt saves.
CLASS: DOES NOT CHANGE STRING DESCRIPTION, but does affect abilities and
    weapons available.  Changing to sniper let me equip sniper rifle and
    switching back left it there.
            1=Sniper, 2=Heavy, 3=Support, 4=Assault
LEVEL: 7 is max, haven't tried more
XP: I AM NOT SURE, but I think this is it.  If it is, 2000 will probably
    get you to level 7, 90 is probably start for squadie, and you probably
    need to do a mission to level up
Abilities: Set to 1 to give ability to soldier.  Tested on a soldier with all
    standard abilities, it got pretty crowded.  Bullet Swarm didn't seem to
    work, you might have to be the correct class for some abilities?

Notes:
  Country doesn't affect it everywhere

Thanks:
  tfigment: for psi flag and ability level offsets
  lakesh: for inventory structure offsets
  VeeEss: for ability offsets

------------------------------------------------------------------------------
MISSION SOLDIER EDITOR
------------------------------------------------------------------------------
F8 - Toggle Free Move - As long as you just move in the blue area, this will
    let you keep moving over and over
F9 - Super Soldier - gives current soldier 999 health/aim/defense/will

Values - lets you edit individual values for the selected soldier for the
    current mission, they will revert to normal when the mission is over

------------------------------------------------------------------------------
AOB STATICS
------------------------------------------------------------------------------
NOTE: IF THE VALUES DO NOT MATCH WHAT YOU SEE IN GAME, YOU HAVE TO CHANGE
THE OFFSETS AS SHOWN IN THE ORIGINAL POST ON THE FORUM.  EDIT THE VALUE ABOVE
"2A8" BY USING THE LEFT AND RIGHT ARROWS.  THESE VALUES CAN CHANGE AFTER
CERTAIN MISSIONS AND YOU MAY NEED TO UPDATE.  I'M WORKING ON AUTOMATING THIS.

Static pointers for Money, Scientists and Engineers found using AOBSCAN on
code that accesses the base pointer.  These are only valid while at the base.
DO NOT CHANGE if the values shown don't match what you see in-game or it will
crash (DUH!)

------------------------------------------------------------------------------
INVENTORY
------------------------------------------------------------------------------
Copy the "__Inventory Address_" value and CTRL+M to open the memory viewer then
CTRL+D to open the structure dissector.  Paste the value and select Inventory
from the Structures menu to investigate further.

------------------------------------------------------------------------------
Investigation/Testing
------------------------------------------------------------------------------
These are entries I use for finding cheats, they are just there for if anyone
is curious

------------------------------------------------------------------------------
Update 1: Added Money, Inventory, hotkey for super-soldier

Update 2: Complete revamp, included barracks soldier editor, found injection
    to use for MISSION SOLDIER EDITOR, it should be more reliable now, including
    13 checks that it is a unit and 4 checks that it is a player and not an
    alien. Added F8 - Toggle Free Move that lets you repeatedly move as long as
    you don't go far enough to dash or do something else to end your turn
    like attack or reload.  Added Scientists and Engineers under AOB STATICS

Update 3: Fixed for game update, working on script to find addresses

Update 4: Inventory values, static going off the same base as money/scientists/
    engineers

Update 5: Added class, level, xp (maybe) and Abilities to barracks soldier editor, see
    notes for details.  Filled in inventory structure with some higher level
    items I've aquired.  Some abilities

Future Plans:
    1) Prevent soldier from getting poisoned/hurt
    2) Let soldier reload/fire/dash and keep moving (can use ability)
    *3) Inventory table values (more values)
    4) Uplink capacity so you can launch lots of satellites
    5) Find timers for construction projects
}

[ENABLE]
[DISABLE]"""

[[cheat]]
id = "barracks-soldier-editor"
name = "BARRACKS SOLDIER EDITOR"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(aob,A1 * * * * 83 B8 4C 01 00 00 00 74 7c 83 b8 54 01 00 00 01 75 73 8d 4c 24 1c 51 8b cd)
label(STATIC_BarracksSoldier)
registersymbol(STATIC_BarracksSoldier)
aob+1:
STATIC_BarracksSoldier:

[DISABLE]
unregistersymbol(STATIC_BarracksSoldier)

{
        STATIC
AOB: A1 * * * * 83 B8 * * 00 00 00 74 7c 83 b8 * * 00 00 01 75 73 8d 4c 24 1c 51 8b cd

XComGame.exe+1C499C - 8B 4C 24 28           - mov ecx,[esp+28]
XComGame.exe+1C49A0 - 64 89 0D 00000000     - mov fs:[00000000],ecx
XComGame.exe+1C49A7 - 59                    - pop ecx
XComGame.exe+1C49A8 - 5F                    - pop edi
XComGame.exe+1C49A9 - 5E                    - pop esi
XComGame.exe+1C49AA - 5D                    - pop ebp
XComGame.exe+1C49AB - 83 C4 24              - add esp,24
XComGame.exe+1C49AE - C2 1000               - ret 0010
XComGame.exe+1C49B1 - 83 BD 4C020000 00     - cmp dword ptr [ebp+0000024C],00
XComGame.exe+1C49B8 - 75 0D                 - jne XComGame.exe+1C49C7
XComGame.exe+1C49BA - 83 BD 78040000 00     - cmp dword ptr [ebp+00000478],00
XComGame.exe+1C49C1 - 0F84 EF010000         - je XComGame.exe+1C4BB6
XComGame.exe+1C49C7 - A1 7072CD01           - mov eax,[XComGame.exe+1A07270] <<<<< here
XComGame.exe+1C49CC - 83 B8 4C010000 00     - cmp dword ptr [eax+0000014C],00
XComGame.exe+1C49D3 - 74 7C                 - je XComGame.exe+1C4A51
XComGame.exe+1C49D5 - 83 B8 54010000 01     - cmp dword ptr [eax+00000154],01
XComGame.exe+1C49DC - 75 73                 - jne XComGame.exe+1C4A51
XComGame.exe+1C49DE - 8D 4C 24 1C           - lea ecx,[esp+1C]
XComGame.exe+1C49E2 - 51                    - push ecx
XComGame.exe+1C49E3 - 8B CD                 - mov ecx,ebp
}"""

