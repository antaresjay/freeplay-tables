source = """
{
 The offsets needed to access the values vary from game to game, it could be
 if you started with the tutorial, or if you haven't gotten to the situation
 room yet, I'm just not sure.  The scripts below have some values that worked
 at different times, try checking them one-by-one to alter the offsets and
 see if your values look better.  You can also edit the offsets directly and
 the table will update in a second or so.  You can also edit the scripts
 and enter the values there, then re-check them to update the values.

OFFSET_3_Money:
  dd 240

OFFSET_3_Scientists:
  dd 44C

OFFSET_3_Engineers:
  dd 450

OFFSET_3_Inventory:
  dd 468

  If people post the offsets on the forumn, you can try changing the script
  to those values and clicking 'OK' to save it, then unchecking it if it is
  checked and checking it again to over-write those values.  Unchecking and
  re-checking the parent "AOB STATICS" will overwrite those values with the
  default, if you want to change back to your custom values so you will need to
  check the custom script again.

  Check this entry to see test values, you can try out different offsets by
  using the left/right arrows on the bottom offset to change it until you see
  the correct value, then put that value in the script.
}

[ENABLE]
[DISABLE]"""

