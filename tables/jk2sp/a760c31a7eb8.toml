[[cheat]]
id = "all-in-one"
name = "All-In-One"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(ammo,jk2gamex86.dll,89 32 8B 0D 14 DD 12 20)
alloc(newmem,$100)
label(code)
label(return)
registersymbol(ammo)
newmem:
  mov [edx],3E7
  mov ecx,[2012DD14]
  jmp return
code:
  mov [edx],esi
  mov ecx,[2012DD14]
  jmp return
ammo:
  jmp newmem
  nop 3
return:
[DISABLE]
dealloc(newmem)
unregistersymbol(ammo)
ammo:
  db 89 32 8B 0D 14 DD 12 20"""

