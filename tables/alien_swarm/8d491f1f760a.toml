[[cheat]]
id = "godmode"
name = "Godmode"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]



aobscanmodule(health,server.dll,66 0F 6E 86 D0 00 00 00 0F 5B C0 66 0F) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
mov [esi+000000D0],#300
  movd xmm0,[esi+000000D0]
  jmp return

health:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(health)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
health:
  db 66 0F 6E 86 D0 00 00 00

unregistersymbol(health)
dealloc(newmem)"""

