[[cheat]]
id = "pocket-item-adder-remover"
name = "Pocket Item Adder / Remover"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[enable]

  ijmscripts+C00:
  push r13
  mov r13,flag
  adder:
  cmp byte ptr [r13+01],1
  jne subber
  sub rsp,20
  mov rcx,ptr_ThingPackage
  mov rcx,[rcx]
  test rcx,rcx
  je @f
  mov rdx,tempval+10
  mov rdx,[rdx]
  //mov r8,1 (test)
  mov r8,tempval+18
  mov r8,[r8]
  mov r9,$PlaceTypeC.Pocket
  mov r11,ThingPackage.AddItemOneByOne
  call r11
  mov byte ptr [r13+01],0
  @@:
  add rsp,20
  jmp ender

  subber:
  cmp byte ptr [r13+02],1
  jne ender
  sub rsp,20
  mov rcx,ptr_ThingPackage
  mov rcx,[rcx]
  test rcx,rcx
  je @f
  mov rdx,tempval+10
  mov rdx,[rdx]
  mov r8,tempval+18
  mov r8,[r8]
  mov r9,$PlaceTypeC.Pocket
  mov r11,ThingPackage.ReduceItem
  call r11
  mov byte ptr [r13+02],0
  @@:
  add rsp,20

  ender:
  pop r13
  ret

[disable]

  ijmscripts+C00:
  ret

  tempval+10:
  dd 0
  tempval+18:
  dd 1"""

