[[cheat]]
id = "always-straight-flush-gambling"
name = "Always Straight Flush (Gambling)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[enable]

  ijmscripts+800:
  mov rcx,ptr_ProtagonistGambler
  mov rcx,[rcx]
  test rcx,rcx
  je @f
  mov rcx,[rcx+$GamblerC.cardGroup]
  test rcx,rcx
  je @f
    {isShunZi → isStraight
    isSanTiao → isThreeOfAKind
    isTongHua → isFlush
    isDuiZi → isPair
    isDanPai → isHighCard}
  mov byte ptr [rcx+$PokerCardGroupC.isShunZi],1
  mov byte ptr [rcx+$PokerCardGroupC.isTongHua],1
  mov byte ptr [rcx+$PokerCardGroupC.isSanTiao],0
  mov byte ptr [rcx+$PokerCardGroupC.isDuiZi],0
  mov byte ptr [rcx+$PokerCardGroupC.isDanPai],0
  @@:
  ret

[disable]

  ijmscripts+800:
  ret"""

