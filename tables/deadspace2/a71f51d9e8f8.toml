[[cheat]]
id = "dead-space-2-script"
name = "Dead Space 2 Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(DS2,2048)
label(_GodMode)
label(_BackGM)
label(_MonAmmo)
label(_ExitMA)
label(_BackMA)
label(_OneHitKill)
label(_ExitOHK)
label(_BackOHK)
label(_MonAir)
label(_ExitAir)
label(_BackAir)
label(_MonMoney)
label(_ExitMM)
label(_BackMM)
label(_MonNodes)
label(_ExitMN)
label(_BackMN)
label(_MonStasis)
label(_ExitMS)
label(_BackMS)
label(_MonHacktime)
label(_ExitHT)
label(_BackHT)

label(pHero)
label(iGM)
label(iMA)
label(iOHK)
label(iAir)
label(iMM)
label(iMN)
label(iMS)
label(iHT)

registersymbol(iGM)
registersymbol(iMA)
registersymbol(iOHK)
registersymbol(pHero)
registersymbol(iAir)
registersymbol(iMM)
registersymbol(iMN)
registersymbol(iMS)
registersymbol(iHT)
//=====================================================================
DS2:
_GodMode:
fld dword ptr [eax+000000E8]
cmp dword ptr [iGM],1
jne _BackGM
mov [eax+000000E8],461C4000
mov [eax+000000EC],3F800000
jmp _BackGM
//=====================================================================
_MonAmmo:
cmp dword ptr [iMA],1
jne _ExitMA
db 90,90,90,90,90,90
jmp _BackMA

_ExitMA:
mov [esi+0000039C],ebp
jmp _BackMA
//=====================================================================
_OneHitKill:
 push eax
 mov eax,[deadspace2.exe+01CB6918]
 mov eax,[eax+1EC]
 mov [pHero],eax
 pop eax

 pushfd
 cmp dword ptr [iOHK],1
 jne _ExitOHK

 cmp [pHero],edi
 je _ExitOHK

 mov [edi+000000E8],0
 movss xmm0,[edi+000000E8]
 jmp _ExitOHK

_ExitOHK:
 popfd
 movss [edi+000000E8],xmm0
 jmp _BackOHK
//=====================================================================
_MonAir:
cmp dword ptr [iAir],1
jne _ExitAir
db 90,90,90,90,90
jmp _BackAir

_ExitAir:
movss [esi+74],xmm0
jmp _BackAir
//=====================================================================
_MonMoney:
cmp dword ptr [iMM],1
jne _ExitMM
cmp eax,1E23A
jge _ExitMM
mov eax,1E23A

_ExitMM:
mov [ecx+28],eax
jmp 00DCD43D
jmp _BackMM
//=====================================================================
_MonNodes:
cmp dword ptr [iMN],1
jne _ExitMN
cmp eax,1
jge _ExitMN
mov eax,1

_ExitMN:
mov [ecx+0000042C],eax
jmp _BackMN
//=====================================================================
_MonStasis:
cmp dword ptr [iMS],1
jne _ExitMS
mov [ecx+000000F0],43480000
jmp _BackMS

_ExitMS:
movss [ecx+000000F0],xmm0
jmp _BackMS
//=====================================================================
_MonHacktime:
cmp dword ptr [iHT],1
jne _ExitHT
mov [0204C3FC],0

_ExitHT:
subss xmm0,[0204C3FC]
jmp _BackHT
//=====================================================================
iGM:
 dd 1
pHero:
 dd 0
iMA:
 dd 1
iOHK:
 dd 1
iAir:
 dd 1
iMM:
 dd 1
iMN:
 dd 1
iMS:
 dd 1
iHT:
 dd 1
//=====================================================================
deadspace2.exe+4A7105:
jmp _GodMode
nop
_BackGM:

deadspace2.exe+9BA807:
jmp _MonAmmo
nop
_BackMA:

deadspace2.exe+B8460C:
jmp _OneHitKill
nop
nop
nop
_BackOHK:

deadspace2.exe+496166:
jmp _MonAir
_BackAir:

deadspace2.exe+9CD431:
jmp _MonMoney
_BackMM:

deadspace2.exe+4A7194:
jmp _MonNodes
nop
_BackMN:

deadspace2.exe+B55655:
jmp _MonStasis
nop
nop
nop
_BackMS:

deadspace2.exe+789314:
jmp _MonHacktime
nop
nop
nop
_BackHT:
//=====================================================================
[DISABLE]
deadspace2.exe+4A7105:
fld dword ptr [eax+000000E8]

deadspace2.exe+9BA807:
mov [esi+0000039C],ebp

deadspace2.exe+B8460C:
movss [edi+000000E8],xmm0

deadspace2.exe+496166:
movss [esi+74],xmm0

deadspace2.exe+9CD431:
mov [ecx+28],eax
jmp 00DCD43D

deadspace2.exe+4A7194:
mov [ecx+0000042C],eax

deadspace2.exe+B55655:
movss [ecx+000000F0],xmm0

deadspace2.exe+789314:
subss xmm0,[0204C3FC]

dealloc(DS2)
unregistersymbol(iGM)
unregistersymbol(iMA)
unregistersymbol(iOHK)
unregistersymbol(pHero)
unregistersymbol(iAir)
unregistersymbol(iMM)
unregistersymbol(iMN)
unregistersymbol(iMS)
unregistersymbol(iHT)"""

