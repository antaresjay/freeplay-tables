 Table Version : 3.2
 Script Version: 1.1
 Script Cheat  : Enable Character Stats (Out of Battle) Editor

 History:
    07-October-2015 v3.2 -> grandia2.exe v1.05
       - Fixed the Infinite MP script for Mareg

    02-October-2015 v3.1.1 -> grandia2.exe v1.05
       - Fixed a bug in the Enable Character Stats Editor script

    01-October-2015 v3.1 -> grandia2.exe v1.05
       - Completed the accessories section in the inventory editor

    14-September-2015 v3.0 -> grandia2.exe v1.04
       - Created scripts to fetch the stats (out of the battle) pointers. This should make the stats editor compatible with the Steam version of the game and also with future versions
       - Table refactored to use the pointers fetched by the script

    14-September-2015 v2.2 -> grandia2.exe v1.04
       - Updated the static pointers for GOG version 1.04

    14-September-2015 v2.1.1 -> grandia2.exe v1.03
       - Completed armor section in the inventory editor
       - Started working on accessory pointers

    13-September-2015 v2.1 -> grandia2.exe v1.03
       - Added weapons in the inventory editor
       - Started working on armor pointers

    12-September-2015 v2.0.1 -> grandia2.exe v1.03
       - Fixed an error in the Infinite SP script

    12-September-2015 v2.0 -> grandia2.exe v1.03
       - Created  scripts to fetch the inventory pointers.
         This should make the inventory editor compatible with
         the Steam version of the game and also with future versions
       - Table refactored to use the pointers fetched by the scripts

    11-September-2015 v1.2 -> grandia2.exe v1.03
       - Table refactored
       - Added safety check in the Infinite MP script
       - Added safety check in the Infinite SP script

    07-September-2015 v1.1 -> grandia2.exe v1.03
       - Infinite Health (script)
       - Infinite Magic (script)
       - Infinite Special (script)

    05-September-2015 v1.0.1 -> grandia2.exe v1.03
       - Added Inventory pointers

    05-September-2015 v1.0 -> grandia2.exe v1.03
       - Updated Valmere pointers
       - Table refactored
============================================================
}

[ENABLE]

aobscanmodule(fetchStatsPointerAOB,grandia2.exe,0F B7 44 08 4A) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
globalalloc(statsPointer,4)

statsPointer:
  dd 0

newmem:

code:
  mov [statsPointer],ecx   // ecx dovrebbe ancora avere il puntatore alle statistiche
  movzx eax,word ptr [eax+ecx+4A]
  jmp return

fetchStatsPointerAOB:
  jmp code
return:
registersymbol(fetchStatsPointerAOB)

[DISABLE]

fetchStatsPointerAOB:
  db 0F B7 44 08 4A

unregistersymbol(fetchStatsPointerAOB)
dealloc(newmem)
dealloc(statsPointer)

