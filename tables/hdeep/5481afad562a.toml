[[cheat]]
id = "unlimited-pistol-ammo"
name = "Unlimited pistol ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
define(address,"hdeep.exe"+3340A1)
define(bytes,83 E8 01 89 42 4C)

[ENABLE]


assert(address,bytes)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov eax,(int)10

code:
  //sub eax,01
  mov [edx+4C],eax
  jmp return

address:
  jmp newmem
  nop
return:

[DISABLE]

address:
  db bytes
  // sub eax,01
  // mov [edx+4C],eax

dealloc(newmem)"""

