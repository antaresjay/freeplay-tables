[[cheat]]
id = "all-item-x99-activation-open-item"
name = "All Item x99 [Activation: Open Item]"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(infitem,RPG_RT.exe,8B 40 ?? 0F B6 04 10) // should be unique
alloc(newmem,$1000)
alloc(itemcopy,6)
registersymbol(itemcopy)
label(code)
label(return)

itemcopy:
readmem(infitem,7)
newmem:
readmem(infitem,3)
mov byte ptr [eax+edx],#99
readmem(infitem+3,4)
jmp return
code:
readmem(infitem,7)
jmp return

infitem:
  jmp newmem
  nop 2
return:
registersymbol(infitem)

[DISABLE]

infitem:
readmem(itemcopy,7)
unregistersymbol(infitem)
unregistersymbol(itemcopy)
dealloc(newmem)
dealloc(itemcopy)"""

