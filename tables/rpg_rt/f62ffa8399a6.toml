[[cheat]]
id = "character-editor-v2-activation-stats-pick-character"
name = "Character Editor v2 [Activation: Stats > Pick Character]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(stats2,RPG_RT.exe,8B 80 F4 00 00 00 C3) // should be unique
alloc(newmem,$1000)
alloc(statscopy2,6)
alloc(_stats2,8)
registersymbol(_stats2)
registersymbol(statscopy2)
label(code)
label(return)

statscopy2:
  readmem(stats2,6)

newmem:
  mov [_stats2],eax
code:
  readmem(stats2,6)
  jmp return

stats2:
  jmp newmem
  nop
return:
registersymbol(stats2)

[DISABLE]

stats2:
  readmem(statscopy2,6)

unregistersymbol(stats2)
dealloc(newmem)
unregistersymbol(statscopy2)
unregistersymbol(_stats2)
dealloc(_stats2)
dealloc(statscopy2)"""

