[[cheat]]
id = "test-buy-sell"
name = "Test Buy Sell"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(jeje,RPG_RT.exe,8B 53 14 88 04 32 E9) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  cmp al,a
  jae code
  mov edx,[ebx+14]
  mov byte ptr [edx+esi],a //item quantity
  jmp return
code:
  mov edx,[ebx+14]
  mov [edx+esi],al //item quantity
  jmp return

jeje:
  jmp newmem
  nop
return:
registersymbol(jeje)

[DISABLE]

jeje:
  db 8B 53 14 88 04 32

unregistersymbol(jeje)
dealloc(newmem)"""
