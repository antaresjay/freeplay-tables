id = "playercontroller-base-address-scan-initialization-activate-this-first-to-activate-play-level"
name = "PlayerController Base Address Scan Initialization (Activate This First, To Activate: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlayerController_basepointer)
registersymbol(PlayerController_update_enable)
registersymbol(PlayerController_invulnerableset_enable)
registersymbol(PlayerController_healthset_enable)
registersymbol(PlayerController_jumpset_enable)

//2654D355 - 48 83 C4 20           - add rsp,20
//2654D359 - 33 C0                 - xor eax,eax
// Playful.SuperLucky.Gameplay.Player:PlayerController:Update+6b
//2654D35B - 48 89 85 18FFFFFF     - mov [rbp-000000E8],rax
//2654D362 - 89 85 20FFFFFF        - mov [rbp-000000E0],eax
//2654D368 - 48 8B CE              - mov rcx,rsi
//2654D36B - 48 83 EC 20           - sub rsp,20
//2654D36F - 49 BB F0B4E10E00000000 - mov r11,000000000EE1B4F0 : [18EC8348]
//2654D379 - 41 FF D3              - call r11d
//2654D37C - 48 83 C4 20           - add rsp,20
//2654D380 - 85 C0                 - test eax,eax
//2654D382 - 0F84 72000000         - je 2654D3FA
aobscan(PlayerController_initialization_searchedAOB, 48 89 85 18 FF FF FF 89 85 20 FF FF FF 48 8B CE 48 83 EC 20 * * * * * * * * * * 41 FF D3 48 83 C4 20)

alloc(PlayerController_basepointer, 8, PlayerController_initialization_searchedAOB)
alloc(PlayerController_update_enable, 4, PlayerController_initialization_searchedAOB)
alloc(PlayerController_invulnerableset_enable, 4, PlayerController_initialization_searchedAOB)
alloc(PlayerController_healthset_enable, 4, PlayerController_initialization_searchedAOB)
alloc(PlayerController_jumpset_enable, 4, PlayerController_initialization_searchedAOB)


[DISABLE]
unregistersymbol(PlayerController_basepointer)
unregistersymbol(PlayerController_update_enable)
unregistersymbol(PlayerController_invulnerableset_enable)
unregistersymbol(PlayerController_healthset_enable)
unregistersymbol(PlayerController_jumpset_enable)

dealloc(PlayerController_basepointer)
dealloc(PlayerController_update_enable)
dealloc(PlayerController_invulnerableset_enable)
dealloc(PlayerController_healthset_enable)
dealloc(PlayerController_jumpset_enable)"""

[[cheat]]
id = "playercontroller-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerController Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerController_savedAOB)
label(PlayerController_returnhere)
label(PlayerController_originalcode)
label(PlayerController_exit)

label(PlayerController_update_exit)
label(PlayerController_invulnerableset_exit)
label(PlayerController_healthset_exit)
label(PlayerController_jumpset_exit)

registersymbol(PlayerController_originalcode)
registersymbol(PlayerController_savedAOB)

//2654D355 - 48 83 C4 20           - add rsp,20
//2654D359 - 33 C0                 - xor eax,eax
// Playful.SuperLucky.Gameplay.Player:PlayerController:Update+6b
//2654D35B - 48 89 85 18FFFFFF     - mov [rbp-000000E8],rax
//2654D362 - 89 85 20FFFFFF        - mov [rbp-000000E0],eax
//2654D368 - 48 8B CE              - mov rcx,rsi
//2654D36B - 48 83 EC 20           - sub rsp,20
//2654D36F - 49 BB F0B4E10E00000000 - mov r11,000000000EE1B4F0 : [18EC8348]
//2654D379 - 41 FF D3              - call r11d
//2654D37C - 48 83 C4 20           - add rsp,20
//2654D380 - 85 C0                 - test eax,eax
//2654D382 - 0F84 72000000         - je 2654D3FA
aobscan(PlayerController_searchedAOB, 48 89 85 18 FF FF FF 89 85 20 FF FF FF 48 8B CE 48 83 EC 20 * * * * * * * * * * 41 FF D3 48 83 C4 20)

alloc(PlayerController_newmem, 2048, PlayerController_searchedAOB)
alloc(PlayerController_temp1, 8, PlayerController_searchedAOB)
alloc(PlayerController_temp2, 8, PlayerController_searchedAOB)
alloc(PlayerController_temp3, 8, PlayerController_searchedAOB)
alloc(PlayerController_temp4, 8, PlayerController_searchedAOB)
alloc(PlayerController_temp5, 8, PlayerController_searchedAOB)


PlayerController_newmem:
mov [PlayerController_temp1], rax
mov [PlayerController_temp2], rbx
mov [PlayerController_temp3], rcx
mov [PlayerController_temp4], rdx

cmp dword ptr [PlayerController_update_enable], #0
je PlayerController_update_exit
mov [PlayerController_basepointer], rsi
PlayerController_update_exit:

cmp dword ptr [PlayerController_invulnerableset_enable], #0
je PlayerController_invulnerableset_exit
mov rbx, [rsi+88]
test rbx, rbx
je PlayerController_invulnerableset_exit
mov byte ptr [rbx+30], #1
PlayerController_invulnerableset_exit:

cmp dword ptr [PlayerController_healthset_enable], #0
je PlayerController_healthset_exit
mov rbx, [rsi+88]
test rbx, rbx
je PlayerController_healthset_exit
mov ecx, [rbx+24]
mov [rbx+20], ecx
PlayerController_healthset_exit:

cmp dword ptr [PlayerController_jumpset_enable], #0
je PlayerController_jumpset_exit
mov byte ptr [rsi+182], #1
mov byte ptr [rsi+183], #1
mov byte ptr [rsi+23d], #0
PlayerController_jumpset_exit:

mov rax, [PlayerController_temp1]
mov rbx, [PlayerController_temp2]
mov rcx, [PlayerController_temp3]
mov rdx, [PlayerController_temp4]


PlayerController_originalcode:
readmem(PlayerController_searchedAOB, 7)


PlayerController_exit:
jmp PlayerController_returnhere


PlayerController_searchedAOB:
PlayerController_savedAOB:
jmp PlayerController_newmem
nop
nop
PlayerController_returnhere:


[DISABLE]
PlayerController_savedAOB:
readmem(PlayerController_originalcode, 7)

unregistersymbol(PlayerController_originalcode)
unregistersymbol(PlayerController_savedAOB)

dealloc(PlayerController_newmem)
dealloc(PlayerController_temp1)
dealloc(PlayerController_temp2)
dealloc(PlayerController_temp3)
dealloc(PlayerController_temp4)
dealloc(PlayerController_temp5)"""

