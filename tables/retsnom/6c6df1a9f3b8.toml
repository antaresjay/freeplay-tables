[[cheat]]
id = "invincible"
name = "Invincible"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(chkDontTouchHimInZombieMove_OnTriggerEnterAOB,0F B6 40 6D 85 C0 75)
registersymbol(chkDontTouchHimInZombieMove_OnTriggerEnterAOB)

chkDontTouchHimInZombieMove_OnTriggerEnterAOB+5: //ZombieMove:OnTriggerEnter+77:
db E4
//Alt: esp,esp


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
chkDontTouchHimInZombieMove_OnTriggerEnterAOB+5: //ZombieMove:OnTriggerEnter+77:
db C0
//Alt: eax,eax"""

