[[cheat]]
id = "fly-mode"
name = "Fly Mode"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(amountToMoveYWriteInPlatformerController_UpdateAOB,DE E9 D9 58 04 8B 47 2C)
registersymbol(amountToMoveYWriteInPlatformerController_UpdateAOB)

label(bFlyUpOnce)
label(fFlyVSpeed)
registersymbol(fFlyVSpeed)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
label(flymodestart)
label(flymodeexit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
//fstp st(0)
//fldz

pushad
push 20 //Spacebar
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne flymodeexit

cmp byte ptr [bFlyUpOnce],1
jne @f
fstp st(0)
fldz
jmp flymodestart

@@:
fldz
fcomip st(0), st(1)
jbe @f
fstp st(0)
fldz

flymodestart:
pushad
push 'W'
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne @f
mov byte ptr [bFlyUpOnce],1
fstp st(0)
fldz
fadd [fFlyVSpeed]
jmp originalcode

@@:
pushad
push 'S'
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne @f
fstp st(0)
fldz
fsub [fFlyVSpeed]

@@:
jmp originalcode

flymodeexit:
mov byte ptr [bFlyUpOnce],0

originalcode:
fstp dword ptr [eax+04]
mov eax,[edi+2C]

exit:
jmp returnhere

///
bFlyUpOnce:
dd 0
fFlyVSpeed:
dd (float)1
///

amountToMoveYWriteInPlatformerController_UpdateAOB+2: //PlatformerController:Update+4b1:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
amountToMoveYWriteInPlatformerController_UpdateAOB+2: //PlatformerController:Update+4b1:
db D9 58 04 8B 47 2C
//Alt: fstp dword ptr [eax+04]
//Alt: mov eax,[edi+2C]

unregistersymbol(fFlyVSpeed)"""

