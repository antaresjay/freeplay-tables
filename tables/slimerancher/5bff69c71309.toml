mov eax,dword ptr [musicdirectordata+4]
mov rdx,[rcx+eax] // Pointer to Music to Play
mov r8d,[musicdirectordata+8] // Priority
xor r9,r9
test rdx,rdx
je short @f
// Call
sub rsp,20
call "MusicDirector:Enqueue"
add rsp,20
@@:
// Restore Registers
pop r11
pop r10
pop r9
pop r8
pop rdx
pop rcx
pop rax

code:
  // Original Code
  push rbp
  mov rbp,rsp
  sub rsp,000000A0
  jmp return

musicdirectordata:
dd 0 // Flag
dd 20 // Music to Play Offset // Default Music
dd 0 // Priority

address:
  jmp newmem
  nop 6
return:

[DISABLE]

address:
  db bytes

dealloc(newmem)
unregistersymbol(musicdirectordata)"""

