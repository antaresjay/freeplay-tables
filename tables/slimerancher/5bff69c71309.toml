mov [teleregioncoords],r14
// Do Nomal Stuff
cmp [teledata],1
je short save
cmp [teledata],2
je short load
cmp [teledata],3
je presetlocationload
jmp long code

save:
movups [teledata+4],xmm0
movsd [teledata+14],xmm1
mov [teledata],0
jmp short code

load:
movups xmm0,[teledata+4]
movsd xmm1,[teledata+14]
movupd [r14+1F0],xmm0
movsd [r14+200],xmm1
mov [teledata],0
jmp return

presetlocationload:
mov [teledata],0
mov eax,[teledata+1C]
cmp eax,[count]
jge short code
push rcx
imul rax,rax,18
lea rcx,[teledata+20]
add rax,rcx
pop rcx
movupd xmm0,[rax]
movsd xmm1,[rax+10]
movupd [r14+1F0],xmm0

code:
  movsd [r14+00000200],xmm1
  jmp return

align 10 CC

teleregioncoords:
dq 0 // Base Address

count:
dd 4

teledata:
dd 0 // Flag // [teledata]
dq 0 //X-Pos // [teledata+4]
dq 0 //Y-Pos // [teledata+C]
dq 0 //Z-Pos // [teledata+14]
dd 0 //Preset Locations for player to select // [teledata+1C]

// Preset Location Coords // PL

// Ranch // PL = 0
dq (double)89.3 // X-Pos +20
