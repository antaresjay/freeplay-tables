[ENABLE]
assert(address,bytes)
alloc(newmem,$1000,MusicDirector:Update)

label(code)
label(return)
label(musicdirectordata)
registersymbol(musicdirectordata)

{
Call Stuff
  Rcx=Pointer to Music Director
  Rdx=Pointer to Music to Play
  R8=Priority
}
newmem:
cmp [musicdirectordata],1
jne short code

mov [musicdirectordata],0
// Save Registers
push rax
push rcx
push rdx
push r8
push r9
push r10
push r11
