id = "player-calls"
name = "Player Calls"
category = "player"
description = ""
hint = ""
type = "script"
source = """
usemono()
define(address,PlayerState:Update)
define(bytes,55 48 8B EC 48 81 EC E0 00 00 00)

[ENABLE]
assert(address,bytes)
alloc(newmem,$1000,PlayerState:Update)

label(code)
label(return)
label(upgrade)
label(ammomode)
label(unlockzonemap)
label(lockunlockmap)
label(addsubkey)
label(addcurrency)
label(pscalldata)
registersymbol(pscalldata)

newmem:
push rsi
mov rsi,rcx
push rdx
push r8
push r9
push r10
push r11
sub rsp,28
cmp [pscalldata],1
jne @f
  jmp upgrade
@@:
cmp [pscalldata+C],1
jne @f
  jmp ammomode
@@:
cmp [pscalldata+14],1
jne @f
  jmp unlockzonemap
@@:
cmp [pscalldata+1C],1
jne @f
  jmp lockunlockmap
@@:
cmp [pscalldata+20],1
jne @f
  jmp lockunlockmap
@@:
cmp [pscalldata+24],1
jne @f
  jmp addsubkey
@@:
cmp [pscalldata+28],1
jne @f
  jmp addsubkey
@@:
cmp [pscalldata+2C],1
jne @f
  jmp addcurrency
@@:
jmp code

upgrade:

mov [pscalldata],0

// Setup Call Parameters
mov rcx,rsi // Pointer to PlayerState
mov rdx,[pscalldata+4] // Upgrade ID to Apply
mov r8,[pscalldata+8] // Bool isFirstTime
// Call
call "PlayerState:AddUpgrade"

// Restore Registers
jmp code

//////////////////////////////
ammomode:
mov [pscalldata+C],0 // Set Flag back

cmp [pscalldata+10],0 // Check if AmmoMode has been set right
jnl @f
  mov [pscalldata+10],0
@@:
cmp [pscalldata+10],1 // Check if AmmoMode has been set right
jng @f
  mov [pscalldata+10],1
@@:

// Setup Call Parameters
mov rcx,rsi // Pointer to PlayerState
mov rdx,[pscalldata+10] // AmmoMode
// Call
call "PlayerState:SetAmmoMode"
jmp code

//////////////////////////////
unlockzonemap:
mov [pscalldata+14],0 // Set Flag Back

mov rcx,rsi // Pointer to PlayerState
mov rdx,[pscalldata+18] // Zone to Unlock Map for
// Call
call "PlayerState:UnlockMap"
jmp code

//////////////////////////////
lockunlockmap:
mov [pscalldata+1C],0
cmp [pscalldata+20],1
je short @f

call "PlayerState:LockAllMaps"
jmp code

//////////////////////////////
@@:
mov [pscalldata+20],0

call "PlayerState:UnlockAllMaps"
jmp code

//////////////////////////////
addsubkey:
mov [pscalldata+24],0
cmp [pscalldata+28],1
je short @f

call "PlayerState:AddKey"
jmp code

//////////////////////////////
@@:
mov [pscalldata+28],0

call "PlayerState:SpendKey"
jmp code

//////////////////////////////
addcurrency:
mov [pscalldata+2C],0

// Setup Params
mov rcx,rsi
mov rdx,[pscalldata+30] // Amount
mov r8,[pscalldata+34] // CoinsType
// Call
call "PlayerState:AddCurrency"
jmp code

code:
  add rsp,28
  pop r11
  pop r10
  pop r9
  pop r8
  pop rdx
  mov rcx,rsi
  pop rsi
  // Original Code
  push rbp
  mov rbp,rsp
  sub rsp,000000E0
  jmp return

//////////////////////////////
pscalldata:
dd 0 // Flag to Apply Upgrade
dd 0 // Upgrade to Apply
dd 0 // Bool FirstTime
//////////////////////////////
dd 0 // Flag for Change Ammo Mode
dd 0 // Ammo Mode
//////////////////////////////
dd 0 // Flag for Unlock Map for Zone
dd 3 // Zone to Unlock Map for
//////////////////////////////
dd 0 // Flag for Lock Map
dd 0 // Flag for Unlock all Maps
//////////////////////////////
dd 0 // Flag for Add Key
dd 0 // Flag for Sub Key
//////////////////////////////
dd 0 // Flag for Add Currency
dd 0 // Currency to Add
dd 0 // CoinsType

address:
  jmp newmem
  nop 6
return:

[DISABLE]

address:
  db bytes

dealloc(newmem)
unregistersymbol(pscalldata)"""

