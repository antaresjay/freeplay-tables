[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : fnaf9-Win64-Shipping.exe
  Date   : 20/09/2023 11:39
  Author : Glowmoss
}

[ENABLE]

aobscanmodule(GetPlayerbase,fnaf9-Win64-Shipping.exe,48 8B ? FF ? ? ? ? ? F2 ? ? ? F2 ? ? ? 8B ? ? 89 ? ? 48 83 ? ? 5B C3 48 89 ? ? ? 48 89)
aobscanmodule(GetInventory,fnaf9-Win64-Shipping.exe,39 ? ? ? ? ? 7D ? 41 C6)
alloc(newmem,128,GetPlayerbase)
alloc(newmem1,128,GetInventory)

registersymbol(GetPlayerbase GetInventory GetPlayerbaseOrig GetInventoryOrig G_Base F_Base C_Base R_Base M_Base INV_Base)
label(return return1 GetPlayerbaseOrig GetInventoryOrig G_Base F_Base R_Base C_Base M_Base INV_Base)

newmem:
  cmp [rcx+239],1
  jne @f
  mov [G_Base],rcx
  jmp GetPlayerbaseOrig

@@:
  cmp [rcx+239],2
  jne @f
  mov [F_Base],rcx
  jmp GetPlayerbaseOrig

@@:
  cmp [rcx+5A8],(float)150 //Roxy shattered
  jne @f
  cmp [rcx+5AC],500
  jne @f
  mov [R_Base],rcx
  jmp GetPlayerbaseOrig

@@:
  cmp [rcx+5A8],(float)200 //Chica shattered
  jne @f
  mov [C_Base],rcx
  jmp GetPlayerbaseOrig

@@:
  cmp [rcx+5AC],(float)400  //Monty shattered
  je @f
  cmp [rcx+5AC],(float)600  //Monty STD
  jne GetPlayerbaseOrig
@@:
  mov [M_Base],rcx

GetPlayerbaseOrig:
  readmem(GetPlayerbase,9)
  jmp return

G_Base:
  dq 0

F_Base:
  dq 0

R_Base:
  dq 0

C_Base:
  dq 0

M_Base:
  dq 0

newmem1:
  mov [INV_Base],rbp
GetInventoryOrig:
  readmem(GetInventory,6)
  jmp return1

INV_Base:
  dq 0

GetPlayerbase:
  jmp newmem
  db 90 90 90 90
return:

GetInventory:
  jmp newmem1
  db 90
return1:

[DISABLE]

GetPlayerbase:
  readmem(GetPlayerbaseOrig,9)

GetInventory:
  readmem(GetInventoryOrig,6)

unregistersymbol(*)
dealloc(*)

