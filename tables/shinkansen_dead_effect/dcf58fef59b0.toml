[[cheat]]
id = "credit-stats-base-address-scan-initialization-activate-this-first"
name = "Credit Stats Base Address Scan Initialization (Activate This First)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

registersymbol(creditstats_basepointer)
registersymbol(creditstatsupdate_enable)
registersymbol(creditstatsset_enable)

alloc(creditstats_basepointer,4)
alloc(creditstatsupdate_enable,4)
alloc(creditstatsset_enable,4)


[DISABLE]

unregistersymbol(creditstats_basepointer)
unregistersymbol(creditstatsupdate_enable)
unregistersymbol(creditstatsset_enable)

dealloc(creditstats_basepointer)
dealloc(creditstatsupdate_enable)
dealloc(creditstatsset_enable)"""

[[cheat]]
id = "credit-stats-base-address-scan-to-activate-pause-menu-to-update-pause-menu"
name = "Credit Stats Base Address Scan (To Activate: Pause Menu, To Update: Pause Menu)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(creditstats_savedAOB)
label(creditstats_returnhere)
label(creditstats_originalcode)
label(creditstats_exit)

label(creditstatsupdate_exit)
label(creditstatsset_exit)

registersymbol(creditstats_savedAOB)

aobscan(creditstats_searchedAOB,8B 40 40 3B C3 0F 9C C0)

alloc(creditstats_newmem,2048) //2kb should be enough


creditstats_newmem:
cmp dword ptr [creditstatsupdate_enable], #0
je creditstatsupdate_exit
mov [creditstats_basepointer], eax
creditstatsupdate_exit:

cmp dword ptr [creditstatsset_enable], #0
je creditstatsset_exit
mov [eax+40], #9999999
creditstatsset_exit:


creditstats_originalcode:
db 8B 40 40 3B C3
//mov eax,[eax+40]
//cmp eax,ebx


creditstats_exit:
jmp creditstats_returnhere


creditstats_searchedAOB:
creditstats_savedAOB:
jmp creditstats_newmem
creditstats_returnhere:


[DISABLE]
creditstats_savedAOB:
db 8B 40 40 3B C3
//mov eax,[eax+40]
//cmp eax,ebx

unregistersymbol(creditstats_savedAOB)

dealloc(creditstats_newmem)"""

