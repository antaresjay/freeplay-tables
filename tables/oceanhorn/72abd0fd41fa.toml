[[cheat]]
id = "unlimited-health"
name = "Unlimited Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(health,Oceanhorn.exe,D9 83 0C 01 00 00 D9 5C 24 40)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  fld dword ptr [ebx+00000108]
  fst dword ptr [ebx+0000010C]
  jmp return

health:
  jmp code
  nop
return:
registersymbol(health)

[DISABLE]
health:
  db D9 83 0C 01 00 00
unregistersymbol(health)
dealloc(newmem)"""

