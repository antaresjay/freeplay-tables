[[cheat]]
id = "player-pointers"
name = "Player Pointers"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(player,Oceanhorn.exe,D9 87 0C 01 00 00 51) // should be unique
alloc(newmem,$1000)
alloc(player_ptr,4)

label(code)
label(return)

newmem:
  mov [player_ptr],edi

code:
  fld dword ptr [edi+0000010C]
  jmp return

player:
  jmp newmem
  nop
return:
registersymbol(player)
registersymbol(player_ptr)

[DISABLE]
player:
  db D9 87 0C 01 00 00
unregistersymbol(player)
unregistersymbol(player_ptr)
dealloc(newmem)
dealloc(player_ptr)"""

