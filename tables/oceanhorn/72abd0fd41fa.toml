[[cheat]]
id = "profile-pointers"
name = "Profile Pointers"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(items,Oceanhorn.exe,8B 40 10 85 C9 74 * 83)
alloc(newmem,$1000)
alloc(item_ptr,500)
alloc(max_id,4)

label(code)
label(return)
label(skip)

newmem:
  add eax,10
  cmp [max_id],ecx
  jg skip
  mov [max_id],ecx
skip:
  cmp ecx,#125
  jnl code
  mov [item_ptr+ecx*4],eax

code:
  mov eax,[eax]
  test ecx,ecx
  jmp return

items:
  jmp newmem
return:
registersymbol(items)
registersymbol(item_ptr)
registersymbol(max_id)

[DISABLE]
items:
  db 8B 40 10 85 C9
unregistersymbol(items)
unregistersymbol(item_ptr)
unregistersymbol(max_id)
dealloc(newmem)
dealloc(item_ptr)
dealloc(max_id)"""

