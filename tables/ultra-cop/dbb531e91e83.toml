[[cheat]]
id = "player-weapon-controller-ctrl-numpad-1"
name = "Player Weapon Controller (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Ultra Cop.exe
// Author            : ndck76
// Executable Version: 2021.3.7.59481
// Game Version      : v1.018
// Script Date       : 2025-04-30


[ENABLE]

aobscanregion(paused,F_PlayerWeaponController:Update,F_PlayerWeaponController:Update+200,0FB686xxxx000085xx0Fxxxxxxxxxx48xxxxxxxxxxxx0Fxxxxxxxxxxxx85xx0Fxxxxxxxxxx48xxxx48xxxxxxxxxxxx) //F_PlayerWeaponController:Update+f
alloc(newmem,$1000,paused)
alloc(data,8)
alloc(pausedbkp,7)
registersymbol(data paused pausedbkp)
label(code)
label(return)

pausedbkp:
  readmem(paused,7)

newmem:
  mov [data],rsi

code:
  readmem(paused,7)
  jmp return

paused:
  jmp newmem
  nop 2
return:

[DISABLE]

paused:
  readmem(pausedbkp,7)

unregistersymbol(*)
dealloc(*)"""

