[[cheat]]
id = "max-level"
name = "Max Level"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(maxlevel,amtrucks.exe,48 8B D9 8B 90 64 19 00 00 48 8B 80 10 01 00 00 48 8B 88 20 01 00 00 E8 ?? ?? ?? ?? 48 8B 4B 08 3B 81 B0 00 00 00 0F 93 C0) // should be unique
alloc(newmem,$1000,maxlevel)

label(code)
label(return)
label(newmem_extd)

newmem:
  mov rbx, rcx
  cmp [rax+00001964], #799999
  jae code

  mov [rax+00001964], #799999

code:
  mov edx, [rax+00001964]
  mov rax, [rax+00000110]
  jmp return

maxlevel:
  jmp qword ptr [newmem_extd]

newmem_extd:
dq newmem
nop
nop
return:
registersymbol(maxlevel)

[DISABLE]

maxlevel:
  db 48 8B D9 8B 90 64 19 00 00 48 8B 80 10 01 00 00

unregistersymbol(maxlevel)
dealloc(newmem)"""

