[[cheat]]
id = "player-ctrl-numpad-2-activate-during-game-play"
name = "Player (Ctrl + Numpad 2) {Activate during game play}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : DRUDGE-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.6.1.0
// Game Version      : v0.4.1 (Early Access)
// Script Date       : 2026-02-05


[ENABLE]

aobscanmodule(master,DRUDGE-Win64-Shipping.exe,488Bxx33xx4Cxxxxxxxxxxxx488Bxx41FFxx84xx74xx488Bxx488B) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,5)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,5)

newmem:
  mov [data],rax

code:
  readmem(master,5)
  jmp return

master:
  jmp newmem
return:

[DISABLE]

master:
  readmem(masterbkp,5)

unregistersymbol(*)
dealloc(*)"""

