[[cheat]]
id = "data-manager-ctrl-numpad-1"
name = "Data Manager (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : ASURA THE STRIKER.exe
// Author            : ndck76
// Executable Version: 2022.3.12.59104
// Game Version      : v1.0.0424.04
// Script Date       : 2025-04-26


[ENABLE]

aobscanmodule(hp1,GameAssembly.dll,8Bxxxxxxxxxx89xxxx488Bxxxxxxxxxx4885xx0F84xxxxxxxx80) //ObjectManager.UiUpdate
alloc(newmem,$1000,hp1)
alloc(data,8)
alloc(hp1bkp,6)
registersymbol(data)
registersymbol(hp1)
registersymbol(hp1bkp)
label(code)
label(return)

hp1bkp:
  readmem(hp1,6)

newmem:
  mov [data],rax

code:
  readmem(hp1,6)
  jmp return

hp1:
  jmp newmem
  nop
return:

[DISABLE]

hp1:
  readmem(hp1bkp,6)

unregistersymbol(*)
dealloc(*)"""

