[[cheat]]
id = "zxlevelstate-base-address-scan-initialization-activate-this-first"
name = "ZXLevelState Base Address Scan Initialization (Activate This First)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(ZXLevelState_basepointer)
registersymbol(ZXLevelState_update_enable)
registersymbol(ZXLevelState_set_enable)
registersymbol(ZXLevelState_resourcesset_enable)

alloc(ZXLevelState_basepointer, 8)
alloc(ZXLevelState_update_enable, 4)
alloc(ZXLevelState_set_enable, 4)
alloc(ZXLevelState_resourcesset_enable, 4)


[DISABLE]
unregistersymbol(ZXLevelState_basepointer)
unregistersymbol(ZXLevelState_update_enable)
unregistersymbol(ZXLevelState_set_enable)
unregistersymbol(ZXLevelState_resourcesset_enable)

dealloc(ZXLevelState_basepointer)
dealloc(ZXLevelState_update_enable)
dealloc(ZXLevelState_set_enable)
dealloc(ZXLevelState_resourcesset_enable)"""

[[cheat]]
id = "zxlevelstate-base-address-scan-to-activate-play-level-to-update-play-level"
name = "ZXLevelState Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(ZXLevelState_savedAOB)
label(ZXLevelState_returnhere)
label(ZXLevelState_originalcode)
label(ZXLevelState_exit)

label(ZXLevelState_update_exit)
label(ZXLevelState_set_exit)
label(ZXLevelState_resourcesset_exit)

registersymbol(ZXLevelState_savedAOB)

//ZX.ZXLevelState::UpdateResourcesStats+7D - 8B 89 14010000        - mov ecx,[rcx+00000114]
//ZX.ZXLevelState::UpdateResourcesStats+83 - 48 8B 55 10           - mov rdx,[rbp+10]
// Accesses Food Used
//ZX.ZXLevelState::UpdateResourcesStats+87 - 89 8A 04010000        - mov [rdx+00000104],ecx
//ZX.ZXLevelState::UpdateResourcesStats+8D - 48 8B 4D 10           - mov rcx,[rbp+10]
//ZX.ZXLevelState::UpdateResourcesStats+91 - 8B 89 18010000        - mov ecx,[rcx+00000118]
//ZX.ZXLevelState::UpdateResourcesStats+97 - 48 8B 55 10           - mov rdx,[rbp+10]
//ZX.ZXLevelState::UpdateResourcesStats+9B - 89 8A 08010000        - mov [rdx+00000108],ecx
//ZX.ZXLevelState::UpdateResourcesStats+A1 - 48 8B 4D 10           - mov rcx,[rbp+10]
aobscan(ZXLevelState_searchedAOB, 89 8A 04 01 00 00 48 8B 4D 10 8B 89 18 01 00 00 48 8B 55 10)

alloc(ZXLevelState_newmem, 2048, ZXLevelState_searchedAOB)
alloc(ZXLevelState_temp1, 8, ZXLevelState_searchedAOB)
alloc(ZXLevelState_temp2, 8, ZXLevelState_searchedAOB)
alloc(ZXLevelState_temp3, 8, ZXLevelState_searchedAOB)
alloc(ZXLevelState_temp4, 8, ZXLevelState_searchedAOB)
alloc(ZXLevelState_temp5, 8, ZXLevelState_searchedAOB)


ZXLevelState_newmem:
mov [ZXLevelState_temp1], rax
mov [ZXLevelState_temp2], rbx
mov [ZXLevelState_temp3], rcx
mov [ZXLevelState_temp4], rdx

cmp dword ptr [ZXLevelState_update_enable], #0
je ZXLevelState_update_exit
mov [ZXLevelState_basepointer], rdx
ZXLevelState_update_exit:

cmp dword ptr [ZXLevelState_set_enable], #0
je ZXLevelState_set_exit
ZXLevelState_set_exit:

cmp dword ptr [ZXLevelState_resourcesset_enable], #0
je ZXLevelState_resourcesset_exit
mov [rdx+d8], #9999
mov [rdx+dc], #9999
mov [rdx+e0], #9999
mov [rdx+e4], #9999
mov [rdx+e8], #9999
ZXLevelState_resourcesset_exit:

mov rax, [ZXLevelState_temp1]
mov rbx, [ZXLevelState_temp2]
mov rcx, [ZXLevelState_temp3]
mov rdx, [ZXLevelState_temp4]


ZXLevelState_originalcode:
db 89 8A 04 01 00 00
//mov [rdx+00000104],ecx


ZXLevelState_exit:
jmp ZXLevelState_returnhere


ZXLevelState_searchedAOB:
ZXLevelState_savedAOB:
jmp ZXLevelState_newmem
nop
ZXLevelState_returnhere:


[DISABLE]
ZXLevelState_savedAOB:
db 89 8A 04 01 00 00
//mov [rdx+00000104],ecx

unregistersymbol(ZXLevelState_savedAOB)

dealloc(ZXLevelState_newmem)
dealloc(ZXLevelState_temp1)
dealloc(ZXLevelState_temp2)
dealloc(ZXLevelState_temp3)
dealloc(ZXLevelState_temp4)
dealloc(ZXLevelState_temp5)"""

