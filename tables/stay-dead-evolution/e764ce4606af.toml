[[cheat]]
id = "cheat-after-anyone-has-been-hit-once"
name = "cheat (after anyone has been hit once)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Stay Dead Evolution.exe
  Version: 
  Date   : 2015-08-02
hook damage dealing bit...
player/npc health is at 0x84
max health at 0x90
}
[ENABLE]
aobscan(DAMAGED_INJECT,89 B2 84 00 00 00 8B B2 84) // should be unique
registersymbol(DAMAGED_INJECT)
globalalloc(newmem,$1000)
label(code)
label(return)
label(deal_damage)
label(is_npc)

newmem:
dd 1 //take no damage?
dd 0 //1-hit kill?
code:
cmp [edx+80],1  //1 = plr
jne is_npc
cmp [newmem],1
je return
jmp deal_damage
is_npc:
cmp [newmem+4],1
jne deal_damage
mov esi,0
deal_damage:
mov [edx+00000084],esi //update health
jmp return

DAMAGED_INJECT:
jmp code
nop
return:

[DISABLE]
DAMAGED_INJECT:
  db 89 B2 84 00 00 00
unregistersymbol(DAMAGED_INJECT)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: 0C439735

0C439716: 89 4D C8                       -  mov [ebp-38],ecx
0C439719: 8B 16                          -  mov edx,[esi]
