[[cheat]]
id = "inf-ammo-clip"
name = "Inf. Ammo Clip"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanmodule(chkAmmoAfterFireAOB1,EDF41.exe,83 B9 70 08 00 00 00 4C 8B C1)
aobscanmodule(chkAmmoAfterFireAOB2,EDF41.exe,44 89 A6 70 08 00 00)
aobscanmodule(chkAmmoAfterFireAOB3,EDF41.exe,7F 0A C7 83 70 08 00 00 00 00 00 00)
registersymbol(chkAmmoAfterFireAOB1)
registersymbol(chkAmmoAfterFireAOB2)
registersymbol(chkAmmoAfterFireAOB3)

alloc(newmem1,2048,chkAmmoAfterFireAOB1) //"EDF41.exe"+310D46)
alloc(newmem2,2048,chkAmmoAfterFireAOB2)
alloc(newmem3,2048,chkAmmoAfterFireAOB3)
label(InfAmmo1)
label(InfAmmo2)
label(InfAmmo3)
label(returnhere1)
label(returnhere2)
label(returnhere3)
label(originalcode1)
label(originalcode2)
label(originalcode3)

newmem1:
cmp dword ptr [rcx+664],100
je InfAmmo1
cmp dword ptr [rcx+664],101
je InfAmmo1
originalcode1:
cmp dword ptr [rcx+00000870],00
jmp returnhere1
InfAmmo1:
mov word ptr [rcx+870],#100000
jmp originalcode1
chkAmmoAfterFireAOB1:
jmp newmem1
nop
nop
returnhere1:

newmem2:
cmp dword ptr [rsi+664],100
je InfAmmo2
cmp dword ptr [rsi+664],101
je InfAmmo2
originalcode2:
cmp dword ptr [rsi+00000870],00
jmp returnhere2
InfAmmo2:
mov word ptr [rsi+870],#100000
jmp originalcode2
chkAmmoAfterFireAOB2:
jmp newmem2
nop
nop
returnhere2:
 
newmem3:
cmp dword ptr [rbx+664],100
je InfAmmo3
cmp dword ptr [rbx+664],101
je InfAmmo3
originalcode3:
mov [rbx+00000870],00000000
jmp returnhere3
InfAmmo3:
mov word ptr [rbx+870],#100000
jmp returnhere3
chkAmmoAfterFireAOB3+02:
jmp newmem3
nop
nop
nop
nop
nop
returnhere3:

[DISABLE]
dealloc(newmem1)
dealloc(newmem2)
dealloc(newmem3)
chkAmmoAfterFireAOB1:
db 83 B9 70 08 00 00 00
chkAmmoAfterFireAOB2:
db 44 89 A6 70 08 00 00
chkAmmoAfterFireAOB3+02:
db C7 83 70 08 00 00 00 00 00 00
unregistersymbol(chkAmmoAfterFireAOB1)
unregistersymbol(chkAmmoAfterFireAOB2)
unregistersymbol(chkAmmoAfterFireAOB3)"""

[[cheat]]
id = "attackpowerup"
name = "AttackPowerUP"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game   : EDF41.exe
  Version: 
  Date   : 2016-09-02
  Author : Mahone

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(MultiPowerUPAOB,EDF41.exe,F3 0F 11 80 88 05 00 00) // should be unique
registersymbol(MultiPowerUPAOB)
registersymbol(Multiple)
registersymbol(NPCValues)

alloc(MultiPowerUP,2048,MultiPowerUPAOB)
alloc(Multiple,4)
alloc(NPCValues,4)
label(Multiple2)
label(PlayerOnly1)
label(PlayerOnly2)
label(Returnhere)

MultiPowerUP:
cmp [NPCValues],0
je PlayerOnly1
PlayerOnly2:
push rbx
cmp dword ptr [Multiple],(float)0
jne Multiple2
mov dword ptr [Multiple],(float)1
Multiple2:
mov rbx,[Multiple]
mov [rax+00000588],rbx
pop rbx
jmp Returnhere
PlayerOnly1:
cmp dword ptr [rax+664],100
je PlayerOnly2
cmp dword ptr [rax+664],101
je PlayerOnly2
movss [rax+00000588],xmm0
jmp Returnhere
MultiPowerUPAOB:
jmp MultiPowerUP
nop
nop
nop
Returnhere:

[DISABLE]

MultiPowerUPAOB:
db F3 0F 11 80 88 05 00 00

unregistersymbol(MultiPowerUPAOB)
unregistersymbol(Multiple)
unregistersymbol(NPCValues)
dealloc(MultiPowerUP)
dealloc(Multiple)
dealloc(NPCValues)"""

