type = "script"
source = """
[ENABLE]

aobscanmodule(MagazineAmmo,EDF41.exe,41 89 80 70 08 00 00)
alloc(newmem,$1000,MagazineAmmo)

label(code)
label(return)

newmem:

code:
  mov [r8+00000870],#999
  jmp return

MagazineAmmo:
  jmp newmem
  nop 2
return:
registersymbol(MagazineAmmo)

[DISABLE]

MagazineAmmo:
  db 41 89 80 70 08 00 00

unregistersymbol(MagazineAmmo)
