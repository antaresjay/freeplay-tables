[[cheat]]
id = "unlimited-durability"
name = "Unlimited Durability"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(durability_aob,witcher3.exe,48 F3 0F 11 40 64) // should be unique
alloc(newmem,$1000,durability_aob)

label(code)
label(return)

newmem:
cmp [rax+64],(float)-1
je code
mov [rax+64],(float)500
movss xmm0,[rax+64]
code:
  movss [rax+64],xmm0
  jmp return

durability_aob+01:
  jmp newmem
return:
registersymbol(durability_aob)

[DISABLE]

durability_aob+01:
  db F3 0F 11 40 64

unregistersymbol(durability_aob)
dealloc(newmem)"""

