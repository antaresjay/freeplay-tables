[[cheat]]
id = "teleport-hack-f3-toggle"
name = "Teleport Hack (F3-Toggle)"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048,"witcher3.exe"+F29757) 
alloc(store_coords,2048)
label(returnhere)
label(originalcode)
label(exit)
label(xpos)
label(ypos)
label(zpos)
label(save)
label(load)
label(saved)
label(enable_save)
label(enable_load)
registersymbol(enable_save)
registersymbol(enable_load)

store_coords:
xpos:
dq (double)0.0
ypos:
dq (double)0.0
zpos:
dq (double)0.0

saved:
dd 0

enable_save:
dd 0

enable_load:
dd 0


newmem:
cmp [enable_save],1
je save
cmp [enable_load],1
je load
jmp originalcode


save:
mov [enable_save],0
mov [saved],1
mov [rsi+000001C8],rax
push rdx
mov rdx,[rsi+000001B8]
mov [xpos],rdx
mov rdx,[rsi+000001C0]
mov [ypos],rdx
mov rdx,[rsi+000001C8]
mov [zpos],rdx
pop rdx
jmp originalcode


load:
cmp [saved],1
jne originalcode
mov [enable_load],0
push rdx
mov rdx,[xpos]
mov [rsi+000001B8],rdx
mov rdx,[ypos]
mov [rsi+000001C0],rdx
mov rdx,[zpos]
mov [rsi+000001C8],rdx
pop rdx
jmp originalcode

originalcode:
mov rcx,[rsi+000001B0]

exit:
jmp returnhere

"witcher3.exe"+F29757:
jmp newmem
nop 2
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
