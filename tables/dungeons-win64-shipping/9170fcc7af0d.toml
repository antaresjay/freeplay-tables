name = "Unlimited Emeralds"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Script Date       : 2020-04-16
[ENABLE]

aobscanmodule(UnlimitedEmeralds,Dungeons-Win64-Shipping.exe,8B 40 04 C3 CC CC CC CC 48)
alloc(newmem,$1000,"Dungeons-Win64-Shipping.exe"+A0FDF8)

label(code)
label(return)

newmem:

code:
mov [rax+04],#999999
mov eax,[rax+04]
ret
int 3
jmp return

UnlimitedEmeralds:
jmp newmem
return:
registersymbol(UnlimitedEmeralds)

[DISABLE]

UnlimitedEmeralds:
db 8B 40 04 C3 CC

unregistersymbol(UnlimitedEmeralds)
dealloc(newmem)"""

