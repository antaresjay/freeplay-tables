  mov eax,[shieldv]
  cmp eax,esi
  pop eax
  jne one_hit_kill_shield_code
  cmp [EXTREME_SHIELD],1
  je EXTREME_SHIELD_CODE
  cmp [shield_lock],1
  jne code
