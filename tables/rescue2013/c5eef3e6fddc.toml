[[cheat]]
id = "active-trainer"
name = "Active Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
label(set)
label(reset)
label(GetE)
label(SetE)
registersymbol(SetE)
registersymbol(GetE)
registersymbol(aob)
aobscan(aob,D9 40 20 D9 5D DC D9 45 DC 83 EC 0C 83 EC 04 D9 1C 24)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
set:
cmp [SetE],1
jne reset
cmp [GetE],1
je reset
push esi
mov esi,(float)1000000
mov [eax+20],esi
pop esi
mov [GetE],0
reset:
cmp [GetE],1
jne originalcode
push esi
mov esi,(float)100
mov [eax+20],esi
pop esi
mov [SetE],0
originalcode:
fld dword ptr [eax+20]
fstp dword ptr [ebp-24]

exit:
jmp returnhere
GetE:
dd 0
SetE:
dd 0
aob:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
aob:
fld dword ptr [eax+20]
fstp dword ptr [ebp-24]
//Alt: db D9 40 20 D9 5D DC
unregistersymbol(SetE)
unregistersymbol(GetE)
unregistersymbol(aob)"""

