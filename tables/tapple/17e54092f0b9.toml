[[cheat]]
id = "autoclick-2"
name = "AutoClick 2"
category = "misc"
description = ""
hint = ""
type = "script"
source = '''
//Target:  Tapple.exe
//Author:  Salis
//Credit to METHOS for custom Template LUA

[ENABLE]

////////////////////////  autoclick2  \\\\\\\\\\\\\\\\\\\\\\\\

aobscanmodule(address,GameAssembly.dll,0F 10 48 78 48 8D 4D C0)
alloc(newmem,1024,GameAssembly.dll)
alloc(obytes_autoclick2, 10)
label(return originalcode_autoclick2)

registersymbol(obytes_autoclick2)

obytes_autoclick2:
readmem(address, 10)

newmem:

originalcode_autoclick2:
 inc [rax+78]
 movups xmm1,[rax+78]
 lea rcx,[rbp-40]
 jmp return

address:
 jmp newmem
 nop 3
return:


[DISABLE]

address:
readmem(obytes_autoclick2, 10)

dealloc(*)
unregistersymbol(*)'''

