[[cheat]]
id = "weapon-exp-pointer-gain-exp"
name = "Weapon Exp Pointer (Gain Exp)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game   : TwinStick-Win64-Shipping.exe
  Version: 
  Date   : 2017-07-28
  Author : Squall8
}

[ENABLE]

aobscanmodule(weaexp,TwinStick-Win64-Shipping.exe,10 F3 0F 11 70 08 0F)
alloc(newmem,$1000,"TwinStick-Win64-Shipping.exe"+274C14)

label(code)
label(return)
label(wexp)
label(addbyamt_s)
label(addbyamt)

newmem:
  mov [wexp],rax
  cmp [addbyamt_s],1
  jne code
  addss xmm6,[addbyamt]
  movss [rax+08],xmm6
  jmp return

code:
  movss [rax+08],xmm6
  jmp return

wexp:
  dq 0

addbyamt_s:
  dq 0

addbyamt:
  dq (float)500

weaexp+01:
  jmp newmem
return:
registersymbol(weaexp)
registersymbol(wexp)
registersymbol(addbyamt_s)
registersymbol(addbyamt)

[DISABLE]

weaexp+01:
  db F3 0F 11 70 08

unregistersymbol(weaexp)
unregistersymbol(wexp)
unregistersymbol(addbyamt_s)
unregistersymbol(addbyamt)
dealloc(newmem)"""

