[[cheat]]
id = "combat-options"
name = "Combat Options"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Naheulbeuk.exe
  Version: 
  Date   : 2021-12-11
  Author : d

  This script does blah blah blah
}

[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

 
 
aobscanmodule(characters,GameAssembly.dll,48 8B 87 B0 00 00 00 48 85 C0 0F 84 39) // should be unique
alloc(newmem,$1000,characters)
label(inf_health)
label(inf_energy)
label(inf_ap)
label(code)
label(return)

newmem:
//rdi is character
//what is iff?
push rbx
mov rbx,[rdi+248]//skills
cmp [rbx+48],00 //AddSkillRelay (which enemies shouldn't have I hope)
je enemy
//health
mov rbx,inf_health
cmp byte ptr [rbx],1
jne @f
mov rbx,[rdi+f0]//health
mov [rbx+30],#1000 //health value
mov [rbx+34],(float)1 //health percentage value
//energy
@@:
mov rbx,inf_energy
cmp byte ptr [rbx],1
jne @f
mov rbx,[rdi+e8]//energy
mov [rbx+38],#100 //energy value
//action points
@@:
mov rbx,inf_ap
cmp byte ptr [rbx],1
jne @f
mov rbx,[rdi+250]//action points
mov [rbx+28],#2 //cur action points
mov [rbx+2c],#2 //cur mov points
mov byte ptr [rbx+30],0 //action points used

@@:
pop rbx
jmp code

enemy:
mov rbx,[rdi+f0]//health
mov [rbx+30],#1 //health value
pop rbx

code:
  mov rax,[rdi+000000B0]
  jmp return

inf_health:
db 0

inf_energy:
db 0

inf_ap:
db 0

characters:
  jmp newmem
  nop 2
return:
registersymbol(inf_health)
registersymbol(inf_energy)
registersymbol(characters)
registersymbol(inf_ap)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
characters:
  db 48 8B 87 B0 00 00 00
unregistersymbol(inf_health)
unregistersymbol(inf_energy)
unregistersymbol(characters)
unregistersymbol(inf_ap)
dealloc(newmem)

