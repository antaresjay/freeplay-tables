id = "bike-cooldown-editor-ctrl-numpad-1-activate-only-when-cooldown-is-running"
name = "Bike Cooldown Editor (Ctrl + Numpad 1) {Activate ONLY when cooldown is running}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : River City Saga Three Kingdoms Next.exe
// Author            : ndck76
// Executable Version: 2021.3.32.40366
// Game Version      : v1.0.1
// Script Date       : 2024-11-07


[ENABLE]

aobscan(bike,F30F10xxxxF3xxxxxxF3xxxxxxxxF3xxxxxx48xxxxF2xxxxxxF2xxxxxxF2xxxxxxF2xxxxxx48xxxx) // should be unique
alloc(newmem,$1000,bike)
alloc(data2,8)
alloc(bikebkp,5)
registersymbol(data2)
registersymbol(bike)
registersymbol(bikebkp)
label(code)
label(return)

bikebkp:
  readmem(bike,5)

newmem:
  mov [data2],rsi

code:
  readmem(bike,5)
  jmp return

bike:
  jmp newmem
return:

[DISABLE]

bike:
  readmem(bikebkp,5)

unregistersymbol(*)
dealloc(*)"""

