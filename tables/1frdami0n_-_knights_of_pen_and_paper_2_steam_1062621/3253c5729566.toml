[[cheat]]
id = "set-gold-to-5000-alt-tab-out-of-the-game"
name = "Set gold to 5000 (ALT+TAB out of the game)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(INJECT,8B 40 54 C9 C3 00 00 55 8B EC 83 EC 08 8B 45) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov [eax+54],1388
  mov eax,[eax+54]
  leave 
  ret 
  jmp return

INJECT:
  jmp code
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 8B 40 54 C9 C3

unregistersymbol(INJECT)
dealloc(newmem)"""

