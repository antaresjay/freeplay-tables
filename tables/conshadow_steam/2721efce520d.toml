type = "script"
source = """
[ENABLE]

aobscanmodule(player,conshadow_steam.exe,DD 07 3B F9 5F) // should be unique
alloc(newmem,$100,player)
globalalloc(ptr,8)
label(code)
label(return)

newmem:
cmp [edi+20],#15     // edit this line, change the number on the right to how much cash you have and be sure to put a # in front
je code
mov [ptr],edi
code:
  fld qword ptr [edi]
  cmp edi,ecx
  pop edi
  jmp return

player:
  jmp newmem
return:
registersymbol(player)

[DISABLE]

player:
  db DD 07 3B F9 5F

unregistersymbol(player)

dealloc(newmem)

