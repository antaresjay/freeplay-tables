[[cheat]]
id = "initialize"
name = "初始化 Initialize"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : nie.exe
  Version: 
  Date   : 2025-11-12
  Author : Neko

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(PlayerData,nie.exe,41 8D * * * * 85 C0 F3 * * * * * * * * * F3) // should be unique
alloc(newmem,$1000,PlayerData)

label(code)
label(return)
alloc(P_PlayerBaseAddress,8)
registersymbol(P_PlayerBaseAddress)
label(Army)

alloc(EnableScript,0x100)
registersymbol(EnableScript)

alloc(AttackMultiper,0x8)
registersymbol(AttackMultiper)
AttackMultiper:
dd (float)1
alloc(DefneceMultiper,0x8)
registersymbol(DefneceMultiper)
DefneceMultiper:
dd (float)1

alloc(PlayerDataCode,6)
registersymbol(PlayerDataCode)
newmem:
  push rax
{  mov rax,[rdi+80] //tag
  test rax,rax
  jz code}
  mov rax,[rdi+40]
  cmp rax,01
  pop rax
  jne Army
  mov [P_PlayerBaseAddress],rcx
  jmp InfHealth
InfHealth:
  cmp [EnableScript],01
  jne InfMorale
  push rax
  mov rax,[rcx+8]
  mov [rcx],rax
  pop rax
  xor edx,edx
InfMorale:
  cmp [EnableScript+C],01
  jne CoolImmediately
  mov [rcx+1C],(float)1.0
CoolImmediately:
  cmp [EnableScript+10],01
  jne Defence
  push rax
  mov rax,[rcx+24+8]
  mov [rcx+24+10],rax
  mov rax,[rcx+44+8]
  mov [rcx+44+10],rax
  mov rax,[rcx+64+8]
  mov [rcx+64+10],rax
  mov rax,[rcx+84+8]
  mov [rcx+84+10],rax
  pop rax

Defence:
  cmp edx,0
  jge code
  cmp [DefneceMultiper],(float)1
  jle code
  cvtsi2ss xmm3, edx
  divss xmm3, [DefneceMultiper]
  cvtss2si edx, xmm3
  jmp code

Army:
OneKill:
  cmp [EnableScript+4],01
  jne Attack
  mov edx,#-9999
Attack:
  cmp edx,0
  jge code
  cmp [AttackMultiper],(float)1
  jle code
  cvtsi2ss xmm3, edx
  mulss xmm3, [AttackMultiper]
  cvtss2si edx, xmm3

code:
  lea eax,[r9+rdx]
  xor edx,edx
  jmp return
PlayerDataCode:
  readmem(PlayerData,6)
PlayerData:
  jmp newmem
  nop
return:
registersymbol(PlayerData)

[DISABLE]

PlayerData:
  readmem(PlayerDataCode,6)

unregistersymbol(PlayerData)
dealloc(newmem)

