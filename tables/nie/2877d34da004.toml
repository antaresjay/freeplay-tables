[[cheat]]
id = "selecteditempointer"
name = "物品编辑SelectedItemPointer"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ 游戏   : nie.exe
  版本: 
  日期   : 2025-11-16
  作者 : Neko

  本脚本实现某某功能...
}

[ENABLE]
aobscanmodule(GetItemInfo,nie.exe,49 8B 4C C4 08 48 85 C9 0F)
alloc(newmem,$1000,GetItemInfo)
alloc(P_ItemInfo,8)
registersymbol(P_ItemInfo)

label(code return GetItemInfoMemory skip traverse_items check next_offset next_item found_item)

newmem:
code:
  mov rcx,[r12+rax*8+08]
  call GetItemInfoMemory
  jmp return

GetItemInfoMemory:
  push rax
  push rdx
  push rbx
  push rsi
  push rdi
  push r8

  test rcx,rcx
  je skip
  mov rdi,P_ItemInfo
  xor rax,rax
  mov [rdi],rax


  mov edx,[rcx+10] // 获取物品总数
  test edx,edx
  je skip
  xor ebx,ebx
  mov esi,r15d
traverse_items:
  cmp ebx,edx
  jge skip
  mov eax,ebx
  shl eax,4
  add eax,0x20

  mov rax,[rcx+rax] // rax=物品指针
  test rax,rax
  je next_item
  xor r8d,r8d

check:
  cmp r8d,0x30
  jg next_item
  mov edi,[rax+r8]
  cmp edi,esi
  je found_item

next_offset:
  add r8d,4
  jmp check

next_item:
  inc ebx
  jmp traverse_items

found_item:
  lea rdi,[rax+r8]
  mov rax,P_ItemInfo
  mov [rax],rdi
skip:
  pop r8
  pop rdi
  pop rsi
  pop rbx
  pop rdx
  pop rax
  ret

GetItemInfo:
  jmp newmem
return:
registersymbol(GetItemInfo)

[DISABLE]
GetItemInfo:
  db 49 8B 4C C4 08

unregistersymbol(GetItemInfo)
unregistersymbol(P_ItemInfo)
dealloc(newmem)
dealloc(P_ItemInfo)

