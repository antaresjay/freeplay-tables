[[cheat]]
id = "player-character-ctrl-numpad-1"
name = "Player Character (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : TidesOfTomorrow-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.4.4.0
// Game Version      : Build.22978508
// Script Date       : 2026-05-04


[ENABLE]

aobscanmodule(master,TidesOfTomorrow-Win64-Shipping.exe,488BxxFFxxxxxxxxxx88xx4883xxxx5BC3xx40534883xxxx488Bxxxx4533xx4885xx498Bxx410Fxxxx4Cxxxx4CxxxxxxE8xxxxxxxx4889xx4883xxxx5BC3xxxxxxxx40534883xxxx488Bxxxx4533xx4885xx498Bxx410Fxxxx4Cxxxx4Cxxxxxx488BxxFFxxxxxxxxxx4889) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,9)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,9)

newmem:
  mov [data],rcx

code:
  readmem(master,9)
  jmp return

master:
  jmp newmem
  nop 4
return:

[DISABLE]

master:
  readmem(masterbkp,9)

unregistersymbol(*)
dealloc(*)"""

