alloc(memNBGFR003,$400,NBGFR003)

registerSymbol(NBGFR003)
registerSymbol(NBGFR003_bak)
registerSymbol(NBGFR003_flt)
registerSymbol(NBGFR003_int)
registerSymbol(NBGFR003_flg)

label(NBGFR003_bak)
label(NBGFR003_flt)
label(NBGFR003_int)
label(NBGFR003_flg)
label(NBGFR003_s_code)
label(NBGFR003_r_code)
label(NBGFR003_n_code)
label(NBGFR003_o_code)
label(NBGFR003_p_code)
label(NBGFR003_e_code)
label(NBGFR003_exit)
label(NBGFR003_return)

memNBGFR003:
  NBGFR003_bak:
    readMem(NBGFR003,7)
\talign 10
  NBGFR003_flt:
    dd (float)2.0
    dd (float)2.0
\talign 10
  NBGFR003_int:
    dd (int)30
\talign 10
  NBGFR003_flg:
    db 00
    db 00
    db 00
    align 10 CC
  NBGFR003_s_code:
    movsxd rdx,[rsi+D4]
  NBGFR003_n_code:
    cmp byte ptr [r14+AE],01
    jne NBGFR003_e_code
  NBGFR003_p_code:
    cmp byte ptr [NBGFR003_flg],01
    jne @f
      xor rdx,rdx
      jmp NBGFR003_r_code
    @@:
    cmp byte ptr [NBGFR003_flg+01],01
    jne @f
      movsxd rax,[NBGFR003_int]
      mov rcx,[r14+10]
      sub rcx,rdx
      cmp rcx,rax
      jge @f
      xor rdx,rdx
      mov [r14+10],rax
      jmp NBGFR003_r_code
    @@:
    cvtsi2ss xmm0,rdx
    divss xmm0,[NBGFR003_flt]
    cvtss2si rdx,xmm0
    jmp NBGFR003_r_code
  NBGFR003_e_code:
    cmp byte ptr [NBGFR003_flg+02],01
    jne @f
      mov rdx,[r14+10]
      jmp NBGFR003_r_code
    @@:
    cvtsi2ss xmm0,rdx
    mulss xmm0,[NBGFR003_flt+04]
    cvtss2si rdx,xmm0
    jmp NBGFR003_r_code
  NBGFR003_r_code:
    mov [rsi+D4],rdx
  NBGFR003_o_code:
    readMem(NBGFR003,7)
  NBGFR003_exit:
    jmp NBGFR003_return

NBGFR003:
  jmp NBGFR003_s_code
  nop 2
  NBGFR003_return:

