[[cheat]]
id = "player-data-ctrl-numpad-1"
name = "Player Data (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : KingdomOfNight.exe
// Author            : ndck76
// Executable Version: 2022.3.62.30479
// Game Version      : Build.21017748
// Script Date       : 2025-12-04


[ENABLE]

aobscanregion(unlockedskills,GameDataManager:IsSkillUnlocked,GameDataManager:IsSkillUnlocked+100,488Bxxxx48xxxx48xxxxxx83xxxx48xxxxxx49BBxxxxxxxxxxxx000041xxxx48xxxxxx5DC3) //GameDataManager:IsSkillUnlocked+4c
alloc(newmem,$1000,unlockedskills)
alloc(data2,8)
alloc(unlockedskillsbkp,7)
registersymbol(data2)
registersymbol(unlockedskills)
registersymbol(unlockedskillsbkp)
label(code)
label(return)

unlockedskillsbkp:
  readmem(unlockedskills,7)

newmem:
  mov [data2],rax

code:
  readmem(unlockedskills,7)
  jmp return

unlockedskills:
  jmp newmem
  nop 2
return:

[DISABLE]

unlockedskills:
  readmem(unlockedskillsbkp,7)

unregistersymbol(*)
dealloc(*)"""

