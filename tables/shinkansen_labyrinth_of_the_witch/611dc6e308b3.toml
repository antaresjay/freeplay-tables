[[cheat]]
id = "mainsystem-base-address-scan-to-activate-play-level-to-update-play-level"
name = "MainSystem Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(MainSystem_savedAOB)
label(MainSystem_returnhere)
label(MainSystem_originalcode)
label(MainSystem_exit)

label(MainSystem_update_exit)
label(MainSystem_hpset_exit)
label(MainSystem_satietyset_exit)
label(MainSystem_powerset_exit)
label(MainSystem_goldset_exit)
label(MainSystem_attackset_exit)
label(MainSystem_inventoryset_exit)
label(MainSystem_dungeonset_exit)

registersymbol(MainSystem_originalcode)
registersymbol(MainSystem_savedAOB)

//0703171C - B8 01000000           - mov eax,00000001
//07031721 - 0FB6 D8               - movzx ebx,al
// InGame:MainSystem:UpdateInternal+14
//07031724 - 8B 87 08010000        - mov eax,[edi+00000108]
//0703172A - 3D 0E000000           - cmp eax,0000000E
//0703172F - 75 07                 - jne 07031738
//07031731 - 8B C3                 - mov eax,ebx
//07031733 - E9 89020000           - jmp 070319C1
aobscan(MainSystem_searchedAOB, 8B 87 08 01 00 00 3D 0E 00 00 00 75 07)

alloc(MainSystem_newmem, 2048, MainSystem_searchedAOB)
alloc(MainSystem_temp1, 4, MainSystem_searchedAOB)
alloc(MainSystem_temp2, 4, MainSystem_searchedAOB)
alloc(MainSystem_temp3, 4, MainSystem_searchedAOB)
alloc(MainSystem_temp4, 4, MainSystem_searchedAOB)
alloc(MainSystem_temp5, 4, MainSystem_searchedAOB)


MainSystem_newmem:
mov [MainSystem_temp1], eax
mov [MainSystem_temp2], ebx
mov [MainSystem_temp3], ecx
mov [MainSystem_temp4], edx

cmp dword ptr [MainSystem_update_enable], #0
je MainSystem_update_exit
mov [MainSystem_basepointer], edi
MainSystem_update_exit:

cmp dword ptr [MainSystem_hpset_enable], #0
je MainSystem_hpset_exit
mov ebx, [edi+7c]
test ebx, ebx
je MainSystem_hpset_exit
mov ebx, [ebx+c]
test ebx, ebx
je MainSystem_hpset_exit
mov [ebx+18], #9999
MainSystem_hpset_exit:

cmp dword ptr [MainSystem_satietyset_enable], #0
je MainSystem_satietyset_exit
mov ebx, [edi+7c]
test ebx, ebx
je MainSystem_satietyset_exit
mov ebx, [ebx+10]
test ebx, ebx
je MainSystem_satietyset_exit
mov [ebx+18], #101
MainSystem_satietyset_exit:

cmp dword ptr [MainSystem_powerset_enable], #0
je MainSystem_powerset_exit
mov ebx, [edi+7c]
test ebx, ebx
je MainSystem_powerset_exit
mov ecx, [ebx+38]
mov [ebx+34], ecx
MainSystem_powerset_exit:

cmp dword ptr [MainSystem_goldset_enable], #0
je MainSystem_goldset_exit
mov ebx, [edi+7c]
test ebx, ebx
je MainSystem_goldset_exit
mov ebx, [ebx+14]
test ebx, ebx
je MainSystem_goldset_exit
mov [ebx+18], #9999999
MainSystem_goldset_exit:

cmp dword ptr [MainSystem_attackset_enable], #0
je MainSystem_attackset_exit
mov ebx, [edi+7c]
test ebx, ebx
je MainSystem_attackset_exit
mov [ebx+bc], #9999
MainSystem_attackset_exit:

cmp dword ptr [MainSystem_inventoryset_enable], #0
je MainSystem_inventoryset_exit
mov ebx, [edi+c8]
test ebx, ebx
je MainSystem_inventoryset_exit
mov ebx, [ebx+c]
test ebx, ebx
je MainSystem_inventoryset_exit
mov [ebx+44], #9999
mov [ebx+48], #9999
MainSystem_inventoryset_exit:

cmp dword ptr [MainSystem_dungeonset_enable], #0
je MainSystem_dungeonset_exit
mov ebx, [edi+c0]
test ebx, ebx
je MainSystem_dungeonset_exit
mov byte ptr [ebx+21], #1
mov ebx, [edi+c8]
test ebx, ebx
je MainSystem_dungeonset_exit
mov [ebx+30], #1
mov [ebx+34], #1
//mov byte ptr [ebx+3c], #1
MainSystem_dungeonset_exit:

mov eax, [MainSystem_temp1]
mov ebx, [MainSystem_temp2]
mov ecx, [MainSystem_temp3]
mov edx, [MainSystem_temp4]


MainSystem_originalcode:
readmem(MainSystem_searchedAOB, 6)


MainSystem_exit:
jmp MainSystem_returnhere


MainSystem_searchedAOB:
MainSystem_savedAOB:
jmp MainSystem_newmem
nop
MainSystem_returnhere:


[DISABLE]
MainSystem_savedAOB:
readmem(MainSystem_originalcode, 6)

unregistersymbol(MainSystem_originalcode)
unregistersymbol(MainSystem_savedAOB)

dealloc(MainSystem_newmem)
dealloc(MainSystem_temp1)
dealloc(MainSystem_temp2)
dealloc(MainSystem_temp3)
dealloc(MainSystem_temp4)
dealloc(MainSystem_temp5)"""

