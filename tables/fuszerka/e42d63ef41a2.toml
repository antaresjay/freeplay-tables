[[cheat]]
id = "infinite-durability"
name = "Infinite Durability"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(infdura, Fuszerka.Interactables.ToolDurability:Consume+4, Fuszerka.Interactables.ToolDurability:Consume+e5, F3 0F 10 46 14 F3 0F 5A C0 F3 0F 10 4E 18)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
fld dword ptr [rsi+10]
fstp dword ptr [rsi+14]

code:
  movss xmm0,[rsi+14]
  cvtss2sd xmm0,xmm0
  movss xmm1,[rsi+18]
  jmp return

infdura:
  jmp far newmem
return:
registersymbol(infdura)

[DISABLE]

infdura:
  db F3 0F 10 46 14 F3 0F 5A C0 F3 0F 10 4E 18

unregistersymbol(infdura)
dealloc(newmem)"""
