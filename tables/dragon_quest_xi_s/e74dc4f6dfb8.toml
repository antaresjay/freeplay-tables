[[cheat]]
id = "enable-gold-multiplier"
name = "Enable Gold Multiplier"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(GoldMultiplier,DRAGON QUEST XI S.exe,89 81 C0 00 00 00 E8 DE)
alloc(newmem,$1000,GoldMultiplier)
registersymbol(GoldMulti)
label(code return GoldMulti)

newmem:
imul eax,[GoldMulti]

code:
  mov [rcx+000000C0],eax
  jmp return

GoldMulti:
dd #2

GoldMultiplier:
  jmp newmem
  nop
return:
registersymbol(GoldMultiplier)

aobscanmodule(GoldLossMultiplier,DRAGON QUEST XI S.exe,2B C2 89 81 C0 00 00 00 E8 10)
alloc(newmem2,$1000,GoldLossMultiplier)
registersymbol(GoldLoss)
label(code2 return2)

newmem2:
imul edx,[GoldLoss]

code2:
  sub eax,edx
  mov [rcx+000000C0],eax
  jmp return2

GoldLoss:
dd #1

GoldLossMultiplier:
  jmp newmem2
  nop 3
return2:
registersymbol(GoldLossMultiplier)

[DISABLE]

GoldMultiplier:
  db 89 81 C0 00 00 00

GoldLossMultiplier:
  db 2B C2 89 81 C0 00 00 00

unregistersymbol(*)
dealloc(*)"""

