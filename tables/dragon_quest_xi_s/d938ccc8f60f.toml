  mov rdx,[rcx]
  cmp rdx,0
  je DonePerformBuffLoop
  { Check That Current Buff We Want To Put Is Not In Buff List }
  mov r8,[r15+00000360]
  test r8,r8
  je DoneCheckCurrentBuffList
  xor rcx,rcx
  { Save Current Character Buff List We Have }
  mov qword ptr [CurrentCharacterBuffList],00
  mov r8,[r8+38]
  test r8,r8
  je SkipSaveCurrentCharacter
  mov rax,[r8]
  test rax,rax
  je SkipSaveCurrentCharacter
  mov rcx,[rax+20]
  test rcx,rcx
  je SkipSaveCurrentCharacter
  xor r9,r9
  movzx r9d,byte ptr [rcx+71]
  mov [CurrentCharacterBuffList],r9d
SkipSaveCurrentCharacter:
  mov r8,[r15+00000360]
