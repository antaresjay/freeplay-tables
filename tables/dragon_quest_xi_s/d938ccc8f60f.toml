newmem:
  test rax,rax
  je originalcode
  mov [RAXSave],rax
  mov [RBXSave],rbx
  mov [RCXSave],rcx
  mov [RDXSave],rdx
  mov rbx,[rsp+08]
  xor rcx,rcx
  mov rdx,EquipmentEditorStatsPtr
StartFindLoop:
  cmp qword ptr [rdx+rcx*8],0
  je NotFoundAddItem
  cmp rax,[rdx+rcx*8]
  je CleanUp
  inc ecx
  cmp ecx,dword ptr [MaxEquipmentFound]
  jge CleanUp
  jmp StartFindLoop
NotFoundAddItem:
  mov [rdx+rcx*8],rax
  inc [NumEquipmentFound]
  mov rdx,EquipmentEditorItemIDPtr
  mov [rdx+rcx*8],rbx
CleanUp:
  mov rax,[RAXSave]
  mov rbx,[RBXSave]
  mov rcx,[RCXSave]
  mov rdx,[RDXSave]
  jmp originalcode
  
originalcode:
