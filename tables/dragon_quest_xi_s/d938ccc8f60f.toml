newmem:
  mov [RAXSave],rax
RepeatProcess:
  cmp [NumTimesExecuted],0
  jne RestoreAndContinue
SaveAndCustomBuff:
  { Now, we loop through the custom buffs for us to do }
  inc [NumTimesExecuted]
StartProcess:
  mov rcx,CustomSpecialID
  mov rdx,[CurrentBuffNum]
  cmp edx,0
  je StartPerformBuffLoop
GetOurCurrentBuff:
  add rcx,08
  dec edx
  jne GetOurCurrentBuff
