  inc [CurrentBuffNum]
  { We only count up to 12 buffs to add }
  cmp dword ptr [NumTimesExecuted],#12
  jl StartProcess
DonePerformBuffLoop:
  jmp RepeatProcess
RestoreAndContinue:
  mov rax,[RAXSave]
  mov qword ptr [NumTimesExecuted],00
  mov qword ptr [CurrentBuffNum],00
  mov r9,[rbx]
  lea rdx,[rbp-28]
  jmp return

