  xor rcx,rcx
  mov ecx,[r8+40]
  mov r8,[r8+38]
  xor r9,r9
  cmp r9d,ecx
  jge DoneCheckCurrentBuffList
StartCheckCurrentBuffList:
  mov rax,[r8]
  cmp [rax+38],rdx
  je NextBuff
  add r8,08
  inc r9
  cmp r9d,ecx
  jl StartCheckCurrentBuffList
DoneCheckCurrentBuffList:
  {Do One Last Check If We Only Want A Specific Character To Add These Buffs To }
  cmp dword ptr [CharacterToCustomBuff1],0
  je DoPerformAddBuff
  mov rax,[CurrentCharacterBuffList]
  cmp [CharacterToCustomBuff1],eax
  je DoPerformAddBuff
