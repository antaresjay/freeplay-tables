type = "script"
source = """
[ENABLE]

aobscanmodule(EquipmentEditorAOB,$process,48 85 C0 0F 84 BC 00 00 00 8B 4C 24 20) // should be unique
registersymbol(EquipmentEditorAOB)
alloc(newmem,2048,EquipmentEditorAOB)

label(return)
