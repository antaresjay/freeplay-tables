[[cheat]]
id = "undead"
name = "undead"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanregion(cJmpIfNotDeadBoundReach1AOB,Celeste.Level::EnforceBounds,Celeste.Level::EnforceBounds+c85,74 50 A1)
registersymbol(cJmpIfNotDeadBoundReach1AOB)

cJmpIfNotDeadBoundReach1AOB: //Celeste.Level::EnforceBounds+C09:
db 90 90

///****************************************///
aobscanregion(cJmpIfNotDeadBoundReach2AOB,Celeste.Level::EnforceBounds,Celeste.Level::EnforceBounds+c85,74 3F 6A 00 6A 00)
registersymbol(cJmpIfNotDeadBoundReach2AOB)

cJmpIfNotDeadBoundReach2AOB: //Celeste.Level::EnforceBounds+C1A:
db 90 90

///****************************************///
aobscanregion(collideMethodCallAOB,Celeste.PlayerCollider::Check,Celeste.PlayerCollider::Check+ad,8B 49 04 FF D0)
registersymbol(collideMethodCallAOB)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
mov ecx,[ecx+04]
cmp [ecx+1c],ffffffff
je exit

originalcode:
//mov ecx,[ecx+04]
call eax

exit:
jmp returnhere

///

collideMethodCallAOB: //Celeste.PlayerCollider::Check+3F:
jmp newmem
returnhere:





[DISABLE]
//code from here till the end of the code will be used to disable the cheat
cJmpIfNotDeadBoundReach1AOB: //Celeste.Level::EnforceBounds+C09:
db 74 50
//Alt: je Celeste.Level::EnforceBounds+C5B

///****************************************///
cJmpIfNotDeadBoundReach2AOB: //Celeste.Level::EnforceBounds+C1A:
db 74 3F
//Alt: je Celeste.Level::EnforceBounds+C5B

///****************************************///
dealloc(newmem)
collideMethodCallAOB: //Celeste.PlayerCollider::Check+3F:
db 8B 49 04 FF D0
//Alt: mov ecx,[ecx+04]
//Alt: call eax"""

[[cheat]]
id = "fly"
name = "fly"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
define(flyspeeddefault,(float)90)

aobscanregion(onSpeed_2WriteAOB,Celeste.Player::NormalUpdate,Celeste.Player::NormalUpdate+1490,E8 ** ** ** ** D9 5E 04 8B)
registersymbol(onSpeed_2WriteAOB)

label(dFlySpeed)
registersymbol(dFlySpeed)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
call Monocle.Calc::Approach

pushad
push 20 //SPACEBAR
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne end

fldz
fcomip st(0),st(1)
jp updowncontrol
jae updowncontrol

fstp st(0)
fldz

updowncontrol:
pushad
push 'W'
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
je flyup

pushad
push 'S'
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
je flydown

jmp end

flyup:
fstp st(0)
fld dword ptr [dFlySpeed]
fmul dword ptr [dFlySpeed+4]
jmp end

flydown:
fstp st(0)
fld dword ptr [dFlySpeed]
jmp end

end:
jmp exit

originalcode:
call Monocle.Calc::Approach

exit:
jmp returnhere

///
dFlySpeed:
dd flyspeeddefault
dd (float)-1
///

onSpeed_2WriteAOB: //Celeste.Player::NormalUpdate+FE0:
jmp newmem
returnhere:



 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
onSpeed_2WriteAOB: //Celeste.Player::NormalUpdate+FE0:
call Monocle.Calc::Approach
//Alt: db E8 03 8D 48 FF

unregistersymbol(dFlySpeed)"""

