[[cheat]]
id = "player-pointers"
name = "Player Pointers"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(pointers,ZERO Sievert.exe,49 8B D5 48 8B CF E8 B3)
alloc(newmem,$1000,pointers)

label(save)
label(pointersPtr)
label(pointersBkp)
label(return)

newmem:
  mov rcx,pointersPtr
  mov eax,[rsp+40]
  lea eax,[eax]
  cmp eax,00018741 // 33 rest
  jne @f
  xor rax,rax
  jmp save
@@:
  cmp eax,000186ED // DE water
  jne @f
  mov rax,08
  jmp save
@@:
  cmp eax,00018740 // 32 food
  jne @f
  mov rax,10
  jmp save
@@:
  cmp eax,000187F3 // A4 health
  jne @f
  mov rax,18
  jmp save
@@:
  cmp eax,00018F63 // 35 stamina
  jne @f
  mov rax,20
  jmp save
@@:
  cmp eax,00018742 // 34 radiation
  jne @f
  mov rax,28
  jmp save
@@:
  cmp eax,00018773 // 4E weight
  jne @f
  mov rax,30
  jmp save
pointersBkp:
  readmem(pointers,6)
  cmp eax,00018700
  jl @f
  cmp eax,00018800
  jg @f
  lea rcx,[rcx]
@@:
  lea rcx,[rcx]
  jmp return
save:
  add rax,rcx
  readmem(pointers,6)
  mov [rax],rcx
  jmp return

align 10
pointersPtr:
  dq 0
  dq 0
  dq 0
  dq 0
  dq 0
  dq 0
  dq 0
  dq 0
  dq 0
  dq 0
  dq 0
  dq 0
  dq 0
  dq 0
  dq 0

pointers:
  jmp newmem
  nop
return:
registersymbol(pointers)
registersymbol(pointersBkp)
registersymbol(pointersPtr)

[DISABLE]
pointers:
  readmem(pointersBkp,6)
unregistersymbol(pointers)
unregistersymbol(pointersBkp)
unregistersymbol(pointersPtr)
dealloc(newmem)

