name = "→ Game Options"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(GameStats,_Project.Scripts.UIScripts.HUD.BuildUpPanelController:OnSecond+138,_Project.Scripts.UIScripts.HUD.BuildUpPanelController:OnSecond+1e2,83 3A 00 48 63 49 74)
alloc(newmem,$1000,GameStats)
registersymbol(GrabGameStats)
label(code return GrabGameStats)

newmem:
mov [GrabGameStats],rdx

code:
  cmp dword ptr [rdx],00
  movsxd  rcx,dword ptr [rcx+74]
  jmp return

GrabGameStats:
dw

GameStats:
  jmp newmem
  nop 2
return:
registersymbol(GameStats)

[DISABLE]

GameStats:
  db 83 3A 00 48 63 49 74

unregistersymbol(*)
dealloc(*)"""
