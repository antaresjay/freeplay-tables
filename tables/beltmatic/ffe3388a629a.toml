[[cheat]]
id = "get-level-manager-open-manager"
name = "-> Get Level Manager (open manager)"
category = "player"
description = ""
hint = ""
type = "script"
source = '''
//Target:  Beltmatic.exe
//Author:  Salis
//Credit to METHOS for custom Template LUA

[ENABLE]

////////////////////////  getlevelmanager  \\\\\\\\\\\\\\\\\\\\\\\\

define(address, Ncp.Game.LevelManager.get_BeltLevel)

alloc(newmem,1024,GameAssembly.dll)
alloc(obytes_getlevelmanager, 10)
label(return code)

registersymbol(obytes_getlevelmanager levelman)

obytes_getlevelmanager:
readmem(address, 10)

newmem:

code:
 mov [levelman], rcx
 mov eax,[rcx+40]
 ret
 jmp return

levelman:
dd 0

address:
 jmp newmem
 return:


[DISABLE]

address:
readmem(obytes_getlevelmanager, 10)

dealloc(*)
unregistersymbol(*)'''

