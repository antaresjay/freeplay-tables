[[cheat]]
id = "sprint-swim-climb-jump-and-dodge-no-use-stamina"
name = "Sprint, Swim, Climb, Jump And Dodge No Use Stamina"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
{ Game   : OmegaCrafter.exe
  Version:
  Date   : 2024-04-01
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(pData_NoUseStamina,GameAssembly.dll,F3 0F 10 71 3C 33) // should be unique
alloc(newmem,$1000,pData_NoUseStamina)

label(code)
label(return)

newmem:
  mov [rcx+30],(float)0                //SprintStaminaCostPerSec
  mov [rcx+34],(float)0                //SwimStaminaCostPerSec
  mov [rcx+38],(float)0                //ClimbStaminaCostPerSec
  mov [rcx+3C],(float)0                //JumpStaminaCost
  mov [rcx+40],(float)0                //DodgeStaminaCost

code:
  db F3 0F 10 71 3C
  jmp return

pData_NoUseStamina:
  jmp newmem
return:
registersymbol(pData_NoUseStamina)

[DISABLE]

pData_NoUseStamina:
  db F3 0F 10 71 3C

unregistersymbol(pData_NoUseStamina)
dealloc(newmem)"""

