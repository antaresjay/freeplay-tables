[[cheat]]
id = "fast-reload"
name = "Fast Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Reload,FTLGame.exe,D9 40 08 D8 70 0C D9 9D 64) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(Normal)
label(sVal)
label(nVal)

newmem:

sVal:
dd (float).5

nVal:
dd (float)0

code:
  push ebx
  cmp [eax+8], (float).5
  jl Normal
  fld dword ptr [eax+0c]
  fsub [sVal]
  fstp [nVal]
  mov ebx, [nVal]
  cmp [eax+8], ebx
  jg Normal
  mov dword ptr [eax+8], ebx
Normal:
  pop ebx
  fld dword ptr [eax+08]
  fdiv dword ptr [eax+0C]
  jmp return

Reload:
  jmp code
  nop
return:
registersymbol(Reload)

[DISABLE]

Reload:
  db D9 40 08 D8 70 0C

unregistersymbol(Reload)
dealloc(newmem)"""
