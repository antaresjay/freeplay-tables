[[cheat]]
id = "console-cheats"
name = "~console_cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{

Half-Life PC Cheat Codes

Press the tilde (~) key to open the console.

type sv_cheats 1 and press Enter to enable cheats.

The following is a list of items you can spawn using the
give <item name>

item_airtank
item_antidote
item_battery
item_healthkit
item_longjump
item_security
item_sodacan
item_suit
ammo_357
ammo_9mmAR
ammo_9mmbox
ammo_9mmclip
ammo_ARgrenades
ammo_buckshot
ammo_crossbow
ammo_egonclip
ammo_gaussclip
ammo_glockclip
ammo_mp5clip
ammo_mp5grenades
ammo_rpgclip
weapon_357
weapon_9mmAR
weapon_9mmhandgun
weapon_crossbow
weapon_crowbar
weapon_egon
weapon_gauss
weapon_glock
weapon_handgrenade
weapon_hornetgun
weapon_mp5
weapon_python
weapon_rpg
weapon_satchel
weapon_shotgun
weapon_snark
weapon_tripmine
weapon_quantumdestabilizer


Cheat Code\t Effect
sv_gravity   <-999 - 999999>\tAdjusts gravity by the desired amount.
impulse 195; impulse 196; impulse 197; impulse 199\tGives AI Node information.
impulse 101\t All weapons and ammo.
-reload\t     Disables auto-reload.
+reload\t     Enables auto-reload.
impulse 109\t Control on-screen monsters.
impulse 203\t Delete monsters/NPCs.
developer 0\t Turns off Developer Mode.
developer 1\t Turns on Developer Mode.
god\t         Enables God Mode.
impulse 101\t HEV suit, weapons, and ammo.
impulse 104\t Lists global entities.
map <map name>\tMap selection.
impulse 106\t Model/sprite stats while looking at target.
impulse 103\t Monster stats while looking at monster.
noclip\t     Enables No Clipping Mode.
give <item name>\tObtain the specified item.
notarget\t Opponents ignore the player.
firstperson\t Returns you to first-person view.
lambert -1.0001\tSee things brightly without the flashlight.
rate <0-3500>\tSet reload speed (0 is fastest, 3500 is default).
impulse 105\t Silent player.
impulse 202\t Spawns blood.
impulse 76\t Spawns a human grunt.
impulse 102\t Spawns gibs and blood.
speak <word.word2.word3>\tSpeak the specified sentence.
speak <word>\tSpeak the specified word.
r_fullbright 9\tEnables strange colors and wireframes.
kill\tCommit suicide.
impulse 107\t   Texture name while looking at object.
thirdperson\t   Enables third-person view.
host_framerate <0,1>\tToggles game speed.
r_fullbright <0,1>\tToggles the light amplifier.
developer 2\t Enables Verbose Developer Mode.


}
[ENABLE]
[DISABLE]"""
