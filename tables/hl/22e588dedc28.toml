[[cheat]]
id = "health-1-hit-kil"
name = "health 1 hit kil"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(health,opfor.dll,D9 98 60 01 00 00 83) 
alloc(newmem,$1000)
label(code)
label(return)
label(freeman)
newmem:
  cmp [eax+000001A8],1
  je freeman
  mov [eax+00000160],(float)0
  jmp return
code:
  fstp dword ptr [eax+00000160]
  jmp return
freeman:
  mov [eax+00000160],(float)100
  jmp return
health:
  jmp newmem
  nop
return:
registersymbol(health)
[DISABLE]
health:
  db D9 98 60 01 00 00
unregistersymbol(health)
dealloc(newmem)"""

