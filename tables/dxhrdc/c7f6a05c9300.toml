[[cheat]]
id = "no-reload"
name = "No Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(noreload,DXHRDC.exe,0F BF 41 14 C3)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  test ecx, ecx
  jz @F
  mov [ecx+14], #99

@@:
  movsx eax,word ptr [ecx+14]
  ret 
  jmp return

noreload:
  jmp newmem
return:
registersymbol(noreload)

[DISABLE]

noreload:
  db 0F BF 41 14 C3

unregistersymbol(noreload)
dealloc(newmem)"""

