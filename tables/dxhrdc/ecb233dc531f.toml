[[cheat]]
id = "enable-inventory-hack"
name = "Enable Inventory Hack"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
AoBScan(location, FF D0 8B 18 8B 0D)

[ENABLE]
alloc(weaponaddress,4)
registersymbol(weaponaddress)

alloc(newmem,1024)
label(returnhere)
label(originalcode)
label(exit)

location+A:
jmp newmem
returnhere:

newmem:
mov [weaponaddress],eax
originalcode:
push edi
mov [esp+14],ebx
exit:
jmp returnhere

[DISABLE]
dealloc(weaponaddress)
unregistersymbol(weaponaddress)
dealloc(newmem)
dealloc(returnhere)
dealloc(originalcode)
dealloc(exit)

location+A:
push edi
mov [esp+14],ebx"""

