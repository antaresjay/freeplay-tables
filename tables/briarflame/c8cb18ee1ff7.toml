[[cheat]]
id = "player-ctrl-numpad-1"
name = "Player (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : BriarFlame.exe
// Author            : ndck76
// Executable Version: 2021.3.22.50513
// Game Version      : Build.22145793
// Script Date       : 2026-03-26


[ENABLE]

aobscanregion(core,Player:Update,Player:Update+200,488B86xxxx000048xxxx83xxxx66xx49BBxxxxxxxxxxxx000041xxxx48xxxxxx48xxxx83xxxx48xxxxxx48xxxx48xxxx) //Player:Update+f
alloc(newmem,$1000,core)
alloc(data2,8)
alloc(corebkp,7)
registersymbol(data2)
registersymbol(core)
registersymbol(corebkp)
label(code)
label(return)

corebkp:
  readmem(core,7)

newmem:
  mov [data2],rsi

code:
  readmem(core,7)
  jmp return

core:
  jmp newmem
  nop 2
return:

[DISABLE]

core:
  readmem(corebkp,7)

unregistersymbol(*)
dealloc(*)"""

