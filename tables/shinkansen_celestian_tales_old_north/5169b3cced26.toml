[[cheat]]
id = "playerdata-base-address-scan-to-activate-load-game-to-update-play-game-for-minimum-1-second"
name = "PlayerData Base Address Scan (To Activate: Load Game, To Update: Play Game for Minimum  1 Second)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerData_savedAOB)
label(PlayerData_returnhere)
label(PlayerData_originalcode)
label(PlayerData_exit)

label(PlayerData_update_exit)
label(PlayerData_set_exit)

registersymbol(PlayerData_savedAOB)

//106E2992 - 41 FF D3              - call r11d
//106E2995 - 48 83 C4 20           - add rsp,20
// PlayerData:AddSecond+19
//106E2999 - 48 63 48 7C           - movsxd  rcx,dword ptr [rax+7C]
//106E299D - FF C1                 - inc ecx
//106E299F - 89 48 7C              - mov [rax+7C],ecx
//106E29A2 - 48 83 EC 20           - sub rsp,20
//106E29A6 - 49 BB 90A86B1000000000 - mov r11,00000000106BA890 : [EC8B4855]
aobscan(PlayerData_searchedAOB, 48 63 48 7C FF C1 89 48 7C)

alloc(PlayerData_newmem, 2048)


PlayerData_newmem:
cmp dword ptr [PlayerData_update_enable], #0
je PlayerData_update_exit
mov [PlayerData_basepointer], rax
PlayerData_update_exit:

cmp dword ptr [PlayerData_set_enable], #0
je PlayerData_set_exit
mov [rax+70], #9999999
PlayerData_set_exit:


PlayerData_originalcode:
db 48 63 48 7C FF C1
//movsxd  rcx,dword ptr [rax+7C]
//inc ecx


PlayerData_exit:
jmp PlayerData_returnhere


PlayerData_searchedAOB:
PlayerData_savedAOB:
jmp PlayerData_newmem
nop
PlayerData_returnhere:


[DISABLE]
PlayerData_savedAOB:
db 48 63 48 7C FF C1
//movsxd  rcx,dword ptr [rax+7C]
//inc ecx

unregistersymbol(PlayerData_savedAOB)

dealloc(PlayerData_newmem)"""

