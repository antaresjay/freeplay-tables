[[cheat]]
id = "infinite-ap"
name = "Infinite AP"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(PSX_AP,Valkyria4_x64.exe,F3 0F 11 BB C4 04 00 00)
alloc(newmem,$1000,PSX_AP)

label(return)
label(_CurrentAP)
registersymbol(_CurrentAP)
alloc(APValue,4)

APValue:
dq (float)0
align 10

newmem:
mov [_CurrentAP],rbx
movss xmm7 [APValue]
movss [rbx+000004C4],xmm7
jmp return

_CurrentAP:
PSX_AP:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(PSX_AP)

[DISABLE]

PSX_AP:
  db F3 0F 11 BB C4 04 00 00
unregistersymbol(_CurrentAP)
unregistersymbol(PSX_AP)
dealloc(newmem)
dealloc(APValue)"""

