[[cheat]]
id = "god-mode-one-hit-kill"
name = "God mode + one hit kill"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
assert(GameAssembly.dll+4E079D, 44 29 BB 08 01 00 00)
alloc(newmem,$1000,GameAssembly.dll+4E079D)

label(code)
label(return)
label(enemy_death)

newmem:

  cmp dword ptr [rbx+00000258],1
  jne enemy_death

player_godmode:

  mov dword ptr [rbx+00000108],#9999
  jmp return

enemy_death:

  mov dword ptr [rbx+00000108],0
  jmp return

code:
  sub [rbx+00000108],r15d
  jmp return

GameAssembly.dll+4E079D:
  jmp newmem
  nop 2
return:

[DISABLE]
GameAssembly.dll+4E079D:
  db 44 29 BB 08 01 00 00

dealloc(newmem)"""
