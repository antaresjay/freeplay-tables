type = "script"
source = """
[ENABLE]
aobscanmodule(aobmaxstats_display,$process,0F B6 C0 83 FB 01 7D * BB 01 00 00 00 EB * 3B D8 0F 4F) // should be unique
alloc(newmem,$1000,aobmaxstats_display)
label(code)
label(return)

newmem:

code:
  mov eax,#255
  cmp ebx,01
  jmp return

aobmaxstats_display:
  jmp newmem
  nop
return:
