registersymbol(bEnableMinFireConvert)
registersymbol(iMinFireConvert)

newmem:
bEnableMinEnergy:
dd 1
fMinEnergyRatio:
dd (float)0.75
bEnableMinAC:
dd 1
fMinACRatio:
dd (float)0.75
bEnableMinAether:
dd 1
iMinAether:
dd (int)400
bEnableMinFireFreeze:
