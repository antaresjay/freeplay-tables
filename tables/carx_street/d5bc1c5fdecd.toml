[[cheat]]
id = "nitro-boost"
name = "Nitro Boost"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Nitro_Calc_AOB,GameAssembly.dll,0F 11 45 D0 F3 0F 58 CE) // should be unique
alloc(newmem,$1000,Nitro_Calc_AOB)

label(code)
label(return)
alloc(Nitro_Flag,4)
registersymbol(Nitro_Flag)
alloc(Nitro_Set,4)
registersymbol(Nitro_Set)

Nitro_Set:
dd (float)20
Nitro_Flag:
dd 0

newmem:
  movups [rbp-30],xmm0
  cmp [Nitro_Flag],1
  jne @f
  movss xmm1,[Nitro_Set]  //m_maxAmount - NitroResource
  jmp return
code:
  addss xmm1,xmm6
  jmp return

Nitro_Calc_AOB:
  jmp newmem
  nop 3
return:
registersymbol(Nitro_Calc_AOB)

[DISABLE]

Nitro_Calc_AOB:
  db 0F 11 45 D0 F3 0F 58 CE

unregistersymbol(*)
dealloc(*)"""

