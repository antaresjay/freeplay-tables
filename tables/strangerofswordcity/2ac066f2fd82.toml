[[cheat]]
id = "player-stats-base-address-scan-to-update-play-game"
name = "Player Stats Base Address Scan (To Update: Play Game)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstats_update_exit)
label(playerstats_set_exit)
label(playerstats_bloodgemset_exit)
label(playerstats_moraleset_exit)

registersymbol(playerstats_savedAOB)

//StrangerOfSwordCity.exe+4FCE8 - 89 41 0C              - mov [ecx+0C],eax
//StrangerOfSwordCity.exe+4FCEB - EB 21                 - jmp StrangerOfSwordCity.exe+4FD0E
//StrangerOfSwordCity.exe+4FCED - 0FB7 01               - movzx eax,word ptr [ecx]
//StrangerOfSwordCity.exe+4FCF0 - A8 04                 - test al,04
//StrangerOfSwordCity.exe+4FCF2 - 74 1A                 - je StrangerOfSwordCity.exe+4FD0E
//StrangerOfSwordCity.exe+4FCF4 - 66 FF 49 30           - dec word ptr [ecx+30]
//StrangerOfSwordCity.exe+4FCF8 - 33 D2                 - xor edx,edx
//StrangerOfSwordCity.exe+4FCFA - 66 3B 51 30           - cmp dx,[ecx+30]
//StrangerOfSwordCity.exe+4FCFE - 7C 0E                 - jnge StrangerOfSwordCity.exe+4FD0E
//StrangerOfSwordCity.exe+4FD00 - 25 FBFF0000           - and eax,0000FFFB
//StrangerOfSwordCity.exe+4FD05 - 66 89 01              - mov [ecx],ax
//StrangerOfSwordCity.exe+4FD08 - 33 C0                 - xor eax,eax
//StrangerOfSwordCity.exe+4FD0A - 66 89 41 30           - mov [ecx+30],ax
// Accesses Blood Gems
//StrangerOfSwordCity.exe+4FD0E - 8B 15 900BCC00        - mov edx,[StrangerOfSwordCity.exe+360B90]
//StrangerOfSwordCity.exe+4FD14 - 39 51 18              - cmp [ecx+18],edx
//StrangerOfSwordCity.exe+4FD17 - 75 0F                 - jne StrangerOfSwordCity.exe+4FD28
aobscan(playerstats_searchedAOB, 0F B7 01 A8 04 74 1A)

alloc(playerstats_newmem, 2048, playerstats_searchedAOB)
alloc(playerstats_temp1, 4, playerstats_searchedAOB)


playerstats_newmem:
mov [playerstats_temp1], ebx

mov ebx, [playerstats_savedAOB+23]
cmp dword ptr [ebx], #0
je playerstats_moraleset_exit
sub ebx, 2018

cmp dword ptr [playerstats_update_enable], #0
je playerstats_update_exit
mov [playerstats_basepointer], ebx
playerstats_update_exit:

cmp dword ptr [playerstats_set_enable], #0
je playerstats_set_exit
playerstats_set_exit:

cmp dword ptr [playerstats_bloodgemset_enable], #0
je playerstats_bloodgemset_exit
mov [ebx+2018], #9999999
playerstats_bloodgemset_exit:

cmp dword ptr [playerstats_moraleset_enable], #0
je playerstats_moraleset_exit
mov word ptr [ebx+2024], #5000
playerstats_moraleset_exit:

mov ebx, [playerstats_temp1]


playerstats_originalcode:
db 0F B7 01 A8 04
//movzx eax,word ptr [ecx]
//test al,04


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB:
playerstats_savedAOB:
jmp playerstats_newmem
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
db 0F B7 01 A8 04
//movzx eax,word ptr [ecx]
//test al,04

unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)
dealloc(playerstats_temp1)"""

