mov word ptr [edx+76], #3
mov word ptr [edx+7a], #4
mov word ptr [edx+7c], #4
mov word ptr [edx+7e], #4
mov word ptr [edx+82], #4
mov word ptr [edx+84], #4
mov word ptr [edx+86], #4
mov word ptr [edx+8a], #4
mov word ptr [edx+8c], #4
mov word ptr [edx+8e], #4
mov word ptr [edx+92], #5
mov word ptr [edx+94], #5
mov word ptr [edx+96], #5
mov word ptr [edx+9a], #5
mov word ptr [edx+9c], #5
mov word ptr [edx+9e], #5
mov word ptr [edx+a2], #5
mov word ptr [edx+a4], #5
mov word ptr [edx+a6], #5
mov word ptr [edx+aa], #1
mov word ptr [edx+ac], #1
mov word ptr [edx+ae], #1
mov word ptr [edx+b8], #5
mov word ptr [edx+c0], #3
mov word ptr [edx+c8], #5
battlerecordsstats_divinitiesset_exit:

cmp dword ptr [battlerecordsstats_playtimeset_enable], #0
je battlerecordsstats_playtimeset_exit
mov [edx+1c], #0
battlerecordsstats_playtimeset_exit:


battlerecordsstats_originalcode:
db FE 42 1F 80 7A 1F 3C
//inc byte ptr [edx+1F]
//cmp byte ptr [edx+1F],3C


battlerecordsstats_exit:
jmp battlerecordsstats_returnhere


battlerecordsstats_searchedAOB:
battlerecordsstats_savedAOB:
jmp battlerecordsstats_newmem
nop
nop
battlerecordsstats_returnhere:


[DISABLE]
