label(battlerecordsstats_exit)

label(battlerecordsstats_update_exit)
label(battlerecordsstats_set_exit)
label(battlerecordsstats_divinitiesset_exit)
label(battlerecordsstats_playtimeset_exit)

registersymbol(battlerecordsstats_savedAOB)

//StrangerOfSwordCity.exe+14BC90 - 8B D1                 - mov edx,ecx
// Accesses Seconds Played
//StrangerOfSwordCity.exe+14BC92 - FE 42 1F              - inc byte ptr [edx+1F]
//StrangerOfSwordCity.exe+14BC95 - 80 7A 1F 3C           - cmp byte ptr [edx+1F],3C
//StrangerOfSwordCity.exe+14BC99 - 72 24                 - jb StrangerOfSwordCity.exe+14BCBF
//StrangerOfSwordCity.exe+14BC9B - FE 42 1E              - inc byte ptr [edx+1E]
//StrangerOfSwordCity.exe+14BC9E - 80 7A 1E 3C           - cmp byte ptr [edx+1E],3C
aobscan(battlerecordsstats_searchedAOB, FE 42 1F 80 7A 1F 3C 72 24)

alloc(battlerecordsstats_newmem, 2048, battlerecordsstats_searchedAOB)


battlerecordsstats_newmem:
cmp dword ptr [battlerecordsstats_update_enable], #0
je battlerecordsstats_update_exit
mov [battlerecordsstats_basepointer], edx
battlerecordsstats_update_exit:

cmp dword ptr [battlerecordsstats_set_enable], #0
je battlerecordsstats_set_exit
battlerecordsstats_set_exit:

cmp dword ptr [battlerecordsstats_divinitiesset_enable], #0
je battlerecordsstats_divinitiesset_exit
mov word ptr [edx+42], #1
