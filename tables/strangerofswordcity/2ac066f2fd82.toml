db FE 42 1F 80 7A 1F 3C
//inc byte ptr [edx+1F]
//cmp byte ptr [edx+1F],3C

unregistersymbol(battlerecordsstats_savedAOB)

dealloc(battlerecordsstats_newmem)"""

