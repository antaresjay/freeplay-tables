[[cheat]]
id = "playmakerglobals-base-address-scan-initialization-activate-this-first"
name = "PlayMakerGlobals Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlayMakerGlobals_basepointer)
registersymbol(PlayMakerGlobals_update_enable)

alloc(PlayMakerGlobals_basepointer, 8)
alloc(PlayMakerGlobals_update_enable, 4)


[DISABLE]
unregistersymbol(PlayMakerGlobals_basepointer)
unregistersymbol(PlayMakerGlobals_update_enable)

dealloc(PlayMakerGlobals_basepointer)
dealloc(PlayMakerGlobals_update_enable)"""

[[cheat]]
id = "playmakerglobals-base-address-scan-to-activate-view-stage-select-to-update-view-stage-select"
name = "PlayMakerGlobals Base Address Scan (To Activate: View Stage Select, To Update: View Stage Select)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayMakerGlobals_savedAOB)
label(PlayMakerGlobals_returnhere)
label(PlayMakerGlobals_originalcode)
label(PlayMakerGlobals_exit)

label(PlayMakerGlobals_update_exit)

registersymbol(PlayMakerGlobals_originalcode)
registersymbol(PlayMakerGlobals_savedAOB)

//053A42F8 - 49 BB 203E390500000000 - mov r11,0000000005393E20 : [EC8B4855]
//053A4302 - 41 FF D3              - call r11d
// HutongGames.PlayMaker:FsmVariables:get_GlobalVariables+15
//053A4305 - 48 83 C4 20           - add rsp,20
//053A4309 - 48 8B C8              - mov rcx,rax
//053A430C - 83 39 00              - cmp dword ptr [rcx],00
//053A430F - 48 8B 40 18           - mov rax,[rax+18]
//053A4313 - C9                    - leave
//053A4314 - C3                    - ret
aobscan(PlayMakerGlobals_searchedAOB, 48 83 C4 20 48 8B C8 83 39 00 48 8B 40 18 C9 C3)

alloc(PlayMakerGlobals_newmem, 2048, PlayMakerGlobals_searchedAOB)
alloc(PlayMakerGlobals_temp1, 8, PlayMakerGlobals_searchedAOB)
alloc(PlayMakerGlobals_temp2, 8, PlayMakerGlobals_searchedAOB)
alloc(PlayMakerGlobals_temp3, 8, PlayMakerGlobals_searchedAOB)
alloc(PlayMakerGlobals_temp4, 8, PlayMakerGlobals_searchedAOB)
alloc(PlayMakerGlobals_temp5, 8, PlayMakerGlobals_searchedAOB)


PlayMakerGlobals_newmem:
mov [PlayMakerGlobals_temp1], rax
mov [PlayMakerGlobals_temp2], rbx
mov [PlayMakerGlobals_temp3], rcx
mov [PlayMakerGlobals_temp4], rdx

cmp dword ptr [PlayMakerGlobals_update_enable], #0
je PlayMakerGlobals_update_exit
mov [PlayMakerGlobals_basepointer], rax
PlayMakerGlobals_update_exit:

mov rax, [PlayMakerGlobals_temp1]
mov rbx, [PlayMakerGlobals_temp2]
mov rcx, [PlayMakerGlobals_temp3]
mov rdx, [PlayMakerGlobals_temp4]


PlayMakerGlobals_originalcode:
readmem(PlayMakerGlobals_searchedAOB, 7)


PlayMakerGlobals_exit:
jmp PlayMakerGlobals_returnhere


PlayMakerGlobals_searchedAOB:
PlayMakerGlobals_savedAOB:
jmp PlayMakerGlobals_newmem
nop
nop
PlayMakerGlobals_returnhere:


[DISABLE]
PlayMakerGlobals_savedAOB:
readmem(PlayMakerGlobals_originalcode, 7)

unregistersymbol(PlayMakerGlobals_originalcode)
unregistersymbol(PlayMakerGlobals_savedAOB)

dealloc(PlayMakerGlobals_newmem)
dealloc(PlayMakerGlobals_temp1)
dealloc(PlayMakerGlobals_temp2)
dealloc(PlayMakerGlobals_temp3)
dealloc(PlayMakerGlobals_temp4)
dealloc(PlayMakerGlobals_temp5)"""

