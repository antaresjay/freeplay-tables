[[cheat]]
id = "shipstats-select-base-address-scan-to-activate-view-ship-stats-to-update-view-ship-stats"
name = "ShipStats Select Base Address Scan (To Activate: View Ship stats, To Update: View Ship stats)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(ShipStats_select_savedAOB)
label(ShipStats_select_returnhere)
label(ShipStats_select_originalcode)
label(ShipStats_select_exit)

label(ShipStats_select_update_exit)
label(ShipStats_select_set_exit)
label(ShipStats_select_hitpointsset_exit)
label(ShipStats_select_armorset_exit)
label(ShipStats_select_energyset_exit)

registersymbol(ShipStats_select_savedAOB)

//110E15C9 - 8B 45 08              - mov eax,[ebp+08]
//110E15CC - 8B 40 44              - mov eax,[eax+44]
// FleetView:MoreInfoFunc2+cef
//110E15CF - D9 80 D0000000        - fld dword ptr [eax+000000D0]
//110E15D5 - DD 9D 90FEFFFF        - fstp qword ptr [ebp-00000170]
//110E15DB - 83 EC 0C              - sub esp,0C
//110E15DE - 68 0C6F520B           - push 0B526F0C : [041DBE68]
aobscan(ShipStats_select_searchedAOB, D9 80 D0 00 00 00 DD 9D 90 FE FF FF)

alloc(ShipStats_select_newmem, 2048, ShipStats_select_searchedAOB)
alloc(ShipStats_select_temp1, 4, ShipStats_select_searchedAOB)
alloc(ShipStats_select_temp2, 4, ShipStats_select_searchedAOB)
alloc(ShipStats_select_temp3, 4, ShipStats_select_searchedAOB)


ShipStats_select_newmem:
mov [ShipStats_select_temp1], ebx
mov [ShipStats_select_temp2], ecx
mov [ShipStats_select_temp3], edx

cmp byte ptr [eax+1bd], #0
jne ShipStats_select_energyset_exit

cmp dword ptr [ShipStats_update_enable], #0
je ShipStats_select_update_exit
mov [ShipStats_basepointer], eax
ShipStats_select_update_exit:

cmp dword ptr [ShipStats_set_enable], #0
je ShipStats_select_set_exit
ShipStats_select_set_exit:

cmp dword ptr [ShipStats_hitpointsset_enable], #0
je ShipStats_select_hitpointsset_exit
mov edx, [eax+e0]
mov [eax+dc], edx
ShipStats_select_hitpointsset_exit:

cmp dword ptr [ShipStats_armorset_enable], #0
je ShipStats_select_armorset_exit
cmp dword ptr [eax+28], #0
je ShipStats_select_armorset_exit
mov ebx, [eax+28]
cmp dword ptr [eax+2c], #0
je ShipStats_select_armorset_exit
mov ecx, [eax+2c]
mov edx, [ecx+10]
mov [ebx+10], edx
mov edx, [ecx+14]
mov [ebx+14], edx
mov edx, [ecx+18]
mov [ebx+18], edx
mov edx, [ecx+1c]
mov [ebx+1c], edx
mov edx, [ecx+20]
mov [ebx+20], edx
mov edx, [ecx+24]
mov [ebx+24], edx
ShipStats_select_armorset_exit:

cmp dword ptr [ShipStats_energyset_enable], #0
je ShipStats_select_energyset_exit
mov edx, [eax+1a0]
mov [eax+1a4], edx
ShipStats_select_energyset_exit:

mov ebx, [ShipStats_select_temp1]
mov ecx, [ShipStats_select_temp2]
mov edx, [ShipStats_select_temp3]


ShipStats_select_originalcode:
db D9 80 D0 00 00 00
//fld dword ptr [eax+000000D0]


ShipStats_select_exit:
jmp ShipStats_select_returnhere


ShipStats_select_searchedAOB:
ShipStats_select_savedAOB:
jmp ShipStats_select_newmem
nop
ShipStats_select_returnhere:


[DISABLE]
ShipStats_select_savedAOB:
db D9 80 D0 00 00 00
//fld dword ptr [eax+000000D0]

unregistersymbol(ShipStats_select_savedAOB)

dealloc(ShipStats_select_newmem)
dealloc(ShipStats_select_temp1)
dealloc(ShipStats_select_temp2)
dealloc(ShipStats_select_temp3)"""

