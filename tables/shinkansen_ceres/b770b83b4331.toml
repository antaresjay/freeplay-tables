[[cheat]]
id = "fleetinventory-base-address-scan-to-activate-view-fleet-inventory-to-update-view-fleet-inventory"
name = "FleetInventory Base Address Scan (To Activate: View Fleet Inventory, To Update: View Fleet Inventory)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(FleetInventory_savedAOB)
label(FleetInventory_returnhere)
label(FleetInventory_originalcode)
label(FleetInventory_exit)

label(FleetInventory_update_exit)
label(FleetInventory_set_exit)
label(FleetInventory_solarisset_exit)
label(FleetInventory_ammoset_exit)
label(FleetInventory_dronesset_exit)

registersymbol(FleetInventory_savedAOB)

//0A5DD3CE - 3D B019300B           - cmp eax,0B3019B0 : [0B3019B0]
//0A5DD3D3 - 0F85 58080000         - jne 0A5DDC31
// FleetView:FleetMenu+1d9
//0A5DD3D9 - 8B 43 28              - mov eax,[ebx+28]
//0A5DD3DC - 89 85 30FFFFFF        - mov [ebp-000000D0],eax
//0A5DD3E2 - 83 EC 0C              - sub esp,0C
//0A5DD3E5 - 68 0CC80E03           - push 030EC80C : [0306AED0]
aobscan(FleetInventory_searchedAOB, 8B 43 28 89 85 30 FF FF FF)

alloc(FleetInventory_newmem, 2048, FleetInventory_searchedAOB)
alloc(FleetInventory_temp1, 4, FleetInventory_searchedAOB)


FleetInventory_newmem:
mov [FleetInventory_temp1], ecx

cmp dword ptr [FleetInventory_update_enable], #0
je FleetInventory_update_exit
mov [FleetInventory_basepointer], ebx
FleetInventory_update_exit:

cmp dword ptr [FleetInventory_set_enable], #0
je FleetInventory_set_exit
FleetInventory_set_exit:

cmp dword ptr [FleetInventory_solarisset_enable], #0
je FleetInventory_solarisset_exit
mov [ebx+28], #9999999
FleetInventory_solarisset_exit:

cmp dword ptr [FleetInventory_ammoset_enable], #0
je FleetInventory_ammoset_exit
mov [ebx+2c], #9999999
mov [ebx+30], #9999999
mov [ebx+34], #9999999
mov [ebx+38], #9999999
FleetInventory_ammoset_exit:

cmp dword ptr [FleetInventory_dronesset_enable], #0
je FleetInventory_dronesset_exit
cmp dword ptr [ebx+1c], #0
je FleetInventory_dronesset_exit
mov ecx, [ebx+1c]
mov [ecx+10], #9999999
mov [ecx+14], #9999999
mov [ecx+18], #9999999
mov [ecx+1c], #9999999
mov [ecx+20], #9999999
mov [ecx+24], #9999999
mov [ecx+28], #9999999
mov [ecx+2c], #9999999
FleetInventory_dronesset_exit:

mov ecx, [FleetInventory_temp1]


FleetInventory_originalcode:
db 89 85 30 FF FF FF
//mov [ebp-000000D0],eax


FleetInventory_exit:
jmp FleetInventory_returnhere


FleetInventory_searchedAOB + 3:
FleetInventory_savedAOB:
jmp FleetInventory_newmem
nop
FleetInventory_returnhere:


[DISABLE]
FleetInventory_savedAOB:
db 89 85 30 FF FF FF
//mov [ebp-000000D0],eax

unregistersymbol(FleetInventory_savedAOB)

dealloc(FleetInventory_newmem)"""

