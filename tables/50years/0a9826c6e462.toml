[[cheat]]
id = "get-resources"
name = "Get Resources"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]



aobscanmodule(gold,50years.exe,DD 45 00 5F DD 1E)
alloc(newmem,$1000)
label(return)

registersymbol(statE)
label(statE)
registersymbol(goldva)
label(goldva)
newmem:
cmp [statE],0
je @f
cmp [esp],000186E2
jne @f
fld qword ptr[goldva]
fstp qword ptr[ebp]

@@:
cmp [statE+4],0
je @f
cmp [esp],000186E3
jne @f
fldz
fstp qword ptr[ebp]



@@:
fld qword ptr [ebp+00]
pop edi
fstp qword ptr [esi]
jmp return

goldva:
dq (double)9999999
statE:
dd 0
gold:
jmp newmem
nop
return:
registersymbol(gold)

[DISABLE]
gold:
db DD 45 00 5F DD 1E
unregistersymbol(goldva)
unregistersymbol(gold)
dealloc(newmem)"""

