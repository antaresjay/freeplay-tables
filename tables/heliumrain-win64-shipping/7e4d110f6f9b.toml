  mov rbx,[submoney]
  imul rbx,(int)100
  sub rax,rbx
  pop rbx
  jmp code

addCr:
  push rbx
  mov rbx,[addmoney]
  imul rbx,(int)100
  add rax,rbx
  pop rbx
  jmp code

setCr:
  mov rax,[setmoney]
  imul rax,(int)100
  mov [setmoney],0
  jmp code

code:
  //sub rax,rdx
  mov [rcx+40],rax
  jmp return

axyd_money:
  jmp newmem
  nop
  nop
return:
registersymbol(axyd_money)

[DISABLE]

