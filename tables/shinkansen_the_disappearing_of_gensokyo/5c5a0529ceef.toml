[[cheat]]
id = "playersystem-base-address-scan-initialization-activate-this-first"
name = "PlayerSystem Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlayerSystem_basepointer)
registersymbol(PlayerSystem_update_enable)
registersymbol(PlayerSystem_set_enable)
registersymbol(PlayerSystem_hpset_enable)
registersymbol(PlayerSystem_shieldset_enable)
registersymbol(PlayerSystem_statsset_enable)
registersymbol(PlayerSystem_bombset_enable)

alloc(PlayerSystem_basepointer, 4)
alloc(PlayerSystem_update_enable, 4)
alloc(PlayerSystem_set_enable, 4)
alloc(PlayerSystem_hpset_enable, 4)
alloc(PlayerSystem_shieldset_enable, 4)
alloc(PlayerSystem_statsset_enable, 4)
alloc(PlayerSystem_bombset_enable, 4)


[DISABLE]
unregistersymbol(PlayerSystem_basepointer)
unregistersymbol(PlayerSystem_update_enable)
unregistersymbol(PlayerSystem_set_enable)
unregistersymbol(PlayerSystem_hpset_enable)
unregistersymbol(PlayerSystem_shieldset_enable)
unregistersymbol(PlayerSystem_statsset_enable)
unregistersymbol(PlayerSystem_bombset_enable)

dealloc(PlayerSystem_basepointer)
dealloc(PlayerSystem_update_enable)
dealloc(PlayerSystem_set_enable)
dealloc(PlayerSystem_hpset_enable)
dealloc(PlayerSystem_shieldset_enable)
dealloc(PlayerSystem_statsset_enable)
dealloc(PlayerSystem_bombset_enable)"""

[[cheat]]
id = "playersystem-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerSystem Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerSystem_savedAOB)
label(PlayerSystem_returnhere)
label(PlayerSystem_originalcode)
label(PlayerSystem_exit)

label(PlayerSystem_update_exit)
label(PlayerSystem_set_exit)
label(PlayerSystem_hpset_exit)
label(PlayerSystem_shieldset_exit)
label(PlayerSystem_statsset_exit)
label(PlayerSystem_bombset_exit)

registersymbol(PlayerSystem_savedAOB)

//08784573 - 83 EC 18              - sub esp,18
//08784576 - 8B 4D 08              - mov ecx,[ebp+08]
// PlayerSystem:FixedUpdate+9
//08784579 - 8B 41 30              - mov eax,[ecx+30]
//0878457C - 89 45 F0              - mov [ebp-10],eax
//0878457F - 89 45 EC              - mov [ebp-14],eax
//08784582 - 8D 45 F4              - lea eax,[ebp-0C]
//08784585 - 83 EC 08              - sub esp,08
//08784588 - 51                    - push ecx
//08784589 - 50                    - push eax
//0878458A - E8 49000000           - call 087845D8
//0878458F - 83 C4 0C              - add esp,0C
aobscan(PlayerSystem_searchedAOB, 8B 41 30 89 45 F0 89 45 EC 8D 45 F4 83 EC 08 51 50)

alloc(PlayerSystem_newmem, 2048, PlayerSystem_searchedAOB)
alloc(PlayerSystem_temp1, 4, PlayerSystem_searchedAOB)
alloc(PlayerSystem_temp2, 4, PlayerSystem_searchedAOB)
alloc(PlayerSystem_temp3, 4, PlayerSystem_searchedAOB)
alloc(PlayerSystem_temp4, 4, PlayerSystem_searchedAOB)
alloc(PlayerSystem_temp5, 4, PlayerSystem_searchedAOB)


PlayerSystem_newmem:
mov [PlayerSystem_temp1], eax
mov [PlayerSystem_temp2], ebx
mov [PlayerSystem_temp3], ecx
mov [PlayerSystem_temp4], edx

cmp dword ptr [PlayerSystem_update_enable], #0
je PlayerSystem_update_exit
mov [PlayerSystem_basepointer], ecx
PlayerSystem_update_exit:

cmp dword ptr [PlayerSystem_set_enable], #0
je PlayerSystem_set_exit
PlayerSystem_set_exit:

cmp dword ptr [PlayerSystem_hpset_enable], #0
je PlayerSystem_hpset_exit
mov ebx, [ecx+18]
test ebx, ebx
je PlayerSystem_hpset_exit
fld [ebx+40]
fstp [ebx+50]
PlayerSystem_hpset_exit:

cmp dword ptr [PlayerSystem_shieldset_enable], #0
je PlayerSystem_shieldset_exit
mov ebx, [ecx+18]
test ebx, ebx
je PlayerSystem_shieldset_exit
fld [ebx+68]
fstp [ebx+78]
PlayerSystem_shieldset_exit:

cmp dword ptr [PlayerSystem_statsset_enable], #0
je PlayerSystem_statsset_exit
mov ebx, [ecx+18]
test ebx, ebx
je PlayerSystem_statsset_exit
mov [ebx+94], (float)9999
mov [ebx+98], (float)9999
mov [ebx+9c], (float)9999
mov [ebx+b8], (float)9999
mov [ebx+c0], (float)9999
PlayerSystem_statsset_exit:

cmp dword ptr [PlayerSystem_bombset_enable], #0
je PlayerSystem_bombset_exit
mov ebx, [ecx+44]
mov [ecx+48], ebx,
PlayerSystem_bombset_exit:

mov eax, [PlayerSystem_temp1]
mov ebx, [PlayerSystem_temp2]
mov ecx, [PlayerSystem_temp3]
mov edx, [PlayerSystem_temp4]


PlayerSystem_originalcode:
db 8B 41 30 89 45 F0
//mov eax,[ecx+30]
//mov [ebp-10],eax


PlayerSystem_exit:
jmp PlayerSystem_returnhere


PlayerSystem_searchedAOB:
PlayerSystem_savedAOB:
jmp PlayerSystem_newmem
nop
PlayerSystem_returnhere:


[DISABLE]
PlayerSystem_savedAOB:
db 8B 41 30 89 45 F0
//mov eax,[ecx+30]
//mov [ebp-10],eax

unregistersymbol(PlayerSystem_savedAOB)

dealloc(PlayerSystem_newmem)
dealloc(PlayerSystem_temp1)
dealloc(PlayerSystem_temp2)
dealloc(PlayerSystem_temp3)
dealloc(PlayerSystem_temp4)
dealloc(PlayerSystem_temp5)"""

