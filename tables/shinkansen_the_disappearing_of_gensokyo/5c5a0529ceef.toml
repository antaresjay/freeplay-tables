source = """
[ENABLE]
label(GameData_savedAOB)
label(GameData_returnhere)
label(GameData_originalcode)
label(GameData_exit)

label(GameData_update_exit)
label(GameData_set_exit)
label(GameData_bluepointsset_exit)

registersymbol(GameData_savedAOB)

//087E2953 - 83 EC 08              - sub esp,08
//087E2956 - E8 8540B8FC           - call 053669E0
// PS4:PlayerData:GetPoint+b
//087E295B - 8B 40 30              - mov eax,[eax+30]
//087E295E - 83 EC 04              - sub esp,04
//087E2961 - 68 3F420F00           - push 000F423F
//087E2966 - 6A 00                 - push 00
//087E2968 - 50                    - push eax
//087E2969 - E8 BAB4AAFC           - call 0528DE28
//087E296E - 83 C4 10              - add esp,10
//087E2971 - C9                    - leave
//087E2972 - C3                    - ret
aobscan(GameData_searchedAOB, 8B 40 30 83 EC 04 * * * * * 6A 00 50 * * * * * 83 C4 10 C9 C3)

alloc(GameData_newmem, 2048, GameData_searchedAOB)
alloc(GameData_temp1, 4, GameData_searchedAOB)
alloc(GameData_temp2, 4, GameData_searchedAOB)
alloc(GameData_temp3, 4, GameData_searchedAOB)
alloc(GameData_temp4, 4, GameData_searchedAOB)
alloc(GameData_temp5, 4, GameData_searchedAOB)


