mov [GameData_temp1], eax
mov [GameData_temp2], ebx
mov [GameData_temp3], ecx
mov [GameData_temp4], edx

cmp dword ptr [GameData_update_enable], #0
je GameData_update_exit
mov [GameData_basepointer], eax
GameData_update_exit:

cmp dword ptr [GameData_set_enable], #0
je GameData_set_exit
GameData_set_exit:

cmp dword ptr [GameData_bluepointsset_enable], #0
je GameData_bluepointsset_exit
mov [eax+30], #999999
GameData_bluepointsset_exit:

mov eax, [GameData_temp1]
mov ebx, [GameData_temp2]
mov ecx, [GameData_temp3]
mov edx, [GameData_temp4]


GameData_originalcode:
db 8B 40 30 83 EC 04
//mov eax,[eax+30]
//sub esp,04


GameData_exit:
jmp GameData_returnhere


GameData_searchedAOB:
GameData_savedAOB:
jmp GameData_newmem
nop
GameData_returnhere:


[DISABLE]
GameData_savedAOB:
db 8B 40 30 83 EC 04
//mov eax,[eax+30]
//sub esp,04

unregistersymbol(GameData_savedAOB)

dealloc(GameData_newmem)
dealloc(GameData_temp1)
dealloc(GameData_temp2)
dealloc(GameData_temp3)
dealloc(GameData_temp4)
dealloc(GameData_temp5)"""

