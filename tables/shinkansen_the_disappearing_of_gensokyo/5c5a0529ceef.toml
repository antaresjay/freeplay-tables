[[cheat]]
id = "gamedata-base-address-scan-to-activate-view-fortress-blue-points-to-update-view-fortress-blue-points"
name = "GameData Base Address Scan (To Activate: View Fortress Blue Points, To Update: View Fortress Blue Points)"
category = "misc"
description = ""
