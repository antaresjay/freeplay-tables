[[cheat]]
id = "max-vitals"
name = "Max Vitals"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanregion(maxgauge,SpaceCraft.PlayerGauge:AddToCurrentValue,SpaceCraft.PlayerGauge:AddToCurrentValue+200,F3 0F 11 6E 50)
registersymbol(maxgauge)
alloc(maxgaugeMem,$100,maxgauge)

maxgaugeMem:
fld [rsi+58]
fstp [rsi+50]
jmp maxgauge+5

maxgauge:
jmp maxgaugeMem
 
[DISABLE]
maxgauge:
db F3 0F 11 6E 50
unregistersymbol(maxgauge)
dealloc(maxgaugeMem)"""

[[cheat]]
