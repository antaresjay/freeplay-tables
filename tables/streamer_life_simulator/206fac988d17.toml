[[cheat]]
id = "grab-player-data"
name = "Grab Player Data"
category = "player"
description = ""
hint = ""
type = "script"
source = """
//Send@FearlessRevolution|Sintrix
[ENABLE]
aobscanregion(playerinfo,PlayerStats:Update,PlayerStats:Update+22,48 8B F1 F3 0F 10 86 D0 00 00 00)
alloc(newmem,$1000,playerinfo)
registersymbol(playerdata)
label(playerdata)
label(code)
label(return)

newmem:
mov [playerdata],rcx

code:
  mov rsi,rcx
  movss xmm0,[rsi+000000D0]
  jmp return

playerdata:
dq 0

playerinfo:
  jmp newmem
  nop 6
return:
registersymbol(playerinfo)


[DISABLE]

playerinfo:
  db 48 8B F1 F3 0F 10 86 D0 00 00 00

unregistersymbol(*)
dealloc(*)"""

