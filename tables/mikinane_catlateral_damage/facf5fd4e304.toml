id = "time-freeze-it"
name = "Time - Freeze it"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[Enable]
alloc(newmem,100)
label(returnhere)
label(exit)
label(Time)
registersymbol(Time)
aobscan(aob1, D9 9F 88 01 00 00 D9 87 88 01 00 00 33 C0 50 DB 04 24 D9 1C 24 D9 04 24 83 C4 04 DF F1 DD D8)
globalalloc(_pTime,4)
newmem:
mov [_pTime],edi
fld dword ptr [edi+00000188]

exit:
jmp returnhere

aob1:
Time:
jmp newmem
nop
returnhere:

[Disable]
dealloc(newmem)
unregistersymbol(Time)
