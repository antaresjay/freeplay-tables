[[cheat]]
id = "enable-movement-modifier"
name = "Enable Movement Modifier"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
define(address,DaggerfallWorkshop.Game.PlayerMotor:UpdateSpeed+33)
define(bytes,F3 0F 11 AE A4 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,DaggerfallWorkshop.Game.PlayerMotor:UpdateSpeed+33)
registersymbol(Speed)
label(code return Speed)

newmem:

code:
  mulss xmm5,[Speed]
  movss [rsi+000000A4],xmm5
  jmp return

Speed:
dd (float)3

address:
  jmp newmem
  nop 3
return:

[DISABLE]

address:
  db bytes


  unregistersymbol(*)
  dealloc(*)"""

