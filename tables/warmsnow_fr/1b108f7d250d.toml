[[cheat]]
id = "health"
name = "Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(LecVida_,F3 0F 10 86 48 02 00 00)
alloc(newmem,$100,LecVida_)
alloc(berserk,1)
berserk:
  db 0
registersymbol(berserk)
label(godMode)
registersymbol(godMode)

label(code)
label(return)

newmem:
  cmp [godMode],1
  jne code

  mov [rsi+00000064],(float)999

  mov [rsi+00000248],(float)999
  cmp [berserk],1
  jne code

  mov [rsi+00000070],(float)999
  mov [rsi+00000074],(float)999

  mov [rsi+000000E4],(float)999
  mov [rsi+000000E8],(float)999
  mov [rsi+000000F0],(float)999
  mov [rsi+000000F4],(float)999

  mov [rsi+0000008C],(float)999
  mov [rsi+00000090],(float)999
  mov [rsi+00000094],(float)999

  mov [rsi+0000011C],(float)999
  mov [rsi+00000120],(float)999

  mov [rsi+00000128],(float)999
  mov [rsi+0000012C],(float)999


code:
  movss xmm0,[rsi+00000248]
  jmp return

godMode:
  db 0

berserk:
  db 0

LecVida_:
  jmp newmem
  nop 3
return:
registersymbol(LecVida_)

[DISABLE]

LecVida_:
  db F3 0F 10 86 48 02 00 00

unregistersymbol(*)
dealloc(*)"""

