[[cheat]]
id = "item-tooltip-pointer"
name = "Item Tooltip Pointer"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
//ES2-Win64-Shipping.UItem::GetCategoryID
[ENABLE]
aobscanmodule(itemTooltip,$process,48 81 ?? ?? ?? 00 00 48 8B ?? 48 8B ?? ?? 48 8D ?? ?? ?? E8)
alloc(newmem,$1000,itemTooltip)

label(itemTooltipPtr)
label(itemTooltipBkp)
label(return)

newmem:
  mov rax,itemTooltipPtr
  mov [rax],rcx
itemTooltipBkp:
  readmem(itemTooltip+0E,5)
  jmp return

align 10
itemTooltipPtr:
  dq 0

itemTooltip+0E:
  jmp newmem
return:
registersymbol(itemTooltip)
registersymbol(itemTooltipBkp)
registersymbol(itemTooltipPtr)

[DISABLE]
itemTooltip+0E:
  readmem(itemTooltipBkp,5)
unregistersymbol(itemTooltip)
unregistersymbol(itemTooltipBkp)
unregistersymbol(itemTooltipPtr)
dealloc(newmem)

