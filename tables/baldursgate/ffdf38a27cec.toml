[[cheat]]
id = "infinite-mana"
name = "Infinite Mana"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(get_playerMana,$process,F3 0F 11 * * BC 00 00 00 F3)
alloc(newmem,$1000,get_playerMana)
label(return)

newmem:
movss xmm0,[rcx+rdx+000000C0]
movss [rcx+rdx+000000BC],xmm0
jmp return

get_playerMana:
  jmp newmem
  nop 4
return:
registersymbol(get_playerMana)

[DISABLE]
get_playerMana:
movss [rcx+rdx+000000BC],xmm0

unregistersymbol(get_playerMana)
dealloc(newmem)"""
