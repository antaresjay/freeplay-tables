_ExitGM1:
 pop ecx

 mov [ebp+18],edi               // Original code
 mov eax,[ecx]                  // Original code
 jmp _BackGM1                   // Back to main code

//========================================= 1.03
_MonFullEnergy:
 push ebx

 cmp dword ptr [iEnableMSE],0
