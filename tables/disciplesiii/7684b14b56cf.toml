label(_MonArmyMP1)
label(_BackMA1)
label(_ExitMA1)
label(_MonPlayerHero)
label(_BackMPH)
label(_ExitMPH)
label(_MonPlayerFaction)
label(_MonPF00)
label(_BackMPF)
label(_ExitMPF)
label(_MonGameStart)
label(_BackMGS)
label(_ExitMGS)
label(_MonPlayerInv)
label(_BackMPI)
label(_ExitMPI)
label(iEnableMPR)
label(iEnableMAM)
label(iEnableGMD)
label(iEnableMXP)
label(iEnableMPI)
label(iMinXP)
label(iMinRes)
label(aFaction)
label(pGold)
label(pHero)
label(pUnit)

//=========================================
// Registering Symbols
registersymbol(MyCode)
registersymbol(iEnableMPR)
registersymbol(iEnableMAM)
registersymbol(iEnableGMD)
registersymbol(iEnableMXP)
registersymbol(iEnableMPI)
registersymbol(iMinXP)
registersymbol(iMinRes)
