{
===========================================
 Game Title    : Disciples III Ressurection
 Game Version  : 1.09
 Game Sponsor  : Myself
 Process Name  : DisciplesIII.exe
 Script Version: 1.0
 CE Version    : 6.3
 Release date  : 01-Nov-2013
 Author        : Recifense
 History:
 04-Nov-2011: First Release (v1.07)
 01-Nov-2013: Release for v1.09 (steam)
 Features:
 - Minimum Resources:
   - Gold
   - Stone
   - Mira
   - Life mana
   - Infernal mana
   - Grove mana
   - Runstone mana
   - Death mana
 - Movement Points
 - God Mode
 - Minimum XP
 - Minimum Inventory Items
 - pointers
===========================================
}

//=========================================
// Definitions
define(LUDO,"DisciplesIII.exe")

//=========================================
// Constants used in the script (that can be changed)
define(ctMMRS,#26300)  // Minimum Resources
define(ctMMXP,#3630)   // Minimum XP

[ENABLE]
//=========================================
//Look for hack points (cheating entry points)

AOBScan(aobMPRS,c6 84 24 70 02 00 00 02 e8 ?? ?? ?? ?? 8d 8c 24 28 01 00 00)
AOBScan(aobMAMP,89 81 a0 bb 00 00 b0 01 c3 32 c0 c3 cc cc ?? ?? ?? ?? ?? ??)
AOBScan(aobGDMD,85 c0 89 56 18 ?? ?? 01 28 85 ed 0f 84 ?? ?? ?? ?? 8b 07 55)
AOBScan(aobMAM1,89 8e a0 bb 00 00 8b 0d ?? ?? ?? ?? 8b 01 8d 96 64 ba 00 00)
AOBScan(aobMPHO,8b 47 18 85 c0 53 b3 01 ?? ?? 83 bf b4 bb 00 00 01 ?? ?? 32 db 8b 07)
AOBScan(aobMPFN,8b 83 a0 bb 00 00 8b 16 55 50 68 ?? ?? ?? ?? 8b ce ff 52 04)
AOBScan(aobMGST,8a 81 68 01 00 00 84 c0 ?? ?? 8b df 8d b3 f4 08 00 00 8d bd)
aobscan(aobMPIY,8b 43 08 83 f8 01 ?? ?? b8 01 00 00 00 50 68 ?? ?? ?? ?? 8d)

//=========================================
alloc(MyCode,4096,LUDO)
//=========================================
// Declaration section
label(_MonPlayerRes)
label(_MonPR00)
label(_MonPR01)
label(_MonPR02)
label(_MonPR03)
label(_MonPR04)
label(_MonPR05)
label(_MonPR06)
label(_BackMPR)
