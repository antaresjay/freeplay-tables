[[cheat]]
id = "inf-hp"
name = "Inf HP"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Happy's Humble Burger Farm.exe
  Version: 1.16.4.1
  Date   : 2021-12-05
  Author : Glowmoss

  This script gives the player 6/7 hp due to the way happy works.
  If you had 7 all the time you can't escape happy at all.
}

[ENABLE]

define(Hp,playerHudScript:RemoveHealth+cc)
assert(Hp,FF C9)
//aobscan(Hp,FF C9 89 88 A0 00 00 00)
alloc(newmem,$1000,Hp)

label(code)
label(return)
label(damage)

newmem:

code:
  dec ecx
  cmp [rax+A0],6
  jle damage
  mov [rax+A0],ecx
  jmp return

damage:
  mov ecx,6
  mov [rax+A0],ecx
  jmp return

Hp:
  jmp newmem
  db 90 90 90
return:
registersymbol(Hp)

[DISABLE]

Hp:
  db FF C9 89 88 A0 00 00 00

unregistersymbol(Hp)
dealloc(newmem)"""

