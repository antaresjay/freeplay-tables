[[cheat]]
id = "get-farmer-pointers"
name = "Get Farmer Pointers"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
\tGame\t: Stardew Valley.exe
\tVersion\t: 1.5.1
\tDate\t: 2021-01-02
\tAuthor\t: aSwedishMagyar
}
define(getPlayer,StardewValley.Farmer::get__money)
[ENABLE]
assert(getPlayer,55 8B EC 8B D1 8B 82 5C)
registersymbol(playerBase)
alloc(newgetPlayer,100,getPlayer)
label(codegetPlayer)
label(returngetPlayer)
label(playerBase)
newgetPlayer:
  mov [playerBase],ecx
codegetPlayer:
  push ebp
  mov ebp,esp
  mov edx,ecx
  jmp returngetPlayer
playerBase:
  dd 0
getPlayer:
  jmp newgetPlayer
returngetPlayer:

[DISABLE]
getPlayer:
  db 55 8B EC 8B D1

unregistersymbol(playerBase)
dealloc(newgetPlayer)"""

