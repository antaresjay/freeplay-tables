je MainPlayerCmpt_combatset_exit
mov [rbx+80], (float)9999999
mov [rbx+84], (float)9999999
mov [rbx+8c], (float)9999999
MainPlayerCmpt_combatset_exit:

cmp dword ptr [MainPlayerCmpt_resourceset_enable], #0
je MainPlayerCmpt_resourceset_exit
mov [rbx+7c], (float)99
mov [rbx+14c], (float)9999999
mov [rbx+150], (float)99
MainPlayerCmpt_resourceset_exit:

cmp dword ptr [MainPlayerCmpt_mobilityset_enable], #0
je MainPlayerCmpt_mobilityset_exit
mov [rsi+11c], (float)9999999
mov rbx, [rsi+48]
test rbx, rbx
je MainPlayerCmpt_resourceset_exit
mov rcx, [rbx+90]
test rcx, rcx
je MainPlayerCmpt_resourceset_exit
mov [rcx+38], (float)24
mov rcx, [rbx+a8]
test rcx, rcx
je MainPlayerCmpt_resourceset_exit
mov [rcx+38], (float)23
MainPlayerCmpt_mobilityset_exit:

cmp dword ptr [MainPlayerCmpt_moneyset_enable], #0
je MainPlayerCmpt_moneyset_exit
mov rbx, [rsi+78]
test rbx, rbx
je MainPlayerCmpt_moneyset_exit
mov rcx, [rbx+28]
test rcx, rcx
je MainPlayerCmpt_moneyset_exit
mov [rbx+18], #9999999
MainPlayerCmpt_moneyset_exit:

mov rax, [MainPlayerCmpt_temp1]
mov rbx, [MainPlayerCmpt_temp2]
mov rcx, [MainPlayerCmpt_temp3]
mov rdx, [MainPlayerCmpt_temp4]


MainPlayerCmpt_originalcode:
