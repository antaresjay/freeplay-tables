[[cheat]]
id = "mainplayercmpt-base-address-scan-to-activate-change-camera-direction-to-update-change-camera-direction"
name = "MainPlayerCmpt Base Address Scan (To Activate: Change Camera Direction, To Update: Change Camera Direction)"
category = "player"
