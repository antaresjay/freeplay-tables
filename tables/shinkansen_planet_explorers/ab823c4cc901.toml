test rbx, rbx
je MainPlayerCmpt_resourceset_exit
mov rbx, [rbx+40]
test rbx, rbx
je MainPlayerCmpt_resourceset_exit
mov rbx, [rbx+28]
test rbx, rbx
je MainPlayerCmpt_resourceset_exit

mov rbx, [rbx+28]
