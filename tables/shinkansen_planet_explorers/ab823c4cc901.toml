//6743CE38 - 89 85 50FFFFFF        - mov [rbp-000000B0],eax
// Pathea:MainPlayerCmpt:UpdateCamDirection+1e
//6743CE3E - 0FB6 86 48010000      - movzx eax,byte ptr [rsi+00000148]
//6743CE45 - 85 C0                 - test eax,eax
//6743CE47 - 75 36                 - jne 6743CE7F
//6743CE49 - 0FB6 86 F0000000      - movzx eax,byte ptr [rsi+000000F0]
//6743CE50 - 85 C0                 - test eax,eax
aobscan(MainPlayerCmpt_searchedAOB, 0F B6 86 48 01 00 00 85 C0 75 36)

alloc(MainPlayerCmpt_newmem, 2048, MainPlayerCmpt_searchedAOB)
