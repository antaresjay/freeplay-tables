[[cheat]]
id = "player-parameters-ctrl-numpad-1"
name = "Player Parameters (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Karous.exe
// Author            : ndck76
// Executable Version: 2022.3.60.25597
// Game Version      : Build 21599042
// Script Date       : 2026-01-25


[ENABLE]

aobscanregion(sp1,RS34.KarousRemaster.GAME:game_ControlScreen,RS34.KarousRemaster.GAME:game_ControlScreen+3000,480FBF98xxxx000048xxxxxxxxxxxx48xxxxxxxxxxxx83xxxx75xx48xxxxxxxxxxxx89xxxxxxxxxx66xxxxxxxxxxxxxx48xxxxxx83xxxxxx) //RS34.KarousRemaster.GAME:game_ControlScreen+1663
alloc(newmem,$1000,sp1)
alloc(data,8)
alloc(sp1bkp,8)
registersymbol(data)
registersymbol(sp1)
registersymbol(sp1bkp)
label(code)
label(return)

sp1bkp:
  readmem(sp1,8)

newmem:
  mov [data],rax

code:
  readmem(sp1,8)
  jmp return

sp1:
  jmp newmem
  nop 3
return:

[DISABLE]

sp1:
  readmem(sp1bkp,8)

unregistersymbol(*)
dealloc(*)"""

