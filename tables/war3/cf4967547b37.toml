[[cheat]]
id = "hook-player"
name = "Hook Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc( HookPlayer, 256, Game.dll )
label( Player )
registersymbol( Player )
label( ResourcesToggle )
registersymbol( ResourcesToggle )
label( MapToggle )
registersymbol( MapToggle )
label( bMap )
label( HookPlayer_next )
label( HookPlayer_exit )
label( back )

HookPlayer:
mov [Player],eax
cmp [ResourcesToggle],1
jne short HookPlayer_next
push eax
push ecx
push edx
mov ecx,eax
push 0
push 0
push 0
push 1388
call Game.dll+23DB10
mov eax,[Player]
push 0
push 0
push 0
push 1388
mov ecx,eax
call Game.dll+23DB50
pop edx
pop ecx
pop eax
mov [ResourcesToggle],0
HookPlayer_next:
cmp [MapToggle],1
jne short HookPlayer_exit
push eax
push ecx
push edx
mov ebx,[bMap]
xor bl,1
mov [bMap],ebx
push 1
mov eax,[Game.dll+BE4238]
mov esi,[eax+34]
mov ecx,esi
push ebx
call Game.dll+231D90
push ebx
mov ecx,esi
call Game.dll+231D00
mov ecx,ebx
call Game.dll+76F4A0
xor edx,edx
lea ecx,[edx+01]
call Game.dll+34F3A0
test eax,eax
je short @f
mov edx,[eax+3BC]
mov [edx+1C4],1
mov ecx,[eax+3BC]
call Game.dll+36C240
@@:
pop edx
pop ecx
pop eax
mov [MapToggle],0
HookPlayer_exit:
movzx ecx,byte ptr [eax+30]
mov eax,[eax+34]
jmp back

Player:
dd 0
ResourcesToggle:
dd 0
MapToggle:
dd 0
bMap:
dd 1

Game.dll+365619:
jmp HookPlayer
db 90 90
back:

[DISABLE]

Game.dll+365619:
movzx ecx,byte ptr [eax+30]
mov eax,[eax+34]

unregistersymbol( MapToggle )
unregistersymbol( ResourcesToggle )
unregistersymbol( Player )
dealloc( HookPlayer )"""

