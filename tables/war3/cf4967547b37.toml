[[cheat]]
id = "god-mode"
name = "God Mode"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc( GodMode, 256, Game.dll )
label( Damage )
registersymbol( Damage )
label( back )

GodMode:
mov ecx,[ebx]
test ecx,ecx
je back+50
call Game.dll+668890
mov ecx,edi
mov esi,[eax+268]
call Game.dll+668890
mov eax,[eax+268]
test esi,esi
je short @f
test eax,eax
jne back+50
mov eax,0
jmp back+4D
@@:
test eax,eax
je back+50
fld [ebp+C]
fld [Damage]
fmul st(0),st(1)
fstp [ebp+C]
fstp st(0)
@@:
jmp back+50

Damage:
dd (float)12.0

Game.dll+67E0C6:
jmp GodMode
back:

[DISABLE]

Game.dll+67E0C6:
mov eax,[eax+10]
mov eax,[eax]

unregistersymbol( Damage )
dealloc( GodMode )"""

