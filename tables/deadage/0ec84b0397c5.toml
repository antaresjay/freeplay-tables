[[cheat]]
id = "resource-plus"
name = "Resource plus"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : DeadAge.exe
  Version: 1.7 STEAM
  Date   : 2024-12-15
  Author : Oyyzj

  This script does increase your resources every day
}

[ENABLE]
aobscanregion(ResourcePlus,ZombieCamp:UpdateRessource+35,ZombieCamp:UpdateRessource+77,8B 55 10 03 CA 89 08) // should be unique
alloc(newmem,$100)

label(code)
label(return)
label(rResourcePlus)
newmem:
  mov edx,f
code:
  readmem(ResourcePlus+3,2)
  jmp return
rResourcePlus:
  readmem(ResourcePlus,5)
ResourcePlus:
  jmp newmem
return:
//
registersymbol(ResourcePlus)
registersymbol(rResourcePlus)
[DISABLE]

ResourcePlus:
  readmem(rResourcePlus,5)
unregistersymbol(*)
dealloc(*)"""

