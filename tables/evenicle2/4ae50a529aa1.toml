[[cheat]]
id = "general"
name = "[General]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Script,Evenicle2.exe,8B 43 10 8B 2C 07) // should be unique
alloc(newmem,$1000)

alloc(AlexStats,4)
alloc(AlexBP,4)
alloc(YuragiStats,4)
alloc(YuragiBP,4)
alloc(KanoStats,4)
alloc(KanoBP,4)
alloc(PlatinaStats,4)
alloc(PlatinaBP,4)
alloc(CharlotteStats,4)
alloc(CharlotteBP,4)
alloc(Gold,4)
alloc(MP,4)
alloc(Encounter,4)


label(code)
label(return)

registersymbol(AlexStats)
registersymbol(AlexBP)
registersymbol(YuragiStats)
registersymbol(YuragiBP)
registersymbol(KanoStats)
registersymbol(KanoBP)
registersymbol(PlatinaStats)
registersymbol(PlatinaBP)
registersymbol(CharlotteStats)
registersymbol(CharlotteBP)
registersymbol(Gold)
registersymbol(MP)
registersymbol(Encounter)


AlexStats:
AlexBP:
YuragiStats:
YuragiBP:
KanoStats:
KanoBP:
PlatinaStats:
PlatinaBP:
CharlotteStats:
CharlotteBP:
Gold:
MP:
Encounter:


newmem:
  cmp edx,C3E //Alex Stats
  je AlexStatsCheck
  cmp edx,C3F //Alex BP
  je AlexBPCheck
  cmp edx,C48 //Yuragi Stats
  je YuragiStatsCheck
  cmp edx,C49 //Yuragi BP
  je YuragiBPCheck
  cmp edx,C43 //Kano Stats
  je KanoStatsCheck
  cmp edx,C44 //Kano BP
  je KanoBPCheck
  cmp edx,C4D //Platina Stats
  je PlatinaStatsCheck
  cmp edx,C4E //Platina BP
  je PlatinaBPCheck
  cmp edx,C52 //Charlotte Stats
  je CharlotteStatsCheck
  cmp edx,C53 //Charlotte BP
  je CharlotteBPCheck
  cmp edx,954 // Gold check
  je goldcheck
  cmp edx,955 // MP check
  je mpcheck
  cmp edx,1C8C // Encounter check
  je encheck
  jmp code

AlexStatsCheck:
 push ecx
 mov ecx,[ebx+10]
 mov [AlexStats],ecx
 pop ecx
 jmp code

AlexBPCheck:
 push ecx
 mov ecx,[ebx+10]
 mov [AlexBP],ecx
 pop ecx
 jmp code

YuragiStatsCheck:
 push ecx
 mov ecx,[ebx+10]
 mov [YuragiStats],ecx
 pop ecx
 jmp code

YuragiBPCheck:
 push ecx
 mov ecx,[ebx+10]
 mov [YuragiBP],ecx
 pop ecx
 jmp code

KanoStatsCheck:
 push ecx
 mov ecx,[ebx+10]
 mov [KanoStats],ecx
 pop ecx
 jmp code

KanoBPCheck:
 push ecx
 mov ecx,[ebx+10]
 mov [KanoBP],ecx
 pop ecx
 jmp code

PlatinaStatsCheck:
 push ecx
 mov ecx,[ebx+10]
 mov [PlatinaStats],ecx
 pop ecx
 jmp code

PlatinaBPCheck:
 push ecx
 mov ecx,[ebx+10]
 mov [PlatinaBP],ecx
 pop ecx
 jmp code

CharlotteStatsCheck:
 push ecx
 mov ecx,[ebx+10]
 mov [CharlotteStats],ecx
 pop ecx
 jmp code

CharlotteBPCheck:
 push ecx
 mov ecx,[ebx+10]
 mov [CharlotteBP],ecx
 pop ecx
 jmp code

goldcheck:
 push ecx
 mov ecx,[ebx+10]
 mov [Gold],ecx
 pop ecx
 jmp code

mpcheck:
 push ecx
 mov ecx,[ebx+10]
 mov [MP],ecx
 pop ecx
 jmp code

encheck:
 push ecx
 mov ecx,[ebx+10]
 mov [Encounter],ecx
 pop ecx
 jmp code

code:
  mov eax,[ebx+10]
  mov ebp,[edi+eax]
  jmp return

Script:
  jmp newmem
  nop
return:
registersymbol(Script)

[DISABLE]
Script:
  db 8B 43 10 8B 2C 07
unregistersymbol(AlexStats)
unregistersymbol(AlexBP)
unregistersymbol(YuragiStats)
unregistersymbol(YuragiBP)
unregistersymbol(KanoStats)
unregistersymbol(KanoBP)
unregistersymbol(PlatinaStats)
unregistersymbol(PlatinaBP)
unregistersymbol(CharlotteStats)
unregistersymbol(CharlotteBP)
unregistersymbol(Gold)
unregistersymbol(MP)
unregistersymbol(Encounter)
unregistersymbol(MainScript)
dealloc(AlexStats)
dealloc(AlexBP)
dealloc(YuragiStats)
dealloc(YuragiBP)
dealloc(KanoStats)
dealloc(KanoBP)
dealloc(PlatinaStats)
dealloc(PlatinaBP)
dealloc(CharlotteStats)
dealloc(CharlotteBP)
dealloc(Gold)
dealloc(MP)
dealloc(Encounter)
dealloc(newmem)"""

