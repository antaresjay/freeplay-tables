type = "script"
source = """
define(address,u823.Monster.get_Size)
define(bytes,48 89 5C 24 08)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,u823.Monster.get_Size)
registersymbol(GetMamon)
label(code return)

newmem:
mov [GetMamon],rdx

code:
  mov [rsp+08],rbx
  jmp return

GetMamon:
dw

address:
  jmp newmem
return:

[DISABLE]

address:
  db bytes

 unregistersymbol(*)
dealloc(*)"""
