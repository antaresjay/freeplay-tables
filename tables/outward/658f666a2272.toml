registersymbol(minQty)
registersymbol(maxQty)
registersymbol(dropChance)
label(codeitemDropChance)
label(returnitemDropChance)
label(minQty)
label(maxQty)
label(dropChance)

newitemDropChance:
  push rbx
  mov rbx,[minQty]
  mov [rsi+20],rbx
  mov rbx,[maxQty]
  mov [rsi+24],rbx
  mov rbx,[dropChance]
  mov [rsi+28],rbx
  pop rbx
codeitemDropChance:
  movsxd  rcx,dword ptr [rsi+28]
  movsxd  rax,dword ptr [rsi+2C]
  jmp returnitemDropChance

minQty:
  dd (int)1
maxQty:
  dd (int)10
dropChance:
  dd (int)100

itemDropChance:
  jmp newitemDropChance
  nop 3
returnitemDropChance:

[DISABLE]

itemDropChance:
  db 48 63 4E 28 48 63 46 2C

