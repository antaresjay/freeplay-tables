[[cheat]]
id = "no-negative-buffs-only-stops-from-being-activated"
name = "No Negative Buffs (only stops from being activated)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
\tGame\t: Outward.exe
\tVersion\t:
\tDate\t: 2020-11-08
\tAuthor\t: aSwedishMagyar
}
define(statEffectActivate,StatusEffect:Activate)
define(stackNegBuff,StatusEffect:AddStack)
[ENABLE]
assert(statEffectActivate,55 48 8B EC 48 81 EC 80 00 00 00)
assert(stackNegBuff,55)
alloc(newstatEffectActivate,100,statEffectActivate)
label(codestatEffectActivate)
label(returnstatEffectActivate)
stackNegBuff:
  ret
newstatEffectActivate:
  cmp byte ptr [rcx+1B6],1
  jne codestatEffectActivate
  ret
codestatEffectActivate:
  push rbp
  mov rbp,rsp
  sub rsp,00000080
  jmp returnstatEffectActivate

statEffectActivate:
  jmp newstatEffectActivate
  nop 6
returnstatEffectActivate:

[DISABLE]
stackNegBuff:
  db 55
statEffectActivate:
  db 55 48 8B EC 48 81 EC 80 00 00 00

dealloc(newstatEffectActivate)"""

