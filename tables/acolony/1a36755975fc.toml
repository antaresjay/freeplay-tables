type = "script"
source = """
{ Game   : AColony.exe
  Version: 
  Date   : 2023-01-24
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanregion(pData_1,NpcMainManager:RecheckItemValues,NpcMainManager:RecheckItemValues+19e,F3 0F 10 48 24 F3 0F 5A C9 48) // should be unique
alloc(newmem,$1000,pData_1)

label(code)
label(return)

newmem:
  mov [rax+20],(float)10000       //MaxPerSlot
  mov [rax+24],(float)0           //ValueNewGame

code:
  movss xmm1,[rax+24]
  jmp return

pData_1:
  jmp newmem
return:
registersymbol(pData_1)

[DISABLE]

pData_1:
  db F3 0F 10 48 24

unregistersymbol(pData_1)
dealloc(newmem)"""

