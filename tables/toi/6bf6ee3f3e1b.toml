source = """
{ Game   : TOI.exe
  Version: 
  Date   : 2024-05-08
  Author : Saug

  This script does blah blah blah
}

[ENABLE]

aobscan(Arrow,8B 80 FC 00 00 00 EB 2C) // should be unique
alloc(newmem,$100)

label(code)
label(return)

newmem:
  mov [eax+000000FC],#20
code:
