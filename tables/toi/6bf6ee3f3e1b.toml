  jmp return2

tile:
  jmp newmem2
  nop
return2:
registersymbol(tile)

aobscan(Bullet,8B 80 08 01 00 00 EB 02 33 C0 8D 65 FC 8D 65 FC 5F C9 C3 00 00 00 00) // should be unique
alloc(newmem3,$100)

label(code3)
label(return3)

newmem3:
  mov [eax+00000108],8
code3:
  mov eax,[eax+00000108]
  jmp return3

Bullet:
  jmp newmem3
  nop
return3:
