define(getCheated, getCheatedFind + 7)
alloc(newmem,$200,valueListSetBool)

label(valueListSetBoolBackUp)
label(valueListSetBoolReturn)
label(getCheatedBackUp)
label(getCheatedReturn)
label(cheatedStringPtr)

newmem:
  cmp rdx,[cheatedStringPtr]
  jne valueListSetBoolBackUp
  xor r8, r8 // value = 0
valueListSetBoolBackUp:
  readMem(valueListSetBool, 7)
  jmp valueListSetBoolReturn
getCheatedBackUp:
  readMem(getCheated, 6)
  mov [cheatedStringPtr], rdx
  jmp getCheatedReturn
cheatedStringPtr:
  dq 0

valueListSetBool:
  jmp newmem
  nop 2
valueListSetBoolReturn:

getCheated:
  jmp getCheatedBackUp
  nop
getCheatedReturn:

registerSymbol(valueListSetBool)
registerSymbol(valueListSetBoolBackUp)
registerSymbol(getCheated)
registerSymbol(getCheatedBackUp)
registerSymbol(cheatedStringPtr)

[DISABLE]
valueListSetBool:
  readMem(valueListSetBoolBackUp, 7)
getCheated:
  readMem(getCheatedBackUp, 6)

dealloc(newmem)
unregisterSymbol(valueListSetBool)
unregisterSymbol(valueListSetBoolBackUp)
unregisterSymbol(getCheated)
unregisterSymbol(getCheatedBackUp)
unregisterSymbol(cheatedStringPtr)

