[[cheat]]
id = "playercharacter-base-address-scan-initialization-activate-this-first"
name = "PlayerCharacter Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlayerCharacter_basepointer)
registersymbol(PlayerCharacter_update_enable)
registersymbol(PlayerCharacter_immortalset_enable)
registersymbol(PlayerCharacter_healthset_enable)
registersymbol(PlayerCharacter_consciousnessset_enable)
registersymbol(PlayerCharacter_staminaset_enable)
registersymbol(PlayerCharacter_speedset_enable)
registersymbol(PlayerCharacter_cloakset_enable)
registersymbol(PlayerCharacter_inventoryset_enable)

alloc(PlayerCharacter_basepointer, 4)
alloc(PlayerCharacter_update_enable, 4)
alloc(PlayerCharacter_immortalset_enable, 4)
alloc(PlayerCharacter_healthset_enable, 4)
alloc(PlayerCharacter_consciousnessset_enable, 4)
alloc(PlayerCharacter_staminaset_enable, 4)
alloc(PlayerCharacter_speedset_enable, 4)
alloc(PlayerCharacter_cloakset_enable, 4)
alloc(PlayerCharacter_inventoryset_enable, 4)


[DISABLE]
unregistersymbol(PlayerCharacter_basepointer)
unregistersymbol(PlayerCharacter_update_enable)
unregistersymbol(PlayerCharacter_immortalset_enable)
unregistersymbol(PlayerCharacter_healthset_enable)
unregistersymbol(PlayerCharacter_consciousnessset_enable)
unregistersymbol(PlayerCharacter_staminaset_enable)
unregistersymbol(PlayerCharacter_speedset_enable)
unregistersymbol(PlayerCharacter_cloakset_enable)
unregistersymbol(PlayerCharacter_inventoryset_enable)

dealloc(PlayerCharacter_basepointer)
dealloc(PlayerCharacter_update_enable)
dealloc(PlayerCharacter_immortalset_enable)
dealloc(PlayerCharacter_healthset_enable)
dealloc(PlayerCharacter_consciousnessset_enable)
dealloc(PlayerCharacter_staminaset_enable)
dealloc(PlayerCharacter_speedset_enable)
dealloc(PlayerCharacter_cloakset_enable)
dealloc(PlayerCharacter_inventoryset_enable)"""

[[cheat]]
id = "playercharacter-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerCharacter Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerCharacter_savedAOB)
label(PlayerCharacter_returnhere)
label(PlayerCharacter_originalcode)
label(PlayerCharacter_exit)

label(PlayerCharacter_update_exit)
label(PlayerCharacter_immortalset_exit)
label(PlayerCharacter_healthset_exit)
label(PlayerCharacter_consciousnessset_exit)
label(PlayerCharacter_staminaset_exit)
label(PlayerCharacter_speedset_exit)
label(PlayerCharacter_cloakset_exit)
label(PlayerCharacter_inventoryset_exit)
label(PlayerCharacter_inventoryset_entry)
label(PlayerCharacter_inventoryset_continue)

registersymbol(PlayerCharacter_originalcode)
registersymbol(PlayerCharacter_savedAOB)

//1278B644 - 83 EC 04              - sub esp,04
//1278B647 - 8B 7D 08              - mov edi,[ebp+08]
// PlayerCharacter:Update+a
//1278B64A - 0FB6 47 79            - movzx eax,byte ptr [edi+79]
//1278B64E - 85 C0                 - test eax,eax
//1278B650 - 0F84 44000000         - je 1278B69A
//1278B656 - 8B 47 3C              - mov eax,[edi+3C]
//1278B659 - 83 EC 0C              - sub esp,0C
//1278B65C - 50                    - push eax
aobscan(PlayerCharacter_searchedAOB, 0F B6 47 79 85 C0 * * * * * * 8B 47 3C)

alloc(PlayerCharacter_newmem, 2048, PlayerCharacter_searchedAOB)
alloc(PlayerCharacter_temp1, 4, PlayerCharacter_searchedAOB)
alloc(PlayerCharacter_temp2, 4, PlayerCharacter_searchedAOB)
alloc(PlayerCharacter_temp3, 4, PlayerCharacter_searchedAOB)
alloc(PlayerCharacter_temp4, 4, PlayerCharacter_searchedAOB)
alloc(PlayerCharacter_temp5, 4, PlayerCharacter_searchedAOB)


PlayerCharacter_newmem:
mov [PlayerCharacter_temp1], eax
mov [PlayerCharacter_temp2], ebx
mov [PlayerCharacter_temp3], ecx
mov [PlayerCharacter_temp4], edx

cmp dword ptr [PlayerCharacter_update_enable], #0
je PlayerCharacter_update_exit
mov [PlayerCharacter_basepointer], edi
PlayerCharacter_update_exit:

cmp dword ptr [PlayerCharacter_immortalset_enable], #0
je PlayerCharacter_immortalset_exit
mov ebx, [edi+18]
test ebx, ebx
je PlayerCharacter_immortalset_exit
mov byte ptr [ebx+64], #1
PlayerCharacter_immortalset_exit:

cmp dword ptr [PlayerCharacter_healthset_enable], #0
je PlayerCharacter_healthset_exit
mov ebx, [edi+18]
test ebx, ebx
je PlayerCharacter_healthset_exit
fld [ebx+5c]
fstp [ebx+78]
PlayerCharacter_healthset_exit:

cmp dword ptr [PlayerCharacter_consciousnessset_enable], #0
je PlayerCharacter_consciousnessset_exit
mov ebx, [edi+18]
test ebx, ebx
je PlayerCharacter_consciousnessset_exit
fld [ebx+60]
fstp [ebx+7c]
PlayerCharacter_consciousnessset_exit:

cmp dword ptr [PlayerCharacter_staminaset_enable], #0
je PlayerCharacter_staminaset_exit
mov ebx, [edi+40]
test ebx, ebx
je PlayerCharacter_staminaset_exit
fld [ebx+80]
fstp [ebx+78]
PlayerCharacter_staminaset_exit:

cmp dword ptr [PlayerCharacter_speedset_enable], #0
je PlayerCharacter_speedset_exit
mov ebx, [edi+40]
test ebx, ebx
je PlayerCharacter_speedset_exit
mov [ebx+70], (float)15
mov [ebx+74], (float)24
PlayerCharacter_speedset_exit:

cmp dword ptr [PlayerCharacter_cloakset_enable], #0
je PlayerCharacter_cloakset_exit
mov ebx, [edi+28]
test ebx, ebx
je PlayerCharacter_cloakset_exit
mov byte ptr [ebx+10], #1
PlayerCharacter_cloakset_exit:

cmp dword ptr [PlayerCharacter_inventoryset_enable], #0
je PlayerCharacter_inventoryset_exit
mov edx, 0
mov ebx, [edi+1c]
test ebx, ebx
je PlayerCharacter_inventoryset_exit
mov ebx, [ebx+40]
test ebx, ebx
je PlayerCharacter_inventoryset_exit
mov ecx, [ebx+c]
test ecx, ecx
je PlayerCharacter_inventoryset_exit
mov [PlayerCharacter_temp5], ecx
PlayerCharacter_inventoryset_entry:
mov eax, [ebx+edx*4+10]
test eax, eax
je PlayerCharacter_inventoryset_continue
mov [eax+6c], #99
mov ecx, [eax+14]
test ecx, ecx
je PlayerCharacter_inventoryset_continue
// Jerrycan
cmp [ecx+16], #6619210
jne PlayerCharacter_inventoryset_continue
fld [eax+d4]
fstp [eax+dc]
//mov [eax+d8], (float)15
PlayerCharacter_inventoryset_continue:
inc edx
cmp [PlayerCharacter_temp5], edx
je PlayerCharacter_inventoryset_exit
jmp PlayerCharacter_inventoryset_entry
PlayerCharacter_inventoryset_exit:

mov eax, [PlayerCharacter_temp1]
mov ebx, [PlayerCharacter_temp2]
mov ecx, [PlayerCharacter_temp3]
mov edx, [PlayerCharacter_temp4]


PlayerCharacter_originalcode:
readmem(PlayerCharacter_searchedAOB, 6)


PlayerCharacter_exit:
jmp PlayerCharacter_returnhere


PlayerCharacter_searchedAOB:
PlayerCharacter_savedAOB:
jmp PlayerCharacter_newmem
nop
PlayerCharacter_returnhere:


[DISABLE]
PlayerCharacter_savedAOB:
readmem(PlayerCharacter_originalcode, 6)

unregistersymbol(PlayerCharacter_originalcode)
unregistersymbol(PlayerCharacter_savedAOB)

dealloc(PlayerCharacter_newmem)
dealloc(PlayerCharacter_temp1)
dealloc(PlayerCharacter_temp2)
dealloc(PlayerCharacter_temp3)
dealloc(PlayerCharacter_temp4)
dealloc(PlayerCharacter_temp5)"""

