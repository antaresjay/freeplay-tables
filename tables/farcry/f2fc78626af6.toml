[[cheat]]
id = "no-recoil"
name = "No Recoil"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(recoilcd,CryGame.dll,D8 9E FC 02 00 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  mov [esi+000002FC], 0
  fcomp dword ptr [esi+000002FC]
  jmp return

recoilcd:
  jmp newmem
  nop
return:
registersymbol(recoilcd)

[DISABLE]

recoilcd:
  db D8 9E FC 02 00 00

unregistersymbol(recoilcd)
dealloc(newmem)"""
