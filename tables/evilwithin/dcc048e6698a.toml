[[cheat]]
id = "unlimited-health-and-easy-kills-script"
name = "Unlimited Health and Easy Kills Script"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(healthohk,evilwithin.exe,F3 0F 11 89 C4 08 00 00)
alloc(newmem,64,"evilwithin.exe"+886E18)
registersymbol(healthohkk)
label(healthohkk)
registersymbol(HealthFlag)
label(HealthFlag)
registersymbol(OHKFlag)
label(OHKFlag)
label(isHEALTH)
label(isOHK)
label(code)
label(return)

newmem:
isHEALTH:
  push rax
  mov rax, qword ptr [rcx+08]
  cmp dword ptr [rax],(int)2036427888
  jne isOHK
  cmp [HealthFlag],1
  jne code
  movss xmm1,[rcx+000008B8]
  jmp code
isOHK:
  cmp [OHKFlag],1
  jne code
  subss xmm1,xmm1
code:
  pop rax
  movss [rcx+000008C4],xmm1
  jmp return

HealthFlag:
dd 00

OHKFlag:
dd 00

healthohk:
healthohkk:
  jmp newmem
  nop
  nop
  nop
return:


[DISABLE]
healthohkk:
  db F3 0F 11 89 C4 08 00 00
unregistersymbol(healthohkk)
dealloc(newmem)"""

