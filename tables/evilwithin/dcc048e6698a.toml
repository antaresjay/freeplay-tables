[[cheat]]
id = "get-pointers-script-enter-inventory"
name = "Get Pointers Script (enter inventory)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(inventory,evilwithin.exe,75 04 41 03 59 10)
alloc(newmem,64,"evilwithin.exe"+956C97)
registersymbol(inventoryy)
label(inventoryy)
registersymbol(upgrades)
label(upgrades)
registersymbol(matches)
label(matches)
registersymbol(parts)
label(parts)
registersymbol(syringes)
label(syringes)
registersymbol(grenades)
label(grenades)
registersymbol(ammos)
label(ammos)
label(isMATCHES)
label(isPARTS)
label(isUPGRADES)
label(isSYRINGES)
label(isGRENADES)
label(isAMMO)
label(code)
label(return)

newmem:
  jne return
  push rax
  mov rax, qword ptr [r9+08]
isMATCHES:
  cmp dword ptr [rax+114],#1668571501
  jne isPARTS
  mov [matches],r9
  jmp code
isPARTS:
  cmp dword ptr [rax+114],#1885434484
  jne isUPGRADES
  mov [parts],r9
  jmp code
isUPGRADES:
  cmp dword ptr [rax+114],#1919381621
  jne isSYRINGES
  mov [upgrades],r9
  jmp code
isSYRINGES:
  cmp dword ptr [rax+114],#1769109875
  jne isGRENADES
  mov [syringes],r9
  jmp code
isGRENADES:
  cmp dword ptr [rax+114],#1852142183
  jne isAMMO
  mov [grenades],r9
  jmp code
isAMMO:
  cmp dword ptr [rax+114],#1684955464
  jne code
  mov [ammos],r9
  jmp code
code:
  pop rax
  add ebx,[r9+10]
  jmp return

matches:
dq 0

parts:
dq 0

upgrades:
dq 0

syringes:
dq 0

grenades:
dq 0

ammos:
dq 0

inventory:
inventoryy:
  jmp newmem
  nop
return:

[DISABLE]
inventoryy:
  db 75 04 41 03 59 10
unregistersymbol(inventoryy)
dealloc(newmem)"""

