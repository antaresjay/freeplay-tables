  mov eax,[eax]
  fld dword ptr [ebp+C]
  fstp dword ptr [eax+98]
  mov esp,ebp
  pop ebp
  ret

[DISABLE]
godmode:
  db D9 59 30 89 41 04

unregistersymbol(godmode)
dealloc(check_target)
dealloc(activate_godmode)
