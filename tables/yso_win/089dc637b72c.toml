check_target:
  push eax
  push ebx
  mov eax,0x0068C8B0
  lea ebx,[ecx+30]
  cmp eax,ebx
  jne original_code
  mov eax,dword ptr [eax+8]
  push eax
  push yso_win.exe+002C2ECC
  call activate_godmode
  add esp,8
  pop ebx
  pop eax
  mov [ecx+04],eax
  jmp return

