[[cheat]]
id = "shield-invunerable-usually"
name = "Shield Invunerable [usually]"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(ShieldAOB,D9 9E 60 01 00 00 83)
alloc(newmem,2048)
label(returnhere)
label(CStart)
registerSymbol(CStart)
label(exit)

newmem:
nop

exit:
jmp returnhere

ShieldAOB:
CStart:
jmp newmem
nop
returnhere:


[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
CStart:
fstp dword ptr [esi+00000160]
//Alt: db D9 9E 60 01 00 00 83"""

