[[cheat]]
id = "profile-data"
name = "Profile Data"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : WallWorld.exe
  Version: 
  Date   : 2023-04-06
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanregion(pData_ProfileData,ProfileEntity:AdjustDust,ProfileEntity:AdjustDust+100,48 63 47 5C 03 C6) // should be unique
alloc(newmem,$1000,pData_ProfileData)

alloc(pBase_ProfileData,8)
registersymbol(pBase_ProfileData)

label(code)
label(return)

pBase_ProfileData:
dd

newmem:

code:
  mov [pBase_ProfileData],rdi
  movsxd  rax,dword ptr [rdi+5C]
  add eax,esi
  jmp return

pData_ProfileData:
  jmp newmem
  nop
return:
registersymbol(pData_ProfileData pBase_ProfileData)

[DISABLE]

pData_ProfileData:
  db 48 63 47 5C 03 C6

unregistersymbol(*)
dealloc(*)"""

