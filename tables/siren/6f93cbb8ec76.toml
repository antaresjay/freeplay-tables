[ENABLE]

// ============================================================
// Upgrade Anywhere (Wilderness)
// ============================================================
// Hook HeroArmyController.IsBootCamp() to always return true.
// This tricks UpdateUI into thinking the hero is at a BootCamp,
// enabling the upgrade button anywhere on the world map.
//
// How it works:
//   IsBootCamp() checks: this.m_tileObject != null && HasTag("boot_camp")
//   We make it always return true, bypassing the location check.
//   - In wilderness (m_base == null): button shows + upgrade works
//   - In base without building: button still hidden (hasBuildingForUnit check)
//   - In base with building: original behavior (already works)
//
// Only affects human player UI; AI doesn't use this codepath.
