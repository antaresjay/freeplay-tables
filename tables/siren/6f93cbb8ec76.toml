GetAvailability+0B: 48 89 75 D0          - mov [rbp-30],rsi
// ---------- DONE INJECTING  ----------
}"""

[[cheat]]
id = "force-join-neutral-army"
name = "Force Join (Neutral Army)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Silence of the Siren
  Version: 
  Date   : 2026-07-04
  Author : CannonFodder

  前提: 需先在 CE 菜单中执行 Mono -> Activate mono features
  
  功能: 热键控制特定中立军队强制加入
        1. 激活此脚本
        2. 在 CE 中手动添加 hotkey 指向 FORCEJOIN_FLAG，设为 1 byte, value=1
        3. 走到目标中立军队面前，按下热键
        4. 右键点击中立军队交互 → 直接弹出加入确认窗口
        Flag 会在每次触发后自动清零，无需手动重置
}

[ENABLE]

aobscanregion(WANTS_JOIN_INJECT, Hosaf.Hero:WantsToJoin+00, Hosaf.Hero:WantsToJoin+200, 48 8B F2 33 C0 48 89 45 B8)
// should be unique

alloc(newmem,$1000,WANTS_JOIN_INJECT)
alloc(FORCEJOIN_FLAG, 4)

registersymbol(WANTS_JOIN_INJECT)
registersymbol(FORCEJOIN_FLAG)

label(returnhere)

FORCEJOIN_FLAG:
  dd 0

newmem:
  cmp byte ptr [FORCEJOIN_FLAG], 1
  jne @f
  mov rax, [rdi+30]
  mov byte ptr [rax+69], 1
  mov byte ptr [FORCEJOIN_FLAG], 0
@@:
  mov rsi, rdx
  xor eax, eax
  jmp returnhere

WANTS_JOIN_INJECT:
  jmp newmem
returnhere:

[DISABLE]

WANTS_JOIN_INJECT:
  db 48 8B F2 33 C0

unregistersymbol(WANTS_JOIN_INJECT)
unregistersymbol(FORCEJOIN_FLAG)
dealloc(newmem)
dealloc(FORCEJOIN_FLAG)

{
C# Source: Hosaf.Hero.WantsToJoin(Hero otherHero)
this = neutral army, otherHero = approaching hero (typically player's hero)

bool WantsToJoin(Hero otherHero) (
  // this.m_state.m_forceJoin check
  if (this.m_state.m_forceJoin) return true;     // our injection sets this to true

  // IsNeutralArmy check
  if (!this.IsNeutralArmy()) return false;

  // ...rest of the method (checks components, army strength, stubbornness)...
)

JIT prologue:
  mov rdi, rcx                  // rdi = this (neutral army Hero)
  mov rsi, rdx                  // rsi = otherHero (player)     ← INJECTION POINT
  xor eax, eax                                                 ← 5 bytes replaced

  mov rax, [rdi+30]             // this.m_state (HeroPersistentData*)
  movzx eax, byte [rax+69]      // m_forceJoin (bool at offset +0x69)
  test eax, eax
  je +0A                        // if (!m_forceJoin) jump

We set m_forceJoin = true BEFORE the original check runs.
Flag auto-clears after each use. User binds a hotkey to set FORCEJOIN_FLAG=1.

Usage:
  1. Activate script
  2. Right-click FORCEJOIN_FLAG in address list → Set/Change hotkeys
  3. Bind a key → Action: "Toggle value" or "Set value to: 1"
  4. In game: approach neutral army → press hotkey → right-click interact → join!
}"""

