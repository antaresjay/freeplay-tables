  mov rax, [rax+30]
  mov rax, [rax+10]
  cmp dword ptr [rax+10], 0
  jne pop_not_human
  pop rdx
  // Human: return AVAILABLE(0)
  xor eax, eax
  ret

pop_not_human:
  pop rdx

not_human:
  push rbp
  mov rbp, rsp
  sub rsp, A0
  jmp returnhere

GAA_INJECT:
