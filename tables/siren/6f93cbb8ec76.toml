// ============================================================================
// Script: Remove Max Skill Count Limit - LearnSkill (Human Only)
// ID: #676
// Target: Hosaf.Hero.LearnSkill
//
// Description:
//   Bypasses the TWEAKABLE_MAX_SKILL_COUNT (default: 8) check that
//   prevents a hero from learning more than 8 skills.  Only affects
//   the human player's heroes.  AI heroes and neutral creatures are
//   unaffected.
//
// Human-Only Check (5-layer pointer chain):
//   Hero [+30] -> HeroPersistentData
//     [+18] -> EntityIDPointer<Player>
//       [+10] -> Player
//         [+30] -> PlayerPersistentData
//           [+10] -> PlayerSource
//             [+10] -> m_playerSourceType (0 = HUMAN)
//
// Injection Point:
//   LearnSkill+66:  48 8B 45 E0    mov rax,[rbp-20]   ; m_skills.Count
//   LearnSkill+6A:  3B C1          cmp eax,ecx        ; vs TWEAKABLE
//   LearnSkill+6C:  7C 22          jl  +90            ; continue if less
//
// Patch Behaviour:
//   Human:       Replace cmp+jl with unconditional jmp to +90
//   Non-Human:   Execute the original cmp+jl normally
//
// In r15 at injection point: Hero* (this) - valid for human check.
// ============================================================================

[ENABLE]

aobscanregion(LS_INJECT, Hosaf.Hero:LearnSkill+60, Hosaf.Hero:LearnSkill+80, 48 8B 45 E0 3B C1 7C 22)

alloc(newmem,$1000,LS_INJECT)

registersymbol(LS_INJECT)

label(returnhere)

newmem:
  push rax                               // save rax (holds m_skills.Count)
  mov rax, [r15+30]                      // Hero.m_state -> HeroPersistentData*
  mov rax, [rax+18]                      // HeroPersistentData.m_entityIdPtr
  mov rax, [rax+10]                      // EntityIDPointer -> Player*
  test rax, rax                          // Player* == null? (neutral / no owner)
  jz not_human                           // no owner -> non-human
  mov rax, [rax+30]                      // PlayerPersistentData.m_state -> PlayerState*
  mov rax, [rax+10]                      // PlayerState -> PlayerSource*
  cmp dword ptr [rax+10], 0              // m_playerSourceType == HUMAN(0)?
  jne not_human                          // AI / remote -> non-human

  pop rax                                // restore rax
  jmp LS_INJECT+2A                       // jump to +90 (learning logic)

not_human:
  pop rax                                // restore rax (m_skills.Count)
  mov rax, [rbp-20]                      // original: load m_skills.Count
  cmp eax, ecx                           // original: compare with limit
  jl LS_INJECT+2A                        // original: Count < limit -> continue
  jmp LS_INJECT+8                        // original: Count >= limit -> error+return

LS_INJECT:
  jmp newmem
  nop
  nop
  nop
returnhere:

[DISABLE]

LS_INJECT:
  db 48 8B 45 E0 3B C1 7C 22

unregistersymbol(LS_INJECT)
dealloc(newmem)

// ============================================================================
// C# DECOMPILE
// Hosaf.Hero.LearnSkill(GameDBHeroSkill heroSkill, bool randomAbility):
//   if (this.GetHeroInfo().m_skills.Count >= TWEAKABLE_MAX_SKILL_COUNT)
//     { Debug.LogError(...); return; }
//   // actual learning logic ...
// ============================================================================

{
// ORIGINAL CODE - INJECTION POINT: Hosaf.Hero:LearnSkill+66
LearnSkill+60: 48 8B 45 E0  - mov rax,[rbp-20]   // load m_skills.Count
// ---------- INJECTING HERE ----------
LearnSkill+6A: 3B C1        - cmp eax,ecx        // vs TWEAKABLE limit
LearnSkill+6C: 7C 22        - jl LearnSkill+90   // if Count < limit, continue
// ---------- DONE INJECTING  ----------
LearnSkill+6E: ...          - ...                // log error + return
LearnSkill+90: ...          - ...                // learning logic begins
