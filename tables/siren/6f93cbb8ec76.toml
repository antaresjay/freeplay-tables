[[cheat]]
id = "unlimited-base-building-player-only"
name = "Unlimited Base Building (Player Only)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

// ============================================================
// Silence of the Siren - 无限基地建造 (仅玩家)
// ============================================================
// 功能: 玩家每回合可在基地无限建造建筑，AI 不受影响
// 原理: Hook Hosaf.Base:GetBuildingAvailability() 方法
//   注入点在 GetOwner() 返回后 (GBA+0x163)
//   通过纯 mov+cmp 指针链判断 PlayerSourceType
//   人类玩家(0) -> 清除 NOT_AVAILABLE_THIS_ROUND 标志位(bit2)
//   AI(1) -> 保留原始限制
// ============================================================

// AOB 匹配 GetOwner() 返回后的 14 字节指令 (GBA+0x163)
//   4C 8B F8       = mov r15,rax        ; 保存 Player* 到 r15
//   48 8B 46 38    = mov rax,[rsi+38]    ; 加载 building 数据
//   48 8B D5       = mov rdx,rbp        ; 设置参数
//   48 83 C2 A8    = add rdx,-58        ; 调整参数
aobscanregion(GBA_INJECT, Hosaf.Base:GetBuildingAvailability, Hosaf.Base:GetBuildingAvailability+2000, 4C 8B F8 48 8B 46 38 48 8B D5 48 83 C2 A8)

alloc(newmem, 256, GBA_INJECT)

label(returnhere)

registersymbol(GBA_INJECT)

newmem:
  // === 复制原始 14 字节指令 ===
  mov r15, rax              // r15 = Player* (GetOwner 返回值)
  mov rax, [rsi+38]         // 原始: 加载 building 相关数据
  mov rdx, rbp              // 原始
  add rdx, -58              // 原始

  // === 纯 mov+cmp 判断人类玩家，无 call ===
  // 指针链:
  //   Player.m_state (+0x30)              -> PlayerPersistentData*
  //   PlayerPersistentData.m_playerSource (+0x10) -> PlayerSource*
  //   PlayerSource.m_playerSourceType (+0x10)      -> int (0=HUMAN, 1=AI)
  push rax                  // 保护 rax (后续 mov rcx,rax 需要 [rsi+38] 的值)
  mov rax, [r15+30]         // rax = Player.m_state (PlayerPersistentData*)
  mov rax, [rax+10]         // rax = m_playerSource (PlayerSource*)
  cmp dword ptr [rax+10], 0 // m_playerSourceType == HUMAN(0)?
  pop rax                   // 恢复 rax = [rsi+38]
  jne returnhere            // AI(1) -> 跳过，保留 NOT_AVAILABLE_THIS_ROUND 标志
  and r13d, FFFFFFFB        // 人类 -> 清除 bit2 (NOT_AVAILABLE_THIS_ROUND = 0x04)
  jmp returnhere            // 返回原始代码

// 注入点: 覆盖 14 字节 (5 字节 jmp + 9 字节 nop)
GBA_INJECT:
  jmp newmem
  nop
  nop
  nop
  nop
  nop
  nop
  nop
  nop
  nop
returnhere:

[DISABLE]

// 恢复原始 14 字节指令
GBA_INJECT:
  db 4C 8B F8 48 8B 46 38 48 8B D5 48 83 C2 A8

unregistersymbol(GBA_INJECT)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: Hosaf.Base:GetBuildingAvailability+163

Hosaf.Base:GetBuildingAvailability+139: 48 8B 47 30                    - mov rax,[rdi+30]
Hosaf.Base:GetBuildingAvailability+13D: 0F B6 80 B9 00 00 00           - movzx eax,byte ptr [rax+000000B9]
