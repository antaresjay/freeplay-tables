Hosaf.Base:GetBuildingAvailability+14F: 48 8D AD 00 00 00 00           - lea rbp,[rbp+00000000]
Hosaf.Base:GetBuildingAvailability+156: 49 BB E0 2F B2 EB 67 02 00 00 - mov r11,Hosaf.Base:GetOwner
Hosaf.Base:GetBuildingAvailability+160: 41 FF D3                       - call r11
// ---------- INJECTING HERE ----------
Hosaf.Base:GetBuildingAvailability+163: 4C 8B F8                       - mov r15,rax
Hosaf.Base:GetBuildingAvailability+166: 48 8B 46 38                    - mov rax,[rsi+38]
Hosaf.Base:GetBuildingAvailability+169: 48 8B D5                       - mov rdx,rbp
Hosaf.Base:GetBuildingAvailability+16C: 48 83 C2 A8                    - add rdx,-58
// ---------- DONE INJECTING  ----------
Hosaf.Base:GetBuildingAvailability+16F: 48 8B C8                       - mov rcx,rax
Hosaf.Base:GetBuildingAvailability+172: 83 38 00                       - cmp dword ptr [rax],00
