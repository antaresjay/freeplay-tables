[[cheat]]
id = "academy-ability-purchase-cost-no-resource"
name = "Academy Ability Purchase Cost No Resource"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Silence of the Siren
  Version: 
  Date   : 2026-07-04
  Author : CannonFodder

  前提: 需先在 CE 菜单中执行 Mono -> Activate mono features
  
  功能: 学院购买技能不消耗资源（仅影响人类玩家在学院面板点击购买）
}

[ENABLE]

aobscanregion(ACADEMY_FREE_INJECT, AcademyBuyAbilitiesController:<Start>b__12_0+00, AcademyBuyAbilitiesController:<Start>b__12_0+400, 4D 63 47 18 41 F7 D8 44 0F AF C7 48 8B C8)
// should be unique

alloc(newmem,$1000,ACADEMY_FREE_INJECT)

label(returnhere)

newmem:
  xor r8d,r8d
  jmp returnhere

ACADEMY_FREE_INJECT+4:
  jmp newmem
  nop
  nop
returnhere:
registersymbol(ACADEMY_FREE_INJECT)

[DISABLE]

ACADEMY_FREE_INJECT+4:
  db 41 F7 D8 44 0F AF C7

unregistersymbol(ACADEMY_FREE_INJECT)
dealloc(newmem)

{
C# Source: AcademyBuyAbilitiesController.<Start>b__12_0 (buy button onClick lambda)

Inside the buy button callback, inside the foreach over ResourceCosts:
  r8d = -cost.Value * num  (the resource amount to deduct)
  Then: GainResource(resource, r8) -- deducts resources

We zero r8d to make the purchase cost nothing.
Only triggers when human player clicks the Buy button in Academy UI.
Does NOT affect AI, neutral players, or other resource operations.

// ---------- INJECTING HERE ----------
  movsxd r8,dword ptr [r15+18]   ; load cost.Value (int32 from GameDBResourceValue)
  neg r8d                         ; negate: r8d = -Value
  imul r8d, edi                   ; multiply by num: r8d = -Value * num
// ---------- DONE INJECTING  ------
  mov rcx, rax                    ; rcx = PlayerResources* (this for GainResource)
  cmp dword ptr [rax], 00         ; null check
  nop 3
  mov r11, Hosaf.PlayerResources:GainResource
  call r11                        ; GainResource(resource, r8)
}"""

