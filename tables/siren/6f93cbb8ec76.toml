[[cheat]]
id = "bugged-learn-all-abilities-on-level-up-human-only"
name = "(bugged)Learn All Abilities On Level Up (Human Only)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
// v26: Entry hook → human → overwrite [rcx+38]=items[0] (rcx=this, BEFORE prologue)
// → then normal prologue → jmp returnhere. Game does everything else naturally.
// Key insight: write [rcx+38] while rcx still has "this", before prologue saves rsi.
[ENABLE]

aobscanregion(AAS_INJECT, DialogAbilitySelectionPanel:ApplyAbilitySelection+00, DialogAbilitySelectionPanel:ApplyAbilitySelection+200, 55 48 8B EC 48 83 EC 30 48 89 75 F8 48 8B F1 48 8B 46 28)

alloc(newmem,$1000,AAS_INJECT)
registersymbol(AAS_INJECT)
label(returnhere)

newmem:
  push rax
  mov rax,[rcx+28]
  mov rax,[rax+30]
  mov rax,[rax+18]
  mov rax,[rax+10]
  test rax,rax
  jz not_human
  mov rax,[rax+30]
  mov rax,[rax+10]
  cmp dword ptr [rax+10],0
  jne not_human
  pop rax

  // HUMAN: overwrite [rcx+38] with items[0] — rcx is still "this"
  push rax
  mov rax,[rcx+30]       // this.m_availableAbilities (List*)
  mov rax,[rax+10]       // List._items (array ptr)
  mov rax,[rax+10]       // _items[0]
  mov [rcx+38],rax        // m_selectedAbility = _items[0]
  pop rax

  // Normal prologue → jmp returnhere
  push rbp
  mov rbp,rsp
  sub rsp,30
  jmp returnhere

not_human:
  pop rax
  push rbp
  mov rbp,rsp
  sub rsp,30
  jmp returnhere

AAS_INJECT:
  jmp newmem
  nop
  nop
  nop
returnhere:

[DISABLE]
AAS_INJECT:
  db 55 48 8B EC 48 83 EC 30
unregistersymbol(AAS_INJECT)
dealloc(newmem)"""
