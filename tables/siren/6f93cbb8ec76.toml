alloc(newmem, 256, ISBOOTCAMP)

registersymbol(ISBOOTCAMP)

newmem:
  mov eax, 1    // bool IsBootCamp() -> return true
  ret

ISBOOTCAMP:
  jmp newmem
  nop
  nop
  nop

