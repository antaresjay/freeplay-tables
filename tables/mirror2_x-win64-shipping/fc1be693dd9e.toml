[[cheat]]
id = "no-cooldown"
name = "No Cooldown"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Mirror2_X-Win64-Shipping.exe
  Date   : 22-07-2022
  Author : Glowmoss
}

[ENABLE]

aobscanmodule(nocdn,$process,89 ? ? EB ? 48 8B ? 44 8B ? 48 8D)
aobscanmodule(nocdn1,$process,89 ? ? C7 ? ? ? ? ? ? EB ? 66 ? ? ? ? ? ? ? ? ? ? 48 63)
aobscanmodule(nocdn2,$process,45 39 ? ? 7E ? 8B ? ? 3B)
alloc(newmem,128)
alloc(nocdnorig,5)
alloc(nocdn2orig,6)

registersymbol(nocdn nocdn1 nocdn2 nocdnorig nocdn2orig)
label(code return return1 return2 coold1 coold2)

nocdn2orig:
  readmem(nocdn2,6)

nocdnorig:
  readmem(nocdn,5)

newmem:
  mov eax,0
  mov [rdx+04],eax
  jmp far return+23

coold1:
  mov eax,0
  mov [rcx+04],eax
  mov [rcx+08],FFFFFFFF
  jmp far return1

coold2:
  mov [r10+04],0
  cmp [r10+04],r12d
  jle short code
  jmp far return2

code:
  jmp far return2+49

Trampolines+40:
  jmp far newmem
  align 10 CC

Trampolines+50:
  jmp far coold1
  align 10 CC

Trampolines+60:
  jmp far coold2
  align 10 CC

nocdn:
  jmp Trampolines+40
return:

nocdn1:
  jmp Trampolines+50
  db 90 90 90 90 90
return1:

nocdn2:
  jmp Trampolines+60
  db 90
return2:

[DISABLE]

nocdn:
  readmem(nocdnorig,5)

nocdn2:
  readmem(nocdn2orig,6)

nocdn1:
  db 89 41 04 C7 41 08 FF FF FF FF

unregistersymbol(*)
dealloc(*)"""

