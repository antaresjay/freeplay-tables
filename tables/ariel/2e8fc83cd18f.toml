[[cheat]]
id = "inf-health"
name = "Inf Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Ariel.exe
  Version: 0.8.0.0
  Date   : 2017-07-12
  Author : Squall8
}

[ENABLE]

aobscanmodule(health,Ariel.exe,48 89 83 F8 00 00 00 E8 B3)
alloc(newmem,$1000,"Ariel.exe")

label(code)
label(return)

newmem:
  cmp [rbx+00000044],0
  je return

code:
  mov [rbx+000000F8],rax
  jmp return

health:
  jmp newmem
  nop
  nop
return:
registersymbol(health)

[DISABLE]

health:
  db 48 89 83 F8 00 00 00

unregistersymbol(health)
dealloc(newmem)"""

