type = "script"
source = """
[ENABLE]





aobscanmodule(noammoneeded_aob,SCUM.exe,0F B6 81 48 1c 00 00) // should be unique
alloc(newmem,$1000,noammoneeded_aob)

label(code)
label(return)

newmem:
mov byte ptr [rcx+00001c48],1
code:
  movzx eax,byte ptr [rcx+00001c48]
