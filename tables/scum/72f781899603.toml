[[cheat]]
id = "teleport-save-load-undo"
name = "[Teleport Save/Load/Undo]"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[Enable]
aobscanmodule(_AobTeleport,SCUM.exe,0F 28 88 90 01 00 00 8B C1)
alloc(newmem,$1000,_AobTeleport)
alloc(TeleportBase,256)

label(code)
label(return)
label(XCord)
label(YCord)
label(ZCord)
label(XCord_Undo)
label(YCord_Undo)
label(ZCord_Undo)
label(Load)
label(Save)
label(Undo)
label(SaveCords)
label(LoadCords)
label(Undo_Teleport)

registersymbol(_AobTeleport)
registersymbol(XCord)
registersymbol(YCord)
registersymbol(ZCord)
registersymbol(XCord_Undo)
registersymbol(YCord_Undo)
registersymbol(ZCord_Undo)
registersymbol(SaveCords)
registersymbol(LoadCords)
registersymbol(Undo_Teleport)

TeleportBase:
XCord:
dd 0
YCord:
dd 0
ZCord:
dd 0
XCord_Undo:
dd 0
YCord_Undo:
dd 0
ZCord_Undo:
dd 0
SaveCords:
dd 0
LoadCords:
dd 0
Undo_Teleport:
dd 0

newmem:
cmp byte ptr [rax+11C],#24 //cmp byte ptr [rax+118],#2 or 11C = 24/4
jne code
cmp byte ptr [SaveCords],1
je Save
cmp byte ptr [LoadCords],1
je Load
cmp byte ptr [Undo_Teleport],1
je Undo
jmp code

Save:
mov byte ptr [SaveCords],0
movss xmm3,[rax+190]
movss [XCord],xmm3
movss xmm3,[rax+194]
movss [YCord],xmm3
movss xmm3,[rax+198]
movss [ZCord],xmm3
jmp code

Load:
mov byte ptr [LoadCords],0
movss xmm4,[rax+190]
movss [XCord_Undo],xmm4
movss xmm4,[rax+194]
movss [YCord_Undo],xmm4
movss xmm4,[rax+198]
movss [ZCord_Undo],xmm4

movss xmm3,[XCord]
movss [rax+190],xmm3
movss xmm3,[YCord]
movss [rax+194],xmm3
movss xmm3,[ZCord]
movss [rax+198],xmm3
jmp code

Undo:
mov byte ptr [Undo_Teleport],0

movss xmm3,[XCord_Undo]
movss [rax+190],xmm3
movss xmm3,[YCord_Undo]
movss [rax+194],xmm3
movss xmm3,[ZCord_Undo]
movss [rax+198],xmm3
jmp code

code:
movaps xmm1,[rax+00000190]
jmp return

_AobTeleport:
jmp newmem
nop
nop
return:

[Disable]
_AobTeleport:
  db 0F 28 88 90 01 00 00

unregistersymbol(_AobTeleport)
unregistersymbol(XCord)
unregistersymbol(YCord)
unregistersymbol(ZCord)
unregistersymbol(XCord_Undo)
unregistersymbol(YCord_Undo)
unregistersymbol(ZCord_Undo)
unregistersymbol(SaveCords)
unregistersymbol(LoadCords)
unregistersymbol(Undo_Teleport)
dealloc(TeleportBase)
dealloc(newmem)"""

