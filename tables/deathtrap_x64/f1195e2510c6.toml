[[cheat]]
id = "player-stats-base-address-scan"
name = "Player Stats Base Address Scan"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstats_update_exit)
label(playerstats_set_exit)
label(playerstats_hpset_exit)
label(playerstats_mpset_exit)

registersymbol(playerstats_savedAOB)

//DeathTrap_x64.exe+195FEE - 74 02                 - je DeathTrap_x64.exe+195FF2
//DeathTrap_x64.exe+195FF0 - FF C9                 - dec ecx
//DeathTrap_x64.exe+195FF2 - F3 0F10 86 6C0B0000   - movss xmm0,[rsi+00000B6C]
//DeathTrap_x64.exe+195FFA - 45 0F57 C9            - xorps xmm9,xmm9
//DeathTrap_x64.exe+195FFE - 41 0F2F C1            - comiss xmm0,xmm9
//DeathTrap_x64.exe+196002 - 73 06                 - jae DeathTrap_x64.exe+19600A
aobscan(playerstats_searchedAOB, F3 0F 10 86 6C 0B 00 00 45 0F 57 C9)

// Allocates near playerstats_searchedAOB to avoid 64-bit jump
alloc(playerstats_newmem, 2048, playerstats_searchedAOB)
alloc(playerstats_temp1, 8, playerstats_searchedAOB)


playerstats_newmem:
mov [playerstats_temp1], rbx

cmp dword ptr [playerstats_update_enable], #0
je playerstats_update_exit
mov [playerstats_basepointer], rsi
playerstats_update_exit:

cmp dword ptr [playerstats_set_enable], #0
je playerstats_set_exit
mov rbx, [rsi+940]
mov [rbx+90], #99999
mov [rbx+98], #99999
mov [rbx+d4], (float)250
playerstats_set_exit:

cmp dword ptr [playerstats_hpset_enable], #0
je playerstats_hpset_exit
fild [rsi+540]
fstp [rsi+52c]
playerstats_hpset_exit:

cmp dword ptr [playerstats_mpset_enable], #0
je playerstats_mpset_exit
mov [rsi+b6c], (float)9999
playerstats_mpset_exit:

mov rbx, [playerstats_temp1]


playerstats_originalcode:
db F3 0F 10 86 6C 0B 00 00
//movss xmm0,[rsi+00000B6C]


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB:
playerstats_savedAOB:
jmp playerstats_newmem
nop
nop
nop
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
db F3 0F 10 86 6C 0B 00 00
//movss xmm0,[rsi+00000B6C]

unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)
dealloc(playerstats_temp1)"""

