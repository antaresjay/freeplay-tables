[[cheat]]
id = "charlie-inventory-useable-item-ctrl-numpad-1-click-on-an-item-in-the-inventory-to-populate-values"
name = "Charlie Inventory Useable Item (Ctrl + Numpad 1) {Click on an item in the 'Inventory' to populate values}"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : HellIsUs-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.5.4.0
// Game Version      : v1.3.36.43556
// Script Date       : 2025-09-02


[ENABLE]

aobscanmodule(items,HellIsUs-Win64-Shipping.exe,8Bxxxx4889xxxxxxE8xxxxxxxx488Bxx4889xxxxxx89) // should be unique
alloc(newmem,$1000,items)
alloc(data2,8)
alloc(itemsbkp,8)
registersymbol(data2)
registersymbol(items)
registersymbol(itemsbkp)
label(code)
label(return)

itemsbkp:
  readmem(items,8)

newmem:
  mov [data2],rax

code:
  readmem(items,8)
  jmp return

items:
  jmp newmem
  nop 3
return:

[DISABLE]

items:
  readmem(itemsbkp,8)

unregistersymbol(*)
dealloc(*)"""

