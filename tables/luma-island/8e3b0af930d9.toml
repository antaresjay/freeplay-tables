[[cheat]]
id = "max-affection"
name = "Max Affection"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(Affection,NPCHealth:Update+f2,NPCHealth:Update+14a,48 8B 46 48 48 8B C8 83 39 00 48 8B 80 E0 00 00 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
push rdi
mov rdi,[rdi+48]
mov rdi,[rdi+38]
mov [rdi+20],#9999

@@:
pop rdi

code:
  mov rax,[rsi+48]
  mov rcx,rax
  cmp dword ptr [rcx],00
  mov rax,[rax+000000E0]
  jmp return

Affection:
  jmp far newmem
  nop 3
return:
registersymbol(Affection)

[DISABLE]

Affection:
  db 48 8B 46 48 48 8B C8 83 39 00 48 8B 80 E0 00 00 00

unregistersymbol(Affection)
dealloc(newmem)"""
