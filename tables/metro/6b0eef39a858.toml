type = "script"
source = """
//Send@ModEngine
[ENABLE]

aobscanmodule(gasmask,metro.exe,F3 0F 10 B0 08 03 00 00)
alloc(newmem,$1000,gasmask)

label(code)
label(return)

newmem:

code:
  movss xmm6,[rax+00000308]
  mov [rax+00000308],(float)1
  jmp return

gasmask:
  jmp newmem
  nop 3
return:
registersymbol(gasmask)

[DISABLE]

gasmask:
  db F3 0F 10 B0 08 03 00 00

unregistersymbol(gasmask)
dealloc(newmem)"""

