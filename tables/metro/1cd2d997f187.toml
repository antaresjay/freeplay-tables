[[cheat]]
id = "always-100-gas-mask-durability"
name = "Always 100% Gas Mask Durability"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
AoBScanModule(GasMask, metro.exe, F3 0F 10 B0 ?? ?? ?? ?? 45 33 C0 )
registersymbol(GasMask)

alloc(newmem, 128, "metro.exe")
label(return)

GasMask:
jmp newmem
db 90 90 90
return:

newmem:
mov [rax+308],(float)1 //Move max condition.
movss xmm6,[rax+00000308] //Original Code
jmp return //Return

[DISABLE]
unregistersymbol(GasMask)
dealloc(newmem)
dealloc(return)

GasMask:
movss xmm6,[rax+00000308]"""
