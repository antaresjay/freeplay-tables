[[cheat]]
id = "teleport-script"
name = "**TELEPORT SCRiPT"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(teleportmem,2048)
registersymbol(s_enable)
registersymbol(l_enable)
registersymbol(u_enable)
label(returnteleport)
label(originalcodeteleport)
label(exitteleport)
label(z_coord)
label(x_coord)
label(y_coord)
label(z_coord_undo)
label(x_coord_undo)
label(y_coord_undo)
label(save_coord)
label(load_coord)
label(undo_coord)
label(s_enable)
label(l_enable)
label(u_enable)

"ACM.exe"+2AC895:
jmp teleportmem
nop
nop
nop
returnteleport:

teleportmem:
cmp [s_enable],1
je save_coord

cmp [l_enable],1
je load_coord

cmp [u_enable],1
je undo_coord

jmp originalcodeteleport

save_coord:
mov [s_enable],0
push edi
mov edi,[esi+5c]
mov [x_coord],edi
mov edi,[esi+60]
mov [z_coord],edi
mov edi,[esi+64]
mov [y_coord],edi
pop edi
jmp originalcodeteleport

load_coord:
mov [l_enable],0
cmp [z_coord],0
je originalcodeteleport
// Save actual Position (for UNDO TELEPORT) when press LOAD POSiTiON
push edi
mov edi,[esi+5c]
mov [x_coord_undo],edi
mov edi,[esi+60]
mov [z_coord_undo],edi
mov edi,[esi+64]
mov [y_coord_undo],edi
pop edi
// Save actual Position (for UNDO TELEPORT) when press LOAD POSiTiON
push edi
mov edi,[x_coord]
mov [esi+5c],edi
mov edi,[z_coord]
mov [esi+60],edi
mov edi,[y_coord]
mov [esi+64],edi
pop edi
jmp originalcodeteleport

undo_coord:
mov [l_enable],0
mov [s_enable],0
mov [u_enable],0
cmp [z_coord_undo],0
je originalcodeteleport
push edi
mov edi,[x_coord_undo]
mov [esi+5c],edi
mov edi,[z_coord_undo]
mov [esi+60],edi
mov edi,[y_coord_undo]
mov [esi+64],edi
pop edi

originalcodeteleport:
mov eax,[esi+64]
movss [ebp-58],xmm1

exitteleport:
jmp returnteleport

x_coord:
dd 0
z_coord:
dd 0
y_coord:
dd 0
s_enable:
dd 0
l_enable:
dd 0
x_coord_undo:
dd 0
z_coord_undo:
dd 0
y_coord_undo:
dd 0
u_enable:
dd 0
//>>>--Teleport--//



[DISABLE]
dealloc(teleportmem)
dealloc(newmem)
Unregistersymbol(s_enable)
Unregistersymbol(l_enable)
Unregistersymbol(u_enable)
"ACM.exe"+2AC895:
mov eax,[esi+64]
movss [ebp-58],xmm1
//Alt: db 8B 46 64 F3 0F 11 4D A8"""

