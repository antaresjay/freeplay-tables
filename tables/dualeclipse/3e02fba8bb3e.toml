[[cheat]]
id = "game-manager-ctrl-numpad-1-will-populate-when-encounter-enemy"
name = "Game Manager (Ctrl + Numpad 1) {Will populate when encounter enemy}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : DualEclipse.exe
// Author            : ndck76
// Executable Version: 2021.3.13.32088
// Game Version      : v1.0
// Script Date       : 2025-09-17


[ENABLE]

aobscanregion(playersavedata,SpellTracker:Update,SpellTracker:Update+500,488B80xxxx000048xxxxxx48xxxx83xxxx48xxxxxx85xx7FxxC6xxxxxx48xxxx48xxxxxx49BBxxxxxxxxxxxx000041xxxxE9xxxxxxxxB9xxxxxxxx90) //SpellTracker:Update+82
alloc(newmem,$1000)
alloc(data,8)
alloc(playersavedatabkp,14)
registersymbol(data)
registersymbol(playersavedata)
registersymbol(playersavedatabkp)
label(code)
label(return)

playersavedatabkp:
  readmem(playersavedata,14)

newmem:
  mov [data],rax

code:
  readmem(playersavedata,14)
  jmp return

playersavedata:
  jmp far newmem
return:

[DISABLE]

playersavedata:
  readmem(playersavedatabkp,14)

unregistersymbol(*)
dealloc(*)"""

