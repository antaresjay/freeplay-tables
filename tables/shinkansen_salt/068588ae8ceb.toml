[[cheat]]
id = "combatstaminacontroller-base-address-scan-to-activate-load-game-to-update-play"
name = "CombatStaminaController Base Address Scan (To Activate: Load Game, To Update: Play)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(CombatStaminaController_savedAOB)
label(CombatStaminaController_returnhere)
label(CombatStaminaController_originalcode)
label(CombatStaminaController_exit)

label(CombatStaminaController_update_exit)
label(CombatStaminaController_set_exit)
label(CombatStaminaController_healthset_exit)
label(CombatStaminaController_foodset_exit)
label(CombatStaminaController_staminaset_exit)

registersymbol(CombatStaminaController_savedAOB)

//0521F34A - D9 5D F8              - fstp dword ptr [ebp-08]
//0521F34D - D9 45 F8              - fld dword ptr [ebp-08]
// CombatStaminaController:Update+28
//0521F350 - D9 47 1C              - fld dword ptr [edi+1C]
//0521F353 - DFF1                  - fcomip st(0),st(1)
//0521F355 - DDD8                  - fstp st(0)
//0521F357 - 0F86 63000000         - jbe 0521F3C0
//0521F35D - E8 CE07F9FF           - call 051AFB30
aobscan(CombatStaminaController_searchedAOB, D9 47 1C DF F1 DD D8 0F 86 63 00 00 00)

alloc(CombatStaminaController_newmem, 2048, CombatStaminaController_searchedAOB)
alloc(CombatStaminaController_temp1, 4, CombatStaminaController_searchedAOB)


CombatStaminaController_newmem:
mov [CombatStaminaController_temp1], eax

cmp dword ptr [CombatStaminaController_update_enable], #0
je CombatStaminaController_update_exit
mov [CombatStaminaController_basepointer], edi
CombatStaminaController_update_exit:

cmp dword ptr [CombatStaminaController_set_enable], #0
je CombatStaminaController_set_exit
CombatStaminaController_set_exit:

cmp dword ptr [CombatStaminaController_healthset_enable], #0
je CombatStaminaController_healthset_exit
cmp dword ptr [edi+10], #0
je CombatStaminaController_healthset_exit
mov eax, [edi+10]
cmp dword ptr [eax+10], #0
je CombatStaminaController_healthset_exit
mov eax, [eax+10]
cmp dword ptr [eax+14], #0
je CombatStaminaController_healthset_exit
mov eax, [eax+14]
fld [eax+14]
fstp [eax+10]
CombatStaminaController_healthset_exit:

cmp dword ptr [CombatStaminaController_foodset_enable], #0
je CombatStaminaController_foodset_exit
cmp dword ptr [edi+10], #0
je CombatStaminaController_foodset_exit
mov eax, [edi+10]
cmp dword ptr [eax+10], #0
je CombatStaminaController_foodset_exit
mov eax, [eax+10]
cmp dword ptr [eax+14], #0
je CombatStaminaController_foodset_exit
mov eax, [eax+14]
fld [eax+1c]
fstp [eax+18]
CombatStaminaController_foodset_exit:

cmp dword ptr [CombatStaminaController_staminaset_enable], #0
je CombatStaminaController_staminaset_exit
cmp dword ptr [edi+10], #0
je CombatStaminaController_staminaset_exit
mov eax, [edi+10]
cmp dword ptr [eax+10], #0
je CombatStaminaController_staminaset_exit
mov eax, [eax+10]
cmp dword ptr [eax+14], #0
je CombatStaminaController_staminaset_exit
mov eax, [eax+14]
fld [eax+24]
fstp [eax+20]
CombatStaminaController_staminaset_exit:

mov eax, [CombatStaminaController_temp1]


CombatStaminaController_originalcode:
db D9 47 1C DF F1
//fld dword ptr [edi+1C]
//fcomip st(0),st(1)


CombatStaminaController_exit:
jmp CombatStaminaController_returnhere


CombatStaminaController_searchedAOB:
CombatStaminaController_savedAOB:
jmp CombatStaminaController_newmem
CombatStaminaController_returnhere:


[DISABLE]
CombatStaminaController_savedAOB:
db D9 47 1C DF F1
//fld dword ptr [edi+1C]
//fcomip st(0),st(1)

unregistersymbol(CombatStaminaController_savedAOB)

dealloc(CombatStaminaController_newmem)
dealloc(CombatStaminaController_temp1)"""

