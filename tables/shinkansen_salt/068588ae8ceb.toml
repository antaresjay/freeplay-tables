[[cheat]]
id = "playermovement-base-address-scan-initialization-activate-this-first"
name = "PlayerMovement Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlayerMovement_basepointer)
registersymbol(PlayerMovement_update_enable)
registersymbol(PlayerMovement_set_enable)
registersymbol(PlayerMovement_jumpset_enable)
registersymbol(PlayerMovement_movementset_enable)
registersymbol(PlayerMovement_sprintset_enable)
registersymbol(PlayerMovement_sneakset_enable)
registersymbol(PlayerMovement_dodgeset_enable)

alloc(PlayerMovement_basepointer, 4)
alloc(PlayerMovement_update_enable, 4)
alloc(PlayerMovement_set_enable, 4)
alloc(PlayerMovement_jumpset_enable, 4)
alloc(PlayerMovement_movementset_enable, 4)
alloc(PlayerMovement_sprintset_enable, 4)
alloc(PlayerMovement_sneakset_enable, 4)
alloc(PlayerMovement_dodgeset_enable, 4)


[DISABLE]
unregistersymbol(PlayerMovement_basepointer)
unregistersymbol(PlayerMovement_update_enable)
unregistersymbol(PlayerMovement_set_enable)
unregistersymbol(PlayerMovement_jumpset_enable)
unregistersymbol(PlayerMovement_movementset_enable)
unregistersymbol(PlayerMovement_sprintset_enable)
unregistersymbol(PlayerMovement_sneakset_enable)
unregistersymbol(PlayerMovement_dodgeset_enable)

dealloc(PlayerMovement_basepointer)
dealloc(PlayerMovement_update_enable)
dealloc(PlayerMovement_set_enable)
dealloc(PlayerMovement_jumpset_enable)
dealloc(PlayerMovement_movementset_enable)
dealloc(PlayerMovement_sprintset_enable)
dealloc(PlayerMovement_sneakset_enable)
dealloc(PlayerMovement_dodgeset_enable)"""

[[cheat]]
id = "playermovement-base-address-scan-to-activate-load-game-to-update-play"
name = "PlayerMovement Base Address Scan (To Activate: Load Game, To Update: Play)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerMovement_savedAOB)
label(PlayerMovement_returnhere)
label(PlayerMovement_originalcode)
label(PlayerMovement_exit)

label(PlayerMovement_update_exit)
label(PlayerMovement_set_exit)
label(PlayerMovement_jumpset_exit)
label(PlayerMovement_movementset_exit)
label(PlayerMovement_sprintset_exit)
label(PlayerMovement_sneakset_exit)
label(PlayerMovement_dodgeset_exit)

registersymbol(PlayerMovement_savedAOB)

//0521F427 - E8 FC86FAFF           - call 051C7B28
//0521F42C - 83 C4 10              - add esp,10
// PlayerMovement:Update+67
//0521F42F - D9 5F 7C              - fstp dword ptr [edi+7C]
//0521F432 - 8B 47 1C              - mov eax,[edi+1C]
//0521F435 - 0FB6 40 39            - movzx eax,byte ptr [eax+39]
//0521F439 - 8B F0                 - mov esi,eax
//0521F43B - 0FB6 87 8D000000      - movzx eax,byte ptr [edi+0000008D]
aobscan(PlayerMovement_searchedAOB, D9 5F 7C 8B 47 1C 0F B6 40 39)

alloc(PlayerMovement_newmem, 2048, PlayerMovement_searchedAOB)


PlayerMovement_newmem:
cmp dword ptr [PlayerMovement_update_enable], #0
je PlayerMovement_update_exit
mov [PlayerMovement_basepointer], edi
PlayerMovement_update_exit:

cmp dword ptr [PlayerMovement_set_enable], #0
je PlayerMovement_set_exit
PlayerMovement_set_exit:

cmp dword ptr [PlayerMovement_jumpset_enable], #0
je PlayerMovement_jumpset_exit
cmp dword ptr [edi+1c], #0
je PlayerMovement_jumpset_exit
mov eax, [edi+1c]
cmp dword ptr [eax+14], #0
je PlayerMovement_jumpset_exit
mov eax, [eax+14]
mov [eax+c], (float)7.5
PlayerMovement_jumpset_exit:

cmp dword ptr [PlayerMovement_movementset_enable], #0
je PlayerMovement_movementset_exit
cmp dword ptr [edi+20], #0
je PlayerMovement_movementset_exit
mov eax, [edi+20]
mov [eax+c], (float)50
mov [eax+10], (float)40
mov [eax+14], (float)30
mov [eax+18], (float)200
mov [eax+1c], (float)50
PlayerMovement_movementset_exit:

cmp dword ptr [PlayerMovement_sprintset_enable], #0
je PlayerMovement_sprintset_exit
mov [edi+54], (float)50
mov [edi+58], (float)100
mov [edi+64], (float)0
PlayerMovement_sprintset_exit:

cmp dword ptr [PlayerMovement_sneakset_enable], #0
je PlayerMovement_sneakset_exit
mov [edi+50], (float)0
mov [edi+5c], (float)100
mov [edi+68], (float)0
PlayerMovement_sneakset_exit:

cmp dword ptr [PlayerMovement_dodgeset_enable], #0
je PlayerMovement_dodgeset_exit
mov [edi+6c], (float)60
mov [edi+70], (float)100
mov [edi+74], (float)0
PlayerMovement_dodgeset_exit:


PlayerMovement_originalcode:
db D9 5F 7C 8B 47 1C
//fstp dword ptr [edi+7C]
//mov eax,[edi+1C]


PlayerMovement_exit:
jmp PlayerMovement_returnhere


PlayerMovement_searchedAOB:
PlayerMovement_savedAOB:
jmp PlayerMovement_newmem
nop
PlayerMovement_returnhere:


[DISABLE]
PlayerMovement_savedAOB:
db D9 5F 7C 8B 47 1C
//fstp dword ptr [edi+7C]
//mov eax,[edi+1C]

unregistersymbol(PlayerMovement_savedAOB)

dealloc(PlayerMovement_newmem)"""

