source = """
[ENABLE]
label(Item_savedAOB)
label(Item_returnhere)
label(Item_originalcode)
label(Item_exit)

label(Item_update_exit)
label(Item_set_exit)

registersymbol(Item_savedAOB)

//0F9AA06A - 85 C0                 - test eax,eax
//0F9AA06C - 0F84 B8010000         - je 0F9AA22A
// ItemDescriptionUI:set_icon+1ea
//0F9AA072 - 8B 43 6C              - mov eax,[ebx+6C]
//0F9AA075 - 85 C0                 - test eax,eax
//0F9AA077 - 0F84 57000000         - je 0F9AA0D4
//0F9AA07D - 8B 46 14              - mov eax,[esi+14]
//0F9AA080 - 89 85 74FFFFFF        - mov [ebp-0000008C],eax
//0F9AA086 - 8B 05 98BAA501        - mov eax,[01A5BA98] : [0EA8F1C8]
aobscan(Item_searchedAOB, 8B 43 6C 85 C0 * * * * * * 8B 46 14)

alloc(Item_newmem, 2048, Item_searchedAOB)


Item_newmem:
cmp dword ptr [Item_update_enable], #0
je Item_update_exit
mov [Item_basepointer], ebx
Item_update_exit:

cmp dword ptr [Item_set_enable], #0
je Item_set_exit
cmp dword ptr [ebx+64], #0
je Item_set_exit
mov eax, [ebx+64]
mov [ebx+7c], eax
Item_set_exit:


Item_originalcode:
db 8B 43 6C 85 C0
//mov eax,[ebx+6C]
//test eax,eax


Item_exit:
jmp Item_returnhere


Item_searchedAOB:
Item_savedAOB:
jmp Item_newmem
Item_returnhere:


[DISABLE]
Item_savedAOB:
db 8B 43 6C 85 C0
//mov eax,[ebx+6C]
//test eax,eax

unregistersymbol(Item_savedAOB)

dealloc(Item_newmem)"""

