[[cheat]]
id = "player-controller-ctrl-numpad-2"
name = "Player Controller (Ctrl + Numpad 2)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Nekomancer of Nowhere.exe
// Author            : ndck76
// Executable Version: 2022.3.62.28864
// Game Version      : Build.20614756
// Script Date       : 2025-11-17


[ENABLE]

aobscanregion(time,PlayerController:Update,PlayerController:Update+1000,F30F1086xxxx0000F3xxxxxxF2xxxxxxxx66xx49BBxxxxxxxxxxxx000041xxxxF3xxxxxxF2xxxxxxxxF2xxxxxxF2xxxxxx) //PlayerController:Update+13b
alloc(newmem,$1000,time)
alloc(data,8)
alloc(timebkp,8)
registersymbol(data)
registersymbol(time)
registersymbol(timebkp)
label(code)
label(return)

timebkp:
  readmem(time,8)

newmem:
  mov [data],rsi

code:
  readmem(time,8)
  jmp return

time:
  jmp newmem
  nop 3
return:

[DISABLE]

time:
  readmem(timebkp,8)

unregistersymbol(*)
dealloc(*)"""

