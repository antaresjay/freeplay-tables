[[cheat]]
id = "active-trainer"
name = "Active Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(oxygen)
label(hunger)

registersymbol(healthE)
registersymbol(oxygenE)
registersymbol(hungerE)
label(healthE)
label(oxygenE)
label(hungerE)
aobscan(active,F3 0F 10 46 10 8B 49 40 3B 01 F3 0F 11 84 24 C4 02 00 00)
registersymbol(active)
//
newmem: //this is allocated memory, you have read,write,execute access
//place your code here
///c health
cmp [healthE],0
je oxygen
mov [esi+c],(float)999
///10 oxygen
oxygen:
cmp [oxygenE],0
je hunger
mov [esi+10],(float)999
///14 gunger
hunger:
cmp [hungerE],0
je originalcode
mov [esi+14],(float)100

originalcode:
movss xmm0,[esi+10]
jmp returnhere
healthE:
dd 0
oxygenE:
dd 0
hungerE:
dd 0

active:
jmp newmem
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
active:
movss xmm0,[esi+10]
//Alt: db F3 0F 10 51 10
unregistersymbol(healthE)
unregistersymbol(oxygenE)
unregistersymbol(hungerE)"""

