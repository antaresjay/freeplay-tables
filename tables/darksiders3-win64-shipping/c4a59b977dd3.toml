type = "script"
source = """
[ENABLE]


aobscanmodule(consumables,Darksiders3-Win64-Shipping.exe,83 78 2C 00 7E 57)
alloc(newmem,$1000,"Darksiders3-Win64-Shipping.exe"+398F07)

label(code)
label(return)

newmem:
code:
  mov word ptr [rax+2C], 000A
  jmp return

consumables:
  jmp newmem
  nop
return:
registersymbol(consumables)

[DISABLE]

consumables:
  db 83 78 2C 00 7E 57

unregistersymbol(consumables)
dealloc(newmem)"""
