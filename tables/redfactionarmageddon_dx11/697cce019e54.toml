[[cheat]]
id = "infinite-health"
name = "Infinite Health *"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(aobHealth,RedFactionArmageddon_DX11.exe,D9 98 24 0F 00 00 8B)
alloc(newmem,$100)

label(code)
label(return)
label(Cheat)

newmem:

Cheat:
  cmp [eax+FB4],1
  jne code
  nop
  nop
  nop
  nop
  nop
  nop
  jmp return

code:
  fstp dword ptr [eax+00000F24]
  jmp return

aobHealth:
  jmp Cheat
  nop
return:
registersymbol(aobHealth)

[DISABLE]

aobHealth:
  db D9 98 24 0F 00 00

unregistersymbol(aobHealth)
dealloc(newmem)"""

