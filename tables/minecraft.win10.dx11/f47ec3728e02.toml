[[cheat]]
id = "unlimited-blocks"
name = "Unlimited Blocks"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(INJECT,Minecraft.Win10.DX11.exe,02 45 33 C0 83 E8 01 0F B6 C8)
alloc(newmem,$1000,"Minecraft.Win10.DX11.exe"+2361DF)

label(code)
label(return)

newmem:

code:
  mov eax,40
  movzx ecx,al
  jmp return

INJECT+04:
  jmp code
  nop
return:
registersymbol(INJECT)




aobscanmodule(INJECT2,Minecraft.Win10.DX11.exe,2B C2 0F B6 D0)
