[[cheat]]
id = "ground-control-aob-script"
name = "Ground Control AOB script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : gc.exe
// Author            : Cs
// Executable Version: 1.0.1.1
// Module Version    : 
// Script Date       : 2020-06-26
// Created with      : customAOBInjectionTemplates version: 1.3.6
[ENABLE]
aobscanmodule(aobRadarHook,gc.exe,84 C0 74 ?? 8B 87 ?? 00 00 00 85 C0 75 ?? 57)
aobscanmodule(aobRadarTester,gc.exe,90 90 90 90 90 53 55 8B 5C 24)
aobscanmodule(aobVulnerabilityUpdater,gc.exe,C6 86 ?? 00 00 00 00 8B 96)
aobscanmodule(aobSpecialWeaponsUpdater,gc.exe,48 66 89 46 ?? 8B 0D)
aobscanmodule(aobSpecialWeaponsUpdater2,gc.exe,FF 8F ?? ?? 00 00 A1)

alloc(newmemRadarTester,4096,aobRadarTester)

label(aobRadarHook_r)
label(aobRadarHook_i)
registersymbol(aobRadarHook_r)
registersymbol(aobRadarHook_i)

label(lblRadarHookRet)

label(aobRadarTester_r)
label(aobRadarTester_i)
registersymbol(aobRadarTester_r)
registersymbol(aobRadarTester_i)

label(lblRadarTester)
label(lblRadarTesterSkip)
label(lblRadarTesterRet)

label(bEnableEnemyOnRadar)
registersymbol(bEnableEnemyOnRadar)

label(aobVulnerabilityUpdater_r)
label(aobVulnerabilityUpdater_i)
registersymbol(aobVulnerabilityUpdater_r)
registersymbol(aobVulnerabilityUpdater_i)

label(lblVulnerabilityUpdater)
label(lblVulnerabilityUpdaterSkip)
label(lblVulnerabilityUpdaterRet)

label(bEnableGodMode)
registersymbol(bEnableGodMode)

label(aobSpecialWeaponsUpdater_r)
label(aobSpecialWeaponsUpdater_i)
registersymbol(aobSpecialWeaponsUpdater_r)
registersymbol(aobSpecialWeaponsUpdater_i)

label(lblSpecialWeaponsUpdater)
label(lblSpecialWeaponsUpdaterSkip)
label(lblSpecialWeaponsUpdaterRet)

label(aobSpecialWeaponsUpdater2_r)
label(aobSpecialWeaponsUpdater2_i)
registersymbol(aobSpecialWeaponsUpdater2_r)
registersymbol(aobSpecialWeaponsUpdater2_i)

label(lblSpecialWeaponsUpdater2)
label(lblSpecialWeaponsUpdater2Skip)
label(lblSpecialWeaponsUpdater2Ret)

label(bEnableInfiniteSpecialWeapons)
registersymbol(bEnableInfiniteSpecialWeapons)

newmemRadarTester:
bEnableGodMode:
dd 1
bEnableInfiniteSpecialWeapons:
dd 1
bEnableEnemyOnRadar:
dd 1

aobRadarHook_i:
readmem(aobRadarHook,2)

lblRadarTester:
readmem(aobRadarHook,2)
jne short lblRadarTesterSkip
mov al,[bEnableEnemyOnRadar]
test al,al
lblRadarTesterSkip:
jmp lblRadarHookRet
aobRadarTester_i:
readmem(aobRadarTester,5)

lblVulnerabilityUpdater:
readmem(aobVulnerabilityUpdater,7)
cmp byte ptr [esi+08],2
je short @f
cmp byte ptr [esi+08],0
jne short lblVulnerabilityUpdaterSkip
@@:
cmp dword ptr [bEnableGodMode],1
jne short lblVulnerabilityUpdaterSkip
mov dx,[esi+00000094]
mov [esi+00000032],dx
mov byte ptr [esi+000000A8],1
lblVulnerabilityUpdaterSkip:
jmp lblVulnerabilityUpdaterRet
aobVulnerabilityUpdater_i:
readmem(aobVulnerabilityUpdater,7)

lblSpecialWeaponsUpdater:
cmp dword ptr [bEnableInfiniteSpecialWeapons],1
jne short lblSpecialWeaponsUpdaterSkip
inc eax
lblSpecialWeaponsUpdaterSkip:
readmem(aobSpecialWeaponsUpdater,5)
jmp lblSpecialWeaponsUpdaterRet
aobSpecialWeaponsUpdater_i:
readmem(aobSpecialWeaponsUpdater,5)

lblSpecialWeaponsUpdater2:
readmem(aobSpecialWeaponsUpdater2,6)
cmp byte ptr [esi+08],0
jne short lblSpecialWeaponsUpdater2Skip
cmp dword ptr [bEnableInfiniteSpecialWeapons],1
jne short lblSpecialWeaponsUpdater2Skip
mov eax,[aobSpecialWeaponsUpdater2_i+02]
inc dword ptr [eax+edi]
lblSpecialWeaponsUpdater2Skip:
jmp lblSpecialWeaponsUpdater2Ret
aobSpecialWeaponsUpdater2_i:
readmem(aobSpecialWeaponsUpdater2,6)

aobSpecialWeaponsUpdater2:
aobSpecialWeaponsUpdater2_r:
jmp lblSpecialWeaponsUpdater2
nop
lblSpecialWeaponsUpdater2Ret:

aobSpecialWeaponsUpdater:
aobSpecialWeaponsUpdater_r:
jmp lblSpecialWeaponsUpdater
lblSpecialWeaponsUpdaterRet:

aobVulnerabilityUpdater:
aobVulnerabilityUpdater_r:
jmp lblVulnerabilityUpdater
nop 2
lblVulnerabilityUpdaterRet:

aobRadarHook:
aobRadarHook_r:
db eb c9
lblRadarHookRet:

aobRadarTester:
aobRadarTester_r:
jmp lblRadarTester
lblRadarTesterRet:

[DISABLE]
aobRadarHook_r:
readmem(aobRadarHook_i,2)

unregistersymbol(aobRadarHook_r)
unregistersymbol(aobRadarHook_i)

aobRadarTester_r:
readmem(aobRadarTester_i,5)

unregistersymbol(aobRadarTester_r)
unregistersymbol(aobRadarTester_i)

unregistersymbol(bEnableEnemyOnRadar)

aobVulnerabilityUpdater_r:
readmem(aobVulnerabilityUpdater_i,7)

unregistersymbol(aobVulnerabilityUpdater_r)
unregistersymbol(aobVulnerabilityUpdater_i)

unregistersymbol(bEnableGodMode)

aobSpecialWeaponsUpdater_r:
readmem(aobSpecialWeaponsUpdater_i,5)

unregistersymbol(aobSpecialWeaponsUpdater_r)
unregistersymbol(aobSpecialWeaponsUpdater_i)

aobSpecialWeaponsUpdater2_r:
readmem(aobSpecialWeaponsUpdater2_i,6)

unregistersymbol(aobSpecialWeaponsUpdater2_r)
unregistersymbol(aobSpecialWeaponsUpdater2_i)

unregistersymbol(bEnableInfiniteSpecialWeapons)

dealloc(newmemRadarTester)"""

