[[cheat]]
id = "get-player"
name = "Get Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobScanModule(LocalPlayerHook,$process,49 8B 06 0F 29 45 70)
alloc(n_LocalPlayer,$1000,LocalPlayerHook)

label(o_LocalPlayer r_LocalPlayer LocalPlayerPtr)


n_LocalPlayer:
  mov [LocalPlayerPtr],r14

o_LocalPlayer:
  mov rax,[r14]
  movaps [rbp+70],xmm0
  jmp r_LocalPlayer
  
LocalPlayerPtr:
 dq 0

LocalPlayerHook:
  jmp n_LocalPlayer
  db 90 90

r_LocalPlayer:
registersymbol(LocalPlayerHook LocalPlayerPtr)

[DISABLE]

LocalPlayerHook:
  db 49 8B 06 0F 29 45 70

unregisterSymbol(*)
dealloc(*)"""
