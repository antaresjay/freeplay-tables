[[cheat]]
id = "get-player-high-probability-of-getting-marked-as-a-cheater"
name = "Get Player [High Probability of Getting Marked as a Cheater]"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanregion(get_Player,Assets.Scripts.Unity.UI_New.CommonForegroundScreen.Update,Assets.Scripts.Unity.UI_New.CommonForegroundScreen.Update+100,48 8B 48 48 48 85 C9)
alloc(newmem,$1000,get_Player)
label(code)
label(return)
alloc(doAction,4)
alloc(Player,8)
alloc(PlayerInfo,100)
registersymbol(doAction)
registersymbol(Player)
registersymbol(PlayerInfo)

newmem:
  cmp byte ptr [doAction],00
  je code
  cmp byte ptr [doAction],01
  je GetProfile
  cmp byte ptr [doAction],02
  je SetProfile
  jmp code

GetProfile:
  mov [Player],rcx
  mov byte ptr [doAction],00
  push rax
  push rbx
  push rcx
  push rdx
  push rsi
  push rdi
  push r8
  push r9
  sub rsp,20
  mov rcx,Content
  cmp rcx,00000000
  je @f
  mov rcx,[rcx]
  mov rcx,[rcx+BTD6Offsets.knowledgePoints]
  xor edx,edx
  call Assets.Scripts.Utils.KonFuze.Read
  cvttsd2si eax,xmm0
  mov [PlayerInfo],eax //Knowledge Points
  mov rcx,Content
  mov rcx,[rcx]
  mov rcx,[rcx+BTD6Offsets.monkeyMoney]
  xor edx,edx
  call Assets.Scripts.Utils.KonFuze.Read
  cvttsd2si eax,xmm0
  mov [PlayerInfo+4],eax //Monkey Money
  mov rcx,Content
  mov rcx,[rcx]
  mov rcx,[rcx+BTD6Offsets.xp]
  xor edx,edx
  call Assets.Scripts.Utils.KonFuze.Read
  cvttsd2si eax,xmm0
  mov [PlayerInfo+8],eax //Experience
  /*mov rcx,Content - DON'T USE. OFFSETS ARE WRONG, THEY'RE NOT IN THE ADDRESS LIST AND TROPHIES ARE SERVER SIDED ANYWAYS.
  mov rcx,[rcx]
  mov rcx,[rcx+158]
  xor edx,edx
  call Assets.Scripts.Utils.KonFuze.Read
  cvttsd2si eax,xmm0
  mov [PlayerInfo+C],eax //Trophies */
@@:
  add rsp,20
  pop r9
  pop r8
  pop rdi
  pop rsi
  pop rdx
  pop rcx
  pop rbx
  pop rax
  jmp code

SetProfile:
  mov [Player],rcx
  mov byte ptr [doAction],00
  push rax
  push rbx
  push rcx
  push rdx
  push rsi
  push rdi
  push r8
  push r9
  sub rsp,20
  mov rcx,Content
  cmp rcx,00000000
  je @f
  mov rcx,[rcx]
  mov rcx,[rcx+BTD6Offsets.knowledgePoints]
  movd xmm1,[PlayerInfo] //Knowledge Points
  cvtdq2pd xmm1,xmm1
  call Assets.Scripts.Utils.KonFuze.Write
  mov rcx,Content
  mov rcx,[rcx]
  mov rcx,[rcx+BTD6Offsets.monkeyMoney]
  movd xmm1,[PlayerInfo+4] //Monkey Money
  cvtdq2pd xmm1,xmm1
  call Assets.Scripts.Utils.KonFuze.Write
  mov rcx,Content
  mov rcx,[rcx]
  mov rcx,[rcx+BTD6Offsets.xp]
  movd xmm1,[PlayerInfo+8] //Experience
  cvtdq2pd xmm1,xmm1
  call Assets.Scripts.Utils.KonFuze.Write
  /*mov rcx,Content - DON'T USE. OFFSETS ARE WRONG, THEY'RE NOT IN THE ADDRESS LIST AND TROPHIES ARE SERVER SIDED ANYWAYS.
  mov rcx,[rcx]
  mov rcx,[rcx+138]
  movd xmm1,[PlayerInfo+C] //Trophies
  cvtdq2pd xmm1,xmm1
  call Assets.Scripts.Utils.KonFuze.Write*/
@@:
  add rsp,20
  pop r9
  pop r8
  pop rdi
  pop rsi
  pop rdx
  pop rcx
  pop rbx
  pop rax
  jmp code

code:
  mov [Player],rax
  mov rcx,[rax+48]
  test rcx,rcx
  jmp return

get_Player:
  jmp newmem
  nop 2
return:
registersymbol(get_Player)

[DISABLE]
get_Player:
  db 48 8B 48 48 48 85 C9

unregistersymbol(get_Player)
dealloc(newmem)"""

