type = "script"
source = """
{ Game   : SeriousSam.exe
  Version: 
  Date   : 2019-09-02
  Author : Anjinggila

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(heart,Engine.dll,89 06 E8 C7 01 00 00) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(playerHealth)

newmem:
  cmp [esi+90],0
  je playerHealth
  jmp code

playerHealth:
  mov [esi],(float)999
  jmp return

code:
  sub [esi],(float)0.1
  call Engine.CEntity::UnsetTimer+10
  jmp return

heart:
  jmp newmem
  nop 2
return:
registersymbol(heart)

[DISABLE]

heart:
  db 89 06 E8 C7 01 00 00

unregistersymbol(heart)
dealloc(newmem)"""

