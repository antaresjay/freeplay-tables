[[cheat]]
id = "lordcreatorpanel-base-address-scan-initialization-activate-this-first"
name = "LordCreatorPanel Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(LordCreatorPanel_basepointer)
registersymbol(LordCreatorPanel_update_enable)
registersymbol(LordCreatorPanel_set_enable)

alloc(LordCreatorPanel_basepointer, 4)
alloc(LordCreatorPanel_update_enable, 4)
alloc(LordCreatorPanel_set_enable, 4)


[DISABLE]
unregistersymbol(LordCreatorPanel_basepointer)
unregistersymbol(LordCreatorPanel_update_enable)
unregistersymbol(LordCreatorPanel_set_enable)

dealloc(LordCreatorPanel_basepointer)
dealloc(LordCreatorPanel_update_enable)
dealloc(LordCreatorPanel_set_enable)"""

[[cheat]]
id = "lordcreatorpanel-base-address-scan-to-activate-change-portrait-to-update-change-portrait"
name = "LordCreatorPanel Base Address Scan (To Activate: Change Portrait, To Update: Change Portrait)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(LordCreatorPanel_savedAOB)
label(LordCreatorPanel_returnhere)
label(LordCreatorPanel_originalcode)
label(LordCreatorPanel_exit)

label(LordCreatorPanel_update_exit)
label(LordCreatorPanel_set_exit)

registersymbol(LordCreatorPanel_savedAOB)

aobscan(LordCreatorPanel_searchedAOB, 8B 87 D0 00 00 00 89 46 3C)

//3AFB1B4F - 8B 45 F4              - mov eax,[ebp-0C]
//3AFB1B52 - 89 48 18              - mov [eax+18],ecx
// LordCreatorPanel:get_CurrentTemplateInstance+95
//3AFB1B55 - 8B 87 D0000000        - mov eax,[edi+000000D0]
//3AFB1B5B - 89 46 3C              - mov [esi+3C],eax
//3AFB1B5E - C7 46 30 FFFFFFFF     - mov [esi+30],FFFFFFFF
//3AFB1B65 - 8B 47 58              - mov eax,[edi+58]
alloc(LordCreatorPanel_newmem, 2048, LordCreatorPanel_searchedAOB)


LordCreatorPanel_newmem:
cmp dword ptr [LordCreatorPanel_update_enable], #0
je LordCreatorPanel_update_exit
mov [LordCreatorPanel_basepointer], edi
LordCreatorPanel_update_exit:

cmp dword ptr [LordCreatorPanel_set_enable], #0
je LordCreatorPanel_set_exit
mov [edi+d8], #9999
LordCreatorPanel_set_exit:


LordCreatorPanel_originalcode:
db 8B 87 D0 00 00 00
//mov eax,[edi+000000D0]


LordCreatorPanel_exit:
jmp LordCreatorPanel_returnhere


LordCreatorPanel_searchedAOB:
LordCreatorPanel_savedAOB:
jmp LordCreatorPanel_newmem
nop
LordCreatorPanel_returnhere:


[DISABLE]
LordCreatorPanel_savedAOB:
db 8B 87 D0 00 00 00
//mov eax,[edi+000000D0]

unregistersymbol(LordCreatorPanel_savedAOB)

dealloc(LordCreatorPanel_newmem)"""

