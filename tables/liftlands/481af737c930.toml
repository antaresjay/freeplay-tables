name = "Villagers Unlimited Satiation"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game      : Liftlands.exe
  Builld ID : 13820138
  Date      : 2024-03-23
  Author    : BabyGroot

  This script does blah blah blah
}

define(address,Hunger:Update)

[ENABLE]

alloc(newmem,$1000)

label(code)
label(return)

newmem:
mov [rsi+74],(float)1000    //satiation
mov [rsi+78],(float)1000    //maxSatiation

code:
  movss xmm0,[rsi+74]
  jmp return

address+16F:
  jmp newmem
return:
registersymbol(address)

[DISABLE]

address+16F:
  db F3 0F 10 46 74

unregistersymbol(address)
dealloc(newmem)"""

