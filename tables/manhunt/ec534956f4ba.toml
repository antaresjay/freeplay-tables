[[cheat]]
id = "unlimited-stamina"
name = "Unlimited Stamina"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
{ Game   : manhunt.exe
  Version: 2004
  Date   : 2022-02-01
  Author : Nio.b
}

[ENABLE]
aobscanmodule(Stamina,manhunt.exe,D9 9D 4C 08 00 00 D9) // should be unique
alloc(newmem,$1000)
label(return)

newmem:
  fstp dword ptr [ebp+0000084C]
  mov [ebp+0000084C],(float)1
  jmp return

Stamina:
  jmp newmem
  nop
return:
registersymbol(Stamina)

[DISABLE]

Stamina:
  db D9 9D 4C 08 00 00

unregistersymbol(Stamina)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: manhunt.exe+63DA2
}"""

