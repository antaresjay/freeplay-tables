name = "Hook Developer Function"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,DeveloperUI.Update)
define(bytes,40 53 48 83 EC 30)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,DeveloperUI.Update)
registersymbol(DevPtr)
label(code return DevPtr)

newmem:
mov [DevPtr],rcx

code:
  push rbx
  sub rsp,30
  jmp return

DevPtr:
dq 0

address:
  jmp newmem
  nop
return:

[DISABLE]

address:
  db bytes

unregistersymbol(*)
dealloc(*)"""
