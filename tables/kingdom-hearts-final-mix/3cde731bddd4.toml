[[cheat]]
id = "damage-modifier-script-god-mode-one-hit-kill-etc"
name = "Damage Modifier Script (God Mode, One Hit Kill, etc.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DamageModAOB,$process,41 03 C6 48 89 5C 24 30 8B 5F 40) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,1024,DamageModAOB)

label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

newmem:
  movd xmm0,r14d
  cvtdq2ps xmm0,xmm0
  cmp qword ptr [rdi+000000C8],0
  je EnemyHit
HeroHit:
  comiss xmm0,[ZeroFloat]
  jb HeroDamageHit
  jmp CleanUp
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  mulss xmm0,[fHeroDamageMult]
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xorps xmm0,xmm0
  jmp CleanUp
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne CleanUp
  mulss xmm0,[NegOneFloat]
  cvtss2si r14d,xmm0
  cmp r14d,eax
  jl @F
  xorps xmm0,xmm0
@@:
  mulss xmm0,[NegOneFloat]
  jmp CleanUp  
EnemyHit:
  comiss xmm0,[ZeroFloat]
  jb EnemyDamageHit
  jmp CleanUp
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckOneHitKill
  mulss xmm0,[fEnemyDamageMult]
CheckOneHitKill:
  cmp [OneHitKill],1
  jne CleanUp
  movss xmm0,[OneHitKillHP]
  jmp CleanUp

CleanUp:    
  cvtss2si r14d,xmm0
  add eax,r14d
  mov [rsp+30],rbx
  jmp return

ZeroFloat:
dq (float)0.0
OneHitKillHP:
dq (float)-99999.0
NegOneFloat:
dq (float)-1.0
GodMode:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)4.0
fHeroDamageMult:
dq (float)0.5
HeroCannotDie:
dq 1

DamageModAOB:
  jmp newmem
  nop
  nop
  nop
return:

[DISABLE]

DamageModAOB:
  db 41 03 C6 48 89 5C 24 30

unregistersymbol(DamageModAOB)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fHeroDamageMult)
unregistersymbol(HeroCannotDie)

dealloc(newmem)"""

