  cmp edi,[SpecificItemToAdd]
  jne CheckCategoryToAdd
  mov r14l,[MinAmt]
  mov [rdi+rax+00000499],r14l
  xor r14,r14
CheckCategoryToAdd:
  cmp byte ptr [CategoryToAdd],0
  jle CheckSetMinItems
  mov r15,ItemCategories
  add r15,rdi
  dec r15
  mov r14l,[CategoryToAdd]
  cmp [r15],r14l
  jne CheckSetMinItems
  mov r14l,[MinAmt]
  mov [rdi+rax+00000499],r14l
  xor r14,r14
CheckSetMinItems:
  mov r14,[R14Save]
  mov r15,[R15Save]
  cmp [SetMinItems],0
  je originalcode
  cmp [rdi+rax+0000499],r14l
  je originalcode
  mov r14l,[MinAmt]
  mov [rdi+rax+00000499],r14l
  xor r14,r14
  
originalcode:
  cmp [rdi+rax+00000499],r14l
  jmp return 

R14Save:
dq 0
R15Save:
dq 0
SetMinItems:
dq 0
CategoryToAdd:
dq 0
SpecificItemToAdd:
dq 0
MinAmt:
dq #25

InventoryOptionsAOB:
  jmp newmem
  nop
  nop
  nop
return:

