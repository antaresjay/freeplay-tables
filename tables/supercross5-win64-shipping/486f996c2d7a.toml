[[cheat]]
id = "credits-pointer-requires-getting-credits-first"
name = "Credits Pointer (requires getting credits first)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
define(address,"supercross5-Win64-Shipping.exe"+1B6C520)
define(bytes,44 8B 81 A4 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,"supercross5-Win64-Shipping.exe"+1B6C520)
globalalloc(pCredits,8,$process)
label(code)
label(return)

newmem:
  mov [pCredits],rcx

code:
  mov r8d,[rcx+000000A4]
  jmp return

address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  db bytes
  // mov r8d,[rcx+000000A4]

dealloc(newmem)"""

