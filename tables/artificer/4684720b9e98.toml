name = "***ACTIVATETHISFIRST***"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(currentsanity,StatusBar:Update+1,StatusBar:Update+92,48 8b 00 f3 0f 10 80 ?? ?? ?? ?? f3 0f 5a c0 48) // should be unique
