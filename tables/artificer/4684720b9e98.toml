label(sanityoffsett)

label(xsanity)
label(speedofwork)

label(workspeed)
registersymbol(workspeed)

label(maxsanity)
registersymbol(maxsanity)


newmem:
  mov rax,[rax]
  cmp [workspeed],00000001
  jne xsanity

  push rdx

  mov edx,[sanityoffsett]               //;get current sanity offset / [rax+218]
  sub edx,8                            //;sub -8 back for Work Speed
  movss xmm0,[speedofwork]            //;get speed of work value / [rax+210] max saxity
  movss [rax+rdx],xmm0                //mov [movss [rax+00000210],xmm0 ;max sasnity into current sanity

  pop rdx

xsanity:
  cmp [maxsanity],00000001
  jne code
  push rdx

   mov edx,[sanityoffsett]               //current sanity;[rax+00000218]
   add edx,28                          //;add 40 bytes
   movss xmm0,[rax+rdx]                 // [rax+00000240]

  db F3 0F 11 80                  //mov [movss [rax+00000218],xmm0 ;max sanity into current sanity
  readmem(currentsanity+7,4)            //current sanity

  pop rdx


code:
  readmem(currentsanity+3,12)
  jmp return

