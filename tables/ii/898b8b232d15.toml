[[cheat]]
id = "actor-data-align-target-or-press-the-q-button"
name = "Actor data/align target or press the Q button"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
Author\t: Raynard
Date\t: 2023-05-08
Game\t: Darkest Dungeon II.exe
Version\t: 2020.3.7.38898
}

[ENABLE]
aobscanregion(Actor,Assets.Code.Actor.ActorInstance:get_HpRounded,Assets.Code.Actor.ActorInstance:get_HpRounded+1000,F3??????????????F3??????F2??????488D??????????49BB????????????????41FF??F3??????F2??????488D)
alloc(al_Actor,$128)
alloc(mem_Actor,16)
alloc(ActorA_Pointer,8)
alloc(ActorE_Pointer,8)
label(re_Actor Ally Enemy)
registersymbol(Actor mem_Actor ActorA_Pointer ActorE_Pointer)

mem_Actor:
  readmem(Actor,16)

al_Actor:
  cmp byte ptr [rax+22B],1
  je Ally
  cmp byte ptr [rax+22B],0
  je Enemy
  readmem(Actor,16)
  jmp re_Actor

Ally:
  mov [ActorA_Pointer],rax
  readmem(Actor,16)
  jmp re_Actor

Enemy:
  mov [ActorE_Pointer],rax
  readmem(Actor,16)
  jmp re_Actor

Actor:
  jmp far al_Actor
  nop 2
re_Actor:

[DISABLE]
Actor:
  readmem(mem_Actor,16)

dealloc(*)
unregistersymbol(*)"""

