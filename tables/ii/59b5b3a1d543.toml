[[cheat]]
id = "encount-rate"
name = "Encount Rate"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : FINAL FANTASY II.exe
  Version:
  Date   : 2021-07-31
  Author : Cray
}

[ENABLE]

aobscanmodule(encountRateIndex,GameAssembly.dll,01 6F 28 8B 47 24) // should be unique
alloc(newmem,$128,encountRateIndex)

registersymbol(encountRateIndex)
registersymbol(encountEnable)
registersymbol(encountRateSet)

label(encountEnable)
label(encountRateSet)
label(code)
label(changeRate)
label(resetRate)
label(finish)
label(return)

newmem:

code:
  mov rcx,[encountEnable]
  cmp rcx,1
  je changeRate

  mov rcx,ebp
  jmp finish

changeRate:
  mov rcx,[encountRateSet]
  cmp rcx,0
  je resetRate
  jmp finish

resetRate:
  mov [rdi+28],0
  jmp finish

finish:
  add [rdi+28],rcx
  mov eax,[rdi+24]
  mov [encountEnable],0
  jmp return

encountEnable:
  dq 1
encountRateSet:
  dq 0

encountRateIndex:
  jmp newmem
  nop
return:


[DISABLE]

encountRateIndex:
  db 01 6F 28 8B 47 24

unregistersymbol(encountRateIndex)
unregistersymbol(encountEnable)
unregistersymbol(encountRateSet)
dealloc(newmem)

