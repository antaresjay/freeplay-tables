[[cheat]]
id = "score-manager-ctrl-numpad-3-activate-during-game-play"
name = "Score Manager (Ctrl + Numpad 3) {Activate during game play}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Beyond the Ice Palace II.exe
// Author            : ndck76
// Executable Version: 2022.3.46.39813
// Game Version      : v1.1.0
// Script Date       : 2025-03-20


[ENABLE]

aobscanregion(score,RexEngine.ScoreManager:FixedUpdate,RexEngine.ScoreManager:FixedUpdate+2000,4863xxxx3Bxx0Fxxxxxxxxxx48xxxxxx4Cxxxx41xxxx49xxxx89xxxx48xxxxxx44xxxx0Fxxxxxxxxxx) //RexEngine.ScoreManager:FixedUpdate+56
alloc(newmem,$1000,score)
alloc(data2,8)
alloc(scorebkp,6)
registersymbol(data2)
registersymbol(score)
registersymbol(scorebkp)
label(code)
label(return)

scorebkp:
  readmem(score,6)

newmem:
  mov [data2],rsi

code:
  readmem(score,6)
  jmp return

score:
  jmp newmem
  nop
return:

[DISABLE]

score:
  readmem(scorebkp,6)

unregistersymbol(*)
dealloc(*)"""

