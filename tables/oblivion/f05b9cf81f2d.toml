[[cheat]]
id = "player-melee-damage-strength-100-change-stat-inside"
name = "Player, Melee Damage += Strength (100%) [Change Stat Inside]"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
label(player)
alloc(strength,4)
strength:
dd 00000000
alloc(ratio,4)
ratio:
dd (float)1.00   //percentage of stat to be used as bonus damage

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
cmp [edi+0C],14
je player
jmp originalcode

player:
push ebx
push ecx
xor ecx,ecx
mov ebx,edi
mov ebx,[ebx+1C]

//pick stat to add as damage
mov cl,[ebx+8C] //strength
//mov cl,[ebx+8D] //intelligence
//mov cl,[ebx+8E] //willpower
//mov cl,[ebx+8F] //agility
//mov cl,[ebx+90] //speed
//mov cl,[ebx+91] //endurance
//mov cl,[ebx+92] //personality
//mov cl,[ebx+93] //luck
mov [strength],ecx
fild dword ptr [strength]
fmul dword ptr [ratio]
pop ecx
pop ebx

fadd dword ptr [esp+18]
fstp dword ptr [esp+18]

originalcode:
fld dword ptr [esp+18]
mov ebp,[edi]

exit:
jmp returnhere

"Oblivion.exe"+1FF519:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(strength)
dealloc(ratio)
dealloc(newmem)
"Oblivion.exe"+1FF519:
db D9 44 24 18 8B 2F
//fld dword ptr [esp+18]
//mov ebp,[edi]"""

