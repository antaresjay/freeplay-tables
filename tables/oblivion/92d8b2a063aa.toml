type = "script"
source = """
[ENABLE]
aobscanmodule(weight,Oblivion.exe,D8 5D 08 DF E0 F6 C4 44) 
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  mov ecx, 0
  mov [ebp+08], ecx
  fcomp dword ptr [ebp+08]
  fnstsw ax
  jmp return

weight:
  jmp newmem
return:
registersymbol(weight)

[DISABLE]

weight:
  db D8 5D 08 DF E0

unregistersymbol(weight)
dealloc(newmem)"""
