id = "auto-assemble-script"
name = "Auto Assemble script"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,GameAssembly.dll,FF 48 18 B0 01)
alloc(newmem,$1000,INJECT)

label(code)
label(return)

newmem:

code:
  mov al,01
  jmp return

INJECT:
  jmp newmem
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db FF 48 18 B0 01

unregistersymbol(INJECT)
dealloc(newmem)"""

