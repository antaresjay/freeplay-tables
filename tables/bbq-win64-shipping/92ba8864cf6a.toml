[[cheat]]
id = "max-stats"
name = "Max Stats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@FearlessRevolution|Sintrix
[ENABLE]

aobscanmodule(stats,BBQ-Win64-Shipping.exe,48 8B 47 48 48 C7 C7 01 00 00 80)
alloc(newmem,$1000,stats)

label(code)
label(return)

newmem:

code:
  mov [rdi+48],#9999999
  mov rax,[rdi+48]
  mov rdi,FFFFFFFF80000001
  jmp return

stats:
  jmp newmem
  nop 6
return:
registersymbol(stats)

[DISABLE]

stats:
  db 48 8B 47 48 48 C7 C7 01 00 00 80

unregistersymbol(*)
dealloc(*)"""

