[[cheat]]
id = "infinite-sp"
name = "Infinite SP"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(maxsp_aob,GameAssembly.dll,F3 0F 58 F7 0F 57 FF)
alloc(newmem,$1000,maxsp_aob)

label(code)
label(return)

newmem:

code:
addss xmm6,xmm7
xorps xmm7,xmm7

push #1000
fild [rsp]
fstp [rsp]

movss xmm6,[rsp]
add rsp,8
jmp return

maxsp_aob:
jmp newmem
nop 2
return:
registersymbol(maxsp_aob)

[DISABLE]

maxsp_aob:
db F3 0F 58 F7 0F 57 FF

unregistersymbol(maxsp_aob)
dealloc(newmem)"""
