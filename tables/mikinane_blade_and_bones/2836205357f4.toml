id = "player-stats-interact-with-save-point"
name = "Player Stats - Interact with save point"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[Enable]
alloc(newmem,100)
label(returnhere)
label(exit)
label(Player)
registersymbol(Player)
aobscan(aob1, 45 8B 87 EC 0F 00 00 48 8D 54 24 30 49 8B CD)
globalalloc(_Player,4)
newmem:
mov [_Player],r15
mov r8d,[r15+00000FEC]

exit:
jmp returnhere

aob1:
