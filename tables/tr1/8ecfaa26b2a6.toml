[[cheat]]
id = "inf-health"
name = "Inf. Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

aobscanmodule(Health,TR1.exe,D9 81 58 0C 00 00 C3 CC)
label(pHealth)

newmem:
mov [pHealth],ecx
fld dword ptr [ecx+00000C5C]
fst dword ptr [ecx+00000C58]
jmp originalcode

originalcode:
fld dword ptr [ecx+00000C58]

exit:
jmp returnhere

pHealth:
dd 0

Health:
jmp newmem
nop
returnhere:

registersymbol(Health)
registersymbol(pHealth)

[DISABLE]
unregistersymbol(Health)
unregistersymbol(pHealth)
dealloc(newmem)
Health:
db D9 81 58 0C 00 00"""

