type = "script"
source = """
{
  Author : hex
}

[ENABLE]

aobscanmodule(pSpeed,AssassinsCreed_Dx9.exe,F3 0F 10 46 7C 89)
alloc(newmem,$1000)
alloc(bSuperSpeed,1)
alloc(pSpeedValue,4)

registersymbol(bSuperSpeed)
registersymbol(pSpeedValue)

label(code)
label(lJump)
label(return)

//Need to replace the jne opcode with jmp, otherwise the game will change the value to the default value of 1.00.
pSpeed+F:
db EB

bSuperSpeed:
db 1

pSpeedValue:
dd (float)1.75

newmem:
cmp byte ptr [bSuperSpeed],01
jne code
cmp byte ptr [esi+A8],01
jne code
movss xmm0,[pSpeedValue]
jmp lJump

code:
  movss xmm0,[esi+7C]

lJump:
  jmp return

pSpeed:
  jmp newmem
return:
registersymbol(pSpeed)

[DISABLE]

pSpeed+F:
db 75

pSpeed:
  db F3 0F 10 46 7C

unregistersymbol(*)
dealloc(*)

