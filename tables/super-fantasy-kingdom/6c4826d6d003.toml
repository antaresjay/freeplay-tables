type = "script"
source = """
{ Game   : Super Fantasy Kingdom.exe
  Version: 
  Date   : 2025-10-25
  Author : BabyGroot

  This script does blah blah blah
}

define(address,SuperFantasyKingdom.PermanentDataManager:GetStars+1c)
define(bytes,48 63 40 6C 48 8B 34 24)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,SuperFantasyKingdom.PermanentDataManager:GetStars+1c)

