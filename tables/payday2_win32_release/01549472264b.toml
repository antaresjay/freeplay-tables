[[cheat]]
id = "infinite-resources"
name = "Infinite Resources"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(AmmoMem,256)

label(AmmoStart)
label(AmmoReturn)
registersymbol(AmmoStart)
label(ADat)
registersymbol(ADat)
label(Fail)
label(InfClip)
label(TCheck)
label(InTimer)


"payday2_win32_release.exe"+3A5A2F:
AmmoStart:
jmp AmmoMem
AmmoReturn:

AmmoMem:
pushad
lea eax,[esi+8]
push 00000004
push eax
call isbadreadptr
test eax,eax
jnz Fail

mov ebx,[esi+8]

lea eax,[ebx+10]
push 00000004
push eax
call isbadreadptr
test eax,eax
jnz Fail

cmp [ebx+10],#1835884895 //clip test
jne TCheck
cmp [ebx+14],#1701994351
je InfClip
cmp [ebx+14],#1869897583
je InfClip
TCheck:
cmp [ebx+10],#1920295775
jne Fail
cmp [ebx+18],#1835627615
je InTimer

Fail:
popad
mov [esi],ecx
mov edx,[eax+04]
jmp AmmoReturn

InfClip:
cmp [ADat],1
jne Fail
popad
//mov [esi],ecx
mov edx,[eax+04]
jmp AmmoReturn

InTimer:
cmp [ADat+4],1
jne Fail
popad
mov [esi],(float)0
mov edx,[eax+04]
jmp AmmoReturn

ADat:
 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
AmmoStart:
db 89 0E 8B 50 04

dealloc(AmmoMem)
unregistersymbol(AmmoStart)
unregistersymbol(ADat)"""

