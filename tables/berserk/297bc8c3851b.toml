[[cheat]]
id = "battle-stats-base-address-scan-to-update-battle"
name = "Battle Stats Base Address Scan (To Update: Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(battleHealth_aob,BERSERK.exe,8B 88 54 0C 00 00)
registersymbol(battleHealth_aob)
alloc(battleHealth_newmem,1024,BERSERK.exe)
label(battleHealth_return)
label(originalCode)
label(subwpn_exit)

battleHealth_newmem:
  cmp byte ptr [rax+C5C],#1 //1:Player,2:Enemies/Friendlies
  jne originalCode
  push r8
  cmp [battle_update],#0
  je short @f
  mov [battle_basept],rax
@@:
  cmp byte ptr [health_setmax],#0
  je short @f
  mov r8d,[rax+C50]
  mov [rax+C54],r8d
@@:
  cmp byte ptr [frenzy_setmax],#1
  jne short @f
  mov r8d,[rax+C70] //MAX FRENZY
  mov [rax+C74],r8d
  mov dword ptr [rax+DF4],#5 //FRENZY LEVEL
@@:
  cmp byte ptr [frenzy_setmax],#2
  jne short @f
  cmp [rax+C78],#0 //NOT 0 WHEN IN FRENZY MODE
  jne short @f
  mov r8d,[rax+C70]
  sub r8d,#1
  cmp [rax+C74],r8d //IGNORE IF FRENZY ALREADY AT/NEAR MAX
  jae short @f
  mov [rax+C74],r8d
@@:
  cmp byte ptr [deathb_setmax],#0
  je short @f
  fild [rax+C50] //MAX DEATHBLOW GAUGE (FLOAT) == MAX HEALTH (INT32)
  fstp [rax+E04]
@@:
  cmp byte ptr [subwpn_setmax],#0
  je subwpn_exit
  cmp [rax+CC8],(float)0.01 //Sub-Weapon 1
  jbe short @f
  mov [rax+CC8],(float)0.01
@@:
  cmp [rax+CD8],(float)0.01 //Sub-Weapon 2
  jbe short @f
  mov [rax+CD8],(float)0.01
@@:
  cmp [rax+CE8],(float)0.01 //Sub-Weapon 3
  jbe short @f
  mov [rax+CE8],(float)0.01
@@:
  cmp [rax+CF8],(float)0.01 //Sub-Weapon 4
  jbe short @f
  mov [rax+CF8],(float)0.01
@@:
  cmp [rax+D48],(float)0.01 //Transformation Sub-Weapon 1
  jbe short @f
  mov [rax+D48],(float)0.01
@@:
  cmp [rax+D58],(float)0.01 //Transformation Sub-Weapon 2
  jbe short @f
  mov [rax+D58],(float)0.01
@@:
  cmp [rax+D68],(float)0.01 //Transformation Sub-Weapon 3
  jbe short @f
  mov [rax+D68],(float)0.01
@@:
  cmp [rax+D78],(float)0.01 //Transformation Sub-Weapon 4
  jbe short @f
  mov [rax+D78],(float)0.01
subwpn_exit:
  cmp byte ptr [itemss_setmax],#0
  je short @f
  mov [rax+D00],(float)3
  mov [rax+D10],(float)3
  mov [rax+D20],(float)3
  mov [rax+D30],(float)3
@@:
  cmp byte ptr [killct_setmax],#0
  je short @f
  cmp dword ptr [rax-361CF9F0],#99999
  jae short @f
  mov dword ptr [rax-361CF9F0],#99999
@@:
  cmp byte ptr [combos_setmax],#0
  je short @f
  cmp word ptr [rax+E34],#9998
  jae short @f
  mov word ptr [rax+C8C],#9998 //Kill Count (Resets on knockback)
  mov word ptr [rax+E34],#9998 //Hit Count (Resets after time)
@@:
  pop r8

originalCode:
  mov ecx,[rax+00000C54]
  jmp long battleHealth_return

battleHealth_aob:
  jmp battleHealth_newmem
  nop
battleHealth_return:
