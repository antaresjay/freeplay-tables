[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
//======================================================================[ENABLE]
[ENABLE]
//-------------------------------------------------------[AOBSCAN]
aobscan(god_aob1,D9 81 18 01 00 00 C3 CC CC)
registersymbol(god_aob1)
aobscan(god_aob2,D9 99 18 01 00 00 5D C2 04 00 CC CC CC CC CC CC)
registersymbol(god_aob2)
//-------------------------------------------------------[ALLOC]
alloc(god_mem1,128)
alloc(god_mem2,32)
globalalloc(player,4)
//-------------------------------------------------------[LABELS]
label(originalcode1)
label(originalcode2)
label(returnhere1)
label(returnhere2)
//-------------------------------------------------------[INJECTION 1]
god_mem1:
cmp esi,0
je short originalcode1
cmp edx,0
je short originalcode1
cmp [ecx+D4],0
jne short originalcode1
cmp [ecx+118],(float)100000
je short originalcode1
//cmp [ecx+C8],(float)1
//jne short originalcode1
//cmp ecx,0x16000000 //Hopefully not needed; false negatives, probably.
//jge originalcode1
fld dword ptr [ecx+11C]
fstp dword ptr [ecx+118]
mov [player],ecx

originalcode1:
fld dword ptr [ecx+118]
jmp returnhere1

god_aob1:
jmp god_mem1
nop
returnhere1:

//-------------------------------------------------------[INJECTION 2]
god_mem2:
cmp ecx,[player]
jne originalcode2
fld dword ptr [ecx+11C]

originalcode2:
fstp dword ptr [ecx+118]
jmp returnhere2

god_aob2:
jmp god_mem2
nop
returnhere2:
//=====================================================================[DISABLE]
[DISABLE]
//-------------------------------------------------------[DEALLOC]
dealloc(god_mem1)
dealloc(god_mem2)
dealloc(player)
//-------------------------------------------------------[FIX BYTES]
god_aob1:
fld dword ptr [ecx+118]
//db D9 81 18 01 00 00

god_aob2:
fstp dword ptr [ecx+118]
//Alt: db D9 99 18 01 00 00
//-------------------------------------------------------[FREE SYMBOLS]
unregistersymbol(god_aob1)
unregistersymbol(god_aob2)
unregistersymbol(player)"""

