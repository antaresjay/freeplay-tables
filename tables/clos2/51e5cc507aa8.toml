[[cheat]]
id = "campaign-dlc-combat-focus-alucard-dracula"
name = "Campaign/DLC   [Combat Focus]   Alucard/Dracula"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(combat_focus_x,CLOS2.exe,D9 59 14 88 41 1E)
aobscanmodule(combat_focus_y,CLOS2.exe,D8 D9 45 08 D9 59 14 5D C2 04 00)
aobscanmodule(combat_focus_z,CLOS2.exe,D9 59 14 8B E5 5D C2 04 00 DD D9)
alloc(newmem_x,$100)
alloc(newmem_y,$100)
alloc(newmem_z,$100)
label(return_x)
label(return_y)
label(return_z)
registersymbol(combat_focus_x)
registersymbol(combat_focus_y)
registersymbol(combat_focus_z)
newmem_x:
  fstp dword ptr [ecx+14]
  mov [ecx+14],(float)500
  mov [ecx+1E],al
  jmp return_x
combat_focus_x:
  jmp newmem_x
  nop
return_x:
newmem_y:
  fstp dword ptr [ecx+14]
  mov [ecx+14],(float)500
  pop ebp
  ret 0004
  jmp return_y
combat_focus_y+04:
  jmp newmem_y
  nop 2
return_y:
newmem_z:
  fstp dword ptr [ecx+14]
  mov [ecx+14],(float)500
  mov esp,ebp
  jmp return_z
combat_focus_z:
  jmp newmem_z
return_z:
[DISABLE]
dealloc(newmem_x)
dealloc(newmem_y)
dealloc(newmem_z)
unregistersymbol(combat_focus_x)
unregistersymbol(combat_focus_y)
unregistersymbol(combat_focus_z)
combat_focus_x:
  db D9 59 14 88 41 1E
combat_focus_y+04:
  db D9 59 14 5D C2 04 00
combat_focus_z:
  db D9 59 14 8B E5"""

