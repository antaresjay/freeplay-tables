[[cheat]]
id = "3-activate-me-base-adress-for-bux-pointer"
name = "3) Activate me !           Base adress for Bux pointer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : NSGP.exe
  Version: 
  Date   : 2024-03-11
  Author : LIOBOSS

  This script does blah blah blah
}

define(address,BuxUpdater:Update+6d )
define(bytes,48 63 40 20 89 46 20)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,BuxUpdater:Update+6d )
alloc(base_adressbux,8)

label(code)
label(return)


base_adressbux:
dq 0


newmem:

code:
  mov [base_adressbux],rax
  movsxd  rax,dword ptr [rax+20]
  mov [rsi+20],eax
  jmp return

address:
  jmp newmem
  nop 2

return:
registersymbol(base_adressbux)


[DISABLE]

address:
  db bytes

unregistersymbol(base_adressbux)
dealloc(newmem)
dealloc(base_adressbux)"""

