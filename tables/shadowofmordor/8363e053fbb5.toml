[[cheat]]
id = "infinite-focus"
name = "Infinite Focus"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(aob_foc,ShadowOfMordor.exe,F3 0F 11 7B 54 F3 0F 5c c7 0f 14 c0 0f 5a d0) // should be unique
alloc(new_foc,$1000,"ShadowOfMordor.exe"+CC1FBC)

label(cod_foc)
label(ret_foc)

registersymbol(t_foc)
alloc(t_foc,8)
t_foc:
dd 1

new_foc:
  cmp [t_foc],1
  jne ret_foc
  movss xmm7,[rbx+48]
  movss [rbx+44],xmm7

cod_foc:
  movss [rbx+54],xmm7
  jmp ret_foc

aob_foc:
  jmp new_foc
ret_foc:
registersymbol(aob_foc)

[DISABLE]

aob_foc:
  db F3 0F 11 7B 54

unregistersymbol(aob_foc)
dealloc(new_foc)
unregistersymbol(t_foc)
dealloc(t_foc)"""

