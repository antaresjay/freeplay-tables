[[cheat]]
id = "life-base-address-scan-initialization-activate-this-first"
name = "Life Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

registersymbol(Life_basepointer)
registersymbol(Life_update_enable)
registersymbol(Life_set_enable)
registersymbol(Life_lifeset_enable)
registersymbol(Life_invincibilityset_enable)
registersymbol(Life_shieldset_enable)

alloc(Life_basepointer,4)
alloc(Life_update_enable,4)
alloc(Life_set_enable,4)
alloc(Life_lifeset_enable,4)
alloc(Life_invincibilityset_enable,4)
alloc(Life_shieldset_enable,4)


[DISABLE]

unregistersymbol(Life_basepointer)
unregistersymbol(Life_update_enable)
unregistersymbol(Life_set_enable)
unregistersymbol(Life_lifeset_enable)
unregistersymbol(Life_invincibilityset_enable)
unregistersymbol(Life_shieldset_enable)

dealloc(Life_basepointer)
dealloc(Life_update_enable)
dealloc(Life_set_enable)
dealloc(Life_lifeset_enable)
dealloc(Life_invincibilityset_enable)
dealloc(Life_shieldset_enable)"""

[[cheat]]
id = "life-base-address-scan-to-activate-battle-to-update-battle"
name = "Life Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(Life_savedAOB)
label(Life_returnhere)
label(Life_originalcode)
label(Life_exit)

label(Life_update_exit)
label(Life_set_exit)
label(Life_lifeset_exit)
label(Life_invincibilityset_exit)
label(Life_shieldset_exit)

registersymbol(Life_savedAOB)

aobscan(Life_searchedAOB,0F B6 87 8C 00 00 00 85 C0 74 3A)

alloc(Life_newmem,2048) //2kb should be enough
alloc(Life_temp,4)


Life_newmem:
mov [Life_temp], ebx

cmp dword ptr [Life_update_enable], #0
je Life_update_exit
mov [Life_basepointer], edi
Life_update_exit:

cmp dword ptr [Life_set_enable], #0
je Life_set_exit
Life_set_exit:

cmp dword ptr [Life_lifeset_enable], #0
je Life_lifeset_exit
mov ebx, [edi+74]
mov [edi+88], ebx
Life_lifeset_exit:

cmp dword ptr [Life_invincibilityset_enable], #0
je Life_invincibilityset_exit
mov byte ptr [edi+a4], #1
Life_invincibilityset_exit:

cmp dword ptr [Life_shieldset_enable], #0
je Life_shieldset_exit
mov byte ptr [edi+b0], #1
Life_shieldset_exit:

mov ebx, [Life_temp]


Life_originalcode:
db 0F B6 87 8C 00 00 00
//movzx eax,byte ptr [edi+0000008C]


Life_exit:
jmp Life_returnhere


Life_searchedAOB:
Life_savedAOB:
jmp Life_newmem
nop
nop
Life_returnhere:


[DISABLE]
Life_savedAOB:
db 0F B6 87 8C 00 00 00
//movzx eax,byte ptr [edi+0000008C]

unregistersymbol(Life_savedAOB)

dealloc(Life_newmem)
dealloc(Life_temp)"""

