[[cheat]]
id = "magicwall-base-address-scan-initialization-activate-this-first"
name = "MagicWall Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

registersymbol(MagicWall_basepointer)
registersymbol(MagicWall_update_enable)
registersymbol(MagicWall_set_enable)

alloc(MagicWall_basepointer,4)
alloc(MagicWall_update_enable,4)
alloc(MagicWall_set_enable,4)


[DISABLE]

unregistersymbol(MagicWall_basepointer)
unregistersymbol(MagicWall_update_enable)
unregistersymbol(MagicWall_set_enable)

dealloc(MagicWall_basepointer)
dealloc(MagicWall_update_enable)
dealloc(MagicWall_set_enable)"""

[[cheat]]
id = "magicwall-base-address-scan-to-activate-battle-to-update-battle"
name = "MagicWall Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(MagicWall_savedAOB)
label(MagicWall_returnhere)
label(MagicWall_originalcode)
label(MagicWall_exit)

label(MagicWall_update_exit)
label(MagicWall_set_exit)

registersymbol(MagicWall_savedAOB)

aobscan(MagicWall_searchedAOB,D9 42 78 8B 57 50 D9 42 7C)

alloc(MagicWall_newmem,2048) //2kb should be enough


MagicWall_newmem:
cmp dword ptr [MagicWall_update_enable], #0
je MagicWall_update_exit
mov [MagicWall_basepointer], edx
MagicWall_update_exit:

cmp dword ptr [MagicWall_set_enable], #0
je MagicWall_set_exit
fld [edx+78]
fstp [edx+84]
MagicWall_set_exit:


MagicWall_originalcode:
db D9 42 78 8B 57 50
//fld dword ptr [edx+78]
//mov edx,[edi+50]


MagicWall_exit:
jmp MagicWall_returnhere


MagicWall_searchedAOB:
MagicWall_savedAOB:
jmp MagicWall_newmem
nop
MagicWall_returnhere:


[DISABLE]
MagicWall_savedAOB:
db D9 42 78 8B 57 50
//fld dword ptr [edx+78]
//mov edx,[edi+50]

unregistersymbol(MagicWall_savedAOB)

dealloc(MagicWall_newmem)"""

