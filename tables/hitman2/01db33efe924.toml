[[cheat]]
id = "infinite-save-game-normal-and-expert-difficulty"
name = "Infinite Save Game [Normal and Expert Difficulty]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
// 1) allocate 2 KB for our code cave
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

// 2) our custom code: force saves to 63
newmem:
  mov [esi+00000245], 63

originalcode:
// mov [esi+00000245], edi  ; (this is the overwritten instruction)

exit:
  jmp returnhere

// 3) patch the game’s save‑write instruction to jump into our cave
"hitman2.exe"+104C9D:
  jmp newmem
  nop    // pad out to the original 6 bytes
returnhere:

[DISABLE]
// restore original bytes and free our cave
dealloc(newmem)
"hitman2.exe"+104C9D:
  mov [esi+00000245], edi"""

[[cheat]]
id = "infinite-ammo-no-reload"
name = "Infinite Ammo + No Reload"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ True Infinite Clip – AOB Injection }

[ENABLE]
// Locate the instruction that writes the new clip count: mov [esi+0x96], edx
aobscanmodule(ClipPatch, hitman2.exe, 89 96 96 00 00 00)
assert(ClipPatch, 89 96 96 00 00 00)

// Allocate a tiny cave right after it
alloc(ClipCave, 32, ClipPatch)
label(returnHere)

ClipCave:
  // Force clip to 200 every write
  mov edx, 0xC8
  mov [esi+00000096], edx
  jmp returnHere

// Overwrite the original store with a jump into our cave
ClipPatch:
  jmp ClipCave
  nop  // pad out to 6 bytes (orig instr length)

returnHere:

registersymbol(ClipPatch)

[DISABLE]
// Restore original instruction and free our cave
unregistersymbol(ClipPatch)
ClipPatch:
  db 89 96 96 00 00 00
dealloc(ClipCave)"""

