[[cheat]]
id = "place-everywhere"
name = "place everywhere"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048,"hitman2.exe"+3D81AC)
label(returnhere)
label(originalcode)
label(exit)

newmem:


originalcode:
mov [rbx+000000CA],(int)1

exit:
jmp returnhere

"hitman2.exe"+3D81AC:
jmp newmem
nop
returnhere:



[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
"hitman2.exe"+3D81AC:
mov [rbx+000000CA],al
//Alt: db 88 83 CA 00 00 00"""

