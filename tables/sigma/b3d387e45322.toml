type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,NINJA GAIDEN SIGMA.exe,48 8b c4 48 * * * 48 * * * 48 * * * 55 41 54 41 55 41 56 41 57 48 * * * * * * 48 * * * * * * 0f * * * 0f * * * 48 8b 05 * * * * 48 * * 48 * * * 48 8b 15 * * * * 45) // should be unique
alloc(newmem,$1000,INJECT)

label(code)
label(return)

newmem:
  //cmp r10,80
  cmp r9,01
  jne code
  ret
code:
  mov rax,rsp
  mov [rax+10],rbx
  jmp return

INJECT:
  jmp newmem
  nop
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 48 8B C4 48 89 58 10

unregistersymbol(INJECT)
dealloc(newmem)"""

