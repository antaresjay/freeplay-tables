[[cheat]]
id = "player-movement-ctrl-numpad-1"
name = "Player Movement (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Goldfish.exe
// Author            : ndck76
// Executable Version: 2020.3.21.35974
// Game Version      : Build.20170412
// Script Date       : 2026-07-08


define(address,PlayerMovement:Update+323)
define(bytes,F3 0F 10 86 74 03 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,PlayerMovement:Update+323)

label(code)
label(return)
label(data)
registersymbol(data)

newmem:

code:
  mov [data],rsi
  movss xmm0,[rsi+00000374]
  jmp return

data:
  db

address:
  jmp newmem
  nop 3
return:

[DISABLE]

address:
  db bytes
  // movss xmm0,[rsi+00000374]

dealloc(*)
unregistersymbol(*)"""

