[[cheat]]
id = "stage-timer-ctrl-numpad-1"
name = "Stage Timer (Ctrl + Numpad 1)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Matchbox.exe
// Author            : ndck76
// Executable Version: 2022.3.28.44636
// Game Version      : v1.08
// Script Date       : 2025-01-13


define(address,Matchbox.LevelManager:Update+3d)
define(bytes,F3 0F 10 00 F3 0F 5A C0)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Matchbox.LevelManager:Update+3d)

label(code)
label(return)
label(data2)
registersymbol(data2)

newmem:

code:
  mov [data2],rax
  movss xmm0,[rax]
  cvtss2sd xmm0,xmm0
  jmp return

data2:
  db

address:
  jmp newmem
  nop 3
return:

[DISABLE]

address:
  db bytes
  // movss xmm0,[rax]
  // cvtss2sd xmm0,xmm0

dealloc(*)
unregistersymbol(*)"""

