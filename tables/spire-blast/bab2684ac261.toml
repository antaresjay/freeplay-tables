[[cheat]]
id = "infinite-score"
name = "Infinite Score"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

 
 
aobscanmodule(score,GameAssembly.dll,89 42 08 E8 DD E8 2B 00) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

mov eax,#99999999

code:
  mov [edx+08],eax
  call GameAssembly.dll+85DF30
  jmp return

score:
  jmp newmem
  nop 3
return:
registersymbol(score)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
score:
  db 89 42 08 E8 DD E8 2B 00

unregistersymbol(score)
dealloc(newmem)"""

