[[cheat]]
id = "no-spread"
name = "No Spread"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule("UDK.exe"+7A7EBE,UDK.exe,8B 01 8B 90 F8 04 00 00)
alloc(newmem,$1000)
label(code)
label(return)

newmem:
push ecx
mov ecx,[ecx+01D0] //Pawn
test ecx,ecx
je @f
mov [ecx+0644],(float)0  //SpreadAmount
mov [ecx+0648],(float)0 //RevolverSpread
mov [ecx+064C],(float)0 //ShotgunSpread
mov [ecx+0650],(float)0 //SniperSpread
mov [ecx+0654],(float)0 //SubMachineGunSpread

@@:
pop ecx

code:
  mov eax,[ecx]
  mov edx,[eax+000004F8]
  jmp return

"UDK.exe"+7A7EBE:
  jmp newmem
  nop 3
return:
registersymbol("UDK.exe"+7A7EBE)

[DISABLE]

"UDK.exe"+7A7EBE:
  db 8B 01 8B 90 F8 04 00 00

unregistersymbol(*)
dealloc(*)"""

