type = "script"
source = """
[ENABLE]

aobscanmodule(INFJUMP,UDK.exe,F3 0F 11 00 59 C2 08 00 8B 4C 24 0C 0F)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

