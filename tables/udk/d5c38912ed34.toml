type = "script"
source = """
{
notes here for cheat locations within my allocated cheat memory space
//-----memSubsistence+100 = One Hit Kill player hit code
//-----memSubsistence+200 = Weapon/Tool Durability code
//-----memSubsistence+300 = Flashlight/Oxygen code
//-----memSubsistence+400 = Chicken/Rabbit lvl 10 code
//-----memSubsistence+500 = either: Generator or Resources code
//-----memSubsistence+E00 = flag options for scripts
                      E00 = Gun Ammo
                      E10 = Durability
                      E20 = power/mass
                      E30 = fires/woodburner
                      E40 = generator
                      E50 = plantbed
                      E60 = chkn/rab feed
                      E70 = resources cheat
                      E80 = level up chicken/rabbit
                      E90 = one hit kill
                      EA0 = Player takes no damage from enemy
                      EB0 = infinite flashlight
                      EC0 = oxygen bottle never empty
}
[ENABLE]
alloc(memSubsistence,$1000,"UDK.exe") //allocate memory region within 2GB of module
registersymbol(memSubsistence) //ensure memSubsistence can be used outside this script

memSubsistence:
  db F0 0D 10 BE EF //define byte pattern to check allocation

memSubsistence+E00:
dd 0
memSubsistence+E10:
dd 0
memSubsistence+E20:
dd 0
memSubsistence+E30:
dd 0
memSubsistence+E40:
dd 0
