type = "script"
source = """
{ Game   : Choo Choo Survivor.exe
  Version:
  Date   : 2023-06-08
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanregion(pData_MainMenu_Unlock,ChooChooSurvivors.MAINMENU_UNLOCK:BringUpUnlockMenu,ChooChooSurvivors.MAINMENU_UNLOCK:BringUpUnlockMenu+1000,,48 63 4E 78 3B C1) // should be unique
alloc(newmem,$1000,pData_MainMenu_Unlock)

alloc(pBase_MainMenu_Unlock,8)
registersymbol(pBase_MainMenu_Unlock)

label(code)
label(return)

pBase_MainMenu_Unlock:
dd

newmem:

code:
  mov [pBase_MainMenu_Unlock],rsi
  movsxd  rcx,dword ptr [rsi+78]
  cmp eax,ecx
  jmp return

pData_MainMenu_Unlock:
  jmp newmem
  nop
return:
registersymbol(pData_MainMenu_Unlock pBase_MainMenu_Unlock)

[DISABLE]

pData_MainMenu_Unlock:
  db 48 63 4E 78 3B C1

unregistersymbol(*)
dealloc(*)"""

