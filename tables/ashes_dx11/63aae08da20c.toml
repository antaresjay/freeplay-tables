[[cheat]]
id = "resources"
name = "Resources"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Resources,Ashes_DX11.exe,F3 0F 10 06 41 0F 2F C0) // should be unique
alloc(newmem,$1000,"Ashes_DX11.exe"+19FDD7)
alloc(bRes,8)
registersymbol(bRes)
label(code)
label(return)

newmem:

code:
  mov [bRes],rsi
  movss xmm0,[rsi]
  comiss xmm0,xmm8
  jmp return

Resources:
  jmp code
  nop
  nop
  nop
return:
registersymbol(Resources)

[DISABLE]

Resources:
  db F3 0F 10 06 41 0F 2F C0

unregistersymbol(Resources)
dealloc(newmem)
dealloc(bRes)
unregistersymbol(bRes)"""

