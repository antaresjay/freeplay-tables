id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(healthh,LEGOSTARWARSSKYWALKERSAGA_DX11.exe,F3 0F 10 81 C0 04 00 00 C3)
alloc(newmem,$1000,healthh)

label(code)
label(return)

newmem:
cmp [rcx+478],0
je code
cmp [rcx+47c],0
je code
fld [rcx+000004C8]
fstp [rcx+000004C0]
code:
movss xmm0,[rcx+000004C0]
jmp return


healthh:
jmp newmem
nop 3
return:
registersymbol(healthh)

[DISABLE]
healthh:
db F3 0F 10 81 C0 04 00 00
unregistersymbol(healthh)
dealloc(newmem)"""

