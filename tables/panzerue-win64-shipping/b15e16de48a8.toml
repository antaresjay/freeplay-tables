[[cheat]]
id = "full-supply-and-batch-modify-unit-list"
name = "Full Supply And Batch Modify Unit List"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : PanzerUE-Win64-Shipping.exe
  Version: 
  Date   : 2025-10-05
  Author : CannonFodder

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(UnitListExpReadInject,PanzerUE-Win64-Shipping.exe,39 83 90 01 00 00 0F 8C) // should be unique
alloc(newmem,$1000,UnitListExpReadInject)

label(code)
label(return)
label(enemy)
label(skip)
registersymbol(healFlag)
registersymbol(actionFlag)
registersymbol(expFlag)
registersymbol(enemySupplyFlag)
registersymbol(enemyHPFlag)

newmem:
  push rdx
  mov rdx,[rbx+48] //faction
  cmp [rdx+28],#1 //faction id; 1=player, 2=enemy, 3=ally ?
  jne enemy
  mov [rbx+19C],#25//ammo
  mov [rbx+1A0],#200//fuel
  cmp [expFlag],#0
  je @f
  mov [rbx+190],#5000//exp
@@:
  cmp [actionFlag],#0
  je @f
  mov [rbx+194],#2//action points
  mov [rbx+198],#99//move points
  mov [rbx+1AC],#0//has moved
@@:
  cmp [healFlag],#0
  je @f
  mov [rbx+58],#10//full strength
  mov [rbx+1A4],#0//no damaged
enemy:
  cmp [rdx+28],#2 //faction id; 1=player, 2=enemy, 3=ally ?
  jne skip
  cmp [enemySupplyFlag],#0
  je @f
  mov [rbx+19C],#0//ammo
  mov [rbx+1A0],#0//fuel
@@:
  cmp [enemyHPFlag],#0
  je @f
  mov [rbx+1A4],#0//no damaged
  mov [rbx+58],#1//full strength
skip:
  pop rdx
code:
  cmp [rbx+00000190],eax
  jmp return

healFlag:
  dd 0
actionFlag:
  dd 0
expFlag:
  dd 0
enemySupplyFlag:
  dd 0
enemyHPFlag:
  dd 0

UnitListExpReadInject:
  jmp newmem
  nop
return:
registersymbol(UnitListExpReadInject)

[DISABLE]

UnitListExpReadInject:
  db 39 83 90 01 00 00

unregistersymbol(*)
dealloc(newmem)

