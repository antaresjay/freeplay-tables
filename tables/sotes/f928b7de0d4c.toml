[[cheat]]
id = "enable-f10-enable"
name = "Enable (F10:Enable)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(healthAccess_AOB,03 CA 8B 90 68 0A 00 00 8B 80 64 0A 00 00 03 CA)
registersymbol(healthAccess_AOB)
aobscan(healthSub_AOB,03 F0 89 72 54 8B 4C 24 18 5F 5E 5B 85 C9)
registersymbol(healthSub_AOB)

label(pHeros)
registersymbol(pHeros)
label(bUndead)
registersymbol(bUndead)
label(bInfMP)
registersymbol(bInfMP)
label(bOneHitKill)
registersymbol(bOneHitKill)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

label(newmem2)
label(returnhere2)
label(originalcode2)
label(exit2)
label(isHeros2)
label(isNotHeros2)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
mov edx,[eax+a0c]
mov [pHeros+edx*4],eax

//== refill MP
cmp byte ptr [bInfMP],01
jne originalcode
mov edx,[eax+00000A70]
mov [eax+00000A6C],edx
//== done

originalcode:
mov edx,[eax+00000A68]

exit:
jmp returnhere

//=============================================//

newmem2:
add esi,eax
mov [edx+54],esi

mov ecx,[pHeros]
lea ecx,[ecx+a10]
cmp ecx,edx
je isHeros2
mov ecx,[pHeros+4]
lea ecx,[ecx+a10]
cmp ecx,edx
je isHeros2
mov ecx,[pHeros+8]
lea ecx,[ecx+a10]
cmp ecx,edx
je isHeros2
jmp isNotHeros2

isHeros2:
cmp byte ptr [bUndead],01
jne originalcode2
cmp [edx+54],1
jge originalcode2
mov [edx+54],1
jmp originalcode2

isNotHeros2:
cmp byte ptr [bOneHitKill],01
jne originalcode2
mov [edx+54],0
jmp originalcode2

originalcode2:
//add esi,eax
//mov [edx+54],esi

exit2:
jmp returnhere2

///
pHeros:
db 00 00 00 00
db 00 00 00 00
db 00 00 00 00
bUndead:
db 00
bInfMP:
db 00
bOneHitKill:
db 00
///

healthAccess_AOB+2: //"sotes.exe"+1908F7:
jmp newmem
nop
returnhere:

healthSub_AOB: //"sotes.exe"+1B554A:
jmp newmem2
returnhere2:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
healthAccess_AOB+2: //"sotes.exe"+1908F7:
db 8B 90 68 0A 00 00
//Alt: mov edx,[eax+00000A68]
healthSub_AOB: //"sotes.exe"+1B554A:
db 03 F0 89 72 54
//Alt: add esi,eax
//Alt: mov [edx+54],esi
unregistersymbol(healthAccess_AOB)
unregistersymbol(healthSub_AOB)
unregistersymbol(pHeros)
unregistersymbol(bUndead)
unregistersymbol(bInfMP)
unregistersymbol(bOneHitKill)"""

