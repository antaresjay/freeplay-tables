aobscan(health,20 F3 0F 10 45 64)
alloc(newmem,$1000,health)

label(code)
label(return)

newmem:
  mov rax,player_ptr
  mov rax,[rax]
  test rax,rax
  je code
  cmp [rax],rcx
  jne code
  xorpd xmm0,xmm0
  jmp return
