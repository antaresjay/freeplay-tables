type = "script"
source = """
[ENABLE]
// Req: Take damage at least once
aobscan(aobSoldierHealthDamager,83 C4 10 8B 87 14 02 00 00 3D 01 00 00 00 75)

alloc(newmem,2048)

label(aobSoldierHealthDamager_r)
registersymbol(aobSoldierHealthDamager_r)

label(lblSoldierHealthDamager)
label(lblSoldierHealthDamagerSkip)
label(lblSoldierHealthDamagerRet)

label(bEnableGodMode)
registersymbol(bEnableGodMode)

newmem:
bEnableGodMode:
dd 1

lblSoldierHealthDamager:
// add esp,10             // Original code
// mov eax,[edi+00000214] // Original code
db 83 C4 10 8B 87 14 02 00 00
cmp dword ptr [bEnableGodMode],1
jne short lblSoldierHealthDamagerSkip
mov dword ptr [ebp+0c],0
lblSoldierHealthDamagerSkip:
jmp lblSoldierHealthDamagerRet

aobSoldierHealthDamager:
aobSoldierHealthDamager_r:
jmp lblSoldierHealthDamager
nop
nop
nop
nop
lblSoldierHealthDamagerRet:

[DISABLE]
aobSoldierHealthDamager_r:
//Alt: add esp,10
//Alt: mov eax,[edi+00000214]
db 83 C4 10 8B 87 14 02 00 00

unregistersymbol(aobSoldierHealthDamager_r)

unregistersymbol(bEnableGodMode)

dealloc(newmem)"""

