[[cheat]]
id = "battle-manager"
name = "Battle Manager"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : TalesofWasteLand.exe
  Version: Demo
  Date   : 2025-12-29
  Author : BabyGroot

  This script does blah blah blah
}

define(address,BattleManager:Update+17)
define(bytes,48 8B 86 50 01 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,BattleManager:Update+17)

label(code)
label(return)

alloc(BatMan,8)
registersymbol(BatMan)

newmem:

code:
  mov [BatMan],rsi
  mov rax,[rsi+00000150]
  jmp return

BatMan:
dq

address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  db bytes
  // mov rax,[rsi+00000150]

dealloc(newmem)
dealloc(BatMan)
unregistersymbol(BatMan)"""

