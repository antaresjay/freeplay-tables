[[cheat]]
id = "super-hero-infinte-money"
name = "Super Hero / Infinte Money"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
define(MONEY,legoemmet.exe+85FFE4)

[ENABLE]

assert(MONEY,89 4D 00 49 45 04 5E 5D C3 CC CC CC 8B 44 24 04 85 C0)

alloc(newmem,2048)
label(returnhere)
label(exit)

newmem:
mov ecx,3B9ACA00
mov [ebp+00],ecx
mov [ebp+04],eax

exit:
jmp returnhere

"legoemmet.exe"+85FFE4:
jmp newmem
nop
returnhere:
 
[DISABLE]
dealloc(newmem)
"legoemmet.exe"+85FFE4:
mov [ebp+00],ecx
mov [ebp+04],eax
//Alt: db 89 4D 00 89 45 04"""

