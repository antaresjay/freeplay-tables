_MonUnitAmmo:
 push ebx

 cmp dword ptr [iEnableUAM],0
 je _ExitUAM                       // Jump if feature is disabled

 mov ebx,[eax+40]
 mov [eax+34],ebx

_ExitUAM:
 pop ebx

 mov eax,[eax+34]                  // Original code (upd AP)
 test eax,eax                      // Original code
 jmp _BackUAM                      // Back to main code

