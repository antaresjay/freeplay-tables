[[cheat]]
id = "x-arma-tactics-v1-2652-rain-script-v1-0-part-1"
name = "[X] <== Arma Tactics v1.2652 RAiN Script v1.0 (Part 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
===========================================
 Game Title    : Arma Tacticss
 Game Version  : 1.2652
 Game Sponsor  : RAiN
 Process Name  : ArmaTactics.exe
 Script Version: 1.0 (Part 1)
 CE Version    : 6.3
 Release date  : 15-Oct-2013
 Author        : Recifense
 History:
 15-Oct-13: First Release
 Features:
 - Unlimited AP
===========================================
}

//=========================================
// Definitions
define(LUDO,"ArmaTactics.exe")

//=========================================
[ENABLE]
//=========================================
// Find out codes

AOBScan(aobMSUN,8b 58 48 8b c3 85 c0 7f 04 d9 ee eb 2c 89 5d f4 83 fb 01 74)
AOBScan(aobMUAP,89 43 48 8b 43 28 85 c0 75 20 8b 43 48 85 c0 75 19 d9 05 ??)

//=========================================
alloc(MyCode,4096,LUDO)
//=========================================
// Declaration section
label(_MonSelUnit)
label(_BackMSU)
label(_ExitMSU)
label(_MonUnitAP)
label(_BackMUA)
label(_ExitMUA)
label(iEnableUAP)
label(pUnit)

//=========================================
// Registering Symbols
registersymbol(MyCode)
registersymbol(iEnableUAP)
registersymbol(pUnit)
registersymbol(aobMSUN)
registersymbol(aobMUAP)

//=========================================
MyCode:
//=========================================
// On Selecting a Unit
_MonSelUnit:
 mov [pUnit],eax

_ExitMSU:
 mov ebx,[eax+48]                  // Original code (rd AP)
 mov eax,ebx                       // Original code
 jmp _BackMSU                      // Back to main code

//=========================================
// When changing AP
_MonUnitAP:
 cmp dword ptr [iEnableUAP],0
 je _ExitMUA                       // Jump if feature is disabled

 cmp dword ptr [ebx+40],0
 jne _ExitMUA

 mov eax,[ebx+4c]

_ExitMUA:
 mov [ebx+48],eax                  // Original code (upd AP)
 mov eax,[ebx+28]                  // Original code
 jmp _BackMUA                      // Back to main code

//=========================================
 db '==========================>'
 db 'CE6.3 Script by Recifense 101513'
//=========================================
// Variables
iEnableUAP:
 dd 0
pUnit:
 dd 0

//=========================================
// Hacking Points
aobMSUN:
 jmp _MonSelUnit
_BackMSU:

aobMUAP:
 jmp _MonUnitAP
 nop
_BackMUA:

//=========================================
// Script for Restoring Original Codes
[DISABLE]
aobMSUN:
// mov ebx,[eax+48]
// mov eax,ebx
 db 8b 58 48 8b c3

aobMUAP:
// mov [ebx+48],eax
// mov eax,[ebx+28]
 db 89 43 48 8b 43 28

//=========================================
// Unregistering Symbols
unregistersymbol(MyCode)
unregistersymbol(iEnableUAP)
unregistersymbol(pUnit)
unregistersymbol(aobMSUN)
unregistersymbol(aobMUAP)

//=========================================
dealloc(MyCode)
//============= Scripts End ===============

// ****************************************
// NOTES
// ****************************************
{
}"""

