iEnableUAM:
 dd 0
iEnableGMD:
 dd 0

//=========================================
// Hacking Points
aobMUAO:
 jmp _MonUnitAmmo
_BackUAM:

aobGDMD:
 jmp _GodMode
 nop
_BackGMD:

//=========================================
// Script for Restoring Original Codes
[DISABLE]
aobMUAO:
// mov eax,[eax+34]
// test eax,eax
 db 8b 40 34 85 c0

aobGDMD:
// fld dword ptr [edi+2C]
// fld dword ptr [ebp+0C]
 db d9 47 2c d9 45 0c

//=========================================
