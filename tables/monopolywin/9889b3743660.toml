[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(MoneyReadAOB,monopolywin.exe,8B 48 1C 0F BF 45 E8) // should be unique
registersymbol(MoneyReadAOB)
alloc(newmem,8192,MoneyReadAOB)

///
label(MoneyPtr)
registersymbol(MoneyPtr)
label(returnhere)
label(originalcode)
label(exit)

///
newmem:
  mov [MoneyPtr],eax
  
originalcode:
  mov ecx,[eax+1C]
  movsx eax,word ptr [ebp-18]
  
exit:
  jmp returnhere

MoneyPtr:
dq 0

MoneyReadAOB:
  jmp newmem
  nop
  nop
  returnhere:
  
[DISABLE]

MoneyReadAOB:
db 8B 48 1C 0F BF 45 E8

unregistersymbol(MoneyReadAOB)
unregistersymbol(MoneyPtr)
dealloc(newmem)"""

