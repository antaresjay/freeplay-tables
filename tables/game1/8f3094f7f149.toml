[[cheat]]
id = "health-editor"
name = "Health Editor"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : game1.exe
// Author            : ndck76
// Game Version      : v1.1.1
// Script Date       : 2025-07-29


[ENABLE]

aobscanmodule(hp1,$process,8Bxx413Bxx458Bxx440F) // should be unique
alloc(newmem,$1000,hp1)
alloc(data,8)
alloc(hp1bkp,5)
registersymbol(data)
registersymbol(hp1)
registersymbol(hp1bkp)
label(code)
label(return)

hp1bkp:
  readmem(hp1,5)

newmem:
  mov [data],rcx

code:
  readmem(hp1,5)
  jmp return

hp1:
  jmp newmem
return:

[DISABLE]

hp1:
  readmem(hp1bkp,5)

unregistersymbol(*)
dealloc(*)"""

