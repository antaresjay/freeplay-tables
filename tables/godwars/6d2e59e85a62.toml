[[cheat]]
id = "godmode-ohk"
name = "Godmode + OHK"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : godwars.exe
  Version: 
  Date   : 2019-06-15
  Author : Anjinggila

  This script does blah blah blah
}

[ENABLE]

aobscan(HEALTH1,41 89 87 94 01 00 00) // should be unique
alloc(newmem,$1000,0076C169)

label(code)
label(return)
label(playerHealth)
label(enemyHealth)

newmem:
  cmp [r15+00000134],0
  je playerHealth
  cmp [r15+00000134],1
  je enemyHealth
  jmp code

playerHealth:
  mov [r15+00000194],#999
  jmp return

enemyHealth:
  mov [r15+00000194],#0
  jmp return

code:
  mov [r15+00000194],eax
  jmp return

HEALTH1:
  jmp newmem
  nop
  nop
return:
registersymbol(HEALTH1)

[DISABLE]

HEALTH1:
  db 41 89 87 94 01 00 00

unregistersymbol(HEALTH1)
dealloc(newmem)"""

