source = """
[ENABLE]
aobscanmodule(plot,$process,48 8B ?? ?? ?? 00 00 48 85 C9 74 ?? E8 ?? ?? ?? ?? 85 C0 7E ?? B0 01 48 83 ?? ?? C3 CC)
alloc(newmem,$1000,plot)

label(plotPtr)
label(plotBkp)
label(return)

newmem:
plotBkp:
  readmem(plot,7)
  mov rax,plotPtr
  mov [rax],rcx
  xor rax,rax
