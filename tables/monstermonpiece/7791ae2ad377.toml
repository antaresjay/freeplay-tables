id = "battle-stats-base-address-scan-initialization-activate-this-first"
name = "Battle Stats Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(battlestats_basepointer)
