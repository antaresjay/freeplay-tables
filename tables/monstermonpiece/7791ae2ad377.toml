[[cheat]]
id = "first-crush-rub-stats-base-address-scan-to-activate-first-crush-rub-to-update-first-crush-rub"
name = "First Crush Rub Stats Base Address Scan (To Activate: First Crush Rub, To Update: First Crush Rub)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(firstcrushrubstats_savedAOB)
label(firstcrushrubstats_returnhere)
label(firstcrushrubstats_originalcode)
label(firstcrushrubstats_exit)

label(firstcrushrubstats_update_exit)
label(firstcrushrubstats_set_exit)
label(firstcrushrubstats_timeset_exit)

registersymbol(firstcrushrubstats_savedAOB)

//MonsterMonpiece.exe+E6267 - FF 76 10              - push [esi+10]
//MonsterMonpiece.exe+E626A - E8 915C0400           - call MonsterMonpiece.exe+12BF00
// Accesses Tension Gauge
//MonsterMonpiece.exe+E626F - F3 0F10 96 D4130000   - movss xmm2,[esi+000013D4]
//MonsterMonpiece.exe+E6277 - 83 C4 04              - add esp,04
//MonsterMonpiece.exe+E627A - 85 C0                 - test eax,eax
//MonsterMonpiece.exe+E627C - B9 01000000           - mov ecx,00000001
aobscan(firstcrushrubstats_searchedAOB, F3 0F 10 96 D4 13 00 00 83 C4 04)

alloc(firstcrushrubstats_newmem, 2048, firstcrushrubstats_searchedAOB)
alloc(firstcrushrubstats_temp1, 4, firstcrushrubstats_searchedAOB)
alloc(firstcrushrubstats_temp2, 4, firstcrushrubstats_searchedAOB)
alloc(firstcrushrubstats_temp3, 4, firstcrushrubstats_searchedAOB)
alloc(firstcrushrubstats_temp4, 4, firstcrushrubstats_searchedAOB)


firstcrushrubstats_newmem:
mov [firstcrushrubstats_temp1], eax
mov [firstcrushrubstats_temp2], ebx
mov [firstcrushrubstats_temp3], ecx
mov [firstcrushrubstats_temp4], edx

cmp dword ptr [firstcrushrubstats_update_enable], #0
je firstcrushrubstats_update_exit
mov [firstcrushrubstats_basepointer], esi
firstcrushrubstats_update_exit:

cmp dword ptr [firstcrushrubstats_set_enable], #0
je firstcrushrubstats_set_exit
firstcrushrubstats_set_exit:

cmp dword ptr [firstcrushrubstats_timeset_enable], #0
je firstcrushrubstats_timeset_exit
mov [esi+1430], #999999999
firstcrushrubstats_timeset_exit:

mov eax, [firstcrushrubstats_temp1]
mov ebx, [firstcrushrubstats_temp2]
mov ecx, [firstcrushrubstats_temp3]
mov edx, [firstcrushrubstats_temp4]


firstcrushrubstats_originalcode:
db F3 0F 10 96 D4 13 00 00
//movss xmm2,[esi+000013D4]


firstcrushrubstats_exit:
jmp firstcrushrubstats_returnhere


firstcrushrubstats_searchedAOB:
firstcrushrubstats_savedAOB:
jmp firstcrushrubstats_newmem
nop
nop
nop
firstcrushrubstats_returnhere:


[DISABLE]
firstcrushrubstats_savedAOB:
db F3 0F 10 96 D4 13 00 00
//movss xmm2,[esi+000013D4]

unregistersymbol(firstcrushrubstats_savedAOB)

dealloc(firstcrushrubstats_newmem)
dealloc(firstcrushrubstats_temp1)
dealloc(firstcrushrubstats_temp2)
dealloc(firstcrushrubstats_temp3)
dealloc(firstcrushrubstats_temp4)"""

