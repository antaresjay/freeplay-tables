registersymbol(battlestats_durabilityset_enable)
registersymbol(battlestats_enemymanaset_enable)
registersymbol(battlestats_enemydurabilityset_enable)

alloc(battlestats_basepointer, 4)
alloc(battlestats_enemy_basepointer, 4)
alloc(battlestats_update_enable, 4)
alloc(battlestats_set_enable, 4)
alloc(battlestats_manaset_enable, 4)
alloc(battlestats_durabilityset_enable, 4)
alloc(battlestats_enemymanaset_enable, 4)
alloc(battlestats_enemydurabilityset_enable, 4)


[DISABLE]
unregistersymbol(battlestats_basepointer)
unregistersymbol(battlestats_enemy_basepointer)
unregistersymbol(battlestats_update_enable)
unregistersymbol(battlestats_set_enable)
unregistersymbol(battlestats_manaset_enable)
unregistersymbol(battlestats_durabilityset_enable)
unregistersymbol(battlestats_enemymanaset_enable)
unregistersymbol(battlestats_enemydurabilityset_enable)

dealloc(battlestats_basepointer)
dealloc(battlestats_enemy_basepointer)
dealloc(battlestats_update_enable)
dealloc(battlestats_set_enable)
dealloc(battlestats_manaset_enable)
dealloc(battlestats_durabilityset_enable)
dealloc(battlestats_enemymanaset_enable)
dealloc(battlestats_enemydurabilityset_enable)"""

[[cheat]]
id = "battle-stats-base-address-scan-to-activate-battle-to-update-battle"
name = "Battle Stats Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(battlestats_savedAOB)
label(battlestats_returnhere)
label(battlestats_originalcode)
label(battlestats_exit)

label(battlestats_update_exit)
label(battlestats_set_exit)
label(battlestats_manaset_exit)
label(battlestats_durabilityset_exit)
label(battlestats_enemyset_entry)
label(battlestats_enemyupdate_exit)
label(battlestats_enemymanaset_exit)
label(battlestats_enemydurabilityset_exit)

registersymbol(battlestats_savedAOB)

//MonsterMonpiece.CAsyncReader::GetPin+7B62A - 5D                    - pop ebp
//MonsterMonpiece.CAsyncReader::GetPin+7B62B - C3                    - ret
// Accesses Mana
//MonsterMonpiece.CAsyncReader::GetPin+7B62C - 0FBE 40 04            - movsx eax,byte ptr [eax+04]
//MonsterMonpiece.CAsyncReader::GetPin+7B630 - 5D                    - pop ebp
//MonsterMonpiece.CAsyncReader::GetPin+7B631 - C3                    - ret
aobscan(battlestats_searchedAOB, 0F BE 40 04 5D C3)

alloc(battlestats_newmem, 2048, battlestats_searchedAOB)
alloc(battlestats_temp1, 4, battlestats_searchedAOB)
alloc(battlestats_temp2, 4, battlestats_searchedAOB)
alloc(battlestats_temp3, 4, battlestats_searchedAOB)
alloc(battlestats_temp4, 4, battlestats_searchedAOB)


battlestats_newmem:
mov [battlestats_temp1], eax
mov [battlestats_temp2], ebx
mov [battlestats_temp3], ecx
mov [battlestats_temp4], edx

cmp dword ptr [eax], #0
jne battlestats_enemyset_entry

cmp dword ptr [battlestats_update_enable], #0
je battlestats_update_exit
mov [battlestats_basepointer], eax
battlestats_update_exit:

cmp dword ptr [battlestats_set_enable], #0
je battlestats_set_exit
battlestats_set_exit:

cmp dword ptr [battlestats_manaset_enable], #0
je battlestats_manaset_exit
mov bl, [eax+5]
mov byte ptr [eax+4], bl
battlestats_manaset_exit:

cmp dword ptr [battlestats_durabilityset_enable], #0
je battlestats_durabilityset_exit
mov bl, [eax+8]
mov byte ptr [eax+7], bl
battlestats_durabilityset_exit:

jmp battlestats_enemydurabilityset_exit

battlestats_enemyset_entry:
cmp dword ptr [battlestats_update_enable], #0
je battlestats_enemyupdate_exit
mov [battlestats_enemy_basepointer], eax
battlestats_enemyupdate_exit:

cmp dword ptr [battlestats_enemymanaset_enable], #0
je battlestats_enemymanaset_exit
mov byte ptr [eax+4], #0
battlestats_enemymanaset_exit:

cmp dword ptr [battlestats_enemydurabilityset_enable], #0
je battlestats_enemydurabilityset_exit
cmp byte ptr [battlestats_enemydurabilityset_enable], #1
jl battlestats_enemydurabilityset_exit
mov byte ptr [eax+7], #1
battlestats_enemydurabilityset_exit:


mov eax, [battlestats_temp1]
mov ebx, [battlestats_temp2]
mov ecx, [battlestats_temp3]
mov edx, [battlestats_temp4]


battlestats_originalcode:
db 0F BE 40 04 5D
//movsx eax,byte ptr [eax+04]
//pop ebp


battlestats_exit:
jmp battlestats_returnhere


battlestats_searchedAOB:
battlestats_savedAOB:
jmp battlestats_newmem
battlestats_returnhere:


[DISABLE]
battlestats_savedAOB:
db 0F BE 40 04 5D
//movsx eax,byte ptr [eax+04]
//pop ebp

unregistersymbol(battlestats_savedAOB)

dealloc(battlestats_newmem)
dealloc(battlestats_temp1)
dealloc(battlestats_temp2)
dealloc(battlestats_temp3)
dealloc(battlestats_temp4)"""

