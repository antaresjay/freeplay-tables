[[cheat]]
id = "health-ohk"
name = "Health + OHK"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(health,D9 47 10 D9 5D F4 D9 45 F4 DE E9) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  cmp dword ptr [esi+22],0
  jne code // player skips sub

  //fsub st(1),st(0)
  fstp st(1) // get rid of current health (before sub)
  fldz // new health, 0
  fxch st(1) // make sure things are in the expected order
code:
  fstp st(0) // get rid of damage
  sub esp,04
  jmp return

health+9:
  jmp newmem
return:
registersymbol(health)

[DISABLE]

health+9:
  db DE E9 83 EC 04

unregistersymbol(health)
dealloc(newmem)

{
