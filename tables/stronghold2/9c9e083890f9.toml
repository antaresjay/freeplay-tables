[[cheat]]
id = "teleport"
name = "Teleport"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(teleport,Stronghold2.exe,CC CC 55 8B EC 51 8B 45 08 D9 01 D8 20 D9 5D FC) // should be unique
alloc(newmem,$100)
registersymbol(teleport tele)
label(baseMouseCoordinate tele)
label(return)
Stronghold2.exe+DB8360:
baseMouseCoordinate:

teleport+09:
  jmp newmem
  nop 2
return:

newmem:
  cmp [tele],01
  je @f
  fld [baseMouseCoordinate]
  fstp [ecx]
  fld [baseMouseCoordinate+8]
  fstp [ecx+4]
  @@:
  fld dword ptr [ecx]
  fsub dword ptr [eax]
  fstp dword ptr [ebp-04]
  jmp return
tele:
  dd 00
[DISABLE]

teleport+09:
  db D9 01 D8 20 D9 5D FC

unregistersymbol(teleport)
dealloc(newmem)"""

