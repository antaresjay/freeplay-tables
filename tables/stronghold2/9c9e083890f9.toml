[[cheat]]
id = "gold"
name = "Gold"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(gold,Stronghold2.exe,D9 87 10 10 00 00 D9 9D)
alloc(newmem,$100)

label(code)
label(return)

newmem:

code:
  fld dword ptr [limit]
  jmp return
limit:
  dd (float)10000
gold:
  jmp newmem
  nop
return:
registersymbol(gold)

[DISABLE]

gold:
  db D9 87 10 10 00 00

unregistersymbol(gold)
dealloc(newmem)"""

