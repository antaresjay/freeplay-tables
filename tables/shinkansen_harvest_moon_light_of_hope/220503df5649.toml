alloc(SaveData_update_enable, 4)
alloc(SaveData_set_enable, 4)
alloc(SaveData_staminaset_enable, 4)
alloc(SaveData_conditionset_enable, 4)
alloc(SaveData_goldset_enable, 4)
alloc(SaveData_capacityset_enable, 4)
alloc(SaveData_quantityset_enable, 4)
alloc(SaveData_festivalset_enable, 4)


[DISABLE]
unregistersymbol(SaveData_basepointer)
unregistersymbol(SaveData_update_enable)
unregistersymbol(SaveData_set_enable)
unregistersymbol(SaveData_staminaset_enable)
unregistersymbol(SaveData_conditionset_enable)
unregistersymbol(SaveData_goldset_enable)
unregistersymbol(SaveData_capacityset_enable)
unregistersymbol(SaveData_quantityset_enable)
unregistersymbol(SaveData_festivalset_enable)

dealloc(SaveData_basepointer)
dealloc(SaveData_update_enable)
dealloc(SaveData_set_enable)
dealloc(SaveData_staminaset_enable)
