[[cheat]]
id = "savedata-base-address-scan-to-activate-play-level-to-update-play-level"
name = "SaveData Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(SaveData_savedAOB)
label(SaveData_returnhere)
label(SaveData_originalcode)
label(SaveData_exit)

label(SaveData_update_exit)
label(SaveData_set_exit)
label(SaveData_staminaset_exit)
label(SaveData_conditionset_exit)
label(SaveData_goldset_exit)
label(SaveData_capacityset_exit)
label(SaveData_quantityset_exit)
label(SaveData_quantityset_entry)
label(SaveData_festivalset_exit)

registersymbol(SaveData_savedAOB)

//053CCF7B - 39 09                 - cmp [ecx],ecx
//053CCF7D - 8B 40 10              - mov eax,[eax+10]
// EventManager:ReactionCheck+980
//053CCF80 - 8B C8                 - mov ecx,eax
//053CCF82 - 39 09                 - cmp [ecx],ecx
//053CCF84 - 8B 40 08              - mov eax,[eax+08]
//053CCF87 - 89 85 C0F3FFFF        - mov [ebp-00000C40],eax
//053CCF8D - E8 8EA6F8FF           - call 05357620
//053CCF92 - 8B C8                 - mov ecx,eax
aobscan(SaveData_searchedAOB, 8B C8 39 09 8B 40 08 89 85 C0 F3 FF FF)

alloc(SaveData_newmem, 2048, SaveData_searchedAOB)
alloc(SaveData_temp1, 4, SaveData_searchedAOB)
alloc(SaveData_temp2, 4, SaveData_searchedAOB)
alloc(SaveData_temp3, 4, SaveData_searchedAOB)
alloc(SaveData_temp4, 4, SaveData_searchedAOB)
alloc(SaveData_temp5, 4, SaveData_searchedAOB)


SaveData_newmem:
mov [SaveData_temp1], eax
mov [SaveData_temp2], ebx
mov [SaveData_temp3], ecx
mov [SaveData_temp4], edx

cmp dword ptr [SaveData_update_enable], #0
je SaveData_update_exit
mov [SaveData_basepointer], eax
SaveData_update_exit:

cmp dword ptr [SaveData_set_enable], #0
je SaveData_set_exit
SaveData_set_exit:

cmp dword ptr [SaveData_staminaset_enable], #0
je SaveData_staminaset_exit
mov ebx, [eax+18]
test ebx, ebx
je SaveData_staminaset_exit
mov ecx, [ebx+8]
mov [ebx+c], ecx
SaveData_staminaset_exit:

cmp dword ptr [SaveData_conditionset_enable], #0
je SaveData_conditionset_exit
mov ebx, [eax+18]
test ebx, ebx
je SaveData_conditionset_exit
mov [ebx+14], #0
SaveData_conditionset_exit:

cmp dword ptr [SaveData_goldset_enable], #0
je SaveData_goldset_exit
mov ebx, [eax+18]
test ebx, ebx
je SaveData_goldset_exit
mov [ebx+10], #9999999
SaveData_goldset_exit:

cmp dword ptr [SaveData_capacityset_enable], #0
je SaveData_capacityset_exit
mov ebx, [eax+10]
test ebx, ebx
je SaveData_capacityset_exit
mov [ebx+24], #9999999
SaveData_capacityset_exit:

cmp dword ptr [SaveData_quantityset_enable], #0
je SaveData_quantityset_exit
mov edx, 0
mov ebx, [eax+10]
test ebx, ebx
je SaveData_quantityset_exit
mov ebx, [ebx+8]
test ebx, ebx
je SaveData_quantityset_exit
mov ebx, [ebx+8]
test ebx, ebx
je SaveData_quantityset_exit
mov ecx, [ebx+c]
test ecx, ecx
je SaveData_quantityset_exit
SaveData_quantityset_entry:
mov [ebx+edx*4+10], #99
inc edx
cmp ecx, edx
je SaveData_quantityset_exit
jmp SaveData_quantityset_entry
SaveData_quantityset_exit:

cmp dword ptr [SaveData_festivalset_enable], #0
je SaveData_festivalset_exit
mov ebx, [eax+10]
test ebx, ebx
je SaveData_festivalset_exit
mov [ebx+28], #9999999
SaveData_festivalset_exit:

mov eax, [SaveData_temp1]
mov ebx, [SaveData_temp2]
mov ecx, [SaveData_temp3]
mov edx, [SaveData_temp4]


SaveData_originalcode:
db 8B C8 39 09 8B 40 08
//mov ecx,eax
//cmp [ecx],ecx
//mov eax,[eax+08]


SaveData_exit:
jmp SaveData_returnhere


SaveData_searchedAOB:
SaveData_savedAOB:
jmp SaveData_newmem
nop
nop
SaveData_returnhere:


[DISABLE]
SaveData_savedAOB:
db 8B C8 39 09 8B 40 08
//mov ecx,eax
//cmp [ecx],ecx
//mov eax,[eax+08]

unregistersymbol(SaveData_savedAOB)

dealloc(SaveData_newmem)
dealloc(SaveData_temp1)
dealloc(SaveData_temp2)
dealloc(SaveData_temp3)
dealloc(SaveData_temp4)
dealloc(SaveData_temp5)"""

