source = """
[ENABLE]
// AMMO/HP/SHIELD ====================================================
aobscanmodule(GetMaxAmmoAOB,Borderlands3.exe,F3 0F 11 83 AC 00 00 00 48 83)
alloc(GetMaxAmmoMEM,512,GetMaxAmmoAOB)
label(return)
label(_slot)
label(fone)
label(_flags)
registersymbol(_slot)
registersymbol(_flags)
registersymbol(GetMaxAmmoAOB)


GetMaxAmmoAOB:
  jmp GetMaxAmmoMEM
  nop 3
return:

GetMaxAmmoMEM:
  movss [rbx+000000AC],xmm0
  push rax
  push rdx
  push rcx
  mov eax,[rsp+138]
  cmp eax,00
  jne @exit
  mov [_slot],rbx

// Loop Stats
  mov ecx,09
@lp:
  mov eax,09
  sub eax,ecx
  mov edx,eax
  lea rdx,[_flags]
  cmp byte ptr [rdx+rax],01
  jl @continue
  xorps xmm10,xmm10
  cmp byte ptr [rdx+rax],01
  jne @nosubtract
  movss xmm10,[fone]
@nosubtract:
  imul eax,F8
  lea rdx,[rbx+eax]
  test rdx,rdx
  je @continue
  movss xmm0,[rdx+000000AC]
  comiss xmm0,[fone]
  jle @continue
  subss xmm0,xmm10
  movss [rdx+000000A0],xmm0
@continue:
  loop @lp

@exit:
  xorps xmm10,xmm10
  pop rcx
  pop rdx
  pop rax
  jmp return

_flags:
  dq 0 0
_slot:
  dq 0
fone:
  dd (float)1.0


// CURRENCY ==========================================================
