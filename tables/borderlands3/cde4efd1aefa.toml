registersymbol(_currency)


GetCurrencyAOB:
  jmp GetCurrencyMEM
GetCurrencyRET:

GetCurrencyMEM:
  test rax,rax
  jne @f
  xor eax,eax
  ret
@@:
  push rax
  mov [_goldenkeys],rax
  test r13,r13
  je @f
  mov rax,[r13+00000228]
  test rax,rax
  je @f
  mov [_currency],rax
@@:
  pop rax
  mov eax,[rax+08]
  ret

_goldenkeys:
  dq 0
_currency:
  dq 0


[DISABLE]
