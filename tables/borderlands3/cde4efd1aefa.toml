[[cheat]]
id = "unrandomizer-2"
name = "Unrandomizer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(random,ucrtbase.dll,00 8B C1 48 83 C4 28)
alloc(newmem,$1000,random)

label(code)
label(return)
label(randomPtr)

newmem:
  mov rax,randomPtr
  cmp byte ptr [rax],1
  jne code
  mov ecx,dword ptr [rax+1]
code:
  mov eax,ecx
  add rsp,28
  jmp return

randomPtr:
  dq 0

random+01:
  jmp newmem
  nop
return:
registersymbol(random)
registersymbol(randomPtr)

[DISABLE]
random+01:
  db 8B C1 48 83 C4 28
unregistersymbol(random)
unregistersymbol(randomPtr)
dealloc(newmem)"""

