source = """
//Finds the RNG-ish roll used to decide item rarity.
//How this value is translated depends on the source!
//The same value might be a legendary from a boss, but ammo in a chest.
//So using the same drop while checking helps lots.
//(Check the FearlessRevolution thread for more info.)

//The game jumps to ucrtbase.rand shortly before doing the magic.
/*
ucrtbase.rand   - 48 83 EC 28           - sub rsp,28 { 40 }
ucrtbase.rand+4 - E8 2B2A0000           - call ucrtbase.localeconv+154
ucrtbase.rand+9 - 69 48 28 FD430300     - imul ecx,[rax+28],000343FD { (0) }
ucrtbase.rand+10- 81 C1 C39E2600        - add ecx,00269EC3 { 2531011 }
ucrtbase.rand+16- 89 48 28              - mov [rax+28],ecx
ucrtbase.rand+19- C1 E9 10              - shr ecx,10 { 16 }
ucrtbase.rand+1C- 81 E1 FF7F0000        - and ecx,00007FFF { 32767 }
ucrtbase.rand+22- 8B C1                 - mov eax,ecx
ucrtbase.rand+24- 48 83 C4 28           - add rsp,28 { 40 }
ucrtbase.rand+28- C3                    - ret
*/
//Finding a call to rand is a no-go, it's spammed even in the escape menu.
//So "find what accesses this address" on the ret.
//CE will list all the return locations!
//Find the right one when you open a locker or something.
//It'll likely have more than one run.  2 if it's ammo, etc.

[ENABLE]

aobscanmodule(applyrarity2,Borderlands3.exe,45 8B C5 66 0F 6E C0) // should be unique
alloc(newmem,$1000,applyrarity2)

label(code)
label(return)

globalalloc(_lootvalue2,4) //Allocate some memory for the override.

_lootvalue2:
db FF 7F 00 00
//Max RNG result, legendaries from sources that can give them.

newmem:

code:
  //cmp RBP,8CDC00 //Check this value.
  //jl skip //Skip over the override if something?
  //comiss xmm8,[_comparevalue] //Check this value.
  //comisd xmm2,xmm15 //Check this value.
  cmp r11,5 //Check which type of roll the game is doing.
  jne skip //Skip the override if it's not the right type.
  //cmp r11,6 //Some DLC pools seem to use type 6.
  //jg skip
  mov eax,[_lootvalue2] //Legendaries!

skip:
  //Original code.
  mov r8d,r13d
  movd xmm0,eax
  jmp return

applyrarity2:
  jmp newmem
  nop 2
return:
