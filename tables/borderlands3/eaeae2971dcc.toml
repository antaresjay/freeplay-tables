[[cheat]]
id = "find-coordinates-teleport"
name = "Find Coordinates / Teleport"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
//X and Y are both floats.
//X gets higher as you move up in the map (fixed minimap rotation)?
//Y is left and right in the map.
//Y is centered in the map itself so find X instead first, then +4 for Y.

//Sanctuary's fast travel station (from other maps or title screen)...
//Y:14850
//X:9288.970703
//Z:-709.8500366
//In memory that's in a row, so...
//00 08 68 46 E2 23 11 46 67 76 31 C4

//It was in 4xxxxxxx for me, likely different but it's not in 00xxxxxx.
//I attached to the first/lowest opcode reading while in the escape menu.

[ENABLE]

aobscanmodule(readxy,Borderlands3.exe,F9 48 85 C0 74 26 0F 10 88 20 02 00 00) // should be unique
alloc(newmem,$1000,readxy)

label(code)
label(return)

globalalloc(_coordbase,8) //Allocate some memory for the address, 64-bit.

newmem:

code:
  //mov [_coordbase],rax //Copy the base address into our memory.
  //Workaround needed for 64-bit limitations.
  push rbx //Free a register.
  mov rbx,_coordbase //Make it hold our allocated address.
  mov [rbx],rax //Copy our target value there.
  pop rbx //Fix stuff.
  //Back to normal stuff.
  movups xmm1,[rax+00000220]
  jmp return

readxy+06:
  jmp newmem
  nop 2
return:
registersymbol(readxy)

[DISABLE]

readxy+06:
  db 0F 10 88 20 02 00 00

unregistersymbol(readxy)
