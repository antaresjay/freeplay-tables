type = "script"
source = """
[ENABLE]



aobscanmodule(MEGAEXP,prototypeenginef.dll,6A 10 89 2C 81)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:

push 10
test eax,eax
jnz @f
add ebp,#1000

@@:
mov [ecx+eax*4],ebp
jmp return

MEGAEXP:
jmp newmem
return:
