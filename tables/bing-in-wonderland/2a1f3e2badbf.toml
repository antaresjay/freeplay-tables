[[cheat]]
id = "disabled-hit-enemy"
name = "Disabled Hit Enemy"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Bing in Wonderland.exe
  Version: 
  Date   : 2023-01-13
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanregion(pData_1,ActorComponentDamageHlb:FixedUpdate,ActorComponentDamageHlb:FixedUpdate+1fe,0F B6 40 68 85 C0 0F 84 86) // should be unique
alloc(newmem,$1000,pData_1)

label(code)
label(return)

newmem:
  mov byte ptr [rax+68],0            //<EnableHit>k__BackingField   1 = ON / 0 = OFF

code:
  movzx eax,byte ptr [rax+68]
  test eax,eax
  jmp return

pData_1:
  jmp newmem
  nop
return:
registersymbol(pData_1)

[DISABLE]

pData_1:
  db 0F B6 40 68 85 C0

unregistersymbol(pData_1)
dealloc(newmem)"""

