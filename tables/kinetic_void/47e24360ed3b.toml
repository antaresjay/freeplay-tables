[[cheat]]
id = "active-trainer"
name = "Active Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(active,F3 0F 10 81 48 01 00 00 F3 0F 5A C0 F3 0F 10 89 44 01 00 00 F3 0F 5A C9 F2 0F 5E C1 F2 44 0F 5A F8 F3 44 0F 11 7D 88 F3 0F 10 45 88 F3 0F 5A C0 48 8B C8 F2 0F 10 C8 F2 0F 5A C9 48 83 EC 20)
registersymbol(active)
alloc(newmem,2048,active)
label(returnhere)
label(originalcode)
label(health)
label(energy)
label(ammo)

registersymbol(ammoE)
registersymbol(energyE)
registersymbol(healthE)
label(healthE)
label(energyE)
label(ammoE)



newmem: //this is allocated memory, you have read,write,execute access
//place your code here
ammo:
cmp [ammoE],0
je energy
fld [rcx+144]
fstp [rcx+148]
energy:
cmp [ammoE],0
je health
fld [rcx+184]
fstp [rcx+188]
health:
cmp [healthE],0
je originalcode
fld [rcx+17c]
fstp [rcx+180]
//144 full ammo , 148 ammo
//180 health , 17c full health
//188 Energy 184 full Energy
originalcode:
movss xmm0,[rcx+00000148]
jmp returnhere
healthE:
dd 0
energyE:
dd 0
ammoE:
dd 0
active:
jmp newmem
nop
nop
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
active:
movss xmm0,[rcx+00000148]
//Alt: db F3 0F 10 81 48 01 00 00
unregistersymbol(active)
unregistersymbol(ammoE)
unregistersymbol(energyE)
unregistersymbol(healthE)"""

