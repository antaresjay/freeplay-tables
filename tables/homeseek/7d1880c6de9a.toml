1E14A0503D4: 48 83 EC 50           - sub rsp,50
1E14A0503D8: 48 89 7D F8           - mov [rbp-08],rdi
1E14A0503DC: 48 89 55 F0           - mov [rbp-10],rdx
1E14A0503E0: 48 8B F9              - mov rdi,rcx
// ---------- INJECTING HERE ----------
1E14A0503E3: F3 0F 10 47 10        - movss xmm0,[rdi+10]
// ---------- DONE INJECTING  ----------
1E14A0503E8: F3 0F 5A C0           - cvtss2sd xmm0,xmm0
1E14A0503EC: 66 0F 57 C9           - xorpd xmm1,xmm1
1E14A0503F0: C7 45 D0 00 00 00 00  - mov [rbp-30],00000000
1E14A0503F7: C7 45 D4 00 00 00 00  - mov [rbp-2C],00000000
1E14A0503FE: C7 45 D8 00 00 00 00  - mov [rbp-28],00000000
