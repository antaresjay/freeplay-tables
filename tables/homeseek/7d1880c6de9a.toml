[[cheat]]
id = "scrap-pointer"
name = "Scrap Pointer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Homeseek.exe
  Version: 1.01
  Date   : 2023-07-26
  Author : Engen03

  This script should find and write a pointer to the scrap metal value to the allocated memory area.
}

[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

 
 
aobscan(GUIUPDATESCRAP,F3 0F 10 47 10 F3 0F 5A C0 66 0F 57 C9 C7 45 D0 00 00 00 00) // should be unique
alloc(newmem,$1000)

registersymbol(PPT)

label(PPT)
label(code)
label(return)

newmem:
  mov [PPT], rdi
  jmp code

code:
  movss xmm0,[rdi+10]
  cvtss2sd xmm0,xmm0
  xorpd xmm1,xmm1
  mov [rbp-30],00000000
  jmp return

PPT:
  db 00 00 00 00 00 00 00 00

GUIUPDATESCRAP:
  jmp far newmem
  nop 6
return:
registersymbol(GUIUPDATESCRAP)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
GUIUPDATESCRAP:
  db F3 0F 10 47 10 F3 0F 5A C0 66 0F 57 C9 C7 45 D0 00 00 00 00

unregistersymbol(GUIUPDATESCRAP)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: 1E14A0503E3

1E14A0503C8: 00 00                 - add [rax],al
1E14A0503CA: 00 00                 - add [rax],al
1E14A0503CC: 00 00                 - add [rax],al
1E14A0503CE: 00 00                 - add [rax],al
1E14A0503D0: 55                    - push rbp
