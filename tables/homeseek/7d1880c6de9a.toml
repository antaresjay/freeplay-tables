1E14A050408: 48 83 C1 D0           - add rcx,-30
1E14A05040C: BA 20 00 00 00        - mov edx,00000020
1E14A050411: F2 0F 10 D9           - movsd xmm3,xmm1
1E14A050415: F2 0F 5A DB           - cvtsd2ss xmm3,xmm3
}"""

