[[cheat]]
id = "fast-build-build-first-structure-before-activate"
name = "Fast Build - build first structure before activate"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[Enable]
alloc(newmem,100)
label(returnhere)
label(exit)
label(Build)
registersymbol(Build)
aobscan(aob1, 8B 87 9C 00 00 00 89 45 C0)

newmem:
mov [edi+0000009C],#10
mov eax,[edi+0000009C]

exit:
jmp returnhere

aob1:
Build:
jmp newmem
nop
returnhere:

[Disable]
dealloc(newmem)
unregistersymbol(Build)
Build:
db 8B 87 9C 00 00 00 89 45 C0"""

