{ Game   : king.exe
  Version: 
  Date   : 2024-06-14
  Author : RJ

  This script make Infi gas for trucks
}

[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

 
 
aobscanmodule(INJECT,king.exe,D8 69 24 D9 51 24) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
mov [ecx+24],(Double)0.01

code:
  fsubr dword ptr [ecx+24]
  fst dword ptr [ecx+24]
  jmp return

INJECT:
  jmp newmem
  nop
return:
registersymbol(INJECT)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
INJECT:
