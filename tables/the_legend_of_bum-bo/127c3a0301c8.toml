[[cheat]]
id = "unlimited-spell-elements"
name = "Unlimited Spell Elements"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(Get_Spell_Elements_AOB,SpellElement:IsReady+14c,SpellElement:IsReady+34c,48 0F BF 00 48 8B 4E 18) // should be unique
alloc(newmem,$1000,Get_Spell_Elements_AOB)

label(code)
label(return)

newmem:
  mov [rax],A
code:
  movsx rax,word ptr [rax]
  mov rcx,[rsi+18]
  jmp return

Get_Spell_Elements_AOB:
  jmp newmem
  nop 3
return:
registersymbol(Get_Spell_Elements_AOB)

[DISABLE]

Get_Spell_Elements_AOB:
  db 48 0F BF 00 48 8B 4E 18

unregistersymbol(Get_Spell_Elements_AOB)
dealloc(newmem)"""
