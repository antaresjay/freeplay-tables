[[cheat]]
id = "race-timer-scanner-select-reactivate-each-race"
name = "Race Timer Scanner (Select) [REACTIVATE EACH RACE]"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(SCAN_TIMER,DangerousDriving-Win64-Shipping.exe,F3 0F 11 8F 28 05 00 00)
alloc(newmem4,$1000,SCAN_TIMER)
alloc(timer_addr,8)  // timmer address (64-bit pointer)

label(code4)
label(return4)
label(capture_addr)

newmem4:

code4:
  cmp [timer_addr], 0  // if done, skip
  jne skip_capture

capture_addr:
  mov [timer_addr], rdi  //rdi = timer base
  add qword ptr [timer_addr], 528  //add offset - complete timer address

skip_capture:
  movss [rdi+00000528], xmm1  //original
  jmp return4

SCAN_TIMER:
  jmp newmem4
  nop 3
return4:

registersymbol(SCAN_TIMER)
registersymbol(timer_addr)

[DISABLE]

SCAN_TIMER:
  db F3 0F 11 8F 28 05 00 00

unregistersymbol(SCAN_TIMER)
unregistersymbol(timer_addr)
dealloc(newmem4)
dealloc(timer_addr)"""
