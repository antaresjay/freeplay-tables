[[cheat]]
id = "infinite-health"
name = "INFINITE HEALTH"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(health)
label(originalcode)
label(returnhere)
registersymbol(health)
aobscan(aob_health,8B 81 A4 03 00 00 85 C0 74 23 8B 48 4C 8B 4C 88 34 85 C9)

newmem:
mov [ecx+00000204],(float)100

originalcode:
mov eax,[ecx+000003A4]
jmp returnhere

aob_health:
health:
jmp newmem
nop
returnhere:

[DISABLE]
dealloc(newmem)
unregistersymbol(health)
health:
mov eax,[ecx+000003A4]"""

