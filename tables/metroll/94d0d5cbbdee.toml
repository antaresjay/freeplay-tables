[[cheat]]
id = "ammo-999"
name = "Ammo / 999"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[enable]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
label(aobammolabel)
registersymbol(aobammolabel)
aobscan(mll_ammo,8B 81 A4 03 00 00 C3 56)

newmem:
mov [ecx+3a4],3e7 //copy 999 into ecx
originalcode:
mov eax,[ecx+3a4]

exit:
jmp returnhere

//"MetroLL.exe"+168f18: //original address
mll_ammo:
aobammolabel:
jmp newmem
nop
returnhere:

[disable]
dealloc(newmem)
//"MetroLL.exe"+168f18: //original address
aobammolabel:
mov eax,[ecx+3a4]
//Alternative: db 8B 81 A4 03 00 00
unregistersymbol(aobammolabel)"""

