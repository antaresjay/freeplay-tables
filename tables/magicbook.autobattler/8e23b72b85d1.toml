type = "script"
source = """
{ Game   : Magicbook.AutoBattler.exe
  Version: 
  Date   : 2025-01-15
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanregion(pData_ItemData,ItemModel:get_Gold,ItemModel:get_Gold+50,83 39 00 48 8B 40 38 48 8D) // should be unique
alloc(newmem,$1000,pData_ItemData)

alloc(pBase_ItemData,8)
registersymbol(pBase_ItemData)

label(code)
label(return)

pBase_ItemData:
dd

newmem:

code:
  mov [pBase_ItemData],rcx
  cmp dword ptr [rcx],00
  mov rax,[rax+38]
  jmp return

pData_ItemData:
  jmp newmem
  nop 2
return:
registersymbol(pData_ItemData pBase_ItemData)

[DISABLE]

pData_ItemData:
  db 83 39 00 48 8B 40 38

unregistersymbol(*)
dealloc(*)"""

