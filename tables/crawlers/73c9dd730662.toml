[[cheat]]
id = "activate-developer-console-1"
name = "Activate Developer Console 1"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

//Send@Sintrix

aobscanmodule(devpanel_getcanshow,GameAssembly.dll,0F B6 40 18 48 83 C4 28 C3 E8 F0)
alloc(newmem,$1000,devpanel_getcanshow)

label(code)
label(return)

newmem:
mov [rax+18],1

code:
  movzx eax,byte ptr [rax+18]
  add rsp,28
  jmp return

devpanel_getcanshow:
  jmp newmem
  nop 3
return:
registersymbol(devpanel_getcanshow)

[DISABLE]

devpanel_getcanshow:
  db 0F B6 40 18 48 83 C4 28

unregistersymbol(*)
dealloc(*)"""

