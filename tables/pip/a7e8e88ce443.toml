[[cheat]]
id = "auto-assemble-script"
name = "Auto Assemble script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here

originalcode:
subss xmm0,[edx]
movss [eax],xmm0

exit:
jmp returnhere

"pip.exe"+49A25C:
jmp newmem
nop
nop
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
"pip.exe"+49A25C:
subss xmm0,[edx]
movss [eax],xmm0
//Alt: db F3 0F 5C 02 F3 0F 11 00"""

