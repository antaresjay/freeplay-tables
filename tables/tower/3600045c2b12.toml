[[cheat]]
id = "unlimited-health"
name = "Unlimited Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(PlayerHealth,GameAssembly.dll,48 8B D9 E8 CC 38 00 00)
alloc(newmem,$1000,PlayerHealth)
//Send@Sintrix|FearlessRevolution
label(code)
label(return)

newmem:
push r12
mov r12,[rcx+40]
mov r12,[r12+70]
mov [r12+3C],(float)9999
pop r12

code:
  mov rbx,rcx
  call TearsOfSerene.RPG.Hero.MovementCheck
  jmp return

PlayerHealth:
  jmp newmem
  nop 3
return:
registersymbol(PlayerHealth)
//Send@Sintrix|FearlessRevolution
[DISABLE]

PlayerHealth:
  db 48 8B D9 E8 CC 38 00 00

unregistersymbol(*)
dealloc(*)"""

