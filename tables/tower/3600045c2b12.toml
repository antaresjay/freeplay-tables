source = """
define(address,TearsOfSerene.RPG.Hero.Update)
define(bytes,48 89 5C 24 08)

[ENABLE]
//Send@Sintrix|FearlessRevolution
assert(address,bytes)
alloc(newmem,$1000,TearsOfSerene.RPG.Hero.Update)
