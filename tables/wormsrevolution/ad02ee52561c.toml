[[cheat]]
id = "infinite-health-hotkey-num-1"
name = "Infinite health------------------------------------HotKey {Num 1}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(originalcode)
label(exit)

label(inf_health)
registersymbol(inf_health)

aobscan(health_aob,8B 41 34 8B 4B F5 3B C8 89 43 F9 7D 1B)

newmem:

cmp [ecx+44],0//////Compare if our worms
jne originalcode

cmp [ecx+34],0//////////Compare if health value should be 0 - (for no death in water fix)
je originalcode

mov [ecx+34],#200

originalcode:
mov eax,[ecx+34]
mov ecx,[ebx-0B]

exit:
jmp returnhere

health_aob:
inf_health:
jmp newmem
nop
returnhere:




[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
inf_health:
mov eax,[ecx+34]
mov ecx,[ebx-0B]
//Alt: db 8B 41 34 8B 4B F5

unregistersymbol(inf_health)"""

