source = """
[ENABLE]
label(MinionScript_savedAOB)
label(MinionScript_returnhere)
label(MinionScript_originalcode)
label(MinionScript_exit)

label(MinionScript_update_exit)
label(MinionScript_set_exit)
label(MinionScript_healthset_exit)
label(MinionScript_speedset_exit)

registersymbol(MinionScript_savedAOB)

//051DDCE3 - E8 78970000           - call 051E7460
//051DDCE8 - 83 C4 10              - add esp,10
// MinionScript:Update+2b
//051DDCEB - 0FB6 47 60            - movzx eax,byte ptr [edi+60]
//051DDCEF - 85 C0                 - test eax,eax
//051DDCF1 - 74 32                 - je 051DDD25
//051DDCF3 - 8B 47 24              - mov eax,[edi+24]
//051DDCF6 - 83 EC 08              - sub esp,08
//051DDCF9 - 6A 00                 - push 00
aobscan(MinionScript_searchedAOB, 0F B6 47 60 85 C0 * * 8B 47 24)

alloc(MinionScript_newmem, 2048, MinionScript_searchedAOB)


MinionScript_newmem:
cmp dword ptr [MinionScript_update_enable], #0
je MinionScript_update_exit
mov [MinionScript_basepointer], edi
MinionScript_update_exit:

cmp dword ptr [MinionScript_set_enable], #0
je MinionScript_set_exit
MinionScript_set_exit:

cmp dword ptr [MinionScript_healthset_enable], #0
je MinionScript_healthset_exit
fld [edi+5c]
fstp [edi+58]
MinionScript_healthset_exit:

cmp dword ptr [MinionScript_speedset_enable], #0
je MinionScript_speedset_exit
mov [edi+64], (float)120
MinionScript_speedset_exit:


MinionScript_originalcode:
db 0F B6 47 60 85 C0
//movzx eax,byte ptr [edi+60]
//test eax,eax


MinionScript_exit:
jmp MinionScript_returnhere


MinionScript_searchedAOB:
MinionScript_savedAOB:
jmp MinionScript_newmem
nop
MinionScript_returnhere:


[DISABLE]
MinionScript_savedAOB:
db 0F B6 47 60 85 C0
//movzx eax,byte ptr [edi+60]
//test eax,eax

unregistersymbol(MinionScript_savedAOB)

dealloc(MinionScript_newmem)"""

