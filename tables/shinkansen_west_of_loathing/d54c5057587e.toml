[[cheat]]
id = "charactersheet-base-address-scan-initialization-activate-this-first"
name = "CharacterSheet Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(CharacterSheet_basepointer)
registersymbol(CharacterSheet_update_enable)
registersymbol(CharacterSheet_set_enable)

alloc(CharacterSheet_basepointer, 8)
alloc(CharacterSheet_update_enable, 4)
alloc(CharacterSheet_set_enable, 4)


[DISABLE]
unregistersymbol(CharacterSheet_basepointer)
unregistersymbol(CharacterSheet_update_enable)
unregistersymbol(CharacterSheet_set_enable)

dealloc(CharacterSheet_basepointer)
dealloc(CharacterSheet_update_enable)
dealloc(CharacterSheet_set_enable)"""

[[cheat]]
id = "charactersheet-base-address-scan-to-activate-click-character-sheet-portrait-to-update-click-character-sheet-portrait"
name = "CharacterSheet Base Address Scan (To Activate: Click Character Sheet Portrait, To Update: Click Character Sheet Portrait)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(CharacterSheet_savedAOB)
label(CharacterSheet_returnhere)
label(CharacterSheet_originalcode)
label(CharacterSheet_exit)

label(CharacterSheet_update_exit)
label(CharacterSheet_set_exit)

registersymbol(CharacterSheet_savedAOB)

//10FA0C35 - 48 83 EC 08           - sub rsp,08
//10FA0C39 - 48 8B F1              - mov rsi,rcx
// CharacterSheet:OnClickPortrait+c
//10FA0C3C - 48 63 46 40           - movsxd  rax,dword ptr [rsi+40]
//10FA0C40 - 83 F8 01              - cmp eax,01
//10FA0C43 - 74 32                 - je 10FA0C77
//10FA0C45 - 48 83 EC 20           - sub rsp,20
//10FA0C49 - 49 BB 8C83570500000000 - mov r11,000000000557838C : [AE7C6FE8]
aobscan(CharacterSheet_searchedAOB, 48 63 46 40 83 F8 01 74 32)

alloc(CharacterSheet_newmem, 2048, CharacterSheet_searchedAOB)
alloc(CharacterSheet_temp1, 8, CharacterSheet_searchedAOB)
alloc(CharacterSheet_temp2, 8, CharacterSheet_searchedAOB)
alloc(CharacterSheet_temp3, 8, CharacterSheet_searchedAOB)
alloc(CharacterSheet_temp4, 8, CharacterSheet_searchedAOB)
alloc(CharacterSheet_temp5, 8, CharacterSheet_searchedAOB)


CharacterSheet_newmem:
mov [CharacterSheet_temp1], rax
mov [CharacterSheet_temp2], rbx
mov [CharacterSheet_temp3], rcx
mov [CharacterSheet_temp4], rdx

cmp dword ptr [CharacterSheet_update_enable], #0
je CharacterSheet_update_exit
mov [CharacterSheet_basepointer], rsi
CharacterSheet_update_exit:

cmp dword ptr [CharacterSheet_set_enable], #0
je CharacterSheet_set_exit
CharacterSheet_set_exit:

mov rax, [CharacterSheet_temp1]
mov rbx, [CharacterSheet_temp2]
mov rcx, [CharacterSheet_temp3]
mov rdx, [CharacterSheet_temp4]


CharacterSheet_originalcode:
db 48 63 46 40 83 F8 01
//movsxd  rax,dword ptr [rsi+40]
//cmp eax,01


CharacterSheet_exit:
jmp CharacterSheet_returnhere


CharacterSheet_searchedAOB:
CharacterSheet_savedAOB:
jmp CharacterSheet_newmem
nop
nop
CharacterSheet_returnhere:


[DISABLE]
CharacterSheet_savedAOB:
db 48 63 46 40 83 F8 01
//movsxd  rax,dword ptr [rsi+40]
//cmp eax,01

unregistersymbol(CharacterSheet_savedAOB)

dealloc(CharacterSheet_newmem)
dealloc(CharacterSheet_temp1)
dealloc(CharacterSheet_temp2)
dealloc(CharacterSheet_temp3)
dealloc(CharacterSheet_temp4)
dealloc(CharacterSheet_temp5)"""

