  File Version : 5.5.1.53258
  Product Version : 5.5.1.8966154
  Date   : 2018-04-15
  Author : Herwin Yudha S

  This script like humanity :D. It has Good Side & Bad Side. The Good Side are
  these 4 [Max Fire, Inst. Craft, Forge and Exploring]. Bad Side this script
  will max 5 bad stats to 100%. You can decrease it using sage potion [Forge ->
  Healing -> Sage potion]. This script will run automatically on Max Fire &
  Inst. Exploring.
  To make this script run on crafting & forge, you need to re-select the upgrade
  that you want. Example : you want to upgrade option shelter II. Choose
  shelter II, then click the hammer [Automatically exit workshop window]. Open
  crafting plan but now you choose pillows I, click the hammer. Finally Choose
  crafting plan again, click Shelter II. See what happens :D. In forge try to
  doing it like this way. ;)
  Remember to always deactivate this script before you click End Day.
}

[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

 
 
aobscan(fire,D9 5F 78 8B 47 58) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  fstp dword ptr [edi+78]
  mov [edi+78],(float)100.0
  mov eax,[edi+58]
  jmp return

fire:
  jmp newmem
  nop
return:
registersymbol(fire)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
fire:
  db D9 5F 78 8B 47 58

unregistersymbol(fire)
dealloc(newmem)

