[[cheat]]
id = "character-ctrl-numpad-1"
name = "Character (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Ninja Brigade feat. Jonah Weingarten.exe
// Author            : ndck76
// Executable Version: 2021.3.27.16379
// Game Version      : v1.00.1
// Script Date       : 2025-04-16


[ENABLE]

aobscanmodule(cheats,GameAssembly.dll,38xxxx0F84xxxxxxxxE8xxxxxxxx33) // should be unique
alloc(newmem,$1000,cheats)
alloc(data,8)
alloc(cheatsbkp,9)
registersymbol(data)
registersymbol(cheats)
registersymbol(cheatsbkp)
label(code)
label(return)

cheatsbkp:
  readmem(cheats,9)

newmem:
  mov [data],rbx

code:
  readmem(cheats,9)
  jmp return

cheats:
  jmp newmem
  nop 4
return:

[DISABLE]

cheats:
  readmem(cheatsbkp,9)

unregistersymbol(*)
dealloc(*)"""

