name = "Infinite Item Usage"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(aobitemusage,eldenring.exe,44 0F 42 F0 44 3B F3 41 8B D6 * * * * * 73 * E8)
alloc(newmem,$1000,aobitemusage)
label(code)
label(return)

newmem:
  cmovb r14d,eax
  cmp eax,1
  jle code
  cmp r14d,ebx
  jg code
  mov r14d,eax
  mov ebx,eax
  add ebx,eax
code:
  cmovb r14d,eax
  cmp r14d,ebx
  jmp return

aobitemusage:
  jmp newmem
  nop 2
return:
registersymbol(aobitemusage)

[DISABLE]
aobitemusage:
  db 44 0F 42 F0 44 3B F3
dealloc(newmem)"""
