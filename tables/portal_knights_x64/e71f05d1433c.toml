[[cheat]]
id = "find-player-base"
name = "Find Player Base"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(getPlayer,portal_knights_x64.exe,F3 0F 11 7F 08 E8)
alloc(newmem,$1000,"portal_knights_x64.exe"+4F8F2F)

globalalloc(_player,8)

label(code)
label(return)
label(copy)

newmem:

copy:
  cmp dword [rdi+04],CEDA2313
  jne code
  push rax
  mov rax,_player
  mov [rax],rdi
  sub [rax],0x600
  pop rax
  jmp code

code:
  movss [rdi+08],xmm7
  jmp return

getPlayer:
  jmp newmem
return:
registersymbol(getPlayer)

[DISABLE]
getPlayer:
  db F3 0F 11 7F 08

unregistersymbol(getPlayer)
dealloc(newmem)
dealloc(_player)"""

