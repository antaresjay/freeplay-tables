[[cheat]]
id = "ignore-ability-limit"
name = "Ignore Ability Limit"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : South Park - The Stick of Truth.exe
  Version: 
  Date   : 2023-01-25
  Author : cfe

  This script does blah blah blah
}

[ENABLE]

// patch (data->ability_count >= 50) check
aobscanmodule(aobDS_Component_RPG_Player__add_ability,$process,83 7E 28 32)
registersymbol(aobDS_Component_RPG_Player__add_ability)

alloc(origJump,6)
registersymbol(origJump)

origJump:
readmem(aobDS_Component_RPG_Player__add_ability+4,6)

aobDS_Component_RPG_Player__add_ability+4:
db 90 90 90 90 90 90

[DISABLE]
aobDS_Component_RPG_Player__add_ability+4:
readmem(origJump,6)

deAlloc(origJump)

unregistersymbol(*)"""

