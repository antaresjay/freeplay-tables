[[cheat]]
id = "damage-modifier-script-god-mode-one-hit-kill-etc"
name = "Damage Modifier Script (God Mode, One Hit Kill, etc.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DamageModAOB,$process,41 2B FF 40 84 F6 0F 85 5F 01 00 00) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,1024,DamageModAOB)

label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

newmem:
  movd xmm15,r15d
  cvtdq2ps xmm15,xmm15
  mov [CurrentHP],edi
  cmp dword ptr [rcx+00000514],FF
  je EnemyHit
HeroHit:
  comiss xmm15,[ZeroFloat]
  ja HeroDamageHit
  jmp CleanUp
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  mulss xmm15,[fHeroDamageMult]
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xorps xmm15,xmm15
  jmp CleanUp
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne CleanUp
  cvtss2si r15d,xmm15
  cmp r15d,[CurrentHP]
  jl @F
  xorps xmm15,xmm15
@@:
  jmp CleanUp  
EnemyHit:
  comiss xmm15,[ZeroFloat]
  ja EnemyDamageHit
  jmp CleanUp
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckOneHitKill
  mulss xmm15,[fEnemyDamageMult]
CheckOneHitKill:
  cmp [OneHitKill],1
  jne CleanUp
  movss xmm15,[OneHitKillHP]
  jmp CleanUp

CleanUp:    
  cvtss2si r15d,xmm15
  xorps xmm15,xmm15
  sub edi,r15d
  test sil,sil
  jmp return

CurrentHP:
dq 0
ZeroFloat:
dq (float)0.0
OneHitKillHP:
dq (float)99999.0
NegOneFloat:
dq (float)-1.0
GodMode:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)4.0
fHeroDamageMult:
dq (float)0.5
HeroCannotDie:
dq 1

DamageModAOB:
  jmp newmem
  nop
return:

[DISABLE]

DamageModAOB:
  db 41 2B FF 40 84 F6

unregistersymbol(DamageModAOB)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fHeroDamageMult)
unregistersymbol(HeroCannotDie)

dealloc(newmem)"""

