[[cheat]]
id = "inventory-options-add-category-set-minimum-you-have-at-least-1-of-when-viewing-items"
name = "Inventory Options (Add Category, Set Minimum You Have At Least 1 Of) (When Viewing Items)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(SetItemsToMinAmountAOB,$process,44 0F B6 20 45 85 E4 0F 84 93 01 00 00) // should be unique
alloc(newmem,1024,SetItemsToMinAmountAOB)
registersymbol(SetItemsToMinAmountAOB)

label(return)
label(originalcode)
label(MinAmt)
registersymbol(MinAmt)
label(SetMinItems)
registersymbol(SetMinItems)
label(categoryConsumable)
registersymbol(categoryConsumable)
label(categoryStatItem)
registersymbol(categoryStatItem)
label(categoryKeyBlade)
registersymbol(categoryKeyBlade)
label(categoryArmor)
registersymbol(categoryArmor)
label(categoryAccessory)
registersymbol(categoryAccessory)
label(categoryFood)
registersymbol(categoryFood)
label(categoryMaterial)
registersymbol(categoryMaterial)
label(categoryKeyItem)
registersymbol(categoryKeyItem)

newmem:
  mov r12d,edi
  shr r12d,8  
CheckSetMinItems:
  cmp [SetMinItems],0
  je CheckCategory
  cmp byte ptr [rax],0
  je CheckCategory
  cmp r12l,03
  je CheckCategory
  cmp r12l,08
  je CheckCategory
  jmp SetMinimumAmount
CheckCategory:
  cmp byte ptr [categoryConsumable],0
  je CheckStatItem
  cmp r12d,01
  je SetMinimumAmount
CheckStatItem:
  cmp byte ptr [categoryStatItem],0
  je CheckKeyblade
  cmp r12d,02
  je SetMinimumAmount
CheckKeyblade:
  cmp byte ptr [categoryKeyBlade],0
  je CheckArmor
  cmp r12d,03
  je SetMinimumAmount
CheckArmor:
  cmp byte ptr [categoryArmor],0
  je CheckAccessory
  cmp r12d,04
  je SetMinimumAmount
CheckAccessory:
  cmp byte ptr [categoryAccessory],0
  je CheckFood
  cmp r12d,05
  je SetMinimumAmount
CheckFood:
  cmp byte ptr [categoryFood],0
  je CheckMaterial
  cmp r12d,06
  je SetMinimumAmount
CheckMaterial:
  cmp byte ptr [categoryMaterial],0
  je CheckKeyItem
  cmp r12d,07
  je SetMinimumAmount
CheckKeyItem:
  cmp byte ptr [categoryKeyItem],0
  je originalcode
  cmp r12d,08
  je SetMinimumAmount
  jmp originalcode
SetMinimumAmount:
  cmp dil,1
  jl originalcode
  xor r12d,r12d
  mov r12l,[MinAmt]
  mov [rax],r12l
  or byte ptr [rax+01],01
    
originalcode:
  movzx r12d,byte ptr [rax]
  test r12d,r12d
  jmp return 

MinAmt:
dq #25
SetMinItems:
dq 0
categoryConsumable:
db 00
categoryStatItem:
db 00
categoryKeyBlade:
db 00
categoryArmor:
db 00
categoryAccessory:
db 00
categoryFood:
db 00
categoryMaterial:
db 00
categoryKeyItem:
db 00

SetItemsToMinAmountAOB:
  jmp newmem
  nop
  nop
return:

[DISABLE]

SetItemsToMinAmountAOB:
  db 44 0F B6 20 45 85 E4

unregistersymbol(SetItemsToMinAmountAOB)
unregistersymbol(MinAmt)
unregistersymbol(SetMinItems)
unregistersymbol(categoryConsumable)
unregistersymbol(categoryStatItem)
unregistersymbol(categoryKeyBlade)
unregistersymbol(categoryArmor)
unregistersymbol(categoryAccessory)
unregistersymbol(categoryFood)
unregistersymbol(categoryMaterial)
unregistersymbol(categoryKeyItem)

dealloc(newmem)"""

