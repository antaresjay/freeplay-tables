[[cheat]]
id = "engine-ctrl-numpad-1"
name = "Engine (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : ShantaeAdvanceRiskyRevolution.exe
// Author            : ndck76
// Executable Version: 2022.3.61.21483
// Game Version      : Build.19450760
// Script Date       : 2025-08-22


[ENABLE]

aobscanregion(magic,Engine:DrawHud,Engine:DrawHud+1000,0FB78Fxxxx0000C1xxxx3Bxx7Dxx0FxxxxxxxxxxxxFFxx40xxxxxxxxxxxx66xxxxxxxxxxxxxxxx) //Engine:DrawHud+43b
alloc(newmem,$1000,magic)
alloc(data,8)
alloc(magicbkp,7)
registersymbol(data)
registersymbol(magic)
registersymbol(magicbkp)
label(code)
label(return)

magicbkp:
  readmem(magic,7)

newmem:
  mov [data],rdi

code:
  readmem(magic,7)
  jmp return

magic:
  jmp newmem
  nop 2
return:

[DISABLE]

magic:
  readmem(magicbkp,7)

unregistersymbol(*)
dealloc(*)"""

