id = "currency-editor-ctrl-numpad-1-select-a-ship-upgrade-to-populate-value"
name = "Currency Editor (Ctrl + Numpad 1) {Select a ship upgrade to populate value}"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Voidwalker.exe
// Author            : ndck76
// Executable Version: 2022.3.45.15866
// Game Version      : Build.18464043
// Script Date       : 2025-05-24


[ENABLE]

aobscanmodule(coins,GameAssembly.dll,8Bxxxx488Bxxxxxx488Bxxxxxx4883xxxx5FC3E8xxxxxxxxxxxxxxxxxxxx4889xxxxxx4889xxxxxx574883xxxx80) //Voidwalker.Systems.Items.ResourcesInventory.GetItemQuantity
alloc(newmem,$1000,coins)
alloc(data2,8)
alloc(coinsbkp,8)
registersymbol(data2)
registersymbol(coins)
registersymbol(coinsbkp)
label(code)
label(return)

coinsbkp:
  readmem(coins,8)

newmem:
  mov [data2],rax

code:
  readmem(coins,8)
  jmp return

coins:
  jmp newmem
  nop 3
return:

[DISABLE]

coins:
  readmem(coinsbkp,8)

unregistersymbol(*)
dealloc(*)"""

