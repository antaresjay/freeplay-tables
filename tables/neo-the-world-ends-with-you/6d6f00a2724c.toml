[[cheat]]
id = "easy-kill"
name = "Easy Kill"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game   : NEO The World Ends with You.exe
  Version: 
  Date   : 2021-10-04
  Author : AlvinC

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(INJECT,GameAssembly.dll,44 8B 73 20 F6 81 2F 01 00 00 02 74) // should be unique
alloc(newmem,$1000,INJECT)

label(code)
label(return)

newmem:

code:
  mov [rbx+20],#1
  mov r14d,[rbx+20]
  test byte ptr [rcx+0000012F],02
  jmp return

INJECT:
  jmp newmem
  nop 6
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 44 8B 73 20 F6 81 2F 01 00 00 02

unregistersymbol(INJECT)
dealloc(newmem)"""

