[[cheat]]
id = "team-inf-health"
name = "Team - Inf Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{  Game Executable   : NEO The World Ends with You.exe
   Executable Version: 1.0.0.0
   Script Date       : 2021-10-02
   Author            : AlvinC
}

[ENABLE]
aobscanmodule(aoteamhp,GameAssembly.dll,8B 7B 60 8B 5B 5C)
alloc(nteamhp,$1000,aoteamhp)
label(rteamhp)
label(resteamhp)
nteamhp:
mov [rbx+60],#999999
resteamhp:
readmem(aoteamhp,6)
jmp rteamhp
aoteamhp:
jmp nteamhp
nop
rteamhp:
registersymbol(aoteamhp resteamhp)
[DISABLE]
aoteamhp:
readmem(resteamhp,6)
unregistersymbol(*)
dealloc(*)"""

