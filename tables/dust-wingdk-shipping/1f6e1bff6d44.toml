id = "unlimited-health"
name = "Unlimited Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Dust-WinGDK-Shipping.exe
  Version: 2009.1.2.0 | Windows Store
  Date   : 2021-12-31
  Author : SvT
}

[ENABLE]
aobscanmodule(health,Dust-WinGDK-Shipping.exe,F3 0F 5D 89 78 01 00 00)
alloc(newmem,$1000,health)

label(code)
label(return)

newmem:
  cmp [rcx+00000178-8],(float)3
  je code
  mov [rcx+00000178],(float)120

code:
  minss xmm1,[rcx+00000178]
  jmp return

health:
  jmp newmem
  nop 3
return:
registersymbol(health)

[DISABLE]
health:
  db F3 0F 5D 89 78 01 00 00

unregistersymbol(health)
dealloc(newmem)"""

