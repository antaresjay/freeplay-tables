[[cheat]]
id = "cam-pan-mod"
name = "Cam Pan Mod"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(camPanReadAOB,8B 45 EC F3 0F 10 02)
registersymbol(camPanReadAOB)

label(fMyCamPan)
registersymbol(fMyCamPan)
label(pCamPan)
registersymbol(pCamPan)
label(bCamKeyPressed)
registersymbol(bCamKeyPressed)
label(bCamPanCounter)
registersymbol(bCamPanCounter)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
label(resetcamkey)
label(setcentercam)
label(setrightcam)
label(setleftcam)
label(setcampana)
label(setcampanb)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
mov eax,[ebp-14]//
movss xmm0,[edx]//
mov [pCamPan],eax
pushfd

pushad
push 'F'
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne resetcamkey
cmp byte ptr [bCamKeyPressed],00
jne originalcode
mov byte ptr [bCamKeyPressed],01

cmp byte ptr [bCamPanCounter],1
je setcentercam
cmp byte ptr [bCamPanCounter],2
je setrightcam
cmp byte ptr [bCamPanCounter],0
je setleftcam
jmp originalcode

setcentercam:
mov dword ptr [fMyCamPan],(float)0
jmp setcampana

setrightcam:
mov dword ptr [fMyCamPan],(float)-1.0
jmp setcampana

setleftcam:
mov dword ptr [fMyCamPan],(float)1.0
jmp setcampana

setcampana:
inc byte ptr [bCamPanCounter]
cmp byte ptr [bCamPanCounter],2
jle setcampanb
mov byte ptr [bCamPanCounter],0

setcampanb:
fld dword ptr [fMyCamPan]
fstp dword ptr [eax+f4]
jmp originalcode

resetcamkey:
mov byte ptr [bCamKeyPressed],00
jmp setcampanb

