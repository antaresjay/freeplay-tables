[[cheat]]
id = "item-pointers"
name = "Item Pointers"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(itemscan1,8B 42 10 89 41 10 8B 45) // should be unique
aobscan(itemscan2,0F BE 51 11 89 55 DC)
aobscan(itemscan3,0F BE 51 11 89 55 E0)

alloc(newmem,2048)
alloc(newmem2,2048)
alloc(newmem3,2048)

label(code)
label(return)
label(code2)
label(return2)
label(code3)
label(return3)

registersymbol(itemscan1)
registersymbol(itemscan2)
registersymbol(itemscan3)

globalalloc(_item1,4)
globalalloc(_item2,4)

newmem:

code:
  mov [_item1],edx
  mov eax,[edx+10]
  mov [ecx+10],eax
  jmp return

newmem2:

code2:
  mov [_item2],ecx
  movsx edx,byte ptr [ecx+11]
  mov [ebp-24],edx
  jmp return2

newmem3:

code3:
  mov [_item2],ecx
  movsx edx,byte ptr [ecx+11]
  mov [ebp-20],edx
  jmp return3

itemscan1:
  jmp code
  nop
return:

itemscan2:
  jmp code2
  nop
  nop
return2:

itemscan3:
  jmp code3
  nop
  nop
return3:

[DISABLE]

itemscan1:
  db 8B 42 10 89 41 10

itemscan2:
  db 0F BE 51 11 89 55 DC

itemscan3:
  db 0F BE 51 11 89 55 E0

unregistersymbol(itemscan1)
unregistersymbol(itemscan2)
unregistersymbol(itemscan3)
dealloc(newmem)
dealloc(newmem2)
dealloc(newmem3)"""

