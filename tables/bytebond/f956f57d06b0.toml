[[cheat]]
id = "player-movement-handler-ctrl-numpad-1-move-any-bot-to-populate-values"
name = "Player Movement Handler (Ctrl + Numpad 1) {Move any bot to populate values}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Bytebond.exe
// Author            : ndck76
// Executable Version: 6000.0.49.3594
// Game Version      : v1.0.0.6
// Script Date       : 2025-09-27


[ENABLE]

aobscanmodule(bodymovement,GameAssembly.dll,488Bxxxxxxxxxx4885xx0F84xxxxxxxx488Bxxxx4885xx0F84xxxxxxxx38xxxxxxxxxx75) //Modules.PlayerModule.Movement.PlayerMovementHandler.MovementStateHandler
alloc(newmem,$1000,bodymovement)
alloc(data,8)
alloc(bodymovementbkp,7)
registersymbol(data)
registersymbol(bodymovement)
registersymbol(bodymovementbkp)
label(code)
label(return)

bodymovementbkp:
  readmem(bodymovement,7)

newmem:
  mov [data],rbx

code:
  readmem(bodymovement,7)
  jmp return

bodymovement:
  jmp newmem
  nop 2
return:

[DISABLE]

bodymovement:
  readmem(bodymovementbkp,7)

unregistersymbol(*)
dealloc(*)"""

