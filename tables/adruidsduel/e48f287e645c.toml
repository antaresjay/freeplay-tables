label(code)
label(return)

label(CheckPlayer)
label(FirstRun)
label(CmpManaBurn)

alloc(IsPlayer,4)
alloc(FirstRun_Flag,4)
alloc(ManaBurn_Flag,4)

FirstRun_Flag:
dd 1
ManaBurn_Flag:
dd 0

newmem:

FirstRun:
  cmp dword ptr [FirstRun_Flag],0
  je CheckPlayer
  mov [FirstRun_Flag],0
  push ebx
  mov ebx,[eax+10]
  mov [IsPlayer],ebx
  pop ebx

CheckPlayer:
  push ebx
  mov ebx,[eax+10]
  cmp dword ptr [IsPlayer],ebx
  jne CmpManaBurn
  mov [eax+28],#77
  jmp code

CmpManaBurn:
  cmp dword ptr [ManaBurn_Flag],1
  jne code
  mov [eax+28],0
//}
