  mov eax,[eax+28]
  mov ecx,[edi+28]
  pop ebx
  jmp return

Get_Mana_AOB:
  jmp newmem
  nop
return:
registersymbol(Get_Mana_AOB)

[DISABLE]

Get_Mana_AOB:
  db 8B 40 28 8B 4F 28

unregistersymbol(Get_Mana_AOB)
