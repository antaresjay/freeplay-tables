[[cheat]]
id = "cheat"
name = "𝐈𝐧𝐟𝐢𝐧𝐢𝐭𝐞 𝐇𝐞𝐚𝐥𝐭𝐡"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Genokids.exe
  Date   : 2025-10-05
  Author : Sianz
}

[ENABLE]

aobscanregion(phealth,ControlGlobal:OnUpdate,ControlGlobal:OnUpdate+200,F3 0F 10 80 ?? ?? 00 00 F3 0F 5A C0 F2) // should be unique
alloc(newmem,$1000,phealth)
alloc(invul,4)
label(code)
label(return)

invul:
dd 0

newmem:
  movss xmm0,[rax+00000138]
  movss [rax+00000128],xmm0
  mov ecx,[invul]
  test ecx,ecx
  setnz cl
  mov [rax+131],cl
code:
  movss xmm0,[rax+00000128]
  jmp return

phealth:
  jmp newmem
  nop 3
return:
registersymbol(phealth invul)

[DISABLE]

phealth:
  db F3 0F 10 80 28 01 00 00

unregistersymbol(*)
dealloc(*)"""

