[[cheat]]
id = "enable-cheats"
name = "Enable Cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : TetrisEffect-WinGDK-Shipping.exe
  Version: 1.0.56.0
  Date   : 2020-11-19
  Author : SovietWristwatch.jpg | Rhark
}

[ENABLE]

aobscanmodule(base,TetrisEffect-WinGDK-Shipping.exe,48 3B AE D0 00 00 00)
alloc(newmem,$1000,base)

label(code)
label(return)
label(LocalPlayer)
label(PlayerController)
label(Pawn)
label(PuzzleManager)

registersymbol(LocalPlayer)
registersymbol(PlayerController)
registersymbol(Pawn)
registersymbol(PuzzleManager)

newmem:
  push rax
  mov rax,[rsi+D0]
  mov [LocalPlayer],rax
  mov rax,[rax+30]
  test rax,rax
  je short @f
  mov [PlayerController],rax
  mov rax,[rax+250]
  test rax,rax
  je short @f
  mov [Pawn],rax
  mov rax,[rax+2D0]
  test rax,rax
  je short @f
  mov [PuzzleManager],rax

code:
  pop rax
  cmp rbp,[rsi+000000D0]
  jmp return

LocalPlayer:
  dq 0

PlayerController:
  dq 0

Pawn:
  dq 0

PuzzleManager:
  dq 0

base:
  jmp newmem
  nop 2
return:
registersymbol(base)

[DISABLE]

base:
  db 48 3B AE D0 00 00 00

unregistersymbol(base)
unregistersymbol(LocalPlayer)
unregistersymbol(PlayerController)
unregistersymbol(Pawn)
unregistersymbol(PuzzleManager)
dealloc(newmem)"""

