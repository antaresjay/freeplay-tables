  Author : SovietWristwatch.jpg
}

[ENABLE]

aobscanmodule(achBase,TetrisEffect-WinGDK-Shipping.exe,7D 15 48 8B 41 30 48 85 C0)
alloc(newmem,$1000,achBase)

label(code)
label(return)
label(achievements)

aobscanmodule(achBase2,TetrisEffect-WinGDK-Shipping.exe,4D 8B 7F 30 E8 7A 30 3C 00)
alloc(newmem2,$1000,achBase2)

label(code2)
label(return2)
label(achievements2)

newmem:
  mov [achievements],rcx

code:
  mov rax,[rcx+30]
  test rax,rax
  jmp return

achievements:
  dd 0

achBase+02:
  jmp newmem
  nop 2
return:
registersymbol(achBase)
registersymbol(achievements)

newmem2:
  mov [achievements2],r15

code2:
  mov r15,[r15+30]
  call TetrisEffect-WinGDK-Shipping.exe+2328550
  jmp return2

achievements2:
  dd 0

achBase2:
  jmp newmem2
  nop 4
return2:
registersymbol(achBase2)
registersymbol(achievements2)

[DISABLE]
achBase+02:
  db 48 8B 41 30 48 85 C0

unregistersymbol(achBase)
unregistersymbol(achievements)
dealloc(newmem)

achBase2:
  db 4D 8B 7F 30 E8 7A 30 3C 00

unregistersymbol(achBase2)
unregistersymbol(achievements2)
dealloc(newmem2)"""

