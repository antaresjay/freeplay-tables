// Resources: Spending Adds Instead
//
// Purpose:
// - Reverses the resource spending calculation.
// - When resources are spent, the spent amount is added instead of subtracted.
//
// Notes:
// - Single-player use only.
// - Disable this option if unexpected resource behavior occurs.
// - Game updates may break the AOB pattern.
// ==================================================

[ENABLE]

aobscanmodule(resourceWrite,RTypeTacticsCosmosSteam-Win64-Shipping.exe,03 CB 89 0A 48 8B 5C 24 30 48 83 C4 20)
