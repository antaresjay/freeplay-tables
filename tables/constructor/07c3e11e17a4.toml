source = """
[ENABLE]
alloc(newmem,2048)

label(returnhere)
label(originalcode)
label(exit)

label(check_live_forever)
label(check_enemy_lifespan)

// Declare variables for export
label(live_forever)
label(enemy_lifespan)

// Register variables as symbols
registersymbol(live_forever)
registersymbol(enemy_lifespan)

newmem:
  mov ebx,[Constructor.exe+3463CE4]   //find player team

check_live_forever:
  cmp [live_forever], 0               // skip if not enabled
  je check_enemy_lifespan

  cmp [edx+0000005C],ebx              //skip enemy team
  jne check_enemy_lifespan
  add [edx+000000C4],1                //extend lifespan by 1 day

check_enemy_lifespan:
  cmp [enemy_lifespan], 0             // skip if not enabled
  je originalcode

  cmp [edx+0000005C],ebx              // skip player team
  je originalcode
  mov [edx+000000C4],#-10000          //reduce lifespan by 10000 days

originalcode:
  sub eax,[edx+000000C4]              // aging process

exit:
  jmp returnhere

// Set variables:
live_forever:
dd 0 // if set to 1, it's on by default
enemy_lifespan:
dd 0

"Constructor.exe"+4DE10:
  jmp newmem
  nop
returnhere:

[DISABLE]
dealloc(newmem)

unregistersymbol(live_forever)
unregistersymbol(enemy_lifespan)

"Constructor.exe"+4DE10:
db 2B 82 C4 00 00 00
//sub eax,[edx+000000C4]"""

