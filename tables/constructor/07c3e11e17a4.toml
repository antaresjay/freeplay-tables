[[cheat]]
id = "tenants-stress-control-activate-for-options"
name = "Tenants Stress Control {Activate for options}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

label(check_player_stress)
label(check_enemy_stress)

// Declare variables for export
label(reduce_player_stress)
label(add_enemy_stress)

// Register variables as symbols
registersymbol(reduce_player_stress)
registersymbol(add_enemy_stress)

newmem:
  mov edx,[Constructor.exe+3463CE4]   //find player team

check_player_stress:
  cmp [reduce_player_stress], 0       // skip if not enabled
  je check_enemy_stress

  cmp [eax+0000005C],edx              //skip enemy buildings
  jne check_enemy_stress
  mov [eax+000000B8],#-9999           //reduce stress by 999%
  jmp short exit

check_enemy_stress:
  cmp [add_enemy_stress], 0           // skip if not enabled
  je originalcode

  cmp [eax+0000005C],edx              //skip player buildings
  je originalcode
  mov [eax+000000B8],#9999            //increase stress by 999%
  jmp short exit

originalcode:
  mov [eax+000000B8],ecx

exit:
  jmp returnhere

// Set variables:
reduce_player_stress:
dd 0 // if set to 1, it's on by default
add_enemy_stress:
dd 0

"Constructor.exe"+3770E:
  jmp newmem
  nop
returnhere:

[DISABLE]
dealloc(newmem)

unregistersymbol(reduce_player_stress)
unregistersymbol(add_enemy_stress)

"Constructor.exe"+3770E:
db 89 88 B8 00 00 00
//mov [eax+000000B8],ecx"""

