[[cheat]]
id = "make-player-tenants-happy"
name = "Make Player Tenants Happy"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem:
mov edx,[Constructor.exe+3455F5C]   //find player team
cmp [eax+0000005C],edx              //skip enemy buildings
jne originalcode
mov [eax+000000B8],#-9999            //reduce stress by 999%
jmp short exit

originalcode:
mov [eax+000000B8],ecx

exit:
jmp returnhere

"Constructor.exe"+3746E:
jmp newmem
nop
returnhere:

[DISABLE]
dealloc(newmem)
"Constructor.exe"+3746E:
db 89 88 B8 00 00 00
//mov [eax+000000B8],ecx"""

