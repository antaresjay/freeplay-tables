[[cheat]]
id = "enable-resources-control-run-the-game-for-a-bit-to-load-all-the-values"
name = "Enable Resources Control {Run the game for a bit to load all the values}"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)
label(exit)
label(basepointer)
registersymbol(basepointer)

newmem:
push edx
lea edx,[ecx+eax]
mov [basepointer],edx
pop edx

mov edx,[ecx+eax]
mov [ebp-14],edx

exit:
jmp returnhere

basepointer:
dq 0

"Constructor.exe"+48064:
jmp newmem
nop
returnhere:

[DISABLE]
unregistersymbol(basepointer)
dealloc(newmem)
"Constructor.exe"+48064:
db 8B 14 01 89 55 EC
//mov edx,[ecx+eax]
//mov [ebp-14],edx"""

