[ENABLE]
aobscanregion(get_Sprint,UnityStandardAssets.Characters.FirstPerson.RigidbodyFirstPersonController.Update,UnityStandardAssets.Characters.FirstPerson.RigidbodyFirstPersonController.Update+300,F3 0F 11 7B 64)
