[[cheat]]
id = "get-player"
name = "Get Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(cheatingtom,ProjectAlpha-Win64-Shipping.exe,48 8B 10 48 8B C8 FF 92 90 06 00 00 84 C0 74 14)
alloc(newmem,$1000)

label(code)
label(return)

label(run)

label(rabbit)
registersymbol(rabbit)

label(elephant)
registersymbol(elephant)

newmem:
  cmp dword ptr [rabbit], 1
  jne run

  fld qword ptr [rax+6B8]
  fstp qword ptr [rax+6B0]

run:
  cmp dword ptr [elephant], 1
  jne code

  fld qword ptr [rax+6D0]
  fstp qword ptr [rax+6C8]

code:
  mov rdx,[rax]
  mov rcx,rax
  call qword ptr [rdx+00000690]
  test al,al
  jmp return

rabbit:
dd 0

elephant:
dd 0

cheatingtom:
  jmp far newmem
return:
registersymbol(cheatingtom)

[DISABLE]

cheatingtom:
  db 48 8B 10 48 8B C8 FF 92 90 06 00 00 84 C0

unregistersymbol(cheatingtom)
unregistersymbol(rabbit)
unregistersymbol(elephant)
dealloc(newmem)"""

