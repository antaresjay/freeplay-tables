[[cheat]]
id = "grab-player-load-save-first"
name = "→ Grab Player (Load Save First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(PlayerBase,ProjectAlpha-Win64-Shipping.exe,49 8B 06 48 8D 95 50 03 00 00)
alloc(newmem,$1000,PlayerBase)
label(code return pBase)
registersymbol(pBase)
//Send@Sintrix|FearlessRevolution
newmem:
mov [pBase],r14

code:
  mov rax,[r14]
  lea rdx,[rbp+00000350]
  jmp return

pBase:
dq 0

PlayerBase:
  jmp newmem
  nop 5
return:
registersymbol(PlayerBase)
//Send@Sintrix|FearlessRevolution
[DISABLE]

PlayerBase:
  db 49 8B 06 48 8D 95 50 03 00 00

//AttributeComponent +6A8 StanceMultiplier +1A8
//PlayerController+50 ManagerComponent (EXP/Stat/Skill)

unregistersymbol(*)
dealloc(*)"""

