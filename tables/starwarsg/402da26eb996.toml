id = "no-units-limit"
name = "No Units Limit"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(unitslimit_aob,StarWarsG.exe,89 5C 24 20 3B 5D 08 0F 8C 4E)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
mov [ebp+08],0
mov [esp+20],ebx
cmp ebx,[ebp+08]
jmp return

unitslimit_aob:
jmp newmem
nop 2
return:
registersymbol(unitslimit_aob)

[DISABLE]

unitslimit_aob:
db 89 5C 24 20 3B 5D 08

unregistersymbol(unitslimit_aob)
dealloc(newmem)"""
