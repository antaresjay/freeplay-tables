[[cheat]]
id = "activate"
name = "Activate"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
{
AOBscan for the personal stats

This one is always located above the credits.
Scroll up past the long block of pointers, and right after that are ~4 lines of 00 00.
After those 4 lines starts the 4 rows of AOB which this one is.
Should always start with ?8 ?8 ?? ?? F? 7F

Memory viewer extended to show 16 bytes per row ofc.
}
aobscan(credits, 00 00 00 00 00 00 00 00 01 00 00 00 00 00 00 00 ?? ?? ?? ?? ?? 0? 00 00 ?? ?? ?? ?? ?? 0? 00 00 ?0 ?? ?? ?? ?? 0? 00 00 ?8 ?? ?? ?? ?? 0? 00 00 ?0 ?? ?? ?? ?? 0? 00 00 D8 ?F ?? ?? ?? 0? 00 00 D8 ?F ?? ?? ?? 0? 00 00 00 ?? ?? ?? ?? 0? 00 00)
label(_credits)
registersymbol(_credits)

credits-80:
_credits:

[DISABLE]
unregistersymbol(_credits)"""

