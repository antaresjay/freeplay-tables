alloc(Player_heartset_enable, 4)
alloc(Player_livesset_enable, 4)
alloc(Player_jumpset_enable, 4)
alloc(Player_bombsset_enable, 4)
alloc(Player_weaponset_enable, 4)
alloc(Player_goldset_enable, 4)
alloc(Player_scoreset_enable, 4)


[DISABLE]
unregistersymbol(Player_basepointer)
unregistersymbol(Player_update_enable)
unregistersymbol(Player_set_enable)
unregistersymbol(Player_invulnerableset_enable)
unregistersymbol(Player_heartset_enable)
unregistersymbol(Player_livesset_enable)
unregistersymbol(Player_jumpset_enable)
unregistersymbol(Player_bombsset_enable)
unregistersymbol(Player_weaponset_enable)
unregistersymbol(Player_goldset_enable)
unregistersymbol(Player_scoreset_enable)

dealloc(Player_basepointer)
dealloc(Player_update_enable)
dealloc(Player_set_enable)
dealloc(Player_invulnerableset_enable)
dealloc(Player_heartset_enable)
dealloc(Player_livesset_enable)
