dealloc(Player_weaponset_enable)
dealloc(Player_goldset_enable)
dealloc(Player_scoreset_enable)"""

[[cheat]]
id = "player-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Player Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Player_savedAOB)
label(Player_returnhere)
label(Player_originalcode)
label(Player_exit)

label(Player_update_exit)
label(Player_set_exit)
label(Player_invulnerableset_exit)
label(Player_heartset_exit)
label(Player_livesset_exit)
label(Player_jumpset_exit)
label(Player_bombsset_exit)
label(Player_weaponset_exit)
label(Player_goldset_exit)
label(Player_scoreset_exit)

registersymbol(Player_savedAOB)

//04621C74 - 83 EC 14              - sub esp,14
//04621C77 - 8B 7D 08              - mov edi,[ebp+08]
// Player:Update+a
//04621C7A - 8B 47 30              - mov eax,[edi+30]
//04621C7D - 0FB6 40 3A            - movzx eax,byte ptr [eax+3A]
//04621C81 - 85 C0                 - test eax,eax
//04621C83 - 0F84 85000000         - je 04621D0E
//04621C89 - 8B 47 6C              - mov eax,[edi+6C]
aobscan(Player_searchedAOB, 8B 47 30 0F B6 40 3A 85 C0)

alloc(Player_newmem, 2048, Player_searchedAOB)
alloc(Player_temp1, 4, Player_searchedAOB)


Player_newmem:
mov [Player_temp1], ebx

cmp dword ptr [Player_update_enable], #0
je Player_update_exit
mov [Player_basepointer], edi
Player_update_exit:

cmp dword ptr [Player_set_enable], #0
je Player_set_exit
Player_set_exit:

cmp dword ptr [Player_invulnerableset_enable], #0
je Player_invulnerableset_exit
mov byte ptr [edi+90], #1
Player_invulnerableset_exit:

cmp dword ptr [Player_heartset_enable], #0
je Player_heartset_exit
mov ebx, [edi+84]
mov [edi+80], ebx
Player_heartset_exit:

cmp dword ptr [Player_livesset_enable], #0
je Player_livesset_exit
mov [edi+78], #9999999
Player_livesset_exit:

cmp dword ptr [Player_jumpset_enable], #0
je Player_jumpset_exit
cmp dword ptr [edi+30], #0
je Player_jumpset_exit
mov ebx, [edi+30]
cmp dword ptr [ebx+28], #0
je Player_jumpset_exit
mov ebx, [ebx+28]
mov [ebx+c], (float)50
Player_jumpset_exit:

cmp dword ptr [Player_bombsset_enable], #0
je Player_bombsset_exit
cmp dword ptr [edi+4c], #0
je Player_bombsset_exit
mov ebx, [edi+4c]
mov [ebx+d8], #99999
Player_bombsset_exit:

cmp dword ptr [Player_weaponset_enable], #0
je Player_weaponset_exit
cmp dword ptr [edi+4c], #0
je Player_weaponset_exit
mov ebx, [edi+4c]
mov [ebx+f0], #99999
mov [ebx+f4], #99999
Player_weaponset_exit:

cmp dword ptr [Player_goldset_enable], #0
je Player_goldset_exit
cmp dword ptr [edi+54], #0
je Player_goldset_exit
mov ebx, [edi+54]
mov [ebx+30], #99999
Player_goldset_exit:

cmp dword ptr [Player_scoreset_enable], #0
je Player_scoreset_exit
cmp dword ptr [edi+70], #0
je Player_scoreset_exit
mov ebx, [edi+70]
mov [ebx+30], #9999999
Player_scoreset_exit:

mov ebx, [Player_temp1],


Player_originalcode:
db 8B 47 30 0F B6 40 3A
//mov eax,[edi+30]
//movzx eax,byte ptr [eax+3A]


Player_exit:
jmp Player_returnhere


Player_searchedAOB:
Player_savedAOB:
jmp Player_newmem
nop
nop
Player_returnhere:


[DISABLE]
Player_savedAOB:
db 8B 47 30 0F B6 40 3A
//mov eax,[edi+30]
//movzx eax,byte ptr [eax+3A]

unregistersymbol(Player_savedAOB)

dealloc(Player_newmem)
dealloc(Player_temp1)"""

