[[cheat]]
id = "god-mode-with-one-hit-kill"
name = "God mode with one hit kill"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,Bully.exe,D9 93 B8 1C 00 00 D9 EE D8) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(onehit)
label(code2)

newmem:
cmp ebx+00000000],00911BA4
jne code
push eax
mov eax,[ebx+00001CBC]
mov [ebx+00001CB8],eax
pop eax
jmp return
code:
cmp [onehit],1
jne code2
  fsub dword ptr [ebx+00001CB8]
  jmp return

  code2:
fst dword ptr [ebx+00001CB8]
  jmp return

  onehit:
  dd 0

INJECT:
  jmp newmem
  nop
return:
registersymbol(INJECT)
registersymbol(onehit)
registersymbol(code2)

[DISABLE]

INJECT:
  db D9 93 B8 1C 00 00

unregistersymbol(*)
dealloc(*)"""

