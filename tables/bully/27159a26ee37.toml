name = "Freeze Time"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(daytime,Bully.exe,02 D0 83 F8 05 0F 9F C0 80 FA 3C)

daytime+b:
db 90 90 90 90 90 90


registersymbol(daytime)
alloc(savedata,16)
