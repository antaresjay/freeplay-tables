[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(health,Bully.exe,D9 93 B8 1C 00 00 D9 EE D8)
alloc(newmem,$1000)

label(code)
label(return)

registersymbol(healthE)
label(healthE)
newmem:

push esi
mov esi,[ebx+1c9c]
cmp esi,100000
jna @f
cmp [esi+5],'PLAY'
jne @f
cmp [healthE],0
je code
fstp dword ptr [ebx+00001CB8]
fld [ebx+1cbc]
jmp code

@@:
cmp [healthE+4],0
je code
fstp dword ptr [ebx+00001CB8]
fldz

code:
pop esi
fst dword ptr [ebx+00001CB8]
jmp return
healthE:
dd 0
health:
jmp newmem
nop
return:
registersymbol(health)

[DISABLE]

health:
db D9 93 B8 1C 00 00

unregistersymbol(health)
dealloc(newmem)"""

