[[cheat]]
id = "max-stats"
name = "Max Stats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECTSTATS,HEROES3.EXE,88 8C 07 76 04 00 00)
alloc(newmem,$200)

label(code)
label(return)
label(original)

newmem:

code:
      pushf
  cmp [set_stats_c],1
  jne original
  popf
  mov [set_stats_c],0
  mov [edi+eax+00000476],64
  jmp return

original:
  popf
  mov [edi+eax+00000476],64
  jmp return

INJECTSTATS:
  jmp newmem
  nop 2
return:
registersymbol(INJECTSTATS)

[DISABLE]

INJECTSTATS:
  db 88 8C 07 76 04 00 00

unregistersymbol(INJECTSTATS)
dealloc(newmem)"""
