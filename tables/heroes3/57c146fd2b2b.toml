[[cheat]]
id = "x-heroes-of-mnm-3-v4000-gog-script"
name = "[X] <== Heroes of MnM 3 v4000 GOG Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
===========================================
 Game Title    : Heroes of Might & Magic 3
 Game Version  : 4.0.0.0 (GOG)
 Process Name  : Heroes3.exe
 Script Version: 1.0
 CE Version    : 6.2
 Release date  : 17-Jul-2012
 Author        : Recifense
 Features:
 - Minimum Resources
 - Unlimited Movement
 - Minimum Troop Size
 - Hero Status:
   - Attack    >= 20
   - Defense   >= 20
   - Power     >= 20
   - Knowledge >= 20
   - Full Mana
 - Pointers
 ==========================================
}

[ENABLE]
//=========================================
// Check if script is compatible to this game version
// If false the script will not be loaded

assert(heroes3.exe+158f57,8b 8c 83 9c 00 00 00)
assert(heroes3.exe+08117f,8b 4d f8 8b 56 4d)

//=========================================
alloc(MyCode,2048,heroes3.exe)
//=========================================
// Declaration section
label(_MonPlayer)
label(_MonP00)
label(_BackMP)
label(_ExitMP)
label(_MonMovement)
label(_MonM00)
label(_MonM01)
label(_BackMM)
label(_ExitMM)
label(pUnit)
label(pPlayer)
label(bPlayerID)
label(iEnableMR)
label(iEnableMM)
label(iEnableTS)
label(iEnableMH)
label(iMinSize)

//=========================================
// Registering Symbols
registersymbol(MyCode)
registersymbol(pUnit)
registersymbol(pPlayer)
registersymbol(bPlayerID)
registersymbol(iEnableMR)
registersymbol(iEnableMM)
registersymbol(iEnableTS)
registersymbol(iEnableMH)
registersymbol(iMinSize)

//=========================================
MyCode:
//=========================================
_MonPlayer:
 cmp byte ptr [ebx+000000e1],01
 jne _ExitMP

 mov [pPlayer],ebx

 mov cl,[ebx]
 mov [bPlayerID],cl

 cmp dword ptr [iEnableMR],0
 je _ExitMP                        // Jump if feature is disabled

 mov ecx,#5000
 cmp eax,5
 jle _MonP00

 mov ecx,#62000
 cmp eax,6
 jne _ExitMP

_MonP00:
 cmp ecx,[ebx+eax*4+0000009C]
 jle _ExitMP

 mov [ebx+eax*4+0000009C],ecx

_ExitMP:
 mov ecx,[ebx+eax*4+0000009C]      // Original code
 jmp _BackMP                       // Back to main code

//=========================================
_MonMovement:
 mov cl,[esi+22]
 cmp cl,[bPlayerID]
 jne _ExitMM

 mov [pUnit],esi

 cmp dword ptr [iEnableMM],0
 je _MonM00                        // Jump if feature is disabled

 mov ecx,[esi+49]
 mov [esi+4d],ecx

 xor ecx,ecx
 mov [ebp-08],ecx

_MonM00:
 cmp dword ptr [iEnableTS],0
 je _MonM01                        // Jump if feature is disabled

 mov ecx,[iMinSize]

 mov edx,[esi+000000AD]
 cmp ecx,edx
 cmovg edx,ecx

 mov [esi+000000AD],edx

 mov edx,[esi+000000b1]
 cmp ecx,edx
 cmovg edx,ecx

 mov [esi+000000b1],edx

 mov edx,[esi+000000b5]
 cmp ecx,edx
 cmovg edx,ecx

 mov [esi+000000b5],edx

 mov edx,[esi+000000b9]
 cmp ecx,edx
 cmovg edx,ecx

 mov [esi+000000b9],edx

 mov edx,[esi+000000bd]
 cmp ecx,edx
 cmovg edx,ecx

 mov [esi+000000bd],edx

 mov edx,[esi+000000c1]
 cmp ecx,edx
 cmovg edx,ecx

 mov [esi+000000c1],edx

 mov edx,[esi+000000c5]
 cmp ecx,edx
 cmovg edx,ecx

 mov [esi+000000c5],edx

_MonM01:
 cmp dword ptr [iEnableMH],0
 je _ExitMM                        // Jump if feature is disabled

 mov ecx,#20
 xor edx,edx

 mov dl,[esi+00000476]
 cmp ecx,edx
 cmovg edx,ecx

 mov [esi+00000476],dl

 mov dl,[esi+00000477]
 cmp ecx,edx
 cmovg edx,ecx

 mov [esi+00000477],dl

 mov dl,[esi+00000478]
 cmp ecx,edx
 cmovg edx,ecx

 mov [esi+00000478],dl

 mov dl,[esi+00000479]
 cmp ecx,edx
 cmovg edx,ecx

 mov [esi+00000479],dl

 lea ecx,[edx+edx*4]
 add ecx,ecx

 mov [esi+18],cx

_ExitMM:
 mov ecx,[ebp-08]                  // Original code
 mov edx,[esi+4D]                  // Original code
 jmp _BackMM                       // Back to main code

//=========================================
 db '========================================>'
 db 'CE6.2 Script by Recifense 071712'
//=========================================
// Variables
iEnableMR:
 dd 0
iEnableMM:
 dd 0
iEnableTS:
 dd 0
iEnableMH:
 dd 0
pUnit:
 dd 0
pPlayer:
 dd 0
iMinSize:
 dd #800
bPlayerID:
 db 55

//=========================================
// Hacking Points
heroes3.exe+158f57:
 jmp _MonPlayer
 nop
 nop
_BackMP:

heroes3.exe+08117f:
 jmp _MonMovement
 nop
_BackMM:

//=========================================
// Script for Restoring Original Codes
[DISABLE]
heroes3.exe+158f57:
// mov ecx,[ebx+eax*4+0000009C]
 db 8b 8c 83 9c 00 00 00

heroes3.exe+08117f:
// mov ecx,[ebp-08]
// mov edx,[esi+4D]
 db 8b 4d f8 8b 56 4d

//=========================================
// Unregistering Symbols
unregistersymbol(MyCode)
unregistersymbol(pPlayer)
unregistersymbol(bPlayerID)
unregistersymbol(pUnit)
unregistersymbol(iEnableMR)
unregistersymbol(iEnableMM)
unregistersymbol(iEnableTS)
unregistersymbol(iEnableMH)
unregistersymbol(iMinSize)

//=========================================
dealloc(MyCode)
//============= Scripts End ===============

// ****************************************
// NOTES
// ****************************************
{
}"""

