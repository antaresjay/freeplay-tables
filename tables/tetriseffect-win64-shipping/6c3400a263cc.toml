[[cheat]]
id = "hk"
name = "hk"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : TetrisEffect-Win64-Shipping.exe
  Version: 
  Date   : 2025-06-07
  Author : Messy6666 ( aka SinGul4ritY )

  This script does blah blah blah
}

[ENABLE]
define(BAD_PTR, 7FFFFFFF)

aobscanmodule(hkPawn,$process,33 FF 48 8B DA 4C 8B D1) // should be unique
alloc(newmem, $1000, hkPawn)


registersymbol(hkPawn)
registersymbol(hkPawnbkp)
registersymbol(ptrPuzzleMgr)

label(hkPawnbkp)
label(return)
label(ptrPuzzleMgr)

newmem:
  test r15, r15
  je   hkPawnbkp
  push rax
  mov  rax, [r15+02D0]
  cmp  rax, BAD_PTR
  jle  @f
  mov  [ptrPuzzleMgr], rax
@@:
  pop  rax
hkPawnbkp:
  readmem(hkPawn, 5)
  jmp return

ALIGN  10 CC
ptrPuzzleMgr:
  dq   0

hkPawn:
  jmp newmem
return:


[DISABLE]

hkPawn:
  readmem(hkPawnbkp, 5)

unregistersymbol(*)
dealloc(*)"""
