[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(cheatingjerry, LoG.PaymentProcessor:GiveResources+0, LoG.PaymentProcessor:GiveResources+188, 48 89 7D D8 4C 89 65 E0 4C 89 6D E8 4C 89 75 F0 4C 89 7D F8 48 8B F9 48 89 55 C0 4C 8B F2)
alloc(newmem,$1000)

label(code)
label(return)

label(resourcing)
label(coding)
label(spiriting)
label(droping)



label(spiritssss)
registersymbol(spiritssss)

label(dropssss)
registersymbol(dropssss)


newmem:
  push rax
  push rbx

  cmp [rcx+248], 0
  jne code

  xor rbx,rbx

  cmp [rdx+18], 0
  je code

resourcing:
  mov rax, [rdx+rbx*8+20]
  test rax,rax
  je coding

  mov rax, [rax+18]
  test rax,rax
  je coding

spiriting:
  cmp dword ptr [spiritssss], 1
  jne droping

  mov [rax+10],#999999

droping:
  cmp dword ptr [dropssss], 1
  jne coding

  mov [rax+14],#999999


coding:
  inc rbx
  cmp ebx, [rdx+18]
  jne resourcing

code:
  pop rbx
  pop rax

  mov [rbp-28],rdi
  mov [rbp-20],r12
  mov [rbp-18],r13
  mov [rbp-10],r14
  jmp return

spiritssss:
dd 0

dropssss:
dd 0


cheatingjerry:
  jmp far newmem
  nop 2
return:
registersymbol(cheatingjerry)

[DISABLE]

cheatingjerry:
  db 48 89 7D D8 4C 89 65 E0 4C 89 6D E8 4C 89 75 F0

unregistersymbol(cheatingjerry)
unregistersymbol(spiritssss)
unregistersymbol(dropssss)
unregistersymbol(firessss)
unregistersymbol(torshakal)
dealloc(newmem)"""

