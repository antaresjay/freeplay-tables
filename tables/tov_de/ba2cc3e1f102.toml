[[cheat]]
id = "damage-modifier-script"
name = "Damage Modifier Script"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DamageModAOB,TOV_DE.exe,8B 4F 4C 8B 47 54 03 CB 3B C8 7E 10) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,2048,DamageModAOB)

label(originalcode)
label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(EnemyDamageMultiplier)
registersymbol(EnemyDamageMultiplier)
label(HeroDamageMultiplier)
registersymbol(HeroDamageMultiplier)
label(EnemyHealingMultiplier)
registersymbol(EnemyHealingMultiplier)
label(HeroHealingMultiplier)
registersymbol(HeroHealingMultiplier)
label(HeroCannotDie)
registersymbol(HeroCannotDie)
label(AffectYuriOnly)
registersymbol(AffectYuriOnly)

newmem:
  mov ecx,[rdi+4C]
  cmp [rdi+04],0
  jne EnemyHit
  cmp [rdi+08],0
  jne EnemyHit
HeroHit:
  cmp [AffectYuriOnly],0
  je @F
  cmp [rdi+44],1
  jne originalcode
@@:
  cmp ebx,0
  jl HeroDamageHit
  jg HeroHealingHit
  jmp originalcode
HeroDamageHit:
  cmp [HeroDamageMultiplier],(float)0.0
  je CheckGodMode
  neg ebx
  push ebx
  fild dword ptr [esp]
  fmul dword ptr [HeroDamageMultiplier]
  fistp dword ptr [esp]
  pop ebx
  neg ebx
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor ebx,ebx
  jmp originalcode
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne originalcode
  neg ebx
  cmp ebx,ecx
  jl @F
  xor ebx,ebx
@@:
  neg ebx
  jmp originalcode
HeroHealingHit:
  cmp [HeroHealingMultiplier],(float)0.0
  je originalcode
  push ebx
  fild dword ptr [esp]
  fmul dword ptr [HeroHealingMultiplier]
  fistp dword ptr [esp]
  pop ebx
  jmp originalcode
EnemyHit:
  cmp [AffectYuriOnly],0
  je @F
  cmp r10,1000
  jb @F
  cmp [r10+44],1
  jne originalcode
@@:
  cmp ebx,0
  jl EnemyDamageHit
  jg EnemyHealingHit
  jmp CheckOneHitKill
EnemyDamageHit:
  cmp [EnemyDamageMultiplier],(float)0.0
  je CheckOneHitKill
  neg ebx
  push ebx
  fild dword ptr [esp]
  fmul dword ptr [EnemyDamageMultiplier]
  fistp dword ptr [esp]
  pop ebx
  neg ebx
CheckOneHitKill:
  cmp [OneHitKill],1
  jne originalcode
  mov ebx,#99999
  neg ebx
  jmp originalcode
EnemyHealingHit:
  cmp [EnemyHealingMultiplier],(float)0.0
  je originalcode
  push ebx
  fild dword ptr [esp]
  fmul dword ptr [EnemyHealingMultiplier]
  fistp dword ptr [esp]
  pop ebx
    
originalcode:
  mov eax,[rdi+54]
  add ecx,ebx

  jmp return

GodMode:
dq 0
OneHitKill:
dq 0
EnemyDamageMultiplier:
dq (float)5.0
HeroDamageMultiplier:
dq (float)0.125
EnemyHealingMultiplier:
dq (float)0.0
HeroHealingMultiplier:
dq (float)2.0
HeroCannotDie:
dq 1
AffectYuriOnly:
dq 0

DamageModAOB:
  jmp newmem
  nop
  nop
  nop
return:

[DISABLE]

DamageModAOB:
  db 8B 4F 4C 8B 47 54 03 CB

unregistersymbol(DamageModAOB)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(EnemyDamageMultiplier)
unregistersymbol(EnemyHealingMultiplier)
unregistersymbol(HeroDamageMultiplier)
unregistersymbol(HeroHealingMultiplier)
unregistersymbol(HeroCannotDie)
unregistersymbol(AffectYuriOnly)

dealloc(newmem)"""

