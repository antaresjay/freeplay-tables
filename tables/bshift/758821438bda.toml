[[cheat]]
id = "console-cheats"
name = "console cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{To enable console cheats make an icon shortcut
then properties add ff: to lines
bshift.exe -console -window

to enter cheats press the tilde key ~ on
your keyboard a console will scroll down.

Cheats:
type sv_cheats 1 then press Enter to enable
cheats type the ff, followed by enter.

god - enables God mode
impulse 101 - hev, all weapons ammo
noclip - fly mode

NOTE: cheats will not work until in the game
where the action starts, then you have to retype
it or reload save game.
}
[ENABLE]
[DISABLE]"""
