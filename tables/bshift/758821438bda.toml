[[cheat]]
id = "unltd-health-1-hit-kill"
name = "unltd health+1 hit kill"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(life,hl.dll,D9 98 40 01 00 00 83)
alloc(newmem,$1000)
label(code)
label(return)
newmem:
  cmp [eax+188],1
  je hero
  mov [eax+00000140],0
  jmp return
hero:
  mov [eax+00000140],(float)100
  jmp return
code:
  fstp dword ptr [eax+00000140]
  jmp return
life:
  jmp newmem
  nop
return:
registersymbol(life)
[DISABLE]
life:
  db D9 98 40 01 00 00
unregistersymbol(life)
dealloc(newmem)"""

