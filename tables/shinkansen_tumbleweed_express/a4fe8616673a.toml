[[cheat]]
id = "traincar-base-address-scan-to-activate-play-level-to-update-play-level"
name = "TrainCar Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(TrainCar_savedAOB)
label(TrainCar_returnhere)
label(TrainCar_originalcode)
label(TrainCar_exit)

label(TrainCar_update_exit)
label(TrainCar_set_exit)
label(TrainCar_healthset_exit)
label(TrainCar_suppliesset_exit)

registersymbol(TrainCar_savedAOB)

//05013453 - 83 EC 0C              - sub esp,0C
//05013456 - FF 75 08              - push [ebp+08]
//05013459 - E8 3223FEFF           - call 04FF5790
// _TrainCar:get_HealthLevel+2e
//0501345E - 83 C4 10              - add esp,10
//05013461 - 8B 40 10              - mov eax,[eax+10]
//05013464 - EB 0A                 - jmp 05013470
//05013466 - 33 C0                 - xor eax,eax
aobscan(TrainCar_searchedAOB, 83 C4 10 8B 40 10 EB 0A)

alloc(TrainCar_newmem, 2048, TrainCar_searchedAOB)
alloc(TrainCar_temp1, 4, TrainCar_searchedAOB)


TrainCar_newmem:
mov [TrainCar_temp1], ebx

cmp dword ptr [TrainCar_update_enable], #0
je TrainCar_update_exit
mov [TrainCar_basepointer], eax
TrainCar_update_exit:

cmp dword ptr [TrainCar_set_enable], #0
je TrainCar_set_exit
TrainCar_set_exit:

cmp dword ptr [TrainCar_healthset_enable], #0
je TrainCar_healthset_exit
mov [eax+10], #999
TrainCar_healthset_exit:

cmp dword ptr [TrainCar_suppliesset_enable], #0
je TrainCar_suppliesset_exit
mov ebx, [eax+18]
mov [eax+14], ebx
TrainCar_suppliesset_exit:

mov ebx, [TrainCar_temp1]


TrainCar_originalcode:
db 83 C4 10 8B 40 10
//add esp,10
//mov eax,[eax+10]


TrainCar_exit:
jmp TrainCar_returnhere


TrainCar_searchedAOB:
TrainCar_savedAOB:
jmp TrainCar_newmem
nop
TrainCar_returnhere:


[DISABLE]
TrainCar_savedAOB:
db 83 C4 10 8B 40 10
//add esp,10
//mov eax,[eax+10]

unregistersymbol(TrainCar_savedAOB)

dealloc(TrainCar_newmem)
dealloc(TrainCar_temp1)"""

