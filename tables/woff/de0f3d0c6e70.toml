[[cheat]]
id = "damage-modifier-script"
name = "Damage Modifier Script"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DamageModAOB,WOFF.exe,F3 0F 2C C6 66 0F 6E C0 0F 5B C0) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,2048,DamageModAOB)

label(code)
label(return)
label(DamageData)
registersymbol(DamageData)
label(EnemyDamageMult)
registersymbol(EnemyDamageMult)
label(OneHitKill)
registersymbol(OneHitKill)
label(OneHitKillDamage)
registersymbol(OneHitKillDamage)

newmem:

code:
  cvttss2si eax,xmm6

  cmp [EnemyDamageMult],(float)0.0
  je _DamageCheck
    cmp byte ptr [rbx+2DF4],0
    je _DamageFail
    push rax
    fild dword ptr [rsp]
    fmul dword ptr [EnemyDamageMult]
    fistp dword ptr [rsp]
    pop rax\t
  _DamageCheck:
  cmp [OneHitKill],1
  jne _DamageFail
    cmp byte ptr [rbx+2DF4],0
    je _DamageFail
    mov eax,[OneHitKillDamage]
  _DamageFail:
  cmp byte ptr [rbx+2DF4],0
  jne _NotPlayer
  cmp [DamageData],1
  jne @F
  xor eax,eax
  @@:
  _NotPlayer:

  movd xmm0,eax
  jmp return

DamageData:
dd 1
OneHitKill:
dd 0
EnemyDamageMult:
dd (float)0.0
OneHitKillDamage:
dd #999999

DamageModAOB:
  jmp newmem
  nop
  nop
  nop
return:

[DISABLE]

DamageModAOB:
  db F3 0F 2C C6 66 0F 6E C0

unregistersymbol(DamageModAOB)
unregistersymbol(DamageData)
unregistersymbol(OneHitKill)
unregistersymbol(OneHitKillDamage)
unregistersymbol(EnemyDamageMult)
dealloc(newmem)"""

