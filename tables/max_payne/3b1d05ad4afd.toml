[[cheat]]
id = "god-mode"
name = "God Mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(GmodeIP,8B ** ** ** 89 81 85) // should be unique
alloc(newmem,$1000)
label(code)
label(return)
label(GmodeID)
registersymbol(GmodeID)

newmem:
cmp [ecx+000003C2],0
jne code
mov [ecx+00000085],(float)100
jmp return

code:
  mov [ecx+00000085],eax
  jmp return

GmodeIP+04:
GmodeID:
  jmp newmem
  nop
return:

[DISABLE]
GmodeID:
  mov [ecx+00000085],eax
  //db 89 81 85 00 00 00
  dealloc(newmem)
  unregistersymbol(GmodeID)"""

[[cheat]]
id = "infinite-bullets"
name = "Infinite Bullets"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(ammoIP,,FF 89 CB 01) // should be unique
alloc(newmem,$1000)
label(code)
label(return)
label(ammoID)
registersymbol(ammoID)

newmem:
push eax
mov eax,ebp
add eax,F0
mov eax,[eax]
cmp [eax+000002F7],0 //2F7=3C2-CB //3C2 is an offset from dissect sturcture also we will have to change register from ecx to eax
pop eax              //110F8329<-(a close address to our health base from the ammo tracer stack)[-]110F825E (health base)=CB
je return

code:
  dec [ecx+000001CB]
  jmp return

ammoIP:
ammoID:
  jmp newmem
  nop
return:

[DISABLE]
ammoID:
  dec [ecx+000001CB]
  //db FF 89 CB 01 00 00
  unregistersymbol(ammoID)
  dealloc(newmem)"""

