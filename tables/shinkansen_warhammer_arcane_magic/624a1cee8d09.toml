[[cheat]]
id = "gamecontroller-base-address-scan-initialization-activate-this-first"
name = "GameController Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameController_basepointer)
registersymbol(GameController_update_enable)
registersymbol(GameController_set_enable)

alloc(GameController_basepointer, 4)
alloc(GameController_update_enable, 4)
alloc(GameController_set_enable, 4)


[DISABLE]
unregistersymbol(GameController_basepointer)
