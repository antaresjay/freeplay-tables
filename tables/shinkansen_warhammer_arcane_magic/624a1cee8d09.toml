unregistersymbol(GameController_set_enable)

dealloc(GameController_basepointer)
dealloc(GameController_update_enable)
dealloc(GameController_set_enable)"""

[[cheat]]
id = "gamecontroller-base-address-scan-to-activate-play-level-to-update-play-level"
name = "GameController Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameController_savedAOB)
label(GameController_returnhere)
label(GameController_originalcode)
label(GameController_exit)

label(GameController_update_exit)
label(GameController_set_exit)

registersymbol(GameController_savedAOB)

//0479FFAC - 83 EC 04              - sub esp,04
//0479FFAF - 8B 7D 08              - mov edi,[ebp+08]
// GameController:set_TotalGameScore+9
//0479FFB2 - 0FB6 87 D0000000      - movzx eax,byte ptr [edi+000000D0]
//0479FFB9 - 85 C0                 - test eax,eax
//0479FFBB - 74 30                 - je 0479FFED
//0479FFBD - 8B 47 60              - mov eax,[edi+60]
//0479FFC0 - 8B C8                 - mov ecx,eax
aobscan(GameController_searchedAOB, 0F B6 87 D0 00 00 00 85 C0 74 30)

alloc(GameController_newmem, 2048, GameController_searchedAOB)
alloc(GameController_temp1, 4, GameController_searchedAOB)
alloc(GameController_temp2, 4, GameController_searchedAOB)


GameController_newmem:
mov [GameController_temp1], ebx
mov [GameController_temp2], edx

cmp dword ptr [GameController_update_enable], #0
je GameController_update_exit
mov [GameController_basepointer], edi
GameController_update_exit:

cmp dword ptr [GameController_set_enable], #0
je GameController_set_exit
cmp dword ptr [edi+60], #0
je GameController_set_exit
mov ebx, [edi+60]
cmp dword ptr [ebx+24], #0
je GameController_set_exit
mov ebx, [ebx+24]
mov edx, [ebx+20]
mov [ebx+1c], edx
GameController_set_exit:

mov ebx, [GameController_temp1]
mov edx, [GameController_temp2]


GameController_originalcode:
db 0F B6 87 D0 00 00 00
//movzx eax,byte ptr [edi+000000D0]


GameController_exit:
jmp GameController_returnhere


GameController_searchedAOB:
GameController_savedAOB:
jmp GameController_newmem
nop
nop
GameController_returnhere:


[DISABLE]
GameController_savedAOB:
db 0F B6 87 D0 00 00 00
//movzx eax,byte ptr [edi+000000D0]

unregistersymbol(GameController_savedAOB)

dealloc(GameController_newmem)
dealloc(GameController_temp1)
dealloc(GameController_temp2)"""

