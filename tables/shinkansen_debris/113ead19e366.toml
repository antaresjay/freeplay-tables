[[cheat]]
id = "gamemanager-base-address-scan-initialization-activate-this-first"
name = "GameManager Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameManager_basepointer)
registersymbol(GameManager_update_enable)
registersymbol(GameManager_set_enable)
registersymbol(GameManager_squidpowerset_enable)
registersymbol(GameManager_playerpowerset_enable)

alloc(GameManager_basepointer, 8)
alloc(GameManager_update_enable, 4)
alloc(GameManager_set_enable, 4)
alloc(GameManager_squidpowerset_enable, 4)
alloc(GameManager_playerpowerset_enable, 4)


[DISABLE]
unregistersymbol(GameManager_basepointer)
unregistersymbol(GameManager_update_enable)
unregistersymbol(GameManager_set_enable)
unregistersymbol(GameManager_squidpowerset_enable)
unregistersymbol(GameManager_playerpowerset_enable)

dealloc(GameManager_basepointer)
dealloc(GameManager_update_enable)
dealloc(GameManager_set_enable)
dealloc(GameManager_squidpowerset_enable)
dealloc(GameManager_playerpowerset_enable)"""

[[cheat]]
id = "gamemanager-base-address-scan-to-activate-play-level-to-update-play-level"
name = "GameManager Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameManager_savedAOB)
label(GameManager_returnhere)
label(GameManager_originalcode)
label(GameManager_exit)

label(GameManager_update_exit)
label(GameManager_set_exit)
label(GameManager_squidpowerset_exit)
label(GameManager_playerpowerset_exit)
label(GameManager_playerpowerset_entry)
label(GameManager_playerpowerset_continue)

registersymbol(GameManager_savedAOB)

//175A3BC5 - 48 8B 85 88F5FFFF     - mov rax,[rbp-00000A78]
//175A3BCC - 48 89 85 D0F1FFFF     - mov [rbp-00000E30],rax
// Moonray.UX:GameManager:Update+35c3
//175A3BD3 - F3 0F10 80 38010000   - movss xmm0,[rax+00000138]
//175A3BDB - F3 0F5A C0            - cvtss2sd xmm0,xmm0
//175A3BDF - F2 0F11 85 C8F1FFFF   - movsd [rbp-00000E38],xmm0
//175A3BE7 - 48 83 EC 20           - sub rsp,20
//175A3BEB - 49 BB 3021460500000000 - mov r11,0000000005462130 : [EC8B4855]
//175A3BF5 - 41 FF D3              - call r11d
aobscan(GameManager_searchedAOB, F3 0F 10 80 38 01 00 00 F3 0F 5A C0 F2 0F 11 85 C8 F1 FF FF 48 83 EC 20)

alloc(GameManager_newmem, 2048, GameManager_searchedAOB)
alloc(GameManager_temp1, 8, GameManager_searchedAOB)
alloc(GameManager_temp2, 8, GameManager_searchedAOB)
alloc(GameManager_temp3, 8, GameManager_searchedAOB)
alloc(GameManager_temp4, 8, GameManager_searchedAOB)
alloc(GameManager_temp5, 8, GameManager_searchedAOB)


GameManager_newmem:
mov [GameManager_temp1], rax
mov [GameManager_temp2], rbx
mov [GameManager_temp3], rcx
mov [GameManager_temp4], rdx

cmp dword ptr [GameManager_update_enable], #0
je GameManager_update_exit
mov [GameManager_basepointer], rax
GameManager_update_exit:

cmp dword ptr [GameManager_set_enable], #0
je GameManager_set_exit
GameManager_set_exit:

cmp dword ptr [GameManager_squidpowerset_enable], #0
je GameManager_squidpowerset_exit
mov rbx, [rax+20]
test rbx, rbx
je GameManager_squidpowerset_exit
mov rbx, [rbx+b0]
test rbx, rbx
je GameManager_squidpowerset_exit
fld [rbx+6c]
fstp [rbx+70]
GameManager_squidpowerset_exit:

cmp dword ptr [GameManager_playerpowerset_enable], #0
je GameManager_playerpowerset_exit
mov rdx, 0
mov rbx, [rax+40]
test rbx, rbx
je GameManager_playerpowerset_exit
mov rbx, [rbx+28]
test rbx, rbx
je GameManager_playerpowerset_exit
mov rcx, [rbx+18]
test rcx, rcx
je GameManager_playerpowerset_exit
mov [GameManager_temp5], rcx
GameManager_playerpowerset_entry:
mov rcx, [rbx+rdx*8+20]
test rcx, rcx
je GameManager_playerpowerset_continue
mov rcx, [rcx+b0]
test rcx, rcx
je GameManager_playerpowerset_continue
fld [rcx+6c]
fstp [rcx+70]
GameManager_playerpowerset_continue:
inc rdx
mov rcx, [GameManager_temp5]
cmp rcx, rdx
je GameManager_playerpowerset_exit
jmp GameManager_playerpowerset_entry
GameManager_playerpowerset_exit:

mov rax, [GameManager_temp1]
mov rbx, [GameManager_temp2]
mov rcx, [GameManager_temp3]
mov rdx, [GameManager_temp4]


GameManager_originalcode:
db F3 0F 10 80 38 01 00 00
//movss xmm0,[rax+00000138]


GameManager_exit:
jmp GameManager_returnhere


GameManager_searchedAOB:
GameManager_savedAOB:
jmp GameManager_newmem
nop
nop
nop
GameManager_returnhere:


[DISABLE]
GameManager_savedAOB:
db F3 0F 10 80 38 01 00 00
//movss xmm0,[rax+00000138]

unregistersymbol(GameManager_savedAOB)

dealloc(GameManager_newmem)
dealloc(GameManager_temp1)
dealloc(GameManager_temp2)
dealloc(GameManager_temp3)
dealloc(GameManager_temp4)
dealloc(GameManager_temp5)"""

