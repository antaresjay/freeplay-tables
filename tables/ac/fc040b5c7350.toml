[[cheat]]
id = "activate-in-battle"
name = "[ Activate In Battle ]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(_AobPlayerBase,48 63 89 D0 00 00 00)
alloc(newmem,$1000)

label(code)
label(return)
label(Health)
label(ActionPoints)
label(Luck)
label(Stress)
label(Ammo)
label(HitChance)
label(Damage)

newmem:
push rsi
push rdi

cmp [Health],0
je Lap
mov dword ptr [rcx+000000D8],3E7
mov dword ptr [rcx+000000E0],3E7

Lap:
cmp [ActionPoints],0
je LabelLuck
mov dword ptr [rcx+000000D0],C

LabelLuck:
cmp [Luck],0
je LabelStress
mov dword ptr [rcx+000000D4],3E7
mov dword ptr [rcx+000000DC],3E7

LabelStress:
cmp [Stress],0
je LabelAmmo
mov dword ptr [rcx+000000E4],0

LabelAmmo:
cmp [Ammo],0
je LabelHit
mov rsi,[rcx+00000068]
cmp rsi,1000000
jna code
mov rsi,[rsi+00000028]
cmp rsi,1000000
jna code
mov [rsi+00000020],63

LabelHit:
cmp [HitChance],0
je LabelDmg
mov rsi,[rcx+00000018]
cmp rsi,1000000
jna code
mov rsi,[rsi+00000010] // Primary Weapon
cmp rsi,1000000
jna code
mov dword ptr [rsi+0000003C],64

////////////////////////////////

mov rdi,[rcx+00000018]
cmp rdi,1000000
jna code
mov rdi,[rdi+00000020] // Secondary Weapon
cmp rdi,1000000
jna code
mov dword ptr [rdi+0000003C],64

LabelDmg:
cmp [Damage],0
je code
mov rsi,[rcx+00000018]
cmp rsi,1000000
jna code
mov rsi,[rsi+00000010] // Dmg Primary Weapon
cmp rsi,1000000
jna code
mov dword ptr [rsi+00000034],#9999
mov dword ptr [rsi+00000048],#9999

////////////////////////////////

mov rdi,[rcx+00000018]
cmp rdi,1000000
jna code
mov rdi,[rdi+00000020] // Dmg Secondary Weapon
cmp rdi,1000000
jna code
mov dword ptr [rdi+00000034],#9999
mov dword ptr [rdi+00000048],#9999

code:
  pop rdi
  pop rsi
  movsxd  rcx,dword ptr [rcx+000000D0]
  jmp return

Health:
dd 0

ActionPoints:
dd 0

Luck:
dd 0

Stress:
dd 0

Ammo:
dd 0

HitChance:
dd 0

Damage:
dd 0

_AobPlayerBase:
  jmp newmem
  nop
  nop
return:
registersymbol(_AobPlayerBase)
registersymbol(Health)
registersymbol(ActionPoints)
registersymbol(Luck)
registersymbol(Stress)
registersymbol(Ammo)
registersymbol(HitChance)
registersymbol(Damage)

[DISABLE]

_AobPlayerBase:
  db 48 63 89 D0 00 00 00

unregistersymbol(_AobPlayerBase)
unregistersymbol(Health)
unregistersymbol(ActionPoints)
unregistersymbol(Luck)
unregistersymbol(Stress)
unregistersymbol(Ammo)
unregistersymbol(HitChance)
unregistersymbol(Damage)
dealloc(newmem)

