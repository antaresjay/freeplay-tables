[[cheat]]
id = "infinite-sun-ctrl-numpad-5"
name = "Infinite Sun (Ctrl + Numpad 5)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(sun,GameAssembly.dll,8Bxxxx4885xx0F84xxxxxxxx4Cxxxxxxxxxxxx85xx8B) //Reloaded.DataModels.GameplayDataModel.OnTick
alloc(newmem,$1000,sun)
alloc(sunbkp,6)
registersymbol(sun)
registersymbol(sunbkp)
label(code)
label(return)

sunbkp:
  readmem(sun,6)

newmem:
  mov [rax+10],(int)9999

code:
  readmem(sun,6)
  jmp return

sun:
  jmp newmem
  nop
return:

[DISABLE]

sun:
  readmem(sunbkp,6)

unregistersymbol(*)
dealloc(*)"""
