[[cheat]]
id = "player-character-ctrl-numpad-1"
name = "Player Character (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : StarshipTroopers_UBW-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.6.0.0
// Game Version      : Build.22263018
// Script Date       : 2026-03-18


[ENABLE]

aobscanmodule(master,StarshipTroopers_UBW-Win64-Shipping.exe,488BxxFFxxxxxxxxxx0F57xx0F2Fxx0F96xx4883xxxxC3) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,9)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,9)

newmem:
  mov [data],rcx

code:
  readmem(master,9)
  jmp return

master:
  jmp newmem
  nop 4
return:

[DISABLE]

master:
  readmem(masterbkp,9)

unregistersymbol(*)
dealloc(*)"""

