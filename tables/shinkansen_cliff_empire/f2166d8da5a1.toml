[[cheat]]
id = "image-base-address-scan-to-activate-enter-research-selection-panel-to-update-enter-research-selection-panel"
name = "Image Base Address Scan (To Activate: Enter Research Selection Panel, To Update: Enter Research Selection Panel)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Image_savedAOB)
label(Image_returnhere)
label(Image_originalcode)
label(Image_exit)

label(Image_update_exit)
label(Image_researchset_exit)

registersymbol(Image_originalcode)
registersymbol(Image_savedAOB)

//054B7D42 - 39 00                 - cmp [eax],eax
//054B7D44 - E8 07C6FFFF           - call 054B4350
// UnityEngine.UI:Image:GenerateFilledSprite+101
//054B7D49 - 83 C4 10              - add esp,10
//054B7D4C - D9 43 6C              - fld dword ptr [ebx+6C]
//054B7D4F - D9 05 0886810D        - fld dword ptr [0D818608] : [3A83126F]
//054B7D55 - DFF1                  - fcomip st(0),st(1)
//054B7D57 - DDD8                  - fstp st(0)
//054B7D59 - 76 05                 - jna 054B7D60
//054B7D5B - E9 F5180000           - jmp 054B9655
//054B7D60 - 8D 85 24FEFFFF        - lea eax,[ebp-000001DC]
aobscan(Image_searchedAOB, 83 C4 10 D9 43 6C * * * * * * DF F1 DD D8 76 05)

alloc(Image_newmem, 2048, Image_searchedAOB)
alloc(Image_temp1, 4, Image_searchedAOB)
alloc(Image_temp2, 4, Image_searchedAOB)
alloc(Image_temp3, 4, Image_searchedAOB)
alloc(Image_temp4, 4, Image_searchedAOB)
alloc(Image_temp5, 4, Image_searchedAOB)


Image_newmem:
mov [Image_temp1], eax
mov [Image_temp2], ebx
mov [Image_temp3], ecx
mov [Image_temp4], edx

cmp dword ptr [Image_update_enable], #0
je Image_update_exit
mov [Image_basepointer], ebx
Image_update_exit:

cmp dword ptr [Image_researchset_enable], #0
je Image_researchset_exit
mov [Image_temp5], (float)0.9900
fld [Image_temp5]
fld [ebx+6c]
fcomi ST(0), ST(1)
fstp ST(0)
fstp ST(0)
ja Image_researchset_exit
mov [ebx+6c], (float)0.9999
Image_researchset_exit:

mov eax, [Image_temp1]
mov ebx, [Image_temp2]
mov ecx, [Image_temp3]
mov edx, [Image_temp4]


Image_originalcode:
readmem(Image_searchedAOB, 6)


Image_exit:
jmp Image_returnhere


Image_searchedAOB:
Image_savedAOB:
jmp Image_newmem
nop
Image_returnhere:


[DISABLE]
Image_savedAOB:
readmem(Image_originalcode, 6)

unregistersymbol(Image_originalcode)
unregistersymbol(Image_savedAOB)

dealloc(Image_newmem)
dealloc(Image_temp1)
dealloc(Image_temp2)
dealloc(Image_temp3)
dealloc(Image_temp4)
dealloc(Image_temp5)"""

