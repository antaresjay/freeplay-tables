type = "script"
source = """
{ Game   : The Bookwalker.exe
  Version: 2.0
  Date   : 2023-07-01
  Author : BitKit

  This script does blah blah blah
}

[ENABLE]
aobscanmodule(BookwalkerScript,GameAssembly.dll,89 54 C1 30 FF 43 24 B0 01) // should be unique
alloc(newmem,$1000,BookwalkerScript)
alloc(UnlimHP,4)
alloc(UnlimInk,4)

registersymbol(UnlimHP)
registersymbol(UnlimInk)

UnlimHP:
dd 0
UnlimInk:
dd 0

label(code)
label(endHP)
label(return)

newmem:
  cmp [UnlimHP],1
  jne endHP
  cmp rax,3
  jne endHP
  cmp [rcx+48],edx
  jle endHP
  mov edx,[rcx+48]
endHP:
  cmp [UnlimInk],1
  jne code
  cmp rax,6
  jne code
  cmp [rcx+60],edx
  jle code
  mov edx,[rcx+60]
code:
  mov [rcx+rax*8+30],edx
  inc [rbx+24]
  jmp return

BookwalkerScript:
  jmp newmem
  nop 2
return:
registersymbol(BookwalkerScript)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
BookwalkerScript:
  db 89 54 C1 30 FF 43 24

unregistersymbol(BookwalkerScript)
unregistersymbol(UnlimHP)
unregistersymbol(UnlimInk)
