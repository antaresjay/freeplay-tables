[[cheat]]
id = "hook-player"
name = "Hook Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : ExampleGame-Win64-Shipping.exe
  Version: 
  Date   : 2022-12-21
  Author : Messy6666 ( aka SinGul4ritY )
           2022-12-26 - Added hook to Game Engine for Tablets, ManuScripts and Perks
}

[ENABLE]
aobscanmodule(hkPlayer,$process,48 8B ?? 4C ?? ?? 48 89 ?? ?? ?? 49 8B ?? 8B)
aobscanmodule(hkGameEngine,$process,48 8B ?? 41 B0 ?? 41 0F ?? ?? 48 8B ?? FF ?? ?? ?? ?? ?? 48 8B)

alloc(newmem,256,hkPlayer)
alloc(newmem2,512,hkGameEngine)
alloc(Actor,8,hkPlayer)
alloc(GameEngine,8,hkGameEngine)

registersymbol(hkGameEngine)
registersymbol(hkGameEngineBkp)
registersymbol(hkPlayer)
registersymbol(hkPlayerBkp)
registersymbol(Actor)
registersymbol(GameEngine)

label(hkPlayerBkp)
label(return)
label(hkGameEngineBkp)
label(return2)

newmem:
{
  cmp  [Actor], 0
  jne  @f
}

  mov  rax, [rcx+0030]
  test rax, rax
  je   @f
  mov  rax, [rax+0358]
  test rax, rax
  je   @f
  cmp  [rax+0338], 0
  je   @f
  mov  [Actor], rax
hkPlayerBkp:
  readmem(hkPlayer, 6)
  jmp  return

hkPlayer:
  jmp newmem
  nop
return:


newmem2:
  mov [GameEngine], rdi
hkGameEngineBkp:
  readmem(hkGameEngine, 6)
  jmp return2

hkGameEngine:
  jmp newmem2
  nop
return2:


[DISABLE]

hkPlayer:
  readmem(hkPlayerBkp, 6)

hkGameEngine:
  readmem(hkGameEngineBkp, 6)

unregistersymbol(*)
dealloc(*)"""
