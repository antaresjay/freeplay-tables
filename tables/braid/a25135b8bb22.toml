[[cheat]]
id = "grab-pos-enable-this-first"
name = "grab pos / enable this first"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(originalcode)
label(exit)
label(x)
registersymbol(x)
label(y)
registersymbol(y)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
x:
dd 00 00 00 00
y:
dd 00 00 00 00

originalcode:
lea eax,[esi+14]
mov [x],eax
add eax,4
mov [y],eax
mov eax,[esi+14]
mov ecx,[esi+18]

exit:
jmp returnhere

"Braid.exe"+3D2FC:
jmp originalcode
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
"Braid.exe"+3D2FC:
mov eax,[esi+14]
mov ecx,[esi+18]
//Alt: db 8B 46 14 8B 4E 18"""

