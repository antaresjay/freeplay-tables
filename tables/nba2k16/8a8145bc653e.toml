[[cheat]]
id = "nba-home-away-script"
name = "NBA Home & Away Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(AASHook, nba2k16.exe, 48 8B C4 48 89 70 18 48 89 78 20 55 41) // nba2k16.exe+470480
registersymbol(AASHook)

alloc(newmem, 256, "nba2k16.exe"+470480)

label(SetShoesCopy)
registersymbol(SetShoesCopy)

label(newcode)
label(return)

newmem:
  mov rax,rsp
  mov [rax+18],rsi

newcode:
  cmp [SetShoesCopy],1
  jne return
  push rax
  mov rax,[nba2k16.exe+87B8F90]
  mov [nba2k16.exe+46D8118], rax
  mov rax,[nba2k16.exe+879E018]
  mov [nba2k16.exe+46D8120], rax
  pop rax
  mov [SetShoesCopy],0
  jmp return

SetShoesCopy:
  dd 0

AASHook:
  jmp newmem
  db 90 90
return:

[DISABLE]

AASHook:
  mov rax,rsp
  mov [rax+18],rsi

unregistersymbol(AASHook)
unregistersymbol(SetShoesCopy)
dealloc(newmem)"""

