id = "inf-grip"
name = "Inf.Grip"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
aobscan(grip,D9 80 28 01 00 00 D9 5D D0 D9 45 D0 D9 80 14 01 00 00)
registersymbol(grip)


//
newmem: //this is allocated memory, you have read,write,execute access
//place your code here

mov [eax+00000128],(float)30
fld dword ptr [eax+00000128]
jmp returnhere

grip://GripMeter:Update+40:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
