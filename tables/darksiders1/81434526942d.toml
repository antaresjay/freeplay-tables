source = """
{ Game   : darksiders1.exe
  Version: v1.0.2679 (Build cs:2679)
  Date   : 23/10/2023
  Author : .mul0
}

[ENABLE]

aobscanmodule(PlayerCord,darksiders1.exe,8Bxxxxxxxxxx80xxxxxxxxxxxx8Bxxxx8Bxx8Dxxxxxxxxxx89xxxxxx89xxxxxx74xx80xxxxxx74xx80xxxxxxC6) // should be unique
alloc(newmem,$500)
alloc(PlayerCoordinatesAddress,$10)
alloc(Coordinates,$50)

label(code)
label(codeZ)
label(codeY)
label(return)

newmem:
  // Extract the coordinate X [Need to manually write register + offset]
  // [Need to manually write register + offset]
  // Example fld [eax+30] - 30 = X Coordinates
  fld dword ptr [eax+60]
  // Loading the value into the memory
  fstp dword ptr [Coordinates+300]

  // Extract the coordinate Y [Need to manually write register + offset]
  // [Need to manually write register + offset]
  // Example fld [eax+34] - 34 = Y Coordinates
  fld dword ptr [eax+64]
   // Loading the value into the memory
  fstp dword ptr [Coordinates+304]

  // Extract the coordinate Z [Need to manually write register + offset]
  // [Need to manually write register + offset]
  // Example fld [eax+38] - 38 = Z Coordinates
  fld dword ptr [eax+68]
   // Loading the value into the memory
  fstp dword ptr [Coordinates+308]

  //Multiplier (float)1.5 [You can enter your value]
  mov [Coordinates+200],(float)150

  // Checking pressing button "1" - Up
  cmp byte [Coordinates+51],01
  jne codeZ
  // Load coordinate Z
  fld dword ptr [eax+68]
  fld dword ptr [Coordinates+200]

  fadd st(0),st(1)

  fstp st(1)
  // Unload coordinate Z
  fstp dword ptr [eax+68]
  mov byte [Coordinates+51],00


  // Checking pressing button "2" - Down
  codeZ:
  cmp byte [Coordinates+52],01
  jne codeY
  fld dword ptr [eax+68]                          // Load coordinate Z
  fld dword ptr [Coordinates+200]

  fsub st(1),st(0)

  fstp st(0)
  fstp dword ptr [eax+68]                           // Unload coordinate Z
  mov byte [Coordinates+52],00


  codeY:
  // Checking pressing button "F" [Your hotkey for teleportation]
  cmp byte ptr [Coordinates+50],01
  jne code
  // The X coordinate of the character
  fld dword ptr [Coordinates+300]
  // X coordinate of camera [You need to find this value]
  // [Need to manually write register + offset]
  // Example fld [eax+30] - 30 = X Coordinates of Camera
  fld dword ptr [CameraPos+10]

  // Subtracts the x coordinate of the character from the x coordinate of the camera
  fsub st(1), st(0)

  fstp [Coordinates+150]
  fstp [Coordinates+155]

  // The X coordinate of the character
  fld [Coordinates+300] //
  fld [Coordinates+155]
  fadd st(0), st(1)

  // The X coordinate of the character
  // [Need to manually write register + offset]
  // Example fld [eax+30] - 30 = X Coordinates
  fstp dword ptr [eax+60]
  fstp st(0)

  //The Y coordinate
  fld dword ptr [Coordinates+304] // -- Player Y

  // Y coordinate of camera [You need to find this value]
  // [Need to manually write register + offset]
  // Example fld [eax+34] - 34 = Y Coordinates of Camera
  fld dword ptr [CameraPos+14]

  fsub st(1), st(0)
  fstp [Coordinates+170]
  fstp [Coordinates+175]

  fld [Coordinates+304] // -- Player Y
  fld [Coordinates+175] // -- 6
  fadd st(0), st(1)

  // The Y coordinate of the character
  // [Need to manually write register + offset]
  // Example fld [eax+34] - 34 = Y Coordinates
  fstp dword ptr [eax+64]
  fstp st(0)
  mov byte ptr [Coordinates+50],00
code:
  mov ecx,[eax+00000144]
  jmp return

PlayerCord:
  jmp newmem
  nop
return:

registersymbol(PlayerCord)
registersymbol(PlayerCoordinatesAddress)
registersymbol(Coordinates)

