[ENABLE]
aobscan(player,8B 49 74 3B C1)
alloc(newmem,$1000)
alloc(player_ptr,4)

label(code)
label(return)

newmem:

code:
  mov [player_ptr],edi
  mov ecx,[ecx+74]
  cmp eax,ecx
  jmp return

player:
  jmp code
return:
registersymbol(player)
registersymbol(player_ptr)

