[[cheat]]
id = "active-trainer"
name = "Active Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)

registersymbol(steelE)
registersymbol(brickE)
registersymbol(cementE)
registersymbol(cashE)
label(cashE)
label(cementE)
label(brickE)
label(steelE)

aobscanmodule(base,MR.exe,8B 42 18 89 45 D4 8B 4D D4)
registersymbol(base)


label(cement)
label(brick)
label(steel)
newmem: //this is allocated memory, you have read,write,execute access
//place your code here
{
18 cash
20 Cement
24 brick
28 steel
}

cmp [cashE],0
je cement
mov [edx+18],#9999999
cement:
cmp [cementE],0
je brick
mov [edx+20],#999
brick:
cmp [brickE],0
je steel
mov [edx+24],#999
steel:
cmp [steelE],0
je originalcode
mov [edx+28],#999

originalcode:
mov eax,[edx+18]
mov [ebp-2C],eax
jmp returnhere
cashE:
dd 0
cementE:
dd 0
brickE:
dd 0
steelE:
dd 0
base://"MR.exe"+1656E:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
base://
mov eax,[edx+18]
mov [ebp-2C],eax
//Alt: db 8B 42 18 89 45 D4

unregistersymbol(steelE)
unregistersymbol(brickE)
unregistersymbol(cementE)
unregistersymbol(cashE)
unregistersymbol(base)"""

