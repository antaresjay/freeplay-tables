[[cheat]]
id = "get-game-data"
name = "Get Game Data"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,DeskBird2D.PlayerModel:GetBirdAreaRunTime+2f)
define(bytes,48 63 86 A4 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,DeskBird2D.PlayerModel:GetBirdAreaRunTime+2f)
registersymbol(gMoney)
label(code return gMoney)

newmem:
mov [gMoney],rsi

code:
  movsxd  rax,dword ptr [rsi+000000A4]
  jmp return

gMoney:
dq

address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  db bytes

  unregistersymbol(*)
  dealloc(*)"""
