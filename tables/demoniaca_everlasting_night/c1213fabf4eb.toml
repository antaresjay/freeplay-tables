[ENABLE]

aobscan(playerBase,f3 0f 11 6f ? 48 8b cf 48 8d ad ? ? ? ? 49 bb ? ? ? ? ? ? ? ? 41 ff d3 0f b6 45)
//aobscanregion(playerBase,Devdog.InventoryPro:Stat:SetCurrentValueRaw,Devdog.InventoryPro:Stat:SetCurrentValueRaw+74,f3 0f 11 6f ? 48 8b cf)
alloc(newmem,$1000)
alloc(mainstat,8)

label(code)
label(return)

newmem:
  cmp [rdi+C58],1
  jne code
  mov [mainstat],rdi
  jmp return

code:
  movss [rdi+38],xmm5
  jmp return

playerBase:
  jmp newmem
return:
registersymbol(mainstat)
registersymbol(playerBase)

[DISABLE]

playerBase:
  db F3 0F 11 6F 38

unregistersymbol(mainstat)
unregistersymbol(playerBase)
dealloc(mainstat)
dealloc(newmem)"""

