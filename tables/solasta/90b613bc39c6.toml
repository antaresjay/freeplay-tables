label(code)
label(return)
label(factionsread)
label(fact)
registersymbol(factionsread)
registersymbol(fact)

newmem:
  push rdx
  mov rdx, rax
  test rdx, rdx
  jz code
  mov rdx, [rdx+30]                                                             //factionRelations
  test rdx, rdx
  jz code
  mov rdx, [rdx+18]                                                              //entries
  test rdx, rdx
  jz code
  mov [fact], rdx
code:
