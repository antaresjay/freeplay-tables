[[cheat]]
id = "character-stats-activate-navigate-character-sheet"
name = "Character stats (Activate: navigate character sheet)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
  label(base_return)

// 004A2A13 - 8B 45 FC  - mov eax,[ebp-04]
// 004A2A16 - 8B 4D FC  - mov ecx,[ebp-04]
// 004A2A19 - 66 8B 51 08  - mov dx,[ecx+08] <<

  aobscan(base_searchedAOB, 8B 45 FC 8B 4D FC 66 8B 51 08)
  alloc(base_newmem, 2048)

  registersymbol(base)
  alloc(base,4)

base_newmem:
  mov eax,[ebp-04]
  mov ecx,[ebp-04]
  mov [base],ecx
  jmp base_return

base_searchedAOB:
  jmp base_newmem
  nop

base_return:
  registersymbol(base_searchedAOB)

[DISABLE]

base_searchedAOB:
  db 8B 45 FC 8B 4D FC 66 8B 51 08

  unregistersymbol(base_searchedAOB)
  dealloc(base_newmem)
  unregistersymbol(base)
  dealloc(base)"""

