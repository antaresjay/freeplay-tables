[[cheat]]
id = "party-stats-base-address-scan-initialization-activate-this-first"
name = "Party Stats Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

registersymbol(partystatsupdate_enable)
registersymbol(partystatsset_enable)
registersymbol(partystats_basepointer)
registersymbol(partyitems_basepointer)
registersymbol(partymember1_basepointer)
registersymbol(partymember2_basepointer)
registersymbol(partymember3_basepointer)
registersymbol(partymember4_basepointer)
registersymbol(partymember5_basepointer)

alloc(partystatsupdate_enable,4)
alloc(partystatsset_enable,4)
alloc(partystats_basepointer,4)
alloc(partyitems_basepointer,4)
alloc(partymember1_basepointer,4)
alloc(partymember2_basepointer,4)
alloc(partymember3_basepointer,4)
alloc(partymember4_basepointer,4)
alloc(partymember5_basepointer,4)


[DISABLE]

unregistersymbol(partystatsupdate_enable)
unregistersymbol(partystatsset_enable)
unregistersymbol(partystats_basepointer)
unregistersymbol(partyitems_basepointer)
unregistersymbol(partymember1_basepointer)
unregistersymbol(partymember2_basepointer)
unregistersymbol(partymember3_basepointer)
unregistersymbol(partymember4_basepointer)
unregistersymbol(partymember5_basepointer)

dealloc(partystatsupdate_enable)
dealloc(partystatsset_enable)
dealloc(partystats_basepointer)
dealloc(partyitems_basepointer)
dealloc(partymember1_basepointer)
dealloc(partymember2_basepointer)
dealloc(partymember3_basepointer)
dealloc(partymember4_basepointer)
dealloc(partymember5_basepointer)"""

[[cheat]]
id = "party-stats-base-address-scan-to-update-view-inventory-items"
name = "Party Stats Base Address Scan (To Update: View Inventory Items)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(partystats_savedAOB)
label(partystats_returnhere)
label(partystats_originalcode)
label(partystats_exit)

label(partystatsupdate_exit)
label(partystatsset_exit)

registersymbol(partystats_savedAOB)

aobscan(partystats_searchedAOB,B9 80 00 00 00 90 80 78 01 00)

alloc(partystats_newmem,2048) //2kb should be enough

partystats_newmem:

cmp dword ptr [partystatsupdate_enable], #0
je partystatsupdate_exit
mov [partyitems_basepointer], eax
mov ecx, eax
sub ecx, e0
mov [partystats_basepointer], ecx
add ecx, 36
mov [partymember1_basepointer], ecx
add ecx, 22
mov [partymember2_basepointer], ecx
add ecx, 22
mov [partymember3_basepointer], ecx
add ecx, 22
mov [partymember4_basepointer], ecx
add ecx, 22
mov [partymember5_basepointer], ecx
partystatsupdate_exit:

cmp dword ptr [partystatsset_enable], #0
je partystatsset_exit
partystatsset_exit:


partystats_originalcode:
db B9 80 00 00 00
//mov ecx,00000080


partystats_exit:
jmp partystats_returnhere


partystats_searchedAOB:
partystats_savedAOB:
jmp partystats_newmem
partystats_returnhere:


[DISABLE]
partystats_savedAOB:
db B9 80 00 00 00
//mov ecx,00000080


unregistersymbol(partystats_savedAOB)

dealloc(partystats_newmem)"""

