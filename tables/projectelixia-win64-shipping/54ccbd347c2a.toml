source = """
{ Game   : ProjectELIXIA-Win64-Shipping.exe
  Date   : 2025-10-02
  Author : Sianz
}

[ENABLE]

aobscanmodule(pawn,ProjectELIXIA-Win64-Shipping.exe,4C 8B B9 D8 02 00 00) // should be unique
alloc(newmem,$1000,pawn)
alloc(stats,8)
label(code)
label(return)

newmem:
  test rcx,rcx
  je code
  cmp dword ptr [rcx+2D8],0
  je code
  mov [stats],rcx
code:
  mov r15,[rcx+000002D8]
  jmp return

pawn:
  jmp newmem
  nop 2
return:
registersymbol(pawn stats)

[DISABLE]

pawn:
  db 4C 8B B9 D8 02 00 00

unregistersymbol(*)
dealloc(*)"""
