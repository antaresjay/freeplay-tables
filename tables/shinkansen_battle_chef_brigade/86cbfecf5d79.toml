type = "script"
source = """
[ENABLE]
label(CharacterInventory_savedAOB)
label(CharacterInventory_returnhere)
label(CharacterInventory_originalcode)
label(CharacterInventory_exit)

label(CharacterInventory_update_exit)
label(CharacterInventory_set_exit)
label(CharacterInventory_goldset_exit)

registersymbol(CharacterInventory_savedAOB)

//2B2A9AAA - 49 BB 4065A01100000000 - mov r11,0000000011A06540 : [EC8B4855]
//2B2A9AB4 - 41 FF D3              - call r11d
// PersistentInventory:get_Currency+37
//2B2A9AB7 - 48 83 C4 20           - add rsp,20
//2B2A9ABB - 48 63 78 34           - movsxd  rdi,dword ptr [rax+34]
//2B2A9ABF - EB 02                 - jmp 2B2A9AC3
//2B2A9AC1 - 33 FF                 - xor edi,edi
//2B2A9AC3 - 48 8B C7              - mov rax,rdi
aobscan(CharacterInventory_searchedAOB, 48 83 C4 20 48 63 78 34 EB 02)

alloc(CharacterInventory_newmem, 2048, CharacterInventory_searchedAOB)
alloc(CharacterInventory_temp1, 8, CharacterInventory_searchedAOB)
alloc(CharacterInventory_temp2, 8, CharacterInventory_searchedAOB)
alloc(CharacterInventory_temp3, 8, CharacterInventory_searchedAOB)
alloc(CharacterInventory_temp4, 8, CharacterInventory_searchedAOB)
alloc(CharacterInventory_temp5, 8, CharacterInventory_searchedAOB)


CharacterInventory_newmem:
mov [CharacterInventory_temp1], rax
mov [CharacterInventory_temp2], rbx
mov [CharacterInventory_temp3], rcx
mov [CharacterInventory_temp4], rdx

cmp dword ptr [CharacterInventory_update_enable], #0
je CharacterInventory_update_exit
mov [CharacterInventory_basepointer], rax
CharacterInventory_update_exit:

cmp dword ptr [CharacterInventory_set_enable], #0
je CharacterInventory_set_exit
CharacterInventory_set_exit:

cmp dword ptr [CharacterInventory_goldset_enable], #0
je CharacterInventory_goldset_exit
mov [rax+34], #999999
CharacterInventory_goldset_exit:

mov rax, [CharacterInventory_temp1]
mov rbx, [CharacterInventory_temp2]
mov rcx, [CharacterInventory_temp3]
mov rdx, [CharacterInventory_temp4]


CharacterInventory_originalcode:
db 48 83 C4 20 48 63 78 34
//add rsp,20
//movsxd  rdi,dword ptr [rax+34]


CharacterInventory_exit:
jmp CharacterInventory_returnhere


CharacterInventory_searchedAOB:
CharacterInventory_savedAOB:
jmp CharacterInventory_newmem
nop
nop
nop
CharacterInventory_returnhere:


[DISABLE]
CharacterInventory_savedAOB:
db 48 83 C4 20 48 63 78 34
//add rsp,20
//movsxd  rdi,dword ptr [rax+34]

unregistersymbol(CharacterInventory_savedAOB)

dealloc(CharacterInventory_newmem)
dealloc(CharacterInventory_temp1)
dealloc(CharacterInventory_temp2)
dealloc(CharacterInventory_temp3)
dealloc(CharacterInventory_temp4)
dealloc(CharacterInventory_temp5)"""

