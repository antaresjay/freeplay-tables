type = "script"
source = """
[ENABLE]

assert(ostriv.exe+2957D6,F2 0F 11 81 A8 9B 13 00)
alloc(newmem_money,$1000,ostriv.exe+2957D6)
alloc(moneyBase,8)

registersymbol(moneyBase)
label(return_money)

newmem_money:
  mov [moneyBase],rcx
  movsd [rcx+00139BA8],xmm0
  jmp return_money

ostriv.exe+2957D6:
  jmp newmem_money
  nop 3

return_money:

[DISABLE]

ostriv.exe+2957D6:
  db F2 0F 11 81 A8 9B 13 00

unregistersymbol(moneyBase)
dealloc(newmem_money)
dealloc(moneyBase)"""

