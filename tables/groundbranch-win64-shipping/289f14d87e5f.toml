type = "script"
source = """
[ENABLE]

aobscanmodule(ammocd,GroundBranch-Win64-Shipping.exe,44 8B 81 60 04 00 00 44)
alloc(newmem,$1000,ammocd)

label(code)
label(return)

newmem:
code:
  mov eax, [rcx+458]
  mov [rcx+460], eax
  mov r8d,[rcx+00000460]
  jmp return

ammocd:
  jmp newmem
  nop
  nop
return:
registersymbol(ammocd)

[DISABLE]

ammocd:
  db 44 8B 81 60 04 00 00

unregistersymbol(ammocd)
dealloc(newmem)"""
