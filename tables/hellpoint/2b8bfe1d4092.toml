[[cheat]]
id = "all-in-one"
name = "All in One"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Hellpoint.exe
  Version:
  Date   : 2021-01-24
  Author : Akira Fudo
}

define(orig_bytes, F3 0F 10 8B 88 01 00 00)

[ENABLE]

aobscanmodule(Movement,GameAssembly.dll,F3 0F 10 8B 88 01 00 00) // should be unique
assert(Movement, orig_bytes)

registerSymbol(Movement)
registerSymbol(Player_base)

alloc(newmem, 1024, Movement)
label(originalcode)
label(after)
label(Player_base)

newmem:

originalcode:
  movss xmm1,[rbx+00000188]

after:
  mov [Player_base],rbx
  jmp return

Player_base:
  db 00 00 00 00

Movement:
  jmp newmem
  nop 3
return:
registersymbol(Movement)

[DISABLE]
Movement:
  db orig_bytes

dealloc(newmem)
unregisterSymbol(Movement)
unregisterSymbol(Player_base)

