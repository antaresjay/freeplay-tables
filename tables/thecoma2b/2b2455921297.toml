[[cheat]]
id = "player-controller-ctrl-numpad-1"
name = "Player Controller (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : TheComa2B.exe
// Author            : ndck76
// Executable Version: 2022.3.1.36364
// Game Version      : v1.0.6
// Script Date       : 2024-11-06


define(address,PlayerController:get_IsBuffCountable+11e)
define(bytes,0F B6 86 41 01 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,PlayerController:get_IsBuffCountable+11e)

label(code)
label(return)
label(data2)
registersymbol(data2)

newmem:

code:
  mov [data2],rsi
  movzx eax,byte ptr [rsi+00000141]
  jmp return

data2:
  db

address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  db bytes
  // movzx eax,byte ptr [rsi+00000141]

dealloc(*)
unregistersymbol(*)"""

