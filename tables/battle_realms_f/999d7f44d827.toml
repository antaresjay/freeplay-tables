source = """
[ENABLE]

aobscanmodule(horses_ret,Battle_Realms_F.exe,50 8D 45 E8 68 * * * * 50 e8 * * * * 83 C4 0C 8B CF)

aobscanmodule(horses_aob,Battle_Realms_F.exe,83 3E 00 8D 41 01 8D 76 1C)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
cmp [esp+4],horses_ret
jne @F
mov [esi],1
code:
cmp dword ptr [esi],00
lea eax,[ecx+01]
jmp return

horses_aob:
jmp newmem
nop
