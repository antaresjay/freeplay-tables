[[cheat]]
id = "debug"
name = "[Debug]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Engine,Singularity.exe,8B 01 8B 90 2C 01 00 00 6A 01 51)
alloc(newmem,$1000,Engine)
alloc(GEngine,4)

label(code)
label(return)

GEngine:
dd 0

newmem:

code:
mov [GEngine],ecx
  mov eax,[ecx]
  mov edx,[eax+0000012C]
  jmp return

Engine:
  jmp newmem
  nop 3
return:
registersymbol(Engine GEngine)

[DISABLE]

Engine:
  db 8B 01 8B 90 2C 01 00 00

unregistersymbol(*)
dealloc(*)"""

