IdleDataManager:IdleStaminaChange+38: 0F 84 1D 02 00 00  - je IdleDataManager:IdleStaminaChange+25b
IdleDataManager:IdleStaminaChange+3e: 49 8B 47 48        - mov rax,[r15+48]
IdleDataManager:IdleStaminaChange+42: 48 63 CF           - movsxd  rcx,edi
IdleDataManager:IdleStaminaChange+45: 39 48 18           - cmp [rax+18],ecx
IdleDataManager:IdleStaminaChange+48: 0F 86 91 02 00 00  - jbe IdleDataManager:IdleStaminaChange+2df
IdleDataManager:IdleStaminaChange+4e: 48 8D 44 C8 20     - lea rax,[rax+rcx*8+20]
}"""
