[[cheat]]
id = "x-tlotr-bfme-2-v16-script"
name = "[X] <== tLotR BfME 2 v16 Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
===========================================
 Game Title    : The Lord of the Rings - Battle for Middle-Earth 2
 Game Version  : 1.6
 Process Name  : Game.dat
 Script Version: 1.0
 CE Version    : 6.1
 Release date  : 15-Apr-2012
 Author        : Recifense
 Features:
 - God Mode
 - Minimum Resource
 - Minimum Power Points
 - Unlimited Command Point,
 - TBS Population
 - Some pointers
===========================================
}

[ENABLE]
//=========================================
// Check if script is compatible to this game version
// If false the script will not be loaded

assert(game.dat+0031aa8b,8b 40 10 8b 40 24)
assert(game.dat+004bf009,f3 0f 10 4d 08)
assert(game.dat+00276192,8b b6 54 02 00 00)
assert(game.dat+00574608,8b 87 98 02 00 00)

//=========================================
alloc(MyCode,1024)
//=========================================
// Declaration section
label(_MonPlayer)
label(_MonP00)
label(_MonP01)
label(_BackMP)
label(_ExitMP)
label(_GodMode)
label(_BackGM)
label(_ExitGM)
label(_MonSel)
label(_BackMS)
label(_ExitMS)
label(_MonGold)
label(_BackMG)
label(_ExitMG)
label(pUnit)
label(pSel)
label(pGold)
label(pPlayer)
label(ppPlayer)
label(iEnableMR)
label(iEnableGM)
label(iEnableMPP)
label(iEnableMCP)
label(iEnableMG)
label(iMinRes)
label(iPlayerID)

//=========================================
// Registering Symbols
registersymbol(MyCode)
registersymbol(pUnit)
registersymbol(pSel)
registersymbol(pGold)
registersymbol(pPlayer)
registersymbol(ppPlayer)
registersymbol(iEnableMR)
registersymbol(iEnableGM)
registersymbol(iEnableMPP)
registersymbol(iEnableMCP)
registersymbol(iEnableMG)
registersymbol(iMinRes)
registersymbol(iPlayerID)

//=========================================
MyCode:
//=========================================
_MonPlayer:
 push ecx

 mov [ppPlayer],eax
 mov eax,[eax+10]
 mov [pPlayer],eax

 mov ecx,[eax+4c]
 test ecx,ecx
 jz _ExitMP
 js _ExitMP

 mov ecx,[ecx+0c]
 mov [iPlayerID],ecx

 cmp dword ptr [iEnableMR],0
 je _MonP00                        // Jump if feature is disabled

 mov ecx,[iMinRes]
 cmp ecx,[eax+00000094]
 jle _MonP00

 mov [eax+00000094],ecx

_MonP00:
 cmp dword ptr [iEnableMPP],0
 je _MonP01                        // Jump if feature is disabled

 mov ecx,#150
 cmp ecx,[eax+24]
 jle _MonP01

 mov [eax+24],ecx

_MonP01:
 cmp dword ptr [iEnableMCP],0
 je _ExitMP                        // Jump if feature is disabled

 xor ecx,ecx
 mov [eax+68],ecx

_ExitMP:
 pop ecx

 mov eax,[eax+24]                  // Original code (rds points)
 jmp _BackMP                       // Back to main code

//=========================================
// 008C00C1
_GodMode:
 mov [pUnit],ecx

 mov eax,(float)1.0
 cmp eax,[ecx+10]
 je _ExitGM

 mov eax,(float)999999.0
 cmp eax,[ecx+10]
 je _ExitGM

 mov eax,[ebp+04]
 cmp eax,game.dat+00392fc4
 je _ExitGM

 cmp dword ptr [iEnableGM],0
 je _ExitGM                        // Jump if feature is disabled

 lea eax,[ecx-10]
 mov eax,[eax+08]
 mov eax,[eax+00000304]
 mov eax,[eax+30]
 mov eax,[eax+08]
 cmp eax,[pPlayer]
 jne _ExitGM

 mov eax,[ebp+08]
 test eax,eax
 jns _ExitGM                       // jump if the value is positive

 and eax,7fffffff
 cmp eax,[ecx+10]
 je _ExitGM

 xor eax,eax
 mov [ebp+08],eax                  // value2decrease = 0

_ExitGM:
 movss xmm1,[ebp+08]               // Original code
 jmp _BackGM                       // Back to main code

//=========================================
_MonSel:
 mov esi,[esi+00000254]            // Original code

_ExitMS:
 mov [pSel],esi
 jmp _BackMS                       // Back to main code

//========================================= new
_MonGold:
 mov [pGold],edi

 cmp dword ptr [iEnableMG],0
 je _ExitMG                        // Jump if feature is disabled

 mov dword ptr [edi+00000298],0    // make spent_gold = 0

_ExitMG:
 mov eax,[edi+00000298]            // Original code
 jmp _BackMG                       // Back to main code

//=========================================
 db '===========================>'
 db 'CE6.1 Script by Recifense 041512'
//=========================================
// Variables
iEnableMR:
 dd 1
iEnableGM:
 dd 1
iEnableMPP:
 dd 1
iEnableMCP:
 dd 1
iEnableMG:
 dd 1
pUnit:
 dd 0
pSel:
 dd 0
pGold:
 dd 0
pPlayer:
 dd 0
ppPlayer:
 dd 0
iPlayerID:
 dd 0
iMinRes:
 dd #6100

//=========================================
// Hacking Points
game.dat+0031aa8b:
 jmp _MonPlayer
 nop
_BackMP:

game.dat+004bf009:
 jmp _GodMode
_BackGM:

game.dat+00276192:
 jmp _MonSel
 nop
_BackMS:

game.dat+00574608:
 jmp _MonGold
 nop
_BackMG:

//=========================================
// Script for Restoring Original Codes
[DISABLE]
game.dat+0031aa8b:
// mov eax,[eax+10]
// mov eax,[eax+24]
 db 8b 40 10 8b 40 24

game.dat+004bf009:
// movss xmm1,[ebp+08]
 db f3 0f 10 4d 08

game.dat+00276192:
// mov esi,[esi+00000254]
 db 8b b6 54 02 00 00

game.dat+00574608:
// mov eax,[edi+00000298]
 db 8b 87 98 02 00 00

//=========================================
// Unregistering Symbols
unregistersymbol(MyCode)
unregistersymbol(pUnit)
unregistersymbol(pSel)
unregistersymbol(pGold)
unregistersymbol(iEnableMR)
unregistersymbol(iEnableGM)
unregistersymbol(iEnableMPP)
unregistersymbol(iEnableMCP)
unregistersymbol(iEnableMG)
unregistersymbol(pPlayer)
unregistersymbol(ppPlayer)
unregistersymbol(iMinRes)
unregistersymbol(iPlayerID)

//=========================================
dealloc(MyCode)
//============= Scripts End ===============

// ****************************************
// NOTES
// ****************************************
{
}"""

