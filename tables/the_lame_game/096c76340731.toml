[[cheat]]
id = "sinus"
name = "Sinus"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
{
Cheat for Cheatengine 6.2 32-bit (The Lame Game)
CE version used: 6.2
Made by Labtox
}

//============================================
//            Allocation & labels
//============================================

alloc(code,1024)

// - - - - - - - - variables - - - - - - - - -

label(x)
registersymbol(x)
label(y)
registersymbol(y)
label(xDimension)
registersymbol(xDimension)
label(yDimension)
registersymbol(yDimension)
label(debug)
registersymbol(debug)
label(step)
registersymbol(step)
label(speed)
registersymbol(speed)

//- - - - - - - - - labels - - - - - - - - - -

label(writeY)
label(writeX)
label(writeYb)
label(writeXb)
label(contx)
label(writeTimer)
label(writeTimerb)


//============================================
//                Code hooks
//============================================

cheatengine-i386.exe+293E0:
jmp writeY
nop
writeYb:

cheatengine-i386.exe+293D4:
jmp writeX
nop
writeXb:

cheatengine-i386.exe+2D69EC:
jmp writeTimer
nop
writeTimerb:


//============================================
//                 Codecave
//============================================

code:
//--------------------------------------------

writeY:
fldpi
fld1
fld1
faddp
fmulp //2 pi

fidiv [xDimension] //... divide by total width

fimul [x] //... times current x

fsin //... take the sinus of the result

fimul [yDimension] //... multiply by half the field height ...

fiadd [yDimension] //... and align vertical in the center

fistp dword ptr [y]

mov eax,[y]
mov [edx+00000224],eax
jmp writeYb

//--------------------------------------------

writeX:
cmp [x],#500
jb contx

push eax
mov eax,#-1
mov [x],eax
pop eax

contx:
mov edx,[step]
add [x],edx
mov edx,[x]
mov [eax+0000011C],edx
jmp writeXb

//--------------------------------------------

writeTimer:
mov edx,[speed]
mov [eax+2C],edx
jmp writeTimerb


//============================================
//                 Variables
//============================================

x:
dd 0

y:
dd 0

xDimension:
dd #485

yDimension: //Half of the total height
dd #175

debug:
dd 0

step:
dd #2

speed:
dd #20






[DISABLE]
//============================================
//               Original code
//============================================

cheatengine-i386.exe+293E0: //write Y
mov [edx+00000224],eax  // 89 82 24020000

cheatengine-i386.exe+293D4: //write X
mov [eax+0000011C],edx  // 89 90 1C010000

cheatengine-i386.exe+2D69EC:
mov edx,[ebp-04]  // 8B 55 FC
mov [eax+2C],edx  // 89 50 2C


//============================================
//                  Cleanup
//============================================

unregistersymbol(x)
unregistersymbol(y)
unregistersymbol(xDimension)
unregistersymbol(yDimension)
unregistersymbol(debug)
unregistersymbol(step)
unregistersymbol(speed)
dealloc(code)"""

