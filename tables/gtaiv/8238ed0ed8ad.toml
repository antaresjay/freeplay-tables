source = """
[ENABLE]

aobscanmodule(wantedlevll,GTAIV.exe,8B 96 84 03 00 00 8B) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
mov [esi+00000384], 0
code:
  mov edx,[esi+00000384]
  jmp return

wantedlevll:
  jmp newmem
