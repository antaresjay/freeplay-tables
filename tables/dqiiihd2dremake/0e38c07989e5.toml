[[cheat]]
id = "activate-trainer-4-controls-damage-modifier"
name = "Activate Trainer 4 (Controls Damage Modifier)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
///
aobscanmodule(DamageModAOB1,$process,41 8B 75 28 8B C6 99 33 C2 2B C2)
registersymbol(DamageModAOB1)
alloc(newmem,1024,DamageModAOB1)

///
label(return)
label(DamageModAOB1Save)
registersymbol(DamageModAOB1Save)

///
newmem:
  mov [R13Save],r13
  mov [R14Save],r14
  mov [R15Save],r15
  mov r15,bDoHeroCannotDie
  xor r14,r14
  mov [r15],r14  
  {-- Calculate Our Damage}
  xor r15,r15
  mov r15d,[r13+28]
  mov r13,[rbp-29]
  cmp byte ptr [r13+1C4],0
  je HeroHit
  jmp EnemyHit
HeroHit:
  cmp r15d,0
  je SkipEntireCode
  jg HeroDamageHit
  jmp HeroHealingHit
HeroDamageHit:
  mov r14,fHeroDamageMult
  push r15d
  fild dword ptr [esp]
  fmul dword ptr [r14]
  fistp dword ptr [esp]
  pop r15d
  // Min Damage of 1
  cmp r15d,0
  jg CheckGodMode
  mov r15d,1
CheckGodMode:
  mov r14,GodMode
  cmp dword ptr [r14],1
  jne CheckHeroCannotDie
  xor r15d,r15d
CheckHeroCannotDie:
  mov r14,HeroCannotDie
  cmp dword ptr [r14],1
  jne MyCleanUp1
  cmp r15d,[r13+194]
  jl SkipHeroCannotDie
  xor r15d,r15d
  mov [bDoHeroCannotDie],1  
SkipHeroCannotDie:
  jmp MyCleanUp1
HeroHealingHit:
  mov r14,fHeroHealingMult
  neg r15d
  push r15d
  fild dword ptr [esp]
  fmul dword ptr [r14]
  fistp dword ptr [esp]
  pop r15d
  // Min Healing of 1
  cmp r15d,0
  jg SkipMinHealing
  mov r15d,1
SkipMinHealing:
  neg r15d
  jmp MyCleanUp1
EnemyHit:
  cmp r15d,0
  jge EnemyDamageHit
  jmp EnemyHealingHit
EnemyDamageHit:
  mov r14,fEnemyDamageMult
  push r15d
  fild dword ptr [esp]
  fmul dword ptr [r14]
  fistp dword ptr [esp]
  pop r15d
  // Min Damage of 1
  cmp r15d,0
  jg CheckOneHitKill
  mov r15d,1
CheckOneHitKill:
  mov r14,OneHitKill
  cmp dword ptr [r14],1
  jne MyCleanUp1
  mov r15d,[r13+194]
  jmp MyCleanUp1
EnemyHealingHit:
  mov r14,fEnemyHealingMult
  neg r15d
  push r15d
  fild dword ptr [esp]
  fmul dword ptr [r14]
  fistp dword ptr [esp]
  pop r15d
  // Min Healing of 1
  cmp r15d,0
  jg SkipMinHealing2
  mov r15d,1
SkipMinHealing2:
  neg r15d
  jmp MyCleanUp1

MyCleanUp1:
  mov r13,[R13Save]
  mov [r13+28],r15d
  cmp dword ptr [bDoHeroCannotDie],1
  jne SkipEntireCode
  mov [r13+34],r15b
SkipEntireCode:
  mov r13,[R13Save]
  mov r14,[R14Save]
  mov r15,[R15Save]
  jmp originalcode
  
originalcode:
DamageModAOB1Save:
  readmem(DamageModAOB1,6)
  jmp DamageModAOB1+06
    
R13Save:
dq 0
R14Save:
dq 0
R15Save:
dq 0
bDoHeroCannotDie:
dq 0

///
DamageModAOB1:
  jmp newmem
  return:
   
[DISABLE]

///
DamageModAOB1:
  readmem(DamageModAOB1Save,6)
  
unregistersymbol(DamageModAOB1)
unregistersymbol(DamageModAOB1Save)

///
dealloc(newmem)"""

