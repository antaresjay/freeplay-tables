[[cheat]]
id = "activate-trainer-2-controls-gold-pointer"
name = "Activate Trainer 2 (Controls Gold Pointer)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
///
aobscanmodule(GetGoldPointerAOB1,$process,8B 51 28 48 8B 4B 38 E8 * * * *)
registersymbol(GetGoldPointerAOB1)
alloc(newmem,1024,GetGoldPointerAOB1)

///
label(return)
label(GetGoldPointerAOB1Save)
registersymbol(GetGoldPointerAOB1Save)

///
newmem:
  mov [R14Save],r14
  mov [R15Save],r15
  mov r15,GoldPtr
  mov [r15],rcx
  jmp MyCleanUp1
  
MyCleanUp1:
  mov r14,[R14Save]
  mov r15,[R15Save]
  jmp originalcode
  
originalcode:
GetGoldPointerAOB1Save:
  readmem(GetGoldPointerAOB1,7)
  jmp GetGoldPointerAOB1+07
  
