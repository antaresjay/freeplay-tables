[[cheat]]
id = "data-base-address-scan-to-update-battle"
name = "Data Base Address Scan (To Update: Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(data_savedAOB)
label(data_returnhere)
label(data_originalcode)
label(data_exit)


label(data1_exit)
label(data2_exit)
label(data3_exit)
label(data4_exit)
label(data5_exit)

label(dataend_exit)

registersymbol(data_savedAOB)

aobscan(data_searchedAOB,DD 06 B0 01 DD 1F 5F 5E)

alloc(data_newmem,2048) //2kb should be enough
alloc(data_temp,4)


data_newmem:
mov [data_temp], ebx

cmp dword ptr [esi+10], #0
je dataend_exit

// Check matching Item IDs
mov ebx, [data1id_value]
cmp dword ptr [esi+10], ebx
jne data1_exit
mov [data1_basepointer], esi
// Check Item Set Quantity
cmp dword ptr [data1quantity_value], #0
je data1_exit
fild [data1quantity_value]
fstp qword ptr [esi]
data1_exit:


// Check matching Item IDs
mov ebx, [data2id_value]
cmp dword ptr [esi+10], ebx
jne data2_exit
mov [data2_basepointer], esi
// Check Item Set Quantity
cmp dword ptr [data2quantity_value], #0
je data2_exit
fild [data2quantity_value]
fstp qword ptr [esi]
data2_exit:

// Check matching Item IDs
mov ebx, [data3id_value]
cmp dword ptr [esi+10], ebx
jne data3_exit
mov [data3_basepointer], esi
// Check Item Set Quantity
cmp dword ptr [data3quantity_value], #0
je data3_exit
fild [data3quantity_value]
fstp qword ptr [esi]
data3_exit:

// Check matching Item IDs
mov ebx, [data4id_value]
cmp dword ptr [esi+10], ebx
jne data4_exit
mov [data4_basepointer], esi
// Check Item Set Quantity
cmp dword ptr [data4quantity_value], #0
je data4_exit
fild [data4quantity_value]
fstp qword ptr [esi]
data4_exit:

// Check matching Item IDs
mov ebx, [data5id_value]
cmp dword ptr [esi+10], ebx
jne data5_exit
mov [data5_basepointer], esi
// Check Item Set Quantity
cmp dword ptr [data5quantity_value], #0
je data5_exit
fild [data5quantity_value]
fstp qword ptr [esi]
data5_exit:

dataend_exit:
mov ebx, [data_temp]


data_originalcode:
db DD 06 B0 01 DD 1F
//fld qword ptr [esi]
//mov al,01
//fstp qword ptr [edi]


data_exit:
jmp data_returnhere


data_searchedAOB:
data_savedAOB:
jmp data_newmem
nop
data_returnhere:


[DISABLE]
data_savedAOB:
db DD 06 B0 01 DD 1F
//fld qword ptr [esi]
//mov al,01
//fstp qword ptr [edi]

unregistersymbol(data_savedAOB)

dealloc(data_newmem)
dealloc(data_temp)"""

