[[cheat]]
id = "game-core"
name = "Game Core"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Inn Tycoon.exe
  Version: 
  Date   : 2025-11-09
  Author : BabyGroot

  This script does blah blah blah
}

define(address,Tavernventure.GameController:Update+1f)
define(bytes,83 39 00 48 63 80 B8 01 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Tavernventure.GameController:Update+1f)

label(code)
label(return)

alloc(pGameCore,8)
registersymbol(pGameCore)

newmem:

code:
  mov [pGameCore],rcx
  cmp dword ptr [rcx],00
  movsxd  rax,dword ptr [rax+000001B8]
  jmp return

pGameCore:
dq

address:
  jmp newmem
  nop 5
return:

[DISABLE]

address:
  db bytes
  // cmp dword ptr [rcx],00
  // movsxd  rax,dword ptr [rax+000001B8]

dealloc(newmem)
dealloc(pGameCore)
unregistersymbol(pGameCore)"""

