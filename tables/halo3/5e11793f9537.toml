[[cheat]]
id = "unlimited-ammo"
name = "Unlimited Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(ammo_aob,halo3.dll,66 2B CF 66 41 89 8C D4 36 02 00 00)
alloc(newmem,$1000,ammo_aob)

label(code)
label(return)

newmem:

code:
mov [r12+rdx*8+00000236],cx
jmp return

ammo_aob:
jmp newmem
nop 7
return:
registersymbol(ammo_aob)

[DISABLE]

ammo_aob:
db 66 2B CF 66 41 89 8C D4 36 02 00 00

unregistersymbol(ammo_aob)
dealloc(newmem)"""

