type = "script"
source = """
[ENABLE]

aobscanmodule(lightsaber,starwarsbattlefrontii.exe,F3 0F 11 83 A4 00 00 00 48 89) // should be unique
alloc(newmem,$1000,lightsaber)

label(code)
label(return)

newmem:

code:
  mov [rbx+000000A4],(float)100
  jmp return

lightsaber:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(lightsaber)

[DISABLE]

lightsaber:
  db F3 0F 11 83 A4 00 00 00

unregistersymbol(lightsaber)
dealloc(newmem)"""
