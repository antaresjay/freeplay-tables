source = """
// Game Executable   : Chimera.exe
// Author            : ndck76
// Executable Version: 2022.3.0.4507
// Game Version      : Build.15326524
// Script Date       : 2024-08-20


[ENABLE]

aobscanregion(bones,CurrentBaseStatsSO:UpdateCurrency,CurrentBaseStatsSO:UpdateCurrency+100,4863xxxxF3xxxxxxF3xxxxxxF2xxxxxxF3xxxxxxxxxx83xxxxF3xxxxxxxxxx) //CurrentBaseStatsSO:UpdateCurrency+22
alloc(newmem,$1000,bones)
alloc(data2,8)
alloc(bonesbkp,8)
registersymbol(data2)
registersymbol(bones)
registersymbol(bonesbkp)
label(code)
label(return)

bonesbkp:
  readmem(bones,8)

newmem:
  mov [data2],rcx

code:
  readmem(bones,8)
  jmp return

bones:
  jmp newmem
  nop 3
return:

[DISABLE]

bones:
  readmem(bonesbkp,8)

unregistersymbol(*)
dealloc(*)"""

