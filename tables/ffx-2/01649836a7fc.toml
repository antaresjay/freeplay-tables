[[cheat]]
id = "ap-multiplier"
name = "AP Multiplier"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : FFX-2.exe
  Version: 
  Date   : 2018-05-08
  Author : marco

  Quick AP Multiplier
}

[ENABLE]
aobscanmodule(APmultiplier,FFX-2.exe,03 45 10 50 FF 75 0C)
alloc(newmem,1024)
label(Multiplier)
label(code)
label(return)

registersymbol(Multiplier)
registersymbol(APmultiplier)

newmem:
  push esi
  //mov esi,[ebp+0c]
  //sar esi,0c
  //cmp esi,03
  //jne code
  mov esi,[ebp+10]
  imul esi,[Multiplier]
  mov [ebp+10],esi

code:
  pop esi
  add eax,[ebp+10]
  push eax
  push [ebp+0C]
  jmp return

Multiplier:
dd 01

APmultiplier:
  jmp newmem
  nop
  nop
return:

[DISABLE]
APmultiplier:
  db 03 45 10 50 FF 75 0C

unregistersymbol(APmultiplier)
dealloc(newmem)"""

