id = "enable-god-mode"
name = "Enable God Mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@sintrix
[ENABLE]

aobscanmodule(basepstr,BrgGame-Steam.exe,48 8B 03 48 8B CB FF 90 00 08 00 00 48 8D 4D F0)
alloc(newmem,$1000,basepstr)
registersymbol(char)
label(code return char)

newmem:
mov [char],rbx

code:
  mov rax,[rbx]
  mov rcx,rbx
  jmp return

char:
dq 0

basepstr:
