[[cheat]]
id = "reverse-invincibility-timer"
name = "Reverse Invincibility Timer"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(mercyCountdown,MomodoraRUtM.exe,F2 0F 58 05 B8 B4 B3 01 F2 0F 11 83 80 0F)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  subsd xmm0,[MomodoraRUtM.exe+7CB4B8]
  jmp return

mercyCountdown:
  jmp code
  nop
  nop
  nop
return:
registersymbol(mercyCountdown)

[DISABLE]

mercyCountdown:
  db F2 0F 58 05 B8 B4 B3 01

unregistersymbol(mercyCountdown)
dealloc(newmem)"""

