registersymbol(DropEveryItemAOB4Save)

newmem:
  cmp [NumTimesExecuted],0
  jne SkipSavingRegisters
  mov [RAXSave],rax
  mov [RBXSave],rbx
  mov [RCXSave],rcx
  mov [RDXSave],rdx
  mov [RDISave],rdi
  mov [RSISave],rsi
  mov [R8Save],r8
  mov [R9Save],r9
  mov [R10Save],r10
  mov [R11Save],r11
  mov [R12Save],r12
  mov [R13Save],r13
  mov [R14Save],r14
  mov [R15Save],r15
SkipSavingRegisters:
  mov rax,[RAXSave]
  mov rbx,[RBXSave]
  mov rcx,[RCXSave]
  mov rdx,[RDXSave]
  mov rdi,[RDISave]
  mov rsi,[RSISave]
