[[cheat]]
id = "enable-mp-damage-modifier-options-infinite-mp-etc"
name = "Enable MP Damage Modifier Options (Infinite MP, etc.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

///
aobscanmodule(MPDamageModAOB1,"GameAssembly.dll",8B 48 60 29 F9 78 17 8B 50 5C)
registersymbol(MPDamageModAOB1)
alloc(newmem,1024,MPDamageModAOB1)

///
label(return)
label(MPDamageModAOB1Save)
registersymbol(MPDamageModAOB1Save)
label(InfiniteMP)
registersymbol(InfiniteMP)
label(fEnemyMPDamageMult)
registersymbol(fEnemyMPDamageMult)
label(fHeroMPDamageMult)
registersymbol(fHeroMPDamageMult)

newmem:
  mov [RAXSave],rax
  mov [RBXSave],rbx
  mov [RCXSave],rcx
  mov [RDXSave],rdx
  mov [R8Save],r8
  mov [R9Save],r9
  mov [R10Save],r10
  mov [R11Save],r11
  // Hack way of determining ally vs Enemy
  // We use lua to get class name (this depends on an Activate Trainer timer)
  mov r10,pAddressToCheckClassName
  mov [r10],rbx
  mov r10,bDoClassNameCheck
  mov [r10],1
StartCheckLoop:
  sub rsp,20
  mov rcx,5
  call sleep
  add rsp,20
  mov r10,bDoClassNameCheck
  cmp dword ptr [r10],0
  jne StartCheckLoop
  // Clean up some registers
  mov rax,[RAXSave]
  mov rbx,[RBXSave]
  mov rcx,[RCXSave]
  mov rdx,[RDXSave]
  mov r8,[R8Save]
  mov r9,[R9Save]
  // Got Class Name, bIsAlly should be valid
  mov r10,bIsAlly
  cmp dword ptr [r10],1
  je HeroHit
  jmp EnemyHit
HeroHit:
HeroDamageHit:
  cmp [fHeroMPDamageMult],(float)0.0
  je CheckInfiniteMP
  push edi
  fild dword ptr [rsp]
  fmul dword ptr [fHeroMPDamageMult]
  fistp dword ptr [rsp]
  pop edi
CheckInfiniteMP:
  cmp [InfiniteMP],1
  jne MyCleanUp1
  xor edi,edi
  jmp MyCleanUp1
EnemyHit:
EnemyDamageHit:
  cmp [fEnemyMPDamageMult],(float)0.0
  je MyCleanUp1
  push edi
  fild dword ptr [rsp]
  fmul dword ptr [fEnemyMPDamageMult]
  fistp dword ptr [rsp]
  pop edi
  jmp MyCleanUp1

MyCleanUp1:  
  mov r10,[R10Save]
  mov r11,[R11Save]
MPDamageModAOB1Save:
  readmem(MPDamageModAOB1,5)
  jmp MPDamageModAOB1+05

RAXSave:
dq 0
RBXSave:
dq 0
RCXSave:
dq 0
RDXSave:
dq 0
R8Save:
dq 0
R9Save:
dq 0
R10Save:
dq 0
R11Save:
dq 0
InfiniteMP:
dq 0
fEnemyMPDamageMult:
dq (float)2.0
fHeroMPDamageMult:
dq (float)0.25

MPDamageModAOB1:
  jmp newmem
return:

[DISABLE]

MPDamageModAOB1:
  readmem(MPDamageModAOB1Save,5)

unregistersymbol(MPDamageModAOB1)
unregistersymbol(MPDamageModAOB1Save)
unregistersymbol(InfiniteMP)
unregistersymbol(fEnemyMPDamageMult)
unregistersymbol(fHeroMPDamageMult)

dealloc(newmem)"""

