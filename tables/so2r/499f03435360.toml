source = """
[ENABLE]

///
aobscanregion(DropEveryItemAOB1,Game.BattleResultInfo.AddDropItem,Game.BattleResultInfo.AddDropItem+400,4C 89 44 24 18 48 89 4C 24 08 55 57 41 55 41 56 48 83 EC *)
