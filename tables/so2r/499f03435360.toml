  movsxd r14,dword ptr [r14+r15*4]
  mov [CurrentItemID],r14d
  jmp MyCleanUp1
SkipDroppingAgain:
  mov [NumTimesExecuted],#1256
  jmp MyCleanUp1
  
MyCleanUp1:
  inc [NumTimesExecuted]
  mov r13,[R13Save2]
  mov r14,[R14Save2]  
  mov r15,[R15Save2]
  jmp originalcode
  
originalcode:
DropEveryItemAOB1Save:
