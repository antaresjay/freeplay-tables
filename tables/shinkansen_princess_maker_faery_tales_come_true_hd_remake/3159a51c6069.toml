[[cheat]]
id = "pm3-base-address-scan-initialization-activate-this-first-to-activate-play-level"
name = "PM3 Base Address Scan Initialization (Activate This First, To Activate: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PM3_basepointer)
registersymbol(PM3_update_enable)
registersymbol(PM3_supportset_enable)
registersymbol(PM3_stressset_enable)
registersymbol(PM3_statsset_enable)

//04D923B5 - 48 83 EC 08           - sub rsp,08
//04D923B9 - 48 8B F1              - mov rsi,rcx
// pm3_define:PM3:Update+c
//04D923BC - 48 8B 86 B0000000     - mov rax,[rsi+000000B0]
//04D923C3 - 48 85 C0              - test rax,rax
//04D923C6 - 74 2C                 - je 04D923F4
//04D923C8 - 48 8B 86 B0000000     - mov rax,[rsi+000000B0]
//04D923CF - 8B 48 34              - mov ecx,[rax+34]
aobscan(PM3_initialization_searchedAOB, 48 8B 86 B0 00 00 00 48 85 C0 74 2C)

alloc(PM3_basepointer, 8, PM3_initialization_searchedAOB)
alloc(PM3_update_enable, 4, PM3_initialization_searchedAOB)
alloc(PM3_supportset_enable, 4, PM3_initialization_searchedAOB)
alloc(PM3_stressset_enable, 4, PM3_initialization_searchedAOB)
alloc(PM3_statsset_enable, 4, PM3_initialization_searchedAOB)


[DISABLE]
unregistersymbol(PM3_basepointer)
unregistersymbol(PM3_update_enable)
unregistersymbol(PM3_supportset_enable)
unregistersymbol(PM3_stressset_enable)
unregistersymbol(PM3_statsset_enable)

dealloc(PM3_basepointer)
dealloc(PM3_update_enable)
dealloc(PM3_supportset_enable)
dealloc(PM3_stressset_enable)
dealloc(PM3_statsset_enable)"""

[[cheat]]
id = "pm3-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PM3 Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PM3_savedAOB)
label(PM3_returnhere)
label(PM3_originalcode)
label(PM3_exit)

label(PM3_update_exit)
label(PM3_supportset_exit)
label(PM3_stressset_exit)
label(PM3_statsset_exit)

registersymbol(PM3_originalcode)
registersymbol(PM3_savedAOB)

//04D923B5 - 48 83 EC 08           - sub rsp,08
//04D923B9 - 48 8B F1              - mov rsi,rcx
// pm3_define:PM3:Update+c
//04D923BC - 48 8B 86 B0000000     - mov rax,[rsi+000000B0]
//04D923C3 - 48 85 C0              - test rax,rax
//04D923C6 - 74 2C                 - je 04D923F4
//04D923C8 - 48 8B 86 B0000000     - mov rax,[rsi+000000B0]
//04D923CF - 8B 48 34              - mov ecx,[rax+34]
aobscan(PM3_searchedAOB, 48 8B 86 B0 00 00 00 48 85 C0 74 2C)

alloc(PM3_newmem, 2048, PM3_searchedAOB)
alloc(PM3_temp1, 8, PM3_searchedAOB)
alloc(PM3_temp2, 8, PM3_searchedAOB)
alloc(PM3_temp3, 8, PM3_searchedAOB)
alloc(PM3_temp4, 8, PM3_searchedAOB)
alloc(PM3_temp5, 8, PM3_searchedAOB)


PM3_newmem:
mov [PM3_temp1], rax
mov [PM3_temp2], rbx
mov [PM3_temp3], rcx
mov [PM3_temp4], rdx

cmp dword ptr [PM3_update_enable], #0
je PM3_update_exit
mov [PM3_basepointer], rsi
PM3_update_exit:

cmp dword ptr [PM3_supportset_enable], #0
je PM3_supportset_exit
mov rbx, [rsi+58]
test rbx, rbx
je PM3_supportset_exit
mov [rbx+24], #32700
PM3_supportset_exit:

cmp dword ptr [PM3_stressset_enable], #0
je PM3_stressset_exit
mov rbx, [rsi+38]
test rbx, rbx
je PM3_stressset_exit
mov [rbx+8c], #0
PM3_stressset_exit:

cmp dword ptr [PM3_statsset_enable], #0
je PM3_statsset_exit
mov rbx, [rsi+38]
test rbx, rbx
je PM3_statsset_exit
mov [rbx+64], #9999
mov [rbx+68], #9999
mov [rbx+6c], #9999
mov [rbx+70], #9999
mov [rbx+74], #9999
mov [rbx+78], #9999
mov [rbx+7c], #9999
mov [rbx+80], #9999
mov [rbx+84], #9999
mov [rbx+88], #9999
mov [rbx+90], #9999
mov [rbx+94], #1000
PM3_statsset_exit:

mov rax, [PM3_temp1]
mov rbx, [PM3_temp2]
mov rcx, [PM3_temp3]
mov rdx, [PM3_temp4]


PM3_originalcode:
readmem(PM3_searchedAOB, 7)


PM3_exit:
jmp PM3_returnhere


PM3_searchedAOB:
PM3_savedAOB:
jmp PM3_newmem
nop
nop
PM3_returnhere:


[DISABLE]
PM3_savedAOB:
readmem(PM3_originalcode, 7)

unregistersymbol(PM3_originalcode)
unregistersymbol(PM3_savedAOB)

dealloc(PM3_newmem)
dealloc(PM3_temp1)
dealloc(PM3_temp2)
dealloc(PM3_temp3)
dealloc(PM3_temp4)
dealloc(PM3_temp5)"""

