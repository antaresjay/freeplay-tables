[[cheat]]
id = "right-click-change-script-for-info"
name = "RIGHT CLICK -> CHANGE SCRIPT for info"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
I have included two variants for unlimited health, since
one of them might not work all the time. If they both
fail you still have the option "Enemies can't cause damage"
which nullifies any damage your char usually might
endure.
Deactivating certain scripts (like the "unlimited health"
one) might crash your game because I've coded them like
an idiot back then.

The "No attack cooldown" works most of the time, rarely
it takes a while for your attack to charge, just wait a little
while and then continue to barrage the enemy.

Some scripts can only be activated once you've entered
a stage/dungeon.

Thx - Dami0n
}

[ENABLE]
[DISABLE]"""

[[cheat]]
id = "unlimited-mana"
name = "Unlimited mana"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(mana,8B 41 14 89 45 FC DB) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov [ecx+14],C
  mov eax,[ecx+14]
  mov [ebp-04],eax
  jmp return

mana:
  jmp code
  nop
return:
registersymbol(mana)

[DISABLE]

mana:
  db 8B 41 14 89 45 FC

unregistersymbol(mana)
dealloc(newmem)"""

