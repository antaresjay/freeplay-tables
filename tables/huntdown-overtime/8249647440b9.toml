[[cheat]]
id = "player-ctrl-numpad-1"
name = "Player (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Huntdown Overtime.exe
// Author            : ndck76
// Executable Version: 6000.2.6.19914
// Game Version      : Build.23150056 (Early Access)
// Script Date       : 2026-05-10


define(address,Player:CheckLowHealth+f)
define(bytes,48 63 86 C8 09 00 00 F3 0F 2A C0 F3 0F 5A C0)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000)

label(code)
label(return)
label(data)
registersymbol(data)

newmem:

code:
  mov [data],rsi
  movsxd  rax,dword ptr [rsi+000009C8]
  cvtsi2ss xmm0,eax
  cvtss2sd xmm0,xmm0
  jmp return

data:
  db

address:
  jmp far newmem
  nop
return:

[DISABLE]

address:
  db bytes
  // movsxd  rax,dword ptr [rsi+000009C8]
  // cvtsi2ss xmm0,eax
  // cvtss2sd xmm0,xmm0

dealloc(*)
unregistersymbol(*)"""

