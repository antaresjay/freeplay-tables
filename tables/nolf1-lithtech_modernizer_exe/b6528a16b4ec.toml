[[cheat]]
id = "get-ammo-inf-ammo"
name = "get ammo(inf ammo)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(ammochecker,object.lto,8B 04 B8 5F 5E)
alloc(newmem,$1000)

label(code)
label(return)


alloc(ammoamount,4)
alloc(listfull,4)
alloc(cycle,4)
alloc(cyclelimit,4)
alloc(resetammo,4)
alloc(ladress,216)
registersymbol(ladress)
registersymbol(resetammo)
registersymbol(cycle)
registersymbol(cyclelimit)
registersymbol(listfull)
registersymbol(ammoamount)

ammoamount:
dd (int)500

cyclelimit:
dd (int)1000

listfull:
dd (int)0

resetammo:
dd (int)0

newmem:
code:
  pushf
  lea eax,[eax+edi*4]
  mov edi,0
  cmp [resetammo],1
  je resett
  cmp [listfull],1
  je cheatt
  jne adresscheck

resett:
  mov [resetammo],0
  mov [listfull],0
  mov [ladress+edi],0
  add edi,4
  cmp edi,216
  jge last
  jl resett

cheatt:
  inc [cycle]
  mov esi,[cycle]
  cmp esi,[cyclelimit]
  jl last
  mov esi,[ammoamount]
  mov edi,[ladress]
  mov [edi],esi       //9mm
  mov [edi+4],esi       //9mm dum
  mov [edi+8],esi       //9mm phos
  mov [edi+20],esi       //hampton
  mov [edi+C4],esi       //corrector
  mov [edi+b8],esi       //9mmcyanide
  mov [edi+9C],esi       //gl
  mov [edi+4C],esi       //harpoon
  mov [edi+2C],esi       //ak
  mov [edi+30],esi       //akpho
  mov [edi+A4],esi       //crosspoi
  mov [edi+A8],esi       //crossfire
  mov [edi+44],esi       //cross
  mov [edi+AC],esi       //crossex
  mov [edi+24],esi       //svd
  mov [edi+28],esi       //svdpho
  mov [edi+0C],esi       //38
  mov [edi+14],esi       //38cyanide
  mov [edi+18],esi       //38pho
  mov [edi+10],esi       //38dum
  mov [edi+10],esi       //38exp
  mov [edi+50],esi       //lasergun
  mov [edi+b4],esi       //super oto laser weapon
  mov [edi+40],esi       //briefcase

  mov [edi+5C],5      //impact exp
  mov [edi+60],5      //prox exp
  mov [edi+64],5      //timed exp
  mov [edi+84],5      //sleeping gas
  mov [edi+88],5      //stun gas
  mov [edi+8C],5      //acid gas
  mov [edi+38],5       //cam disabler
  mov [edi+68],5      //coin
  mov [edi+48],5       //robot paddle
  mov [edi+98],5      //body remover


  mov [cycle],0
  jmp last

  last:
  mov eax,[eax]
  popf
  pop edi
  pop esi
  jmp return

adresscheck:
  cmp [ladress+edi],0
  je adresscheck1add
  cmp [ladress+edi],eax
  jg adresscheck1add
  je last
  add edi,4
  cmp edi,#216
  jge last
  jl adresscheck

adresscheck1add:
  mov [ladress+edi],eax
  cmp edi,#212
  jne last
  je listfullset

listfullset:
  mov [listfull],1
  jmp last

ammochecker:
  jmp newmem
return:
registersymbol(ammochecker)

[DISABLE]
ammochecker:
  db 8B 04 B8 5F 5E

unregistersymbol(ammochecker)
dealloc(newmem)

dealloc(ammoamount)
dealloc(listfull)
dealloc(cycle)
dealloc(cyclelimit)
dealloc(resetammo)
dealloc(ladress)
unregistersymbol(ladress)
unregistersymbol(resetammo)
unregistersymbol(cyclelimit)
unregistersymbol(cycle)
unregistersymbol(listfull)
unregistersymbol(ammoamount)
{
object.lto+12877E: 74 0C              - je object.lto+12878C
object.lto+128780: 8B 46 10           - mov eax,[esi+10]
// ---------- INJECTING HERE ----------
object.lto+128783: 8B 04 B8           - mov eax,[eax+edi*4]
// ---------- DONE INJECTING  ----------
}"""

