[[cheat]]
id = "instant-healing-ctrl"
name = "Instant Healing (CTRL)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(lblReturn)
label(lblSkipGodModeHack)

newmem:
pushad
push 11 // VK_CONTROL: CTRL key
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne short lblSkipGodModeHack
push ebx
mov ebx,[eax+59]
mov [edi+04],ebx
pop ebx
lblSkipGodModeHack:
fild dword ptr [edi+04] // Original code
mov ebp,eax             // Original code
jmp lblReturn

"BOS.exe"+D208C:
jmp newmem
lblReturn:

[DISABLE]
"BOS.exe"+D208C:
fild dword ptr [edi+04]
mov ebp,eax
//Alt: db DB 47 04 8B E8
dealloc(newmem)"""

[[cheat]]
id = "ammo-manager-ctrl-shift"
name = "Ammo manager (CTRL, SHIFT)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(lblReturn)
label(lblSkipAmmoIncreaseHack)
label(lblSkipAmmoReduceHack)
label(pAmmoToAdd)
label(pAmmoToRemove)
registersymbol(pAmmoToAdd)
registersymbol(pAmmoToRemove)

newmem:
pushfd
pushad
push 11 // VK_CONTROL: CTRL key
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne short lblSkipAmmoIncreaseHack
push eax
mov eax, [ecx+1AD]
add eax, [pAmmoToAdd]
mov [ecx+1AD],eax
pop eax
lblSkipAmmoIncreaseHack:
pushad
push 10 // VK_SHIFT: SHIFT key
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne short lblSkipAmmoReduceHack
push eax
mov eax, [ecx+1AD]
sub eax, [pAmmoToRemove]
mov [ecx+1AD],eax
pop eax
lblSkipAmmoReduceHack:
popfd
mov ecx,[BOS.exe+4BC564] // Original code
jmp lblReturn

// Vars
pAmmoToAdd:
dd (int)200
pAmmoToRemove:
dd (int)100

"BOS.exe"+6E3BD:
jmp newmem
nop
lblReturn:

[DISABLE]
"BOS.exe"+6E3BD:
mov ecx,[BOS.exe+4BC564]
//Alt: db 8B 0D 64 C5 8B 00
unregistersymbol(pAmmoToAdd)
unregistersymbol(pAmmoToRemove)
dealloc(newmem)"""

