[[cheat]]
id = "always-day-time"
name = "Always Day Time"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(alwaysDayTime_AOB,DayCycle:Update+200,DayCycle:Update+300,0F ? ? ? 85 C0 0F 84 ? ? ? ? F3) // should be unique
alloc(newmem,$1000,alwaysDayTime_AOB)

label(code)
label(return)

newmem:
  mov eax,01
  jmp code+4
code:
  movzx eax,byte ptr [rsi+50]
  test eax,eax
  jmp return

alwaysDayTime_AOB:
  jmp!near newmem: C3 | 00*
  nop
return:
registersymbol(alwaysDayTime_AOB)

[DISABLE]

alwaysDayTime_AOB:
  db 0F B6 46 50 85 C0

unregistersymbol(alwaysDayTime_AOB)
dealloc(newmem)"""
