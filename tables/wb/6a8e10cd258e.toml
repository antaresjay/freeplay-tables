[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : wb.exe
  Version: 1.0
  Date   : 2017-06-08
  Author : wcz
}

[ENABLE]

aobscanmodule(Player,wb.exe,0F B6 0C 01 41 0F B6 C0)
alloc(newmem,$1000,"wb.exe"+7B2CE)

label(code)
label(magic_status)
label(potion)
label(potion_status)
label(invincible)
label(invincible_status)
label(health)
label(health_status)
label(return)
globalalloc(pPlayer,4)


newmem:
  cmp byte ptr [rax+1a0],0
  jne code
  mov [pPlayer],rax
  cmp [magic_status],0
  je potion
  mov byte ptr [rax+F3E],A
  mov byte ptr [rax+F3F],A
  mov byte ptr [rax+F40],A
  mov byte ptr [rax+F41],A
  mov byte ptr [rax+F42],A
  jmp potion

magic_status:
 dd 0

potion:
  cmp [potion_status],0
  je invincible
  mov byte ptr [rax+F4A],A
  jmp invincible

potion_status:
 dd 0

invincible:
  cmp [invincible_status],0
  je health
  mov byte ptr [rax+268],32
  mov byte ptr [rax+26A],0
  jmp health

invincible_status:
 dd 0

health:
  cmp [health_status],0
  je code
  mov byte ptr [rax+F54],68
  mov byte ptr [rax+F53],6
  mov byte ptr [rax+F52],80
  jmp code

health_status:
 dd 0

code:
  movzx ecx,byte ptr [rcx+rax]
  movzx eax,r8l
  jmp return

Player:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(Player)
registersymbol(magic_status)
registersymbol(potion_status)
registersymbol(invincible_status)
registersymbol(health_status)

[DISABLE]

Player:
  db 0F B6 0C 01 41 0F B6 C0

unregistersymbol(Player)
unregistersymbol(magic_status)
unregistersymbol(potion_status)
unregistersymbol(invincible_status)
unregistersymbol(health_status)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: "wb.exe"+7B2CE

"wb.exe"+7B2AB: 74 11                    -  je wb.exe+7B2BE
"wb.exe"+7B2AD: B1 FF                    -  mov cl,-01
"wb.exe"+7B2AF: 41 0F B6 C0              -  movzx eax,r8l
"wb.exe"+7B2B3: 66 C1 E0 08              -  shl ax,08
"wb.exe"+7B2B7: 0F B6 C9                 -  movzx ecx,cl
"wb.exe"+7B2BA: 66 0B C1                 -  or ax,cx
"wb.exe"+7B2BD: C3                       -  ret 
"wb.exe"+7B2BE: 49 8B 82 00 81 01 00     -  mov rax,[r10+00018100]
"wb.exe"+7B2C5: 0F B7 CA                 -  movzx ecx,dx
"wb.exe"+7B2C8: 81 E1 FF 1F 00 00        -  and ecx,00001FFF
// ---------- INJECTING HERE ----------
"wb.exe"+7B2CE: 0F B6 0C 01              -  movzx ecx,byte ptr [rcx+rax]
"wb.exe"+7B2D2: 41 0F B6 C0              -  movzx eax,r8l
// ---------- DONE INJECTING  ----------
"wb.exe"+7B2D6: 66 C1 E0 08              -  shl ax,08
"wb.exe"+7B2DA: 0F B6 C9                 -  movzx ecx,cl
"wb.exe"+7B2DD: 66 0B C1                 -  or ax,cx
"wb.exe"+7B2E0: C3                       -  ret 
"wb.exe"+7B2E1: 41 0F B6 82 60 42 0A 00  -  movzx eax,byte ptr [r10+000A4260]
"wb.exe"+7B2E9: 48 C1 E0 0E              -  shl rax,0E
"wb.exe"+7B2ED: 0F B7 CA                 -  movzx ecx,dx
"wb.exe"+7B2F0: 81 E1 FF 3F 00 00        -  and ecx,00003FFF
"wb.exe"+7B2F6: 48 0B C8                 -  or rcx,rax
"wb.exe"+7B2F9: 41 0F B6 C0              -  movzx eax,r8l
}"""

