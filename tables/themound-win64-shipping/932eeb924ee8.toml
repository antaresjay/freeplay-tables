[[cheat]]
id = "get-player-disable-options-before-returning-to-camp"
name = "Get Player (Disable Options Before Returning To Camp)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(LocalPlayerHook,TheMound-Win64-Shipping.exe,49 8B 06 48 8D 95 10 01 00 00 49 8B CE FF 90 C0)
alloc(newmem,$1000,LocalPlayerHook)
registersymbol(GetPlayer)
label(code return GetPlayer)

newmem:
mov [GetPlayer],r14

code:
  mov rax,[r14]
  lea rdx,[rbp+00000110]
  jmp return

GetPlayer:
dq

LocalPlayerHook:
  jmp newmem
  nop 5
return:
registersymbol(LocalPlayerHook)

[DISABLE]

LocalPlayerHook:
  db 49 8B 06 48 8D 95 10 01 00 00

unregistersymbol(*)
dealloc(*)"""
