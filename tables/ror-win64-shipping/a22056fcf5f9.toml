[[cheat]]
id = "base-script"
name = "Base_Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//

[ENABLE]

aobscanmodule(GET_LIFE,RoR-Win64-Shipping.exe,CC F3 0F 11 49 08 C3) // should be unique
alloc(newmem,$1000,GET_LIFE)
alloc(RTX1,4)
alloc(RTX2,4)
alloc(RTX3,4)
alloc(RTX4,4)

label(code,Stamina,Action_Point,Enemy)
label(return)

registersymbol(GET_LIFE,RTX1,RTX2,RTX3,RTX4)

newmem:
  cmp [rcx+1C],(float)1000
  jne Stamina
  cmp [RTX1],1
  jne code
  addss xmm1,xmm1
  jmp code


Stamina:
  cmp [rcx+1C],(float)120
  jne Action_Point
  cmp [RTX2],1
  jne code
  addss xmm1,xmm1
  jmp code

Action_Point:
  cmp [rcx+1C],(float)60
  jne Enemy
  cmp [RTX3],1
  jne code
  addss xmm1,xmm1
  jmp code

Enemy:
  cmp [RTX4],1
  jne code
  divss xmm1,xmm1

code:
  movss [rcx+08],xmm1
  jmp return

GET_LIFE+01:
  jmp newmem
return:


RTX1:
 dd 0

RTX2:
 dd 0

RTX3:
 dd 0

RTX4:
 dd 0



[DISABLE]

GET_LIFE+01:
  db F3 0F 11 49 08

unregistersymbol(*)
dealloc(*)"""

