source = """
{
  Game   : Undertale Yellow
  Tries to grab values from various vars
}

[ENABLE]
aobscanmodule(GETVALUES,Undertale Yellow.exe,48 8B 0B 48 89 0F 81 FA FF FF FF 00 75 1C 8B D6 E8 E0)
alloc(newmem,$1000,GETVALUES)

alloc(adr_health,8)
alloc(adr_gold,8)
alloc(adr_exp,8)
alloc(adr_ehealth0,8)
alloc(adr_ehealth1,8)

registersymbol(adr_health)
registersymbol(adr_gold)
registersymbol(adr_exp)

registersymbol(adr_ehealth0)
registersymbol(adr_ehealth1)

label(code)
label(return)

label(set_h)
label(set_g)
label(set_e)

label(set_e0)
label(set_e1)

adr_health:
  dq (double)0

adr_gold:
  dq (double)0

adr_exp:
  dq (double)0

adr_ehealth0:
  dq (double)0

adr_ehealth1:
  dq (double)0

newmem:
  cmp rsi, 187D5
  je set_h
  cmp rsi, 187E2
  je set_g
  cmp rsi, 187E1
  je set_e
  cmp rsi, 186FA
  je set_e0
  cmp rsi, 186FB
  je set_e1
  jmp code

set_h:
  mov [adr_health],rbx
  jmp code

set_g:
  mov [adr_gold],rbx
  jmp code

set_e:
  mov [adr_exp],rbx
  jmp code

set_e0:
  mov [adr_ehealth0],rbx
  jmp code

set_e1:
  mov [adr_ehealth1],rbx
  jmp code

code:
  mov rcx,[rbx]
  mov [rdi],rcx
  jmp return

GETVALUES:
  jmp newmem
  nop

return:
registersymbol(GETVALUES)

// -----------------------------------------------------------------------------
// What a mess!!!
// -----------------------------------------------------------------------------

aobscanmodule(GETVALUE2,Undertale Yellow.exe,49 8B 07 48 89 07 4C)
alloc(newmem2,$1000,GETVALUE2)

alloc(adr_enc_count,8)

registersymbol(adr_enc_count)

label(code2)
label(return2)

adr_enc_count:
  dq (double)0

newmem2:
  cmp [rsp+60], 187A1
  jne code2
  mov [adr_enc_count],r15

code2:
  mov rax,[r15]
  mov [rdi],rax
  jmp return2

GETVALUE2:
  jmp newmem2
  nop

return2:
registersymbol(GETVALUE2)

// -----------------------------------------------------------------------------
// What a mess!!!
// -----------------------------------------------------------------------------

aobscanmodule(GETVALUE3,Undertale Yellow.exe,48 89 03 48 8B 9C 24 90 00 00 00)
alloc(newmem3,$1000,GETVALUE3)

alloc(adr_enc_time,8)
alloc(hck_no_encounter,8)
alloc(hck_freeze_health,8)

registersymbol(adr_enc_time)
registersymbol(hck_no_encounter)
registersymbol(hck_freeze_health)

adr_enc_time:
  dq (double)0

hck_no_encounter:
  dq (double)0

hck_freeze_health:
  dq (double)0

label(code3)
label(return3)
label(noset3)

newmem3:
  cmp [rsp],199B0
  je set_enc_time
  cmp [rsp+00000050],187D5
  jne code3
  cmp [hck_freeze_health],1
  je noset3

set_enc_time:
  cmp [adr_health],rbx
  je code3
  mov [adr_enc_time],rbx
  cmp [hck_no_encounter],1
  je noset3

code3:
  mov [rbx],rax
noset3:
  mov rbx,[rsp+00000090]
  jmp return3

GETVALUE3:
  jmp newmem3
  nop 6
return3:
registersymbol(GETVALUE3)

[DISABLE]
{
GETVALUES:
  db 48 8B 0B 48 89 0F

unregistersymbol(GETVALUES)
dealloc(newmem)
}"""
