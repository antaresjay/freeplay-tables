[[cheat]]
id = "infinite-coinbeetles"
name = "Infinite CoinBeetles"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(nochoice, BuffManager:GetSpecialState+0, BuffManager:GetSpecialState+64, 48 8B 75 F0 48 8B 7D F8 48 8D 65 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  cmp dword ptr [rsi+10], #4
  jne code

  cmp byte ptr [rsi+14], 'r'
  jne code

  cmp byte ptr [rsi+16], 'o'
  jne code

  cmp byte ptr [rsi+18], 'c'
  jne code

  cmp byte ptr [rsi+1A], 'k'
  jne code

  mov rax, 63
code:
  mov rsi,[rbp-10]
  mov rdi,[rbp-08]
  lea rsp,[rbp+00]
  pop rbp
  ret 
  jmp return

nochoice:
  jmp far newmem
return:
registersymbol(nochoice)

[DISABLE]

nochoice:
  db 48 8B 75 F0 48 8B 7D F8 48 8D 65 00 5D C3

unregistersymbol(nochoice)
dealloc(newmem)"""
