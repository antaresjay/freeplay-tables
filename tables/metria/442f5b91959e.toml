[[cheat]]
id = "max-attack-range"
name = "Max Attack Range"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
//Send@Sintrix
define(address,"GameAssembly.dll"+E1DF00)
define(bytes,F2 0F 10 44 88 20)

define(address2,"GameAssembly.dll"+E1DF06)
define(bytes2,8B 44 88 28 EB 32)

[ENABLE]


assert(address,bytes)
alloc(newmem,$1000,"GameAssembly.dll"+E1DF00)

label(code)
label(return)

newmem:
  mov [rax+rcx*4+20],(float)5000
code:

  movsd xmm0,[rax+rcx*4+20]
  jmp return

address:
  jmp newmem
  nop
return:

assert(address2,bytes2)
alloc(newmem2,$1000,"GameAssembly.dll"+E1DF06)

label(code2)
label(return2)

newmem2:
  mov [rax+rcx*4+20],(float)5000
code2:

  mov eax,[rax+rcx*4+28]
  jmp GameAssembly.dll+E1DF3E
  jmp return2

address2:
  jmp newmem2
  nop
return2:

[DISABLE]

address:
  db bytes
address2:
  db bytes2

dealloc(*)"""

