[[cheat]]
id = "infinite-tower-health"
name = "Infinite Tower Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : GoH.exe
  Version: 
  Date   : 2021-09-29
  Author : AlvinC

  This script does blah blah blah
}

[ENABLE]

aobscanregion(playertower,gameFlow:playerTowerTakeDamage+39,gameFlow:playerTowerTakeDamage+80,48 63 87 ? ? 00 00 2B) // should be unique
alloc(newmem,$1000,playertower)

label(codetower)
label(return)

newmem:
  push eax
  mov eax,[rdi+00000C20]
  mov [rdi+00000C1C],eax
  pop eax
codetower:
  readmem(playertower,7)
  jmp return

playertower:
  jmp newmem
  nop 2
return:
registersymbol(playertower codetower)

[DISABLE]

playertower:
  readmem(codetower,7)

unregistersymbol(*)
dealloc(*)"""

