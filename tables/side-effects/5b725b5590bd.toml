{ Game   : Side Effects.exe
  Version: 
  Date   : 2025-11-22
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,Player:LateUpdate)
define(bytes,48 83 EC 08 48 89 34 24)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Player:LateUpdate)

label(code)
label(return)

newmem:
mov [player_ptr],rcx

code:
  sub rsp,08
  mov [rsp],rsi
  jmp return

player_ptr:
dq 0

address:
  jmp newmem
  nop 3
return:
registersymbol(player_ptr)

[DISABLE]

address:
  db bytes
  // sub rsp,08
  // mov [rsp],rsi

dealloc(newmem)
unregistersymbol(player_ptr)

{
// ORIGINAL CODE - INJECTION POINT: Player:LateUpdate

1E48F340CA9: 04 02           - add al,02
1E48F340CAB: 05 04 03 01 50  - add eax,50010304
1E48F340CB0: 00 00           - add [rax],al
1E48F340CB2: 00 00           - add [rax],al
1E48F340CB4: 00 00           - add [rax],al
1E48F340CB6: 00 00           - add [rax],al
1E48F340CB8: 00 00           - add [rax],al
1E48F340CBA: 00 00           - add [rax],al
1E48F340CBC: 00 00           - add [rax],al
1E48F340CBE: 00 00           - add [rax],al
// ---------- INJECTING HERE ----------
Player:LateUpdate: 48 83 EC 08     - sub rsp,08
// ---------- DONE INJECTING  ----------
Player:LateUpdate+4: 48 89 34 24     - mov [rsp],rsi
Player:LateUpdate+8: 48 8B F1        - mov rsi,rcx
Player:LateUpdate+b: 0F B6 46 5C     - movzx eax,byte ptr [rsi+5C]
Player:LateUpdate+f: 48 8B 34 24     - mov rsi,[rsp]
Player:LateUpdate+13: 48 83 C4 08     - add rsp,08
Player:LateUpdate+17: C3              - ret 
1E48F340CD8: 01 04 01        - add [rcx+rax],eax
1E48F340CDB: 00 04 02        - add [rdx+rax],al
1E48F340CDE: 00 00           - add [rax],al
