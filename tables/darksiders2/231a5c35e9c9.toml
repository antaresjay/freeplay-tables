[[cheat]]
id = "field-of-view-fix"
name = "Field of View fix "
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Sorry for all the bad practices and shitty code, I was halfway asleep
when I made this, but it still works flawlessly, as intended.
Enjoy, /u/midterm360 <3 }

[ENABLE]
alloc(newmem,128)
alloc(newmem1,128)
alloc(fuckFPUImJoking,4)
alloc(FPU.Dump,4)
alloc(FoV,4)
registersymbol(FoV)

FoV:
 dd (float)55.00

label(returnhere)
label(exit)
label(returnhere1)
label(exit1)

newmem:
 fstp [fuckFPUImJoking]
 fld  [FoV]
 fstp DWORD PTR [eax+4C]
 pop  esi
 leave

exit:
 jmp returnhere

"Darksiders2.exe"+EB34C:
 jmp newmem
returnhere:

newmem1:
 fstp   [FPU.Dump] //; safely dispose of other value
 fld    [FoV]      //; load our new value
 fstp   DWORD PTR [eax+4C]  //; actual edit
 pop    edi
 pop    esi

exit1:
 jmp returnhere1

"Darksiders2.exe"+131A05:
 jmp newmem1
returnhere1:

[DISABLE]
"Darksiders2.exe"+EB34C:
fstp dword ptr [eax+4C]
pop esi
leave

"Darksiders2.exe"+131A05:
fstp dword ptr [eax+4C]
pop edi
pop esi

dealloc(newmem)
dealloc(newmem1)

dealloc(fuckFPUImJoking)
dealloc(FoV)
unregistersymbol(FoV)"""

