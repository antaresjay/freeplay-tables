[[cheat]]
id = "2-disable-anti-cheat"
name = "→ [2] Disable Anti-Cheat"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(lo1pslz823km,CodeStage.AntiCheat.Detectors.ObscuredCheatingDetector:get_ExistsAndIsRunning,CodeStage.AntiCheat.Detectors.ObscuredCheatingDetector:get_ExistsAndIsRunning+31,83xxxx0FB6xxxxEBxx33)
alloc(newmem,$1000,lo1pslz823km)
//Send@Sintrix
label(code)
label(return)

newmem:
mov [rax+42],0

code:
  cmp dword ptr [rcx],00
  movzx eax,byte ptr [rax+45]
  jmp return

lo1pslz823km:
  jmp newmem
  nop 2
return:
registersymbol(lo1pslz823km)
//Send@Sintrix
[DISABLE]

lo1pslz823km:
  db 83 39 00 0F B6 40 45
//Send@Sintrix
unregistersymbol(*)
dealloc(*)"""

