[[cheat]]
id = "start-with-30-life"
name = "Start with 30 life"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanregion(_GMSetPlayer,"_GameManager:SetPlayerByType","_GameManager:SetPlayerByType"+100,49 89 47 18 48 63 87 AC 00 00 00 41 89 47 28)
registerSymbol(_GMSetPlayer)

_GMSetPlayer+4:
  xor rax,rax
  mov ax,#30

[DISABLE]

_GMSetPlayer+4:
  db 48 63 87 AC 00 00 00

unregisterSymbol(_GMSetPlayer)

{
_GameManager:SetPlayerByType+8X: 49 89 47 18                    - mov [r15+18],rax
// ---------- INJECT----------
_GameManager:SetPlayerByType+8X: 48 63 87 AC 00 00 00           - movsxd  rax,dword ptr [rdi+000000AC]
// ----------  DONE ----------
_GameManager:SetPlayerByType+8X: 41 89 47 28                    - mov [r15+28],eax
}"""

[[cheat]]
id = "change-jmpheight-current-act-instance"
name = "Change JmpHeight (Current Act Instance)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanRegion(itcptAdr,"PlayerInfo:SetCurrentInfo","PlayerInfo:SetCurrentInfo"+E0,41 FF D3 4C 8B F8 41 83 3F 00)
alloc(intMem,100,itcptAdr)
label(ChrPtr)
registerSymbol(itcptAdr)
registerSymbol(ChrPtr)

intMem:
  mov [ChrPtr],rax
  mov r15,rax
  ret
ChrPtr:
  dq 0


itcptAdr+3:
  call intMem
  nop
  nop


[DISABLE]

itcptAdr+3:
  mov r15,rax
  cmp dword ptr [r15],00

unregisterSymbol(ChrPtr)
unregisterSymbol(itcptAdr)
dealloc(intMem)"""

