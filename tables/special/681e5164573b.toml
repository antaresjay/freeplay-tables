type = "script"
source = """
//Created by Send @ https://fearlessrevolution.com & https://sintrix.net
define(address,PlayerInfo:SetCurrentInfo+1f)
define(bytes,48 63 47 28 89 47 34)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,PlayerInfo:SetCurrentInfo+1f)

label(code)
label(return)

newmem:
