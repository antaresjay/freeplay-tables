[[cheat]]
id = "game-difficulty-change"
name = "Game difficulty Change"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ 游戏   : yakuzakiwami2_r.exe
  版本: v2.12
  日期   : 2026-01-17
  作者 : KornSiavn

  游戏难度修改
}

[ENABLE]

aobscanmodule(game_difficulty,YakuzaKiwami2_R.exe,89 51 20 C3 CC CC CC CC CC CC CC CC CC 8B)
alloc(newmem,$1000,game_difficulty)

// 分配一个空间用来存放“基址指针”
alloc(pDifficultyBase, 8)
registersymbol(pDifficultyBase)

label(code)
label(return)

// 初始化指针为 0
pDifficultyBase:
  dq 0

newmem:
  // 【核心逻辑】
  // 我们不修改数值，而是把当前的地址基址 (RCX) 偷出来保存到 pDifficultyBase
  mov [pDifficultyBase], rcx

code:
  // 执行原始代码：让游戏自己决定写入什么数值 (EDX)
  // 这样就不会“锁定”了
  mov [rcx+20],edx

  // 必须执行原始的返回指令
  ret

  int 3
  jmp return

game_difficulty:
  jmp newmem
return:
registersymbol(game_difficulty)

[DISABLE]

game_difficulty:
  db 89 51 20 C3 CC

unregistersymbol(game_difficulty)
unregistersymbol(pDifficultyBase)
dealloc(newmem)
dealloc(pDifficultyBase)
