[[cheat]]
id = "character-inventory-buy-craft-sell-upgrade-gold"
name = "Character   [Inventory]   Buy/Craft/Sell/Upgrade   [Gold]"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(_inventory,$process,8B 81 78 03 00 00 C3)
alloc(_currency,8)
alloc(newmem,$100,_inventory)
label(return)
registersymbol(_currency _inventory)
newmem:
  mov [_currency],rcx
  mov eax,[rcx+378]
  jmp return
_inventory:
  jmp newmem
  nop
return:
[DISABLE]
dealloc(*)
unregistersymbol(*)
_inventory:
  db 8B 81 78 03 00 00"""

