[[cheat]]
id = "god-mode"
name = "GOD Mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(pPID,83 3E 00 48 8D 46 50 48 0F BE 08 40 88 8D F8 FE FF FF 48 0F BE 48 01 40 88 8D F9 FE FF FF 48 0F BE 48 02 40 88 8D FA FE FF FF 48 0F BE 40 03 40 88 85 FB FE FF FF)
registersymbol(pPID)
alloc(pPIDmem,$1000,pPID)
label(returnhere)
label(originalcode)
registersymbol(pPidPTR)
label(pPidPTR)

pPIDmem:
cmp ecx,[pPidPTR]
jne originalcode
mov [rsi+68],553
cmp dword ptr [rsi],00
lea rax,[rsi+50]
jmp returnhere
originalcode:
mov [rsi+68],0
cmp dword ptr [rsi],00
lea rax,[rsi+50]
jmp returnhere
pPidPTR:
dd 1
pPID:
jmp pPIDmem
nop
nop
returnhere:

aobscan(Gmode,49 63 56 1C 48 8B CE 48 83 EC 20 83 3E 00)
registersymbol(Gmode)
alloc(GmodeMem,$1000,Gmode)
label(returnhere2)
label(originalcode2)

GmodeMem:
cmp edi,100000
jna originalcode2
cmp  [rdi+68],553
jne originalcode2

mov  dword ptr [r14+1c],2
originalcode2:
movsxd  rdx,dword ptr [r14+1C]
mov rcx,rsi
jmp returnhere2

Gmode:
jmp GmodeMem
nop
nop
returnhere2:

[DISABLE]
pPID:
 db 83 3E 00 48 8D 46 50
 unregistersymbol(pPID)
 dealloc(pPIDmem)

Gmode:
  db 49 63 56 1C 48 8B CE
  unregistersymbol(Gmode)
  dealloc(GmodeMem)"""

