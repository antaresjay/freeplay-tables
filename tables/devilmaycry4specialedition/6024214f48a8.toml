label(rings)
label(bilbo)
label(frodo)
label(Gandolf)
label(Gandolf_The_White)
label(exit)
label(DT)
label(ManualCheck)
label(loadcheck)
label(loadcheck2)
label(originalcode)
registersymbol(ChargeGod)
registersymbol(ChargeGodManual)
registersymbol(ChargeSpeed)
registersymbol(LeftHit)
registersymbol(RightHit)
registersymbol(SpinKick)
registersymbol(Chun_Li)
registersymbol(Rocket)








ChargeGodManual:
db 00 00 00 00

Uppercut:
movss xmm5,[ChargeSpeed]
movss xmm0,xmm5
jmp DevilMayCry4SpecialEdition.exe+BAEC1

LeftHit:
movss xmm5,[ChargeSpeed]
movss xmm0,xmm5
jmp DevilMayCry4SpecialEdition.exe+B6A91

RightHit:
movss xmm5,[ChargeSpeed]
movss xmm0,xmm5
jmp DevilMayCry4SpecialEdition.exe+B74EB

SpinKick:
