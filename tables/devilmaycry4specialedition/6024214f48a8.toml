jg originalcode
jl ManualCheck

ManualCheck:
cmp [ChargeGodManual],0
je rings
jne originalcode


rings:
cmp [esi+7b58], 42c80000 //concentration value 100
jge bilbo//If 100 or Higher
jl frodo

frodo://Base Charge
