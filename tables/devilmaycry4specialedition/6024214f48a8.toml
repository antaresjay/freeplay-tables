label(Gandolf)
label(exit)
label(DT)
label(ManualCheck)
label(loadcheck)
label(loadcheck2)
label(originalcode)
registersymbol(ChargeGod)
registersymbol(ChargeGodManual)


ChargeGodManual:
db 00 00 00 00


DevilMayCry4SpecialEdition.exe+BAEBC://Uppercut
movss xmm0,[ebx+28]

DevilMayCry4SpecialEdition.exe+B6A8C://First HIt
movss xmm0,[ebx+28]

DevilMayCry4SpecialEdition.exe+B74E6://Second Hit
movss xmm0,[ebx+28]

DevilMayCry4SpecialEdition.exe+B9D2E://Spin Kick 3 Hit Combo
movss xmm0,[ebx+28]

DevilMayCry4SpecialEdition.exe+B92DE://Chun-Li Kick
movss xmm0,[ebx+28]

DevilMayCry4SpecialEdition.exe+BD449://Last HIt Rocket Punch
movss xmm0,[ebx+28]






ChargeGod: //this is allocated memory, you have read,write,execute access
//place your code here

ManualCheck:
cmp [ChargeGodManual],0
je loadcheck
jne originalcode

loadcheck:
cmp [esi+1c],(float)1
jge loadcheck2

loadcheck2:
cmp [esi+1c],(float)2
jg originalcode
jl rings


rings:
cmp [esi+7b58], 42c80000 //concentration value 100
jge bilbo//If 100 or Higher
jl frodo

frodo://Base Charge
mov [esi+28],3F800000
mov [edi+00007C50],bl
jmp DevilMayCry4SpecialEdition.exe+CCD21

bilbo:// Concentration Value Between 100 - 250
cmp [esi+7b58], 437B0000//concentration value 251
jge Gandolf//If 251 or Higher
mov [esi+28],40000000
mov [edi+00007C50],bl
jmp DevilMayCry4SpecialEdition.exe+CCD21



Gandolf: //Concentration Value Between 251-299
cmp [esi+7b58], 43960000//concentration value 300
jge DT// If 300 "You SHall PASS"
mov [esi+28],40400000
mov [edi+00007C50],bl
jmp DevilMayCry4SpecialEdition.exe+CCD21


DT:
cmp byte ptr [esi+000078e4],02
je Gandolf_The_White// If 300 "You SHALL PASS"
mov [esi+28],40400000
mov [edi+00007C50],bl
jmp DevilMayCry4SpecialEdition.exe+CCD21


Gandolf_The_White:
mov [esi+28],40A00000
mov [edi+00007C50],bl
jmp DevilMayCry4SpecialEdition.exe+CCD21


originalcode:
mov [edi+00007C50],bl

exit:
jmp returnhere




"DevilMayCry4SpecialEdition.exe"+CCD1B:
jmp ChargeGod
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(ChargeGod)
dealloc(ChargeGodManual)

unregistersymbol(ChargeGod)
unregistersymbol(ChargeGodManual)


