pop eax
pop edx
popfd
jmp DevilMayCry4SpecialEdition.exe+22DDD4

Total_Exit:
movss xmm1,[ecx+14]
popfd
jmp DevilMayCry4SpecialEdition.exe+22DDCA

"DevilMayCry4SpecialEdition.exe"+22DDC5:
