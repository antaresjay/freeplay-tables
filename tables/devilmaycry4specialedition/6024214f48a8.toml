jne Originalcode_Damage_Tuner

Damage_Adjust:
movss xmm7,[Damage_Write]
movss [ecx+14],xmm7
cmp [Damage_Multiplier],1
je Damage_Mult
jne Originalcode_Damage_Tuner



Damage_Mult:
