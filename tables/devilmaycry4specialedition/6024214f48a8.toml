movss xmm0,[edi+30]
subss xmm0,xmm1
comiss xmm2,xmm0
movss [edi+44],xmm1
//movss[edi+30],xmm0
pop esi
pop eax
pop edx
popfd
jmp DevilMayCry4SpecialEdition.exe+22DDE5

Originalcode_Damage_Tuner:
movss xmm1,[ecx+14]

Exit_Damage_Tuner:
