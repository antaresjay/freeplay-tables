movss xmm0,[edi+30]
movss xmm1,xmm7
jmp Exit_One_Hit_Kills

Style_Statue:
mulss xmm1,[edi+40]
movss xmm0,[edi+30]
jmp Exit_One_Hit_Kills

Must_Style_Mode:
