type = "script"
source = """
[ENABLE]



aobscanmodule(energy_aob,starwarssquadrons.exe,00 F3 0F 10 83 D0 03 00 00 0F 2F 83 E0 02 00 00) // should be unique
alloc(newmem,$1000,"starwarssquadrons.exe"+1843D93)

label(code)
label(return)

newmem:
code:
  movss xmm0,[rbx+000003D0]

movss [rbx+000002E0],xmm0
comiss xmm0,[rbx+000002E0]
  jmp return

energy_aob+01:
  mov rcx, newmem
  jmp rcx
  nop 3
return:
