type = "script"
source = """
[ENABLE]

aobscanmodule(wpnDur,Yakuza3.exe,89 97 50 02 00 00 E8 xx xx xx xx 39) // should be unique
alloc(newmem,$1000,wpnDur)

label(code)
label(return)

newmem:

code:
  mov [rdi+00000250],#100
  jmp return

wpnDur:
  jmp newmem
  nop
return:
registersymbol(wpnDur)

