movsd xmm1,[r11]

readmem(healthCalOnTakeHelathAOB,5)
//movsd xmm0,[rcx+70]
readmem(healthCalOnTakeHelathAOB+5,2)
db 5C 45
readmem(healthCalOnTakeHelathAOB+9,1)
//subsd xmm0,[rbp-78]
comisd xmm0,xmm1
jae @f
readmem(healthCalOnTakeHelathAOB+5,2)
db 58
readmem(healthCalOnTakeHelathAOB+8,2)
//addsd xmm1,[rbp-78]
readmem(healthCalOnTakeHelathAOB,2)
db 11 49
readmem(healthCalOnTakeHelathAOB+4,1)
//movsd [rcx+70],xmm1

@@:

