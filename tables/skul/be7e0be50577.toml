type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanregion(healthCalOnTakeHelathAOB,Characters:Health:TakeHealth,Characters:Health:TakeHealth+400,F2 0F ** ** ** F2 0F ** ** ** F2 0F)
