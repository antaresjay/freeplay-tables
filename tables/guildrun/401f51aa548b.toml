[[cheat]]
id = "shards"
name = "Shards"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

assert(Ember.Scopes.GameRun.Player.Services.PlayerService.ModifyShards,48 89 5C 24 18)

alloc(newmem,$1000,Ember.Scopes.GameRun.Player.Services.PlayerService.ModifyShards)

label(return)
label(original)
label(spending)
label(earning)
label(lastDelta)
label(callCount)

label(shardMultiplier)
label(freePurchases)

registersymbol(shardMultiplier)
registersymbol(freePurchases)
registersymbol(lastDelta)
registersymbol(callCount)

newmem:
  inc dword ptr [callCount]

  cmp edx,0
  jl spending
  jg earning
  jmp original

spending:
  cmp [freePurchases],0
  je original

  xor edx,edx
  jmp original

earning:
  mov [lastDelta],edx

  mov eax,edx
  imul eax,dword ptr [shardMultiplier]
  cdq
  mov r9d,#100
  idiv r9d
  mov edx,eax

  jmp original

original:
  mov [rsp+18],rbx
  jmp return

align 8

shardMultiplier:
dd #100          // default x10

freePurchases:
dd 0           // 1=enabled, 0=disabled

lastDelta:
dd

callCount:
dd

Ember.Scopes.GameRun.Player.Services.PlayerService.ModifyShards:
  jmp newmem

return:

[DISABLE]

Ember.Scopes.GameRun.Player.Services.PlayerService.ModifyShards:
  db 48 89 5C 24 18

unregistersymbol(shardMultiplier)
unregistersymbol(freePurchases)
dealloc(newmem)"""

