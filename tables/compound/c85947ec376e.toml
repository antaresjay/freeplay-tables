[[cheat]]
id = "orange-energy-inf-inv-ammo"
name = "orange (energy) inf INV ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(INJECT,2B C1 89 47 50) // should be unique
alloc(newmem,$1000,INJECT)

label(code)
label(return)

newmem:

code:
  //sub eax,ecx
  mov [rdi+50],eax
  jmp return

INJECT:
  jmp newmem
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 2B C1 89 47 50

unregistersymbol(INJECT)
dealloc(newmem)"""

