[[cheat]]
id = "prepare-cheats"
name = "Prepare Cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(cheats, UIPlayerStaminaBarController:UpdateStaminaBar+0, UIPlayerStaminaBarController:UpdateStaminaBar+f8, F3 0F 10 49 2C F3 0F 5A C9 F2 0F 5E C1 48 8B C8) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(stacd)
label(atcd)
label(depcd)

label(playP)
registersymbol(playP)

label(hpF)
registersymbol(hpF)

label(staF)
registersymbol(staF)

label(atF)
registersymbol(atF)

label(depF)
registersymbol(depF)


newmem:
  mov [playP], rcx

  cmp dword ptr [hpF], 1
  jne stacd

  fld dword ptr [rcx+24]
  fstp dword ptr [rcx+20]

stacd:
  cmp dword ptr [staF], 1
  jne atcd

  fld dword ptr [rcx+2C]
  fstp dword ptr [rcx+28]

atcd:
  cmp dword ptr [atF], 1
  jne depcd

  mov [rcx+30], #1000

depcd:
  cmp dword ptr [depF], 1
  jne code

  mov [rcx+34], #1000

code:
  movss xmm1,[rcx+2C]
  cvtss2sd xmm1,xmm1
  divsd xmm0,xmm1
  mov rcx,rax
  jmp return

playP:
dq 0

hpF:
dd 0

staF:
dd 0

atF:
dd 0

depF:
dd 0

cheats:
  jmp far newmem
  nop 2
return:
registersymbol(cheats)

[DISABLE]

cheats:
  db F3 0F 10 49 2C F3 0F 5A C9 F2 0F 5E C1 48 8B C8

unregistersymbol(cheats)
unregistersymbol(playP)
unregistersymbol(hpF)
unregistersymbol(staF)
unregistersymbol(atF)
unregistersymbol(depF)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: UIPlayerStaminaBarController:UpdateStaminaBar+aa

UIPlayerStaminaBarController:UpdateStaminaBar+7e: 48 BA 90 39 F6 BA 50 01 00 00  - mov rdx,00000150BAF63990
