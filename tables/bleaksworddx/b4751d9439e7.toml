UIPlayerStaminaBarController:UpdateStaminaBar+99: 39 51 18                       - cmp [rcx+18],edx
UIPlayerStaminaBarController:UpdateStaminaBar+9c: 0F 86 33 00 00 00              - jbe UIPlayerStaminaBarController:UpdateStaminaBar+d5
UIPlayerStaminaBarController:UpdateStaminaBar+a2: 48 8D 4C D1 20                 - lea rcx,[rcx+rdx*8+20]
