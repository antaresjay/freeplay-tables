[[cheat]]
id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(ammocd,Crysis2.exe,3A 30 AB 00 8B 44 24 04 3B C6)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov eax, [esp+04]
  cmp eax, esi
  je code

  push ecx
  mov ecx, [eax+1C]
  mov [eax+14], ecx
  pop ecx

code:
  mov eax, [esp+04]
  cmp eax, esi
  jmp return

ammocd+04:
  jmp newmem
  nop
return:
registersymbol(ammocd)

[DISABLE]

ammocd+04:
  db 8B 44 24 04 3B C6

unregistersymbol(ammocd)
dealloc(newmem)"""

[[cheat]]
id = "no-reload"
name = "No Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(noreloadcd,Crysis2.exe,85 C0 74 04 8B 40 04 C3 33 C0 C3 B9)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  test eax, eax
  je code

  cmp dword ptr [eax+04], 1
  jle @F

  mov [eax+04], #999

@@:
  mov eax, [eax+04]
  ret

code:
  xor eax, eax
  jmp return

noreloadcd:
  jmp newmem
  nop
  nop
  nop
  nop
  nop
return:
registersymbol(noreloadcd)

[DISABLE]

noreloadcd:
  db 85 C0 74 04 8B 40 04 C3 33 C0

unregistersymbol(noreloadcd)
dealloc(newmem)"""
