[[cheat]]
id = "round-director-ctrl-numpad-2"
name = "Round Director (Ctrl + Numpad 2)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : BlowAwaySurvivors.exe
// Author            : ndck76
// Executable Version: 2021.3.16.5719
// Game Version      : v1.0.0
// Script Date       : 2024-08-18


[ENABLE]

aobscanmodule(elapsedtime,GameAssembly.dll,0F2Fxxxxxxxxxx0F82xxxxxxxxF3xxxxxxxxxxxxxx0F28) //RoundDirector.OnUpdate
alloc(newmem,$1000,elapsedtime)
alloc(data4,8)
alloc(elapsedtimebkp,7)
registersymbol(data4)
registersymbol(elapsedtime)
registersymbol(elapsedtimebkp)
label(code)
label(return)

elapsedtimebkp:
  readmem(elapsedtime,7)

newmem:
  mov [data4],rbx

code:
  readmem(elapsedtime,7)
  jmp return

elapsedtime:
  jmp newmem
  nop 2
return:

[DISABLE]

elapsedtime:
  readmem(elapsedtimebkp,7)

unregistersymbol(*)
dealloc(*)"""

