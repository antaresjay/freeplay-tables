// Game Executable   : DamonAndBaby-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.4.4.0
// Game Version      : v01.03
// Script Date       : 2026-03-27


[ENABLE]

aobscanmodule(money,DamonAndBaby-Win64-Shipping.exe,8Bxxxx488BxxxxxxC3xxxxxxxxxxxxxxxxxxxxxxxxxxxx4889xxxxxx574883xxxx488Bxx488B) // should be unique
alloc(newmem,$1000,money)
alloc(data2,8)
alloc(moneybkp,8)
registersymbol(data2)
registersymbol(money)
registersymbol(moneybkp)
label(code)
label(return)

moneybkp:
  readmem(money,8)

newmem:
  mov [data2],rax

code:
  readmem(money,8)
  jmp return

money:
  jmp newmem
  nop 3
return:

[DISABLE]

money:
  readmem(moneybkp,8)

unregistersymbol(*)
dealloc(*)"""

