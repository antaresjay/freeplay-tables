[[cheat]]
id = "damage-multiplier"
name = "Damage Multiplier"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
DamageScript:
  push ebp
  mov ebp, esp
  push ebx
  mov ebx, [ebp+04]
  mov [ebp+08],ebx
{$try}
  mov ebx,[edi-4C]
  jmp short noexc
{$except}
  jmp end
noexc:
  cmp ebx, #1492
  je end
  cmp [edi-34], 00780000
  jne end
  cmp [edi+5C], 64 // C4
  jne end
  cmp [edi+68], 08000010
  jne end
  mov ebx, ecx
  sub ebx, [edi+24]
  add [edi+24], ebx
  sub esp, 20
  movdqu [esp], xmm0
  cvtsi2ss xmm0, ebx
  mulss xmm0, [DMGMult]
  cvtss2si ebx, xmm0
  movdqu xmm0, [esp]
  add esp, 20
  sub [edi+24], ebx
  cmp [edi+24],0
  jg end
  mov [edi+24],0
end:
  pop ebx
  pop ebp
  add esp, 4
  ret
 
[DISABLE]
DamageScript:
  dq 0"""

