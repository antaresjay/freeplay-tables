[[cheat]]
id = "infinite-health"
name = "INFINITE HEALTH"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(health)
label(returnhere)
registersymbol(health)
aobscan(aob_health,F3 0F 10 86 08 0D 00 00 0F 2F 05 E4 4C 72 00)

newmem:
mov [esi+00000D08],(float)0
movss xmm0,[esi+00000D08]
jmp returnhere

aob_health:
health:
jmp newmem
nop
nop
nop
returnhere:

[DISABLE]
dealloc(newmem)
unregistersymbol(health)
health:
movss xmm0,[esi+00000D08]"""

