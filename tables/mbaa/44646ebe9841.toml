[[cheat]]
id = "hit-anywhere-player-1-excludes-throws-do-not-enable-with-other-hit-anywhere-code"
name = "Hit Anywhere Player 1 (Excludes Throws.  Do not enable with other Hit Anywhere code.) "
category = "player"
description = ""
