type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(HitAnywhere) //Create Label
registersymbol(HitAnywhere) //Register Symbol
label(returnhere)
//Find Hook Point
aobscan(HookHitJump, E9 38 FF FF FF 0F B6 97 A1 01 00 00 8B 44 24 1C 89 84 97 F8 01 00 00 0F B6 8F A1 01 00 00)

newmem:
cmp [edi+04], 1 //Is this Player 2 being attacked?
je returnhere //If so skip original jump
jmp HookHitJump-C3 //Else use original jump

HookHitJump:
HitAnywhere:
jmp newmem //Jump to allocated memory
returnhere:

[DISABLE]
dealloc(newmem) //Deallocate Memory
HitAnywhere:
db E9 38 FF FF FF //Restore Original Instruction"""

