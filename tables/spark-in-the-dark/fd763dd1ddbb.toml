name = "Dumb Enemies"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(DumbEnemies_AOB, Creatures.Creature:IsEnemyExist, Creatures.Creature:IsEnemyExist+50, 85?? 75?? 33??)
registersymbol(DumbEnemies_AOB)

alloc(DumbEnemies_OldMem, $1000)
registersymbol(DumbEnemies_OldMem)

DumbEnemies_OldMem:
    readmem(DumbEnemies_AOB, $04)

//

