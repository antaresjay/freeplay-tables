[[cheat]]
id = "no-overheat"
name = "No Overheat"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(overheatcd,zgi_steam_win_x64.exe,F3 44 0F 10 87 10 01 00 00)
alloc(newmem,$1000,overheatcd)

label(code)
label(return)

newmem:
code:
  mov [rdi+00000110], 0
  movss xmm8, [rdi+00000110]
  jmp return

overheatcd:
  jmp newmem
  nop
  nop
  nop
  nop
return:
registersymbol(overheatcd)

[DISABLE]

overheatcd:
  db F3 44 0F 10 87 10 01 00 00

unregistersymbol(overheatcd)
dealloc(newmem)"""
