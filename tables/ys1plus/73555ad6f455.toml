[[cheat]]
id = "easy-level-up"
name = "Easy Level Up"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(exp,ys1plus.exe,01 41 14 8B 71 14)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

