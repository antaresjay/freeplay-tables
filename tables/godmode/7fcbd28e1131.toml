[[cheat]]
id = "activate-numpad-0"
name = "Activate (Numpad 0)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : GodMode.exe
  Version: 
  Date   : 2016-02-01
  Author : Abystus

  This script does blah blah blah
}

[ENABLE]
alloc(newmem,$1000)
globalalloc(cameraBase, 4)
aobscan(cameraBaseHook, D9 40 30 8B 4D 0C D9 19 D9 40 34 D9 59 04 D9 40 38 D9 59 08 EB 16) // should be unique

registersymbol(cameraBaseHook)
label(return)

newmem:
  mov [cameraBase], eax
  fld dword ptr [eax+30]
  mov ecx,[ebp+0C]
  jmp return

cameraBaseHook:
  jmp newmem
  nop
return:

[DISABLE]

cameraBaseHook:
  db D9 40 30 8B 4D 0C

unregistersymbol(cameraBaseHook)
dealloc(newmem)"""

[[cheat]]
id = "detach-camera-from-character"
name = "Detach Camera From Character"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
globalAlloc(myCamX, 4)
globalAlloc(myCamY, 4)
globalAlloc(myCamZ, 4)
alloc(newmem,$1000)
aobscan(detachCamera, D9 5E 28 D9 07 D9 5E 30 D9 47 04 D9 5E 34 D9 47 08 D9 5E 38 E8 ?? ?? ?? ??) // should be unique
registersymbol(detachCamera)
label(skipLoad)
label(return)

newmem:
  fstp dword ptr [esi+28]
  cmp [myCamX], 0
  jne skipLoad
      push eax
      mov eax, [edi]
      mov [myCamX], eax
      mov eax, [edi+04]
      mov [myCamZ], eax
      mov eax, [edi+08]
      mov [myCamY], eax
      pop eax
  skipLoad:
  push eax
      mov eax, [myCamX]
      mov [edi], eax
      mov eax, [myCamZ]
      mov [edi+04], eax
      mov eax, [myCamY]
      mov [edi+08], eax
  pop eax
  fld dword ptr [edi]
  jmp return

detachCamera:
  jmp newmem
return:

[DISABLE]
myCamX:
db (float)0
myCamY:
db (float)0
myCamZ:
db (float)0

detachCamera:
  db D9 5E 28 D9 07

unregistersymbol(detachCamera)
dealloc(newmem)"""

