  jmp 11lll11ll1l1l11l1l11
1lll1l1l1llllllll11l:
  popf
  db 39 D0
  jmp 11lll11ll1l1l11l1l11
lll1111l11l111lll1ll:
  jmp lll1l11lllll1lll1111
11lll11ll1l1l11l1l11:
[DISABLE]
lll1111l11l111lll1ll:
  db 41 23 D2 3B C2
Dealloc(lll1l11lllll1lll1111)
UnregisterSymbol(lll1111l11l111lll1ll)"""

