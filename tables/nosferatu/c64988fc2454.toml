//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
aobscanmodule(health,Nosferatu.exe,D9 80 C0 03 00 00 d8 1d * * * * DF E0 F6 C4 41 0f 8b )
