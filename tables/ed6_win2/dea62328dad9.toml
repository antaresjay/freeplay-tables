[[cheat]]
id = "damage-modifier-script"
name = "Damage Modifier Script"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DamageModAOB,ed6_win2.exe,3B F8 76 0C 8B CF 2B C8 89 8E 70 02 00 00) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,2048,DamageModAOB)

label(originalcode)
label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

newmem:
  cmp byte ptr [esi+A],FF
  jne HeroHit
EnemyHit:
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckOneHitKill
  push eax
  fild dword ptr [esp]
  fmul dword ptr [fEnemyDamageMult]
  fistp dword ptr [esp]
  pop eax
CheckOneHitKill:
  cmp [OneHitKill],1
  jne CleanUp
  mov eax,#99999
  jmp CleanUp
HeroHit:
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  push eax
  fild dword ptr [esp]
  fmul dword ptr [fHeroDamageMult]
  fistp dword ptr [esp]
  pop eax
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor eax,eax
  jmp CleanUp
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne CleanUp
  cmp eax,edi
  jl @F
  xor eax,eax
@@:
  jmp CleanUp  
CleanUp:
  cmp edi,eax
  ja originalcode
  mov edi,0
  mov [esi+0000270],edi

originalcode:
  cmp edi,eax
  jna exit2
  mov ecx,edi
  jmp return
exit2:
  jmp DamageModAOB+10

GodMode:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)2.0
fHeroDamageMult:
dq (float)0.25
HeroCannotDie:
dq 1
  
DamageModAOB:
  jmp newmem
  nop
return:

[DISABLE]

DamageModAOB:
  db 3B F8 76 0C 8B CF

unregistersymbol(DamageModAOB)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fHeroDamageMult)
unregistersymbol(HeroCannotDie)

dealloc(newmem)"""

