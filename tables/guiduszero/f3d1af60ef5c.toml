source = """
// Game Executable   : GuidusZero.exe
// Author            : ndck76
// Executable Version: 2022.3.55.14145
// Game Version      : v2.0.1
// Script Date       : 2025-04-04


define(address,UpperBarBehaviour:OnEnable+c0)
define(bytes,48 63 00 89 45 C0)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,UpperBarBehaviour:OnEnable+c0)

label(code)
label(return)
label(data2)
registersymbol(data2)

newmem:

code:
  mov [data2],rax
  movsxd  rax,dword ptr [rax]
  mov [rbp-40],eax
  jmp return

data2:
  db

address:
  jmp newmem
  nop
return:

[DISABLE]

address:
  db bytes
  // movsxd  rax,dword ptr [rax]
  // mov [rbp-40],eax

dealloc(*)
unregistersymbol(*)"""

