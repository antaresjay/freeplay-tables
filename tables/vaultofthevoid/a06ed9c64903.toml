[[cheat]]
id = "main-script"
name = "MAIN_SCRIPT"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//By The God

[ENABLE]

aobscanmodule(INJECT,VaultoftheVoid.exe,48 89 03 48 8B 9C 24 90 00 00 00) // should be unique
alloc(newmem,$1000,INJECT)
alloc(ESSE,$8)
alloc(ENERG,$8)
alloc(UPGR,$8)


label(code,SKILL,Essence,ENERGY,STONE,SOUL,UPGRADE,Get_Upgrade)
label(return)

registersymbol(INJECT,ESSE,ENERG,UPGR,Get_Upgrade)

newmem:
   cmp [rsp+8],1A90C
   jne Essence
   cmp [rsp+C0],1AE47
   jne SKILL
   mov rax,0
   mov [rbx],rax
   mov rbx,[rsp+90]
   jmp return

SKILL:
   cmp [rsp+C0],1AD44
   jne ENERGY
   mov rax,0
   mov [rbx],rax
   mov rbx,[rsp+90]
   jmp return

ENERGY:
   cmp [rsp+48],1A100
   jne code
   cmp rax,[ENERG]
   jae code
   mov rax,[ENERG]
   mov [rbx],rax
   mov rbx,[rsp+90]
   jmp return


Essence:
   cmp [rsp+48],1A20C
   jne STONE
   mov rax,[ESSE]
   mov [rbx],rax
   mov rbx,[rsp+90]
   jmp return

STONE:
   cmp [rsp+48],19FE9
   jne SOUL
   imul rbx
   mov [rbx],rax
   mov rbx,[rsp+90]
   jmp return

SOUL:
   cmp [rsp+48],1AD10
   jne UPGRADE
   mov rax,[ESSE]
   mov [rbx],rax
   mov rbx,[rsp+90]
   jmp return

UPGRADE:
   cmp [rsp+48],1AF61
   jne code
   cmp [Get_Upgrade],1
   jne code
   mov rax,[UPGR]
   mov [rbx],rax
   mov rbx,[rsp+90]
   jmp return

code:
   mov [rbx],rax
   mov rbx,[rsp+90]
   jmp return

INJECT:
  jmp newmem
  nop 6
return:

ESSE:
    dq (double)9999999
ENERG:
    dq (double)5
UPGR:
    dq (double)2
Get_Upgrade:
    dd  0


[DISABLE]

INJECT:
  db 48 89 03 48 8B 9C 24 90 00 00 00

unregistersymbol(*)
dealloc(*)"""

