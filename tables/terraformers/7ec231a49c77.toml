type = "script"
source = """
[ENABLE]

aobscanregion(Atmos_AOB,Terraf.TerraformingSystem:FrameUpdate,Terraf.TerraformingSystem:FrameUpdate+431,48 63 49 78 3B C1) // should be unique
alloc(newmem,$1000,Atmos_AOB)

label(code)
label(return)

newmem:

code:
  mov [rcx+78],#777
  movsxd  rcx,dword ptr [rcx+78]
  cmp eax,ecx
  jmp return

Atmos_AOB:
  jmp newmem
  nop
return:
registersymbol(Atmos_AOB)

[DISABLE]

Atmos_AOB:
  db 48 63 49 78 3B C1

unregistersymbol(Atmos_AOB)
dealloc(newmem)"""
