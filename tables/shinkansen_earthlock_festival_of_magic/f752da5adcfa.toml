[[cheat]]
id = "gamecharacter-base-address-scan-initialization-activate-this-first"
name = "GameCharacter Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameCharacter_basepointer)
registersymbol(GameCharacter_update_enable)
registersymbol(GameCharacter_update_value)
registersymbol(GameCharacter_set_enable)
registersymbol(GameCharacter_healthset_enable)
registersymbol(GameCharacter_manaset_enable)
registersymbol(GameCharacter_experienceset_enable)
registersymbol(GameCharacter_tpset_enable)
registersymbol(GameCharacter_statsset_enable)

alloc(GameCharacter_basepointer, 4)
alloc(GameCharacter_update_enable, 4)
alloc(GameCharacter_update_value, 4)
alloc(GameCharacter_set_enable, 4)
alloc(GameCharacter_healthset_enable, 4)
alloc(GameCharacter_manaset_enable, 4)
alloc(GameCharacter_experienceset_enable, 4)
alloc(GameCharacter_tpset_enable, 4)
alloc(GameCharacter_statsset_enable, 4)

GameCharacter_update_value:
dd #3


[DISABLE]
unregistersymbol(GameCharacter_basepointer)
unregistersymbol(GameCharacter_update_enable)
unregistersymbol(GameCharacter_update_value)
unregistersymbol(GameCharacter_set_enable)
unregistersymbol(GameCharacter_healthset_enable)
unregistersymbol(GameCharacter_manaset_enable)
unregistersymbol(GameCharacter_experienceset_enable)
unregistersymbol(GameCharacter_tpset_enable)
unregistersymbol(GameCharacter_statsset_enable)

dealloc(GameCharacter_basepointer)
dealloc(GameCharacter_update_enable)
dealloc(GameCharacter_update_value)
dealloc(GameCharacter_set_enable)
dealloc(GameCharacter_healthset_enable)
dealloc(GameCharacter_manaset_enable)
dealloc(GameCharacter_experienceset_enable)
dealloc(GameCharacter_tpset_enable)
dealloc(GameCharacter_statsset_enable)"""

[[cheat]]
id = "gamecharacter-base-address-scan-to-activate-view-character-change-action-menu-to-update-view-character-change-action-menu"
name = "GameCharacter Base Address Scan (To Activate: View Character, Change Action Menu, To Update: View Character, Change Action Menu)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameCharacter_savedAOB)
label(GameCharacter_returnhere)
label(GameCharacter_originalcode)
label(GameCharacter_exit)

label(GameCharacter_update_exit)
label(GameCharacter_set_exit)
label(GameCharacter_healthset_exit)
label(GameCharacter_manaset_exit)
label(GameCharacter_experienceset_exit)
label(GameCharacter_tpset_exit)
label(GameCharacter_statsset_exit)

registersymbol(GameCharacter_savedAOB)

//1F25D932 - E8 6186E9E5           - call 050F5F98
//1F25D937 - 83 C4 10              - add esp,10
// GameParty:GetCharacterAtSlot+2a
//1F25D93A - 8B 40 3C              - mov eax,[eax+3C]
//1F25D93D - 3B C7                 - cmp eax,edi
//1F25D93F - 75 14                 - jne 1F25D955
//1F25D941 - 8B 46 08              - mov eax,[esi+08]
//1F25D944 - 83 EC 08              - sub esp,08
aobscan(GameCharacter_searchedAOB, 8B 40 3C 3B C7 75 14)

alloc(GameCharacter_newmem, 2048, GameCharacter_searchedAOB)
alloc(GameCharacter_temp1, 4, GameCharacter_searchedAOB)
alloc(GameCharacter_temp2, 4, GameCharacter_searchedAOB)
alloc(GameCharacter_temp3, 4, GameCharacter_searchedAOB)


GameCharacter_newmem:
mov [GameCharacter_temp1], ebx
mov [GameCharacter_temp2], ecx
mov [GameCharacter_temp3], edx

cmp dword ptr [GameCharacter_update_enable], #0
je GameCharacter_update_exit
mov edx, [GameCharacter_update_value]
cmp dword ptr [eax+3c], edx
jne GameCharacter_update_exit
mov [GameCharacter_basepointer], eax
GameCharacter_update_exit:

cmp dword ptr [GameCharacter_set_enable], #0
je GameCharacter_set_exit
GameCharacter_set_exit:

cmp dword ptr [eax+14], #0
je GameCharacter_statsset_exit
mov ebx, [eax+14]
cmp dword ptr [ebx+8], #0
je GameCharacter_statsset_exit
mov ebx, [ebx+8]
cmp dword ptr [ebx+10], #0
je GameCharacter_statsset_exit
mov ebx, [ebx+10]
cmp dword ptr [ebx+14], #0
je GameCharacter_statsset_exit
mov ebx, [ebx+14]

cmp dword ptr [GameCharacter_healthset_enable], #0
je GameCharacter_healthset_exit
cmp dword ptr [ebx+34], #0
je GameCharacter_healthset_exit
mov ecx, [ebx+34]
cmp dword ptr [ecx+c], #0
je GameCharacter_healthset_exit
mov ecx, [ecx+c]
mov [ecx+8], #9999
GameCharacter_healthset_exit:

cmp dword ptr [GameCharacter_manaset_enable], #0
je GameCharacter_manaset_exit
cmp dword ptr [ebx+38], #0
je GameCharacter_manaset_exit
mov ecx, [ebx+38]
cmp dword ptr [ecx+c], #0
je GameCharacter_manaset_exit
mov ecx, [ecx+c]
mov [ecx+8], #3
GameCharacter_manaset_exit:

cmp dword ptr [GameCharacter_experienceset_enable], #0
je GameCharacter_experienceset_exit
cmp dword ptr [ebx+30], #0
je GameCharacter_experienceset_exit
mov ecx, [ebx+30]
cmp dword ptr [ecx+8], #0
je GameCharacter_experienceset_exit
mov ecx, [ecx+8]
mov [ecx+8], #9999999
GameCharacter_experienceset_exit:

cmp dword ptr [GameCharacter_tpset_enable], #0
je GameCharacter_tpset_exit
cmp dword ptr [ebx+3c], #0
je GameCharacter_tpset_exit
mov ecx, [ebx+3c]
cmp dword ptr [ecx+8], #0
je GameCharacter_tpset_exit
mov ecx, [ecx+8]
mov [ecx+8], #9999999
GameCharacter_tpset_exit:

cmp dword ptr [GameCharacter_statsset_enable], #0
je GameCharacter_statsset_exit
cmp dword ptr [ebx+10], #0
je GameCharacter_statsset_exit
mov ecx, [ebx+10]
cmp dword ptr [ecx+8], #0
je GameCharacter_statsset_exit
mov ecx, [ecx+8]
mov [ecx+8], #9999999
cmp dword ptr [ebx+14], #0
je GameCharacter_statsset_exit
mov ecx, [ebx+14]
cmp dword ptr [ecx+8], #0
je GameCharacter_statsset_exit
mov ecx, [ecx+8]
mov [ecx+8], #9999999
cmp dword ptr [ebx+18], #0
je GameCharacter_statsset_exit
mov ecx, [ebx+18]
cmp dword ptr [ecx+8], #0
je GameCharacter_statsset_exit
mov ecx, [ecx+8]
mov [ecx+8], #9999999
cmp dword ptr [ebx+1c], #0
je GameCharacter_statsset_exit
mov ecx, [ebx+1c]
cmp dword ptr [ecx+8], #0
je GameCharacter_statsset_exit
mov ecx, [ecx+8]
mov [ecx+8], #9999999
cmp dword ptr [ebx+20], #0
je GameCharacter_statsset_exit
mov ecx, [ebx+20]
cmp dword ptr [ecx+8], #0
je GameCharacter_statsset_exit
mov ecx, [ecx+8]
mov [ecx+8], #9999999
cmp dword ptr [ebx+28], #0
je GameCharacter_statsset_exit
mov ecx, [ebx+28]
cmp dword ptr [ecx+8], #0
je GameCharacter_statsset_exit
mov ecx, [ecx+8]
mov [ecx+8], #9999999
cmp dword ptr [ebx+2c], #0
je GameCharacter_statsset_exit
mov ecx, [ebx+2c]
cmp dword ptr [ecx+8], #0
je GameCharacter_statsset_exit
mov ecx, [ecx+8]
mov [ecx+8], #9999999
GameCharacter_statsset_exit:

mov ebx, [GameCharacter_temp1]
mov ecx, [GameCharacter_temp2]
mov edx, [GameCharacter_temp3]


GameCharacter_originalcode:
db 8B 40 3C 3B C7
//mov eax,[eax+3C]
//cmp eax,edi


GameCharacter_exit:
jmp GameCharacter_returnhere


GameCharacter_searchedAOB:
GameCharacter_savedAOB:
jmp GameCharacter_newmem
GameCharacter_returnhere:


[DISABLE]
GameCharacter_savedAOB:
db 8B 40 3C 3B C7
//mov eax,[eax+3C]
//cmp eax,edi

unregistersymbol(GameCharacter_savedAOB)

dealloc(GameCharacter_newmem)
dealloc(GameCharacter_temp1)
dealloc(GameCharacter_temp2)
dealloc(GameCharacter_temp3)"""

