[[cheat]]
id = "nba2k17"
name = "NBA2K17"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

label(_pointerHookReturn)
label(_playerInfoHookReturn)
label(_earningHookReturn)
label(_DWHookExit)
label(_DWHookReturn)

registersymbol(pSettings)
registersymbol(pMatch)
registersymbol(pMatchTeamGrade)
registersymbol(pCreatePlayer)
registersymbol(pCreatePlayerAttributes)
registersymbol(pCreatePlayerBadges)
registersymbol(pMyPlayer)
registersymbol(pMyPlayerAttributes)
registersymbol(pMyPlayerBadges)
registersymbol(pMyPlayerMatch)
registersymbol(pMyCareer)
registersymbol(FillDWBar)
registersymbol(EarningMultiplier)
registersymbol(pCurrency)
registersymbol(pointerHookAOB)
registersymbol(playerInfoHookAOB)
registersymbol(earningHookAOB)
registersymbol(DWHookAOB)

alloc(pSettings, 8)
alloc(pMatch, 8)
alloc(pMatchTeamGrade, 8)
alloc(pCreatePlayer, 8)
alloc(pCreatePlayerAttributes, 8)
alloc(pCreatePlayerBadges, 8)
alloc(pMyPlayer, 8)
alloc(pMyPlayerAttributes, 8)
alloc(pMyPlayerBadges, 8)
alloc(pMyPlayerMatch, 8)
alloc(pMyCareer, 8)
alloc(FillDWBar, 4)
alloc(FillDWBarMem, 4)
alloc(EarningMultiplier, 4)
alloc(pCurrency, 8)

aobscanmodule(pointerHookAOB,NBA2K17.exe,8B 0E 45 8B 46 50)
aobscanmodule(playerInfoHookAOB,NBA2K17.exe,09 9F D8 00 00 00 48 8B) //41 31 87 D8 00 00 00 39 5C
aobscanmodule(earningHookAOB,NBA2K17.exe,89 98 78 A0 06 00)
aobscanmodule(DWHookAOB,NBA2K17.exe,F3 0F 5F D8 0F 28 EE F3 0F 5D EB)
alloc(pointerHookMem, 2048, pointerHookAOB)
alloc(playerInfoHookMem, 2048, playerInfoHookAOB)
alloc(earningHookMem, 2048, earningHookAOB)
alloc(DWHookMem, 2048, DWHookAOB)

pointerHookMem:
push rcx
push rdi
mov rcx,[NBA2K17.exe+09424570]
mov [pSettings],rcx
mov rcx,[NBA2K17.exe+04B833F8]
mov [pMatch],rcx
lea rdi,[NBA2K17.exe+94E7600]
mov [pMatchTeamGrade],rdi
mov rcx,[NBA2K17.exe+01B85658]
mov [pCreatePlayer],rcx
lea rdi,[rcx+3B1]
mov [pCreatePlayerAttributes],rdi
lea rdi,[rcx+445]
mov [pCreatePlayerBadges],rdi
mov rcx,[NBA2K17.exe+05EBA418]
lea rdi,[rcx+810]
mov [pMyPlayerMatch],rdi
lea rdi,[NBA2K17.exe+81EA97C]
mov [pMyCareer],rdi
//+558ec
mov rcx,[NBA2K17.exe+09494578]
mov [pCurrency],rcx
//+118
pop rdi
pop rcx
mov ecx,[rsi]
mov r8d,[r14+50]
jmp _pointerHookReturn

playerInfoHookMem:
push rcx
mov [pMyPlayer], rdi
lea rcx,[rdi+3B1]
mov [pMyPlayerAttributes], rcx
lea rcx,[rdi+445]
mov [pMyPlayerBadges], rcx
pop rcx
or [rdi+000000D8],ebx
jmp _playerInfoHookReturn

earningHookMem:
cmp [EarningMultiplier],1
jbe _earningHookExit
cmp [EarningMultiplier],64
ja _earningHookExit
push rax
push rdx
mov eax,ebx
mov dl,[EarningMultiplier]
mul dl
mov ebx,eax
pop rdx
pop rax
_earningHookExit:
mov [rax+0006A078],ebx
jmp _earningHookReturn

DWHookMem:
movaps xmm5,xmm6
minss xmm5,xmm3
cmp dword ptr [FillDWBar], 0
je _DWHookExit
mov [FillDWBarMem],(float)999
movss xmm5,[FillDWBarMem]
_DWHookExit:
jmp _DWHookReturn

FillDWBar:
dd 0

FillDWBarMem:
dd 0

EarningMultiplier:
dd 1

pointerHookAOB:
jmp pointerHookMem
nop
_pointerHookReturn:

playerInfoHookAOB:
jmp playerInfoHookMem
nop
_playerInfoHookReturn:

earningHookAOB:
jmp earningHookMem
nop
_earningHookReturn:

DWHookAOB+4:
jmp DWHookMem
nop
nop
_DWHookReturn:

[DISABLE]

pointerHookAOB:
db 8B 0E 45 8B 46 50

playerInfoHookAOB:
db 09 9F D8 00 00 00

earningHookAOB:
db 89 98 78 A0 06 00

DWHookAOB+4:
db 0F 28 EE F3 0F 5D EB

unregistersymbol(pSettings)
unregistersymbol(pMatch)
unregistersymbol(pMatchTeamGrade)
unregistersymbol(pCreatePlayer)
unregistersymbol(pCreatePlayerAttributes)
unregistersymbol(pCreatePlayerBadges)
unregistersymbol(pMyPlayer)
unregistersymbol(pMyPlayerAttributes)
unregistersymbol(pMyPlayerBadges)
unregistersymbol(pMyPlayerMatch)
unregistersymbol(pMyCareer)
unregistersymbol(pCurrency)
unregistersymbol(FillDWBar)
unregistersymbol(EarningMultiplier)
unregistersymbol(pointerHookAOB)
unregistersymbol(playerInfoHookAOB)
unregistersymbol(earningHookAOB)
unregistersymbol(DWHookAOB)

dealloc(pSettings)
dealloc(pMatch)
dealloc(pMatchTeamGrade)
dealloc(pCreatePlayer)
dealloc(pCreatePlayerAttributes)
dealloc(pCreatePlayerBadges)
dealloc(pMyPlayer)
dealloc(pMyPlayerAttributes)
dealloc(pMyPlayerBadges)
dealloc(pMyPlayerMatch)
dealloc(pMyCareer)
dealloc(FillDWBar)
dealloc(EarningMultiplier)
dealloc(FillDWBarMem)
dealloc(pCurrency)
dealloc(pointerHookMem)
dealloc(playerInfoHookMem)
dealloc(earningHookMem)
dealloc(DWHookMem)"""

