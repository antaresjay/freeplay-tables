id = "infinite-money"
name = "Infinite Money"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(moneycd,GameAssembly.dll,48 8B 4B 18 33 D2 E8 A6 E4)
alloc(newmem,$1000,moneycd)

label(code)
label(return)

newmem:
code:
  mov rcx,[rbx+18]
  test rcx, rcx
  je @F

  mov [rcx+18], E0000000
  mov [rcx+18+4], 416312CF

@@:
  xor edx,edx
  jmp return

moneycd:
  jmp newmem
  nop
return:
registersymbol(moneycd)

[DISABLE]

moneycd:
  db 48 8B 4B 18 33 D2

unregistersymbol(moneycd)
dealloc(newmem)"""
