[[cheat]]
id = "unlimited-food"
name = "Unlimited Food"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : DrillDeal.exe
  Version:
  Date   : 2022-04-15
  Author : resky

  This script does blah blah blah
}

//define(HumanResource+<DecreaseStatsOvertime>d__70:MoveNext+178}

[ENABLE]

aobscan(Food,90 00 00 00 48 8B C1 83 39 00 F3 0F 10 41 20) // should be unique
alloc(newmem,$1000,Food)

label(code)
label(return)

newmem:

code:
  mov [rcx+20],(float)100
  movss xmm0,[rcx+20]
  jmp return

Food+0A:
  jmp newmem
return:
registersymbol(Food)

[DISABLE]

Food+0A:
  db F3 0F 10 41 20

unregistersymbol(Food)
dealloc(newmem)"""

