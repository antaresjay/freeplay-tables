[game]
name = "Grotesque Tactics 2 - Dungeons and Donuts"
exe = "grotesquetactics.exe"
notes = "Converted from a Cheat Engine table by STN. Source: https://fearlessrevolution.com/viewtopic.php?t=4217"
verified = []
