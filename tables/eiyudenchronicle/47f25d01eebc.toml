[[cheat]]
id = "activate-trainer-2-2-controls-battle-options"
name = "Activate Trainer 2.2 (Controls Battle Options)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

/// We reset list here
aobscanmodule(PopulateBattleUnitListAOB1,"GameAssembly.dll",33 C0 8B D8 66 66 66 0F 1F 84 00 00 00 00 00 4C 8B 16)
registersymbol(PopulateBattleUnitListAOB1)
alloc(newmem,1024)

/// We gather list here
aobscanmodule(PopulateBattleUnitListAOB2,"GameAssembly.dll",49 8B 7D 20 4C 8B F0 48 85 FF 0F 84 11 03 00 00)
registersymbol(PopulateBattleUnitListAOB2)
alloc(newmem2,1024)

/// We reset list here (after battle)
//aobscanregion(PopulateBattleUnitListAOB3,Battle.Context.Terminate,Battle.Context.Terminate+100,40 53 48 83 EC * 33 D2 48 8B D9)
aobscanregion(PopulateBattleUnitListAOB3,Battle.Context.Terminate,Battle.Context.Terminate+100,48 89 5C 24 08 57 48 83 EC 20 33 D2 48 8B F9)
registersymbol(PopulateBattleUnitListAOB3)
alloc(newmem3,1024)

///
label(return)
label(PopulateBattleUnitListAOB1Save)
registersymbol(PopulateBattleUnitListAOB1Save)

///
label(return2)
label(PopulateBattleUnitListAOB2Save)
registersymbol(PopulateBattleUnitListAOB2Save)

///
label(return3)
label(PopulateBattleUnitListAOB3Save)
registersymbol(PopulateBattleUnitListAOB3Save)

///
newmem:
  // Here we reset past list as we are starting another one
  mov [R13Save],r13
  mov [R14Save],r14
  mov [R15Save],r15
  xor r14,r14
  mov r15,CurrentBattleUnitList
  xor r13,r13
StartResetLoop:
  cmp r13d,#24
  jge DoneResetLoop
  mov [r15+r13*8],r14
  inc r13
  jmp StartResetLoop
DoneResetLoop:
  mov r15,TotalBattleUnits
  mov [r15],r14
  mov r13,[R13Save]
  mov r14,[R14Save]
  mov r15,[R15Save]
  jmp originalcode
  
originalcode:
PopulateBattleUnitListAOB1Save:
  readmem(PopulateBattleUnitListAOB1,15)
  jmp PopulateBattleUnitListAOB1+0F

R13Save:
dq 0
R14Save:
dq 0
R15Save:
dq 0

///
newmem2:
  mov [R13Save2],r13
  mov [R14Save2],r14
  mov [R15Save2],r15
  mov r15,CurrentBattleUnitList
  mov r14,TotalBattleUnits
  mov r14,[r14]
  mov [r15+r14*8],rax
  mov r14,TotalBattleUnits
  inc [r14]
  mov r13,[R13Save2]
  mov r14,[R14Save2]
  mov r15,[R15Save2]
  jmp originalcode2

originalcode2:
PopulateBattleUnitListAOB2Save:
  readmem(PopulateBattleUnitListAOB2,4)
  jmp PopulateBattleUnitListAOB2+04
  
R13Save2:
dq 0
R14Save2:
dq 0
R15Save2:
dq 0

///
newmem3:
  // Here we reset past list as we are ending battle
  mov [R13Save3],r13
  mov [R14Save3],r14
  mov [R15Save3],r15
  xor r14,r14
  mov r15,CurrentBattleUnitList
  xor r13,r13
StartResetLoop3:
  cmp r13d,#24
  jge DoneResetLoop3
  mov [r15+r13*8],r14
  inc r13
  jmp StartResetLoop3
DoneResetLoop3:
  mov r15,TotalBattleUnits
  mov [r15],r14
  mov r13,[R13Save3]
  mov r14,[R14Save3]
  mov r15,[R15Save3]
  jmp originalcode3
  
originalcode3:
PopulateBattleUnitListAOB3Save:
  readmem(PopulateBattleUnitListAOB3,15)
  jmp PopulateBattleUnitListAOB3+0F

R13Save3:
dq 0
R14Save3:
dq 0
R15Save3:
dq 0
  
///  
PopulateBattleUnitListAOB1:
  jmp newmem
  return:

///  
PopulateBattleUnitListAOB2:
  jmp1 newmem2
  nop
  nop
  nop
  return2:

///  
PopulateBattleUnitListAOB3:
  jmp newmem3
  return3:
  
[DISABLE]

///  
PopulateBattleUnitListAOB1:
  readmem(PopulateBattleUnitListAOB1Save,15)
  
unregistersymbol(PopulateBattleUnitListAOB1)
unregistersymbol(PopulateBattleUnitListAOB1Save)

///  
PopulateBattleUnitListAOB2:
  readmem(PopulateBattleUnitListAOB2Save,4)
  
unregistersymbol(PopulateBattleUnitListAOB2)
unregistersymbol(PopulateBattleUnitListAOB2Save)

///  
PopulateBattleUnitListAOB3:
  readmem(PopulateBattleUnitListAOB3Save,15)
  
unregistersymbol(PopulateBattleUnitListAOB3)
unregistersymbol(PopulateBattleUnitListAOB3Save)

///
dealloc(newmem)
dealloc(newmem2)
dealloc(newmem3)"""

