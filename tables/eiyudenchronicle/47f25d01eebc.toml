label(MoneyGainLossMultiplierAOB1Save)
registersymbol(MoneyGainLossMultiplierAOB1Save)
label(fMoneyGainMult)
registersymbol(fMoneyGainMult)
label(fMoneyLossMult)
registersymbol(fMoneyLossMult)

