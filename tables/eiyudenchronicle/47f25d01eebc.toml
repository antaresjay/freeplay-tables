[[cheat]]
id = "enable-damage-modifier-options-god-mode-one-hit-kill-etc-requires-player-money-to-be-populated-to-work"
name = "Enable Damage Modifier Options (God Mode, One Hit Kill, etc.) (Requires Player Money To Be Populated To Work)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

///
aobscanregion(DamageModAOB1,Battle.UnitStatusPoint.ApplyDamage,Battle.UnitStatusPoint.ApplyDamage+100,41 8B E9 49 8B F0 48 8B DA 48 8B F9 75 13)
registersymbol(DamageModAOB1)
alloc(newmem,1024)

///
label(return)
label(DamageModAOB1Save)
registersymbol(DamageModAOB1Save)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

///
newmem:
  mov [bSetMinHP],0
  mov [DoLongJump],0
  jne SetDoLongJump
  jmp OurCodeStart
SetDoLongJump:
  mov [DoLongJump],1
OurCodeStart:
  mov [RCXSave],rcx
  mov [RDXSave],rdx
  mov [R8Save],r8
  mov [R9Save],r9
  mov [R10Save],r10
  mov [R11Save],r11
  mov [R12Save],r12
SetupLoop:
  // Setup Loop Variables
  xor r8,r8
  /// Count
  mov r9,6
StartSearchLoop:
  cmp r8d,r9d
  jge AllyNotFound
  mov r10,CurrentBattleUnitList
  mov r10,[r10+r8*8]
  test r10,r10
  je AllyNotFound
  cmp rsi,[r10+58]
  je FoundAlly
  inc r8d
  jmp StartSearchLoop
FoundAlly:
  mov [bAlly],1
  jmp DoDamageMod
AllyNotFound:
  mov [bAlly],0
  jmp DoDamageMod
DoDamageMod:
  xor r11,r11
  mov r11d,[rdx+04]
  cmp dword ptr [bAlly],1
  je HeroHit
  jmp EnemyHit
HeroHit:
  jmp HeroDamageHit
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  push r11d
  fild dword ptr [esp]
  fmul dword ptr [fHeroDamageMult]
  fistp dword ptr [esp]
  pop r11d
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor r11d,r11d
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne MyCleanUp1
  /// Set Min HP?
  mov [bSetMinHP],1
  jmp MyCleanUp1
EnemyHit:
  jmp EnemyDamageHit
EnemyDamageHit:
  cmp [OneHitKill],1
  jne SkipOneHitKill
  mov r11d,#99999
  jmp MyCleanUp1
SkipOneHitKill:
  cmp [fEnemyDamageMult],(float)0.0
  je MyCleanUp1
  push r11d
  fild dword ptr [esp]
  fmul dword ptr [fEnemyDamageMult]
  fistp dword ptr [esp]
  pop r11d
  jmp MyCleanUp1

MyCleanUp1:
  mov [rdx+04],r11d
SkipSettingMinHP:
SkipEntireCode:
  mov r8,[R8Save]
  mov r9,[R9Save]
  mov r10,[R10Save]
  mov r11,[R11Save]
  mov r12,[R12Save]
  cmp [bSetMinHP],1
  jne originalcode
  cmp r9d,0
  jne originalcode
  mov r9d,1
  jmp originalcode
  
originalcode:
  readmem(DamageModAOB1,12)
  cmp dword ptr [DoLongJump],1
  je ReallyDoLongJump
  jmp DamageModAOB1+0E
ReallyDoLongJump:
  jmp DamageModAOB1+21

RCXSave:
dq 0
RDXSave:
dq 0    
R8Save:
dq 0
R9Save:
dq 0
R10Save:
dq 0
R11Save:
dq 0
R12Save:
dq 0
bAlly:
dq 0
DoLongJump:
dq 0
bSetMinHP:
dq 0
GodMode:
dq 0
fHeroDamageMult:
dq (float)0.25
HeroCannotDie:
dq 1
fEnemyDamageMult:
dq (float)2.0
OneHitKill:
dq 0
DamageModAOB1Save:
  readmem(DamageModAOB1,14)
  
///
DamageModAOB1:
  jmp newmem
  return:
   
[DISABLE]

///
DamageModAOB1:
  readmem(DamageModAOB1Save,14)
  
unregistersymbol(GodMode)
unregistersymbol(fHeroDamageMult)
unregistersymbol(HeroCannotDie)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(OneHitKill)
unregistersymbol(DamageModAOB1)
unregistersymbol(DamageModAOB1Save)

dealloc(newmem)"""

