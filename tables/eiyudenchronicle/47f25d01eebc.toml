  readmem(MoneyGainLossMultiplierAOB1,10)
  mov [R14Save],r14
  mov [R15Save],r15
  xor r15,r15
  mov r15d,edi
  sub r15d,[rsi+7C]
  // If positive, then it is gain else loss
  cmp r15d,0
  jge DoGainMultiplier
  jmp DoLossMultiplier
