[[cheat]]
id = "allies-invincible-in-war-battles"
name = "Allies Invincible In War Battles"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

///
aobscanregion(WarBattleInvincibleAOB1,War.WarUnit.Damage,War.WarUnit.Damage+50,40 56 48 83 EC * 80 B9 94 00 00 00 00 48 8B F2)
registersymbol(WarBattleInvincibleAOB1)
alloc(newmem,1024)

///
label(return)
label(WarBattleInvincibleAOB1Save)
registersymbol(WarBattleInvincibleAOB1Save)

newmem:
  mov [R15Save],r15
  /// Get Owner
  mov r15,[rcx+28]
  test r15,r15
  je MyCleanUp1
  // Check Team 1
  cmp dword ptr [r15+134],1
  jne MyCleanUp1
  /// Set Invincible War Unit
  mov byte ptr [rcx+00000094],1
  jmp MyCleanUp1
  
MyCleanUp1:
  mov r15,[R15Save]
  jmp originalcode
  
originalcode:
WarBattleInvincibleAOB1Save:
  readmem(WarBattleInvincibleAOB1,16)
  jmp WarBattleInvincibleAOB1+10
  
R15Save:
dq 0
    
///
WarBattleInvincibleAOB1:
  jmp newmem
  return:

[DISABLE]

///
WarBattleInvincibleAOB1:
  readmem(WarBattleInvincibleAOB1Save,16)
  
unregistersymbol(WarBattleInvincibleAOB1)
unregistersymbol(WarBattleInvincibleAOB1Save)

///
dealloc(newmem)"""

