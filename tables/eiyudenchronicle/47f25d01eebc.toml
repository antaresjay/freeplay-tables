source = """
[ENABLE]

///
//aobscanregion(MoneyGainLossMultiplierAOB1,UserDataContainer.set_Money,UserDataContainer.set_Money+100,3B F8 0F 4D F8 8B DF 2B 5E 74 89 7E 74 85 DB)
