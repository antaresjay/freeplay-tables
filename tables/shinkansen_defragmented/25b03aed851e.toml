[[cheat]]
id = "gamehandler-base-address-scan-initialization-activate-this-first"
name = "GameHandler Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameHandler_basepointer)
registersymbol(GameHandler_update_enable)
registersymbol(GameHandler_set_enable)
registersymbol(GameHandler_hpset_enable)
registersymbol(GameHandler_apset_enable)
registersymbol(GameHandler_ammoset_enable)
registersymbol(GameHandler_currenciesset_enable)
registersymbol(GameHandler_droprateset_enable)

alloc(GameHandler_basepointer, 4)
alloc(GameHandler_update_enable, 4)
alloc(GameHandler_set_enable, 4)
alloc(GameHandler_hpset_enable, 4)
alloc(GameHandler_apset_enable, 4)
alloc(GameHandler_ammoset_enable, 4)
alloc(GameHandler_currenciesset_enable, 4)
alloc(GameHandler_droprateset_enable, 4)


[DISABLE]
unregistersymbol(GameHandler_basepointer)
unregistersymbol(GameHandler_update_enable)
unregistersymbol(GameHandler_set_enable)
unregistersymbol(GameHandler_hpset_enable)
unregistersymbol(GameHandler_apset_enable)
unregistersymbol(GameHandler_ammoset_enable)
unregistersymbol(GameHandler_currenciesset_enable)
unregistersymbol(GameHandler_droprateset_enable)

dealloc(GameHandler_basepointer)
dealloc(GameHandler_update_enable)
dealloc(GameHandler_set_enable)
dealloc(GameHandler_hpset_enable)
dealloc(GameHandler_apset_enable)
dealloc(GameHandler_ammoset_enable)
dealloc(GameHandler_currenciesset_enable)
dealloc(GameHandler_droprateset_enable)"""

[[cheat]]
id = "gamehandler-base-address-scan-to-activate-play-level-to-update-play-level"
name = "GameHandler Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameHandler_savedAOB)
label(GameHandler_returnhere)
label(GameHandler_originalcode)
label(GameHandler_exit)

label(GameHandler_update_exit)
label(GameHandler_set_exit)
label(GameHandler_hpset_exit)
label(GameHandler_apset_exit)
label(GameHandler_ammoset_exit)
label(GameHandler_currenciesset_exit)
label(GameHandler_droprateset_exit)

registersymbol(GameHandler_savedAOB)

//1227B7EC - 83 EC 04              - sub esp,04
//1227B7EF - 8B 7D 08              - mov edi,[ebp+08]
// GameHandler:Update+a
//1227B7F2 - 8B 87 BC000000        - mov eax,[edi+000000BC]
//1227B7F8 - 85 C0                 - test eax,eax
//1227B7FA - 75 16                 - jne 1227B812
//1227B7FC - 83 EC 0C              - sub esp,0C
//1227B7FF - 57                    - push edi
aobscan(GameHandler_searchedAOB, 8B 87 BC 00 00 00 85 C0 * * 83 EC 0C)

alloc(GameHandler_newmem, 2048, GameHandler_searchedAOB)
alloc(GameHandler_temp1, 4, GameHandler_searchedAOB)
alloc(GameHandler_temp2, 4, GameHandler_searchedAOB)


GameHandler_newmem:
mov [GameHandler_temp1], ebx
mov [GameHandler_temp2], ecx

cmp dword ptr [GameHandler_update_enable], #0
je GameHandler_update_exit
mov [GameHandler_basepointer], edi
GameHandler_update_exit:

cmp dword ptr [GameHandler_set_enable], #0
je GameHandler_set_exit
GameHandler_set_exit:

cmp dword ptr [GameHandler_hpset_enable], #0
je GameHandler_hpset_exit
cmp dword ptr [edi+38], #0
je GameHandler_hpset_exit
mov ebx, [edi+38]
cmp dword ptr [ebx+3c], #0
je GameHandler_hpset_exit
mov ebx, [ebx+3c]
mov ecx, [ebx+78]
mov [ebx+74], ecx
GameHandler_hpset_exit:

cmp dword ptr [GameHandler_apset_enable], #0
je GameHandler_apset_exit
cmp dword ptr [edi+38], #0
je GameHandler_apset_exit
mov ebx, [edi+38]
cmp dword ptr [ebx+3c], #0
je GameHandler_apset_exit
mov ebx, [ebx+3c]
fld [ebx+80]
fstp [ebx+7c]
GameHandler_apset_exit:

cmp dword ptr [GameHandler_ammoset_enable], #0
je GameHandler_ammoset_exit
// Clipsize
cmp dword ptr [edi+38], #0
je GameHandler_ammoset_exit
mov ebx, [edi+38]
cmp dword ptr [ebx+3c], #0
je GameHandler_ammoset_exit
mov ebx, [ebx+3c]
cmp dword ptr [ebx+44], #0
je GameHandler_ammoset_exit
mov ebx, [ebx+44]
mov ecx, [ebx+68]
mov [ebx+64], ecx
// Ammo
cmp dword ptr [edi+3c], #0
je GameHandler_ammoset_exit
mov ebx, [edi+3c]
mov ecx, [ebx+48]
mov [ebx+44], ecx
mov ecx, [ebx+50]
mov [ebx+4c], ecx
mov ecx, [ebx+58]
mov [ebx+54], ecx
mov ecx, [ebx+60]
mov [ebx+5c], ecx
GameHandler_ammoset_exit:

cmp dword ptr [GameHandler_currenciesset_enable], #0
je GameHandler_currenciesset_exit
cmp dword ptr [edi+3c], #0
je GameHandler_currenciesset_exit
mov ebx, [edi+3c]
mov [ebx+3c], #9999999
mov [ebx+40], #999
GameHandler_currenciesset_exit:

cmp dword ptr [GameHandler_droprateset_enable], #0
je GameHandler_droprateset_exit
mov [edi+ac], (float)1
mov [edi+b0], (float)1
mov [edi+b4], (float)1
GameHandler_droprateset_exit:


mov ebx, [GameHandler_temp1]
mov ecx, [GameHandler_temp2]


GameHandler_originalcode:
db 8B 87 BC 00 00 00
//mov eax,[edi+000000BC]


GameHandler_exit:
jmp GameHandler_returnhere


GameHandler_searchedAOB:
GameHandler_savedAOB:
jmp GameHandler_newmem
nop
GameHandler_returnhere:


[DISABLE]
GameHandler_savedAOB:
db 8B 87 BC 00 00 00
//mov eax,[edi+000000BC]

unregistersymbol(GameHandler_savedAOB)

dealloc(GameHandler_newmem)
dealloc(GameHandler_temp1)
dealloc(GameHandler_temp2)"""

