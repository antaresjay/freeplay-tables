source = """
//Send@ModEngine
[ENABLE]

aobscanmodule(ammo,GameAssembly.dll,C8 F3 0F 11 49 14)
alloc(newmem,$1000,ammo)

label(code)
label(return)

newmem:

code:
  movss xmm1,[rcx+14]
  movss [rcx+14],xmm1
  jmp return

ammo+01:
