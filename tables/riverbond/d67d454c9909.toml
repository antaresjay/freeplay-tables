type = "script"
source = """
{ Game   : Riverbond.exe
  Version: 
  Date   : 2019-06-17
  Author : Anjinggila

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(AMMO,GameAssembly.dll,C8 F3 0F 11 49 14) // should be unique
alloc(newmem,$1000,"GameAssembly.dll"+529F3C)

label(code)
label(return)
label(myammo)
registersymbol(myammo)

newmem:

code:
  mov [myammo],rcx
  movss [rcx+14],xmm1
  jmp return

myammo:
db 0

AMMO+01:
  jmp newmem
return:
registersymbol(AMMO)

[DISABLE]

AMMO+01:
  db F3 0F 11 49 14

unregistersymbol(AMMO)
dealloc(newmem)"""

