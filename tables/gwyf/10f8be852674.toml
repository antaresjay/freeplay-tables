name = "Click before you start a Round"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(fsc,GameAssembly.dll,FF C3 8B D3 48 8B 46 28 48 8B C8 48 85 C0 0F) // should be unique
alloc(newmem,$1000,"GameAssembly.dll"+478AE8)
alloc(sc,8)
registersymbol(sc)
label(code)
label(return)

newmem:

code:
mov [sc],rsi
  inc ebx
  mov edx,ebx
  mov rax,[rsi+28]
  jmp return

fsc:
  jmp newmem
  nop 3
return:
registersymbol(fsc)

[DISABLE]

fsc:
  db FF C3 8B D3 48 8B 46 28

unregistersymbol(fsc)
unregistersymbol(sc)
dealloc(sc)
dealloc(newmem)"""
