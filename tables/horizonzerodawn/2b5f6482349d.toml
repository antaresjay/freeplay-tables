[[cheat]]
id = "items"
name = "items"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : HorizonZeroDawn.exe
  Version: Complete Edition
  Date   : 2021-04-03
  Author : Oyyzj

  # Infinite Item between amount of 2 till 5
  # deactivate this script when selling something
  # Double shot and tripple shot will trigger rapid fire
}

[ENABLE]

aobscanmodule(subArrow,HorizonZeroDawn.exe,41 2B C4 89 41 58) // should be unique
alloc(newmem,$1000,subArrow)

label(code)
label(return)

newmem:
  cmp [rcx+58],02
  jl code
  cmp [rcx+58],05
  jg code
  add eax,r12d
  mov [rcx+58],eax
  jmp return

code:
  sub eax,r12d
  mov [rcx+58],eax
  jmp return

subArrow:
  jmp newmem
  nop
return:
registersymbol(subArrow)
[DISABLE]

subArrow:
  db 41 2B C4 89 41 58

unregistersymbol(*)
dealloc(*)"""

