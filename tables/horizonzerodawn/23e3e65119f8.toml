HorizonZeroDawn.exe+11ABCFF: CC                       - int 3
HorizonZeroDawn.exe+11ABD00: F3 0F 5E 0D 74 B7 C4 00  - divss xmm1,[HorizonZeroDawn.exe+1DF747C]
