source = """
{
Makes the camera pull back very far. The game is surprisingly playable even
when Aloy is just a few pixels in the middle of the screen. I found this by
accident and liked the effect.

You can assign a hotkey to toggle this by right-clicking on the cheat and
choosing "Set/Change hotkeys."
}

[ENABLE]
aobscanmodule(BirdsEyePatch,HorizonZeroDawn.exe,E8 ** ** ** ** F3 0F 10 4F DC 48 8B CE F3 41 0F 59 C9 0F 28 F0 E8)

