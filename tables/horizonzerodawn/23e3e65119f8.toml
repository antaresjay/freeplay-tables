[[cheat]]
id = "quick-night"
name = "Quick night"
category = "game"
description = ""
hint = ""
type = "script"
source = """
{
Makes the time of day advance faster between the dusk and dawn hours.
The defaults of dusk=21:00, dawn=5:00, factor=8 makes the night last one
in-game hour instead of eight.

Also lets you set the time of day directly.

Issues: Setting the time of day doesn't work in cutscenes that force a
particular time. (Workaround: use Cheat Engine to find the instructions
that write to the time, and nop them out.)
}

[ENABLE]
aobscanmodule(QuickNightHook,HorizonZeroDawn.exe,F3 0F 58 89 98 00 00 00 0F 2F C8)
alloc(newmem,$100,QuickNightHook)

label(QuickNightDawn)
label(QuickNightDusk)
label(QuickNightSpeed)
label(WorldStatePtr)

newmem:
  mov [WorldStatePtr],rcx
  movss xmm2,[rcx+00000098]
  comiss xmm2,[QuickNightDawn]
  jb night
  comiss xmm2,[QuickNightDusk]
  jb day
night:
  mulss xmm1,[QuickNightSpeed]
day:
  addss xmm1,xmm2
  jmp return
  align 8
WorldStatePtr:
  dq 0
QuickNightDawn:
  dd (float)5
QuickNightDusk:
  dd (float)21
QuickNightSpeed:
  dd (float)8

QuickNightHook:
  jmp newmem
  nop 3
return:

registersymbol(QuickNightHook)
registersymbol(QuickNightDawn)
registersymbol(QuickNightDusk)
registersymbol(QuickNightSpeed)
registersymbol(WorldStatePtr)

[DISABLE]
QuickNightHook:
  db F3 0F 58 89 98 00 00 00

unregistersymbol(QuickNightHook)
unregistersymbol(QuickNightDawn)
unregistersymbol(QuickNightDusk)
unregistersymbol(QuickNightSpeed)
unregistersymbol(WorldStatePtr)
dealloc(newmem)

{
