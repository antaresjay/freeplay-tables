[[cheat]]
id = "faster-focus-panning-gamepad-only"
name = "Faster focus panning (gamepad only)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{
This makes right-stick camera rotation in focus mode faster. The default
factor of 2 makes it the same speed as non-focus rotation.
}

[ENABLE]
aobscanmodule(FocusPanHook,HorizonZeroDawn.exe,F3 41 0F 59 4C CB 04)
alloc(focuspanpatch,$100,FocusPanHook)

focuspanpatch:
  // Hack alert. This code is used for many purposes. I assume the multiplier
  // is for focus mode rotation when it's 70.0, since it's an uncommon value.
  mulss xmm1,[r11+rcx*8+4]
  cmp [r11+rcx*8+4],428c0000  // 70.0
  jne focuspanpatch_return
  mulss xmm1,[FocusPanFactor]
  jmp focuspanpatch_return
  align 4
FocusPanFactor:
  dd (float)2.0

FocusPanHook:
  jmp focuspanpatch
  nop 2
focuspanpatch_return:

registersymbol(FocusPanHook)
registersymbol(FocusPanFactor)

[DISABLE]
FocusPanHook:
  db F3 41 0F 59 4C CB 04
unregistersymbol(FocusPanHook)
unregistersymbol(FocusPanFactor)
dealloc(focuspanpatch)

