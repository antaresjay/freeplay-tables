[[cheat]]
id = "player-structure"
name = "Player Structure"
category = "player"
description = ""
hint = ""
type = "script"
source = """
//|******** Author: Abystus *********|
//|********** Game: The Punisher ****|
//|********* Build: 1.0 *************|

[ENABLE]
globalalloc(playerBase, 4)
alloc(newmem,$1000)
aobscanmodule(PlayerBaseHook, pun.exe, D9 87 88 02 00 00 D8 B7 A0 04 00 00 D8 ?? ?? ?? ?? ?? DF E0 F6 C4 05 7A 0A) // should be unique
registersymbol(PlayerBaseHook)

label(return)

newmem:
  mov [playerBase], edi
  fld dword ptr [edi+00000288]
  jmp return

PlayerBaseHook:
  jmp newmem
  nop
return:

[DISABLE]
PlayerBaseHook:
  db D9 87 88 02 00 00

unregistersymbol(PlayerBaseHook)
dealloc(newmem)"""

