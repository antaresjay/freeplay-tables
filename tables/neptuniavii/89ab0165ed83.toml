[[cheat]]
id = "items-stats-base-address-scan-to-update-select-items"
name = "Items Stats Base Address Scan (To Update: Select Items)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(itemsstats_savedAOB)
label(itemsstats_returnhere)
label(itemsstats_originalcode)

label(itemsstats_savedAOB2)
label(itemsstats_returnhere2)
label(itemsstats_originalcode2)

label(itemsstats_update_exit)
label(itemsstats_add_exit)
label(itemsstats_set_exit)

registersymbol(itemsstats_savedAOB)
registersymbol(itemsstats_savedAOB2)

aobscanmodule(itemsstats_searchedAOB,NeptuniaVII.exe,33 C0 5E 5D C3 8B 40 04 5E) // should be unique

alloc(itemsstats_newmem,2048)

itemsstats_newmem:
  mov [itemsstats_basepointer],eax
  cmp dword ptr [itemsstats_update_enable],#0
  je itemsstats_update_exit
  push ebx
  mov ebx,[itemsstats_offset_value]
  lea ebx,[eax+ebx*8]
  mov [itemsstats_offset_basepointer],ebx
  pop ebx
itemsstats_update_exit:

  cmp dword ptr [itemsstats_add_enable],#0
  je itemsstats_add_exit
  push esi
  push edi
  //Adjust Number of Items
  mov edi,[eax-4]
  add [eax-4],1
  //Add Item ID and Quantity
  lea edi,[eax+edi*8]
  mov esi,[itemsstats_add_enable]
  mov [itemsstats_add_enable],#0
  mov word ptr [edi],si
  mov word ptr [edi+4],#99
  pop edi
  pop esi
itemsstats_add_exit:

itemsstats_originalcode:
  lea ecx,[eax+ecx*8]
  cmp eax,ecx
