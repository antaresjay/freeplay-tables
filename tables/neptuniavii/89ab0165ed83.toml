[[cheat]]
id = "set-combo-slots-for-weapon-to-max-to-update-enter-combo-menu"
name = "Set Combo Slots For Weapon to Max (To Update: Enter Combo Menu)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(weaponcomboslot_savedAOB,NeptuniaVII.exe,0F B6 42 1B 33 C9) // should be unique
registersymbol(weaponcomboslot_savedAOB)
alloc(weaponcomboslot_newmem,1024)

label(weaponcomboslot_return)

weaponcomboslot_newmem:
  mov byte ptr [edx+1B],#4
  mov byte ptr [edx+1C],#4
  mov byte ptr [edx+1D],#4
  movzx eax,byte ptr [edx+1B]
  xor ecx,ecx
  jmp weaponcomboslot_return

weaponcomboslot_savedAOB:
  jmp weaponcomboslot_newmem
  nop
weaponcomboslot_return:

[DISABLE]

weaponcomboslot_savedAOB:
  db 0F B6 42 1B 33 C9

unregistersymbol(weaponcomboslot_searchedAOB)
dealloc(weaponcomboslot_newmem)"""

