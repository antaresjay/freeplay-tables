[[cheat]]
id = "infinite-sp"
name = "Infinite Sp"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(spcd,KUF2Main.exe,F3 0F 10 46 68 0F 2F)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  movss xmm0, [esi+68]
  movss [esi+60], xmm0
  movss xmm0, [esi+68]
  jmp return

spcd:
  jmp newmem
return:
registersymbol(spcd)

[DISABLE]

spcd:
  db F3 0F 10 46 68

unregistersymbol(spcd)
dealloc(newmem)"""
