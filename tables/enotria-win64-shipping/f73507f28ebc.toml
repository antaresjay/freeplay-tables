[[cheat]]
id = "inf-health-stamina-attack-sb-to-fill-pointer"
name = "Inf. Health / Stamina (Attack sb to fill pointer)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Enotria-Win64-Shipping.exe
  Version:
  Date   : 2024-09-19
  Author : SanitKa

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(INJHP,Enotria-Win64-Shipping.exe,CC F3 0F 11 49 08 C3)
alloc(newmem,$100,INJHP)

label(code)
label(return)
label(CurHpPtr)
label(CurStPtr)
label(isEnemyHPCheatEnabled)

newmem:
  // trick ~ player dta
  // - ptr
  // - 500.00 (float)
  // - maxHP (float)
  // - ptr ~ rcx points here
  // - curHP (float)
  // - curHP (float)
  // - ptr
  movss xmm15,[rcx+08-10]
  ucomiss xmm15,dword ptr[DefaultMaxHP] // ? [-08] ~ 500.0
  jne @f
  jc @f

  movss xmm1,[rcx+08-c]                 // [-04] ~ currentMaxHP
  movss [rcx+0c],xmm1                   // try update also second value
  mov [CurHpPtr],rcx
  jmp code

statChk:
//  movss xmm15,[rcx+08-10]
  ucomiss xmm15,dword ptr[DefaultMaxStam] // ? [-08] ~ 90.0
  jne @f
  jc @f

  mov [CurStPtr],rcx
  movss xmm1,[rcx+08-c]                 // [-04] ~ currentMaxStamina
  movss [rcx+0c],xmm1                   // try update also second value
  jmp code

enemyChk:
  push rdx

  xor edx,edx
  cmp edx,dword ptr[rcx-18]             // should be zero
  jne @f

  mov edx,dword ptr[rcx-08]
  test edx,edx
  je @f

//  cmp edx,dword ptr[rcx-04]             // currentMaxHP vs originalMaxHP does not work in 1.003+
//  jne @f

  mov edx,dword ptr[rcx+48]
  test edx,edx                          // pathPoints (monster ~ 0)
  jne @f

  movss xmm15,dword ptr[MinEnemyHP]
  ucomiss xmm1,xmm15
  jle @f
  jc @f

  mov dl,1
  cmp dl,[isEnemyHPCheatEnabled]
  jne @f

  movss xmm1,xmm15                      // minEnemyHP
  movss [rcx+0c],xmm1                   // try update also second value
//  movss [rcx-04],xmm1                   // try update also max value
//  movss [rcx-08],xmm1                   // try update also max value

rest:
  pop rdx

code:
  movss [rcx+08],xmm1
  jmp return

  nop                                   // manual alignment ;)

align 2
CurHpPtr:
  dq 0

CurStPtr:
  dq 0

DefaultMaxHP:
  dd (float)500.0

DefaultMaxStam:
  dd (float)90.0

MinEnemyHP:
  dd (float)0.1

isEnemyHPCheatEnabled:
  db 1

INJHP+01:
  jmp newmem

return:
registersymbol(INJHP)
registersymbol(CurHpPtr)
registersymbol(CurStPtr)
registersymbol(isEnemyHPCheatEnabled)

[DISABLE]

INJHP+01:
  db F3 0F 11 49 08

unregistersymbol(*)
dealloc(*)"""

