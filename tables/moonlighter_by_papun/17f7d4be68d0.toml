type = "script"
source = """
// Created by Papun

[Enable]
aobscan(Health,46 10 48 8B 11 48 89 10 48 8B 51 08)
alloc(newmem,$1000,Health)

label(return)
label(skip_write)
label(normal_write)

newmem:
  mov rbx,[rax]
  cmp rdx,rbx
  jge normal_write
  mov [rax],rbx
  jmp skip_write

normal_write:
  mov [rax],rdx

skip_write:
  mov rdx,[rcx+08]
  jmp return

Health+05:
  jmp newmem
  nop 2
return:
registersymbol(Health)

[DISABLE]
Health+05:
  db 48 89 10 48 8B 51 08

unregistersymbol(Health)
dealloc(newmem)"""
