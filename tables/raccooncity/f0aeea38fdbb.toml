[[cheat]]
id = "anti-gfwl-protection-insert"
name = "Anti-GFWL protection. (Insert)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//A script to disable Xlive's memory check protection
//Made by Geri with Cheat Engine 6.0
//18th May, 2011
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanmodule(aobxlive, xlive.dll, 74 14 FF 75 14 8B CE FF 75 10 53 E8)
registersymbol(aobxlive)

aobxlive:
db EB 14

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
unregistersymbol(aobxlive)
dealloc(aobxlive)

aobxlive:
db 74 14"""

