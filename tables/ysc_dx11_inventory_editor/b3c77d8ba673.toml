[[cheat]]
id = "item-list-script"
name = "Item List Script"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
//=========================================
[ENABLE]
//=========================================

aobscanmodule(CHP1,$process,8B 57 04 8B 44 24 14 66 83 BC 50 40 10 00 00 00)

alloc(MyCode,1024,$process)

label(_BackCHP1)
registersymbol(_BackCHP1)
registersymbol(CHP1)

label(BaseAddress)
label(iEnableEvery)

registersymbol(MyCode)
registersymbol(BaseAddress)
registersymbol(iEnableEvery)


//=========================================
// Actual script
//=========================================
MyCode:
 mov edx,[edi+04]
 mov eax,[esp+14]

 push ecx
 lea ecx,[eax+1040]
 mov [BaseAddress],ecx
 pop ecx

 cmp dword ptr [iEnableEvery],0
 je _BackCHP1
 mov word ptr [eax+edx*2+00001040],01

 jmp _BackCHP1

//=========================================
// Variables
//=========================================

BaseAddress:
 dd 0
iEnableEvery:
 dd 0

//=========================================
// Hacking Points
//=========================================

CHP1:
 jmp MyCode
 nop
 nop
_BackCHP1:

//=========================================
[DISABLE]
//=========================================

CHP1:
//mov edx,[edi+04]
//mov eax,[esp+14]
//cmp word ptr [eax+edx*2+00001040],00 { 0 }
 db 8B 57 04 8B 44 24 14 66 83 BC 50 40 10 00 00 00

unregistersymbol(CHP1)
unregistersymbol(_BackCHP1)

unregistersymbol(MyCode)
unregistersymbol(BaseAddress)
unregistersymbol(iEnableEvery)

dealloc(MyCode)

//========================================="""

[[cheat]]
id = "every-item-unlocked-script-100-completion"
name = "Every Item Unlocked Script (100% Completion)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
//=========================================
[ENABLE]
//=========================================

aobscanmodule(HUN1,$process,0F BE 84 08 BE 23 01 00  85 D0 74 16)

label(_BackHUN1)
registersymbol(_BackHUN1)
registersymbol(HUN1)

//=========================================
// Actual script
//=========================================
MyCode+100:
 push eax
 push ecx
 push edi

 mov edi,[esp+1c]
 mov ecx,eax
 movsx eax,byte ptr [ecx+edi+000123BE]
 or eax,edx
 mov [ecx+edi+000123BE],al

 pop edi
 pop ecx
 pop eax

 mov ecx,[esp+14]
 movsx eax,byte ptr [eax+ecx+000123BE]

 jmp _BackHUN1

//=========================================
// Variables
//=========================================


//=========================================
// Hacking Points
//=========================================

HUN1-4:
 jmp MyCode+100
 nop
 nop
 nop
 nop
 nop
 nop
 nop
_BackHUN1:

//=========================================
[DISABLE]
//=========================================

HUN1-4:
 db 8B 4C 24 14 0F BE 84 08 BE 23 01 00 85 D0

unregistersymbol(HUN1)
unregistersymbol(_BackHUN1)

//========================================="""

