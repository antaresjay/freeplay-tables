[[cheat]]
id = "find-data-of-tom-our-main-char"
name = 'Find Data of "Tom" (our main-char)'
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
    This script simply scans for the Name "Tom", embraced by some zero-bytes.
}
[ENABLE]
aobscan(player, 82 0A 00 00 54 6F 6D 00 00 00)
label(_player)
registersymbol(_player)

player+2:
_player:

 
[DISABLE]
unregistersymbol(_player)"""

