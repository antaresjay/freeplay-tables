[[cheat]]
id = "get-data"
name = "Get Data"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : demoncrawl.exe
  Date   : 2021-09-29
  Author : Birdi
}

[ENABLE]

aobscanmodule(GetXP,demoncrawl.exe,F2 0F 11 00 66 0F 57 C0 C7 46 4C 33)
//find value by searching for Double of current xp
//accessed on load main menu
alloc(newmem,$1000)

registersymbol(p_xp)
label(code)
label(return)

newmem:
  mov [p_xp],eax
code:
  movsd [eax],xmm0
  xorpd xmm0,xmm0
  jmp return

p_xp:
  dq 0

GetXP:
  jmp newmem
  nop 3
return:
registersymbol(GetXP)

[DISABLE]

GetXP:
  db F2 0F 11 00 66 0F 57 C0

unregistersymbol(p_xp)
unregistersymbol(GetXP)
dealloc(newmem)"""

