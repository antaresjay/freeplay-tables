[[cheat]]
id = "enable-me-first"
name = "Enable me first"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]



aobscanmodule(health,ninthdawnii.exe,8B 56 24 8B 12)
alloc(newmem,$1000)

label(code)
label(return)

registersymbol(PlayerPtr_Ptr)
label(PlayerPtr_Ptr)
newmem:

code:
mov edx,[esi+24]
mov [PlayerPtr_Ptr],edx
cmp [PlayerPtr_Ptr+8],0
je @f
mov [edx],#999999
mov [edx+4],#999999
@@:
mov edx,[edx]
jmp return
PlayerPtr_Ptr:
dd 0
health:
jmp newmem
return:
registersymbol(health)

[DISABLE]
health:
db 8B 56 24 8B 12
unregistersymbol(PlayerPtr_Ptr)
unregistersymbol(health)
dealloc(newmem)"""

