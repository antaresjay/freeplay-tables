[[cheat]]
id = "allocation-stats-base-address-scan-to-update-allocate-magic"
name = "Allocation Stats Base Address Scan (To Update: Allocate Magic)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(allocationstats_savedAOB)
label(allocationstats_returnhere)
label(allocationstats_originalcode)
label(allocationstats_exit)

label(allocationstats_update_exit)
label(allocationstats_set_exit)

registersymbol(allocationstats_savedAOB)

//king of dragon pass.s86+C1F08 - 39 87 70020000        - cmp [edi+00000270],eax
//king of dragon pass.s86+C1F0E - 0F84 94000000         - je "king of dragon pass.s86"+C1FA8
//king of dragon pass.s86+C1F14 - 0FBF 8F 78020000      - movsx ecx,word ptr [edi+00000278]
//king of dragon pass.s86+C1F1B - 51                    - push ecx
//king of dragon pass.s86+C1F1C - 83 EC 0C              - sub esp,0C
//king of dragon pass.s86+C1F1F - 8B F4                 - mov esi,esp
aobscan(allocationstats_searchedAOB, 0F BF 8F 78 02 00 00 51)

alloc(allocationstats_newmem, 2048)


allocationstats_newmem:
cmp dword ptr [allocationstats_update_enable], #0
je allocationstats_update_exit
mov [allocationstats_basepointer], edi
allocationstats_update_exit:

cmp dword ptr [allocationstats_set_enable], #0
je allocationstats_set_exit
mov word ptr [edi+278], #9999
allocationstats_set_exit:


allocationstats_originalcode:
db 0F BF 8F 78 02 00 00
//movsx ecx,word ptr [edi+00000278]


allocationstats_exit:
jmp allocationstats_returnhere


allocationstats_searchedAOB:
allocationstats_savedAOB:
jmp allocationstats_newmem
nop
nop
allocationstats_returnhere:


[DISABLE]
allocationstats_savedAOB:
db 0F BF 8F 78 02 00 00
//movsx ecx,word ptr [edi+00000278]

unregistersymbol(allocationstats_savedAOB)

dealloc(allocationstats_newmem)"""

