[[cheat]]
id = "get-x-y-locations"
name = "Get X/Y Locations"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
registersymbol(location)
label(returnhere)
label(originalcode)
label(exit)
label(location)

newmem:
mov [location],esi

originalcode:
fld dword ptr [esi+1C]
fstp dword ptr [unepic.exe+106B014]

exit:
jmp returnhere

location:
db 00

"unepic.exe"+BBF9A:
jmp newmem
nop
nop
nop
nop

returnhere:

[DISABLE]
dealloc(newmem)
unregistersymbol(location)
"unepic.exe"+BBF9A:
fld dword ptr [esi+1C]
fstp dword ptr [unepic.exe+106B014]"""

