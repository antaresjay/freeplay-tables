[[cheat]]
id = "bypass-anti-cheat"
name = "Bypass Anti-Cheat"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// "unepic.exe"+3BF37 toggles the explosion if cheat value was found

[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(cheat)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here


originalcode:
//xor eax,[esp+04]
//xor edx,[esp+08]


cheat:

xor eax,[esp+04] // Translate EAX to value - EAX should hold the cheated value
xor eax,[esp+08] // Encrypt EAX like EDX value
mov [unepic.exe+271330],eax // Insert the value into memory
mov eax,[unepic.exe+27132C] // Get the encrypted EAX value back
mov edx,[unepic.exe+271330] // Get the encrypted EDX value back
xor eax,[esp+04] // decrypt the value
xor edx,[esp+08] // decrypt the value


exit:
jmp returnhere

"unepic.exe"+3BF2B:
jmp newmem
nop
nop
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
"unepic.exe"+3BF2B:
xor eax,[esp+04]
xor edx,[esp+08]
//Alt: db 33 44 24 04 33 54 24 08"""

