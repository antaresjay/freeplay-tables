[[cheat]]
id = "player-ctrl-numpad-1"
name = "Player (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Rose & Locket.exe
// Author            : ndck76
// Executable Version: 2021.3.45.63631
// Game Version      : v1.0.47
// Script Date       : 2026-05-29


[ENABLE]

aobscanregion(reset,Player:Update,Player:Update+1000,0FB686xxxx000085xx0Fxxxxxxxxxx66xxxx49BBxxxxxxxxxxxx000041xxxxF3xxxxxx66xxxxxx66xxxxxx) //Player:Update+54
alloc(newmem,$1000,reset)
alloc(data,8)
alloc(resetbkp,7)
registersymbol(data)
registersymbol(reset)
registersymbol(resetbkp)
label(code)
label(return)

resetbkp:
  readmem(reset,7)

newmem:
  mov [data],rsi

code:
  readmem(reset,7)
  jmp return

reset:
  jmp newmem
  nop 2
return:

[DISABLE]

reset:
  readmem(resetbkp,7)

unregistersymbol(*)
dealloc(*)"""

