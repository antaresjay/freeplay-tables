source = """
[ENABLE]

aobscanmodule(nrlad,re9.exe,41 8B 6F 24 89 C1 29 E9 41 89 EE 44 0F 4C F0) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov ebp, [r15+24]
  mov [rdx+20], ebp

code:
  mov ebp, [r15+24]
  mov ecx, eax
  sub ecx, ebp
  mov r14d, ebp
  cmovl r14d, eax
  jmp return

nrlad:
  jmp far newmem
  nop
return:
registersymbol(nrlad)

[DISABLE]

nrlad:
  db 41 8B 6F 24 89 C1 29 E9 41 89 EE 44 0F 4C F0

unregistersymbol(nrlad)
dealloc(newmem)"""
