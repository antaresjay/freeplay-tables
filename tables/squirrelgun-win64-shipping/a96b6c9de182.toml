[[cheat]]
id = "physics"
name = "Physics"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(jumpcd,SquirrelGun-Win64-Shipping.exe,F3 0F 10 83 78 01 00 00 45 33 C0 48 8B 03) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

label(jumpMulVal)
registersymbol(jumpMulVal)

newmem:
  movss xmm0,[rbx+00000178]
  push rdx
  mov rdx, playerPtr
  test rdx, rdx
  je code

  mov rdx, [rdx]
  test rdx, rdx
  je code

  cmp rdx, rdi
  jne code

  cmp dword ptr [jumpMulVal], (float)1.0
  jle code

  mulss xmm0, [jumpMulVal]

code:
  pop rdx
  xor r8d,r8d
  mov rax,[rbx]
  jmp return

jumpMulVal:
dd (float)1.0

jumpcd:
  jmp far newmem
return:
registersymbol(jumpcd)

[DISABLE]

jumpcd:
  db F3 0F 10 83 78 01 00 00 45 33 C0 48 8B 03

unregistersymbol(jumpcd)
unregistersymbol(jumpMulVal)
dealloc(newmem)"""

