[[cheat]]
id = "mainscript"
name = "MainScript"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc(newmem,$1000,read_player_ptr)
label(code_player_ptr,undo_damage)
registersymbol(code_player_ptr,base_player_ptr,player_ptr,code_damage,undo_damage,damage_multiplier,damage_reduction_multiplier,damage_player,damage_enemy)

newmem:
  code_player_ptr:
    readmem(read_player_ptr,7)
    mov [base_player_ptr],rsi
    mov [player_ptr],r8
    jmp return1
    align 10 CC

  code_damage:
    cmp byte ptr [damage_player],0
    je @f
    cmp r12,[player_ptr]
    jne @f
    mulss xmm0,[damage_multiplier]
    // mulss xmm9,[damage_multiplier]
  @@:
    cmp byte ptr [damage_enemy],0
    je @f
    cmp r12,[player_ptr]
    je @f
    mulss xmm0,[damage_reduction_multiplier]
    mulss xmm9,[damage_reduction_multiplier]

  undo_damage:
    readmem(trace_damage,9)
    jmp return2
    align 10 CC

  base_player_ptr:
    dq 0

  player_ptr:
    dq 0

  damage_multiplier:
    dd (float)2.0

  damage_reduction_multiplier:
    dd (float)0.5

  damage_player:
    db 0

  damage_enemy:
    db 0

read_player_ptr:
  jmp code_player_ptr
  nop 2
return1:

trace_damage:
  jmp code_damage
  nop 4
return2:

