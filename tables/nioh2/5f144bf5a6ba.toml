3) Activate the script. You only need to do this once per play session.
4) Go to the map screen.
5) Select the character you want to play as in "Swap Characters" and activate the "Swap" script.
6) Load a mission.
7) Before you start the mission, set the "level" value to the desired level of your character. Note that this does not affect your actual character.
8) Pressing \ resets you back to the player character. It is recommended to do this when returning to the map screen.
---------------------------------
CONTROLLING ENEMIES:
Enemies control similarly to the player, however every button can be assigned to an attack. This includes item shortcuts, so be sure to use all 4 item shortcut tabs to get a character's full moveset. They have combos similar to the player, but every enemy controls slightly different; Experiment with inputs. For enemies that are capable of doing it, light attack + sheathe (X+B on an Xbox controller) typically transitions to the dark realm and heavy attack + sheathe (Y+B on an Xbox controller) leaves the dark realm.
---------------------------------
ANIMATION SWAPPING:
Activating animation swapping allows you to temporarily use the player character's animations. This allows you to use shrines, interact with the world, and complete levels with enemies who could not otherwise. This also effects your collision, allowing you to pass through areas that some enemies cannot normally fit into, namely interiors. To use animation swapping:

1) Load into a mission.
2) Activate the "Animation Swap Toggle" script. You only need to activate the script once per mission session. If something happens to reload the mission (death, return to title screen, etc), you will need to activate the script again.
3) From now until the end of the mission, press ; to switch to player animations and ' to switch back.
4) Animation swapping doesn't work in the dojo.
---------------------------------
ATTRIBUTES:
This field contains values that make controlling enemies easier. Note that as it is not fully understood what certain values control, they have been given general/vague names. For changes to these values to take effect, you must return to the title screen, then load back into the mission. Because NPCs also access these values, it is highly recommended to restore them to their original values when switching to a different enemy. The following attributes can be edited:

1) Collision Type. Setting this value to 4 makes it easier for larger enemies to navigate levels.
2) Enemy Collision Related. Setting this value to 100 makes it so that large enemies no longer phase through other large enemies.
3) Model Size. Changes the size of your character. This does not effect collision, but does effect attack and dodge range.
4) Weapon Size. Changes the size of your character's weapon. Does not apply to every weapon, such as Otakemaru's blades.
*/

[ENABLE]

[DISABLE]'''

