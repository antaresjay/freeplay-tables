source = """
{ Game   : ACBSP.exe
  Version: 1.03 Steam/Uplay
  Date   : 2021-11-03
  Author : hex
}

[ENABLE]

aobscanmodule(pSpeed,ACBSP.exe,0F 28 86 A0 00 00 00 0F 29 85 50)
alloc(newmem,$1000)

alloc(bSuperSpeed,1)
alloc(pSpeedValue,4)

registersymbol(bSuperSpeed)
registersymbol(pSpeedValue)

pSpeedValue:
dd (float)1.75

label(code)
label(return)

newmem:
push ebx
mov ebx,[esi+08]
cmp byte ptr [bSuperSpeed],01
jne code
//Check player entity
cmp byte ptr [ebx+94],01
jne code
xorps xmm0,xmm0
movss xmm0,[pSpeedValue]
//Check if the player is on the ground
cmp word ptr [esi+90],00
je code
//Check if the player is jumping
cmp word ptr [esi+90],01
je code
//Check if the player is still in the air
cmp word ptr [esi+90],1000
je code
//Z-axis
movss xmm2,[esi+A8]
movss [esi+A8],xmm2
//X-axis
movss xmm2,[esi+A0]
mulss xmm2,xmm0
movss [esi+A0],xmm2
//Y-axis
movss xmm2,[esi+A4]
mulss xmm2,xmm0
movss [esi+A4],xmm2

code:
pop ebx
  movaps xmm0,[esi+A0]
  jmp return

pSpeed:
  jmp newmem
  nop 2
return:
registersymbol(pSpeed)

[DISABLE]

