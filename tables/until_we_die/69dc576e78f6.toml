type = "script"
source = """
[ENABLE]

aobscanmodule(Get_Ammo_AOB,GameAssembly.dll,F3 0F 11 43 3C 83 7B) // should be unique
alloc(newmem,$1000,Get_Ammo_AOB)

label(code)
label(return)

newmem:
  mov [rbx+34],#77
code:
  movss [rbx+3C],xmm0
  jmp return

Get_Ammo_AOB:
  jmp newmem
return:
registersymbol(Get_Ammo_AOB)

[DISABLE]

Get_Ammo_AOB:
  db F3 0F 11 43 3C

unregistersymbol(Get_Ammo_AOB)
dealloc(newmem)"""
