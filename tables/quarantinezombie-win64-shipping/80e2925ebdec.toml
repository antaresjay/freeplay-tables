type = "script"
source = """
// Game Executable   : QuarantineZombie-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.6.1.0
// Game Version      : Build.21618194
// Script Date       : 2026-01-28


[ENABLE]

aobscanmodule(master,QuarantineZombie-Win64-Shipping.exe,488Bxx33xx4Cxxxxxxxxxxxx488Bxx41FFxx84xx74xx488Bxx488B) // should be unique
alloc(newmem,$1000)
alloc(data,8)
alloc(masterbkp,15)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,15)

newmem:
  mov [data],rax

code:
  readmem(master,15)
  jmp return

master:
  jmp far newmem
  nop
return:

[DISABLE]

master:
  readmem(masterbkp,15)

unregistersymbol(*)
dealloc(*)"""

