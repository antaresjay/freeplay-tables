[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
aobscan(health,D9 80 1C 01 00 00 D9 EE DF F1 DD D8 0F 8A * * * *  0f 82 * * * * 8D 43 50 3B 08 D9 00 D9 40 04)
registersymbol(health)
newmem: //this is allocated memory, you have read,write,execute access
//place your code here
fld [eax+118]
fstp [eax+11c]
fld dword ptr [eax+0000011C]
jmp returnhere

health:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
health:
 db D9 80 1C 01 00 00
unregistersymbol(health)"""

