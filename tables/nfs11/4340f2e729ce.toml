source = """
{ Game   : NFS11.exe
  Version: 1.1
  Date   : 2019-08-27
  Author : BitKit

  Features:
  - Unlimited Nitro
  - Unlimited Health
  - Disable Time Penalty
  - Disable Timer
  - All Equipment unlimited
}

[ENABLE]
aobscanmodule(hpNitro,NFS11.exe,F3 0F 58 41 0C F3 0F 11 41 0C 0F 28 C8)
aobscanmodule(hpHealth,NFS11.exe,8B 8E 50 1C 00 00 8B 96 6C 1C 00 00 0F 28 42 40)
aobscanmodule(hpPenalty,NFS11.exe,01 78 30 8B CB 11 68 34 8B 40 14 01 38 11 68 04)
aobscanmodule(hpTimer,NFS11.exe,01 2C CA 8D 04 CA 8B 4C 24 24 11 48 04 66 85 FF)
aobscanmodule(hpEquip,NFS11.exe,F3 0F 11 41 0C 32 C0 88 41 10 F3 0F 11 41 18)
//=========
alloc(codeMem,1024)
//=========
label(_Nitro)
label(_exitNitro)
label(_Health)
label(_exitHealth)
label(_Penalty)
label(_exitPenalty)
label(_Timer)
label(_exitTimer)
label(_Equip)
label(_exitEquip)

label(enableNitro)
label(enableHealth)
label(enablePenalty)
label(enableTimer)
label(enableEquip)
label(equipFlag)
//=========
registersymbol(codeMem)
registersymbol(hpNitro)
registersymbol(hpHealth)
registersymbol(hpPenalty)
registersymbol(hpTimer)
registersymbol(hpEquip)

registersymbol(enableNitro)
registersymbol(enableHealth)
registersymbol(enablePenalty)
registersymbol(enableTimer)
registersymbol(enableEquip)
registersymbol(equipFlag)
//=========
codeMem:
//=========
//Nitro
_Nitro:
  cmp byte ptr [enableNitro],0
  je origNitro
  mov [ecx+0C], (float)100
origNitro:
  addss xmm0,[ecx+0C]
  jmp _exitNitro
//Health
_Health:
  cmp byte ptr [enableHealth],0
  je origHealth
  mov [esi+1AB0],0
origHealth:
  mov ecx,[esi+1C50]
  jmp _exitHealth
//Time penalty
_Penalty:
  cmp byte ptr [enablePenalty],0
  je origPenalty
  mov edi,0
origPenalty:
  add [eax+30],edi
  mov ecx,ebx
  jmp _exitPenalty
//Freeze timer
_Timer:
  cmp byte ptr [enableTimer],0
  je  origTimer
  mov ebp,0
origTimer:
  add [edx+ecx*8],ebp
  lea eax,[edx+ecx*8]
  jmp _exitTimer
//Equipment
_Equip:
  movss [ecx+0C],xmm0
  cmp byte ptr [enableEquip],0
  je _exitEquip
  cmp byte ptr [ecx+107],0
  je _exitEquip
  mov dword ptr [ecx+059C],#10  //  Heli
  mov dword ptr [ecx+05A0],#10  //  EMP (Cop)
  mov dword ptr [ecx+05A4],#10  //  Spikes (Driver)
  mov dword ptr [ecx+05A8],#10  //  Spikes (Cop)
  mov dword ptr [ecx+05AC],#10  //  Turbo
  mov dword ptr [ecx+05B0],#10  //  EMP (Driver)
  mov dword ptr [ecx+05B8],#10  //  JAM
  mov dword ptr [ecx+05BC],#10  //  Road Block
  jmp _exitEquip
//=========
enableNitro:
  db 0
enableHealth:
  db 0
enablePenalty:
  db 0
enableTimer:
  db 0
enableEquip:
  db 0
enableDrvEq:
  db 0
enableCopEq:
  db 0
equipFlag:
  db 0
//=========
hpNitro:
  jmp _Nitro
_exitNitro:
hpHealth:
  jmp _Health
  nop
_exitHealth:
hpPenalty:
  jmp _Penalty
_exitPenalty:
hpTimer:
  jmp _Timer
  nop
_exitTimer:
hpEquip:
  jmp _Equip
_exitEquip:
//=========
[DISABLE]
hpNitro:
  db F3 0F 58 41 0C
hpHealth:
  db 8B 8E 50 1C 00 00
hpPenalty:
  db 01 78 30 8B CB
hpTimer:
  db 01 2C CA 8D 04 CA
hpEquip:
  db F3 0F 11 41 0C
//=========
unregistersymbol(codeMem)
unregistersymbol(hpNitro)
unregistersymbol(hpHealth)
unregistersymbol(hpPenalty)
unregistersymbol(hpTimer)
unregistersymbol(hpEquip)
unregistersymbol(enableNitro)
unregistersymbol(enableHealth)
unregistersymbol(enablePenalty)
unregistersymbol(enableTimer)
unregistersymbol(enableEquip)
unregistersymbol(equipFlag)
//=========
dealloc(codeMem)"""
