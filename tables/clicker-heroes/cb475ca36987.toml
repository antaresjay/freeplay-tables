[[cheat]]
id = "get-userdatacontroller"
name = "-> Get UserDataController"
category = "misc"
description = ""
hint = ""
type = "script"
source = '''
//Target:  Clicker Heroes.exe
//Author:  Salis
//Credit to METHOS for custom Template LUA

[ENABLE]

////////////////////////  getudatcont  \\\\\\\\\\\\\\\\\\\\\\\\

define(address, Logic.Controllers.MercenaryController:CanAccessMercenaries+14)

alloc(newmem,1024)
alloc(obytes_getudatcont, 10)
label(return code)

registersymbol(obytes_getudatcont udatcont)

obytes_getudatcont:
readmem(address, 10)

newmem:

code:
 cmp dword ptr [rcx],00
 mov [udatcont], rcx
 mov rax,[rax+18]
 jmp return

udatcont:
dq 0

address:
 jmp newmem
 nop 2
return:


[DISABLE]

address:
readmem(obytes_getudatcont, 10)

dealloc(*)
unregistersymbol(*)'''
