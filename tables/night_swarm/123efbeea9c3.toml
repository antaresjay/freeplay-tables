[[cheat]]
id = "infinite-dashes"
name = "Infinite Dashes"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(dashing, MovementHandler:Update+10, MovementHandler:Update+297, F3 0F 10 86 D8 00 00 00 F3 0F 5A C0 F2 0F 11 45 D0)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov [rsi+D8], (float)10.0
code:
  movss xmm0,[rsi+000000D8]
  cvtss2sd xmm0,xmm0
  movsd [rbp-30],xmm0
  jmp return

dashing:
  jmp far newmem
  nop 3
return:
registersymbol(dashing)

[DISABLE]

dashing:
  db F3 0F 10 86 D8 00 00 00 F3 0F 5A C0 F2 0F 11 45 D0

unregistersymbol(dashing)
dealloc(newmem)"""
