type = "script"
source = """
// Game Executable   : GhostMasterRemake-Win64-Shipping.exe
// Author            : Cs
// Executable Version: 5.5.1.0
// Module Version    :
// Script Date       : 2026-03-21
// Created with      : customAOBInjectionTemplates version: 1.3.12
[ENABLE]
aobscanmodule(aobPlayerControllerGrabber,GhostMasterRemake-Win64-Shipping.exe,80 B9 ?? ?? 00 00 00 48 8B D9 75 ?? E8 ?? ?? ?? ?? 83 F8 01)
aobscanmodule(aobGameBaseGrabber,GhostMasterRemake-Win64-Shipping.exe,F3 0F 10 ?? ?? ?? 00 00 41 ?? ?? ?? 0F 86 ?? ?? 00 00 8?)

alloc(newmemPlayerControllerGrabber,4096,aobPlayerControllerGrabber)

label(aobPlayerControllerGrabber_r)
label(aobPlayerControllerGrabber_i)
registersymbol(aobPlayerControllerGrabber_r)
registersymbol(aobPlayerControllerGrabber_i)

label(lblPlayerControllerGrabber)
label(lblPlayerControllerGrabberSkip)
label(lblPlayerControllerGrabberRet)

label(pPlayerController)
registersymbol(pPlayerController)

label(bEnableMinMissionPower)
label(dMinMissionPower)
registersymbol(bEnableMinMissionPower)
registersymbol(dMinMissionPower)

label(aobGameBaseGrabber_r)
label(aobGameBaseGrabber_i)
registersymbol(aobGameBaseGrabber_r)
registersymbol(aobGameBaseGrabber_i)

label(lblGameBaseGrabber)
label(lblGameBaseGrabberSkip)
label(lblGameBaseGrabberRet)

label(pGameBase)
registersymbol(pGameBase)

newmemPlayerControllerGrabber:
//////////////////////////////////////////////
// Set your preferred default values below. //
//////////////////////////////////////////////
bEnableMinMissionPower:
dq 1
dMinMissionPower:
dq (double)2000.0
//////////////////////////////////////////////
// Set your preferred default values above. //
//////////////////////////////////////////////

lblPlayerControllerGrabber:
readmem(aobPlayerControllerGrabber,7)
je short lblPlayerControllerGrabberSkip
mov r11,rcx
cmp qword ptr [pPlayerController],rcx
je short @f
mov qword ptr [pPlayerController],rcx
@@:
test r11,r11
jz short lblPlayerControllerGrabberSkip
cmp dword ptr [bEnableMinMissionPower],1
jne short lblPlayerControllerGrabberSkip
mov r10,r11
mov r10,[r10+890]
test r10,r10
jz short lblPlayerControllerGrabberSkip
mov r11,[dMinMissionPower]
cmp qword ptr [r10+110],r11
jge short @f
mov qword ptr [r10+110],r11
@@:
cmp qword ptr [r10+118],r11
jge short @f
mov qword ptr [r10+118],r11
@@:
lblPlayerControllerGrabberSkip:
jmp lblPlayerControllerGrabberRet
aobPlayerControllerGrabber_i:
readmem(aobPlayerControllerGrabber,7)
pPlayerController:
dq 0

lblGameBaseGrabber:
movsxd r10,[aobGameBaseGrabber_i+04]
mov r11,[rdi+r10+08]
cmp qword ptr [pGameBase],r11
je short lblGameBaseGrabberSkip
mov qword ptr [pGameBase],r11
lblGameBaseGrabberSkip:
readmem(aobGameBaseGrabber,8)
jmp lblGameBaseGrabberRet
aobGameBaseGrabber_i:
readmem(aobGameBaseGrabber,8)
align 8 00
pGameBase:
dq 0

aobGameBaseGrabber:
aobGameBaseGrabber_r:
jmp lblGameBaseGrabber
nop 3
lblGameBaseGrabberRet:

aobPlayerControllerGrabber:
aobPlayerControllerGrabber_r:
jmp lblPlayerControllerGrabber
nop 2
lblPlayerControllerGrabberRet:

[DISABLE]
aobPlayerControllerGrabber_r:
readmem(aobPlayerControllerGrabber_i,7)

aobGameBaseGrabber_r:
readmem(aobGameBaseGrabber_i,8)

unregistersymbol(*)
dealloc(*)"""

