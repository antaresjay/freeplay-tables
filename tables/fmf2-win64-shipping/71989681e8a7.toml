[[cheat]]
id = "patch-exec-flag"
name = "Patch Exec Flag"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Paranoid-Win64-Shipping.exe
  Version: 
  Date   : 2023-12-16
  Author : cfe

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(aobFlag,$process,F7 80 B0 00 00 00 00 02 00 00) // should be unique
alloc(newmem,$1000,aobFlag)

label(code)
label(return)

newmem:

code:
  or [rax+b0],200
  test [rax+000000B0],00000200
  jmp return

aobFlag:
  jmp newmem
  nop 5
return:
registersymbol(aobFlag)

[DISABLE]

aobFlag:
  db F7 80 B0 00 00 00 00 02 00 00

unregistersymbol(aobFlag)
dealloc(newmem)"""

