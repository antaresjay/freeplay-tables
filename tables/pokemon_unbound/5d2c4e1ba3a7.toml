[[cheat]]
id = "personality-generator"
name = "Personality Generator"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[enable]
alloc(Slot,01)
alloc(Nature,01)
alloc(Gender,01)
alloc(Ability,01)
alloc(Shiny,01)
registersymbol(Slot)
registersymbol(Nature)
registersymbol(Gender)
registersymbol(Ability)
registersymbol(Shiny)

Slot:
db 1 //Slot which Pokemon should be modified

Nature:
db 19 //0-24 = specific Nature, 25 = dont Matter

Gender:
db 2 //0 = Female, 1 = Male, 2 = dont Matter

Ability:
db 2 //0 = 1st Ability, 1 = 2nd Ability, 2 = dont Matter

Shiny:
db 2 //0 = no Shiny, 1 = Shiny, 2 = dont matter

[disable]
dealloc(Slot,01)
dealloc(Nature,01)
dealloc(Gender,01)
dealloc(Ability,01)
dealloc(Shiny,01)
unregistersymbol(Slot)
unregistersymbol(Nature)
unregistersymbol(Gender)
unregistersymbol(Ability)
unregistersymbol(Shiny)"""

