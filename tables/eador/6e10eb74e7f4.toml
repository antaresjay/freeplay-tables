[[cheat]]
id = "control-guards-in-combat"
name = "<== Control Guards in Combat"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[enable]
alloc(mycode,1024)
label(mycode2)
aobscan(aob1,55 55 56 53 33 C9 E8)
aobscan(aob2,55 55 56 50 8B CB E8)
label(guards1)
label(guards2)
registersymbol(guards1)
registersymbol(guards2)
label(return)
label(return2)

//eador.exe+000B9C18:
//push 1

//eador.exe+0005BBD6:
aob1:
guards1:
jmp mycode
nop
return:

//Eador.exe+5BC73:
aob2:
guards2:
jmp mycode2
nop
return2:

mycode:  //for neutrals attacking you
push    1
push    ebp
push    esi
push    ebx
xor     ecx, ecx

jmp return

mycode2: // for heroes attacking you
push 1
push ebp
push esi
push eax
mov ecx,ebx

jmp return2

[disable]
//eador.exe+000B9C18:
//push 0

//eador.exe+0005BBD6:
guards1:
db 55 55 56 53 33 C9 E8

//Eador.exe+0005BC73:
guards2:
db 55 55 56 50 8B CB E8

dealloc(mycode)
unregistersymbol(guards1)
unregistersymbol(guards2)"""

[[cheat]]
id = "reveal-map-player-1"
name = "<== Reveal Map (Player 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,512)
label(returnhere)
label(originalcode)
label(exit)

newmem:
cmp [esp+10], 1  //only reveal map for player 1
jne originalcode
jmp exit

originalcode:
cmp byte ptr [Eador.exe+11D756],00

exit:
jmp returnhere

"Eador.exe"+75013:
jmp newmem
nop
nop
returnhere:

 
[DISABLE]
"Eador.exe"+75013:
db 80 3D 56 D7 51 00 00
dealloc(newmem)"""

