[[cheat]]
id = "other-players-income"
name = "<== Other Players' Income"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[enable]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
label(pointers)
label(incomepointers)
registersymbol(incomepointers)
label(values)
label(newmem2)
label(returnhere2)

newmem:
pushfd
pushad
//esp+8 = player index
//esp+2c = total gold income
//esp+28 = total gold expenses
//esp+24 = total gem income
//esp+18 = total gem expenses
//esi = sizeof(playerstruct)
lea ebp, [esp+24]  //use ebp instead
mov ecx, [ebp+8] //load index
imul ecx, ecx, 6*4
mov edi, values

lea eax, [esi+Eador.exe+1584B8]
mov [edi+ecx], eax     //gold ptr
mov eax, [ebp+2c]
mov [edi+ecx+4], eax
mov eax, [ebp+28]
mov [edi+ecx+8], eax

lea eax, [esi+Eador.exe+1584BC]
mov [edi+ecx+C], eax    //gem ptr
mov eax, [ebp+24]
mov [edi+ecx+10], eax
mov eax, [ebp+18]
mov [edi+ecx+14], eax
popad
popfd

originalcode:
mov edx,eax
sub eax,ecx
sub edx,ecx

exit:
jmp returnhere

newmem2:
pushfd
pushad
mov eax, [pointers]
mov ebx, [pointers+4]
imul eax, eax, 6*4
imul ebx, ebx, 6*4
add eax, values
add ebx, values
mov [pointers+8], eax
mov [pointers+C], ebx
popad
popfd
//original code
push ebp
mov ebp, [esp+08]
jmp returnhere2

pointers:
incomepointers:
dd 2
dd 3
dd 0
dd 0
values:

"Eador.exe"+7FCBA:
jmp newmem
nop
returnhere:

"Eador.exe"+B4B80:
jmp newmem2
returnhere2:

[disable]
"Eador.exe"+7FCBA:
db 8B D0 2B C1 2B D1
"Eador.exe"+B4B80:
db 55 8B 6C 24 08
dealloc(newmem)
unregistersymbol(incomepointers)"""

