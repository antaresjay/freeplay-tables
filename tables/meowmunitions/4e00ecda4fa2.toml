{ Game   : Meowmunitions.exe
  Version: 
  Date   : 2025-09-08
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,Player:Update)
define(bytes,55 48 8B EC 48 81 EC 60 09 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Player:Update)

label(code)
label(return)

newmem:
mov [player_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,00000960
  jmp return

player_ptr:
dq 0

address:
  jmp newmem
  nop 6
return:
registersymbol(player_ptr)

[DISABLE]

address:
  db bytes
  // push rbp
  // mov rbp,rsp
