hint = ""
type = "script"
source = """
[Enable]

alloc(ih_1,16,RebelGalaxySteam.exe) //Infinite Health
aobscanmodule(ih_aob1,RebelGalaxySteam.exe,F3 0F 5E 80 EC 03 00 00 F3)
registersymbol(ih_aob1)
