[[cheat]]
id = "world-speed-script"
name = "World Speed script"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(worldspeedscriptAOB,F3 0F 11 80 78 04 00 00 5E 59 C3)
label(worldspeedscriptAOB_jmp)
registersymbol(worldspeedscriptAOB_jmp)

label(pWorldSpeed)
registersymbol(pWorldSpeed)
label(fSpeedModifier)
registersymbol(fSpeedModifier)
label(sSpeedModEnable)
registersymbol(sSpeedModEnable)

alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(originalcode)
label(exit)
label(setModSpeed)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
mov [pWorldSpeed],eax
movss [eax+00000478],xmm0
cmp dword ptr [sSpeedModEnable],'on'
jne originalcode

pushad
push A0      //key Left SHIFT
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
je originalcode

cmp dword ptr [eax+00000478],(float)0.001
jle originalcode
/*cmp dword ptr [eax+00000478],(float)1.0
je setModSpeed
jmp originalcode*/

setModSpeed:
fld dword ptr [eax+00000478]
fmul dword ptr [fSpeedModifier]
fstp dword ptr [eax+00000478]
cmp dword ptr [eax+00000478],(float)0.001
jge originalcode
mov dword ptr [eax+00000478],(float)0.001
jmp originalcode
//mov dword ptr [eax+00000478],(float)0.5

originalcode:
//movss [eax+00000478],xmm0

exit:
jmp returnhere

///
pWorldSpeed:
dd 0
fSpeedModifier:
dd (float)0.5
sSpeedModEnable:
dd 'off'
///

worldspeedscriptAOB: //"RememberMe.exe"+7897C0:
worldspeedscriptAOB_jmp:
jmp newmem
nop
nop
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
worldspeedscriptAOB_jmp: //"RememberMe.exe"+7897C0:
db F3 0F 11 80 78 04 00 00
//Alt: movss [eax+00000478],xmm0
unregistersymbol(pWorldSpeed)
unregistersymbol(fSpeedModifier)
unregistersymbol(sSpeedModEnable)
unregistersymbol(worldspeedscriptAOB_jmp)"""

