type = "script"
source = """
// Game Executable   : The Last Man Survivor.exe
// Author            : ndck76
// Executable Version: 2021.3.25.61228
// Game Version      : Build.16198427 (Early Access)
// Script Date       : 2024-10-31


[ENABLE]

aobscanmodule(timer,GameAssembly.dll,F3xxxxxxxx33xxE8xxxxxxxxF3xxxxxx0F28xxxxxxF3xxxxxxxx488B) //Donteco.UI.Timer.Update
alloc(newmem,$1000,timer)
alloc(data6,8)
alloc(timerbkp,5)
registersymbol(data6)
registersymbol(timer)
registersymbol(timerbkp)
label(code)
label(return)

timerbkp:
  readmem(timer,5)

newmem:
  mov [data6],rdi

code:
  readmem(timer,5)
  jmp return

timer:
  jmp newmem
return:

[DISABLE]

timer:
  readmem(timerbkp,5)

unregistersymbol(*)
dealloc(*)"""

