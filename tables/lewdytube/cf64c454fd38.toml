type = "script"
source = """
[ENABLE]

aobscan(Energy_,AA 00 00 00 D9 87 F4 00 00 00)
alloc(newmem,$1000)

label(return)

newmem:
  mov [edi+000000F4],(float)100
  fld dword ptr [edi+000000F4]
  jmp return

Energy_+04:
  jmp newmem
  nop
return:
registersymbol(Energy_)

[DISABLE]

Energy_+04:
  db D9 87 F4 00 00 00

unregistersymbol(Energy_)
dealloc(newmem)"""
