[[cheat]]
id = "cheat-script"
name = "Cheat script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Made by Geri with Cheat Engine 6.3
//14th September, 2013
//All rights reserved. You are not allowed to use these scripts to create Your own trainer without my permission.
//Contact e-mail: trainers4free@gmail.com
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
globalalloc(cenergy,4)
globalalloc(chealth,4)
globalalloc(cdriveg,4)
label(energy)
label(drivegauge)
label(label1)
registersymbol(label1)
aobscan(aob1,DB 47 50 DA 77 54)

cenergy:
dd 0

chealth:
dd 0

cdriveg:
dd 0

newmem: //this is allocated memory, you have read,write,execute access
cmp [chealth],1
jne energy
mov [edi+50],(int)1000

energy:
cmp [cenergy],1
jne drivegauge
mov [edi+D8],(float)999

drivegauge:
cmp [cdriveg],1
jne originalcode
mov [edi+C8],(float)100

originalcode:
fild dword ptr [edi+50]
fidiv [edi+54]

exit:
jmp returnhere

aob1:
label1:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
label1:
db DB 47 50 DA 77 54
unregistersymbol(label1)"""

