[[cheat]]
id = "ingameloopstate"
name = "InGameLoopState"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : HoloType.exe
  Version: 
  Date   : 2026-02-08
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,App.GameFlow.States.InGame.InGameLoopState:OnTextInput)
define(bytes,55 48 8B EC 48 81 EC 80 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,App.GameFlow.States.InGame.InGameLoopState:OnTextInput)

label(code)
label(return)

newmem:
mov [ingameloopstate_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,00000080
  jmp return

ingameloopstate_ptr:
dq 0

address:
  jmp newmem
  nop 6
return:
registersymbol(ingameloopstate_ptr)

[DISABLE]

address:
  db bytes
  // push rbp
  // mov rbp,rsp
  // sub rsp,00000080

dealloc(newmem)
unregistersymbol(ingameloopstate_ptr)"""
