mov [esi+170], #9999999
GameDataScript_gangset_exit:

cmp dword ptr [GameDataScript_weaponset_enable], #0
je GameDataScript_weaponset_exit
mov edx, 0
mov ebx, [esi+9c]
test ebx, ebx
je GameDataScript_weaponset_exit
mov ebx, [ebx+8]
test ebx, ebx
je GameDataScript_weaponset_exit
mov ecx, [ebx+c]
test ecx, ecx
je GameDataScript_weaponset_exit
GameDataScript_weaponset_entry:
mov eax, [ebx+edx*4+10]
test eax, eax
je GameDataScript_weaponset_continue
fld [eax+64]
fstp [eax+68]
//fld [eax+104]
//fstp [eax+100]
cmp byte ptr [eax+54], #1
jne GameDataScript_weaponset_continue
mov [eax+58], #9999
GameDataScript_weaponset_continue:
inc edx
cmp ecx, edx
je GameDataScript_weaponset_exit
jmp GameDataScript_weaponset_entry
GameDataScript_weaponset_exit:

