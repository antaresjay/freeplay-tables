label(GameDataScript_buildset_continue)

registersymbol(GameDataScript_savedAOB)

//05156E00 - E8 CB000000           - call 05156ED0
//05156E05 - 83 C4 10              - add esp,10
// GameDataScript:RecalculateCharacter+18
//05156E08 - 8B 46 38              - mov eax,[esi+38]
//05156E0B - 83 EC 08              - sub esp,08
//05156E0E - 57                    - push edi
//05156E0F - 50                    - push eax
//05156E10 - 39 00                 - cmp [eax],eax
//05156E12 - E8 F9000000           - call 05156F10
//05156E17 - 83 C4 10              - add esp,10
aobscan(GameDataScript_searchedAOB, 8B 46 38 83 EC 08 57 50 39 00)

alloc(GameDataScript_newmem, 2048, GameDataScript_searchedAOB)
alloc(GameDataScript_temp1, 4, GameDataScript_searchedAOB)
alloc(GameDataScript_temp2, 4, GameDataScript_searchedAOB)
alloc(GameDataScript_temp3, 4, GameDataScript_searchedAOB)
alloc(GameDataScript_temp4, 4, GameDataScript_searchedAOB)
alloc(GameDataScript_temp5, 4, GameDataScript_searchedAOB)


GameDataScript_newmem:
mov [GameDataScript_temp1], eax
mov [GameDataScript_temp2], ebx
mov [GameDataScript_temp3], ecx
mov [GameDataScript_temp4], edx

cmp dword ptr [GameDataScript_update_enable], #0
je GameDataScript_update_exit
mov [GameDataScript_basepointer], esi
GameDataScript_update_exit:

cmp dword ptr [GameDataScript_set_enable], #0
je GameDataScript_set_exit
GameDataScript_set_exit:

cmp dword ptr [GameDataScript_cashset_enable], #0
