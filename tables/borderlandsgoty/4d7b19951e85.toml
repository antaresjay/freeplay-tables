[[cheat]]
id = "no-reload"
name = "No Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(noreload,BorderlandsGOTY.exe,2B 86 E4 04 00 00)
alloc(newmem,$1000,"BorderlandsGOTY.exe"+14FF6AD)

label(code)
label(return)

newmem:
code:
  mov [rsi+000004E4], 00000032
  sub eax, [rsi+000004E4]
  jmp return

noreload:
  jmp newmem
  nop
return:
registersymbol(noreload)

[DISABLE]

noreload:
  db 2B 86 E4 04 00 00

unregistersymbol(noreload)
dealloc(newmem)"""

