[[cheat]]
id = "toggle-one-hit-kill"
name = "Toggle One Hit Kill"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(OneHitKill,$process,66 29 93 56 01 00 00) // should be unique
aobscanmodule(OneHitKill2,$process,66 29 97 56 01 00 00) // should be unique
alloc(newmem,2048)
alloc(newmem2,2048)

newmem:
cmp ebx,$process+589EF0
je code
mov dx,000003E7

code:
  sub [ebx+00000156],dx
  jmp return

OneHitKill:
  jmp newmem
  nop 2
return:
registersymbol(OneHitKill)

//////////////////////////////////

newmem2:
cmp edi,$process+589EF0
je code
mov dx,000003E7

code2:
  sub [edi+00000156],dx
  jmp return2

OneHitKill2:
  jmp newmem2
  nop 2
return2:
registersymbol(OneHitKill2)


[DISABLE]

OneHitKill:
  db 66 29 93 56 01 00 00

unregistersymbol(OneHitKill)
dealloc(newmem)

OneHitKill2:
  db 66 29 97 56 01 00 00

unregistersymbol(OneHitKill2)
dealloc(newmem2)"""

