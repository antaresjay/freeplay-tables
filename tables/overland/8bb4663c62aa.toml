type = "script"
source = """
{ Game   : Overland.exe
  Version: 
  Date   : 2019-09-20
  Author : Anjinggila

  This script does blah blah blah
}

[ENABLE]

aobscanregion(Steps,CGDMGEENLFK:DFCPBMBIAGA+130,CGDMGEENLFK:DFCPBMBIAGA+360,48 63 50 ? 48 8b f1) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov dword ptr [rax+14],10

code:
  movsxd  rdx,dword ptr [rax+14]
  mov rsi,rcx
  jmp return

Steps:
  jmp newmem
  nop 2
return:
registersymbol(Steps)

[DISABLE]

Steps:
  db 48 63 50 14 48 8B F1

unregistersymbol(Steps)
dealloc(newmem)"""

