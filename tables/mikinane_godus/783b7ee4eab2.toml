[[cheat]]
id = "instant-build"
name = "Instant Build"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[Enable]
alloc(newmem,100)
label(returnhere)
label(exit)
label(Build)
registersymbol(Build)
aobscan(aob1, D8 46 38 D9 5E 38 EB 02 DD D8 8B CE E8)

newmem:
mov [esi+38],(float)9999999.0
fadd dword ptr [esi+38]
fstp dword ptr [esi+38]

exit:
jmp returnhere

aob1:
Build:
jmp newmem
nop
returnhere:

[Disable]
dealloc(newmem)
unregistersymbol(Build)
Build:
db D8 46 38 D9 5E 38 EB 02 DD D8 8B CE E8"""

