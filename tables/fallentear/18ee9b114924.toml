[[cheat]]
id = "player-save-file-ctrl-numpad-1-acitvate-during-game-play"
name = "Player Save File (Ctrl + Numpad 1) {Acitvate during game play}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : FallenTear.exe
// Author            : ndck76
// Executable Version: 2022.3.5.29734
// Game Version      : v1.0.0 (Early Access)
// Script Date       : 2026-03-22


[ENABLE]

aobscanregion(gametime,Main.Gameplay.Player.PlayerScene:Update,Main.Gameplay.Player.PlayerScene:Update+200,F30F1080xxxx0000F3xxxxxxF2xxxxxxxx66xx49BBxxxxxxxxxxxx000041xxxxF3xxxxxx48xxxxxx48xxxxxxF2xxxxxxxx) //Main.Gameplay.Player.PlayerScene:Update+17b
alloc(newmem,$1000)
alloc(data,8)
alloc(gametimebkp,17)
registersymbol(data)
registersymbol(gametime)
registersymbol(gametimebkp)
label(code)
label(return)

gametimebkp:
  readmem(gametime,17)

newmem:
  mov [data],rax

code:
  readmem(gametime,17)
  jmp return

gametime:
  jmp far newmem
  nop 3
return:

[DISABLE]

gametime:
  readmem(gametimebkp,17)

unregistersymbol(*)
dealloc(*)"""

