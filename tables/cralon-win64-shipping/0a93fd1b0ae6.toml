type = "script"
source = """
// Game Executable   : Cralon-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.6.1.0
// Game Version      : Build.23736787
// Script Date       : 2026-06-25


[ENABLE]

aobscanmodule(master,Cralon-Win64-Shipping.exe,488Bxx488Bxx4Cxxxxxxxxxxxx488Bxx41FFxx84xx74xx488Bxx488BxxFF) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,6)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,6)

newmem:
  mov [data],rdi

code:
  readmem(master,6)
  jmp return

master:
  jmp newmem
  nop
return:

[DISABLE]

master:
  readmem(masterbkp,6)

unregistersymbol(*)
dealloc(*)"""

