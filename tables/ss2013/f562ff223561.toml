[[cheat]]
id = "gamemanager"
name = "GameManager"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(GameManagerPtr,GameManager:Update,GameManager:Update+1b,0F B6 47 48 85 C0 75)
alloc(newmem,$1000)
registersymbol(GetGM)
label(code return)

newmem:
mov [GetGM],edi

code:
  movzx eax,byte ptr [edi+48]
  test eax,eax
  jmp return

GetGM:
dq 0

GameManagerPtr:
  jmp newmem
  nop
return:
registersymbol(GameManagerPtr)

[DISABLE]

GameManagerPtr:
  db 0F B6 47 48 85 C0

unregistersymbol(*)
dealloc(*)"""

