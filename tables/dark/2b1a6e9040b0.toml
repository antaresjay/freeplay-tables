[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
//Credits to VampTY
//Send@FearlessRevolution|Sintrix

[ENABLE]


aobscanregion(playerhp,UI.HealthBarIndicator:SetHealthBar+10,UI.HealthBarIndicator:SetHealthBar+82,F3 0F 10 40 1C F3 0F 5A C0 F3 0F 10 0D 39)
alloc(newmem,$1000,playerhp)

label(code)
label(return)

newmem:

code:
  mov [rax+1C],(float)9999
  movss xmm0,[rax+1C]
  jmp return

playerhp:
  jmp newmem
return:
registersymbol(playerhp)

[DISABLE]

playerhp:
  db F3 0F 10 40 1C

unregistersymbol(*)
dealloc(*)"""

