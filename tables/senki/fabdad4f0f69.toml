label(battlestats_turnsset_exit)

registersymbol(battlestats_savedAOB)

//Eiyu Senki.exe+148D99 - 8D 8E D4080000        - lea ecx,[esi+000008D4]
//Eiyu Senki.exe+148D9F - E8 3C19F2FF           - call "Eiyu Senki.exe"+6A6E0
//Eiyu Senki.exe+148DA4 - 8B CF                 - mov ecx,edi
// Accesses Arms
//Eiyu Senki.exe+148DA6 - 8B 50 3C              - mov edx,[eax+3C]
//Eiyu Senki.exe+148DA9 - E8 62F7F1FF           - call "Eiyu Senki.exe"+68510
//Eiyu Senki.exe+148DAE - 8B 55 EC              - mov edx,[ebp-14]
//Eiyu Senki.exe+148DB1 - 83 FA 10              - cmp edx,10
//Eiyu Senki.exe+148DB4 - 72 0E                 - jb "Eiyu Senki.exe"+148DC4
aobscan(battlestats_searchedAOB, 8B CF 8B 50 3C * * * * * 8B 55 EC)

alloc(battlestats_newmem, 2048, battlestats_searchedAOB)
alloc(battlestats_temp1, 4, battlestats_searchedAOB)
alloc(battlestats_temp2, 4, battlestats_searchedAOB)
