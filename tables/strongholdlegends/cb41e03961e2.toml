[[cheat]]
id = "script"
name = "Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(GodMode)
label(ExitGM)
label(Player)
label(ExitP)
label(pHero)
label(Res)
label(ExitRes)
label(iGM)
label(iRes)

registersymbol(iGM)
registersymbol(iRes)
registersymbol(pHero)
//============================================
newmem:

GodMode:
fst dword ptr [ecx+4c]
fcomp dword ptr [00910168]
cmp dword ptr [iGM],1
jne ExitGM
cmp dword ptr [ecx+178],1
jne ExitGM
push [ecx+48]
pop  [ecx+4c]
jmp ExitGM

Player:
fld dword ptr [ebx+00000B84]
mov [pHero],ebx
jmp ExitP

Res:
cmp ecx,[pHero]
je ExitRes
mov [ecx+edx*4+00000AD0],eax
jmp ExitRes
//============================================
pHero:
dd 0

iGM:
dd 1

iRes:
dd 0
//============================================
StrongholdLegends.exe+3E82D9:
jmp GodMode
nop
nop
nop
nop
ExitGM:

StrongholdLegends.exe+20939D:
jmp Player
nop
ExitP:

StrongholdLegends.exe+25BBB:
jmp Res
nop
nop
ExitRes:
//============================================
[DISABLE]
StrongholdLegends.exe+3E82D9:
fst dword ptr [ecx+4c]
fcomp dword ptr [00910168]

StrongholdLegends.exe+20939D:
fld dword ptr [ebx+00000B84]

StrongholdLegends.exe+25BBB:
mov [ecx+edx*4+00000AD0],eax

dealloc(newmem)
unregistersymbol(iGM)
unregistersymbol(iRes)
unregistersymbol(pHero)"""

