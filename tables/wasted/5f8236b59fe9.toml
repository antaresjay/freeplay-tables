[[cheat]]
id = "player-construct"
name = "Player Construct"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(Player,8B 80 A0 01 00 00 85 C0 7F 0E) // should be unique
alloc(newmem,$1000)
globalalloc(bPlayer,8)
globalalloc(eSizeChange,8)
globalalloc(eKill,8)
label(code)
label(return)
label(Enemy)
label(Skip)
newmem:
code:
  cmp [eax+19c], 1
  jne Enemy
  cmp [eax+1a8], 64
  jne Enemy
  mov [bPlayer],eax
  mov eax,[eax+000001A0]
  jmp return
Enemy:
  cmp [eSizeChange], 0
  je Skip
  push ebx
  mov ebx, [eSizeChange]
  mov [eax+24c], ebx
  pop ebx
Skip:
  cmp [eKill], 0
  je Skip2
  cmp [eax+1A0], 1
  jle Skip2
  mov [eax+1A0], 1
  mov eax,[eax+000001A0]
  jmp return

Skip2:
  mov eax,[eax+000001A0]
  jmp return
Player:
  jmp code
  nop
return:
registersymbol(Player)
[DISABLE]
Player:
  db 8B 80 A0 01 00 00
unregistersymbol(Player)
dealloc(newmem)"""

