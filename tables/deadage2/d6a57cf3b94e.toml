[[cheat]]
id = "craft"
name = "Craft"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : DeadAge2.exe
  Version: 1.1.8
  Date   : 2024-12-17
  Author : Oyyzj

  will not decrease crafting items, your amount must be higher than needed
}

[ENABLE]

aobscanregion(Craft,BountyCamp:RemovePartyItems+274,BountyCamp:RemovePartyItems+2a4,41 2B C8 89 48 28 E9) // should be unique
alloc(newmem,$100)
label(return)
label(rCraft)
newmem:
  readmem(Craft+3,3)
  jmp return
rCraft:
  readmem(Craft,6)
Craft:
  jmp newmem
  nop
return:
registersymbol(Craft)
registersymbol(rCraft)
[DISABLE]

Craft:
  readmem(rCraft,6)
unregistersymbol(*)
dealloc(*)"""

