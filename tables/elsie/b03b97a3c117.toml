[[cheat]]
id = "character-ctrl-numpad-1"
name = "Character (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Elsie.exe
// Author            : ndck76
// Executable Version: 2022.3.8.60156
// Game Version      : Build.15586169
// Script Date       : 2025-01-16


[ENABLE]

aobscanmodule(stats,GameAssembly.dll,488Bxxxxxxxxxx4885xx0F84xxxxxxxx488Bxxxx4885xx0F84xxxxxxxxF3xxxxxxxx33xx488Bxxxx488Bxxxxxxxxxx488BxxxxE8xxxxxxxx4885) //Elsie.PersonalEnergyBar.Update
alloc(newmem,$1000,stats)
alloc(data,8)
alloc(statsbkp,7)
registersymbol(data)
registersymbol(stats)
registersymbol(statsbkp)
label(code)
label(return)

statsbkp:
  readmem(stats,7)

newmem:
  mov [data],rax

code:
  readmem(stats,7)
  jmp return

stats:
  jmp newmem
  nop 2
return:

[DISABLE]

stats:
  readmem(statsbkp,7)

unregistersymbol(*)
dealloc(*)"""

