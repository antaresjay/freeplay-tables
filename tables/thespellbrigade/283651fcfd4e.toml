registersymbol(SpellCooldown_Get_AOB)

[DISABLE]

SpellCooldown_Get_AOB:
db 0F 28 C8 0F 57 C0

unregistersymbol(SpellCooldown_Get_AOB)
dealloc(newmem)
unregistersymbol(SpellCastTime_Set)
dealloc(SpellCastTime_Set)"""

