source = """
[ENABLE]

aobscanmodule(SpellCooldown_Get_AOB,GameAssembly.dll,0F 28 C8 0F 57 C0 0F 2E)
alloc(newmem,$1000,SpellCooldown_Get_AOB)

label(code)
label(return)
alloc(SpellCastTime_Set,8)
registersymbol(SpellCastTime_Set)

SpellCastTime_Set:
dd (float)2
newmem:
movss xmm0,[SpellCastTime_Set]
code:
movaps xmm1,xmm0
xorps xmm0,xmm0
jmp return

SpellCooldown_Get_AOB:
jmp newmem
nop
