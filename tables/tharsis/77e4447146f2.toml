[[cheat]]
id = "hull-damage"
name = "Hull Damage"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game    : tharsis.exe
  Version : 5.3.6.23037
  Date    : 2017-03-29
  Author  : MADi2000
  Licence : Free, but it's good to mention me if you use it. And I take no responsibility for this code.

  Info    :
  Little helper.
  Hull Damage - replenishes after each turn - don't take more damage then 8 hit points, or you loose.
  Food        - replenishes after each turn - 5 is more then enough for eatch turn.
}

[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(Hull,48 63 51 54 83 39 00) // should be unique
alloc(newmem,$1000,19FE0CD5)

label(code)
label(return)

newmem:
  mov dword ptr [rcx+54], 8
code:
  movsxd  rdx,dword ptr [rcx+54]
  cmp dword ptr [rcx],00
  jmp return

Hull:
  jmp newmem
  nop
  nop
return:
registersymbol(Hull)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
Hull:
  db 48 63 51 54 83 39 00

unregistersymbol(Hull)
dealloc(newmem)"""

