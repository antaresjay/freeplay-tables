[[cheat]]
id = "hp"
name = "hp"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(hp,final_exam.exe,D9 9B 24 01 00 00 83 BE) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  cmp [ebx+8],5
  jne code
  fstp dword ptr [ebx+00000128]
  jmp return

code:
  fstp dword ptr [ebx+00000124]
  jmp return

hp:
  jmp newmem
  nop
return:
registersymbol(hp)

[DISABLE]

hp:
  db D9 9B 24 01 00 00

unregistersymbol(hp)
dealloc(newmem)"""

