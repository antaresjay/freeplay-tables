[[cheat]]
id = "unlimited-tyre-wear"
name = "Unlimited Tyre Wear"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(tyrecd,F1_2019.exe,F3 0F 58 4F 70)
alloc(newmem,$1000,"F1_2019.exe"+14D6A48)

label(code)
label(return)

newmem:
code:
  cmp dword ptr [rsi+F0],1
  je @F

  mulss xmm1, [tyre_val]

@@:
  addss xmm1, dword ptr [rdi+70]
  jmp return

tyre_val:
dd (float)0.0

tyrecd:
  jmp newmem
return:
registersymbol(tyrecd)

[DISABLE]

tyrecd:
  db F3 0F 58 4F 70

unregistersymbol(tyrecd)
dealloc(newmem)"""
