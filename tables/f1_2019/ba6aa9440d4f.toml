[[cheat]]
id = "contract-2"
name = "Contract"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobScanRegion(NegotiationAOB, F1_2019.exe+5000000, F1_2019.exe+5FFFFFF, FF 4B 04 48 81 C4 80 00 00 00)
aobScanRegion(ReputationAOB, F1_2019.exe+5000000, F1_2019.exe+5FFFFFF, 49 8B 83 58 03 00 00)
aobScanRegion(PrestigeAOB, F1_2019.exe+6000000, F1_2019.exe+6FFFFFF, 8B 70 04 66 41 0F 6E 82 4C 03 00 00)
aobScanRegion(ShowAOB, F1_2019.exe+6000000, F1_2019.exe+6FFFFFF, 48 89 D1 48 8B 80 60 03 00 00)
aobScanRegion(RivalryAOB, F1_2019.exe+6000000, F1_2019.exe+6FFFFFF, 49 8B 44 24 28 4D 01 E5)
aobScanRegion(TeamGoalAOB, F1_2019.exe+7000000, F1_2019.exe+7FFFFFF, 8B 79 04 31 D2)
aobScanRegion(PerksAOB, F1_2019.exe+8000000, F1_2019.exe+8FFFFFF, 46 0F B6 44 27 0E)
alloc(ContractMem,1024,"F1_2019.exe"+580723B)
label(ContractData)
label(NegotiationCode)
label(NegotiationEval)
label(NegotiationReturn)
label(ReputationCode)
label(ReputationReturn)
label(ReputationLoopStart)
label(ReputationLoopEnd)
label(PrestigeCode)
label(PrestigeReturn)
label(ShowCode)
label(ShowReturn)
label(RivalryCode)
label(RivalryReturn)
label(SetRivalry1)
label(SetRivalry2)
label(TeamGoalCode)
label(TeamGoalReturn)
label(PerksCode)
label(PerksReturn)
registersymbol(ContractData)
registersymbol(NegotiationAOB)
registersymbol(ReputationAOB)
registersymbol(PrestigeAOB)
registersymbol(ShowAOB)
registersymbol(RivalryAOB)
registersymbol(TeamGoalAOB)
registersymbol(PerksAOB)

ContractMem:

NegotiationCode:
  cmp [ContractData+18],0
  jne NegotiationEval
  dec [rbx+04]

NegotiationEval:
  add rsp,00000080
  jmp  NegotiationReturn

ReputationCode:
  push rdx
  mov [ContractData+20],rax
  movsx edx,byte ptr [rax]
  mov [ContractData+28],edx
  pop rdx
ReputationLoopStart:
  cmp byte ptr [rax],0
  je ReputationLoopEnd
  sub rax,14
  jmp ReputationLoopStart
ReputationLoopEnd:
  mov [ContractData+60],rax
  mov rax,[r11+00000358]
  jmp ReputationReturn

PrestigeCode:
  mov esi,[rax+04]
  movd xmm0,[r10+0000034C]
  lea rax,[rax]
  mov [ContractData+30],rax
  jmp PrestigeReturn

ShowCode:
  lea r12,[rcx]
  mov [ContractData+40],r12
  xor r12,r12
  mov rcx,rdx
  mov rax,[rax+00000360]
  jmp ShowReturn

RivalryCode:
  mov rax,[r12+28]
  cmp byte ptr [rbx+4],1
  jne SetRivalry2

SetRivalry1:
  mov [ContractData],rbx
  jmp RivalryReturn

SetRivalry2:
  mov [ContractData+8],rbx
  jmp RivalryReturn

TeamGoalCode:
  mov [ContractData+10],r13
  mov edi,[rcx+04]
  xor edx,edx
  jmp TeamGoalReturn

PerksCode:
  movzx r8d,byte ptr [rdi+r12+0E]
  cmp rdi,0
  jne PerksReturn
  push rax
  lea rax,[rdi+r12+0E]
  mov [ContractData+50],rax
  pop rax
  jmp PerksReturn

ContractData:
  dd 0

NegotiationAOB:
  jmp NegotiationCode
  db 90 90 90 90 90
NegotiationReturn:

ReputationAOB:
  jmp ReputationCode
  db 90 90
ReputationReturn:

PrestigeAOB:
  jmp PrestigeCode
  db 90 90 90 90 90 90 90
PrestigeReturn:

ShowAOB:
  jmp ShowCode
  db 90 90 90 90 90
ShowReturn:

RivalryAOB:
  jmp RivalryCode
RivalryReturn:

TeamGoalAOB:
  jmp TeamGoalCode
TeamGoalReturn:

PerksAOB:
  jmp PerksCode
  db 90
PerksReturn:

[DISABLE]
NegotiationAOB:
  db FF 4B 04 48 81 C4 80 00 00 00
ReputationAOB:
  db 49 8B 83 58 03 00 00
PrestigeAOB:
  db 8B 70 04 66 41 0F 6E 82 4C 03 00 00
ShowAOB:
  db 48 89 D1 48 8B 80 60 03 00 00
RivalryAOB:
  db 49 8B 44 24 28
TeamGoalAOB:
  db 8B 79 04 31 D2
PerksAOB:
  db 46 0F B6 44 27 0E
unregistersymbol(ContractData)
unregistersymbol(NegotiationAOB)
unregistersymbol(ReputationAOB)
unregistersymbol(PrestigeAOB)
unregistersymbol(ShowAOB)
unregistersymbol(RivalryAOB)
unregistersymbol(TeamGoalAOB)
unregistersymbol(PerksAOB)
dealloc(ContractMem)"""

