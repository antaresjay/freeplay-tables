[[cheat]]
id = "resource-points"
name = "Resource Points"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobScanRegion(ResourceAOB, F1_2019_dx12.exe+7000000, F1_2019_dx12.exe+7FFFFFF, 8B 58 20 33 58 18 48 8D 56 08)
alloc(ResourceMem,128,"F1_2019_dx12.exe"+7812021)
label(Return)
label(Code)
label(AddCode)
label(SubtractCode)
label(AddResource)
registersymbol(AddResource)
registersymbol(ResourceAOB)

ResourceMem:
  cmp dword ptr [AddResource+0C],0
  je AddCode
  mov ebx,[AddResource+0C]
  mov [AddResource+4],0
  mov [AddResource+8],0
  mov [AddResource+0C],0
  xor ebx,[rax+20]
  mov [rax+18],ebx
  jmp Code

AddCode:
  cmp dword ptr [AddResource+4],0
  je SubtractCode
  mov ebx,[rax+20]
  xor ebx,[rax+18]
  add ebx,[AddResource+4]
  mov [AddResource+4],0
  mov [AddResource+8],0
  mov [AddResource+0C],0
  xor ebx,[rax+20]
  mov [rax+18],ebx
  jmp Code

SubtractCode:
  cmp dword ptr [AddResource+8],0
  je Code
  mov ebx,[rax+20]
  xor ebx,[rax+18]
  sub ebx,[AddResource+8]
  mov [AddResource+4],0
  mov [AddResource+8],0
  mov [AddResource+0C],0
  xor ebx,[rax+20]
  mov [rax+18],ebx

Code:
  mov ebx,[rax+20]
  xor ebx,[rax+18]
  mov [AddResource],ebx
  jmp Return

AddResource:
  dd 0

ResourceAOB:
  jmp ResourceMem
  nop
Return:

[DISABLE]
ResourceAOB:
  mov ebx,[rax+20]
  xor ebx,[rax+18]
unregistersymbol(AddResource)
unregistersymbol(ResourceAOB)
dealloc(ResourceMem)"""

