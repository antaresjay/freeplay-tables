aobScanRegion(FuelAOB, F1_2019_dx12.exe+1400000, F1_2019_dx12.exe+14FFFFF, 32 C8 F3 0F 5C C3)
alloc(FuelMem,256,"F1_2019_dx12.exe"+14E07A5)
label(Return)
label(CPUCode)
label(OriginalCode)
label(FuelRate)
label(FuelCPURate)
registersymbol(FuelRate)
registersymbol(FuelCPURate)
registersymbol(FuelAOB)

FuelMem:
  push rsi
  mov rsi,[rbx+8]
  cmp dword ptr [rsi+F0],1
  je CPUCode
  lea rsi,[rbx+100]
  mov [FuelRate+10],rsi
  mulss xmm3,[FuelRate]
  jmp OriginalCode

CPUCode:
  mulss xmm3,[FuelCPURate]

OriginalCode:
  pop rsi
  xor cl,al
  subss xmm0,xmm3
  jmp Return

FuelRate:
  dd 3F800000

FuelCPURate:
  dd 3F800000

FuelAOB:
  jmp FuelMem
  nop
Return:

[DISABLE]
FuelAOB:
  db 32 C8 F3 0F 5C C3
unregistersymbol(FuelRate)
unregistersymbol(FuelCPURate)
unregistersymbol(FuelAOB)
dealloc(FuelMem)"""

