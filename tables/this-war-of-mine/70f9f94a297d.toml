[[cheat]]
id = "day-time-base-address-scan-to-update-day"
name = "Day Time Base Address Scan (To Update: Day)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(daytime_savedAOB)
label(daytime_returnhere)
label(daytime_originalcode)
label(daytime_exit)

label(daytime_update_exit)
label(daytime_set_exit)

registersymbol(daytime_savedAOB)

//This War of Mine.exe+2AE0B5 - 83 C0 18              - add eax,18
//This War of Mine.exe+2AE0B8 - A3 88BC7500           - mov ["This War of Mine.exe"+5CBC88],eax
//This War of Mine.exe+2AE0BD - D9 41 10              - fld dword ptr [ecx+10]
//This War of Mine.exe+2AE0C0 - 56                    - push esi
//This War of Mine.exe+2AE0C1 - D9E8                  - fld1
//This War of Mine.exe+2AE0C3 - 89 55 F8              - mov [ebp-08],edx
//This War of Mine.exe+2AE0C6 - D8E1                  - fsub st(0),st(1)
//This War of Mine.exe+2AE0C8 - 57                    - push edi
aobscan(daytime_searchedAOB, D9 41 10 56 D9 E8 89 55 F8)

alloc(daytime_newmem, 2048)


daytime_newmem:
cmp dword ptr [daytime_update_enable], #0
je daytime_update_exit
mov [daytime_basepointer], ecx
daytime_update_exit:

cmp dword ptr [daytime_set_enable], #0
je daytime_set_exit
fld [daytime_set_value]
fstp [ecx+10]
daytime_set_exit:


daytime_originalcode:
db D9 41 10 56 D9 E8
//fld dword ptr [ecx+10]
//push esi
//fld1


daytime_exit:
jmp daytime_returnhere


daytime_searchedAOB:
daytime_savedAOB:
jmp daytime_newmem
nop
daytime_returnhere:


[DISABLE]
daytime_savedAOB:
db D9 41 10 56 D9 E8
//fld dword ptr [ecx+10]
//push esi
//fld1

unregistersymbol(daytime_savedAOB)

dealloc(daytime_newmem)"""

