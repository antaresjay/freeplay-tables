[[cheat]]
id = "all-soldier-stats-chance-in-script"
name = "All Soldier Stats - [ Chance In Script ]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : One Military Camp.exe
  Version: 
  Date   : 2023-03-03
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(pData_PersistentDataAllSoldier,GameAssembly.dll,F3 ?? ?? ?? ?? 83 ?? ?? ?? ?? ?? ?? 75 ?? 48 8B ?? E8 ?? ?? ?? ?? 48 8B ?? ?? ?? ?? ?? 48 8B ?? ?? ?? ?? ?? 33 ?? F3 ?? ?? ?? ?? ?? ?? ?? 0F 2F ?? 0F 97 ?? 3B ?? 74 ?? 48 8B ?? ?? 48 85 ?? 74 ?? 33 ?? E8 ?? ?? ?? ?? 48 8B ?? ?? ?? 0F 28 ?? ?? ?? 0F 28 ?? ?? ?? 48 83 ?? ?? 5F) // should be unique
alloc(newmem,$100,pData_PersistentDataAllSoldier)

label(code)
label(return)

newmem:
  mov [rcx+60],(float)1            //Health
  mov [rcx+64],(float)1            //Motivation
  mov [rcx+68],(float)1            //Stamina
  mov [rcx+6C],(float)0            //Hunger
  mov [rcx+70],(float)1            //Accuracy
  mov [rcx+74],(float)1            //Intelligence
  mov [rcx+78],(float)1            //Speed
  mov [rcx+7C],(float)1            //Strength

code:
  movss xmm6,[rcx+60]
  jmp return

pData_PersistentDataAllSoldier:
  jmp newmem
return:
registersymbol(pData_PersistentDataAllSoldier)

[DISABLE]

pData_PersistentDataAllSoldier:
  db F3 0F 10 71 6C

unregistersymbol(*)
dealloc(*)"""

