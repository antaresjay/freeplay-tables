type = "script"
source = """
{ Game   : SkyrimSE.exe
  Version: 
  Date   : 2021-12-27
}

[ENABLE]

aobscanmodule(plDArray,SkyrimSE.exe,48 8B 49 30 48 63 C2 48 8D 15 * * * * 8B 14 82 8B 04 D1 41 89 00)
registersymbol(plDArray)

aobscanmodule(maxhpinj,SkyrimSE.exe,48 8B 41 30 F3 0F 11 14 D0 C6 44 D0 04 00 C3)
registersymbol(maxhpinj)

alloc(newmem,$1000,plDArray)

label(hiahf42)
registersymbol(hiahf42)
label(retDA)
label(retmhp)

newmem:
  mov eax,[rcx+rdx*8]
  cmp rsi,20
  jne short @f
  lea rcx,[rcx]
  mov [hiahf42],rcx
  mov [hiahf42+8],rdi
  mov eax,(float)9000 // rsi,20 = max carry weight
@@:
  cmp [hiahf42],rcx
  jne short @f
  cmp rdx,3
  jne short @f
  lea rcx,[rcx]
  and [rdi+180],0 // godmode
@@:
  mov [r8],eax
  jmp retDA

maxhpmem:
  cmp [hiahf42],rax
  jne short @f
  cmp rdx,3
  jne short @f
  lea rdx,[rdx]
  mov [rax+rdx*8],(float)9999
  movss xmm2,[rax+rdx*8]
  mov byte ptr [rax+rdx*8+04],00
  ret
@@:
  movss [rax+rdx*8],xmm2
  mov byte ptr [rax+rdx*8+04],00
  ret

hiahf42:


maxhpinj+4:
  jmp maxhpmem
retmhp:

plDArray+11:
  jmp newmem
  nop
retDA:

