[[cheat]]
id = "godmode"
name = "Godmode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : EarthsDawn.exe
  Version: 
  Date   : 2016-12-08
  Author : MakeGameGreatAgain
}

[ENABLE]

aobscan(Godmode,89 87 30 03 00 00 C7) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(player)
label(npc)

newmem:

player:
  cmp [edi+00000320],(int)5
  jne npc
  mov [edi+00000330],(int)1000
  jmp return

npc:
  cmp [edi+00000320],0
  jne code
  mov [edi+00000330],0
  jmp return

code:
  mov [edi+00000330],eax
  jmp return

Godmode:
  jmp player
  db 90
return:
registersymbol(Godmode)

[DISABLE]

Health:
  db 89 87 30 03 00 00

unregistersymbol(Godmode)
dealloc(newmem)"""

