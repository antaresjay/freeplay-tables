type = "script"
source = """
[ENABLE]

aobscanregion(Money_AOB,View.UiHelpers.BuildingButton:Update,View.UiHelpers.BuildingButton:Update+25d,48 63 49 70 48 63 96 9C 00 00 00) // should be unique
alloc(newmem,$1000,Money_AOB)

label(code)
label(return)

newmem:

code:
  mov [rcx+70],#777777
  movsxd  rcx,dword ptr [rcx+70]
  movsxd  rdx,dword ptr [rsi+0000009C]
  jmp return

Money_AOB:
  jmp newmem
  nop 6
return:
registersymbol(Money_AOB)

[DISABLE]

Money_AOB:
  db 48 63 49 70 48 63 96 9C 00 00 00

unregistersymbol(Money_AOB)
dealloc(newmem)"""
