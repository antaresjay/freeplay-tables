category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : NoVacationForAnExecutioner.exe
// Author            : ndck76
// Executable Version: 2021.3.24.4316
// Game Version      : v1.21
// Script Date       : 2026-04-01


[ENABLE]

aobscanregion(hp1,MainProtagonistControl:InjureJudgement,MainProtagonistControl:InjureJudgement+300,F30F1080xxxx0000F3xxxxxx48B8xxxxxxxxxxxx0000F3xxxxxxF3xxxxxxF3xxxxxxxxxxF3xxxxxxF2xxxxxx66xxxxxx) //MainProtagonistControl:InjureJudgement+19a
alloc(newmem,$1000,hp1)
alloc(data,8)
alloc(hp1bkp,8)
registersymbol(data)
registersymbol(hp1)
registersymbol(hp1bkp)
label(code)
label(return)

hp1bkp:
  readmem(hp1,8)

newmem:
  mov [data],rax

code:
  readmem(hp1,8)
  jmp return

hp1:
  jmp newmem
  nop 3
return:

[DISABLE]

hp1:
  readmem(hp1bkp,8)

unregistersymbol(*)
dealloc(*)"""

