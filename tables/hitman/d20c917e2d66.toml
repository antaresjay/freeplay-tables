id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(ammo,hitman.exe,8B 45 40 01 45 C8)
alloc(newmem,$1000,"hitman.exe"+92C766)

label(code)
label(return)

newmem:
code:
  xor eax, eax
  mov [rbp-38], #999
  jmp return

ammo:
  jmp newmem
  nop
return:
registersymbol(ammo)

[DISABLE]

ammo:
  db 8B 45 40 01 45 C8

unregistersymbol(ammo)
dealloc(newmem)"""
