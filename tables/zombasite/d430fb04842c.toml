registersymbol(itemsstats_quantityset_enable)

alloc(itemsstats_basepointer, 4)
alloc(itemsstats_update_enable, 4)
alloc(itemsstats_durabilityset_enable, 4)
alloc(itemsstats_quantityset_enable, 4)


[DISABLE]
