[[cheat]]
id = "items-stats-base-address-scan-to-update-play-level"
name = "Items Stats Base Address Scan (To Update: Play Level)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(itemsstats_savedAOB)
label(itemsstats_returnhere)
label(itemsstats_originalcode)
label(itemsstats_exit)

label(itemsstats_update_exit)
label(itemsstats_durabilityset_exit)
label(itemsstats_quantityset_exit)

registersymbol(itemsstats_originalcode)
registersymbol(itemsstats_savedAOB)

//Zombasite.exe+231238 - 8B CE                 - mov ecx,esi
//Zombasite.exe+23123A - E8 01E4DFFF           - call Zombasite.exe+2F640
// Accesses Quantity
//Zombasite.exe+23123F - 8B 97 00050000        - mov edx,[edi+00000500]
//Zombasite.exe+231245 - 52                    - push edx
//Zombasite.exe+231246 - 56                    - push esi
//Zombasite.exe+231247 - B1 01                 - mov cl,01
//Zombasite.exe+231249 - B8 20000000           - mov eax,00000020
aobscan(itemsstats_searchedAOB, 8B 97 00 05 00 00 52 56)

alloc(itemsstats_newmem, 2048, itemsstats_searchedAOB)
alloc(itemsstats_temp1, 4, itemsstats_searchedAOB)
alloc(itemsstats_temp2, 4, itemsstats_searchedAOB)
alloc(itemsstats_temp3, 4, itemsstats_searchedAOB)
alloc(itemsstats_temp4, 4, itemsstats_searchedAOB)
alloc(itemsstats_temp5, 4, itemsstats_searchedAOB)


itemsstats_newmem:
mov [itemsstats_temp1], eax
mov [itemsstats_temp2], ebx
mov [itemsstats_temp3], ecx
mov [itemsstats_temp4], edx

cmp dword ptr [itemsstats_update_enable], #0
je itemsstats_update_exit
mov [itemsstats_basepointer], edi
itemsstats_update_exit:

cmp dword ptr [itemsstats_durabilityset_enable], #0
je itemsstats_durabilityset_exit
mov ebx, [edi+1f8]
mov [edi+1f4], ebx
itemsstats_durabilityset_exit:

cmp dword ptr [itemsstats_quantityset_enable], #0
je itemsstats_quantityset_exit
mov ebx, [edi+2dc]
add ebx, [edi+2e0]
// $$DoorName1$$
cmp ebx, #3499267731
je itemsstats_quantityset_exit
// $$GuardItem$$
cmp ebx, #3198916229
je itemsstats_quantityset_exit
cmp dword ptr [edi+52c], #1
je itemsstats_quantityset_exit
mov ebx, [edi+52c]
shr ebx
mov [edi+500], ebx
itemsstats_quantityset_exit:

mov eax, [itemsstats_temp1]
mov ebx, [itemsstats_temp2]
mov ecx, [itemsstats_temp3]
mov edx, [itemsstats_temp4]


itemsstats_originalcode:
readmem(itemsstats_searchedAOB, 6)


itemsstats_exit:
jmp itemsstats_returnhere


itemsstats_searchedAOB:
itemsstats_savedAOB:
jmp itemsstats_newmem
nop
itemsstats_returnhere:


[DISABLE]
itemsstats_savedAOB:
readmem(itemsstats_originalcode, 6)

unregistersymbol(itemsstats_originalcode)
unregistersymbol(itemsstats_savedAOB)

dealloc(itemsstats_newmem)
dealloc(itemsstats_temp1)
dealloc(itemsstats_temp2)
dealloc(itemsstats_temp3)
dealloc(itemsstats_temp4)
dealloc(itemsstats_temp5)"""

