[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobScanModule(CHook1, tennis2.exe, 48 83 C0 10 49 03 C3 44 39 10)
aobScanModule(CHook2, tennis2.exe, 8B 81 0C 02 00 00 C3 CC)
registersymbol(CHook1)
registersymbol(CHook2)

alloc(CMem, 128, "tennis2.exe"+89A8F8)
label(pPlayerInfo)
label(pAttributes)
label(pSkills)
label(pSkillsCap)
label(pMoney)
label(MCode)
label(CReturn1)
label(CReturn2)
registersymbol(pPlayerInfo)
registersymbol(pAttributes)
registersymbol(pSkills)
registersymbol(pSkillsCap)
registersymbol(pMoney)

CMem:
  add rax,10
  add rax,r11
  mov [pPlayerInfo],rax
  lea rbx,[rax+75]
  mov [pAttributes],rbx
  lea rbx,[rax+8E]
  mov [pSkills],rbx
  lea rbx,[rax+2B8F53]
  mov [pSkillsCap],rbx
  jmp CReturn1

MCode:
  lea rax,[rcx+0000020C]
  mov [pMoney],rax
  mov eax,[rax]
  jmp CReturn2

pPlayerInfo:
  dq 0

pAttributes:
  dq 0

pSkills:
  dq 0

pSkillsCap:
  dq 0

pMoney:
  dq 0

CHook1:
  jmp CMem
  db 90 90
CReturn1:

CHook2:
  jmp MCode
  db 90
CReturn2:

[DISABLE]

CHook1:
  db 48 83 C0 10 49 03 C3

CHook2:
  mov eax,[rcx+0000020C]

unregistersymbol(CHook1)
unregistersymbol(CHook2)
unregistersymbol(pPlayerInfo)
unregistersymbol(pAttributes)
unregistersymbol(pSkills)
unregistersymbol(pSkillsCap)
unregistersymbol(pMoney)
dealloc(CMem)"""

