id = "player-stats-database"
name = "Player Stats Database"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Connection.exe
  Version: 
  Date   : 2024-12-09
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(pData_PlayerStatDatabase,GameAssembly.dll,8B 57 20 49 8B 4A 40) // should be unique
alloc(newmem,$1000,pData_PlayerStatDatabase)

alloc(pBase_PlayerStatDatabase,8)
registersymbol(pBase_PlayerStatDatabase)

label(code)
label(return)

pBase_PlayerStatDatabase:
dd

newmem:

code:
  mov [pBase_PlayerStatDatabase],rdi
  db 8B 57 20 49 8B 4A 40
  mov rcx,[r10+40]
  jmp return

pData_PlayerStatDatabase:
  jmp newmem
  nop 2
return:
registersymbol(pData_PlayerStatDatabase pBase_PlayerStatDatabase)

[DISABLE]

pData_PlayerStatDatabase:
  db 8B 57 20 49 8B 4A 40

unregistersymbol(*)
dealloc(*)"""

