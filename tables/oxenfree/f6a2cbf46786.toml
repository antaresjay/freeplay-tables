[[cheat]]
id = "auto-tune-1"
name = "auto tune .1"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanregion(_fWriteInRadioSetFrequencyAOB,Radio:SetFrequency,Radio:SetFrequency+1c2,F3 0F 11 AE ** ** ** ** 48 ** ** ** 48)
registersymbol(_fWriteInRadioSetFrequencyAOB)

label(bAutoTuneMode)
registersymbol(bAutoTuneMode)
label(bAutoTuneImportantRadioSatation)
registersymbol(bAutoTuneImportantRadioSatation)
label(bAutoTuneAdlerClueStation)
registersymbol(bAutoTuneAdlerClueStation)
label(dAutoTuneSpeed)
registersymbol(dAutoTuneSpeed)

alloc(newmem,2048,_fWriteInRadioSetFrequencyAOB) //Radio:SetFrequency+76)
label(returnhere)
label(originalcode_autotune)
registersymbol(originalcode_autotune)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
//
sub rsp,10
movdqu dqword [rsp],xmm0
sub rsp,10
movdqu dqword [rsp],xmm1
//

//threshold cal
mov rax,dAutoTuneSpeed
movss xmm0,[rax+4]
xorps xmm1,xmm1
@@:
addss xmm1,xmm0
addss xmm0,[rax+8]
comiss xmm0,[rax+c]
jbe @b
//addss xmm1,xmm0
movss [rax+10],xmm1

//key pressed chk
cmp byte ptr [bAutoTuneAdlerClueStation],1
jne @f
//do adler clue station
mov eax,(float)140.1
movd xmm0,eax
comiss xmm0,[rsi+e8]
ja end
jmp doautotune

@@:
cmp byte ptr [bAutoTuneImportantRadioSatation],1
jne keyschkend
//do important radio station
mov rax,[rsi+b0]
test rax,rax
jnz @f
cmp byte ptr [bAutoTuneMode],1
jne end

mov eax,(float)140.1
movd xmm0,eax
comiss xmm0,[rsi+e8]
ja end
jmp doautotune

@@:
movss xmm0,[rax+54]
jmp doautotune

keyschkend:
jmp end

doautotune:
mov rax,dAutoTuneSpeed
comiss xmm5,xmm0
jb incr_f
ja decr_f
je end

incr_f:
addss xmm5,[rax]

movss xmm1,xmm0
subss xmm1,[rax+10]
movss [rax+14],xmm1
comiss xmm5,xmm1
jb @f
//autotune speed down
call cautotunespeeddown
jmp incr_f_end

@@:
//autotune speed up
call cautotunespeedup

incr_f_end:
comiss xmm5,xmm0
jb end
movss xmm5,xmm0
movss xmm1,[rax+4]
movss [rax],xmm1
jmp end

//
decr_f:
subss xmm5,[rax]

movss xmm1,xmm0
addss xmm1,[rax+10]
movss [rax+14],xmm1
comiss xmm5,xmm1
ja @f
//autotune speed down
call cautotunespeeddown
jmp decr_f_end

@@:
//autotune speed up
call cautotunespeedup

decr_f_end:
comiss xmm5,xmm0
ja end
movss xmm5,xmm0
movss xmm1,[rax+4]
movss [rax],xmm1
jmp end

end:
//
movdqu xmm1,dqword [rsp]
add rsp,10
movdqu xmm0,dqword [rsp]
add rsp,10
//

originalcode_autotune:
readmem(_fWriteInRadioSetFrequencyAOB,8)
//movss [rsi+000000F0],xmm5

exit:
jmp returnhere

///
cautotunespeedup:
movss xmm1,[rax+8]
addss xmm1,[rax]
movss [rax],xmm1
movss xmm1,[rax+c]
comiss xmm1,[rax]
jae @f
movss [rax],xmm1
@@:
ret
///
cautotunespeeddown:
movss xmm1,[rax]
subss xmm1,[rax+8]
movss [rax],xmm1
movss xmm1,[rax+4]
comiss xmm1,[rax]
jbe @f
movss [rax],xmm1
@@:
ret
///

///
bAutoTuneMode:
dd 1
bAutoTuneImportantRadioSatation:
dd 0
bAutoTuneAdlerClueStation:
dd 0
dAutoTuneSpeed:
dd (float)0.1            //+0,  current
dd (float)0.1            //+4,  base
dd (float)0.005          //+8,  interval
dd (float)0.5            //+c,  max
dd 0                     //+10, threshold placeholder
///

_fWriteInRadioSetFrequencyAOB: //Radio:SetFrequency+76:
jmp newmem
nop
nop
nop
returnhere:




[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
_fWriteInRadioSetFrequencyAOB: //Radio:SetFrequency+76:
readmem(originalcode_autotune,8)
//db F3 0F 11 AE F0 00 00 00
//Alt: movss [rsi+000000F0],xmm5

unregistersymbol(originalcode_autotune)
unregistersymbol(bAutoTuneMode)
unregistersymbol(bAutoTuneImportantRadioSatation)
unregistersymbol(bAutoTuneAdlerClueStation)
unregistersymbol(dAutoTuneSpeed)"""

