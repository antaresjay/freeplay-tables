  This script does blah blah blah
}

[ENABLE]

aobscanregion(aobCon,ConsoleCommands:Update,ConsoleCommands:Update+50,48 B8) // should be unique
alloc(newmem,$1000,aobCon)
//
aobscanregion(aobConOpen,DevConsole:Console:Open,DevConsole:Console:Open+5,55)
aobscanregion(aobConClose,DevConsole:Console:Close,DevConsole:Console:Close+5,55)
//
label(code)
label(return)

alloc(staticAdd,10)
registersymbol(staticAdd)

label(dConTrigger)
registersymbol(dConTrigger)

staticAdd:
readmem(aobCon,10)

label(openCon)
label(closeCon)

newmem:

code:
  db 48 B8
  readmem(aobCon+2,8)

  push rax
  xor rax,rax
  mov eax,[dConTrigger]
  cmp eax,1
  je openCon
  cmp eax,2
  je closeCon
  pop rax
  jmp return

  openCon:
  pop rax
  sub rsp,20
  mov r11,aobConOpen
  call r11
  add rsp,20
  mov [dConTrigger],0
  jmp return

  closeCon:
  pop rax
  sub rsp,20
  mov r11,aobConClose
  call r11
  add rsp,20
  mov [dConTrigger],0
  jmp return

dConTrigger:
dd 0

aobCon:
  jmp newmem
  nop 5
return:
registersymbol(aobCon)

[DISABLE]

aobCon:
readmem(staticAdd,10)

unregistersymbol(aobCon)
dealloc(newmem)

