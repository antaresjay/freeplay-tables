[[cheat]]
id = "immune-to-damage"
name = "Immune To Damage"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
//Send@Sintrix
[ENABLE]

aobscanregion(immunetodamage,Player_Stats:ApplyStatChanges,Player_Stats:ApplyStatChanges+c8,0F B6 40 1A 85 C0)
alloc(newmem,$1000,immunetodamage)

label(code)
label(return)

newmem:
mov [rax+1A],1

code:
  movzx eax,byte ptr [rax+1A]
  test eax,eax
  jmp return

immunetodamage:
  jmp newmem
  nop
return:
registersymbol(immunetodamage)

[DISABLE]

immunetodamage:
  db 0F B6 40 1A 85 C0

unregistersymbol(*)
dealloc(*)"""

