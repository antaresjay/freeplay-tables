[[cheat]]
id = "infinite-energy"
name = "Infinite Energy"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanregion(Energy,MyData:UpdateStatus+1ed,MyData:UpdateStatus+1fc,89 48 50 48 8B 47 40)
alloc(newmem,$1000,Energy)
label(return code)
registersymbol(Energy)
newmem:
code:
  mov ecx,[rax+F8]
  mov [rax+50],ecx
  mov rax,[rdi+40]
  jmp return

Energy:
  jmp newmem
  nop 2
return:

[DISABLE]
Energy:
  db 89 48 50 48 8B 47 40
unregistersymbol(Energy)
dealloc(newmem)
{//AoB Scanning
MyData:UpdateStatus+1e3 - 48 8B C8              - mov rcx,rax
MyData:UpdateStatus+1e6 - 48 8B 85 28FFFFFF     - mov rax,[rbp-000000D8]
MyData:UpdateStatus+1ed - 89 48 50              - mov [rax+50],ecx
MyData:UpdateStatus+1f0 - 48 8B 47 40           - mov rax,[rdi+40]
MyData:UpdateStatus+1f4 - 48 8B 4F 40           - mov rcx,[rdi+40]
MyData:UpdateStatus+1f8 - 48 63 49 54           - movsxd  rcx,dword ptr [rcx+54]
MyData:UpdateStatus+1fc - 41 B8 01000000        - mov r8d,00000001
MyData:UpdateStatus+202 - BA 01000000           - mov edx,00000001

}"""
