livesstats_originalcode:
db 8B 48 0C 49 89 48 0C
//mov ecx,[eax+0C]
//dec ecx
//mov [eax+0C],ecx


livesstats_exit:
jmp livesstats_returnhere


livesstats_searchedAOB:
livesstats_savedAOB:
jmp livesstats_newmem
nop
nop
livesstats_returnhere:


[DISABLE]
livesstats_savedAOB:
db 8B 48 0C 49 89 48 0C
//mov ecx,[eax+0C]
//dec ecx
//mov [eax+0C],ecx

unregistersymbol(livesstats_savedAOB)

dealloc(livesstats_newmem)"""

