[[cheat]]
id = "infinite-shield"
name = "Infinite Shield"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(shield,MassEffect1.exe,0F 2F BB A8 01 00 00 77) // should be unique
alloc(newmem,$1000,shield)

label(code)
label(return)

newmem:
  cmp [rbx+68], 00
  jne code

  movss [rbx+000001A8], xmm0

code:
  comiss xmm7,[rbx+000001A8]
  jmp return

shield:
  jmp newmem
  nop 2
return:
registersymbol(shield)

[DISABLE]

shield:
  db 0F 2F BB A8 01 00 00

unregistersymbol(shield)
dealloc(newmem)"""
