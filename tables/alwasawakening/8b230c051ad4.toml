[[cheat]]
id = "fly"
name = "fly"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
define(upforce,(float)6.3)
define(downforce,(float)-6.3)

aobscan(verticalForceReadAOB,8B 54 03 04 89 57 44 8B 46 18)
registersymbol(verticalForceReadAOB)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
cmp [edi+8c],40000000
jne originalcode

pushad
push 20      //SPACEBAR
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne originalcode

pushad
push 'W'
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne @f
mov edx,upforce
jmp originalcode

@@:
pushad
push 'S'
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne @f
mov edx,downforce
jmp originalcode

@@:
test edx,edx
jge @f
xor edx,edx

originalcode:
mov [edi+44],edx
mov eax,[esi+18]

exit:
jmp returnhere

///

verticalForceReadAOB+4: //"AlwasAwakening.exe"+3D8C0A:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
verticalForceReadAOB+4: //"AlwasAwakening.exe"+3D8C0A:
db 89 57 44 8B 46 18
//Alt: mov [edi+44],edx
//Alt: mov eax,[esi+18]"""

