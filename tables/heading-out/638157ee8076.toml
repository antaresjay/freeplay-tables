[[cheat]]
id = "map-controller-ctrl-numpad-3-will-populate-at-the-map-area"
name = "Map Controller (Ctrl + Numpad 3) {Will populate at the map area}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Heading Out.exe
// Author            : ndck76
// Executable Version: 2021.3.26.28099
// Game Version      : v0.885
// Script Date       : 2024-05-08


[ENABLE]

aobscanmodule(focuslastvalue,GameAssembly.dll,) //vp.MapController.Update
alloc(newmem,$1000,focuslastvalue)
alloc(data3,8)
alloc(focuslastvaluebkp,7)
registersymbol(data3)
registersymbol(focuslastvalue)
registersymbol(focuslastvaluebkp)
label(code)
label(return)

focuslastvaluebkp:
  readmem(focuslastvalue,7)

newmem:
  mov [data3],rcx

code:
  readmem(focuslastvalue,7)
  jmp return

focuslastvalue:
  jmp newmem
  nop 2
return:

[DISABLE]

focuslastvalue:
  readmem(focuslastvaluebkp,7)

unregistersymbol(*)
dealloc(*)"""

