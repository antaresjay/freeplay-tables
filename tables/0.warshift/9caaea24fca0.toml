dd 0,0

label(_done)
__+3810: // in eax out eax
mov dword ptr[__+37f8],1

push edi
push esi
push ecx
mov  esi,eax
mov  [__+3808],esi
mov  edi,[__+3800]
call _tagCompare
test eax,eax
jne  _done
mov  edi,[__+3804]
call _tagCompare
_done:
pop  ecx
pop  esi
pop  edi
ret
