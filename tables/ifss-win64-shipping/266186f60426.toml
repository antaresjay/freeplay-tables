type = "script"
source = """
[ENABLE]

aobscanmodule(ppcharacter,IFSS-Win64-Shipping.exe,4C 8B B9 D8 02 00 00 33 F6 4C 89 60 08 48 8B DA) // should be unique
alloc(newmem,$1000)
alloc(playerstats,8)
registersymbol(playerstats)
alloc(player_pointer,8)

label(Max_HP)
label(Max_Stamina)
label(Max_Oxygen)
label(Max_Hunger)
label(Max_Thirsty)
label(hotresistance)
label(Pollution_Level)

registersymbol(player_pointer)
registersymbol(Max_HP)
registersymbol(Max_Stamina)
registersymbol(Max_Oxygen)
registersymbol(Max_Hunger)
registersymbol(Max_Thirsty)
registersymbol(hotresistance)
registersymbol(Pollution_Level)

newmem:

  mov r15,[rcx+8D0] // BP_IFSS_PlayerControll/IFSSPlayerManagerComponent
  test r15,r15
  je skip_check
  mov [playerstats],r15

  mov r15,[rcx+2E8] // BP_IFSS_PlayerControll/Character
  test r15,r15
  je skip_check
  mov [player_pointer],r15


  mov r15,[player_pointer]

skip_hp:
  cmp word ptr [Max_HP], 0
  je skip_stamina
  fld qword ptr [r15+000011F8]      // MaxHP
  fstp qword ptr [r15+000011F0]     // NowHP

skip_stamina:
  cmp word ptr [Max_Stamina], 0
  je skip_oxygen
  fld qword ptr [r15+00001208]      // MaxStamina
  fstp qword ptr [r15+00001200]     // NowStamina

skip_oxygen:
  cmp word ptr [Max_Oxygen], 0
  je skip_hunger
  fld qword ptr [r15+00001210]      // MaxOxygen
  fstp qword ptr [r15+00001218]     // NowOxygen

skip_hunger:
  cmp word ptr [Max_Hunger], 0
  je skip_thirsty
  fld qword ptr [r15+00001228]      // MaxHunger
  fstp qword ptr [r15+00001220]     // NowHunger

skip_thirsty:
  cmp word ptr [Max_Thirsty], 0
  je skip_hot
  fld qword ptr [r15+00001238]      // MaxThirsty
  fstp qword ptr [r15+00001230]     // NowThirsty

skip_hot:
  cmp word ptr [hotresistance], 0
  je skip_PollutionLevel
  movsd xmm0,[my_hot]      // HotResistance
  movsd [r15+2338], xmm0

skip_PollutionLevel:
  cmp word ptr [Pollution_Level], 0
  je skip_check
  movsd xmm0,[my_Pollution_Level]
  movsd [r15+22D8],xmm0

skip_check:
  mov r15,[rcx+000002D8] //  BP_IFSS_PlayerControll/Pawn
  xor esi,esi
  mov [rax+08],r12
  mov rbx,rdx
  jmp return

Max_HP:
  dw 0

Max_Stamina:
  dw 0

Max_Oxygen:
  dw 0

Max_Hunger:
  dw 0

Max_Thirsty:
  dw 0

my_hot:
 dq (double)45.0

hotresistance:
  dw 0

my_Pollution_Level:
  dq (double)0.0

Pollution_Level:
  dw 0

ppcharacter:
  jmp far newmem
  nop
  nop

return:

registersymbol(ppcharacter)


aobscanmodule(movment_animal_pointer,IFSS-Win64-Shipping.exe,48 8B 03 48 8D 4C 24 40 48 89 4C 24 38 44 0F 28 E0) // should be unique
alloc(newmem2,$1000)
alloc(movementspeedmulti,4)
alloc(animalspeedmulti,4)
alloc(instantkillmulti,4)

label(restore)
label(return2)
label(instantkill)


newmem2:
  sub rsp,20
  movsd [rsp],xmm1
  push rsi

  mov rax,player_pointer
  mov rax,[rax]
  test rax,rax
  je restore

  cmp [rax+00000328],rbx //Character Movment
  jne check_animals

// --- Player movement speed ---


  mulss xmm0,[movementspeedmulti]
  jmp restore

// Animals Pointer
  check_animals:
  mov rsi,[rbx+20]
  test rsi,rsi
  je restore

// --- Animal speed ---
  cmp byte ptr [rsi+00000718],01 //BP_IFSS_Character_Elk_C Is Alive
  jne restore
  mulss xmm0,[animalspeedmulti]

// --- Instantkill ---
  cmp dword ptr [instantkill],03
  jne restore
  movsd xmm1,[rsi+00000738] // NOW HP  //MAX HP
  mulsd xmm1,[instantkillmulti]
  minsd xmm1,[rsi+00000740]
  movsd [rsi+00000740],xmm1 // MAX HP  // NOW HP
  jmp restore


restore:
  pop rsi
  movsd xmm1,[rsp]
  add rsp,20
  mov rax,[rbx]
  lea rcx,[rsp+40]
  mov [rsp+38],rcx
  movaps xmm12,xmm0
  jmp return2

// ===== DATA =====
instantkill:
  dd 00

movementspeedmulti:
  dd (float)1.0

animalspeedmulti:
  dd (float)1.0

instantkillmulti:
  dq (double)0.05

// ===== INJECTION =====

movment_animal_pointer:
  jmp far newmem2
  nop
  nop
  nop
  return2:

registersymbol(movment_animal_pointer)
registersymbol(movementspeedmulti)
registersymbol(animalspeedmulti)
registersymbol(instantkillmulti)
registersymbol(instantkill)


[DISABLE]

ppcharacter:
  db 4C 8B B9 D8 02 00 00 33 F6 4C 89 60 08 48 8B DA

movment_animal_pointer:
db 48 8B 03 48 8D 4C 24 40 48 89 4C 24 38 44 0F 28 E0

unregistersymbol(player_pointer)
unregistersymbol(Max_HP)
unregistersymbol(Max_Stamina)
unregistersymbol(Max_Oxygen)
unregistersymbol(Max_Hunger)
unregistersymbol(Max_Thirsty)
unregistersymbol(ppcharacter)
unregistersymbol(playerstats)
unregistersymbol(movment_animal_pointer)
unregistersymbol(movementspeedmulti)
unregistersymbol(animalspeedmulti)
unregistersymbol(instantkillmulti)
unregistersymbol(instantkill)
unregistersymbol(hotresistance)
unregistersymbol(Pollution_Level)

dealloc(newmem)
dealloc(player_pointer)
dealloc(Max_HP)
dealloc(Max_Stamina)
dealloc(Max_Oxygen)
dealloc(Max_Hunger)
dealloc(Max_Thirsty)
dealloc(ppcharacter)
dealloc(playerstats)
dealloc(newmem2)
dealloc(movementspeedmulti)
dealloc(animalspeedmulti)
dealloc(instantkillmulti)
dealloc(instantkillmulti)
dealloc(Pollution_Level)

