[[cheat]]
id = "enable-damage-modifier-options-god-mode-one-hit-kill-etc"
name = "Enable Damage Modifier Options (God Mode, One Hit Kill, etc.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
///
aobscanmodule(DamageModAOB,$process,F3 0F 10 4B 48 F3 0F 2C 7B 6C F3 0F 5C CE F3 0F 58 C9) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,1024)

///
label(return)
label(DamageModAOBSave)
registersymbol(DamageModAOBSave)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fEnemyHealingMult)
registersymbol(fEnemyHealingMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(fHeroHealingMult)
registersymbol(fHeroHealingMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

///
newmem:
  readmem(DamageModAOB,5)
  mov [R12Save],r12
  mov [R13Save],r13
  mov [R14Save],r14
  mov [R15Save],r15
  mov r15,[rbx+20]
  cmp dword ptr [r15+328],0
  jne EnemyHit
HeroHit:
  // Search If Already In Ally ID List
  xor r12,r12
  xor r13,r13
  mov r13d,[rbx+0C]
  mov r14,AllyIDList
  mov r15,AllyPtrList
StartSearchAllyIDList:
  cmp r12,#64
  jg AllyNotFound
  cmp [r14+r12*8],r13
  je AllyFound
  inc r12d
  jmp StartSearchAllyIDList
AllyNotFound:
  // Search For Blank Spot In List
  xor r12,r12
StartSearchAllyIDList2:
  cmp r12,#64
  jg AllyListFull
  cmp [r14+r12*8],0
  je AllyNotFound2
  inc r12d
  jmp StartSearchAllyIDList2
AllyNotFound2:
  // Add To Ally ID List
  mov [r14+r12*8],r13
  mov r15,AllyPtrList
  mov [r15+r12*8],rbx
  mov r15,AllyPtrListMP1
  mov [r15+r12*8],rbx
  add [r15+r12*8],80
  jmp DoHeroHit
AllyListFull:
AllyFound:
DoHeroHit:
  comiss xmm6,[fZeroFloat]
  jb HeroHealingHit
  ja HeroDamageHit
  jmp MyCleanUp1
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  mulss xmm6,[fHeroDamageMult]
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xorps xmm6,xmm6
  jmp MyCleanUp1
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne MyCleanUp1
  comiss xmm6,xmm1
  jb @F
  xorps xmm6,xmm6
@@:
  jmp MyCleanUp1  
HeroHealingHit:
  cmp [fHeroHealingMult],(float)0.0
  je MyCleanUp1
  mulss xmm6,[fHeroHealingMult]
  jmp MyCleanUp1
EnemyHit:
  comiss xmm6,[fZeroFloat]
  jb EnemyHealingHit
  ja EnemyDamageHit
  jmp CheckOneHitKill
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckOneHitKill
  mulss xmm6,[fEnemyDamageMult]
CheckOneHitKill:
  cmp [OneHitKill],1
  jne MyCleanUp1
  movss xmm6,xmm1 
  jmp MyCleanUp1
EnemyHealingHit:
  cmp [fEnemyHealingMult],(float)0.0
  je MyCleanUp1
  mulss xmm6,[fEnemyHealingMult]

MyCleanUp1:  
  mov r12,[R12Save]
  mov r13,[R13Save]
  mov r14,[R14Save]
  mov r15,[R15Save]
DamageModAOBSave:
  readmem(DamageModAOB,18)
  jmp DamageModAOB+12

R12Save:
dq 0
R13Save:
dq 0
R14Save:
dq 0
R15Save:
dq 0
fZeroFloat:
dq (float)0
GodMode:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)2.0
fEnemyHealingMult:
dq (float)0.25
fHeroDamageMult:
dq (float)0.25
fHeroHealingMult:
dq (float)2.0
HeroCannotDie:
dq 1

///
DamageModAOB:
  jmp newmem
return:

[DISABLE]

DamageModAOB:
  readmem(DamageModAOBSave,18)

///
unregistersymbol(DamageModAOB)
unregistersymbol(DamageModAOBSave)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fEnemyHealingMult)
unregistersymbol(fHeroDamageMult)
unregistersymbol(fHeroHealingMult)

///
dealloc(newmem)"""

