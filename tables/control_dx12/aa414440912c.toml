[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(health,Control_DX12.exe,F3 0F 10 49 64 0F)
alloc(newmem,$1000,health)

label(code)
label(return)

newmem:
cmp [rcx+b4],0
jne @f


mov [rcx+64],(float)1
code:
movss xmm1,[rcx+64]
jmp return

health:
jmp newmem
return:
registersymbol(health)

[DISABLE]

health:
db F3 0F 10 49 64

unregistersymbol(health)
dealloc(newmem)"""

[[cheat]]
id = "no-reload"
name = "No Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]



aobscanmodule(reload_Aob,Control_DX12.exe,F3 0F 11 99 A8 01 00 00 48) // should be unique
alloc(newmem,$1000,reload_Aob)

label(code)
label(return)

newmem:

code:
  movss [rcx+000001A8],xmm2
  jmp return

reload_Aob:
  jmp newmem
  nop 3
return:
registersymbol(reload_Aob)

[DISABLE]

reload_Aob:
  db F3 0F 11 99 A8 01 00 00

unregistersymbol(reload_Aob)
dealloc(newmem)"""
