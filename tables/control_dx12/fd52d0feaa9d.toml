[[cheat]]
id = "battle"
name = "Battle"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Control_DX12.exe
  Version: 0.0.344.1879 (FINAL|release)
  Date   : 2022-01-05
  Author : Argaricolm

  This script will disable health decrease for user (not affecting other)
}

[ENABLE]
aobscanmodule(userstruct,Control_DX12.exe,48 8B 45 58 0F 57 C0) // should be unique
aobscanmodule(decreasehealth,Control_DX12.exe,40 53 48 83 EC 40 0F 29 74 24 30 0F 28 D1) // should be unique
alloc(newmem,$1000,userstruct)
registersymbol(OHK)
registersymbol(God)

label(code)
label(return)
label(user)
label(OHK)
label(God)
label(MinusOne)
label(Zero)

newmem:

code:
  mov rax,[rbp+58]
  mov [user],rax
  xorps xmm0,xmm0
  jmp return
user:
db 00 00 00 00 00 00 00 00
OHK:
db 00 00 00 00
God:
db 00 00 00 00
MinusOne:
dd (float)-1
Zero:
dd (float)0

userstruct:
  jmp newmem
  nop 2
return:
registersymbol(userstruct)

alloc(newmem2,$1000,decreasehealth)

label(code2)
label(return2)
label(dont)
label(normal)
label(notgod)

newmem2:

code2:
  push rbx
  sub rsp,40
  comiss xmm1,[Zero]
  jae return2
  push rax
  cmp [God],1
  jnz notgod
  mov rax,[user]
  test rax,rax
  jz normal
  cmp rax,rcx
  jz dont
notgod:
  mov al,[OHK]
  cmp al,0
  jz normal
  movss xmm1,[MinusOne]
normal:
  pop rax
  jmp return2
dont:
  comiss xmm1,[Zero]
  jae normal
  movss xmm1,[Zero]
  pop rax
  jmp return2
decreasehealth:
  jmp newmem2
  nop 1
return2:
registersymbol(decreasehealth)

[DISABLE]

userstruct:
  db 48 8B 45 58 0F 57 C0

decreasehealth:
  db 40 53 48 83 EC 40 0F 29 74 24 30 0F 28 D1

unregistersymbol(userstruct)
unregistersymbol(decreasehealth)
unregistersymbol(OHK)
unregistersymbol(God)
dealloc(newmem)
dealloc(newmem2)

{
Tech info:
After health is found we seek for its pointer with smallest number of offsets.
Then we check what addresses access pointer with one offset lower (most likely user strucure)
and look which one access only it.
Then we use founded code to store user struct offset. This is done in "newmem".
newmem2 redirects the start of health change function.
Health change can be found by looking what access health.
It is done by this code:
Control_DX12.exe+324875 - F3 41 0F5C C1         - subss xmm0,xmm9
Control_DX12.exe+32487A - 0F28 F0               - movaps xmm6,xmm0
Control_DX12.exe+32487D - 0F28 C7               - movaps xmm0,xmm7
Control_DX12.exe+324880 - F3 0F5F F7            - maxss xmm6,xmm7
Control_DX12.exe+324884 - F3 0F5D F3            - minss xmm6,xmm3
Control_DX12.exe+324888 - F3 0F11 73 64         - movss [rbx+64],xmm6 //decrease health and enemies

At start of the function xmm1 register contains info for how much to change health.
Code here checks if user health is about to be decreased and changes xmm1 to 0.
If else, then to -1. -1 means - decrease health fully where full health is equal to 1.
If xmm1 > 0 then we do nothing.
}"""

