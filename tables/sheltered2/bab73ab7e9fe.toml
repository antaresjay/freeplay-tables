[[cheat]]
id = "sheltered-2-chargen-script"
name = "Sheltered 2 CharGen script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Sheltered2.exe
// Author            : Cs
// Executable Version: 2019.4.19.23316
// Module Version    : 
// Script Date       : 2021-09-21
// Created with      : customAOBInjectionTemplates version: 1.3.8
[ENABLE]
aobscan(aobCharStatsGrabber,48 63 80 ?? ?? 00 00 85 C0 41 0F 9F C7 4D 0F B6 FF)
aobscan(aobTraitsGrabber,48 8B F1 ?? 8B 4E 48 33 D2 48 8D 64 24 00 90)

alloc(newmemCharStatsGrabber,4096,aobCharStatsGrabber)

label(aobCharStatsGrabber_r)
label(aobCharStatsGrabber_i)
registersymbol(aobCharStatsGrabber_r)
registersymbol(aobCharStatsGrabber_i)

label(lblCharStatsGrabber)
label(lblCharStatsGrabberSkip)
label(lblCharStatsGrabberRet)

label(pCustomStats)
label(pCharAtts)
registersymbol(pCustomStats)
registersymbol(pCharAtts)

label(aobTraitsGrabber_r)
label(aobTraitsGrabber_i)
registersymbol(aobTraitsGrabber_r)
registersymbol(aobTraitsGrabber_i)

label(lblTraitsGrabber)
label(lblTraitsGrabberSkip)
label(lblTraitsGrabberRet)

label(pLeaderTraits)
registersymbol(pLeaderTraits)

newmemCharStatsGrabber:

lblCharStatsGrabber:
mov r15,[rax+20]
mov qword ptr [pCustomStats],rax
mov qword ptr [pCharAtts],r15
lblCharStatsGrabberSkip:
readmem(aobCharStatsGrabber,7)
jmp lblCharStatsGrabberRet
aobCharStatsGrabber_i:
readmem(aobCharStatsGrabber,7)
pCustomStats:
dq 0
pCharAtts:
dq 0

lblTraitsGrabber:
mov qword ptr [pLeaderTraits],rcx
mov rsi,[rcx+20]
mov rdx,pCharAtts
mov qword ptr [rdx],rsi
lblTraitsGrabberSkip:
readmem(aobTraitsGrabber,14)
jmp lblTraitsGrabberRet
aobTraitsGrabber_i:
readmem(aobTraitsGrabber,14)
pLeaderTraits:
dq 0

aobTraitsGrabber:
aobTraitsGrabber_r:
jmp lblTraitsGrabber
aobTraitsGrabber+0E:
lblTraitsGrabberRet:

aobCharStatsGrabber:
aobCharStatsGrabber_r:
jmp lblCharStatsGrabber
nop 2
lblCharStatsGrabberRet:

[DISABLE]
aobCharStatsGrabber_r:
readmem(aobCharStatsGrabber_i,7)

unregistersymbol(*)
dealloc(*)"""

