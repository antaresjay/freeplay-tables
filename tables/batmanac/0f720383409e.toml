[[cheat]]
id = "camera-pointers"
name = "Camera pointers"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(camerayreadAOB,8B 8E 78 0B 00 00 89 96 98 05 00 00)
registersymbol(camerayreadAOB)

label(pCamera)
registersymbol(pCamera)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
mov [pCamera],esi

originalcode:
mov ecx,[esi+00000B78]

exit:
jmp returnhere

///
pCamera:
dd 0
///

camerayreadAOB: //"BatmanAC.exe"+A3AFD4:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
camerayreadAOB: //"BatmanAC.exe"+A3AFD4:
db 8B 8E 78 0B 00 00
//Alt: mov ecx,[esi+00000B78]
unregistersymbol(camerayreadAOB)

unregistersymbol(pCamera)"""

