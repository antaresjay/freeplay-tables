[[cheat]]
id = "find-static-player-pointer-base-aob"
name = "Find Static Player Pointer Base AOB"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//"songbringer.exe"+14B335
aobscanmodule(PlayerPointerReadBaseAOB,"songbringer.exe",48 8B 3D ?? ?? ?? ?? 48 3B FE 0F 84)
alloc(relativeaddress, 8)

relativeaddress:
readmem(PlayerPointerReadBaseAOB+3,4)
registersymbol(relativeaddress)

define(PlayerPointerBaseAOB,PlayerPointerReadBaseAOB+[relativeaddress]+7)
unregistersymbol(relativeaddress)
dealloc(relativeaddress)
registersymbol(PlayerPointerBaseAOB)


[DISABLE]
unregistersymbol(PlayerPointerBaseAOB)"""

