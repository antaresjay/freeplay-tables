[[cheat]]
id = "health-ctrl-numpad-1-for-powerup-suit-only"
name = "Health (Ctrl + Numpad 1) {For PowerUp Suit only}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Metal Suits.exe
// Author            : ndck76
// Executable Version: 2021.3.42.6520
// Game Version      : v1.06
// Script Date       : 2025-06-24


[ENABLE]

aobscanmodule(hp1,GameAssembly.dll,F3xxxxxxxx72xx33xxE8) //Health.get_CurrentHealthRate
alloc(newmem,$1000,hp1)
alloc(data3,8)
alloc(hp1bkp,5)
registersymbol(data3)
registersymbol(hp1)
registersymbol(hp1bkp)
label(code)
label(return)

hp1bkp:
  readmem(hp1,5)

newmem:
  mov [data3],rcx

code:
  readmem(hp1,5)
  jmp return

hp1:
  jmp newmem
return:

[DISABLE]

hp1:
  readmem(hp1bkp,5)

unregistersymbol(*)
dealloc(*)"""

