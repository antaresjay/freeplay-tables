[[cheat]]
id = "currency-manager-ctrl-numpad-1-during-game-play-collect-gold-to-populate"
name = "Currency Manager (Ctrl + Numpad 1) {During game play, collect 'Gold' to populate}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Keeper's Toll.exe
// Author            : ndck76
// Executable Version: 2022.3.20.49918
// Game Version      : v0.7.6 (Early Access)
// Script Date       : 2024-02-27


[ENABLE]

aobscanmodule(gold,GameAssembly.dll,8Bxxxx89xxxx488Bxxxx4885xx74xx83xxxxxx74) //CurrencyManager.ModifyGoldValue
alloc(newmem,$1000,gold)
alloc(data3,8)
alloc(goldbkp,6)
registersymbol(data3)
registersymbol(gold)
registersymbol(goldbkp)
label(code)
label(return)

goldbkp:
  readmem(gold,6)

newmem:
  mov [data3],rbx

code:
  readmem(gold,6)
  jmp return

gold:
  jmp newmem
  nop
return:

[DISABLE]

gold:
  readmem(goldbkp,6)

unregistersymbol(*)
dealloc(*)"""

