[[cheat]]
id = "health"
name = "----> Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[Enable]

alloc(health_1,32)
aobscan(health_aob1,8B 45 08 D9 80 B8 02 00 00)
registersymbol(health_aob1)
label(returnhere_health_1)

label(setPlayerID)
label(setPlayerID_status)
registersymbol(setPlayerID_status)

label(ih_1)
label(ih_status)
registersymbol(ih_status)

label(ik_1)
label(ik_status)
registersymbol(ik_status)

label(health_orig)

//--------------------------------------------------//
health_1:
cmp [setPlayerID_status],1
je setPlayerID
cmp [eax+2B4],#123456789
je ih_1
jmp ik_1
//--------------------------------------------------//
setPlayerID:
fld dword ptr [eax+000002B8]
mov [eax+2B4],#123456789
mov [setPlayerID_status],0
jmp returnhere_health_1

setPlayerID_status:
dd 1
//--------------------------------------------------//
ih_1:
cmp [ih_status],0
je health_orig
fld dword ptr [eax+000002B8]
fld [eax+000002BC]
fstp [eax+000002B8]
jmp returnhere_health_1

ih_status:
dd 0
//--------------------------------------------------//
ik_1:
cmp [ik_status],0
je health_orig
fld dword ptr [eax+000002B8]
mov [eax+2B8],(float)0
jmp returnhere_health_1

ik_status:
dd 0
//--------------------------------------------------
health_orig:
fld dword ptr [eax+000002B8]
jmp returnhere_health_1
//--------------------------------------------------

health_aob1+3:
jmp health_1
nop
returnhere_health_1:

[Disable]

health_aob1+3:
db D9 80 B8 02 00 00
unregistersymbol(health_aob1)
dealloc(health_1)

unregistersymbol(setPlayerID_status)

unregistersymbol(ih_status)

unregistersymbol(ik_status)"""

