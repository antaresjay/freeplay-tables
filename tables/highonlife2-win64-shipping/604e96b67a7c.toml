// Game Executable   : HighOnLife2-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.5.4.0
// Game Version      : Build.21897943
// Script Date       : 2026-02-15


[ENABLE]

aobscanmodule(ammo1,HighOnLife2-Win64-Shipping.exe,66xxxxxxxxxxxxxx488Bxx488Bxx0F5BxxFF) // should be unique
alloc(newmem,$1000,ammo1)
alloc(data2,8)
alloc(ammo1bkp,8)
registersymbol(data2)
registersymbol(ammo1)
registersymbol(ammo1bkp)
label(code)
label(return)

ammo1bkp:
  readmem(ammo1,8)

newmem:
  mov [data2],rsi

code:
  readmem(ammo1,8)
  jmp return

ammo1:
  jmp newmem
  nop 3
return:

[DISABLE]

ammo1:
  readmem(ammo1bkp,8)

unregistersymbol(*)
dealloc(*)"""

