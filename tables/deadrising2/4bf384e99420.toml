[[cheat]]
id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(ammo3,deadrising2.exe,D9 85 FC 00 00 00 8B)
aobscanmodule(ammo,deadrising2.exe,8B 80 1C 01 00 00 3D)
aobscanmodule(ammo2,deadrising2.exe,F3 0F 10 89 78 01 00 00 F3 0F 5E)

alloc(newmem,$1000)
alloc(newmem2,$1000)
alloc(newmem3,$1000)

registersymbol(ammo3)
registersymbol(ammo)
registersymbol(ammo2)

label(code)
label(return)
label(code2)
label(return2)
label(code3)
label(return3)

newmem:
code:
  mov [ebp+000000FC], (float)99.0
  fld dword ptr [ebp+000000FC]
  jmp return

ammo3:
  jmp code
  nop
return:


newmem2:
code2:
  mov [eax+0000011C],#999
  mov eax,[eax+0000011C]
  jmp return2

ammo:
  jmp code2
  nop
return2:


newmem3:
code3:
  mov [ecx+00000178],(float)99999
  movss xmm1,[ecx+00000178]
  jmp return3

ammo2:
  jmp code3
  nop
  nop
  nop
return3:

[DISABLE]

ammo3:
  db D9 85 FC 00 00 00

ammo:
  db 8B 80 1C 01 00 00

ammo2:
  db F3 0F 10 89 78 01 00 00

unregistersymbol(ammo3)
unregistersymbol(ammo)
unregistersymbol(ammo2)

dealloc(newmem)
dealloc(newmem2)
dealloc(newmem3)"""

