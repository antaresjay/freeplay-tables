[[cheat]]
id = "seconds-manipulator"
name = "Seconds Manipulator"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[Enable]
AoBScan( seconds, 01 51 20 01 41 1C )
alloc(newmem, 256)
label(incrementer)
label(return)
registersymbol(seconds)
registersymbol(incrementer)

seconds:
jmp newmem
nop
return:

newmem:
mov edx, [incrementer]
add [ecx+20],edx
add [ecx+1C],eax
jmp return

incrementer:
db 5

[Disable]
dealloc(newmem)
dealloc(incrementer)
dealloc(return)
unregistersymbol(seconds)
unregistersymbol(incrementer)

seconds:
add [ecx+20],edx
add [ecx+1C],eax"""

