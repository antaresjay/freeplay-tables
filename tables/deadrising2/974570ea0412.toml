[[cheat]]
id = "infinite-ammo-breakables"
name = "Infinite Ammo/Breakables"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[Enable]
AoBScan(ammo, 8B BE ? ? ? ? 0F 85 ? ? ? ? 8B 01 )
registersymbol(ammo)

ammo+6:
db 90 E9

[Disable]
unregistersymbol(ammo)

ammo+6:
db 0F 85"""

