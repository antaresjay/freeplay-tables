[[cheat]]
id = "activate-resources"
name = "Activate (Resources)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
{
  Extracts RBP.
  Condition: ONLY updates if RBP ends in 00.
  Run Once: Removed (Updates continuously if condition is met).
}

// Your specific long pattern
aobscanmodule(INJECT_RBP_EXACT, GameAssembly.dll, 74 0E 48 63 00 48 8B 0C 28 B0 01 48 89 0F EB C1 E8 40 1B 4E FD)
alloc(newmem,$1000,INJECT_RBP_EXACT)

label(code)
label(return)
label(pRBPValue)

registersymbol(INJECT_RBP_EXACT)
registersymbol(pRBPValue)

newmem:
  // --- FILTER START ---
  // Check if RBP ends in 00
  push rax      // Save RAX (scratchpad)
  mov rax,rbp   // Copy RBP to RAX
  and rax,FF    // Isolate the last byte (last 2 hex digits)
  cmp rax,0     // Compare with 00
  pop rax       // Restore RAX
  jne code      // If it is NOT 00, jump to code (skip saving)
  // --- FILTER END ---

  // If we are here, it ended in 00. Save it.
  mov [pRBPValue],rbp

code:
  // Restore original code (We stole 6 bytes total)
  mov rcx,[rax+rbp]
  mov al,01
  jmp return

// DATA SECTION
pRBPValue:
  dq 0

// Injection at Offset +5
INJECT_RBP_EXACT+5:
  jmp newmem
  nop 1
return:

[DISABLE]
// Restore: 48 8B 0C 28 (mov rcx...) + B0 01 (mov al...)
INJECT_RBP_EXACT+5:
  db 48 8B 0C 28 B0 01

dealloc(newmem)
unregistersymbol(INJECT_RBP_EXACT)
unregistersymbol(pRBPValue)"""

