type = "script"
source = """
[ENABLE]

// Scan for the pattern to find the correct address
aobscanmodule(movWriteScan, GameAssembly.dll, 48 89 18 48 C7 44 24 30 00 00 00 00 49 8D 8F B8 01 00 00)

// Directly replace the 3 bytes at the start of the scan with NOPs
movWriteScan:
db 90 90 90

[DISABLE]

// Restore the original 3 bytes
movWriteScan:
db 48 89 18"""

[[cheat]]
id = "activate-then-select-heroes"
name = "Activate Then Select Heroes"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(INJECT, GameAssembly.dll, F2 0F 10 04 18 8B 44 18 08 F2 0F 11 06 89 46 08 48 8B C6 48 83 C4 30 41 5E 41 5C 5F 5E 5B C3 E8 3F 51 4D)
alloc(newmem, $1000, INJECT)

label(code)
label(return)

label(SelectEXPAddress)
registersymbol(SelectEXPAddress)
registersymbol(INJECT)

newmem:
  // Use RCX instead of RAX for the calculation
  push rcx                 // 1. Save RCX
  lea rcx,[rax+rbx]        // 2. Calculate RAX+RBX and put the result in RCX
  mov [SelectEXPAddress],rcx // 3. Copy RCX to our variable
  pop rcx                  // 4. Restore RCX

code:
  movsd xmm0,[rax+rbx]
  jmp return

SelectEXPAddress:
  dq 0

INJECT:
  jmp newmem
return:

[DISABLE]
INJECT:
  db F2 0F 10 04 18

unregistersymbol(SelectEXPAddress)
unregistersymbol(INJECT)
dealloc(newmem)"""

