type = "script"
source = """
//Send@modEngine
[ENABLE]

aobscanregion(durability,StackedItem:Damage+1a9,StackedItem:Damage+1c7,F3 41 0F 10 44 24 10 F3 0F 5A C0 66)
alloc(newmem,$1000,durability)

label(code)
label(return)

newmem:

code:
  mov [r12+0010],(float)100
  jmp return

durability:
  jmp newmem
  nop 2
return:
registersymbol(durability)

aobscanregion(durability2,InstancedItem:Damage+16c,InstancedItem:Damage+186,F3 41 0F 11 AF E8 00 00 00)
alloc(newmem2,$1000,durability2)

label(code2)
label(return2)

newmem2:

code2:
  mov [r15+00E8],(float)100
  jmp return2

durability2:
  jmp newmem2
  nop 4
return2:
registersymbol(durability2)

[DISABLE]

durability:
  db F3 41 0F 10 44 24 10

durability2:
  db F3 41 0F 11 AF E8 00 00 00

unregistersymbol(*)
dealloc(*)"""
