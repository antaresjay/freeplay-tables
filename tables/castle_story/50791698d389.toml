[[cheat]]
id = "unlimited-blue-crystal"
name = "Unlimited Blue Crystal"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(crystal,48 8B C1 F3 0F 10 40 38)
alloc(newmem,$1000,2F086878)

label(code)
label(return)

newmem:

code:
  mov eax,#100
  cvtsi2ss xmm0,eax
  mov rax,rcx
  movss [rax+38],xmm0
  jmp return

crystal:
  jmp code
  nop
  nop
  nop
return:
registersymbol(crystal)

[DISABLE]
crystal:
  db 48 8B C1 F3 0F 10 40 38
unregistersymbol(crystal)
dealloc(newmem)"""

