[[cheat]]
id = "free-powerups"
name = "Free Powerups"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,GameAssembly.dll,0F 2F 70 60 0F 87 C6 00 00 00) // should be unique
alloc(newmem,$1000,INJECT)

label(code)
label(return)

newmem:

code:
  comiss xmm6,[rax+60]
  comiss xmm6,xmm6
  ja GameAssembly.dll+3682BCC
  jmp return

INJECT:
  jmp newmem
  nop 5
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 0F 2F 70 60 0F 87 C6 00 00 00

unregistersymbol(INJECT)
dealloc(newmem)"""

[[cheat]]
id = "fix-shown-gold"
name = "Fix shown Gold"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,GameAssembly.dll,F3 0F 11 40 60 40) // should be unique
alloc(newmem,$1000,INJECT)

label(code)
label(return)

newmem:

code:
  movss [rax+60],xmm0
  mov [rax+60],0 // reset shown gold to 0 after purchase of powerup
  jmp return

INJECT:
  jmp newmem
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db F3 0F 11 40 60

unregistersymbol(INJECT)
dealloc(newmem)"""
