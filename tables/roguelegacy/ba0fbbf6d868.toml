[[cheat]]
id = "hook-player-base-show-stats"
name = "Hook Player Base + Show Stats"
category = "player"
description = ""
hint = ""
type = "script"
source = """
//Hook into RogueCastle.PlayerObj::CheckGroundCollision+3E
//To copy the player's base address for reading.
//This is what writes 0 once a frame to the "standing on ground" flag.
[ENABLE]
aobscan(checkground,C6 82 2C 01 00 00 00)
alloc(newmem,$1000)

label(code)
label(return)

globalalloc(_playerbase,4) //Allocate 4 bytes for the base address.

newmem:

code:
  mov [_playerbase],edx //Copy the base address to our memory.
  // Back to normal stuff.
  mov byte ptr [edx+0000012C],00
  jmp return

checkground:
  jmp code
  nop
  nop
return:
registersymbol(checkground)

[DISABLE]
checkground:
  db C6 82 2C 01 00 00 00
unregistersymbol(checkground)
dealloc(newmem)"""
