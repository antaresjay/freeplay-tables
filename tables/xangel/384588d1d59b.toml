[[cheat]]
id = "battle-modifiers"
name = "→ Battle Modifiers"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(FightHealth,FightHandle:DealHP+9d,FightHandle:DealHP+c8,49 63 96 B4 01 00 00)
alloc(newmem,$1000,FightHealth)
registersymbol(playerHealth enemyHealth)
label(code return playerHealth enemyHealth)
//Send@https://sintrix.net
newmem:
cmp [playerHealth],1
jne @f
cmp [r14+188],#0
jne @f
mov [r14+1B4],#99999

@@:
cmp [enemyHealth],1
jne code
cmp [r14+188],#0
je code
mov [r14+1B4],#0

code:
  movsxd  rdx,dword ptr [r14+000001B4]
  jmp return

playerHealth:
dd 0
//Send@https://sintrix.net
enemyHealth:
dd 0

FightHealth:
  jmp newmem
  nop 2
return:
registersymbol(FightHealth)

[DISABLE]

FightHealth:
  db 49 63 96 B4 01 00 00
//Send@https://sintrix.net
unregistersymbol(*)
dealloc(*)"""

