name = "Find money pointers from save"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Card_shark.exe
  Version: 
  Date   : 2022-06-04
  Author : Poryg

  This script does blah blah blah
}

[ENABLE]


alloc(newmem,64,FINDPOINTERSFROMSAVE)

label(behindMoneyPtr)
label(behindDonationsPtr)
label(return)

newmem:
  mov rcx,[crawlingForPointers]
  cmp rcx,0c
  jae behindMoneyPtr
  inc rcx
  mov [crawlingForPointers],rcx
  cmp rcx,6
  jne behindDonationsPtr
  mov [donatePtr],rsi
behindDonationsPtr:
  cmp rcx,0c
  jne behindMoneyPtr
  mov [moneyPtr],rsi
behindMoneyPtr:
  movsxd  rax,dword ptr [rsi+48]
  mov [rbp-18],rax
