[ENABLE]

aobscan(Energy,8B 49 74 89 4D FC 8B 40)
alloc(newmem,$100)
label(code)
label(return)

newmem:
  mov [ecx+60],#999 // health
  mov [ecx+68],#999 // max health

  mov [ecx+74],#999 // energy
  mov [ecx+78],#999 // max energy

code:
  mov ecx,[ecx+74]
  mov [ebp-04],ecx
  jmp return

Energy:
  jmp newmem
  nop
return:
