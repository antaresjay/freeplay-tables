[[cheat]]
id = "gameplay-master-ctrl-numpad-1"
name = "Gameplay Master (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : RPM - Road Punk Mayhem.exe
// Author            : ndck76
// Executable Version: 2021.3.33.23082
// Game Version      : Build.14544101
// Script Date       : 2024-08-13


[ENABLE]

aobscanregion(spawntimer,GameplayMaster:StageRoutine,GameplayMaster:StageRoutine+300,F30F10xxxxF3xxxxxxF2xxxxxxxx48xxxxxx49BBxxxxxxxxxxxx000041xxxx) //GameplayMaster:StageRoutine+154
alloc(newmem,$1000,spawntimer)
alloc(data2,8)
alloc(spawntimerbkp,5)
registersymbol(data2)
registersymbol(spawntimer)
registersymbol(spawntimerbkp)
label(code)
label(return)

spawntimerbkp:
  readmem(spawntimer,5)

newmem:
  mov [data2],rsi

code:
  readmem(spawntimer,5)
  jmp return

spawntimer:
  jmp newmem
return:

[DISABLE]

spawntimer:
  readmem(spawntimerbkp,5)

unregistersymbol(*)
dealloc(*)"""

