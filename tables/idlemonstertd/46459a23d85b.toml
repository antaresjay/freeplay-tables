[[cheat]]
id = "essence-hack-on-enemy-kill"
name = "Essence Hack (on enemy kill)"
category = "combat"
description = ""
hint = ""
type = "script"
source = '''
//Target:  IdleMonsterTD.exe
//Author:  Salis
//Credit to METHOS for custom Template LUA

[ENABLE]

////////////////////////  setess  \\\\\\\\\\\\\\\\\\\\\\\\

define(address, Enemy:killedEnemy+273f)

alloc(newmem,1024)
alloc(obytes_setess, 10)
label(return code)

registersymbol(obytes_setess)

obytes_setess:
readmem(address, 10)

newmem:

code:
 mov [rax],#1888140490
 mov [rax+04],#1913655035
 movsxd  rcx,dword ptr [rbp-00000350]
 jmp return

address:
 jmp newmem
 nop 5
return:


[DISABLE]

address:
readmem(obytes_setess, 10)

dealloc(*)
unregistersymbol(*)'''

