type = "script"
source = """
// == Game Executable   : TheComaRecut.exe
// == Author            : Sonansyach
// == Script Date       : 2020-09-15
// == Cheat Name\t\t: InfiniteHealth

\t\t{====================  InfiniteHealth  ====================}
\t\t
[ENABLE]
AOBScan( InfiniteHealthAOB,89 48 30 0F B6 47 64 )
alloc( InfiniteHealth,$100,InfiniteHealthAOB )
label( ReturnInfiniteHealth )
registersymbol( InfiniteHealthAOB )

InfiniteHealth:
  mov ecx,[rax+30]
  movzx eax,byte ptr [rdi+64]
  jmp ReturnInfiniteHealth

InfiniteHealthAOB:
  jmp InfiniteHealth
  nop 2
ReturnInfiniteHealth:

[DISABLE]
InfiniteHealthAOB:
  db 89 48 30 0F B6 47 64

unregistersymbol( InfiniteHealthAOB )
dealloc( InfiniteHealth )

// ORIGINAL CODE - INJECTION POINT: CharStatus:SetAddLife+184"""

