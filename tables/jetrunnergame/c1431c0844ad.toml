[[cheat]]
id = "game-component-time-trial-ctrl-numpad-1"
name = "Game Component Time Trial (Ctrl + Numpad 1)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : JetrunnerGame.exe
// Author            : ndck76
// Executable Version: 5.6.0.0
// Game Version      : v1.0.1
// Script Date       : 2025-09-07


[ENABLE]

aobscanmodule(elapsedtime,JetrunnerGame.exe,F3xxxxxxxxxxxxxxF3xxxxxxxxxxxxxxF3xxxxxxxxxxxxxxF3xxxxxxxxxxxxxx0F28xxxxxx4883) // should be unique
alloc(newmem,$1000,elapsedtime)
alloc(data2,8)
alloc(elapsedtimebkp,8)
registersymbol(data2)
registersymbol(elapsedtime)
registersymbol(elapsedtimebkp)
label(code)
label(return)

elapsedtimebkp:
  readmem(elapsedtime,8)

newmem:
  mov [data2],rbx

code:
  readmem(elapsedtime,8)
  jmp return

elapsedtime:
  jmp newmem
  nop 3
return:

[DISABLE]

elapsedtime:
  readmem(elapsedtimebkp,8)

unregistersymbol(*)
dealloc(*)"""

