[[cheat]]
id = "no-skill-cool-down"
name = "No Skill Cool Down"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(cooldown,ClientDLL.dll,F3 0F 10 8B C0 00 00 00 F3 0F 5E C8 0F 2E) // should be unique
alloc(newmem,$1000,cooldown)

label(code)
label(return)

newmem:
  mov [rbx+C0], (float)9
code:
  movss xmm1,[rbx+000000C0]
  jmp return

cooldown:
  jmp newmem
  nop 3
return:
registersymbol(cooldown)

[DISABLE]

cooldown:
  db F3 0F 10 8B C0 00 00 00

unregistersymbol(cooldown)
dealloc(newmem)"""
