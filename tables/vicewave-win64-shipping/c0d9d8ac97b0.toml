[[cheat]]
id = "enable"
name = "[[ ENABLE ]]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(get_Player,Vicewave-Win64-Shipping.exe,4C 8B 0F 4C 8D 44 24 40 48 8B D0)
alloc(newmem,$1000,get_Player)
label(code)
label(return)
alloc(Player,8)
registersymbol(Player)

newmem:
mov [Player],rdi
code:
  mov r9,[rdi]
  lea r8,[rsp+40]
  jmp return

get_Player:
  jmp newmem
  nop 3
return:
registersymbol(get_Player)

[DISABLE]
get_Player:
  db 4C 8B 0F 4C 8D 44 24 40

unregistersymbol(get_Player)
dealloc(newmem)"""

