type = "script"
source = """
{ Game   : re7.exe
  Date   : 2017-12-13
  Author : EternalXFury

  Table for Resident Evil 7 / Gold Edition
  Features:
  1.God Mode;
  2.God Mode(Chris Redfield - Not A Hero);
  3.Infinite Ammo(No Reload);
  4.infinite Item usage;
  5.Infinite Granades;
  6.Unlimited Oxygen(Chris Redfield - Not A Hero);
  7.One Hit Kill;
  8.Freeze CountDown Timer;
}

[ENABLE]
aobscanmodule(HEALTH,re7.exe,F3 0F 10 40 24 48 8B 43 50 48 39 70 18 0F 85 DC)
aobscanmodule(HEALTH_CHRIS,re7.exe,F3 0F 10 40 24 48 8B 43 50 4C 39 60)
aobscanmodule(AMMO,re7.exe,02 89 5F 24 48 8B 5C 24 30)
aobscanmodule(ITENS,re7.exe,29 C6 89 B7 88 00 00 00)
aobscanmodule(GRANADES,re7.exe,89 BE 88 00 00 00 E8)
aobscanmodule(OXYGEN,re7.exe,F3 0F 10 41 20 C3 CC)
aobscanmodule(ONE_HIT_KILL,re7.exe,F3 0F 10 49 24 44 89 7C)
aobscanmodule(COUNTDOWN_TIMER,re7.exe,D8 F2 0F 5C F0 F2 48 0F 2C C6)
alloc(MyCode,$1000,"re7.exe"+88786D4)
label(GodMode)
label(origGodMode)
label(retGodMode)
label(enableGodMode)
label(GodModeChris)
label(origGodModeChris)
label(retGodModeChris)
label(enableGodModeChris)
label(InfiniteAmmo)
label(origInfiniteAmmo)
label(retInfiniteAmmo)
label(enableInfiniteAmmo)
label(ItensUsage)
label(origItensUsage)
label(retItensUsage)
label(enableItensUsage)
label(InfiniteGranades)
label(origInfiniteGranades)
label(retInfiniteGranades)
label(enableInfiniteGranades)
label(UnlimitedOxygen)
label(origUnlimitedOxygen)
label(retUnlimitedOxygen)
label(enableUnlimitedOxygen)
label(OneHitKill)
label(origOneHitKill)
label(retOneHitKill)
label(enableOneHitKill)
label(FreezeTimer)
label(origFreezeTimer)
label(retFreezeTimer)
label(enableFreezeTimer)
registersymbol(HEALTH)
registersymbol(HEALTH_CHRIS)
registersymbol(AMMO)
registersymbol(ITENS)
registersymbol(GRANADES)
registersymbol(OXYGEN)
registersymbol(ONE_HIT_KILL)
registersymbol(COUNTDOWN_TIMER)
registersymbol(enableGodMode)
registersymbol(enableGodModeChris)
registersymbol(enableInfiniteAmmo)
registersymbol(enableItensUsage)
registersymbol(enableInfiniteGranades)
registersymbol(enableUnlimitedOxygen)
registersymbol(enableOneHitKill)
registersymbol(enableFreezeTimer)

MyCode:

GodMode:
cmp [enableGodMode],1
jne origGodMode
mov [rax+20],(float)9999999999
movss xmm0,[rax+20]
movss [rax+24],xmm0
origGodMode:
movss xmm0,[rax+24]
jmp retGodMode

GodModeChris:
cmp [enableGodModeChris],1
jne origGodModeChris
movss xmm0,[rax+20]
movss [rax+24],xmm0
origGodModeChris:
movss xmm0,[rax+24]
jmp retGodModeChris

InfiniteAmmo:
cmp [enableInfiniteAmmo],1
jne origInfiniteAmmo
cmp ebx,[rdi+24]
JGE origInfiniteAmmo
inc ebx
origInfiniteAmmo:
mov [rdi+24],ebx
mov rbx,[rsp+30]
jmp retInfiniteAmmo

ItensUsage:
cmp [enableItensUsage],1
jne origItensUsage
mov eax,0
origItensUsage:
sub esi,eax
mov [rdi+00000088],esi
jmp retItensUsage

InfiniteGranades:
cmp [enableInfiniteGranades],1
jne origInfiniteGranades
cmp edi,[rsi+00000088]
JGE origInfiniteGranades
inc edi
origInfiniteGranades:
mov [rsi+00000088],edi
jmp retInfiniteGranades

UnlimitedOxygen:
cmp [enableUnlimitedOxygen],1
jne origUnlimitedOxygen
cmp [rcx+08],3
jne origUnlimitedOxygen
mov [rcx+20],(float)100
origUnlimitedOxygen:
movss xmm0,[rcx+20]
jmp retUnlimitedOxygen

OneHitKill:
cmp [enableOneHitKill],1
jne origOneHitKill
cmp [rcx+88],#1
je origOneHitKill
mov [rcx+24],(float)-9999999999
origOneHitKill:
movss xmm1,[rcx+24]
jmp retOneHitKill

FreezeTimer:
cmp [enableFreezeTimer],1
jne origFreezeTimer
cvttsd2si rax,xmm6
jmp retFreezeTimer
origFreezeTimer:
subsd xmm6,xmm0
cvttsd2si rax,xmm6
jmp retFreezeTimer

//parameters
enableGodMode:
dd 0
enableGodModeChris:
dd 0
enableInfiniteAmmo:
dd 0
enableItensUsage:
dd 0
enableInfiniteGranades:
dd 0
enableUnlimitedOxygen:
dd 0
enableOneHitKill:
dd 0
enableFreezeTimer:
dd 0

//hack points
HEALTH:
jmp GodMode
retGodMode:

HEALTH_CHRIS:
jmp GodModeChris
retGodModeChris:

AMMO+01:
jmp InfiniteAmmo
nop
nop
nop
retInfiniteAmmo:

ITENS:
jmp ItensUsage
nop
nop
nop
retItensUsage:

GRANADES:
jmp InfiniteGranades
nop
retInfiniteGranades:

OXYGEN:
jmp UnlimitedOxygen
retUnlimitedOxygen:

ONE_HIT_KILL:
jmp OneHitKill
retOneHitKill:

COUNTDOWN_TIMER+01:
jmp FreezeTimer
nop
nop
nop
nop
retFreezeTimer:

[DISABLE]
HEALTH:
db F3 0F 10 40 24

HEALTH_CHRIS:
db F3 0F 10 40 24

AMMO+01:
db 89 5F 24 48 8B 5C 24 30

ITENS:
db 29 C6 89 B7 88 00 00 00

GRANADES:
db 89 BE 88 00 00 00

OXYGEN:
db F3 0F 10 41 20

ONE_HIT_KILL:
db F3 0F 10 49 24

COUNTDOWN_TIMER+01:
db F2 0F 5C F0 F2 48 0F 2C C6

unregistersymbol(HEALTH)
unregistersymbol(HEALTH_CHRIS)
unregistersymbol(AMMO)
unregistersymbol(ITENS)
unregistersymbol(GRANADES)
unregistersymbol(OXYGEN)
unregistersymbol(ONE_HIT_KILL)
unregistersymbol(COUNTDOWN_TIMER)
unregistersymbol(enableGodMode)
unregistersymbol(enableGodModeChris)
unregistersymbol(enableInfiniteAmmo)
unregistersymbol(enableItensUsage)
unregistersymbol(enableInfiniteGranades)
unregistersymbol(enableUnlimitedOxygen)
unregistersymbol(enableOneHitKill)
unregistersymbol(enableFreezeTimer)
dealloc(MyCode)"""

