[[cheat]]
id = "warp-to-round"
name = "Warp to Round #"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(ASTART,MyProject-Win64-Shipping.exe,C7 81 54 0C 00 00 01 00 00 00)
alloc(newmem,$30,ASTART)
alloc(BEGIN,4)
registersymbol(ASTART)
registersymbol(BEGIN)
label(return)

newmem:
  push r14
  mov r14d,[BEGIN]
  mov [rcx+00000C54],r14d
  pop r14
  jmp return

ASTART:
  jmp newmem
  nop 5
return:

[DISABLE]

ASTART:
  db C7 81 54 0C 00 00 01 00 00 00

unregistersymbol(ASTART)
unregistersymbol(BEGIN)
dealloc(newmem)
dealloc(BEGIN)"""

