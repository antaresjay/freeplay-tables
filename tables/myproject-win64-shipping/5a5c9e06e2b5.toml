id = "get-addresses-on-reload"
name = "Get Addresses on Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(TYPE,MyProject-Win64-Shipping.exe,41 89 86 F8 0F 00 00)
alloc(newmem,$50,TYPE)
alloc(SLOTA,8)
alloc(SLOTB,8)
registersymbol(TYPE)
registersymbol(SLOTA)
registersymbol(SLOTB)
label(return)

newmem:
  push r12
  mov r12,[SLOTB]
  mov [SLOTA],r12
  pop r12
  mov [SLOTB],r14
  mov [r14+00000FF8],eax
  jmp return

TYPE:
  jmp newmem
  nop 2
return:

[DISABLE]

TYPE:
  db 41 89 86 F8 0F 00 00

unregistersymbol(TYPE)
unregistersymbol(SLOTA)
unregistersymbol(SLOTB)
dealloc(newmem)
dealloc(SLOTA)
dealloc(SLOTB)"""

