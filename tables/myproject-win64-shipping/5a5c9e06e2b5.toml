[[cheat]]
id = "progress-rewards"
name = "Progress & Rewards"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(JUMP,MyProject-Win64-Shipping.exe,8B 87 44 03 00 00 39)
alloc(newmem,$30,JUMP)
alloc(SKILLS,8)
registersymbol(JUMP)
registersymbol(SKILLS)
label(return)

newmem:
  mov eax,[rdi+00000344]
  mov [SKILLS],rdi
  jmp return

JUMP:
  jmp newmem
  nop
return:

[DISABLE]

JUMP:
  db 8B 87 44 03 00 00

unregistersymbol(JUMP)
unregistersymbol(SKILLS)
dealloc(newmem)
dealloc(SKILLS)"""

