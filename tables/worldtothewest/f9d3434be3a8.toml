type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanregion(characterSpeedRead2AOB,Character:get_shouldAdjustWallHug,Character:get_shouldAdjustWallHug+72,F3 0F 10 86 ** ** ** ** F3 0F 5A C0 F2 0F 5A E8)
registersymbol(characterSpeedRead2AOB)

alloc(newmem2,2048,Character:get_shouldAdjustWallHug+22) 
label(returnhere2)
label(originalcode2)
label(exit2)

newmem2: //this is allocated memory, you have read,write,execute access
//place your code here
mulss xmm0,[fCharacterSpeedMultiplier]

originalcode2:
cvtss2sd xmm0,xmm0
cvtsd2ss xmm5,xmm0

exit2:
jmp returnhere2

///

characterSpeedRead2AOB+8: //Character:get_shouldAdjustWallHug+22:
jmp newmem2
nop
nop
nop
returnhere2:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem2)
characterSpeedRead2AOB+8: //Character:get_shouldAdjustWallHug+22:
db F3 0F 5A C0 F2 0F 5A E8
//Alt: cvtss2sd xmm0,xmm0
//Alt: cvtsd2ss xmm5,xmm0"""

