[[cheat]]
id = "inf-energy"
name = "Inf Energy"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
{
\tGame\t: Geneforge Mutagen.exe
\tVersion\t: 
\tDate\t: 2021-02-27
\tAuthor\t: aSwedishMagyar
}
[ENABLE]
registersymbol(oldEnergyCost)
alloc(oldEnergyCost,2)

oldEnergyCost:
readmem(useEnergy,2)

useEnergy:
nop 2

[DISABLE]
useEnergy:
readmem(oldEnergyCost,2)

unregistersymbol(oldEnergyCost)
dealloc(oldEnergyCost)"""

