[[cheat]]
id = "damage-modifier-script-god-mode-one-hit-kill-etc"
name = "Damage Modifier Script (God Mode, One Hit Kill, etc)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

//aobscanmodule(DamageModAOB,"GameAssembly.dll",8B 54 24 18 8B F0 8B 0E E8 ?? ?? ?? ?? 8B 4C 24 1C) // should be unique
//aobscanmodule(DamageModAOB,"GameAssembly.dll",8B 94 24 B0 00 00 00 8B 08 E8 ?? ?? ?? ?? 89 03 33 D2) // should be unique
aobscanmodule(DamageModAOB,"GameAssembly.dll",8B 94 24 A0 00 00 00 8B 08 E8 ?? ?? ?? ?? 89 03 33 D2) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,2048,DamageModAOB)

label(originalcode)
label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)
\t\t  
newmem:
  mov [RDXSave],rdx
  mov rdx,[rsp+00000078]
  mov rdx,[rdx+10]
  mov edx,[rdx+20]
  mov [CurrentHP],edx
  xor rdx,rdx
  mov rdx,[rsp+00000078]
  cmp [rdx+98],0
  mov rdx,[RDXSave]
originalcode:
  mov edx,[rsp+000000A0]
  je HeroHit
EnemyHit:
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckOneHitKill
  push edx
  fild dword ptr [esp]
  fmul dword ptr [fEnemyDamageMult]
  fistp dword ptr [esp]
  pop edx
CheckOneHitKill:
  cmp [OneHitKill],1
  jne CleanUp
  mov edx,#999
  jmp CleanUp
HeroHit:
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  push edx
  fild dword ptr [esp]
  fmul dword ptr [fHeroDamageMult]
  fistp dword ptr [esp]
  pop edx
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor edx,edx
  jmp CleanUp
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne CleanUp
  cmp edx,[CurrentHP]
  jl @F
  xor edx,edx
@@:
  jmp CleanUp  
CleanUp:
  jmp return

GodMode:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)2.0
fHeroDamageMult:
dq (float)0.5
HeroCannotDie:
dq 1
RDXSave:
dq 0
CurrentHP:
dq 0

DamageModAOB:
  jmp newmem
  nop
  nop
return:

[DISABLE]

DamageModAOB:
  db 8B 94 24 A0 00 00 00

unregistersymbol(DamageModAOB)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fHeroDamageMult)
unregistersymbol(HeroCannotDie)

dealloc(newmem)"""

