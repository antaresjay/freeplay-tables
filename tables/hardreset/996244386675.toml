[[cheat]]
id = "activate"
name = "Activate"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Author:  ++METHOS
//Target:  Hard Reset

[enable]

aobscanmodule(aob,hardreset.exe,8b 50 04 8b 74 24 14)
alloc(newmem,$1000)
aobscanmodule(aob_sprint,hardreset.exe,8b 40 04 89 44 24 14 8d)
alloc(newmem_sprint,$1000)

label(originalcode)
label(return)
label(ep1)
label(ep1_address)
label(ep2)
label(ep2_address)
label(health)
label(health_address)
label(spoints)
label(spoints_address)
label(xpoints)
label(xpoints_address)
label(rapidfire)
label(sprint)
label(sprint_address)
label(originalcode_sprint)
label(return_sprint)

globalalloc(ep1_switch,1)
globalalloc(ep2_switch,1)
globalalloc(health_switch,1)
globalalloc(enemy_health_switch,1)
globalalloc(spoints_switch,1)
globalalloc(xpoints_switch,1)
globalalloc(sprint_switch,1)
globalalloc(rapidfire_switch,1)

registersymbol(aob)
registersymbol(ep1_address)
registersymbol(ep2_address)
registersymbol(health_address)
registersymbol(spoints_address)
registersymbol(xpoints_address)
registersymbol(aob_sprint)
registersymbol(sprint_address)

newmem:
cmp esi,00080004
jne originalcode

pushfd
pushad
push 4
lea eax,[eax+0c]
push eax
call isbadreadptr
cmp eax,0
jne @f
popad
popfd

pushfd
pushad
push 4
mov eax,[eax+0c]
lea eax,[eax+1c]
push eax
call isbadreadptr
cmp eax,0
jne @f
popad
popfd

push ebx
mov ebx,[eax+0c]
cmp [ebx+1c],00315045
pop ebx
je ep1

push ebx
mov ebx,[eax+0c]
cmp [ebx+1c],00325045
pop ebx
je ep2

push ebx
mov ebx,[eax+0c]
cmp [ebx+1c],00005048
pop ebx
je health

push ebx
mov ebx,[eax+0c]
cmp [ebx+1c],00005053
pop ebx
je spoints

push ebx
mov ebx,[eax+0c]
cmp [ebx+1c],1d005058
pop ebx
je xpoints

push ebx
mov ebx,[eax+0c]
cmp [ebx+1c],6c65525f
pop ebx
je rapidfire

push ebx
mov ebx,[eax+0c]
cmp [ebx+1c],00000003
pop ebx
je sprint

mov edx,[eax+04]
mov esi,[esp+14]
jmp return

@@:
popad
popfd
mov edx,[eax+04]
mov esi,[esp+14]
jmp return

ep1:
push edi
lea edi,[eax+04]
mov [ep1_address],edi
pop edi
cmp byte ptr [ep1_switch],1
jne originalcode
mov [eax+04],(float)999.0
jmp originalcode

ep2:
push edi
lea edi,[eax+04]
mov [ep2_address],edi
pop edi
cmp byte ptr [ep2_switch],1
jne originalcode
mov [eax+04],(float)999.0
jmp originalcode

health:
cmp [eax+1c],00080004
jne enemy_health

pushfd
pushad
push 4
lea eax,[eax+20]
push eax
call isbadreadptr
cmp eax,0
jne @b
popad
popfd

pushfd
pushad
push 4
mov eax,[eax+20]
lea eax,[eax+1c]
push eax
call isbadreadptr
cmp eax,0
jne @b
popad
popfd

push edi
mov edi,[eax+20]
cmp [edi+1c],6D5F5045
pop edi
je enemy_health

push edi
lea edi,[eax+04]
mov [health_address],edi
pop edi
cmp byte ptr [health_switch],1
jne originalcode
mov [eax+04],(float)999.0
jmp originalcode

enemy_health:
cmp byte ptr [enemy_health_switch],1
jne originalcode
cmp [eax+04],(float)0.0
jle originalcode
mov [eax+04],(float)0.0
jmp originalcode

spoints:
push edi
lea edi,[eax+04]
mov [spoints_address],edi
pop edi
cmp byte ptr [spoints_switch],1
jne originalcode
mov [eax+04],(float)999.0
jmp originalcode

xpoints:
cmp [eax+14],00010000
jne originalcode

push edi
lea edi,[eax+04]
mov [xpoints_address],edi
pop edi
cmp byte ptr [xpoints_switch],1
jne originalcode
mov [eax+04],(float)99999999.0
jmp originalcode

rapidfire:
cmp byte ptr [rapidfire_switch],1
jne originalcode
mov esi,[esp+14]
jmp return

originalcode:
mov edx,[eax+04]
mov esi,[esp+14]
jmp return

ep1_address:
dd 0
ep2_address:
dd 0
health_address:
dd 0
spoints_address:
dd 0
xpoints_address:
dd 0

aob:
jmp newmem
nop
nop
return:

//====================================================

newmem_sprint:
cmp ecx,3fc00000
jne originalcode_sprint

pushfd
pushad
push 4
lea eax,[eax+0c]
push eax
call isbadreadptr
cmp eax,0
jne @f
popad
popfd

pushfd
pushad
push 4
mov eax,[eax+0c]
lea eax,[eax+1c]
push eax
call isbadreadptr
cmp eax,0
jne @f
popad
popfd

push ebx
mov ebx,[eax+0c]
cmp [ebx+1c],00000003
pop ebx
je sprint

mov eax,[eax+04]
mov [esp+14],eax
jmp return_sprint

@@:
popad
popfd
mov eax,[eax+04]
mov [esp+14],eax
jmp return_sprint

sprint:
push edi
lea edi,[eax+04]
mov [sprint_address],edi
pop edi
cmp byte ptr [sprint_switch],1
jne originalcode_sprint
mov [eax+04],(float)1.500106692
mov [esp+14],eax
jmp return_sprint

originalcode_sprint:
mov eax,[eax+04]
mov [esp+14],eax
jmp return_sprint

sprint_address:
dd 0

aob_sprint:
jmp newmem_sprint
nop
nop
return_sprint:


[disable]
dealloc(newmem)
aob:
db 8b 50 04 8b 74 24 14

unregistersymbol(aob)
unregistersymbol(ep1_address)
unregistersymbol(ep2_address)
unregistersymbol(health_address)
unregistersymbol(spoints_address)
unregistersymbol(xpoints_address)

dealloc(newmem_sprint)
aob_sprint:
db 8b 40 04 89 44 24 14

unregistersymbol(aob_sprint)
unregistersymbol(sprint_address)"""

