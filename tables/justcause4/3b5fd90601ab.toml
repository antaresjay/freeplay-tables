[[cheat]]
id = "aimassist-crash-wip"
name = "Aimassist (crash WIP)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : JustCause4.exe
  Version: 
  Date   : 2024-08-20
  Author : David

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(aimassist,JustCause4.exe,0F 28 45 C0 0F 29 07) // should be unique
alloc(newmem,$1000,aimassist)

label(code)
label(return)
label(aim)
label(skip)

newmem:
  movaps xmm0,[rbp-40]
  movaps [rdi],xmm0
  mov r15,[playerpointer] // Ensure player pointer is valid
  cmp rdi,r15
  jne aim // Jump to aim code if RDI is not the player
  jmp return

aim:
  movaps xmm14,xmm0  // xmm14 = enemy coordinates X Y Z
  movaps xmm15,[r15] // xmm15 = player coordinates X Y Z
  // Calculate the difference in X, Y, Z coordinates
  movaps xmm1, xmm14        // xmm1 = enemy coordinates
  subps xmm1, xmm15         // xmm1 = difference (enemy - player)

  // Calculate the horizontal angle (atan2)
  movaps xmm2, xmm1         // xmm2 = difference (X Y Z)
  shufps xmm2, xmm2, 0x4E   // xmm2 = (Z, X, Z, X)
  // Ensure no division by zero
  movaps xmm3, xmm2
  andps xmm3, xmm3          // Check for zero in xmm3
  movaps xmm4, xmm1         // Backup xmm1 value
  cmpeqps xmm3, xmm3       // Set to all 1s if zero
  movaps xmm0, xmm4         // If zero, avoid atan2 calculation

  // Check for zero division
  mov r14, rax // backup rax
  comiss xmm3, xmm3
  jnp compute_horizontal
  jmp skip // Jump to skip if division by zero

compute_horizontal:
  movd rax, xmm1
  push rax
  fild dword [rsp]

  movd rax, xmm2
  push rax
  fild dword [rsp]

  fpatan
  fstp qword [rsp-8] // Store result in stack
  mov rax, [rsp-8]
  movq xmm0, rax

  mov rax, r14 // load backup rax

  // Save aim values
  mov r14, horizontalaim
  mov r13, verticalaim
  mov r12, horizontal
  mov r11, vertical
  movss [r14], xmm0  // Store the horizontal aim angle in horizontalaim

  // Calculate the vertical angle (atan2)
  movaps xmm2, xmm1         // xmm2 = difference (X Y Z)
  shufps xmm2, xmm2, 0x93   // xmm2 = (Y, Y, Z, Z)
  // Ensure no division by zero
  comiss xmm2, xmm2
  jnp compute_vertical
  jmp skip // Jump to skip if division by zero

compute_vertical:
  divps xmm1, xmm2          // xmm1 = Y/Z

  // Inline atan2 calculation
  movd rax, xmm1
  push rax
  fild dword [rsp]

  movd rax, xmm2
  push rax
  fild dword [rsp]

  fpatan
  fstp qword [rsp-8]
  mov rax, [rsp-8]
  movq xmm0, rax

  movss [r13], xmm0  // Store the vertical aim angle in verticalaim

  // Check the difference between the current angles and the previous ones
  fld [r11]
  fsub [r13]
  fabs
  fld [r12]
  fsub [r14]
  fabs
  // If the difference in angles is greater than 0.9, reset to 0
  fld1
  fld st(1)
  fcomi st(0), st(1)
  ja skip
  fld1
  fld st(2)
  fcomi st(0), st(2)
  ja skip
  jmp return

skip:
  mov dword [r14], 0
  mov dword [r13], 0
  jmp return

code:
  movaps xmm0,[rbp-40]
  movaps [rdi],xmm0
  jmp return

aimassist:
  jmp newmem
  nop 2
return:
