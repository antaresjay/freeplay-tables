[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(get_Health,JustCause4.exe,66 89 91 AC 03 00 00)
alloc(newmem,$1000,"JustCause4.exe"+6532D40)
label(code)
label(return)
label(isvalid)
label(isplayervehicle)
alloc(infVehicleHealth,1)
registersymbol(infVehicleHealth)

newmem:
{$try}
  push rax
  push rdi
  cmp rcx,[playerVehicle]
  je isplayervehicle
  mov rax,[rcx+A40]
  mov rdi,[rax+510]
  jmp isvalid
{$except}
  pop rdi
  pop rax
  jmp code

isplayervehicle:
  pop rdi
  pop rax
  cmp byte ptr [infVehicleHealth],00
  je code
  mov dx, word ptr [rcx+000003AA]
  jmp code

isvalid:
  cmp [rax+510],rcx
  pop rdi
  pop rax
  jne code
  mov dx, word ptr [rcx+000003AE]

code:
  mov [rcx+000003AC],dx
  jmp return

get_Health:
  jmp newmem
  nop 2
return:
registersymbol(get_Health)

[DISABLE]
get_Health:
  db 66 89 91 AC 03 00 00

unregistersymbol(get_Health)
dealloc(newmem)"""

