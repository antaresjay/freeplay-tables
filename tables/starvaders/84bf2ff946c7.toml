[[cheat]]
id = "cards-no-heat-power-mana-cost"
name = "Cards: No Heat/Power/Mana Cost"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(CardHeatCost,GameAssembly.dll,8B 47 40 48 8D 55 20)
alloc(newmem,$1000,CardHeatCost)
//Send@Sintrix|FearlessRevoltuion
label(code)
label(return)

newmem:
mov [rdi+44],#0
mov [rdi+48],#0
code:
  mov eax,#0
  lea rdx,[rbp+20]
  jmp return

CardHeatCost:
  jmp newmem
  nop 2
return:
registersymbol(CardHeatCost)
//Send@Sintrix|FearlessRevoltuion
[DISABLE]

CardHeatCost:
  db 8B 47 40 48 8D 55 20

unregistersymbol(*)
dealloc(*)"""

