type = "script"
source = """
[ENABLE]

aobscanmodule(whiooreytreyue,GameAssembly.dll,48 8B AB B8 01 00 00 F3 44 0F 10 83 70 03 00 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov rbp,[rbx+000001B8]

  mov [rbx+00000370], (float)1.0

code:
  movss xmm8,[rbx+00000370]
  jmp return

whiooreytreyue:
  jmp far newmem
  nop
  nop
return:
registersymbol(whiooreytreyue)

[DISABLE]

whiooreytreyue:
  db 48 8B AB B8 01 00 00 F3 44 0F 10 83 70 03 00 00

unregistersymbol(whiooreytreyue)
dealloc(newmem)"""
