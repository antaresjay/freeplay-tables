[[cheat]]
id = "lineupdb-static-base-address-scan-initialization-activate-this-first"
name = "LineupDB_static Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(LineupDB_static_basepointer)
registersymbol(LineupDB_static_update_enable)
registersymbol(LineupDB_static_set_enable)
registersymbol(LineupDB_static_deploymentsset_enable)
