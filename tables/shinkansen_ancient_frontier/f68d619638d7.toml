[DISABLE]
unregistersymbol(LineupDB_static_basepointer)
unregistersymbol(LineupDB_static_update_enable)
unregistersymbol(LineupDB_static_set_enable)
unregistersymbol(LineupDB_static_deploymentsset_enable)
unregistersymbol(LineupDB_static_resourcesset_enable)

dealloc(LineupDB_static_basepointer)
