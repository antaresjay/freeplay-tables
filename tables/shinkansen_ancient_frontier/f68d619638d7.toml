mov [Unit_temp2], ebx
mov [Unit_temp3], ecx
mov [Unit_temp4], edx

cmp byte ptr [edi+171], #0
jne Unit_enemyset_entry

cmp dword ptr [Unit_update_enable], #0
je Unit_update_exit
mov [Unit_basepointer], edi
Unit_update_exit:

cmp dword ptr [Unit_set_enable], #0
je Unit_set_exit
Unit_set_exit:

cmp dword ptr [Unit_movesset_enable], #0
je Unit_movesset_exit
