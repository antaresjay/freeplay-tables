[[cheat]]
id = "lineupdb-static-base-address-scan-to-activate-view-resources-to-update-view-resources"
name = "LineupDB_static Base Address Scan (To Activate: View Resources, To Update: View Resources)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(LineupDB_static_savedAOB)
label(LineupDB_static_returnhere)
label(LineupDB_static_originalcode)
label(LineupDB_static_exit)

label(LineupDB_static_update_exit)
label(LineupDB_static_set_exit)
label(LineupDB_static_deploymentsset_exit)
label(LineupDB_static_resourcesset_exit)

registersymbol(LineupDB_static_savedAOB)

//0634FDD6 - 83 EC 0C              - sub esp,0C
//0634FDD9 - 8B 7D 08              - mov edi,[ebp+08]
//0634FDDC - C7 45 F0 00000000     - mov [ebp-10],00000000
// UIResourceBar:_UpdateResourceDisplay+c
//0634FDE3 - 8B 35 6C915B09        - mov esi,[095B916C] : [83706408]
//0634FDE9 - 33 DB                 - xor ebx,ebx
//0634FDEB - E9 4F000000           - jmp 0634FE3F
//0634FDF0 - 8B 47 0C              - mov eax,[edi+0C]
//0634FDF3 - 83 EC 08              - sub esp,08
//0634FDF6 - 53                    - push ebx
//0634FDF7 - 50                    - push eax
aobscan(LineupDB_static_searchedAOB, C7 45 F0 00 00 00 00 * * * * * * 33 DB * * * * * 8B 47 0C)

alloc(LineupDB_static_newmem, 2048, LineupDB_static_searchedAOB)
alloc(LineupDB_static_temp1, 4, LineupDB_static_searchedAOB)
alloc(LineupDB_static_temp2, 4, LineupDB_static_searchedAOB)
alloc(LineupDB_static_temp3, 4, LineupDB_static_searchedAOB)
alloc(LineupDB_static_temp4, 4, LineupDB_static_searchedAOB)
alloc(LineupDB_static_temp5, 4, LineupDB_static_searchedAOB)


LineupDB_static_newmem:
mov [LineupDB_static_temp1], eax
mov [LineupDB_static_temp2], ebx
mov [LineupDB_static_temp3], ecx
mov [LineupDB_static_temp4], edx

mov ebx, [LineupDB_static_savedAOB+9]
sub ebx, 7c

cmp dword ptr [LineupDB_static_update_enable], #0
je LineupDB_static_update_exit
mov [LineupDB_static_basepointer], ebx
LineupDB_static_update_exit:

cmp dword ptr [LineupDB_static_set_enable], #0
je LineupDB_static_set_exit
LineupDB_static_set_exit:

cmp dword ptr [LineupDB_static_deploymentsset_enable], #0
je LineupDB_static_deploymentsset_exit
mov [ebx+9c], #9999
LineupDB_static_deploymentsset_exit:

cmp dword ptr [LineupDB_static_resourcesset_enable], #0
je LineupDB_static_resourcesset_exit
mov ecx, [ebx+7c]
test ecx, ecx
je LineupDB_static_resourcesset_exit
mov ecx, [ecx+8]
test ecx, ecx
je LineupDB_static_resourcesset_exit
mov [ecx+10], #9999
mov [ecx+14], #9999
mov [ecx+18], #9999
LineupDB_static_resourcesset_exit:

mov eax, [LineupDB_static_temp1]
mov ebx, [LineupDB_static_temp2]
mov ecx, [LineupDB_static_temp3]
mov edx, [LineupDB_static_temp4]


LineupDB_static_originalcode:
db C7 45 F0 00 00 00 00
//mov [ebp-10],00000000


LineupDB_static_exit:
jmp LineupDB_static_returnhere


LineupDB_static_searchedAOB:
LineupDB_static_savedAOB:
jmp LineupDB_static_newmem
nop
nop
LineupDB_static_returnhere:


[DISABLE]
LineupDB_static_savedAOB:
db C7 45 F0 00 00 00 00
//mov [ebp-10],00000000

unregistersymbol(LineupDB_static_savedAOB)

dealloc(LineupDB_static_newmem)
dealloc(LineupDB_static_temp1)
dealloc(LineupDB_static_temp2)
dealloc(LineupDB_static_temp3)
dealloc(LineupDB_static_temp4)
dealloc(LineupDB_static_temp5)"""

