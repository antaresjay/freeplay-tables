je Unit_abilitieset_exit
mov edx, 0
mov ebx, [edi+d8]
test ebx, ebx
je Unit_abilitieset_exit
mov ebx, [ebx+8]
test ebx, ebx
je Unit_abilitieset_exit
mov ecx, [ebx+c]
test ecx, ecx
je Unit_abilitieset_exit
Unit_abilitieset_entry:
mov eax, [ebx+edx*4+10]
test eax, eax
je Unit_abilitieset_continue
mov [eax+48], #0
mov [eax+50], #0
Unit_abilitieset_continue:
inc edx
cmp ecx, edx
je Unit_abilitieset_exit
jmp Unit_abilitieset_entry
Unit_abilitieset_exit:

jmp Unit_enemyset_exit

Unit_enemyset_entry:
cmp dword ptr [Unit_enemyset_enable], #0
je Unit_enemyset_exit
mov [edi+19c], #0
mov [edi+1a0], #0
mov [edi+1a4], #0
mov [edi+148], (float)999
Unit_enemyset_exit:

mov eax, [Unit_temp1]
mov ebx, [Unit_temp2]
mov ecx, [Unit_temp3]
mov edx, [Unit_temp4]


Unit_originalcode:
db 8B 87 B8 00 00 00
//mov eax,[edi+000000B8]


Unit_exit:
