label(Unit_update_exit)
label(Unit_set_exit)
label(Unit_movesset_exit)
label(Unit_hpset_exit)
label(Unit_spset_exit)
label(Unit_abilitieset_exit)
label(Unit_abilitieset_entry)
label(Unit_abilitieset_continue)
label(Unit_enemyset_entry)
label(Unit_enemyset_exit)

registersymbol(Unit_savedAOB)

//062EF67C - 83 EC 14              - sub esp,14
//062EF67F - 8B 7D 08              - mov edi,[ebp+08]
// TBTK:Unit:GetFullHP+a
//062EF682 - 8B 87 B8000000        - mov eax,[edi+000000B8]
//062EF688 - 8B 8F 28010000        - mov ecx,[edi+00000128]
//062EF68E - 83 EC 08              - sub esp,08
//062EF691 - 51                    - push ecx
//062EF692 - 50                    - push eax
//062EF693 - 39 00                 - cmp [eax],eax
//062EF695 - E8 469A18FF           - call 054790E0
//062EF69A - 83 C4 10              - add esp,10
//062EF69D - D9 40 08              - fld dword ptr [eax+08]
//062EF6A0 - DD 5D F0              - fstp qword ptr [ebp-10]
//062EF6A3 - D9E8                  - fld1
aobscan(Unit_searchedAOB, 8B 87 B8 00 00 00 8B 8F 28 01 00 00 83 EC 08 51 50 39 00 * * * * * 83 C4 10 D9 40 08)

