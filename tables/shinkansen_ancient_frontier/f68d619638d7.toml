id = "unit-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Unit Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Unit_savedAOB)
label(Unit_returnhere)
