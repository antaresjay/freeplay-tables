[[cheat]]
id = "godmode"
name = "Godmode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : bsm.exe
  Version: 
  Date   : 2019-06-16
  Author : Anjinggila

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(HEALTH,bsm.exe,89 46 0C EB 0F 83 E3 DF) // should be unique
alloc(newmem,$1000)

label(code)
label(playerHealth)
label(enemyHealth)
label(return)
label(ohk_flag)
registersymbol(ohk_flag)

newmem:
  cmp [esi+14],00
  je playerHealth
  cmp [ohk_flag],01
  je enemyHealth
  jmp code

playerHealth:
  mov [esi+0C],#99
  jmp bsm.exe+5CDE2
  jmp return

enemyHealth:
  mov [esi+0C],#0
  jmp bsm.exe+5CDE2
  jmp return

code:
  mov [esi+0C],eax
  jmp bsm.exe+5CDE2
  jmp return

ohk_flag:
dd 0

HEALTH:
  jmp newmem
return:
registersymbol(HEALTH)

[DISABLE]

HEALTH:
  db 89 46 0C EB 0F

unregistersymbol(HEALTH)
dealloc(newmem)"""

