[[cheat]]
id = "gamehud-base-address-scan-initialization-activate-this-first"
name = "GameHud Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameHud_basepointer)
registersymbol(GameHud_update_enable)
registersymbol(GameHud_set_enable)
registersymbol(GameHud_healthset_enable)
registersymbol(GameHud_throwablesset_enable)
registersymbol(GameHud_batteriesset_enable)
registersymbol(GameHud_ammoset_enable)

alloc(GameHud_basepointer, 8)
alloc(GameHud_update_enable, 4)
alloc(GameHud_set_enable, 4)
alloc(GameHud_healthset_enable, 4)
alloc(GameHud_throwablesset_enable, 4)
alloc(GameHud_batteriesset_enable, 4)
alloc(GameHud_ammoset_enable, 4)


[DISABLE]
unregistersymbol(GameHud_basepointer)
unregistersymbol(GameHud_update_enable)
unregistersymbol(GameHud_set_enable)
unregistersymbol(GameHud_healthset_enable)
unregistersymbol(GameHud_throwablesset_enable)
unregistersymbol(GameHud_batteriesset_enable)
unregistersymbol(GameHud_ammoset_enable)

dealloc(GameHud_basepointer)
dealloc(GameHud_update_enable)
dealloc(GameHud_set_enable)
dealloc(GameHud_healthset_enable)
dealloc(GameHud_throwablesset_enable)
dealloc(GameHud_batteriesset_enable)
dealloc(GameHud_ammoset_enable)"""

[[cheat]]
id = "gamehud-base-address-scan-to-activate-play-level-to-update-play-level"
name = "GameHud Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameHud_savedAOB)
label(GameHud_returnhere)
label(GameHud_originalcode)
label(GameHud_exit)

label(GameHud_update_exit)
label(GameHud_set_exit)
label(GameHud_healthset_exit)
label(GameHud_throwablesset_exit)
label(GameHud_batteriesset_exit)
label(GameHud_ammoset_exit)

registersymbol(GameHud_savedAOB)

//0FA07915 - 48 83 EC 18           - sub rsp,18
//0FA07919 - 48 8B F1              - mov rsi,rcx
// GameHud:Update+e2
//0FA0791C - 0FB6 86 24010000      - movzx eax,byte ptr [rsi+00000124]
//0FA07923 - 85 C0                 - test eax,eax
//0FA07925 - 0F84 05010000         - je 0FA07A30
//0FA0792B - F3 0F10 86 28010000   - movss xmm0,[rsi+00000128]
//0FA07933 - F3 0F5A C0            - cvtss2sd xmm0,xmm0
//0FA07937 - F2 0F11 45 E8         - movsd [rbp-18],xmm0
aobscan(GameHud_searchedAOB, 0F B6 86 24 01 00 00 85 C0 * * * * * * F3 0F 10 86 28 01 00 00)

alloc(GameHud_newmem, 2048, GameHud_searchedAOB)
alloc(GameHud_temp1, 8, GameHud_searchedAOB)
alloc(GameHud_temp2, 8, GameHud_searchedAOB)


GameHud_newmem:
mov [GameHud_temp1], rbx
mov [GameHud_temp2], rdx

cmp dword ptr [GameHud_update_enable], #0
je GameHud_update_exit
mov [GameHud_basepointer], rsi
GameHud_update_exit:

cmp dword ptr [GameHud_set_enable], #0
je GameHud_set_exit
GameHud_set_exit:

cmp dword ptr [GameHud_healthset_enable], #0
je GameHud_healthset_exit
cmp qword ptr [rsi+80], #0
je GameHud_healthset_exit
cmp dword ptr [rsi+80], #0
je GameHud_healthset_exit
mov rbx, [rsi+80]
fld [rbx+6c]
fstp [rbx+68]
GameHud_healthset_exit:

cmp dword ptr [GameHud_throwablesset_enable], #0
je GameHud_throwablesset_exit
cmp qword ptr [rsi+78], #0
je GameHud_throwablesset_exit
cmp dword ptr [rsi+78], #0
je GameHud_throwablesset_exit
mov rbx, [rsi+78]
mov [rbx+e8], #9999
mov [rbx+ec], #9999
GameHud_throwablesset_exit:

cmp dword ptr [GameHud_batteriesset_enable], #0
je GameHud_batteriesset_exit
cmp qword ptr [rsi+78], #0
je GameHud_batteriesset_exit
cmp dword ptr [rsi+78], #0
je GameHud_batteriesset_exit
mov rbx, [rsi+78]
mov [rbx+118], (float)100
GameHud_batteriesset_exit:

cmp dword ptr [GameHud_ammoset_enable], #0
je GameHud_ammoset_exit
cmp qword ptr [rsi+78], #0
je GameHud_batteriesset_exit
cmp dword ptr [rsi+78], #0
je GameHud_batteriesset_exit
mov rbx, [rsi+78]
cmp qword ptr [rbx+28], #0
je GameHud_batteriesset_exit
cmp dword ptr [rbx+28], #0
je GameHud_batteriesset_exit
mov rbx, [rbx+28]
mov edx, [rbx+d4]
mov [rbx+d8], edx
mov edx, [rbx+e0]
mov [rbx+e4], edx
GameHud_ammoset_exit:

mov rbx, [GameHud_temp1]
mov rdx, [GameHud_temp2]


GameHud_originalcode:
db 0F B6 86 24 01 00 00
//movzx eax,byte ptr [rsi+00000124]


GameHud_exit:
jmp GameHud_returnhere


GameHud_searchedAOB:
GameHud_savedAOB:
jmp GameHud_newmem
nop
nop
GameHud_returnhere:


[DISABLE]
GameHud_savedAOB:
db 0F B6 86 24 01 00 00
//movzx eax,byte ptr [rsi+00000124]

unregistersymbol(GameHud_savedAOB)

dealloc(GameHud_newmem)
dealloc(GameHud_temp1)
dealloc(GameHud_temp2)"""

