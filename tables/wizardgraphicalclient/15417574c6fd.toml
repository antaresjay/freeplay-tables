[[cheat]]
id = "xyz-questhelper"
name = "#XYZ/Questhelper#"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(xyz,WizardGraphicalClient.exe,F2 41 0F 11 40 58 8B 42 08 41 89 40 60 41 C6 80 88 00 00 00 01 F2 0F 10 02 F2 0F 11 81 A8 00 00 00)
registersymbol(xyz)
aobscanmodule(questhelper,WizardGraphicalClient.exe,f2 44 0f 11 00 44 89 60 08 48 8b 45 48)
registersymbol(questhelper)
alloc(questhelpercave,256,questhelper)
alloc(xyzcave,256,xyz)
alloc(help,256,questhelper)
registersymbol(help)
alloc(pCoords,256)
registersymbol(pCoords)
alloc(questXY,256)
alloc(questZ,256)
registersymbol(questXY)
registersymbol(questZ)
alloc(saveload,256)
registersymbol(saveload)
alloc(slot,256)
registersymbol(slot)
alloc(slot0xy,256)
registersymbol(slot0xy)
define(slot0z,slot0xy+8)
registersymbol(slot0z)
define(slot1xy,slot0z+8)
registersymbol(slot1xy)
define(slot1z,slot1xy+8)
registersymbol(slot1z)
define(slot2xy,slot1z+8)
registersymbol(slot2xy)
define(slot2z,slot2xy+8)
registersymbol(slot2z)
define(slot3xy,slot2z+8)
registersymbol(slot3xy)
define(slot3z,slot3xy+8)
registersymbol(slot3z)
label(loadpos)
label(savepos)
label(createpointer)
label(end)
label(save2)
label(save3)
label(save4)
label(load2)
label(load3)
label(load4)

////QUESTHELPER
questhelpercave:
movsd [rax],xmm8         // X,Y coords (from selected quest)
mov [rax+08],r12d        // Z coord           "
cmp [help],1             // port to arrow?
jne questhelper+09       // jne end
push rax
mov rax,[pCoords]        //change register to player Coords addr.
add rax,58
movq [questXY],xmm8      //port x,y
fld qword ptr [questXY]
fstp qword ptr [rax]
add rax,8
mov [questZ],r12d        //port z
fld dword ptr [questZ]
fstp dword ptr [rax]
pop rax
mov [help],0             //teleport switch off
jmp questhelper+09       //jmp end (back to questhelper code)

questhelper:
jmp questhelpercave
nop 4

////COORDS / SAVELOAD
xyzcave:
movsd [r8+58],xmm0     //xy
mov eax,[rdx+08]
mov [r8+60],eax        //z
cmp r12,81             //if r12=81 player coords are handled
je createpointer
jmp end

createpointer:
mov qword ptr ds:[pCoords],r8 //create pointer
cmp [saveload],#1             //save position?
je savepos
cmp [saveload],#2             //load position?
je loadpos
jmp end

loadpos:                      //load slot
mov [saveload],#0             //reset switch
cmp [slot],0
jne load2
cmp [slot0xy],0
je end
movsd xmm0,[slot0xy]
movsd [r8+58],xmm0
mov eax,[slot0z]
mov [r8+60],eax
jmp end
load2:
cmp [slot],1
jne load3
cmp [slot1xy],0
je end
movsd xmm0,[slot1xy]
movsd [r8+58],xmm0
mov eax,[slot1z]
mov [r8+60],eax
jmp end
load3:
cmp [slot],2
jne load4
cmp [slot2xy],0
je end
movsd xmm0,[slot2xy]
movsd [r8+58],xmm0
mov eax,[slot2z]
mov [r8+60],eax
jmp end
load4:
cmp [slot],3
jne end
cmp [slot3xy],0
je end
movsd xmm0,[slot3xy]
movsd [r8+58],xmm0
mov eax,[slot3z]
mov [r8+60],eax
jmp end

savepos:                      //save slot
mov [saveload],#0             //reset switch
cmp [slot],3
jne save2
movsd [slot3xy],xmm0
mov [slot3z],eax
jmp end
save2:
cmp [slot],2
jne save3
movsd [slot2xy],xmm0
mov [slot2z],eax
jmp end
save3:
cmp [slot],1
jne save4
movsd [slot1xy],xmm0
mov [slot1z],eax
jmp end
save4:
movsd [slot0xy],xmm0
mov [slot0z],eax
jmp end

xyz:
jmp xyzcave
nop 8

end:
[DISABLE]
questhelper:
db f2 44 0f 11 00 44 89 60 08 48 8b 45 48
xyz:
db f2 41 0f 11 40 58 8b 42 08 41 89 40 60 41 c6 80 88 00 00 00 01
dealloc(*)
unregistersymbol(*)"""

