[[cheat]]
id = "runspeed"
name = "#runspeed#"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(speedcode,WizardGraphicalClient.exe,66 0f 6e c1 0f 5b c0 f3 0f 59 05 xx xx xx xx f3 0f 58 c2)
registersymbol(speedcode)
alloc(speedcodecave,256,speedcode)
alloc(pSpeed,256)
alloc(speed40,256)
registersymbol(speed40)
registersymbol(pSpeed)
label(end)
label(createpointer)

////SPEED
speedcodecave:
movd xmm0,ecx
cvtdq2ps xmm0,xmm0
cmp r12,81                     //if r12=81 player speed is handled
je createpointer
jmp end

createpointer:                 //static speed change applies after mapchange
cmp [pSpeed],ebx               //check pointer
je end
mov dword ptr ds:[pSpeed],ebx  //create pointer
mov [ebx+c0],#40               //set speed 40
cmp [speed40],#1               //40/350 switch
je end
mov [ebx+c0],#350              //set speed 350
jmp end

speedcode:
jmp speedcodecave
nop
nop

end:
[DISABLE]
speedcode:
db 66 0f 6e c1 0f 5b c0
dealloc(*)
unregistersymbol(*)"""

