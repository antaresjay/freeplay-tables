[[cheat]]
id = "god-mode-always-200-health"
name = "God mode (always 200 health)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,Glquake.exe,D9 80 C0 00 00 00 D9 6D) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov [eax+000000C0],(float)200
  fld dword ptr [eax+000000C0]
  jmp return

INJECT:
  jmp newmem
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db D9 80 C0 00 00 00

unregistersymbol(INJECT)
dealloc(newmem)

Glquake.exe+18F4B0:
  fld dword ptr [eax+000000C0]"""

