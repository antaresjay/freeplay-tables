type = "script"
source = """
// Game Executable   : The Dawning Clocks of Time Remake.exe
// Author            : ndck76
// Executable Version: 2023.2.20.9633
// Game Version      : v1.0.4.0810.25
// Script Date       : 2024-08-27


[ENABLE]

aobscanmodule(isplaying,GameAssembly.dll,0FB6xxxxxxxxxx4883xxxx5BC3E8xxxxxxxxxxxxxxxxxxxxxxxxxxxx88) //DawningEngine.GameManager.get_IsPlaying
alloc(newmem,$1000,isplaying)
alloc(data,8)
alloc(isplayingbkp,7)
registersymbol(data)
registersymbol(isplaying)
registersymbol(isplayingbkp)
label(code)
label(return)

isplayingbkp:
  readmem(isplaying,7)

newmem:
  mov [data],rbx

code:
  readmem(isplaying,7)
  jmp return

isplaying:
  jmp newmem
  nop 2
return:

[DISABLE]

isplaying:
  readmem(isplayingbkp,7)

unregistersymbol(*)
dealloc(*)"""

