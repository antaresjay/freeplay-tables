[[cheat]]
id = "godmode"
name = "Godmode"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(GodPoint,Unit:GetUndamageable,Unit:GetUndamageable+1a,0F B6 86 EE 03 00 00 48 8B 34 24 48 83 C4 08) // should be unique
alloc(GodAlloc,$1000)

label(code return)

GodAlloc:
  cmp [rcx+2c],0
  jne code
  mov eax,1
  mov rsi,[rsp]
  add rsp,08
  jmp return
code:
  movzx eax,byte ptr [rsi+000003EE]
  mov rsi,[rsp]
  add rsp,08
  jmp return

GodPoint:
  jmp far GodAlloc
  nop
return:
registersymbol(GodPoint)

[DISABLE]

GodPoint:
  db 0F B6 86 EE 03 00 00 48 8B 34 24 48 83 C4 08

unregistersymbol(*)
dealloc(*)"""

