[[cheat]]
id = "stats-base-address-scan-initialization-activate-this-first"
name = "Stats Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

registersymbol(stats_basepointer)
registersymbol(statsupdate_enable)
registersymbol(statsset_enable)

alloc(stats_basepointer,4)
alloc(statsupdate_enable,4)
alloc(statsset_enable,4)


[DISABLE]

unregistersymbol(stats_basepointer)
unregistersymbol(statsupdate_enable)
unregistersymbol(statsset_enable)

dealloc(stats_basepointer)
dealloc(statsupdate_enable)
dealloc(statsset_enable)"""

[[cheat]]
id = "stats-base-address-scan-to-activate-load-campaign-to-update-load-campaign"
name = "Stats Base Address Scan (To Activate: Load Campaign, To Update: Load Campaign)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(stats_savedAOB)
label(stats_returnhere)
label(stats_originalcode)
label(stats_exit)

label(statsupdate_exit)
label(statsset_exit)

registersymbol(stats_savedAOB)

aobscan(searchedAOB,89 48 0C 8B 4F 10 8D 85 D8 FE FF FF)

alloc(stats_newmem,2048) //2kb should be enough


stats_newmem:
cmp dword ptr [statsupdate_enable], #0
je statsupdate_exit
mov [stats_basepointer], edi
statsupdate_exit:

cmp dword ptr [statsset_enable], #0
je statsset_exit
mov [edi+10], #99999
mov [edi+18], #99999
mov [edi+20], #99999
mov [edi+28], #99999
mov [edi+30], #99999
mov [edi+38], #999999
mov [edi+3c], #999999
statsset_exit:


stats_originalcode:
db 89 48 0C 8B 4F 10
//mov [eax+0C],ecx
//mov ecx,[edi+10]


stats_exit:
jmp stats_returnhere


searchedAOB:
stats_savedAOB:
jmp stats_newmem
nop
stats_returnhere:


[DISABLE]
stats_savedAOB:
db 89 48 0C 8B 4F 10
//mov [eax+0C],ecx
//mov ecx,[edi+10]

unregistersymbol(stats_savedAOB)

dealloc(stats_newmem)"""

