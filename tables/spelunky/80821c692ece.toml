[[cheat]]
id = "force-item-in-jars"
name = "Force item in jars"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(jarmem,32)
registersymbol(jarmem)

"Spelunky.exe"+21D99:
fld dword ptr [ebp+34]
push edx
mov edx, [jarmem]
push edx


[DISABLE]
unregisterSymbol(jarmem)
dealloc(jarmem)

"Spelunky.exe"+21D99:
jne Spelunky.exe+21DBF
fld dword ptr [ebp+34]
push edx
push 00000405"""

