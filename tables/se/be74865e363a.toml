[[cheat]]
id = "battlestate"
name = "BattleState"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Monster Crown SE.exe
  Version: 
  Date   : 2026-06-02
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,Battle.BattleState:Update)
define(bytes,55 48 8B EC 48 81 EC B0 03 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Battle.BattleState:Update)

label(code)
label(return)

newmem:
mov [battlestate_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,000003B0
  jmp return

battlestate_ptr:
dq 0

address:
  jmp newmem
  nop 6
return:
registersymbol(battlestate_ptr)

[DISABLE]

address:
  db bytes
  // push rbp
  // mov rbp,rsp
  // sub rsp,000003B0

dealloc(newmem)
unregistersymbol(battlestate_ptr)"""

