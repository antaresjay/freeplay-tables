[[cheat]]
id = "two-hits-kill-hit-enemy-first"
name = "Two Hits Kill - hit enemy first"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[Enable]
alloc(newmem,100)
label(returnhere)
label(exit)
label(OneHitKill)
registersymbol(OneHitKill)
aobscan(aob1, D9 40 54 D9 EE DF F1 DD D8)

newmem:
mov [eax+54],#0
fld dword ptr [eax+54]
fldz

exit:
jmp returnhere

aob1:
OneHitKill:
jmp newmem
returnhere:

[Disable]
dealloc(newmem)
unregistersymbol(OneHitKill)
OneHitKill:
db D9 40 54 D9 EE DF F1 DD D8"""

