[[cheat]]
id = "instructions"
name = "Instructions"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
/*

Unit/Structure Cap:

1)\tPause the Game else the AI ships may be affected as well by this cheat

2)\tTurn on script it may take some time for It to enable

3)\tSet the “Max Cap” to 1 [ON]

    a.\t(Optional) you can set “Max Unit/Structure Cap” to a negative number
    (Cheat engine will auto change the negative number to some large number, don’t be scared its ok)
    so for example if the in-game max ship Cap is 250 and you use -100 and scrap that ship type,
    while paused you will get 350 max Cap for that ship or structure

4)\tScrap (Self-Destruct) a ship

5)\tIf you have not used the “Max Unit/Structure Cap” option when you scrap a ship or structure
    even if you have used up all the Cap for a ship or structure it will set it back to max the first
    time around.

    a.\tExample: you have a max ship cap of 300 and you have already build let say 260 ships
    and you scrap that ship type you will get 300 available ships to build on top of your existing 260.

6)\tAlso, let’s say if you have 200 max ship Cap and using this cheat you build 100 more so
    you have total of 300, and you scrap them all even though your max cap is 200 you will still
    be able to build 300. Due to how the game was coded it adds to the max ship count every time
    you scrap a ship or structure

Feel free to share this table and update or add your own cheats and post it.









*/










[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat"""
