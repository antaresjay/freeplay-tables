    addsd xmm0,[_HackPtValue]
    movq [rbx+000000B0+38], xmm0

    movq xmm0, [_Storage] //pop

mov [iHackPt], 0
jmp code


code:
 mov rax,[rbx+000000B0]
  jmp return

