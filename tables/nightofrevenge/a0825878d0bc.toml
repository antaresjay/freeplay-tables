  Date   : 2021-10-23
  Author : 14844

  This script does blah blah blah
}

[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

 
 
aobscan(Start,8B 89 60 01 00 00 3B) // should be unique
alloc(newmem,$1000)
alloc(playerBase,0x4)
label(code)
label(return)

newmem:
mov [playerBase], ecx
code:
  mov ecx,[ecx+00000160]
  jmp return

Start:
  jmp newmem
  nop
return:
registersymbol(Start)
registersymbol(playerBase)
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
Start:
  db 8B 89 60 01 00 00

unregistersymbol(Start)
unregistersymbol(playerBase)
dealloc(playerBase)
