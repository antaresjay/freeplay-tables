[[cheat]]
id = "build-build-satellite-stats-base-address-scan-to-update-view-secret-base"
name = "Build / Build Satellite Stats Base Address Scan (To Update: View Secret Base)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(buildbuildsatellitestats_savedAOB)
label(buildbuildsatellitestats_returnhere)
label(buildbuildsatellitestats_originalcode)
label(buildbuildsatellitestats_exit)

label(buildbuildsatellitestats_update_exit)
label(buildbuildsatellitestats_set_exit)


registersymbol(buildbuildsatellitestats_savedAOB)

aobscan(buildbuildsatellitestats_searchedAOB,8B 41 30 8B 51 34 C3)

alloc(buildbuildsatellitestats_newmem,2048)
alloc(buildbuildsatellitestats_temp1,4)


buildbuildsatellitestats_newmem:
mov [buildbuildsatellitestats_temp1], ebx

cmp dword ptr [buildbuildsatellitestats_update_enable], #0
je buildbuildsatellitestats_update_exit
mov [buildbuildsatellitestats_basepointer], ecx
buildbuildsatellitestats_update_exit:

cmp dword ptr [buildbuildsatellitestats_set_enable], #0
je buildbuildsatellitestats_set_exit
mov ebx, [ecx+30]
mov [ecx+38], ebx
mov ebx, [ecx+34]
mov [ecx+3c], ebx
buildbuildsatellitestats_set_exit:

mov ebx, [buildbuildsatellitestats_temp1]


buildbuildsatellitestats_originalcode:
db 8B 41 30 8B 51 34
//mov eax,[ecx+30]
//mov edx,[ecx+34]


buildbuildsatellitestats_exit:
jmp buildbuildsatellitestats_returnhere


buildbuildsatellitestats_searchedAOB:
buildbuildsatellitestats_savedAOB:
jmp buildbuildsatellitestats_newmem
nop
buildbuildsatellitestats_returnhere:


[DISABLE]
buildbuildsatellitestats_savedAOB:
db 8B 41 30 8B 51 34
//mov eax,[ecx+30]
//mov edx,[ecx+34]

unregistersymbol(buildbuildsatellitestats_savedAOB)

dealloc(buildbuildsatellitestats_newmem)
dealloc(buildbuildsatellitestats_temp1)"""

