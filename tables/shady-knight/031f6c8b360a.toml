[[cheat]]
id = "time-manager-ctrl-numpad-1"
name = "Time Manager (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Shady Knight.exe
// Author            : ndck76
// Executable Version: 2020.3.48.1457
// Game Version      : Build.0450
// Script Date       : 2025-01-09


[ENABLE]

aobscanregion(slowmo,TimeManager:Update,TimeManager:Update+400,0FB646xx85xx0FxxxxxxxxxxF3xxxxxxxxF3xxxxxx66xxxxxx66xxxxxx0Fxxxxxxxxxx0Fxxxxxxxxxx) //TimeManager:Update+228
alloc(newmem,$1000,slowmo)
alloc(data2,8)
alloc(slowmobkp,6)
registersymbol(data2)
registersymbol(slowmo)
registersymbol(slowmobkp)
label(code)
label(return)

slowmobkp:
  readmem(slowmo,6)

newmem:
  mov [data2],rsi

code:
  readmem(slowmo,6)
  jmp return

slowmo:
  jmp newmem
  nop
return:

[DISABLE]

slowmo:
  readmem(slowmobkp,6)

unregistersymbol(*)
dealloc(*)"""

