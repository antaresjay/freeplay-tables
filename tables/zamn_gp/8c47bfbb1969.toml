  Author : t3fur

  This script is semi redundant
}

define(address,"ZAMN_GP.exe"+1D3D2)
define(bytes,89 05 18 0D 10 00)

[ENABLE]

assert(address,bytes)
alloc(newmemi,$1000,"ZAMN_GP.exe"+1D3D2)

label(code)
label(return)
label(Player)
registersymbol(Player)




newmemi:
push rbx
mov rbx,qword ptr [ZAMN_GP.exe+24F690]
mov [Player],rbx
pop rbx

healthcode:

code:
  mov [ZAMN_GP.exe+11E0F0],eax
  jmp return
Player:


address:
  jmp newmemi
  nop
return:


[DISABLE]

address:
  db bytes
