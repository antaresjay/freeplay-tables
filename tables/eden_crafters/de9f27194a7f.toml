id = "split-clone-item"
name = "Split - Clone item"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Eden Crafters
  Version: 0.60d
  Author : WarezLine
}
[ENABLE]
aobscan(splitc,89 44 9A 10 41 0F B6 5D 01)
alloc(clone,$1000,splitc)
label(code)
label(return)

clone:
  cmp rcx,2
  jne code
  add eax,eax
  //mov eax,(int)1000
code:
  mov [rdx+rbx*4+10],eax
  movzx ebx,byte ptr [r13+01]
  jmp return

splitc:
  jmp clone
  nop 4
return:
registersymbol(splitc)

[DISABLE]
splitc:
  db 89 44 9A 10 41 0F B6 5D 01
unregistersymbol(splitc)
dealloc(clone)"""
