[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
aobscan(healthptr,83 C4 30 88 45 FB 83 EC 0C 53 e8 * * * * 83 C4 10)
aobscan(health,8B 48 18 2B 4D 0C 89 48 18 83 EC 0C 53 e8)
registersymbol(health)
newmem: //this is allocated memory, you have read,write,execute access
//place your code here
mov ecx,[eax+18]
cmp [ebp+4],healthptr
jne originalcode
mov [ebp+c],0
originalcode:
sub ecx,[ebp+0C]
jmp returnhere

health://Aeonic.ActionLegion.Units:SoldierUnit:Hit+6e:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
health://
  db 8B 48 18 2B 4D 0C
  unregistersymbol(health)"""

