[[cheat]]
id = "in-battle"
name = "In Battle"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(Battle_stats,PointAtCard:Update, PointAtCard:Update+6000,8B 87 ?? ?? ?? ?? 89 87 ?? ?? ?? ?? 8B 87 ?? ?? ?? ?? 89 87 ?? ?? ?? ?? 0F B6 ) // should be unique
alloc(newmem,$1000)

registersymbol(max_hp)
registersymbol(One_Hit_Kill)
registersymbol(Is_immune)
registersymbol(can_retaliate)
registersymbol(read_battle)

label(max_hp)
label(One_Hit_Kill)
label(Is_immune)
label(can_retaliate)
label(enemy)
label(read_battle)

label(code)
label(return)

newmem:
 cmp byte ptr [edi+14C],#1  //skip if player "dummy"
 je code
 db 80 BF    //cmp byte ptr [edi+             ---->Replace cmp byte ptr [edi+AC], #0 //0 is player 1=enemy
 readmem(Battle_stats+2,4)      //offset
 db 00                         //to Zero
 jne enemy
 cmp [max_hp],00000001
 jne code
 db C7 87                      //mov [edi+ -------> mov [edi+000000B8],#999
 readmem(Battle_stats+2,4)    //offset
 db E7 03 00 00                //health to 999
 cmp [Is_immune], 00000001
 jne code
 mov byte ptr [edi+00000109],#1  //immune
 jne code
 mov byte ptr [edi+0000019E],#1  //has immunity
 cmp [can_retaliate], 00000001
 jne code
 mov byte ptr [edi+00000119],#1  //Can retaliate
 //edi+11D do respawn->try later

enemy:
 cmp [One_Hit_Kill], 00000001
 jne code
 db C7 87                   //mov [edi+   --->mov [edi+000000B8],#0   //enemy health
 readmem(Battle_stats+2,4)   //offset
 db 00 00 00 00              //to zero

code:
  readmem(Battle_stats,6)
  jmp return

max_hp:
dd 0
One_Hit_Kill:
dd 0
Is_immune:
dd 0
can_retaliate:
dd 0

read_battle:
readmem(Battle_stats,6)


Battle_stats:
  jmp newmem
  nop
return:
registersymbol(Battle_stats)

[DISABLE]

Battle_stats:
  //db 8B 87 B8 00 00 00
readmem(read_battle,6)

unregistersymbol(Battle_stats)
dealloc(newmem)
unregistersymbol(max_hp)
unregistersymbol(One_Hit_Kill)
unregistersymbol(Is_immune)
unregistersymbol(can_retaliate)
unregistersymbol(read_battle)

{
// ORIGINAL CODE - INJECTION POINT: PointAtCard:Update+1336

PointAtCard:Update+1306: 89 95 28 F8 FF FF     - mov [ebp-000007D8],edx
PointAtCard:Update+130c: 8B 87 A0 00 00 00     - mov eax,[edi+000000A0]
PointAtCard:Update+1312: 8B C8                 - mov ecx,eax
PointAtCard:Update+1314: 8B 89 B4 00 00 00     - mov ecx,[ecx+000000B4]
PointAtCard:Update+131a: 03 CA                 - add ecx,edx
PointAtCard:Update+131c: 89 88 B4 00 00 00     - mov [eax+000000B4],ecx
PointAtCard:Update+1322: 8B 87 A0 00 00 00     - mov eax,[edi+000000A0]
PointAtCard:Update+1328: 8B C8                 - mov ecx,eax
PointAtCard:Update+132a: 8B 89 B4 00 00 00     - mov ecx,[ecx+000000B4]
PointAtCard:Update+1330: 89 88 C0 00 00 00     - mov [eax+000000C0],ecx
// ---------- INJECTING HERE ----------
PointAtCard:Update+1336: 8B 87 B8 00 00 00     - mov eax,[edi+000000B8]
// ---------- DONE INJECTING  ----------
PointAtCard:Update+133c: 89 87 BC 00 00 00     - mov [edi+000000BC],eax
PointAtCard:Update+1342: 8B 87 B4 00 00 00     - mov eax,[edi+000000B4]
PointAtCard:Update+1348: 89 87 C0 00 00 00     - mov [edi+000000C0],eax
PointAtCard:Update+134e: 0F B6 87 FB 00 00 00  - movzx eax,byte ptr [edi+000000FB]
