[[cheat]]
id = "activate-numpad-0"
name = "Activate (Numpad 0)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
globalalloc(cameraBase, 4)
alloc(newmem,$1000)
aobscan(cameraBaseHook, D9 83 08 02 00 00 DA E9 89 85 18 FF FF FF DF E0 F6 C4 44 7B 4B) // should be unique

label(return)

registersymbol(cameraBaseHook)

newmem:
  mov [cameraBase], ebx
  fld dword ptr [ebx+00000208]
  jmp return

cameraBase:

cameraBaseHook:
  jmp newmem
  nop
return:

[DISABLE]
cameraBaseHook:
  db D9 83 08 02 00 00

dealloc(newmem)
unregistersymbol(cameraBaseHook)"""

