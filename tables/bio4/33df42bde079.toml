type = "script"
source = """
//Author: Pedro BR HUEHUEHUE
//Created: August 7, 2017
//Resident Evil 4 Ultimate HD (Steam Version)
[ENABLE]

aobscan(health, 8B F8 66 29 BE B4 4F 00 00)
label(_health)
registersymbol(_health)

health:

_health:
// mov edi,eax [this is original command for 8B F8...
//...(it's above66 29 BE B4 4F 00 00)]
