type = "script"
source = """
{ Game   : bio4.exe
  Version: 
  Date   : 2021-10-14
  Author : pedro

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(elgigante,bio4.exe,01 96 18 0A 00 00) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  add [esi+00000A18],3E8 //1000
  jmp return

elgigante:
  jmp newmem
  nop
return:
registersymbol(elgigante)

[DISABLE]

elgigante:
  db 01 96 18 0A 00 00

unregistersymbol(elgigante)
dealloc(newmem)

{
