bio4.exe+B0AD7: 3C 2A                          - cmp al,2A
bio4.exe+B0AD9: 75 0F                          - jne bio4.exe+B0AEA
bio4.exe+B0ADB: C7 86 FC 00 00 00 02 05 00 00  - mov [esi+000000FC],00000502
bio4.exe+B0AE5: 5E                             - pop esi
bio4.exe+B0AE6: 8B E5                          - mov esp,ebp
bio4.exe+B0AE8: 5D                             - pop ebp
bio4.exe+B0AE9: C3                             - ret 
bio4.exe+B0AEA: 8B 55 FC                       - mov edx,[ebp-04]
// ---------- INJECTING HERE ----------
bio4.exe+B0AED: 01 96 18 0A 00 00              - add [esi+00000A18],edx
// ---------- DONE INJECTING  ----------
bio4.exe+B0AF3: 81 BE 18 0A 00 00 E8 03 00 00  - cmp [esi+00000A18],000003E8
bio4.exe+B0AFD: 7D 2C                          - jnl bio4.exe+B0B2B
bio4.exe+B0AFF: 0F B6 86 2E 03 00 00           - movzx eax,byte ptr [esi+0000032E]
bio4.exe+B0B06: 83 C0 F3                       - add eax,-0D
bio4.exe+B0B09: 83 F8 20                       - cmp eax,20
bio4.exe+B0B0C: 77 63                          - ja bio4.exe+B0B71
bio4.exe+B0B0E: 0F B6 80 C4 0B 87 00           - movzx eax,byte ptr [eax+bio4.exe+B0BC4]
bio4.exe+B0B15: FF 24 85 BC 0B 87 00           - jmp dword ptr [eax*4+bio4.exe+B0BBC]
