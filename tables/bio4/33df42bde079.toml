[[cheat]]
id = "damage-multiplier"
name = "Damage Multiplier"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

alloc(damageMultiplier, 4)

damageMultiplier:
dd #1

registersymbol(damageMultiplier)

newmem:

originalcode:
imul edi, [damageMultiplier]
sub [esi+00000324],di //edi is the damage dealt

exit:
jmp returnhere

"bio4.exe"+1B5D6E:
jmp newmem
nop 2
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
dealloc(damageMultiplier)
unregistersymbol(damageMultiplier)

"bio4.exe"+1B5D6E:
sub [esi+00000324],di
//Alt: db 66 29 BE 24 03 00 00"""

