type = "script"
source = """
{ Game   : Yunyun_Syndrome.exe
  Version: 
  Date   : 2026-04-25
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,App.InGame.GameController:Update)
define(bytes,55 48 8B EC 48 83 EC 60)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,App.InGame.GameController:Update)

label(code)
label(return)

newmem:
mov [gamecontroller_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,60
  jmp return

gamecontroller_ptr:
dq 0

address:
  jmp newmem
  nop 3
return:
registersymbol(gamecontroller_ptr)

[DISABLE]

address:
  db bytes
  // push rbp
  // mov rbp,rsp
  // sub rsp,60

dealloc(newmem)
unregistersymbol(gamecontroller_ptr)"""

