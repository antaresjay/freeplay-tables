[[cheat]]
id = "progressiondata-base-address-scan-initialization-activate-this-first"
name = "ProgressionData Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(ProgressionData_basepointer)
registersymbol(ProgressionData_update_enable)
registersymbol(ProgressionData_set_enable)
registersymbol(ProgressionData_petalsset_enable)

alloc(ProgressionData_basepointer, 8)
alloc(ProgressionData_update_enable, 4)
alloc(ProgressionData_set_enable, 4)
alloc(ProgressionData_petalsset_enable, 4)


[DISABLE]
unregistersymbol(ProgressionData_basepointer)
unregistersymbol(ProgressionData_update_enable)
unregistersymbol(ProgressionData_set_enable)
unregistersymbol(ProgressionData_petalsset_enable)

dealloc(ProgressionData_basepointer)
dealloc(ProgressionData_update_enable)
dealloc(ProgressionData_set_enable)
dealloc(ProgressionData_petalsset_enable)"""

[[cheat]]
id = "progressiondata-base-address-scan-to-activate-view-shop-to-update-view-shop"
name = "ProgressionData Base Address Scan (To Activate: View Shop, To Update: View Shop)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(ProgressionData_savedAOB)
label(ProgressionData_returnhere)
label(ProgressionData_originalcode)
label(ProgressionData_exit)

label(ProgressionData_update_exit)
label(ProgressionData_set_exit)
label(ProgressionData_petalsset_exit)

registersymbol(ProgressionData_savedAOB)

//0523F55A - 41 FF D3              - call r11d
//0523F55D - 48 83 C4 20           - add rsp,20
// ProgressionData:Update+21
//0523F561 - 48 8B 86 98000000     - mov rax,[rsi+00000098]
//0523F568 - 48 85 C0              - test rax,rax
//0523F56B - 74 27                 - je 0523F594
//0523F56D - 48 8B 86 98000000     - mov rax,[rsi+00000098]
//0523F574 - 48 8B C8              - mov rcx,rax
aobscan(ProgressionData_searchedAOB, 48 8B 86 98 00 00 00 48 85 C0 74 27)

alloc(ProgressionData_newmem, 2048, ProgressionData_searchedAOB)
alloc(ProgressionData_temp1, 8, ProgressionData_searchedAOB)
alloc(ProgressionData_temp2, 8, ProgressionData_searchedAOB)
alloc(ProgressionData_temp3, 8, ProgressionData_searchedAOB)
alloc(ProgressionData_temp4, 8, ProgressionData_searchedAOB)
alloc(ProgressionData_temp5, 8, ProgressionData_searchedAOB)


ProgressionData_newmem:
mov [ProgressionData_temp1], rax
mov [ProgressionData_temp2], rbx
mov [ProgressionData_temp3], rcx
mov [ProgressionData_temp4], rdx

cmp dword ptr [ProgressionData_update_enable], #0
je ProgressionData_update_exit
mov [ProgressionData_basepointer], rsi
ProgressionData_update_exit:

cmp dword ptr [ProgressionData_set_enable], #0
je ProgressionData_set_exit
ProgressionData_set_exit:

cmp dword ptr [ProgressionData_petalsset_enable], #0
je ProgressionData_petalsset_exit
mov [rsi+a4], #9999
ProgressionData_petalsset_exit:

mov rax, [ProgressionData_temp1]
mov rbx, [ProgressionData_temp2]
mov rcx, [ProgressionData_temp3]
mov rdx, [ProgressionData_temp4]


ProgressionData_originalcode:
db 48 8B 86 98 00 00 00
//mov rax,[rsi+00000098]


ProgressionData_exit:
jmp ProgressionData_returnhere


ProgressionData_searchedAOB:
ProgressionData_savedAOB:
jmp ProgressionData_newmem
nop
nop
ProgressionData_returnhere:


[DISABLE]
ProgressionData_savedAOB:
db 48 8B 86 98 00 00 00
//mov rax,[rsi+00000098]

unregistersymbol(ProgressionData_savedAOB)

dealloc(ProgressionData_newmem)
dealloc(ProgressionData_temp1)
dealloc(ProgressionData_temp2)
dealloc(ProgressionData_temp3)
dealloc(ProgressionData_temp4)
dealloc(ProgressionData_temp5)"""

