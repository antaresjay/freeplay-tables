[[cheat]]
id = "leveldata-base-address-scan-initialization-activate-this-first"
name = "LevelData Base Address Scan Initialization (Activate This First)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(LevelData_basepointer)
registersymbol(LevelData_update_enable)
registersymbol(LevelData_set_enable)
registersymbol(LevelData_polygonsset_enable)
registersymbol(LevelData_hpset_enable)
registersymbol(LevelData_mpset_enable)
registersymbol(LevelData_burstset_enable)
registersymbol(LevelData_statsset_enable)

alloc(LevelData_basepointer, 8)
alloc(LevelData_update_enable, 4)
alloc(LevelData_set_enable, 4)
alloc(LevelData_polygonsset_enable, 4)
alloc(LevelData_hpset_enable, 4)
alloc(LevelData_mpset_enable, 4)
alloc(LevelData_burstset_enable, 4)
alloc(LevelData_statsset_enable, 4)


[DISABLE]
unregistersymbol(LevelData_basepointer)
unregistersymbol(LevelData_update_enable)
unregistersymbol(LevelData_set_enable)
unregistersymbol(LevelData_polygonsset_enable)
unregistersymbol(LevelData_hpset_enable)
unregistersymbol(LevelData_mpset_enable)
unregistersymbol(LevelData_burstset_enable)
unregistersymbol(LevelData_statsset_enable)

dealloc(LevelData_basepointer)
dealloc(LevelData_update_enable)
dealloc(LevelData_set_enable)
dealloc(LevelData_polygonsset_enable)
dealloc(LevelData_hpset_enable)
dealloc(LevelData_mpset_enable)
dealloc(LevelData_burstset_enable)
dealloc(LevelData_statsset_enable)"""

[[cheat]]
id = "leveldata-base-address-scan-to-activate-play-level-to-update-play-level"
name = "LevelData Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(LevelData_savedAOB)
label(LevelData_returnhere)
label(LevelData_originalcode)
label(LevelData_exit)

label(LevelData_update_exit)
label(LevelData_set_exit)
label(LevelData_polygonsset_exit)
label(LevelData_hpset_exit)
label(LevelData_mpset_exit)
label(LevelData_burstset_exit)
label(LevelData_statsset_exit)

registersymbol(LevelData_savedAOB)

//0CC918A7 - 48 8B 40 48           - mov rax,[rax+48]
//0CC918AB - 48 89 45 F0           - mov [rbp-10],rax
// LevelManager:UpdateTimer+4f
//0CC918AF - F3 0F10 80 E0000000   - movss xmm0,[rax+000000E0]
//0CC918B7 - F3 0F5A C0            - cvtss2sd xmm0,xmm0
//0CC918BB - F2 0F11 45 E8         - movsd [rbp-18],xmm0
//0CC918C0 - 48 83 EC 20           - sub rsp,20
//0CC918C4 - 49 BB 10B6180500000000 - mov r11,000000000518B610 : [EC8B4855]
//0CC918CE - 41 FF D3              - call r11d
aobscan(LevelData_searchedAOB, F3 0F 10 80 E0 00 00 00 F3 0F 5A C0 F2 0F 11 45 E8 48 83 EC 20)

alloc(LevelData_newmem, 2048, LevelData_searchedAOB)
alloc(LevelData_temp1, 8, LevelData_searchedAOB)
alloc(LevelData_temp2, 8, LevelData_searchedAOB)
alloc(LevelData_temp3, 8, LevelData_searchedAOB)
alloc(LevelData_temp4, 8, LevelData_searchedAOB)
alloc(LevelData_temp5, 8, LevelData_searchedAOB)


LevelData_newmem:
mov [LevelData_temp1], rax
mov [LevelData_temp2], rbx
mov [LevelData_temp3], rcx
mov [LevelData_temp4], rdx

cmp dword ptr [LevelData_update_enable], #0
je LevelData_update_exit
mov [LevelData_basepointer], rax
LevelData_update_exit:

cmp dword ptr [LevelData_set_enable], #0
je LevelData_set_exit
LevelData_set_exit:

cmp dword ptr [LevelData_polygonsset_enable], #0
je LevelData_polygonsset_exit
mov [rax+78], (float)999
mov [rax+90], (float)999
mov [rax+98], (float)999
mov [rax+a0], (float)999
LevelData_polygonsset_exit:

cmp dword ptr [LevelData_hpset_enable], #0
je LevelData_hpset_exit
mov rbx, [rax+60]
test rbx, rbx
je LevelData_hpset_exit
mov [rbx+8c], (float)9999999
mov rbx, [rax+50]
test rbx, rbx
je LevelData_hpset_exit
mov [rbx+8c], (float)9999999
mov rbx, [rax+58]
test rbx, rbx
je LevelData_hpset_exit
mov [rbx+8c], (float)9999999
LevelData_hpset_exit:

cmp dword ptr [LevelData_mpset_enable], #0
je LevelData_mpset_exit
mov rbx, [rax+60]
test rbx, rbx
je LevelData_mpset_exit
mov [rbx+114], (float)9999999
mov rbx, [rax+50]
test rbx, rbx
je LevelData_mpset_exit
mov [rbx+114], (float)9999999
mov rbx, [rax+58]
test rbx, rbx
je LevelData_mpset_exit
mov [rbx+114], (float)9999999
LevelData_mpset_exit:

cmp dword ptr [LevelData_burstset_enable], #0
je LevelData_burstset_exit
mov rbx, [rax+60]
test rbx, rbx
je LevelData_burstset_exit
mov [rbx+11c], (float)6
mov rbx, [rax+50]
test rbx, rbx
je LevelData_burstset_exit
mov [rbx+11c], (float)6
mov rbx, [rax+58]
test rbx, rbx
je LevelData_burstset_exit
mov [rbx+11c], (float)6
LevelData_burstset_exit:

cmp dword ptr [LevelData_statsset_enable], #0
je LevelData_statsset_exit
mov rbx, [rax+60]
test rbx, rbx
je LevelData_statsset_exit
mov rbx, [rbx+70]
test rbx, rbx
je LevelData_statsset_exit
mov [rbx+24], (float)9999
mov [rbx+28], (float)9999
mov [rbx+2c], #9999
mov [rbx+30], #9999
mov [rbx+34], #700
mov [rbx+38], (float)9999
mov [rbx+3c], (float)9999
mov rbx, [rax+50]
test rbx, rbx
je LevelData_statsset_exit
mov rbx, [rbx+70]
test rbx, rbx
je LevelData_statsset_exit
mov [rbx+24], (float)9999
mov [rbx+28], (float)9999
mov [rbx+2c], #9999
mov [rbx+30], #9999
mov [rbx+34], #700
mov [rbx+38], (float)9999
mov [rbx+3c], (float)9999
mov rbx, [rax+58]
test rbx, rbx
je LevelData_statsset_exit
mov rbx, [rbx+70]
test rbx, rbx
je LevelData_statsset_exit
mov [rbx+24], (float)9999
mov [rbx+28], (float)9999
mov [rbx+2c], #9999
mov [rbx+30], #9999
mov [rbx+34], #700
mov [rbx+38], (float)9999
mov [rbx+3c], (float)9999
LevelData_statsset_exit:

mov rax, [LevelData_temp1]
mov rbx, [LevelData_temp2]
mov rcx, [LevelData_temp3]
mov rdx, [LevelData_temp4]


LevelData_originalcode:
db F3 0F 10 80 E0 00 00 00
//movss xmm0,[rax+000000E0]


LevelData_exit:
jmp LevelData_returnhere


LevelData_searchedAOB:
LevelData_savedAOB:
jmp LevelData_newmem
nop
nop
nop
LevelData_returnhere:


[DISABLE]
LevelData_savedAOB:
db F3 0F 10 80 E0 00 00 00
//movss xmm0,[rax+000000E0]

unregistersymbol(LevelData_savedAOB)

dealloc(LevelData_newmem)
dealloc(LevelData_temp1)
dealloc(LevelData_temp2)
dealloc(LevelData_temp3)
dealloc(LevelData_temp4)
dealloc(LevelData_temp5)"""

