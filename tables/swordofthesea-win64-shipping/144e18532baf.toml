[[cheat]]
id = "trick-system-ctrl-numpad-1"
name = "Trick System (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : SwordOfTheSea-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.4.4.0
// Game Version      : Build.19645438
// Script Date       : 2025-08-20


[ENABLE]

aobscanmodule(score,SwordOfTheSea-Win64-Shipping.exe,8BxxxxxxxxxxB0xx89xxxxxxxxxx488Bxxxxxx4883xxxx5F) // should be unique
alloc(newmem,$1000,score)
alloc(data2,8)
alloc(scorebkp,6)
registersymbol(data2)
registersymbol(score)
registersymbol(scorebkp)
label(code)
label(return)

scorebkp:
  readmem(score,6)

newmem:
  mov [data2],rax

code:
  readmem(score,6)
  jmp return

score:
  jmp newmem
  nop
return:

[DISABLE]

score:
  readmem(scorebkp,6)

unregistersymbol(*)
dealloc(*)"""

