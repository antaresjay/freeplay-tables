[[cheat]]
id = "inf-hp-hold-t-to-disable-temporary"
name = "Inf. HP (Hold T to disable temporary)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048) //2kb should be enough
label(begin1)
label(returnhere1)
label(originalcode1)
label(exit1)
label(begin2)
label(returnhere2)
label(originalcode2)
label(exit2)
label(pHealth)
registersymbol(pHealth)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here

////

begin1:
cmp ebp,#16
jne originalcode1
mov [pHealth],ecx

originalcode1:
mov eax,[ecx+0C]
ret
int 3

exit1:
jmp returnhere1

////

begin2:
sub eax,ebx

pushad
push 'T'
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
je originalcode2

cmp esi,[pHealth]
je exit2

originalcode2:
//sub eax,ebx
mov [esi+0C],eax

exit2:
jmp returnhere2

////
pHealth:
dd 0
////

"GatlingGears.exe"+15D7F0:
jmp begin1
returnhere1:

"GatlingGears.exe"+15DA98:
jmp begin2
returnhere2:

///
 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
"GatlingGears.exe"+15D7F0:
mov eax,[ecx+0C]
ret
int 3
//Alt: db 8B 41 0C C3 CC
"GatlingGears.exe"+15DA98:
sub eax,ebx
mov [esi+0C],eax
//Alt: db 2B C3 89 46 0C
unregistersymbol(pHealth)"""

