[[cheat]]
id = "infinite-money"
name = "Infinite Money"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
aobscan(money,8B 50 14 39 09 FF 15 * * * *  8B CE e8 * * * * 8B D0)
registersymbol(money)
newmem: //this is allocated memory, you have read,write,execute access
//place your code here
mov [eax+14],#99999999
mov edx,[eax+14]
cmp [ecx],ecx

jmp returnhere

money:
jmp newmem
returnhere:



 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
money:
 db 8B 50 14 39 09
 unregistersymbol(money)"""

