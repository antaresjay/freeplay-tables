  inc eax
  mov [rbp-00000DE8],eax
  jmp return

pPtr:
dq 0

lF:
dd 0

armoF:
dd 0

amF:
dd 0

boF:
dd 0

cheats+04:
  jmp far newmem
  nop
return:
registersymbol(cheats)

[DISABLE]

