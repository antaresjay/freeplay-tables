[[cheat]]
id = "set-seller-temper-to-zero"
name = "Set Seller Temper To Zero"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@FearlessRevolution
[ENABLE]
aobscanmodule(zerotemper3,GameAssembly.dll,F3 0F 11 83 AC 00 00 00 E8)
aobscanmodule(zerotemper2,GameAssembly.dll,F3 0F 11 83 AC 00 00 00 0F 28 74)
aobscanmodule(zerotemper,GameAssembly.dll,F3 0F 11 83 AC 00 00 00 0F 28 74)
alloc(newmem,$1000,zerotemper)
alloc(newmem2,$1000,zerotemper2)
alloc(newmem3,$1000,zerotemper3)
registersymbol(zerotemper)
registersymbol(zerotemper2)
registersymbol(zerotemper3)
label(code code2 code3)
label(return return2 return3)

newmem:
xorps xmm0,xmm0
code:
  movss [rbx+000000AC],xmm0
  jmp return

zerotemper:
  jmp newmem
  nop 3
return:

newmem2:
xorps xmm0,xmm0
code2:
  movss [rbx+000000AC],xmm0
  jmp return2

zerotemper2:
  jmp newmem2
  nop 3
return2:

newmem3:

code3:
  movss [rbx+000000AC],xmm0
  jmp return3

zerotemper3:
  jmp newmem3
  nop 3
return3:


[DISABLE]

zerotemper:
  db F3 0F 11 83 AC 00 00 00


zerotemper2:
  db F3 0F 11 83 AC 00 00 00


zerotemper3:
  db F3 0F 11 83 AC 00 00 00

unregistersymbol(*)
dealloc(*)"""

