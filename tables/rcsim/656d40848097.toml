[[cheat]]
id = "enable-reputation-multiplier"
name = "Enable Reputation Multiplier"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@FearlessRevolution
[ENABLE]

aobscanmodule(repmultiplier,GameAssembly.dll,F3 0F 11 49 30 72)
alloc(newmem,$1000,repmultiplier)
registersymbol(repmultiplier repm)
label(code return repm)

