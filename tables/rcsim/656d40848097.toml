[[cheat]]
id = "grab-game-data-save-game"
name = "Grab Game Data (Save Game)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@FearlessRevolution
[ENABLE]

aobscanmodule(gamedata,GameAssembly.dll,48 8B D9 75 13 48 8D 0D * * * * E8 7B 2E)
alloc(newmem,$1000,gamedata)
registersymbol(gamedata gdata)
label(code return gdata)

newmem:
mov [gdata],rcx

code:
  mov rbx,rcx
  jne GameAssembly.dll+60EE5C
  jmp return

gdata:
dq 0

gamedata:
  jmp newmem
return:
registersymbol(gamedata)

[DISABLE]

gamedata:
  db 48 8B D9 75 13

unregistersymbol(*)
