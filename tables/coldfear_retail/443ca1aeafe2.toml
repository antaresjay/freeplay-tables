[[cheat]]
id = "inventory-fuel-flame-thrower"
name = "Inventory   [Fuel]   Flame Thrower"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(FuelCapacity,$process,D9 9E 3C 05 00 00)
alloc(newmem,$100)
label(return)
registersymbol(FuelCapacity)
newmem:
  fstp dword ptr [esi+53c]
  mov [esi+53c],(float)3000
  jmp return
FuelCapacity:
  jmp newmem
  nop
return:
dealloc(newmem)
unregistersymbol(FuelCapacity)
[DISABLE]
FuelCapacity:
  db D9 9E 3C 05 00 00"""

