[[cheat]]
id = "no-recoil"
name = "No Recoil"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(HasRecoil,DeceiveInc-Win64-Shipping.exe,80 B9 4C 07 00 00 00)
alloc(newmem,$1000,HasRecoil)
label(code return)

newmem:
mov [rcx+74C],0

code:
  cmp byte ptr [rcx+0000074C],00
  jmp return

HasRecoil:
  jmp newmem
  nop 2
return:
registersymbol(HasRecoil)

[DISABLE]

HasRecoil:
  db 80 B9 4C 07 00 00 00

unregistersymbol(*)
dealloc(*)"""
