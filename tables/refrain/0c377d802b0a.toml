[[cheat]]
id = "coordfinder"
name = "CoordFinder"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : refrain.exe
  Version: -
  Author : anon9

  This Script scans for coordinates and preps a pointer value.
  The Character x,y values are byte values.
  The Camera x,y values are float values and 5 times the character values.
  You can turn this script off once the coords are found.
}

[ENABLE]

aobscanmodule(CoordScanner,refrain.exe,8B F1 8B 00 89 46 54) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov esi,ecx
  mov eax,[eax]
  mov [esi+54],eax
  mov [xCoord],esi
  //add [xCoord],38
  mov [yCoord],esi
  //add [yCoord],39
  jmp return

CoordScanner:
  jmp newmem
  nop
  nop
return:
registersymbol(CoordScanner)

[DISABLE]

CoordScanner:
  db 8B F1 8B 00 89 46 54

unregistersymbol(CoordScanner)
dealloc(newmem)

