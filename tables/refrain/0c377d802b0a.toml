[[cheat]]
id = "editable-codes-varprep-variable-setter"
name = "Editable Codes (varPrep - Variable Setter)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : refrain.exe
  Version: -
  Author : anon9

  This Script prepares several variables with values in one newmem alloc.
  This allows multiple scripts to use the same variable without accidentally
  deallocating those variables.
}

[ENABLE]

alloc(newmem,$1000)

label(varMana)
registersymbol(varMana)
label(varItemCount)
registersymbol(varItemCount)
label(varBuySilver)
registersymbol(varBuySilver)
label(varPetitionMana)
registersymbol(varPetitionMana)
label(varPtrHPScanner)
registersymbol(varPtrHPScanner)
//label(varScannedHP)
//registersymbol(varScannedHP) //the pointer method is more efficient.
label(xCoord)
registersymbol(xCoord)
label(yCoord)
registersymbol(yCoord)
label(varDropRate)
registersymbol(varDropRate)
label(varExpGainSet)
registersymbol(varExpGainSet)
label(varExpGainMult)
registersymbol(varExpGainMult)
label(varManaGainSet)
registersymbol(varManaGainSet)
label(varManaGainMult)
registersymbol(varManaGainMult)
label(varPtrCharStrScanner)
registersymbol(varPtrCharStrScanner)

newmem:

//Using # to make it easier for users to edit.
//The dq 0 are to act as a buffer (they aren't strictly necessary, but can
//help with certain tasks)

varMana:
  dq #5655
  dq 0
varItemCount:
  dq #62
  dq 0
varBuySilver:
  dq #150000
  dq 0
varPetitionMana:
  dq #250000
  dq 0
varPtrHPScanner:
  dq #0
  dq 0
//varScannedHP:
//  dq #0
//  dq 0
xCoord:
  dq #0
  dq 0
yCoord:
  dq #0
  dq 0
varDropRate:
  dq #999
  dq 0
varExpGainSet:
  dq #1
  dq 0
varExpGainMult:
  dd (float)1.0
  dq 0
varManaGainSet:
  dq #1
  dq 0
varManaGainMult:
  dd (float)1.0
  dq 0
varPtrCharStrScanner:
  dq #0
  dq 0

[DISABLE]

unregistersymbol(varMana)
unregistersymbol(varItemCount)
unregistersymbol(varBuySilver)
unregistersymbol(varPetitionMana)
unregistersymbol(varPtrHPScanner)
//unregistersymbol(varScannedHP)
unregistersymbol(xCoord)
unregistersymbol(yCoord)
unregistersymbol(varDropRate)
unregistersymbol(varExpGainSet)
unregistersymbol(varExpGainMult)
unregistersymbol(varManaGainSet)
unregistersymbol(varManaGainMult)
unregistersymbol(varPtrCharStrScanner)
dealloc(newmem)

