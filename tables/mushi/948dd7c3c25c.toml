[[cheat]]
id = "max-weapon-level-on-map-change"
name = "Max Weapon Level (On Map Change)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(Wep,playeranim:checkweapon+435,playeranim:checkweapon+4f8,8B 05 2C 4C 4E 16 3D 20 00 00 00 75 0A C7 87 24)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov eax,#9999999999
  jmp return

Wep:
  jmp newmem
  nop
return:
registersymbol(Wep)

[DISABLE]

Wep:
  db 8B 05 2C 4C 4E 16

unregistersymbol(Wep)
dealloc(newmem)"""
