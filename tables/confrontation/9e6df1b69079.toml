[[cheat]]
id = "x-confrontation-v1-0-0-script-v1-1"
name = "[X] <== Confrontation v1.0.0 Script v1.1"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
===========================================
 Game Title    : Confrontation
 Game Version  : 1.0.0.18995
 Process Name  : Confrontation.exe
 Script Version: 1.1
 CE Version    : 6.1
 Release date  : 17-May-2012
 Author        : Recifense
 Features:
 - Full Mana
 - Full HP
 - Some Pointers
===========================================
}

[ENABLE]
//=========================================
// Check if script is compatible to this game version
// If false the script will not be loaded

assert(Confrontation.exe+000aac96,d9 81 b8 00 00 00 8b 50 08 dd 1a)

//=========================================
alloc(MyCode,1024,Confrontation.exe)
//=========================================
// Declaration section
label(_MonHero)
label(_MonHZZ)
label(_MonH00)
label(_MonH01)
label(_MonH02)
label(_BackMH)
label(_ExitMH)
label(pHero)
label(pCommon)
label(iEnableGM)
label(iEnableMM)

//=========================================
// Registering Symbols
registersymbol(MyCode)
registersymbol(pHero)
registersymbol(pCommon)
registersymbol(iEnableGM)
registersymbol(iEnableMM)

//=========================================
MyCode:
//=========================================
_MonHero:
 push ebx

 mov edx,[ecx+000000b4]
 test edx,edx
 jz _MonH00

 mov edx,[edx+0000008c]
 test edx,edx
 jz _MonH00

 mov ebx,[edx]
 cmp ebx,'Dari'
 je _MonHZZ

 cmp ebx,'Zeli'
 je _MonHZZ

 cmp ebx,'Loth'
 je _MonHZZ

 cmp ebx,'Lanw'
 jne _MonH00

_MonHZZ:
 mov ebx,[ecx+000000ac]
 mov [pCommon],ebx

_MonH00:
 mov ebx,[ecx+000000ac]
 cmp ebx,[pCommon]
 jne _ExitMH

 movzx ebx,byte ptr [ecx+000000b0]
 cmp ebx,4
 jge _MonH01

 lea edx,[pHero]
 mov [edx+ebx*4],ecx

_MonH01:
 cmp dword ptr [iEnableMM],0
 je _MonH02                        // Jump if feature is disabled

 mov ebx,[ecx+000000c4]
 mov [eax+000000c0],ebx
 mov ebx,[ecx+000000cc]
 mov [eax+000000c8],ebx
 mov ebx,[ecx+000000d4]
 mov [eax+000000d0],ebx

_MonH02:
 cmp dword ptr [iEnableGM],0
 je _ExitMH                        // Jump if feature is disabled

 mov ebx,[ecx+000000bc]
 mov [ecx+000000b8],ebx

_ExitMH:
 pop ebx

 fld dword ptr [ecx+000000b8]      // Original code (rds cMana)
 jmp _BackMH                       // Back to main code

//=========================================
 db '===================================>'
 db 'CE6.1 Script by Recifense 051712'
//=========================================
// Variables
iEnableGM:
 dd 0
iEnableMM:
 dd 0
pCommon:
 dd 0
pHero:
 dd 0
 dd 0
 dd 0
 dd 0

//=========================================
// Hacking Points
Confrontation.exe+000aac96:
 jmp _MonHero
 nop
_BackMH:

//=========================================
// Script for Restoring Original Codes
[DISABLE]
Confrontation.exe+000aac96:
// fld dword ptr [ecx+000000b8]
 db d9 81 b8 00 00 00

//=========================================
// Unregistering Symbols
unregistersymbol(MyCode)
unregistersymbol(pHero)
unregistersymbol(pCommon)
unregistersymbol(iEnableMM)
unregistersymbol(iEnableGM)

//=========================================
dealloc(MyCode)
//============= Scripts End ===============

// ****************************************
// NOTES
// ****************************************
{
}"""

