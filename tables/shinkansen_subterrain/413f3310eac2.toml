[[cheat]]
id = "gamestats-base-address-scan-initialization-activate-this-first"
name = "GameStats Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameStats_basepointer)
registersymbol(GameStats_update_enable)
registersymbol(GameStats_set_enable)
registersymbol(GameStats_hpset_enable)
registersymbol(GameStats_statusset_enable)
registersymbol(GameStats_weightset_enable)
registersymbol(GameStats_statsset_enable)

alloc(GameStats_basepointer, 4)
alloc(GameStats_update_enable, 4)
alloc(GameStats_set_enable, 4)
alloc(GameStats_hpset_enable, 4)
alloc(GameStats_statusset_enable, 4)
alloc(GameStats_weightset_enable, 4)
alloc(GameStats_statsset_enable, 4)


[DISABLE]
unregistersymbol(GameStats_basepointer)
unregistersymbol(GameStats_update_enable)
unregistersymbol(GameStats_set_enable)
unregistersymbol(GameStats_hpset_enable)
unregistersymbol(GameStats_statusset_enable)
unregistersymbol(GameStats_weightset_enable)
unregistersymbol(GameStats_statsset_enable)

dealloc(GameStats_basepointer)
dealloc(GameStats_update_enable)
dealloc(GameStats_set_enable)
dealloc(GameStats_hpset_enable)
dealloc(GameStats_statusset_enable)
dealloc(GameStats_weightset_enable)
dealloc(GameStats_statsset_enable)"""

[[cheat]]
id = "gamestats-base-address-scan-to-activate-play-level-to-update-play-level"
name = "GameStats Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameStats_savedAOB)
label(GameStats_returnhere)
label(GameStats_originalcode)
label(GameStats_exit)

label(GameStats_update_exit)
label(GameStats_set_exit)
label(GameStats_hpset_exit)
label(GameStats_statusset_exit)
label(GameStats_weightset_exit)
label(GameStats_statsset_exit)

registersymbol(GameStats_savedAOB)

//14DA671C - 83 EC 04              - sub esp,04
//14DA671F - 8B 7D 08              - mov edi,[ebp+08]
// GameStats:Update+a
//14DA6722 - 0FB6 87 19010000      - movzx eax,byte ptr [edi+00000119]
//14DA6729 - 85 C0                 - test eax,eax
//14DA672B - 0F84 5D010000         - je 14DA688E
//14DA6731 - 8B 47 24              - mov eax,[edi+24]
aobscan(GameStats_searchedAOB, 0F B6 87 19 01 00 00 85 C0)

alloc(GameStats_newmem, 2048, GameStats_searchedAOB)
alloc(GameStats_temp1, 4, GameStats_searchedAOB)


GameStats_newmem:
mov [GameStats_temp1], ebx

cmp dword ptr [GameStats_update_enable], #0
je GameStats_update_exit
mov [GameStats_basepointer], edi
GameStats_update_exit:

cmp dword ptr [GameStats_set_enable], #0
je GameStats_set_exit
GameStats_set_exit:

cmp dword ptr [GameStats_hpset_enable], #0
je GameStats_hpset_exit
fld [edi+38]
fstp [edi+34]
GameStats_hpset_exit:

cmp dword ptr [GameStats_statusset_enable], #0
je GameStats_statusset_exit
mov [edi+40], (float)0
mov [edi+4c], (float)0
mov [edi+58], (float)0
mov [edi+60], (float)1
mov [edi+64], (float)0
mov [edi+6c], (float)0
mov [edi+74], (float)0
mov [edi+78], (float)0
mov [edi+80], (float)1
mov [edi+88], (float)1
mov [edi+94], (float)0
mov [edi+9c], (float)0
mov [edi+a4], (float)0
fld [edi+dc]
fstp [edi+d4]
GameStats_statusset_exit:

cmp dword ptr [GameStats_weightset_enable], #0
je GameStats_weightset_exit
mov [edi+ec], (float)0
GameStats_weightset_exit:

cmp dword ptr [GameStats_statsset_enable], #0
je GameStats_statsset_exit
mov [edi+b4], (float)2
mov [edi+b8], (float)99
mov [edi+bc], (float)99
mov [edi+c0], (float)99
mov [edi+f0], (float)9999
GameStats_statsset_exit:

mov ebx, [GameStats_temp1]


GameStats_originalcode:
db 0F B6 87 19 01 00 00
//movzx eax,byte ptr [edi+00000119]


GameStats_exit:
jmp GameStats_returnhere


GameStats_searchedAOB:
GameStats_savedAOB:
jmp GameStats_newmem
nop
nop
GameStats_returnhere:


[DISABLE]
GameStats_savedAOB:
db 0F B6 87 19 01 00 00
//movzx eax,byte ptr [edi+00000119]

unregistersymbol(GameStats_savedAOB)

dealloc(GameStats_newmem)
dealloc(GameStats_temp1)"""

