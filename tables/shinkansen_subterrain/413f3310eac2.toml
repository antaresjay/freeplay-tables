[[cheat]]
id = "mappowermanager-base-address-scan-to-activate-play-level-to-update-play-level"
name = "MapPowerManager Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(MapPowerManager_savedAOB)
label(MapPowerManager_returnhere)
label(MapPowerManager_originalcode)
label(MapPowerManager_exit)

label(MapPowerManager_update_exit)
label(MapPowerManager_set_exit)
label(MapPowerManager_negativeset_entry)
label(MapPowerManager_zeroset_entry)

registersymbol(MapPowerManager_savedAOB)

//12392210 - C7 45 D8 00000000     - mov [ebp-28],00000000
//12392217 - 8B 05 04984103        - mov eax,[03419804] : [033FC1E0]
// MapPowerManager:Calculate_PowerStats+25
//1239221D - D9 40 50              - fld dword ptr [eax+50]
//12392220 - D9 5D D0              - fstp dword ptr [ebp-30]
//12392223 - 8B 47 10              - mov eax,[edi+10]
//12392226 - 83 EC 0C              - sub esp,0C
//12392229 - 50                    - push eax
//1239222A - 39 00                 - cmp [eax],eax
aobscan(MapPowerManager_searchedAOB, D9 40 50 D9 5D D0 8B 47 10)

alloc(MapPowerManager_newmem, 2048, MapPowerManager_searchedAOB)
alloc(MapPowerManager_temp1, 4, MapPowerManager_searchedAOB)
alloc(MapPowerManager_temp2, 4, MapPowerManager_searchedAOB)


MapPowerManager_newmem:
mov [MapPowerManager_temp1], ebx

cmp dword ptr [MapPowerManager_update_enable], #0
je MapPowerManager_update_exit
mov [MapPowerManager_basepointer], edi
MapPowerManager_update_exit:

cmp dword ptr [MapPowerManager_set_enable], #0
je MapPowerManager_set_exit
cmp dword ptr [edi+10], #0
je MapPowerManager_set_exit
mov ebx, [edi+10]
fld [edi+24]
mov [MapPowerManager_temp2], (float)40000
fld [MapPowerManager_temp2]
fcomi ST(0), ST(1)
fstp ST(0)
fstp ST(0)
ja MapPowerManager_negativeset_entry

MapPowerManager_zeroset_entry:
mov [ebx+20], (float)0
jmp MapPowerManager_set_exit

MapPowerManager_negativeset_entry:
mov [ebx+20], (float)-100

MapPowerManager_set_exit:

mov ebx, [MapPowerManager_temp1]


MapPowerManager_originalcode:
db D9 40 50 D9 5D D0
//fld dword ptr [eax+50]
//fstp dword ptr [ebp-30]


MapPowerManager_exit:
jmp MapPowerManager_returnhere


MapPowerManager_searchedAOB:
MapPowerManager_savedAOB:
jmp MapPowerManager_newmem
nop
MapPowerManager_returnhere:


[DISABLE]
MapPowerManager_savedAOB:
db D9 40 50 D9 5D D0
//fld dword ptr [eax+50]
//fstp dword ptr [ebp-30]

unregistersymbol(MapPowerManager_savedAOB)

dealloc(MapPowerManager_newmem)
dealloc(MapPowerManager_temp1)
dealloc(MapPowerManager_temp2)"""

