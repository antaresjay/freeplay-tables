[[cheat]]
id = "basement-script"
name = "Basement Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(money,8B 40 08 03 45 0C 85) // should be unique
aobscan(usedpwr,89 46 10 8B 46 08 85) // should be unique
aobscan(stamina,E8 D9 47 48 DD 5D E0) // should be unique
aobscan(patiance,D9 80 C4 00 00 00 C9) // should be unique
aobscan(exp,8B 48 5C 51 DB 04 24) // should be unique
aobscan(workrate,D9 00 D9 E8 DF F1 DD D8 0F 86 6C) // should be unique
alloc(newmem,$1000)

label(moneycode)
label(moneyreturn)
label(usedpwrcode)
label(usedpwrreturn)
label(staminacode)
label(staminareturn)
label(patiancecode)
label(patiancereturn)
label(expcode)
label(expreturn)
label(workratecode)
label(workratereturn)

newmem:
expcode:
  mov ecx,[eax+58]
  mov [xpBase],ecx
  mov [eax+5C],ecx
  mov ecx,[eax+5C]
  push ecx
  fild dword ptr [esp]
  jmp expreturn

workratecode:
  fld1
  fstp dword ptr [eax]
  fld dword ptr [eax]
  fld1
  fcomip st(0),st(1)
  jmp workratereturn

moneycode:
  mov [mnyBase],eax
  mov [eax+08],#999999
  mov eax,[eax+08]
  add eax,[ebp+0C]
  jmp moneyreturn

usedpwrcode:
  mov [esi+10],#0
  mov [esi+C],#99
  mov [pwrBase],esi
  //mov [esi+10],eax
  mov eax,[esi+08]
  jmp usedpwrreturn

staminacode:
  fld1
  fstp dword ptr [edi+48]
  fld dword ptr [edi+48]
  fstp qword ptr [ebp-20]
  jmp staminareturn

patiancecode:
  fld1
  fstp dword ptr [eax+000000C4]
  fld dword ptr [eax+000000C4]
  jmp patiancereturn

patiance:
  jmp patiancecode
  nop
patiancereturn:

stamina+01:
  jmp staminacode
  nop
staminareturn:

usedpwr:
  jmp usedpwrcode
  nop
usedpwrreturn:

money:
  jmp moneycode
  nop
moneyreturn:

exp:
  jmp expcode
  nop
  nop
expreturn:

workrate:
  jmp workratecode
  nop
workratereturn:
registersymbol(workrate)

registersymbol(exp)
registersymbol(money)
registersymbol(usedpwr)
registersymbol(stamina)
registersymbol(patiance)


[DISABLE]

money:
  db 8B 40 08 03 45 0C
usedpwr:
  db 89 46 10 8B 46 08
stamina+01:
  db D9 47 48 DD 5D E0
patiance:
  db D9 80 C4 00 00 00
exp:
  db 8B 48 5C 51 DB 04 24
workrate:
  db D9 00 D9 E8 DF F1

unregistersymbol(workrate)
unregistersymbol(exp)
unregistersymbol(patiance)
unregistersymbol(stamina)
unregistersymbol(usedpwr)
unregistersymbol(money)
dealloc(newmem)"""
