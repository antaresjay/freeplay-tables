[[cheat]]
id = "enable-v01-07"
name = "[Enable] v01.07"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Game_f_x64_EOS.exe
  Version:
  Date   : 2023-06-12
  Author : cfe

  This script does blah blah blah
}

[ENABLE]
aobscanmodule(aobAddWeapon,$process,48 89 5C 24 10 48 89 6C 24 18 56 48 83 EC 20 48 8B F2 48 8B E9 33 DB)
registersymbol(aobAddWeapon)

aobscanmodule(aobAddItem,$process,48 89 5C 24 10 48 89 6C 24 18 56 41 56 41 57 48 83 EC 20 45 8B F0 48 8B EA 4C 8B F9)
registersymbol(aobAddItem)

aobscanmodule(aobGetPlayer,$process,48 8B C8 48 8B 10 FF 52 08 F2 0F 10 40 24 F2 0F 11 44 24 20 8B 40 2C) // should be unique
alloc(newmem,$1000,aobGetPlayer)

label(code)
label(return)
label(pPlayerCharacter)
registersymbol(pPlayerCharacter)
newmem:

code:
  // RCX = CharacterManager
  // RAX = PlayerCharacter ( CharacterManager + 0x50 )
  mov [pPlayerCharacter],rax
  mov rcx,rax
  mov rdx,[rax]
  jmp return
pPlayerCharacter:
dq 0

aobGetPlayer:
  jmp newmem
  nop
return:
registersymbol(aobGetPlayer)

[DISABLE]

aobGetPlayer:
  db 48 8B C8 48 8B 10

dealloc(newmem)

unregistersymbol( * )"""

