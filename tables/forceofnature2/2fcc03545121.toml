[[cheat]]
id = "unlimited-stamina"
name = "Unlimited Stamina"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(stamina_aob,GameAssembly.dll,F3 0F 10 80 A4 00 00 00 48 83 C4 10 5F C3 CC CC CC 48 89 4C 24 08 57 48 83 EC 10 48 8B 44 24 20 F3 0F 10 40 20 48 83 C4 10 5F C3) // should be unique
alloc(newmem,$1000,stamina_aob)

label(code)
label(return)

newmem:
mov [rax+000000A4],(float)100
code:
  movss xmm0,[rax+000000A4]
  jmp return

stamina_aob:
  jmp newmem
  nop 3
return:
registersymbol(stamina_aob)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
stamina_aob:
  db F3 0F 10 80 A4 00 00 00

unregistersymbol(stamina_aob)
dealloc(newmem)"""

