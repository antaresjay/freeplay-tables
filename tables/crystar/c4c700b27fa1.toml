[[cheat]]
id = "godmode-ohk"
name = "Godmode + OHK"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : CRYSTAR.exe
  Version: 
  Date   : 2019-08-30
  Author : Anjinggila

  This script does blah blah blah

}

[ENABLE]

aobscanmodule(CRY_HP,GameAssembly.dll,29 7B 20 83 7B 20 00) // should be unique
alloc(newmem,$1000,"GameAssembly.dll"+1CC54F)

label(code)
label(return)
label(playerHealth)
label(enemyHealth)

newmem:
  cmp [rbx+70],0
  je playerHealth
  cmp [rbx+70],1
  je enemyHealth
  jmp code

playerHealth:
  jmp return

enemyHealth:
  sub [rbx+20],0
  jmp return

code:
  sub [rbx+20],edi
  cmp dword ptr [rbx+20],00
  jmp return

CRY_HP:
  jmp newmem
  nop 2
return:
registersymbol(CRY_HP)

[DISABLE]

CRY_HP:
  db 29 7B 20 83 7B 20 00

unregistersymbol(CRY_HP)
dealloc(newmem)"""

