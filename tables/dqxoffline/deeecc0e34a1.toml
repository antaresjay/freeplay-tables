[[cheat]]
id = "enable-exp-multiplier"
name = "Enable EXP Multiplier"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(EXPMultAOB,$process,89 86 74 01 00 00 48 8B 43 18 48 89 86 78 01 00 00) // should be unique
registersymbol(EXPMultAOB)
alloc(newmem,1024,EXPMultAOB)

///
label(return)
label(EXPMultAOBSave)
registersymbol(EXPMultAOBSave)
label(fEXPMultiplier)
registersymbol(fEXPMultiplier)

///
newmem:
  mov [R15Save],r15
  mov r15,CharEXPPointers
  cmp [r15],rsi
  je PerformEXPMult
  cmp [r15+08],rsi
  je PerformEXPMult
  cmp [r15+08],rsi
  je PerformEXPMult
  cmp [r15+10],rsi
  je PerformEXPMult
  cmp [r15+18],rsi
  je PerformEXPMult
  cmp [r15+20],rsi
  je PerformEXPMult
  jmp MyCleanUp1
PerformEXPMult:
  cmp [rsi+00000174],eax
  jge MyCleanUp1
  xor r15,r15
  mov r15d,eax
  sub r15d,[rsi+00000174]
  push r15d
  fild dword ptr [rsp]
  fmul dword ptr [fEXPMultiplier]
  fistp dword ptr [rsp]
  pop r15d
  mov eax,[rsi+00000174]
  add eax,r15d
  jmp MyCleanUp1
  
MyCleanUp1:
  mov r15,[R15Save]
  jmp originalcode
  
originalcode:
EXPMultAOBSave:
  readmem(EXPMultAOB,6)
  jmp EXPMultAOB+06

R15Save:
dq 0
fEXPMultiplier:
dq (float)10.0

///
EXPMultAOB:
  jmp newmem
  nop
  return:
  
[DISABLE]

EXPMultAOB:
  readmem(EXPMultAOBSave,6)

unregistersymbol(EXPMultAOB)
unregistersymbol(EXPMultAOBSave)
unregistersymbol(fEXPMultiplier)

dealloc(newmem)"""

