[[cheat]]
id = "playeritem-base-address-scan-initialization-activate-this-first"
name = "PlayerItem Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlayerItem_basepointer)
registersymbol(PlayerItem_update_enable)
registersymbol(PlayerItem_set_enable)

alloc(PlayerItem_basepointer, 4)
alloc(PlayerItem_update_enable, 4)
alloc(PlayerItem_set_enable, 4)


[DISABLE]
unregistersymbol(PlayerItem_basepointer)
unregistersymbol(PlayerItem_update_enable)
unregistersymbol(PlayerItem_set_enable)

dealloc(PlayerItem_basepointer)
dealloc(PlayerItem_update_enable)
dealloc(PlayerItem_set_enable)"""

[[cheat]]
id = "playeritem-base-address-scan-to-activate-mouseover-item-to-update-mouseover-item"
name = "PlayerItem Base Address Scan (To Activate: Mouseover Item, To Update: Mouseover Item)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerItem_savedAOB)
label(PlayerItem_returnhere)
label(PlayerItem_originalcode)
label(PlayerItem_exit)

label(PlayerItem_update_exit)
label(PlayerItem_set_exit)

registersymbol(PlayerItem_savedAOB)

//634C9179 - EB 22                 - jmp 634C919D
//634C917B - 39 1B                 - cmp [ebx],ebx
// Ability:get_AreChargesRemaining+75
//634C917D - 8B 43 14              - mov eax,[ebx+14]
//634C9180 - 8B 40 2C              - mov eax,[eax+2C]
//634C9183 - 89 45 F8              - mov [ebp-08],eax
//634C9186 - 85 C0                 - test eax,eax
//634C9188 - 0F94 C0               - sete al
aobscan(PlayerItem_searchedAOB, 8B 40 0C 83 EC 0C 50 * * * * * 83 C4 10 D9 5D FC D9 45 FC)

alloc(PlayerItem_newmem, 2048)


PlayerItem_newmem:
cmp dword ptr [PlayerItem_update_enable], #0
je PlayerItem_update_exit
mov [PlayerItem_basepointer], eax
PlayerItem_update_exit:

cmp dword ptr [PlayerItem_set_enable], #0
je PlayerItem_set_exit
PlayerItem_set_exit:


PlayerItem_originalcode:
db 8B 40 0C 83 EC 0C
//mov eax,[eax+0C]
//sub esp,0C


PlayerItem_exit:
jmp PlayerItem_returnhere


PlayerItem_searchedAOB:
PlayerItem_savedAOB:
jmp PlayerItem_newmem
nop
PlayerItem_returnhere:


[DISABLE]
PlayerItem_savedAOB:
db 8B 40 0C 83 EC 0C
//mov eax,[eax+0C]
//sub esp,0C

unregistersymbol(PlayerItem_savedAOB)

dealloc(PlayerItem_newmem)"""

