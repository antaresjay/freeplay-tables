[[cheat]]
id = "get-gold-base-address"
name = "Get Gold Base Address"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Pirates of the Polygon Sea.exe
  Version: 
  Date   : 2017-05-11
  Author : ColonelRVH

  This script does blah blah blah
}

[ENABLE]

aobscan(Get_Gold_AOB,8B 80 B8 00 00 00 EB 1D) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
registersymbol(Gold_Base)
alloc(Gold_Base,4)
registersymbol(Gold_Flag)
alloc(Gold_Flag,4)

Gold_Flag:
dd 0

newmem:
  cmp dword ptr [Gold_Flag],1
  jne code
  mov [eax+000000B8],#7777777

code:
  mov [Gold_Base],eax
  mov eax,[eax+000000B8]
  jmp return

Get_Gold_AOB:
  jmp newmem
  nop
return:
registersymbol(Get_Gold_AOB)

[DISABLE]

Get_Gold_AOB:
  db 8B 80 B8 00 00 00

unregistersymbol(Get_Gold_AOB)
dealloc(newmem)
unregistersymbol(Gold_Base)
dealloc(Gold_Base)
unregistersymbol(Gold_Flag)
dealloc(Gold_Flag)
{
// ORIGINAL CODE - INJECTION POINT: 022B93A2

""+22B9386: 8B 45 08           -  mov eax,[ebp+08]
""+22B9389: 8B 40 28           -  mov eax,[eax+28]
""+22B938C: 83 EC 0C           -  sub esp,0C
""+22B938F: 50                 -  push eax
""+22B9390: E8 0B F8 83 03     -  call UnityEngine:Object:op_Implicit
""+22B9395: 83 C4 10           -  add esp,10
""+22B9398: 85 C0              -  test eax,eax
""+22B939A: 74 0E              -  je PlayerComponent:GetGold+2a
""+22B939C: 8B 45 08           -  mov eax,[ebp+08]
""+22B939F: 8B 40 28           -  mov eax,[eax+28]
// ---------- INJECTING HERE ----------
""+22B93A2: 8B 80 B8 00 00 00  -  mov eax,[eax+000000B8]
// ---------- DONE INJECTING  ----------
""+22B93A8: EB 1D              -  jmp PlayerComponent:GetGold+47
""+22B93AA: 8B 05 08 BE F3 03  -  mov eax,[03F3BE08]
""+22B93B0: 83 EC 04           -  sub esp,04
""+22B93B3: 68 58 82 E4 21     -  push 21E48258
""+22B93B8: 6A 02              -  push 02
""+22B93BA: 50                 -  push eax
""+22B93BB: 39 00              -  cmp [eax],eax
""+22B93BD: E8 8E F2 87 03     -  call 05B38650
""+22B93C2: 83 C4 10           -  add esp,10
""+22B93C5: 33 C0              -  xor eax,eax
}"""

