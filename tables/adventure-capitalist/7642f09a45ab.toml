[[cheat]]
id = "business-buying-multiplier"
name = "Business Buying Multiplier"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Buying Multiplier

[ENABLE]
// Allocs - alloc(NameHere,XXXX) // 1024 for vars, 4096 for threads?
alloc(Multiplier, 1024)
alloc(_BuyingMultiplier,4096)

// AOBs - aobscan(NameHere,XX XX XX ...) // should be unique
aobscan(BuyBusinessCount,40 89 46 24 DD 46 38)

// Symbols - registersymbol(NameHere)
registersymbol(Multiplier)
registersymbol(BuyBusinessCount)

// Labels - label(NameHere)
label(BuyingMultiplier)
label(Return)

//****************************************************************************//
Multiplier:
db 01

_BuyingMultiplier:
BuyingMultiplier:
  add eax,(int)[Multiplier]
  //inc eax
  mov [esi+24],eax
  fld qword ptr [esi+38]
  jmp Return

BuyBusinessCount:
  jmp BuyingMultiplier
  nop
  nop

Return:

//****************************************************************************//
[DISABLE]
BuyBusinessCount:
db 40 89 46 24 DD 46 38

unregistersymbol(Multiplier)
unregistersymbol(BuyBusinessCount)

dealloc(_BuyingMultiplier)"""

