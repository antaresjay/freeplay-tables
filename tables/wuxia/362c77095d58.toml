""+437AB1A: 8B 87 B4 00 00 00              -  mov eax,[edi+000000B4]
""+437AB20: 8B 40 14                       -  mov eax,[eax+14]
""+437AB23: 85 C0                          -  test eax,eax
""+437AB25: 75 19                          -  jne 0437AB40
""+437AB27: 8B 87 B0 02 00 00              -  mov eax,[edi+000002B0]
""+437AB2D: 8B 8F B4 00 00 00              -  mov ecx,[edi+000000B4]
""+437AB33: 8B 49 18                       -  mov ecx,[ecx+18]
// ---------- INJECTING HERE ----------
""+437AB36: 2B C1                          -  sub eax,ecx
""+437AB38: 89 87 B0 02 00 00              -  mov [edi+000002B0],eax
// ---------- DONE INJECTING  ----------
""+437AB3E: EB 27                          -  jmp 0437AB67
""+437AB40: 8B 87 B4 00 00 00              -  mov eax,[edi+000000B4]
""+437AB46: 8B 40 14                       -  mov eax,[eax+14]
""+437AB49: 3D 01 00 00 00                 -  cmp eax,00000001
""+437AB4E: 75 17                          -  jne 0437AB67
""+437AB50: 8B 87 B0 02 00 00              -  mov eax,[edi+000002B0]
""+437AB56: 8B 8F B4 00 00 00              -  mov ecx,[edi+000000B4]
""+437AB5C: 8B 49 18                       -  mov ecx,[ecx+18]
""+437AB5F: 03 C1                          -  add eax,ecx
""+437AB61: 89 87 B0 02 00 00              -  mov [edi+000002B0],eax
}"""

