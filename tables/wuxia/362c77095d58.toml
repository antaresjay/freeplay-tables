[ENABLE]
aobscan(Stamina_Training,2B C1 89 87 B0 02 00 00 EB 27) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  sub eax,ecx
  mov [edi+000002B0],eax
  jmp return

Stamina_Training:
//  jmp newmem
db 90 90
return:
registersymbol(Stamina_Training)

[DISABLE]

Stamina_Training:
  db 2B C1 89 87 B0 02 00 00

unregistersymbol(Stamina_Training)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: 0437AB36

