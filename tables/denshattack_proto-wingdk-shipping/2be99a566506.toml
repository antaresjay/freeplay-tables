[[cheat]]
id = "train-character-ctrl-numpad-1"
name = "Train Character (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Denshattack_Proto-WinGDK-Shipping.exe
// Author            : ndck76
// Executable Version: 5.6.1.0
// Game Version      : v1.2.1.6g
// Script Date       : 2026-07-17


[ENABLE]

aobscanmodule(master,$process,488Bxx33xx4Cxxxxxxxxxxxx488Bxx41FFxx84xx74xx488Bxx488B) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,5)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,5)

newmem:
  mov [data],rax

code:
  readmem(master,5)
  jmp return

master:
  jmp newmem
return:

[DISABLE]

master:
  readmem(masterbkp,5)

unregistersymbol(*)
dealloc(*)"""

