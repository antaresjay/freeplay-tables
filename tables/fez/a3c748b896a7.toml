[[cheat]]
id = "easy-secret-unlock-easy-fly-shift"
name = "Easy Secret Unlock / Easy Fly (Shift)"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(keysequencecheckAOB,4F 3B FE 75 12)
registersymbol(keysequencecheckAOB)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
dec edi
pushad
push 10      //key Shift
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
je exit

originalcode:
//dec edi
cmp edi,esi
jne keysequencecheckAOB+17 //045AF1E9

exit:
jmp returnhere

///

keysequencecheckAOB: //045AF1D2:
jmp newmem
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
keysequencecheckAOB: //045AF1D2:
db 4F 3B FE 75 12
//Alt: dec edi
//Alt: cmp edi,esi
//Alt: jne keysequencecheckAOB+17 //045AF1E9
unregistersymbol(keysequencecheckAOB)"""

