[ENABLE]

aobscanmodule(healthAOB,SANDLAND-Win64-Shipping.exe,89 8B A8 0D 00 00 40)
alloc(newmem,$1000,healthAOB)
label(playerOHK)
label(onehit)
label(code)
label(return)
registersymbol(healthAOB)
registersymbol(playerOHK)

newmem:
cmp dword ptr [rbx+00000DB4],00000000
jne onehit
movss xmm0,[new]
jmp return

new:
dd (float)8500.0

onehit:
cmp [playerOHK],1
jne code
xor ecx,ecx
jmp code

playerOHK:
dq 0

code:
  mov [rbx+00000DA8],ecx
  jmp return

healthAOB:
  jmp newmem
  nop
return:


[DISABLE]

healthAOB:
  db 89 8B A8 0D 00 00

unregistersymbol(*)
dealloc(*)'''

