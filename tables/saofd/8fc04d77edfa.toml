source = """
[ENABLE]

aobscanmodule(getPlayer,SAOFD.exe,4C 8B 08 4C 8D 85 B8 00 00 00)
alloc(newmem,$1000,getPlayer)
registersymbol(pPawn)
label(code return pPawn)

newmem:
