[[cheat]]
id = "force-ghost-type-host"
name = "Force Ghost Type (Host)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(ghosttypeforce,GameAssembly.dll,48 8B ? 89 ? ? E8 ? ? ? ? 45 33 ? BA ? ? ? ? 41 8D ? ? E8 ? ? ? ? 45 33 ? 89 ? ? 41 8D ? ? 8D ? ? E8 ? ? ? ? 45 33 ? 89 ? ? 33 ? 41 8D ? ? E8 ? ? ? ? 85 ? 0F 94 ? 88 ? ? 48 8B ? ? 48 85 ? 0F 84 ? ? ? ? 48 8B ? ? 48 85 ? 0F 84 ? ? ? ? 8B ? ? 45 33 ? 33)
assert(ghosttypeforce,bytes)
alloc(newmem,128,ghosttypeforce)

registersymbol(ghosttypeforce ghosttypeforceOrig GType)
label(return ghosttypeforceOrig GType)

newmem:
  mov rcx,rdi
  mov eax,[GType]
  mov [rdi+2C],eax
  mov [rdi+28],eax
  jmp return

ghosttypeforceOrig:
  readmem(ghosttypeforce,6)

GType:
  dq 0

ghosttypeforce:
  jmp newmem
  db 90
return:

[DISABLE]

ghosttypeforce:
  readmem(ghosttypeforceOrig,6)

dealloc(*)
unregistersymbol(*)"""

