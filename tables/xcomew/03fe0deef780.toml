[[cheat]]
id = "xcom-enemy-within-aob-object-array-script-v4-for-long-war"
name = "XCOM - Enemy Within AOB object array script v4 for Long War"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(aobArrayPointerGrabber,XComEW.exe,8B 46 3C 8B 30 0F)

alloc(newmem,2048)

label(aobArrayPointerGrabber_r)
registersymbol(aobArrayPointerGrabber_r)

label(lblArrayPointerGrabber)
label(lblArrayPointerGrabberRet)

label(pArray)
registersymbol(pArray)

newmem:

lblArrayPointerGrabber:
mov eax,[esi+3C]
mov esi,[eax]
mov dword ptr [pArray],eax
jmp lblArrayPointerGrabberRet
pArray:
dd 0

aobArrayPointerGrabber:
aobArrayPointerGrabber_r:
jmp lblArrayPointerGrabber
lblArrayPointerGrabberRet:

[DISABLE]
aobArrayPointerGrabber_r:
db 8B 46 3C 8B 30

unregistersymbol(aobArrayPointerGrabber_r)

unregistersymbol(pArray)

dealloc(newmem)"""

[[cheat]]
id = "xcom-enemy-within-aob-resource-script-v3"
name = "XCOM - Enemy Within AOB resource script v3"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(aobMoneyObjectPointerGrabber,XComEW.exe,8B 90 60 05 00 00 39)

alloc(newmem,2048)

label(aobMoneyObjectPointerGrabber_r)
registersymbol(aobMoneyObjectPointerGrabber_r)

label(lblMoneyObjectPointerGrabber)
label(lblMoneyObjectPointerGrabberSkip)
label(lblMoneyObjectPointerGrabberRet)

label(pMoneyObject)
registersymbol(pMoneyObject)

newmem:

lblMoneyObjectPointerGrabber:
mov edx,[eax+00000560] // Original code
push eax
mov eax,[edx+4c4]      // <= This offset is likely to change
test eax,eax
jz short lblMoneyObjectPointerGrabberSkip
mov eax,[eax+23c]
lblMoneyObjectPointerGrabberSkip:
mov dword ptr [pMoneyObject],eax
pop eax
jmp lblMoneyObjectPointerGrabberRet
pMoneyObject:
dd 0

aobMoneyObjectPointerGrabber:
aobMoneyObjectPointerGrabber_r:
jmp lblMoneyObjectPointerGrabber
nop
lblMoneyObjectPointerGrabberRet:

[DISABLE]
aobMoneyObjectPointerGrabber_r:
db 8B 90 60 05 00 00

unregistersymbol(aobMoneyObjectPointerGrabber_r)

unregistersymbol(pMoneyObject)

dealloc(newmem)"""

