lblTick:
pushall
mov esi,[esp+70]
test esi,esi
jz lblTickDone
mov eax,[esi+1F4]
test eax,eax
jz lblTickDone
cmp dword ptr [esi+1F8],eax
jne lblTickDone
mov eax,[esi+7D8]
cmp dword ptr [esi+7DC],eax
jne lblTickDone
mov eax,[esi+7E4]
