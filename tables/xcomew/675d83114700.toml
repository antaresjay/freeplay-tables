[[cheat]]
id = "xcom-enemy-within-aob-tactical-script"
name = "XCOM - Enemy Within AOB tactical script"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(aobTeamGrabber,8B 80 D0 01 00 00 53 55 56 57)
aobscan(aobHealthChecker,83 B9 D4 01 00 00 00 7E 0F)
aobscan(aobMeldState,83 A7 80 03 00 00 FD)

alloc(newmem,4096)

label(aobTeamGrabber_r)
registersymbol(aobTeamGrabber_r)

label(lblTeamGrabber)
label(lblTeamGrabberRet)

label(pTeam)
registersymbol(pTeam)

label(aobHealthChecker_r)
registersymbol(aobHealthChecker_r)

label(lblHealthChecker)
label(lblHealthCheckerSkipHealth)
label(lblHealthCheckerSkipMoves)
label(lblHealthCheckerSkipOffense)
label(lblHealthCheckerSkipDefense)
label(lblHealthCheckerSkipWill)
label(lblHealthCheckerSkipStuns)
label(lblHealthCheckerSkipGrenades)
label(lblHealthCheckerSkipAlienGrenades)
label(lblHealthCheckerSkipSmokeGrenades)
label(lblHealthCheckerSkipAllGrenades)
label(lblHealthCheckerSkipShredderRockets)
label(lblHealthCheckerSkipRockets)
label(lblHealthCheckerSkipAllRockets)
label(lblHealthCheckerSkip)
label(lblHealthCheckerRet)

label(bEnableInfiniteMoves)
label(bEnableMinHealth)
label(iMinHealth)
label(bEnableMinOffense)
label(iMinOffense)
label(bEnableMinDefense)
label(iMinDefense)
label(bEnableMinWill)
label(iMinWill)
label(bEnableMinGrenades)
label(iMinGrenades)
label(bEnableMinStuns)
label(iMinStuns)
label(bEnableMinRockets)
label(iMinRockets)
registersymbol(bEnableInfiniteMoves)
registersymbol(bEnableMinHealth)
registersymbol(iMinHealth)
registersymbol(bEnableMinOffense)
registersymbol(iMinOffense)
registersymbol(bEnableMinDefense)
registersymbol(iMinDefense)
registersymbol(bEnableMinWill)
registersymbol(iMinWill)
registersymbol(bEnableMinGrenades)
registersymbol(iMinGrenades)
registersymbol(bEnableMinStuns)
registersymbol(iMinStuns)
registersymbol(bEnableMinRockets)
registersymbol(iMinRockets)

label(aobMeldState_r)
registersymbol(aobMeldState_r)

label(lblMeldState)
label(lblMeldStateSpecial)
label(lblMeldStateSkip)
label(lblMeldStateRet)

label(bEnableMinMeldTurns)
label(iMinMeldTurns)
registersymbol(bEnableMinMeldTurns)
registersymbol(iMinMeldTurns)

newmem:
bEnableInfiniteMoves:
dd 1
bEnableMinHealth:
dd 1
iMinHealth:
dd (int)20
bEnableMinOffense:
dd 0
iMinOffense:
dd (int)90
bEnableMinDefense:
dd 0
iMinDefense:
dd (int)50
bEnableMinWill:
dd 0
iMinWill:
dd (int)80
bEnableMinGrenades:
dd 1
iMinGrenades:
dd (int)3
bEnableMinMeldTurns:
dd 1
iMinMeldTurns:
dd (int)-1
bEnableMinStuns:
dd 1
iMinStuns:
dd (int)3
bEnableMinRockets:
dd 1
iMinRockets:
dd (int)3

lblHealthChecker:
push edx
mov edx,[pTeam]
cmp dword ptr [ecx+000001D0],edx
jne lblHealthCheckerSkip
cmp dword ptr [ecx+000001D4],00
je lblHealthCheckerSkip

cmp dword ptr [bEnableInfiniteMoves],1
jne short lblHealthCheckerSkipMoves
mov dword ptr [ecx+000010B8],0
mov dword ptr [ecx+000010BC],2
mov dword ptr [ecx+000010C0],1
lblHealthCheckerSkipMoves:

cmp dword ptr [bEnableMinHealth],1
jne short lblHealthCheckerSkipHealth
mov edx,[iMinHealth]
cmp dword ptr [ecx+000001D4],edx
jge short lblHealthCheckerSkipHealth
mov dword ptr [ecx+000001D4],edx
lblHealthCheckerSkipHealth:

cmp dword ptr [bEnableMinOffense],1
jne short lblHealthCheckerSkipOffense
mov edx,[iMinOffense]
cmp dword ptr [ecx+000001D8],edx
jge short lblHealthCheckerSkipOffense
mov dword ptr [ecx+000001D8],edx
lblHealthCheckerSkipOffense:

cmp dword ptr [bEnableMinDefense],1
jne short lblHealthCheckerSkipDefense
mov edx,[iMinDefense]
cmp dword ptr [ecx+000001DC],edx
jge short lblHealthCheckerSkipDefense
mov dword ptr [ecx+000001DC],edx
lblHealthCheckerSkipDefense:

cmp dword ptr [bEnableMinWill],1
jne short lblHealthCheckerSkipWill
mov edx,[iMinWill]
cmp dword ptr [ecx+000001F0],edx
jge short lblHealthCheckerSkipWill
mov dword ptr [ecx+000001F0],edx
lblHealthCheckerSkipWill:

cmp dword ptr [bEnableMinStuns],1
jne short lblHealthCheckerSkipStuns
cmp dword ptr [ecx+00000D54],0
je short lblHealthCheckerSkipStuns
mov edx,[iMinStuns]
cmp dword ptr [ecx+00000D54],edx
jge short lblHealthCheckerSkipStuns
mov dword ptr [ecx+00000D54],edx
lblHealthCheckerSkipStuns:

cmp dword ptr [bEnableMinGrenades],1
jne short lblHealthCheckerSkipAllGrenades
mov edx,[iMinGrenades]
cmp dword ptr [ecx+00000D58],0
je short lblHealthCheckerSkipGrenades
cmp dword ptr [ecx+00000D58],edx
jge short lblHealthCheckerSkipGrenades
mov dword ptr [ecx+00000D58],edx
lblHealthCheckerSkipGrenades:
cmp dword ptr [ecx+00000D5C],0
je short lblHealthCheckerSkipAlienGrenades
cmp dword ptr [ecx+00000D5C],edx
jge short lblHealthCheckerSkipAlienGrenades
mov dword ptr [ecx+00000D5C],edx
lblHealthCheckerSkipAlienGrenades:
cmp dword ptr [ecx+000010D8],0
je short lblHealthCheckerSkipSmokeGrenades
cmp dword ptr [ecx+000010D8],edx
jge short lblHealthCheckerSkipSmokeGrenades
mov dword ptr [ecx+000010D8],edx
lblHealthCheckerSkipSmokeGrenades:
lblHealthCheckerSkipAllGrenades:

cmp dword ptr [bEnableMinRockets],1
jne short lblHealthCheckerSkipRockets
mov edx,[iMinRockets]
cmp dword ptr [ecx+000010CC],0
je short lblHealthCheckerSkipShredderRockets
cmp dword ptr [ecx+000010CC],edx
jge short lblHealthCheckerSkipShredderRockets
mov dword ptr [ecx+000010CC],edx
lblHealthCheckerSkipShredderRockets:
cmp dword ptr [ecx+000010D0],0
je short lblHealthCheckerSkipRockets
cmp dword ptr [ecx+000010D0],edx
jge short lblHealthCheckerSkipRockets
mov dword ptr [ecx+000010D0],edx
lblHealthCheckerSkipRockets:
lblHealthCheckerSkipAllRockets:

lblHealthCheckerSkip:
pop edx
cmp dword ptr [ecx+000001D4],00
jmp lblHealthCheckerRet

lblTeamGrabber:
mov eax,[eax+000001D0]
mov dword ptr [pTeam],eax
jmp lblTeamGrabberRet
pTeam:
dd 0

lblMeldState:
push eax
cmp dword ptr [bEnableMinMeldTurns],1
jne short lblMeldStateSkip
cmp dword ptr [edi+00000384],0
jle short lblMeldStateSkip
mov eax,[iMinMeldTurns]
cmp eax,-1
je short lblMeldStateSpecial
cmp dword ptr [edi+00000384],eax
jge short lblMeldStateSkip
lblMeldStateSpecial:
mov dword ptr [edi+00000384],eax
lblMeldStateSkip:
pop eax
and dword ptr [edi+00000380],-03
jmp lblMeldStateRet

aobMeldState:
aobMeldState_r:
jmp lblMeldState
nop
nop
lblMeldStateRet:

aobTeamGrabber:
aobTeamGrabber_r:
jmp lblTeamGrabber
nop
lblTeamGrabberRet:

aobHealthChecker:
aobHealthChecker_r:
jmp lblHealthChecker
nop
nop
lblHealthCheckerRet:

[DISABLE]
aobHealthChecker_r:
db 83 B9 D4 01 00 00 00

unregistersymbol(aobHealthChecker_r)

unregistersymbol(bEnableInfiniteMoves)
unregistersymbol(bEnableMinHealth)
unregistersymbol(iMinHealth)
unregistersymbol(bEnableMinOffense)
unregistersymbol(iMinOffense)
unregistersymbol(bEnableMinDefense)
unregistersymbol(iMinDefense)
unregistersymbol(bEnableMinWill)
unregistersymbol(iMinWill)
unregistersymbol(bEnableMinGrenades)
unregistersymbol(iMinGrenades)
unregistersymbol(bEnableMinStuns)
unregistersymbol(iMinStuns)
unregistersymbol(bEnableMinRockets)
unregistersymbol(iMinRockets)

aobTeamGrabber_r:
db 8B 80 D0 01 00 00

unregistersymbol(aobTeamGrabber_r)

unregistersymbol(pTeam)

aobMeldState_r:
db 83 A7 80 03 00 00 FD

unregistersymbol(aobMeldState_r)

unregistersymbol(bEnableMinMeldTurns)
unregistersymbol(iMinMeldTurns)

dealloc(newmem)"""

