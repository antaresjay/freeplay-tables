[[cheat]]
id = "xcom-enemy-within-aob-soldier-patcher-script-ctrl-alt-in-barracks"
name = "XCOM - Enemy Within AOB soldier patcher script (CTRL+ALT in Barracks)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(aobTick,8D 44 24 10 50 51 8B 0D ?? ?? ?? ?? E8 ?? ?? ?? ?? C2 0C 00)
alloc(newmem,4096)

label(aobTick_r)
label(lblTick)
label(lblTickSkipHP)
label(lblTickSkipAim)
label(lblTickSkipDefense)
label(lblTickSkipWill)
label(lblTickSkipMoves)
label(lblTickSkipRecoveryTime)
label(lblTickSkipPsyFlag)
label(lblTickSkipPsyLevel)
label(lblTickSkipHeatAmmo)
label(lblTickSkipRapidReaction)
label(lblTickSkipCoveringFire)
label(lblTickDone)
label(lblTickReturn)

label(bPatchHP)
label(bPatchAim)
label(bPatchDefense)
label(bPatchWill)
label(bPatchMoves)
label(bPatchRecoveryTime)
label(bPatchPsyFlag)
label(bPatchPsyLevel)
label(bPatchHeatAmmo)
label(bPatchRapidReaction)
label(bPatchCoveringFire)

label(iDesiredMinHP)
label(iDesiredMinAim)
label(iDesiredMinDefense)
label(iDesiredMinWill)
label(iDesiredMinMoves)
label(iDesiredMinPsyLevel)
label(bDesiredHeatAmmoState)
label(bDesiredRapidReactionState)
label(bDesiredCoveringFireState)

registersymbol(aobTick_r)

registersymbol(bPatchHP)
registersymbol(bPatchAim)
registersymbol(bPatchDefense)
registersymbol(bPatchWill)
registersymbol(bPatchMoves)
registersymbol(bPatchRecoveryTime)
registersymbol(bPatchPsyFlag)
registersymbol(bPatchPsyLevel)
registersymbol(bPatchHeatAmmo)
registersymbol(bPatchRapidReaction)
registersymbol(bPatchCoveringFire)

registersymbol(iDesiredMinHP)
registersymbol(iDesiredMinAim)
registersymbol(iDesiredMinDefense)
registersymbol(iDesiredMinWill)
registersymbol(iDesiredMinMoves)
registersymbol(iDesiredMinPsyLevel)
registersymbol(bDesiredHeatAmmoState)
registersymbol(bDesiredRapidReactionState)
registersymbol(bDesiredCoveringFireState)

label(pLastPatchedUnit)
registersymbol(pLastPatchedUnit)

newmem:
bPatchHP:
dd 1
bPatchAim:
dd 1
bPatchDefense:
dd 0
bPatchWill:
dd 1
bPatchMoves:
dd 1
bPatchRecoveryTime:
dd 1
bPatchPsyFlag:
dd 0
bPatchPsyLevel:
dd 0
bPatchHeatAmmo:
dd 0
bPatchRapidReaction:
dd 0
bPatchCoveringFire:
dd 0
iDesiredMinHP:
dd (int)25
iDesiredMinAim:
dd (int)150
iDesiredMinDefense:
dd (int)5
iDesiredMinWill:
dd (int)90
iDesiredMinMoves:
dd (int)25
iDesiredMinPsyLevel:
dd 3
bDesiredHeatAmmoState:
dd 1
bDesiredRapidReactionState:
dd 1
bDesiredCoveringFireState:
dd 1
lblTick:
pushall
pushad
push 11 // VK_CONTROL: CTRL key
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne lblTickDone
pushad
push 12 // VK_CONTROL: ALT key
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne lblTickDone
mov esi,[esp+70]
mov dword ptr [pLastPatchedUnit],esi

cmp dword ptr [bPatchHP],1
jne short lblTickSkipHP
mov eax, [iDesiredMinHP]
cmp dword ptr [esi+73C],eax
jge short lblTickSkipHP
mov [esi+73C],eax
lblTickSkipHP:

cmp dword ptr [bPatchAim],1
jne short lblTickSkipAim
mov eax, [iDesiredMinAim]
cmp dword ptr [esi+740],eax
jge short lblTickSkipAim
mov [esi+740],eax
lblTickSkipAim:

cmp dword ptr [bPatchDefense],1
jne short lblTickSkipDefense
mov eax, [iDesiredMinDefense]
cmp dword ptr [esi+744],eax
jge short lblTickSkipDefense
mov [esi+744],eax
lblTickSkipDefense:

cmp dword ptr [bPatchWill],1
jne short lblTickSkipWill
mov eax, [iDesiredMinWill]
cmp dword ptr [esi+758],eax
jge short lblTickSkipWill
mov [esi+758],eax
lblTickSkipWill:

cmp dword ptr [bPatchMoves],1
jne short lblTickSkipMoves
mov eax, [iDesiredMinMoves]
cmp dword ptr [esi+748],eax
jge short lblTickSkipMoves
mov [esi+748],eax
lblTickSkipMoves:

cmp dword ptr [bPatchRecoveryTime],1
jne short lblTickSkipRecoveryTime
cmp dword ptr [esi+93C],6
jne short lblTickSkipRecoveryTime
mov dword ptr [esi+8F0],0
mov dword ptr [esi+93C],0
mov dword ptr [esi+940],0
mov dword ptr [esi+948],0
lblTickSkipRecoveryTime:

cmp dword ptr [bPatchPsyFlag],1
jne short lblTickSkipPsyFlag
cmp dword ptr [esi+7C8],1
je short lblTickSkipPsyFlag
mov dword ptr [esi+7C8],1
lblTickSkipPsyFlag:

cmp dword ptr [bPatchPsyLevel],1
jne short lblTickSkipPsyLevel
mov eax, [iDesiredMinPsyLevel]
cmp dword ptr [esi+7FC],eax
jge short lblTickSkipPsyLevel
mov [esi+7FC],eax
lblTickSkipPsyLevel:

cmp dword ptr [bPatchHeatAmmo],1
jne short lblTickSkipHeatAmmo
mov eax, [bDesiredHeatAmmoState]
mov [esi+43C],eax
lblTickSkipHeatAmmo:

cmp dword ptr [bPatchRapidReaction],1
jne short lblTickSkipRapidReaction
mov eax, [bDesiredRapidReactionState]
mov [esi+330],eax
lblTickSkipRapidReaction:

cmp dword ptr [bPatchCoveringFire],1
jne short lblTickSkipCoveringFire
mov eax, [bDesiredCoveringFireState]
mov [esi+390],eax
lblTickSkipCoveringFire:

lblTickDone:
popall
lea eax,[esp+10]  // Original code
push eax          // Original code
jmp lblTickReturn
pLastPatchedUnit:
dd 0

aobTick:
aobTick_r:
jmp lblTick
lblTickReturn:

[DISABLE]
aobTick_r:
db 8D 44 24 10 50

unregistersymbol(aobTick_r)

unregistersymbol(bPatchHP)
unregistersymbol(bPatchAim)
unregistersymbol(bPatchDefense)
unregistersymbol(bPatchWill)
unregistersymbol(bPatchMoves)
unregistersymbol(bPatchRecoveryTime)
unregistersymbol(bPatchPsyFlag)
unregistersymbol(bPatchPsyLevel)
unregistersymbol(bPatchHeatAmmo)
unregistersymbol(bPatchRapidReaction)
unregistersymbol(bPatchCoveringFire)

unregistersymbol(iDesiredMinHP)
unregistersymbol(iDesiredMinAim)
unregistersymbol(iDesiredMinDefense)
unregistersymbol(iDesiredMinWill)
unregistersymbol(iDesiredMinMoves)
unregistersymbol(iDesiredMinPsyLevel)
unregistersymbol(bDesiredHeatAmmoState)
unregistersymbol(bDesiredRapidReactionState)
unregistersymbol(bDesiredCoveringFireState)

unregistersymbol(pLastPatchedUnit)

dealloc(newmem)"""

