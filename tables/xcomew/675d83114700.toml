id = "xcom-enemy-within-aob-object-array-script"
name = "XCOM - Enemy Within AOB object array script"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(aobArrayPointerGrabber,8B 46 3C 8B 08 8B 81 60 05 00 00 5E 85 C0)

alloc(newmem,2048)

label(aobArrayPointerGrabber_r)
registersymbol(aobArrayPointerGrabber_r)

label(lblArrayPointerGrabber)
label(lblArrayPointerGrabberRet)

label(pArray)
registersymbol(pArray)

newmem:

lblArrayPointerGrabber:
mov eax,[esi+3C]
mov ecx,[eax]
mov dword ptr [pArray],eax
jmp lblArrayPointerGrabberRet
pArray:
dd 0

aobArrayPointerGrabber:
aobArrayPointerGrabber_r:
jmp lblArrayPointerGrabber
lblArrayPointerGrabberRet:

[DISABLE]
aobArrayPointerGrabber_r:
db 8B 46 3C 8B 08

unregistersymbol(aobArrayPointerGrabber_r)

unregistersymbol(pArray)

dealloc(newmem)"""

