[[cheat]]
id = "uipartyportrait-base-address-scan-initialization-activate-this-first"
name = "UIPartyPortrait Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(UIPartyPortrait_basepointer)
registersymbol(UIPartyPortrait_update_enable)
registersymbol(UIPartyPortrait_update_value)
registersymbol(UIPartyPortrait_set_enable)
registersymbol(UIPartyPortrait_healthset_enable)
registersymbol(UIPartyPortrait_cooldownset_enable)
registersymbol(UIPartyPortrait_speedset_enable)
registersymbol(UIPartyPortrait_speedset_value)

alloc(UIPartyPortrait_basepointer, 8)
alloc(UIPartyPortrait_update_enable, 4)
alloc(UIPartyPortrait_update_value, 4)
alloc(UIPartyPortrait_set_enable, 4)
alloc(UIPartyPortrait_healthset_enable, 4)
alloc(UIPartyPortrait_cooldownset_enable, 4)
alloc(UIPartyPortrait_speedset_enable, 4)
alloc(UIPartyPortrait_speedset_value, 4)

UIPartyPortrait_speedset_value:
dd (float)16


[DISABLE]
unregistersymbol(UIPartyPortrait_basepointer)
unregistersymbol(UIPartyPortrait_update_enable)
unregistersymbol(UIPartyPortrait_update_value)
unregistersymbol(UIPartyPortrait_set_enable)
unregistersymbol(UIPartyPortrait_healthset_enable)
unregistersymbol(UIPartyPortrait_cooldownset_enable)
unregistersymbol(UIPartyPortrait_speedset_enable)
unregistersymbol(UIPartyPortrait_speedset_value)

dealloc(UIPartyPortrait_basepointer)
dealloc(UIPartyPortrait_update_enable)
dealloc(UIPartyPortrait_update_value)
dealloc(UIPartyPortrait_set_enable)
dealloc(UIPartyPortrait_healthset_enable)
dealloc(UIPartyPortrait_cooldownset_enable)
dealloc(UIPartyPortrait_speedset_enable)
dealloc(UIPartyPortrait_speedset_value)"""

[[cheat]]
id = "uipartyportrait-base-address-scan-to-activate-play-level-to-update-play-level"
name = "UIPartyPortrait Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(UIPartyPortrait_savedAOB)
label(UIPartyPortrait_returnhere)
label(UIPartyPortrait_originalcode)
label(UIPartyPortrait_exit)

label(UIPartyPortrait_update_exit)
label(UIPartyPortrait_set_exit)
label(UIPartyPortrait_healthset_exit)
label(UIPartyPortrait_cooldownset_exit)
label(UIPartyPortrait_speedset_exit)

registersymbol(UIPartyPortrait_savedAOB)

//1CA52EF1 - 89 85 B0FEFFFF        - mov [rbp-00000150],eax
//1CA52EF7 - 89 85 48FEFFFF        - mov [rbp-000001B8],eax
// UIPartyPortrait:Update+6d
//1CA52EFD - 48 8B 8E 90000000     - mov rcx,[rsi+00000090]
//1CA52F04 - 33 D2                 - xor edx,edx
//1CA52F06 - 48 83 EC 20           - sub rsp,20
//1CA52F0A - 49 BB 9027C00400000000 - mov r11,0000000004C02790 : [EC8B4855]
//1CA52F14 - 41 FF D3              - call r11d
//1CA52F17 - 48 83 C4 20           - add rsp,20
//1CA52F1B - 85 C0                 - test eax,eax
//1CA52F1D - 0F85 67130000         - jne 1CA5428A
//1CA52F23 - 48 8B 46 20           - mov rax,[rsi+20]
//1CA52F27 - 48 8B C8              - mov rcx,rax
//1CA52F2A - 48 83 EC 20           - sub rsp,20
//1CA52F2E - 83 38 00              - cmp dword ptr [rax],00
aobscan(UIPartyPortrait_searchedAOB, 48 8B 8E 90 00 00 00 33 D2 48 83 EC 20 * * * * * * * * * * 41 FF D3 48 83 C4 20 85 C0 * * * * * * 48 8B 46 20)

alloc(UIPartyPortrait_newmem, 2048, UIPartyPortrait_searchedAOB)
alloc(UIPartyPortrait_temp1, 8, UIPartyPortrait_searchedAOB)
alloc(UIPartyPortrait_temp2, 8, UIPartyPortrait_searchedAOB)
alloc(UIPartyPortrait_temp3, 8, UIPartyPortrait_searchedAOB)
alloc(UIPartyPortrait_temp4, 8, UIPartyPortrait_searchedAOB)
alloc(UIPartyPortrait_temp5, 8, UIPartyPortrait_searchedAOB)


UIPartyPortrait_newmem:
mov [UIPartyPortrait_temp1], rax
mov [UIPartyPortrait_temp2], rbx
mov [UIPartyPortrait_temp3], rcx
mov [UIPartyPortrait_temp4], rdx

cmp dword ptr [UIPartyPortrait_update_enable], #0
je UIPartyPortrait_update_exit
mov ebx, [UIPartyPortrait_update_value]
cmp [rsi+c0], ebx
jne UIPartyPortrait_update_exit
mov [UIPartyPortrait_basepointer], rsi
UIPartyPortrait_update_exit:

mov rax, [rsi+88]
test rax, rax
je UIPartyPortrait_speedset_exit
cmp byte ptr [rax+1f8], #1
jne UIPartyPortrait_speedset_exit

cmp dword ptr [UIPartyPortrait_set_enable], #0
je UIPartyPortrait_set_exit
UIPartyPortrait_set_exit:

cmp dword ptr [UIPartyPortrait_healthset_enable], #0
je UIPartyPortrait_healthset_exit
mov rax, [rsi+a8]
test rax, rax
je UIPartyPortrait_healthset_exit
mov [rax+e8], (float)9999
UIPartyPortrait_healthset_exit:

cmp dword ptr [UIPartyPortrait_cooldownset_enable], #0
je UIPartyPortrait_cooldownset_exit
mov rax, [rsi+88]
test rax, rax
je UIPartyPortrait_cooldownset_exit
mov [rax+5f4], (float)0
mov [rax+5f8], (float)0
UIPartyPortrait_cooldownset_exit:

cmp dword ptr [UIPartyPortrait_speedset_enable], #0
je UIPartyPortrait_speedset_exit
mov rax, [rsi+88]
test rax, rax
je UIPartyPortrait_speedset_exit
mov rax, [rax+98]
test rax, rax
je UIPartyPortrait_speedset_exit
fld [UIPartyPortrait_speedset_value]
fstp [rax+17c]
UIPartyPortrait_speedset_exit:

mov rax, [UIPartyPortrait_temp1]
mov rbx, [UIPartyPortrait_temp2]
mov rcx, [UIPartyPortrait_temp3]
mov rdx, [UIPartyPortrait_temp4]


UIPartyPortrait_originalcode:
db 48 8B 8E 90 00 00 00
//mov rcx,[rsi+00000090]


UIPartyPortrait_exit:
jmp UIPartyPortrait_returnhere


UIPartyPortrait_searchedAOB:
UIPartyPortrait_savedAOB:
jmp UIPartyPortrait_newmem
nop
nop
UIPartyPortrait_returnhere:


[DISABLE]
UIPartyPortrait_savedAOB:
db 48 8B 8E 90 00 00 00
//mov rcx,[rsi+00000090]

unregistersymbol(UIPartyPortrait_savedAOB)

dealloc(UIPartyPortrait_newmem)
dealloc(UIPartyPortrait_temp1)
dealloc(UIPartyPortrait_temp2)
dealloc(UIPartyPortrait_temp3)
dealloc(UIPartyPortrait_temp4)
dealloc(UIPartyPortrait_temp5)"""

