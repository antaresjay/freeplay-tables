[[cheat]]
id = "liv-character-controller-ctrl-numpad-1-main-cheats"
name = "Liv Character Controller (Ctrl + Numpad 1) {Main Cheats}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Bashtronaut.exe
// Author            : ndck76
// Executable Version: 2021.3.24.4316
// Game Version      : v1.0
// Script Date       : 2026-07-05


[ENABLE]

aobscanregion(dashcd,OrionGames.LivState:CheckDodgeRoll,OrionGames.LivState:CheckDodgeRoll+200,F30F1080xxxx0000F3xxxxxxF2xxxxxxF3xxxxxxxxF3xxxxxxxxF3xxxxxx66xxxxxx66xxxxxx7Axx73xx33xxE9xxxxxxxx66xx) //OrionGames.LivState:CheckDodgeRoll+3b
alloc(newmem,$1000,dashcd)
alloc(data,8)
alloc(dashcdbkp,8)
registersymbol(data)
registersymbol(dashcd)
registersymbol(dashcdbkp)
label(code)
label(return)

dashcdbkp:
  readmem(dashcd,8)

newmem:
  mov [data],rax

code:
  readmem(dashcd,8)
  jmp return

dashcd:
  jmp newmem
  nop 3
return:

[DISABLE]

dashcd:
  readmem(dashcdbkp,8)

unregistersymbol(*)
dealloc(*)"""

