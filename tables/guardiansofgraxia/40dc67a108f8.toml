[[cheat]]
id = "guardians-of-graxia-elves-dwarves-script"
name = "<- Guardians of Graxia - Elves Dwarves Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
===========================================
 Guardians Of Graxia - Elves and Dwarves
 Game Version  : 2.0.0.0
 Script Version: 1.0
 CE Version    : 6.0
 Mana and God Mode
 01-May-2011
 By Recifense
===========================================
}

[ENABLE]
//=========================================
// Check if script is compatible to this game version
// If false the script will not be loaded

assert(GuardiansOfGraxia.exe+121d2c,8b 88 ac 00 00 00)
assert(GuardiansOfGraxia.exe+021df5,8b 4d 08 89 48 0c)
assert(GuardiansOfGraxia.exe+10b796,8b 88 40 02 00 00)

//=========================================
alloc(MyCode,1024)
//=========================================
// Declaration section
label(_MonMana)
label(_MonM0)
label(_BackMM)
label(_ExitMM)
label(_GodMode)
label(_BackGM)
label(_ExitGM)
label(_MonSel)
label(_BackMS)
label(_ExitMS)
label(pMana)
label(pUnit)
label(iEnableMM)
label(iEnableGM)
label(iPlayerID)

registersymbol(MyCode)
registersymbol(pMana)
registersymbol(pUnit)
registersymbol(iEnableMM)
registersymbol(iEnableGM)
registersymbol(iPlayerID)

//=========================================
MyCode:
//=========================================
_MonMana:
 cmp dword ptr [iEnableMM],0
 je _ExitMM                        // Jump if feature is disabled

 mov ecx,[eax+08]                  // get playerID
 cmp ecx,[iPlayerID]
 jne _ExitMM

 mov [pMana],eax                   // Save ptr for debugging

 mov ecx,#300
 cmp ecx,[eax+000000AC]
 jle _MonM0

 mov [eax+000000AC],ecx

_MonM0:
 mov ecx,[ebp+0c]
 test ecx,ecx
 jns _ExitMM

 xor ecx,ecx
 mov [ebp+0c],ecx

_ExitMM:
 mov ecx,[eax+000000AC]            // Original code
 jmp _BackMM                       // Back to main code

//=========================================
_GodMode:
 cmp dword ptr [iEnableGM],0
 je _ExitGM                        // Jump if feature is disabled

 mov ecx,[eax+3C]                  // Get ptr to Player
 test ecx,ecx
 jz _ExitGM

 mov ecx,[ecx+08]                  // Get unit owner ID
 cmp ecx,[iPlayerID]
 jne _ExitGM

 mov ecx,[eax+10]                  // Get max HP
 mov [ebp+08],ecx                  // Make next HP = maximum

_ExitGM:
 mov ecx,[ebp+08]                  // Original code
 mov [eax+0C],ecx                  // Original code
 jmp _BackGM                       // Back to main code

//=========================================
_MonSel:
 mov ecx,[eax+00000240]            // Original code

 mov [pUnit],ecx                   // Save ptr for debugging

_ExitMS:
 jmp _BackMS                       // Back to main code

//=========================================
// Variables
iEnableMM:
 dd 1
iEnableGM:
 dd 1
pMana:
 dd 0
pUnit:
 dd 0
iPlayerID:
 dd 0

//=========================================
// Hacking Points
GuardiansOfGraxia.exe+121d2c:
 jmp _MonMana
 nop
_BackMM:

GuardiansOfGraxia.exe+021df5:
 jmp _GodMode
 nop
_BackGM:

GuardiansOfGraxia.exe+10b796:
 jmp _MonSel
 nop
_BackMS:

//=========================================
// Original Codes
[DISABLE]
GuardiansOfGraxia.exe+121d2c:
 mov ecx,[eax+000000AC]

GuardiansOfGraxia.exe+021df5:
 mov ecx,[ebp+08]
 mov [eax+0C],ecx

GuardiansOfGraxia.exe+10b796:
 mov ecx,[eax+00000240]

unregistersymbol(MyCode)
unregistersymbol(pMana)
unregistersymbol(pUnit)
unregistersymbol(iEnableMM)
unregistersymbol(iEnableGM)
unregistersymbol(iPlayerID)

dealloc(MyCode)"""

