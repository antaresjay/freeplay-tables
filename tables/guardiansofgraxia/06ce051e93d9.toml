[game]
name = "Guardians Of Graxia - Elves and Dwarves (GM and Mana) REUP"
exe = "guardiansofgraxia.exe"
notes = "Converted from a Cheat Engine table by STN. Source: https://fearlessrevolution.com/viewtopic.php?t=3804"
