[[cheat]]
id = "chassis-model-base-address-scan-to-activate-battle-to-update-battle"
name = "Chassis_Model Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Chassis_Model_savedAOB)
label(Chassis_Model_returnhere)
label(Chassis_Model_originalcode)
label(Chassis_Model_exit)

label(Chassis_Model_update_exit)
label(Chassis_Model_set_exit)
label(Chassis_Model_invulnerableset_exit)
label(Chassis_Model_ammoset_exit)
label(Chassis_Model_healthset_exit)

registersymbol(Chassis_Model_savedAOB)

//100217C8 - 48 89 7C 24 08        - mov [rsp+08],rdi
//100217CD - 48 8B F1              - mov rsi,rcx
// Chassis_Model:get_isAlive+10
//100217D0 - 0FB6 86 8B000000      - movzx eax,byte ptr [rsi+0000008B]
//100217D7 - 85 C0                 - test eax,eax
//100217D9 - 74 09                 - je 100217E4
//100217DB - 0FB6 BE 8A000000      - movzx edi,byte ptr [rsi+0000008A]
aobscan(Chassis_Model_searchedAOB, 0F B6 86 8B 00 00 00 85 C0)

alloc(Chassis_Model_newmem, 2048, Chassis_Model_searchedAOB)


Chassis_Model_newmem:
cmp dword ptr [rsi+c0], #5
je Chassis_Model_healthset_exit

cmp dword ptr [Chassis_Model_update_enable], #0
je Chassis_Model_update_exit
mov [Chassis_Model_basepointer], rsi
Chassis_Model_update_exit:

cmp dword ptr [Chassis_Model_set_enable], #0
je Chassis_Model_set_exit
Chassis_Model_set_exit:

cmp dword ptr [Chassis_Model_invulnerableset_enable], #0
je Chassis_Model_invulnerableset_exit
mov byte ptr [rsi+88], #1
Chassis_Model_invulnerableset_exit:

cmp dword ptr [Chassis_Model_ammoset_enable], #0
je Chassis_Model_ammoset_exit
mov byte ptr [rsi+89], #1
Chassis_Model_ammoset_exit:

cmp dword ptr [Chassis_Model_healthset_enable], #0
je Chassis_Model_healthset_exit
fld [rsi+b4]
fstp [rsi+b0]
Chassis_Model_healthset_exit:


Chassis_Model_originalcode:
db 0F B6 86 8B 00 00 00
//movzx eax,byte ptr [rsi+0000008B]


Chassis_Model_exit:
jmp Chassis_Model_returnhere


Chassis_Model_searchedAOB:
Chassis_Model_savedAOB:
jmp Chassis_Model_newmem
nop
nop
Chassis_Model_returnhere:


[DISABLE]
Chassis_Model_savedAOB:
db 0F B6 86 8B 00 00 00
//movzx eax,byte ptr [rsi+0000008B]

unregistersymbol(Chassis_Model_savedAOB)

dealloc(Chassis_Model_newmem)"""

