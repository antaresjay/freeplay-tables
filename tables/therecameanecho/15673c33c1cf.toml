[[cheat]]
id = "unlimited-shields"
name = "Unlimited Shields"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(shield,D9 80 BC 00 00 00 D9 5D E4 D9 45 E4 D9 05 * * * * DF F1 DD D8 76)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  fld dword ptr [eax+000000C0]
  fst dword ptr [eax+000000BC]
  jmp return

shield:
  jmp code
  nop
return:
registersymbol(shield)

[DISABLE]
shield:
  db D9 80 BC 00 00 00
unregistersymbol(shield)
dealloc(newmem)"""

