registersymbol(OneHitKill)

[DISABLE]

aobHealth:
  db F3 0F 11 B3 28 01 00 00

unregistersymbol(aobHealth)
unregistersymbol(health)
unregistersymbol(OneHitKill)

dealloc(newmem)
dealloc(health)
dealloc(OneHitKill)"""

