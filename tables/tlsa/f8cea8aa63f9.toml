[[cheat]]
id = "one-hit-kill"
name = "One Hit Kill"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
//Author : LeFiXER
[ENABLE]
aobscanmodule(aobHealth,GameAssembly.dll,F3xxxxxxxxxxxxxx0F2Fxx0F93xx88xxxxxxxxxx48xxxxxxxxxxxx)
alloc(newmem,$1000,aobHealth)
alloc(health,8)
alloc(OneHitKill,1)
label(code)
label(return)
label(enemy)

newmem:
  mov [health],rbx
  cmp [rbx+50],0
  jne enemy
   movss [rbx+128],xmm7
   jmp return

enemy:
  cmp [OneHitKill],0
  je code
   mov [rbx+00000128],0
   jmp return

code:
  movss [rbx+00000128],xmm6
  jmp return

aobHealth:
  jmp newmem
  nop 3

return:
registersymbol(aobHealth)
