[[cheat]]
id = "infinite-weight"
name = "Infinite Weight"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : TLSA.exe
  Version:
  Date   : 2024-10-13
  Author : Silas

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(Weight,GameAssembly.dll,F3 0F 10 78 24 48 8B 4E) // should be unique
alloc(newmem,$1000,Weight)

label(code return vWeight)
registersymbol(Weight vWeight)

newmem:

code:
  movss xmm7,[rax+24]
  movss xmm7,[vWeight]
  jmp return

vWeight:
  dd (float)0

Weight:
  jmp newmem

return:

[DISABLE]

Weight:
  db F3 0F 10 78 24

unregistersymbol(*)
dealloc(*)"""

