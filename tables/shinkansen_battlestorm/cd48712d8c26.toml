[[cheat]]
id = "gamemanager-base-address-scan-initialization-activate-this-first"
name = "GameManager Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameManager_basepointer)
registersymbol(GameManager_update_enable)
registersymbol(GameManager_set_enable)
registersymbol(GameManager_healthset_enable)
registersymbol(GameManager_inventoryset_enable)
registersymbol(GameManager_chargeset_enable)

alloc(GameManager_basepointer, 4)
alloc(GameManager_update_enable, 4)
alloc(GameManager_set_enable, 4)
alloc(GameManager_healthset_enable, 4)
alloc(GameManager_inventoryset_enable, 4)
alloc(GameManager_chargeset_enable, 4)


[DISABLE]
unregistersymbol(GameManager_basepointer)
unregistersymbol(GameManager_update_enable)
unregistersymbol(GameManager_set_enable)
unregistersymbol(GameManager_healthset_enable)
unregistersymbol(GameManager_inventoryset_enable)
unregistersymbol(GameManager_chargeset_enable)

dealloc(GameManager_basepointer)
dealloc(GameManager_update_enable)
dealloc(GameManager_set_enable)
dealloc(GameManager_healthset_enable)
dealloc(GameManager_inventoryset_enable)
dealloc(GameManager_chargeset_enable)"""

[[cheat]]
id = "gamemanager-base-address-scan-to-activate-play-level-to-update-play-level"
name = "GameManager Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameManager_savedAOB)
label(GameManager_returnhere)
label(GameManager_originalcode)
label(GameManager_exit)

label(GameManager_update_exit)
label(GameManager_set_exit)
label(GameManager_healthset_exit)
label(GameManager_inventoryset_exit)
label(GameManager_chargeset_exit)

registersymbol(GameManager_savedAOB)

//04B36D77 - 0F85 4D000000         - jne 04B36DCA
//04B36D7D - B8 F4FEB008           - mov eax,08B0FEF4 : [43E48A59]
// GameManager:CheckMultiplierTimer+1a
//04B36D82 - D9 00                 - fld dword ptr [eax]
//04B36D84 - DD 5D F8              - fstp qword ptr [ebp-08]
//04B36D87 - E8 4C94FBFF           - call 04AF01D8
//04B36D8C - DD 45 F8              - fld qword ptr [ebp-08]
//04B36D8F - D9C9                  - fxch st(1)
//04B36D91 - DEE9                  - fsubp st(1),st(0)
aobscan(GameManager_searchedAOB, D9 00 DD 5D F8 * * * * * DD 45 F8 D9 C9 DE)

alloc(GameManager_newmem, 2048, GameManager_searchedAOB)
alloc(GameManager_temp1, 4, GameManager_searchedAOB)
alloc(GameManager_temp2, 4, GameManager_searchedAOB)


GameManager_newmem:
mov [GameManager_temp1], ebx
mov [GameManager_temp2], ecx

mov ebx, eax
sub ebx, 9c

cmp dword ptr [GameManager_update_enable], #0
je GameManager_update_exit
mov [GameManager_basepointer], ebx
GameManager_update_exit:

cmp dword ptr [GameManager_set_enable], #0
je GameManager_set_exit
GameManager_set_exit:

cmp dword ptr [GameManager_healthset_enable], #0
je GameManager_healthset_exit
mov [ebx+b0], (float)999
GameManager_healthset_exit:

cmp dword ptr [GameManager_inventoryset_enable], #0
je GameManager_inventoryset_exit
mov [ebx+54], #999
mov [ebx+58], #999
mov [ebx+5c], #999
mov [ebx+60], #999
mov [ebx+a0], (float)999
mov [ebx+a4], (float)999
GameManager_inventoryset_exit:

cmp dword ptr [GameManager_chargeset_enable], #0
je GameManager_chargeset_exit
fld [ebx+c0]
fstp [ebx+c4]
fld [ebx+c8]
fstp [ebx+cc]
GameManager_chargeset_exit:

mov ebx, [GameManager_temp1]
mov ecx, [GameManager_temp2]


GameManager_originalcode:
db D9 00 DD 5D F8
//fld dword ptr [eax]
//fstp qword ptr [ebp-08]


GameManager_exit:
jmp GameManager_returnhere


GameManager_searchedAOB:
GameManager_savedAOB:
jmp GameManager_newmem
GameManager_returnhere:


[DISABLE]
GameManager_savedAOB:
db D9 00 DD 5D F8
//fld dword ptr [eax]
//fstp qword ptr [ebp-08]

unregistersymbol(GameManager_savedAOB)

dealloc(GameManager_newmem)
dealloc(GameManager_temp1)
dealloc(GameManager_temp2)"""

