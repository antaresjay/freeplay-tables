[[cheat]]
id = "force-select-character"
name = "Force Select Character"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Force_Select_Character,BBTAG.exe,03 CA 8B 84 C1 * * * * C3)

Force_Select_Character:
  db 6A 00 58 EB 04

registersymbol(Force_Select_Character)

[DISABLE]

Force_Select_Character:
  db 03 CA 8B 84 C1

unregistersymbol(Force_Select_Character)"""

