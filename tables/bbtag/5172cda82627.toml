source = """
[ENABLE]

aobscanmodule(No_Resonance_Burst_Loss,BBTAG.exe,75 * 85 F6 79 * 81 FE * * * * 75)

No_Resonance_Burst_Loss:
  db 70

No_Resonance_Burst_Loss+04:
  db 70

No_Resonance_Burst_Loss+0C:
  db EB

registersymbol(No_Resonance_Burst_Loss)

[DISABLE]

No_Resonance_Burst_Loss:
  db 75

No_Resonance_Burst_Loss+04:
  db 79

No_Resonance_Burst_Loss+0C:
  db 75

unregistersymbol(No_Resonance_Burst_Loss)"""

[[cheat]]
id = "force-resonance-kinda"
name = "Force Resonance (Kinda)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Force_Resonance,BBTAG.exe,83 7C 91 30 01 0F 94 C0)
alloc(newmem,$1000)

label(return)
label(p1res)
label(p2res)

newmem:
  cmp edx,0
  cmove eax,[p1res]
  cmp edx,1
  cmove eax,[p2res]
  jmp return

p1res:
  dd 0

p2res:
  dd 0

Force_Resonance:
  jmp newmem
  db 90 90 90
return:
registersymbol(Force_Resonance)
registersymbol(p1res)
registersymbol(p2res)

[DISABLE]

Force_Resonance:
  db 83 7C 91 30 01 0F 94 C0

unregistersymbol(Force_Resonance)
unregistersymbol(p1res)
unregistersymbol(p2res)
dealloc(newmem)"""

