[[cheat]]
id = "allow-same-character"
name = "Allow Same Character"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Allow_Same_Chars,BBTAG.exe,3B * * * 75 * 33)

Allow_Same_Chars+04:
  db EB

registersymbol(Allow_Same_Chars)

aobscanmodule(Allow_Same_Chars_Cursor,BBTAG.exe,7D * 40 5B 89 46)

Allow_Same_Chars_Cursor+02:
  db 90

registersymbol(Allow_Same_Chars_Cursor)

aobscanmodule(Allow_Same_Chars_Online,BBTAG.exe,75 * 40 89 83 * * * * 83)

Allow_Same_Chars_Online:
  db EB

registersymbol(Allow_Same_Chars_Online)

[DISABLE]

Allow_Same_Chars+04:
  db 75

unregistersymbol(Allow_Same_Chars)

Allow_Same_Chars_Cursor+02:
  db 40

unregistersymbol(Allow_Same_Chars_Cursor)

Allow_Same_Chars_Online:
  db 75

unregistersymbol(Allow_Same_Chars_Online)"""

