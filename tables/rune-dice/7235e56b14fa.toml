[[cheat]]
id = "cheat"
name = "无敌，必杀"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Rune Dice.exe
  Version:
  Date   : 2026-06-01
  Author : kimi
}

[ENABLE]
aobscanmodule(无敌必杀,GameAssembly.dll,8B 53 18 2B D7 78 ** 44 8B 43 14 44 03 43 10)
aobscanmodule(伤_害,GameAssembly.dll,8B 46 48 89 84 24 60 01 00 00 F3 44 0F 10 15 ** ** ** **)

alloc(newmem1,$100,无敌必杀)
alloc(newmem2,$100,伤_害)
alloc(战斗,8)
alloc(伤害值,4)

label(code1 return1 code2 return2)

战斗:
  dd 0
  dd 0

伤害值:
  dd 0

newmem1:
  cmp dword ptr [rbx+20],0
  je 怪物

玩家:
  cmp [战斗],0
  je code1
  mov edx,[rbx+18]
  jmp return1

怪物:
  cmp [战斗+4],0
  je code1
  mov eax,[rbx+10]
  mov [伤害值],eax
  jmp code1

code1:
  mov edx,[rbx+18]
  sub edx,edi
  jmp return1

无敌必杀:
  jmp newmem1
return1:

newmem2:
  cmp [战斗+4],0
  je code2
  mov eax,[伤害值]
  mov [rsp+00000160],eax
  jmp return2

code2:
  mov eax,[rsi+48]
  mov [rsp+00000160],eax
  jmp return2

伤_害:
  jmp newmem2
  nop 5
return2:

registersymbol(无敌必杀 伤_害 战斗 伤害值)

[DISABLE]
无敌必杀:
  db 8B 53 18 2B D7

伤_害:
  db 8B 46 48 89 84 24 60 01 00 00

unregistersymbol(*)
dealloc(*)"""

