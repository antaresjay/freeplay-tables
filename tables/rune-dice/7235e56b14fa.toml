[[cheat]]
id = "cheat-4"
name = "刷新、购买零元购"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Rune Dice.exe
  Version: 
  Date   : 2026-06-01
  Author : kimi
}

[ENABLE]

aobscanmodule(物品商店刷新,GameAssembly.dll,39 58 10 48 8B 5C 24 30 0F 9D C0 48 83 C4 20) // should be unique
alloc(newmem,$100,物品商店刷新)
alloc(金币地址,8)
label(code return)

newmem:
  mov [金币地址],rax
code:
  cmp [rax+10],ebx
  mov rbx,[rsp+30]
  mov al,1
  nop
  jmp 物品商店刷新+B

物品商店刷新:
  jmp newmem
  nop 6
return:
registersymbol(物品商店刷新 金币地址)

[DISABLE]

物品商店刷新:
  db 39 58 10 48 8B 5C 24 30 0F 9D C0

unregistersymbol(*)
dealloc(*)"""

