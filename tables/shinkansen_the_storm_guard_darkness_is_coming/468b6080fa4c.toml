[[cheat]]
id = "game-base-address-scan-initialization-activate-this-first"
name = "Game Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Game_basepointer)
registersymbol(Game_update_enable)
registersymbol(Game_set_enable)
registersymbol(Game_resourcesset_enable)
registersymbol(Game_panicset_enable)

alloc(Game_basepointer, 8)
alloc(Game_update_enable, 4)
alloc(Game_set_enable, 4)
alloc(Game_resourcesset_enable, 4)
alloc(Game_panicset_enable, 4)


[DISABLE]
unregistersymbol(Game_basepointer)
unregistersymbol(Game_update_enable)
unregistersymbol(Game_set_enable)
unregistersymbol(Game_resourcesset_enable)
unregistersymbol(Game_panicset_enable)

dealloc(Game_basepointer)
