[[cheat]]
id = "game-base-address-scan-to-activate-view-mission-board-to-update-view-mission-board"
name = "Game Base Address Scan (To Activate: View Mission Board, To Update: View Mission Board)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Game_savedAOB)
label(Game_returnhere)
label(Game_originalcode)
label(Game_exit)

label(Game_update_exit)
label(Game_set_exit)
label(Game_resourcesset_exit)
label(Game_panicset_exit)

registersymbol(Game_savedAOB)

//1E8ECAE6 - 48 89 4D D0           - mov [rbp-30],rcx
//1E8ECAEA - 48 89 45 D8           - mov [rbp-28],rax
// StrategyLayer:ExplorePanel:UpdatePanel+6e
//1E8ECAEE - 48 63 80 CC000000     - movsxd  rax,dword ptr [rax+000000CC]
//1E8ECAF5 - 48 89 45 C8           - mov [rbp-38],rax
//1E8ECAF9 - B9 483E6004           - mov ecx,04603E48 : [045C10A8]
//1E8ECAFE - 48 83 EC 20           - sub rsp,20
aobscan(Game_searchedAOB, 48 63 80 CC 00 00 00 48 89 45 C8)

alloc(Game_newmem, 2048, Game_searchedAOB)
alloc(Game_temp1, 8, Game_searchedAOB)
alloc(Game_temp2, 8, Game_searchedAOB)


Game_newmem:
mov [Game_temp1], rbx
mov [Game_temp2], rcx

cmp dword ptr [Game_update_enable], #0
je Game_update_exit
mov [Game_basepointer], rax
Game_update_exit:

cmp dword ptr [Game_set_enable], #0
je Game_set_exit
Game_set_exit:

cmp dword ptr [Game_resourcesset_enable], #0
je Game_resourcesset_exit
cmp dword ptr [rax+20], #0
je Game_resourcesset_exit
cmp qword ptr [rax+20], #0
je Game_resourcesset_exit
mov rbx, [rax+20]
mov [rbx+20], #9999999
mov [rbx+24], #9999999
mov [rbx+28], #9999999
mov [rbx+2c], #9999999
mov [rbx+30], #9999999
mov [rbx+34], #9999999
mov [rbx+38], #9999999
mov [rbx+3c], #9999999
mov [rbx+40], #9999999
mov [rbx+44], #9999999
mov [rbx+48], #9999999
mov [rbx+4c], #9999999
mov [rbx+50], #9999999
Game_resourcesset_exit:

cmp dword ptr [Game_panicset_enable], #0
je Game_panicset_exit
mov [rax+d8], #0
Game_panicset_exit:

mov rbx, [Game_temp1],
mov rcx, [Game_temp2],


Game_originalcode:
db 48 63 80 CC 00 00 00
//movsxd  rax,dword ptr [rax+000000CC]


Game_exit:
jmp Game_returnhere


Game_searchedAOB:
Game_savedAOB:
jmp Game_newmem
nop
nop
Game_returnhere:


[DISABLE]
Game_savedAOB:
db 48 63 80 CC 00 00 00
//movsxd  rax,dword ptr [rax+000000CC]

unregistersymbol(Game_savedAOB)

dealloc(Game_newmem)
dealloc(Game_temp1)
dealloc(Game_temp2)"""

