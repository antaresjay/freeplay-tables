[[cheat]]
id = "invulnerability"
name = "Invulnerability"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(invulnerability,GamesFarm.PlayerController:UpdateInput+3e,GamesFarm.PlayerController:UpdateInput+85,57 C0 48 8B CE 41 B8 01 00 00 00)
alloc(newmem,$1000,invulnerability)
label(code return)

newmem:
mov [rcx+D6C],#9999
mov [rsi+D54],(float)99999

code:
  mov rcx,rsi
  mov r8d,00000001
  jmp return

invulnerability+02:
  jmp newmem
  nop 4
return:
registersymbol(invulnerability)

[DISABLE]

invulnerability+02:
  db 48 8B CE 41 B8 01 00 00 00

unregistersymbol(*)
dealloc(*)"""

