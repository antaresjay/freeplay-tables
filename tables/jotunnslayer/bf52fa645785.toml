[[cheat]]
id = "enableafterloadingintomap"
name = "enableAfterLoadingIntoMap"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc(newmem,2048,"GameAssembly.dll"+908BCB)
alloc(PlayerInstance,8)
alloc(SpeedValue,4)
alloc(AttackSpeedValue,4)

registersymbol(PlayerInstance)
registersymbol(SpeedValue)
registersymbol(AttackSpeedValue)

SpeedValue:
dd (float)1.0

AttackSpeedValue:
dd (float)1.0

label(returnhere)

newmem:
  mov [PlayerInstance], rbx
  movss [rbx+000002C4], xmm6
  jmp returnhere

"GameAssembly.dll"+908BCB:
  jmp newmem
  nop 3
returnhere:

[DISABLE]

"GameAssembly.dll"+908BCB:
  db F3 0F 11 B3 C4 02 00 00

unregistersymbol(PlayerInstance)
unregistersymbol(SpeedValue)
unregistersymbol(AttackSpeedValue)
dealloc(PlayerInstance)
dealloc(SpeedValue)
dealloc(AttackSpeedValue)
dealloc(newmem)"""

