id = "resource-pointer"
name = "Resource Pointer"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(resource,F3 0F 10 80 F0 00 00 00 F3 0F 5A C0 48)
alloc(newmem,$1000,resource)

label(resourcePtr)
label(resourceBkp)
label(return)

newmem:
  db 48 8D
  readmem(resource+03,5)
  movss xmm0,[rax]
  mov rcx,resourcePtr
  mov [rcx],rax
  jmp return
resourceBkp:
  readmem(resource,8)
  jmp return

align 10
resourcePtr:
  dq 0

resource:
  jmp newmem
  nop 3
return:
registersymbol(resource)
registersymbol(resourceBkp)
registersymbol(resourcePtr)

[DISABLE]
