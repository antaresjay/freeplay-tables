type = "script"
source = """
[ENABLE]


aobscanmodule(fuelcd,MudRunner.exe,F3 0F 2C 88 E8 03 00 00)
alloc(newmem,$1000,"MudRunner.exe"+79CB63)

label(code)
label(return)

newmem:
code:
  fld dword ptr [rax+000003EC]
  fstp dword ptr [rax+000003E8]
  cvttss2si ecx,[rax+000003E8]
  jmp return

fuelcd:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(fuelcd)

[DISABLE]

fuelcd:
  db F3 0F 2C 88 E8 03 00 00

unregistersymbol(fuelcd)
dealloc(newmem)"""
