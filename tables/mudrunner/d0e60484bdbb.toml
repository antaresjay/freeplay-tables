type = "script"
source = """
{ Game   : MudRunner.exe
  Version:
  Date   : 2017-10-31
  Author : Kalas

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(_Fuel,MudRunner.exe,F3 0F 11 8E 74 02 00 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  fld [esi+278]
  fstp [esi+274]
  jmp return

_Fuel:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(_Fuel)

[DISABLE]

_Fuel:
  db F3 0F 11 8E 74 02 00 00

unregistersymbol(_Fuel)
dealloc(newmem)"""

