[[cheat]]
id = "recifense-s-script"
name = "Recifense's Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address1,H5_Game.exe+16c029)  // original H5_Game.exe+16cc89
define(address2,H5_Game.exe+6fef7e) // original H5_Game.exe+61d1fd
// address2 could also be +42c844

// Heroes of Might and Magic V - Tribes of the East
// Game Version  : 3.0
// Script Version: 1.0
// CE Version    : 5.4
// Resources and Move Points
// 27-Jul-2008
// Author: Recifense
// AOB by jgoemat

[ENABLE]
alloc(MyCode,1024)

label(_Resource)
label(_MovePoint)
label(_Res1)
label(_Res2)
label(_MovP1)
label(_BackR)
label(_BackMP)
label(_ExitR)
label(_ExitMP)
label(pOwner)
label(pLastOne)
label(pTroops)

registersymbol(MyCode)
registersymbol(pOwner)
registersymbol(pLastOne)
registersymbol(pTroops)

//=============================
// Hacking Points
address1:
 jmp _Resource
 nop
_BackR:

address2:
 jmp _MovePoint
 nop
_BackMP:

MyCode:
//=========================================
// Resources can increase, but not decrease
// base + 0x3c = iWood
// base + 0x40 = iOre
// base + 0x44 = iMercury
// base + 0x48 = iCrystal
// base + 0x4c = iSulfur
// base + 0x50 = iGems
// base + 0x54 = iGold
_Resource:
 mov ecx,[esp+2c]             // Original code
 mov eax,[edi]                // Original code

 mov [pOwner],edi             // save pointer for further use

 push ecx                     // Save ECX
 push ebx                     // Save EBX

 mov ecx,00001388             // 5000
 mov ebx,6                    // # of resources

_Res1:
 or ebx,ebx                   // Is it over?
 jz _Res2                     // Jump if true

 dec ebx
 cmp ecx,[edi+ebx*4+0000003c] // Res < 5000 ?
 jle _Res1                    // Jump if not

 mov [edi+ebx*4+0000003c],ecx // Make Res = 5000
 jmp _Res1                    // Check next resource

_Res2:
 mov ecx,0000c350             // 50000
 cmp ecx,[edi+00000054]       // Gold < 50000 ?
 jle _ExitR                   // Jump if not

 mov [edi+00000054],ecx       // Make Gold = 5000

_ExitR:
 pop ebx                      // Restore EBX
 pop ecx                      // Restore ECX
 jmp _BackR                   // back to main code

//=========================================
// Free Movement
_MovePoint:
 mov [ecx+0000012c],eax       // Update Move Point

 mov eax,[ecx+00000128]       // read the pointer to the heroÃ‚Â´s owner
 cmp eax,[pOwner]             // Is it one of playerÃ‚Â´s heroes?
 jne _ExitMP                  // Jump if false

 mov eax,[ecx+00000110]       // read pointer
 or eax,eax                   // Is there a pointer to troopÃ‚Â´s structure ?
 jz _MovP1                    // Jump if false

// Update pointer list of all hero's slots for troop
 push ebx
 mov ebx,[eax]
 mov [pTroops],ebx
 mov ebx,[eax+04]
 mov [pTroops+04],ebx
 mov ebx,[eax+08]
 mov [pTroops+08],ebx
 mov ebx,[eax+0c]
 mov [pTroops+0c],ebx
 mov ebx,[eax+10]
 mov [pTroops+10],ebx
 mov ebx,[eax+14]
 mov [pTroops+14],ebx
 mov ebx,[eax+18]
 mov [pTroops+18],ebx
 pop ebx

_MovP1:
 mov eax,[ecx+00000130]       // read max move point
 mov [ecx+0000012c],eax       // make current MP = max MP

 mov [pLastOne],ecx           // update pointer to last hero that moved

_ExitMP:
 jmp _BackMP                  // back to main code

//=========================================
// Variables
pOwner:
 dd 0                         // pointer to player
pLastOne:
 dd 0                         // pointer to last hero that moved
pTroops:
 dd 0,0,0,0,0,0,0             // pointers to 7 slots for hero's troops

//=========================================
// structure Troop
// base + 0x00 = 0x00e45de4
// base + 0x1C = itype (values from 01h to B3h)
// base + 0x20 = iqtd

// Type Exemples:
// 01 = Peasant
// 02 = Conscript
// 03 = Archer
// 04 = Marksman
// 05 = Footman
// 06 = Squire
// 07 = Griffin
// 08 = Imperial Griffin
// 09 = Priest
// 0A = Inquisitor
// 0B = Cavalier
// 0C = Paladin
// 0D = Angel
// 0E = Archangel
// and so on :)
//=========================================
// Original Codes

[DISABLE]
address1:
 mov ecx,[esp+2c]
 mov eax,[edi]

address2:
 mov [ecx+0000012c],eax

dealloc(MyCode)
unregistersymbol(MyCode)
unregistersymbol(pLastOne)
unregistersymbol(pTroops)"""
