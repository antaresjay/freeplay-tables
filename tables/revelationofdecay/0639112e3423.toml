[[cheat]]
id = "unlimited-health"
name = "Unlimited Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(InfHealth,Game.HeroOperation:OnUpdate_OnServer+55,Game.HeroOperation:OnUpdate_OnServer+93,83 38 00 48 8D 64 24 00 90 49 BB * *)
alloc(newmem,$1000,InfHealth)

label(code)
label(return)

newmem:
push rdx
mov rdx,[rcx+128]
mov rdx,[rdx+C8]
mov [rdx+20],(float)10
pop rdx

code:
  cmp dword ptr [rax],00
  lea rsp,[rsp+00]
  jmp return

InfHealth:
  jmp newmem
  nop 3
return:
registersymbol(InfHealth)

[DISABLE]

InfHealth:
  db 83 38 00 48 8D 64 24 00

unregistersymbol(InfHealth)
dealloc(newmem)"""

