[[cheat]]
id = "score-editor-ctrl-numpad-3"
name = "Score Editor (Ctrl + Numpad 3)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : BluePieta.exe
// Author            : ndck76
// Executable Version: 6000.2.9.50407
// Game Version      : v1.0.19.0.1
// Script Date       : 2026-06-05


[ENABLE]

aobscanmodule(score,GameAssembly.dll,4803xxxx4889xxxx488Bxxxxxxxxxx488Bxxxx83) //BFGameManager.AddSoul
alloc(newmem,$1000,score)
alloc(data2,8)
alloc(scorebkp,8)
registersymbol(data2)
registersymbol(score)
registersymbol(scorebkp)
label(code)
label(return)

scorebkp:
  readmem(score,8)

newmem:
  mov [data2],rax

code:
  readmem(score,8)
  jmp return

score:
  jmp newmem
  nop 3
return:

[DISABLE]

score:
  readmem(scorebkp,8)

unregistersymbol(*)
dealloc(*)"""

