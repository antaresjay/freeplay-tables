type = "script"
source = """
[ENABLE]
aobscanmodule(aobfov,Bates-Win64-Shipping.exe,F3 0F 58 8B 84 12 00 00 * * * FF * * * 00 00 F3 0F 59)
alloc(newmem,$1000,aobfov)
label(code)
label(return)
label(fov_f)
registersymbol(fov_f)

newmem:
  push rdx
  lea rdx,[rbx+1284]
  cmp [fov_f],0
  js code
  jne @f
  mov [fov_f],-1
  mov [rdx],0
  jmp code
@@:
  fld [fov_f]
  fsub [default_fov]
  fstp [rdx]
code:
  addss xmm1,[rdx]
  pop rdx
  jmp return


newmem+200:
fov_f:
dd -1

newmem+300:
default_fov:
dd (float)90

aobfov:
  jmp newmem
  nop 3
return:
registersymbol(aobfov)

[DISABLE]
aobfov:
  db F3 0F 58 8B 84 12 00 00
dealloc(newmem)"""

