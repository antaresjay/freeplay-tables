[[cheat]]
id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(INJECT,0F 38 F1 1C 07 B8 1C 18)
alloc(newmem,$1000,INJECT)

label(code)
label(return)

newmem:

code:
  jmp return

INJECT:
  jmp newmem
return:
registersymbol(INJECT)

[DISABLE]
INJECT:
  db 0F 38 F1 1C 07

unregistersymbol(INJECT)
dealloc(newmem)"""

