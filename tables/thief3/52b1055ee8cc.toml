[[cheat]]
id = "thief-3-aob-script-tg-1-2-with-sneaky-1-1-6"
name = "Thief 3 AOB script (TG 1.2 with Sneaky 1.1.6)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(aobArrowReader,Thief3.exe,C3 ?? ?? ?? ?? FF 8B 76 04 8B 48 10 83 C0 10 3B F1 7D ?? E8 ?? ?? ?? ?? 8B 50 18 83 C0 10 8D 0C 76 8B 44 8A 04 5E C3)
aobscanmodule(aobItemReader,Thief3.exe,E8 ?? ?? ?? ?? 8B 50 24 83 C0 1C 8D 0C 76 8B 44 8A 04 5E C3)
aobscanmodule(aobPtrGrabber,Thief3.exe,A1 ?? ?? ?? ?? 85 C0 75 01 C3 8B 40 08 C3 CC CC)

alloc(newmem,2048)

label(aobArrowReader_r)
registersymbol(aobArrowReader_r)

label(lblArrowReader)
label(lblArrowReaderSkip)
label(lblArrowReaderRet)

label(bEnableMinArrowCount)
label(iMinArrowCount)
registersymbol(bEnableMinArrowCount)
registersymbol(iMinArrowCount)

label(aobItemReader_r)
registersymbol(aobItemReader_r)

label(lblItemReader)
label(lblItemReaderSkip)
label(lblItemReaderRet)

label(bEnableMinItemCount)
label(iMinItemCount)
registersymbol(bEnableMinItemCount)
registersymbol(iMinItemCount)

label(aobPtrGrabber_r)
registersymbol(aobPtrGrabber_r)

label(lblPtrGrabber)
label(lblPtrGrabberSkip)

label(bEnableMinGold)
label(iMinGold)
registersymbol(bEnableMinGold)
registersymbol(iMinGold)

label(pGarrett)
registersymbol(pGarrett)

newmem:
bEnableMinGold:
dd 1
iMinGold:
dd (int)500
bEnableMinArrowCount:
dd 1
iMinArrowCount:
dd (int)50
bEnableMinItemCount:
dd 1
iMinItemCount:
dd (int)20

lblArrowReader:
cmp dword ptr [bEnableMinArrowCount],1
jne short lblArrowReaderSkip
mov eax,[iMinArrowCount]
cmp dword ptr [edx+ecx*4+04],eax
jge short lblArrowReaderSkip
mov dword ptr [edx+ecx*4+04],eax
lblArrowReaderSkip:
db 8B 44 8A 04 5E
jmp lblArrowReaderRet

lblItemReader:
cmp dword ptr [bEnableMinItemCount],1
jne short lblItemReaderSkip
mov eax,[iMinItemCount]
cmp dword ptr [edx+ecx*4+04],eax
jge short lblItemReaderSkip
mov dword ptr [edx+ecx*4+04],eax
lblItemReaderSkip:
db 8B 44 8A 04 5E
jmp lblItemReaderRet

lblPtrGrabber:
mov eax,[eax+08]
mov dword ptr [pGarrett],eax
push ebx
cmp dword ptr [bEnableMinGold],1
jne short lblPtrGrabberSkip
mov ebx,[iMinGold]
cmp dword ptr [eax+00000474],ebx
jge short lblPtrGrabberSkip
mov dword ptr [eax+00000474],ebx
lblPtrGrabberSkip:
pop ebx
ret
pGarrett:
dd 0

aobPtrGrabber+a:
aobPtrGrabber_r:
jmp lblPtrGrabber

aobItemReader+E:
aobItemReader_r:
jmp lblItemReader
lblItemReaderRet:

aobArrowReader+21:
aobArrowReader_r:
jmp lblArrowReader
lblArrowReaderRet:

[DISABLE]
aobArrowReader_r:
db 8B 44 8A 04 5E

unregistersymbol(aobArrowReader_r)

unregistersymbol(bEnableMinArrowCount)
unregistersymbol(iMinArrowCount)

aobItemReader_r:
db 8B 44 8A 04 5E

unregistersymbol(aobItemReader_r)

unregistersymbol(bEnableMinItemCount)
unregistersymbol(iMinItemCount)

aobPtrGrabber_r:
db 8B 40 08 C3 CC

unregistersymbol(aobPtrGrabber_r)

unregistersymbol(bEnableMinGold)
unregistersymbol(iMinGold)

dealloc(newmem)"""

