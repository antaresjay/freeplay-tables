[[cheat]]
id = "garrett-detection"
name = "Garrett   [Detection]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(detection,T3Main.EXE,D9 9E 4C 02 00 00 8B)
alloc(newmem,$100)
label(return)
registersymbol(detection)
newmem:
  fstp dword ptr [esi+24C]
  mov [esi+24C],(float)-1
  jmp return
detection:
  jmp newmem
  nop
return:
[DISABLE]
dealloc(newmem)
unregistersymbol(detection)
detection:
  db D9 9E 4C 02 00 00"""

