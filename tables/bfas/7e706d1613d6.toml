[[cheat]]
id = "world-manager-ctrl-numpad-1-will-populate-when-timer-starts"
name = "World Manager (Ctrl + Numpad 1) {Will populate when timer starts}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : BFAS.exe
// Author            : ndck76
// Executable Version: 2022.3.24.20146
// Game Version      : v1.05
// Script Date       : 2024-07-21


[ENABLE]

aobscanregion(operationtime,WorldManager:DisplayerTime,WorldManager:DisplayerTime+200,F30F1086xxxx0000F3xxxxxxF2xxxxxxxx48xxxxxxxx9049BBxxxxxxxxxxxx000041xxxxF3xxxxxxF2xxxxxxxxF2xxxxxxF2xxxxxxF3xxxxxxxxxxxxxxE9xxxxxxxx) //WorldManager:DisplayerTime+14f
alloc(newmem,$1000,operationtime)
alloc(data2,8)
alloc(operationtimebkp,8)
registersymbol(data2)
registersymbol(operationtime)
registersymbol(operationtimebkp)
label(code)
label(return)

operationtimebkp:
  readmem(operationtime,8)

newmem:
  mov [data2],rsi

code:
  readmem(operationtime,8)
  jmp return

operationtime:
  jmp newmem
  nop 3
return:

[DISABLE]

operationtime:
  readmem(operationtimebkp,8)

unregistersymbol(*)
dealloc(*)"""

