[[cheat]]
id = "enable-cheats"
name = "Enable cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

aobscanmodule(healthcd,OUTRIDERS-Win64-Shipping.exe,48 8B 81 70 0A 00 00 48 85 C0 74 06 F3 0F 10 40 5C) // should be unique
alloc(newmem,$1000,healthcd)

label(armorcd)
label(aicode)
label(code)
label(return)

label(playerPtr)
registersymbol(playerPtr)

label(healthFlag)
registersymbol(healthFlag)

label(armorFlag)
registersymbol(armorFlag)

label(easykillsFlag)
registersymbol(easykillsFlag)

newmem:
  mov rax, [rcx+00000A70]
  test rax, rax
  je code

  cmp byte [rax+130], 1
  jne aicode

  mov [playerPtr], rax
  cmp dword ptr [healthFlag], 1
  jne armorcd

  fld [rax+60] // Max Health
  fstp [rax+5C] // Health

armorcd:
  cmp dword ptr [armorFlag], 1
  jne code

  mov [rax+70], (float)999.0
  jmp code

aicode:
  cmp dword ptr [easykillsFlag], 1
  jne code

  cmp [rax+5C], (float)1.0
  jle code

  mov [rax+5C], (float)1.0

code:
  mov rax, [rcx+00000A70]
  jmp return

playerPtr:
dq 0

healthFlag:
dd 0

armorFlag:
dd 0

easykillsFlag:
dd 0

healthcd:
  jmp newmem
  nop
  nop
return:
registersymbol(healthcd)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
healthcd:
  db 48 8B 81 70 0A 00 00

unregistersymbol(healthcd)
unregistersymbol(playerPtr)
unregistersymbol(healthFlag)
unregistersymbol(armorFlag)
unregistersymbol(easykillsFlag)
dealloc(newmem)"""

