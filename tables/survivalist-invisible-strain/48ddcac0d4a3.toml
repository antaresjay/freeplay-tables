[[cheat]]
id = "enable-player-modifiers"
name = "Enable Player Modifiers"
category = "player"
description = ""
hint = ""
type = "script"
source = """
define(address,Hud:get_LocalControlledCharacterOrBuildingTheyAreIn+f)
define(bytes,48 85 C0 74 29)
//Send@Sintrix|FearlessRevolution
[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Hud:get_LocalControlledCharacterOrBuildingTheyAreIn+f)
registersymbol(pHunger pToilet pFatigue pBlood pAdrenaline pSleep pTemp pAim pEscape pGod pInfection pDrunk pWater)
label(code return pHunger pToilet pFatigue pBlood pAdrenaline pSleep pTemp pAim pEscape pGod pInfection pDrunk pWater)

newmem:
cmp [pHunger],1
jne @@2
mov [rax+76C],(float)0 //Hunger
jmp @@2

@@2:
cmp [pToilet],1
jne @@3
mov [rax+774],(float)0 //Toilet
jmp @@3

@@3:
cmp [pFatigue],1
jne @@4
mov [rax+760],(float)0 //Fatigue
jmp @@4

@@4:
cmp [pBlood],1
jne @@5
mov [rax+768],(float)0 //BloodLoss
jmp @@5

@@5:
cmp [pAdrenaline],1
jne @@6
mov [rax+764],(float)0 //Adrenaline
jmp @@6

@@6:
cmp [pSleep],1
jne @@7
mov [rax+778],(float)0 //SleepDeprivation
jmp @@7

@@7:
cmp [pTemp],1
jne @@8
mov [rax+77C],(float)37 //BodyTemperatureInCelsius
jmp @@8

@@8:
cmp [pAim],1
jne @@9
mov [rax+798],(float)100 //AimingAccuracy
jmp @@9
//Send@Sintrix|FearlessRevolution
@@9:
cmp [pEscape],1
jne @@10
mov [rax+79C],(float)100 //ZombieEscapePower
jmp @@10

@@10:
cmp [pGod],1
jne @@11
mov [rax+750],1 //God
jmp @@11

@@11:
cmp [pInfection],1
jne @@12
mov [rax+794],(float)0 //InfectionProgress
jmp @@12

@@12:
cmp [pDrunk],1
jne @@13
mov [rax+784],(float)0 //BloodAlcoholConcentration
jmp @@13

@@13:
cmp [pWater],1
jne code
mov [rax+770],(float)0 //Thirst

code:
  test rax,rax
  je Hud:get_LocalControlledCharacterOrBuildingTheyAreIn+3d
  jmp return

pHunger:
dd 0

pWater:
dd 0

pFatigue:
dd 0

pBlood:
dd 0

pSleep:
dd 0
//Send@Sintrix|FearlessRevolution
pThirst:
dd 0

pToilet:
dd 0

pTemp:
dd 0

pAim:
dd 0

pEscape:
dd 0

pAdrenaline:
dd 0

pGod:
dd 0

pInfection:
dd 0

pDrunk:
dd 0
//Send@Sintrix|FearlessRevolution
address:
  jmp newmem
return:

[DISABLE]

address:
  db bytes
//Send@Sintrix|FearlessRevolution
unregistersymbol(*)
dealloc(*)"""

