id = "one-hit-kill"
name = "One Hit Kill"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//Send@Sintrix|FearlessRevolution
aobscanregion(EnemyHealth,Encounter:Hit+64e,Encounter:Hit+731,F3 41 0F 11 AE 60 01 00 00)
alloc(newmem,$1000,EnemyHealth)
//Send@Sintrix|FearlessRevolution
label(code)
label(return)

newmem:

code:
  xorps xmm5,xmm5
  movss [r14+00000160],xmm5
  jmp return
//Send@Sintrix|FearlessRevolution
EnemyHealth:
  jmp newmem
  nop 4
return:
registersymbol(EnemyHealth)

aobscanregion(EnemyHealth2,Encounter:Hit+857,Encounter:Hit+90d,F3 0F 11 AB 5C 01 00 00)
alloc(newmem2,$1000,EnemyHealth2)

label(code2)
label(return2)

newmem2:

code2:
  xorps xmm5,xmm5
  movss [rbx+0000015C],xmm5
  jmp return2
//Send@Sintrix|FearlessRevolution
EnemyHealth2:
  jmp newmem2
  nop 3
return2:
registersymbol(EnemyHealth2)

[DISABLE]
//Send@Sintrix|FearlessRevolution
EnemyHealth:
  db F3 41 0F 11 AE 60 01 00 00
//Send@Sintrix|FearlessRevolution

EnemyHealth2:
  db F3 0F 11 AB 5C 01 00 00

