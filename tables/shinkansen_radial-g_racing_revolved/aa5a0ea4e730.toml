[[cheat]]
id = "vehicledynamics-base-address-scan-initialization-activate-this-first"
name = "VehicleDynamics Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(VehicleDynamics_basepointer)
registersymbol(VehicleDynamics_update_enable)
registersymbol(VehicleDynamics_set_enable)
registersymbol(VehicleDynamics_shieldset_enable)
registersymbol(VehicleDynamics_boostset_enable)
registersymbol(VehicleDynamics_aiset_enable)

alloc(VehicleDynamics_basepointer, 4)
alloc(VehicleDynamics_update_enable, 4)
alloc(VehicleDynamics_set_enable, 4)
alloc(VehicleDynamics_shieldset_enable, 4)
alloc(VehicleDynamics_boostset_enable, 4)
alloc(VehicleDynamics_aiset_enable, 4)


[DISABLE]
unregistersymbol(VehicleDynamics_basepointer)
unregistersymbol(VehicleDynamics_update_enable)
unregistersymbol(VehicleDynamics_set_enable)
unregistersymbol(VehicleDynamics_shieldset_enable)
unregistersymbol(VehicleDynamics_boostset_enable)
unregistersymbol(VehicleDynamics_aiset_enable)

dealloc(VehicleDynamics_basepointer)
dealloc(VehicleDynamics_update_enable)
dealloc(VehicleDynamics_set_enable)
dealloc(VehicleDynamics_shieldset_enable)
dealloc(VehicleDynamics_boostset_enable)
dealloc(VehicleDynamics_aiset_enable)"""

[[cheat]]
id = "vehicledynamics-base-address-scan-to-activate-play-level-to-update-play-level"
name = "VehicleDynamics Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(VehicleDynamics_savedAOB)
label(VehicleDynamics_returnhere)
label(VehicleDynamics_originalcode)
label(VehicleDynamics_exit)

label(VehicleDynamics_update_exit)
label(VehicleDynamics_set_exit)
label(VehicleDynamics_shieldset_exit)
label(VehicleDynamics_boostset_exit)
label(VehicleDynamics_aiset_entry)
label(VehicleDynamics_aiset_exit)

registersymbol(VehicleDynamics_savedAOB)

//274736DB - 83 EC 08              - sub esp,08
//274736DE - 8B 45 08              - mov eax,[ebp+08]
// RGGamemodeBase:Update+9
//274736E1 - 8B 80 AC000000        - mov eax,[eax+000000AC]
//274736E7 - 85 C0                 - test eax,eax
//274736E9 - 74 10                 - je 274736FB
//274736EB - 83 EC 0C              - sub esp,0C
//274736EE - FF 75 08              - push [ebp+08]
//274736F1 - E8 22000000           - call 27473718 : [aticfx32.dll+E5868]
aobscan(VehicleDynamics_searchedAOB, 8B 80 AC 00 00 00 85 C0 74 10 83 EC 0C)

alloc(VehicleDynamics_newmem, 2048, VehicleDynamics_searchedAOB)


VehicleDynamics_newmem:
cmp dword ptr [eax+c8], #1
je VehicleDynamics_aiset_entry

cmp dword ptr [VehicleDynamics_update_enable], #0
je VehicleDynamics_update_exit
mov [VehicleDynamics_basepointer], eax
VehicleDynamics_update_exit:

cmp dword ptr [VehicleDynamics_set_enable], #0
je VehicleDynamics_set_exit
VehicleDynamics_set_exit:

cmp dword ptr [VehicleDynamics_shieldset_enable], #0
je VehicleDynamics_shieldset_exit
mov [eax+18c], (float)1
VehicleDynamics_shieldset_exit:

cmp dword ptr [VehicleDynamics_boostset_enable], #0
je VehicleDynamics_boostset_exit
mov [eax+1b4], (float)5
VehicleDynamics_boostset_exit:

jmp VehicleDynamics_aiset_exit

VehicleDynamics_aiset_entry:
cmp dword ptr [VehicleDynamics_aiset_enable], #0
je VehicleDynamics_aiset_exit
mov [eax+90], (float)0
mov [eax+94], (float)0
mov [eax+144], (float)0
mov [eax+150], (float)0
mov [eax+158], (float)0
mov [eax+18c], (float)0
mov [eax+198], (float)0
mov [eax+19c], (float)0
mov [eax+1b4], (float)0
VehicleDynamics_aiset_exit:


VehicleDynamics_originalcode:
db 8B 80 AC 00 00 00
//mov eax,[eax+000000AC]


VehicleDynamics_exit:
jmp VehicleDynamics_returnhere


VehicleDynamics_searchedAOB:
VehicleDynamics_savedAOB:
jmp VehicleDynamics_newmem
nop
VehicleDynamics_returnhere:


[DISABLE]
VehicleDynamics_savedAOB:
db 8B 80 AC 00 00 00
//mov eax,[eax+000000AC]

unregistersymbol(VehicleDynamics_savedAOB)

dealloc(VehicleDynamics_newmem)"""

