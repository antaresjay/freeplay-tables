[[cheat]]
id = "player-data"
name = "Player Data"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(PlayerData,GameAssembly.dll,4Cxxxx48xxxxxx44xxxxxxxxxxxxxxxx44xxxxxxxxxxxxxxxx49xxxxxxxxxxxx)
alloc(newmemPlayerData,$100,PlayerData)
alloc(Player,8,PlayerData)
alloc(PlayerData_savedBytes,7,PlayerData)
label(codePlayerData returnPlayerData)

PlayerData_savedBytes:
readmem(PlayerData,7)

newmemPlayerData:
mov [Player],rdx

codePlayerData:
mov r8,[rdx]
lea rcx,[rbp+00]
jmp returnPlayerData

PlayerData:
jmp newmemPlayerData
nop 2
returnPlayerData:
registersymbol(PlayerData Player PlayerData_savedBytes)

[DISABLE]

PlayerData:
readmem(PlayerData_savedBytes,7)
unregistersymbol(PlayerData Player PlayerData_savedBytes)
dealloc(newmemPlayerData Player PlayerData_savedBytes)"""
