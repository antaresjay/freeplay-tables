EnemyBullet:Update+f: 48 89 7D F8           - mov [rbp-08],rdi
EnemyBullet:Update+13: 48 8B F1              - mov rsi,rcx
EnemyBullet:Update+16: 48 8B 46 30           - mov rax,[rsi+30]
