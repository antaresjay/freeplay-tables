{ Game   : I Am Sakuya 2 URP.exe
  Version: 
  Date   : 2025-09-27
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,EnemyBullet:Update)
define(bytes,55 48 8B EC 48 81 EC 00 01 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,EnemyBullet:Update)

label(code)
label(return)

newmem:
mov [enemybullet_sakuyacontroller_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,00000100
  jmp return

enemybullet_sakuyacontroller_ptr:
dq 0

address:
  jmp newmem
  nop 6
return:
registersymbol(enemybullet_sakuyacontroller_ptr)

[DISABLE]

address:
  db bytes
  // push rbp
  // mov rbp,rsp
  // sub rsp,00000100

