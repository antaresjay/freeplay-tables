[[cheat]]
id = "full-health-for-units-xp-bonus"
name = "Full health for units + XP Bonus"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(health,Nomads-Win64-Shipping.exe,F3 0F 58 83 EC 03 00 00) // should be unique
alloc(newmem,$1000,health)

label(code)
label(return)

newmem:
// rbx + 3ec = XP of unit
// rbx + 3f4 = current HP of unit
// rbx + 45c = max HP
  push eax
  mov eax,[rbx+000003EC]
  cmp eax,0
  je @f
  mov eax,(float)999999
  mov [rbx+3ec],eax // set XP
  mov eax,[rbx+45c]
  mov [rbx+3f4],eax
@@:
  pop eax
code:
  addss xmm0,[rbx+000003EC] // XP
  jmp return

health:
  jmp newmem
  nop 3
return:
registersymbol(health)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
health:
  db F3 0F 58 83 EC 03 00 00

unregistersymbol(health)
dealloc(newmem)

