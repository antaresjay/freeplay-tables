[[cheat]]
id = "inf-double-jump"
name = "inf. double jump"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanregion(canDoubleJumpChkAOB,PlatformerPro:AirMovement_Variable:WantsJump,PlatformerPro:AirMovement_Variable:WantsJump+ff,0F B6 ** ** 85 C0 0F 84 ** ** ** ** 0F B6 ** ** 85 C0 0F 84)
registersymbol(canDoubleJumpChkAOB)

canDoubleJumpChkAOB+11: //PlatformerPro:AirMovement_Variable:WantsJump+ac:
db FF

///*********************************///
aobscanregion(jumpCountChkAOB,PlatformerPro:AirMovement_Variable:WantsJump,PlatformerPro:AirMovement_Variable:WantsJump+ff,8B 47 ** 3D 02 00 00 00 0F 8D)
registersymbol(jumpCountChkAOB)

alloc(originalcode_jumpCountChkAOB,10)
registersymbol(originalcode_jumpCountChkAOB)

originalcode_jumpCountChkAOB:
readmem(jumpCountChkAOB+8,6)

///

jumpCountChkAOB+8: //PlatformerPro:AirMovement_Variable:WantsJump+bb:
db 90 90 90 90 90 90

///*********************************///





[DISABLE]
//code from here till the end of the code will be used to disable the cheat
canDoubleJumpChkAOB+11: //PlatformerPro:AirMovement_Variable:WantsJump+ac:
db C0
//Alt: eax,eax

///*********************************///
jumpCountChkAOB+8: //PlatformerPro:AirMovement_Variable:WantsJump+bb:
readmem(originalcode_jumpCountChkAOB,6)
//db 0F 8D 33 00 00 00
//Alt: jnl PlatformerPro:AirMovement_Variable:WantsJump+f4
dealloc(originalcode_jumpCountChkAOB)
unregistersymbol(originalcode_jumpCountChkAOB)

///*********************************///"""

