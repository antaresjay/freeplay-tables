[[cheat]]
id = "masterscript-base-address-scan-initialization-activate-this-first-to-activate-play-level"
name = "MasterScript Base Address Scan Initialization (Activate This First, To Activate: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(MasterScript_basepointer)
registersymbol(MasterScript_PLAYER_DATA_static_basepointer)
registersymbol(MasterScript_update_enable)
registersymbol(MasterScript_hpset_enable)
registersymbol(MasterScript_escapeset_enable)
registersymbol(MasterScript_damageset_enable)
registersymbol(MasterScript_coinset_enable)
registersymbol(MasterScript_ammoset_enable)
registersymbol(MasterScript_cooldownset_enable)

//0A7B4264 - 8B 7D 08              - mov edi,[ebp+08]
//0A7B4267 - C7 45 E0 00000000     - mov [ebp-20],00000000
// MasterScript:Update+16
//0A7B426E - C7 45 E4 00000000     - mov [ebp-1C],00000000
//0A7B4275 - 0FB6 05 2D0F190B      - movzx eax,byte ptr [0B190F2D] : [00]
//0A7B427C - 85 C0                 - test eax,eax
//0A7B427E - 0F85 2C1A0000         - jne 0A7B5CB0
aobscan(MasterScript_initialization_searchedAOB, C7 45 E4 00 00 00 00 0F B6 05)

alloc(MasterScript_basepointer, 4, MasterScript_initialization_searchedAOB)
alloc(MasterScript_PLAYER_DATA_static_basepointer, 4, MasterScript_initialization_searchedAOB)
alloc(MasterScript_update_enable, 4, MasterScript_initialization_searchedAOB)
alloc(MasterScript_hpset_enable, 4, MasterScript_initialization_searchedAOB)
alloc(MasterScript_escapeset_enable, 4, MasterScript_initialization_searchedAOB)
alloc(MasterScript_damageset_enable, 4, MasterScript_initialization_searchedAOB)
alloc(MasterScript_coinset_enable, 4, MasterScript_initialization_searchedAOB)
alloc(MasterScript_ammoset_enable, 4, MasterScript_initialization_searchedAOB)
alloc(MasterScript_cooldownset_enable, 4, MasterScript_initialization_searchedAOB)


[DISABLE]
unregistersymbol(MasterScript_basepointer)
unregistersymbol(MasterScript_PLAYER_DATA_static_basepointer)
unregistersymbol(MasterScript_update_enable)
unregistersymbol(MasterScript_hpset_enable)
unregistersymbol(MasterScript_escapeset_enable)
unregistersymbol(MasterScript_damageset_enable)
unregistersymbol(MasterScript_coinset_enable)
unregistersymbol(MasterScript_ammoset_enable)
unregistersymbol(MasterScript_cooldownset_enable)

dealloc(MasterScript_basepointer)
dealloc(MasterScript_PLAYER_DATA_static_basepointer)
dealloc(MasterScript_update_enable)
dealloc(MasterScript_hpset_enable)
dealloc(MasterScript_escapeset_enable)
dealloc(MasterScript_damageset_enable)
dealloc(MasterScript_coinset_enable)
dealloc(MasterScript_ammoset_enable)
dealloc(MasterScript_cooldownset_enable)"""

[[cheat]]
id = "masterscript-base-address-scan-to-activate-play-level-to-update-play-level"
name = "MasterScript Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(MasterScript_savedAOB)
label(MasterScript_returnhere)
label(MasterScript_originalcode)
label(MasterScript_exit)

label(MasterScript_update_exit)
label(MasterScript_hpset_exit)
label(MasterScript_escapeset_exit)
label(MasterScript_damageset_exit)
label(MasterScript_coinset_exit)
label(MasterScript_ammoset_exit)
label(MasterScript_cooldownset_exit)

registersymbol(MasterScript_originalcode)
registersymbol(MasterScript_savedAOB)

//0A7B4264 - 8B 7D 08              - mov edi,[ebp+08]
//0A7B4267 - C7 45 E0 00000000     - mov [ebp-20],00000000
// MasterScript:Update+16
//0A7B426E - C7 45 E4 00000000     - mov [ebp-1C],00000000
//0A7B4275 - 0FB6 05 2D0F190B      - movzx eax,byte ptr [0B190F2D] : [00]
//0A7B427C - 85 C0                 - test eax,eax
//0A7B427E - 0F85 2C1A0000         - jne 0A7B5CB0
aobscan(MasterScript_searchedAOB, C7 45 E4 00 00 00 00 0F B6 05)

alloc(MasterScript_newmem, 2048, MasterScript_searchedAOB)
alloc(MasterScript_temp1, 4, MasterScript_searchedAOB)
alloc(MasterScript_temp2, 4, MasterScript_searchedAOB)
alloc(MasterScript_temp3, 4, MasterScript_searchedAOB)
alloc(MasterScript_temp4, 4, MasterScript_searchedAOB)
alloc(MasterScript_temp5, 4, MasterScript_searchedAOB)


MasterScript_newmem:
mov [MasterScript_temp1], eax
mov [MasterScript_temp2], ebx
mov [MasterScript_temp3], ecx
mov [MasterScript_temp4], edx

mov eax, [MasterScript_savedAOB+a]
sub eax 15
test eax, eax
je MasterScript_cooldownset_exit

cmp dword ptr [MasterScript_update_enable], #0
je MasterScript_update_exit
mov [MasterScript_basepointer], edi
mov [MasterScript_PLAYER_DATA_static_basepointer], eax
MasterScript_update_exit:

cmp dword ptr [MasterScript_hpset_enable], #0
je MasterScript_hpset_exit
mov ebx, [eax+2c]
mov [eax+28], ebx
mov ebx, [eax+34]
mov [eax+30], ebx
MasterScript_hpset_exit:

cmp dword ptr [MasterScript_escapeset_enable], #0
je MasterScript_escapeset_exit
mov [MasterScript_temp5], (float)0.1
fld [MasterScript_temp5]
fld [edi+58]
fcomi ST(0), ST(1)
fstp ST(0)
fstp ST(0)
jb MasterScript_escapeset_exit
mov [edi+58], (float)0.05
MasterScript_escapeset_exit:

cmp dword ptr [MasterScript_damageset_enable], #0
je MasterScript_damageset_exit
mov [eax+38], #9999
mov [eax+3c], #9999
MasterScript_damageset_exit:

cmp dword ptr [MasterScript_coinset_enable], #0
je MasterScript_coinset_exit
mov [eax+24], #9999999
MasterScript_coinset_exit:

cmp dword ptr [MasterScript_ammoset_enable], #0
je MasterScript_ammoset_exit
mov ebx, [eax+4c]
mov [eax+48], ebx
mov ebx, [eax+54]
mov [eax+50], ebx
mov ebx, [eax+5c]
mov [eax+58], ebx
mov ebx, [eax+64]
mov [eax+60], ebx
MasterScript_ammoset_exit:

cmp dword ptr [MasterScript_cooldownset_enable], #0
je MasterScript_cooldownset_exit
mov ebx, [eax+74]
test ebx, ebx
je MasterScript_cooldownset_exit
mov [ebx+10], (float)0
mov [ebx+14], (float)0
mov [ebx+18], (float)0
mov [ebx+1c], (float)0
mov [ebx+20], (float)0
mov [ebx+24], (float)0
mov [ebx+28], (float)0
mov [ebx+2c], (float)0
MasterScript_cooldownset_exit:

mov eax, [MasterScript_temp1]
mov ebx, [MasterScript_temp2]
mov ecx, [MasterScript_temp3]
mov edx, [MasterScript_temp4]


MasterScript_originalcode:
readmem(MasterScript_searchedAOB, 7)


MasterScript_exit:
jmp MasterScript_returnhere


MasterScript_searchedAOB:
MasterScript_savedAOB:
jmp MasterScript_newmem
nop
nop
MasterScript_returnhere:


[DISABLE]
MasterScript_savedAOB:
readmem(MasterScript_originalcode, 7)

unregistersymbol(MasterScript_originalcode)
unregistersymbol(MasterScript_savedAOB)

dealloc(MasterScript_newmem)
dealloc(MasterScript_temp1)
dealloc(MasterScript_temp2)
dealloc(MasterScript_temp3)
dealloc(MasterScript_temp4)
dealloc(MasterScript_temp5)"""

