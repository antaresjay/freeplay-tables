id = "playercontroller-base-address-scan-initialization-activate-this-first-to-activate-play-level"
name = "PlayerController Base Address Scan Initialization (Activate This First, To Activate: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlayerController_basepointer)
registersymbol(PlayerController_update_enable)
registersymbol(PlayerController_superset_enable)
registersymbol(PlayerController_mobilityset_enable)

//0A7B7D7D - 83 EC 30              - sub esp,30
//0A7B7D80 - 8B 7D 08              - mov edi,[ebp+08]
// Platformer:PlayerController:Update+b
//0A7B7D83 - 8B 87 A4000000        - mov eax,[edi+000000A4]
//0A7B7D89 - 40                    - inc eax
//0A7B7D8A - 89 87 A4000000        - mov [edi+000000A4],eax
//0A7B7D90 - D9 87 BC000000        - fld dword ptr [edi+000000BC]
//0A7B7D96 - D9EE                  - fldz
aobscan(PlayerController_initialization_searchedAOB, 8B 87 A4 00 00 00 40 89 87 A4 00 00 00)

alloc(PlayerController_basepointer, 4, PlayerController_initialization_searchedAOB)
alloc(PlayerController_update_enable, 4, PlayerController_initialization_searchedAOB)
alloc(PlayerController_superset_enable, 4, PlayerController_initialization_searchedAOB)
alloc(PlayerController_mobilityset_enable, 4, PlayerController_initialization_searchedAOB)


[DISABLE]
unregistersymbol(PlayerController_basepointer)
unregistersymbol(PlayerController_update_enable)
unregistersymbol(PlayerController_superset_enable)
unregistersymbol(PlayerController_mobilityset_enable)

dealloc(PlayerController_basepointer)
dealloc(PlayerController_update_enable)
dealloc(PlayerController_superset_enable)
dealloc(PlayerController_mobilityset_enable)"""

[[cheat]]
id = "playercontroller-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerController Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerController_savedAOB)
label(PlayerController_returnhere)
label(PlayerController_originalcode)
label(PlayerController_exit)

label(PlayerController_update_exit)
label(PlayerController_superset_exit)
label(PlayerController_mobilityset_exit)

registersymbol(PlayerController_originalcode)
registersymbol(PlayerController_savedAOB)

//0A7B7D7D - 83 EC 30              - sub esp,30
//0A7B7D80 - 8B 7D 08              - mov edi,[ebp+08]
// Platformer:PlayerController:Update+b
//0A7B7D83 - 8B 87 A4000000        - mov eax,[edi+000000A4]
//0A7B7D89 - 40                    - inc eax
//0A7B7D8A - 89 87 A4000000        - mov [edi+000000A4],eax
//0A7B7D90 - D9 87 BC000000        - fld dword ptr [edi+000000BC]
//0A7B7D96 - D9EE                  - fldz
aobscan(PlayerController_searchedAOB, 8B 87 A4 00 00 00 40 89 87 A4 00 00 00)

alloc(PlayerController_newmem, 2048, PlayerController_searchedAOB)
alloc(PlayerController_temp1, 4, PlayerController_searchedAOB)
alloc(PlayerController_temp2, 4, PlayerController_searchedAOB)
alloc(PlayerController_temp3, 4, PlayerController_searchedAOB)
alloc(PlayerController_temp4, 4, PlayerController_searchedAOB)
alloc(PlayerController_temp5, 4, PlayerController_searchedAOB)


PlayerController_newmem:
mov [PlayerController_temp1], eax
mov [PlayerController_temp2], ebx
mov [PlayerController_temp3], ecx
mov [PlayerController_temp4], edx

cmp dword ptr [PlayerController_update_enable], #0
je PlayerController_update_exit
mov [PlayerController_basepointer], edi
PlayerController_update_exit:

cmp dword ptr [PlayerController_superset_enable], #0
je PlayerController_superset_exit
fld [edi+98]
fstp [edi+9c]
PlayerController_superset_exit:

cmp dword ptr [PlayerController_mobilityset_enable], #0
je PlayerController_mobilityset_exit
mov [edi+50], (float)2.2
mov byte ptr [edi+58], #1
mov [edi+e0], (float)0
PlayerController_mobilityset_exit:

mov eax, [PlayerController_temp1]
mov ebx, [PlayerController_temp2]
mov ecx, [PlayerController_temp3]
mov edx, [PlayerController_temp4]


PlayerController_originalcode:
readmem(PlayerController_searchedAOB, 6)


PlayerController_exit:
jmp PlayerController_returnhere


PlayerController_searchedAOB:
PlayerController_savedAOB:
jmp PlayerController_newmem
nop
PlayerController_returnhere:


[DISABLE]
PlayerController_savedAOB:
readmem(PlayerController_originalcode, 6)

unregistersymbol(PlayerController_originalcode)
unregistersymbol(PlayerController_savedAOB)

dealloc(PlayerController_newmem)
dealloc(PlayerController_temp1)
dealloc(PlayerController_temp2)
dealloc(PlayerController_temp3)
dealloc(PlayerController_temp4)
dealloc(PlayerController_temp5)"""

