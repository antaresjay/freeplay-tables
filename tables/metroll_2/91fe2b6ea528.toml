[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(_AOB_Address,D1 00 * * D2 00 D4 6A)

label(AOB_Address)
registerSymbol(AOB_Address)
label(Base_Address_1)
registerSymbol(Base_Address_1)
label(Base_Address_2)
registerSymbol(Base_Address_2)

_AOB_Address:
AOB_Address:

_AOB_Address+32:
Base_Address_1:

_AOB_Address+1E:
Base_Address_2:


[DISABLE]
unregistersymbol(AOB_Address)
unregistersymbol(Base_Address_1)
unregistersymbol(Base_Address_2)"""

