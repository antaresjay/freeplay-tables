[[cheat]]
id = "disable-actkdetectorbase"
name = "Disable ACTkDetectorBase"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@FearlessRevolution|Sintrix
[ENABLE]

aobscanmodule(actkdetectorbase,GameAssembly.dll,F6 80 35 01 00 00 01 75 08 48 8B C8 E8 68 50 F1)
alloc(newmem,$1000,actkdetectorbase)

label(code)
label(return)

newmem:
mov [rax+20],0 //keepAlive
mov [rax+24],0 //instancesInScene
mov [rax+28],0 //autoStart
mov [rax+29],0 //autoDispose
mov [rax+38],0 //isCheatDetected
mov [rax+4A],0 //isRunning
mov [rax+49],0 //started
mov [rax+135],0

code:
  test byte ptr [rax+00000135],01
  jmp return

actkdetectorbase:
  jmp newmem
  nop 2
return:
registersymbol(actkdetectorbase)

[DISABLE]

actkdetectorbase:
  db F6 80 35 01 00 00 01

unregistersymbol(*)
dealloc(*)"""

