[[cheat]]
id = "infinite-money"
name = "Infinite Money"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
define(Money,LEGOHobbit.exe+88F614)

[ENABLE]

assert(Money,89 4D 00 89 45 04 5E 5D C3)

//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem:

mov ecx,#10000000000

originalcode:
mov [ebp+00],ecx
mov [ebp+04],eax

exit:
jmp returnhere

Money:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
Money:
mov [ebp+00],ecx
mov [ebp+04],eax
//Alt: db 89 4D 00 89 45 04"""

[[cheat]]
id = "stop-timer"
name = "Stop Timer"
category = "game"
description = ""
hint = ""
type = "script"
source = """
define(Timer,LEGOHobbit.exe+B15DD1)
define(Timer2,LEGOHobbit.exe+B429B8)

[ENABLE]

assert(Timer,D9 96 C8 00 00 00)
assert(Timer2,D9 57 60 75 2A)

alloc(newmem,2048)
label(t1)
label(t2)
label(t1ret)
label(t2ret)
label(t1ex)
label(t2ex)

newmem:

t1:
//fst dword ptr [esi+000000C8]
t1ex:
jmp t1ret

t2:
//fst dword ptr [edi+60]
t2ex:
jmp t2ret

Timer:
jmp t1
nop
t1ret:

Timer2:
jmp t2
t2ret:

[DISABLE]
dealloc(newmem)
Timer:
fst dword ptr [esi+000000C8]
//Alt: db D9 96 C8 00 00 00
Timer2:
fst dword ptr [edi+60]
jne LEGOHobbit.exe+B429E7
//Alt: db D9 57 60 75 2A"""

