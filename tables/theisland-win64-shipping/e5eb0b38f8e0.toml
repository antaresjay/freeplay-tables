type = "script"
source = """
[ENABLE]

aobscanmodule(pBase,Theisland-Win64-Shipping.exe,48 8B 06 48 8D 95 C0 00 00 00) // should be unique
alloc(newmem,$1000,pBase)
alloc(base,8)

label(code)
label(return)

base:
dq 0

newmem:

code:
  mov [base],rsi
  mov rax,[rsi]
  lea rdx,[rbp+000000C0]
  jmp return

pBase:
  jmp newmem
  nop 5
return:
registersymbol(pBase base)

[DISABLE]

pBase:
  db 48 8B 06 48 8D 95 C0 00 00 00

unregistersymbol(*)
dealloc(*)"""
