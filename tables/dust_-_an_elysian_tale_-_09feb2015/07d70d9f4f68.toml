[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(originalcode)
label(exit)

label(health_saved)
registersymbol(health_saved)
aobscan(searchedAOB,8B 85 50 FF FF FF 83 B8 F8 00 00 00 00 0F 8F 8A)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here

originalcode:
mov eax,[ebp-000000B0]
mov dword ptr [eax+000000F4],#1000
mov dword ptr [eax+000000F8],#1000

exit:
jmp returnhere

searchedAOB:
health_saved:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
health_saved:
mov eax,[ebp-000000B0]
//Alt: db 8B 85 50 FF FF FF
unregistersymbol(health_saved)"""

