source = """
//Send
[ENABLE]

aobscanregion(energyflag,ThinkingStars.Character.EnergyEntity:doUpdate+4b,ThinkingStars.Character.EnergyEntity:doUpdate+8f,0F B6 46 40 85 C0 0F 84 E3)
alloc(newmem,$1000,energyflag)

label(code)
label(return)

newmem:
mov byte ptr [rsi+40],0

code:
  movzx eax,byte ptr [rsi+40]
  test eax,eax
  jmp return

energyflag:
  jmp newmem
  nop
return:
registersymbol(energyflag)

[DISABLE]

energyflag:
  db 0F B6 46 40 85 C0

unregistersymbol(*)
dealloc(*)

