[[cheat]]
id = "infinite-split-item-item-usage-option-1"
name = "Infinite Split Item/Item Usage (Option 1)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(InfiniteItemUsageAOB1,$process,FF C7 48 8B 4C 08 F8 48 89 4C 10 F8 3B 7E 0C) // should be unique
registersymbol(InfiniteItemUsageAOB1)
alloc(newmem,1024,InfiniteItemUsageAOB1)

///
aobscanmodule(InfiniteItemUsageAOB2,$process,48 8D 54 24 20 48 8B CE E8 32 FE FF FF 90 48 8D 4C 24 30) // should be unique
//aobscanmodule(InfiniteItemUsageAOB2,$process,48 8D 54 24 20 48 8B CE E8 22 FE FF FF 90 48 8D 4C 24 30) // should be unique
registersymbol(InfiniteItemUsageAOB2)
alloc(newmem2,1024,InfiniteItemUsageAOB2)

///
label(return)
label(InfiniteItemUsageAOB1Save)
registersymbol(InfiniteItemUsageAOB1Save)

///
label(return2)
label(InfiniteItemUsageAOB2Save)
registersymbol(InfiniteItemUsageAOB2Save)

///
newmem:
  mov [R10Save],r10
  mov [R11Save],r11
  movq r10,xmm2
  cmp r10d,FFFFFFFF
  je DisableThisTime
  cmp r10d,0
  jne ContinueCode
  movq r10,xmm0
  cmp r10d,0
  jne ContinueCode
DisableThisTime:
  mov qword ptr [iNumTimesExecuted],99
  jmp MyCleanUp1
ContinueCode:
  inc [iNumTimesExecuted]
  cmp [iNumTimesExecuted],1
  je SaveRCX
  cmp [iNumTimesExecuted],2
  jne MyCleanUp1
  xor r10,r10
  xor r11,r11
  mov r10d,[rax+rcx-04]
  add r10d,[iCurrentDecreaseNum]
  mov qword ptr [iCurrentDecreaseNum],0
  mov [rax+rcx-04],r10d
  jmp MyCleanUp1
SaveRCX:
  xor r10,r10
  mov r10d,[rax+rcx-04]
  mov [iCurrentDecreaseNum],r10d
  jmp MyCleanUp1

MyCleanUp1:
  mov r10,[R10Save]
  mov r11,[R11Save]
  jmp originalcode

originalcode:
InfiniteItemUsageAOB1Save:
  readmem(InfiniteItemUsageAOB1,15)
  jmp InfiniteItemUsageAOB1+0F

iNumTimesExecuted:
dq 0
iCurrentDecreaseNum:
dq 0
R10Save:
dq 0
R11Save:
dq 0

///
newmem2:
  mov [R10Save],r10
  mov r10,iNumTimesExecuted
  mov qword ptr [r10],0
  mov r10,[R10Save]
  jmp originalcode2
  
originalcode2:
InfiniteItemUsageAOB2Save:
  readmem(InfiniteItemUsageAOB2,5)
  jmp InfiniteItemUsageAOB2+05


///
InfiniteItemUsageAOB1:
  jmp newmem
  return:

///
InfiniteItemUsageAOB2:
  jmp newmem2
  return2:

[DISABLE]

InfiniteItemUsageAOB1:
  readmem(InfiniteItemUsageAOB1Save,15)

unregistersymbol(InfiniteItemUsageAOB1)
unregistersymbol(InfiniteItemUsageAOB1Save)

///
InfiniteItemUsageAOB2:
  readmem(InfiniteItemUsageAOB2Save,5)

unregistersymbol(InfiniteItemUsageAOB2)
unregistersymbol(InfiniteItemUsageAOB2Save)

///
dealloc(newmem)
dealloc(newmem2)"""

