bInfiniteSpellSlot:
dq 0
bInfiniteLuckPoint:
dq 0
bInfiniteWarlockSpellSlot:
dq 0
bInfiniteRagePoint:
dq 0
bInfiniteKiPoint:
dq 0
bInfiniteSorceryPoint:
dq 0
bInfiniteBardicInspirationD6:
dq 0
bInfiniteBladesongPoint:
dq 0
bInfiniteDivineInspiration:
dq 0
bInfiniteArcaneRecovery:
dq 0
bInfiniteSuperiorityDice:
dq 0
bInfiniteLayOnHands:
