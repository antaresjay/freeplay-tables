registersymbol(MovementModAOB)
alloc(newmem,8192,MovementModAOB)

///
{ [RBP+160] contains the character id used in the Ally List }
{ As of 12/11/2023 Patch 5, [RBP+140] contains the character id used inthe Ally List }

///
