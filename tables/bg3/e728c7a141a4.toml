bInfiniteArcaneArrow:
dq 0
bInfiniteNaturalRecovery:
dq 0
bInfiniteShortRest:
dq 0
bInfiniteInspiration:
dq 0
bInfiniteIllithidPowerPoints:
dq 0

///
MovementModAOB:
  jmp newmem
  return:
  
[DISABLE]

MovementModAOB:
  readmem(MovementModAOBSave,9)

///
unregistersymbol(MovementModAOB)
unregistersymbol(bInfiniteMovement)
unregistersymbol(bInfiniteAction)
unregistersymbol(bInfiniteBonusAction)
unregistersymbol(bInfiniteSpellSlot)
unregistersymbol(bInfiniteLuckPoint)
unregistersymbol(bInfiniteWarlockSpellSlot)
unregistersymbol(bInfiniteRagePoint)
unregistersymbol(bInfiniteKiPoint)
unregistersymbol(bInfiniteSorceryPoint)
