label(MovementModAOBSave)
registersymbol(MovementModAOBSave)

newmem:
  mov [RDXSave],rdx
  mov [RDISave],rdi
  mov [RSISave],rsi
  mov [R8Save],r8
  mov [R10Save],r10
  mov [R11Save],r11
  mov [R12Save],r12
  mov [R13Save],r13
  mov [R14Save],r14
  mov [R15Save],r15
  cmp dword ptr [rbx],D6B2369D
  jne SkipCheckAddingAlly
  // Setup Char ID we are using
  mov r14,GMAddressIDToAffect
  mov r13,GMCurrentHP
  // First Check If We Are Adding Ally Addresses
  mov r15,bAddDamageModMode
  cmp dword ptr [r15],1
  jne SkipCheckAddingAlly
  jmp CheckAddingAllyOne
CheckAddingAllyOne:
SetupAddAllyAddresses:
  // Save Char ID in form of 0200000????????
  mov r10,[rbp+140]
  xor rdx,rdx
  xor r15,r15
CheckAddAllyAddresses:
  cmp edx,#16
  jge OutOfAllySpace
  cmp [r14+rdx*8],r10
  je AlreadyInAllyList
  cmp [r14+rdx*8],r15
  je NotFoundInAllyList
  inc edx
  jmp CheckAddAllyAddresses
NotFoundInAllyList:
  mov [r14+rdx*8],r10
  mov [r13+rdx*8],r10
  mov r12,NumAddressesToAffect
  inc [r12]
  jmp SkipCheckAddingAlly
AlreadyInAllyList:
OutOfAllySpace:
SkipCheckAddingAlly:
  cmp [bInfiniteMovement],1
  jne SkipCheckInfiniteMovement
  cmp dword ptr [rbx],D6B2369D
  jne SkipCheckInfiniteMovement
  jmp CheckForAllyOrEnemy
SkipCheckInfiniteMovement:
  cmp [bInfiniteAction],1
  jne SkipCheckInfiniteAction
  { Action is 734CBCFB }
  cmp dword ptr [rbx],734CBCFB
  je CheckForAllyOrEnemy
SkipCheckInfiniteAction:
  cmp [bInfiniteBonusAction],1
  jne SkipCheckInfiniteBonusAction
  { Bonus Action is 420C8DF5 }
  cmp dword ptr [rbx],420C8DF5
  je CheckForAllyOrEnemy
SkipCheckInfiniteBonusAction:
  cmp [bInfiniteSpellSlot],1
  jne SkipCheckInfiniteSpellSlot
  { Spell Slot is D136C5D9 }
  cmp dword ptr [rbx],D136C5D9
  je CheckForAllyOrEnemy
SkipCheckInfiniteSpellSlot:
  cmp [bInfiniteLuckPoint],1
  jne SkipCheckInfiniteLuckPoint
  { Luck Point is 754141B8 }
  cmp dword ptr [rbx],754141B8
  je CheckForAllyOrEnemy
SkipCheckInfiniteLuckPoint:
  cmp [bInfiniteWarlockSpellSlot],1
  jne SkipCheckInfiniteWarlockSpellSlot
  { Warlock Spell Slot is E9127B70 }
  cmp dword ptr [rbx],E9127B70
  je CheckForAllyOrEnemy
SkipCheckInfiniteWarlockSpellSlot:
  cmp [bInfiniteRagePoint],1
  jne SkipCheckInfiniteRagePoint
  { Rage Point is 6740F9F4 }
  cmp dword ptr [rbx],6740F9F4
  je CheckForAllyOrEnemy
SkipCheckInfiniteRagePoint:
  cmp [bInfiniteKiPoint],1
  jne SkipCheckInfiniteKiPoint
  { Ki Point is 46D3D228 }
  cmp dword ptr [rbx],46D3D228
  je CheckForAllyOrEnemy
SkipCheckInfiniteKiPoint:
  cmp [bInfiniteSorceryPoint],1
  jne SkipCheckInfiniteSorceryPoint
  { Sorcery Point is 46886BA5 }
  cmp dword ptr [rbx],46886BA5
  je CheckForAllyOrEnemy
SkipCheckInfiniteSorceryPoint:
  cmp [bInfiniteBardicInspirationD6],1
  jne SkipCheckInfiniteBardicInspirationD6
  { Bardic Inspiration D6 is 46BBEB43 }
  cmp dword ptr [rbx],46BBEB43
  je CheckForAllyOrEnemy
SkipCheckInfiniteBardicInspirationD6:
  cmp [bInfiniteBladesongPoint],1
  jne SkipCheckInfiniteBladesongPoint
  { Bladesong Point is 3E3CA2C7 }
  cmp dword ptr [rbx],3E3CA2C7
  je CheckForAllyOrEnemy
SkipCheckInfiniteBladesongPoint:
  cmp [bInfiniteDivineInspiration],1
  jne SkipCheckInfiniteDivineInspiration
  { Divine Inspiration is 028304EF }
  cmp dword ptr [rbx],028304EF
  je CheckForAllyOrEnemy
SkipCheckInfiniteDivineInspiration:
  cmp [bInfiniteArcaneRecovery],1
  jne SkipCheckInfiniteArcaneRecovery
  { Arcane Recovery is 74737A08 }
  cmp dword ptr [rbx],74737A08
  je CheckForAllyOrEnemy
SkipCheckInfiniteArcaneRecovery:
  cmp [bInfiniteSuperiorityDice],1
  jne SkipCheckInfiniteSuperiorityDice
  { Superiority Dice is F82E9E53 }
  cmp dword ptr [rbx],F82E9E53
  je CheckForAllyOrEnemy
SkipCheckInfiniteSuperiorityDice:
  cmp [bInfiniteLayOnHands],1
  jne SkipCheckInfiniteLayOnHands
  { Lay On Hands is C2D059F8 }
  cmp dword ptr [rbx],C2D059F8
  je CheckForAllyOrEnemy
SkipCheckInfiniteLayOnHands:
  cmp [bInfiniteChannelOath],1
  jne SkipCheckInfiniteChannelOath
  { Channel Oath is C0503ECF }
  cmp dword ptr [rbx],C0503ECF
  je CheckForAllyOrEnemy
SkipCheckInfiniteChannelOath:
  cmp [bInfiniteStarMap],1
  jne SkipCheckInfiniteStarMap
  { Star Map is F86CA432 }
  cmp dword ptr [rbx],F86CA432
  je CheckForAllyOrEnemy
SkipCheckInfiniteStarMap:
  cmp [bInfiniteWildShape],1
  jne SkipCheckInfiniteWildShape
  { Wild Shape is 68542019 }
  cmp dword ptr [rbx],68542019
  je CheckForAllyOrEnemy
SkipCheckInfiniteWildShape:
  cmp [bInfiniteWarPriest],1
  jne SkipCheckInfiniteWarPriest
  { War Priest is 30CCA4C5 }
  cmp dword ptr [rbx],30CCA4C5
  je CheckForAllyOrEnemy
SkipCheckInfiniteWarPriest:
  cmp [bInfiniteArcaneArrow],1
  jne SkipCheckInfiniteArcaneArrow
  { Arcane Arrow is 2DE674BC }
  cmp dword ptr [rbx],2DE674BC
  je CheckForAllyOrEnemy
SkipCheckInfiniteArcaneArrow:
  cmp [bInfiniteNaturalRecovery],1
  jne SkipCheckInfiniteNaturalRecovery
  { Natural Recovery is D1ABB9DC }
  cmp dword ptr [rbx],D1ABB9DC
  je CheckForAllyOrEnemy
SkipCheckInfiniteNaturalRecovery:
  cmp [bInfiniteShortRest],1
  jne SkipCheckShortRest
  { Short Rest is A24CA5E2 }
  cmp dword ptr [rbx],A24CA5E2
  // Short Rest is for entire Party
  je PerformInfinite
SkipCheckShortRest:
  cmp [bInfiniteInspiration],1
  jne SkipCheckInspiration
  { Inspiration is A9C98304 }
  cmp dword ptr [rbx],A9C98304
  // Inspiration is for entire Party
  je PerformInfiniteInspiration
SkipCheckInspiration:
  cmp [bInfiniteIllithidPowerPoints],1
  jne MyCleanUp1
  { Illithid Power Points is 8B047F9C }
  cmp dword ptr [rbx],8B047F9C
  // Illithid Power Points is for entire Party
  je PerformInfiniteInspiration
  jmp MyCleanUp1
CheckForAllyOrEnemy:
// Now We Check If We Have Ally Address Being Changed
SetupAddAllyAddresses2:
  // Save Char ID in form of 0200000????????
  mov r10,[rbp+140]
  mov r14,GMAddressIDToAffect
  xor rdx,rdx
  xor r15,r15
CheckAddAllyAddresses2:
  cmp edx,#16
  jge EnemyFound
  cmp [r14+rdx*8],r10
  je AllyFound
  cmp [r14+rdx*8],r15
  je EnemyFound
  inc edx
  jmp CheckAddAllyAddresses2
AllyFound:
  jmp PerformInfinite
EnemyFound:
  jmp MyCleanUp1
PerformInfinite:
  mov rdx,[RDXSave]
  movsd xmm6,[rdx+20]
  jmp MyCleanUp1
PerformInfiniteInspiration:
  mov rdx,[RDXSave]
  comisd xmm6,[rdx+18]
  jae MyCleanUp1
  movsd xmm6,[rdx+18]
  comiss xmm6,[rdx+20]
  jbe MyCleanUp1
  movsd [rdx+20],xmm6
  jmp MyCleanUp1

MyCleanUp1:
  mov rdx,[RDXSave]
  mov rdi,[RDISave]
  mov rsi,[RSISave]
  mov r8,[R8Save]
  mov r10,[R10Save]
  mov r11,[R11Save]
  mov r12,[R12Save]
  mov r13,[R13Save]
  mov r14,[R14Save]
  mov r15,[R15Save]
  jmp originalcode  
  
originalcode:
MovementModAOBSave:
  readmem(MovementModAOB,9)
  jmp MovementModAOB+09

RDXSave:
