[[cheat]]
id = "ability-stat-points-save-game-to-populate-then-save-and-load-to-see-results"
name = "Ability Stat Points (save game to populate, then save and load to see results)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Search player name followed by:
// Group: 4:6 4:0 4:7 4:0 4:0 4:12 4:10 4:12 4:12 4:12 4:11 4:0
[ENABLE]
aobscanmodule(stats,$process,45 8B 44 96 ??)
alloc(newmem,$1000,stats)

label(statsBkp)
label(return)
label(statsPtr)

newmem:
  test rdx,rdx
  jne statsBkp
  mov r8,statsPtr
  cmp [r8],20
  jl @f
  mov [r8],0
@@:
  add [r8],08
  add r8,[r8]
  mov [r8],r14
statsBkp:
