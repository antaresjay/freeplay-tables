[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]



aobscanmodule(base,Gleaner_Heights.exe,0F 10 40 10 8B 4E 0C BA 01 00 00 00 57 0F 11 45 E4) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

registersymbol(healthE)
registersymbol(staminaE)

label(healthE)
label(staminaE)

registersymbol(valuedq)
label(valuedq)
newmem:


push esi
mov esi,[eax]
cmp esi,100000
jna code
mov esi,[esi]
cmp esi,100000
jna code
cmp [esi+4],'_sta'
jne code
cmp [esi+9],00616E69
jne code
cmp [staminaE],0
je code
fld qword ptr [valuedq]
fstp qword ptr[eax+10]

code:
mov esi,[eax]
cmp esi,100000
jna @f
mov esi,[esi]
cmp esi,100000
jna  @f
cmp [esi+4],'_hea'
jne  @f
cmp [esi+08],0068746C
jne  @f

cmp [healthE],0
je @f
fld qword ptr [valuedq]
fstp qword ptr[eax+10]
@@:
pop esi
movups xmm0,[eax+10]
mov ecx,[esi+0C]

  jmp return
healthE:
dd 0
staminaE:
dd 0
valuedq:
dq (double)100
base:
  jmp newmem
  nop 2
return:
registersymbol(base)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
base:
  db 0F 10 40 10 8B 4E 0C
unregistersymbol(valuedq)
unregistersymbol(base)
dealloc(newmem)
unregistersymbol(healthE)
unregistersymbol(staminaE)"""

