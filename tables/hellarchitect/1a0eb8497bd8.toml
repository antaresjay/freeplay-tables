[[cheat]]
id = "resource-multiplier"
name = "Resource multiplier"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : HellArchitect.exe
  Version: 
  Date   : 2021-08-20
  Author : Rinkashi Mikito

  Multiplier script for resources, uses mono.
}

define(address,Resource:AddResource+26)
define(bytes,F2 0F 58 C1 F2 0F 5A E8)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Resource:AddResource+26)

label(code)
label(return)
label(multiplier)
label(zero)

registersymbol(multiplier)
registersymbol(zero)

newmem:
  comisd xmm1,[zero]
  jb code
  mulsd xmm1,[multiplier]
code:
  addsd xmm0,xmm1
  cvtsd2ss xmm5,xmm0
  jmp return

multiplier:
  dq (double)10.0
zero:
  dq (double)0.0

address:
  jmp newmem
  nop 3
return:

[DISABLE]

address:
  db bytes
  // addsd xmm0,xmm1
  // cvtsd2ss xmm5,xmm0

unregistersymbol(multiplier)
unregistersymbol(zero)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: Resource:AddResource+26

Resource:AddResource: 55                       - push rbp
Resource:AddResource+1: 48 8B EC                 - mov rbp,rsp
Resource:AddResource+4: 48 83 EC 30              - sub rsp,30
Resource:AddResource+8: 48 89 75 F8              - mov [rbp-08],rsi
Resource:AddResource+c: 48 8B F1                 - mov rsi,rcx
Resource:AddResource+f: F3 0F 11 4D F0           - movss [rbp-10],xmm1
Resource:AddResource+14: F3 0F 10 46 54           - movss xmm0,[rsi+54]
Resource:AddResource+19: F3 0F 5A C0              - cvtss2sd xmm0,xmm0
Resource:AddResource+1d: F3 0F 10 4D F0           - movss xmm1,[rbp-10]
Resource:AddResource+22: F3 0F 5A C9              - cvtss2sd xmm1,xmm1
// ---------- INJECTING HERE ----------
Resource:AddResource+26: F2 0F 58 C1              - addsd xmm0,xmm1
// ---------- DONE INJECTING  ----------
Resource:AddResource+2a: F2 0F 5A E8              - cvtsd2ss xmm5,xmm0
Resource:AddResource+2e: F3 0F 11 6E 54           - movss [rsi+54],xmm5
Resource:AddResource+33: F3 0F 10 46 54           - movss xmm0,[rsi+54]
Resource:AddResource+38: F3 0F 5A C0              - cvtss2sd xmm0,xmm0
Resource:AddResource+3c: 66 0F 57 C9              - xorpd xmm1,xmm1
Resource:AddResource+40: F3 0F 10 15 48 00 00 00  - movss xmm2,[Resource:AddResource+90]
Resource:AddResource+48: F3 0F 5A D2              - cvtss2sd xmm2,xmm2
Resource:AddResource+4c: F2 0F 5A D2              - cvtsd2ss xmm2,xmm2
Resource:AddResource+50: F2 0F 5A C9              - cvtsd2ss xmm1,xmm1
Resource:AddResource+54: F2 0F 5A C0              - cvtsd2ss xmm0,xmm0
}"""

