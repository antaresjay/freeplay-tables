  jmp returnKnowledge

codeKnowledge:
  mov [esi+0000029C],eax
  jmp returnKnowledge

Knowledge:
  jmp newmemKnowledge
  nop
returnKnowledge:
registersymbol(Knowledge)

[DISABLE]

Knowledge:
  db 89 86 9C 02 00 00

unregistersymbol(Knowledge)
dealloc(newmemKnowledge)"""

[[cheat]]
id = "unlimited-metal"
name = "Unlimited Metal"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(Metal,89 11 8B 55 10 89 51 04 83) // should be unique
alloc(newmemMetal,$1000)

label(codeMetal)
label(returnMetal)

newmemMetal:
  mov [ecx],6FFFFFFF
  mov edx,[ebp+10]
  jmp returnMetal

codeMetal:
  mov [ecx],edx
  mov edx,[ebp+10]
  jmp returnMetal

Metal:
  jmp newmemMetal
returnMetal:
registersymbol(Metal)

[DISABLE]

Metal:
  db 89 11 8B 55 10

unregistersymbol(Metal)
dealloc(newmemMetal)"""

[[cheat]]
id = "no-build-limit"
name = "No Build Limit"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(BuildLimit,41 89 08 8B 46 5C) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
db  90 90 8B 46 5C
jmp return

code:
  mov [eax],ecx
  mov eax,[esi+5C]
  jmp return

BuildLimit+01:
  jmp newmem
return:
registersymbol(BuildLimit)

[DISABLE]

BuildLimit+01:
  db 89 08 8B 46 5C

unregistersymbol(BuildLimit)
dealloc(newmem)"""

