[[cheat]]
id = "unlimited-knowledge"
name = "Unlimited Knowledge"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(Knowledge,89 86 9C 02 00 00 85 DB) // should be unique
alloc(newmemKnowledge,$1000)

label(codeKnowledge)
label(returnKnowledge)

newmemKnowledge:
