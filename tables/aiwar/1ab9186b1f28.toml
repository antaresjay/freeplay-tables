[[cheat]]
id = "initialise"
name = "Initialise"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
globalalloc(playerbase,8)
globalalloc(power_on,8)


power_on:
db 00


[DISABLE]

unregistersymbol(power_on)
unregistersymbol(playerbase)

dealloc(power_on)
dealloc(playerbase)"""

[[cheat]]
id = "find-base"
name = "Find base"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//////////////////BASE AND POWER///////////////////////////
aobscan(Player,89 88 54 02 00 00 C7 40) // should be unique
alloc(newmembase,$1000)

label(codebase)
label(returnbase)
label(originalcode)

newmembase:

codebase:
  cmp [eax+1cc],1
  jne originalcode
  mov [playerbase],eax
  cmp [power_on],1
  jne originalcode
  mov [eax+00000254],7FFFFFFF
  jmp returnbase

originalcode:
  mov [eax+00000254],ecx
  jmp returnbase

Player:
  jmp codebase
  nop
returnbase:
registersymbol(Player)



[DISABLE]
Player:
  db 89 88 54 02 00 00

unregistersymbol(Player)
dealloc(newmembase)"""

[[cheat]]
id = "unlimited-power"
name = "Unlimited Power"
category = "misc"
description = ""
hint = ""
