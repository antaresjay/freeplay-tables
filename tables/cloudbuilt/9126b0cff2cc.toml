[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(healthreadAOB,8B 49 48 89 08)
registersymbol(healthreadAOB)

label(pHealth)
registersymbol(pHealth)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
mov [pHealth],ecx

originalcode:
mov ecx,[ecx+48]
mov [eax],ecx

exit:
jmp returnhere

///
pHealth:
dd 0
///

healthreadAOB: //"CloudBuilt.exe"+223073:
jmp newmem
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
healthreadAOB: //"CloudBuilt.exe"+223073:
db 8B 49 48 89 08
//Alt: mov ecx,[ecx+48]
//Alt: mov [eax],ecx
unregistersymbol(healthreadAOB)

unregistersymbol(pHealth)"""

