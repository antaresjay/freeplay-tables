  cmp eax,0C
  je En_Shield
  cmp eax,06
  je En_Shield
  cmp eax,03
  je En_Shield
  jmp code

En_Shield:
  cmp byte ptr [ShieldSwitch],00
  je code
  movss xmm0, [DEPLETE_VALUE]
  jmp code

code:
  movss [ecx+eax*4+0000037C],xmm0
  jmp return

ExceptionCode:
