type = "script"
source = """
{ Game   : S9-Win32-F.exe
  Version: 
  Date   : 2024-09-28
  Author : vesperpallens
}

[ENABLE]

aobscanmodule(ReadHealthAddress,S9-Win32-F.exe,DB 81 04 03 00 00)
aobscanmodule(OneHitKill1,S9-Win32-F.exe,F3 0F 2A 81 04 03 00 00 F3)
alloc(ReaderInject,$512)
alloc(PlayerHAddress,$4)
alloc(PlayerBase,4)
alloc(PlayerTeamPtr,4)
alloc(OneHitKillSwitch,$1)
alloc(GodModSwitcher,$1)
alloc(newmem_GM,$512)
alloc(PtrEn,4)
label(OriginalReaderCode returnReaderCode code_GM return_GM EmergencyCode_GM EnemyOrPlayer2 GodModOn Player_GodModOn Killit)
registersymbol(PlayerHAddress PlayerBase PlayerTeamPtr OneHitKillSwitch GodModSwitcher OneHitKill1 PtrEn ReadHealthAddress)

PtrEn:
  dd 0

ReaderInject:
  push eax
  push ebx
  mov eax, ecx
  mov [PlayerBase],ecx
  add eax, 304
  mov dword ptr [PlayerHAddress], eax

  mov ebx,ecx
  mov ebx,[ebx+EC]
  mov ebx,[ebx+204]
  mov ebx,[ebx+80]
  mov [PlayerTeamPtr], ebx

  pop ebx
  pop eax

OriginalReaderCode:
  fild dword ptr [ecx+00000304]
  jmp returnReaderCode

ReadHealthAddress:
  jmp ReaderInject
  nop
returnReaderCode:

newmem_GM:
  push edx
  mov edx,ecx
  mov edx,[edx+EC]
   test edx,edx
   jz EmergencyCode_GM
  mov edx,[edx+204]
   test edx,edx
   jz EmergencyCode_GM
  mov edx,[edx+80]
   test edx,edx
   jz EmergencyCode_GM
  mov [PtrEn],edx
  mov edx,[PlayerTeamPtr]

EnemyOrPlayer2:
  cmp [PtrEn],edx
  pop edx
  je GodModOn

  cmp byte ptr [OneHitKillSwitch],00
  je code_GM
  jmp Killit

Killit:
  mov [ecx+00000304], (int)0
  cvtsi2ss xmm0,[ecx+00000304]
  jmp return_GM

GodModOn:
  cmp byte ptr [GodModSwitcher],00
  je Player_GodModOn

  push edx
  mov edx,[ecx+0000030C]
  mov [ecx+00000304], edx
  cvtsi2ss xmm0,[ecx+00000304]
  pop edx
  jmp return_GM

Player_GodModOn:
  cmp dword ptr [PlayerBase], ecx
  jne code_GM
  push edx
  mov edx,[ecx+0000030C]
  mov [ecx+00000304], edx
  cvtsi2ss xmm0,[ecx+00000304]
  pop edx
  jmp return_GM

code_GM:
  cvtsi2ss xmm0,[ecx+00000304]
  jmp return_GM

EmergencyCode_GM:
  pop edx
  cvtsi2ss xmm0,[ecx+00000304]
  jmp return_GM

OneHitKill1:
  jmp newmem_GM
  nop 3
return_GM:

[DISABLE]
ReadHealthAddress:
  db DB 81 04 03 00 00

OneHitKill1:
  db F3 0F 2A 81 04 03 00 00

unregistersymbol(ReadHealthAddress PlayerBase PlayerTeamPtr PlayerHAddress OneHitKillSwitch GodModSwitcher OneHitKill1 PtrEn)
dealloc(ReaderInject PlayerHAddress PlayerBase PlayerTeamPtr OneHitKillSwitch GodModSwitcher newmem_GM PtrEn)"""

