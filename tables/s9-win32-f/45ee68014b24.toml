   jz Emergency_Exit
  mov ebx,[ebx+204]
   test ebx,ebx
   jz Emergency_Exit
  mov ebx,[ebx+80]
   test ebx,ebx
   jz Emergency_Exit
  mov ebx,[ebx+284]
   test ebx,ebx
   jz Emergency_Exit
