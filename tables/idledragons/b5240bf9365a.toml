id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : IdleDragons.exe
  Version: 
  Date   : 2020-03-31
  Author : Dungbeest

  This script restores health to last max health when health is changed
}

define(HealthJIT,CrusadersGame.GameScreen:Hero:SetHealth)

[ENABLE]

aobscanregion(HealthFreeze,CrusadersGame.GameScreen:Hero:SetHealth, CrusadersGame.GameScreen:Hero:SetHealth+300, DD 9F 98 01 00 00)
alloc(newmem,$64)

label(health_entry)
label(health_code)
label(health_return)

registersymbol(HealthFreeze)

newmem:

health_code:
  fstp qword ptr [edi+00000198]
  fld qword ptr [edi+000001b0]
  fstp qword ptr [edi+00000198]
  jmp health_return

HealthJIT:
HealthFreeze:
health_entry:
  jmp health_code
  nop
health_return:

[DISABLE]

HealthFreeze:
  db DD 9F 98 01 00 00
  //fstp qword ptr [edi+00000188]

dealloc(newmem)
unregistersymbol(HealthFreeze)"""

[[cheat]]
id = "disable-escorts"
name = "Disable Escorts"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : IdleDragons.exe
  Version: 
  Date   : 2020-03-30
  Author : Dungbeest

  This script disables escorts on any Area Change.
  Formation Code is super dumb. It cross-accesses 3
  different singletons to get the new formation
  on area change. This makes it incredibly brittle.
}

define(FormationJIT, CrusadersGame.GameScreen:Formation:SetNewArea)
[ENABLE]

aobscanregion(DisableEscortsFromFormation, CrusadersGame.GameScreen:Formation:SetNewArea, CrusadersGame.GameScreen:Formation:SetNewArea+140,C6 80 E8 00 00 00 00)
alloc(newmem,$256)

label(formation_code_1)
label(formation_entry_1)
label(formation_return_1)

registersymbol(DisableEscortsFromFormation)


newmem:

formation_code_1:
  //EAX has Formation
  //ECX still hasn't been set, use it to not disturb stack
  mov ecx, [eax+18]
  //ECX now has GameController
  mov ecx, [ecx+18]
  //ECX now has ActiveCampaignData
  mov ecx, [ecx+10]
  //ECX now has GameRules
  mov ecx, [ecx+6C]
  //ECX stores ChangeByArea
  mov [disable_escorts], ecx
  //ECX+8 stores its 'items'
  mov ecx, [ecx+8]
  //ECX stores ChangeByArea's items
  //Set all outer list sizes to 0
  mov [ecx+C], 0
  mov [ecx+10], 0
  mov [ecx+14], 0
  //ECX stores the inner list (lists of escorts essentially)
  mov ecx, [ecx+8]
  //ECX now stores the items with escorts
  //Set that list empty
  mov [ecx+C], 0
  //Targets formation+E8 for allWiped boolean
  mov byte ptr [eax+000000E8],00
  jmp formation_return_1

FormationJIT:
DisableEscortsFromFormation:
formation_entry_1:
  jmp formation_code_1
  nop 2
formation_return_1:

[DISABLE]

DisableEscortsFromFormation:
  db C6 80 E8 00 00 00 00
  // mov byte ptr [eax+000000E8],00

dealloc(newmem)
unregistersymbol(DisableEscortsFromFormation)

