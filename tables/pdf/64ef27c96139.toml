source = """
{ Game   : PDF.exe
  Version: 
  Date   : 2023-05-13
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(pData_PlayerController,GameAssembly.dll,48 8B 89 20 01 00 00 48 85 C9 74 0B) // should be unique
alloc(newmem,$1000,pData_PlayerController)

alloc(pBase_PlayerController,8)
registersymbol(pBase_PlayerController)

label(code)
label(return)

pBase_PlayerController:
dd

newmem:

code:
