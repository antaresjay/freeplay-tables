[[cheat]]
id = "enable-fishing-experience-multiplier"
name = "Enable Fishing Experience Multiplier"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@ModEngine
[ENABLE]

aobscanregion(expmultiplier,GameManager+PlayerData:AddSubPlayerExp+25d,GameManager+PlayerData:AddSubPlayerExp+271,F3 0F 11 A8 EC 00 00 00 48 8B)
alloc(newmem,$1000,expmultiplier)
registersymbol(fishingxp)
label(code)
label(return)

newmem:

code:
  mulss xmm5,[fishingxp]
  movss [rax+000000EC],xmm5
  jmp return

fishingxp:
dd 1

expmultiplier:
  jmp newmem
  nop 3
return:
registersymbol(expmultiplier)

[DISABLE]

expmultiplier:
  db F3 0F 11 A8 EC 00 00 00

unregistersymbol(*)
dealloc(*)"""

