category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
// HOOK 1 (freejumpmem+D0 - slot reader):
//   Reads the hovered slot's item count -> selectedNum
//   Reads the hovered slot's item ID   -> invId
//
// HOOK 2 (freejumpmem+E0 - drop interceptor):
//   When an item is dropped, writes swapId into that slot's ID field
//   and forces the count to 1, effectively swapping the item.
//
// USAGE:
//   1. Hover/select the target slot - note "Inventory Item ID"
//   2. Set "Item Swap ID" to the ID of the item you want
//   3. Drop the item in that slot - it becomes the swap ID item
