invId:
dd 0
align 10 cc

swapId:
dd 0
align 10 cc

freejumpmem+D0:
jmp slotsCode

freejumpmem+E0:
jmp dropsCode

slots:
jmp freejumpmem+D0
slotsReturn:

drops:
jmp freejumpmem+E0
dropsReturn:

