[[cheat]]
id = "step-2-enable-initialize-table-enable-this-second"
name = "[STEP 2] Enable / Initialize Table (Enable this SECOND)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
// Allocates a shared executable trampoline region near the game process.
// All scripts in this table use offsets into this region (freejumpmem+XX)
// to avoid allocating scattered memory on every enable.
define(freejumpmem,$process+500)
fullaccess(freejumpmem,$1000)
registersymbol(freejumpmem)
[DISABLE]
unregistersymbol(freejumpmem)"""

