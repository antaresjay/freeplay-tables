label(slotsCode slotsReturn dropsCode dropsReturn)
label(slotsbkp dropsbkp selectedNum invId swapId)

newmem:

// =====================
// HOOK 1 - Read slot info
// =====================
slotsCode:
mov r10,[rax+10]
mov [selectedNum],r10 // current item count in slot
mov r10,[rax+08]
mov [invId],r10 // item ID in slot
