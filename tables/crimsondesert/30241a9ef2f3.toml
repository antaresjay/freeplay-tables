[[cheat]]
id = "inventory-stack-modifier"
name = "Inventory Stack Modifier"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
// Hooks both the slot-read and item-drop paths.
// Captures the current slot stack into [stack], then on drop:
//   - If count would go below 1, restores it from [stack].
//   - If [Stack Amount] is nonzero, locks the slot to that count.
// Set "Stack Amount" to the desired locked stack size.
// Trampoline: freejumpmem+100 (invCheck), freejumpmem+110 (itemNoDrop)
aobscanmodule(invCheck,$process,48 83 78 10 ? 7E ? 80 B8 A0 00 00 00)
aobscanmodule(itemNoDrop,$process,48 29 ? ? ? 49 8B ? 48 03)
registersymbol(invCheck invCheckbkp itemNoDrop itemNoDropbkp stack)
alloc(newmem,256)
label(invCheckCode noDropCode incItem noDropExec)
label(invReturn noDropReturn)
label(invCheckbkp itemNoDropbkp stack)

newmem:

// =====================
// HOOK 1 - Slot reader: capture current slot stack count
// =====================
invCheckCode:
mov r10,[rax+10]
mov [stack],r10 // capture current slot count
jmp invReturn

// =====================
// HOOK 2 - Drop interceptor: restore/lock stack count on decrement
// =====================
noDropCode:
mov r8,[rdx+rax+10]
cmp r8,1
jge incItem
jmp noDropExec // count <= 1, allow normal decrement

incItem:
cmp [stack],0
jz noDropExec // if stack=0, don't interfere
mov r10,[stack]
cmp rcx,r10
je noDropExec // if drop amount == stack amount, allow
mov [rdx+rax+10],r10 // restore stack count
jmp noDropExec

noDropExec:
sub [rdx+rax+10],rcx // original decrement
jmp noDropReturn

invCheckbkp:
readmem(invCheck,5)
align 10 cc

itemNoDropbkp:
readmem(itemNoDrop,5)
align 10 cc

stack:
dd 0
align 10 cc

freejumpmem+100:
jmp invCheckCode

freejumpmem+110:
jmp noDropCode

invCheck:
jmp freejumpmem+100
invReturn:

itemNoDrop:
jmp freejumpmem+110
noDropReturn:

[DISABLE]
invCheck:
//db 48 83 78 10 00
readmem(invCheckbkp,5)
itemNoDrop:
//db 49 29 4C 07 10
readmem(itemNoDropbkp,5)
unregistersymbol(*)
dealloc(*)"""

