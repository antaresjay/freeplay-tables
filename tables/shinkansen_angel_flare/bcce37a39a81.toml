[[cheat]]
id = "plane-base-address-scan-initialization-activate-this-first"
name = "Plane Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Plane_basepointer)
registersymbol(Plane_update_enable)
registersymbol(Plane_set_enable)
registersymbol(Plane_healthset_enable)
registersymbol(Plane_throttleset_enable)
registersymbol(Plane_specialset_enable)

alloc(Plane_basepointer, 8)
alloc(Plane_update_enable, 4)
alloc(Plane_set_enable, 4)
alloc(Plane_healthset_enable, 4)
alloc(Plane_throttleset_enable, 4)
alloc(Plane_specialset_enable, 4)


[DISABLE]
unregistersymbol(Plane_basepointer)
unregistersymbol(Plane_update_enable)
unregistersymbol(Plane_set_enable)
unregistersymbol(Plane_healthset_enable)
unregistersymbol(Plane_throttleset_enable)
unregistersymbol(Plane_specialset_enable)

dealloc(Plane_basepointer)
dealloc(Plane_update_enable)
dealloc(Plane_set_enable)
dealloc(Plane_healthset_enable)
dealloc(Plane_throttleset_enable)
dealloc(Plane_specialset_enable)"""

[[cheat]]
id = "plane-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Plane Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Plane_savedAOB)
label(Plane_returnhere)
label(Plane_originalcode)
label(Plane_exit)

label(Plane_update_exit)
label(Plane_set_exit)
label(Plane_healthset_exit)
label(Plane_throttleset_exit)
label(Plane_specialset_exit)

registersymbol(Plane_savedAOB)

//85BFC269 - 48 89 45 B8           - mov [rbp-48],rax
//85BFC26D - 89 45 AC              - mov [rbp-54],eax
// Plane:Update+20
//85BFC270 - 0FB6 86 88020000      - movzx eax,byte ptr [rsi+00000288]
//85BFC277 - 85 C0                 - test eax,eax
//85BFC279 - 74 0F                 - je 85BFC28A
//85BFC27B - 0FB6 86 0C040000      - movzx eax,byte ptr [rsi+0000040C]
//85BFC282 - 85 C0                 - test eax,eax
aobscan(Plane_searchedAOB, 0F B6 86 88 02 00 00 85 C0 74 0F)

alloc(Plane_newmem, 2048, Plane_searchedAOB)
alloc(Plane_temp1, 8, Plane_searchedAOB)
alloc(Plane_temp2, 8, Plane_searchedAOB)
alloc(Plane_temp3, 8, Plane_searchedAOB)
alloc(Plane_temp4, 8, Plane_searchedAOB)
alloc(Plane_temp5, 8, Plane_searchedAOB)


Plane_newmem:
mov [Plane_temp1], rax
mov [Plane_temp2], rbx
mov [Plane_temp3], rcx
mov [Plane_temp4], rdx

cmp dword ptr [Plane_update_enable], #0
je Plane_update_exit
mov [Plane_basepointer], rsi
Plane_update_exit:

cmp dword ptr [Plane_set_enable], #0
je Plane_set_exit
Plane_set_exit:

cmp dword ptr [Plane_healthset_enable], #0
je Plane_healthset_exit
fld [rsi+1ac]
fstp [rsi+224]
Plane_healthset_exit:

cmp dword ptr [Plane_throttleset_enable], #0
je Plane_throttleset_exit
mov [rsi+42c], (float)0
Plane_throttleset_exit:

cmp dword ptr [Plane_specialset_enable], #0
je Plane_specialset_exit
mov rax, [rsi+38]
test rax, rax
je Plane_specialset_exit
fld [rax+3c]
fstp [rax+38]
Plane_specialset_exit:

mov rax, [Plane_temp1]
mov rbx, [Plane_temp2]
mov rcx, [Plane_temp3]
mov rdx, [Plane_temp4]


Plane_originalcode:
db 0F B6 86 88 02 00 00
//movzx eax,byte ptr [rsi+00000288]


Plane_exit:
jmp Plane_returnhere


Plane_searchedAOB:
Plane_savedAOB:
jmp Plane_newmem
nop
nop
Plane_returnhere:


[DISABLE]
Plane_savedAOB:
db 0F B6 86 88 02 00 00
//movzx eax,byte ptr [rsi+00000288]

unregistersymbol(Plane_savedAOB)

dealloc(Plane_newmem)
dealloc(Plane_temp1)
dealloc(Plane_temp2)
dealloc(Plane_temp3)
dealloc(Plane_temp4)
dealloc(Plane_temp5)"""

