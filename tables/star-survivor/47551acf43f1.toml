type = "script"
source = """
{ Game   : Star Survivor.exe
  Version: 
  Date   : 2023-03-02
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanregion(pData_GameController,EnemySpawnSingle:Update,EnemySpawnSingle:Update+1000,48 63 40 38 85 C0 0F 85 3D) // should be unique
alloc(newmem,$100,pData_GameController)

alloc(pBase_GameController,8)
registersymbol(pBase_GameController)

label(code)
label(return)

pBase_GameController:
dd

newmem:

code:
  mov [pBase_GameController],rax
  movsxd  rax,dword ptr [rax+38]
  test eax,eax
  jmp return

pData_GameController:
  jmp newmem
  nop
return:
registersymbol(pData_GameController pBase_GameController)

[DISABLE]

pData_GameController:
  db 48 63 40 38 85 C0

unregistersymbol(*)
dealloc(*)"""

