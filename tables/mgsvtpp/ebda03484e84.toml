[[cheat]]
id = "no-reload"
name = "No Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(reload,mgsvtpp.exe,66 44 89 1C 48 49) // should be unique
alloc(newmem,$1000,reload) //"mgsvtpp.exe"+8E9EA30)

label(code)
label(return)

newmem:
  mov r11w,[rax+rcx*2]
code:
  mov [rax+rcx*2],r11w
  jmp return

reload:
  jmp newmem
return:
registersymbol(reload)

[DISABLE]

reload:
  db 66 44 89 1C 48

unregistersymbol(reload)
dealloc(newmem)"""

