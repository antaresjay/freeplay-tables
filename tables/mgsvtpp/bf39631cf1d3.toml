[[cheat]]
id = "teleport"
name = "Teleport"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(aobTeleport,mgsvtpp.exe,F3 0F 10 40 24 0F 2F 05)
alloc(newmem,$1000,"mgsvtpp.exe"+41BCE34)
alloc(store_coord,256)

label(code)
label(return)
label(xpos)
label(ypos)
label(zpos)
label(save)
label(load)
label(save)
label(load)
label(en_save)
label(en_load)
registersymbol(en_save)
registersymbol(en_load)

store_coord:
xpos:
  dd 0
ypos:
  dd 0
zpos:
  dd 0

en_save:
  dd 0
en_load:
  dd 0

newmem:
  cmp [en_save],1
  je save
  cmp [en_load],1
  je load
  jmp code

save:
  mov [en_save],0
  push rbx
  mov rbx,[rax+20]
  mov [xpos],rbx
  mov rbx,[rax+24]
  mov [ypos],rbx
  mov rbx,[rax+28]
  mov [zpos],rbx
  pop rbx
  jmp code

load:
  mov [en_load],0
  push rbx
  mov rbx,[xpos]
  mov [rax+20],rbx
  mov rbx,[ypos]
  mov [rax+24],rbx
  mov rbx,[zpos]
  mov [rax+28],rbx
  pop rbx
  jmp code

code:
  movss xmm0,[rax+24]
  jmp return

aobTeleport:
  jmp newmem
return:
registersymbol(aobTeleport)

[DISABLE]

aobTeleport:
  db F3 0F 10 40 24

unregistersymbol(aobTeleport)
unregistersymbol(en_save)
unregistersymbol(en_load)
dealloc(newmem)
dealloc(store_coord)"""

