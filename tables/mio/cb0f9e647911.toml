[[cheat]]
id = "infinite-jumps-ctrl-numpad-2"
name = "Infinite Jumps (Ctrl + Numpad 2)"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : mio.exe
// Author            : ndck76
// Game Version      : Build.21209631
// Script Date       : 2026-01-21


[ENABLE]

aobscanmodule(jumps,mio.exe,8Bxxxxxxxxxx8Bxxxx80xxxxxxxxxxxx74xx39) // should be unique
alloc(newmem,$1000,jumps)
alloc(jumpsbkp,6)
registersymbol(jumps)
registersymbol(jumpsbkp)
label(code)
label(return)

jumpsbkp:
  readmem(jumps,6)

newmem:
  mov [rcx+00000B9C],(int)2

code:
  readmem(jumps,6)
  jmp return

jumps:
  jmp newmem
  nop
return:

[DISABLE]

jumps:
  readmem(jumpsbkp,6)

unregistersymbol(*)
dealloc(*)"""
