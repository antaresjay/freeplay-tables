[[cheat]]
id = "player-data-manager-ctrl-numpad-1-pause-the-game-to-populate-values"
name = "Player Data Manager (Ctrl + Numpad 1) {Pause the game to populate values}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : City of Springs.exe
// Author            : ndck76
// Executable Version: 2021.3.45.43167
// Game Version      : v1.04
// Script Date       : 2025-02-14


[ENABLE]

aobscanmodule(crowns,GameAssembly.dll,8Bxxxx488Dxxxxxx33xx89xxxxxxE8xxxxxxxx4885xx74xx4Cxxxx488Bxx488Bxx4Dxxxxxxxxxxxx41FFxxxxxxxxxx488Bxxxx33) //UpgradeTalentWindow.OnUpdateCoresText
alloc(newmem,$1000,crowns)
alloc(data2,8)
alloc(crownsbkp,8)
registersymbol(data2)
registersymbol(crowns)
registersymbol(crownsbkp)
label(code)
label(return)

crownsbkp:
  readmem(crowns,8)

newmem:
  mov [data2],rax

code:
  readmem(crowns,8)
  jmp return

crowns:
  jmp newmem
  nop 3
return:

[DISABLE]

crowns:
  readmem(crownsbkp,8)

unregistersymbol(*)
dealloc(*)"""

