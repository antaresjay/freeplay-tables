[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]



aobscanmodule(health,fallout2HR.exe,89 53 2C 39 D0)
alloc(newmem,$1000)
aobscan(PlayerID,83 78 40 00 7F 09)
label(code)
label(return)

newmem:

code:
push esi
mov esi,PlayerID-4
mov esi,[esi]
cmp [esi],ecx
jne @f
mov edx,63

mov [ebx+2C],edx
@@:
pop esi
mov [ebx+2C],edx
cmp eax,edx
jmp return

health:
jmp newmem
return:
registersymbol(health)

[DISABLE]
health:
db 89 53 2C 39 D0

unregistersymbol(health)
dealloc(newmem)"""

