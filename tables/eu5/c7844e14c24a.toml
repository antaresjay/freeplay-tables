  Author : Nameless

  This script gets the character pointer from the father id.

  To find itm, use console and use "set_adm" (or similar) and search for the
  value (x100.000). When you find it, use "what accesses", put a breakpoint,
  find the pointer to the CCharacter struct, look for father's id,
  again use "what accesses", and you should find it.

  To verify, put on "what adresses does this..." on the injection point,
  and it should only be the CCharacter struct you are looking at.
}

[ENABLE]

aobscanmodule(selected_character,eu5.exe,8B 81 9C 05 00 00 89) // should be unique, will not survive struct change
