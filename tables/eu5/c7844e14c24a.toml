  jmp return

pSelectedChar:
  dq 0

selected_character:
  jmp newmem
  nop
return:

[DISABLE]

selected_character:
  db 8B 81 9C 05 00 00

unregistersymbol(selected_character pSelectedChar)
dealloc(newmem)

