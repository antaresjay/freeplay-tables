[[cheat]]
id = "allow-nac-mods-enable-before-load-or-create-game"
name = "Allow NAC mods (enable before load or create game)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : eu5.exe
  Version: 
  Date   : 2025-11-09
  Author : Nameless

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(nac_mods_on_create,eu5.exe,80 B8 31 01 00 00 00 74) // should be unique
//                                        ??                ??

aobscanmodule(aob_nac_mod_on_load,eu5.exe,20 83 31 01 00 00) // should be unique

alloc(newmem,$1000,nac_mods_on_create)

label(code)
label(return)
label(return_nacmodonload)
label(nacmodonload)
label(pAchievementBaseNAC)
registersymbol(nac_mods_on_create pAchievementBaseNAC aob_nac_mod_on_load)

newmem:
  mov [pAchievementBaseNAC],rax
  mov byte ptr [rax+00000130],01 // Unknown, is set during save game load
  mov byte ptr [rax+00000131],01 // NAC mods not used
code:
  cmp byte ptr [rax+00000131],00
  jmp return

nacmodonload:
  mov [pAchievementBaseNAC],rbx
  mov byte ptr [rbx+00000130],01 // Unknown, is set during save game load
  mov byte ptr [rbx+00000131],01 // NAC mods not used
  and [rbx+00000131],al
  jmp return_nacmodonload

pAchievementBaseNAC:
  dq 0

//
// Entry points
//
aob_nac_mod_on_load:
  jmp nacmodonload
  nop
return_nacmodonload:

nac_mods_on_create:
  jmp newmem
  nop 2
return:

[DISABLE]

nac_mods_on_create:
  db 80 B8 31 01 00 00 00

aob_nac_mod_on_load:
  db 20 83 31 01 00 00

unregistersymbol(nac_mods_on_create pAchievementBaseNAC aob_nac_mod_on_load)
dealloc(newmem)

