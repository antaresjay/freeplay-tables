[[cheat]]
id = "x-player-country"
name = "[X] <== Player Country"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : eu5.exe
  Version: 
  Date   : 2025-11-04
  Author : Nameless

  This script gets the player country.
  Find stability -> what accesses.
  For government offset, scroll down and look for CGovernment
}

[ENABLE]

aobscanmodule(PlayerCountry,eu5.exe,C4 C1 FA 2A 45 38) // should be unique
alloc(newmem,$1000,PlayerCountry)

label(code)
label(return)
label(pPlayerCountry)
label(nPlayerId)
registersymbol(PlayerCountry pPlayerCountry nPlayerId)

newmem:
  mov [pPlayerCountry],r13
  push rax
  xor rax,rax
  mov eax,[r13+10]
  mov [nPlayerId],eax
  pop rax
code:
  vcvtsi2ss xmm0,xmm0,[r13+38] // Player stability
  jmp return

// CCountry struct, hopefully only for player
pPlayerCountry:
  dq 0
nPlayerId:
  dw 0

PlayerCountry:
  jmp newmem
  nop
return:

[DISABLE]

PlayerCountry:
  db C4 C1 FA 2A 45 38

unregistersymbol(PlayerCountry pPlayerCountry nPlayerId)
dealloc(newmem)

