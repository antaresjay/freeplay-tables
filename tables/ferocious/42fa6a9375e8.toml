[[cheat]]
id = "unlimited-health"
name = "Unlimited Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
define(address,PlayerController.UpdateStance)
define(bytes,48 89 5C 24 08)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,PlayerController.UpdateStance)

label(code)
label(return)

newmem:
push r9
mov r9,[rcx+30]
mov r9,[r9+60]
mov [r9+44],(float)999999
mov [r9+4C],(float)999999
pop r9

code:
  mov [rsp+08],rbx
  jmp return

address:
  jmp newmem
return:

[DISABLE]

address:
  db bytes

dealloc(*)"""

