  mov r11, [rsi+2D0]
  test r11,r11
  je code

  mov [gamersgame], rsi

code:
  pop r14
  pop r13
  pop r12
  pop r11

  mov rax,[rsi]
  movzx r8d,r12b
  movaps xmm1,xmm6
  mov rcx,rsi
  call qword ptr [rax+00000E08]
  jmp return

gamersgame:
dq 0


tomandjerry:
  jmp far newmem
  nop
  nop
  nop
  nop
  nop
return:
registersymbol(tomandjerry)

[DISABLE]

tomandjerry:
  db 48 8B 06 45 0F B6 C4 0F 28 CE 48 8B CE FF 90 08 0E 00 00

unregistersymbol(tomandjerry)
unregistersymbol(gamersgame)
