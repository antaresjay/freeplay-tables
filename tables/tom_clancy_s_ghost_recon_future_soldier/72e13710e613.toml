[[cheat]]
id = "no-reload"
name = "No Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(noreloadcd,AICLASS_PC_F.DLL,66 8B 96 7E 01 00 00 ?? ?? ?? ?? ?? ?? ?? 33 C9) 
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  mov word ptr [esi+0000017E], #99
  mov dx, [esi+0000017E]
  jmp return

noreloadcd:
  jmp newmem
  nop
  nop
return:
registersymbol(noreloadcd)

[DISABLE]

noreloadcd:
  db 66 8B 96 7E 01 00 00

unregistersymbol(noreloadcd)
dealloc(newmem)"""
