[ENABLE]
//****************** Get Player Hunger *************************

alloc(newmempHunger,$1000)

label(codepHunger)
label(returnpHunger)
label(pHungerCheck)
label(aobhunger_r)

newmempHunger:
  push ebp
  mov ebp,esp
  mov eax,[ebp+08]
  test eax,eax
  je codepHunger
  mov eax,[eax+10]
  shr eax,08
  mov [pHungerCheck],eax
  jmp codepHunger

codepHunger:
  push -01
  jmp returnpHunger

aobhunger_r:
  readmem(PlayerEntityManager.UpdateMappings,8)

pHungerCheck:
  dq 0

PlayerEntityManager.UpdateMappings:
  jmp newmempHunger
returnpHunger:

//****************** Damage Part *************************

alloc(newmempDamage,$1000)

label(codepDamage)
label(returnpDamage)
label(infHealthFlag)
label(damageFlag)
label(ohkC)
label(aobohk_r)

newmempDamage:
  mov eax,[ebx+0C]
  shr eax,04
  and eax,0000FFFF
  cmp eax,[pHungerCheck]
  jne ohkC
  cmp dword ptr [infHealthFlag],01
  jne codepDamage
  mov ecx,00002710 // 10000
  jmp codepDamage

ohkC:
  cmp dword ptr [damageFlag],01
  jne codepDamage
  xor ecx,ecx
  jmp codepDamage

codepDamage:
  xor eax,eax
  test ecx,ecx
  cmovns eax,ecx
  jmp returnpDamage

aobohk_r:
  readmem(LogicalHealthManager.ApplyHealthModifyEvent+26C,7)

infHealthFlag:
  dd 00

damageFlag:
  db 00

LogicalHealthManager.ApplyHealthModifyEvent+26C:
  jmp newmempDamage
  nop 2
returnpDamage:
registersymbol(infHealthFlag damageFlag pHungerCheck aobhunger_r aobohk_r)

