id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
AoBScan(Ammo, 8B F9 8B 97)

[ENABLE]
alloc(newmem,1024)
label(return)

Ammo+E:
jmp newmem
nop
return:

newmem:
mov [edi+000003A4],eax
cmp eax,ebx
je return
mov [edi+000003A4],#99999
