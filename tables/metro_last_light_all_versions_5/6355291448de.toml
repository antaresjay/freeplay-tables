[[cheat]]
id = "always-100-gas-mask-durability"
name = "Always 100% Gas Mask Durability"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
AoBScan(Gasmask, 8B 44 24 04 0F 28 D0)

[ENABLE]
alloc(newmem,1024)
label(return)

Gasmask+7:
jmp newmem
return:

newmem:
