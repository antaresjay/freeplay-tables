source = """
// Game Executable   : Pioneers of Pagonia.exe
// Author            : Cs
// Executable Version: 1.0.0.0
// Module Version    : 
// Script Date       : 2026-01-10
// Created with      : customAOBInjectionTemplates version: 1.3.12
[ENABLE]
///////////////////////////////////////////////////////////////////////////////
// Here are the defined hotkeys.
// Check this page for other scan codes:
// https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
define(ResourceKey,10)   // SHIFT
define(NoResourceKey,11) // CTRL

aobscanmodule(aobBuildingResourceReader,Pioneers of Pagonia.exe,45 03 47 ?? 41 03 57 ?? 41)
aobscanmodule(aobGameSpeedReader,Pioneers of Pagonia.exe,F3 0F 10 73 ?? 0F 28 C6 F3 0F 59)

alloc(newmemBuildingResourceReader,4096,aobBuildingResourceReader)

label(aobBuildingResourceReader_r)
label(aobBuildingResourceReader_i)
registersymbol(aobBuildingResourceReader_r)
registersymbol(aobBuildingResourceReader_i)

label(lblBuildingResourceReader)
label(lblBuildingResourceReaderPopSkip)
label(lblBuildingResourceReaderSkip)
label(lblBuildingResourceReaderRet)
label(lblBuildingResourceReaderRetZero)
label(lblBuildingResourceReaderRetMax)

label(bEnableNoBuildingResourceOnClick)
label(bEnableMaxBuildingResourceOnClick)
registersymbol(bEnableNoBuildingResourceOnClick)
registersymbol(bEnableMaxBuildingResourceOnClick)

label(aobGameSpeedReader_r)
label(aobGameSpeedReader_i)
registersymbol(aobGameSpeedReader_r)
registersymbol(aobGameSpeedReader_i)

label(lblGameSpeedReader)
label(lblGameSpeedReaderSkip)
label(lblGameSpeedReaderRet)

label(bEnableGameSpeedOverride)
label(bEnableMaxOverride)
label(iMaxOverride)
label(fGameSpeedOverride)
registersymbol(bEnableGameSpeedOverride)
registersymbol(bEnableMaxOverride)
registersymbol(iMaxOverride)
registersymbol(fGameSpeedOverride)

newmemBuildingResourceReader:
//////////////////////////////////////////////
// Set your preferred default values below. //
//////////////////////////////////////////////
bEnableNoBuildingResourceOnClick:
dd 1
bEnableMaxBuildingResourceOnClick:
dd 1
bEnableMaxOverride:
dd 1
iMaxOverride:
dd (int)9999
bEnableGameSpeedOverride:
dd 1
fGameSpeedOverride:
dd (float)-1.0
//////////////////////////////////////////////
// Set your preferred default values above. //
//////////////////////////////////////////////

lblBuildingResourceReader:
push r11
push rax
push rcx
push rdx
push r8
push r9
push r11
cmp dword ptr [bEnableNoBuildingResourceOnClick],1
jne short @f
mov rcx,NoResourceKey
push rcx
call User32.GetAsyncKeyState
add rsp,08
shr ax,#15
cmp ax,1
je short lblBuildingResourceReaderRetZero
@@:
cmp dword ptr [bEnableMaxBuildingResourceOnClick],1
jne short @f
mov rcx,ResourceKey
push rcx
call User32.GetAsyncKeyState
add rsp,08
shr ax,#15
cmp ax,1
je short lblBuildingResourceReaderRetMax
@@:
jmp short lblBuildingResourceReaderPopSkip
lblBuildingResourceReaderRetZero:
movsx r11,[aobBuildingResourceReader_i+03]
movsxd r10,[r11+r15+18]
cmp r10d,1
jle short lblBuildingResourceReaderPopSkip
movsx r11,[aobBuildingResourceReader_i+03]
cmp dword ptr [r11+r15],1
jle short lblBuildingResourceReaderPopSkip
mov dword ptr [r11+r15],1
jmp short lblBuildingResourceReaderPopSkip
lblBuildingResourceReaderRetMax:
movsx r11,[aobBuildingResourceReader_i+03]
movsxd r10,[r11+r15+18]
cmp r10d,1
jle short lblBuildingResourceReaderPopSkip
dec r10d
cmp dword ptr [bEnableMaxOverride],1
jne short @f
mov r10d,[iMaxOverride]
@@:
cmp dword ptr [r11+r15],r10d
jge short lblBuildingResourceReaderPopSkip
mov dword ptr [r11+r15],r10d
lblBuildingResourceReaderPopSkip:
pop r11
pop r9
pop r8
pop rdx
pop rcx
pop rax
lblBuildingResourceReaderSkip:
pop r11
readmem(aobBuildingResourceReader,8)
jmp lblBuildingResourceReaderRet
aobBuildingResourceReader_i:
readmem(aobBuildingResourceReader,8)

lblGameSpeedReader:
cmp dword ptr [bEnableGameSpeedOverride],1
jne short lblGameSpeedReaderSkip
cmp dword ptr [fGameSpeedOverride],(float)-1.0
je short lblGameSpeedReaderSkip
movsxd r11,[aobGameSpeedReader_i+04]
mov r10d,[fGameSpeedOverride]
mov dword ptr [fGameSpeedOverride],(float)-1.0
cmp dword ptr [rbx+r11],r10d
je short lblGameSpeedReaderSkip
mov dword ptr [rbx+r11],r10d
lblGameSpeedReaderSkip:
readmem(aobGameSpeedReader,5)
jmp lblGameSpeedReaderRet
aobGameSpeedReader_i:
readmem(aobGameSpeedReader,5)

aobGameSpeedReader:
aobGameSpeedReader_r:
jmp lblGameSpeedReader
lblGameSpeedReaderRet:

aobBuildingResourceReader:
aobBuildingResourceReader_r:
jmp lblBuildingResourceReader
nop 3
lblBuildingResourceReaderRet:

[DISABLE]
aobBuildingResourceReader_r:
readmem(aobBuildingResourceReader_i,8)

aobGameSpeedReader_r:
readmem(aobGameSpeedReader_i,5)

unregistersymbol(*)
dealloc(*)"""

