[[cheat]]
id = "auto-assemble-script-2"
name = "Auto Assemble script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(hook,"Map:AreaHover:Call")
define(bytes,55 48 8B EC 48 83 EC 40)

[enable]

assert(hook, bytes)
alloc(newmem,$1000, hook)
{
  RCX: AreaHover (this)
  RDX: Map.IAreaView areaId

  Returns (RAX) System.Void

  At point of check, RAX and RCX are pointer to ...
  RDX is RegionViewData
      +20: regionId

}

newmem:
  // original code
  push rbp
  mov rbp,rsp
  sub rsp,40
  jmp hook+8

hook:
  jmp newmem

[disable]

hook:
  db bytes

dealloc(newmem)

{
Map:AreaHover:Call - 55                    - push rbp
Map:AreaHover:Call+1- 48 8B EC              - mov rbp,rsp
Map:AreaHover:Call+4- 48 83 EC 40           - sub rsp,40
Map:AreaHover:Call+8- 48 89 4D F8           - mov [rbp-08],rcx
Map:AreaHover:Call+c- 48 89 55 F0           - mov [rbp-10],rdx
Map:AreaHover:Call+10- 48 8B C1              - mov rax,rcx
Map:AreaHover:Call+13- 48 8B 40 18           - mov rax,[rax+18] // checked out this point
Map:AreaHover:Call+17- 48 8B C8              - mov rcx,rax
Map:AreaHover:Call+1a- 48 8B 55 F0           - mov rdx,[rbp-10]
Map:AreaHover:Call+1e- 48 89 45 E8           - mov [rbp-18],rax
Map:AreaHover:Call+22- FF 50 18              - call qword ptr [rax+18]
Map:AreaHover:Call+25- 48 8B 45 E8           - mov rax,[rbp-18]
Map:AreaHover:Call+29- 48 8D 65 00           - lea rsp,[rbp+00]
Map:AreaHover:Call+2d- 5D                    - pop rbp
Map:AreaHover:Call+2e- C3                    - ret
}"""

