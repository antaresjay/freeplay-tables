[[cheat]]
id = "manager-getbasestat-set-base-stats-to-250"
name = "Manager:GetBaseStat - Set base stats to 250"
category = "player"
description = ""
hint = ""
type = "script"
source = """
define(hook,"Manager:GetBaseStat")
define(bytes,48 83 EC 18 48 89 34 24)

[enable]

assert(hook, bytes)
alloc(newmem,$1000, hook)
{
  RCX: Manager (this)
  RDX: Manager/StatType statType

  Returns (RAX) System.Int32

  Ok, this is odd...  One thing I don't like about the structure dissect is that
  it doesn't seem to work well all the time.  For instance here we have
  +28 is baseStats which is listed as System.Int32[].  But the values show
  up as 64 bit values and pointers.

  Anyway, what we should be able to do it set the first 4 of 7 values
  which ar in order

  X, L, X, G


}

newmem:
  push rax
  mov rax,[rcx+28] // Int32[]
  test rax,rax
  jz @f
  cmp [rax+18], 4
  jl @f // not 4 items (usually 7)
  cmp [rax+18], 20
  jg @f // more than 20?  weird!
  mov [rax+20], #250
  mov [rax+24], #250
  mov [rax+28], #250
  mov [rax+2c], #250
@@:
  pop rax

  // original code
  sub rsp,18
  mov [rsp],rsi
  jmp hook+8

hook:
  jmp newmem

[disable]

hook:
  db bytes

dealloc(newmem)"""

