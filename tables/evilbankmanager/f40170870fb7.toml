id = "userbank-addresource-add-100m-gold-next-time-you-add-any-resource"
name = "UserBank:AddResource (add 100M gold next time you add any resource)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
define(hook,"UserBank:AddResource")
define(bytes,55 48 8B EC 48 83 EC 70)

[enable]

assert(hook, bytes)
alloc(newmem,$1000, hook)
{
  RCX: UserBank (this)
  RDX: int resourceId
  XMM2: single amount

  Returns (RAX) System.Void

  What this does is when adding a resource, it also adds 100M gold (id 1)
}

label(skip)
label(hasRun)
label(goldToAdd)

newmem:
  cmp dword ptr [hasRun],0
  jne skip
  mov dword ptr [hasRun],1
  push rbp
  mov rbp,rsp

  push rcx
  push rdx
  push rdx
  movss [rsp],xmm2
  sub rsp,28
  mov rdx,1
  movss xmm2,[goldToAdd]
  call "UserBank:AddResource"
  add rsp,28
  movss xmm2,[rsp]
  pop rdx
  pop rdx
  pop rcx
  pop rbp
skip:

  // original code
  push rbp
  mov rbp,rsp
  sub rsp,70
  jmp hook+8

align 10
hasRun:
  dd 0
goldToAdd:
  dd (float)100000000

hook:
  jmp newmem

[disable]

hook:
  db bytes

dealloc(newmem)"""

