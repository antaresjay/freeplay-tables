je BomberFuselageSection_healthset_exit
fld [rbx+30]
fstp [rbx+2c]
BomberFuselageSection_healthset_exit:

mov rax, [BomberFuselageSection_temp1]
mov rbx, [BomberFuselageSection_temp2]
mov rcx, [BomberFuselageSection_temp3]
mov rdx, [BomberFuselageSection_temp4]


