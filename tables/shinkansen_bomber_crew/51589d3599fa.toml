//1337340C - 0FB6 86 84000000      - movzx eax,byte ptr [rsi+00000084]
//13373413 - 85 C0                 - test eax,eax
//13373415 - 74 29                 - je 13373440
//13373417 - 48 8B 46 58           - mov rax,[rsi+58]
//1337341B - 48 8B C8              - mov rcx,rax
aobscan(BomberFuselageSection_searchedAOB, 0F B6 86 84 00 00 00 85 C0 74 29)

