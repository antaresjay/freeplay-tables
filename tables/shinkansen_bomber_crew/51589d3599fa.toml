mov [BomberFuselageSection_basepointer], rsi
BomberFuselageSection_update_exit:

cmp dword ptr [BomberFuselageSection_set_enable], #0
je BomberFuselageSection_set_exit
BomberFuselageSection_set_exit:

cmp dword ptr [BomberFuselageSection_healthset_enable], #0
