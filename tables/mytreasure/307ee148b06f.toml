[[cheat]]
id = "gamedata"
name = "GameData"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : MyTreasure.exe
  Version: 
  Date   : 2026-05-06
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,GM_GameData:Update)
define(bytes,55 48 8B EC 48 83 EC 40)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,GM_GameData:Update)

label(code)
label(return)

newmem:
mov [gamedata_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,40
  jmp return

gamedata_ptr:
dq 0

address:
  jmp newmem
  nop 3
return:
registersymbol(gamedata_ptr)

[DISABLE]

address:
  db bytes
  // push rbp
  // mov rbp,rsp
  // sub rsp,40

dealloc(newmem)
unregistersymbol(gamedata_ptr)"""

