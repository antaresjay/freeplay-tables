[[cheat]]
id = "player-ctrl-numpad-1"
name = "Player (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Gravethorn.exe
// Author            : ndck76
// Executable Version: 5.4.4.0
// Game Version      : v1.0
// Script Date       : 2026-02-07


[ENABLE]

aobscanmodule(master,Gravethorn.exe,488BxxF2xxxxxxxxxx0F28xx0F29xxxxxxF2xxxxxxxxxxFF) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,9)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,9)

newmem:
  mov [data],rcx

code:
  readmem(master,9)
  jmp return

master:
  jmp newmem
  nop 4
return:

[DISABLE]

master:
  readmem(masterbkp,9)

unregistersymbol(*)
dealloc(*)"""

