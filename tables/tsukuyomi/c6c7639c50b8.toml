[[cheat]]
id = "extra-damage"
name = "Extra Damage"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

assert(GameAssembly.dll+C26A4D,2B CA 89 48 4C)

alloc(newmem,2048,GameAssembly.dll+C26A4D)
alloc(FixedDamage,4)

registersymbol(FixedDamage)

label(returnhere)

FixedDamage:
dd #100

newmem:
  sub ecx,edx              // 原有伤害
  sub ecx,[FixedDamage]    // 额外固定伤害
  mov [rax+4C],ecx         // 写回生命值
  jmp returnhere

GameAssembly.dll+C26A4D:
  jmp newmem

returnhere:


[DISABLE]

GameAssembly.dll+C26A4D:
  db 2B CA 89 48 4C

unregistersymbol(FixedDamage)

dealloc(FixedDamage)
dealloc(newmem)"""

