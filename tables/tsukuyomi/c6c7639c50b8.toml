[[cheat]]
id = "mana-currency-find-after-battle"
name = "Mana Currency (find after battle)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

assert(GameAssembly.dll+C68387,01 91 98 00 00 00)

alloc(newmem,2048,GameAssembly.dll+C68387)
alloc(ManaAddress,8,GameAssembly.dll+C68387)

registersymbol(ManaAddress)

label(returnhere)

ManaAddress:
dq 0

newmem:
  push rax
  lea rax,[rcx+00000098]
  mov [ManaAddress],rax
  pop rax

  add [rcx+00000098],edx
  jmp returnhere

GameAssembly.dll+C68387:
  jmp newmem
  nop

returnhere:


[DISABLE]

GameAssembly.dll+C68387:
  db 01 91 98 00 00 00

unregistersymbol(ManaAddress)

dealloc(ManaAddress)
dealloc(newmem)"""

