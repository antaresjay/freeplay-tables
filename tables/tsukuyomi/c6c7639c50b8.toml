id = "unlimit-energy"
name = "Unlimit Energy"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

assert(GameAssembly.dll+C6C6C9,89 81 80 00 00 00)

alloc(newmem,2048,GameAssembly.dll+C6C6C9)
alloc(EnergyValue,4,GameAssembly.dll+C6C6C9)

registersymbol(EnergyValue)

label(returnhere)

EnergyValue:
dd 4

newmem:
  push rax
  mov eax,[EnergyValue]
  mov [rcx+00000080],eax
  pop rax
  jmp returnhere

GameAssembly.dll+C6C6C9:
  jmp newmem
  nop

returnhere:


[DISABLE]

GameAssembly.dll+C6C6C9:
  db 89 81 80 00 00 00

unregistersymbol(EnergyValue)

dealloc(EnergyValue)
dealloc(newmem)"""

