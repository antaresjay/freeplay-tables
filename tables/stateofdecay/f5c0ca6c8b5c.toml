[[cheat]]
id = "no-reload"
name = "No Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]



aobscanmodule(reload1,StateOfDecay.exe,0F B7 40 06 66 83 F8 FF 74 23)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
movzx esi,word ptr [eax+06]
inc esi
movzx eax,word ptr [eax+06]
cmp ax,-01
jmp return

reload1:
jmp newmem
nop
nop
nop
return:
registersymbol(reload1)

[DISABLE]
reload1:
db 0F B7 40 06 66 83 F8 FF

unregistersymbol(reload1)
dealloc(newmem)"""
