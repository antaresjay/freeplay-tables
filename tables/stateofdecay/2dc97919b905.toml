mov ecx,[eax+edi*4]

exit17:
jmp returnhere17

///
pInventory:
dd 0
pInventoryType:
dd 0
pBagSize:
dd 0
///

inventoryreadAOB: //"StateOfDecay.exe"+11D91A9:
jmp newmem
nop
nop
returnhere:

inventorytypereadAOB: //"StateOfDecay.exe"+11D9180:
jmp newmem2
nop
returnhere2:

inventoryread3AOB: //"StateOfDecay.exe"+11D9321:
