[[cheat]]
id = "unlimited-mana-ectoplasm-spell"
name = "Unlimited mana (ectoplasm spell)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,Core.dll,?? 07 2B C1 ?? 07) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(wontdoit)
label(onlymana)

newmem:

code:
  cmp [edi+0010],1
  jne wontdoit
  cmp [edi+0010],1
  je onlymana

wontdoit:
  mov eax,[edi]
  sub eax,ecx
  mov [edi],eax
  jmp return

onlymana:
  mov [edi],64
  mov eax,[edi]
  sub eax,ecx
  mov [edi],eax
  jmp return

INJECT:
  jmp newmem
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db ?? 07 2B C1 ?? 07

unregistersymbol(INJECT)
dealloc(newmem)

Core.dll+28E0E:
  mov eax,[edi]
  sub eax,ecx
  mov [edi],eax"""

