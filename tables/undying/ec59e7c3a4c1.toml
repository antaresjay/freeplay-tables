[[cheat]]
id = "true-god-mode"
name = "True god mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,Core.dll,64 24 14 D9 17 D9 19 5F) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(youdie)
label(youdont)

newmem:

code:
  cmp [edi+0314],2
  jne youdie
  cmp [edi+0314],2
  je youdont

youdie:
  fst dword ptr [edi]
  fstp dword ptr [ecx]
  pop edi
  jmp return

youdont:
  nop
  fstp dword ptr [ecx]
  pop edi
  jmp return

INJECT+03:
  jmp newmem
return:
registersymbol(INJECT)

[DISABLE]

INJECT+03:
  db D9 17 D9 19 5F

unregistersymbol(INJECT)
dealloc(newmem)

"Core.dll"+2A6C0:
  fst dword ptr [edi]
  fstp dword ptr [ecx]
  pop edi"""

