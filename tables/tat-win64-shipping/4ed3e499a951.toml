[ENABLE]

aobscanmodule(money,TAT-Win64-Shipping.exe,8Bxxxxxxxxxx4189xxC3xx488Bxxxx4533xx4885xx410Fxxxx4Cxxxx4Cxxxxxx0FB6xxxxxxxxxx4188xxC3488Bxxxx4533xx4885xx410Fxxxx4Cxxxx4Cxxxxxx83) // should be unique
alloc(newmem,$1000,money)
alloc(data2,8)
alloc(moneybkp,6)
registersymbol(data2)
registersymbol(money)
registersymbol(moneybkp)
label(code)
label(return)

moneybkp:
  readmem(money,6)

newmem:
  mov [data2],rcx

code:
  readmem(money,6)
  jmp return

money:
  jmp newmem
  nop
return:

[DISABLE]

money:
  readmem(moneybkp,6)

unregistersymbol(*)
dealloc(*)"""

