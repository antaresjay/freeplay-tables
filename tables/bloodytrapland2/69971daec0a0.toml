[[cheat]]
id = "find-player-base-respawn"
name = "Find Player Base (Respawn)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(findplayerbase2,C6 87 A4 00 00 00 01 83)
alloc(newmem,$100)

globalalloc(playerbase,8)

label(code)
label(return)

newmem:

code:
  mov [playerbase],edi
  mov byte ptr [edi+000000A4],01
  jmp return

findplayerbase2:
  jmp newmem
  nop
  nop
return:
registersymbol(findplayerbase2)

[DISABLE]

findplayerbase2:
  db C6 87 A4 00 00 00 01

unregistersymbol(findplayerbase2)
dealloc(newmem)
dealloc(playerbase)
unregistersymbol(playerbase)"""

