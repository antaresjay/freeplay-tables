[[cheat]]
id = "immortal"
name = "Immortal"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanregion(get_godLike,NEON.Game:Killable:TakeDamage,NEON.Game:Killable:TakeDamage+300,0F B6 46 5C 85 C0 74 * 33)
alloc(newmem,$1000,1A79683DF12)
label(code)
label(return)

newmem:
  cmp [rsi+58],1
  jne code
  mov eax,01
  test eax,eax
  jmp return

code:
  movzx eax,byte ptr [rsi+5C]
  test eax,eax
  jmp return

get_godLike:
  jmp newmem
  nop
return:
registersymbol(get_godLike)

[DISABLE]
get_godLike:
  db 0F B6 46 5C 85 C0

unregistersymbol(get_godLike)
dealloc(newmem)"""

