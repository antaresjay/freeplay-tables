[[cheat]]
id = "find-hp-mp-pointers-experimental-see-table-extras"
name = "Find HP/MP Pointers (Experimental) (See Table Extras)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game   : DragonQuestTreasures.exe
  Author : Anon-9

  This script attempts to scan for HP values.
}

[ENABLE]

aobscanmodule(fInfHPScanner,DragonQuestTreasures.exe,F3 0F 10 41 0C C3 CC CC CC CC CC CC CC CC CC CC F3 0F 10 41) // should be unique
alloc(newmem,$1000,fInfHPScanner)

label(ptrChar1 ptrChar2 ptrChar3 ptrChar4)
label(ptrCharMP1 ptrCharMP2 ptrCharMP3 ptrCharMP4)
label(booHPPtrScan ptrR11Test ptrR11Test2)
label(originalCode return)

newmem:
  cmp byte ptr [booHPPtrScan],01
  jne originalCode //Skip if not scanning.
  cmp [ptrR11Test],0
  jne @f
  mov [ptrR11Test],r11
  mov [ptrR11Test2],r11
  sub [ptrR11Test2],D10
  @@:
  cmp [ptrR11Test],r11
  je @f
  cmp [ptrR11Test2],r11
  jne originalCode
  @@:
  //Process rcx
  cmp [ptrChar1],rcx
  je originalCode
  cmp [ptrChar1],0
  jne @f
  mov [ptrChar1],rcx
  mov [ptrCharMP1],rcx
  add [ptrCharMP1],10
  jmp originalCode
  @@:
  cmp [ptrChar2],rcx
  je originalCode
  cmp [ptrChar2],0
  jne @f
  mov [ptrChar2],rcx
  mov [ptrCharMP2],rcx
  add [ptrCharMP2],10
  jmp originalCode
  @@:
  cmp [ptrChar3],rcx
  je originalCode
  cmp [ptrChar3],0
  jne @f
  mov [ptrChar3],rcx
  mov [ptrCharMP3],rcx
  add [ptrCharMP3],10
  jmp originalCode
  @@:
  cmp [ptrChar4],rcx
  je @f
  mov [ptrChar4],rcx
  mov [ptrCharMP4],rcx
  add [ptrCharMP4],10
  @@:
  mov byte ptr [booHPPtrScan],00
originalCode:
  movss xmm0,[rcx+0C]
  ret

ptrChar1:
dq 0

ptrChar2:
dq 0

ptrChar3:
dq 0

ptrChar4:
dq 0

ptrCharMP1:
dq 0

ptrCharMP2:
dq 0

ptrCharMP3:
dq 0

ptrCharMP4:
dq 0

ptrR11Test:
dq 0

ptrR11Test2:
dq 0

booHPPtrScan:
dq 0

fInfHPScanner:
  jmp newmem
return:
registersymbol(ptrChar1 ptrChar2 ptrChar3 ptrChar4)
registersymbol(ptrCharMP1 ptrCharMP2 ptrCharMP3 ptrCharMP4)
registersymbol(booHPPtrScan ptrR11Test ptrR11Test2 fInfHPScanner)
[DISABLE]

fInfHPScanner:
  db F3 0F 10 41 0C

unregistersymbol(ptrChar1 ptrChar2 ptrChar3 ptrChar4)
unregistersymbol(ptrCharMP1 ptrCharMP2 ptrCharMP3 ptrCharMP4)
unregistersymbol(booHPPtrScan ptrR11Test ptrR11Test2 fInfHPScanner)
dealloc(newmem)

