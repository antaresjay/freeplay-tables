[[cheat]]
id = "no-material-loss-experiment"
name = "No Material Loss (Experiment)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : DragonQuestTreasures.exe
  Author : Anon-9

  This script attempts to stop decrease on Sell and set minimum quantities.
}

[ENABLE]

aobscanmodule(funNoSell,DragonQuestTreasures.exe,44 03 79 08 48 8B 3E) // should be unique
alloc(newmem,$1000,funNoSell)

label(code)
label(return varMinItem varMaxItem varIgnoreIfBelowOrEqual skip ptrRemoveSingle)

newmem:

code:
  ptrRemoveSingle:
  cmp [rcx+08],01
  jle @f
  test r15d,r15d
  jns @f
  xor r15d,r15d
  @@:
  add r15d,[rcx+08]
  cmp r15d,[varIgnoreIfBelowOrEqual]
  jl skip
  cmp r15d,[varMinItem]
  jge @f
  mov r15d,[varMinItem]
  jmp skip
  @@:
  cmp r15d,[varMaxItem]
  jle @f
  mov r15d,[varMaxItem]
  skip:
  mov rdi,[rsi]
  jmp return

varMaxItem:
  dq #88

varMinItem:
  dq #16 //16 should be enough for most purposes.

varIgnoreIfBelowOrEqual:
  dq #2

funNoSell:
  jmp newmem
  nop 2
return:
registersymbol(funNoSell varMinItem varMaxItem varIgnoreIfBelowOrEqual ptrRemoveSingle)

[DISABLE]

funNoSell:
  db 44 03 79 08 48 8B 3E

unregistersymbol(funNoSell varMinItem varMaxItem varIgnoreIfBelowOrEqual ptrRemoveSingle)
dealloc(newmem)

