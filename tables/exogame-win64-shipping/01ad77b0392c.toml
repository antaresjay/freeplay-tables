[[cheat]]
id = "main-character-ctrl-numpad-1"
name = "Main Character (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : ExoGame-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.3.2.0
// Game Version      : v0.2.1-13258
// Script Date       : 2025-11-18


[ENABLE]

aobscanmodule(master,ExoGame-Win64-Shipping.exe,488Bxx4889xxxxxxxxxxxx4Cxxxxxxxxxxxxxx488BxxxxxxxxxxE8xxxxxxxx488B) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,11)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,11)

newmem:
  mov [data],rsi

code:
  readmem(master,11)
  jmp return

master:
  jmp newmem
  nop 6
return:

[DISABLE]

master:
  readmem(masterbkp,11)

unregistersymbol(*)
dealloc(*)"""

