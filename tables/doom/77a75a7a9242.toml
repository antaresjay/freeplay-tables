[[cheat]]
id = "godmode-one-hit-kill"
name = "Godmode + One Hit Kill"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(god1,DoomLib.dll,44 29 B3 A4 00 00 00)
alloc(newmem,$1000,god1)

label(code)
label(return)

aobscanmodule(hpDisplay,DoomLib.dll,83 78 24 00 75 26)
alloc(newmem2,$1000,hpDisplay)

label(code2)
label(return2)

newmem:
  cmp r11,0
  je code
  mov [rbx+000000A4],#200
  jmp return

code:
  sub [rbx+000000A4],#9999
  jmp return

god1:
  jmp newmem
  nop 2
return:
registersymbol(god1)

newmem2:
  mov [rax+24],#200

code2:
  cmp dword ptr [rax+24],00
  jne DoomLib.dll+49380
  jmp return2

hpDisplay:
  jmp newmem2
  nop
return2:
registersymbol(hpDisplay)

[DISABLE]
god1:
  db 44 29 B3 A4 00 00 00

unregistersymbol(god1)
dealloc(newmem)

hpDisplay:
  db 83 78 24 00 75 26

unregistersymbol(hpDisplay)
dealloc(newmem2)"""

