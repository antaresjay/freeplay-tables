[[cheat]]
id = "enable-pointer-s"
name = "Enable Pointer's"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : BookShooter.exe
  Version: 
  Date   : 2025-08-25
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,Player:AddExp)
define(bytes,55 48 8B EC 48 81 EC 80 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Player:AddExp)

label(code)
label(return)

newmem:

mov [player_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,00000080
  jmp return

player_ptr:
dq 0

address:
  jmp newmem
  nop 6
return:
registersymbol(player_ptr)
[DISABLE]

address:
  db bytes
  // push rbp
  // mov rbp,rsp
  // sub rsp,00000080

dealloc(newmem)
unregistersymbol(player_ptr)
{
// ORIGINAL CODE - INJECTION POINT: Player:AddExp

1CB0E05AC4C: 41 FF D3              - call r11
1CB0E05AC4F: 08 40 B4              - or [rax-4C],al
1CB0E05AC52: 24 07                 - and al,07
1CB0E05AC54: CB                    - ret 
1CB0E05AC55: 01 00                 - add [rax],eax
1CB0E05AC57: 00 00                 - add [rax],al
1CB0E05AC59: 00 00                 - add [rax],al
1CB0E05AC5B: 00 00                 - add [rax],al
1CB0E05AC5D: 00 00                 - add [rax],al
1CB0E05AC5F: 00                    - db 00 
// ---------- INJECTING HERE ----------
Player:AddExp: 55                    - push rbp
// ---------- DONE INJECTING  ----------
Player:AddExp+1: 48 8B EC              - mov rbp,rsp
Player:AddExp+4: 48 81 EC 80 00 00 00  - sub rsp,00000080
Player:AddExp+b: 48 89 7D F0           - mov [rbp-10],rdi
Player:AddExp+f: 4C 89 7D F8           - mov [rbp-08],r15
Player:AddExp+13: 48 8B F9              - mov rdi,rcx
Player:AddExp+16: 48 89 55 C0           - mov [rbp-40],rdx
Player:AddExp+1a: 4C 89 45 B8           - mov [rbp-48],r8
Player:AddExp+1e: 48 8B C2              - mov rax,rdx
Player:AddExp+21: 85 C0                 - test eax,eax
Player:AddExp+23: 0F 84 62 01 00 00     - je Player:AddExp+18b
}"""

