[[cheat]]
id = "get-resources-strategic-open-research-screen"
name = "Get Resources/Strategic (Open Research Screen)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(getDust,48 8B C1 F3 0F 10 40 38 F3 0F 5A C0 F2 0F 5A C0 48 83 C4 08)
alloc(newmemD,$1000)
alloc(DVal,$4)
alloc(SVal,$4)

label(getDustR)
label(getDustC)
label(getStrgC)
label(getLuxC)
label(EnDust)
label(EnStrg)
label(EnLux)

newmemD:
  cmp byte ptr [rbp+D0],1
  jne getDustC
  cmp dword ptr [rbp+480],#257
  jne getDustC
  cmp byte ptr [EnDust],1
  jne getDustC
  push r8
  mov r8,[DVal]
  mov [rax+28],r8
  mov [rax+30],r8
  mov [rax+38],r8
  pop r8
  getDustC:
  cmp byte ptr [rbp+D8],1
  jne getStrgC
  cmp byte ptr [rbp+4C0],1
  jne getStrgC
  cmp byte ptr [EnStrg],1
  jne getStrgC
  push r8
  mov r8,[SVal]
  mov [rax+28],r8
  mov [rax+30],r8
  mov [rax+38],r8
  pop r8
  getStrgC:
  cmp byte ptr [rbp+D0],1
  jne getLuxC
  cmp byte ptr [rbp+4C0],2
  jne getLuxC
  cmp byte ptr [EnLux],1
  jne getLuxC
  push r8
  mov r8,[SVal]
  mov [rax+28],r8
  mov [rax+30],r8
  mov [rax+38],r8
  pop r8
  getLuxC:
  movss xmm0,[rax+38]
  jmp getDustR

EnDust:
 dd 0
EnStrg:
 dd 0
EnLux:
 dd 0
DVal:
 dd (float)99999.9
SVal:
 dd (float)999.0

getDust+3:
  jmp newmemD
getDustR:
registersymbol(getDust)
registersymbol(EnDust)
registersymbol(EnStrg)
registersymbol(EnLux)

[DISABLE]
getDust+3:
  db F3 0F 10 40 38
unregistersymbol(getDust)
unregistersymbol(EnDust)
unregistersymbol(EnStrg)
unregistersymbol(EnLux)
dealloc(newmemD)
dealloc(DVal)
dealloc(SVal)"""
