[[cheat]]
id = "planet-stats-base-address-scan-to-update-view-manage-planet"
name = "Planet Stats Base Address Scan (To Update: View Manage Planet)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(planetstats_savedAOB)
label(planetstats_returnhere)
label(planetstats_originalcode)
label(planetstats_exit)

label(planetstats_update_exit)
label(planetstats_set_exit)

registersymbol(planetstats_savedAOB)

aobscan(planetstats_searchedAOB,EB D0 48 83 C3 74 48 8B 03 49 89 44 24 F8 49 8B 5C 24 F8)

alloc(planetstats_newmem,2048, planetstats_searchedAOB)


planetstats_newmem:
cmp dword ptr [planetstats_update_enable], #0
je planetstats_update_exit
mov rax, [rsp+d8]
mov [planetstats_basepointer], rax
planetstats_update_exit:

cmp dword ptr [planetstats_set_enable], #0
je planetstats_set_exit
planetstats_set_exit:


planetstats_originalcode:
db 48 83 C3 74 48 8B 03
//add rbx,74
//mov rax,[rbx]

planetstats_exit:
jmp planetstats_returnhere


planetstats_searchedAOB + 2:
planetstats_savedAOB:
jmp planetstats_newmem
nop
nop
planetstats_returnhere:


[DISABLE]
planetstats_savedAOB:
db 48 83 C3 74 48 8B 03
//add rbx,74
//mov rax,[rbx]

unregistersymbol(planetstats_savedAOB)

dealloc(planetstats_newmem)"""

