[[cheat]]
id = "hpregen"
name = "hpregen"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : sh3.exe
  Version: 1.0
  Date   : 2024-06-02
  Author : Gear2 & ParkourPenguin

  Regen to max hp.
  When health is at or below 25% of max hp we will use critRegen.
  Otherwise slowRegen will be used.
}

[ENABLE]

aobscanmodule(totalHpRegen,sh3.exe,D9 81 74 01 00 00)
alloc(newmem,2048)
alloc(critRegen,4)
alloc(slowRegen,4)
alloc(timer,4)
alloc(percentCrit,8)

label(checkDamaged)
label(checkTimeSinceDamaged)
label(addHealth)
label(useCriticalRegen)
label(decreaseTimer)
label(code)
label(return)

critRegen:
  dd (float)0.005

slowRegen:
  dd (float)0.0012

timer:
  dd #1000

percentCrit:
  dd (float)0.25

newmem:
  fld dword ptr [00898660]
  fld dword ptr [00898664]
  fcomi st,st(1)
  ja checkDamaged
  fstp st(0)
  fstp st(0)
  jmp code

checkDamaged:
  cmp byte ptr [0712C663],0
  je checkTimeSinceDamaged
  fstp st(0)
  fstp st(0)
  mov dword ptr [timer],#1000
  jmp code

checkTimeSinceDamaged:
  cmp dword ptr [timer],0
  jg decreaseTimer
  fmul dword ptr [percentCrit]
  fcomip st,st(1)
  ja useCriticalRegen
  fld dword ptr [slowRegen]

addHealth:
  faddp
  fstp dword ptr [00898660]
  jmp code

useCriticalRegen:
  fld dword ptr [critRegen]
  jmp addHealth

decreaseTimer:
  fstp st(0)
  fstp st(0)
  dec dword ptr[timer]

code:
  fld dword ptr [ecx+00000174]
  jmp return

totalHpRegen:
  jmp newmem
  nop
return:
registersymbol(totalHpRegen)
registersymbol(critRegen)
registersymbol(slowRegen)
registersymbol(timer)

[DISABLE]

totalHpRegen:
  db D9 81 74 01 00 00

unregistersymbol(*)
dealloc(*)"""

