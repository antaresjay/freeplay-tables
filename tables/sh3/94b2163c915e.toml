source = """
{ Game   : sh3.exe
  Version: 1.0
  Date   : 2024-05-25
  Author : Gear2

  Change world coloring.
  All Character related colors run through too.
}

[ENABLE]
//------------------------------------------------Red
assert("msvcrt.dll"+88E30,8B 44 8E F0 89 44 8F F0)
define(overRed,"msvcrt.dll"+88E30)
alloc(newmem,2048)
alloc(redValue,4)

label(code)
label(return)

redValue:
  dd (float)0.7

newmem:
  cmp [esi+154],0
  je code
  mov eax,[redValue]
  mov [edi+ecx*4-10],eax
  jmp return

code:
  mov eax,[esi+ecx*4-10]
  mov [edi+ecx*4-10],eax
  jmp return

overRed:
  jmp newmem
  nop 3
return:
registersymbol(overRed)
registersymbol(redValue)

//------------------------------------------------Green
