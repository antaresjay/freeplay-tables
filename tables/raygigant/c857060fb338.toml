[[cheat]]
id = "inf-hp"
name = "Inf. HP"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanmodule(healthWrite1AOB,RayGigant.exe,66 89 4E 10 66 8B C1 5E 5D C2 04 00)
registersymbol(healthWrite1AOB)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
cmp dword ptr [pParty1],0
je originalcode
xor ebp,ebp
@@:
cmp [pParty1+ebp*4],esi
je @f
inc ebp
cmp ebp,2
jle @b
//is not party
jmp originalcode

@@:
//is party
cmp [esi+10],cx
jle originalcode
mov cx,[esi+10]

originalcode:
mov [esi+10],cx
mov ax,cx

exit:
jmp returnhere

///

healthWrite1AOB: //"RayGigant.exe"+3EFC6:
jmp newmem
nop
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
healthWrite1AOB: //"RayGigant.exe"+3EFC6:
db 66 89 4E 10 66 8B C1
//Alt: mov [esi+10],cx
//Alt: mov ax,cx"""

