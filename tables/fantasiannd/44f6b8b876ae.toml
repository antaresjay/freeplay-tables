type = "script"
source = """
[ENABLE]

/// SubHP from Battle.ActorStatus
aobscanmodule(DamageModAOB1,"GameAssembly.dll",40 53 48 83 EC 20 8B DA 8B 51 20 3B D3 0F 48 DA)
