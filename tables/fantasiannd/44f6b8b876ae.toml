label(fHeroHealingMult)
registersymbol(fHeroHealingMult)
label(fEnemyHealingMult)
registersymbol(fEnemyHealingMult)

newmem:
  mov [R15Save],r15
  mov r15,[rcx+10]
  test r15,r15
  je MyCleanUp1
  mov r15,[r15+50]
  test r15,r15
  je MyCleanUp1
  mov r15,[r15+28]
  test r15,r15
  je MyCleanUp1
  cmp dword ptr [r15+18],0
  je HeroHit
  jmp EnemyHit
HeroHit:
HeroDamageHit:
  mov r15,fHeroDamageMult
  cmp [r15],(float)0.0
  je CheckGodMode
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [r15]
  fistp dword ptr [rsp]
  pop edx
CheckGodMode:
  mov r15,GodMode
  cmp dword ptr [r15],1
  jne CheckHeroCannotDie
  xor edx,edx
  jmp MyCleanUp1
CheckHeroCannotDie:
  mov r15,HeroCannotDie
  cmp dword ptr [r15],1
  jne MyCleanUp1
  cmp edx,[rcx+20]
  jl @F
  xor edx,edx
@@:
  jmp MyCleanUp1  
EnemyHit:
EnemyDamageHit:
  mov r15,fEnemyDamageMult
  cmp [r15],(float)0.0
  je CheckOneHitKill
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [r15]
  fistp dword ptr [rsp]
  pop edx
CheckOneHitKill:
  mov r15,OneHitKill
  cmp dword ptr [r15],1
  jne MyCleanUp1
  mov edx,[rcx+20]
  jmp MyCleanUp1

MyCleanUp1:  
  mov r15,[R15Save]
  jmp originalcode
  
originalcode:
DamageModAOB1Save:
  readmem(DamageModAOB1,16)
  jmp DamageModAOB1+10

R15Save:
dq 0
GodMode:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)2.0
fHeroDamageMult:
dq (float)0.25
HeroCannotDie:
dq 1

newmem2:
  mov [R15Save2],r15
  mov r15,[rcx+10]
  test r15,r15
  je MyCleanUp2
  mov r15,[r15+50]
  test r15,r15
  je MyCleanUp2
  mov r15,[r15+28]
  test r15,r15
  je MyCleanUp2
  cmp dword ptr [r15+18],0
  je HeroHit2
  jmp EnemyHit2
HeroHit2:
HeroHealingHit2:
  mov r15,fHeroHealingMult
  cmp [r15],(float)0.0
  je MyCleanUp2
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [r15]
  fistp dword ptr [rsp]
  pop edx
  jmp MyCleanUp2
EnemyHit2:
EnemyHealingHit2:
  mov r15,fEnemyHealingMult
  cmp [r15],(float)0.0
  je MyCleanUp2
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [r15]
  fistp dword ptr [rsp]
  pop edx
  jmp MyCleanUp2

MyCleanUp2:  
  mov r15,[R15Save2]
  jmp originalcode2
  
originalcode2:
DamageModAOB2Save:
  readmem(DamageModAOB2,7)
  jmp DamageModAOB2+07

R15Save2:
dq 0
fEnemyHealingMult:
dq (float)1.0
fHeroHealingMult:
dq (float)1.0

///
DamageModAOB1:
  jmp newmem
  return:

///
DamageModAOB2:
  jmp newmem2
  return2:

[DISABLE]

///
DamageModAOB1:
  readmem(DamageModAOB1Save,16)

unregistersymbol(DamageModAOB1)
unregistersymbol(DamageModAOB1Save)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fHeroDamageMult)

///
DamageModAOB2:
  readmem(DamageModAOB2Save,7)

unregistersymbol(DamageModAOB2)
unregistersymbol(DamageModAOB2Save)
unregistersymbol(fEnemyHealingMult)
unregistersymbol(fHeroHealingMult)

///
dealloc(newmem)
dealloc(newmem2)"""

