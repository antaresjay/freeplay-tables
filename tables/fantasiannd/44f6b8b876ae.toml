  jmp newmem
  return:
  
[DISABLE]

InfiniteItemUsageAOB1:
  readmem(InfiniteItemUsageAOB1Save,7)
  
unregistersymbol(InfiniteItemUsageAOB1)
unregistersymbol(InfiniteItemUsageAOB1Save)
