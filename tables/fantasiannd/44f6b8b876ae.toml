source = """
[ENABLE]

/// This is call when using/selling items
//aobscanmodule(InfiniteItemUsageAOB1,"GameAssembly.dll",44 8B 48 18 41 39 D9 0F 8C 86 00 00 00)
//aobscanmodule(InfiniteItemUsageAOB1,"GameAssembly.dll",44 8B 48 18 41 39 D9)
