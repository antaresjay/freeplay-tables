label(return)
label(originalcode)
label(SetItemAmount)
registersymbol(SetItemAmount)
label(OverrideItemQty)
registersymbol(OverrideItemQty)
label(InfiniteItemUsageAOB1Save)
registersymbol(InfiniteItemUsageAOB1Save)

///
newmem:
  // Check If Key Item or Quest Item
  mov [R14Save],r14
  mov [R15Save],r15
  mov r15,[rax+20]
  test r15,r15
  je DoInfiniteItem
  mov r15,[r15+20]
  test r15,r15
  je DoInfiniteItem
  mov r14,5F00790065004B
  cmp [r15+1E],r14
  je MyCleanUp1
  mov r14,73006500750051
  cmp [r15+1E],r14
  je MyCleanUp1  
DoInfiniteItem:
  xor ebx,ebx
DoMin:
  mov r9d,[rax+18]
  cmp [OverrideItemQty],1
  je ForceItemQty
  cmp r9d,[SetItemAmount]
  jge MyCleanUp1
ForceItemQty:
  mov r9d,[SetItemAmount]
  mov [rax+18],r9d
  jmp MyCleanUp1

MyCleanUp1:
  mov r14,[R14Save]
  mov r15,[R15Save]
  jmp originalcode
  
originalcode:
InfiniteItemUsageAOB1Save:
  readmem(InfiniteItemUsageAOB1,7)
  jmp InfiniteItemUsageAOB1+07

R14Save:
dq 0
R15Save:
dq 0
SetItemAmount:
dq #5
OverrideItemQty:
dq 0

/// 
