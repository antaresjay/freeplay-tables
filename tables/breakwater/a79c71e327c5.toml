[[cheat]]
id = "unlimited-stamina"
name = "Unlimited Stamina"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(stamina_aob,GameAssembly.dll,F3 0F 10 4F 44 45 33 C0 F3 0F 5E 4F 40 e8 * * * * 48 8b)
alloc(newmem,$1000,stamina_aob)

label(code)
label(return)

newmem:

fld [rdi+40]
fstp [rdi+44]
code:
movss xmm1,[rdi+44]
jmp return

stamina_aob:
jmp newmem
return:
registersymbol(stamina_aob)

[DISABLE]

stamina_aob:
db F3 0F 10 4F 44

unregistersymbol(stamina_aob)
dealloc(newmem)"""

