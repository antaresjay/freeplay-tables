[[cheat]]
id = "invulnerable"
name = "Invulnerable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(aobinvulnerable,DevilMayCry5.exe,83 BB B0 02 00 00 FF 0F 85 * * * * 80 BB * * 00 00 00 0F 85 * * * * 80 BB * * 00 00 00) // should be unique
alloc(newmem,$1000,"DevilMayCry5.exe")
label(code)
label(return)
label(skipcode)

newmem:
  push rax
  push rcx
  mov rax,[rbx+A8]
  test rax,rax
  je short code
  mov rax,[rax+10]
  test rax,rax
  je short code
  mov rcx,0061006C0050002F //'/Pla'
  cmp [rax+20],rcx
  jne short code
  mov rcx,002F007200650079 //'yer/'
  cmp [rax+28],rcx
  jne short code
  cmp rsp,0
  jmp short skipcode

code:
  cmp dword ptr [rbx+000002B0],-01
skipcode:
  pop rcx
  pop rax
  jmp return

aobinvulnerable:
  jmp newmem
  nop
  nop
return:
registersymbol(aobinvulnerable)

[DISABLE]
aobinvulnerable:
  db 83 BB B0 02 00 00 FF
dealloc(newmem)
unregistersymbol(aobinvulnerable)"""

[[cheat]]
id = "health"
name = "Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : DevilMayCry5.exe
  Version: 
  Date   : 2019-03-08
  Author : Jessie Kazama
}

[ENABLE]

aobscanmodule(health,DevilMayCry5.exe,F3 0F 11 4F 10 48 85)
alloc(newmem,$1000,health)

label(code)
label(return)
label(infhpf)
label(ohkf)
label(ohkchk)

registersymbol(health)
registersymbol(infhpf)
registersymbol(ohkf)

newmem:
  cmp [infhpf],1
  jne code
  {cmp [rdi+160],0
  jne ohkchk
  cmp [rdi+E8],1
  jne ohkchk
  cmp [rdi+F8],1
  jne ohkchk
  cmp [rdi+108-110],0
  jne ohkchk}
  cmp byte ptr [rdi+134],'P'
  jne ohkchk
  cmp byte ptr [rdi+136],'l'
  jne ohkchk
  cmp byte ptr [rdi+138],'a'
  jne ohkchk
  cmp byte ptr [rdi+13A],'y'
  jne ohkchk
  fld [rdi+14]
  fstp [rdi+10]
  jmp return

ohkchk:
  cmp [ohkf],1
  jne code
  xorps xmm1,xmm1

code:
  movss [rdi+10],xmm1
  jmp return

infhpf:
  dq 0

ohkf:
  dq 0

health:
  jmp newmem
return:

[DISABLE]

health:
  db F3 0F 11 4F 10

unregistersymbol(health)
unregistersymbol(infhpf)
unregistersymbol(ohkf)
dealloc(newmem)"""

