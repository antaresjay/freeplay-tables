name = "Unlocked Crew"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Acid Planet.exe
  Version: 
  Date   : 2024-12-01
  Author : BabyGroot

  This script does blah blah blah
}

define(address,MenuButton:SelectCrew+2b)
define(bytes,0F B6 86 B0 01 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,MenuButton:SelectCrew+2b)

label(code)
label(return)

newmem:
  mov byte ptr [rsi+000001B0],1

code:
  movzx eax,byte ptr [rsi+000001B0]
  jmp return

address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  db bytes
  // movzx eax,byte ptr [rsi+000001B0]

dealloc(newmem)"""

