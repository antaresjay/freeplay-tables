[[cheat]]
id = "x-set-relations-popularity-high-must-click-on-a-person-from-each-neighborhood-village"
name = "[X] <== Set Relations/Popularity High (Must click on a person from each Neighborhood/Village)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(get_relationship_score,Guild3.exe,f3 0f 10 81 ? ? ? ? 48 83 c4 ? c3 0f 57 c0)
alloc(newmem,$100,get_relationship_score)

label(code)
label(return)
label(get_relationship_scoreread)
registersymbol(get_relationship_scoreread)

newmem:
  push rsi
  push rdi
  mov rsi, [rcx+88]    //Pointer to instance of gfc::Family
  mov rdi,money       //player family address (gfc::Family)
  mov rdi,[rdi]
  cmp rsi,rdi
  jne code
  xor rsi,rsi
  mov esi,[get_relationship_scoreread+4]
  mov [rcx+rsi],(float)100
code:
  pop rdi
  pop rsi
  readmem(get_relationship_score,8)
  jmp return

get_relationship_scoreread:
readmem(get_relationship_score,8)

get_relationship_score:
  jmp newmem
  nop 3
return:
