type = "script"
source = """
[ENABLE]
aobscanmodule(influencecd,Guild3.exe,CC 8B 81 18 01 00 00) 
alloc(newmem,$1000,"Guild3.exe"+2E1C80)

label(code)
label(return)

newmem:
code:
  mov [rcx+00000118], #99999
  mov eax,[rcx+00000118]
  jmp return

influencecd+01:
  jmp newmem
  nop
return:
registersymbol(influencecd)

[DISABLE]

influencecd+01:
  db 8B 81 18 01 00 00

unregistersymbol(influencecd)
dealloc(newmem)"""
