type = "script"
source = """
[ENABLE]
aobscanmodule(aobcombo,SamuraiWarriors4DX.exe,41 03 C8 41 3B CA * 0F 43 * 66 89 * * * 00 00 * 8B * * * * * * 8B)
alloc(newmem,$1000,aobcombo)
label(code)
label(return)

newmem:
  mov r8d,#9999
code:
  add ecx,r8d
  cmp ecx,r10d
  jmp return

aobcombo:
  jmp newmem
  nop
return:
registersymbol(aobcombo)

[DISABLE]
aobcombo:
  db 41 03 C8 41 3B CA
dealloc(newmem)"""
