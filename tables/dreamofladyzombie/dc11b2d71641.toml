[[cheat]]
id = "unlimited-broken-jade"
name = "Unlimited Broken Jade"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(JadeRefresh,ResourceManager:AddStone,ResourceManager:AddStone+13f,89 48 3C 48 8B 47 30)
alloc(newmem,$1000,JadeRefresh)

label(code)
label(return)

newmem:

code:
  mov [rax+3C],#999//ecx
  mov rax,[rdi+30]
  jmp return

JadeRefresh:
  jmp newmem
  nop 2
return:
registersymbol(JadeRefresh)

[DISABLE]

JadeRefresh:
  db 89 48 3C 48 8B 47 30

unregistersymbol(JadeRefresh)
dealloc(newmem)"""
