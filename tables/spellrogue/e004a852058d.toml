source = """
// Game Executable   : SpellRogue.exe
// Author            : ndck76
// Executable Version: 6000.0.30.45147
// Game Version      : v1.0.0
// Script Date       : 2025-04-28


[ENABLE]

aobscanregion(gold,Wiz.SessionStateHandler:AddGold,Wiz.SessionStateHandler:AddGold+200,486390xxxx000003xx48xxxx48xxxxxx49BBxxxxxxxxxxxx000041xxxx48xxxxxx48xxxxxx48xxxxxx) //Wiz.SessionStateHandler:AddGold+1e
alloc(newmem,$1000,gold)
alloc(data2,8)
alloc(goldbkp,7)
registersymbol(data2)
registersymbol(gold)
registersymbol(goldbkp)
label(code)
label(return)

goldbkp:
  readmem(gold,7)

newmem:
  mov [data2],rax

code:
  readmem(gold,7)
  jmp return

gold:
  jmp newmem
  nop 2
return:

[DISABLE]

gold:
  readmem(goldbkp,7)

unregistersymbol(*)
dealloc(*)"""

