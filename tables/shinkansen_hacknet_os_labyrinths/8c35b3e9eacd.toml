registersymbol(Computer_playercompset_enable)

alloc(Computer_basepointer, 4)
alloc(Computer_update_enable, 4)
alloc(Computer_set_enable, 4)
alloc(Computer_proxyset_enable, 4)
alloc(Computer_firewallset_enable, 4)
alloc(Computer_portset_enable, 4)
alloc(Computer_playercompset_enable, 4)


[DISABLE]
unregistersymbol(Computer_basepointer)
unregistersymbol(Computer_update_enable)
unregistersymbol(Computer_set_enable)
unregistersymbol(Computer_proxyset_enable)
unregistersymbol(Computer_firewallset_enable)
unregistersymbol(Computer_portset_enable)
unregistersymbol(Computer_playercompset_enable)

dealloc(Computer_basepointer)
dealloc(Computer_update_enable)
dealloc(Computer_set_enable)
dealloc(Computer_proxyset_enable)
dealloc(Computer_firewallset_enable)
dealloc(Computer_portset_enable)
unregistersymbol(Computer_playercompset_enable)"""

[[cheat]]
id = "computer-base-address-scan-to-activate-connect-to-computerl-to-update-connect-to-computer"
name = "Computer Base Address Scan (To Activate: Connect To Computerl, To Update: Connect To Computer)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Computer_savedAOB)
label(Computer_returnhere)
label(Computer_originalcode)
label(Computer_exit)

label(Computer_update_exit)
label(Computer_set_exit)
label(Computer_proxyset_exit)
label(Computer_firewallset_exit)
label(Computer_portset_exit)
label(Computer_playercompset_exit)

registersymbol(Computer_savedAOB)

//Hacknet.Computer::connect+C9 - 39 09                 - cmp [ecx],ecx
//Hacknet.Computer::connect+CB - FF 15 50EEC105        - call dword ptr [05C1EE50]
//Hacknet.Computer::connect+D1 - C6 46 76 00           - mov byte ptr [esi+76],00
//Hacknet.Computer::connect+D5 - B8 01000000           - mov eax,00000001
//Hacknet.Computer::connect+DA - 5B                    - pop ebx
//Hacknet.Computer::connect+DB - 5E                    - pop esi
//Hacknet.Computer::connect+DC - 5F                    - pop edi
//Hacknet.Computer::connect+DD - 5D                    - pop ebp
//Hacknet.Computer::connect+DE - C3                    - ret
aobscan(Computer_searchedAOB, C6 46 76 00 B8 01 00 00 00 5B 5E 5F 5D C3)

alloc(Computer_newmem, 2048, Computer_searchedAOB)
alloc(Computer_temp1, 4, Computer_searchedAOB)
alloc(Computer_temp2, 4, Computer_searchedAOB)
alloc(Computer_temp3, 4, Computer_searchedAOB)
alloc(Computer_temp4, 4, Computer_searchedAOB)
alloc(Computer_temp5, 4, Computer_searchedAOB)


Computer_newmem:
mov [Computer_temp1], eax
mov [Computer_temp2], ebx
mov [Computer_temp3], ecx
mov [Computer_temp4], edx

cmp dword ptr [Computer_update_enable], #0
je Computer_update_exit
mov [Computer_basepointer], esi
Computer_update_exit:

cmp dword ptr [Computer_set_enable], #0
je Computer_set_exit
Computer_set_exit:

cmp dword ptr [Computer_proxyset_enable], #0
je Computer_proxyset_exit
mov byte ptr [esi+7a], #0
Computer_proxyset_exit:

cmp dword ptr [Computer_firewallset_enable], #0
je Computer_firewallset_exit
cmp dword ptr [esi+44], #0
je Computer_firewallset_exit
mov ebx, [esi+44]
mov byte ptr [ebx+18], #1
Computer_firewallset_exit:

cmp dword ptr [Computer_portset_enable], #0
je Computer_portset_exit
mov [esi+5c], #-1
Computer_portset_exit:

cmp dword ptr [Computer_playercompset_enable], #0
je Computer_playercompset_exit
// playerComp
cmp dword ptr [esi+8], #0
je Computer_playercompset_exit
mov ebx, [esi+8]
cmp dword ptr [ebx+8], #07078000
jne Computer_playercompset_exit
cmp dword ptr [ebx+c], #7929953
jne Computer_playercompset_exit
cmp dword ptr [ebx+10], #7471205
jne Computer_playercompset_exit
cmp dword ptr [ebx+14], #7274563
jne Computer_playercompset_exit
mov byte ptr [esi+7a], #1
mov [esi+5c], #999
cmp dword ptr [esi+44], #0
je Computer_firewallset_exit
mov ebx, [esi+44]
mov byte ptr [ebx+18], #0
Computer_playercompset_exit:


mov eax, [Computer_temp1]
mov ebx, [Computer_temp2]
mov ecx, [Computer_temp3]
mov edx, [Computer_temp4]


Computer_originalcode:
db C6 46 76 00 B8 01 00 00 00
//mov byte ptr [esi+76],00
//mov eax,00000001


Computer_exit:
jmp Computer_returnhere


Computer_searchedAOB:
Computer_savedAOB:
jmp Computer_newmem
nop
nop
nop
nop
Computer_returnhere:


[DISABLE]
Computer_savedAOB:
db C6 46 76 00 B8 01 00 00 00
//mov byte ptr [esi+76],00
//mov eax,00000001

unregistersymbol(Computer_savedAOB)

dealloc(Computer_newmem)
dealloc(Computer_temp1)
dealloc(Computer_temp2)
dealloc(Computer_temp3)
dealloc(Computer_temp4)
dealloc(Computer_temp5)"""

