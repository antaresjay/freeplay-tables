[[cheat]]
id = "os-base-address-scan-initialization-activate-this-first"
name = "OS Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(OS_basepointer)
registersymbol(OS_update_enable)
registersymbol(OS_set_enable)
registersymbol(OS_traceset_enable)
registersymbol(OS_ramset_enable)

alloc(OS_basepointer, 4)
alloc(OS_update_enable, 4)
alloc(OS_set_enable, 4)
alloc(OS_traceset_enable, 4)
alloc(OS_ramset_enable, 4)


[DISABLE]
unregistersymbol(OS_basepointer)
unregistersymbol(OS_update_enable)
unregistersymbol(OS_set_enable)
unregistersymbol(OS_traceset_enable)
unregistersymbol(OS_ramset_enable)

dealloc(OS_basepointer)
dealloc(OS_update_enable)
dealloc(OS_set_enable)
dealloc(OS_traceset_enable)
dealloc(OS_ramset_enable)"""

[[cheat]]
id = "os-base-address-scan-to-activate-play-level-to-update-play-level"
name = "OS Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(OS_savedAOB)
label(OS_returnhere)
label(OS_originalcode)
label(OS_exit)

label(OS_update_exit)
label(OS_set_exit)
label(OS_traceset_exit)
label(OS_ramset_exit)

registersymbol(OS_savedAOB)

//Hacknet.OS::Update+7D - 8B 45 8C              - mov eax,[ebp-74]
//Hacknet.OS::Update+80 - D9 45 DC              - fld dword ptr [ebp-24]
//Hacknet.OS::Update+83 - D8 80 50010000        - fadd dword ptr [eax+00000150]
//Hacknet.OS::Update+89 - D9 98 50010000        - fstp dword ptr [eax+00000150]
//Hacknet.OS::Update+8F - 8B 45 8C              - mov eax,[ebp-74]
//Hacknet.OS::Update+92 - 80 B8 5F010000 00     - cmp byte ptr [eax+0000015F],00
aobscan(OS_searchedAOB, D8 80 50 01 00 00 D9 98 50 01 00 00)

alloc(OS_newmem, 2048, OS_searchedAOB)
alloc(OS_temp1, 4, OS_searchedAOB)
alloc(OS_temp2, 4, OS_searchedAOB)
alloc(OS_temp3, 4, OS_searchedAOB)
alloc(OS_temp4, 4, OS_searchedAOB)
alloc(OS_temp5, 4, OS_searchedAOB)


OS_newmem:
mov [OS_temp1], eax
mov [OS_temp2], ebx
mov [OS_temp3], ecx
mov [OS_temp4], edx

cmp dword ptr [OS_update_enable], #0
je OS_update_exit
mov [OS_basepointer], eax
OS_update_exit:

cmp dword ptr [OS_set_enable], #0
je OS_set_exit
OS_set_exit:

cmp dword ptr [OS_traceset_enable], #0
je OS_traceset_exit
cmp dword ptr [eax+80], #0
je OS_traceset_exit
mov ebx, [eax+80]
mov [ebx+20], (float)0
OS_traceset_exit:

cmp dword ptr [OS_ramset_enable], #0
je OS_ramset_exit
mov [eax+138], #9999999
OS_ramset_exit:


mov eax, [OS_temp1]
mov ebx, [OS_temp2]
mov ecx, [OS_temp3]
mov edx, [OS_temp4]


OS_originalcode:
db D8 80 50 01 00 00
//fadd dword ptr [eax+00000150]


OS_exit:
jmp OS_returnhere


OS_searchedAOB:
OS_savedAOB:
jmp OS_newmem
nop
OS_returnhere:


[DISABLE]
OS_savedAOB:
db D8 80 50 01 00 00
//fadd dword ptr [eax+00000150]

unregistersymbol(OS_savedAOB)

dealloc(OS_newmem)
dealloc(OS_temp1)
dealloc(OS_temp2)
dealloc(OS_temp3)
dealloc(OS_temp4)
dealloc(OS_temp5)"""

