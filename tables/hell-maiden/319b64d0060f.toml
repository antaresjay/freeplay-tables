[[cheat]]
id = "cheat"
name = "𝐄𝐧𝐚𝐛𝐥𝐞"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Hell Maiden.exe
  Date   : 2025-10-16
  Author : Sianz
}

[ENABLE]

aobscanregion(player,AstralShift.HellMaiden.Player.PlayerMovement:Update,AstralShift.HellMaiden.Player.PlayerMovement:Update+100,48 8B 46 ?? 48 8B C8) // should be unique
alloc(newmem,$1000,player)
alloc(stats,8)
label(code)
label(return)

newmem:
  cmp dword ptr [rsi+38],0
  je skip
  test rsi,rsi
  je skip
  mov [stats],rsi
  skip:
code:
  mov rax,[rsi+38]
  mov rcx,rax
  jmp return

player:
  jmp newmem
  nop 2
return:
registersymbol(player stats)

[DISABLE]

player:
  db 48 8B 46 38 48 8B C8

unregistersymbol(*)
dealloc(*)"""

