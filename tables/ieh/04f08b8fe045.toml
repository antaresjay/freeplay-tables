[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//Send@FearlessRevolution|Sintrix
aobscanregion(health,Ally1:set_currentHp+74,Ally1:set_currentHp+86,F2 0F 11 80 10 01 00 00 48 83)
alloc(newmem,$1000,health)

label(code)
label(return)

newmem:
movsd xmm0,[new]
code:
  movsd [rax+00000110],xmm0
  jmp return

new:
dq (double)99999

health:
  jmp newmem
  nop 3
return:
registersymbol(health)

[DISABLE]

health:
  db F2 0F 11 80 10 01 00 00

unregistersymbol(*)
dealloc(*)"""

