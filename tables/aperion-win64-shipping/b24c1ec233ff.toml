  jmp return

skillonoff:
  dd (float)0

archonfuryonoff:
  dd (float)0

infthrow:
  dd (float)0

onehitkill:
  dd (float)0

enemyhp:
  dd (float)10

SkillNoDelay:
  jmp newmem
  nop 3
return:
registersymbol(SkillNoDelay)
