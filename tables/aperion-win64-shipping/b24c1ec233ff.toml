label(code3)
label(code2)
label(code)
label(return)

label(skillonoff)
label(archonfuryonoff)
label(infthrow)
label(onehitkill)

label(enemyhp)

newmem:
  cvtsd2ss xmm0,xmm2
  cmp [skillonoff],(float)1
  jne code3
  cmp [rdx+4],(float)1
  jne code2
  movss xmm0, [rdx+4]
  jmp code

code2:
  cmp [rdx+8],(float)1
  jne code3
  movss xmm0, [rdx+8]
  jmp code

code3:
  cmp [archonfuryonoff],(float)1
  jne code4
  cmp [rdx+48],(float)180
  jne code4
  movss xmm0,[rdx+10]
  jmp code

code4:
  cmp [infthrow],(float)1
  jne code5
  cmp [rdx+C],(float)1
  jne code5
  movss xmm0,[rdx+C]
  jmp code


code5:
  cmp [onehitkill],(float)1
  jne code
  cmp [rdx],(float)100
  jl code
