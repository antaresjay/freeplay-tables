source = """
{ Game   : Aperion-Win64-Shipping.exe
  Version: 
  Date   : 2020-11-13
  Author : Emoisback

  This script set full charged our skill cooldown and Archon Fury
}

[ENABLE]

aobscanmodule(SkillNoDelay,Aperion-Win64-Shipping.exe,F2 0F 5A C2 F3 0F 11 02) // should be unique
alloc(newmem,$1000,"Aperion-Win64-Shipping.exe"+1952483)
label(code4)
label(code3)
label(code2)
label(code)
label(return)

label(skillonoff)
label(archonfuryonoff)
label(infthrow)
label(onehitkill)

label(enemyhp)

newmem:
  cvtsd2ss xmm0,xmm2
  cmp [skillonoff],(float)1
  jne code3
  cmp [rdx+4],(float)1
  jne code2
  movss xmm0, [rdx+4]
  jmp code

code2:
  cmp [rdx+8],(float)1
  jne code3
  movss xmm0, [rdx+8]
  jmp code

code3:
  cmp [archonfuryonoff],(float)1
  jne code4
  cmp [rdx+48],(float)180
  jne code4
  movss xmm0,[rdx+10]
  jmp code

code4:
  cmp [infthrow],(float)1
  jne code5
  cmp [rdx+C],(float)1
  jne code5
  movss xmm0,[rdx+C]
  jmp code


code5:
  cmp [onehitkill],(float)1
  jne code
  cmp [rdx],(float)100
  jl code
  cmp [rdx+108],(float)0
  jne code
  cmp [rdx-14],(float)800
  jne code
  movss xmm0,[enemyhp]
  jmp code

code:
  movss [rdx],xmm0
  jmp return

skillonoff:
  dd (float)0

archonfuryonoff:
  dd (float)0

infthrow:
  dd (float)0

onehitkill:
  dd (float)0

enemyhp:
  dd (float)10

SkillNoDelay:
  jmp newmem
  nop 3
return:
registersymbol(SkillNoDelay)
registersymbol(skillonoff)
registersymbol(archonfuryonoff)
registersymbol(infthrow)
registersymbol(onehitkill)
[DISABLE]

SkillNoDelay:
  db F2 0F 5A C2 F3 0F 11 02

