type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(player)
define(pCOM,ACTOFWAR.EXE+008E5328)
define(pCO1,ACTOFWAR.EXE+008E5310)

aobscanmodule(healthconfirm,ACTOFWAR.EXE,8B 45 08 89 43 1C 8B C3 e8 * * * * 33 C0 5A 59 59 64 89 10 68 * * * * 8D 45 F0 BA 04 00 00 00 e8 * * * *  C3 e9 * * * *  eb eb 5e )
registersymbol(healthconfirm)
newmem:
mov eax,[ebx+0c]
test eax,eax
jz originalcode
mov eax,[eax+34]
cmp eax,[pCOM]
je player
cmp eax,[pCO1]
jne originalcode
player:
mov eax,[ebx+18]
cmp eax,(float)1000000.0
jge originalcode
mov eax,[ebx+18]
mov [ebp+08],eax
originalcode:
mov eax,[ebp+08]
mov [ebx+1C],eax
jmp returnhere

healthconfirm:
jmp newmem
nop
returnhere:





[DISABLE]
dealloc(newmem)
healthconfirm:
db 8B 45 08 89 43 1C
unregistersymbol(healthconfirm)"""
