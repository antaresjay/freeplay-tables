[[cheat]]
id = "fpsplayer-base-address-scan-initialization-activate-this-first"
name = "FPSPlayer Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(FPSPlayer_basepointer)
registersymbol(FPSPlayer_update_enable)
registersymbol(FPSPlayer_set_enable)
registersymbol(FPSPlayer_hitpointsset_enable)
registersymbol(FPSPlayer_hungerset_enable)
registersymbol(FPSPlayer_nodamageset_enable)
registersymbol(FPSPlayer_weaponset_enable)
registersymbol(FPSPlayer_ammoset_enable)

alloc(FPSPlayer_basepointer, 8)
alloc(FPSPlayer_update_enable, 4)
alloc(FPSPlayer_set_enable, 4)
alloc(FPSPlayer_hitpointsset_enable, 4)
alloc(FPSPlayer_hungerset_enable, 4)
alloc(FPSPlayer_nodamageset_enable, 4)
alloc(FPSPlayer_weaponset_enable, 4)
alloc(FPSPlayer_ammoset_enable, 4)


[DISABLE]
unregistersymbol(FPSPlayer_basepointer)
unregistersymbol(FPSPlayer_update_enable)
unregistersymbol(FPSPlayer_set_enable)
unregistersymbol(FPSPlayer_hitpointsset_enable)
unregistersymbol(FPSPlayer_hungerset_enable)
unregistersymbol(FPSPlayer_nodamageset_enable)
unregistersymbol(FPSPlayer_weaponset_enable)
unregistersymbol(FPSPlayer_ammoset_enable)

dealloc(FPSPlayer_basepointer)
dealloc(FPSPlayer_update_enable)
dealloc(FPSPlayer_set_enable)
dealloc(FPSPlayer_hitpointsset_enable)
dealloc(FPSPlayer_hungerset_enable)
dealloc(FPSPlayer_nodamageset_enable)
dealloc(FPSPlayer_weaponset_enable)
dealloc(FPSPlayer_ammoset_enable)"""

[[cheat]]
id = "fpsplayer-base-address-scan-to-activate-battle-to-update-battle"
name = "FPSPlayer Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(FPSPlayer_savedAOB)
label(FPSPlayer_returnhere)
label(FPSPlayer_originalcode)
label(FPSPlayer_exit)

label(FPSPlayer_update_exit)
label(FPSPlayer_set_exit)
label(FPSPlayer_hitpointsset_exit)
label(FPSPlayer_hungerset_exit)
label(FPSPlayer_nodamageset_exit)
label(FPSPlayer_weaponset_exit)
label(FPSPlayer_ammoset_exit)

registersymbol(FPSPlayer_savedAOB)

//127CC99E - 33 C0                 - xor eax,eax
//127CC9A0 - 48 89 85 70FEFFFF     - mov [rbp-00000190],rax
// FPSPlayer:FixedUpdate+47
//127CC9A7 - 89 85 78FEFFFF        - mov [rbp-00000188],eax
//127CC9AD - 48 8B 4E 38           - mov rcx,[rsi+38]
//127CC9B1 - 33 D2                 - xor edx,edx
//127CC9B3 - 48 83 EC 20           - sub rsp,20
//127CC9B7 - 49 BB 20384C0500000000 - mov r11,00000000054C3820 : [EC8B4855]
aobscan(FPSPlayer_searchedAOB, 89 85 78 FE FF FF 48 8B 4E 38 33 D2)

alloc(FPSPlayer_newmem, 2048, FPSPlayer_searchedAOB)
alloc(FPSPlayer_temp1, 8, FPSPlayer_searchedAOB)
alloc(FPSPlayer_temp2, 8, FPSPlayer_searchedAOB)


FPSPlayer_newmem:
mov [FPSPlayer_temp1], rbx
mov [FPSPlayer_temp2], rdx

cmp dword ptr [FPSPlayer_update_enable], #0
je FPSPlayer_update_exit
mov [FPSPlayer_basepointer], rsi
FPSPlayer_update_exit:

cmp dword ptr [FPSPlayer_set_enable], #0
je FPSPlayer_set_exit
FPSPlayer_set_exit:

cmp dword ptr [FPSPlayer_hitpointsset_enable], #0
je FPSPlayer_hitpointsset_exit
fld [rsi+1c4]
fstp [rsi+1c0]
FPSPlayer_hitpointsset_exit:

cmp dword ptr [FPSPlayer_hungerset_enable], #0
je FPSPlayer_hungerset_exit
mov [rsi+1ec], (float)0
FPSPlayer_hungerset_exit:

cmp dword ptr [FPSPlayer_nodamageset_enable], #0
je FPSPlayer_nodamageset_exit
mov byte ptr [rsi+295], #0
FPSPlayer_nodamageset_exit:

cmp dword ptr [FPSPlayer_weaponset_enable], #0
je FPSPlayer_weaponset_exit
cmp qword ptr [rsi+48], #0
je FPSPlayer_weaponset_exit
cmp dword ptr [rsi+48], #0
je FPSPlayer_weaponset_exit
mov rbx, [rsi+48]
mov [rbx+1b8], #9999
mov [rbx+334], (float)0
mov [rbx+338], (float)0
mov [rbx+33c], (float)0
mov [rbx+340], (float)0
FPSPlayer_weaponset_exit:

cmp dword ptr [FPSPlayer_ammoset_enable], #0
je FPSPlayer_ammoset_exit
cmp qword ptr [rsi+48], #0
je FPSPlayer_ammoset_exit
cmp dword ptr [rsi+48], #0
je FPSPlayer_ammoset_exit
mov rbx, [rsi+48]
mov edx, [rbx+1b4]
mov [rbx+1a8], edx
mov edx, [rbx+1ac]
mov [rbx+29c], edx
FPSPlayer_ammoset_exit:

mov rbx, [FPSPlayer_temp1]
mov rdx, [FPSPlayer_temp2]


FPSPlayer_originalcode:
db 89 85 78 FE FF FF
//mov [rbp-00000188],eax


FPSPlayer_exit:
jmp FPSPlayer_returnhere


FPSPlayer_searchedAOB:
FPSPlayer_savedAOB:
jmp FPSPlayer_newmem
nop
FPSPlayer_returnhere:


[DISABLE]
FPSPlayer_savedAOB:
db 89 85 78 FE FF FF
//mov [rbp-00000188],eax

unregistersymbol(FPSPlayer_savedAOB)

dealloc(FPSPlayer_newmem)
dealloc(FPSPlayer_temp1)
dealloc(FPSPlayer_temp2)"""

