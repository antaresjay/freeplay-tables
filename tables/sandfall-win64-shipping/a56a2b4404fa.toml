source = """
[ENABLE]
aobscanmodule(jumpsig,SandFall-Win64-Shipping.exe,89 81 78 04 00 00 48 8B * * * 00 00 * 85 * 0F 84 * * 00 00 F6 * * * 00 00 04 0F 84 * * 00 00)
alloc(newmem,$1000,jumpsig)
label(code)
label(return)

newmem:
  push rax
  push rbx
  lea rbx,[rcx+478]
  mov [rbx],eax
  cmp [rbx-08],0
  jle code
  mov [rbx-04],0
  cmp [rbx-08],#100
  jge code
  add [rbx-08],#100
  jmp code
@@:
  cmp [rbx-08],#100
  jl code
  sub [rbx-08],#100
code:
  pop rbx
  pop rax
  jmp return

jumpsig:
  jmp newmem
  nop
return:
registersymbol(jumpsig)

[DISABLE]
jumpsig:
  db 89 81 78 04 00 00
dealloc(newmem)"""
