[[cheat]]
id = "get-progression-pointers"
name = "Get Progression Pointers"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
\tGame\t: SWTFU.exe
\tVersion\t: 0.0.0.0
\tDate\t: 2020-10-28
\tAuthor\t: aSwedishMagyar
}
[ENABLE]
aobscanmodule(characterPoints,SWTFU.exe,0F B7 AC 31 C8 04 00 00)
registersymbol(characterPoints)
registersymbol(characterPointBase)
alloc(newcharacterPoints,100,characterPoints)
label(codecharacterPoints)
label(returncharacterPoints)
label(characterPointBase)
newcharacterPoints:
  mov [characterPointBase],esi
codecharacterPoints:
  movzx ebp,word ptr [ecx+esi+000004C8]
  jmp returncharacterPoints
characterPointBase:
  dd 0
characterPoints:
  jmp newcharacterPoints
  nop 3
returncharacterPoints:

[DISABLE]
characterPoints:
  db 0F B7 AC 31 C8 04 00 00

unregistersymbol(characterPoints)
unregistersymbol(characterPointBase)
dealloc(newcharacterPoints)

