[[cheat]]
id = "modify-exp-gain"
name = "Modify Exp Gain"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
\tGame\t: SWTFU.exe
\tVersion\t: 0.0.0.0
\tDate\t: 2020-10-28
\tAuthor\t: aSwedishMagyar
}
[ENABLE]
aobscanmodule(expGain,SWTFU.exe,F3 0F 10 44 24 04 F3 0F 10 91 94)
registersymbol(expGain)
registersymbol(expMult)
alloc(newexpGain,100,expGain)
label(codeexpGain)
label(returnexpGain)
label(expMult)
newexpGain:
  movss xmm0,[esp+04]
  mulss xmm0,[expMult]
codeexpGain:
  jmp returnexpGain
expMult:
  dd (float)1
expGain:
  jmp newexpGain
  nop
returnexpGain:

[DISABLE]
expGain:
  db F3 0F 10 44 24 04

unregistersymbol(expGain)
unregistersymbol(expMult)
dealloc(newexpGain)

