// Game Executable   : DAVYxJONES-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.6.0.0
// Game Version      : v0.12.1 (Early Access)
// Script Date       : 2025-08-30


[ENABLE]

aobscanmodule(res1,DAVYxJONES-Win64-Shipping.exe,448Bxxxx418Bxx4585xx74xx4183) // should be unique
alloc(newmem,$1000,res1)
alloc(data2,8)
alloc(res1bkp,7)
registersymbol(data2)
registersymbol(res1)
registersymbol(res1bkp)
label(code)
label(return)

res1bkp:
  readmem(res1,7)

newmem:
  mov [data2],rcx

code:
  readmem(res1,7)
  jmp return

res1:
  jmp newmem
  nop 2
return:

[DISABLE]

res1:
  readmem(res1bkp,7)

unregistersymbol(*)
dealloc(*)"""

