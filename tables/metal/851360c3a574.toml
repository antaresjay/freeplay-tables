id = "disable-stun"
name = "Disable Stun"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@ModEngine
[ENABLE]

aobscanmodule(stuntime,GameAssembly.dll,F3 0F 10 89 88 00 00 00 0F 57)
alloc(newmem,$1000,stuntime)

label(code)
label(return)

newmem:
mov [rcx+0088],(float)0

code:
  movss xmm1,[rcx+00000088]
  jmp return

stuntime:
  jmp newmem
  nop 3
return:
registersymbol(stuntime)

[DISABLE]

stuntime:
  db F3 0F 10 89 88 00 00 00

unregistersymbol(stuntime)
dealloc(newmem)"""
