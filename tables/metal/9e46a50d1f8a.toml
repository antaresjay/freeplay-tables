[[cheat]]
id = "modify-beat-streak"
name = "Modify Beat Streak"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048,"AudioGameplayController.Update"+3D7) 
label(returnhere)
label(originalcode)
label(exit)
label(setBeatStreak)
label(beatStreakValue)
registersymbol(setBeatStreak)
registersymbol(beatStreakValue)

newmem:
cmp [setBeatStreak],1
jne originalcode
push rbx
mov rbx,[beatStreakValue]
dec rbx
mov [rax+20],rbx
pop rbx

originalcode:
cmp dword ptr [rax+20],00
jle GameAssembly.dll+506378

exit:
jmp returnhere

setBeatStreak:
dq 0

beatStreakValue:
dq 1

"AudioGameplayController.Update"+3D7:
jmp newmem
nop
returnhere:

[DISABLE]
unregistersymbol(setBeatStreak)
unregistersymbol(beatStreakValue)
dealloc(newmem)
"AudioGameplayController.Update"+3D7:
cmp dword ptr [rax+20],00
jle GameAssembly.dll+506378"""

