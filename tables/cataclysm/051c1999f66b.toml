[[cheat]]
id = "set-hp-to-999-999"
name = "Set HP to 999,999"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{
  Game    : Homeworld: Emergence
  Author  : LeFiXER
  Date    : 01/02/22

  Set HP to 999,999

  *******************************
  ** Read Notes In Table Extras**
  *******************************
}

[ENABLE]
aobscanmodule(aobHP,cataclysm.exe,00 D9 86 70 01 00 00 D8 64)
alloc(newmem,$1000)
alloc(_hp,4)
label(code)
label(return)

_hp:
  dq (float)999999

newmem:
  cmp [esi+6C],0
  jne code
  push ebx
  mov ebx,[_hp]
  mov [esi+170],ebx
  pop ebx

code:
  fld dword ptr [esi+00000170]
  jmp return

aobHP+01:
  jmp newmem
  nop
return:
registersymbol(aobHP)

[DISABLE]

aobHP+01:
  db D9 86 70 01 00 00

unregistersymbol(aobHP)
dealloc(newmem)"""

