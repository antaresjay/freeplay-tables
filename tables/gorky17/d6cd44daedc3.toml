id = "god-mode-damage-multiplier"
name = "god mode + damage multiplier"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game   : gorky17.exe
  Version: 
  Date   : 2020-08-03
  Author : ZoDDeL

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(DMG_CALC,gorky17.exe,29 18 EB 3E 8B 7C 24 28) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
//label(medusa)

newmem:
 // +8C  (float)10
 // +118    #0
 // +134    #1
 // +24C    #0
 // +268    #0
 // +3D4 string Sullivan
 // +3D4 string Trantigne
 // +3E4 string Owicz
 // +3E4 string Medusa

cmp dword ptr [eax+118], #0
jne code
cmp dword ptr [eax+134], #1
jne code
cmp dword ptr [eax+24C], #0
jne code
cmp dword ptr [eax+268], #0
jne code
  jmp gorky17.exe+9140C
  mov edi,[esp+28]
  jmp return


// excluded from script because its a short time side character
//medusa:
//cmp dword ptr [eax+3E4], "Medu"
//jne code
//cmp word ptr [eax+3E8], "sa"
//jne code
  //jmp gorky17.exe+9140C
  //mov edi,[esp+28]
  //jmp return


code:
  imul ebx,#3 // dmg multiplier
  sub [eax],ebx
  jmp gorky17.exe+9140C
  mov edi,[esp+28]
  jmp return

DMG_CALC:
  jmp newmem
  nop 3
return:
registersymbol(DMG_CALC)

[DISABLE]

DMG_CALC:
  db 29 18 EB 3E 8B 7C 24 28

unregistersymbol(DMG_CALC)
