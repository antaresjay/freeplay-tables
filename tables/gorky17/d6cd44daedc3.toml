je inf
cmp dword ptr [esi+58], #21
je inf
cmp dword ptr [esi+58], #22
je inf
cmp dword ptr [esi+58], #24
je inf
// excluded from script because its a short time side character
//cmp dword ptr [esi+58], #119
//je inf
jmp code


inf:
  mov [esi+00024610],00000000
  jmp return

code:
  mov [esi+00024610],00000001
  jmp return

ACTIONS:
  jmp newmem
  nop 5
return:
registersymbol(ACTIONS)

