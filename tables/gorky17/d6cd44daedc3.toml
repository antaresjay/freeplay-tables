source = """
{ Game   : gorky17.exe
  Version: 
  Date   : 2020-08-08
  Author : ZoDDeL

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(ACTIONS,gorky17.exe,C7 86 10 46 02 00 01 00 00 00 E8) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(inf)

newmem:
 // value is 4byte 0(nothing done) / 1(action per turn used)
 // +2CC string jump for sully,owicz,tran
 // +58 4byte #20 / 21 / 22 / 24 (character ID?  monster is like 108)
 // 20 = sully / 21 = tran / 22 = owicz / 24 = mcfadden / 119 = Medusa

//cmp dword ptr [esi+2CC], "jump"
//jne code
//jmp inf

