type = "script"
source = """
// Game   : ZoneUE4-Win64-Shipping.exe
// Version:
// Date   :
// Author : Cs
[ENABLE]
// Here's the define for the Infinite Action Points hotkey.
// It is ALT (0x12) by default. Check this page for other scan codes:
// https://msdn.microsoft.com/en-us/library/windows/desktop/dd375731(v=vs.85).aspx
define(InfAPKey,12)

aobscanmodule(aobTeamGrabber,ZoneUE4-Win64-Shipping.exe,48 ?? ?? ?? ?? 00 00 48 8B 82 ?? ?? 00 00 48 8B 04 C8 C3)
aobscanmodule(aobCharTeamOffset,ZoneUE4-Win64-Shipping.exe,48 8B 93 ?? ?? 00 00 48 8B 88 ?? ?? 00 00 E8 ?? ?? ?? ?? 0F ?? F8)
aobscanmodule(aobTeamControllerOffset,ZoneUE4-Win64-Shipping.exe,38 99 ?? ?? 00 00 74 ?? 48 8D 8A ?? ?? 00 00)
aobscanmodule(aobMutPtsReader,ZoneUE4-Win64-Shipping.exe,45 33 ?? 48 8B 86 ?? ?? 00 00 8B 88 ?? ?? 00 00 89 8F ?? ?? 00 00)
aobscanmodule(aobAPReader,ZoneUE4-Win64-Shipping.exe,8B 81 24 0D 00 00 41)
aobscanmodule(aobDamageCheck,ZoneUE4-Win64-Shipping.exe,80 B8 ?? ?? 00 00 00 0F 85 ?? ?? 00 00 41 ?? 01 48 8D 0D)
aobscanmodule(aobDamageCheck2,ZoneUE4-Win64-Shipping.exe,80 B8 ?? ?? 00 00 00 0F 85 ?? 06 00 00 C7 ?? ?? ?? 00 00 00 00 00 3F)
aobscanmodule(aobDamageCheck3,ZoneUE4-Win64-Shipping.exe,80 B8 ?? ?? 00 00 00 0F 85 ?? 05 00 00 C7 87 ?? ?? 00 00 00 00 00 3F)
aobscanmodule(aobMoveSpeedCalc,ZoneUE4-Win64-Shipping.exe,F3 0F 11 B0 ?? ?? 00 00 49 ?? ?? ?? 48 ?? ?? 49)

alloc(newmemTeamGrabber,4096,aobTeamGrabber)

label(aobTeamGrabber_r)
label(aobTeamGrabber_i)
registersymbol(aobTeamGrabber_r)
registersymbol(aobTeamGrabber_i)

label(lblTeamGrabber)
label(lblTeamGrabberSkip)
label(lblTeamGrabberRet)

label(pPlayerTeam)
label(iTeamMembersOffset)
label(iCharTeamOffset)
label(iTeamControllerOffset)
registersymbol(pPlayerTeam)
registersymbol(iTeamMembersOffset)
registersymbol(iCharTeamOffset)
registersymbol(iTeamControllerOffset)

label(aobMutPtsReader_r)
label(aobMutPtsReader_i)
registersymbol(aobMutPtsReader_r)
registersymbol(aobMutPtsReader_i)

label(lblMutPtsReader)
label(lblMutPtsReaderSkip)
label(lblMutPtsReaderRet)

label(bEnableMinMutationPoints)
label(iMinMutationPoints)
registersymbol(bEnableMinMutationPoints)
registersymbol(iMinMutationPoints)

label(iCharVitalsOffset)
label(iVitalsMutPtsOffset)
registersymbol(iCharVitalsOffset)
registersymbol(iVitalsMutPtsOffset)

label(aobAPReader_r)
label(aobAPReader_i)
registersymbol(aobAPReader_r)
registersymbol(aobAPReader_i)

label(lblAPReader)
label(lblAPReaderSkip)
label(lblAPReaderRet)

label(bEnableInfiniteAP)
registersymbol(bEnableInfiniteAP)

label(aobDamageCheck_r)
label(aobDamageCheck_i)
label(aobDamageCheck2_r)
label(aobDamageCheck2_i)
label(aobDamageCheck3_r)
label(aobDamageCheck3_i)
registersymbol(aobDamageCheck_r)
registersymbol(aobDamageCheck_i)
registersymbol(aobDamageCheck2_r)
registersymbol(aobDamageCheck2_i)
registersymbol(aobDamageCheck3_r)
registersymbol(aobDamageCheck3_i)

label(lblDamageCheck)
label(lblDamageCheckSkip)
label(lblDamageCheckRet)
label(lblDamageCheckFoe)
label(lblDamageCheck2)
label(lblDamageCheck2Skip)
label(lblDamageCheck2Ret)
label(lblDamageCheck2Foe)
label(lblDamageCheck3)
label(lblDamageCheck3Skip)
label(lblDamageCheck3Ret)
label(lblDamageCheck3Foe)

label(bEnableGodMode)
label(bEnableOneHitKill)
registersymbol(bEnableGodMode)
registersymbol(bEnableOneHitKill)

label(aobMoveSpeedCalc_r)
label(aobMoveSpeedCalc_i)
registersymbol(aobMoveSpeedCalc_r)
registersymbol(aobMoveSpeedCalc_i)

label(lblMoveSpeedCalc)
label(lblMoveSpeedCalcSkip)
label(lblMoveSpeedCalcRet)

label(bEnableMoveSpeedMod)
label(fMoveSpeedMod)
registersymbol(bEnableMoveSpeedMod)
registersymbol(fMoveSpeedMod)

newmemTeamGrabber:
bEnableGodMode:
dd 1
bEnableOneHitKill:
dd 1
bEnableInfiniteAP:
dd 1
bEnableMinMutationPoints:
dd 0
iMinMutationPoints:
dd (int)5
bEnableMoveSpeedMod:
dd 1
fMoveSpeedMod:
dd (float)1.75

lblTeamGrabber:
movsxd rax,[iTeamControllerOffset]
cmp byte ptr [rax+rdx],1
jne short lblTeamGrabberSkip
mov dword ptr [pPlayerTeam],rdx
lblTeamGrabberSkip:
readmem(aobTeamGrabber+07,7)
jmp lblTeamGrabberRet
aobTeamGrabber_i:
readmem(aobTeamGrabber+07,7)
pPlayerTeam:
dq 0
iTeamMembersOffset:
readmem(aobTeamGrabber+0A,4)
iCharTeamOffset:
readmem(aobCharTeamOffset+03,4)
iTeamControllerOffset:
readmem(aobTeamControllerOffset+02,4)

lblMutPtsReader:
readmem(aobMutPtsReader+03,7)
cmp dword ptr [bEnableMinMutationPoints],1
jne short lblMutPtsReaderSkip
movsxd r8,[iVitalsMutPtsOffset]
mov ecx,[iMinMutationPoints]
cmp dword ptr [rax+r8],ecx
jge short lblMutPtsReaderSkip
mov dword ptr [rax+r8],ecx
lblMutPtsReaderSkip:
jmp lblMutPtsReaderRet
aobMutPtsReader_i:
readmem(aobMutPtsReader+03,7)
iCharVitalsOffset:
readmem(aobMutPtsReader+06,4)
iVitalsMutPtsOffset:
readmem(aobMutPtsReader+0C,4)

lblAPReader:
cmp dword ptr [bEnableInfiniteAP],1
jne short lblAPReaderSkip
push rcx
push rdx
push r8
push r9
push r10
push r11
mov rcx,InfAPKey
push rcx
call GetAsyncKeyState
add rsp,08
shr ax,#15
cmp ax,1
pop r11
pop r10
pop r9
pop r8
pop rdx
pop rcx
jne lblAPReaderSkip
movsxd rax,[iCharTeamOffset]
mov rax,[rax+rcx]
cmp qword ptr [pPlayerTeam],rax
jne short lblAPReaderSkip
movsxd rax,[aobAPReader_i+02]
mov dword ptr [rax+rcx],2
lblAPReaderSkip:
readmem(aobAPReader,6)
jmp lblAPReaderRet
aobAPReader_i:
readmem(aobAPReader,6)

lblDamageCheck:
movsxd rcx,[iCharTeamOffset]
mov rcx,[rcx+rdi]
cmp qword ptr [pPlayerTeam],rcx
jne short lblDamageCheckFoe
readmem(aobDamageCheck,7)
jne short lblDamageCheckSkip
cmp dword ptr [bEnableGodMode],0
lblDamageCheckSkip:
jmp lblDamageCheckRet
lblDamageCheckFoe:
cmp dword ptr [bEnableOneHitKill],1
jne short @f
movsxd rcx,[aobDamageCheck_i+02]
cmp dword ptr [rax+rcx-6E],1
jle short @f
mov dword ptr [rax+rcx-6E],1
@@:
readmem(aobDamageCheck,7)
jmp short lblDamageCheckSkip
aobDamageCheck_i:
readmem(aobDamageCheck,7)

lblDamageCheck2:
movsxd rbx,[iCharTeamOffset]
mov rbx,[rbx+rdi]
cmp qword ptr [pPlayerTeam],rbx
jne short lblDamageCheck2Foe
readmem(aobDamageCheck2,7)
jne short lblDamageCheck2Skip
cmp dword ptr [bEnableGodMode],0
lblDamageCheck2Skip:
jmp lblDamageCheck2Ret
lblDamageCheck2Foe:
cmp dword ptr [bEnableOneHitKill],1
jne short @f
movsxd rbx,[aobDamageCheck2_i+02]
cmp dword ptr [rax+rbx-6E],1
jle short @f
mov dword ptr [rax+rbx-6E],1
@@:
readmem(aobDamageCheck2,7)
jmp short lblDamageCheck2Skip
aobDamageCheck2_i:
readmem(aobDamageCheck2,7)

lblDamageCheck3:
movsxd rbx,[iCharTeamOffset]
mov rbx,[rbx+rdi]
cmp qword ptr [pPlayerTeam],rbx
jne short lblDamageCheck3Foe
readmem(aobDamageCheck3,7)
jne short lblDamageCheck3Skip
cmp dword ptr [bEnableGodMode],0
lblDamageCheck3Skip:
jmp lblDamageCheck3Ret
lblDamageCheck3Foe:
cmp dword ptr [bEnableOneHitKill],1
jne short @f
movsxd rbx,[aobDamageCheck3_i+02]
cmp dword ptr [rax+rbx-6E],1
jle short @f
mov dword ptr [rax+rbx-6E],1
@@:
readmem(aobDamageCheck3,7)
jmp short lblDamageCheck3Skip
aobDamageCheck3_i:
readmem(aobDamageCheck3,7)

lblMoveSpeedCalc:
cmp dword ptr [bEnableMoveSpeedMod],1
jne short lblMoveSpeedCalcSkip
mulss xmm6,[fMoveSpeedMod]
lblMoveSpeedCalcSkip:
readmem(aobMoveSpeedCalc,8)
jmp lblMoveSpeedCalcRet
aobMoveSpeedCalc_i:
readmem(aobMoveSpeedCalc,8)

aobMoveSpeedCalc:
aobMoveSpeedCalc_r:
jmp lblMoveSpeedCalc
nop
nop
nop
lblMoveSpeedCalcRet:

aobDamageCheck:
aobDamageCheck_r:
jmp lblDamageCheck
nop
nop
lblDamageCheckRet:

aobDamageCheck2:
aobDamageCheck2_r:
jmp lblDamageCheck2
nop
nop
lblDamageCheck2Ret:

aobDamageCheck3:
aobDamageCheck3_r:
jmp lblDamageCheck3
nop
nop
lblDamageCheck3Ret:

aobAPReader:
aobAPReader_r:
jmp lblAPReader
nop
lblAPReaderRet:

aobMutPtsReader+03:
aobMutPtsReader_r:
jmp lblMutPtsReader
nop
nop
lblMutPtsReaderRet:

aobTeamGrabber+07:
aobTeamGrabber_r:
jmp lblTeamGrabber
nop
nop
lblTeamGrabberRet:

[DISABLE]
aobTeamGrabber_r:
readmem(aobTeamGrabber_i,7)

unregistersymbol(aobTeamGrabber_r)
unregistersymbol(aobTeamGrabber_i)

unregistersymbol(pPlayerTeam)
unregistersymbol(iTeamMembersOffset)
unregistersymbol(iCharTeamOffset)
unregistersymbol(iTeamControllerOffset)

aobMutPtsReader_r:
readmem(aobMutPtsReader_i,7)

unregistersymbol(aobMutPtsReader_r)
unregistersymbol(aobMutPtsReader_i)

unregistersymbol(bEnableMinMutationPoints)
unregistersymbol(iMinMutationPoints)

unregistersymbol(iCharVitalsOffset)
unregistersymbol(iVitalsMutPtsOffset)

aobAPReader_r:
readmem(aobAPReader_i,6)

unregistersymbol(aobAPReader_r)
unregistersymbol(aobAPReader_i)

unregistersymbol(bEnableInfiniteAP)

aobDamageCheck_r:
readmem(aobDamageCheck_i,7)

aobDamageCheck2_r:
readmem(aobDamageCheck2_i,7)

aobDamageCheck3_r:
readmem(aobDamageCheck3_i,7)

unregistersymbol(aobDamageCheck_r)
unregistersymbol(aobDamageCheck_i)
unregistersymbol(aobDamageCheck2_r)
unregistersymbol(aobDamageCheck2_i)
unregistersymbol(aobDamageCheck3_r)
unregistersymbol(aobDamageCheck3_i)

unregistersymbol(bEnableGodMode)
unregistersymbol(bEnableOneHitKill)

aobMoveSpeedCalc_r:
readmem(aobMoveSpeedCalc_i,8)

unregistersymbol(aobMoveSpeedCalc_r)
unregistersymbol(aobMoveSpeedCalc_i)

unregistersymbol(bEnableMoveSpeedMod)
unregistersymbol(fMoveSpeedMod)

dealloc(newmemTeamGrabber)"""

