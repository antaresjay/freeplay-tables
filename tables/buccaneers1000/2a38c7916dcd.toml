type = "script"
source = """
// Game Executable   : buccaneers1000.exe
// Author            : ndck76
// Executable Version: 3.0.0.0
// Game Version      : v1.0.0
// Script Date       : 2025-07-24


[ENABLE]

aobscanmodule(ohk,buccaneers1000.exe,8Bxxxx8Bxxxxxx89xxC1xxxxF7) // should be unique
alloc(newmem,$1000)
alloc(ohkbkp,7)
registersymbol(ohk)
registersymbol(ohkbkp)
label(code)
label(return)

ohkbkp:
  readmem(ohk,7)

newmem:
  mov [esi+10],0

code:
  readmem(ohk,7)
  jmp return

ohk:
  jmp newmem
  nop 2
return:

[DISABLE]

ohk:
  readmem(ohkbkp,7)

unregistersymbol(*)
dealloc(*)"""
