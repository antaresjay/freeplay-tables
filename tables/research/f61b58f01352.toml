[[cheat]]
id = "grab-cash-pause-unpause"
name = "Grab Cash (Pause & Unpause)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(CurrencyTest,Store.CurrencyManager:get__currentCurrency+13,Store.CurrencyManager:get__currentCurrency+4e,F3 0F 10 00 F3 0F 5A C0)
alloc(newmem,$1000,CurrencyTest)
registersymbol(getCash)
label(code return getCash)
//Send|Dark@Sintrix|FearlessRevolution

newmem:
mov [getCash],rax

code:
  movss xmm0,[rax]
  cvtss2sd xmm0,xmm0
  jmp return

getCash:
dq

CurrencyTest:
  jmp newmem
  nop 3
return:
registersymbol(CurrencyTest)

[DISABLE]

CurrencyTest:
  db F3 0F 10 00 F3 0F 5A C0

unregistersymbol(*)
dealloc(*)"""

