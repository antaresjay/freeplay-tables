  jne skip
  fld dword ptr [edi+000000F8] // load health
  fstp dword ptr [ebp+0c] // set as damage

skip:
  fld dword ptr [edi+000000F8]
  jmp return

INJECT_Damage:
  jmp code
  nop
return:
registersymbol(INJECT_Damage)

[DISABLE]

INJECT_Damage:
  db D9 87 F8 00 00 00

unregistersymbol(INJECT_Damage)
unregistersymbol(bGod)
dealloc(newmem)

