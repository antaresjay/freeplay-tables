  dd 0 // pGodBase
  dd 0 // 1 to enable OHK (one-hit-kill)

code:
  cmp byte ptr [edi+F0],1
  jne enemy
  mov [bGod+4],edi
  cmp dword ptr [bGod],1
  jne skip
  mov dword ptr [ebp+0c],0 // set damage to 0
  jmp skip

