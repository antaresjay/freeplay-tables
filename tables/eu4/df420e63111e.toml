[[cheat]]
id = "stats-activate-me-gawd-darn-it"
name = "Stats (Activate me gawd darn it)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Europa Universalis IV
  Version: 1.37.0
  Date   : 2024-05-08
  Author : Pedro

  This script stores the base address of most of the stats into a symbol
}

[ENABLE]

aobscanmodule(Stats,eu4.exe,48 8D 86 60 02 00 00)
alloc(NewMem,$1000, Stats)
alloc(_value, 4)

registersymbol(_value)

label(return)

//New block where the new modified code is
NewMem:
  mov [_value], rsi //add offset for values
  lea rax,[rsi+260]
  jmp return

//Block that we want to change
Stats:
  jmp NewMem
  nop 2
return:


[DISABLE]

Stats:
  db 48 8D 86 60 02 00 00

unregistersymbol(_value)
dealloc(NewMem)
dealloc(_value)
dealloc(_rullerPower)

//Original:
//eu4.exe+37EDBF - 48 8D 86 60020000     - lea rax,[rsi+00000260]"""

[[cheat]]
id = "set-army-drill-to-100-all-your-units"
name = "Set Army Drill to 100 (All your units)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(ArmyDrill,eu4.exe,48 63 4E 30 03 D8 48 0F AF C8 49 8B C5)
//48 63 4E 30 03 D8
alloc(newmem,$1000,ArmyDrill)

label(code)
label(return)

newmem:

code:
  mov [rsi+30], #100000
  movsxd rcx,dword ptr [rsi+30]
  add ebx,eax
  imul rcx,rax
  mov rax,r13
  jmp return

ArmyDrill:
  jmp newmem
  db 90 90 90 90 90 90 90 90
return:
registersymbol(ArmyDrill)

[DISABLE]

ArmyDrill:
  db 48 63 4E 30 03 D8 48 0F AF C8 49 8B C5

unregistersymbol(ArmyDrill)
dealloc(newmem)"""

