[[cheat]]
id = "active-trainer"
name = "Active Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
aobscan(data,D8 80 84 00 00 00 D9 98 84 00 00 00 8B 85 78 FA FF FF D9 80 84 00 00 00 8B 85 78 FA FF FF)
registersymbol(data)
label(health)
registersymbol(ammoE)
registersymbol(healthE)
label(ammoE)
label(healthE)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
cmp [ammoE],0
je health
mov [eax+0000007c],(float)999
mov [eax+00000080],(float)999
mov [eax+00000084],(float)999

health:
cmp [healthE],0
je originalcode
mov [eax+00000098],(float)99
mov [eax+0000009c],(float)99
mov [eax+000000a0],(float)99
originalcode:
fadd dword ptr [eax+00000084]

exit:
jmp returnhere
ammoE:
dd 0

healthE:
dd 0

data:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
data:
fadd dword ptr [eax+00000084]
//Alt: db D8 80 84 00 00 00
unregistersymbol(data)
unregistersymbol(ammoE)
unregistersymbol(healthE)"""

