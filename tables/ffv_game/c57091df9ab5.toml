id = "bestiary"
name = "[Bestiary]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(bestiaryReadAOB,8B 94 88 D4 61 01 00 33 C0)
registersymbol(bestiaryReadAOB)

label(iBestiaryEditorID)
registersymbol(iBestiaryEditorID)
label(iHBestiaryID)
registersymbol(iHBestiaryID)
label(pBestiaryEditorBase)
registersymbol(pBestiaryEditorBase)
label(pBestiaryInfoBase)
registersymbol(pBestiaryInfoBase)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
//[[[pBase1]+2cac0]+a0]
newmem: //this is allocated memory, you have read,write,execute access
//place your code here
mov edx,[esp]
inc edx
cmp [iBestiaryEditorID],edx
jne originalcode
mov [iHBestiaryID],ecx
lea edx,[eax+ecx*4+161d4]
mov [pBestiaryEditorBase],edx
push eax
mov eax,a0
mul ecx
mov edx,[pBase1]
add edx,[iBestiaryInfoOffset]
mov edx,[edx]
lea edx,[edx+eax]
pop eax
mov [pBestiaryInfoBase],edx

originalcode:
mov edx,[eax+ecx*4+000161D4]

exit:
jmp returnhere

///
iBestiaryEditorID:
dd 1
iHBestiaryID:
dd 1
pBestiaryEditorBase:
dd 0
pBestiaryInfoBase:
dd 0
///

bestiaryReadAOB: //"FFV_Game.exe"+B1204:
jmp newmem
nop
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
bestiaryReadAOB: //"FFV_Game.exe"+B1204:
db 8B 94 88 D4 61 01 00
//Alt: mov edx,[eax+ecx*4+000161D4]
unregistersymbol(bestiaryReadAOB)

unregistersymbol(iBestiaryEditorID)
unregistersymbol(iHBestiaryID)
unregistersymbol(pBestiaryEditorBase)
unregistersymbol(pBestiaryInfoBase)"""

