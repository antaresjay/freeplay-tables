[[cheat]]
id = "the-settlers-2-history-edition-aob-script"
name = "The Settlers 2: History Edition AOB script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game   : TS2.exe
// Version:
// Date   :
// Author : Cs
[ENABLE]
aobscanmodule(aobStoreReader,TS2.exe,0F B6 37 8D 7F 01)

alloc(newmemStoreReader,4096,aobStoreReader)

label(aobStoreReader_r)
label(aobStoreReader_i)
registersymbol(aobStoreReader_r)
registersymbol(aobStoreReader_i)

label(lblStoreReader)
label(lblStoreReaderSkip)
label(lblStoreReaderRet)

label(bEnableMinStoreStocks)
label(iMinStoreStocks)
registersymbol(bEnableMinStoreStocks)
registersymbol(iMinStoreStocks)

newmemStoreReader:
bEnableMinStoreStocks:
dd 1
iMinStoreStocks:
dd (int)99

lblStoreReader:
push eax
cmp dword ptr [bEnableMinStoreStocks],1
jne short lblStoreReaderSkip
cmp byte ptr [edi],(int)0
je short lblStoreReaderSkip
movzx eax,byte ptr [iMinStoreStocks]
cmp byte ptr [edi],al
jge short lblStoreReaderSkip
mov byte ptr [edi],al
lblStoreReaderSkip:
pop eax
readmem(aobStoreReader,6)
jmp lblStoreReaderRet
aobStoreReader_i:
readmem(aobStoreReader,6)

aobStoreReader:
aobStoreReader_r:
jmp lblStoreReader
nop
lblStoreReaderRet:

[DISABLE]
aobStoreReader_r:
readmem(aobStoreReader_i,6)

unregistersymbol(aobStoreReader_r)
unregistersymbol(aobStoreReader_i)

unregistersymbol(bEnableMinStoreStocks)
unregistersymbol(iMinStoreStocks)

dealloc(newmemStoreReader)"""

