[[cheat]]
id = "nomali-character-ctrl-numpad-1-activate-the-steam-gamepass-script-above-before-activating-this-script"
name = "Nomali Character (Ctrl + Numpad 1) {Activate the Steam/Gamepass script above before activating this script}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Relooted-WinGDK-Shipping.exe/Relooted-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.4.4.0
// Game Version      : v1.0.19.0 (Gamepass)/Build.21884112 (Steam/Non-Steam)
// Script Date       : 2026-02-13


[ENABLE]

aobscanmodule(master,$process,4Cxxxx4Cxxxxxxxx488Bxx488Bxx41FFxxxxxxxxxx488Bxxxxxx4883xxxx5FC3xxxxxxxxxxxxxxxxxxxxxxxx4053) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,8)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,8)

newmem:
  mov [data],rbx

code:
  readmem(master,8)
  jmp return

master:
  jmp newmem
  nop 3
return:

[DISABLE]

master:
  readmem(masterbkp,8)

unregistersymbol(*)
dealloc(*)"""

