[[cheat]]
id = "reader"
name = "Reader"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
 
aobscanmodule(reader,portal_knights_x64_game.exe,0F B6 0A 48 8B DA)
alloc(newmem,$1000,"portal_knights_x64_game.exe"+C2425)

globalalloc(_text,8)

label(code)
label(return)
label(copy)

newmem:

copy:
  push rax
  mov rax,_text
  mov [rax],ecx
  pop rax
  jmp return

code:
  movzx ecx,byte ptr [rdx]
  mov rbx,rdx
  jmp copy

reader:
  jmp newmem
  nop
return:
registersymbol(reader)

[DISABLE]
reader:
  db 0F B6 0A 48 8B DA

unregistersymbol(reader)
dealloc(newmem)
dealloc(_text)"""

