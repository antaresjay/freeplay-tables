[[cheat]]
id = "find-player-base"
name = "Find Player Base"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(getPlayer,portal_knights_x64_game.exe,F3 0F 10 5B 08 F3 0F 10 50)
alloc(newmem,$1000,"portal_knights_x64_game.exe"+3C2A54)

globalalloc(_player,8)

label(code)
label(return)
label(copy)

newmem:

copy:
  cmp dword [rbx+04],CEDA2313
  jne code
  push rax
  mov rax,_player
  mov [rax],rbx
  pop rax
  jmp code

code:
  movss xmm3,[rbx+08]
  jmp return

getPlayer:
  jmp newmem
return:
registersymbol(getPlayer)

[DISABLE]
getPlayer:
  db F3 0F 10 5B 08

unregistersymbol(getPlayer)
dealloc(newmem)
dealloc(_player)"""

