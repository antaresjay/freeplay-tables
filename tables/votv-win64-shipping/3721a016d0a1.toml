source = """
[ENABLE]

aobscanmodule(pawn_ptr,VotV-Win64-Shipping.exe,48 8B 01 FF 90 C0 0A 00 00)
alloc(newmem,$1000,pawn_ptr)
registersymbol(gpd)
label(code return gpd)

