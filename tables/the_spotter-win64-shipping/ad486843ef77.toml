type = "script"
source = """
[ENABLE]

aobscanmodule(modssdsdsd,The_Spotter-Win64-Shipping.exe,48 8B 80 B0 01 00 00 48 85 C0 74 1D 85 DB)
alloc(newmem,$1000)

label(code)
label(return)

label(highbal)

label(asdw)

newmem:
  pushf
  push r11

  mov r11, [rax+1B0]
  test r11, r11
  je code

  mov r11, [r11+330]
  test r11, r11
  je code

  push rcx
  mov rcx, [highbal]
  mov qword ptr [r11+D0], rcx
  fld qword ptr [r11+D0]
  fstp qword ptr [r11+C8]
  pop rcx

code:
  pop r11
  popf

  mov rax,[rax+000001B0]
  test rax,rax
  je asdw
  test ebx,ebx
  jmp return

highbal:
dq (double)9999.0

asdw:
  jmp modssdsdsd+29

modssdsdsd:
  jmp far newmem
return:
registersymbol(modssdsdsd)

[DISABLE]

modssdsdsd:
  db 48 8B 80 B0 01 00 00 48 85 C0 74 1D 85 DB

unregistersymbol(modssdsdsd)
dealloc(newmem)"""
