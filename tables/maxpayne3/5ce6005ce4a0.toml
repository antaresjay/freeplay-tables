[[cheat]]
id = "infinite-health"
name = "INFINITE HEALTH"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(health)
label(returnhere)
registersymbol(health)
aobscan(aob_health,0F 2F 80 58 03 00 00 72 22 8B 0D 24 B7)

newmem:
mov [eax+00000358],(float)1000
comiss xmm0,[eax+00000358]
jmp returnhere

aob_health:
health:
jmp newmem
nop
nop
returnhere:

[DISABLE]
dealloc(newmem)
unregistersymbol(health):
health:
comiss xmm0,[eax+00000358]"""

