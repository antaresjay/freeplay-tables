[[cheat]]
id = "auto-assemble-script"
name = "Auto Assemble script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : RP3.exe
  Version: 
  Date   : 2025-05-05
  Author : kunde

  This script does blah blah blah
}

[ENABLE]

aobscanregion(injCreateUnite,MilitaryWindow_Recruitment_TrainingQueue:CreateNewUnitInProduction,MilitaryWindow_Recruitment_TrainingQueue:CreateNewUnitInProduction+100,48 8B C8 48 8B D6) // should be unique
alloc(newmem,$1000,injCreateUnite)
alloc(unitprodinfo,8)
label(code)
label(return)

newmem:
  mov [unitprodinfo],rcx
code:
  mov rcx,rax
  mov rdx,rsi
  jmp return

injCreateUnite:
  jmp newmem
  nop
return:
registersymbol(injCreateUnite unitprodinfo)

[DISABLE]

injCreateUnite:
  db 48 8B C8 48 8B D6

unregistersymbol(*)
