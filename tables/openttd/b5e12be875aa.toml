[[cheat]]
id = "pause-money"
name = "pause money"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(pause_money,openttd.exe,4C 89 43 58 48 8D 54 24 38)
alloc(newmem,$1000,pause_money)
label(code)
label(return)
newmem:
code:
  mov r8,[rbx+58]
  lea rdx,[rsp+38]
  jmp return
pause_money:
  jmp newmem
  nop 4
return:
registersymbol(pause_money)
[DISABLE]
pause_money:
  db 4C 89 43 58 48 8D 54 24 38
unregistersymbol(pause_money)
dealloc(newmem)"""

