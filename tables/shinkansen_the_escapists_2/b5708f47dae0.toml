[[cheat]]
id = "door-base-address-scan-to-activate-play-level-to-update-reload-leve"
name = "Door Base Address Scan (To Activate: Play Level, To Update: Reload Leve)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Door_savedAOB)
label(Door_returnhere)
label(Door_originalcode)
label(Door_exit)

label(Door_update_exit)
label(Door_set_exit)
label(Door_doorset_exit)

registersymbol(Door_savedAOB)

//2B806A5E - C7 45 DC 00000000     - mov [ebp-24],00000000
//2B806A65 - C7 45 E0 00000000     - mov [ebp-20],00000000
// Door:UpdateDoor+3c
//2B806A6C - 0FB6 47 54            - movzx eax,byte ptr [edi+54]
//2B806A70 - 85 C0                 - test eax,eax
//2B806A72 - 74 04                 - je 2B806A78
//2B806A74 - C6 47 44 01           - mov byte ptr [edi+44],01
//2B806A78 - 0FB6 47 44            - movzx eax,byte ptr [edi+44]
aobscan(Door_searchedAOB, 0F B6 47 54 85 C0 74 04)

alloc(Door_newmem, 2048, Door_searchedAOB)
alloc(Door_temp1, 4, Door_searchedAOB)
alloc(Door_temp2, 4, Door_searchedAOB)
alloc(Door_temp3, 4, Door_searchedAOB)
alloc(Door_temp4, 4, Door_searchedAOB)
alloc(Door_temp5, 4, Door_searchedAOB)


Door_newmem:
mov [Door_temp1], eax
mov [Door_temp2], ebx
mov [Door_temp3], ecx
mov [Door_temp4], edx

cmp dword ptr [Door_update_enable], #0
je Door_update_exit
mov [Door_basepointer], edi
Door_update_exit:

cmp dword ptr [Door_set_enable], #0
je Door_set_exit
Door_set_exit:

cmp dword ptr [Door_doorset_enable], #0
je Door_doorset_exit
//mov byte ptr [edi+44], #1
//mov byte ptr [edi+45], #1
mov byte ptr [edi+54], #1
Door_doorset_exit:

mov eax, [Door_temp1]
mov ebx, [Door_temp2]
mov ecx, [Door_temp3]
mov edx, [Door_temp4]


Door_originalcode:
db 0F B6 47 54 85 C0
//movzx eax,byte ptr [edi+54]
//test eax,eax


Door_exit:
jmp Door_returnhere


Door_searchedAOB:
Door_savedAOB:
jmp Door_newmem
nop
Door_returnhere:


[DISABLE]
Door_savedAOB:
db 0F B6 47 54 85 C0
//movzx eax,byte ptr [edi+54]
//test eax,eax

unregistersymbol(Door_savedAOB)

dealloc(Door_newmem)
dealloc(Door_temp1)
dealloc(Door_temp2)
dealloc(Door_temp3)
dealloc(Door_temp4)
dealloc(Door_temp5)"""

