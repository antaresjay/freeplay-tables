[[cheat]]
id = "character-base-address-scan-initialization-activate-this-first"
name = "Character Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Character_basepointer)
registersymbol(Character_update_enable)
registersymbol(Character_set_enable)
registersymbol(Character_healthset_enable)
registersymbol(Character_energyset_enable)
registersymbol(Character_statsset_enable)
registersymbol(Character_heatset_enable)
registersymbol(Character_moneyset_enable)
registersymbol(Character_statusset_enable)
registersymbol(Character_itemset_enable)
registersymbol(Character_enemyset_enable)

alloc(Character_basepointer, 4)
alloc(Character_update_enable, 4)
alloc(Character_set_enable, 4)
alloc(Character_healthset_enable, 4)
alloc(Character_energyset_enable, 4)
alloc(Character_statsset_enable, 4)
alloc(Character_heatset_enable, 4)
alloc(Character_moneyset_enable, 4)
alloc(Character_statusset_enable, 4)
alloc(Character_itemset_enable, 4)
alloc(Character_enemyset_enable, 4)


[DISABLE]
unregistersymbol(Character_basepointer)
unregistersymbol(Character_update_enable)
unregistersymbol(Character_set_enable)
unregistersymbol(Character_healthset_enable)
unregistersymbol(Character_energyset_enable)
unregistersymbol(Character_statsset_enable)
unregistersymbol(Character_heatset_enable)
unregistersymbol(Character_moneyset_enable)
unregistersymbol(Character_statusset_enable)
unregistersymbol(Character_itemset_enable)
unregistersymbol(Character_enemyset_enable)

dealloc(Character_basepointer)
dealloc(Character_update_enable)
dealloc(Character_set_enable)
dealloc(Character_healthset_enable)
dealloc(Character_energyset_enable)
dealloc(Character_statsset_enable)
dealloc(Character_heatset_enable)
dealloc(Character_moneyset_enable)
dealloc(Character_statusset_enable)
dealloc(Character_itemset_enable)
dealloc(Character_enemyset_enable)"""

[[cheat]]
id = "character-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Character Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Character_savedAOB)
label(Character_returnhere)
label(Character_originalcode)
label(Character_exit)

label(Character_update_exit)
label(Character_set_exit)
label(Character_healthset_exit)
label(Character_energyset_exit)
label(Character_statsset_exit)
label(Character_heatset_exit)
label(Character_moneyset_exit)
label(Character_statusset_exit)
label(Character_itemset_exit)
label(Character_enemyset_entry)
label(Character_enemyset_exit)

registersymbol(Character_savedAOB)

//6EE8B39B - FF 90 F0000000        - call dword ptr [eax+000000F0]
//6EE8B3A1 - 83 C4 10              - add esp,10
// Character:ControlledUpdate+3c
//6EE8B3A4 - 0FB6 87 D8010000      - movzx eax,byte ptr [edi+000001D8]
//6EE8B3AB - 85 C0                 - test eax,eax
//6EE8B3AD - 74 0C                 - je 6EE8B3BB
//6EE8B3AF - 83 EC 0C              - sub esp,0C
//6EE8B3B2 - 57                    - push edi
aobscan(Character_searchedAOB, 0F B6 87 D8 01 00 00 85 C0 74 0C)

alloc(Character_newmem, 2048, Character_searchedAOB)
alloc(Character_temp1, 4, Character_searchedAOB)
alloc(Character_temp2, 4, Character_searchedAOB)
alloc(Character_temp3, 4, Character_searchedAOB)
alloc(Character_temp4, 4, Character_searchedAOB)
alloc(Character_temp5, 4, Character_searchedAOB)


Character_newmem:
mov [Character_temp1], eax
mov [Character_temp2], ebx
mov [Character_temp3], ecx
mov [Character_temp4], edx


mov ebx, [edi+44]
test ebx, ebx
je Character_enemyset_entry
cmp byte ptr [ebx+3c], #1
jne Character_enemyset_entry

cmp dword ptr [Character_update_enable], #0
je Character_update_exit
cmp byte ptr [edi+17c], #1
je Character_update_exit
mov [Character_basepointer], edi
Character_update_exit:

cmp dword ptr [Character_set_enable], #0
je Character_set_exit
Character_set_exit:

cmp dword ptr [Character_healthset_enable], #0
je Character_healthset_exit
mov ebx, [edi+44]
test ebx, ebx
je Character_healthset_exit
mov ecx, (float)9999
xor ecx, [ebx+80]
mov [ebx+84], ecx
Character_healthset_exit:

cmp dword ptr [Character_energyset_enable], #0
je Character_energyset_exit
mov ebx, [edi+44]
test ebx, ebx
je Character_energyset_exit
mov ecx, (float)9999
xor ecx, [ebx+88]
mov [ebx+8c], ecx
Character_energyset_exit:

cmp dword ptr [Character_statsset_enable], #0
je Character_statsset_exit
mov ebx, [edi+44]
test ebx, ebx
je Character_statsset_exit
mov ecx, (float)9999
xor ecx, [ebx+90]
mov [ebx+94], ecx
mov ecx, (float)9999
xor ecx, [ebx+98]
mov [ebx+9c], ecx
mov ecx, (float)9999
xor ecx, [ebx+a0]
mov [ebx+a4], ecx
Character_statsset_exit:

cmp dword ptr [Character_heatset_enable], #0
je Character_heatset_exit
mov ebx, [edi+44]
test ebx, ebx
je Character_heatset_exit
mov ecx, (float)0
xor ecx, [ebx+a8]
mov [ebx+ac], ecx
Character_heatset_exit:

cmp dword ptr [Character_moneyset_enable], #0
je Character_moneyset_exit
mov ebx, [edi+44]
test ebx, ebx
je Character_heatset_exit
mov ecx, (float)9999999
xor ecx, [ebx+b0]
mov [ebx+b4], ecx
Character_moneyset_exit:

cmp dword ptr [Character_statusset_enable], #0
je Character_statusset_exit
mov byte ptr [edi+233], #0
mov byte ptr [edi+234], #0
mov byte ptr [edi+235], #0
mov byte ptr [edi+236], #0
mov byte ptr [edi+238], #0
mov byte ptr [edi+239], #0
mov byte ptr [edi+23a], #0
mov byte ptr [edi+23b], #0
mov byte ptr [edi+23c], #0
mov byte ptr [edi+23d], #0
mov byte ptr [edi+23e], #0
mov byte ptr [edi+248], #0
mov byte ptr [edi+259], #0
Character_statusset_exit:

cmp dword ptr [Character_itemset_enable], #0
je Character_itemset_exit
mov ebx, [edi+64]
test ebx, ebx
je Character_itemset_exit
mov ebx, [ebx+10]
test ebx, ebx
je Character_itemset_exit
mov [ebx+50], #100
Character_itemset_exit:

jmp Character_enemyset_exit

Character_enemyset_entry:
cmp dword ptr [Character_enemyset_enable], #0
je Character_enemyset_exit
mov [edi+1f0], (float)0
mov [edi+1f4], (float)0
mov ebx, [edi+44]
test ebx, ebx
je Character_healthset_exit
mov ecx, (float)0
xor ecx, [ebx+80]
mov [ebx+84], ecx
Character_enemyset_exit:

mov eax, [Character_temp1]
mov ebx, [Character_temp2]
mov ecx, [Character_temp3]
mov edx, [Character_temp4]


Character_originalcode:
db 0F B6 87 D8 01 00 00
//movzx eax,byte ptr [edi+000001D8]


Character_exit:
jmp Character_returnhere


Character_searchedAOB:
Character_savedAOB:
jmp Character_newmem
nop
nop
Character_returnhere:


[DISABLE]
Character_savedAOB:
db 0F B6 87 D8 01 00 00
//movzx eax,byte ptr [edi+000001D8]

unregistersymbol(Character_savedAOB)

dealloc(Character_newmem)
dealloc(Character_temp1)
dealloc(Character_temp2)
dealloc(Character_temp3)
dealloc(Character_temp4)
dealloc(Character_temp5)"""

