[[cheat]]
id = "item-modifiers"
name = "-- Item Modifiers --"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
alloc(equipaddr,4)

label(returnhere)
label(originalcode)
label(exit)
label(_equipaob)

aobscan(equipaob, 8B 84 86 18 E0 01 00 5E 8B E5 5D C2 04 00 33 C0)

registersymbol(_equipaob)
registersymbol(equipaddr)

newmem: //this is allocated memory, you have read,write,execute access
push eax
mov eax, esi
add eax, 1E018
mov [equipaddr], eax
pop eax

originalcode:
mov eax,[esi+eax*4+0001E018]


exit:
jmp returnhere

equipaob:
_equipaob:
jmp newmem
nop
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
_equipaob:
mov eax,[esi+eax*4+0001E018]

dealloc(newmem)
dealloc(equipaddr)
unregistersymbol(_equipaob)
unregistersymbol(equipaddr)"""

