type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(FCAOB,66 0F D6 41 38 5D C2 04 00)
alloc(FCMem,2048)
label(returnhere)
label(originalcode)
label(exit)
label(FCStart)
label(FCData)
registersymbol(FCStart)
registersymbol(FCData)

FCMem: //this is allocated memory, you have read,write,execute access
//place your code here

originalcode:
cmp [ecx+58],#1167867904
jne exit
cmp [ecx+120],#1065353216
jne exit
mov [FCData],ecx

exit:
jmp returnhere
FCData:

FCAOB-A:
FCStart:
jmp FCMem
db 90 90 90 90 90 90 90 90 90 90
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(FCMem)
FCStart:
db 66 0F D6 41 30 F3 0F 7E 40 38 66 0F D6 41 38

unregistersymbol(FCStart)
unregistersymbol(FCData)"""

