[[cheat]]
id = "need-at-least-2x-use-drop-destroy-upgrade-to-get-99-d"
name = "Need at least 2X Use/Drop/Destroy/Upgrade To Get 99 :D"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
label(items)
registersymbol(items)
aobscan(aobit,66 29 5E 18 56)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
cmp [esi+18],1
jbe originalcode
mov [esi+18],63
add [esi+18],bx

originalcode:
sub [esi+18],bx
push esi

exit:
jmp returnhere

aobit:
items:
jmp newmem
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
items:
sub [esi+18],bx
push esi
unregistersymbol(items)
//Alt: db 66 29 5E 18 56"""

