[[cheat]]
id = "cheat"
name = "𝐏𝐥𝐚𝐲𝐞𝐫"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : DLS.exe
  Date   : 2025-10-02
  Author : Sianz
}

[ENABLE]

aobscanregion(player,JUTPS.JUHealth:Update+100,JUTPS.JUHealth:Update+200,0F B6 86 ?? 00 00 00 85 C0 0F) // should be unique
alloc(newmem,$1000,player)
alloc(stats,8)
label(code)
label(return)

newmem:
  test rsi,rsi
  je code
  cmp dword ptr [rsi+00000085],0
  je code
  cmp byte ptr [rsi+00000085],1
  jne @f
  mov [stats],rsi
code:
  movzx eax,byte ptr [rsi+00000085]
  jmp return

player:
  jmp newmem
  nop 2
return:
registersymbol(player stats)

[DISABLE]

player:
  db 0F B6 86 85 00 00 00

unregistersymbol(*)
dealloc(*)"""

