[[cheat]]
id = "add-material-with-x-c-and-v"
name = "Add material with X, C and V"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
//Made by Geri with Cheat Engine 6.1
//23th August, 2011
//All rights reserved. You are not allowed to use these scripts to create Your own trainer without my permission.
//Contact e-mail: trainers4free@gmail.com
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(originalcode)
label(exit)
label(addmore)
label(addcrazy)
globalalloc(materialincreaser,4)
globalalloc(materialincreaser2,4)
globalalloc(materialincreaser3,4)
label(label1)
registersymbol(label1)
aobscan(aob1,F3 0F 10 82 50 06 00 00)

materialincreaser:
dd (float)40

materialincreaser2:
dd (float)100

materialincreaser3:
dd (float)500


newmem: //this is allocated memory, you have read,write,execute access
pushfd
pushad
push 'X'
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne addmore
fld dword ptr [edx+00000650]
fadd dword ptr [materialincreaser]
fstp dword ptr [edx+00000650]

addmore:
pushad
push 'C'
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne addcrazy
fld dword ptr [edx+00000650]
fadd dword ptr [materialincreaser2]
fstp dword ptr [edx+00000650]

addcrazy:
pushad
push 'V'
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne originalcode
fld dword ptr [edx+00000650]
fadd dword ptr [materialincreaser3]
fstp dword ptr [edx+00000650]

originalcode:
popfd
movss xmm0,[edx+00000650]

exit:
jmp returnhere

aob1:
label1:
jmp newmem
nop
nop
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
label1:
db F3 0F 10 82 50 06 00 00
unregistersymbol(label1)"""
