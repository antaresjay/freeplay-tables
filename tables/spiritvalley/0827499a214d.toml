name = "Battle Information"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@FearlessRevolution|Sintrix
[ENABLE]

aobscanregion(battledata,FightManager:Update,FightManager:Update+4f,48 8B F1 48 8D AD 00 00 00 00 49 BB F0 3C)
alloc(newmem,$1000,battledata)
registersymbol(battle)
label(code return battle)

newmem:
mov [battle],rcx

code:
  mov rsi,rcx
  lea rbp,[rbp+00000000]
  jmp return

battle:
