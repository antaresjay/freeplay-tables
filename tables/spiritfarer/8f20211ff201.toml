id = "infinite-glims"
name = "Infinite Glims"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(glims,GameAssembly.dll,66 0F 6E 78 30) // should be unique
alloc(newmem,$1000,glims) //"GameAssembly.dll"+6042F8)

label(code)
label(return)

newmem:
  mov [rax+30],#999999
code:
  movd xmm7,[rax+30]
  jmp return

glims:
  jmp newmem
return:
registersymbol(glims)

[DISABLE]

glims:
  db 66 0F 6E 78 30

unregistersymbol(glims)
dealloc(newmem)"""
