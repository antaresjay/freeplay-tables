[[cheat]]
id = "data-persistence"
name = "Data Persistence"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Gridle.exe
  Version:
  Date   : 2026-01-23
  Author : BabyGroot

  This script does blah blah blah
}

define(address,DataPersistenceManager:SaveGame+27)
define(bytes,48 8B 46 30 48 8B D5)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,DataPersistenceManager:SaveGame+27)

label(code)
label(return)

alloc(pDaPer,8)
registersymbol(pDaPer)

newmem:

code:
  mov [pDaPer],rsi
  mov rax,[rsi+30]
  mov rdx,rbp
  jmp return

pDaPer:
dq

address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  db bytes
  // mov rax,[rsi+30]
  // mov rdx,rbp

dealloc(newmem)
dealloc(pDaPer)
unregistersymbol(pDaPer)"""

