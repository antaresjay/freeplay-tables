[[cheat]]
id = "enable-cheats"
name = "Enable Cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(aobMana,F3 0F 11 46 1C E8 96 A7 FE FF)
aobscan(aobHealth,0F 2F 80 FC 01 00 00 73 4A)

alloc(newmem,2048)
label(retMana)
label(retHealth)
label(BackHealth)
label(BackMana)
label(pMana)
label(pHealth)

globalalloc(iHealth,4)
globalalloc(iMana,4)

label(Mana)
label(Health)
registersymbol(Mana)
registersymbol(Health)

//=========================================================================
newmem:
//=========================================================================

pMana:
 cmp [iMana],1
 jne BackMana
 push ebx
 mov ebx,(float)10000.0
 mov [esi+20],ebx
 mov [esi+1C],ebx
 pop ebx
 jmp BackMana

BackMana:
 movss xmm0,[esi+1C]
 jmp retMana

pHealth:
 cmp [iHealth],1
 jne BackHealth
 push ecx
 mov ecx,(float)10000.0
 mov [eax+1F4],ecx
 mov [eax+1F8],ecx
 mov [eax+1FC],ecx
 pop ecx
 jmp BackHealth

BackHealth:
 comiss xmm0,[eax+000001FC]
 jmp retHealth

//============== Hack =============================

aobMana:
Mana:
jmp pMana
retMana:

aobHealth:
Health:
jmp pHealth
nop
nop
retHealth:

//============== Hack ============================

iMana:
 dd 0
iHealth:
 dd 0

[DISABLE]
dealloc(newmem)
unregistersymbol(Mana)
unregistersymbol(Health)

Mana:
db F3 0F 11 46 1C

Health:
db 0F 2F 80 FC 01 00 00"""

