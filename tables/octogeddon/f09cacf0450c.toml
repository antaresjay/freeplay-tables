[[cheat]]
id = "enable-script"
name = "Enable script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : octogeddon.exe
  Version: 1.0
  Date   : 2018-02-13
  Author : WhiteSnoop

  This script does blah blah blah
}

[ENABLE]
aobscanmodule(basePoint,octogeddon.exe,8B 45 0C 33 F6 89 75 F4) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
// MONEY
cmp dword ptr [iEnableMoney],1
jne short @f
  cmp dword ptr [edx-18],454E4F4D     // string check: 'MONE'
  jne short @f
      push edx
      lea edx,[customMoney]
      mov [ebp+0C],edx                // Write out custom string instead
      pop edx
@@:
//CONTINUES
cmp dword ptr [iEnableContinues],1
jne short @f
  cmp dword ptr [edx-18],544E4F43
  jne short @f
      push edx
      lea edx,[customContinues]
      mov [ebp+0C],edx
      pop edx
@@:

// MAX HEARTS
cmp dword ptr [iEnableHearts],1
jne short @f
  cmp dword ptr [edx-18],52414548     // string check: 'HEAR'
  jne short @f
      push edx
      lea edx,[customHearts]
      mov [ebp+0C],edx
      pop edx
@@:

// MAX SHELLS
cmp dword ptr [iEnableShells],1
jne short @f
  cmp dword ptr [edx-18],4C454853     // string check: 'SHEL'
  jne short @f
      push edx
      lea edx,[customShells]
      mov [ebp+0C],edx
      pop edx
@@:

// MAX LEGS
cmp dword ptr [iEnableLegs],1
jne short @f
  cmp dword ptr [edx-18],4C58414D     // string check: 'MAXL'
  jne short @f
    cmp dword ptr [edx-14],00534745     // string check: 'EGS 0x00'
    jne short @f
        push edx
        lea edx,[customLegs]
        mov [ebp+0C],edx
        pop edx
@@:

code:
  mov eax,[ebp+0C]
  xor esi,esi
  jmp return

customMoney:
  db 39 39 39 39 39 39 39 39 39 00    // 999,999,999

customContinues:
  db 39 39 00   // 99

customHearts:
  db 31 30 00   //10

customShells:
  db 39 39 39 39 39 00   //99,999

customLegs:
  db 33 32   //22 (edit as you want :)


iEnableMoney:
dd 0

iEnableContinues:
dd 0

iEnableHearts:
dd 0

iEnableShells:
dd 0

iEnableLegs:
dd 0


basePoint:
  jmp newmem
return:
registersymbol(basePoint)
registersymbol(iEnableMoney)
registersymbol(iEnableContinues)
registersymbol(iEnableHearts)
registersymbol(iEnableShells)
registersymbol(iEnableLegs)

[DISABLE]
basePoint:
  db 8B 45 0C 33 F6

unregistersymbol(basePoint)
unregistersymbol(iEnableMoney)
unregistersymbol(iEnableContinues)
unregistersymbol(iEnableHearts)
unregistersymbol(iEnableShells)
unregistersymbol(iEnableLegs)
dealloc(newmem)

{
