[[cheat]]
id = "player-ship-ctrl-numpad-1"
name = "Player Ship (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : No Way Home.exe
// Author            : ndck76
// Executable Version: 2022.3.47.49783
// Game Version      : v2.0.276
// Script Date       : 2025-06-19


[ENABLE]

aobscanmodule(invincibilitybuffer,GameAssembly.dll,F3xxxxxxxxxxxxxxF3xxxxxxxxxxxxxxxx33xxE8xxxxxxxxF3xxxxxxxxxxxxxxxxF3xxxxxxxxxxxxxxxxF3xxxxxxxxxxxxxxxxE8xxxxxxxx488BxxxxxxxxxxxxF3xxxxxxxxxxxxxx33xx488BxxxxxxxxxxxxE8xxxxxxxx33) //PlayerShip.Update
alloc(newmem,$1000,invincibilitybuffer)
alloc(data,8)
alloc(invincibilitybufferbkp,8)
registersymbol(data)
registersymbol(invincibilitybuffer)
registersymbol(invincibilitybufferbkp)
label(code)
label(return)

invincibilitybufferbkp:
  readmem(invincibilitybuffer,8)

newmem:
  mov [data],rax

code:
  readmem(invincibilitybuffer,8)
  jmp return

invincibilitybuffer:
  jmp newmem
  nop 3
return:

[DISABLE]

invincibilitybuffer:
  readmem(invincibilitybufferbkp,8)

unregistersymbol(*)
dealloc(*)"""

