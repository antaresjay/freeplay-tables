[[cheat]]
id = "instant-kill-dealer"
name = "Instant Kill Dealer"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game   : X Roulette
  Date   : 2024-09-16
  Author : Igromanru

  Instant Kill Dealer
}

[ENABLE]
AOBScanRegion(instKillDealer, "HealthTable.OnEnemyTakeDamage", "HealthTable.OnEnemyTakeDamage"+30, 48 89 ? ? ? 48 89 ? ? ?)
alloc(newmem,$100,instKillDealer)

label(instKillDealerBackUp)
label(dealerDamageValue)
label(return)

newmem:
  mov edx,[dealerDamageValue]
  mov r8b, 1
instKillDealerBackUp:
  readMem(instKillDealer, 5)
  jmp return

dealerDamageValue:
  dd (int)90

instKillDealer:
  jmp newmem
return:

registersymbol(instKillDealer)
registersymbol(instKillDealerBackUp)
registersymbol(dealerDamageValue)

[DISABLE]
instKillDealer:
  readMem(instKillDealerBackUp, 5)

dealloc(newmem)
unregistersymbol(instKillDealer)
unregistersymbol(instKillDealerBackUp)
unregistersymbol(dealerDamageValue)

