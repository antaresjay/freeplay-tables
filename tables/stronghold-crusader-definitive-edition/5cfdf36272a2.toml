[[cheat]]
id = "pbase"
name = "_pBase"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(_pBase,CrusaderDE.dll,8B 84 29 34 F0 12 00)
alloc(newmem,$1111,_pBase)
alloc(_item,8)
label(return)
registersymbol(_item _pBase)
newmem:
  mov [_item],rbp
  mov eax,[rcx+rbp+12f034]
  jmp return
_pBase:
  jmp newmem
  nop 2
return:
[DISABLE]
dealloc(*)
unregistersymbol(*)
_pBase:
  db 8B 84 29 34 F0 12 00"""

