type = "script"
source = """
{ Game   : Hot Brass.exe
  Version: 
  Date   : 2025-07-04
  Author : resky

  This script does blah blah blah
}

[ENABLE]

aobscan(pData_Debug,83 39 00 0F B6 70 50)
alloc(newmem,$1000,pData_Debug)

alloc(pBase_Debug,8)
registersymbol(pBase_Debug)

label(code)
label(return)

pBase_Debug:
dq

newmem:

code:
  mov [pBase_Debug],rcx
  cmp dword ptr [rcx],00
  movzx esi,byte ptr [rax+50]
  jmp return

pData_Debug:
  jmp newmem
  nop 2
return:
registersymbol(pData_Debug pBase_Debug)

[DISABLE]

pData_Debug:
  db 83 39 00 0F B6 70 50

unregistersymbol(*)
dealloc(*)"""

