[[cheat]]
id = "instant-production-effect-all-country"
name = "Instant Production ( Effect All Country )"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(inj_build,C6 44 24 3C 00 D9 5E 24)
registersymbol(inj_build)
alloc(newmem,48)
label(returnhere)
label(_value)

newmem:
mov byte ptr [esp+3C],00
mov [esi+14],(float)10000000
fadd dword ptr [_value]
jmp returnhere
_value:
dd (float)200
inj_build:
jmp newmem
returnhere:

[DISABLE]
dealloc(newmem)
inj_build:
db C6 44 24 3C 00
//mov byte ptr [esp+3C],00
unregistersymbol(inj_build)"""
