name = "Unlimited Stamina"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
//send@fearlessrevolution.com
[ENABLE]

aobscanmodule(stamina,GameAssembly.dll,FF F3 0F 11 83 70 0D 00 00) // should be unique
alloc(newmem,$1000,stamina)
label(stam)
label(code)
label(return)

newmem:
movss xmm0,[stam]
code:
  movss [rbx+00000D70],xmm0
  jmp return

stam:
dd (float)100

stamina+01:
  jmp newmem
  nop 3
return:
registersymbol(stamina)

[DISABLE]

stamina+01:
  db F3 0F 11 83 70 0D 00 00

unregistersymbol(stamina)
dealloc(newmem)"""

