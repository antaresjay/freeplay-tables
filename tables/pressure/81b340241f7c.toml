[[cheat]]
id = "check-game-version"
name = "Check Game Version"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
{
//aobscanModule only for 6.2+, otherwise, use aobscan.

aobscan(aobPressure, 8B 4E 78 F3 0F 10 49 10 0F 57 C0 0F 2F C8)
aobscan(aobDamage,   8B 46 78 6B D2 64 F3 0F 10 48 10 F3 0F 5E)
aobscan(aobCoins,    83 C4 08 6B C9 64 F3 0F 10 44 11 38 F3 0F)
}

aobscanModule(aobPressure,PressureEnginePlugin.vplugin, 8B 4E 78 F3 0F 10 49 10 0F 57 C0 0F 2F C8)
aobscanModule(aobDamage,  PressureEnginePlugin.vplugin, 8B 46 78 6B D2 64 F3 0F 10 48 10 F3 0F 5E)
aobscanModule(aobCoins,   PressureEnginePlugin.vplugin, 83 C4 08 6B C9 64 F3 0F 10 44 11 38 F3 0F)


label(locPressure)
registersymbol(locPressure)
label(locDamage)
registersymbol(locDamage)
label(ptrCoins)
registersymbol(ptrCoins)

aobPressure+3:
locPressure:

aobDamage+6:
locDamage:

[aobCoins-4]:
ptrCoins:

[DISABLE]
unregistersymbol(locDamage)
unregistersymbol(locPressure)
unregistersymbol(ptrCoins)"""

[[cheat]]
id = "activate-trainer"
name = "Activate Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(cheater,64)
label(iCheat)
registersymbol(iCheat)
label(retDamage)
label(chtDamage)
label(orgDamage)
label(retPressure)
label(chtPressure)
label(orgPressure)

cheater:
iCheat:
 db 00 00 //byte:Damage, Pressure
chtDamage:
 pushfd
 cmp byte ptr [iCheat],00
 je short orgDamage
 mov [eax+10],00000000
orgDamage:
 popfd
 movss xmm1,[eax+10]
 jmp retDamage

chtPressure:
 pushfd
 cmp byte ptr [iCheat+1],00
 je short orgPressure
 push edx
 mov edx,[ecx+14]
 mov [ecx+10],edx
 pop edx
orgPressure:
 popfd
 movss xmm1,[ecx+10]
 jmp retPressure

{---------Hacked----------}
locDamage:
 jmp chtDamage
retDamage:

locPressure:
 jmp chtPressure
retPressure:
 
[DISABLE]
locDamage:
 db F3 0F 10 48 10
locPressure:
 db F3 0F 10 49 10
dealloc(cheater)
unregistersymbol(iCheat)"""

