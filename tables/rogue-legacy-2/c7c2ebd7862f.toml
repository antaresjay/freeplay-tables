[[cheat]]
id = "inf-mana"
name = "inf. mana"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{  Game Executable   : Rogue Legacy 2.exe
   Executable Version: 2019.4.7.37553
   Script Date       : 2020-08-19
   Author            : Astor
}

[ENABLE]
aobscanregion(aomp,Mana:get_CurrentMana+2,Mana:get_CurrentMana+1c,F3 0F 10 40 64)
alloc(nmp,$1000,aomp)
label(cmp)
label(rmp)
label(resmp)
nmp:
mov [rax+64],0x4479c000
cmp:
movss xmm0,[rax+64]
jmp rmp
resmp:
readmem(aomp,5)
aomp:
jmp nmp
rmp:
registersymbol(aomp)
registersymbol(resmp)
[DISABLE]
aomp:
readmem(resmp,5)
unregistersymbol(aomp)
unregistersymbol(resmp)
dealloc(nmp)"""

