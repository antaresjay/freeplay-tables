category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)

aobscan(money,8B 40 64 39 1B 8B 4B 54 3B C1 0F 9C C0)
