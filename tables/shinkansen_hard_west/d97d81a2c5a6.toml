[[cheat]]
id = "cfgcharacter-base-address-scan-initialization-activate-this-first"
name = "CFGCharacter Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(CFGCharacter_basepointer)
registersymbol(CFGCharacter_update_enable)
registersymbol(CFGCharacter_set_enable)
registersymbol(CFGCharacter_hpset_enable)
registersymbol(CFGCharacter_luckset_enable)
registersymbol(CFGCharacter_actionpointsset_enable)
registersymbol(CFGCharacter_statsset_enable)
registersymbol(CFGCharacter_ammoset_enable)

alloc(CFGCharacter_basepointer, 8)
alloc(CFGCharacter_update_enable, 4)
alloc(CFGCharacter_set_enable, 4)
alloc(CFGCharacter_hpset_enable, 4)
alloc(CFGCharacter_luckset_enable, 4)
alloc(CFGCharacter_actionpointsset_enable, 4)
alloc(CFGCharacter_statsset_enable, 4)
alloc(CFGCharacter_ammoset_enable, 4)


[DISABLE]
unregistersymbol(CFGCharacter_basepointer)
unregistersymbol(CFGCharacter_update_enable)
unregistersymbol(CFGCharacter_set_enable)
unregistersymbol(CFGCharacter_hpset_enable)
unregistersymbol(CFGCharacter_luckset_enable)
unregistersymbol(CFGCharacter_actionpointsset_enable)
unregistersymbol(CFGCharacter_statsset_enable)
unregistersymbol(CFGCharacter_ammoset_enable)

dealloc(CFGCharacter_basepointer)
dealloc(CFGCharacter_update_enable)
dealloc(CFGCharacter_set_enable)
dealloc(CFGCharacter_hpset_enable)
dealloc(CFGCharacter_luckset_enable)
dealloc(CFGCharacter_actionpointsset_enable)
dealloc(CFGCharacter_statsset_enable)
dealloc(CFGCharacter_ammoset_enable)"""

[[cheat]]
id = "cfgcharacter-base-address-scan-to-activate-battle-to-update-battle"
name = "CFGCharacter Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(CFGCharacter_savedAOB)
label(CFGCharacter_returnhere)
label(CFGCharacter_originalcode)
label(CFGCharacter_exit)

label(CFGCharacter_update_exit)
label(CFGCharacter_set_exit)
label(CFGCharacter_hpset_exit)
label(CFGCharacter_luckset_exit)
label(CFGCharacter_actionpointsset_exit)
label(CFGCharacter_statsset_exit)
label(CFGCharacter_ammoset_exit)

registersymbol(CFGCharacter_savedAOB)

//22185154 - 33 C0                 - xor eax,eax
//22185156 - EB 12                 - jmp 2218516A
// CFGCharacter:get_MaxHp+18
//22185158 - 48 8B 46 60           - mov rax,[rsi+60]
//2218515C - 48 8B C8              - mov rcx,rax
//2218515F - 83 39 00              - cmp dword ptr [rcx],00
//22185162 - 48 8B 40 58           - mov rax,[rax+58]
//22185166 - 48 63 40 10           - movsxd  rax,dword ptr [rax+10]
//2218516A - 48 8B 34 24           - mov rsi,[rsp]
//2218516E - 48 83 C4 08           - add rsp,08
aobscan(CFGCharacter_searchedAOB, 48 8B 46 60 48 8B C8 83 39 00 48 8B 40 58 48 63 40 10)

alloc(CFGCharacter_newmem, 2048, CFGCharacter_searchedAOB)
alloc(CFGCharacter_temp1, 8, CFGCharacter_searchedAOB)
alloc(CFGCharacter_temp2, 8, CFGCharacter_searchedAOB)


CFGCharacter_newmem:
mov [CFGCharacter_temp1], rbx
mov [CFGCharacter_temp2], rcx

cmp dword ptr [rsi+60], #0
je CFGCharacter_ammoset_exit
mov rbx, [rsi+60]
cmp dword ptr [rbx+b4], #-1
jne CFGCharacter_ammoset_exit

cmp dword ptr [CFGCharacter_update_enable], #0
je CFGCharacter_update_exit
cmp byte ptr [rsi+199], #1
jne CFGCharacter_update_exit
mov [CFGCharacter_basepointer], rsi
CFGCharacter_update_exit:

cmp dword ptr [CFGCharacter_set_enable], #0
je CFGCharacter_set_exit
CFGCharacter_set_exit:

cmp dword ptr [CFGCharacter_hpset_enable], #0
je CFGCharacter_hpset_exit
cmp dword ptr [rsi+60], #0
je CFGCharacter_hpset_exit
mov rbx, [rsi+60]
cmp dword ptr [rbx+58], #0
je CFGCharacter_hpset_exit
mov rcx, [rbx+58]
mov eax, [rcx+10]
mov [rbx+8c], eax
CFGCharacter_hpset_exit:

cmp dword ptr [CFGCharacter_luckset_enable], #0
je CFGCharacter_luckset_exit
cmp dword ptr [rsi+60], #0
je CFGCharacter_luckset_exit
mov rbx, [rsi+60]
cmp dword ptr [rbx+58], #0
je CFGCharacter_luckset_exit
mov rcx, [rbx+58]
mov eax, [rcx+24]
mov [rbx+90], eax
CFGCharacter_luckset_exit:

cmp dword ptr [CFGCharacter_actionpointsset_enable], #0
je CFGCharacter_actionpointsset_exit
cmp dword ptr [rsi+60], #0
je CFGCharacter_actionpointsset_exit
mov rbx, [rsi+60]
mov [rbx+a8], #9
CFGCharacter_actionpointsset_exit:

cmp dword ptr [CFGCharacter_statsset_enable], #0
je CFGCharacter_statsset_exit
CFGCharacter_statsset_exit:

cmp dword ptr [CFGCharacter_ammoset_enable], #0
je CFGCharacter_ammoset_exit
cmp dword ptr [rsi+b0], #0
je CFGCharacter_ammoset_exit
mov rbx, [rsi+b0]
cmp dword ptr [rbx+10], #0
je CFGCharacter_ammoset_exit
mov rcx, [rbx+10]
mov eax, [rcx+60]
mov [rbx+2c], eax
CFGCharacter_ammoset_exit:

mov rbx, [CFGCharacter_temp1]
mov rcx, [CFGCharacter_temp2]


CFGCharacter_originalcode:
db 48 8B 46 60 48 8B C8
//mov rax,[rsi+60]
//mov rcx,rax


CFGCharacter_exit:
jmp CFGCharacter_returnhere


CFGCharacter_searchedAOB:
CFGCharacter_savedAOB:
jmp CFGCharacter_newmem
nop
nop
CFGCharacter_returnhere:


[DISABLE]
CFGCharacter_savedAOB:
db 48 8B 46 60 48 8B C8
//mov rax,[rsi+60]
//mov rcx,rax

unregistersymbol(CFGCharacter_savedAOB)

dealloc(CFGCharacter_newmem)
dealloc(CFGCharacter_temp1)
dealloc(CFGCharacter_temp2)"""

