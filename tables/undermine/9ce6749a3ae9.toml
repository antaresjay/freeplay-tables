type = "script"
source = """
{ Game   : UnderMine.exe
  Version: 
  Date   : 2019-11-13
  Author : cfe

  This script does blah blah blah
}

[ENABLE]

aobscanregion(aobCFE,Thor:ChatManager:Process,Thor:ChatManager:Process+100,** E7 03 00 00) // should be unique

alloc(newmem,$1000,aobCFE-2000)

label(code)
label(return)
label(cAxe)
registersymbol(cAxe)
label(cBomb)
registersymbol(cBomb)
label(cKey)
registersymbol(cKey)
label(cMerch)
registersymbol(cMerch)
label(cPotion)
registersymbol(cPotion)
label(cPotion2)
registersymbol(cPotion2)
label(cBless)
registersymbol(cBless)
label(cDungeon)
registersymbol(cDungeon)
label(cDKey)
registersymbol(cDKey)
label(cCurse)
registersymbol(cCurse)

label(code2)
label(jmpbackkey)
label(bExecuteInCE)
registersymbol(bExecuteInCE)

newmem:

code:
  mov edx,000003E7

  cmp [cAxe],1
  je AxeCode
  cmp [cBomb],1
  je BombCode
  cmp [cKey],1
  je dKeyCode
  cmp [cMerch],1
  je cMerchCode
  cmp [cPotion],1
  je cPotionCode
  cmp [cPotion2],1
  je cPotion2Code
  cmp [cBless],1
  je cBlessCode
  cmp [cDungeon],1
  je cDungeonCode
  cmp [cDKey],1
  je cDKeyCode
  cmp [cCurse],1
  je CurseCode


  jmp return

  AxeCode:
  mov [cAxe],0
  mov edx,0
  jmp return

  BombCode:
  mov [cBomb],0
  mov edx,1
  jmp return

  cMerchCode:
  mov [cMerch],0
  mov edx,3
  jmp return

  cPotionCode:
  mov [cPotion],0
  mov edx,4
  jmp return

  cPotion2Code:
  mov [cPotion2],0
  mov edx,5
  jmp return

  cBlessCode:
  mov [cBless],0
  mov edx,6
  jmp return

  cDungeonCode:
  mov [cDungeon],0
  mov edx,7
  jmp return

  cDKeyCode:
  mov [cDKey],0
  mov edx,8
  jmp return

  CurseCode:
  mov [cCurse],0
  mov edx,9
  jmp return

  dKeyCode:
  mov [cKey],0
  mov edx,2
  jmp return

  code2:
  call r11
  cmp byte ptr[bExecuteInCE],1
  jne @f
  mov byte ptr[bExecuteInCE],0
  mov eax,1
  @@:
  test eax,eax
  jmp jmpbackkey

cAxe:
dd 0
cBomb:
dd 0
cKey:
dd 0
cMerch:
dd 0
cPotion:
dd 0
cPotion2:
dd 0
cBless:
dd 0
cDungeon:
dd 0
cDKey:
dd 0
cCurse:
dd 0
bExecuteInCE:
db 0

aobCFE:
  jmp newmem
return:
registersymbol(aobCFE)

//

aobscanregion(aobCFEKey,Thor:ChatManager:Process,Thor:ChatManager:Process+100,41 FF D3 ** ** 74) // should be unique
