[[cheat]]
id = "godmode"
name = "Godmode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : UnderMine
  Version: Windows Store | Version: 1.0.0.16
  Date   : 2020-08-16
  Author : SovietWristwatch.jpg
}

[ENABLE]
aobscanmodule(godmode,GameAssembly.dll,89 46 3C 33 D2 48 8B CE)
alloc(newmem,$1000,godmode)

label(code)
label(return)
label(ohkCheck)
label(isBoss)
label(isItem)
label(_ohk)

newmem:
  cmp [rsi+28],(float)0.500 // filter out enemies and barrels/boxes
  jne ohkCheck
  mov [rsi+38],+Inf
  mov [rsi+3C],+Inf
  xor edx,edx
  jmp return

ohkCheck:
  cmp [_ohk],1
  jne code
  cmp [rsi+3C-4],#750
  jge isBoss
  cmp [rsi+3C-4],#5
  je isItem
  mov [rsi+3C],#0
  xor edx,edx
  jmp return

isBoss:
  cmp [rsi+3C],#1
  jle code
  mov [rsi+3C],#1
  xor edx,edx
  jmp return

isItem:
  //cmp [rsi+244],#0
  //jne code
  //cmp [rsi+254],#0
  //jne code
  //cmp [rsi+264],#0
  //jne code
  cmp [rsi+2A4],#0
  jne code
  mov [rsi+3C],#5
  xor edx,edx
  jmp return

code:
  mov [rsi+3C],eax
  xor edx,edx
  jmp return

_ohk:
  dd 0

godmode:
  jmp newmem
return:
registersymbol(godmode)
registersymbol(_ohk)

[DISABLE]
godmode:
  db 89 46 3C 33 D2

unregistersymbol(godmode)
unregistersymbol(_ohk)
dealloc(newmem)

