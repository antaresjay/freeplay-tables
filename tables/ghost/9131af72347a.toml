[[cheat]]
id = "ghostbusters-remastered-by-mr-wizard"
name = "Ghostbusters Remastered By Mr. Wizard"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Author : Mr. Wizard }

[ENABLE]
aobscanmodule(gb,ghost.exe,0F 2F 01 48 0F 47 C1 8B)
alloc(heal,$10,"ghost.exe"+D01BA)
label(var)
label(var2)
label(rest)
label(bak)
label(one)
label(return)
registersymbol(gb)
registersymbol(var)
registersymbol(var2)

heal:
  cmp [var],1
  jne short rest
  mov [rcx],(float)1000
  mov [rax],(float)1000
  jmp return
rest:
  cmp [var],2
  jne heal
  comiss xmm0,[one]
  ja short bak
  comiss xmm0,[rcx]
  cmova rax,rcx
  jmp return
bak:
  mov [rcx],(float)100
  mov [rax],(float)100
  jmp return
var:
  dd 2
var2:
  dd 0
one:
  dd (float)100
gb:
  jmp heal
  nop 2
return:

aobscanmodule(prot,ghost.exe,F3 0F 58 83 28 4E 02 00 F3 0F 11 83 * * * * 0F 28)
alloc(proton,$10,"ghost.exe"+E965E)
label(return1)
registersymbol(prot)

proton:
  cmp [var2],0
  jne short @f
  addss xmm0,[rbx+00024E28]
  jmp return1
@@:
  cmp [var2],1
  jne proton
  movss xmm0,[rbx+00024E28]
  jmp return1
prot:
  jmp proton
  nop 3
return1:

aobscanmodule(bos,ghost.exe,F3 0F 58 B3 28 4E 02 00)
alloc(boson,$1,"ghost.exe"+E62A8)
label(return2)
registersymbol(bos)

boson:
  cmp [var2],0
  jne short @f
  addss xmm6,[rbx+00024E28]
  jmp return2
@@:
  cmp [var2],1
  jne boson
  movss xmm6,[rbx+00024E28]
  jmp return2
bos:
  jmp boson
  nop 3
return2:

aobscanmodule(sho,ghost.exe,F3 0F 11 83 28 4E 02 00 F3 0F 11)
alloc(shock,$10,"ghost.exe"+D886A)
label(return3)
registersymbol(sho)

shock:
  cmp [var2],0
  jne short @f
  movss [rbx+00024E28],xmm0
  jmp return3
@@:
  cmp [var2],1
  jne shock
  jmp return3
sho:
  jmp shock
  nop 3
return3:

aobscanmodule(sli,ghost.exe,F3 0F 58 8B 28 4E 02 00 0F 2F)
alloc(slime,$10,"ghost.exe"+D8AA7)
label(return4)
registersymbol(sli)

slime:
  cmp [var2],0
  jne short @f
  addss xmm1,[rbx+00024E28]
  jmp return4
@@:
  cmp [var2],1
  jne slime
  movss xmm1,[rbx+00024E28]
  jmp return4
sli:
  jmp slime
  nop 3
return4:

aobscanmodule(mes,ghost.exe,15 * * * * F3 0F 58 93 28 4E 02 00)
alloc(meson,$10,"ghost.exe"+D84C6)
label(return5)
registersymbol(mes)

meson:
  cmp [var2],0
  jne short @f
  addss xmm2,[rbx+00024E28]
  jmp return5
@@:
  cmp [var2],1
  jne meson
  movss xmm2,[rbx+00024E28]
  jmp return5

mes+05:
  jmp meson
  nop 3
return5:

aobscanmodule(pul,ghost.exe,C9 F3 0F 58 93 28 4E 02 00)
alloc(pulse,$10,"ghost.exe"+D8407)
label(return6)
registersymbol(pul)

pulse:
  cmp [var2],0
  jne short @f
  addss xmm2,[rbx+00024E28]
  jmp return6
@@:
  cmp [var2],1
  jne pulse
  movss xmm2,[rbx+00024E28]
  jmp return6
pul+01:
  jmp pulse
  nop 3
return6:

aobscanmodule(start,ghost.exe,10 F3 0F 11 49 10 C3 CC CC CC CC)
alloc(bas,$10,"ghost.exe"+281A4A)
alloc(base,4)
registersymbol(base)
registersymbol(start)
label(return7)

bas:
  mov [base],rcx
  add [base],10
  ret
  int 3
  int 3
  int 3
  int 3
  jmp return7

start+06:
  jmp bas
return7:

aobscanmodule(guns,ghost.exe,CF 00 00 0F 1F 80 00 00 00 00)
alloc(newmem,$1000,"ghost.exe"+10CA39)
alloc(wand,20)
registersymbol(guns)
registersymbol(wand)
label(return8)

newmem:
  mov [wand],rax
  mov [wand+8],rax
  add [wand+8],30
  mov [wand+10],rax
  add [wand+10],48
  mov [wand+18],rax
  add [wand+18],A8
  nop [rax+00000000]
  jmp return8

guns+03:
  jmp newmem
  nop 2
return8:


[DISABLE]
gb:
  db 0F 2F 01 48 0F 47 C1
prot:
  db F3 0F 58 83 28 4E 02 00
bos:
  db F3 0F 58 B3 28 4E 02 00
sho:
  db F3 0F 11 83 28 4E 02 00
sli:
  db F3 0F 58 8B 28 4E 02 00
mes+05:
  db F3 0F 58 93 28 4E 02 00
pul+01:
  db F3 0F 58 93 28 4E 02 00
start+06:
  db C3 CC CC CC CC
guns+03:
  db 0F 1F 80 00 00 00 00
unregistersymbol(gb)
unregistersymbol(prot)
unregistersymbol(bos)
unregistersymbol(sho)
unregistersymbol(sli)
unregistersymbol(mes)
unregistersymbol(pul)
