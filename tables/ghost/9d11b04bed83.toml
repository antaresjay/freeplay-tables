[[cheat]]
id = "00-ammo"
name = "00. Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : ghost.exe
  Version: 1.1.6
  Date   : 2018-01-10
  Author : Oyyzj

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(Ammo,ghost.exe,33 F0 89 71 10 A1) // should be unique
alloc(newmem,64)

label(code)
label(code1)
label(return)

newmem:
  cmp esi,01
  jg code
  cmp esi,01
  jle code1

code:
  xor esi,eax
  mov [ecx+10],esi
  jmp return

code1:
  xor esi,eax
  mov [ecx+10],01
  jmp return

Ammo:
  jmp newmem
return:
registersymbol(Ammo)

[DISABLE]

Ammo:
  db 33 F0 89 71 10

unregistersymbol(Ammo)
dealloc(newmem)"""

