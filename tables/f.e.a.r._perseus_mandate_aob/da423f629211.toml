[[cheat]]
id = "inf-health"
name = "Inf Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(originalcode)
label(exit)

//globalalloc(pHealth,4)
label(healthReadJMP)
registersymbol(healthReadJMP)
aobscan(healthRead_AOB,D8 9E B0 07 00 00 89 44 24 20 89 4C 24 14)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here

mov dword ptr [esi+000007B0],(float)100.0

originalcode:
fcomp dword ptr [esi+000007B0]

exit:
jmp returnhere

healthRead_AOB:
healthReadJMP:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
healthReadJMP:
fcomp dword ptr [esi+000007B0]
//dealloc(pHealth)
unregistersymbol(healthReadJMP)
//Alt: db D8 9E B0 07 00 00"""

