[[cheat]]
id = "inf-health-pointer-onehitkill-activate-after-1hit"
name = "Inf. Health + pointer + OneHitKill (Activate after 1hit)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : WildFrontera.exe
  Version: 
  Date   : 2017-01-30
  Author : wcz
}

[ENABLE]

aobscan(Healrh,89 83 F8 01 00 00 33)
alloc(newmem,$1000)

label(code)
label(health)
label(health_status)
label(ohk)
label(ohk_status)
label(return)
globalalloc(pchar,4)


newmem:

health:
  cmp [health_status],0
  je code
  cmp [ebx+200],0
  jne ohk
  mov [pchar],ebx
  mov eax,[ebx+000001F4]
  mov [ebx+000001F8],eax
  jmp return

health_status:
 dd 0

ohk:
  cmp [ohk_status],0
  je code
  cmp [ebx+200],0
  je code
  mov [ebx+000001F8],0
  jmp return

ohk_status:
 dd 0

code:
  mov [ebx+000001F8],eax
  jmp return

Healrh:
  jmp newmem
  nop
return:
registersymbol(Healrh)
registersymbol(health_status)
registersymbol(ohk_status)

[DISABLE]

Healrh:
  db 89 83 F8 01 00 00

unregistersymbol(Healrh)
unregistersymbol(health_status)
unregistersymbol(ohk_status)
dealloc(newmem)

