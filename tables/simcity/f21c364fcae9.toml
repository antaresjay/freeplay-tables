source = """
[ENABLE]
aobscanmodule(INJECT,SimCity.exe,74 21 8B 70 04 8B CF E8) // should be unique
alloc(newmem,$1000)
alloc(moneyBase,4)


label(code)
label(return)
label(originalcode)
label(popRegisters)
label(popperReg)

moneyBase:
  dd 0

newmem:

code:
  pushf
  cmp [eax+9c],FFFF127B
  jne originalcode
  mov [moneyBase],eax
  jmp popRegisters

popRegisters:
  push ebx
  push ecx
  xor ebx,ecx
  mov ebx,[eax+21DC] // Debt
  mov ecx,[eax+21E8] //Income
  cmp ecx,ebx
  jg popperReg
  mov ebx,[eax+21DC]
  add [eax+21E8],ebx //add positive debt to income

popperReg:
  pop ebx
  pop ecx

originalcode:
  popf
  mov esi,[eax+04]
  mov ecx,edi
  jmp return

INJECT+2:
  jmp newmem
return:
registersymbol(INJECT)
registersymbol(moneyBase)

[DISABLE]

INJECT+2:
  db 8B 70 04 8B CF

dealloc(moneyBase)
unregistersymbol(INJECT)
unregistersymbol(moneyBase)
dealloc(newmem)

