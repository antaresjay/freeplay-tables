[[cheat]]
id = "active-trainer"
name = "Active Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,1024)
label(returnhere)
label(originalcode)
registersymbol(dataecx)
label(dataecx)
registersymbol(data)
label(data)
aobscanmodule(active,SimCity.exe,3B 5C 81 04 5F 0F 9E C2 5E 8A C2 5B C3)
registersymbol(active)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
//+60 population

{4696
3c workers low
48 workers medium
54 workers high
60 total
c0 students
18 shoppers low
24 shoppers medium
30 shoppers high
-3444 industrial freight
-2C28+18 low tourists // 2C10
-2C28 medium tourists
-2C28+c high tourists //2C1C
}
push esi
lea esi,[ecx+eax*4+04]
mov [dataecx],esi
//add esi,45D0
mov [data],esi
pop esi
//mov [ecx+eax*4+04],9999999
originalcode:
cmp ebx,[ecx+eax*4+04]
pop edi
jmp returnhere
data:
dd 0
dataecx:
dd 0

active://"SimCity.exe"+221707:
jmp newmem
returnhere:


[DISABLE]
dealloc(newmem)
active://
db 3B 5C 81 04 5F
unregistersymbol(active)"""

