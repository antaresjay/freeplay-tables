[[cheat]]
id = "generic-dash-ctrl-numpad-5"
name = "Generic Dash (Ctrl + Numpad 5)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Hauntii.exe
// Author            : ndck76
// Executable Version: 2022.3.20.49918
// Game Version      : v5.1.10 Gold
// Script Date       : 2024-05-25


[ENABLE]

aobscanmodule(dashdirection,GameAssembly.dll,F2xxxxxxxxxxxxxx498Bxx0F29xxxx488B) //GenericDash.ModifyVelocity
alloc(newmem,$1000,dashdirection)
alloc(data3,8)
alloc(dashdirectionbkp,8)
registersymbol(data3)
registersymbol(dashdirection)
registersymbol(dashdirectionbkp)
label(code)
label(return)

dashdirectionbkp:
  readmem(dashdirection,8)

newmem:
  mov [data3],rdx

code:
  readmem(dashdirection,8)
  jmp return

dashdirection:
  jmp newmem
  nop 3
return:

[DISABLE]

dashdirection:
  readmem(dashdirectionbkp,8)

unregistersymbol(*)
dealloc(*)"""

