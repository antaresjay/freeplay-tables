[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(store,GameAssembly.dll,48 8B 13 48 8B 82 A8 01 00 00 48 8B 92 B0 01 00 00 48 8B CB FF D0 FF) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

label(jmpfuel)

label(fuel_pointer)
registersymbol(fuel_pointer)


newmem:
  push r11
  cmp [rbx+6C], #20
  jne code

  cmp [rbx+70], #1
  je jmpfuel
  jmp code
jmpfuel:
  cmp r14, 62
  jne code
  mov [fuel_pointer], rbx

code:
  pop r11
  mov rdx,[rbx]
  mov rax,[rdx+000001A8]
  mov rdx,[rdx+000001B0]
  jmp return

fuel_pointer:
dq 0

store:
  jmp far newmem
  nop 3
return:
registersymbol(store)

[DISABLE]

store:
  db 48 8B 13 48 8B 82 A8 01 00 00 48 8B 92 B0 01 00 00

unregistersymbol(store)
unregistersymbol(fuel_pointer)
dealloc(newmem)"""

