[[cheat]]
id = "enable-cheats"
name = "Enable Cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Dreamscaper-WinGDK-Shipping.exe
  Version: 1.1.5.0 | Windows Store
  Date   : 2022-02-04
  Author : SvT
}

[ENABLE]
aobscanmodule(player,Dreamscaper-WinGDK-Shipping.exe,EE FD FF F3 0F 10 73 04)
alloc(newmem,$1000,player)

label(code)
label(return)
label(playerBase)
registersymbol(player)
registersymbol(playerBase)

newmem:
  mov [playerBase],rbx

code:
  movss xmm6,[rbx+04]
  jmp return

playerBase:
  dd 0

player+03:
  jmp newmem
return:

[DISABLE]
player+03:
  db F3 0F 10 73 04

unregistersymbol(player)
unregistersymbol(playerBase)
dealloc(newmem)"""

