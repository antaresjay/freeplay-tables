[[cheat]]
id = "infinite-time"
name = "Infinite Time"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Time)
registersymbol(Time) //Register Symbol
aobscan(Hook, 88 4A 49 8B 45 08 8A 48 4C 88 4D FC 8B 55 FC 81 E2 FF 00 00 00)  //Find Mov

Hook:
Time:
db 90 90 90 //Nop Mov

[DISABLE]
Time:
db 88 4A 49 //Restore Mov
unregistersymbol(Time) //Unregister Symbol"""

