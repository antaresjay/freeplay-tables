[[cheat]]
id = "weapon-ctrl-numpad-2"
name = "Weapon (Ctrl + Numpad 2)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Flaw.exe
// Author            : ndck76
// Executable Version: 2021.3.11.23713
// Game Version      : Build.23290390 (Early Access)
// Script Date       : 2026-06-04


[ENABLE]

aobscanregion(bullets,Weapon:Update,Weapon:Update+2000,486386xxxx0000F3xxxxxxF3xxxxxx48B8xxxxxxxxxxxx0000F2xxxxxxF3xxxxxx48xxxxxxxxxxxxF3xxxxxxF3xxxxxx48B8xxxxxxxxxxxx0000) //Weapon:Update+6b7
alloc(newmem,$1000,bullets)
alloc(data,8)
alloc(bulletsbkp,7)
registersymbol(data)
registersymbol(bullets)
registersymbol(bulletsbkp)
label(code)
label(return)

bulletsbkp:
  readmem(bullets,7)

newmem:
  mov [data],rsi

code:
  readmem(bullets,7)
  jmp return

bullets:
  jmp newmem
  nop 2
return:

[DISABLE]

bullets:
  readmem(bulletsbkp,7)

unregistersymbol(*)
dealloc(*)"""

