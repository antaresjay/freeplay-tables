[[cheat]]
id = "stage-timer-ctrl-numpad-1"
name = "Stage Timer (Ctrl + Numpad 1)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : KAGE Shadow of the Ninja.exe
// Author            : ndck76
// Executable Version: 2022.3.31.56877
// Game Version      : Build.15220761
// Script Date       : 2024-08-30


[ENABLE]

aobscanmodule(timer,GameAssembly.dll,F3xxxxxxxxxxxxxx410Fxxxx7Axx75xx39) //nnObjPlayer.nnObjUpdate
alloc(newmem,$1000,timer)
alloc(data2,8)
alloc(timerbkp,8)
registersymbol(data2)
registersymbol(timer)
registersymbol(timerbkp)
label(code)
label(return)

timerbkp:
  readmem(timer,8)

newmem:
  mov [data2],rax

code:
  readmem(timer,8)
  jmp return

timer:
  jmp newmem
  nop 3
return:

[DISABLE]

timer:
  readmem(timerbkp,8)

unregistersymbol(*)
dealloc(*)"""

