[[cheat]]
id = "no-hit-damage"
name = "No Hit Damage"
category = "player"
description = ""
hint = ""
type = "script"
source = """
define(address, NepTime.PlayerHealth:Damage+51)
define(bytes, 4C 63 4D E0 90)
//movsxd  r9,dword ptr [rbp-20]
//nop



[ENABLE]
assert(address, bytes)

alloc(newmem,64,address)
label(returnhere)

newmem:
// rdx = 2nd arg of base.Damage(this, posture, hittype, powertype)
mov rdx,#-100
movsxd  r9,dword ptr [rbp-20]
jmp returnhere

address:
jmp newmem
returnhere:


 
 
[DISABLE]
dealloc(newmem)
address:
  db bytes"""

