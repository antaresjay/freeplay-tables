aobscanmodule(ohk,PayloadersStrike-Win64-Shipping.exe,F3xxxxxxxxxxxxxxF3xxxxxxxxxxxxxxF3xxxxxxxxF3xxxxxxxxxxxxxxF3xxxxxxxxF3xxxxxxxxxxxxxxF3xxxxxxxxF3xxxxxxxxE8) // should be unique
alloc(newmem,$1000,ohk)
