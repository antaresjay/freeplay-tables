  cmp rcx,0
  je chkHappy
  cmp rcx,1
  je chkEnergy
  cmp rcx,2
  je chkHunger
  cmp rcx,3
  je chkThirst
  cmp rcx,4
  je chkToilet
  cmp rcx,5
