  je code
  movss xmm9,[fToilet]
  jmp setVal

chkHealth:
  cmp dword ptr [fHealth],00
  je code
  movss xmm9,[fHealth]

setVal:
  movss [r14+rcx*4+10], xmm9  // float 1 = 100%

code:
  movss xmm9,[fTemp]   //pop xmm9
  popf
  movss xmm3,[r14+rcx*4+10]
  jmp return


