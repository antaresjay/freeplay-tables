[[cheat]]
id = "playerdata-base-address-scan-initialization-activate-this-first"
name = "PlayerData Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlayerData_basepointer)
registersymbol(PlayerData_update_enable)
registersymbol(PlayerData_set_enable)
registersymbol(PlayerData_healthset_enable)
registersymbol(PlayerData_costsset_enable)

alloc(PlayerData_basepointer, 8)
alloc(PlayerData_update_enable, 4)
alloc(PlayerData_set_enable, 4)
alloc(PlayerData_healthset_enable, 4)
alloc(PlayerData_costsset_enable, 4)


[DISABLE]
unregistersymbol(PlayerData_basepointer)
unregistersymbol(PlayerData_update_enable)
unregistersymbol(PlayerData_set_enable)
unregistersymbol(PlayerData_healthset_enable)
unregistersymbol(PlayerData_costsset_enable)

dealloc(PlayerData_basepointer)
dealloc(PlayerData_update_enable)
dealloc(PlayerData_set_enable)
dealloc(PlayerData_healthset_enable)
dealloc(PlayerData_costsset_enable)"""

[[cheat]]
id = "playerdata-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerData Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerData_savedAOB)
label(PlayerData_returnhere)
label(PlayerData_originalcode)
label(PlayerData_exit)

label(PlayerData_update_exit)
label(PlayerData_set_exit)
label(PlayerData_healthset_exit)
label(PlayerData_costsset_exit)

registersymbol(PlayerData_savedAOB)

//194C3E22 - 48 89 85 A8FEFFFF     - mov [rbp-00000158],rax
//194C3E29 - 48 89 85 B0FEFFFF     - mov [rbp-00000150],rax
// PlayerData:DoUpdate+70
//194C3E30 - 48 89 85 B8FEFFFF     - mov [rbp-00000148],rax
//194C3E37 - 48 8B 86 20010000     - mov rax,[rsi+00000120]
//194C3E3E - 48 8B C8              - mov rcx,rax
//194C3E41 - 48 83 EC 20           - sub rsp,20
//194C3E45 - 83 38 00              - cmp dword ptr [rax],00
aobscan(PlayerData_searchedAOB, F3 0F 10 86 78 02 00 00 F3 0F 5A C0 F2 0F 11 45 A8)

alloc(PlayerData_newmem, 2048, PlayerData_searchedAOB)
alloc(PlayerData_temp1, 8, PlayerData_searchedAOB)
alloc(PlayerData_temp2, 8, PlayerData_searchedAOB)


PlayerData_newmem:
mov [PlayerData_temp1], rbx
mov [PlayerData_temp2], rcx

cmp dword ptr [PlayerData_update_enable], #0
je PlayerData_update_exit
mov [PlayerData_basepointer], rsi
PlayerData_update_exit:

cmp dword ptr [PlayerData_set_enable], #0
je PlayerData_set_exit
PlayerData_set_exit:

cmp dword ptr [PlayerData_healthset_enable], #0
je PlayerData_healthset_exit
fild [rsi+1c8]
fstp [rsi+54]
PlayerData_healthset_exit:

cmp dword ptr [PlayerData_costsset_enable], #0
je PlayerData_costsset_exit
mov [rsi+204], (float)0
mov [rsi+208], (float)0
mov [rsi+20c], (float)0
mov [rsi+214], (float)0
PlayerData_costsset_exit:

mov rbx, [PlayerData_temp1],
mov rcx, [PlayerData_temp2],


PlayerData_originalcode:
db F3 0F 10 86 78 02 00 00
//movss xmm0,[rsi+00000278]


PlayerData_exit:
jmp PlayerData_returnhere


PlayerData_searchedAOB:
PlayerData_savedAOB:
jmp PlayerData_newmem
nop
nop
nop
PlayerData_returnhere:


[DISABLE]
PlayerData_savedAOB:
db F3 0F 10 86 78 02 00 00
//movss xmm0,[rsi+00000278]

unregistersymbol(PlayerData_savedAOB)

dealloc(PlayerData_newmem)
dealloc(PlayerData_temp1)
dealloc(PlayerData_temp2)"""

