name = "Grail Locket/Force Seal Effect For Prevent Abnormal Status/Stat Down Always Available (Must Have Accessory Equipped)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

/// This code executes before the loop to get the type of status effect to resist from the item structure
aobscanmodule(GrailLocketPreventStatusAOB1,$process,45 8B C2 48 8D 50 44 66 66 0F 1F 84 00 00 00 00 00) // should be unique
registersymbol(GrailLocketPreventStatusAOB1)
alloc(newmem,1024,GrailLocketPreventStatusAOB1)

/// This code retrieves the type of status effect to resist from the item structure and starts a loop
aobscanmodule(GrailLocketPreventStatusAOB2,$process,0F B7 02 05 69 FF FF FF 83 F8 11 0F 87 B9 00 00 00) // should be unique
registersymbol(GrailLocketPreventStatusAOB2)
alloc(newmem2,1024,GrailLocketPreventStatusAOB2)

///  This code is the loop that checks all 5 spots in the item structure
aobscanmodule(GrailLocketPreventStatusAOB3,$process,41 FF C0 48 83 C2 10 41 83 F8 05 0F 82 25 FF FF FF) // should be unique
registersymbol(GrailLocketPreventStatusAOB3)
alloc(newmem3,1024,GrailLocketPreventStatusAOB3)

///
label(return)
label(originalcode)

newmem:
  mov qword ptr [ExecutedSpecialTypes],0
  mov qword ptr [DoneExecutingSpecialTypes],0
originalcode:
  mov r8d,r10d
  lea rdx,[rax+44]
  jmp return

ExecutedSpecialTypes:
dq 0
DoneExecutingSpecialTypes:
dq 0
  
newmem2:
  cmp [ExecutedSpecialTypes],0
  je DoFirstSpecialType
  cmp [ExecutedSpecialTypes],1
  je DoSecondSpecialType
  mov [DoneExecutingSpecialTypes],1
  movzx eax,word ptr [rdx]
  jmp originalcode2
DoFirstSpecialType:
  add [ExecutedSpecialTypes],1
  mov eax,#152
  jmp originalcode2
DoSecondSpecialType:
  add [ExecutedSpecialTypes],1
  mov eax,#153
  jmp originalcode2
originalcode2:
  add eax,FFFFFF69
  jmp return2

newmem3:
  cmp [DoneExecutingSpecialTypes],1
  je originalcode3
  jmp GrailLocketPreventStatusAOB2
originalcode3:
  inc r8d
