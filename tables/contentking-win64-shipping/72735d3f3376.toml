type = "script"
source = """
[ENABLE]

aobscanmodule(LocalPlayer,ContentKing-Win64-Shipping.exe,48xxxx48xxxxxxxxxxxx33xxC3CCCCCCCCCCCCCCCCCCCC40xx48xxxxxx48xxxx48xxxxFFxxxxxxxxxx)
alloc(newmemLocalPlayer,$100,LocalPlayer)
alloc(Player,8,LocalPlayer)
alloc(LocalPlayer_savedBytes,10,LocalPlayer)
label(codeLocalPlayer returnLocalPlayer)

LocalPlayer_savedBytes:
readmem(LocalPlayer,10)

newmemLocalPlayer:
mov [Player],rcx

codeLocalPlayer:
mov rax,[rcx]
jmp qword ptr [rax+00000180]
jmp returnLocalPlayer

LocalPlayer:
jmp newmemLocalPlayer
nop 5
returnLocalPlayer:
registersymbol(LocalPlayer Player LocalPlayer_savedBytes)

[DISABLE]

LocalPlayer:
readmem(LocalPlayer_savedBytes,10)
unregistersymbol(LocalPlayer Player LocalPlayer_savedBytes)
dealloc(newmemLocalPlayer Player LocalPlayer_savedBytes)"""
