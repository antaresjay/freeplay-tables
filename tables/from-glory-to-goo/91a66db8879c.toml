[[cheat]]
id = "fast-effort-upgrade-modules"
name = "Fast Effort/Upgrade Modules"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//effort faster  -- GUIScript.Update+1BB
aobscanmodule(fasteffort,GameAssembly.dll,F3 0F 5C F0 F3 0F 11 B3 00 0E 00 00) // should be unique
alloc(newmem,$100,fasteffort)
alloc(effortmult,$16,fasteffort)

label(code)
label(return)

effortmult:
  dd (float)8
newmem:
  mulss xmm0,[effortmult]
code:
  subss xmm6,xmm0
  movss [rbx+00000E00],xmm6
  jmp return

fasteffort:
  jmp newmem
  nop 7
return:

//module upgrade faster  -- Module.Update+1C2
aobscanmodule(fastmoduleupgrade,GameAssembly.dll,F3 41 0F 59 C0 F3 0F 5C F0 0F) // should be unique
alloc(newmem1,$100,fastmoduleupgrade)
alloc(modulemult,$16,fastmoduleupgrade)

label(code1)
label(return1)

modulemult:
  dd (float)32
newmem1:
  mulss xmm0,[modulemult]
code1:
  subss xmm6,xmm0
  comiss xmm7,xmm6
  jmp return1

fastmoduleupgrade:
  jmp newmem1
  nop 2
return1:

//research faster -- Tech.increaseAmountResearched+32
aobscanmodule(fastresearch,GameAssembly.dll,F3 0F 11 73 2C 48 8B 05)
alloc(newmem2,$100,fastresearch)
alloc(researchmult,$20,fastresearch)

label(code2)
label(return2)

researchmult:
  dd (float)4
newmem2:
  mulss xmm6,[researchmult]
code2:
  movss [rbx+2C],xmm6
  jmp return2

fastresearch:
  jmp newmem2
return2:

registersymbol(fasteffort effortmult fastmoduleupgrade modulemult fastresearch researchmult)

[DISABLE]
fasteffort:
  db F3 0F 5C F0 F3 0F 11 B3 00 0E 00 00

fastmoduleupgrade:
  db F3 41 0F 59 C0

fastresearch:
  db F3 0F 11 73 2C

unregistersymbol(*)
dealloc(*)"""

