[[cheat]]
id = "quick-ship-power-regen"
name = "Quick ship power regen"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(fastshippwINJECT,GameAssembly.dll,F3 0F 10 B8 98 01 00 00) // should be unique
alloc(newmem,$100,fastshippwINJECT)

label(code)
label(return)

newmem:
  mov [rax+198],(float)250
code:
  movss xmm7,[rax+00000198]
  jmp return

fastshippwINJECT:
  jmp newmem
  nop 3
return:
registersymbol(fastshippwINJECT)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
fastshippwINJECT:
  db F3 0F 10 B8 98 01 00 00

unregistersymbol(*)
dealloc(*)"""

[[cheat]]
id = "quick-build"
name = "Quick Build"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(quickbuild,GameAssembly.dll,F3 0F 10 B3 18 05 00 00 83) // should be unique
alloc(quickbuildnewmem,$100,quickbuild)

label(quickbuildcode)
label(quickbuildreturn)

quickbuildnewmem:
  cmp [rbx+1F9],#1 //check if building or not
  jne quickbuildcode
  cmp [rbx+521],#1 //check if the unit is underConstruction
  jne quickbuildcode
  mov [rbx+518],00  //timeToBuildRemaining set to 0 for instant build
  movss xmm15,[rbx+1E8]
  movss [rbx+1EC],xmm15  //set building to maxHealth after built
  jmp quickbuildreturn

quickbuildcode:
  movss xmm6,[rbx+00000518]
  jmp quickbuildreturn

quickbuild:
  jmp quickbuildnewmem
  nop 3
quickbuildreturn:
registersymbol(quickbuild)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
quickbuild:
  db F3 0F 10 B3 18 05 00 00

unregistersymbol(*)
dealloc(*)"""

