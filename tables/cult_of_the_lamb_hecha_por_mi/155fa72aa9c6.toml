[[cheat]]
id = "inmortal-con-esto-activo-no-podras-modificar-pointers"
name = "Inmortal (con esto activo no podras modificar pointers)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
// 1. Buscamos la instrucción del juego
aobscanregion(gethp_aob, HealthPlayer:get_HP, HealthPlayer:get_HP+20, F3 0F 10 86 D4 03 00 00)
alloc(newmem,$1000,gethp_aob)

label(code)
label(return)
label(pbasehp)
registersymbol(pbasehp)
registersymbol(gethp_aob)

newmem:
  // Guardamos la dirección base en nuestro puntero
  mov [pbasehp], rsi

  // --- LÓGICA DE VIDA INFINITA ---
  // Leemos la Vida Máxima (offset 204) y la movemos a un registro temporal (xmm0)
  movss xmm0, [rsi+204]

  // Escribimos ese valor máximo en la Vida Real (3d4)
  movss [rsi+3D4], xmm0

  // Escribimos ese valor máximo en la Vida Visual (208)
  movss [rsi+208], xmm0
  // -------------------------------

code:
  // Instrucción original (ahora xmm0 ya lleva el valor máximo)
  movss xmm0,[rsi+000003D4]
  jmp return

pbasehp:
  dq 0

gethp_aob:
  jmp newmem
  nop 3
return:

[DISABLE]
gethp_aob:
  db F3 0F 10 86 D4 03 00 00

unregistersymbol(pbasehp)
unregistersymbol(gethp_aob)
dealloc(newmem)"""

