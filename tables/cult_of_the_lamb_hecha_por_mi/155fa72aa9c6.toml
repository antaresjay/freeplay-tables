[[cheat]]
id = "no-consumir-items-aobscan-restar-o-sumar-item-y-darle-a-activar"
name = "No consumir items aobscan - RESTAR O SUMAR ITEM y darle a activar"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{
  Game   : Cult Of The Lamb
  Script : Recurso Infinito (Solución Definitiva por Firma de Bytes)
}

[ENABLE]
// Buscamos la "huella dactilar" del código en toda la memoria del juego.
// Al ser una cadena de 8 bytes específica, es muy difícil que falle.
aobscan(INJECT, 41 89 46 14 49 63 46 18)

alloc(newmem,$1000,INJECT)
label(is_negative)
label(return)

newmem:
  // EDI es la cantidad a cambiar
  cmp edi,0
  jl is_negative

  // --- GANAR RECURSOS ---
  mov [r14+14],eax
  movsxd rax,dword ptr [r14+18]
  jmp return

is_negative:
  // --- GASTAR RECURSOS (Bloqueado) ---
  movsxd rax,dword ptr [r14+18]
  jmp return

INJECT:
  jmp newmem
  nop 3
return:

registersymbol(INJECT)

[DISABLE]
INJECT:
  db 41 89 46 14 49 63 46 18

unregistersymbol(INJECT)
dealloc(newmem)"""
