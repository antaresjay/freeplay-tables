source = """
{
===========================================
 Game Title    : Might&Magic Heroes VI - Shades of Darkness
 Game Version  : 2.1.1.0
 Game Process  : Might & Magic Heroes VI.exe
 Game Sponsor  : Myself
 Script Version: 2.0
 CE Version    : 6.3
 Release date  : 01-Nov-2013
 Author        : Recifense
 History:
 25-May-12: Release for version 1.4.0.0
 08-Nov-12: Release for version 1.7.1.0 (gold)
 20-Jan-13: Release for version 1.8.0.0 (gold)
 04-May-13: Release for version 2.1.0.0 (SoD)
 16-Sep-13: Release for version 2.1.1.0 +GM (SoD) s2.0
 01-Nov-13: Release for version 2.1.1.0 (steam)
 Features:
 - Minimum Resources:
   - Gold (63000)
   - Wood (6300)
   - Ore  (6300)
   - Blood Crystal (6300)
 - Unlimited Movement for player's armies
 - Minimum Troop Size for player's moving Army:
   - minimum value can be defined by user
 - Minimum XP for player's moving hero
   - minimum value can be defined by user
 - Recover Mana (on the move)
 - God Mode
===========================================
}

//=========================================
// Definitions
define(LUDO,"Might & Magic Heroes VI.exe")
define(MPRS,"Might & Magic Heroes VI.exe"+0004f946) //=
define(MMVP,"Might & Magic Heroes VI.exe"+01367c83) //=
define(MHMA,"Might & Magic Heroes VI.exe"+01316335) //=
define(GDMD,"Might & Magic Heroes VI.exe"+0037de74) //new

//=========================================
[ENABLE]
//=========================================
// Check if script is compatible to this game version
// If false the script will not be loaded

assert(MPRS,8b 75 c0 83 c6 04 8d 7d cc b9 08 00 00 00 f3 a5 c7 45 fc 00 00 00)
assert(MMVP,f3 0f 11 40 0c 8b 0d ?? ?? ?? ?? 8b 91 d0 00 00 00 8b 82 dc 00 00)
assert(MHMA,d9 45 fc 8b e5 5d c3 ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ??)
assert(GDMD,f3 0f 11 42 50 8b 85 28 ff ff ff 2b 85 94 fe ff ff 50 8b 8d 18 fc)

//=========================================
alloc(MyCode,4096,LUDO)
//=========================================
// Declaration section
label(_MonPlayerResources)
label(_MonPR00)
label(_MonPR01)
label(_MonPR02)
label(_BackMPR)
label(_ExitMPR)
label(_MonMovePoints)
label(_MonMP00)
label(_MonMP01)
label(_MonMP02)
label(_MonMP03)
label(_MonMP04)
label(_BackMMP)
label(_ExitMMP)
label(_MonHeroMana)
label(_BackMHM)
label(_ExitMHM)
label(_GodMode)
label(_BackGMD)
label(_ExitGMD)
label(pRes)
label(pUnit)
label(pHero)
label(iEnableMR)
label(iEnableMM)
label(iEnableMS)
label(iEnableMX)
label(iEnableMMa)
label(iEnableGMD)
label(iMinSize)
label(iMinXP)
label(fSaveSS)

//=========================================
// Registering Symbols
registersymbol(MyCode)
registersymbol(pUnit)
registersymbol(pRes)
registersymbol(pHero)
registersymbol(iEnableMR)
registersymbol(iEnableMM)
registersymbol(iEnableMS)
registersymbol(iEnableMX)
registersymbol(iEnableMMa)
registersymbol(iEnableGMD)
registersymbol(iMinSize)
registersymbol(iMinXP)

//=========================================
MyCode:
//========================================= 210
// On main game screen
_MonPlayerResources:
 mov esi,[ebp-40]                  // Original code
 lea edi,[esi-28]                  // Adjust pointer
 mov [pRes],edi                    // Save it for further use

 cmp dword ptr [iEnableMR],0
 je _ExitMPR                       // Jump if feature is disabled

 mov ecx,#63000
 mov edi,[esi+04]
 xor edi,[esi+08]
 cmp ecx,edi                       // Gold
 jle _MonPR00

 mov edi,ecx
 xor edi,[esi+08]
 mov [esi+04],edi

_MonPR00:
 mov ecx,#6300

 mov edi,[esi+0c]
 xor edi,[esi+10]
 cmp ecx,edi                       // Wood
 jle _MonPR01

 mov edi,ecx
 xor edi,[esi+10]
 mov [esi+0c],edi

_MonPR01:
 mov edi,[esi+14]
 xor edi,[esi+18]
 cmp ecx,edi                       // Ore
 jle _MonPR02

 mov edi,ecx
 xor edi,[esi+18]
 mov [esi+14],edi

_MonPR02:
 mov edi,[esi+1c]
 xor edi,[esi+20]
 cmp ecx,edi                       // Blood Crystal
 jle _ExitMPR

 mov edi,ecx
 xor edi,[esi+20]
 mov [esi+1c],edi

_ExitMPR:
 mov esi,[ebp-40]                  // Original code
 add esi,04                        // Original code
 jmp _BackMPR                      // Back to main code

//========================================= 210
// While moving army
_MonMovePoints:
 push edx
 push ebx
 push ecx
 push edi
 push esi

 mov ecx,eax

 mov eax,[ecx+10]

 mov ebx,[eax+0000011c]
 cmp ebx,00020000
 jne _ExitMMP

 mov [pHero],eax

 mov edx,[eax+70]                  // Get pArmy
 test edx,edx
 jz _MonMP02

 mov ebx,[edx+0c]                  // Get # troops
 test ebx,ebx
 jz _MonMP02

 cmp dword ptr [iEnableMS],0       // Troop Size
 je _MonMP02                       // Jump if feature is disabled

 mov edx,[edx+04]                  // get pTroopList
 test edx,edx
 jz _MonMP02

 mov eax,[iMinSize]

_MonMP00:
 dec ebx

 mov esi,[edx+ebx*4]               // Get Troop
 mov [pUnit],esi                   // Save ptr for debugging
 mov edi,[esi+54]
 xor edi,[esi+58]
 cmp eax,edi
 jle _MonMP01

 mov edi,eax
 xor edi,[esi+58]
 mov [esi+54],edi

_MonMP01:
 test ebx,ebx
 jnz _MonMP00

_MonMP02:
 cmp dword ptr [iEnableMX],0
 je _MonMP03                      // Jump if feature is disabled

 mov eax,[pHero]
 mov esi,[eax+00000134]           // Get pXP
 test esi,esi
 jz _MonMP03

 mov eax,[iMinXP]
 mov edi,[esi+0c]
 xor edi,[esi+10]
 cmp eax,edi
 jle _MonMP03

 mov edi,eax
 xor edi,[esi+10]
 mov [esi+0c],edi

_MonMP03:
 mov eax,[pHero]

 cmp dword ptr [iEnableMM],0
 je _MonMP04                       // Jump if feature is disabled

 mov edx,[eax+00000678]
 test edx,edx
 jz _MonMP04

 movss xmm0,[eax+00000678]

_MonMP04:
_ExitMMP:
 mov eax,ecx

 pop esi
 pop edi
 pop ecx
 pop ebx
 pop edx

 movss [eax+0C],xmm0               // Original code
 jmp _BackMMP                      // Back to main code

//========================================= 210
// During Battle
_MonHeroMana:
 push eax
 push ebx

 cmp dword ptr [iEnableMMa],0
 je _ExitMHM                       // Jump if feature is disabled

 mov ebx,[ebp-0c]                  // Get pHero
 cmp ebx,[pHero]
 jne _ExitMHM

 mov eax,[ebp-04]
 mov [ebx+000006e8],eax

_ExitMHM:
 pop ebx
 pop eax

 fld dword ptr [ebp-04]            // Original code
 mov esp,ebp                       // Original code
 jmp _BackMHM                      // Back to main code

//========================================= 211
// During Battle
_GodMode:
 push eax

 cmp dword ptr [iEnableGMD],0
 je _ExitGMD                       // Jump if feature is disabled

 mov eax,[edx+18]
 test eax,eax
 jz _ExitGMD

 mov eax,[eax+10]
 test eax,eax
 jnz _ExitGMD

  mov eax,[edx+48]
 mov [edx+44],eax
 mov [edx+40],eax
 mov [ebp-000000d8],eax
 mov [ebp-0000016c],eax
 xor eax,eax
 mov [edx+00000990],eax
 mov [edx+00000994],eax

 movss xmm0,[edx+000004a4]

_ExitGMD:
 pop eax

 movss [edx+50],xmm0               // Original code
 jmp _BackGMD                      // Back to main code

//=========================================
 db '===============================>'
 db 'CE6.3 Script by Recifense 110113'
//=========================================
// Variables
iEnableMR:
 dd 0
iEnableMM:
 dd 0
iEnableMS:
 dd 0
iEnableMX:
 dd 0
iEnableMMa:
 dd 0
iEnableGMD:
 dd 0
pUnit:
 dd 0
pRes:
 dd 0
pHero:
 dd 0
iMinSize:
 dd #2000
iMinXP:
 dd #10000
fSaveSS:
 dd 00

//=========================================
// Hacking Points
MPRS:
 jmp _MonPlayerResources
 nop
_BackMPR:

MMVP:
 jmp _MonMovePoints
_BackMMP:

MHMA:
 jmp _MonHeroMana
_BackMHM:

GDMD:
 jmp _GodMode
_BackGMD:

//=========================================
// Script for Restoring Original Codes
[DISABLE]
MPRS:
// mov esi,[ebp-40]
// add esi,04
 db 8b 75 c0 83 c6 04

MMVP:
// movss [eax+0C],xmm0
 db f3 0f 11 40 0c

MHMA:
// fld dword ptr [ebp-04]
// mov esp,ebp
 db d9 45 fc 8b e5

GDMD:
// movss [edx+50],xmm0
 db f3 0f 11 42 50

//=========================================
// Unregistering Symbols
unregistersymbol(MyCode)
unregistersymbol(pUnit)
unregistersymbol(pRes)
unregistersymbol(pHero)
unregistersymbol(iEnableMR)
unregistersymbol(iEnableMM)
unregistersymbol(iEnableMS)
unregistersymbol(iEnableMX)
unregistersymbol(iEnableMMa)
unregistersymbol(iEnableGMD)
unregistersymbol(iMinSize)
unregistersymbol(iMinXP)

//=========================================
dealloc(MyCode)
//============= Scripts End ===============

// ****************************************
// NOTES
// ****************************************
{
v2.1.0.0
define(MPRS,"Might & Magic Heroes VI.exe"+0004f946)
define(MMVP,"Might & Magic Heroes VI.exe"+01367c43)
define(MHMA,"Might & Magic Heroes VI.exe"+013162f5)

MMAN:
sl = AOBScan("d8 45 ec d9 5d fc d9 45 fc 8b e5 5d c3");
}"""

