[[cheat]]
id = "game-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Game Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Game_savedAOB)
label(Game_returnhere)
label(Game_originalcode)
label(Game_exit)

label(Game_update_exit)
label(Game_set_exit)
label(Game_goldset_exit)
label(Game_resourcesset_exit)

registersymbol(Game_savedAOB)

//27494F3E - 48 83 C4 20           - add rsp,20
//27494F42 - 48 8B C8              - mov rcx,rax
//27494F45 - 83 39 00              - cmp dword ptr [rcx],00
// Bumblebee:Game:TotalAmmount+208
//27494F48 - 48 63 40 3C           - movsxd  rax,dword ptr [rax+3C]
//27494F4C - 44 03 E8              - add r13d,eax
//27494F4F - 41 FF C6              - inc r14d
//27494F52 - 49 8B 87 D0000000     - mov rax,[r15+000000D0]
aobscan(Game_searchedAOB, 48 63 40 3C 44 03 E8 41 FF C6)

alloc(Game_newmem, 2048, Game_searchedAOB)
alloc(Game_temp1, 8, Game_searchedAOB)


Game_newmem:
mov [Game_temp1], rbx

cmp dword ptr [Game_update_enable], #0
je Game_update_exit
mov [Game_basepointer], r15
mov [Game_Storage_basepointer], rax
Game_update_exit:

cmp dword ptr [Game_set_enable], #0
je Game_set_exit
Game_set_exit:

cmp dword ptr [Game_goldset_enable], #0
je Game_goldset_exit
mov [r15+148], #9999
Game_goldset_exit:

cmp dword ptr [Game_resourcesset_enable], #0
je Game_resourcesset_exit
mov ebx, [rax+34]
mov [rax+3c], ebx
Game_resourcesset_exit:

mov rbx, [Game_temp1]


Game_originalcode:
db 48 63 40 3C 44 03 E8
//movsxd  rax,dword ptr [rax+3C]
//add r13d,eax


Game_exit:
jmp Game_returnhere


Game_searchedAOB:
Game_savedAOB:
jmp Game_newmem
nop
nop
Game_returnhere:


[DISABLE]
Game_savedAOB:
db 48 63 40 3C 44 03 E8
//movsxd  rax,dword ptr [rax+3C]
//add r13d,eax

unregistersymbol(Game_savedAOB)

dealloc(Game_newmem)
dealloc(Game_temp1)"""

