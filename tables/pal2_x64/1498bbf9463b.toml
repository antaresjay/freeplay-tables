[[cheat]]
id = "item-usage"
name = "Item Usage"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : 仙劍奇俠傳二
  Version: BuildID 6797051
  Date   : 2026-07-05
  Author : Oyyzj

  item will not decrease when have less than 3
}

[ENABLE]


aobscanmodule(Item,Pal2_x64.exe,FF 49 04 83 79 04 00) // should be unique
alloc(newmem,$100,Item)
alloc(pItem,4)
label(code)
label(return)

newmem:
  cmp byte [eItem],1
  jne code
  mov [pItem],rcx
  cmp dword ptr [rcx+04],02
  jg code
  inc [rcx+04]
code:
  dec [rcx+04]
  cmp dword ptr [rcx+04],00
  jmp return

rItem:
  readmem(Item,7)
eItem:
  dd 1

Item:
  jmp newmem
  db 90 90
return:
registersymbol(Item)
registersymbol(pItem)
registersymbol(rItem)
registersymbol(eItem)

[DISABLE]

Item:
  readmem(rItem,7)

unregistersymbol(*)
dealloc(*)"""

