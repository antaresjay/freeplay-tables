[[cheat]]
id = "character-stats-open-character-menu"
name = "Character Stats (open character menu)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : 仙劍奇俠傳二
  Version: BuildID 6797051
  Date   : 2026-07-05
  Author : Oyyzj

  open character menu
}

[ENABLE]

aobscanmodule(CharStatsBase,Pal2_x64.exe,8B 80 34 01 00 00 44 8B C7) // should be unique
alloc(newmem,$100,CharStatsBase)
alloc(pCharStatsBase,4)
label(code)
label(return)

newmem:
  cmp byte [eCharStatsBase],1
  jne code
  mov [pCharStatsBase],rax
code:
  mov eax,[rax+00000134]
  jmp return

rCharStatsBase:
  readmem(CharStatsBase,6)
eCharStatsBase:
  dd 1
CharStatsBase:
  jmp newmem
  nop
return:
registersymbol(CharStatsBase)
registersymbol(pCharStatsBase)
registersymbol(rCharStatsBase)
registersymbol(eCharStatsBase)

[DISABLE]

CharStatsBase:
  readmem(rCharStatsBase,6)

unregistersymbol(*)
dealloc(*)"""

