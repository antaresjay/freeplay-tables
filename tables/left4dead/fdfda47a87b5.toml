[[cheat]]
id = "no-reload"
name = "No Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)

aobscanmodule(reloaded,server.dll,83 BE A8 04 00 00 00 75 46 8B 06)
registersymbol(reloaded)
newmem:
mov [esi+000004A8],64

cmp dword ptr [esi+000004A8],00
jmp returnhere

reloaded:
jmp newmem
nop
nop
returnhere:




[DISABLE]
reloaded:
db 83 BE A8 04 00 00 00
unregistersymbol(reloaded)"""

