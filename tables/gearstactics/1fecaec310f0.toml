[[cheat]]
id = "enable-cheats"
name = "Enable Cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Gears Tactics - Windows Store
  Date   : 2020-12-02
  Author : SovietWristwatch.jpg
}

[ENABLE]
aobscanmodule(enableCheats,GearsTactics.exe,F3 0F 11 81 38 20 00 00 0F)
alloc(newmem,$1000,enableCheats)

label(code)
label(return)
label(_godmode)
label(_ohk)
label(mySymb)

newmem:
  cmp [_godmode],1
  jne enemy
  cmp [rcx+930],#1
  jne enemy
  mov [rcx+00002038],(float)999
  jmp return

enemy:
  cmp [_ohk],1
  jne code
  cmp [rcx+00002038],(float)500
  je jack
  mov [rcx+00002038],(float)-999
  jmp return

jack:
mov [rcx+00002038],(float)999
  jmp return

code:
  movss [rcx+00002038],xmm0
  jmp return

_godmode:
  dd 0

_ohk:
  dd 0

mySymb:
  dd 0

enableCheats:
  jmp newmem
  nop 3
return:
registersymbol(enableCheats)
registersymbol(_godmode)
registersymbol(_ohk)
registersymbol(mySymb)

[DISABLE]
enableCheats:
  db F3 0F 11 81 38 20 00 00

unregistersymbol(enableCheats)
unregistersymbol(_godmode)
unregistersymbol(_ohk)
unregistersymbol(mySymb)
dealloc(newmem)"""

