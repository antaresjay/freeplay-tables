[[cheat]]
id = "start-script-on-value-change"
name = "-> Start Script ( On Value Change)"
category = "misc"
description = ""
hint = ""
type = "script"
source = '''
//Target:  dps2.exe
//Author:  Salis
//Credit to METHOS for custom Template LUA

[ENABLE]

////////////////////////  scriptest  \\\\\\\\\\\\\\\\\\\\\\\\

aobscanmodule(address,dps2.exe,89 06 89 4E 04 5F 5E 5B 83 C4 28)
alloc(newmem,1024,dps2.exe)
alloc(gnberry, 4)
alloc(gemnball,4)
alloc(buggysc,4)
alloc(obytes_scriptest, 10)
label(return originalcode)

registersymbol(obytes_scriptest gnberry gemnball buggysc)

obytes_scriptest:
readmem(address, 10)

gnberry:
dd #0

gemnball:
dd #0

buggysc:
dd #0


newmem:

originalcode:
 mov [esi],eax
 mov [esi+04],ecx
 cmp [esi+08],#12
 jne sfilter
 cmp [esi+3c],#6
 jne return
 cmp [esi+1c],#2
 jne return
// Gold & Berries
 cmp [gnberry],#1
 jne return
 fld qword ptr [newval]
 fstp qword ptr [esi]
 jmp return

sfilter:
 cmp [esi+2c],#2
 jne return
 cmp [esi+1c],#6
 jne tfilter
//Gems and Balls
 cmp [gemnball],#1
 jne return
 fld qword ptr [newval]
 fstp qword ptr [esi]
 jmp return

tfilter:
//Clicks?
 cmp [buggysc],#1
 jne return
 fld qword ptr [newval]
 fstp qword ptr [esi]
 jmp return

newval:
dq (double)99

newfullval:
dq (double)1e999

address:
 jmp newmem
 return:


[DISABLE]

address:
readmem(obytes_scriptest, 10)

dealloc(*)
unregistersymbol(*)'''

