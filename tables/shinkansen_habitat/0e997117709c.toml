[[cheat]]
id = "habitatnode-base-address-scan-to-activate-battle-to-update-battle"
name = "HabitatNode Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(HabitatNode_savedAOB)
label(HabitatNode_returnhere)
label(HabitatNode_originalcode)
label(HabitatNode_exit)

label(HabitatNode_update_exit)
label(HabitatNode_set_exit)
label(HabitatNode_healthset_exit)

registersymbol(HabitatNode_savedAOB)

//0468A69C - 57                    - push edi
//0468A69D - 56                    - push esi
// HabitatNode:Update+6
//0468A69E - 81 EC 3C010000        - sub esp,0000013C
//0468A6A4 - 8B 7D 08              - mov edi,[ebp+08]
//0468A6A7 - C7 85 DCFEFFFF 00000000 - mov [ebp-00000124],00000000
//0468A6B1 - C7 85 E0FEFFFF 00000000 - mov [ebp-00000120],00000000
//0468A6BB - C7 85 E4FEFFFF 00000000 - mov [ebp-0000011C],00000000
aobscan(HabitatNode_searchedAOB, 81 EC 3C 01 00 00 8B 7D 08 C7 85 DC FE FF FF 00 00 00 00)

alloc(HabitatNode_newmem, 2048, HabitatNode_searchedAOB)
alloc(HabitatNode_temp1, 4, HabitatNode_searchedAOB)


HabitatNode_newmem:
mov [HabitatNode_temp1], ebx

cmp dword ptr [edi+bc], #0
jne HabitatNode_healthset_exit

cmp dword ptr [HabitatNode_update_enable], #0
je HabitatNode_update_exit
mov [HabitatNode_basepointer], edi
HabitatNode_update_exit:

cmp dword ptr [HabitatNode_set_enable], #0
je HabitatNode_set_exit
HabitatNode_set_exit:

cmp dword ptr [HabitatNode_healthset_enable], #0
je HabitatNode_healthset_exit
cmp dword ptr [edi+50], #0
je HabitatNode_healthset_exit
mov ebx, [edi+50]
fld [ebx+10]
fstp [ebx+14]
HabitatNode_healthset_exit:

mov ebx, [HabitatNode_temp1]


HabitatNode_originalcode:
db C7 85 DC FE FF FF 00 00 00 00
//mov [ebp-00000124],00000000


HabitatNode_exit:
jmp HabitatNode_returnhere


HabitatNode_searchedAOB + 9:
HabitatNode_savedAOB:
jmp HabitatNode_newmem
nop
nop
nop
nop
nop
HabitatNode_returnhere:


[DISABLE]
HabitatNode_savedAOB:
db C7 85 DC FE FF FF 00 00 00 00
//mov [ebp-00000124],00000000

unregistersymbol(HabitatNode_savedAOB)

dealloc(HabitatNode_newmem)
dealloc(HabitatNode_temp1)"""

