[[cheat]]
id = "habitatmanager-base-address-scan-initialization-activate-this-first"
name = "HabitatManager Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(HabitatManager_basepointer)
registersymbol(HabitatManager_update_enable)
registersymbol(HabitatManager_set_enable)
registersymbol(HabitatManager_resourcesset_enable)
registersymbol(HabitatManager_citizensset_enable)
registersymbol(HabitatManager_healthset_enable)
registersymbol(HabitatManager_invincibleset_enable)
registersymbol(HabitatManager_connectorlengthset_enable)

alloc(HabitatManager_basepointer, 4)
alloc(HabitatManager_update_enable, 4)
alloc(HabitatManager_set_enable, 4)
alloc(HabitatManager_resourcesset_enable, 4)
alloc(HabitatManager_citizensset_enable, 4)
alloc(HabitatManager_healthset_enable, 4)
alloc(HabitatManager_invincibleset_enable, 4)
alloc(HabitatManager_connectorlengthset_enable, 4)


[DISABLE]
unregistersymbol(HabitatManager_basepointer)
unregistersymbol(HabitatManager_update_enable)
unregistersymbol(HabitatManager_set_enable)
unregistersymbol(HabitatManager_resourcesset_enable)
unregistersymbol(HabitatManager_citizensset_enable)
unregistersymbol(HabitatManager_healthset_enable)
unregistersymbol(HabitatManager_invincibleset_enable)
unregistersymbol(HabitatManager_connectorlengthset_enable)

dealloc(HabitatManager_basepointer)
dealloc(HabitatManager_update_enable)
dealloc(HabitatManager_set_enable)
dealloc(HabitatManager_resourcesset_enable)
dealloc(HabitatManager_citizensset_enable)
dealloc(HabitatManager_healthset_enable)
dealloc(HabitatManager_invincibleset_enable)
dealloc(HabitatManager_connectorlengthset_enable)"""

[[cheat]]
id = "habitatmanager-base-address-scan-to-activate-battle-to-update-battle"
name = "HabitatManager Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(HabitatManager_savedAOB)
label(HabitatManager_returnhere)
label(HabitatManager_originalcode)
label(HabitatManager_exit)

label(HabitatManager_update_exit)
label(HabitatManager_set_exit)
label(HabitatManager_resourcesset_exit)
label(HabitatManager_citizensset_exit)
label(HabitatManager_healthset_exit)
label(HabitatManager_connectorlengthset_exit)

registersymbol(HabitatManager_savedAOB)

//04691793 - C7 45 94 00000000     - mov [ebp-6C],00000000
//0469179A - C7 45 98 00000000     - mov [ebp-68],00000000
// HabitatManager:Update+49
//046917A1 - C7 85 6CFFFFFF 00000000 - mov [ebp-00000094],00000000
//046917AB - 8B 47 10              - mov eax,[edi+10]
//046917AE - 83 EC 08              - sub esp,08
//046917B1 - 6A 00                 - push 00
//046917B3 - 50                    - push eax
aobscan(HabitatManager_searchedAOB, C7 85 6C FF FF FF 00 00 00 00 8B 47 10 83 EC 08)

alloc(HabitatManager_newmem, 2048, HabitatManager_searchedAOB)
alloc(HabitatManager_temp1, 4, HabitatManager_searchedAOB)


HabitatManager_newmem:
mov [HabitatManager_temp1], ebx

cmp dword ptr [edi+10], #0
je HabitatManager_connectorlengthset_exit
mov ebx, [edi+10]
cmp dword ptr [ebx+38], #0
jne HabitatManager_connectorlengthset_exit

cmp dword ptr [HabitatManager_update_enable], #0
je HabitatManager_update_exit
mov [HabitatManager_basepointer], edi
HabitatManager_update_exit:

cmp dword ptr [HabitatManager_set_enable], #0
je HabitatManager_set_exit
HabitatManager_set_exit:

cmp dword ptr [HabitatManager_resourcesset_enable], #0
je HabitatManager_resourcesset_exit
fld [edi+6c]
fstp [edi+5c]
fld [edi+70]
fstp [edi+60]
fld [edi+74]
fstp [edi+64]
HabitatManager_resourcesset_exit:

cmp dword ptr [HabitatManager_citizensset_enable], #0
je HabitatManager_citizensset_exit
fld [edi+78]
fstp [edi+68]
cmp dword ptr [edi+10], #0
je HabitatManager_citizensset_exit
mov ebx, [edi+10]
mov eax, [ebx+68]
mov [ebx+64], eax
HabitatManager_citizensset_exit:

cmp dword ptr [HabitatManager_healthset_enable], #0
je HabitatManager_healthset_exit
cmp dword ptr [edi+10], #0
je HabitatManager_healthset_exit
mov ebx, [edi+10]
cmp dword ptr [ebx+18], #0
je HabitatManager_healthset_exit
mov ebx, [ebx+18]
cmp dword ptr [ebx+50], #0
je HabitatManager_healthset_exit
mov ebx, [ebx+50]
fld [ebx+10]
fstp [ebx+14]
HabitatManager_healthset_exit:

cmp dword ptr [HabitatManager_connectorlengthset_enable], #0
je HabitatManager_connectorlengthset_exit
mov [edi+48], (float)150
HabitatManager_connectorlengthset_exit:

mov ebx, [HabitatManager_temp1]


HabitatManager_originalcode:
db 8B 47 10 83 EC 08
//mov eax,[edi+10]
//sub esp,08


HabitatManager_exit:
jmp HabitatManager_returnhere


HabitatManager_searchedAOB + a:
HabitatManager_savedAOB:
jmp HabitatManager_newmem
nop
HabitatManager_returnhere:


[DISABLE]
HabitatManager_savedAOB:
db 8B 47 10 83 EC 08
//mov eax,[edi+10]
//sub esp,08

unregistersymbol(HabitatManager_savedAOB)

dealloc(HabitatManager_newmem)
dealloc(HabitatManager_temp1)"""

