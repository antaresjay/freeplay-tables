[[cheat]]
id = "research-speed-multiplier"
name = "Research Speed Multiplier"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
// Scans for:
// addsd xmm0,xmm1      (adds the double-precision increment to current progress)
// cvtsd2ss xmm5,xmm0   (converts it back to float)
// movss [rsi+6C],xmm5  (stores it back into _researchProgress)
aobscanregion(ResearchSpeedAOB,DreamWayGames.EspressoTycoon.ResearchCategory:MakeProgressIfPossible,DreamWayGames.EspressoTycoon.ResearchCategory:MakeProgressIfPossible+300, F2 0F 58 C1 F2 0F 5A E8 F3 0F 11 6E 6C)
alloc(newmem,$64,DreamWayGames.EspressoTycoon.ResearchCategory:MakeProgressIfPossible)
alloc(fSpeedMult,$8,DreamWayGames.EspressoTycoon.ResearchCategory:MakeProgressIfPossible) // Allocated as 8 bytes because xmm1 is double-precision here

// Set your custom multiplier here
fSpeedMult:
dq (double)500.0

newmem:
  mulsd xmm1, [fSpeedMult] // Multiply the incoming increment by your multiplier
  addsd xmm0, xmm1         // Original code: Add increment to current progress
  cvtsd2ss xmm5, xmm0      // Original code: Convert back to float
  jmp return

ResearchSpeedAOB:
  jmp newmem
  nop 3 // Pad the remaining 3 bytes of the 8 bytes we overwrote
return:

registersymbol(ResearchSpeedAOB)
registersymbol(fSpeedMult)

[DISABLE]
ResearchSpeedAOB:
  // Restore original instructions
  db F2 0F 58 C1 F2 0F 5A E8

unregistersymbol(ResearchSpeedAOB)
unregistersymbol(fSpeedMult)
dealloc(newmem)
dealloc(fSpeedMult)"""

