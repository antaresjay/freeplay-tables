id = "items"
name = "🔓 Items"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
// Scans only inside the InitializeItems function. The ? wildcards ignore the relative jump distance.
aobscanregion(ResearchUnlockAOB,DreamWayGames.EspressoTycoon.ItemManager:InitializeItems,DreamWayGames.EspressoTycoon.ItemManager:InitializeItems+300, 0F B6 40 30 85 C0 0F 85 ? ? ? ? 83 3F 00)
registersymbol(ResearchUnlockAOB)

alloc(OriginalJumpBytes,6,DreamWayGames.EspressoTycoon.ItemManager:InitializeItems)
registersymbol(OriginalJumpBytes)

// Dynamically save the original jump (whether it's the vanilla one or the modded one)
OriginalJumpBytes:
readmem(ResearchUnlockAOB+6,6)

// NOP out the jump
ResearchUnlockAOB+6:
  db 90 90 90 90 90 90

[DISABLE]
// Put the exact saved bytes back
ResearchUnlockAOB+6:
  readmem(OriginalJumpBytes,6)

unregistersymbol(ResearchUnlockAOB)
unregistersymbol(OriginalJumpBytes)
dealloc(OriginalJumpBytes)"""

