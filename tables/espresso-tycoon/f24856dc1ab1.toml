[[cheat]]
id = "maintenance"
name = "✕ Maintenance"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
// ==========================================
// PATCH 1: Action Decay (Toilets, Machines)
// ==========================================
// Scan for: movss [rsi+000000D8],xmm5
aobscanregion(SubProgAOB,DreamWayGames.EspressoTycoon.InteractiveItem:SubtractProgressStep,DreamWayGames.EspressoTycoon.InteractiveItem:SubtractProgressStep+100, F3 0F 11 AE D8 00 00 00)
alloc(newmemSub,$64,SubProgAOB)
label(returnSub)

newmemSub:
  // Brainwash: Ignore xmm5, write 1.0f (3F800000) directly to progress
  mov dword ptr [rsi+000000D8], 3F800000
  jmp returnSub

SubProgAOB:
  jmp newmemSub
  nop 3
returnSub:
registersymbol(SubProgAOB)

// ==========================================
// PATCH 2: Timed Decay (Floors, Tables)
// ==========================================
// Scan for: movzx eax,byte ptr [rsi+000000EB] followed by test eax,eax
aobscanregion(RestProgAOB,DreamWayGames.EspressoTycoon.InteractiveItem:RestartTimedProgress,DreamWayGames.EspressoTycoon.InteractiveItem:RestartTimedProgress+300, 0F B6 86 EB 00 00 00 85 C0)
alloc(newmemRest,$64,RestProgAOB)
label(returnRest)

newmemRest:
  // 1. Force progress to 1.0f
  mov dword ptr [rsi+000000D8], 3F800000

  // 2. Force eax to 0.
  // This guarantees the 'test' instruction will trigger the 'je' jump.
  xor eax, eax
  test eax, eax
  jmp returnRest

RestProgAOB:
  jmp newmemRest
  nop 4
returnRest:
registersymbol(RestProgAOB)

[DISABLE]
SubProgAOB:
  db F3 0F 11 AE D8 00 00 00
unregistersymbol(SubProgAOB)
dealloc(newmemSub)

// Restore Timed Decay
RestProgAOB:
  db 0F B6 86 EB 00 00 00 85 C0
unregistersymbol(RestProgAOB)
dealloc(newmemRest)"""

