type = "script"
source = """
[ENABLE]

aobscanregion(cashcash, Alcomarket.UI:Wallet:CanTake+4, Alcomarket.UI:Wallet:CanTake+3e, F3 0F 10 46 50 F3 0F 5A C0 F3 0F 10 4C 24 08)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov [rsi+50], (float)99999.0

code:
  movss xmm0,[rsi+50]
  cvtss2sd xmm0,xmm0
  movss xmm1,[rsp+08]
  jmp return

cashcash:
  jmp far newmem
  nop
return:
registersymbol(cashcash)

[DISABLE]

cashcash:
  db F3 0F 10 46 50 F3 0F 5A C0 F3 0F 10 4C 24 08

unregistersymbol(cashcash)
dealloc(newmem)"""
