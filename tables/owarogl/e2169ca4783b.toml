[[cheat]]
id = "enable-me-first"
name = "Enable me first"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(getPlayerUnitsStruct,OwarOGL.exe,80 BF 8C 01 00 00 00 76 1B) // should be unique
alloc(newmem,$1000)
label(code)
label(return)
label(playerUnitBaseAdress)
registersymbol(playerUnitBaseAdress)
newmem:
code:
  mov [playerUnitBaseAdress],edi
  cmp byte ptr [edi+0000018C],00
  jmp return

playerUnitBaseAdress:
dd 0
getPlayerUnitsStruct:
  jmp newmem
  nop
  nop
return:
registersymbol(getPlayerUnitsStruct)

[DISABLE]

getPlayerUnitsStruct:
  db 80 BF 8C 01 00 00 00
unregistersymbol(playerUnitBaseAdress)
unregistersymbol(getPlayerUnitsStruct)
dealloc(newmem)"""

[[cheat]]
id = "zero-damage"
name = "zero damage"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(zero_damage,OwarOGL.exe,80 38 00 75 09 80) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  pushf
  push eax
  push ebx
  mov ebx,[playerUnitBaseAdress]
  mov ebx,[ebx+10]//player unit side
  mov eax,[esi+10]//current unit side in proc
  cmp al,bl
  //je code //for self damage
  jne code
  mov edi,0//if player unit - set taken damage to zero
code:
  pop ebx
  pop eax
  popf
  cmp byte ptr [eax],00
  jne OwarOGL.exe+1DFD29
  jmp return



zero_damage:
  jmp newmem
return:
registersymbol(zero_damage)

[DISABLE]

zero_damage:
  db 80 38 00 75 09

unregistersymbol(zero_damage)
dealloc(newmem)"""

