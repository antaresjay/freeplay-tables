[[cheat]]
id = "player-base-address-scan-initialization-activate-this-first"
name = "Player Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Player_basepointer)
registersymbol(Player_update_enable)
registersymbol(Player_set_enable)
registersymbol(Player_healthset_enable)
registersymbol(Player_resourcesset_enable)
registersymbol(Player_fameset_enable)
registersymbol(Player_damageset_enable)
registersymbol(Player_diceset_enable)

alloc(Player_basepointer, 4)
alloc(Player_update_enable, 4)
alloc(Player_set_enable, 4)
alloc(Player_healthset_enable, 4)
alloc(Player_resourcesset_enable, 4)
alloc(Player_fameset_enable, 4)
alloc(Player_damageset_enable, 4)
alloc(Player_diceset_enable, 4)


[DISABLE]
unregistersymbol(Player_basepointer)
unregistersymbol(Player_update_enable)
unregistersymbol(Player_set_enable)
unregistersymbol(Player_healthset_enable)
unregistersymbol(Player_resourcesset_enable)
unregistersymbol(Player_fameset_enable)
unregistersymbol(Player_damageset_enable)
unregistersymbol(Player_diceset_enable)

dealloc(Player_basepointer)
dealloc(Player_update_enable)
dealloc(Player_set_enable)
dealloc(Player_healthset_enable)
dealloc(Player_resourcesset_enable)
dealloc(Player_fameset_enable)
dealloc(Player_damageset_enable)
dealloc(Player_diceset_enable)"""

[[cheat]]
id = "player-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Player Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Player_savedAOB)
label(Player_returnhere)
label(Player_originalcode)
label(Player_exit)

label(Player_update_exit)
label(Player_set_exit)
label(Player_healthset_exit)
label(Player_resourcesset_exit)
label(Player_fameset_exit)
label(Player_damageset_exit)
label(Player_diceset_exit)

registersymbol(Player_savedAOB)

//1C1CC7A0 - 8B 7D 08              - mov edi,[ebp+08]
//1C1CC7A3 - 8B 05 E8BBFF13        - mov eax,[13FFBBE8] : [3ABA4500]
// HealthStatCard:Update+11
//1C1CC7A9 - 8B C8                 - mov ecx,eax
//1C1CC7AB - 39 09                 - cmp [ecx],ecx
//1C1CC7AD - 8B 40 10              - mov eax,[eax+10]
//1C1CC7B0 - 83 EC 0C              - sub esp,0C
//1C1CC7B3 - 50                    - push eax
//1C1CC7B4 - 8B 00                 - mov eax,[eax]
//1C1CC7B6 - 90                    - nop
//1C1CC7B7 - 90                    - nop
//1C1CC7B8 - 90                    - nop
//1C1CC7B9 - FF 50 50              - call dword ptr [eax+50]
//1C1CC7BC - 83 C4 10              - add esp,10
//1C1CC7BF - 83 EC 0C              - sub esp,0C
//1C1CC7C2 - 50                    - push eax
//1C1CC7C3 - E8 C8C0FCFF           - call 1C198890
//1C1CC7C8 - 83 C4 10              - add esp,10
//1C1CC7CB - 83 EC 0C              - sub esp,0C
//1C1CC7CE - 83 EC 04              - sub esp,04
//1C1CC7D1 - D9 1C 24              - fstp dword ptr [esp]
//1C1CC7D4 - E8 7743FFFF           - call 1C1C0B50
//1C1CC7D9 - 83 C4 10              - add esp,10
//1C1CC7DC - 89 45 E8              - mov [ebp-18],eax
//1C1CC7DF - C7 87 1C010000 00000000 - mov [edi+0000011C],00000000
//1C1CC7E9 - 8B 87 24010000        - mov eax,[edi+00000124]
aobscan(Player_searchedAOB, 8B C8 39 09 8B 40 10 83 EC 0C 50 8B 00 90 90 90 * * * 83 C4 10 83 EC 0C 50 * * * * * 83 C4 10 83 EC 0C 83 EC 04 D9 1C 24 * * * * * 83 C4 10 89 45 E8)

alloc(Player_newmem, 2048, Player_searchedAOB)
alloc(Player_temp1, 4, Player_searchedAOB)
alloc(Player_temp2, 4, Player_searchedAOB)
alloc(Player_temp3, 4, Player_searchedAOB)
alloc(Player_temp4, 4, Player_searchedAOB)
alloc(Player_temp5, 4, Player_searchedAOB)


Player_newmem:
mov [Player_temp1], eax
mov [Player_temp2], ebx
mov [Player_temp3], ecx
mov [Player_temp4], edx

cmp dword ptr [Player_update_enable], #0
je Player_update_exit
mov [Player_basepointer], eax
Player_update_exit:

cmp dword ptr [Player_set_enable], #0
je Player_set_exit
Player_set_exit:

cmp dword ptr [Player_healthset_enable], #0
je Player_healthset_exit
mov ebx, [eax+3c]
test ebx, ebx
je Player_healthset_exit
fld [ebx+58]
mov ebx, [eax+c]
test ebx, ebx
je Player_healthset_exit
fstp [ebx+18]
Player_healthset_exit:

cmp dword ptr [Player_resourcesset_enable], #0
je Player_resourcesset_exit
mov ebx, [eax+14]
test ebx, ebx
je Player_resourcesset_exit
mov [ebx+18], #9999
mov ebx, [eax+18]
test ebx, ebx
je Player_resourcesset_exit
mov [ebx+18], #9999
Player_resourcesset_exit:

cmp dword ptr [Player_fameset_enable], #0
je Player_fameset_exit
mov ebx, [eax+1c]
test ebx, ebx
je Player_fameset_exit
mov [ebx+18], #9999
Player_fameset_exit:

cmp dword ptr [Player_damageset_enable], #0
je Player_damageset_exit
mov [eax+d4], (float)999
Player_damageset_exit:

cmp dword ptr [Player_diceset_enable], #0
je Player_diceset_exit
mov [eax+c4], #8
mov [eax+c8], #999
Player_diceset_exit:

mov eax, [Player_temp1]
mov ebx, [Player_temp2]
mov ecx, [Player_temp3]
mov edx, [Player_temp4]


Player_originalcode:
db 8B C8 39 09 8B 40 10
//mov ecx,eax
//cmp [ecx],ecx
//mov eax,[eax+10]


Player_exit:
jmp Player_returnhere


Player_searchedAOB:
Player_savedAOB:
jmp Player_newmem
nop
nop
Player_returnhere:


[DISABLE]
Player_savedAOB:
db 8B C8 39 09 8B 40 10
//mov ecx,eax
//cmp [ecx],ecx
//mov eax,[eax+10]

unregistersymbol(Player_savedAOB)

dealloc(Player_newmem)
dealloc(Player_temp1)
dealloc(Player_temp2)
dealloc(Player_temp3)
dealloc(Player_temp4)
dealloc(Player_temp5)"""

