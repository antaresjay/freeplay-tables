[[cheat]]
id = "player-base-address-scan-initialization-activate-this-first"
name = "Player Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

registersymbol(Player_basepointer)
registersymbol(Player_update_enable)
registersymbol(Player_set_enable)
registersymbol(Player_huntsprintset_enable)
registersymbol(Player_foodset_enable)

alloc(Player_basepointer,4)
alloc(Player_update_enable,4)
alloc(Player_set_enable,4)
alloc(Player_huntsprintset_enable,4)
alloc(Player_foodset_enable,4)


[DISABLE]

unregistersymbol(Player_basepointer)
unregistersymbol(Player_update_enable)
unregistersymbol(Player_set_enable)
unregistersymbol(Player_huntsprintset_enable)
unregistersymbol(Player_foodset_enable)

dealloc(Player_basepointer)
dealloc(Player_update_enable)
dealloc(Player_set_enable)
dealloc(Player_huntsprintset_enable)
dealloc(Player_foodset_enable)"""

[[cheat]]
id = "player-base-address-scan-to-activate-move-to-update-move"
name = "Player Base Address Scan (To Activate: Move, To Update: Move)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(Player_savedAOB)
label(Player_returnhere)
label(Player_originalcode)
label(Player_exit)

label(Player_update_exit)
label(Player_set_exit)
label(Player_huntsprintset_exit)
label(Player_foodset_exit)

registersymbol(Player_savedAOB)

aobscan(Player_searchedAOB,0F B6 87 49 02 00 00 85 C0 74 15)

alloc(Player_newmem,2048) //2kb should be enough
alloc(Player_temp1,4)


Player_newmem:
mov [Player_temp1], ebx

cmp dword ptr [Player_update_enable], #0
je Player_update_exit
mov [Player_basepointer], edi
Player_update_exit:

cmp dword ptr [Player_set_enable], #0
je Player_set_exit
Player_set_exit:

cmp dword ptr [Player_huntsprintset_enable], #0
je Player_huntsprintset_exit
mov ebx, [edi+4c]
mov [ebx+10], (float)200
mov [ebx+14], (float)200
Player_huntsprintset_exit:

cmp dword ptr [Player_foodset_enable], #0
je Player_foodset_exit
mov ebx, [edi+54]
fld [ebx+c]
fstp [ebx+8]
Player_foodset_exit:

mov ebx, [Player_temp1]


Player_originalcode:
db 0F B6 87 49 02 00 00
//movzx eax,byte ptr [edi+00000249]


Player_exit:
jmp Player_returnhere


Player_searchedAOB:
Player_savedAOB:
jmp Player_newmem
nop
nop
Player_returnhere:


[DISABLE]
Player_savedAOB:
db 0F B6 87 49 02 00 00
//movzx eax,byte ptr [edi+00000249]

unregistersymbol(Player_savedAOB)

dealloc(Player_newmem)
dealloc(Player_temp1)"""

