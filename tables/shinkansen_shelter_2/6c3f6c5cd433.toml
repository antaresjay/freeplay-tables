id = "cub-base-address-scan-initialization-activate-this-first"
name = "Cub Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

registersymbol(Cub_basepointer)
registersymbol(Cub_update_enable)
registersymbol(Cub_set_enable)
registersymbol(Cub_foodset_enable)

alloc(Cub_basepointer,4)
alloc(Cub_update_enable,4)
alloc(Cub_set_enable,4)
alloc(Cub_foodset_enable,4)


[DISABLE]

unregistersymbol(Cub_basepointer)
unregistersymbol(Cub_update_enable)
unregistersymbol(Cub_set_enable)
unregistersymbol(Cub_foodset_enable)

dealloc(Cub_basepointer)
dealloc(Cub_update_enable)
dealloc(Cub_set_enable)
dealloc(Cub_foodset_enable)"""

[[cheat]]
id = "cub-base-address-scan-to-activate-move-to-update-move"
name = "Cub Base Address Scan (To Activate: Move, To Update: Move)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(Cub_savedAOB)
label(Cub_returnhere)
label(Cub_originalcode)
label(Cub_exit)

label(Cub_update_exit)
label(Cub_set_exit)
label(Cub_foodset_exit)

registersymbol(Cub_savedAOB)

aobscan(Cub_searchedAOB,0F B6 87 1F 01 00 00 85 C0 * * * * * * 0F B6 87 25 01 00 00)

alloc(Cub_newmem,2048) //2kb should be enough
alloc(Cub_temp1,4)


Cub_newmem:
mov [Cub_temp1], ebx

cmp dword ptr [Cub_update_enable], #0
je Cub_update_exit
mov [Cub_basepointer], edi
Cub_update_exit:

cmp dword ptr [Cub_set_enable], #0
je Cub_set_exit
Cub_set_exit:

cmp dword ptr [Cub_foodset_enable], #0
je Cub_foodset_exit
mov ebx, [edi+34]
fld [ebx+c]
fstp [ebx+8]
Cub_foodset_exit:

mov ebx, [Cub_temp1]


Cub_originalcode:
db 0F B6 87 1F 01 00 00
//movzx eax,byte ptr [edi+0000011F]


Cub_exit:
jmp Cub_returnhere


Cub_searchedAOB:
Cub_savedAOB:
jmp Cub_newmem
nop
nop
Cub_returnhere:


[DISABLE]
Cub_savedAOB:
db 0F B6 87 1F 01 00 00
//movzx eax,byte ptr [edi+0000011F]

unregistersymbol(Cub_savedAOB)

dealloc(Cub_newmem)
dealloc(Cub_temp1)"""

