type = "script"
source = """
[ENABLE]

aobscanmodule(InfHpTest,GameAssembly.dll,4C 8B 03 8B D7 48 8B CB 49 8B 80 C8) // should be unique
alloc(newmem,$1000,InfHpTest)
alloc(Char1Ptr,8)
alloc(Char2Ptr,8)
alloc(Char3Ptr,8)
alloc(ActivateInfHP,4)
registersymbol(ActivateInfHP)
registersymbol(Char1Ptr)
registersymbol(Char2Ptr)
registersymbol(Char3Ptr)
label(code)
label(return)
label(Char1)
label(Char2)
label(Char3)
label(InfiniteHpCheck)

newmem:
cmp [rbx+160],1
je Char1
cmp [rbx+160],2
je Char2
cmp [rbx+160],3
je Char3
jmp InfiniteHpCheck

Char1:
mov [Char1Ptr],rbx
jmp InfiniteHpCheck

Char2:
mov [Char2Ptr],rbx
jmp InfiniteHpCheck

Char3:
mov [Char3Ptr],rbx
jmp InfiniteHpCheck

InfiniteHpCheck:
cmp [ActivateInfHP],1
jne code
cmp [rbx+160],3
ja code
mov byte ptr [rbx+181],1


code:
  mov r8,[rbx]
  mov edx,edi
  jmp return

InfHpTest:
  jmp newmem
return:
registersymbol(InfHpTest)

