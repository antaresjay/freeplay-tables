[[cheat]]
id = "player-properties-ctrl-numpad-1"
name = "Player Properties (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Sodaman.exe
// Author            : ndck76
// Executable Version: 2022.3.17.51072
// Game Version      : Build.17574207 (Early Access)
// Script Date       : 2025-03-06


[ENABLE]

aobscanregion(hp1,PlayerAnimations:Update,PlayerAnimations:Update+400,486380xxxx000083xxxx7Dxx48xxxxxx48xxxx48BAxxxxxxxxxxxx000083xxxx66xx) //PlayerAnimations:Update+44
alloc(newmem,$1000,hp1)
alloc(data,8)
alloc(hp1bkp,7)
registersymbol(data)
registersymbol(hp1)
registersymbol(hp1bkp)
label(code)
label(return)

hp1bkp:
  readmem(hp1,7)

newmem:
  mov [data],rax

code:
  readmem(hp1,7)
  jmp return

hp1:
  jmp newmem
  nop 2
return:

[DISABLE]

hp1:
  readmem(hp1bkp,7)

unregistersymbol(*)
dealloc(*)"""

