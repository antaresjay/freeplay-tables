id = "hold-z-to-throttle-speed-shift-to-steer-faster"
name = 'Hold "Z" to throttle speed & "Shift" to steer faster'
category = "movement"
description = ""
hint = ""
type = "script"
source = """
{ Game   : pCARS2AVX.exe
  Version: 
  Date   : 2023-01-24
  Author : DiR3C7~H4CK

  This script does blah blah blah
}

define(address,"pCARS2AVX.exe"+F9EC15)
define(bytes,C5 FB 10 15 E3 65 48 01)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,"pCARS2AVX.exe"+F9EC15)

label(code)
label(return)
label(ThrottleSpeedWithZeroAngularSpeed)
label(PrepareRadiusAndAngle)
label(ReplaceXAndZAfterModifyAngle)
label(FastTurnLeft)
label(FastTurnRight)
label(restoreEAX)

newmem:
mov rcx,rax
mov rax,[pCARS2AVX.exe+2834868]
mov rax,[rax+3B8]
mov rax,[rax+A0]
mov rax,[rax+60]
mov rax,[rax]
cmp [rax+2C],80
je ThrottleSpeedWithZeroAngularSpeed
cmp byte ptr [rax+2A],80
jne restoreEAX
cmp byte ptr [rax+CB],80
je FastTurnLeft
cmp byte ptr [rax+CD],80
je FastTurnRight
jmp restoreEAX

ThrottleSpeedWithZeroAngularSpeed:
mov rax,pCARS2AVX.exe+1CD39D8
movsd xmm15,[rax]
mov rax,[pCARS2AVX.exe+2424028]
mov rax,[rax]
movsd [rax+38],xmm13 //set angular speed "X" to zero
movsd xmm14,[rax+78]
mulsd xmm14,xmm15
movsd [rax+78],xmm14
movsd xmm14,[rax+80]
mulsd xmm14,xmm15
movsd [rax+80],xmm14
movsd xmm14,[rax+88]
mulsd xmm14,xmm15
movsd [rax+88],xmm14
mov rax,rcx
jmp code

FastTurnLeft:
call PrepareRadiusAndAngle
addsd xmm12,[pCARS2AVX.exe+1CD5A00] //NewAngle=OldAngle+0.015
call ReplaceXAndZAfterModifyAngle
mov rax,[pCARS2AVX.exe+2424028]
mov rax,[rax]
movsd xmm11,[rax+38] //modify P1 angular speed "X"
subsd xmm11,xmm7 //modify P1 angular speed "X"
subsd xmm11,xmm7 //modify P1 angular speed "X"
movsd [rax+38],xmm11 //modify P1 angular speed "X"
movsd [rax+78],xmm14
movsd [rax+88],xmm15
mov rax,rcx
jmp code

FastTurnRight:
call PrepareRadiusAndAngle
subsd xmm12,[pCARS2AVX.exe+1CD5A00] //NewAngle=OldAngle-0.015
call ReplaceXAndZAfterModifyAngle
mov rax,[pCARS2AVX.exe+2424028]
mov rax,[rax]
movsd xmm11,[rax+38] //modify P1 angular speed "X"
addsd xmm11,xmm7 //modify P1 angular speed "X"
addsd xmm11,xmm7 //modify P1 angular speed "X"
movsd [rax+38],xmm11 //modify P1 angular speed "X"
movsd [rax+78],xmm14
movsd [rax+88],xmm15
mov rax,rcx
jmp code

PrepareRadiusAndAngle:
mov rax,[pCARS2AVX.exe+2424028]
mov rax,[rax]
movsd xmm14,[rax+78]
mulsd xmm14,xmm14 //X^2
movsd xmm15,[rax+88]
mulsd xmm15,xmm15 //Z^2
addsd xmm14,xmm15 //X^2+Z^2 replaced X^2
sqrtsd xmm15,xmm14 //sqrt(X^2+Z^2) replaced Z^2
movsd [pCARS2AVX.exe+26FF008],xmm15 //r
fld qword ptr [rax+88] //Z
fld qword ptr [rax+78] //X
fpatan //Atan2(X,Z)
fstp qword ptr [pCARS2AVX.exe+26FF010] //OldAngle
mov rax,pCARS2AVX.exe+26FF010
movsd xmm12,[rax]
ret

ReplaceXAndZAfterModifyAngle:
movsd [pCARS2AVX.exe+26FF010],xmm12 //NewAngle replaced OldAngle
fld qword ptr [pCARS2AVX.exe+26FF010]
fcos
fmul qword ptr [pCARS2AVX.exe+26FF008]
fstp qword ptr [pCARS2AVX.exe+26FF018]//NewX
fld qword ptr [pCARS2AVX.exe+26FF010]
fsin
fmul qword ptr [pCARS2AVX.exe+26FF008]
fstp qword ptr [pCARS2AVX.exe+26FF020]//NewZ
mov rax,pCARS2AVX.exe+26FF018
movsd xmm14,[rax]//xmm14=NewX
mov rax,pCARS2AVX.exe+26FF020
movsd xmm15,[rax]//xmm15=NewZ
ret

code:
  vmovsd xmm2,[pCARS2AVX.exe+2425200]
  jmp return

restoreEAX:
mov eax,ecx
jmp code

address:
  jmp newmem
  nop 3
return:

[DISABLE]

address:
