[[cheat]]
id = "get-player"
name = "Get Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(PlayerBaseHook,UI_PlayerState:RefreshHPUI+10b,UI_PlayerState:RefreshHPUI+1ba,83 3A 00 48 63 91 4C 03 00 00)
alloc(newmem,$1000,PlayerBaseHook)
label(code return Player)

newmem:
mov [Player],rdx

code:
  cmp dword ptr [rdx],00
  movsxd  rdx,dword ptr [rcx+0000034C]
  jmp return

Player:
dq 0

PlayerBaseHook:
  jmp newmem
  nop 5
return:
registersymbol(PlayerBaseHook Player)

[DISABLE]

PlayerBaseHook:
  db 83 3A 00 48 63 91 4C 03 00 00

unregistersymbol(*)
dealloc(*)"""

[[cheat]]
id = "rapid-attack-speed"
name = "Rapid Attack Speed"
category = "player"
description = ""
hint = ""
type = "script"
source = """
define(address,PlayerBase:get_attackSpeed+b)
define(bytes,F3 0F 10 86 8C 01 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,PlayerBase:get_attackSpeed+b)

label(code)
label(return)

newmem:
mov [rsi+18C],(float)9999

code:
  movss xmm0,[rsi+0000018C]
  jmp return

address:
  jmp newmem
  nop 3
return:

[DISABLE]

address:
  db bytes

dealloc(newmem)"""
