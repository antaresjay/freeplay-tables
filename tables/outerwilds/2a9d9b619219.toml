  jmp far return

strafeSpeedCode:
  movq xmm5, qword [moveSpeedMultiplierValue]
  mulsd xmm0, xmm5
strafeSpeedMultiplierBackUp:
  readMem(strafeSpeedMultiplier, 19)
  jmp far strafeSpeedReturn

moveSpeedMultiplierValue:
