[ENABLE]
AOBScanRegion(moveSpeedMultiplier, "PlayerCharacterController:UpdateMovement"+450, "PlayerCharacterController:UpdateMovement"+558, F2 0F 5A E8 F3 0F 11 AD ? ? ? FF 85 FF 75)
