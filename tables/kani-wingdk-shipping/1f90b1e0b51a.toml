[[cheat]]
id = "unlimited-ammo"
name = "Unlimited Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(ammo,Kani-WinGDK-Shipping.exe,8B 80 D4 00 00 00 2B)
alloc(newmem,$1000,ammo)

label(code)
label(return)

newmem:
  mov [rax+000000D0],#99
  mov [rax+000000D4],#99

code:
  mov eax,[rax+000000D4]
  jmp return

ammo:
  jmp newmem
  nop
return:
registersymbol(ammo)

[DISABLE]
ammo:
  db 8B 80 D4 00 00 00

unregistersymbol(ammo)
dealloc(newmem)"""

