[[cheat]]
id = "auto-max-resources"
name = "Auto MAX Resources"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc(newmem,2048,"VoidlingWrangler-Win64-Shipping.exe"+4C9F98E)
alloc(resourceCurrentBase,8,"VoidlingWrangler-Win64-Shipping.exe"+4C9F98E)

registersymbol(resourceCurrentBase)

label(returnhere)
label(originalcode)
label(setSmallResource)
label(setLargeResource)
label(exit)

newmem:
  // rax = 当前变化资源的结构基址
  mov [resourceCurrentBase],rax

originalcode:
  // 原本的购买/消耗扣除
  sub [rax+08],edi

  // 如果当前资源数值小于 1000，视为突变因子这类小数值资源
  cmp dword ptr [rax+08],#1000
  jl setSmallResource

setLargeResource:
  // 科研点数等大数值资源
  mov dword ptr [rax+08],#66666
  jmp exit

setSmallResource:
  // 突变因子等小数值资源
  mov dword ptr [rax+08],#666

exit:
  // 保留原始逻辑
  neg edi
  jmp returnhere

"VoidlingWrangler-Win64-Shipping.exe"+4C9F98E:
  jmp newmem

returnhere:

[DISABLE]

"VoidlingWrangler-Win64-Shipping.exe"+4C9F98E:
  db 29 78 08 F7 DF

unregistersymbol(resourceCurrentBase)
dealloc(resourceCurrentBase)
dealloc(newmem)"""

