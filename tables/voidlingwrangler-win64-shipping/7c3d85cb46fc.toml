[[cheat]]
id = "auto-max-voidling-exp"
name = "Auto MAX Voidling EXP"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc(newmem,2048,"VoidlingWrangler-Win64-Shipping.exe"+4C232CC)
alloc(voidlingCurrentBase,8,"VoidlingWrangler-Win64-Shipping.exe"+4C232CC)

registersymbol(voidlingCurrentBase)

label(returnhere)
label(originalcode)
label(exit)

newmem:
  // 只有新经验大于旧经验时，才认为这是回飞船后的经验结算
  cmp eax,[rsi+48]
  jle originalcode

  // rsi = 当前结算经验的 voidling 对象基址
  mov [voidlingCurrentBase],rsi

  // 如果新经验小于 24998，则提升到 24998
  cmp eax,#24998
  jge originalcode
  mov eax,#24998

originalcode:
  mov [rsi+48],eax
  sub eax,ebx

exit:
  jmp returnhere

"VoidlingWrangler-Win64-Shipping.exe"+4C232CC:
  jmp newmem

returnhere:

[DISABLE]

"VoidlingWrangler-Win64-Shipping.exe"+4C232CC:
  db 89 46 48 2B C3

unregistersymbol(voidlingCurrentBase)
dealloc(voidlingCurrentBase)
dealloc(newmem)"""

