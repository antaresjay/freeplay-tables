name = "Inf.Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
aobscan(health,D9 43 48 DE C1 83 EC 04 D9 1C 24 8B CB)
registersymbol(health)
newmem: //this is allocated memory, you have read,write,execute access
//place your code here
fild dword ptr [ebx+4c]
fstp dword ptr [ebx+48]
