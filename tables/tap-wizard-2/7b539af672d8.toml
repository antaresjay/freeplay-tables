source = """
{ Game   : Tap Wizard 2.exe
  Version: 6.0.19
  Date   : 2023-05-20
  Author : Rixef

  This script teleports your wizard to the mouse, you can click and hold for
  a quick drag around the arena
}

[ENABLE]
aobscanmodule(ExtractWizardCoords,GameAssembly.dll,F3 0F 10 48 14 F3 0F 5C 49 0C F3 0F 11 04) // should be unique
alloc(newmem2,$1000)
alloc(WizCoords,8)
registersymbol(WizCoords)
label(code2)
label(return2)
label(CTP)

aobscanmodule(ExtractGameMouseCoords,GameAssembly.dll,0F 11 56 20 0F 11 5E 30 66 0F D6 66 40 E8 C1) // should be unique
alloc(newmem1,$1000)
alloc(gmcoords,8)
registersymbol(gmcoords)
label(code1)
label(return1)

gmcoords:
  dq 0

WizCoords:
  dq 0

//ExtractWizardCoords
newmem2:
  push eax
  add eax,14
  mov [WizCoords],eax
  pop eax
  jmp code2

code2:
  movss xmm1,[eax+14]
  jmp return2

ExtractWizardCoords:
  jmp newmem2
return2:
registersymbol(ExtractWizardCoords)

//ExtractGameMouseCoords + Teleport
newmem1:
  push esi
  add esi,24
  mov [gmcoords],esi
  pop esi
  cmp [UnityPlayer.dll+15A161C],1
  je CTP
  jmp code1

CTP://ClickTeleport
  cmp [WizCoords],0
  je code1
  cmp [gmcoords],0
  je code1
  push eax
  push ebx
  mov eax,[WizCoords]
  mov ebx,[gmcoords]
  mov ebx,[ebx]
  mov [eax],ebx//X
  mov ebx,[gmcoords]
  add eax,4
  add ebx,4
  mov ebx,[ebx]
  mov [eax],ebx//Y
  pop ebx
  pop eax
  jmp code1

code1:
  movups [esi+20],xmm2
  movups [esi+30],xmm3
  jmp return1

ExtractGameMouseCoords:
  jmp newmem1
  nop 3
return1:
registersymbol(ExtractGameMouseCoords)

[DISABLE]
ExtractGameMouseCoords:
  db 0F 11 56 20 0F 11 5E 30
ExtractWizardCoords:
  db F3 0F 10 48 14

unregistersymbol(ExtractGameMouseCoords)
