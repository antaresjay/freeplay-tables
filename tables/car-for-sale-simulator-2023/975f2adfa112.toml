source = """
{ Game   : Car For Sale Simulator 2023.exe
  Version: 
  Date   : 2023-05-19
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanregion(pData_FPMovement,FirstPersonMovement:FixedUpdate,FirstPersonMovement:FixedUpdate+400,0F B6 46 58 85 C0 0F 85 CD) // should be unique
alloc(newmem,$1000,pData_FPMovement)

alloc(pBase_FPMovement,8)
registersymbol(pBase_FPMovement)

label(code)
label(return)

pBase_FPMovement:
dd

newmem:

code:
  mov [pBase_FPMovement],rsi
  movzx eax,byte ptr [rsi+58]
  test eax,eax
  jmp return

pData_FPMovement:
  jmp newmem
  nop
return:
registersymbol(pData_FPMovement pBase_FPMovement)

[DISABLE]

pData_FPMovement:
  db 0F B6 46 58 85 C0

unregistersymbol(*)
dealloc(*)"""

