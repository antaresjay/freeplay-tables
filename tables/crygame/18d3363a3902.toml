[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(health,CryGame.dll,F3 0F 10 4E 40 0F)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
cmp [esi+40],(float)1000
ja @f
mov [esi+40],(float)1000
@@:
movss xmm1,[esi+40]
jmp return

health:
jmp code
return:
registersymbol(health)

[DISABLE]

health:
db F3 0F 10 4E 40

unregistersymbol(health)
dealloc(newmem)"""

