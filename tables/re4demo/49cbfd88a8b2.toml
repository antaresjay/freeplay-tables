[[cheat]]
id = "unlimited-ammo"
name = "Unlimited Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(aobammo,re4demo.exe,8B 40 34 48 8B FE 89 * 24 * * * * 00 00 E9) // should be unique
alloc(newmem,$1000,aobammo)
label(code)
label(return)

newmem:
code:
  mov [rax+34],#999
  mov eax,#99
  mov rdi,rsi
  jmp return

aobammo:
  jmp newmem
  nop
return:
registersymbol(aobammo)

[DISABLE]

aobammo:
  db 8B 40 34 48 8B FE
dealloc(newmem)"""

