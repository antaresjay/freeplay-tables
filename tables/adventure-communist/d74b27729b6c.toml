[[cheat]]
id = "set-currency-on-upgrade"
name = "Set Currency (on Upgrade)"
category = "resources"
description = ""
hint = ""
type = "script"
source = '''
//Target:  adventure-communist.exe
//Author:  Salis
//Credit to METHOS for custom Template LUA

[ENABLE]

////////////////////////  setlandonupgrade  \\\\\\\\\\\\\\\\\\\\\\\\

define(address, AdComm.ManualGeneratorViewModel:OnUpgradePurchased+36)

alloc(newmem,1024)
alloc(obytes_setlandonupgrade, 10)
label(return code)

registersymbol(obytes_setlandonupgrade newland)

obytes_setlandonupgrade:
readmem(address, 10)

newmem:

code:
 fld qword ptr [newland]
 fstp qword ptr [eax+18]
 fld qword ptr [eax+18]
 fstp qword ptr [ebp-10]
 jmp return

newland:
dq #0

address:
 jmp newmem
 nop
return:


[DISABLE]

address:
readmem(obytes_setlandonupgrade, 10)

dealloc(*)
unregistersymbol(*)'''

