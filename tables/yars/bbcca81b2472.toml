[[cheat]]
id = "player-base-ctrl-numpad-1"
name = "Player Base (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Yars.exe
// Author            : ndck76
// Executable Version: 2022.3.14.62174
// Game Version      : v1.1.0
// Script Date       : 2024-09-12


[ENABLE]

aobscanregion(longidle,Yars.PlayerBase:UpdateLongIdle,Yars.PlayerBase:UpdateLongIdle+700,F30F1086xxxx0000F3xxxxxxF3xxxxxxxxxxxxxxF3xxxxxx66xxxxxx0Fxxxxxxxxxx0FxxxxxxxxxxC6xxxxxxxxxxxx48xxxxxxxxxxxx48xxxx83xxxx) //Yars.PlayerBase:UpdateLongIdle+12c
alloc(newmem,$1000,longidle)
alloc(data,8)
alloc(longidlebkp,8)
registersymbol(data)
registersymbol(longidle)
registersymbol(longidlebkp)
label(code)
label(return)

longidlebkp:
  readmem(longidle,8)

newmem:
  mov [data],rsi

code:
  readmem(longidle,8)
  jmp return

longidle:
  jmp newmem
  nop 3
return:

[DISABLE]

longidle:
  readmem(longidlebkp,8)

unregistersymbol(*)
dealloc(*)"""

