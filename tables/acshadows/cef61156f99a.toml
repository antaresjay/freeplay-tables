type = "script"
source = """
[ENABLE]

aobscanmodule(consumablles,$process,03 73 10 48 8B 54 24 20) // should be unique
alloc(newmem,$1000,consumablles)

label(code)
label(return)

newmem:
mov [rbx+10], #9
code:
  add esi,[rbx+10]
  mov rdx,[rsp+20]
  jmp return

consumablles:
  jmp newmem
  nop 3
return:
registersymbol(consumablles)

[DISABLE]

consumablles:
  db 03 73 10 48 8B 54 24 20

unregistersymbol(consumablles)
dealloc(newmem)"""
