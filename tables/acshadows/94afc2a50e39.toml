[[cheat]]
id = "god-mode"
name = "God Mode"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game    : ACShadows.exe
  Feature : God Mode (Player-Guarded, No-Decrease)
  Notes   : Hooks the health setter (vmovss [rax+174],xmm0 ; ret).
            Guards on the player class vtable so only the player is
            protected (enemies/other objects untouched -> no crash).
            Blocks health decreases; heals/regen still apply.
}

[ENABLE]
aobscanmodule(godmode_standalone, ACShadows.exe, C5 FA 11 80 74 01 00 00 C3)
registersymbol(godmode_standalone)
alloc(newmem, 256, godmode_standalone)
alloc(pPlayerVT, 8)
registersymbol(pPlayerVT)
label(returnhere)
label(normalwrite)
label(originalcode)

pPlayerVT:
  dq ACShadows.exe+8F8EF60

newmem:
  pushfq
  push rbx
  mov rbx,[rax]
  cmp rbx,[pPlayerVT]
  jne normalwrite
  // player object: block any health decrease
  sub rsp,10
  vmovss [rsp],xmm5
  vmovss xmm5,[rax+00000174]
  vcomiss xmm0,xmm5
  vmovss xmm5,[rsp]
  lea rsp,[rsp+10]
  jae normalwrite            // new >= current -> allow (heal/regen)
  // damage -> skip the store, health stays
  pop rbx
  popfq
  jmp returnhere

normalwrite:
  pop rbx
  popfq

originalcode:
  vmovss [rax+00000174],xmm0
  jmp returnhere

godmode_standalone:
  jmp newmem
  nop 3
returnhere:

[DISABLE]
godmode_standalone:
  db C5 FA 11 80 74 01 00 00
unregistersymbol(godmode_standalone)
unregistersymbol(pPlayerVT)
dealloc(newmem)
dealloc(pPlayerVT)"""

