[[cheat]]
id = "crafting-takes-no-time-or-small-amount-of-time"
name = "Crafting Takes No Time (Or Small Amount Of Time)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

/// around +12 of function (crafting hours)
aobscanregion(CraftingTimeAOB1,RecipesExtensions:GetTimespan,RecipesExtensions:GetTimespan+A4,F3 0F 10 46 64 F3 0F 5A C0 F2 0F 5A E8 F3 0F 11 6D E4)
registersymbol(CraftingTimeAOB1)
alloc(newmem,1024)

/// around +49 of function (crafting days)
aobscanregion(CraftingTimeAOB2,RecipesExtensions:GetTimespan,RecipesExtensions:GetTimespan+A4,48 63 56 60 F3 0F 10 45 E4 F3 0F 5A C0 F2 0F 2C C0)
registersymbol(CraftingTimeAOB2)
alloc(newmem2,1024)

///
label(return)
label(CraftingTimeAOB1Save)
registersymbol(CraftingTimeAOB1Save)
label(bSmallTimeInstead)
registersymbol(bSmallTimeInstead)

///
label(return2)
label(CraftingTimeAOB2Save)
registersymbol(CraftingTimeAOB2Save)

///
newmem:
  cmp [bSmallTimeInstead],1
  je DoSmallAmountOfTime
  movss xmm0,[fZeroFloat]
  jmp originalcode
DoSmallAmountOfTime:
  movss xmm0,[fSmallAmountOfTime]
  jmp originalcode
  
originalcode:
  readmem(CraftingTimeAOB1+5,13)
  jmp CraftingTimeAOB1+12

fZeroFloat:
dq (float)0
fSmallAmountOfTime:
dq (float)0.001
bSmallTimeInstead:
dq 0
CraftingTimeAOB1Save:
  readmem(CraftingTimeAOB1,18)

///
newmem2:
  xor rdx,rdx
  jmp originalcode2
  
originalcode2:
  readmem(CraftingTimeAOB2+4,13)
  jmp CraftingTimeAOB2+11

CraftingTimeAOB2Save:
  readmem(CraftingTimeAOB2,17)
  
///
CraftingTimeAOB1:
  jmp newmem
  return:

///
CraftingTimeAOB2:
  jmp newmem2
  return2:
    
[DISABLE]

///
CraftingTimeAOB1:
  readmem(CraftingTimeAOB1Save,18)
  
unregistersymbol(CraftingTimeAOB1)
unregistersymbol(CraftingTimeAOB1Save)

///
CraftingTimeAOB2:
  readmem(CraftingTimeAOB2Save,17)
  
unregistersymbol(CraftingTimeAOB2)
unregistersymbol(CraftingTimeAOB2Save)

///
dealloc(newmem)
dealloc(newmem2)"""

