[[cheat]]
id = "activate-trainer-3-controls-freeze-time-time-scale-multiplier"
name = "Activate Trainer 3 (Controls Freeze Time, Time Scale Multiplier)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

/// around +84 of function
aobscanregion(TimeScaleMultiplierAOB1,GameState:DuringDay_Update,GameState:DuringDay_Update+320,F2 0F 10 4D 88 F2 0F 59 CA F2 0F 58 C1 F2 0F 5A E8)
registersymbol(TimeScaleMultiplierAOB1)
alloc(newmem,1024)

///
label(return)
label(TimeScaleMultiplierAOB1Save)
registersymbol(TimeScaleMultiplierAOB1Save)

///
newmem:
  readmem(TimeScaleMultiplierAOB1,5)
  mov [R15Save],r15
  movsd [XMM15SDSave],xmm15
  mov r15,fTimeScaleMult
  movsd xmm15,[r15]
  mulsd xmm1,xmm15
  mov r15,[R15Save]
  movsd xmm15,[XMM15SDSave]
  jmp originalcode
  
originalcode:
  readmem(TimeScaleMultiplierAOB1+5,12)
  jmp TimeScaleMultiplierAOB1+11

R15Save:
dq 0
XMM15SDSave:
dq 0
TimeScaleMultiplierAOB1Save:
  readmem(TimeScaleMultiplierAOB1,17)
  
///
TimeScaleMultiplierAOB1:
  jmp newmem
  return:
    
[DISABLE]

///
TimeScaleMultiplierAOB1:
  readmem(TimeScaleMultiplierAOB1Save,17)
  
unregistersymbol(TimeScaleMultiplierAOB1)
unregistersymbol(TimeScaleMultiplierAOB1Save)

///
dealloc(newmem)"""

