[[cheat]]
id = "player-revolver-ctrl-numpad-1-pause-unpause-the-game-to-populate"
name = "Player Revolver (Ctrl + Numpad 1) {Pause & Unpause the game to populate}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : revolver.exe
// Author            : ndck76
// Executable Version: 2022.1.5.59998
// Game Version      : Build.11919567
// Script Date       : 2023-08-22


[ENABLE]

aobscanregion(ammo,Player:TogglePause,Player:TogglePause+150,486389xxxx0000F3xxxxxxF3xxxxxx48xxxxF2xxxxxxF2xxxxxx83xxxx48xxxxxxxx9049BBxxxxxxxxxxxx000041xxxx) //Player:TogglePause+7b
alloc(newmem,$1000,ammo)
alloc(data,8)
alloc(ammobkp,15)
registersymbol(data)
registersymbol(ammo)
registersymbol(ammobkp)
label(code)
label(return)

ammobkp:
  readmem(ammo,15)

newmem:
  mov [data],rcx

code:
  readmem(ammo,15)
  jmp return

ammo:
  jmp far newmem
  nop
return:

[DISABLE]

ammo:
  readmem(ammobkp,15)

unregistersymbol(*)
dealloc(*)"""

