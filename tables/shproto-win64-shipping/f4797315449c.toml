[[cheat]]
id = "active"
name = "<<Active"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,SHProto-Win64-Shipping.exe,48 8B 81 B8 06 00 00 48 8B 89) // should be unique
alloc(newmem,$1000,INJECT)

label(code)
label(return)
label(PB)

newmem:

code:
mov [PB],rcx
  mov rax,[rcx+000006B8]
  jmp return
PB:
dd 0
INJECT:
  jmp newmem
  nop 2
return:
registersymbol(INJECT)
registersymbol(PB)

////////////////////////////////////////////////////////

aobscanmodule(INJECT2,SHProto-Win64-Shipping.exe,8B 41 08 C3 CC CC CC CC CC CC 48) // should be unique
alloc(newmem3,$1000,INJECT2)

label(code2)
label(return2)
label(item)

newmem3:

code2:
mov [item],rcx
  mov eax,[rcx+08]
  ret
  int 3
  jmp return2

  item:
  dd 0

INJECT2:
  jmp newmem3
return2:
registersymbol(INJECT2)
registersymbol(item)

[DISABLE]

INJECT:
  db 48 8B 81 B8 06 00 00

unregistersymbol(INJECT)
unregistersymbol(PB)
dealloc(newmem)

////////////////////

INJECT2:
  db 8B 41 08 C3 CC

unregistersymbol(INJECT2)
unregistersymbol(item)
dealloc(newmem3)"""

