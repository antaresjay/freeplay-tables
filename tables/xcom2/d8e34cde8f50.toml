[[cheat]]
id = "resources"
name = "Resources"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(resource,XCom2.exe,48 83 B9 C8 00 00 00 00 48)
alloc(newmem,$1000,resource)
alloc(resources,$1000)

label(code)
label(return)
label(repeat)
label(save)

newmem:
  mov rbx,resources
  xor rax,rax
repeat:
  cmp qword ptr [rbx+rax*8],0
  je save
  cmp qword ptr [rbx+rax*8],rcx
  je code
  inc rax
  cmp rax,#400
  jl repeat
  jmp code
save:
  mov qword ptr [rbx+rax*8],rcx
code:
  cmp qword ptr [rcx+000000C8],00
  jmp return

resource:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(resource)
