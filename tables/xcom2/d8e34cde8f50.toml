type = "script"
source = """
[ENABLE]
aobscanmodule(unit,XCom2.exe,8B 81 00 ?? ?? ?? C3 ?? ?? ?? ?? ?? ?? ?? ?? ?? 48 89 5C)
alloc(newmem,$1000,unit)

label(code)
label(return)
label(unit_save)
label(unit_ptr)

newmem:

code:
  mov rax,unit_ptr
  mov [rax],rcx
  xor rax,rax
unit_save:
  readmem(unit,6)
  jmp return

unit_ptr:
  dq 0

unit:
  jmp code
  nop
return:
registersymbol(unit)
registersymbol(unit_save)
registersymbol(unit_ptr)

[DISABLE]
unit:
  readmem(unit_save,6)
unregistersymbol(unit)
unregistersymbol(unit_save)
unregistersymbol(unit_ptr)
dealloc(newmem)

