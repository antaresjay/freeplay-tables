[[cheat]]
id = "active-trainer"
name = "Active Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
aobscan(base,D9 00 B8 01 00 00 00 50 DB 04 24 D9 1C 24 D9 04 24 83 C4 04 DF F1 DD D8 7A 06 0F 83 * * * *  8B 8F ?? 01 00 00)
registersymbol(base)

label(fuel)
label(hull)
label(shield)
label(energy)
label(money)


registersymbol(fuelE)
registersymbol(hullE)
registersymbol(shieldE)
registersymbol(energyE)
registersymbol(moneyE)
label(fuelE)
label(hullE)
label(shieldE)
label(energyE)
label(moneyE)
newmem: //this is allocated memory, you have read,write,execute access
//place your code here
{
0 fuel
14 hull
24 shield
34 energy
-b4 money

}
fuel:
cmp [fuelE],0
je hull
fld [eax+4]
fstp [eax]
hull:
cmp [hullE],0
je shield
fld [eax+18]
fstp [eax+14]
shield:
cmp [shieldE],0
je energy
fld [eax+28]
fstp [eax+24]
energy:
cmp [energyE],0
je money
fld [eax+38]
fstp [eax+34]
money:
cmp [moneyE],0
je originalcode
mov [eax-b4],(float)99999999
originalcode:
fld dword ptr [eax]
mov eax,00000001
jmp returnhere
fuelE:
dd 0
hullE:
dd 0
shieldE:
dd 0
energyE:
dd 0
moneyE:
dd 0
base://GLOBAL_GUI:OnGUI+138b1:
jmp newmem
nop
nop
returnhere:


 //
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
base://
 db D9 00 B8 01 00 00 00
 unregistersymbol(base)
unregistersymbol(fuelE)
unregistersymbol(hullE)
unregistersymbol(shieldE)
unregistersymbol(energyE)
unregistersymbol(moneyE)"""

