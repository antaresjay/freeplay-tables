[[cheat]]
id = "cyclists-effort-stats-base-address-scan-initialization-activate-this-first"
name = "Cyclists Effort Stats Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(cyclistseffortstats_basepointer)
registersymbol(cyclistseffortstats_update_enable)
registersymbol(cyclistseffortstats_set_enable)
registersymbol(cyclistseffortstats_heartrateset_enable)
registersymbol(cyclistseffortstats_heartrateset_value)
registersymbol(cyclistseffortstats_barsset_enable)

alloc(cyclistseffortstats_basepointer, 4)
alloc(cyclistseffortstats_update_enable, 4)
alloc(cyclistseffortstats_set_enable, 4)
alloc(cyclistseffortstats_heartrateset_enable, 4)
alloc(cyclistseffortstats_heartrateset_value, 4)
alloc(cyclistseffortstats_barsset_enable, 4)

cyclistseffortstats_heartrateset_value:
dd (float)9999999


[DISABLE]
unregistersymbol(cyclistseffortstats_basepointer)
unregistersymbol(cyclistseffortstats_update_enable)
unregistersymbol(cyclistseffortstats_set_enable)
unregistersymbol(cyclistseffortstats_heartrateset_enable)
unregistersymbol(cyclistseffortstats_heartrateset_value)
unregistersymbol(cyclistseffortstats_barsset_enable)

dealloc(cyclistseffortstats_basepointer)
dealloc(cyclistseffortstats_update_enable)
dealloc(cyclistseffortstats_set_enable)
dealloc(cyclistseffortstats_heartrateset_enable)
dealloc(cyclistseffortstats_heartrateset_value)
dealloc(cyclistseffortstats_barsset_enable)"""

[[cheat]]
id = "cyclists-effort-stats-base-address-scan-to-update-race-set-cyclist-effort-to-99"
name = "Cyclists Effort Stats Base Address Scan (To Update: Race, Set Cyclist Effort to 99)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(cyclistseffortstats_savedAOB)
label(cyclistseffortstats_returnhere)
label(cyclistseffortstats_originalcode)
label(cyclistseffortstats_exit)

label(cyclistseffortstats_update_entry)
label(cyclistseffortstats_update_exit)
label(cyclistseffortstats_set_exit)
label(cyclistseffortstats_heartrateset_exit)
label(cyclistseffortstats_barsset_exit)

registersymbol(cyclistseffortstats_savedAOB)

//PCM.SFLB_IRC2_CWorld_IRC2_CWorld+2BC70 - 8B 89 44010000        - mov ecx,[ecx+00000144]
//PCM.SFLB_IRC2_CWorld_IRC2_CWorld+2BC76 - 6A 04                 - push 04
//PCM.SFLB_IRC2_CWorld_IRC2_CWorld+2BC78 - 8B 01                 - mov eax,[ecx]
//PCM.SFLB_IRC2_CWorld_IRC2_CWorld+2BC7A - 8B 40 10              - mov eax,[eax+10]
aobscan(cyclistseffortstats_searchedAOB, 8B 89 44 01 00 00 6A 04)

alloc(cyclistseffortstats_newmem, 2048)


cyclistseffortstats_newmem:

// Check Normal Effort which should be set to (float)99
// AI seems to be alwaya (float)65
cmp dword ptr [ecx+194], #1120272384
je cyclistseffortstats_update_entry

// Check Individual Time-Trial Effort which should be set to (float)99
// AI seems to be alwaya (float)70
cmp dword ptr [ecx+1c0], #1120272384
je cyclistseffortstats_update_entry

// Check Team Time-Trial Effort which should be set to (float)99
// AI seems to be alwaya (float)70
cmp dword ptr [ecx+1d4], #1120272384
jne cyclistseffortstats_barsset_exit

cyclistseffortstats_update_entry:
cmp dword ptr [cyclistseffortstats_update_enable], #0
je cyclistseffortstats_update_exit
mov [cyclistseffortstats_basepointer], ecx
cyclistseffortstats_update_exit:

cmp dword ptr [cyclistseffortstats_set_enable], #0
je cyclistseffortstats_set_exit
cyclistseffortstats_set_exit:

cmp dword ptr [cyclistseffortstats_heartrateset_enable], #0
je cyclistseffortstats_heartrateset_exit
mov eax, [ecx+144]
fld [cyclistseffortstats_heartrateset_value]
fstp [eax+14]
cyclistseffortstats_heartrateset_exit:

cmp dword ptr [cyclistseffortstats_barsset_enable], #0
je cyclistseffortstats_barsset_exit
mov eax, [ecx+144]
// Individual Time-Trial
fld [eax+28]
fstp [eax+20]
// Team Time-Trial
fld [eax+30]
fstp [eax+24]
// Normal
fld [eax+50]
fstp [eax+40]
fld [eax+58]
fstp [eax+44]
fld [eax+58]
fstp [eax+48]
mov [eax+5c], (float)0
cyclistseffortstats_barsset_exit:


cyclistseffortstats_originalcode:
db 8B 89 44 01 00 00
//mov ecx,[ecx+00000144]


cyclistseffortstats_exit:
jmp cyclistseffortstats_returnhere


cyclistseffortstats_searchedAOB:
cyclistseffortstats_savedAOB:
jmp cyclistseffortstats_newmem
nop
cyclistseffortstats_returnhere:


[DISABLE]
cyclistseffortstats_savedAOB:
db 8B 89 44 01 00 00
//mov ecx,[ecx+00000144]

unregistersymbol(cyclistseffortstats_savedAOB)

dealloc(cyclistseffortstats_newmem)"""

