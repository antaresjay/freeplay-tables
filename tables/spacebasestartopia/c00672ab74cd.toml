//Realmforge.Server.EnergyManager.ChangeEnergy
[ENABLE]
aobscanmodule(energy,GameAssembly.dll,8B 58 ?? 8D 0C 33 E8)
alloc(energyBkp,$1000,energy)

label(code)
label(return)
label(done)

energyBkp:
  readmem(energy,6)
