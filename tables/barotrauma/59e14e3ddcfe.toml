[ENABLE]
aobscan(campaign,48 8B 49 08 48 89 ?? ?? ?? ?? ?? 48 8B ?? ?? 48 8B 89 ?? ?? 00 00 48)
alloc(newmem,$1000,campaign)

label(campaignPtr)
label(campaignBkp)
label(return)

