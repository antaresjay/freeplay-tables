//674AE3E3 - D9 47 78              - fld dword ptr [edi+78]
//674AE3E6 - D9 05 E876F812        - fld dword ptr [12F876E8] : [(float)10.0000]
//674AE3EC - DEF9                  - fdivp st(1),st(0)
aobscan(UIPlayerInfo_searchedAOB, 8B 47 68 8B 40 14 8B 70 08 8B 47 44 D9 47 78)

