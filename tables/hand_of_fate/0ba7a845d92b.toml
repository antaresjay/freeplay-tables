[[cheat]]
id = "invulnerability"
name = "Invulnerability"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(invuln4,D9 9F A8 00 00 00 D9 87)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  fstp st(0)
  mov eax,[edi+3C]
  fld dword ptr [eax+8]
  fstp dword ptr [edi+000000A8]
  jmp return

invuln4:
  jmp code
  nop
return:
registersymbol(invuln4)

[DISABLE]
invuln4:
  db D9 9F A8 00 00 00
unregistersymbol(invuln4)
dealloc(newmem)"""

