[[cheat]]
id = "combat-hacks-must-first-enter-combat"
name = "Combat Hacks (must first enter combat)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(combat,83 C4 10 89 45 DC 8B 05 * * * * 8B C8)
alloc(newmem,$1000)

label(code)
label(return)
label(player)
label(invuln)

newmem:

player:
  db 00 00 00 00

invuln:
  db 00 00 00 00

code:
  add esp,10
  mov [ebp-24],eax
  // new code
  mov [player],eax
  cmp [invuln],1
  jne return
  mov eax,[eax+1C]
  mov [eax+44],1
  jmp return

combat:
  jmp code
  nop
return:
registersymbol(combat)
registersymbol(player)
registersymbol(invuln)

[DISABLE]
combat:
  db 83 C4 10 89 45 DC
unregistersymbol(combat)
unregistersymbol(player)
unregistersymbol(invuln)
dealloc(newmem)"""

