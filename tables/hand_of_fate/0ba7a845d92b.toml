[[cheat]]
id = "one-hit-kill"
name = "One Hit Kill"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(onehit,D9 47 48 D9 45 10 DE E9)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  jmp code // skip hack
  cmp edi,[player]
  je code
  fldz
  jmp return

code:
  fld dword ptr [edi+48]
  fld dword ptr [ebp+10]
  fsubp st(1),st(0)
  jmp return

onehit:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(onehit)

[DISABLE]
onehit:
  db D9 47 48 D9 45 10 DE E9
unregistersymbol(onehit)
dealloc(newmem)"""

