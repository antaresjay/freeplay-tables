[[cheat]]
id = "characterstats-base-address-scan-to-activate-play-level-to-update-play-level"
name = "CharacterStats Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(CharacterStats_savedAOB)
label(CharacterStats_returnhere)
label(CharacterStats_originalcode)
label(CharacterStats_exit)

label(CharacterStats_update_exit)
label(CharacterStats_set_exit)
label(CharacterStats_hungerset_exit)
label(CharacterStats_thirstset_exit)
label(CharacterStats_moraleset_exit)
label(CharacterStats_oxygenset_exit)
label(CharacterStats_acrycineset_exit)
label(CharacterStats_weightset_exit)

registersymbol(CharacterStats_savedAOB)

//0550486C - 83 EC 04              - sub esp,04
//0550486F - 8B 7D 08              - mov edi,[ebp+08]
// CharacterStats:Update+1
//05504872 - 0FB6 47 44            - movzx eax,byte ptr [edi+44]
//05504876 - 85 C0                 - test eax,eax
//05504878 - 74 24                 - je 0550489E
//0550487A - 83 EC 0C              - sub esp,0C
//0550487D - 57                    - push edi
aobscan(CharacterStats_searchedAOB, 0F B6 47 44 85 C0 74 24)

alloc(CharacterStats_newmem, 2048, CharacterStats_searchedAOB)
alloc(CharacterStats_temp1, 4, CharacterStats_searchedAOB)
alloc(CharacterStats_temp2, 4, CharacterStats_searchedAOB)
alloc(CharacterStats_temp3, 4, CharacterStats_searchedAOB)
alloc(CharacterStats_temp4, 4, CharacterStats_searchedAOB)


CharacterStats_newmem:
mov [CharacterStats_temp1], eax
mov [CharacterStats_temp2], ebx
mov [CharacterStats_temp3], ecx
mov [CharacterStats_temp4], edx

cmp dword ptr [CharacterStats_update_enable], #0
je CharacterStats_update_exit
mov [CharacterStats_basepointer], edi
CharacterStats_update_exit:

cmp dword ptr [CharacterStats_set_enable], #0
je CharacterStats_set_exit
CharacterStats_set_exit:

cmp dword ptr [CharacterStats_hungerset_enable], #0
je CharacterStats_hungerset_exit
mov [edi+10], (float)9999
CharacterStats_hungerset_exit:

cmp dword ptr [CharacterStats_thirstset_enable], #0
je CharacterStats_thirstset_exit
mov [edi+18], (float)9999
CharacterStats_thirstset_exit:

cmp dword ptr [CharacterStats_moraleset_enable], #0
je CharacterStats_moraleset_exit
mov [edi+20], (float)9999
CharacterStats_moraleset_exit:

cmp dword ptr [CharacterStats_oxygenset_enable], #0
je CharacterStats_oxygenset_exit
mov [edi+28], (float)9999
CharacterStats_oxygenset_exit:

cmp dword ptr [CharacterStats_acrycineset_enable], #0
je CharacterStats_acrycineset_exit
mov [edi+2c], (float)0
CharacterStats_acrycineset_exit:

cmp dword ptr [CharacterStats_weightset_enable], #0
je CharacterStats_weightset_exit
mov [edi+34], (float)9999999
CharacterStats_weightset_exit:

mov eax, [CharacterStats_temp1]
mov ebx, [CharacterStats_temp2]
mov ecx, [CharacterStats_temp3]
mov edx, [CharacterStats_temp4]


CharacterStats_originalcode:
db 0F B6 47 44 85 C0
//movzx eax,byte ptr [edi+44]
//test eax,eax


CharacterStats_exit:
jmp CharacterStats_returnhere


CharacterStats_searchedAOB:
CharacterStats_savedAOB:
jmp CharacterStats_newmem
nop
CharacterStats_returnhere:


[DISABLE]
CharacterStats_savedAOB:
db 0F B6 47 44 85 C0
//movzx eax,byte ptr [edi+44]
//test eax,eax

unregistersymbol(CharacterStats_savedAOB)

dealloc(CharacterStats_newmem)
dealloc(CharacterStats_temp1)
dealloc(CharacterStats_temp2)
dealloc(CharacterStats_temp3)
dealloc(CharacterStats_temp4)"""

