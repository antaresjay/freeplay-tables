type = "script"
source = """
[ENABLE]



aobscan(megaexp,03 C6 89 87 B4 00 00 00 eb)
alloc(newmem,$1000,megaexp)

label(code)
label(return)

newmem:

code:
push 64
imul esi,[rsp]
add rsp,8
add eax,esi
mov [rdi+000000B4],eax
jmp return

megaexp:
jmp newmem
nop
nop
nop
return:
registersymbol(megaexp)

[DISABLE]
megaexp:
db 03 C6 89 87 B4 00 00 00

unregistersymbol(megaexp)
dealloc(newmem)"""
