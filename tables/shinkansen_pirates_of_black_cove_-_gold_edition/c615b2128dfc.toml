jmp shiphp_newmem
shiphp_returnhere:


[DISABLE]
shiphp_savedAOB:
db F3 0F 2A 46 68
//cvtsi2ss xmm0,[esi+68]

unregistersymbol(shiphp_savedAOB)

dealloc(shiphp_newmem)"""

