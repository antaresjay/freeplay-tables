[[cheat]]
id = "stats"
name = "Stats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : ys_vs_ed.exe
  Date   : 2025-10-11
  Author : Sianz
}

[ENABLE]

aobscanmodule(player,ys_vs_ed.exe,F3 0F 10 83 ?? ?? ?? ?? F3 0F 58 ?? 0F 28) // should be unique
alloc(newmem,$1000,player)
alloc(stats,8)
label(code)
label(return)

newmem:
  cmp [rbx+338],0
  jne code
  cmp dword ptr [rbx+00000540],0
  je skip
  test rbx,rbx
  je skip
  mov [stats],rbx
  skip:
code:
  movss xmm0,[rbx+00000540]
  jmp return

player:
  jmp newmem
  nop 3
return:
registersymbol(player stats)

[DISABLE]

player:
  db F3 0F 10 83 40 05 00 00

unregistersymbol(*)
dealloc(*)"""

