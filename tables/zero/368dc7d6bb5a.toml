id = "override-item-id-on-gain-of-item-turn-off-when-not-needed"
name = "Override Item ID On Gain of Item (Turn Off When Not Needed)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(OverrideItemIDAOB,$process,45 8B BC 84 68 0C 00 00 45 8B C7 44 89 7C 24 60) // should be unique
registersymbol(OverrideItemIDAOB)
alloc(newmem,1024,OverrideItemIDAOB)

label(OverrideItemID)
registersymbol(OverrideItemID)
label(OverrideQty)
registersymbol(OverrideQty)
label(return)

newmem:
originalcode:
  mov [R14Save],r14
  mov r15d,[r12+rax*4+00000C68]
  xor r14,r14
  mov r14d,#50
  cmp r15w,r14w
  jb MyCleanUp1
  mov r14d,#800
  cmp r15w,r14w
  jb DoOverrideItemID
  mov r14d,#900
  cmp r15w,r14w
  jb MyCleanUp1
  jmp DoOverrideItemID
DoOverrideItemID:
  mov r14d,FFFFFFFF
  cmp [OverrideItemID],r14w
  je MyCleanUp1
  mov r15d,[OverrideItemID]
  
MyCleanUp1:
  mov r14,[R14Save]
  jmp OverrideItemIDAOB+08

R14Save:
dq 0
OverrideItemID:
dq FFFF
OverrideQty:
dq 1

OverrideItemIDAOB:
  jmp newmem
  return:
  
[DISABLE]

OverrideItemIDAOB:
  db 45 8B BC 84 68 0C 00 00
  
unregistersymbol(OverrideItemIDAOB)
unregistersymbol(OverrideItemID)
unregistersymbol(OverrideQty)

dealloc(newmem)"""

