[[cheat]]
id = "enable-damage-modifier-god-mode-one-hit-kill-etc"
name = "Enable Damage Modifier (God Mode, One Hit Kill, etc.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DamageModAOB,$process,48 89 5C 24 08 57 48 83 EC 20 44 8B 9A 78 02 00 00) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,4096,DamageModAOB)

label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

newmem:
  mov r11d,[rdx+00000278]
  cmp dword ptr [rdx+00000238],0
  jne EnemyHit
  jmp HeroHit
HeroHit:
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  push r8d
  fild dword ptr [esp]
  fmul dword ptr [fHeroDamageMult]
  fistp dword ptr [esp]
  pop r8d
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor r8d,r8d
  jmp MyCleanUp1
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne MyCleanUp1
  cmp r11d,r8d
  jg @F
  xor r8d,r8d
@@:
  jmp MyCleanUp1
EnemyHit:
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckOneHitKill
  push r8d
  fild dword ptr [esp]
  fmul dword ptr [fEnemyDamageMult]
  fistp dword ptr [esp]
  pop r8d
CheckOneHitKill:
  cmp [OneHitKill],1
  jne MyCleanUp1
  mov r8d,r11d
  jmp MyCleanUp1
MyCleanUp1:
  jmp originalcode

originalcode:
  mov [rsp+08],rbx
  jmp return

GodMode:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)2.0
fHeroDamageMult:
dq (float)0.25
HeroCannotDie:
dq 1

DamageModAOB:
  jmp newmem
  return:

[DISABLE]

DamageModAOB:
  db 48 89 5C 24 08

unregistersymbol(DamageModAOB)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fHeroDamageMult)
unregistersymbol(HeroCannotDie)

dealloc(newmem)"""

