[[cheat]]
id = "guishop-base-address-scan-to-activate-view-shop-to-update-view-shop"
name = "GuiShop Base Address Scan (To Activate: View Shop, To Update: View Shop)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GuiShop_savedAOB)
label(GuiShop_returnhere)
label(GuiShop_originalcode)
label(GuiShop_exit)

label(GuiShop_update_exit)
label(GuiShop_set_exit)
label(GuiShop_shoplevelset_exit)

registersymbol(GuiShop_savedAOB)

//0EDF9A73 - 0F85 50000000         - jne 0EDF9AC9
//0EDF9A79 - 48 8B 85 08FEFFFF     - mov rax,[rbp-000001F8]
// GuiShop:AddItems+5c0
//0EDF9A80 - 48 63 80 D0010000     - movsxd  rax,dword ptr [rax+000001D0]
//0EDF9A87 - 48 8B 8D 18FEFFFF     - mov rcx,[rbp-000001E8]
//0EDF9A8E - 48 63 89 D0010000     - movsxd  rcx,dword ptr [rcx+000001D0]
//0EDF9A95 - 3B C1                 - cmp eax,ecx
aobscan(GuiShop_searchedAOB, 48 63 80 D0 01 00 00 48 8B 8D 18 FE FF FF 48 63 89 D0 01 00 00 3B C1 7C 30)

alloc(GuiShop_newmem, 2048, GuiShop_searchedAOB)
alloc(GuiShop_temp1, 8, GuiShop_searchedAOB)
alloc(GuiShop_temp2, 8, GuiShop_searchedAOB)
alloc(GuiShop_temp3, 8, GuiShop_searchedAOB)
alloc(GuiShop_temp4, 8, GuiShop_searchedAOB)
alloc(GuiShop_temp5, 8, GuiShop_searchedAOB)


GuiShop_newmem:
mov [GuiShop_temp1], rax
mov [GuiShop_temp2], rbx
mov [GuiShop_temp3], rcx
mov [GuiShop_temp4], rdx

cmp dword ptr [GuiShop_update_enable], #0
je GuiShop_update_exit
mov [GuiShop_basepointer], rax
GuiShop_update_exit:

cmp dword ptr [GuiShop_set_enable], #0
je GuiShop_set_exit
GuiShop_set_exit:

cmp dword ptr [GuiShop_shoplevelset_enable], #0
je GuiShop_shoplevelset_exit
mov [rax+1d0], #9999
GuiShop_shoplevelset_exit:


mov rax, [GuiShop_temp1]
mov rbx, [GuiShop_temp2]
mov rcx, [GuiShop_temp3]
mov rdx, [GuiShop_temp4]


GuiShop_originalcode:
db 48 63 80 D0 01 00 00
//mov rax,[rax+00000190]


GuiShop_exit:
jmp GuiShop_returnhere


GuiShop_searchedAOB:
GuiShop_savedAOB:
jmp GuiShop_newmem
nop
nop
GuiShop_returnhere:


[DISABLE]
GuiShop_savedAOB:
db 48 63 80 D0 01 00 00
//mov rax,[rax+00000190]

unregistersymbol(GuiShop_savedAOB)

dealloc(GuiShop_newmem)
dealloc(GuiShop_temp1)
dealloc(GuiShop_temp2)
dealloc(GuiShop_temp3)
dealloc(GuiShop_temp4)
dealloc(GuiShop_temp5)"""

