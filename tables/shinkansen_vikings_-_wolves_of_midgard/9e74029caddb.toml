[[cheat]]
id = "rpgskill-base-address-scan-to-activate-play-level-to-update-play-level"
name = "RPGSkill Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(RPGSkill_savedAOB)
label(RPGSkill_returnhere)
label(RPGSkill_originalcode)
label(RPGSkill_exit)

label(RPGSkill_update_exit)
label(RPGSkill_set_exit)
label(RPGSkill_cooldownset_exit)
label(RPGSkill_staminaset_exit)

registersymbol(RPGSkill_savedAOB)

//0F659EE1 - 48 8B FA              - mov rdi,rdx
//0F659EE4 - 49 8B F0              - mov rsi,r8
// RPGSkill:CanCast+17
//0F659EE7 - 41 0FB6 87 B6000000   - movzx eax,byte ptr [r15+000000B6]
//0F659EEF - 85 C0                 - test eax,eax
//0F659EF1 - 74 22                 - je 0F659F15
//0F659EF3 - 48 8B CE              - mov rcx,rsi
aobscan(RPGSkill_searchedAOB, 41 0F B6 87 B6 00 00 00 85 C0)

alloc(RPGSkill_newmem, 2048, RPGSkill_searchedAOB)
alloc(RPGSkill_temp1, 8, RPGSkill_searchedAOB)
alloc(RPGSkill_temp2, 8, RPGSkill_searchedAOB)
alloc(RPGSkill_temp3, 8, RPGSkill_searchedAOB)
alloc(RPGSkill_temp4, 8, RPGSkill_searchedAOB)
alloc(RPGSkill_temp5, 8, RPGSkill_searchedAOB)


RPGSkill_newmem:
mov [RPGSkill_temp1], rax
mov [RPGSkill_temp2], rbx
mov [RPGSkill_temp3], rcx
mov [RPGSkill_temp4], rdx

cmp dword ptr [RPGSkill_update_enable], #0
je RPGSkill_update_exit
mov [RPGSkill_basepointer], r15
RPGSkill_update_exit:

cmp dword ptr [RPGSkill_set_enable], #0
je RPGSkill_set_exit
RPGSkill_set_exit:

cmp dword ptr [RPGSkill_cooldownset_enable], #0
je RPGSkill_cooldownset_exit
mov [r15+b0], (float)0
RPGSkill_cooldownset_exit:

cmp dword ptr [RPGSkill_staminaset_enable], #0
je RPGSkill_staminaset_exit
mov [r15+b8], (float)0
RPGSkill_staminaset_exit:


mov rax, [RPGSkill_temp1]
mov rbx, [RPGSkill_temp2]
mov rcx, [RPGSkill_temp3]
mov rdx, [RPGSkill_temp4]


RPGSkill_originalcode:
db 41 0F B6 87 B6 00 00 00
//movzx eax,byte ptr [r15+000000B6]


RPGSkill_exit:
jmp RPGSkill_returnhere


RPGSkill_searchedAOB:
RPGSkill_savedAOB:
jmp RPGSkill_newmem
nop
nop
nop
RPGSkill_returnhere:


[DISABLE]
RPGSkill_savedAOB:
db 41 0F B6 87 B6 00 00 00
//movzx eax,byte ptr [r15+000000B6]

unregistersymbol(RPGSkill_savedAOB)

dealloc(RPGSkill_newmem)
dealloc(RPGSkill_temp1)
dealloc(RPGSkill_temp2)
dealloc(RPGSkill_temp3)
dealloc(RPGSkill_temp4)
dealloc(RPGSkill_temp5)"""

