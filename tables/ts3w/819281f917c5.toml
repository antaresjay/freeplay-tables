type = "script"
source = """
[ENABLE]

aobscanmodule(speed,TS3W.exe,D9 41 68 D9 1E) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
mov dword ptr [ecx+68], 3E800000
code:
  fld dword ptr [ecx+68]
  fstp dword ptr [esi]
  jmp return

speed:
  jmp newmem
return:
registersymbol(speed)

[DISABLE]

speed:
  db D9 41 68 D9 1E

unregistersymbol(speed)
dealloc(newmem)"""
