type = "script"
source = """
// Game Executable   : ProjectStreamline-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 4.27.2.0
// Game Version      : Build.15538685
// Script Date       : 2025-02-06


[ENABLE]

aobscanmodule(master,ProjectStreamline-Win64-Shipping.exe,488BxxFFxxxxxxxxxx488Bxxxxxx488Bxxxxxx4883xxxx5FC3xxxxxxxxxxxx4889xxxxxx55) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,9)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,9)

newmem:
  mov [data],rsi

code:
  readmem(master,9)
  jmp return

master:
  jmp newmem
  nop 4
return:

[DISABLE]

master:
  readmem(masterbkp,9)

unregistersymbol(*)
dealloc(*)"""

