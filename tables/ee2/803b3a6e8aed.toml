[[cheat]]
id = "empire-earth-2-v1-2-script"
name = "Empire Earth 2 V1.2 Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
===========================================
 Empire Earth 2
 Game Version  : 1.2
 Script Version: 1.0
 CE Version    : 6.0
 GM, Resources, Tech Points
 04-Mar-2011 Adapted/Improved from my TSearchB Script
 By Recifense
===========================================
}

[ENABLE]
//=========================================
// Check if script is compatible to this game version
// If false the script will not be loaded

assert(EE2.exe+442c5c,d9 5e 58 8d 7e 58)
assert(EE2.exe+389e35,d9 84 bb 9c 00 00 00)
assert(EE2.exe+4577cd,d8 4e 58 8b 7c 24 10)

//=========================================
alloc(MyCode,1024)
//=========================================
// Declaration section
label(_GodMode)
label(_BackGM)
label(_ExitGM)
label(_MonRes)
label(_MonR0)
label(_BackMR)
label(_ExitMR)
label(_MonSel)
label(_BackMS)
label(pSelHP)
label(pSelUnit)
label(pUnit)
label(pHP)
label(pRes)
label(iEnableGM)
label(iEnableMR)
label(iEnableMT)
label(fOne)

registersymbol(MyCode)
registersymbol(pSelHP)
registersymbol(pSelUnit)
registersymbol(pUnit)
registersymbol(pHP)
registersymbol(pRes)
registersymbol(iEnableGM)
registersymbol(iEnableMR)
registersymbol(iEnableMT)

//=========================================
MyCode:
//=========================================
_GodMode:
 mov [pHP],esi                     // Save ptr for debugging

 cmp dword ptr [iEnableGM],0
 je _ExitGM                        // Jump if feature is disabled

 cmp byte ptr [esi+3f],08
 jne _ExitGM

 fstp st(0)                        // Discard value
 fld dword ptr [fOne]              // Get 1.0 = 100%

_ExitGM:
 fstp dword ptr [esi+58]           // Original code (Update % HP)
 lea edi,[esi+58]                  // Original code
 jmp _BackGM                       // Back to main code

//=========================================
_MonRes:
 mov [pRes],ebx                    // Save ptr for debugging

 cmp dword ptr [iEnableMR],0
 je _ExitMR                        // Jump if feature is disabled

 cmp edi,9
 je _MonR0

 cmp dword ptr [ebx+edi*4+0000009C],(float)5000.0
 jge _ExitMR

 mov dword ptr [ebx+edi*4+0000009C],(float)5000.0
 jmp _ExitMR

_MonR0:
 cmp dword ptr [iEnableMT],0
 je _ExitMR                        // Jump if feature is disabled

 cmp dword ptr [ebx+edi*4+0000009C],(float)100.0
 jge _ExitMR

 mov dword ptr [ebx+edi*4+0000009C],(float)100.0

_ExitMR:
 fld dword ptr [ebx+edi*4+0000009C]// Original code
 jmp _BackMR                       // Back to main code

//=========================================
_MonSel:
 mov [pSelHP],esi                  // Save ptr for debugging

 mov edi,[esi+40]
 mov [pSelUnit],edi

 fmul dword ptr [esi+58]           // Original code
 mov edi,[esp+10]                  // Original code
 jmp _BackMS                       // Back to main code

//=========================================
// Variables
iEnableGM:
 dd 1
iEnableMR:
 dd 1
iEnableMT:
 dd 1
pSelHP:
 dd 0
pSelUnit:
 dd 0
pUnit:
 dd 0
pHP:
 dd 0
pRes:
 dd 0
fOne:
 dd (float)1.0

//=========================================
// Hacking Points
EE2.exe+442c5c:
 jmp _GodMode
 nop
_BackGM:

EE2.exe+389e35:
 jmp _MonRes
 nop
 nop
_BackMR:

EE2.exe+4577cd:
 jmp _MonSel
 nop
 nop
_BackMS:

//=========================================
// Original Codes
[DISABLE]
EE2.exe+442c5c:
 fstp dword ptr [esi+58]
 lea edi,[esi+58]

EE2.exe+389e35:
 fld dword ptr [ebx+edi*4+0000009C]

EE2.exe+4577cd:
 fmul dword ptr [esi+58]
 mov edi,[esp+10]

unregistersymbol(MyCode)
unregistersymbol(pSelHP)
unregistersymbol(pSelUnit)
unregistersymbol(pUnit)
unregistersymbol(pHP)
unregistersymbol(pRes)
unregistersymbol(iEnableGM)
unregistersymbol(iEnableMR)
unregistersymbol(iEnableMT)

dealloc(MyCode)"""

