type = "script"
source = """
{ Game   : NoTimeForPants.exe
  Version: 
  Date   : 2025-10-26
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,PlayerBehavior:Update)
define(bytes,55 48 8B EC 48 83 EC 70)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,PlayerBehavior:Update)

label(code)
label(return)

newmem:
mov [playerbehavior_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,70
  jmp return

playerbehavior_ptr:
dq 0

address:
  jmp newmem
  nop 3
return:
registersymbol(playerbehavior_ptr)

[DISABLE]

address:
  db bytes
  // push rbp
  // mov rbp,rsp
  // sub rsp,70

dealloc(newmem)
unregistersymbol(playerbehavior_ptr)

{
// ORIGINAL CODE - INJECTION POINT: PlayerBehavior:Update

1980E94CCD7: 00 01                    - add [rcx],al
1980E94CCD9: 04 02                    - add al,02
1980E94CCDB: 05 04 03 01 50           - add eax,50010304
1980E94CCE0: 00 E8                    - add al,ch
1980E94CCE2: 3A 35 EC 0A 08 A8        - cmp dh,[197B69CD7D4]
1980E94CCE8: D7                       - xlatb 
1980E94CCE9: D8 00                    - fadd dword ptr [rax]
1980E94CCEB: 98                       - cwde 
1980E94CCEC: 01 00                    - add [rax],eax
1980E94CCEE: 00 00                    - add [rax],al
// ---------- INJECTING HERE ----------
PlayerBehavior:Update: 55                       - push rbp
// ---------- DONE INJECTING  ----------
PlayerBehavior:Update+1: 48 8B EC                 - mov rbp,rsp
PlayerBehavior:Update+4: 48 83 EC 70              - sub rsp,70
PlayerBehavior:Update+8: 48 89 75 F0              - mov [rbp-10],rsi
PlayerBehavior:Update+c: 48 89 7D F8              - mov [rbp-08],rdi
PlayerBehavior:Update+10: 48 8B F1                 - mov rsi,rcx
PlayerBehavior:Update+13: F3 0F 10 86 24 02 00 00  - movss xmm0,[rsi+00000224]
PlayerBehavior:Update+1b: F3 0F 5A C0              - cvtss2sd xmm0,xmm0
PlayerBehavior:Update+1f: 66 0F 57 C9              - xorpd xmm1,xmm1
PlayerBehavior:Update+23: 66 0F 2F C8              - comisd xmm1,xmm0
PlayerBehavior:Update+27: 0F 8A 3F 00 00 00        - jp PlayerBehavior:Update+6c
}"""

