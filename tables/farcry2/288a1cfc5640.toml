[[cheat]]
id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem, 1024)

Dunia.RunGame+13EC48:
jmp newmem
mov [ecx+14],esi
add eax,edx
pop esi
ret 0004

newmem:
cmp [esp+18],Dunia.RunGame+12B975
je Dunia.RunGame+13EC4D
sub esi,edx
jmp Dunia.RunGame+13EC4D

[DISABLE]
dealloc(newmem)

Dunia.RunGame+13EC48:
mov [ecx+14],esi
add eax,edx
pop esi
ret 0004
db CC CC CC CC CC"""

