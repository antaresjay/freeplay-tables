[[cheat]]
id = "modify-shop-items-buy-something-to-update-pointer"
name = "Modify Shop Items (Buy Something To Update Pointer)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(ShopItemsAOB,StarOceanTheLastHope.exe,48 89 84 24 80 00 00 00 48 8D 88 B2 01 00 00) // should be unique
registersymbol(ShopItemsAOB)
alloc(newmem,2048,ShopItemsAOB)

label(code)
label(return)
label(ShopPtr)
registersymbol(ShopPtr)
label(ItemIDStart)
registersymbol(ItemIDStart)
label(ShopNbrItems)
registersymbol(ShopNbrItems)

newmem:

code:
  db 48 89 84 24 80 00 00 00 48 8D 88 B2 01 00 00
  push rcx
  push rsi
  mov si,[rbx+0000015A]
  mov [ShopNbrItems],esi
  dec rsi
StartLoop4:
  sub rcx,6
  dec rsi
  cmp rsi,0
  jg StartLoop4  
  mov [ShopPtr],rcx
  pop rsi
  pop rcx
  jmp return

ShopPtr:
dq 0
ItemIDStart:
dq 1
ShopNbrItems:
dd 0

ShopItemsAOB:
  jmp newmem
  nop
return:

[DISABLE]

ShopItemsAOB:
  db 48 89 84 24 80 00 00 00 48 8D 88 B2 01 00 00

unregistersymbol(ShopItemsAOB)
unregistersymbol(ItemIDStart)
unregistersymbol(ShopNbrItems)
unregistersymbol(ShopPtr)

dealloc(newmem)"""

