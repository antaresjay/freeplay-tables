source = """
[ENABLE]


aobscanmodule(rushcd,StarOceanTheLastHope.exe,41 38 AE B8 27 01 00 75 3C)
alloc(newmem,$1000,"StarOceanTheLastHope.exe"+6571A6)

label(rushdur)
label(code)
label(return)

newmem:
  push rbx
  lea rbx, [r14+000127B8]
  cmp byte ptr [rbx], 1
  je rushdur

  cmp [unlimited_rush], 1
  jne rushdur

  mov [rbx-04], (float)100.0
  jmp code

rushdur:
  cmp [unlimited_rushdur], 1
