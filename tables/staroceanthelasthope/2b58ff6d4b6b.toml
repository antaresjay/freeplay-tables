  cmp [r14+000127B8], bpl
  jmp return

unlimited_rush:
dd 0

unlimited_rushdur:
dd 0

rushcd:
  jmp newmem
  nop
  nop
return:
registersymbol(rushcd)

[DISABLE]

rushcd:
  db 41 38 AE B8 27 01 00

unregistersymbol(rushcd)
dealloc(newmem)"""
