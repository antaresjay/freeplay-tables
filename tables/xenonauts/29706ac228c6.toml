newmemFundReader:
bEnableMinFunds:
dd 1
iMinFunds:
dd (int)5000000
bEnableInstantConstruction:
dd 1
bEnableInfiniteTUs:
dd 1
bEnableInfiniteAmmo:
dd 1
bEnableGodMode:
dd 1
bEnableInstantResearch:
dd 1
bEnableInstantManufacture:
dd 1
bEnableInstantCraftRecovery:
dd 1
bEnableCraftGodMode:
dd 1
bEnableCraftInfiniteFuel:
dd 1
bEnableInstantCraftRepair:
dd 1
bEnableStoragePatcher:
dd 1
iStoragePatcherAmount:
dd (int)500

lblFundReader:
cmp dword ptr [bEnableMinFunds],1
jne short lblFundReaderSkip
mov ecx,[iMinFunds]
cmp ecx,edx
jle short lblFundReaderSkip
mov edx,ecx
mov ecx,[pFunds]
mov dword ptr [ecx],edx
lblFundReaderSkip:
readmem(aobFundReader,6)
jmp lblFundReaderRet
aobFundReader_i:
readmem(aobFundReader,6)
pFunds:
readmem(aobFundReader-4,4)

lblConstructionTimeReader:
cmp dword ptr [bEnableInstantConstruction],1
jne short lblConstructionTimeReaderSkip
cmp dword ptr [edi+24],0
je short lblConstructionTimeReaderSkip
mov dword ptr [edi+24],(float)0.0001
lblConstructionTimeReaderSkip:
readmem(aobConstructionTimeReader,5)
jmp lblConstructionTimeReaderRet
aobConstructionTimeReader_i:
readmem(aobConstructionTimeReader,5)

lblTUReader:
cmp dword ptr [bEnableInfiniteAmmo],1
jne short lblTUReaderSkipAmmo
cmp dword ptr [esi+000002CC],0
je short lblTUReaderSkipAmmo
mov edi,[esi+000002BC]
test edi,edi
jz short lblTUReaderSkipAmmo
mov eax,[edi+20]
test eax,eax
jz short lblTUReaderSkipAmmo
mov eax,[eax+1C]
test eax,eax
jz short lblTUReaderSkipAmmo
mov dword ptr [edi+24],eax
lblTUReaderSkipAmmo:
cmp dword ptr [bEnableInfiniteTUs],1
jne short lblTUReaderSkip
mov edx,[aobTUReader_i+02]
mov eax,[esi+edx-4]
mov dword ptr [esi+edx],eax
lblTUReaderSkip:
readmem(aobTUReader,6)
jmp lblTUReaderRet
aobTUReader_i:
readmem(aobTUReader,6)

lblHealthCalc:
cmp dword ptr [esi+000002CC],0
je short lblHealthCalcSkip
cmp dword ptr [bEnableGodMode],1
jne short lblHealthCalcSkip
jmp lblHealthCalcRet
lblHealthCalcSkip:
readmem(aobHealthCalc,7)
jmp lblHealthCalcRet
aobHealthCalc_i:
readmem(aobHealthCalc,7)

lblResearchTimeReader:
cmp dword ptr [bEnableInstantResearch],1
jne short lblResearchTimeReaderSkip
cmp dword ptr [ebx+28],0
je short lblResearchTimeReaderSkip
mov dword ptr [ebx+28],(float)0.000001
