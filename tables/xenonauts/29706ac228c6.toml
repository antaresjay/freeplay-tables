cmp dword ptr [bEnableCraftInfiniteFuel],1
jne short lblFuelCalcFightSkip
addsd xmm1,xmm0
lblFuelCalcFightSkip:
readmem(aobFuelCalcFight,8)
jmp lblFuelCalcFightRet
aobFuelCalcFight_i:
readmem(aobFuelCalcFight,8)

lblCraftHealthCalc:
cmp dword ptr [ecx+18],0
je short lblCraftHealthCalcSkip
cmp dword ptr [bEnableCraftGodMode],1
jne short lblCraftHealthCalcSkip
addsd xmm0,xmm1
lblCraftHealthCalcSkip:
readmem(aobCraftHealthCalc,8)
jmp lblCraftHealthCalcRet
aobCraftHealthCalc_i:
