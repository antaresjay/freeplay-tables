je short lblFuelCalc2Skip
cmp dword ptr [bEnableCraftInfiniteFuel],1
jne short lblFuelCalc2Skip
addsd xmm1,xmm2
lblFuelCalc2Skip:
readmem(aobFuelCalc2,8)
jmp lblFuelCalc2Ret
aobFuelCalc2_i:
readmem(aobFuelCalc2,8)

lblCraftHealthReader:
cmp dword ptr [bEnableInstantCraftRepair],1
jne short lblCraftHealthReaderSkip
movsx esi,[aobCraftHealthReader_i+4]
cvtsi2ss xmm1,ecx
comiss xmm1,[edi+esi]
je short lblCraftHealthReaderSkip
subss xmm1,[fStep]
movss [edi+esi],xmm1
lblCraftHealthReaderSkip:
readmem(aobCraftHealthReader,5)
jmp lblCraftHealthReaderRet
aobCraftHealthReader_i:
readmem(aobCraftHealthReader,5)
fStep:
dd (float)0.000001

lblStorageReader:
cmp dword ptr [bEnableStoragePatcher],1
jne short lblStorageReaderSkip
pushad
push 12
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne short lblStorageReaderSkip
mov edi,[iStoragePatcherAmount]
add [eax+10],edi
lblStorageReaderSkip:
readmem(aobStorageReader,5)
jmp lblStorageReaderRet
aobStorageReader_i:
readmem(aobStorageReader,5)

aobStorageReader:
aobStorageReader_r:
jmp lblStorageReader
lblStorageReaderRet:

aobCraftHealthReader:
