name = "Chemistry Station: Perfect Temperature"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(BunsenBurnerTemp,GameAssembly.dll,F3 0F 10 43 28 48 85 C9)
