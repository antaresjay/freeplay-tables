[[cheat]]
id = "infinite-health-one-hit-kill"
name = "Infinite Health | One Hit Kill"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(aobHealth,F3 0F 10 41 44 ** ** C9)
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
label(Health)
registersymbol(Health)

newmem:
xor eax,eax
mov eax,[ecx+30]
mov eax,[ecx+34]
mov eax,[ecx+38]
mov [ecx+44],eax
jmp originalcode

originalcode:
movss xmm0,[ecx+44]

exit:
jmp returnhere

aobHealth:
Health:
jmp newmem
returnhere:


[DISABLE]
dealloc(newmem)
unregistersymbol(Health)
Health:
db F3 0F 10 41 44"""

