[[cheat]]
id = "enable-player-modifier"
name = "→ Enable Player Modifier"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//Send@FearlessRevolution|Sintrix
aobscanregion(pHealth,Opsive.ThirdPersonController.Health:SetHealthAmount,Opsive.ThirdPersonController.Health:SetHealthAmount+64,F3 0F 11 AE C0 01 00 00 48 8B 8E)
alloc(newmem,$1000,pHealth)
registersymbol(GM OHK)
label(code return GM OHK)

newmem:
cmp [GM],1
jne @f
cmp [rsi+143],1
jne @f
movss xmm5,[rsi+19C]
movss [rsi+1C0],xmm5

//Send@FearlessRevolution|Sintrix
@@:
cmp [OHK],1
jne code
cmp [rsi+143],0
jne code
xorps xmm5,xmm5
jmp code

code:
  movss [rsi+000001C0],xmm5
  jmp return

GM:
dd 0

OHK:
dd 0
//Send@FearlessRevolution|Sintrix
pHealth:
  jmp newmem
  nop 3
return:
registersymbol(pHealth)

[DISABLE]

pHealth:
  db F3 0F 11 AE C0 01 00 00
//Send@FearlessRevolution|Sintrix
unregistersymbol(*)
dealloc(*)"""

