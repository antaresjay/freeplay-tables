source = """
{ Game   : Dice-Win64-Shipping.exe
  Date   : 2025-10-04
  Author : Sianz
}

[ENABLE]

aobscanmodule(player,Dice-Win64-Shipping.exe,48 8B 90 E8 02 00 00 48 85 D2 0F) // should be unique
alloc(newmem,$1000,player)
alloc(stats,8)
label(code)
label(return)

newmem:
  cmp dword ptr [rax+000002E8],0
  je code
  test rax,rax
  je code
  mov [stats],rax
code:
  mov rdx,[rax+000002E8]
  jmp return

player:
  jmp newmem
  nop 2
return:
registersymbol(player stats)

[DISABLE]

player:
  db 48 8B 90 E8 02 00 00

unregistersymbol(*)
dealloc(*)"""
