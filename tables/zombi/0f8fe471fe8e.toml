[[cheat]]
id = "touch-inventory-items-and-release-don-t-change-slot"
name = "Touch Inventory Items And Release, Don't Change Slot!"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
define(BACKPACK,"ZOMBI.exe")

[ENABLE]
alloc(Pointhem,$1000,BACKPACK)
label(todo)
label(returnhere)
label(originalcode)
registersymbol(Pointhem)
// Define Variables
label(nmbrs)
registersymbol(nmbrs)

Pointhem:

// Variables
nmbrs:
dd 0

todo:
mov [nmbrs],edi
add [nmbrs],ecx
add [nmbrs],ecx
add [nmbrs],ecx
add [nmbrs],ecx
add [nmbrs],00000148


originalcode:
mov eax,[edi+ecx*4+00000148]
jmp returnhere



"rabbids.win32.f.dll"+1FF0E4:
jmp todo
nop
nop
returnhere:


 
 
[DISABLE]
"rabbids.win32.f.dll"+1FF0E4:
db 8B 84 8F 48 01 00 00
unregistersymbol(nmbrs)
unregistersymbol(Pointhem)
dealloc(Pointhem)
//mov eax,[edi+ecx*4+00000148]
//Alt: db 8B 84 8F 48 01 00 00 - 89 87 14"""

