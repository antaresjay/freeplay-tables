[[cheat]]
id = "gamemanager-base-address-scan-initialization-activate-this-first"
name = "GameManager Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameManager_basepointer)
registersymbol(GameManager_update_enable)
registersymbol(GameManager_set_enable)
registersymbol(GameManager_hpset_enable)
registersymbol(GameManager_itemsset_enable)
registersymbol(GameManager_moraleset_enable)

alloc(GameManager_basepointer, 4)
alloc(GameManager_update_enable, 4)
alloc(GameManager_set_enable, 4)
alloc(GameManager_hpset_enable, 4)
alloc(GameManager_itemsset_enable, 4)
alloc(GameManager_moraleset_enable, 4)


[DISABLE]
unregistersymbol(GameManager_basepointer)
unregistersymbol(GameManager_update_enable)
unregistersymbol(GameManager_set_enable)
unregistersymbol(GameManager_hpset_enable)
unregistersymbol(GameManager_itemsset_enable)
unregistersymbol(GameManager_moraleset_enable)

dealloc(GameManager_basepointer)
dealloc(GameManager_update_enable)
dealloc(GameManager_set_enable)
dealloc(GameManager_hpset_enable)
dealloc(GameManager_itemsset_enable)
dealloc(GameManager_moraleset_enable)"""

[[cheat]]
id = "gamemanager-base-address-scan-to-activate-play-level-to-update-play-level"
name = "GameManager Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameManager_savedAOB)
label(GameManager_returnhere)
label(GameManager_originalcode)
label(GameManager_exit)

label(GameManager_update_exit)
label(GameManager_set_exit)
label(GameManager_hpset_exit)
label(GameManager_hpset_entry)
label(GameManager_hpset_continue)
label(GameManager_itemsset_exit)
label(GameManager_itemsset_entry)
label(GameManager_itemsset_continue)
label(GameManager_moraleset_exit)

registersymbol(GameManager_savedAOB)

//0448D6EA - 83 C4 10              - add esp,10
//0448D6ED - B8 DE693E08           - mov eax,083E69DE : [AFD80000]
// CameraController:LateUpdate+2ea
//0448D6F2 - C6 00 00              - mov byte ptr [eax],00
//0448D6F5 - 8D 65 FC              - lea esp,[ebp-04]
//0448D6F8 - 5F                    - pop edi
//0448D6F9 - C9                    - leave
//0448D6FA - C3                    - ret
aobscan(GameManager_searchedAOB, C6 00 00 8D 65 FC 5F C9 C3)

alloc(GameManager_newmem, 2048, GameManager_searchedAOB)
alloc(GameManager_temp1, 4, GameManager_searchedAOB)
alloc(GameManager_temp2, 4, GameManager_searchedAOB)
alloc(GameManager_temp3, 4, GameManager_searchedAOB)
alloc(GameManager_temp4, 4, GameManager_searchedAOB)
alloc(GameManager_temp5, 4, GameManager_searchedAOB)


GameManager_newmem:
mov [GameManager_temp1], eax
mov [GameManager_temp2], ebx
mov [GameManager_temp3], ecx
mov [GameManager_temp4], edx

mov ebx, [GameManager_savedAOB-4]
sub ebx, be

cmp dword ptr [GameManager_update_enable], #0
je GameManager_update_exit
mov [GameManager_basepointer], ebx
GameManager_update_exit:

cmp dword ptr [GameManager_set_enable], #0
je GameManager_set_exit
GameManager_set_exit:

cmp dword ptr [GameManager_hpset_enable], #0
je GameManager_hpset_exit
mov edx, 0
mov eax, [ebx+24]
test eax, eax
je GameManager_hpset_exit
mov eax, [eax+8]
test eax, eax
je GameManager_hpset_exit
mov ecx, [eax+c]
test ecx, ecx
je GameManager_hpset_exit
mov [GameManager_temp5], ecx
GameManager_hpset_entry:
mov ecx, [eax+edx*4+10]
test ecx, ecx
je GameManager_hpset_continue
mov [ecx+70], (float)9999
GameManager_hpset_continue:
inc edx
cmp [GameManager_temp5], edx
je GameManager_hpset_exit
jmp GameManager_hpset_entry
GameManager_hpset_exit:

cmp dword ptr [GameManager_itemsset_enable], #0
je GameManager_itemsset_exit
mov edx, 0
mov eax, [ebx+14]
test eax, eax
je GameManager_itemsset_exit
mov eax, [eax+8]
test eax, eax
je GameManager_itemsset_exit
mov ecx, [eax+c]
test ecx, ecx
je GameManager_itemsset_exit
mov [GameManager_temp5], ecx
GameManager_itemsset_entry:
mov ecx, [eax+edx*4+10]
test ecx, ecx
je GameManager_itemsset_continue
mov [ecx+54], #9
cmp edx, #2
jg GameManager_itemsset_continue
mov [ecx+54], #9999
GameManager_itemsset_continue:
inc edx
cmp [GameManager_temp5], edx
je GameManager_itemsset_exit
jmp GameManager_itemsset_entry
GameManager_itemsset_exit:

cmp dword ptr [GameManager_moraleset_enable], #0
je GameManager_moraleset_exit
mov eax, [ebx+9c]
test eax, eax
je GameManager_moraleset_exit
mov [eax+174], (float)9999
mov [eax+180], (float)0
GameManager_moraleset_exit:

mov eax, [GameManager_temp1]
mov ebx, [GameManager_temp2]
mov ecx, [GameManager_temp3]
mov edx, [GameManager_temp4]


GameManager_originalcode:
db C6 00 00 8D 65 FC
//mov byte ptr [eax],00
//lea esp,[ebp-04]


GameManager_exit:
jmp GameManager_returnhere


GameManager_searchedAOB:
GameManager_savedAOB:
jmp GameManager_newmem
nop
GameManager_returnhere:


[DISABLE]
GameManager_savedAOB:
db C6 00 00 8D 65 FC
//mov byte ptr [eax],00
//lea esp,[ebp-04]

unregistersymbol(GameManager_savedAOB)

dealloc(GameManager_newmem)
dealloc(GameManager_temp1)
dealloc(GameManager_temp2)
dealloc(GameManager_temp3)
dealloc(GameManager_temp4)
dealloc(GameManager_temp5)"""

