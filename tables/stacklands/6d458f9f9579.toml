type = "script"
source = """
//Send@ModEngine
[ENABLE]

aobscanregion(harvesttime,Harvestable:UpdateCard+350,Harvestable:UpdateCard+376,C4 F3 0F 5A C0 F3 0F 10 8E F8 00 00 00)
alloc(newmem,$1000,harvesttime)

label(code)
label(return)

newmem:
mov [rsi+00F8],(float)2
code:
  movss xmm1,[rsi+000000F8]
  jmp return

harvesttime+05:
  jmp newmem
  nop 3
return:
registersymbol(harvesttime)

[DISABLE]

harvesttime+05:
  db F3 0F 10 8E F8 00 00 00

unregistersymbol(harvesttime)
dealloc(newmem)"""
