[[cheat]]
id = "energia-segadora"
name = "Energia Segadora"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
// Buscamos la dirección exacta: defiance.exe+14931F
aobscanmodule(HIT_INJECT,defiance.exe,F3 0F 11 89 48 07 00 00 0F B6)
alloc(newmem,$1000,HIT_INJECT)

label(return)
label(valor_max)

newmem:
  // Forzamos que xmm1 (la energía calculada) sea 116.0 antes de guardarla
  movss xmm1, [valor_max]
  // Instrucción original que guarda el valor en la memoria
  movss [rcx+00000748],xmm1
  jmp return

valor_max:
  dd (float)116.0

HIT_INJECT:
  jmp newmem
  nop 3
return:
registersymbol(HIT_INJECT)

[DISABLE]
HIT_INJECT:
  // Restauramos los bytes originales
  db F3 0F 11 89 48 07 00 00 0F B6

unregistersymbol(HIT_INJECT)
dealloc(newmem)"""
