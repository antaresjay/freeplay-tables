[[cheat]]
id = "energia-no-baja"
name = "Energia No baja"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(INJECT,defiance.exe,F3 41 0F 11 8A D0 06 00 00 41 80 BA EA 0A 00 00 00 41 B0 FF 48 8B 0F BA AB) // should be unique
alloc(newmem,$1000,INJECT)
label(code)
label(return)

newmem:
code:
  // Instrucción original anulada: no se escribe el valor reducido
  // movss [r10+000006D0],xmm1
  jmp return

INJECT:
  jmp newmem
  nop 4
return:
registersymbol(INJECT)

[DISABLE]
INJECT:
  db F3 41 0F 11 8A D0 06 00 00
unregistersymbol(INJECT)
dealloc(newmem)"""

