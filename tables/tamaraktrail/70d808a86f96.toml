[[cheat]]
id = "hero-ctrl-numpad-1-will-populate-during-battle"
name = "Hero (Ctrl + Numpad 1) {Will populate during battle}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : TamarakTrail.exe
// Author            : ndck76
// Executable Version: 2021.3.29.19821
// Game Version      : v1.0
// Script Date       : 2024-03-02


[ENABLE]

aobscanregion(pointregenrate,Hero:GetCombatPointsRegenRate,Hero:GetCombatPointsRegenRate+300,486387xxxx000085xxxxxxC787xxxxxxxxxxxx000048xxxxxxxxxxxx48xxxxxx48xxxxxx4Cxxxxxx4Cxxxxxx48xxxxxx5DC3) //Hero:GetCombatPointsRegenRate+220
alloc(newmem,$1000,pointregenrate)
alloc(data,8)
alloc(pointregenratebkp,7)
registersymbol(data)
registersymbol(pointregenrate)
registersymbol(pointregenratebkp)
label(code)
label(return)

pointregenratebkp:
  readmem(pointregenrate,7)

newmem:
  mov [data],rdi

code:
  readmem(pointregenrate,7)
  jmp return

pointregenrate:
  jmp newmem
  nop 2
return:

[DISABLE]

pointregenrate:
  readmem(pointregenratebkp,7)

unregistersymbol(*)
dealloc(*)"""

