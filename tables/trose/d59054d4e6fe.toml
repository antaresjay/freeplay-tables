[[cheat]]
id = "movement-speed"
name = "Movement Speed"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
{  Game Executable   : trose.exe
   Executable Version: 1.3.7.2
   Script Date       : 2023-01-03
   Author            : Sianz
}

[ENABLE]
aobscanmodule(aomovspd,trose.exe,0F B7 ? ? ? ? ? C3 CC CC CC CC CC CC CC CC 0F BF ? ? ? ? ? 0F BF)
alloc(nmovspd,$1000,aomovspd)
label(rmovspd resmovspd)
registersymbol(resmovspd aomovspd)
nmovspd:
mov word ptr [rcx+00000B50],#2000 //edit the #2000 if you want lower or higher speed
resmovspd:
readmem(aomovspd,7)
jmp rmovspd
aomovspd:
jmp nmovspd
nop 2
rmovspd:
[DISABLE]
aomovspd:
readmem(resmovspd,7)
unregistersymbol(*)
dealloc(*)"""

