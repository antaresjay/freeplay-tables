[[cheat]]
id = "no-clip"
name = "No Clip"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{  Game Executable   : trose.exe
   Executable Version: 1.3.7.2
   Script Date       : 2023-01-01
   Author            : Sianz
}

[ENABLE]
aobscanmodule(aonoclip,trose.exe,74 ? 8B 47 ? F2 0F ? ? ? F2 0F)
alloc(resnoclip,5)
resnoclip:
readmem(aonoclip,5)
aonoclip:
db 75
registersymbol(resnoclip aonoclip)
[DISABLE]
aonoclip:
readmem(resnoclip,5)
unregistersymbol(*)
dealloc(*)"""

