TimeShift.exe+C2EE7 - DD D8                    - fstp st(0)
TimeShift.exe+C2EE9 - 76 09                    - jna TimeShift.exe+C2EF4
TimeShift.exe+C2EEB - 83 8E D8 02 00 00 08     - or dword ptr [esi+000002D8],08
TimeShift.exe+C2EF2 - EB 2A                    - jmp TimeShift.exe+C2F1E
TimeShift.exe+C2EF4 - F3 0F10 81 90 02 00 00   - movss xmm0,[ecx+00000290]
