[[cheat]]
id = "alt-1-infinite-health"
name = "Alt+1: Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(Inf.HP_code)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
Inf.HP_code:
mov [edi+00000234],(float)100.00

//originalcode:
//movss [edi+00000234],xmm0

exit:
jmp returnhere

"TimeShift.Exe"+207A5:
jmp newmem
nop
nop
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
"TimeShift.Exe"+207A5:
movss [edi+00000234],xmm0
//Alt: db F3 0F 11 87 34 02 00 00"""

