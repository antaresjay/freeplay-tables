[[cheat]]
id = "max-rupees-collect-or-spend-to-see-change"
name = "Max Rupees (Collect or spend to see change)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(INJECT,D6 81 E6 FF FF 00 00 49 89 F6 66 41 C1 C6 08 66 45 89 74 15 06) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  //mov [r13+rdx+06],r14w
  mov [r13+rdx+06],#9999
  jmp return

INJECT+0F:
  jmp newmem
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT+0F:
  db 66 45 89 74 15 06

unregistersymbol(INJECT)
dealloc(newmem)"""

