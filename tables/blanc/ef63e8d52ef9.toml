//MegaTagmension Blanc.exe+44A3B - 5D                    - pop ebp
//MegaTagmension Blanc.exe+44A3C - C3                    - ret
aobscan(battlestats_searchedAOB, 8B 45 08 D9 40 08 5D C3)

