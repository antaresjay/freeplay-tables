mov [ebx+1674], (float)9999
mov [ebx+1678], (float)9999
mov [ebx+167c], (float)9999
mov [ebx+1680], (float)9999
mov [ebx+1684], (float)2
mov [ebx+1688], (float)9999
mov [ebx+168c], (float)9999
mov [ebx+1690], (float)9999
mov [ebx+1694], (float)9999
mov [ebx+1698], (float)9999
battlestats_effectsset_exit:

cmp dword ptr [battlestats_attributesset_enable], #0
je battlestats_attributesset_exit
mov [ebx+160c], (float)9999
mov [ebx+1610], (float)9999
mov [ebx+161c], (float)30
battlestats_attributesset_exit:

mov ebx, [battlestats_temp1]


battlestats_originalcode:
db 8B 45 08 D9 40 08
//mov eax,[ebp+08]
//fld dword ptr [eax+08]


battlestats_exit:
