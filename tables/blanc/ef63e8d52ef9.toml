mov [ebx+15f0], (float)100
battlestats_exedriveset_exit:

cmp dword ptr [battlestats_knockdownset_enable], #0
je battlestats_knockdownset_exit
fld [ebx+1618]
fstp [ebx+1604]
battlestats_knockdownset_exit:

