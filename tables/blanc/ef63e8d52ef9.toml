//MegaTagmension Blanc.exe+E88E7 - 74 0B                 - je "MegaTagmension Blanc.exe"+E88F4
//MegaTagmension Blanc.exe+E88E9 - 8B 4D FC              - mov ecx,[ebp-04]
// Accesses Credits
//MegaTagmension Blanc.exe+E88EC - 8B 81 60010000        - mov eax,[ecx+00000160]
//MegaTagmension Blanc.exe+E88F2 - EB 02                 - jmp "MegaTagmension Blanc.exe"+E88F6
//MegaTagmension Blanc.exe+E88F4 - 33 C0                 - xor eax,eax
//MegaTagmension Blanc.exe+E88F6 - 8B E5                 - mov esp,ebp
aobscan(cutstats_searchedAOB, 8B 81 60 01 00 00 EB 02)

