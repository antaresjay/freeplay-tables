source = """
//Send@Sintrix|FearlessRevolution
define(address,BattleAbility:get_hpPercent+18)
define(bytes,F3 0F 10 4E 1C)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,BattleAbility:get_hpPercent+18)

label(code)
label(return)

newmem:
cmp [rdi+298],1
je code
mov [rsi+10],(float)0
movss xmm1,[rsi+1C]
xorps xmm1,xmm1
jmp code

code:
