name = "Ability No Cooldown (Ctrl + Numpad 4) {This might slowdown the game play}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,AbilityCoolDown:ButtonTriggered+f)
define(bytes,F3 0F 10 46 4C)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,AbilityCoolDown:ButtonTriggered+f)

label(code)
label(return)

newmem:
  mov [rsi+4C],0

code:
  movss xmm0,[rsi+4C]
  jmp return

address:
  jmp newmem
return:

[DISABLE]

address:
  db bytes
  // movss xmm0,[rsi+4C]

dealloc(newmem)"""
