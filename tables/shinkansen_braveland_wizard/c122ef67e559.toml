label(playerbook2statsset_exit)

registersymbol(playerbook2stats_savedAOB)

aobscan(playerbook2stats_searchedAOB,8B 80 88 00 00 00 89 45 F4)

alloc(playerbook2stats_newmem,2048) //2kb should be enough
alloc(playerbook2stats_temp,4)


playerbook2stats_newmem:
mov [playerbook2stats_temp], ebx


cmp dword ptr [playerbook2statsupdate_enable], #0
je playerbook2statsupdate_exit
mov [playerbook2stats_basepointer], eax
playerbook2statsupdate_exit:

cmp dword ptr [playerbook2statsset_enable], #0
