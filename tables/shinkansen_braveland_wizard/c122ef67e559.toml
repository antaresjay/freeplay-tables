category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(playerbook2stats_savedAOB)
label(playerbook2stats_returnhere)
label(playerbook2stats_originalcode)
label(playerbook2stats_exit)

