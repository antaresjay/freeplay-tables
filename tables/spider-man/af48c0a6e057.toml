type = "script"
source = """
[ENABLE]

aobscanmodule(MAX_Combo,Spider-Man.exe,8B 47 58 3B 47 5C) // should be unique
alloc(newmem,$1000,MAX_Combo)

label(code)
label(return)

newmem:
  mov [rdi+58],#999
code:
  mov eax,[rdi+58]
  cmp eax,[rdi+5C]
  jmp return

MAX_Combo:
  jmp newmem
  nop
return:
registersymbol(MAX_Combo)

[DISABLE]

MAX_Combo:
  db 8B 47 58 3B 47 5C

unregistersymbol(MAX_Combo)
dealloc(newmem)"""
