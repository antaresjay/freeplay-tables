name = "Never Die"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanmodule(health,Shipping-ThiefGame.exe,0F 2F B1 E8 00 00 00 0F) // should be unique
label(healthy)
registersymbol(healthy)
alloc(newmem,2048,health)
