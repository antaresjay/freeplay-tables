//DG_OperationOsaka.exe+EEC37 - 8B CF                 - mov ecx,edi
//DG_OperationOsaka.exe+EEC39 - E8 32060000           - call DG_OperationOsaka.exe+EF270
//DG_OperationOsaka.exe+EEC3E - F3 0F10 87 AC000000   - movss xmm0,[edi+000000AC]
//DG_OperationOsaka.exe+EEC46 - 0F2F 87 B0000000      - comiss xmm0,[edi+000000B0]
//DG_OperationOsaka.exe+EEC4D - 76 65                 - jna DG_OperationOsaka.exe+EECB4
//DG_OperationOsaka.exe+EEC4F - 83 BF CC220000 00     - cmp dword ptr [edi+000022CC],00
aobscan(gearstats_searchedAOB, F3 0F 10 87 AC 00 00 00 0F 2F 87 B0 00 00 00)

alloc(gearstats_newmem, 2048, gearstats_searchedAOB)
alloc(gearstats_temp1, 4, gearstats_searchedAOB)
alloc(gearstats_temp2, 4, gearstats_searchedAOB)
alloc(gearstats_temp3, 4, gearstats_searchedAOB)
alloc(gearstats_temp4, 4, gearstats_searchedAOB)
alloc(gearstats_temp5, 4, gearstats_searchedAOB)


gearstats_newmem:
mov [gearstats_temp1], eax
mov [gearstats_temp2], ebx
mov [gearstats_temp3], ecx
mov [gearstats_temp4], edx

cmp dword ptr [gearstats_update_enable], #0
je gearstats_update_exit
mov [gearstats_basepointer], edi
gearstats_update_exit:

cmp dword ptr [gearstats_set_enable], #0
je gearstats_set_exit
gearstats_set_exit:

cmp dword ptr [gearstats_durabilityset_enable], #0
je gearstats_durabilityset_exit
mov ebx, [edi+a4]
mov [edi+a8], ebx
gearstats_durabilityset_exit:

cmp dword ptr [gearstats_ammoset_enable], #0
je gearstats_ammoset_exit
mov [edi+2270], (float)100
mov [edi+2274], (float)100
mov [edi+2290], (float)100
mov [edi+2294], (float)100
mov [edi+22b0], (float)100
mov [edi+22b4], (float)100
gearstats_ammoset_exit:

mov eax, [gearstats_temp1]
mov ebx, [gearstats_temp2]
mov ecx, [gearstats_temp3]
mov edx, [gearstats_temp4]


gearstats_originalcode:
db F3 0F 10 87 AC 00 00 00
//movss xmm0,[edi+000000AC]


gearstats_exit:
jmp gearstats_returnhere


gearstats_searchedAOB:
gearstats_savedAOB:
jmp gearstats_newmem
nop
nop
nop
gearstats_returnhere:


[DISABLE]
gearstats_savedAOB:
db F3 0F 10 87 AC 00 00 00
//movss xmm0,[edi+000000AC]

unregistersymbol(gearstats_savedAOB)

dealloc(gearstats_newmem)
dealloc(gearstats_temp1)
dealloc(gearstats_temp2)
dealloc(gearstats_temp3)
dealloc(gearstats_temp4)
dealloc(gearstats_temp5)"""

