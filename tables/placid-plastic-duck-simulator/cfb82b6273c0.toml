[[cheat]]
id = "auto-assemble-script"
name = "Auto Assemble script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Placid Plastic Duck Simulator.exe
  Version: 
  Date   : 2025-10-04
  Author : HOAMTH

  This script uses a different approach to spawn dicks faster. It compares the current progress to our custom spawn interval
  and spawns ducks once the custom time has been surpassed. Downside is only that the duck timer in the top-right doesn't
  fill nicely.
}

define(address,"GameAssembly.dll"+69CDDC)
define(bytes,0F 2F 87 40 01 00 00)

[ENABLE]


assert(address,bytes)
alloc(newmem,$1000,"GameAssembly.dll"+69CDDC)

label(code)
label(return)
registersymbol(interval)
alloc(interval,4,"GameAssembly.dll"+69CDDC)
interval:
dd (float)30.0

newmem:
  comiss xmm0,[interval]
  jmp return

code:
  comiss xmm0,[rdi+00000140]
  jmp return

address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  db bytes
  // comiss xmm0,[rdi+00000140]

dealloc(newmem)
dealloc(interval)
unregistersymbol(interval)

{
