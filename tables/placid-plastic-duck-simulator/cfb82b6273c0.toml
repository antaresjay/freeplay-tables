[[cheat]]
id = "override-spawning-interval"
name = "Override Spawning Interval"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Placid Plastic Duck Simulator.exe
  Version:
  Date   : 2025-10-04
  Author : HOAMTH

  This script overrides the target time for the spawning timer. First, we write our custom interval to xmm0, and then to the actual address.
  We can do this because xmm0 is already used for that in ealier opcodes.
}

[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048,"GameAssembly.dll"+69CE6B)
label(returnhere)
label(originalcode)
label(exit)
registersymbol(interval)
alloc(interval,4,"GameAssembly.dll"+69CE6B)
interval:
dd (float)30.0

newmem: //this is allocated memory, you have read,write,execute access
movss xmm0,[interval]

originalcode:
movss [rdi+00000140],xmm0

exit:
jmp returnhere

"GameAssembly.dll"+69CE6B:
jmp newmem
nop 3
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
dealloc(interval)
unregistersymbol(interval)
"GameAssembly.dll"+69CE6B:
db F3 0F 11 87 40 01 00 00

//movss [rbx+00000140],xmm0"""

