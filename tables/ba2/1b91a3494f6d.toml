[[cheat]]
id = "unit-stats-base-address-scan-initialization-activate-this-first"
name = "Unit Stats Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(unitstats_basepointer)
registersymbol(unitstats_update_enable)
registersymbol(unitstats_set_enable)
registersymbol(unitstats_country1_value)
registersymbol(unitstats_country2_value)
registersymbol(unitstats_apshotsset_enable)
registersymbol(unitstats_moraleset_enable)
registersymbol(unitstats_statsset_enable)

alloc(unitstats_basepointer, 4)
alloc(unitstats_update_enable, 4)
alloc(unitstats_set_enable, 4)
alloc(unitstats_country1_value, 4)
alloc(unitstats_country2_value, 4)
alloc(unitstats_apshotsset_enable, 4)
alloc(unitstats_moraleset_enable, 4)
alloc(unitstats_statsset_enable, 4)


[DISABLE]
unregistersymbol(unitstats_basepointer)
unregistersymbol(unitstats_update_enable)
unregistersymbol(unitstats_set_enable)
unregistersymbol(unitstats_country1_value)
unregistersymbol(unitstats_country2_value)
unregistersymbol(unitstats_apshotsset_enable)
unregistersymbol(unitstats_moraleset_enable)
unregistersymbol(unitstats_statsset_enable)

dealloc(unitstats_basepointer)
dealloc(unitstats_update_enable)
dealloc(unitstats_set_enable)
dealloc(unitstats_country1_value)
dealloc(unitstats_country2_value)
dealloc(unitstats_apshotsset_enable)
dealloc(unitstats_moraleset_enable)
dealloc(unitstats_statsset_enable)"""

[[cheat]]
id = "unit-stats-base-address-scan-to-update-mouseover-select-unit"
name = "Unit Stats Base Address Scan (To Update: Mouseover / Select Unit)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(unitstats_savedAOB)
label(unitstats_returnhere)
label(unitstats_originalcode)
label(unitstats_exit)

label(unitstats_update_exit)
label(unitstats_friendlyset_entry)
label(unitstats_set_exit)
label(unitstats_apshotsset_exit)
label(unitstats_moraleset_exit)
label(unitstats_statsset_exit)

registersymbol(unitstats_savedAOB)

//BA2.exe+103E6F - 8B 95 4CEBFFFF        - mov edx,[ebp-000014B4]
//BA2.exe+103E75 - 8B 45 DC              - mov eax,[ebp-24]
//BA2.exe+103E78 - 8B 8C 90 B4010000     - mov ecx,[eax+edx*4+000001B4]
//BA2.exe+103E7F - 89 4D CC              - mov [ebp-34],ecx
//BA2.exe+103E82 - EB 2B                 - jmp BA2.exe+103EAF
//BA2.exe+103E84 - 8B 55 08              - mov edx,[ebp+08]
aobscan(unitstats_searchedAOB, 8B 8C 90 B4 01 00 00 89 4D CC)

alloc(unitstats_newmem, 2048)
alloc(unitstats_temp1, 4)


unitstats_newmem:
mov [unitstats_temp1], ebx

cmp dword ptr [unitstats_update_enable], #0
je unitstats_update_exit
// Selected
//cmp dword ptr [eax+1ac], #1
//jne unitstats_update_exit
//mov ebx, [eax]
mov [unitstats_basepointer], eax
unitstats_update_exit:

// Country
mov ebx, [unitstats_country1_value]
cmp dword ptr [eax+1b4], ebx
je unitstats_friendlyset_entry

mov ebx, [unitstats_country2_value]
cmp dword ptr [eax+1b4], ebx
je unitstats_friendlyset_entry

jmp unitstats_statsset_exit

unitstats_friendlyset_entry:
cmp dword ptr [unitstats_set_enable], #0
je unitstats_set_exit
unitstats_set_exit:

cmp dword ptr [unitstats_apshotsset_enable], #0
je unitstats_apshotsset_exit
mov [eax+1d0], #999
mov [eax+260], #9
unitstats_apshotsset_exit:

cmp dword ptr [unitstats_moraleset_enable], #0
je unitstats_moraleset_exit
mov [eax+1e4], #999
unitstats_moraleset_exit:

cmp dword ptr [unitstats_statsset_enable], #0
je unitstats_statsset_exit
mov [eax+1c4], #999
mov [eax+1c8], #999
mov [eax+1cc], #1
mov [eax+1d4], #9999
mov [eax+1d8], #0
mov [eax+1e0], #0
mov [eax+1f4], #1
mov [eax+200], #99
mov [eax+204], #1
mov [eax+208], #9999
mov [eax+20c], #9999
mov [eax+210], #0
mov [eax+214], #1
mov [eax+218], #999
mov [eax+21c], #9
mov [eax+220], #1
mov [eax+224], #99
mov [eax+228], #99
mov [eax+22c], #100
mov [eax+230], #99
mov [eax+234], #99
//mov [eax+238], #9999
mov [eax+240], #9999
mov [eax+248], #9999
mov [eax+254], #9999
mov [eax+258], #9999
//mov [eax+264], #9999
//mov [eax+268], #0
mov [eax+26c], #0
mov [eax+274], #9999
mov [eax+278], #9999
mov [eax+27c], #9999
mov [eax+288], #0
mov [eax+28c], #0
mov [eax+290], #1
mov [eax+294], #1
mov [eax+298], #1
mov [eax+29c], #1
mov [eax+2a0], #1
mov [eax+2a4], #1
mov [eax+2a8], #1
mov [eax+2ac], #1
mov [eax+2b0], #1
mov [eax+2b4], #9999
mov [eax+2b8], #9999
mov [eax+3b4], #9999
mov [eax+3b8], #9999
mov [eax+3bc], #9999
mov [eax+3c0], #9999
mov [eax+3d4], #9999
mov [eax+3d8], #9999
mov [eax+3f4], #9999
mov [eax+3f8], #9999
mov [eax+414], #9999
mov [eax+418], #9999
mov [eax+434], #9999
