source = """
[ENABLE]
registersymbol(AdjustEnergyUI_basepointer)
registersymbol(AdjustEnergyUI_update_enable)
registersymbol(AdjustEnergyUI_set_enable)

alloc(AdjustEnergyUI_basepointer,4)
alloc(AdjustEnergyUI_update_enable,4)
alloc(AdjustEnergyUI_set_enable,4)


[DISABLE]
unregistersymbol(AdjustEnergyUI_basepointer)
unregistersymbol(AdjustEnergyUI_update_enable)
unregistersymbol(AdjustEnergyUI_set_enable)

dealloc(AdjustEnergyUI_basepointer)
dealloc(AdjustEnergyUI_update_enable)
dealloc(AdjustEnergyUI_set_enable)"""

[[cheat]]
id = "adjustenergyui-base-address-scan-to-activate-select-ship-energy-distribution-to-update-select-ship-energy-distribution"
name = "AdjustEnergyUI Base Address Scan (To Activate: Select Ship Energy Distribution, To Update: Select Ship Energy Distribution)"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(AdjustEnergyUI_savedAOB)
label(AdjustEnergyUI_returnhere)
label(AdjustEnergyUI_originalcode)
label(AdjustEnergyUI_exit)

label(AdjustEnergyUI_update_exit)
label(AdjustEnergyUI_set_exit)

registersymbol(AdjustEnergyUI_savedAOB)

// AdjustEnergyUI:PresentUI+423
aobscan(AdjustEnergyUI_searchedAOB,89 85 1C FF FF FF 8B 47 2C D9 40 0C)

alloc(AdjustEnergyUI_newmem,2048)


AdjustEnergyUI_newmem:
cmp dword ptr [AdjustEnergyUI_update_enable], #0
je AdjustEnergyUI_update_exit
mov [AdjustEnergyUI_basepointer], edi
AdjustEnergyUI_update_exit:

cmp dword ptr [AdjustEnergyUI_set_enable], #0
je AdjustEnergyUI_set_exit
mov byte ptr [eax+1c], #1
AdjustEnergyUI_set_exit:


AdjustEnergyUI_originalcode:
db 8B 47 2C D9 40 0C
//mov eax,[edi+2C]
//fld dword ptr [eax+0C]


AdjustEnergyUI_exit:
jmp AdjustEnergyUI_returnhere


AdjustEnergyUI_searchedAOB + 6:
AdjustEnergyUI_savedAOB:
jmp AdjustEnergyUI_newmem
nop
AdjustEnergyUI_returnhere:


[DISABLE]
AdjustEnergyUI_savedAOB:
db 8B 47 2C D9 40 0C
//mov eax,[edi+2C]
//fld dword ptr [eax+0C]

unregistersymbol(AdjustEnergyUI_savedAOB)

dealloc(AdjustEnergyUI_newmem)"""

