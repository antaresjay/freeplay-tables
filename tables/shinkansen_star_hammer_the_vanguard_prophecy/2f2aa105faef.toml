[[cheat]]
id = "shipinfo-base-address-scan-initialization-activate-this-first"
name = "ShipInfo Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(ShipInfo_basepointer)
registersymbol(ShipInfo_update_enable)
registersymbol(ShipInfo_set_enable)
registersymbol(ShipInfo_healthset_enable)
registersymbol(ShipInfo_shieldset_enable)
registersymbol(ShipInfo_powerset_enable)

alloc(ShipInfo_basepointer,4)
alloc(ShipInfo_update_enable,4)
alloc(ShipInfo_set_enable,4)
alloc(ShipInfo_healthset_enable,4)
alloc(ShipInfo_shieldset_enable,4)
alloc(ShipInfo_powerset_enable,4)


[DISABLE]
unregistersymbol(ShipInfo_basepointer)
unregistersymbol(ShipInfo_update_enable)
unregistersymbol(ShipInfo_set_enable)
unregistersymbol(ShipInfo_healthset_enable)
unregistersymbol(ShipInfo_shieldset_enable)
unregistersymbol(ShipInfo_powerset_enable)

dealloc(ShipInfo_basepointer)
dealloc(ShipInfo_update_enable)
dealloc(ShipInfo_set_enable)
dealloc(ShipInfo_healthset_enable)
dealloc(ShipInfo_shieldset_enable)
dealloc(ShipInfo_powerset_enable)"""

[[cheat]]
id = "shipinfo-base-address-scan-to-activate-battle-to-update-battle"
name = "ShipInfo Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(ShipInfo_savedAOB)
label(ShipInfo_returnhere)
label(ShipInfo_originalcode)
label(ShipInfo_exit)

label(ShipInfo_update_exit)
label(ShipInfo_set_exit)
label(ShipInfo_healthset_exit)
label(ShipInfo_shieldsset_exit)
label(ShipInfo_powerset_exit)

registersymbol(ShipInfo_savedAOB)

// Weaponinfo:<FindTarget>m__135+d
aobscan(ShipInfo_searchedAOB,8B 47 1C 8B C8 39 09 D9 40 18 D9 5D F4 D9 45 F4)

alloc(ShipInfo_newmem,2048)
alloc(ShipInfo_temp1,4)
alloc(ShipInfo_temp2,4)


ShipInfo_newmem:
mov ebx, [ShipInfo_temp1]
mov edx, [ShipInfo_temp2]

// Check AI Controlled
cmp byte ptr [edi+168], #0
jne ShipInfo_powerset_exit

cmp dword ptr [ShipInfo_update_enable], #0
je ShipInfo_update_exit
mov [ShipInfo_basepointer], edi
ShipInfo_update_exit:

cmp dword ptr [ShipInfo_set_enable], #0
je ShipInfo_set_exit
ShipInfo_set_exit:

cmp dword ptr [ShipInfo_healthset_enable], #0
je ShipInfo_healthset_exit
cmp dword ptr [edi+1c], #0
je ShipInfo_healthset_exit
mov ebx, [edi+1c]
fld [ebx+10]
fstp [ebx+18]
cmp dword ptr [edi+80], #0
je ShipInfo_healthset_exit
mov ebx, [edi+80]
fld [ebx+10]
fstp [ebx+18]
ShipInfo_healthset_exit:

cmp dword ptr [ShipInfo_shieldset_enable], #0
je ShipInfo_shieldsset_exit
cmp dword ptr [edi+94], #0
je ShipInfo_shieldsset_exit
mov ebx, [edi+94]
cmp dword ptr [ebx+3c], #0
je ShipInfo_shieldsset_exit
mov edx, [ebx+3c]
cmp dword ptr [ebx+38], #0
je ShipInfo_shieldsset_exit
mov ebx, [ebx+38]
fld [edx+10]
fstp [ebx+10]
fld [edx+14]
fstp [ebx+14]
fld [edx+18]
fstp [ebx+18]
fld [edx+1c]
fstp [ebx+1c]
fld [edx+20]
fstp [ebx+20]
fld [edx+24]
fstp [ebx+24]
ShipInfo_shieldsset_exit:

cmp dword ptr [ShipInfo_powerset_enable], #0
je ShipInfo_powerset_exit
mov [edi+144], (float)100
mov [edi+148], (float)100
mov [edi+14c], (float)3
mov [edi+15c], (float)100
mov [edi+160], (float)100
mov [edi+164], (float)3
ShipInfo_powerset_exit:

mov [ShipInfo_temp1], ebx
mov [ShipInfo_temp2], edx


ShipInfo_originalcode:
db 8B 47 1C 8B C8
//mov eax,[edi+1C]
//mov ecx,eax


ShipInfo_exit:
jmp ShipInfo_returnhere


ShipInfo_searchedAOB:
ShipInfo_savedAOB:
jmp ShipInfo_newmem
ShipInfo_returnhere:


[DISABLE]
ShipInfo_savedAOB:
db 8B 47 1C 8B C8
//mov eax,[edi+1C]
//mov ecx,eax

unregistersymbol(ShipInfo_savedAOB)

dealloc(ShipInfo_newmem)
dealloc(ShipInfo_temp1)
dealloc(ShipInfo_temp2)"""

