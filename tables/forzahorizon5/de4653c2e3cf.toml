[[cheat]]
id = "universal-rt-script-by-yeethan69-any-platform-any-version"
name = "Universal RT Script by Yeethan69 - Any platform, any version"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : ForzaHorizon5.exe
  Version: Any version, either platform
  Date   : 2022-04-27
  Author : Yeethan69

  This script enables RT, lets you change the resolution of the RT, and bounces
}

[ENABLE]
aobscanmodule(INJECT,ForzaHorizon5.exe,0F B6 08 0F B6 97 88 05 00 00)
alloc(CaveSpace,$1000,INJECT)
alloc(VarSpace,3,INJECT)

label(code)
label(return)

label(Enabled)
label(Bounces)
label(Resolution)

VarSpace:
Enabled:
db 01
Bounces:
db 0
Resolution:
db 02

CaveSpace:
code:
  push rcx

  mov rcx,[Bounces]
  mov [rax+0x2],rcx

  mov rcx,[Resolution]
  mov [rax+0x4],rcx
  pop rcx

  movzx ecx,[Enabled]
  movzx edx,byte ptr [rdi+00000588]
  jmp return

INJECT:
  jmp CaveSpace
  nop 5

INJECT+0x34:
  db 90 90 90
return:
registersymbol(INJECT)
registerSymbol(Enabled)
registerSymbol(Bounces)
registerSymbol(Resolution)

[DISABLE]
INJECT:
  db 0F B6 08 0F B6 97 88 05 00 00

INJECT+0x34:
  db 0F B6 08

unregistersymbol(INJECT)
unregistersymbol(Enabled)
unregistersymbol(Bounces)
unregistersymbol(Resolution)
dealloc(CaveSpace)
dealloc(VarSpace)"""

