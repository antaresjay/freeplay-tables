{ Game   : Anno1800.exe
  Version: 18.10094
  Date   : 2022-12-27
  Author : Xerlantis

  This script chnages the Money to maximum wherenever you by something
}

[ENABLE]

aobscanmodule(Money,Anno1800.exe,41 8B 76 08 2B F3)
