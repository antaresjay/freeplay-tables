[[cheat]]
id = "instant-acceleration"
name = "Instant Acceleration"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(get_movementAcceleration,CodeWorld-Win64-Shipping.exe,F3 0F 10 81 C0 01 00 00 C3 CC CC CC CC CC CC CC 0F)
aobscanmodule(get_movementDeceleration,CodeWorld-Win64-Shipping.exe,F3 0F 10 81 D4 01 00 00)
alloc(newmem,$1000,get_movementAcceleration)
alloc(newmem2,$1000,get_movementDeceleration)
label(return)
label(return2)

newmem:
mov r11,(float)900000
movq xmm0,r11
jmp return

newmem2:
mov r11,(float)900000
movq xmm0,r11
jmp return2

get_movementAcceleration:
  jmp newmem
  nop 3
return:
registersymbol(get_movementAcceleration)

get_movementDeceleration:
  jmp newmem2
  nop 3
return2:
registersymbol(get_movementDeceleration)

[DISABLE]
get_movementAcceleration:
  db F3 0F 10 81 C0 01 00 00

get_movementDeceleration:
  db F3 0F 10 81 D4 01 00 00

unregistersymbol(*)
dealloc(*)"""
