[[cheat]]
id = "unlimited-health"
name = "Unlimited Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//Send@Sintrix|FearlessRevolution
aobscanregion(PlayerHealthAOB,ThingAttribute:get_HP,ThingAttribute:get_HP+5e,F3 0F 10 40 48 F3 0F 5A C0 F2 0F 5A E8 F3 0F 11 6D FC)
alloc(newmem,$1000,PlayerHealthAOB)

label(code)
label(return)

newmem:
push rcx
mov rcx,[rcx+18]
mov rcx,[rcx+10]
cmp [rcx+70],1
jne code
mov [rax+48],(float)999999
pop rcx

code:
  movss xmm0,[rax+48]
  jmp return

PlayerHealthAOB:
  jmp newmem
return:
registersymbol(PlayerHealthAOB)

[DISABLE]

PlayerHealthAOB:
  db F3 0F 10 40 48
//Send@Sintrix|FearlessRevolution
unregistersymbol(*)
dealloc(*)"""

