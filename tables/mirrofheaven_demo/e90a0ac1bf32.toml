[[cheat]]
id = "player"
name = "→ Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
define(address,ThingAttribute:get_MP)
define(bytes,55 48 8B EC 48 83 EC 30)

[ENABLE]
//Send@Sintrix|FearlessRevolution
assert(address,bytes)
alloc(newmem,$1000,ThingAttribute:get_MP)
registersymbol(playerPtr)
label(code return playerPtr)

newmem:
push rdi
mov rdi,[rdi+10]
cmp [rdi+70],1
jne code
mov [playerPtr],rcx
pop rdi

code:
  push rbp
  mov rbp,rsp
  sub rsp,30
  jmp return

playerPtr:
dw

address:
  jmp newmem
  nop 3
return:

[DISABLE]

address:
  db bytes

//Send@Sintrix|FearlessRevolution
unregistersymbol(*)
dealloc(*)"""
