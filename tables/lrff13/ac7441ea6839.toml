[[cheat]]
id = "damage-modifier-script-god-mode-one-hit-kill-etc"
name = "Damage Modifier Script (God Mode, One Hit Kill, etc.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DamageModAOB,$process,8B F8 03 7D 08 F6 41 40 02) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,1024,DamageModAOB)

label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

newmem:
  mov [EAXSave],eax
  mov edi,eax
  mov eax,[ebp+08]
  cmp dword ptr [esi+1C0],FFFFFFFF
  je EnemyHit
  jmp HeroHit
HeroHit:
  cmp eax,0
  jl HeroDamageHit
  jmp MyCleanUp
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  push eax
  fild dword ptr [rsp]
  fmul dword ptr [fHeroDamageMult]
  fistp dword ptr [rsp]
  pop eax
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor eax,eax
  jmp MyCleanUp
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne MyCleanUp
  cmp eax,edi
  jl @F
  xor eax,eax
@@:
  jmp MyCleanUp 
EnemyHit:
  cmp eax,0
  jl EnemyDamageHit
  jmp MyCleanUp
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckOneHitKill
  push eax
  fild dword ptr [rsp]
  fmul dword ptr [fEnemyDamageMult]
  fistp dword ptr [rsp]
  pop eax
CheckOneHitKill:
  cmp [OneHitKill],1
  jne MyCleanUp
  mov eax,edi
  neg eax
  jmp MyCleanUp

MyCleanUp:
  mov [ebp+08],eax
  mov eax,[EAXSave]
  jmp originalcode

originalcode:
  mov edi,eax
  add edi,[ebp+08]
  jmp return

EAXSave:
dq 0
GodMode:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)0.0
fHeroDamageMult:
dq (float)0.5
HeroCannotDie:
dq 1

DamageModAOB:
  jmp newmem
return:

[DISABLE]

DamageModAOB:
  db 8B F8 03 7D 08

unregistersymbol(DamageModAOB)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fHeroDamageMult)
unregistersymbol(HeroCannotDie)

dealloc(newmem)"""

