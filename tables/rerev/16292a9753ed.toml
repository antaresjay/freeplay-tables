id = "weapon-s-properties-script"
name = "Weapon's Properties script"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(allweaponsAOB,0F B6 50 05 88 54 24 6D 0F B6 48 06 88 4C 24 6E)
label(allweaponsAOB_jmp)
registersymbol(allweaponsAOB_jmp)
aobscan(highlighetedweaponAOB,8A 46 05 8A 4E 06 57 0F BE D1 0F B6 F8 03 D7)
label(highlighetedweaponAOB_jmp)
registersymbol(highlighetedweaponAOB_jmp)

label(pHighlightedWeapon)
registersymbol(pHighlightedWeapon)
globalalloc(pAllWeapons,2048)

///
pAllWeapons:
dd 0
///

alloc(newmem2,2048) //2kb should be enough
label(returnhere2)
label(originalcode2)
label(exit2)

newmem2: //this is allocated memory, you have read,write,execute access
//place your code here
mov [pAllWeapons+edi*4],eax

originalcode2:
movzx edx,byte ptr [eax+05]
mov [esp+6D],dl

exit2:
jmp returnhere2

alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
pushfd
cmp edi,1
je originalcode
cmp ebp,0
jne originalcode
mov [pHighlightedWeapon],esi

originalcode:
popfd
mov al,[esi+05]
mov cl,[esi+06]

exit:
jmp returnhere

///
pHighlightedWeapon:
dd 0
///

allweaponsAOB: //"rerev.exe"+3EF0E3:
allweaponsAOB_jmp:
jmp newmem2
nop
nop
nop
returnhere2:

highlighetedweaponAOB: //"rerev.exe"+20BE84:
highlighetedweaponAOB_jmp:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem2)
allweaponsAOB_jmp: //"rerev.exe"+3EF0E3:
db 0F B6 50 05 88 54 24 6D
//Alt: movzx edx,byte ptr [eax+05]
//Alt: mov [esp+6D],dl
dealloc(newmem)
highlighetedweaponAOB_jmp: //"rerev.exe"+20BE84:
db 8A 46 05 8A 4E 06
//Alt: mov al,[esi+05]
//Alt: mov cl,[esi+06]
unregistersymbol(allweaponsAOB_jmp)
unregistersymbol(highlighetedweaponAOB_jmp)
unregistersymbol(pHighlightedWeapon)
dealloc(pAllWeapons)"""

