source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(mastervaluescriptAOB,D9 41 08 D9 18 B0 01 59 C2 04 00)
label(mastervaluescriptAOB_jmp)
registersymbol(mastervaluescriptAOB_jmp)

label(pHWAModifier)
registersymbol(pHWAModifier)

globalalloc(pACustParts,2048)
globalalloc(pSCustParts,2048)

///
pACustParts:
dd 0
pSCustParts:
dd 0
///

alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(originalcode)
label(exit)
label(isSpecialRaidPart)
label(check2)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
//pushfd
cmp ebp,24
jne check2
cmp edx,00000000
jne originalcode
cmp [esp+20],5
jne originalcode
cmp [esp+4c],ffffffff
jne isSpecialRaidPart
mov [pACustParts+esi*4],ecx
jmp originalcode

isSpecialRaidPart:
mov [pSCustParts+esi*4],ecx
jmp originalcode

check2:
cmp edi,a
jg originalcode
cmp edx,00000000
jne originalcode
mov [pHWAModifier+edi*4],ecx
jmp originalcode

originalcode:
//popfd
fld dword ptr [ecx+08]
fstp dword ptr [eax]

exit:
jmp returnhere

///
pHWAModifier: //Highlighted Weapon's Applied Modifier
dd 0
///

mastervaluescriptAOB: //"rerev.exe"+2F4BD3:
mastervaluescriptAOB_jmp:
jmp newmem
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
mastervaluescriptAOB_jmp: //"rerev.exe"+2F4BD3:
db D9 41 08 D9 18
//Alt: fld dword ptr [ecx+08]
//Alt: fstp dword ptr [eax]
dealloc(pACustParts)
dealloc(pSCustParts)
unregistersymbol(pHWAModifier)
unregistersymbol(mastervaluescriptAOB_jmp)"""

