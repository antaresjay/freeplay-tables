[[cheat]]
id = "player-coord-write"
name = "* player coord write"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanmodule(playerCoordWriteOnMoveAOB,Rapture_Release.exe,8B 02 89 81 A8 00 00 00 ** ** ** ** ** ** ** ** ** ** ** ** ** ** ** ** ** ** ** ** ** ** ** ** 83)
registersymbol(playerCoordWriteOnMoveAOB)

label(bFlyMode)
registersymbol(bFlyMode)

alloc(newmem,2048,playerCoordWriteOnMoveAOB) //"Rapture_Release.exe"+C6646E)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
cmp byte ptr [bFlyMode],1
je @f
jmp originalcode

@@:
//freeze coord
mov eax,[rcx+a8]
mov [rdx],eax
mov eax,[rcx+ac]
mov [rdx+4],eax
mov eax,[rcx+b0]
mov [rdx+8],eax

//store registers
push r8
push r9

//do y
//get y direction
mov r8,[pMovementInfo]
test r8,r8
jz @f
movss xmm4,[r8+334]
shufps xmm4,xmm4,c0 //broadcast to all but most sigificant

//apply speed
mov eax,(float)0.25
movd xmm3,eax
shufps xmm3,xmm3,00 //broadcast
mulps xmm4,xmm3

//apply vector
mov r9,[pSomeCamInfo1]
test r9,r9
jz @f
mulps xmm4,[r9+118]

//update new coord
movups xmm3,[rdx]
addps xmm4,xmm3
movups [rdx],xmm4

//do x
//get x direction
movss xmm4,[r8+330]
shufps xmm4,xmm4,e0 //copy to 2nd

//apply speed
mov eax,(float)0.25
movd xmm3,eax
shufps xmm3,xmm3,e0 //copy to 2nd
mulps xmm4,xmm3

//apply vector
mov r9,vx
test r9,r9
jz @f
movups xmm3,[vx]
//shufps xmm3,xmm3,e1 //swap least and 2nd
mulps xmm4,xmm3

//update new coord
movups xmm3,[rdx]
addps xmm4,xmm3
movups [rdx],xmm4

@@:
//update highest z
mov r8,[pHighestZ]
test r8,r8
jz @f
//mov r9d,(float)1
//movd xmm4,r9d
//addss xmm4,[rdx+8]
movss xmm4,[rdx+8]
movss [r8],xmm4

@@:
//restore registers, reset xmms
//end
pop r9
pop r8
xorps xmm3,xmm3
xorps xmm4,xmm4

originalcode:
mov eax,[rdx]
mov [rcx+000000A8],eax

exit:
jmp returnhere

///
bFlyMode:
dd 1
///

playerCoordWriteOnMoveAOB: //"Rapture_Release.exe"+C6646E:
jmp newmem
nop
nop
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
playerCoordWriteOnMoveAOB: //"Rapture_Release.exe"+C6646E:
db 8B 02 89 81 A8 00 00 00
//Alt: mov eax,[rdx]
//Alt: mov [rcx+000000A8],eax
unregistersymbol(playerCoordWriteOnMoveAOB)

unregistersymbol(bFlyMode)"""

