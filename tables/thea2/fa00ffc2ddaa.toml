[[cheat]]
id = "character-editor-change-name-of-any-character-before-activation"
name = "Character Editor (change name of any character before activation)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
//Thea2.Common:NOCSUpdateEntityInfo:Activate+c0 - 48 8B 47 20           - mov rax,[rdi+20]
//Thea2.Common:NOCSUpdateEntityInfo:Activate+c4 - 49 89 46 38           - mov [r14+38],rax
//Thea2.Common:NOCSUpdateEntityInfo:Activate+c8 - 48 8B 4F 28           - mov rcx,[rdi+28]

aobscanregion(editor,Thea2.Common:NOCSUpdateEntityInfo:Activate,Thea2.Common:NOCSUpdateEntityInfo:Activate+1FF,49 89 46 38 48 8B 4F 28)
registersymbol(editor)
alloc(_editor,1024,editor)
registersymbol(_editor)
label(return_editor)
alloc(characterptr,8,editor)
registersymbol(characterptr)

_editor:
 mov [characterptr],r14
 db 49 89 46 38 48 8B 4F 28
 jmp return_editor

editor:
 jmp _editor
 db 90 90 90
 return_editor:

 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
editor:
 db 49 89 46 38 48 8B 4F 28


dealloc(_editor)
unregistersymbol(_editor)
dealloc(characterptr)
unregistersymbol(characterptr)
unregistersymbol(editor)"""

