[[cheat]]
id = "massive-challenge-action-points"
name = "Massive Challenge Action Points"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
//Thea2.Common:NetBattlefield:AdvanceBFToNextTurn+1f6 - 83 38 00              - cmp dword ptr [rax],00 { 0 }
//Thea2.Common:NetBattlefield:AdvanceBFToNextTurn+1f9 - 89 48 44              - mov [rax+44],ecx
//Thea2.Common:NetBattlefield:AdvanceBFToNextTurn+1fc - 41 FF C6              - inc r14d


aobscanregion(apcheat,Thea2.Common:NetBattlefield:AdvanceBFToNextTurn,Thea2.Common:NetBattlefield:AdvanceBFToNextTurn+2FF,83 ?? 00 ?? ?? 44 41 FF)
registersymbol(apcheat)
alloc(_apcheat,1024,Thea2.Common:NetBattlefield:AdvanceBFToNextTurn)
label(return_apcheat)
alloc(apcheat_bckp,8,Thea2.Common:NetBattlefield:AdvanceBFToNextTurn)
registersymbol(apcheat_bckp)

apcheat_bckp:
 readmem(apcheat,6)

//should work with future patches
//while offset still `44` and next opcode is `inc`
_apcheat:
 readmem(apcheat,3)
 push ecx
 mov ecx,(int)999 //sets action points to 999 on every turn
 readmem(apcheat+3,1)
 db 48
 readmem(apcheat+5,1)
 pop ecx
 jmp return_apcheat

apcheat:
 jmp _apcheat
 nop
 return_apcheat:
 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
apcheat:
 readmem(apcheat_bckp,6)

dealloc(apcheat)
dealloc(apcheat_bckp)
unregistersymbol(apcheat)
unregistersymbol(apcheat_bckp)"""

