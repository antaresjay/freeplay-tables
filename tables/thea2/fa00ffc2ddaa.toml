[[cheat]]
id = "free-trait-card-unlocks-no-traits-cost-limit-free-gods"
name = "Free Trait Card Unlocks + No Traits Cost Limit + Free Gods"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
//Thea2.Client:AssignGodPoints:TraitCardItem+64d - 40 0F9C C1            - setl cl
//<TraitCardItem>c__AnonStorey5:<>m__0+47 - 2B CA                 - sub ecx,edx
//Thea2.Client:AssignGodPoints:UpdateGrids+be0 - 03 CA                 - add ecx,edx
//Thea2.Client:SelectGod:UpdateButtonsAndGraphic+524 - 40 0F9F C0            - setg al
//Thea2.Client:SelectGod:<OnStart>m__0+2c - 48 8D 0C 49           - lea rcx,[rcx+rcx*2]
//Thea2.Client:SelectGod:<OnStart>m__0+5d - 2B CA                 - sub ecx,edx

aobscanregion(ignore_reqs,Thea2.Client:AssignGodPoints:TraitCardItem,Thea2.Client:AssignGodPoints:TraitCardItem+FFF,40 0F 9C C1)
registersymbol(ignore_reqs)
aobscanregion(no_gp_sub,<TraitCardItem>c__AnonStorey4:<>m__0,<TraitCardItem>c__AnonStorey4:<>m__0+FF,2B CA 89 48 6C)
registersymbol(no_gp_sub)
aobscanregion(ignore_cost,Thea2.Client:AssignGodPoints:UpdateGrids,Thea2.Client:AssignGodPoints:UpdateGrids+FFF,03 CA 89 88 38 01 00 00)
registersymbol(ignore_cost)
aobscanregion(ignore_god_reqs,Thea2.Client:SelectGod:UpdateButtonsAndGraphic,Thea2.Client:SelectGod:UpdateButtonsAndGraphic+FFF,40 0F 9F C0)
registersymbol(ignore_god_reqs)
aobscanregion(ignore_god_cost,Thea2.Client:SelectGod:<OnStart>m__0,Thea2.Client:SelectGod:<OnStart>m__0+FF,48 8D 0C 49 3B C1)
registersymbol(ignore_god_cost)
aobscanregion(no_god_gp_sub,Thea2.Client:SelectGod:<OnStart>m__0,Thea2.Client:SelectGod:<OnStart>m__0+FF,2B CA 89 48 6C)
registersymbol(no_god_gp_sub)

ignore_reqs:
 xor ecx,ecx
 nop
 nop

no_gp_sub:
 db 90 90

ignore_cost:
 xor ecx,ecx

ignore_god_reqs:
 xor eax,eax
 nop
 nop

ignore_god_cost:
 xor ecx,ecx
 nop
 nop

no_god_gp_sub:
 db 90 90
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
ignore_reqs:
 db 40 0F 9C C1 // setl cl

no_gp_sub:
 db 2B CA       // sub ecx,edx

ignore_cost:
 db 03 CA       // add ecx,edx

ignore_god_reqs:
 db 40 0F 9F C0 // setg al

ignore_god_cost:
 db 48 8D 0C 49 // lea rcx,[rcx+rcx*2]

no_god_gp_sub:
 db 2B CA       // sub ecx,edx

unregistersymbol(ignore_reqs)
unregistersymbol(no_gp_sub)
unregistersymbol(ignore_cost)
unregistersymbol(ignore_god_reqs)
unregistersymbol(ignore_god_cost)
unregistersymbol(no_god_gp_sub)"""

[[cheat]]
id = "infinite-movement-points-no-owner-check"
name = "Infinite Movement Points (no owner check)"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
//Thea2.Server:Group:TryEnter+231 - 48 63 8D 38FFFFFF     - movsxd  rcx,dword ptr [rbp-000000C8]
//Thea2.Server:Group:TryEnter+238 - 89 08                 - mov [rax],ecx

//Thea2.Server:Group:TryEnter+289 - 48 63 8D 48FFFFFF     - movsxd  rcx,dword ptr [rbp-000000B8]
//Thea2.Server:Group:TryEnter+290 - 89 08                 - mov [rax],ecx

//Thea2.Server:Character:SetCurentMP+a3 - 48 63 4D C8           - movsxd  rcx,dword ptr [rbp-38]

aobscanregion(mp1,Thea2.Server:Group:TryEnter,Thea2.Server:Group:TryEnter+FFF,48 63 8D 38 FF FF FF 89 08)
registersymbol(mp1)
aobscanregion(mp2,Thea2.Server:Group:TryEnter,Thea2.Server:Group:TryEnter+FFF,48 63 8D 48 FF FF FF 89 08)
registersymbol(mp2)
aobscanregion(mp3,Thea2.Server:Character:SetCurentMP,Thea2.Server:Character:SetCurentMP+FF,48 63 4D C8 89 08)
registersymbol(mp3)
alloc(_max_mp,1024,mp3)
registersymbol(_max_mp)
label(return_max_mp)

_max_mp:
 mov rcx,[rdi+8C]
 mov [rax],rcx
 jmp return_max_mp


mp1+7:
 db 90 90

mp2+7:
 db 90 90

mp3:
 jmp _max_mp
 nop
 return_max_mp:
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
mp1+7:
 db 89 08

mp2+7:
 db 89 08

mp3:
 db 48 63 4D C8 89 08

dealloc(_max_mp)
unregistersymbol(_max_mp)
unregistersymbol(mp1)
unregistersymbol(mp2)
unregistersymbol(mp3)"""

