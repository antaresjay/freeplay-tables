[[cheat]]
id = "perfect-morale"
name = "Perfect Morale"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
//Thea2.Server:Group:UpdateQoL+3db - 4C 63 95 48FFFFFF     - movsxd  r10,dword ptr [rbp-000000B8]
//Thea2.Server:Group:UpdateQoL+3e2 - 44 89 14 24           - mov [rsp],r10d
aobscanregion(morale,Thea2.Server:Group:UpdateQoL,Thea2.Server:Group:UpdateQoL+FFF,4C 63 95 ?? FF FF FF 44 89 14 24)
registersymbol(morale)

alloc(_morale,1024,Thea2.Server:Group:UpdateQoL)
registersymbol(_morale)
label(return_morale)

_morale:
 readmem(morale,7)
 xor r10,r10
 mov r10d,#2000
 jmp return_morale

morale:
 jmp _morale
 db 90 90
 return_morale:
 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
morale:
 readmem(_morale,7)

dealloc(_morale)
unregistersymbol(_morale)
unregistersymbol(morale)"""

