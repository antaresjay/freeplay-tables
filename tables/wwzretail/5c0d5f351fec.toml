source = """
{ Game   : World War Z | wwzRetail.exe
  Version: Windows Store | Version: 1.0.10.0
  Date   : 2020-09-06
  Author : SovietWristwatch.jpg
}

[ENABLE]
aobscanmodule(godmode,wwz_server_dllRetail.dll,F3 0F 10 42 08 F3 0F 11 41)
alloc(newmem,$1000,godmode)

label(code)
label(return)

newmem:
  cmp [rdx+28],(float)100
  jne code
  cmp [rdx+08+40],(float)200
  je god
  cmp [rdx+08+40],(float)35 // insane difficulty
  je god
  cmp [rdx+08+40],(float)15 // extreme difficulty
  je god
  cmp [rdx+08+40],(float)60 // horde normal difficulty
  je god
  jmp code

god:
  mov [rdx+08],(float)200

code:
  movss xmm0,[rdx+08]
  jmp return

godmode:
  jmp newmem
return:
registersymbol(godmode)

[DISABLE]
godmode:
  db F3 0F 10 42 08

unregistersymbol(godmode)
dealloc(newmem)

