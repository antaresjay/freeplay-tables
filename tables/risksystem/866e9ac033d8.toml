[[cheat]]
id = "enable"
name = "enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanmodule(someDoubleReadAOB,RiskSystem.exe,F2 0F 10 17 33 D2 F2 0F 5C 16)
registersymbol(someDoubleReadAOB)

///
aobscanmodule(breakerBarReadCallerAOB,RiskSystem.exe,89 C3 B8 ** ** ** ** 03 84 24 ** ** 00 00 A9 ** ** ** ** 75 0F 8D ** ** ** ** 00 00 89 04 24 E8 ** ** ** ** 85 DB 78)
registersymbol(breakerBarReadCallerAOB)
///

label(pBreaker)
registersymbol(pBreaker)
label(bMaxBreaker)
registersymbol(bMaxBreaker)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
cmp [esp+10],breakerBarReadCallerAOB
jne @f
mov [pBreaker],edi
cmp byte ptr [bMaxBreaker],1
jne @f
movsd xmm2,[dMaxBreaker]
movsd [edi],xmm2

originalcode:
movsd xmm2,[edi]
xor edx,edx

exit:
jmp returnhere

///
pBreaker:
dd 0
bMaxBreaker:
dd 0
dMaxBreaker:
dq (double)6000
///

someDoubleReadAOB: //"RiskSystem.exe"+D646C5:
jmp newmem
nop
returnhere:

///********************************///
aobscanmodule(someDoubleRead2AOB,RiskSystem.exe,F2 0F 10 07 B0 01 5F 5E 5D F2 0F 11 03 5B 83 ** ** C3)
registersymbol(someDoubleRead2AOB)

///
aobscanmodule(healthBarReadCallerAOB,RiskSystem.exe,E8 ** ** ** ** A1 ** ** ** ** 89 84 24 ** ** 00 00 A1 ** ** ** ** 89 84 24 ** ** 00 00)
registersymbol(healthBarReadCallerAOB)
///

label(pHealth)
registersymbol(pHealth)
label(bMaxHealth)
registersymbol(bMaxHealth)
label(dMinHealth)
registersymbol(dMinHealth)

alloc(newmem2,2048)
label(returnhere2)
label(originalcode2)
label(exit2)

newmem2: //this is allocated memory, you have read,write,execute access
//place your code here
mov esi,healthBarReadCallerAOB
lea esi,[esi+5]
cmp [esp+2c],esi
jne @f
mov [pHealth],edi
cmp byte ptr [bMaxHealth],1
jne @f
movsd xmm0,[dMinHealth]
maxsd xmm0,[edi]
movsd [edi],xmm0

originalcode2:
movsd xmm0,[edi]
mov al,01

exit2:
jmp returnhere2

///
pHealth:
dd 0
bMaxHealth:
dd 0
dMinHealth:
dq (double)27
///

someDoubleRead2AOB: //"RiskSystem.exe"+D66083:
jmp newmem2
nop
returnhere2:

///********************************///


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
someDoubleReadAOB: //"RiskSystem.exe"+D646C5:
db F2 0F 10 17 33 D2
//Alt: movsd xmm2,[edi]
//Alt: xor edx,edx

unregistersymbol(pBreaker)
unregistersymbol(bMaxBreaker)

///********************************///
dealloc(newmem2)
someDoubleRead2AOB: //"RiskSystem.exe"+D66083:
db F2 0F 10 07 B0 01
//Alt: movsd xmm0,[edi]
//Alt: mov al,01

unregistersymbol(pHealth)
unregistersymbol(bMaxHealth)
unregistersymbol(dMinHealth)

///********************************///"""

