[[cheat]]
id = "enable-achievement-unlocker"
name = "Enable Achievement Unlocker"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : TLKOE.exe
  Version: 1.0.1.0 | Windows Store
  Date   : 2022-02-09
  Author : SvT
}

[ENABLE]
MonsterStoppingJuice.OnEffectEnter+1A6:
db 90 90 // disable "jl" jmp after cmp "goal"

_unlockerActive: // set flag to give unlimited grenades
dq 1

[DISABLE]

MonsterStoppingJuice.OnEffectEnter+1A6:
db 7C 0F

_unlockerActive:
dq 0"""

