[[cheat]]
id = "easy-block-break"
name = "Easy Block Break"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(easybreak, PUZZLE.BLOCK.Block:TakeDamage+0, PUZZLE.BLOCK.Block:TakeDamage+140, F3 0F 10 86 9C 00 00 00 F3 0F 5A C0 F3 0F 10 8E A4 00 00 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov [rsi+9C], (float)0.0
code:
  movss xmm0,[rsi+0000009C]
  cvtss2sd xmm0,xmm0
  movss xmm1,[rsi+000000A4]
  jmp return

easybreak:
  jmp far newmem
  nop
  nop
  nop
  nop
  nop
  nop
return:
registersymbol(easybreak)

[DISABLE]

easybreak:
  db F3 0F 10 86 9C 00 00 00 F3 0F 5A C0 F3 0F 10 8E A4 00 00 00

unregistersymbol(easybreak)
dealloc(newmem)"""
