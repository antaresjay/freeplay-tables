[[cheat]]
id = "player-stats-ctrl-numpad-1-use-light-attacks-on-an-enemy-to-populate-values"
name = "Player Stats (Ctrl + Numpad 1) {Use 'Light Attacks' on an enemy to populate values}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Ra Ra BOOM.exe
// Author            : ndck76
// Executable Version: 6000.0.48.3365
// Game Version      : Build.19574447
// Script Date       : 2025-08-17


[ENABLE]

aobscanregion(lightattacks,Game.Play.Entities.PlayerStats:RecordAction,Game.Play.Entities.PlayerStats:RecordAction+100,4863xxxx8Dxxxx89xxxxE9xxxxxxxx48xxxxxx8Dxxxx89xxxxE9xxxxxxxx48xxxxxx8Dxxxx89xxxxEBxx) //Game.Play.Entities.PlayerStats:RecordAction+4d
alloc(newmem,$1000,lightattacks)
alloc(data2,8)
alloc(lightattacksbkp,7)
registersymbol(data2)
registersymbol(lightattacks)
registersymbol(lightattacksbkp)
label(code)
label(return)

lightattacksbkp:
  readmem(lightattacks,7)

newmem:
  mov [data2],rsi

code:
  readmem(lightattacks,7)
  jmp return

lightattacks:
  jmp newmem
  nop 2
return:

[DISABLE]

lightattacks:
  readmem(lightattacksbkp,7)

unregistersymbol(*)
dealloc(*)"""

