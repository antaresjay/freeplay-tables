source = """
[ENABLE]


aobscanmodule(popularitycd,_start.exe,D9 80 94 59 5D 4B D9 5E 20)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  push esi
  lea esi,[eax+_start.exe+4B1D5994]
  mov [esi], 3F800000
  mov [esi+04], 40A00000
  mov [esi+08], 0
  pop esi
  fld dword ptr [eax+_start.exe+4B1D5994]
  jmp return

popularitycd:
  jmp newmem
  nop
return:
registersymbol(popularitycd)

[DISABLE]

popularitycd:
  db D9 80 94 59 5D 4B

unregistersymbol(popularitycd)
dealloc(newmem)"""
