{ Game   : Teleglitch.exe
  Version: 
  Date   : 2015-10-02
  Author : Jason

  Changing the inventory quantity seems to crash the game.  Stupid shit...
}

[ENABLE]

globalalloc(globals,$100000)

aobscanmodule(T_DropInventory1,teleglitch.exe,8B 55 FC 89 4A 04 EB 11 8B 45 F0) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov edx,[ebp-04]
  //sub edx,0060
  mov [globals+100C],edx // inventory pointer

  mov edx,[ebp-04]
  mov [edx+04],ecx
  jmp return

T_DropInventory1:
  jmp code
  nop
return:
registersymbol(T_DropInventory1)

[DISABLE]

T_DropInventory1:
  db 8B 55 FC 89 4A 04

unregistersymbol(T_DropInventory1)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: "teleglitch.exe"+131F7

"teleglitch.exe"+131DA: 83 C4 04              -  add esp,04
"teleglitch.exe"+131DD: 8B 4D EC              -  mov ecx,[ebp-14]
"teleglitch.exe"+131E0: 89 08                 -  mov [eax],ecx
"teleglitch.exe"+131E2: 8B 55 E8              -  mov edx,[ebp-18]
"teleglitch.exe"+131E5: 52                    -  push edx
"teleglitch.exe"+131E6: 8B 4D FC              -  mov ecx,[ebp-04]
"teleglitch.exe"+131E9: E8 D2 84 FF FF        -  call teleglitch.exe+B6C0
"teleglitch.exe"+131EE: 8B 45 FC              -  mov eax,[ebp-04]
"teleglitch.exe"+131F1: 8B 48 04              -  mov ecx,[eax+04]
"teleglitch.exe"+131F4: 83 E9 01              -  sub ecx,01                     // subtract 1 from amount in inventory
// ---------- INJECTING HERE ----------
"teleglitch.exe"+131F7: 8B 55 FC              -  mov edx,[ebp-04]
"teleglitch.exe"+131FA: 89 4A 04              -  mov [edx+04],ecx               // save new amount
// ---------- DONE INJECTING  ----------
"teleglitch.exe"+131FD: EB 11                 -  jmp teleglitch.exe+13210
"teleglitch.exe"+131FF: 8B 45 F0              -  mov eax,[ebp-10]
"teleglitch.exe"+13202: 50                    -  push eax
"teleglitch.exe"+13203: E8 58 F1 FE FF        -  call teleglitch.exe+2360
"teleglitch.exe"+13208: 83 C4 04              -  add esp,04
"teleglitch.exe"+1320B: 8B 08                 -  mov ecx,[eax]
"teleglitch.exe"+1320D: 89 4D F0              -  mov [ebp-10],ecx
"teleglitch.exe"+13210: E9 6C FF FF FF        -  jmp teleglitch.exe+13181
"teleglitch.exe"+13215: 83 C4 18              -  add esp,18
"teleglitch.exe"+13218: 3B EC                 -  cmp ebp,esp
}"""

