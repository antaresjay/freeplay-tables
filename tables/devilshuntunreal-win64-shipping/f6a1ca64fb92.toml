[[cheat]]
id = "godmode"
name = "Godmode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : DevilsHuntUnreal-Win64-Shipping.exe
  Version: 
  Date   : 2019-09-18
  Author : Anjinggila

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(INJECT,DevilsHuntUnreal-Win64-Shipping.exe,F3 0F 11 49 08 C3 CC) // should be unique
alloc(newmem,$1000,"DevilsHuntUnreal-Win64-Shipping.exe"+35E110)

label(code)
label(return)
label(enemyHp)

newmem:
  cmp [rcx+4C],(float)49
  jne ohk
  mov [rcx+08],(float)99
  jmp return

  ohk:
  cmp [rcx+48],(float)50
  je weakenemy
  cmp [rcx+48],(float)999
  je weakenemy
  jmp code

weakenemy:
  cmp [enemyHp],01
  jne code
  mov [rcx+08],(float)0
  jmp return

code:
  movss [rcx+08],xmm1
  jmp return

enemyHp:
dd 0

INJECT:
  jmp newmem
return:
registersymbol(enemyHp)
registersymbol(INJECT)

[DISABLE]

INJECT:
  db F3 0F 11 49 08

unregistersymbol(INJECT)
dealloc(newmem)"""

