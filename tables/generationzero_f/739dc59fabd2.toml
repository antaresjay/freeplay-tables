[[cheat]]
id = "maxed-regions-ctrl-f1"
name = "MAXED REGIONS - CTRL+F1"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(MAXEDREGIONS,GenerationZero_F.exe,89 57 04 85 ED)
alloc(newmem,$1000,MAXEDREGIONS)

label(code)
label(return)

newmem:

code:
  mov [rdi+04],9611
  test ebp,ebp
  jmp return

MAXEDREGIONS:
  jmp newmem
return:
registersymbol(MAXEDREGIONS)

[DISABLE]

MAXEDREGIONS:
  db 89 57 04 85 ED

unregistersymbol(MAXEDREGIONS)
dealloc(newmem)"""

