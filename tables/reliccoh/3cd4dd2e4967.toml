[[cheat]]
id = "freeze-resource-and-support"
name = "Freeze Resource and Support"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(MonResource,2048)

//=========================================
// Declaration section
label(_BackMR)
label(_ExitMR)
label(_MonR0)
label(_MonR1)
label(_MonFarm)
label(pPlayer)
label(fMinRes)

registersymbol(pPlayer)
registersymbol(fMinRes)

//=========================================
// Hacking Points
"RelicCOH.exe"+4C1644:
 jmp MonResource
 nop
_BackMR:

//=========================================
MonResource:
 push eax

 mov ecx,[ecx+0000083c]       // Get ptr to player  (Original code)
 or ecx,ecx                   // Null?
 jz _ExitMR                   // Jump if true

 mov [pPlayer],ecx            // Save ptr for debugging

 //cmp dword ptr [iEnableMR],0
 //je _ExitMR                   // Jump if feature is disabled

 mov eax,[fMinRes]            // Get minimum resource value

 cmp eax,[ecx+00000214]       // Manpower >= minimum ?
 jle _MonR0                   // Jump if true
 mov [ecx+00000214],eax       // Update Manpower

_MonR0:
 cmp eax,[ecx+00000218]       // Munitions >= minimum?
 jle _MonR1                   // Jump if true
 mov [ecx+00000218],eax       // Update Munitions

_MonR1:
 cmp eax,[ecx+0000021c]       // Fuel >= minimum ?
 jle _MonFarm                 // Jump if true
 mov [ecx+0000021c],eax       // Update Fuel

 _MonFarm:
 mov [ecx+0000049c],00000000  // Farm set to 0

_ExitMR:
 pop eax
 jmp _BackMR                  // Back to main code

//=========================================
// Variables
pPlayer:
 dd 0
fMinRes:
 dd (float)5000.0

//=========================================
// Original Codes
[DISABLE]
"RelicCOH.exe"+4C1644:
 mov ecx,[ecx+0000083C]

dealloc(MonResource)
unregistersymbol(pPlayer)
unregistersymbol(fMinRes)"""

