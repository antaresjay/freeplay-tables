[[cheat]]
id = "partial-map-hack"
name = "Partial Map Hack"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(maphack,2048) //2kb should be enough
//=========================================
// Declaration section
label(rmaphack)

//=========================================
// Hacking Points
"WW2Mod.dll"+2225A8:
nop
nop

"WW2Mod.dll"+2198AF:
jmp maphack
nop
nop
rmaphack:

maphack: //this is allocated memory, you have read,write,execute access
//=========================================
or [ecx+eax*4],0000003B
mov edx,[ecx+eax*4]
mov [esp+0C],edx
jmp rmaphack

[DISABLE]
"WW2Mod.dll"+2225A8: //Always crash when i hook there
and [ecx],ebp

"WW2Mod.dll"+2198AF: //MapHack2
mov edx,[ecx+eax*4]
mov [esp+0C],edx
//Alt: db 8B 14 81 89 54 24 0C


dealloc(maphack)"""

