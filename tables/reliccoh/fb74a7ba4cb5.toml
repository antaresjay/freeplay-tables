[[cheat]]
id = "activate"
name = "Activate"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(player,2048)
registersymbol(player)
alloc(minimum_resource_modifier,2048)
registersymbol(minimum_resource_modifier)

player:
dd 0

minimum_resource_modifier:
db 0

aobscanmodule(Activate,WW2Mod.dll,8B 00 56 57 8B F1 8B 7E 04)
registersymbol(Activate)
aobscanmodule(AddResource,WW2Mod.dll,* * * * * * 83 EC 78 83 7D 08 02)
registersymbol(AddResource)
aobscanmodule(UserInterface,UserInterface.dll,* * * 83 EC 0C * * 0F 84 A8 00 00 00) //Located at UserInterface+67
registersymbol(UserInterface)
aobscanmodule(AttackModifier,WW2Mod.dll,* * * * * * * * * * * * * * 64 89 25 00 00 00 00 81 EC 04 02 00 00)
registersymbol(AttackModifier)
aobscanmodule(CaptureRateModifier,WW2Mod.dll,8B 47 10 83 EC 1C)
registersymbol(CaptureRateModifier)
aobscanmodule(VehiclePerformanceModifier,SimEngine.dll,* * * * * * 83 EC 18 8B 81 88 00 00 00)
registersymbol(VehiclePerformanceModifier)
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
label(manpower)
label(fuel)
label(munitions)
label(XP)
label(command_points)
label(unknown_resource)
label(resource_add)

newmem: //this is allocated memory, you have read,write,execute access
push eax
push ecx
push edx
push edi
mov [player],eax
cmp byte ptr [minimum_resource_modifier],0
je originalcode
test eax,eax
je originalcode
mov edi,[eax]
test edi,edi
je originalcode
sub esp,100
jmp manpower

manpower:
mov [esp],0
mov ecx,[minimum_resource_modifier+4]
cmp [edi+00000264],ecx
jge fuel
fld dword ptr [minimum_resource_modifier+4]
fsub dword ptr [edi+00000264]
fstp dword ptr [esp]
jmp fuel

fuel:
mov [esp+04],0
mov ecx,[minimum_resource_modifier+8]
cmp [edi+00000268],ecx
jge munitions
fld dword ptr [minimum_resource_modifier+8]
fsub dword ptr [edi+00000268]
fstp dword ptr [esp+04]
jmp munitions

munitions:
mov [esp+08],0
mov ecx,[minimum_resource_modifier+C]
cmp [edi+0000026C],ecx
jge XP
fld dword ptr [minimum_resource_modifier+C]
fsub dword ptr [edi+0000026C]
fstp dword ptr [esp+08]
jmp XP

XP:
mov [esp+0C],0
mov ecx,[minimum_resource_modifier+10]
cmp [edi+00000270],ecx
jge command_points
fld dword ptr [minimum_resource_modifier+10]
fsub dword ptr [edi+00000270]
fstp dword ptr [esp+0C]
jmp command_points

command_points:
mov [esp+10],0
mov ecx,[minimum_resource_modifier+14]
cmp [edi+00000274],ecx
jge unknown_resource
fld dword ptr [minimum_resource_modifier+14]
fsub dword ptr [edi+00000274]
fstp dword ptr [esp+10]
jmp unknown_resource

unknown_resource:
mov [esp+14],0
mov ecx,[minimum_resource_modifier+18]
cmp [edi+00000278],ecx
jge resource_add
fld dword ptr [minimum_resource_modifier+18]
fsub dword ptr [edi+00000278]
fstp dword ptr [esp+14]
jmp resource_add

resource_add:
lea eax,[esp]
push 2
call AddResource //"WW2Mod.dll"+2653F0
add esp,100
jmp originalcode

originalcode:
pop edi
pop edx
pop ecx
pop eax
mov eax,[eax]
push esi
push edi
mov esi,ecx

exit:
jmp returnhere

Activate: //"WW2Mod.dll"+1CDC66:
jmp newmem
nop
returnhere:

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(player)
unregistersymbol(player)
dealloc(minimum_resource_modifier)
unregistersymbol(minimum_resource_modifier)

unregistersymbol(Activate)
unregistersymbol(AddResource)
unregistersymbol(UserInterface)
unregistersymbol(AttackModifier)
unregistersymbol(CaptureRateModifier)
unregistersymbol(VehiclePerformanceModifier)
dealloc(newmem)
Activate: //"WW2Mod.dll"+1CDC66:
//mov eax,[eax]
//push esi
//push edi
//mov esi,ecx
db 8B 00 56 57 8B F1"""

