[[cheat]]
id = "charcontrol-base-address-scan-initialization-activate-this-first"
name = "CharControl Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

registersymbol(CharControl_basepointer)
registersymbol(CharControl_update_enable)
registersymbol(CharControl_set_enable)

alloc(CharControl_basepointer,4)
alloc(CharControl_update_enable,4)
alloc(CharControl_set_enable,4)


[DISABLE]

unregistersymbol(CharControl_basepointer)
unregistersymbol(CharControl_update_enable)
unregistersymbol(CharControl_set_enable)

dealloc(CharControl_basepointer)
dealloc(CharControl_update_enable)
dealloc(CharControl_set_enable)"""

[[cheat]]
id = "charcontrol-base-address-scan-to-activate-play-level-to-update-play-level"
name = "CharControl Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(CharControl_savedAOB)
label(CharControl_returnhere)
label(CharControl_originalcode)
label(CharControl_exit)

label(CharControl_update_exit)
label(CharControl_set_exit)

registersymbol(CharControl_savedAOB)

aobscan(CharControl_searchedAOB,0F B6 43 6C 85 C0 75 0C)

alloc(CharControl_newmem,2048) //2kb should be enough


CharControl_newmem:
// Check player-controlled
cmp byte ptr [ebx+6e], #0
je CharControl_update_exit

cmp dword ptr [CharControl_update_enable], #0
je CharControl_update_exit
mov [CharControl_basepointer], ebx
CharControl_update_exit:

cmp dword ptr [CharControl_set_enable], #0
je CharControl_set_exit
mov [ebx+fc], (float)15
CharControl_set_exit:


CharControl_originalcode:
db 0F B6 43 6C 85 C0
//movzx eax,byte ptr [ebx+6C]
//test eax,eax


CharControl_exit:
jmp CharControl_returnhere


CharControl_searchedAOB:
CharControl_savedAOB:
jmp CharControl_newmem
nop
CharControl_returnhere:


[DISABLE]
CharControl_savedAOB:
db 0F B6 43 6C 85 C0
//movzx eax,byte ptr [ebx+6C]
//test eax,eax

unregistersymbol(CharControl_savedAOB)

dealloc(CharControl_newmem)"""

