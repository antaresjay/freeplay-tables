[[cheat]]
id = "troop-health"
name = "Troop Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,$100)

label(code)
label(return)

newmem:
  cmp [hamesaDosts],00
  je code
  push edi
  push ebx
  push eax
  mov eax,[ecx+39C]
  xor ebx,ebx
looper:
  lea edi,[hamesaDosts]
  mov edi,[edi+ebx*4]
  test edi,edi
  je end
  mov edi,[edi]
  test edi,edi
  je end
  cmp eax,[edi+84]
  jne @f
  fld dword ptr [ecx+00000390]
  fstp dword ptr [ecx+0000038C]
  jmp end
  @@:
  inc ebx
  cmp ebx,[counter]
  jl looper
end:
  pop eax
  pop ebx
  pop edi
code:
  fld dword ptr [ecx+0000038C]
  jmp return

troopsHealth+01:
  jmp newmem
  nop
return:


