[[cheat]]
id = "teleport-to-mouse-position"
name = "Teleport To Mouse Position"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(teleportSelectedTroop,StrongholdBase.dll,8B 08 89 4D E8 8B) // should be unique
alloc(newmem,$100)
registersymbol(teleportSelectedTroop condTele)
label(code condTele)
label(return)
aobscanmodule(getMousePosition,StrongholdBase.dll,89 4F 4C 8B 8C 24 EC 00 00 00) // should be unique
alloc(savingAllPositions,20,getMousePosition)
alloc(newmemMP,$100)

label(backtoMain)

newmemMP:
  movups xmm3,[edi+4C]
  movaps [savingAllPositions],xmm3
  mov [edi+4C],ecx
  mov ecx,[esp+000000EC]
  jmp backtoMain
  align 10,CC
savingAllPositions:
  resb 20
getMousePosition:
  jmp newmemMP
  nop 5
backtoMain:
registersymbol(getMousePosition savingAllPositions)

newmem:
  cmp [condTele],00
  je code
  cmp [savingAllPositions],00
  je code
  movaps xmm4,[savingAllPositions]
  movups [eax],xmm4
code:
  mov [condTele],00
  mov ecx,[eax]
  mov [ebp-18],ecx
  jmp return
condTele:
dd 00
teleportSelectedTroop:
  jmp newmem
return:


[DISABLE]
getMousePosition:
  db 89 4F 4C 8B 8C 24 EC 00 00 00
teleportSelectedTroop:
  db 8B 08 89 4D E8

unregistersymbol(*)
dealloc(*)"""

