[[cheat]]
id = "x-activate-me"
name = "<<== [X]  Activate me"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Project_C-Win64-Shipping.exe
  Version: 1.1.7 Steam
  Date   : 2023-12-17
  Author : R_X
}

[ENABLE]

aobscanmodule(pBase,Project_C-Win64-Shipping.exe,4C 8B 10 4C 8D 4C 24 70 0F) // should be unique
alloc(newmem,$1000,pBase)
alloc(base,8)

label(code)
label(return)

base:
dq 0

newmem:

code:
  mov [base],rax
  mov r10,[rax]
  lea r9,[rsp+70]
  jmp return

pBase:
  jmp newmem
  nop 3
return:
registersymbol(pBase base)

[DISABLE]

pBase:
  db 4C 8B 10 4C 8D 4C 24 70

unregistersymbol(*)
dealloc(*)"""

