registersymbol(CreatureUnit_maxquantityset_enable)
registersymbol(CreatureUnit_overloadedset_enable)

//19D1C602 - 48 8B F1              - mov rsi,rcx
//19D1C605 - C7 45 8C 00000000     - mov [rbp-74],00000000
// CreatureUnit:Update+1c
//19D1C60C - 48 63 86 F0000000     - movsxd  rax,dword ptr [rsi+000000F0]
//19D1C613 - 48 8B 4E 18           - mov rcx,[rsi+18]
//19D1C617 - 48 8B D1              - mov rdx,rcx
//19D1C61A - 83 3A 00              - cmp dword ptr [rdx],00
//19D1C61D - 48 63 89 60010000     - movsxd  rcx,dword ptr [rcx+00000160]
//19D1C624 - 3B C1                 - cmp eax,ecx
aobscan(CreatureUnit_initialization_searchedAOB, 48 63 86 F0 00 00 00 48 8B 4E 18 48 8B D1 83 3A 00)

alloc(CreatureUnit_basepointer, 8, CreatureUnit_initialization_searchedAOB)
alloc(CreatureUnit_update_enable, 4, CreatureUnit_initialization_searchedAOB)
