[[cheat]]
id = "inf-health"
name = "Inf Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : JYDGE.exe
  Version: 1.0.0.7
  Date   : 2017-10-07
  Author : Squall8
}

[ENABLE]

aobscanmodule(health,prog.dll,F3 0F 11 86 C0 04 00 00 EB)
alloc(newmem,$1000,health)

label(code)
label(return)
label(ohke)
label(ohk)

newmem:
  //cmp byte ptr [esi+3F3],1
  //jne code
  cmp [esi+490],1
  jne code
  {cmp [esi+4B0],0
  jne code
  cmp [esi+4C0],0
  jne code}
  jmp return

code:
  cmp [ohke],1
  je ohk
  movss [esi+000004C0],xmm0
  jmp return

ohk:
  mov [esi+000004C0],0
  jmp return

ohke:
  dd 0

health:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(health)
registersymbol(ohke)

[DISABLE]

health:
  db F3 0F 11 86 C0 04 00 00

unregistersymbol(health)
unregistersymbol(ohke)
dealloc(newmem)"""

