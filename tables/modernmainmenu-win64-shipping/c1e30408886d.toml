[[cheat]]
id = "third-person-character-ctrl-numpad-1"
name = "Third Person Character (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : ModernMainMenu-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.7.4.0
// Game Version      : v1.0.0
// Script Date       : 2026-07-04


[ENABLE]

aobscanmodule(master,ModernMainMenu-Win64-Shipping.exe,488Bxx488Dxxxxxx488BxxFFxxxxxxxxxxF2xxxxxxxxxx66) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,8)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,8)

newmem:
  mov [data],rsi

code:
  readmem(master,8)
  jmp return

master:
  jmp newmem
  nop 3
return:

[DISABLE]

master:
  readmem(masterbkp,8)

unregistersymbol(*)
dealloc(*)"""

