source = """
// Game Executable   : MMPR_RR.exe
// Author            : ndck76
// Game Version      : v1.0.5
// Script Date       : 2024-12-11


[ENABLE]

aobscanmodule(ohk,MMPR_RR.exe,F3xxxxxxxxxxxxxxF3xxxxxxxxxxxxxx0F2FxxF3xxxxxxxxxxxxxx0F97) // should be unique
alloc(newmem,$1000,ohk)
alloc(ohkbkp,8)
registersymbol(ohk)
registersymbol(ohkbkp)
label(code)
label(return)

ohkbkp:
  readmem(ohk,8)

newmem:
  mov [rbx+0000072C],0

code:
  readmem(ohk,8)
  jmp return

ohk:
  jmp newmem
  nop 3
return:

[DISABLE]

ohk:
  readmem(ohkbkp,8)

unregistersymbol(*)
dealloc(*)"""
