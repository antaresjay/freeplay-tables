[[cheat]]
id = "enemies-non-boss-stats-low-change-stats-in-script"
name = "Enemies Non Boss Stats Low - [ Change Stats In Script ]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : NordHold.exe
  Version: 
  Date   : 2025-03-15
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(pData_eStats,GameAssembly.dll,48 8B BB 28 02 00 00 83) // should be unique
alloc(newmem,$1000,pData_eStats)

label(code)
label(return)

newmem:
  mov [rbx+00000060],(float)10         //MovementSpeed
  mov [rbx+000000A8],#1                //Health
  mov [rbx+000000D0],#1                //EliteHealthIncreasePercent
  mov [rbx+000000D4],#1                //EliteLifeRegenerationPercent
  mov [rbx+000000D8],#1                //EliteArmorIncreasePercent
  mov [rbx+000000DC],#1                //EliteSizeIncreasePercent
  mov [rbx+000000E0],#1                //EliteBarrierHealthIncreasePercent
  mov [rbx+00000124],#10               //CurrentImmuneAmount
  mov [rbx+00000154],#0                //ArmorAmount
  mov [rbx+0000021C],#1                //MaxHealth

code:
  mov rdi,[rbx+00000228]
  jmp return

pData_eStats:
  jmp newmem
  nop 2
return:
registersymbol(pData_eStats)

[DISABLE]

pData_eStats:
  db 48 8B BB 28 02 00 00

unregistersymbol(pData_eStats)
dealloc(newmem)"""

