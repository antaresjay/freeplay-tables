[[cheat]]
id = "enable-modifiers-note-must-take-damage-before-enabling-script"
name = "Enable Modifiers (Note: Must take damage before enabling script.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
//Sintrix
[ENABLE]

aobscan(test,89 42 2C 8B 4A 2C)
alloc(newmem,$1000)
registersymbol(player_health ai_health)
label(code return player_health ai_health)

newmem:
cmp [player_health],1
jne @f
cmp dword ptr [edx+28],#1
jne @f
mov eax,[edx+2C]
mov [edx+2C],eax
mov ecx,[edx+2C]
jmp return

@@:
cmp [ai_health],1
jne code
cmp dword ptr [edx+28],#0
jne code
xor eax,eax
mov [edx+2C],eax
mov ecx,[edx+20]
jmp code

code:
  mov [edx+2C],eax
  mov ecx,[edx+2C]
  jmp return

player_health:
dd 0

ai_health:
dd 0

test:
  jmp newmem
  nop
return:
registersymbol(test)

[DISABLE]

test:
  db 89 42 2C 8B 4A 2C

unregistersymbol(*)
dealloc(*)"""

