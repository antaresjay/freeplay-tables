[[cheat]]
id = "unlimited-movement-no-ap-drain"
name = "Unlimited Movement (No AP drain)"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
{ Game   : NorseSteam-Win64-Shipping.exe
  Version:
  Date   : 2026-02-20
  Author : wajrak

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(INJECT,NorseSteam-Win64-Shipping.exe,F3 0F 11 83 E0 04 00 00 48)
alloc(newmem,$1000,INJECT)
alloc(pPlayerAP, 8) // This will hold our stolen base address

label(code)
label(return)
label(is_enemy)

registersymbol(INJECT)
registersymbol(pPlayerAP)

newmem:
  // --- 1. STEAL THE POINTER ---
  // Save the base address (rbx) into our custom symbol
  mov [pPlayerAP], rbx

  // --- 2. FILTER & FREEZE ---
  // Check the faction ID at offset +2C (0 = Enemy, >0 = Ally)
  cmp dword ptr [rbx+2C], 0
  je is_enemy  // If it's 0 (Enemy), jump to the normal AP drain

  // IF ALLY:
  // We skip the original instruction completely. The game thinks it spent AP,
  // but it never actually saves the new lower number. (Infinite AP!)
  jmp return

is_enemy:
code:
  // Original instruction: Writes the reduced AP (xmm0) to memory
  movss [rbx+000004E0],xmm0

INJECT:
  jmp newmem
  nop 3
return:

[DISABLE]

INJECT:
  db F3 0F 11 83 E0 04 00 00

unregistersymbol(INJECT)
unregistersymbol(pPlayerAP)
dealloc(newmem)
dealloc(pPlayerAP)"""

