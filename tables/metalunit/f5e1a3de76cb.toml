[[cheat]]
id = "gold-and-ccs-open-inventory-and-close-it"
name = "Gold and CCs - Open inventory and close it"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(GoldCC,48 63 47 40 89 86 64 01 00 00) // should be unique
alloc(newmem,$1000)
alloc(Gold_,4)
label(code)
label(return)

newmem:
mov [Gold_],rdi
code:
  movsxd  rax,dword ptr [rdi+40]
  mov [rsi+00000164],eax
  jmp return

GoldCC:
  jmp newmem
  nop 5
return:
registersymbol(GoldCC)
registersymbol(Gold_)
[DISABLE]

GoldCC:
  db 48 63 47 40 89 86 64 01 00 00

unregistersymbol(GoldCC)
dealloc(newmem)"""

