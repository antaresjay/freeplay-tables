type = "script"
source = """
[ENABLE]
label(GameManager_savedAOB)
label(GameManager_returnhere)
label(GameManager_originalcode)
label(GameManager_exit)

label(GameManager_update_exit)
label(GameManager_set_exit)
label(GameManager_currencyset_exit)
label(GameManager_statsset_exit)

registersymbol(GameManager_savedAOB)

//04759BA9 - 8B D1                 - mov edx,ecx
//04759BAB - 39 12                 - cmp [edx],edx
// AssemblyConfirmDialog:IsUpgradeAffordable+135
//04759BAD - 8B 49 68              - mov ecx,[ecx+68]
//04759BB0 - 3B C1                 - cmp eax,ecx
//04759BB2 - 0F9F C0               - setg al
//04759BB5 - 0FB6 C0               - movzx eax,al
//04759BB8 - 85 C0                 - test eax,eax
aobscan(GameManager_searchedAOB, 8B 49 68 3B C1 0F 9F C0)

alloc(GameManager_newmem, 2048)
alloc(GameManager_temp1, 4)


GameManager_newmem:
mov [GameManager_temp1], ebx

cmp dword ptr [GameManager_update_enable], #0
je GameManager_update_exit
mov [GameManager_basepointer], ecx
GameManager_update_exit:

cmp dword ptr [GameManager_set_enable], #0
je GameManager_set_exit
GameManager_set_exit:

cmp dword ptr [GameManager_currencyset_enable], #0
je GameManager_currencyset_exit
mov [ecx+68], #9999999
GameManager_currencyset_exit:

cmp dword ptr [GameManager_statsset_enable], #0
je GameManager_statsset_exit
cmp dword ptr [ecx+3c], #0
je GameManager_currencyset_exit
mov ebx, [ecx+3c]
mov [ebx+28], #999
cmp dword ptr [ecx+48], #0
je GameManager_currencyset_exit
mov ebx, [ecx+48]
mov [ebx+18], (float)9999999
mov [ebx+1c], #9999999
cmp dword ptr [ecx+4c], #0
je GameManager_currencyset_exit
mov ebx, [ecx+4c]
mov [ebx+18], (float)9999999
mov [ebx+1c], #9999999
cmp dword ptr [ecx+50], #0
je GameManager_currencyset_exit
mov ebx, [ecx+50]
mov [ebx+18], (float)9999999
mov [ebx+1c], #9999999
GameManager_statsset_exit:

mov ebx, [GameManager_temp1]

GameManager_originalcode:
db 8B 49 68 3B C1
//mov ecx,[ecx+68]
//cmp eax,ecx


GameManager_exit:
jmp GameManager_returnhere


GameManager_searchedAOB:
GameManager_savedAOB:
jmp GameManager_newmem
GameManager_returnhere:


[DISABLE]
GameManager_savedAOB:
db 8B 49 68 3B C1
//mov ecx,[ecx+68]
//cmp eax,ecx

unregistersymbol(GameManager_savedAOB)

dealloc(GameManager_newmem)
dealloc(GameManager_temp1)"""

