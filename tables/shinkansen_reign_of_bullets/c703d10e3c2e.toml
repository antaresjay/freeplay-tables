[[cheat]]
id = "gamemanager-base-address-scan-to-activate-view-hanger-upgrades-to-update-view-hanger-upgrades"
name = "GameManager Base Address Scan (To Activate: View Hanger Upgrades, To Update: View Hanger Upgrades)"
category = "player"
