type = "script"
source = """
[ENABLE]

aobscanmodule(focsud,Hellblade2-Win64-Shipping.exe,48 8B 81 D0 02 00 00 F3 0F 10 14 90 0F 28 C2) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov rax,[rcx+000002D0]
  xorps xmm1,xmm1
  movss xmm2,[rax+rdx*4]
  movaps xmm0,xmm2
  jmp return

focsud:
  jmp far newmem
  nop
return:
registersymbol(focsud)

[DISABLE]

focsud:
  db 48 8B 81 D0 02 00 00 F3 0F 10 14 90 0F 28 C2

unregistersymbol(focsud)
dealloc(newmem)"""
