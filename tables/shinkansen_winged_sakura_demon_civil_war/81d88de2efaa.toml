[[cheat]]
id = "playerdata-base-address-scan-initialization-activate-this-first"
name = "PlayerData Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlayerData_basepointer)
registersymbol(PlayerData_update_enable)
registersymbol(PlayerData_set_enable)
registersymbol(PlayerData_goldset_enable)
registersymbol(PlayerData_playtimeset_enable)

