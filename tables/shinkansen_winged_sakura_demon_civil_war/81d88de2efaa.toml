[[cheat]]
id = "character-base-address-scan-to-activate-battle-to-update-battle"
name = "Character Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Character_savedAOB)
label(Character_returnhere)
label(Character_originalcode)
label(Character_exit)

label(Character_update_exit)
label(Character_set_exit)
label(Character_healthset_exit)
label(Character_mpset_exit)
label(Character_statpointsset_exit)
label(Character_skillpointsset_exit)
label(Character_attributesset_exit)

registersymbol(Character_savedAOB)

//051C0D22 - 83 C4 10              - add esp,10
//051C0D25 - D9 5F 34              - fstp dword ptr [edi+34]
// Character:get_currentHP+38
//051C0D28 - D9 47 34              - fld dword ptr [edi+34]
//051C0D2B - 8D 65 FC              - lea esp,[ebp-04]
//051C0D2E - 5F                    - pop edi
//051C0D2F - C9                    - leave
//051C0D30 - C3                    - ret
aobscan(Character_searchedAOB, D9 47 34 8D 65 FC 5F C9 C3)

alloc(Character_newmem, 2048, Character_searchedAOB)
alloc(Character_temp1, 4, Character_searchedAOB)
alloc(Character_temp2, 4, Character_searchedAOB)
alloc(Character_temp3, 4, Character_searchedAOB)
alloc(Character_temp4, 4, Character_searchedAOB)


Character_newmem:
mov [Character_temp1], eax
mov [Character_temp2], ebx
mov [Character_temp3], ecx
mov [Character_temp4], edx

cmp dword ptr [Character_update_enable], #0
je Character_update_exit
mov [Character_basepointer], edi
Character_update_exit:

cmp dword ptr [Character_set_enable], #0
je Character_set_exit
Character_set_exit:

cmp byte ptr [edi+60], #1
je Character_attributesset_exit

cmp dword ptr [Character_healthset_enable], #0
je Character_healthset_exit
mov [edi+34], (float)9999
Character_healthset_exit:

cmp dword ptr [Character_mpset_enable], #0
je Character_mpset_exit
mov [edi+38], (float)9999
Character_mpset_exit:

cmp dword ptr [Character_statpointsset_enable], #0
je Character_statpointsset_exit
mov [edi+58], #9999
Character_statpointsset_exit:

cmp dword ptr [Character_skillpointsset_enable], #0
je Character_skillpointsset_exit
mov [edi+5c], #9999
Character_skillpointsset_exit:

cmp dword ptr [Character_attributesset_enable], #0
je Character_attributesset_exit
mov [edi+40], (float)9999
mov [edi+44], (float)9999
mov [edi+48], (float)9999
mov [edi+4c], (float)9999
mov [edi+50], (float)9999
mov [edi+54], (float)9999
Character_attributesset_exit:

mov eax, [Character_temp1]
mov ebx, [Character_temp2]
mov ecx, [Character_temp3]
mov edx, [Character_temp4]


Character_originalcode:
db D9 47 34 8D 65 FC
//fld dword ptr [edi+34]
//lea esp,[ebp-04]


Character_exit:
jmp Character_returnhere


Character_searchedAOB:
Character_savedAOB:
jmp Character_newmem
nop
Character_returnhere:


[DISABLE]
Character_savedAOB:
db D9 47 34 8D 65 FC
//fld dword ptr [edi+34]
//lea esp,[ebp-04]

unregistersymbol(Character_savedAOB)

dealloc(Character_newmem)
dealloc(Character_temp1)
dealloc(Character_temp2)
dealloc(Character_temp3)
dealloc(Character_temp4)"""

