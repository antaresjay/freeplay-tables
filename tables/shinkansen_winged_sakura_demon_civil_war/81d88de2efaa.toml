alloc(PlayerData_update_enable, 4)
alloc(PlayerData_set_enable, 4)
alloc(PlayerData_goldset_enable, 4)
alloc(PlayerData_playtimeset_enable, 4)


[DISABLE]
unregistersymbol(PlayerData_basepointer)
unregistersymbol(PlayerData_update_enable)
unregistersymbol(PlayerData_set_enable)
unregistersymbol(PlayerData_goldset_enable)
unregistersymbol(PlayerData_playtimeset_enable)

dealloc(PlayerData_basepointer)
dealloc(PlayerData_update_enable)
dealloc(PlayerData_set_enable)
dealloc(PlayerData_goldset_enable)
dealloc(PlayerData_playtimeset_enable)"""

[[cheat]]
id = "playerdata-base-address-scan-to-activate-view-status-to-update-view-status"
name = "PlayerData Base Address Scan (To Activate: View Status, To Update: View Status)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerData_savedAOB)
label(PlayerData_returnhere)
label(PlayerData_originalcode)
label(PlayerData_exit)

label(PlayerData_update_exit)
label(PlayerData_set_exit)
label(PlayerData_goldset_exit)
label(PlayerData_playtimeset_exit)

registersymbol(PlayerData_savedAOB)

//050FB373 - 83 EC 08              - sub esp,08
//050FB376 - 8B 45 08              - mov eax,[ebp+08]
// PlayerData:Update+9
//050FB379 - 8B 40 2C              - mov eax,[eax+2C]
//050FB37C - 85 C0                 - test eax,eax
//050FB37E - 74 16                 - je 050FB396
//050FB380 - 8B 45 08              - mov eax,[ebp+08]
//050FB383 - 8B 40 2C              - mov eax,[eax+2C]
//050FB386 - 83 EC 0C              - sub esp,0C
aobscan(PlayerData_searchedAOB, 8B 40 2C 85 C0 74 16 8B 45 08)

alloc(PlayerData_newmem, 2048, PlayerData_searchedAOB)
alloc(PlayerData_temp1, 4, PlayerData_searchedAOB)
alloc(PlayerData_temp2, 4, PlayerData_searchedAOB)
alloc(PlayerData_temp3, 4, PlayerData_searchedAOB)
alloc(PlayerData_temp4, 4, PlayerData_searchedAOB)


PlayerData_newmem:
mov [PlayerData_temp1], eax
mov [PlayerData_temp2], ebx
mov [PlayerData_temp3], ecx
mov [PlayerData_temp4], edx

cmp dword ptr [PlayerData_update_enable], #0
je PlayerData_update_exit
mov [PlayerData_basepointer], eax
PlayerData_update_exit:

cmp dword ptr [PlayerData_set_enable], #0
je PlayerData_set_exit
PlayerData_set_exit:

cmp dword ptr [PlayerData_goldset_enable], #0
je PlayerData_goldset_exit
mov [eax+54], #999999999
PlayerData_goldset_exit:

cmp dword ptr [PlayerData_playtimeset_enable], #0
je PlayerData_playtimeset_exit
mov [eax+30], (float)0
PlayerData_playtimeset_exit:

mov eax, [PlayerData_temp1]
mov ebx, [PlayerData_temp2]
mov ecx, [PlayerData_temp3]
mov edx, [PlayerData_temp4]


PlayerData_originalcode:
db 8B 40 2C 85 C0
//mov eax,[eax+2C]
//test eax,eax


PlayerData_exit:
jmp PlayerData_returnhere


PlayerData_searchedAOB:
PlayerData_savedAOB:
jmp PlayerData_newmem
PlayerData_returnhere:


[DISABLE]
PlayerData_savedAOB:
db 8B 40 2C 85 C0
//mov eax,[eax+2C]
//test eax,eax

unregistersymbol(PlayerData_savedAOB)

dealloc(PlayerData_newmem)
dealloc(PlayerData_temp1)
dealloc(PlayerData_temp2)
dealloc(PlayerData_temp3)
dealloc(PlayerData_temp4)"""

