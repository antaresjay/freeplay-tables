unregistersymbol(shooterRoot_update_enable)
unregistersymbol(shooterRoot_set_enable)
unregistersymbol(shooterRoot_hpset_enable)
unregistersymbol(shooterRoot_ammoset_enable)
unregistersymbol(shooterRoot_inventoryset_enable)
