[[cheat]]
id = "shooterroot-base-address-scan-to-activate-play-level-to-update-play-level"
name = "shooterRoot Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(shooterRoot_savedAOB)
label(shooterRoot_returnhere)
label(shooterRoot_originalcode)
label(shooterRoot_exit)

label(shooterRoot_update_exit)
label(shooterRoot_set_exit)
label(shooterRoot_hpset_exit)
label(shooterRoot_ammoset_exit)
label(shooterRoot_inventoryset_exit)
label(shooterRoot_damageset_exit)
label(shooterRoot_accuracyset_exit)
label(shooterRoot_armorset_exit)
label(shooterRoot_speedset_exit)
label(shooterRoot_stealthset_exit)
label(shooterRoot_immortalset_exit)

registersymbol(shooterRoot_savedAOB)

//04724B54 - C7 85 40F0FFFF 00000000 - mov [ebp-00000FC0],00000000
//04724B5E - C7 85 44F0FFFF 00000000 - mov [ebp-00000FBC],00000000
// shooterRoot:Update+40
//04724B68 - 8D 85 48F0FFFF        - lea eax,[ebp-00000FB8]
//04724B6E - 83 EC 04              - sub esp,04
//04724B71 - 6A 28                 - push 28
//04724B73 - 6A 00                 - push 00
aobscan(shooterRoot_searchedAOB, 8D 85 48 F0 FF FF 83 EC 04)

alloc(shooterRoot_newmem, 2048, shooterRoot_searchedAOB)
alloc(shooterRoot_temp1, 4, shooterRoot_searchedAOB)


shooterRoot_newmem:
mov [shooterRoot_temp1], ebx

cmp dword ptr [shooterRoot_update_enable], #0
je shooterRoot_update_exit
mov [shooterRoot_basepointer], edi
shooterRoot_update_exit:

cmp dword ptr [shooterRoot_set_enable], #0
je shooterRoot_set_exit
shooterRoot_set_exit:

cmp dword ptr [shooterRoot_hpset_enable], #0
je shooterRoot_hpset_exit
mov ebx, [edi+ec]
mov [edi+dc], ebx
shooterRoot_hpset_exit:

cmp dword ptr [shooterRoot_ammoset_enable], #0
je shooterRoot_ammoset_exit
mov ebx, [edi+690]
mov [edi+680], ebx
shooterRoot_ammoset_exit:

cmp dword ptr [shooterRoot_inventoryset_enable], #0
je shooterRoot_inventoryset_exit
mov ebx, [edi+42c]
xor ebx, #9999
mov [edi+430], ebx
mov ebx, [edi+43c]
xor ebx, #9999
mov [edi+440], ebx
mov ebx, [edi+69c]
xor ebx, #9999
mov [edi+6a0], ebx
shooterRoot_inventoryset_exit:

cmp dword ptr [shooterRoot_damageset_enable], #0
je shooterRoot_damageset_exit
mov ebx, [edi+3ec]
xor ebx, [shooterRoot_damageset_value]
mov [edi+3f0], ebx
shooterRoot_damageset_exit:

cmp dword ptr [shooterRoot_accuracyset_enable], #0
je shooterRoot_accuracyset_exit
mov ebx, [edi+3fc]
xor ebx, [shooterRoot_accuracyset_value]
mov [edi+400], ebx
shooterRoot_accuracyset_exit:

cmp dword ptr [shooterRoot_armorset_enable], #0
je shooterRoot_armorset_exit
mov ebx, [edi+40c]
xor ebx, [shooterRoot_armorset_value]
mov [edi+410], ebx
shooterRoot_armorset_exit:

cmp dword ptr [shooterRoot_speedset_enable], #0
je shooterRoot_speedset_exit
mov ebx, [edi+41c]
xor ebx, [shooterRoot_speedset_value]
mov [edi+420], ebx
shooterRoot_speedset_exit:

cmp dword ptr [shooterRoot_stealthset_enable], #0
je shooterRoot_stealthset_exit
mov byte ptr [edi+60a], #1
shooterRoot_stealthset_exit:

cmp dword ptr [shooterRoot_immortalset_enable], #0
je shooterRoot_immortalset_exit
mov byte ptr [edi+6fc], #1
shooterRoot_immortalset_exit:

mov ebx, [shooterRoot_temp1]


shooterRoot_originalcode:
db 8D 85 48 F0 FF FF
//lea eax,[ebp-00000FB8]


shooterRoot_exit:
jmp shooterRoot_returnhere


shooterRoot_searchedAOB:
shooterRoot_savedAOB:
jmp shooterRoot_newmem
nop
shooterRoot_returnhere:


[DISABLE]
shooterRoot_savedAOB:
db 8D 85 48 F0 FF FF
//lea eax,[ebp-00000FB8]

unregistersymbol(shooterRoot_savedAOB)

dealloc(shooterRoot_newmem)
dealloc(shooterRoot_temp1)"""

