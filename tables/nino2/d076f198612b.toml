[[cheat]]
id = "infinite-zing-gauge"
name = "Infinite Zing Gauge"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(zingcd,Nino2.exe,F3 0F 10 46 24 45)
alloc(newmem,$1000,zingcd)

label(code)
label(return)

newmem:
code:
  fild dword ptr [rsi+28]
  fstp dword ptr [rsi+24]
  movss xmm0, [rsi+24]
  jmp return

zingcd:
  jmp newmem
return:
registersymbol(zingcd)

[DISABLE]

zingcd:
  db F3 0F 10 46 24

unregistersymbol(zingcd)
dealloc(newmem)"""
