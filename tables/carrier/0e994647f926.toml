[[cheat]]
id = "readme"
name = "-------------ReadME-------------"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
CARRIER COMMAND: GAEA MISSION TRAINER(+8) 1.2.0034
by Mop "Das ist mein Schlachtschiff"


Health/Energy(All Units):
         These options will work for all of your units even if you are not in
         direct control of them.
                -Does not work in First Person, Use the option below for
                first person

Vehicle Health, Vehicle Energy/Fuel(Single Unit):
        Are just pointers, whatever unit you are playing as, will get these
        option and only that unit, no others.
            -Works with First person mode
Ammo:
        Gives the selected unit, being controlled by player the option non-other.

Ammo Max Amt/Bombs/etc..:
        This option allows you to change the amount of ammo for other weapons
        that you cannot change with the ammo option above

OverHeat:
        Shoot as long as you want without stopping

Carrier Repair:
        With this option you can do 2 things, first open your carrier Repair
        window and turn on this option and click each system to set it to top
        priority to repair it instantly or second you can turn the option ON then
        open your carrier Repair window which will repair everything. Donâ€™t forget
        to turn off option once done or everything will repair itself once you
        open the window a second time, if you choose first option.

Carrier Fuel:
        With this option you can get infinite fuel for your ship or set the
        Enemy Carrier fuel to 0.

Quentity Edit:
         With this option you can set the amount of items in your carrier.
              How to use:
                   -Open Production window then select the item you want to
                   change and hover you mouse over the item and turn the option
                   on.
                   -NOTE: you need at least one item stocked in your carrier for
                   this option to work or if you have had the item stocked in
                   your carrier previously but have non now this should work to.

Material:
         Give you lots of material to use.

Instant Production:
        For this to work you have to open ship Production window once enabled,
        then you can turn it off if you want.









}
























[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat"""

