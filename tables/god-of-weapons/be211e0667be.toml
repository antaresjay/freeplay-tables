type = "script"
source = """
{ Game   : God Of Weapons.exe
  Version: 
  Date   : 2023-05-15
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanregion(pData_UnlimitedGold,AMG.CharacterManager:AddGold,AMG.CharacterManager:AddGold+100,C1 89 87 28 02 00 00) // should be unique
alloc(newmem,$1000,pData_UnlimitedGold)

label(code)
label(return)

newmem:
  mov eax,#99999999                  //Gold

code:
  mov [rdi+00000228],eax
  jmp return

pData_UnlimitedGold+01:
  jmp newmem
  nop
return:
registersymbol(pData_UnlimitedGold)

[DISABLE]

pData_UnlimitedGold+01:
  db 89 87 28 02 00 00

unregistersymbol(pData_UnlimitedGold)
dealloc(newmem)"""

