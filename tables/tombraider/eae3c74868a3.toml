[[cheat]]
id = "sprint-key-2"
name = "Sprint key .2"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanmodule(moveSpeedMulReadAOB,TombRaider.exe,E8 ** ** ** ** F3 0F 10 ** ** ** ** ** 0F 28 ** ** ** 68)
registersymbol(moveSpeedMulReadAOB)

label(bSprintKeyID)
registersymbol(bSprintKeyID)
label(dCustMoveSpeed)
registersymbol(dCustMoveSpeed)

alloc(newmem,2048)
label(returnhere)
label(originalcode_sprintkey)
registersymbol(originalcode_sprintkey)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
//
pushad
sub esp,10
movdqu dqword [esp],xmm5
sub esp,10
movdqu dqword [esp],xmm4
sub esp,10
movdqu dqword [esp],xmm3
sub esp,10
movdqu dqword [esp],xmm2
sub esp,10
movdqu dqword [esp],xmm1
//
push [bSprintKeyID]
call GetAsyncKeyState
shr ax,#15
cmp ax,1
jne @f
movss xmm0,[dCustMoveSpeed]

//
regrestore:
movdqu xmm1,dqword [esp]
add esp,10
movdqu xmm2,dqword [esp]
add esp,10
movdqu xmm3,dqword [esp]
add esp,10
movdqu xmm4,dqword [esp]
add esp,10
movdqu xmm5,dqword [esp]
add esp,10
cmp ax,1
popad
je exit
//

originalcode_sprintkey:
readmem(moveSpeedMulReadAOB+5,8)
//movss xmm0,[edi+00002288]

exit:
jmp returnhere

///
bSprintKeyID:
dd 14 //CAPS LOCK key
dCustMoveSpeed:
dd (float)2
///

moveSpeedMulReadAOB+5: //"TombRaider.exe"+57357B:
jmp newmem
nop
nop
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
moveSpeedMulReadAOB+5: //"TombRaider.exe"+57357B:
readmem(originalcode_sprintkey,8)
//db F3 0F 10 87 88 22 00 00
//Alt: movss xmm0,[edi+00002288]
unregistersymbol(originalcode_sprintkey)

unregistersymbol(bSprintKeyID)
unregistersymbol(dCustMoveSpeed)"""

