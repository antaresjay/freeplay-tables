[[cheat]]
id = "cheats"
name = "Cheats!"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(cheater,2048)
label(iCheat)
registersymbol(iCheat)
label(chtHealth)
label(retHealth)
label(orgHealth)
label(ptrLara)
registersymbol(ptrLara)

label(chtAmmo)
label(retAmmo)
label(orgAmmo)
label(ptrSalvage)
registersymbol(ptrSalvage)

cheater:
iCheat:
 dw 0000   //Byte:Health,reserved.
 dw 0000   //Word:Minimum Ammo.
ptrLara:
 dd 00
ptrSalvage:
 dd 00

{
  posPlayer: pointer of Lara's coord.
     X = [[[ptrLara]+22FC]+0]
     Y = [[[ptrLara]+22FC]+4]
     Z = [[[ptrLara]+22FC]+8]
  posArrow: pointer of LookAt's coord.
     X = [[ptrLara]+AF0]
     Y = [[ptrLara]+AF4]
     Z = [[ptrLara]+AF8]
  wayPoint: Pointer of local waypoint's coord.
     X = [[wayPoint]+7D0]
     Y = [[wayPoint]+7D4]
     Z = [[wayPoint]+7D8]
}

chtHealth:
 mov [ptrLara],esi     //XP, SKILL POINTS, Coordinates
 cmp dword ptr [ecx+baseHealth],00 {originalcode, ecx=0}
 jna retHealth                 {if Health=0,Lara must be dead}
 pushfd                        {if Health>0,we cheat}
 push eax
 cmp byte ptr [iCheat],00
 je orgHealth
 mov eax,[ecx+baseHealth+4]
 mov [ecx+baseHealth],eax
orgHealth:
 pop eax
 popfd
 jmp retHealth


chtAmmo:
 pushfd
 mov ax,[iCheat+2]        //minAmmo(iCheat+2):word
 cmp word ptr [edx+8],ax
 jnl orgAmmo
 mov word [edx+8],ax
orgAmmo:
 popfd
 mov ax,[edx+08]
 pop esi
 jmp retAmmo


{-------------Hacked--------------}
locAmmo:
 jmp chtAmmo
retAmmo:

locHealth:
 jmp chtHealth
 db 90 90
retHealth:

[DISABLE]
locHealth:
 cmp dword ptr [ecx+baseHealth],00
locAmmo:
 db 66 8B 42 08 5E
dealloc(cheater)
unregistersymbol(iCheat)
unregistersymbol(ptrLara)
unregistersymbol(ptrSalvage)"""

