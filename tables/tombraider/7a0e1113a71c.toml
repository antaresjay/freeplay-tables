alloc(newmem,2048)
label(returnhere)
aobscan(fallprotectAOB,D996180F0000D99E0C0F000085C07425)
label(fallprotectCODE)
registersymbol(fallprotectCODE)

// TombRaider.exe+58ACAD - D9 96 180F0000        - fst dword ptr [esi+00000F18]
// TombRaider.exe+58ACB3 - D9 9E 0C0F0000        - fstp dword ptr [esi+00000F0C]
// TombRaider.exe+58ACB9 - 85 C0                 - test eax,eax
// TombRaider.exe+58ACBB - 74 25                 - je TombRaider.exe+58ACE2


newmem:
fstp dword ptr [esi+00000F0C]
mov dword ptr [esi+00000F0C],(float)-9000000.0
jmp returnhere

fallprotectAOB+6:
fallprotectCODE:
jmp newmem
nop
returnhere:

[DISABLE]
fallprotectCODE:
db D9 9E 0C 0F 00 00

dealloc(newmem)

unregistersymbol(fallprotectCODE)"""
