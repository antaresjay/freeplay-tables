[[cheat]]
id = "unlimited-health"
name = "Unlimited Health "
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : FINAL FANTASY II.exe
  Version:
  Date   : 2025-12-02
  Author : mlgpr

  Combined Health Script - Sets Health to 9999 (Player Only)
  Player ID: 2036427856 (0x79616C50)
}

[ENABLE]

aobscanmodule(health,GameAssembly.dll,89 7B 14 48 8B CB) // should be unique
aobscanmodule(health2,GameAssembly.dll,89 43 14 48 8B 0D 19 88 CD 01) // should be unique

alloc(newmem,$1000,health)

label(code1)
label(return1)
label(notplayer1)
label(newmem2)
label(code2)
label(return2)
label(notplayer2)

newmem:
  push rax
  mov rax,[rbx]
  test rax,rax
  jz notplayer1
  mov rax,[rax+10]
  test rax,rax
  jz notplayer1
  cmp dword ptr [rax],79616C50    // 2036427856 - player structure ID
  jne notplayer1
  mov edi,270F                      // 9999 in decimal
notplayer1:
  pop rax
code1:
  mov [rbx+14],edi
  mov rcx,rbx
  jmp return1

align 10
newmem2:
  push rcx
  mov rcx,[rbx]
  test rcx,rcx
  jz notplayer2
  mov rcx,[rcx+10]
  test rcx,rcx
  jz notplayer2
  cmp dword ptr [rcx],79616C50    // 2036427856 - player structure ID
  jne notplayer2
  mov eax,270F                      // 9999 in decimal
notplayer2:
  pop rcx
code2:
  mov [rbx+14],eax
  mov rcx,[GameAssembly.dll+21A52F0]
  jmp return2

health:
  jmp newmem
  nop
return1:

health2:
  jmp newmem2
  nop 5
return2:

registersymbol(health health2)

[DISABLE]

health:
  db 89 7B 14 48 8B CB

health2:
  db 89 43 14 48 8B 0D 19 88 CD 01

unregistersymbol(health health2)
dealloc(newmem)"""

