db 96 04 00 08 3E 08 F2 1C 96 02 00 08 3E 4E 96 02 00 04 02 0B 4F

hit:
db 96 06 00 04 01 08 43 05 00 4f

armor:
db 96 08 00 04 01 08 2C 04 01 08 2C 4E 96 02 00 04 02 0B 4F

