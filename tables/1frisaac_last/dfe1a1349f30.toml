//96 04 00 08 3E 08 F2
//getVariable
//1C
//push "hp"(62)
//96 02 00 08 3E
//getMember
//4E
//push @reg2
//96 02 00 04 02
//substact
//0B
//setMember
//4F

aobscan(hit_address,96 06 00 04 01 08 43 05 00 4f) //replace "kramper" with "nodmg"

aobscan(armor_address,96 08 00 04 01 08 2C 04 01 08 2C 4E 96 02 00 04 02 0B 4F)

