name = "Infinite HP"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(life)
label(hit)
label(armor)
registersymbol(life)
registersymbol(hit)
registersymbol(armor)

aobscan(life_address,96 04 00 08 3E 08 F2 1C 96 02 00 08 3E 4E 96 02 00 04 02 0B 4F)
