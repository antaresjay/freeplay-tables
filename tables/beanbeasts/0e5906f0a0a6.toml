id = "enemyhealth"
name = "EnemyHealth"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : BeanBeasts.exe
  Version: 
  Date   : 2025-08-24
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,EnemyHealth:Die)
define(bytes,55 48 8B EC 48 81 EC A0 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,EnemyHealth:Die)

label(code)
label(return)

newmem:

mov [health_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,000000A0
  jmp return

health_ptr:
dq 0

address:
  jmp newmem
  nop 6
return:
registersymbol(health_ptr)

[DISABLE]

address:
  db bytes
  // push rbp
  // mov rbp,rsp
  // sub rsp,000000A0

dealloc(newmem)
unregistersymbol(health_ptr)
{
// ORIGINAL CODE - INJECTION POINT: EnemyHealth:Die

1F808D76F39: 04 02                 - add al,02
1F808D76F3B: 05 04 03 01 50        - add eax,50010304
1F808D76F40: 00 00                 - add [rax],al
1F808D76F42: 00 00                 - add [rax],al
1F808D76F44: 00 00                 - add [rax],al
1F808D76F46: 00 00                 - add [rax],al
1F808D76F48: 00 00                 - add [rax],al
1F808D76F4A: 00 00                 - add [rax],al
1F808D76F4C: 00 00                 - add [rax],al
1F808D76F4E: 00 00                 - add [rax],al
// ---------- INJECTING HERE ----------
EnemyHealth:Die: 55                    - push rbp
// ---------- DONE INJECTING  ----------
EnemyHealth:Die+1: 48 8B EC              - mov rbp,rsp
EnemyHealth:Die+4: 48 81 EC A0 00 00 00  - sub rsp,000000A0
EnemyHealth:Die+b: 48 89 75 F0           - mov [rbp-10],rsi
EnemyHealth:Die+f: 48 89 7D F8           - mov [rbp-08],rdi
EnemyHealth:Die+13: 48 8B F1              - mov rsi,rcx
EnemyHealth:Die+16: 48 8B 46 38           - mov rax,[rsi+38]
EnemyHealth:Die+1a: 0F B6 80 DC 00 00 00  - movzx eax,byte ptr [rax+000000DC]
EnemyHealth:Die+21: 85 C0                 - test eax,eax
EnemyHealth:Die+23: 74 36                 - je EnemyHealth:Die+5b
EnemyHealth:Die+25: 48 8B CE              - mov rcx,rsi
}"""

