label(originalcode)
label(exit)
aobscan(a1, 75 27 B8 ? ? ? ? D9 00 8B 45 08 8B 48 34 51 DB 04 24 D9 1C 24 D9 04 24 83 C4 04 DE C1 B9 ? ? ? ? D9 19)
label(w1)
