[[cheat]]
id = "testsoldierpatcher"
name = "--TestSoldierPatcher"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(aobRankReader,XCom.exe,8B 81 08 01 00 00 C3)

alloc(newmem,4096,aobRankReader)

define(OFFSET_HEALTH,0x00000248)
define(OFFSET_AIM,0x0000027C)
define(OFFSET_MOBILITY,0x000002E4)
define(OFFSET_WILL,0x00000318)
define(OFFSET_SIGHT,0x00000380)
define(OFFSET_DODGE,0x00000450)
define(OFFSET_ARMORMITIGATION,0x000004B8)
define(OFFSET_ARMORPIERCING,0x000004EC)
define(OFFSET_DETECTIONRADIUS,0x00000588)
define(OFFSET_PSY,0x00000520)
define(OFFSET_CRIT,0x000005F0)
define(OFFSET_FLANKCRIT,0x000006F4)

label(aobRankReader_r)
label(aobRankReader_i)
registersymbol(aobRankReader_r)
registersymbol(aobRankReader_i)

label(lblRankReader)
label(lblRankReaderRet)

label(bEnableMinHealth)
label(fMinHealth)
label(bEnableHealing)
label(bEnableMinAim)
label(fMinAim)
label(bEnableMinMobility)
label(fMinMobility)
label(bEnableMinWill)
label(fMinWill)
label(bEnableMinHacking)
label(fMinHacking)
label(bEnableMinSight)
label(fMinSight)
label(bEnableMinDodge)
label(fMinDodge)
label(bEnableMinArmourMitigation)
label(fMinArmourMitigation)
label(bEnableMinArmourPiercing)
label(fMinArmourPiercing)
label(bEnableMinDetectionRadius)
label(fMinDetectionRadius)
label(bEnableMinPsyOffense)
label(fMinPsyOffense)
label(bEnableMinCritChance)
label(fMinCritChance)
label(bEnableStatusReset)
registersymbol(bEnableMinHealth)
registersymbol(fMinHealth)
registersymbol(bEnableHealing)
registersymbol(bEnableMinAim)
registersymbol(fMinAim)
registersymbol(bEnableMinMobility)
registersymbol(fMinMobility)
registersymbol(bEnableMinWill)
registersymbol(fMinWill)
registersymbol(bEnableMinHacking)
registersymbol(fMinHacking)
registersymbol(bEnableMinSight)
registersymbol(fMinSight)
registersymbol(bEnableMinDodge)
registersymbol(fMinDodge)
registersymbol(bEnableMinArmourMitigation)
registersymbol(fMinArmourMitigation)
registersymbol(bEnableMinArmourPiercing)
registersymbol(fMinArmourPiercing)
registersymbol(bEnableMinDetectionRadius)
registersymbol(fMinDetectionRadius)
registersymbol(bEnableMinPsyOffense)
registersymbol(fMinPsyOffense)
registersymbol(bEnableMinCritChance)
registersymbol(fMinCritChance)
registersymbol(bEnableStatusReset)


newmem:
bEnableMinHealth:
dd 1
fMinHealth:
dd (float)25.0
bEnableHealing:
dd 1
bEnableMinAim:
dd 1
fMinAim:
dd (float)150.0
bEnableMinMobility:
dd 1
fMinMobility:
dd (float)30.0
bEnableMinWill:
dd 1
fMinWill:
dd (float)100.0
bEnableMinHacking:
dd 1
fMinHacking:
dd (float)99.0
bEnableMinSight:
dd 1
fMinSight:
dd (float)50.0
bEnableMinDodge:
dd 1
fMinDodge:
dd (float)25.0
bEnableMinArmourMitigation:
dd 1
fMinArmourMitigation:
dd (float)3.0
bEnableMinArmourPiercing:
dd 1
fMinArmourPiercing:
dd (float)5.0
bEnableMinDetectionRadius:
dd 1
fMinDetectionRadius:
dd (float)16.0
bEnableMinPsyOffense:
dd 1
fMinPsyOffense:
dd (float)100.0
bEnableMinCritChance:
dd 1
fMinCritChance:
dd (float)95.0
bEnableStatusReset:
dd 1

lblRankReader:
// Health
cmp dword ptr [bEnableMinHealth],1
jne short @f
mov eax,[fMinHealth]
cmp dword ptr [rcx+OFFSET_HEALTH+04],eax
jge short @f
mov dword ptr [rcx+OFFSET_HEALTH+04],eax
mov dword ptr [rcx+OFFSET_HEALTH+08],eax
@@:

// Current health (heal?)
cmp dword ptr [bEnableHealing],1
jne short @f
mov eax,[rcx+OFFSET_HEALTH+08]
cmp dword ptr [rcx+OFFSET_HEALTH],eax
jge short @f
mov dword ptr [rcx+OFFSET_HEALTH],eax
@@:

// Aim
cmp dword ptr [bEnableMinAim],1
jne short @f
mov eax,[fMinAim]
cmp dword ptr [rcx+OFFSET_AIM],eax
jge short @f
mov dword ptr [rcx+OFFSET_AIM],eax
mov dword ptr [rcx+OFFSET_AIM+04],eax
mov dword ptr [rcx+OFFSET_AIM+08],eax
@@:

// Mobility
cmp dword ptr [bEnableMinMobility],1
jne short @f
mov eax,[fMinMobility]
cmp dword ptr [rcx+OFFSET_MOBILITY],eax
jge short @f
mov dword ptr [rcx+OFFSET_MOBILITY],eax
mov dword ptr [rcx+OFFSET_MOBILITY+04],eax
mov dword ptr [rcx+OFFSET_MOBILITY+08],eax
@@:

// Will
//cmp dword ptr [rcx+B10],0
//jne short @f
cmp dword ptr [bEnableMinWill],1
jne short @f
mov eax,[fMinWill]
cmp dword ptr [rcx+OFFSET_WILL],eax
jge short @f
mov dword ptr [rcx+OFFSET_WILL],eax
mov dword ptr [rcx+OFFSET_WILL+04],eax
mov dword ptr [rcx+OFFSET_WILL+08],eax
@@:

/*
// Hacking
cmp dword ptr [bEnableMinHacking],1
jne short @f
mov eax,[fMinHacking]
cmp dword ptr [rcx+304],eax
jge short @f
mov dword ptr [rcx+304],eax
mov dword ptr [rcx+308],eax
mov dword ptr [rcx+30C],eax
@@:
*/

// Sight
cmp dword ptr [bEnableMinSight],1
jne short @f
mov eax,[fMinSight]
cmp dword ptr [rcx+OFFSET_SIGHT],eax
jge short @f
mov dword ptr [rcx+OFFSET_SIGHT],eax
mov dword ptr [rcx+OFFSET_SIGHT+04],eax
mov dword ptr [rcx+OFFSET_SIGHT+08],eax
@@:

// Dodge
cmp dword ptr [bEnableMinDodge],1
jne short @f
mov eax,[fMinDodge]
cmp dword ptr [rcx+OFFSET_DODGE],eax
jge short @f
mov dword ptr [rcx+OFFSET_DODGE],eax
mov dword ptr [rcx+OFFSET_DODGE+04],eax
mov dword ptr [rcx+OFFSET_DODGE+08],eax
@@:

// Armour mitigation
cmp dword ptr [bEnableMinArmourMitigation],1
jne short @f
mov eax,[fMinArmourMitigation]
cmp dword ptr [rcx+OFFSET_ARMORMITIGATION],eax
jge short @f
mov dword ptr [rcx+OFFSET_ARMORMITIGATION],eax
mov dword ptr [rcx+OFFSET_ARMORMITIGATION+04],eax
mov dword ptr [rcx+OFFSET_ARMORMITIGATION+08],eax
@@:

// Armour piercing
cmp dword ptr [bEnableMinArmourPiercing],1
jne short @f
mov eax,[fMinArmourPiercing]
cmp dword ptr [rcx+OFFSET_ARMORPIERCING],eax
jge short @f
mov dword ptr [rcx+OFFSET_ARMORPIERCING],eax
mov dword ptr [rcx+OFFSET_ARMORPIERCING+04],eax
mov dword ptr [rcx+OFFSET_ARMORPIERCING+08],eax
@@:

// PsyOffense
cmp dword ptr [bEnableMinPsyOffense],1
jne short @f
cmp dword ptr [rcx+OFFSET_PSY],0
je short @f
mov eax,[fMinPsyOffense]
cmp dword ptr [rcx+OFFSET_PSY],eax
jge short @f
mov dword ptr [rcx+OFFSET_PSY],eax
mov dword ptr [rcx+OFFSET_PSY+04],eax
mov dword ptr [rcx+OFFSET_PSY+08],eax
@@:

// CritChance
cmp dword ptr [bEnableMinCritChance],1
jne short @f
mov eax,[fMinCritChance]
cmp dword ptr [rcx+OFFSET_CRIT],eax
jge short @f
mov dword ptr [rcx+OFFSET_CRIT],eax
mov dword ptr [rcx+OFFSET_CRIT+04],eax
mov dword ptr [rcx+OFFSET_CRIT+08],eax
@@:

// FlankingCritChance
cmp dword ptr [bEnableMinCritChance],1
jne short @f
mov eax,[fMinCritChance]
cmp dword ptr [rcx+OFFSET_FLANKCRIT],eax
jge short @f
mov dword ptr [rcx+OFFSET_FLANKCRIT],eax
mov dword ptr [rcx+OFFSET_FLANKCRIT+04],eax
mov dword ptr [rcx+OFFSET_FLANKCRIT+08],eax
@@:

// DetectionRadius
cmp dword ptr [bEnableMinDetectionRadius],1
jne short @f
mov eax,[fMinDetectionRadius]
cmp dword ptr [rcx+OFFSET_DETECTIONRADIUS],eax
jge short @f
mov dword ptr [rcx+OFFSET_DETECTIONRADIUS],eax
mov dword ptr [rcx+OFFSET_DETECTIONRADIUS+04],eax
mov dword ptr [rcx+OFFSET_DETECTIONRADIUS+08],eax
@@:

/*
// Status
cmp dword ptr [bEnableStatusReset],1
jne short @f
mov byte ptr [rcx+787],2
@@:
*/

readmem(aobRankReader,6)
jmp lblRankReaderRet
aobRankReader_i:
readmem(aobRankReader,6)

aobRankReader:
aobRankReader_r:
jmp lblRankReader
nop
lblRankReaderRet:

[DISABLE]
aobRankReader_r:
aobRankReader_r:
readmem(aobRankReader_i,6)

unregistersymbol(aobRankReader_r)
unregistersymbol(aobRankReader_i)

unregistersymbol(bEnableMinHealth)
unregistersymbol(fMinHealth)
unregistersymbol(bEnableHealing)
unregistersymbol(bEnableMinAim)
unregistersymbol(fMinAim)
unregistersymbol(bEnableMinMobility)
unregistersymbol(fMinMobility)
unregistersymbol(bEnableMinWill)
unregistersymbol(fMinWill)
unregistersymbol(bEnableMinHacking)
unregistersymbol(fMinHacking)
unregistersymbol(bEnableMinSight)
unregistersymbol(fMinSight)
unregistersymbol(bEnableMinDodge)
unregistersymbol(fMinDodge)
unregistersymbol(bEnableMinArmourMitigation)
unregistersymbol(fMinArmourMitigation)
unregistersymbol(bEnableMinArmourPiercing)
unregistersymbol(fMinArmourPiercing)
unregistersymbol(bEnableMinDetectionRadius)
unregistersymbol(fMinDetectionRadius)
unregistersymbol(bEnableMinPsyOffense)
unregistersymbol(fMinPsyOffense)
unregistersymbol(bEnableMinCritChance)
unregistersymbol(fMinCritChance)
unregistersymbol(bEnableStatusReset)

dealloc(newmem)"""

