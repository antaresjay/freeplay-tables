[[cheat]]
id = "credits"
name = "Credits"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(credits,mxgp7-Win64-Shipping.exe,44 8B 81 48 04 00 00)
aobscanmodule(exp,mxgp7-Win64-Shipping.exe,44 8B 81 4C 04 00 00 48)
alloc(newmema,$100,exp)
alloc(newmem,$100,credits)
globalalloc(pCredits,8,$process)
label(code)
label(codea)
label(return)
label(credit)
label(credit_flag)
registersymbol(credit_flag)
label(exp_)
label(exp_flag)
registersymbol(exp_flag)

newmem:
  mov [pCredits],rcx
  cmp [credit_flag],1
  je credit
  jmp code

newmema:
  cmp [exp_flag],1
  je exp_
  jmp code
credit:
  mov [rcx+00000448],#99999999

