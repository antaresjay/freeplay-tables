  add [rcx+0000044C],#1000000

code:
  mov [pCredits],rcx
  mov r8d,[rcx+00000448]
  jmp return
codea:
  mov r8d,[rcx+0000044C]
  jmp return

  credit_flag:
  dd 0
  exp_flag:
  dd 0

credits:
  jmp newmem
  nop 2
exp:
  jmp newmema
  nop 2
return:
registersymbol(credits)

[DISABLE]

