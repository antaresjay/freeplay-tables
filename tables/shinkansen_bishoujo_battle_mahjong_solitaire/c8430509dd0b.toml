dealloc(GamePlayView_basepointer)
dealloc(GamePlayView_update_enable)
dealloc(GamePlayView_timetimeset_enable)
dealloc(GamePlayView_scoretimeset_enable)
dealloc(GamePlayView_combotimeset_enable)
dealloc(GamePlayView_routeset_enable)"""

[[cheat]]
id = "gameplayview-base-address-scan-to-activate-play-level-to-update-play-level"
name = "GamePlayView Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GamePlayView_savedAOB)
label(GamePlayView_returnhere)
label(GamePlayView_originalcode)
label(GamePlayView_exit)

label(GamePlayView_update_exit)
label(GamePlayView_timetimeset_exit)
label(GamePlayView_scoretimeset_exit)
label(GamePlayView_combotimeset_exit)
label(GamePlayView_routeset_exit)

registersymbol(GamePlayView_originalcode)
registersymbol(GamePlayView_savedAOB)

//052495FC - E8 7F000000           - call 05249680
//05249601 - 83 C4 10              - add esp,10
// GamePlayView:Update+14
//05249604 - 0FB6 47 40            - movzx eax,byte ptr [edi+40]
//05249608 - 85 C0                 - test eax,eax
//0524960A - 74 27                 - je 05249633
//0524960C - 8B B7 9C000000        - mov esi,[edi+0000009C]
//05249612 - 83 FE 04              - cmp esi,04
aobscan(GamePlayView_searchedAOB, 0F B6 47 40 85 C0 74 27)

alloc(GamePlayView_newmem, 2048, GamePlayView_searchedAOB)
alloc(GamePlayView_temp1, 4, GamePlayView_searchedAOB)
alloc(GamePlayView_temp2, 4, GamePlayView_searchedAOB)
alloc(GamePlayView_temp3, 4, GamePlayView_searchedAOB)
alloc(GamePlayView_temp4, 4, GamePlayView_searchedAOB)
alloc(GamePlayView_temp5, 4, GamePlayView_searchedAOB)


GamePlayView_newmem:
mov [GamePlayView_temp1], eax
mov [GamePlayView_temp2], ebx
mov [GamePlayView_temp3], ecx
mov [GamePlayView_temp4], edx

cmp dword ptr [GamePlayView_update_enable], #0
je GamePlayView_update_exit
mov [GamePlayView_basepointer], edi
GamePlayView_update_exit:

cmp dword ptr [GamePlayView_timetimeset_enable], #0
je GamePlayView_timetimeset_exit
mov ebx, [edi+58]
test ebx, ebx
je GamePlayView_timetimeset_exit
mov [ebx+24], (float)0
GamePlayView_timetimeset_exit:

cmp dword ptr [GamePlayView_scoretimeset_enable], #0
je GamePlayView_scoretimeset_exit
mov ebx, [edi+6c]
test ebx, ebx
je GamePlayView_scoretimeset_exit
mov [ebx+18], (float)0
GamePlayView_scoretimeset_exit:

cmp dword ptr [GamePlayView_combotimeset_enable], #0
je GamePlayView_combotimeset_exit
mov ebx, [edi+74]
test ebx, ebx
je GamePlayView_combotimeset_exit
fld [ebx+20]
fstp [ebx+24]
GamePlayView_combotimeset_exit:

cmp dword ptr [GamePlayView_routeset_enable], #0
je GamePlayView_routeset_exit
mov ebx, [edi+50]
test ebx, ebx
je GamePlayView_routeset_exit
mov byte ptr [ebx+60], #1
GamePlayView_routeset_exit:

mov eax, [GamePlayView_temp1]
mov ebx, [GamePlayView_temp2]
mov ecx, [GamePlayView_temp3]
mov edx, [GamePlayView_temp4]


GamePlayView_originalcode:
readmem(GamePlayView_searchedAOB, 6)


GamePlayView_exit:
jmp GamePlayView_returnhere


GamePlayView_searchedAOB:
GamePlayView_savedAOB:
jmp GamePlayView_newmem
nop
GamePlayView_returnhere:


[DISABLE]
GamePlayView_savedAOB:
readmem(GamePlayView_originalcode, 6)

unregistersymbol(GamePlayView_originalcode)
unregistersymbol(GamePlayView_savedAOB)

dealloc(GamePlayView_newmem)
dealloc(GamePlayView_temp1)
dealloc(GamePlayView_temp2)
dealloc(GamePlayView_temp3)
dealloc(GamePlayView_temp4)
dealloc(GamePlayView_temp5)"""

