//052495FC - E8 7F000000           - call 05249680
//05249601 - 83 C4 10              - add esp,10
// GamePlayView:Update+14
//05249604 - 0FB6 47 40            - movzx eax,byte ptr [edi+40]
//05249608 - 85 C0                 - test eax,eax
//0524960A - 74 27                 - je 05249633
//0524960C - 8B B7 9C000000        - mov esi,[edi+0000009C]
//05249612 - 83 FE 04              - cmp esi,04
aobscan(GamePlayView_initialization_searchedAOB, 0F B6 47 40 85 C0 74 27)

alloc(GamePlayView_basepointer, 4, GamePlayView_initialization_searchedAOB)
alloc(GamePlayView_update_enable, 4, GamePlayView_initialization_searchedAOB)
alloc(GamePlayView_timetimeset_enable, 4, GamePlayView_initialization_searchedAOB)
alloc(GamePlayView_scoretimeset_enable, 4, GamePlayView_initialization_searchedAOB)
