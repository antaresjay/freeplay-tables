type = "script"
source = """
[ENABLE]
registersymbol(GamePlayView_basepointer)
registersymbol(GamePlayView_update_enable)
registersymbol(GamePlayView_timetimeset_enable)
registersymbol(GamePlayView_scoretimeset_enable)
registersymbol(GamePlayView_combotimeset_enable)
