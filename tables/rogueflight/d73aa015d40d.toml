id = "enemy-low-health"
name = "Enemy Low Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : RogueFlight.exe
  Version: 
  Date   : 2025-01-04
  Author : BabyGroot

  This script does blah blah blah
}

define(address,"GameAssembly.dll"+2C2C4F)
define(bytes,F3 0F 10 BF 24 01 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,"GameAssembly.dll"+2C2C4F)

label(code)
label(return)

newmem:
  mov [rdi+00000124],(float)1           //speed  | Normal 15
  mov [rdi+00000068],#1                 //health
  mov [rdi+000000E0],#1000              //dropLimit

code:
  movss xmm7,[rdi+00000124]
  jmp return

address:
  jmp newmem
  nop 3
return:

[DISABLE]

address:
  db bytes
  // movss xmm7,[rdi+00000124]

dealloc(newmem)"""

