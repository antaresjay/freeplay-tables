[[cheat]]
id = "research-with-custom-multiplier"
name = "Research with Custom Multiplier"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : DistantWorlds2.exe
  Version: 
  Date   : 2022-03-12
  Author : User

  This script does blah blah blah
}

[ENABLE]
aobScanRegion(UpdateResearchProgress, 7ff000000000, 7fffffffffff, C4 C1 78 28 C1 C4 E1 7A 58 40 30) // should be unique
//aobscan(UpdateResearchProgress,C4 C1 78 28 C1 C4 E1 7A 58 40 30) // should be unique
alloc(newmem,$1000,UpdateResearchProgress)

label(code)
label(return)
label(ResearchMultiplier)

newmem:

ResearchMultiplier:
 dq (float)1.0

code:
  cmp word ptr [rsi+408], 1
  jne @f
  vmovaps xmm0,xmm9
  vmulss xmm0,xmm0,[ResearchMultiplier]
  vaddss xmm0,xmm0,[rax+30]
  jmp return

@@:
  vmovaps xmm0,xmm9
  vaddss xmm0,xmm0,[rax+30]
  jmp return

UpdateResearchProgress:
  jmp code
  nop 6
return:
registersymbol(UpdateResearchProgress)
registersymbol(ResearchMultiplier)
[DISABLE]

UpdateResearchProgress:
  db C4 C1 78 28 C1 C4 E1 7A 58 40 30

unregistersymbol(UpdateResearchProgress)
unregistersymbol(ResearchMultiplier)
dealloc(newmem)

