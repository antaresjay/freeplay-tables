[[cheat]]
id = "infinite-water-bombs-lives-time"
name = "Infinite water bombs, lives, time"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
label(label1)
registersymbol(label1)
aobscan(aob1,8B 40 28 85 C0 7E 20)


newmem: //this is allocated memory, you have read,write,execute access
mov [eax+24],3   //lives
mov [eax+28],3   //bombs
mov [eax+48],(float)300   //time

originalcode:
mov eax,[eax+28]
test eax,eax

exit:
jmp returnhere

aob1:
label1:
jmp newmem
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
label1:
db 8B 40 28 85 C0
unregistersymbol(label1)"""
