[[cheat]]
id = "player-stats-base-address-scan-initialization-activate-this-first"
name = "Player Stats Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(playerstats_basepointer)
registersymbol(playerstats_update_enable)
registersymbol(playerstats_opartsset_enable)
registersymbol(playerstats_itemsset_enable)

//011A1A92 - 8B CF                 - mov ecx,edi
//011A1A94 - E8 770A6F00           - call 01892510
// Accesses O-Parts
//011A1A99 - 8B 36                 - mov esi,[esi]
//011A1A9B - 8B CF                 - mov ecx,edi
//011A1A9D - C7 45 FC 00000000     - mov [ebp-04],00000000
//011A1AA4 - E8 A70A6F00           - call 01892550
//011A1AA9 - 8B 4D F4              - mov ecx,[ebp-0C]
//011A1AAC - 8B C6                 - mov eax,esi
//011A1AAE - 5F                    - pop edi
aobscan(playerstats_initialization_searchedAOB, 8B 36 8B CF C7 45 FC 00 00 00 00 * * * * * 8B 4D F4)

alloc(playerstats_basepointer, 4, playerstats_initialization_searchedAOB)
alloc(playerstats_update_enable, 4, playerstats_initialization_searchedAOB)
alloc(playerstats_opartsset_enable, 4, playerstats_initialization_searchedAOB)
alloc(playerstats_itemsset_enable, 4, playerstats_initialization_searchedAOB)


[DISABLE]
unregistersymbol(playerstats_basepointer)
unregistersymbol(playerstats_update_enable)
unregistersymbol(playerstats_opartsset_enable)
unregistersymbol(playerstats_itemsset_enable)

dealloc(playerstats_basepointer)
dealloc(playerstats_update_enable)
dealloc(playerstats_opartsset_enable)
dealloc(playerstats_itemsset_enable)"""

[[cheat]]
id = "player-stats-base-address-scan-to-update-view-menu"
name = "Player Stats Base Address Scan (To Update: View Menu)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstats_update_exit)
label(playerstats_opartsset_exit)
label(playerstats_itemsset_exit)

registersymbol(playerstats_originalcode)
registersymbol(playerstats_savedAOB)

//011A1A92 - 8B CF                 - mov ecx,edi
//011A1A94 - E8 770A6F00           - call 01892510
// Accesses O-Parts
//011A1A99 - 8B 36                 - mov esi,[esi]
//011A1A9B - 8B CF                 - mov ecx,edi
//011A1A9D - C7 45 FC 00000000     - mov [ebp-04],00000000
//011A1AA4 - E8 A70A6F00           - call 01892550
//011A1AA9 - 8B 4D F4              - mov ecx,[ebp-0C]
//011A1AAC - 8B C6                 - mov eax,esi
//011A1AAE - 5F                    - pop edi
aobscan(playerstats_searchedAOB, 8B 36 8B CF C7 45 FC 00 00 00 00 * * * * * 8B 4D F4)

alloc(playerstats_newmem, 2048, playerstats_searchedAOB)
alloc(playerstats_temp1, 4, playerstats_searchedAOB)
alloc(playerstats_temp2, 4, playerstats_searchedAOB)
alloc(playerstats_temp3, 4, playerstats_searchedAOB)
alloc(playerstats_temp4, 4, playerstats_searchedAOB)
alloc(playerstats_temp5, 4, playerstats_searchedAOB)


playerstats_newmem:
mov [playerstats_temp1], eax
mov [playerstats_temp2], ebx
mov [playerstats_temp3], ecx
mov [playerstats_temp4], edx

cmp dword ptr [playerstats_update_enable], #0
je playerstats_update_exit
mov [playerstats_basepointer], esi
playerstats_update_exit:

cmp dword ptr [playerstats_opartsset_enable], #0
je playerstats_opartsset_exit
mov [esi], #999999999
playerstats_opartsset_exit:

cmp dword ptr [playerstats_itemsset_enable], #0
je playerstats_itemsset_exit
mov [esi+10], #3
mov [esi+14], #3
mov [esi+18], #2
mov [esi+28], #3
mov [esi+2c], #3
mov [esi+30], #1
mov [esi+34], #1
mov [esi+38], #1
mov [esi+48], #99
mov [esi+4c], #99
mov [esi+50], #99
mov [esi+58], #5
mov [esi+5c], #5
mov [esi+60], #3
playerstats_itemsset_exit:

mov eax, [playerstats_temp1]
mov ebx, [playerstats_temp2]
mov ecx, [playerstats_temp3]
mov edx, [playerstats_temp4]


playerstats_originalcode:
readmem(playerstats_searchedAOB, 11)


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB:
playerstats_savedAOB:
jmp playerstats_newmem
nop
nop
nop
nop
nop
nop
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
readmem(playerstats_originalcode, 11)

unregistersymbol(playerstats_originalcode)
unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)
dealloc(playerstats_temp1)
dealloc(playerstats_temp2)
dealloc(playerstats_temp3)
dealloc(playerstats_temp4)
dealloc(playerstats_temp5)"""

