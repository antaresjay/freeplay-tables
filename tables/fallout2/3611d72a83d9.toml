[[cheat]]
id = "aob-script-infinite-ap"
name = "AOB script: Infinite AP"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(aobAPChecker,fallout2,83 78 40 00 7F 09)

alloc(newmem,2048)

label(aobAPChecker_r)
registersymbol(aobAPChecker_r)

label(lblAPChecker)
label(lblAPCheckerSkip)
label(lblAPCheckerRet)

label(bEnableMinAP)
label(iMinAP)
registersymbol(bEnableMinAP)
registersymbol(iMinAP)

newmem:
bEnableMinAP:
dd 1
iMinAP:
dd (int)10

lblAPChecker:
push edx
cmp dword ptr [bEnableMinAP],1
jne short lblAPCheckerSkip
mov edx,[iMinAP]
cmp dword ptr [eax+40],edx
jge short lblAPCheckerSkip
mov dword ptr [eax+40],edx
lblAPCheckerSkip:
pop edx
cmp dword ptr [eax+40],00 // Original code
jg fallout2+22879         // Original code
jmp lblAPCheckerRet

//"fallout2"+2286A:
aobAPChecker:
aobAPChecker_r:
jmp lblAPChecker
nop
lblAPCheckerRet:

[DISABLE]
aobAPChecker_r:
//"fallout2"+2286A:
//Alt: cmp dword ptr [eax+40],00
//Alt: jg fallout2+22879
db 83 78 40 00 7F 09

unregistersymbol(aobAPChecker_r)

unregistersymbol(bEnableMinAP)

dealloc(newmem)"""

