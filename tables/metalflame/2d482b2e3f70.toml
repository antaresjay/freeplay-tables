[[cheat]]
id = "globalptr-enable-and-save-game-to-make-globalptr-valid"
name = "_GlobalPtr(Enable and save game to make _GlobalPtr valid)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{Author : para}

define(address, Global:OnGameSave+45)
define(bytes, 48 8B 00 48 89 45 B8)
alloc(_GlobalPtr,8)

[ENABLE]
assert(address, bytes)
alloc(newmem, $1000, address)

label(code)
label(return)

newmem:
  push rbx              // 1. 把 rbx 的原始值压入栈保存
  mov rbx, [rax]        // 2. 将 [rax] 指向的真正地址读入 rbx
  mov [_GlobalPtr], rbx // 3. 将这个地址保存到你的变量中
  pop rbx               // 4. 从栈中恢复 rbx 的原始值，确保不干扰游戏逻辑
code:
  mov rax,[rax]
  mov [rbp-48],rax
  jmp return
address:
  jmp newmem
  nop 2
return:
  registerSymbol(_GlobalPtr)
[DISABLE]
address:
   db bytes


dealloc(newmem)
dealloc(_GlobalPtr)
unregisterSymbol(_GlobalPtr)


