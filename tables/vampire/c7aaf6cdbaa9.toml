[[cheat]]
id = "no-recoil"
name = "No Recoil"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(norecoilcd1,vampire.dll,28 D9 86 00 1F 00 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  mov [esi+00001EFC],0
  fld dword ptr [esi+00001F00]
  jmp return

norecoilcd1+01:
  jmp newmem
  nop
return:
registersymbol(norecoilcd1)

aobscanmodule(norecoilcd2,vampire.dll,D8 D9 86 FC 1E 00 00) 
alloc(newmem2,$1000)

label(code2)
label(return2)

newmem2:
code2:
  mov [esi+00001F00], 0
  fld dword ptr [esi+00001EFC]
  jmp return2

norecoilcd2+01:
  jmp newmem2
  nop
return2:
registersymbol(norecoilcd2)


[DISABLE]

norecoilcd1+01:
  db D9 86 00 1F 00 00

unregistersymbol(norecoilcd1)
dealloc(newmem)

norecoilcd2+01:
  db D9 86 FC 1E 00 00

unregistersymbol(norecoilcd2)
dealloc(newmem2)"""
