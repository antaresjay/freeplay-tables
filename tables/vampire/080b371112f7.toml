[[cheat]]
id = "no-damage-to-all"
name = "No Damage to ALL"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(health,Vampire.exe,D8 64 24 10 56) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
//  fsub dword ptr [esp+10]
  push esi
  jmp return

health:
  jmp newmem
return:
registersymbol(health)

[DISABLE]

health:
  db D8 64 24 10 56

unregistersymbol(health)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: Vampire.exe+5201D

