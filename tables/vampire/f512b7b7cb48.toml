[[cheat]]
id = "new-char-stat-points"
name = "new char stat points"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(stats,2048)
registersymbol(stats)
label(returnhere)
label(originalcode)
label(exit)

stats:
dd 0
originalcode:
pushf
cmp ecx,[stats]
jng @f
lea esi,[ecx]
mov [stats],esi
@@:
popf
mov esi,[ecx]
add ecx,08

exit:
jmp returnhere

"client.dll"+17DC0E:
jmp originalcode
returnhere:


 
 
[DISABLE]
dealloc(stats)
"client.dll"+17DC0E:
mov esi,[ecx]
add ecx,08
//Alt: db 8B 31 83 C1 08"""

