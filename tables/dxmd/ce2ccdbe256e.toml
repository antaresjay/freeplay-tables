[[cheat]]
id = "inventory"
name = "Inventory"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(InventoryAddress, DXMD.exe, 48 8B 0B E8 ? ? ? ? 48 85 C0 )
aobscanmodule(functiontocall, DXMD.exe, 49 89 D2 4C 8B 41 18)
RegisterSymbol(InventoryAddress)
RegisterSymbol(functiontocall)
alloc(itemaddress,8,DXMD.exe)
registersymbol(itemaddress)
alloc(newmem,1024,DXMD.exe)
label(returnhere)
label(originalcode)
label(exit)

newmem:
cmp rsi, 0
jne originalcode
cmp rax, 0
jne originalcode
cmp rdi, 4
jne originalcode
//mov rcx,[rbx]
mov [itemaddress],rbx
originalcode:
mov rcx,[rbx]
call functiontocall
exit:
jmp returnhere

InventoryAddress:
jmp newmem
nop
nop
nop
returnhere:

[DISABLE]
UnregisterSymbol(InventoryAddress)
UnregisterSymbol(functiontocall)
dealloc(itemaddress)
dealloc(InventoryAddress)
dealloc(functiontocall)
unregistersymbol(itemaddress)
dealloc(newmem)
dealloc(returnhere)
dealloc(originalcode)
dealloc(exit)
InventoryAddress:
mov rcx,[rbx]
call functiontocall"""

