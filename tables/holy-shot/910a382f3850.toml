type = "script"
source = """
{  Game Executable   : Holy Shot.exe
   Script Date       : 2025-09-28
   Author            : Sianz
}

[ENABLE]
aobscanregion(aobangel,Entities.Angel:get_LifePoints,Entities.Angel:get_LifePoints+50,48 63 46 ?? 48 8B 34 24)
alloc(memangel,$1000,aobangel)
alloc(resangel,8)
alloc(l_angel,8)
label(retangel codangel)
registersymbol(aobangel l_angel resangel)
memangel:
test rsi,rsi
je s_angel
mov [l_angel],rsi
s_angel:
codangel:
readmem(aobangel,8)
jmp retangel
aobangel:
jmp memangel
nop 3
retangel:
resangel:
readmem(aobangel,8)
[DISABLE]
aobangel:
readmem(resangel,8)
unregistersymbol(*)
dealloc(*)"""

