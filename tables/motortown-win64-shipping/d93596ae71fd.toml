source = """
[ENABLE]
// Money/Stats Table
aobscanmodule(MoneyInjectionPoint,MotorTown-Win64-Shipping.exe,48 2B 8B D0 02 00 00)
alloc(MoneyPTR,$1000,MoneyInjectionPoint)
// By Flexy
label(code return)

