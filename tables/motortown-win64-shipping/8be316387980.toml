[[cheat]]
id = "1-mill-on-spend"
name = "1 Mill on spend"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : MotorTown-Win64-Shipping.exe
  Version: 
  Date   : 2025-05-02
  Author : Bobbeh

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(INJECT,MotorTown-Win64-Shipping.exe,49 8B C7 48 2B C1 48 89) // should be unique
alloc(newmem,$1000,INJECT)

label(code)
label(return)

newmem:

code:
  mov rax,r15
  mov rcx,(int)1000000
  sub rax,rcx
  jmp return

INJECT:
  jmp newmem
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 49 8B C7 48 2B C1

unregistersymbol(INJECT)
dealloc(newmem)"""

