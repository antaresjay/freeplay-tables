[[cheat]]
id = "inventory-options-add-category-specific-item-set-minimum-you-have-at-least-1-of-when-viewing-items"
name = "Inventory Options (Add Category/Specific Item, Set Minimum You Have At Least 1 Of) (When Viewing Items)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(InventoryOptionsAOB,$process,0F B6 84 08 80 35 00 00 48 83 C4 28) // should be unique
alloc(newmem,1024,InventoryOptionsAOB)
registersymbol(InventoryOptionsAOB)

label(return)
label(originalcode)
label(MinAmt)
registersymbol(MinAmt)
label(SetMinItems)
registersymbol(SetMinItems)
label(CategoryToAdd)
registersymbol(CategoryToAdd)
label(SpecificItemToAdd)
registersymbol(SpecificItemToAdd)

newmem:
  test eax,eax
  je ResetLoopCount
  inc [LoopCount]
  jmp StartCode
ResetLoopCount:
  mov qword ptr [LoopCount],0
StartCode:
  mov [R15Save],r15
  mov [R8Save],r8
  cmp [SpecificItemToAdd],0
  je CheckCategoryToAdd
  cmp eax,[SpecificItemToAdd]
  jne CheckCategoryToAdd
  mov r8l,[MinAmt]
  mov [rax+rcx+00003580],r8l
  xor r8,r8
CheckCategoryToAdd:
  cmp byte ptr [CategoryToAdd],0
  jle CheckSetMinItems
  mov r15,ItemCategories
  add r15,[LoopCount]
  mov r8l,[CategoryToAdd]
  cmp [r15],r8l
  jne CheckSetMinItems
  mov r8l,[MinAmt]
  mov [rax+rcx+00003580],r8l
  xor r8,r8
CheckSetMinItems:
  mov r8,[R8Save]
  mov r15,[R15Save]
  cmp [SetMinItems],0
  je originalcode
  cmp byte ptr [rax+rcx+0003580],0
  je originalcode
  mov r8l,[MinAmt]
  mov [rax+rcx+00003580],r8l
  xor r8,r8
  
originalcode:
  movzx eax,byte ptr [rax+rcx+00003580]
  jmp return 

R8Save:
dq 0
R15Save:
dq 0
LoopCount:
dq 0
SetMinItems:
dq 0
CategoryToAdd:
dq 0
SpecificItemToAdd:
dq FFFF
MinAmt:
dq #25

InventoryOptionsAOB:
  jmp newmem
  nop
  nop
  nop
return:

[DISABLE]

InventoryOptionsAOB:
  db 0F B6 84 08 80 35 00 00

unregistersymbol(InventoryOptionsAOB)
unregistersymbol(MinAmt)
unregistersymbol(SetMinItems)
unregistersymbol(CategoryToAdd)
unregistersymbol(SpecificItemToAdd)

dealloc(newmem)"""

