[[cheat]]
id = "damage-modifier-script-god-mode-one-hit-kill-etc"
name = "Damage Modifier Script (God Mode, One Hit Kill, etc.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DamageModAOB,$process,46 8B 0C 81 42 8B 44 81 08 44 03 CA) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,1024,DamageModAOB)

label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

newmem:
  movd xmm15,edx
  cvtdq2ps xmm15,xmm15
  mov eax,[rcx+r8*4]
  mov [CurrentHP],eax
  cmp dword ptr [rcx+25C],0
  je EnemyHit
HeroHit:
  comiss xmm15,[ZeroFloat]
  jb HeroDamageHit
  jmp CleanUp
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  mulss xmm15,[fHeroDamageMult]
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xorps xmm15,xmm15
  jmp CleanUp
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne CleanUp
  mulss xmm15,[NegOneFloat]
  cvtss2si edx,xmm15
  cmp edx,[CurrentHP]
  jl @F
  xorps xmm15,xmm15
@@:
  mulss xmm15,[NegOneFloat]
  jmp CleanUp  
EnemyHit:
  comiss xmm15,[ZeroFloat]
  jb EnemyDamageHit
  jmp CleanUp
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckOneHitKill
  mulss xmm15,[fEnemyDamageMult]
CheckOneHitKill:
  cmp [OneHitKill],1
  jne CleanUp
  movss xmm15,[OneHitKillHP]
  jmp CleanUp

CleanUp:    
  cvtss2si edx,xmm15
  xorps xmm15,xmm15
  mov r9d,[rcx+r8*4]
  mov eax,[rcx+r8*4+08]
  jmp return

CurrentHP:
dq 0
ZeroFloat:
dq (float)0.0
OneHitKillHP:
dq (float)-99999.0
NegOneFloat:
dq (float)-1.0
GodMode:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)1.0
fHeroDamageMult:
dq (float)0.5
HeroCannotDie:
dq 1

DamageModAOB:
  jmp newmem
  nop
  nop
  nop
  nop
return:

[DISABLE]

DamageModAOB:
  db 46 8B 0C 81 42 8B 44 81 08

unregistersymbol(DamageModAOB)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fHeroDamageMult)
unregistersymbol(HeroCannotDie)

dealloc(newmem)"""

