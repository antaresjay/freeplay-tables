[[cheat]]
id = "defense-capacity-ohk"
name = "Defense Capacity + OHK"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game   : KINGDOM HEARTS II FINAL MIX.exe
  Version: 1.0
  Date   : 2025-01-20
  Author : Gear2

  Change defense capacity.
}

[ENABLE]

aobscanmodule(defense,KINGDOM HEARTS II FINAL MIX.exe,44 03 ca 44 3b c8)
alloc(newmem,2048,defense)
alloc(dmgMod,4,defense)
alloc(saveRAX,8,defense)
alloc(killF,4,defense)

label(player hit ohk code return)

dmgMod:
  db #10

killF:
  db 1

newmem:
  cmp [rcx+270],0
  jne ohk
  cmp edx,0
  jg code

player:
  mov [saveRAX],rax
  mov eax,edx
  cdq
  idiv dword ptr [dmgMod]
  mov edx,eax
  cmp edx,0
  je hit
  mov rax,[saveRAX]
  add r9d,edx
  cmp r9d,eax
  jmp return

hit:
  mov edx,#-1

ohk:
  cmp [killF],0
  jz code
  cmp [rcx+270],0
  je code
  add r9d,80000000
  cmp r9d,eax
  jmp return

code:
  add r9d,edx
  cmp r9d,eax
  jmp return

defense:
  jmp newmem
  nop
return:
registersymbol(defense dmgMod killF)

[DISABLE]

defense:
  db 44 03 CA 44 3B C8

unregistersymbol(*)
dealloc(*)"""

