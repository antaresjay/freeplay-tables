[[cheat]]
id = "gummi-score-multiplier"
name = "Gummi Score Multiplier"
category = "game"
description = ""
hint = ""
type = "script"
source = """
{ Game   : KINGDOM HEARTS II FINAL MIX.exe
  Version: 1.0
  Date   : 2025-02-12
  Author : Gear2

  Gummi score.
}

[ENABLE]

aobscanmodule(gummiScore,KINGDOM HEARTS II FINAL MIX.exe,03 0d ? ? ? ? 89 0d)
alloc(newmem,2048,gummiScore)
alloc(scoreMod,4,gummiScore)

label(code return)

scoreMod:
  dd #8

newmem:
  imul ecx,[scoreMod]
  add ecx,["KINGDOM HEARTS II FINAL MIX.exe"+72B130]
  jmp return

code:
  //add ecx,["KINGDOM HEARTS II FINAL MIX.exe"+72B130]
  //jmp return

gummiScore:
  jmp newmem
  nop
return:
registersymbol(gummiScore scoreMod)

[DISABLE]

gummiScore:
  db 03 0D D1 36 52 00

unregistersymbol(*)
dealloc(*)"""

