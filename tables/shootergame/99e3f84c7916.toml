  jmp return

align 4 CC

infhealth_data:
dd 0 // OKH
dd 0 // Damage Multiplicator flag
dd (float)1 // Damage Multiplicator Value
dd 0 // Constant1
dd (float)9999999

infhealth+02:
  jmp newmem
  nop
return:
registersymbol(infhealth)

[DISABLE]

infhealth+02:
  db F3 0F 10 44 24 74

unregistersymbol(infhealth)
unregistersymbol(infhealth_data)
dealloc(newmem)

