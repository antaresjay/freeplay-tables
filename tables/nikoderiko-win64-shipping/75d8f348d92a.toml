// Game Executable   : Nikoderiko-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 4.27.2.0
// Game Version      : Build.18097949
// Script Date       : 2025-04-17


[ENABLE]

aobscanmodule(master,Nikoderiko-Win64-Shipping.exe,488BxxF2xxxxxxxxxxFFxxxxxxxxxx0F28xxxxxx4883) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,9)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,9)

newmem:
  mov [data],rcx

code:
  readmem(master,9)
  jmp return

master:
  jmp newmem
  nop 4
return:

[DISABLE]

master:
  readmem(masterbkp,9)

unregistersymbol(*)
dealloc(*)"""
