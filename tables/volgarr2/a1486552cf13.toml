type = "script"
source = """
// Game Executable   : Volgarr2.exe
// Author            : ndck76
// Executable Version: 1.3.6.2
// Game Version      : v1.0c
// Script Date       : 2024-08-07


[ENABLE]

aobscanmodule(ohk,Volgarr2.exe,418Bxxxx3Bxx7Cxx80) //Volgarr2.CombatUtils::playAttackEffectAndSound+2E
alloc(newmem,$1000,ohk)
alloc(ohkbkp,6)
registersymbol(ohk)
registersymbol(ohkbkp)
label(code)
label(return)

ohkbkp:
  readmem(ohk,6)

newmem:
  mov [r8+60],0

code:
  readmem(ohk,6)
  jmp return

ohk:
  jmp newmem
  nop
return:

[DISABLE]

ohk:
  readmem(ohkbkp,6)

unregistersymbol(*)
dealloc(*)"""
