[[cheat]]
id = "cityevents"
name = "CityEvents"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Pocket City 2.exe
  Version: 
  Date   : 2025-09-05
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,CityEvents:Update)
define(bytes,55 48 8B EC 48 81 EC D0 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,CityEvents:Update)

label(code)
label(return)

newmem:

mov [cityevents_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,000000D0
  jmp return

cityevents_ptr:
dq 0

address:
  jmp newmem
  nop 6
return:
registersymbol(cityevents_ptr)

[DISABLE]

address:
  db bytes
  // push rbp
  // mov rbp,rsp
  // sub rsp,000000D0

dealloc(newmem)
unregistersymbol(cityevents_ptr)"""

