[[cheat]]
id = "no-reload"
name = "No Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(noreload,SOTTR.exe,8B 83 A0 05 00 00 89) // should be unique
alloc(newmem,$1000,noreload)

label(code)
label(return)

newmem:
mov [rbx+000005A0], #50
code:
  mov eax,[rbx+000005A0]
  jmp return

noreload:
  jmp newmem
  nop
return:
registersymbol(noreload)

[DISABLE]

noreload:
  db 8B 83 A0 05 00 00

unregistersymbol(noreload)
dealloc(newmem)"""
