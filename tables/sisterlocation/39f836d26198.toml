source = """
[ENABLE]



aobscanmodule(skipnight,SisterLocation.exe,2B B2 D8 00 00 00)
alloc(newmem,$1000)

label(code)
label(return)
registersymbol(skipnightE)
label(skipnightE)

newmem:

code:
cmp [skipnightE],0
je @f
mov [skipnightE],0
