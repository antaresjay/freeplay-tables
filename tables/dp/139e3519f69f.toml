[[cheat]]
id = "inf-health"
name = "Inf. Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
label(Health)
registersymbol(Health)
aobscan(aobHealth,D9 82 50 03 00 00 83 EC 0C)

label(pHealth)
registersymbol(pHealth)

newmem:
mov [pHealth],edx
push ebx
mov ebx,[edx+354]
mov [edx+350],ebx
pop ebx
jmp originalcode

originalcode:
fld dword ptr [edx+00000350]

exit:
jmp returnhere

pHealth:
dd 0

aobHealth:
Health:
jmp newmem
nop
returnhere:

[DISABLE]
dealloc(newmem)
unregistersymbol(Health)
unregistersymbol(pHealth)
Health:
db D9 82 50 03 00 00"""

