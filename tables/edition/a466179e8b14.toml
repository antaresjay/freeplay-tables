type = "script"
source = """
{ Game   : Outward Definitive Edition.exe
  Version: 
  Date   : 2023-11-17
  Author : Avalon

  This script does blah blah blah
}

[ENABLE]

aobscan(ManaB,F3 0F 10 80 68 02 00 00 F3 0F 5A C0 F2 0F 5A E8 F3 0F 11 6D CC) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

mov [rax+00000268],(float)99999
mov [rax+00000264],(float)0

code:
