[[cheat]]
id = "unlimited-hp"
name = "Unlimited HP"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
AOBSCANMODULE(GET_HP, Yakuza0.exe, 0FB7 40 16 66 0F6E C0 0F5B C0 0F2E C8)
ALLOC(GET_HP_NEW, $1000, Yakuza0.exe)
LABEL(GET_HP_RETURN)
REGISTERSYMBOL(GET_HP)

GET_HP:
  jmp GET_HP_NEW
  nop
  nop
  nop
GET_HP_RETURN:

GET_HP_NEW:
  mov word ptr [rax+16], #5000
  movzx eax,word ptr [rax+16]
  movd xmm0,eax
  jmp GET_HP_RETURN

[DISABLE]
GET_HP:
  movzx eax,word ptr [rax+16]
  movd xmm0,eax

UNREGISTERSYMBOL(GET_HP)
DEALLOC(GET_HP_NEW)"""

