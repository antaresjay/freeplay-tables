[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]



aobscanmodule(items,ACIII.exe,74 07 8B 41 38)
alloc(newmem,$1000,items)

label(code)
label(return)

registersymbol(itemsE)
label(itemsE)
newmem:
code:
pushfq
push rsi
mov rsi,itemsE
@@:
mov eax,[rcx+08]
cmp eax,01
jne @f
cmp [rsi],0
je @f
mov [rcx+10],#9999999

@@:
cmp eax,0B
jne @f
cmp [rsi+4],0
je @f
mov [rcx+10],6

@@:
cmp eax,1f
jne @f
cmp [rsi+8],0
je @f
mov [rcx+10],6

@@:
cmp eax,5
jne @f
cmp [rsi+c],0
je @f
mov [rcx+10],6
@@:
pop rsi
popfq
je @f
mov eax,[rcx+38]
add eax,[rcx+10]
ret
@@:
mov eax,[rcx+10]
ret

jmp return
itemsE:
dd 0
items:
jmp newmem
return:
registersymbol(items)

[DISABLE]

items:
db 74 07 8B 41 38
unregistersymbol(itemsE)
unregistersymbol(items)
dealloc(newmem)"""

