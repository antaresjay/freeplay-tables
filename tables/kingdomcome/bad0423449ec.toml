[[cheat]]
id = "no-weight"
name = "No Weight"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@FearlessRevolution
[ENABLE]

aobscanmodule(weight,WHGame.DLL,F3 0F 10 7D 1C E9)e
alloc(newmem,$1000,weight)
label(code return)

newmem:

code:
  movss xmm7,[rbp+1C]
  xorps xmm7,xmm7
  jmp return

weight:
  jmp newmem
return:
registersymbol(weight)

[DISABLE]

weight:
  db F3 0F 10 7D 1C

unregistersymbol(*)
dealloc(*)"""

[[cheat]]
id = "easy-dice-win"
name = "Easy Dice Win"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@FearlessRevolution
[ENABLE]

aobscanmodule(dice,WHGame.DLL,89 41 30 44 3B C0)
alloc(newmem,$1000,dice)
label(code return)

newmem:
cmp dword ptr [rcx+48],#0
jne code
mov [rcx+30],#5000
jmp return

code:
  mov [rcx+30],eax
  cmp r8d,eax
  jmp return

dice:
  jmp newmem
  nop
return:
registersymbol(dice)

[DISABLE]

dice:
  db 89 41 30 44 3B C0

unregistersymbol(*)
dealloc(*)

//WHGame.DLL+2DBDD7A: 89 41 30        - mov [rcx+30],eax"""

[[cheat]]
id = "enable-combat-modifiers"
name = "Enable Combat Modifiers"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
//Send@FearlessRevolution
[ENABLE]

aobscanmodule(health,WHGame.DLL,0F 2F 83 E8 06 00 00 73 29)
alloc(newmem,$1000,health)
registersymbol(hp ohk)
label(code return hp ohk)

newmem:
cmp [hp],1
jne @f
cmp dword ptr [rbx+0B08],0
jne @f
mov [rbx+6E8],(float)9999
jmp return

@@:
cmp [ohk],1
jne code
cmp dword ptr [rbx+0B08],0
je code
mov [rbx+6E8],(float)1
jmp code

code:
  comiss xmm0,[rbx+000006E8]
  jmp return

hp:
dd 0

ohk:
dd 0

health:
  jmp newmem
  nop 2
return:
registersymbol(health)

[DISABLE]

health:
  db 0F 2F 83 E8 06 00 00

unregistersymbol(*)
dealloc(*)"""

