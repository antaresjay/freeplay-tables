type = "script"
source = """
//Send
[ENABLE]

aobscanregion(build1,BaseBuilding:Place+59f,BaseBuilding:Place+61d,0F B6 80 74 01 00 00 85 C0 74)
alloc(newmem,$1000,build1)

label(code)
label(return)

newmem:

code:
  mov byte ptr [rax+174],1
  mov byte ptr [rax+175],1
  jmp return

build1:
  jmp newmem
  nop 2
return:
registersymbol(build1)

[DISABLE]

build1:
  db 0F B6 80 74 01 00 00

unregistersymbol(*)
dealloc(*)"""
