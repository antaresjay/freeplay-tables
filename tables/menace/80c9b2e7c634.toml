  mov rcx,[rax+88]    //Menace.StrategyState.BlackMarket
  test rcx,rcx
  jz check_squaddie
  call Menace.Strategy.BlackMarket.FillUp

check_squaddie:

  cmp [bool_addSquaddie],1
  jne skip_call
