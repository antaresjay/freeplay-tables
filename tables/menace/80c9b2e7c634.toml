  movdqu xmm9,  [rsp+0x100]
  movdqu xmm10, [rsp+0x110]
  movdqu xmm11, [rsp+0x120]
  movdqu xmm12, [rsp+0x130]
  movdqu xmm13, [rsp+0x140]
  movdqu xmm14, [rsp+0x150]
  movdqu xmm15, [rsp+0x160]


  mov rax, [rsp+0x00]
  mov rbx, [rsp+0x08]
  mov rcx, [rsp+0x10]
  mov rdx, [rsp+0x18]
  mov rsi, [rsp+0x20]
  mov rdi, [rsp+0x28]
  mov r8,  [rsp+0x30]
  mov r9,  [rsp+0x38]
  mov r10, [rsp+0x40]
  mov r11, [rsp+0x48]
  mov r12, [rsp+0x50]
  mov r13, [rsp+0x58]
  mov r14, [rsp+0x60]
  mov r15, [rsp+0x68]

  mov rsp,rbp
  pop rbp

injStrategyUpdateBkp:
  readmem(injStrategyUpdate,14)
  jmp return

injStrategyUpdate:
  jmp far newmem
return:
registersymbol(injStrategyUpdate injStrategyUpdateBkp strategy_state bool_refreshBM bool_addSquaddie)

