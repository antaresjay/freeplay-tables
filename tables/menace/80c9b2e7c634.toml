[ENABLE]

define(injStrategyUpdate,Menace.States.StrategyState.OnUpdate) // should be unique
alloc(newmem,$1000)
alloc(strategy_state,8)
label(injStrategyUpdateBkp)
label(return)

alloc(bool_refreshBM,8)
bool_refreshBM:
  dd 0

alloc(bool_addSquaddie,8)
bool_addSquaddie:
  dd 0

newmem:
  mov [strategy_state],rcx
  push rbp
  mov rbp,rsp
  sub rsp,0x1B0

  // Save General Purpose Registers
  mov [rsp+0x00], rax
  mov [rsp+0x08], rbx
  mov [rsp+0x10], rcx
  mov [rsp+0x18], rdx
  mov [rsp+0x20], rsi
  mov [rsp+0x28], rdi
  mov [rsp+0x30], r8
  mov [rsp+0x38], r9
  mov [rsp+0x40], r10
  mov [rsp+0x48], r11
  mov [rsp+0x50], r12
  mov [rsp+0x58], r13
  mov [rsp+0x60], r14
  mov [rsp+0x68], r15

  // Save XMM Registers (Volatile: 0-5 are usually enough, but saving 0-15 is safer)
  movdqu [rsp+0x70], xmm0
  movdqu [rsp+0x80], xmm1
  movdqu [rsp+0x90], xmm2
  movdqu [rsp+0xA0], xmm3
  movdqu [rsp+0xB0], xmm4
