[[cheat]]
id = "game-time-ctrl-numpad-2"
name = "Game Time (Ctrl + Numpad 2)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Fischer'sFishingJourney.exe
// Author            : ndck76
// Executable Version: 2021.3.20.61691
// Game Version      : v1.0.1
// Script Date       : 2025-08-11


[ENABLE]

aobscanregion(minute,ProjectCode.GameTime:CalTime,ProjectCode.GameTime:CalTime+200,4863xxxx6Bxxxx2Bxx89xxxx48xxxxxx48xxxxxx5DC3) //ProjectCode.GameTime:CalTime+135
alloc(newmem,$1000,minute)
alloc(data4,8)
alloc(minutebkp,7)
registersymbol(data4)
registersymbol(minute)
registersymbol(minutebkp)
label(code)
label(return)

minutebkp:
  readmem(minute,7)

newmem:
  mov [data4],rsi

code:
  readmem(minute,7)
  jmp return

minute:
  jmp newmem
  nop 2
return:

[DISABLE]

minute:
  readmem(minutebkp,7)

unregistersymbol(*)
dealloc(*)"""

