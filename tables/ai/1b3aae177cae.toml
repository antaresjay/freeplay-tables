[[cheat]]
id = "health-access"
name = "Health Access"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem, 512)
aobscanmodule(healthAccess_aob, AI.exe, 8B 4C 24 18 ?? ?? 0F B7 86 3C 03 00 00 66 85 C0)
registersymbol(healthAccess_aob)

label(healthAccess)
label(healthAccess_ret)
label(healthAccess_orig)
label(healthAccess_end)
label(invisibility)
label(invisibility_orig)

label(health_amt)
registersymbol(health_amt)
label(health_add)
registersymbol(health_add)
label(en_healthAccess)
registersymbol(en_healthAccess)
label(en_invisibility)
registersymbol(en_invisibility)

healthAccess_aob+06:
jmp healthAccess
db 90 90 90 90 90
healthAccess_ret:

newmem:
healthAccess:
/*
cmp [esi+10],'Char'
jne healthAccess_end
cmp [esi+14],'acte'
jne healthAccess_end
*/
cmp [esi+2D8],0
jne healthAccess_end
cmp [esi+2E4],1
jne healthAccess_end
cmp [esi+310],1
jne healthAccess_end
cmp [esi+314],1
jne healthAccess_end
mov [health_add],esi
cmp [en_healthAccess],1
jne healthAccess_orig
mov ax,word ptr [health_amt]
mov [esi+0000033C],ax

healthAccess_orig:
movzx eax,word ptr [esi+0000033C] // 0F B7 86 3C 03 00 00

invisibility:
cmp [en_invisibility],1
jne invisibility_orig
test [en_invisibility],0
jmp healthAccess_ret

invisibility_orig:
test ax,ax // 66 85 C0
jmp healthAccess_ret

healthAccess_end:
movzx eax,word ptr [esi+0000033C] // 0F B7 86 3C 03 00 00
jmp healthAccess_ret

health_amt:
dd #1000

health_add:
dd 0

en_healthAccess:
dd 0

en_invisibility:
dd 0

[DISABLE]
healthAccess_aob+06:
db 0F B7 86 3C 03 00 00 // movzx eax,word ptr [esi+0000033C]
db 66 85 C0 // test ax,ax

unregistersymbol(healthAccess_aob)
unregistersymbol(health_amt)
unregistersymbol(health_add)
unregistersymbol(en_healthAccess)
unregistersymbol(en_invisibility)

dealloc(newmem)"""

