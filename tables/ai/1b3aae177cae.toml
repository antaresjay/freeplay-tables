[[cheat]]
id = "no-item-decrease"
name = "No Item Decrease"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem, 256)
aobscanmodule(itemDec_aob, AI.exe, 8D 04 80 FF 4C 86 70 8D 0C 86 32 C0)
registersymbol(itemDec_aob)

label(returnhere)
label(originalcode)

label(itemDec_add)
registersymbol(itemDec_add)
label(en_itemDec)
registersymbol(en_itemDec)

itemDec_aob:
jmp newmem
db 90 90
returnhere:

newmem:
lea eax,[eax+eax*4]
push ebx
lea ebx,[esi+eax*4+70]
mov [itemDec_add],ebx
pop ebx
cmp [en_itemDec], 1
jne originalcode
inc [esi+eax*4+70]

originalcode:
dec [esi+eax*4+70]
jmp returnhere

itemDec_add:
dd 0

en_itemDec:
dd 0

[DISABLE]
itemDec_aob:
lea eax,[eax+eax*4] // 8D 04 80
dec [esi+eax*4+70] // FF 4C 86 70

unregistersymbol(healthAccess_aob)
unregistersymbol(en_itemDec)

dealloc(newmem)"""

