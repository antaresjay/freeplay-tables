[[cheat]]
id = "grab-money-data-open-tablet"
name = "Grab Money Data (Open Tablet)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(EconomyData,QZSim-Win64-Shipping.exe,C3 8B 81 B0 00 00 00 C3)
alloc(newmem,$1000,EconomyData)
registersymbol(getEconomy)
label(code return getEconomy)
//Send@FearlessRevolution|Sintrix
newmem:
mov [getEconomy],rcx

code:
  mov eax,[rcx+000000B0]
  jmp return

getEconomy:
dw

EconomyData+01:
  jmp newmem
  nop
return:
registersymbol(EconomyData)

[DISABLE]

EconomyData+01:
  db 8B 81 B0 00 00 00

unregistersymbol(*)
dealloc(*)"""

