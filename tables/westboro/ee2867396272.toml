[[cheat]]
id = "undead"
name = "undead"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
define(mindamage,#1)

aobscanregion(healthCalOnHitAOB,ReceiveDamage:TakeDamage,ReceiveDamage:TakeDamage+7ce,8B 89 80 00 00 00 2B CE)
registersymbol(healthCalOnHitAOB)

label(dMinHealth)
registersymbol(dMinHealth)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
push eax
cmp [ecx+94],1
jne @f
mov eax,[ecx+80]
sub eax,esi
cmp eax,[dMinHealth]
jge @f
mov eax,[dMinHealth]
add eax,esi
mov [ecx+80],eax

originalcode:
pop eax //
mov ecx,[ecx+00000080]

exit:
jmp returnhere

///
dMinHealth:
dd mindamage
///

healthCalOnHitAOB: //ReceiveDamage:TakeDamage+215:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
healthCalOnHitAOB: //ReceiveDamage:TakeDamage+215:
db 8B 89 80 00 00 00
//Alt: mov ecx,[ecx+00000080]

unregistersymbol(dMinHealth)"""

