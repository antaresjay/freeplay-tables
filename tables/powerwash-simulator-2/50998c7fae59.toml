name = "Complete Cleaning Progress (Ctrl + Numpad 3)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : PowerWash Simulator 2.exe
// Author            : ndck76
// Executable Version: 6000.0.43.10027
// Game Version      : Build.20300058
// Script Date       : 2025-10-31


[ENABLE]

aobscanmodule(progress,GameAssembly.dll,F3xxxxxxxxxxxxxx4Dxxxx0F84xxxxxxxxB9xxxxxxxxF3) //FuturLab.PW2.LevelSaveDataExtensions.UpdateProgressFromTargets
alloc(newmem,$1000,progress)
alloc(progressbkp,8)
registersymbol(progress)
registersymbol(progressbkp)
label(code)
label(return)

progressbkp:
  readmem(progress,8)

newmem:
  mov [rbx+000000D0],(float)1

code:
  readmem(progress,8)
  jmp return

progress:
  jmp newmem
  nop 3
return:

[DISABLE]

progress:
  readmem(progressbkp,8)

unregistersymbol(*)
dealloc(*)"""
