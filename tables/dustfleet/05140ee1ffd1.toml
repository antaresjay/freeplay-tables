[[cheat]]
id = "unlimited-health"
name = "Unlimited Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(healthcd, DF.Core.GameState.Stock:ShipStock:setHull+0, DF.Core.GameState.Stock:ShipStock:setHull+d5, F3 0F 10 86 20 01 00 00 F3 0F 5A C0 F2 0F 11 45 E0 48 8B CE 90) // should be unique
alloc(newmem,$1000,healthcd)

label(code)
label(return)

newmem:
  push rax

  mov rax, rsi
  test rax,rax
  je code

  mov rax, [rax+18]
  test rax,rax
  je code

  cmp byte ptr [rax+D4], 0
  jne code

  cmp [rax+EC], 1
  jne code

  mov [rsi+120], (float)999999.0

code:
  pop rax

  movss xmm0,[rsi+00000120]
  cvtss2sd xmm0,xmm0
  movsd [rbp-20],xmm0
  mov rcx,rsi
  nop
  jmp return

healthcd:
  jmp far newmem
  nop 7
return:
registersymbol(healthcd)

[DISABLE]

healthcd:
  db F3 0F 10 86 20 01 00 00 F3 0F 5A C0 F2 0F 11 45 E0 48 8B CE 90

unregistersymbol(healthcd)
dealloc(newmem)"""
