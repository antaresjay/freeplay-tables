name = "Get Money Data (Open Pause Menu)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Money,GameAssembly.dll,8Bxxxxxxxxxx4883xxxxC3E8xxxxxxxxxxxxxx4883xxxx80xxxxxxxxxxxx75xx488DxxxxxxxxxxE8xxxxxxxxC6xxxxxxxxxxxx488Bxxxxxxxxxx83xxxxxxxxxxxx75xx488B)//8B 80 A4 00 00 00 48 83 C4 28 C3 E8)
alloc(newmem,$1000,Money)
registersymbol(gMoney)
label(code return gMoney)

newmem:
mov [gMoney],rax

code:
  mov eax,[rax+000000A4]
  jmp return

gMoney:
dq

Money:
  jmp newmem
  nop
return:
registersymbol(Money)

[DISABLE]

Money:
  db 8B 80 A4 00 00 00

unregistersymbol(*)
dealloc(*)"""
