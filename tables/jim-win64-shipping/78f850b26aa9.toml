[[cheat]]
id = "x-activate-me"
name = "[X] <<== Activate me"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : JIM-Win64-Shipping.exe
  Version: 1.0.7
  Date   : 2025-11-21
  Author : R_X
}

[ENABLE]

aobscanmodule(pBase,JIM-Win64-Shipping.exe,48 8B 01 66 0F 7F 85 70 03 00 00) // should be unique
alloc(newmem,$1000,pBase)
alloc(base,8)

label(code)
label(return)

base:
dq 0

newmem:

code:
  mov [base],rcx
  mov rax,[rcx]
  movdqa [rbp+00000370],xmm0
  jmp return

pBase:
  jmp newmem
  nop 6
return:
registersymbol(pBase base)

[DISABLE]

pBase:
  db 48 8B 01 66 0F 7F 85 70 03 00 00

unregistersymbol(*)
dealloc(*)"""

