[[cheat]]
id = "ship-base-address-scan-initialization-activate-this-first"
name = "Ship Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Ship_basepointer)
registersymbol(Ship_update_enable)
registersymbol(Ship_set_enable)
registersymbol(Ship_hpset_enable)
registersymbol(Ship_overheatset_enable)
registersymbol(Ship_shieldset_enable)
registersymbol(Ship_energyset_enable)
registersymbol(Ship_mainset_enable)
registersymbol(Ship_alternativeset_enable)

alloc(Ship_basepointer, 4)
alloc(Ship_update_enable, 4)
alloc(Ship_set_enable, 4)
alloc(Ship_hpset_enable, 4)
alloc(Ship_overheatset_enable, 4)
alloc(Ship_shieldset_enable, 4)
alloc(Ship_energyset_enable, 4)
alloc(Ship_mainset_enable, 4)
alloc(Ship_alternativeset_enable, 4)


[DISABLE]
unregistersymbol(Ship_basepointer)
unregistersymbol(Ship_update_enable)
unregistersymbol(Ship_set_enable)
unregistersymbol(Ship_hpset_enable)
unregistersymbol(Ship_overheatset_enable)
unregistersymbol(Ship_shieldset_enable)
unregistersymbol(Ship_energyset_enable)
unregistersymbol(Ship_mainset_enable)
unregistersymbol(Ship_alternativeset_enable)

dealloc(Ship_basepointer)
dealloc(Ship_update_enable)
dealloc(Ship_set_enable)
dealloc(Ship_hpset_enable)
dealloc(Ship_overheatset_enable)
dealloc(Ship_shieldset_enable)
dealloc(Ship_energyset_enable)
dealloc(Ship_mainset_enable)
dealloc(Ship_alternativeset_enable)"""

[[cheat]]
id = "ship-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Ship Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Ship_savedAOB)
label(Ship_returnhere)
label(Ship_originalcode)
label(Ship_exit)

label(Ship_update_exit)
label(Ship_set_exit)
label(Ship_hpset_exit)
label(Ship_overheatset_exit)
label(Ship_shieldset_exit)
label(Ship_energyset_exit)
label(Ship_mainset_exit)
label(Ship_mainset_entry)
label(Ship_mainset_continue)
label(Ship_alternativeset_exit)
label(Ship_alternativeset_entry)
label(Ship_alternativeset_continue)

registersymbol(Ship_savedAOB)

//0548C9AD - 83 EC 20              - sub esp,20
//0548C9B0 - 8B 7D 08              - mov edi,[ebp+08]
// Spaceshooter:Ship:LocalUpdate+b
//0548C9B3 - 8D 87 A4000000        - lea eax,[edi+000000A4]
//0548C9B9 - 8B 08                 - mov ecx,[eax]
//0548C9BB - 89 4D DC              - mov [ebp-24],ecx
//0548C9BE - 8B 40 04              - mov eax,[eax+04]
aobscan(Ship_searchedAOB, 8D 87 A4 00 00 00 8B 08)

alloc(Ship_newmem, 2048, Ship_searchedAOB)
alloc(Ship_temp1, 4, Ship_searchedAOB)
alloc(Ship_temp2, 4, Ship_searchedAOB)
alloc(Ship_temp3, 4, Ship_searchedAOB)
alloc(Ship_temp4, 4, Ship_searchedAOB)
alloc(Ship_temp5, 4, Ship_searchedAOB)


Ship_newmem:
mov [Ship_temp1], eax
mov [Ship_temp2], ebx
mov [Ship_temp3], ecx
mov [Ship_temp4], edx

cmp dword ptr [Ship_update_enable], #0
je Ship_update_exit
mov [Ship_basepointer], edi
Ship_update_exit:

cmp dword ptr [Ship_set_enable], #0
je Ship_set_exit
Ship_set_exit:

cmp dword ptr [Ship_hpset_enable], #0
je Ship_hpset_exit
fld [edi+3c]
fstp [edi+40]
Ship_hpset_exit:

cmp dword ptr [Ship_overheatset_enable], #0
je Ship_overheatset_exit
mov [edi+ac], (float)0
Ship_overheatset_exit:

cmp dword ptr [Ship_shieldset_enable], #0
je Ship_shieldset_exit
mov ebx, [edi+78]
test ebx, ebx
je Ship_shieldset_exit
mov [ebx+74], (float)999
Ship_shieldset_exit:

cmp dword ptr [Ship_energyset_enable], #0
je Ship_energyset_exit
mov ebx, [edi+7c]
test ebx, ebx
je Ship_energyset_exit
mov [ebx+2c], (float)9999
fld [ebx+28]
fstp [ebx+30]
Ship_energyset_exit:

cmp dword ptr [Ship_mainset_enable], #0
je Ship_mainset_exit
mov edx, 0
mov ebx, [edi+6c]
test ebx, ebx
je Ship_mainset_exit
mov ecx, [ebx+c]
test ecx, ecx
je Ship_mainset_exit
Ship_mainset_entry:
mov eax, [ebx+edx*4+10]
test eax, eax
je Ship_mainset_continue
mov [eax+58], (float)0
mov eax, [eax+40]
test eax, eax
je Ship_mainset_continue
mov [eax+20], (float)-1
Ship_mainset_continue:
inc edx
cmp ecx, edx
je Ship_mainset_exit
jmp Ship_mainset_entry
Ship_mainset_exit:

cmp dword ptr [Ship_alternativeset_enable], #0
je Ship_alternativeset_exit
mov edx, 0
mov ebx, [edi+70]
test ebx, ebx
je Ship_alternativeset_exit
mov ecx, [ebx+c]
test ecx, ecx
je Ship_alternativeset_exit
Ship_alternativeset_entry:
mov eax, [ebx+edx*4+10]
test eax, eax
je Ship_alternativeset_continue
mov [eax+58], (float)0
mov eax, [eax+40]
test eax, eax
je Ship_alternativeset_continue
mov [eax+20], (float)-1
Ship_alternativeset_continue:
inc edx
cmp ecx, edx
je Ship_alternativeset_exit
jmp Ship_alternativeset_entry
Ship_alternativeset_exit:

mov eax, [Ship_temp1]
mov ebx, [Ship_temp2]
mov ecx, [Ship_temp3]
mov edx, [Ship_temp4]


Ship_originalcode:
db 8D 87 A4 00 00 00
//lea eax,[edi+000000A4]


Ship_exit:
jmp Ship_returnhere


Ship_searchedAOB:
Ship_savedAOB:
jmp Ship_newmem
nop
Ship_returnhere:


[DISABLE]
Ship_savedAOB:
db 8D 87 A4 00 00 00
//lea eax,[edi+000000A4]

unregistersymbol(Ship_savedAOB)

dealloc(Ship_newmem)
dealloc(Ship_temp1)
dealloc(Ship_temp2)
dealloc(Ship_temp3)
dealloc(Ship_temp4)
dealloc(Ship_temp5)"""

