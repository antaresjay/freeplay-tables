[[cheat]]
id = "player-character-ctrl-numpad-1"
name = "Player Character (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : MetalGarden-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.0.3.0
// Game Version      : v1.0.3
// Script Date       : 2025-03-25


[ENABLE]

aobscanmodule(master,MetalGarden-Win64-Shipping.exe,4Cxxxx4Cxxxx488Bxx488Bxx488Bxxxxxx488Bxxxxxx4883xxxx5F49FF) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,6)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,6)

newmem:
  mov [data],rdi

code:
  readmem(master,6)
  jmp return

master:
  jmp newmem
  nop
return:

[DISABLE]

master:
  readmem(masterbkp,6)

unregistersymbol(*)
dealloc(*)"""

