[[cheat]]
id = "gamecontrol-base-address-scan-initialization-activate-this-first"
name = "GameControl Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameControl_basepointer)
registersymbol(GameControl_update_enable)
registersymbol(GameControl_set_enable)
registersymbol(GameControl_waterset_enable)
registersymbol(GameControl_jumpset_enable)
registersymbol(GameControl_jumpset_value)
registersymbol(GameControl_invulnerableset_enable)
registersymbol(GameControl_hpset_enable)
registersymbol(GameControl_timeset_enable)

alloc(GameControl_basepointer, 4)
alloc(GameControl_update_enable, 4)
alloc(GameControl_set_enable, 4)
alloc(GameControl_waterset_enable, 4)
alloc(GameControl_jumpset_enable, 4)
alloc(GameControl_jumpset_value, 4)
alloc(GameControl_invulnerableset_enable, 4)
alloc(GameControl_hpset_enable, 4)
alloc(GameControl_timeset_enable, 4)

GameControl_jumpset_value:
dd #36


[DISABLE]
unregistersymbol(GameControl_basepointer)
unregistersymbol(GameControl_update_enable)
unregistersymbol(GameControl_set_enable)
unregistersymbol(GameControl_waterset_enable)
unregistersymbol(GameControl_jumpset_enable)
unregistersymbol(GameControl_jumpset_value)
unregistersymbol(GameControl_invulnerableset_enable)
unregistersymbol(GameControl_hpset_enable)
unregistersymbol(GameControl_timeset_enable)

dealloc(GameControl_basepointer)
dealloc(GameControl_update_enable)
dealloc(GameControl_set_enable)
dealloc(GameControl_waterset_enable)
dealloc(GameControl_jumpset_enable)
dealloc(GameControl_jumpset_value)
dealloc(GameControl_invulnerableset_enable)
dealloc(GameControl_hpset_enable)
dealloc(GameControl_timeset_enable)"""

[[cheat]]
id = "gamecontrol-base-address-scan-to-activate-load-game-to-update-play-level"
name = "GameControl Base Address Scan (To Activate: Load Game, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameControl_savedAOB)
label(GameControl_returnhere)
label(GameControl_originalcode)
label(GameControl_exit)

label(GameControl_update_exit)
label(GameControl_set_exit)
label(GameControl_waterset_exit)
label(GameControl_invulnerableset_exit)
label(GameControl_hpset_exit)
label(GameControl_jumpset_exit)
label(GameControl_timeset_exit)

registersymbol(GameControl_savedAOB)

//0462AB04 - 83 EC 14              - sub esp,14
//0462AB07 - 8B 7D 08              - mov edi,[ebp+08]
// GameControl:UpdateGame+f
//0462AB0A - 0FB6 87 B4000000      - movzx eax,byte ptr [edi+000000B4]
//0462AB11 - 85 C0                 - test eax,eax
//0462AB13 - 0F85 D3000000         - jne 0462ABEC
//0462AB19 - 8B 47 58              - mov eax,[edi+58]
//0462AB1C - 83 EC 0C              - sub esp,0C
//0462AB1F - 50                    - push eax
aobscan(GameControl_searchedAOB, 0F B6 87 B4 00 00 00 85 C0 * * * * * * 8B 47 58)

alloc(GameControl_newmem, 2048)
alloc(GameControl_temp1, 4)
alloc(GameControl_temp2, 4)


GameControl_newmem:
mov [GameControl_temp1], ebx
mov [GameControl_temp2], ecx

cmp dword ptr [GameControl_update_enable], #0
je GameControl_update_exit
mov [GameControl_basepointer], edi
GameControl_update_exit:

cmp dword ptr [GameControl_set_enable], #0
je GameControl_set_exit
GameControl_set_exit:

cmp dword ptr [GameControl_waterset_enable], #0
je GameControl_waterset_exit
cmp dword ptr [edi+20], #0
je GameControl_waterset_exit
mov ebx, [edi+20]
mov [ebx+2ac], #9999
GameControl_waterset_exit:

cmp dword ptr [GameControl_jumpset_enable], #0
je GameControl_jumpset_exit
cmp dword ptr [edi+24], #0
je GameControl_jumpset_exit
mov ebx, [edi+24]
fild [GameControl_jumpset_value]
fstp [ebx+148]
GameControl_jumpset_exit:

cmp dword ptr [GameControl_invulnerableset_enable], #0
je GameControl_invulnerableset_exit
cmp dword ptr [edi+24], #0
je GameControl_invulnerableset_exit
mov ebx, [edi+24]
mov [ebx+188], (float)999
GameControl_invulnerableset_exit:

cmp dword ptr [GameControl_hpset_enable], #0
je GameControl_hpset_exit
cmp dword ptr [edi+24], #0
je GameControl_hpset_exit
mov ebx, [edi+24]
mov cl, [ebx+1c5]
mov [ebx+1c4], cl
GameControl_hpset_exit:

cmp dword ptr [GameControl_timeset_enable], #0
je GameControl_timeset_exit
cmp dword ptr [edi+74], #0
je GameControl_timeset_exit
mov ebx, [edi+74]
cmp dword ptr [ebx+1c], #0
je GameControl_timeset_exit
mov ebx, [ebx+1c]
mov [ebx+38], #0
mov [ebx+3c], #0
GameControl_timeset_exit:

mov ebx, [GameControl_temp1]
mov ecx, [GameControl_temp2]


GameControl_originalcode:
db 0F B6 87 B4 00 00 00
//movzx eax,byte ptr [edi+000000B4]


GameControl_exit:
jmp GameControl_returnhere


GameControl_searchedAOB:
GameControl_savedAOB:
jmp GameControl_newmem
nop
nop
GameControl_returnhere:


[DISABLE]
GameControl_savedAOB:
db 0F B6 87 B4 00 00 00
//movzx eax,byte ptr [edi+000000B4]

unregistersymbol(GameControl_savedAOB)

dealloc(GameControl_newmem)
dealloc(GameControl_temp1)
dealloc(GameControl_temp2)"""

