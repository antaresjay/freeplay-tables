[[cheat]]
id = "player"
name = "Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : CometCrasher.exe
  Version: 3.2.2 (Steam)
  Date   : 2019-03-05
  Author : Abystus
}

[ENABLE]

aobscan(AmmoCooldownRead,F3 0F 10 86 C8 00 00 00 F3 0F 5A C0 66) // should be unique
alloc(newmem,$1000)

label(playerbase)
label(return)

newmem:
  mov [playerbase],rsi
  movss xmm0,[rsi+000000C8]
  jmp return

playerbase:

AmmoCooldownRead:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(AmmoCooldownRead)
registersymbol(playerbase)
[DISABLE]

AmmoCooldownRead:
  db F3 0F 10 86 C8 00 00 00

unregistersymbol(AmmoCooldownRead)
unregistersymbol(playerbase)
dealloc(newmem)"""

