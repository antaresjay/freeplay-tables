[[cheat]]
id = "enable-invulnerability"
name = "Enable Invulnerability"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@Sintrix
define(address,Player:CheckPlayerRunning+c)
define(bytes,48 8B F1 C6 86 E0 00 00 00 01)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Player:CheckPlayerRunning+c)
registersymbol(playerptr)
label(code return playerptr)

newmem:
mov [playerptr],rcx

code:
  mov rsi,rcx
  mov byte ptr [rsi+000000E0],01
  jmp return

playerptr:
dq 0

address:
  jmp newmem
  nop 5
return:

[DISABLE]

address:
  db bytes

unregistersymbol(*)
dealloc(*)"""

