[[cheat]]
id = "playerclass-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerClass Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerClass_savedAOB)
label(PlayerClass_returnhere)
label(PlayerClass_originalcode)
label(PlayerClass_exit)

label(PlayerClass_update_exit)
label(PlayerClass_set_exit)
label(PlayerClass_foodset_exit)
label(PlayerClass_mineralsset_exit)
label(PlayerClass_dnaset_exit)
label(PlayerClass_populationcapset_exit)

registersymbol(PlayerClass_savedAOB)

//0514677D - E8 CE65F9FF           - call 050DCD50
//05146782 - 83 C4 10              - add esp,10
// ResourceGUI:Update+85
//05146785 - D9 40 50              - fld dword ptr [eax+50]
//05146788 - DD 5D F0              - fstp qword ptr [ebp-10]
//0514678B - F2 0F10 45 F0         - movsd xmm0,[ebp-10]
//05146790 - F2 0F2C C0            - cvttsd2si eax,xmm0
//05146794 - 89 45 E8              - mov [ebp-18],eax
//05146797 - 8D 45 E8              - lea eax,[ebp-18]
aobscan(PlayerClass_searchedAOB, D9 40 50 DD 5D F0 F2 0F 10 45 F0 F2 0F 2C C0)

alloc(PlayerClass_newmem, 2048, PlayerClass_searchedAOB)
alloc(PlayerClass_temp1, 4, PlayerClass_searchedAOB)


PlayerClass_newmem:
mov [PlayerClass_temp1], ebx

cmp dword ptr [PlayerClass_update_enable], #0
je PlayerClass_update_exit
mov [PlayerClass_basepointer], eax
PlayerClass_update_exit:

cmp dword ptr [PlayerClass_set_enable], #0
je PlayerClass_set_exit
PlayerClass_set_exit:

cmp dword ptr [PlayerClass_foodset_enable], #0
je PlayerClass_foodset_exit
mov [eax+4c], (float)9999999
PlayerClass_foodset_exit:

cmp dword ptr [PlayerClass_mineralsset_enable], #0
je PlayerClass_mineralsset_exit
mov [eax+50], (float)9999999
PlayerClass_mineralsset_exit:

cmp dword ptr [PlayerClass_dnaset_enable], #0
je PlayerClass_dnaset_exit
mov [eax+54], #9999999
PlayerClass_dnaset_exit:

cmp dword ptr [PlayerClass_populationcapset_enable], #0
je PlayerClass_populationcapset_exit
mov [eax+5c], #9999999
PlayerClass_populationcapset_exit:

mov ebx, [PlayerClass_temp1]


PlayerClass_originalcode:
db D9 40 50 DD 5D F0
//fld dword ptr [eax+50]
//fstp qword ptr [ebp-10]


PlayerClass_exit:
jmp PlayerClass_returnhere


PlayerClass_searchedAOB:
PlayerClass_savedAOB:
jmp PlayerClass_newmem
nop
PlayerClass_returnhere:


[DISABLE]
PlayerClass_savedAOB:
db D9 40 50 DD 5D F0
//fld dword ptr [eax+50]
//fstp qword ptr [ebp-10]

unregistersymbol(PlayerClass_savedAOB)

dealloc(PlayerClass_newmem)
dealloc(PlayerClass_temp1)"""

