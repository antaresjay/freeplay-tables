[[cheat]]
id = "enable-disable-script"
name = "Enable/disable script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,1024)
label(returnhere)
label(originalcode)
label(pSpank)
label(pDesiredMoveSpeed)
registersymbol(pSpank)
registersymbol(pDesiredMoveSpeed)

newmem:
pushad
test eax, eax
jz short originalcode
mov ebx,[eax]
test ebx, ebx
jz short originalcode
mov ecx,[ebx]
cmp ecx, [pSpank+4]
jne short originalcode
mov ecx,[ebx+4]
cmp ecx, [pSpank+8]
jne short originalcode
mov eax,[eax+10]
test eax, eax
jz short originalcode
mov [pSpank],eax
mov ebx,[eax+1FC]
mov dword ptr [eax+1F4],ebx
mov ebx,[pDesiredMoveSpeed]
mov dword ptr [eax+1EC],ebx
mov ebx,[eax+DEC]
mov dword ptr [eax+DE4],ebx
originalcode:
popad
cmp dword ptr [eax+000001AC],00
jmp returnhere

pSpank:
dd 0
db 'DeathSpank',0
pDesiredMoveSpeed:
dd (float)1.5

"TheBaconing.exe"+CD5B6:
jmp newmem
nop
nop
returnhere:

[DISABLE]
"TheBaconing.exe"+CD5B6:
cmp dword ptr [eax+000001AC],00
//Alt: db 83 B8 AC 01 00 00 00
unregistersymbol(pSpank)
unregistersymbol(pDesiredMoveSpeed)
dealloc(newmem)"""

