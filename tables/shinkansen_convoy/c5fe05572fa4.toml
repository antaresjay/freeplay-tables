[[cheat]]
id = "leveldata-base-address-scan-initialization-activate-this-first"
name = "LevelData Base Address Scan Initialization (Activate This First)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(LevelData_basepointer)
registersymbol(LevelData_update_enable)
registersymbol(LevelData_set_enable)

alloc(LevelData_basepointer,4)
alloc(LevelData_update_enable,4)
alloc(LevelData_set_enable,4)


[DISABLE]
unregistersymbol(LevelData_basepointer)
unregistersymbol(LevelData_update_enable)
unregistersymbol(LevelData_set_enable)

dealloc(LevelData_basepointer)
dealloc(LevelData_update_enable)
dealloc(LevelData_set_enable)"""

[[cheat]]
id = "leveldata-base-address-scan-to-activate-world-map-to-update-world-map"
name = "LevelData Base Address Scan (To Activate: World Map, To Update: World Map)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(LevelData_savedAOB)
label(LevelData_returnhere)
label(LevelData_originalcode)
label(LevelData_exit)

label(LevelData_update_exit)
label(LevelData_set_exit)

registersymbol(LevelData_savedAOB)

aobscan(LevelData_searchedAOB,05 40 00 00 00 D9 40 20 DD 9D 60 FF FF FF)

alloc(LevelData_newmem,2048)
alloc(LevelData_temp1,4)


LevelData_newmem:
mov [LevelData_temp1], ebx

mov ebx, eax
add ebx, 38

cmp dword ptr [LevelData_update_enable], #0
je LevelData_update_exit
mov [LevelData_basepointer], ebx
LevelData_update_exit:

cmp dword ptr [LevelData_set_enable], #0
je LevelData_set_exit
mov [ebx+24], #999999
mov [ebx+28], (float)99999
mov [ebx+2c], (float)999999
LevelData_set_exit:

mov ebx, [LevelData_temp1]


LevelData_originalcode:
db 05 40 00 00 00
//add eax,00000040


LevelData_exit:
jmp LevelData_returnhere


LevelData_searchedAOB:
LevelData_savedAOB:
jmp LevelData_newmem
LevelData_returnhere:


[DISABLE]
LevelData_savedAOB:
db 05 40 00 00 00
//mov eax,[edi+3C]
//add eax,00000040
//fld dword ptr [eax+20]

unregistersymbol(LevelData_savedAOB)

dealloc(LevelData_newmem)
dealloc(LevelData_temp1)"""

