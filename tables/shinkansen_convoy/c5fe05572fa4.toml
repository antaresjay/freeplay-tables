id = "selectioncontroller-base-address-scan-initialization-activate-this-first"
name = "SelectionController Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(SelectionController_basepointer)
registersymbol(SelectionController_update_enable)
registersymbol(SelectionController_set_enable)

alloc(SelectionController_basepointer,4)
alloc(SelectionController_update_enable,4)
alloc(SelectionController_set_enable,4)


[DISABLE]
unregistersymbol(SelectionController_basepointer)
unregistersymbol(SelectionController_update_enable)
unregistersymbol(SelectionController_set_enable)

