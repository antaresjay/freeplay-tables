[[cheat]]
id = "carmain-base-address-scan-to-activate-load-game-to-update-play"
name = "CarMain Base Address Scan (To Activate: Load Game, To Update: Play)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(CarMain_savedAOB)
label(CarMain_returnhere)
label(CarMain_originalcode)
label(CarMain_exit)

label(CarMain_update_exit)
label(CarMain_set_exit)
label(CarMain_hparmorset_exit)
label(CarMain_statsset_exit)
label(CarMain_enemyset_entry)
label(CarMain_enemyset_exit)

registersymbol(CarMain_savedAOB)

aobscan(CarMain_searchedAOB,8B 4E 20 D9 41 34 8B 4E 24)

alloc(CarMain_newmem,2048)


CarMain_newmem:
// Enemy check
cmp dword ptr [esi+b4], #1
je CarMain_enemyset_entry

cmp dword ptr [esi+b4], #3
je CarMain_enemyset_entry

cmp dword ptr [CarMain_update_enable], #0
je CarMain_update_exit
mov [CarMain_basepointer], esi
CarMain_update_exit:

cmp dword ptr [CarMain_set_enable], #0
je CarMain_set_exit
CarMain_set_exit:

cmp dword ptr [CarMain_hparmorset_enable], #0
je CarMain_hparmorset_exit
mov ecx, [esi+24]
fild [ecx+20]
mov ecx, [esi+20]
fstp [ecx+34]
mov ecx, [esi+24]
fild [ecx+24]
mov ecx, [esi+20]
fstp [ecx+38]
CarMain_hparmorset_exit:

cmp dword ptr [CarMain_statsset_enable], #0
je CarMain_statsset_exit
mov ecx, [esi+24]
mov [ecx+24], #9999
mov [ecx+28], #9999
mov [ecx+2c], #9999
mov [ecx+38], #1500
CarMain_statsset_exit:

jmp CarMain_enemyset_exit

CarMain_enemyset_entry:
cmp dword ptr [CarMain_enemyset_enable], #0
je CarMain_enemyset_exit
mov ecx, [esi+20]
mov [ecx+34], (float)-1
mov [ecx+38], (float)0
mov ecx, [esi+24]
mov [ecx+24], #1
mov [ecx+28], #1
mov [ecx+2c], #1
mov [ecx+38], #1
CarMain_enemyset_exit:


CarMain_originalcode:
db 8B 4E 20 D9 41 34
//mov ecx,[esi+20]
//fld dword ptr [ecx+34]


CarMain_exit:
jmp CarMain_returnhere


CarMain_searchedAOB:
CarMain_savedAOB:
jmp CarMain_newmem
nop
CarMain_returnhere:


[DISABLE]
CarMain_savedAOB:
db 8B 4E 20 D9 41 34
//mov ecx,[esi+20]
//fld dword ptr [ecx+34]

unregistersymbol(CarMain_savedAOB)

dealloc(CarMain_newmem)"""

