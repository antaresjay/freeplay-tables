[[cheat]]
id = "selectioncontroller-base-address-scan-to-activate-select-car-to-update-select-car-twice"
name = "SelectionController Base Address Scan (To Activate: Select Car, To Update: Select Car Twice)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(SelectionController_savedAOB)
label(SelectionController_returnhere)
label(SelectionController_originalcode)
label(SelectionController_exit)

label(SelectionController_update_exit)
label(SelectionController_set_exit)

registersymbol(SelectionController_savedAOB)

aobscan(SelectionController_searchedAOB,8B 80 84 00 00 00 8B 40 20 8B C8 39)

alloc(SelectionController_newmem,2048)
alloc(SelectionController_temp1,4)


SelectionController_newmem:
mov [SelectionController_temp1], ebx

cmp dword ptr [SelectionController_update_enable], #0
je SelectionController_update_exit
mov [SelectionController_basepointer], eax
SelectionController_update_exit:

cmp dword ptr [SelectionController_set_enable], #0
je SelectionController_set_exit
SelectionController_set_exit:

mov ebx, [SelectionController_temp1]


SelectionController_originalcode:
db 8B 80 84 00 00 00
//mov eax,[eax+00000084]


SelectionController_exit:
jmp SelectionController_returnhere


SelectionController_searchedAOB:
SelectionController_savedAOB:
jmp SelectionController_newmem
nop
SelectionController_returnhere:


[DISABLE]
SelectionController_savedAOB:
db 8B 80 84 00 00 00
//mov eax,[eax+00000084]

unregistersymbol(SelectionController_savedAOB)

dealloc(SelectionController_newmem)
dealloc(SelectionController_temp1)"""

