type = "script"
source = """
// Game Executable   : Moonlight Pulse.exe
// Author            : ndck76
// Executable Version: 1.0.7.0
// Game Version      : v1.0.7
// Script Date       : 2024-07-03


[ENABLE]

aobscanmodule(ohk,GameAssembly.dll,8Bxxxxxxxxxx83xxxxxxxxxxxx75xxE8xxxxxxxx2BxxxxB8) //Enemies.Enemy.ReceiveDamage
alloc(newmem,$1000,ohk)
alloc(ohkbkp,6)
registersymbol(ohk)
registersymbol(ohkbkp)
label(code)
label(return)

ohkbkp:
  readmem(ohk,6)

newmem:
  mov [rbx+000000AC],0

code:
  readmem(ohk,6)
  jmp return

ohk:
  jmp newmem
  nop
return:

[DISABLE]

ohk:
  readmem(ohkbkp,6)

unregistersymbol(*)
dealloc(*)"""
