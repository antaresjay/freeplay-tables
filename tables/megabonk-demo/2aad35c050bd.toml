[[cheat]]
id = "one-hit-kill"
name = "One Hit Kill"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
//Assets.Scripts.Actors.Enemies.Enemy.CanMove
//Send@FearlessRevolution|Sintrix
[ENABLE]

aobscanmodule(ehp,GameAssembly.dll,* EB FF CC CC CC 40 53 48 83 EC 20 80 3D * * * * 00 48 8B D9 75 1F)
alloc(newmem,$1000,ehp)

label(code)
label(return)

newmem:
mov [rcx+84],(float)1
jmp code

code:
  push rbx
  sub rsp,20
  jmp return

ehp+06:
  jmp newmem
  nop
return:
registersymbol(ehp)

[DISABLE]

ehp+06:
  db 40 53 48 83 EC 20

unregistersymbol(*)
dealloc(*)"""

