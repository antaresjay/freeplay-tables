[[cheat]]
id = "set-stats"
name = "----> Set Stats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[Enable]

alloc(ss_1,16) //Set Stats
aobscan(ss_aob1,D9 81 80 00 00 00 D9 5D CC)
registersymbol(ss_aob1)
label(returnhere_ss_1)

label(str) //Strength
registersymbol(str)
label(spe) //Speed
registersymbol(spe)
label(int) //Intelligence
registersymbol(int)
label(fat) //Fatigue
registersymbol(fat)

//--------------------------------------------------//
ss_1:
fld dword ptr [ecx+00000080]
fld [str]
fstp [ecx+74]
fld [spe]
fstp [ecx+78]
fld [int]
fstp [ecx+7C]
fld [fat]
fstp [ecx+80]
jmp returnhere_ss_1

str:
dd (float)100

spe:
dd (float)100

int:
dd (float)100

fat:
dd (float)0
//--------------------------------------------------//

ss_aob1:
jmp ss_1
nop
returnhere_ss_1:

[Disable]

ss_aob1:
db D9 81 80 00 00 00
unregistersymbol(ss_aob1)
dealloc(ss_1)

unregistersymbol(str)
unregistersymbol(spe)
unregistersymbol(int)
unregistersymbol(fat)"""

