[[cheat]]
id = "gameplay-manager-ctrl-numpad-1"
name = "Gameplay Manager (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : LostTwins2.exe
// Author            : ndck76
// Executable Version: 2022.3.62.62237
// Game Version      : Build.19300073
// Script Date       : 2025-08-18


[ENABLE]

aobscanmodule(playercontrollers,GameAssembly.dll,488Bxxxx4885xx0F84xxxxxxxx4Cxxxxxxxxxxxx33xxE8xxxxxxxx4885xx0F84xxxxxxxx4038) //GameplayManager.Update
alloc(newmem,$1000,playercontrollers)
alloc(data,8)
alloc(playercontrollersbkp,7)
registersymbol(data)
registersymbol(playercontrollers)
registersymbol(playercontrollersbkp)
label(code)
label(return)

playercontrollersbkp:
  readmem(playercontrollers,7)

newmem:
  mov [data],rbx

code:
  readmem(playercontrollers,7)
  jmp return

playercontrollers:
  jmp newmem
  nop 2
return:

[DISABLE]

playercontrollers:
  readmem(playercontrollersbkp,7)

unregistersymbol(*)
dealloc(*)"""

