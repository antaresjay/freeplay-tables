[ENABLE]
aobscanmodule(timer,$process,48 8B 41 18 F3 0F 10 40 20)
alloc(newmem,$24)

label(code)
label(return)

newmem:
  mov rax,[rcx+18]
code:
  mov [rax+20],0
  movss xmm0,[rax+20]
  jmp return
timer:
  jmp newmem
  nop 2
  nop
