type = "script"
source = """
{ Game   : Minesweeper.exe
  Version: 
  Date   : 2016-07-06
  Author : Squall8

  This script does blah blah blah
}

[ENABLE]

aobscan(gold,89 46 04 89 56 08 ?? ?? ?? ?? ?? 50) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

globalalloc(_gold,4)

newmem:

code:
  mov [_gold],esi
  mov [esi+04],eax
  mov [esi+08],edx
  jmp return

gold:
  jmp code
  nop
return:
registersymbol(gold)

[DISABLE]

gold:
  db 89 46 04 89 56 08

unregistersymbol(gold)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: 0523BBD2

""+523BBBD: 85 D2                 -  test edx,edx
""+523BBBF: 7F 06                 -  jg 0523BBC7
