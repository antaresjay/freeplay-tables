""+523BBC5: 72 04                 -  jb 0523BBCB
""+523BBC7: 8B C1                 -  mov eax,ecx
""+523BBC9: EB 07                 -  jmp 0523BBD2
""+523BBCB: 52                    -  push edx
""+523BBCC: 51                    -  push ecx
""+523BBCD: E8 C2 83 24 67        -  call mscorlib.ni.dll+B13F94
// ---------- INJECTING HERE ----------
""+523BBD2: 89 46 04              -  mov [esi+04],eax
""+523BBD5: 89 56 08              -  mov [esi+08],edx
// ---------- DONE INJECTING  ----------
""+523BBD8: E8 D3 D3 AA 66        -  call mscorlib.ni.dll+378FB0
""+523BBDD: 50                    -  push eax
""+523BBDE: 8B 4D F4              -  mov ecx,[ebp-0C]
""+523BBE1: 33 D2                 -  xor edx,edx
""+523BBE3: E8 2E 56 A5 67        -  call clr.dll+11216
""+523BBE8: 8B D0                 -  mov edx,eax
""+523BBEA: 6A 01                 -  push 01
""+523BBEC: 6A 01                 -  push 01
""+523BBEE: 8B CE                 -  mov ecx,esi
""+523BBF0: E8 FB A7 87 03        -  call 08AB63F0
}"""

