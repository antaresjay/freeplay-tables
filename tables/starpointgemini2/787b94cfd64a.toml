[[cheat]]
id = "script-item-charge"
name = "Script: Item Charge"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : StarpointGemini2.exe
  Version: 
  Date   : 2014-04-28
  Author : Jason

  When an item is recharging, the injected instruction loads the max charge.

  EAX Structure:
    -0C: Item Quantity (actually at offset 8 at least into a structure)
    08: Max Charge
    0C: Current Charge
}

[ENABLE]

aobscanmodule(INJECT_ItemRecharge,StarpointGemini2.exe,F3 0F 10 50 08 0F) // should be unique
alloc(newmem,$1000)

label(code)
label(skipRecharge)
label(return)

newmem:

code:
  // see if we should recharge item
  cmp dword ptr [bItemRecharge],1
  jne skipRecharge
  movss xmm0,[eax+08] // load max charge in xmm0 that has new charge

skipRecharge:
  movss xmm2,[eax+08]
  jmp return

INJECT_ItemRecharge:
  jmp code
return:
registersymbol(INJECT_ItemRecharge)

[DISABLE]

INJECT_ItemRecharge:
  db F3 0F 10 50 08

unregistersymbol(INJECT_ItemRecharge)
dealloc(newmem)

