[[cheat]]
id = "script-item-quantity"
name = "Script: Item Quantity"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : StarpointGemini2.exe
  Version: 
  Date   : 2014-04-28
  Author : Jason

  This is where item quantity is decremented when used.

  EBX Structure:
    08: Item Quantity
    0C: Seems to be some sort of type, if 1, 5 or 6 then don't decrement
    10: 100.0?
    18: 15.0?
    1C: Max Charge (20.0)
    20: Current Charge
}

[ENABLE]


aobscanmodule(INJECT_ItemQuantity,StarpointGemini2.exe,83 F8 01 74 03 FF 4B 08) // should be unique (added dec instruction)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  cmp dword ptr [bItemQuantity],1
  je return+3

  cmp eax,01
  je return+3
  jmp return

INJECT_ItemQuantity:
  jmp code
return:
registersymbol(INJECT_ItemQuantity)

[DISABLE]

INJECT_ItemQuantity:
  db 83 F8 01 74 03

unregistersymbol(INJECT_ItemQuantity)
dealloc(newmem)

