[[cheat]]
id = "script-energy"
name = "Script: Energy"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
{ Game   : StarpointGemini2.exe
  Version: 
  Date   : 2014-04-27
  Author : Jason


  EDI: Structure
       30: Max Energy (float)
       40: Current Energy (float)
}

[ENABLE]

{******************************************************************************
 * INJECT_ENERGY1 - For all ships - when recharging energy
 ******************************************************************************}

aobscanmodule(INJECT_ENERGY1,StarpointGemini2.exe,F3 0F 11 47 40 0F 2F) // should be unique
alloc(newmem_ENERGY1,$1000)

label(code_ENERGY1)
label(skip_ENERGY1)
label(return_ENERGY1)

newmem_ENERGY1:

code_ENERGY1:
  cmp dword ptr [bEnemyEnergy],1
  jne skip_ENERGY1
  cmp dword ptr [pPlayerEnergy],edi
  je skip_ENERGY1
  push eax
  xor eax,eax
  mov [edi+40],eax
  pop eax
  movss xmm0,[edi+40]

skip_ENERGY1:
  movss [edi+40],xmm0
  jmp return_ENERGY1

INJECT_ENERGY1:
  jmp code_ENERGY1
return_ENERGY1:
registersymbol(INJECT_ENERGY1)

{******************************************************************************
 * INJECT_ENERGY2 - ONLY for player ship, this is probably for display
 ******************************************************************************}

aobscanmodule(INJECT_ENERGY2,StarpointGemini2.exe,F3 0F 10 06 F3 0F 5E 40 30 EB) // should be unique
alloc(newmem_ENERGY2,$1000)

label(code_ENERGY2)
label(skip_ENERGY2)
label(return_ENERGY2)

newmem_ENERGY2:

code_ENERGY2:
  mov [pPlayerEnergy],eax
  cmp dword ptr [bPlayerEnergy],1
  jne skip_ENERGY2
  movss xmm0,[eax+30]
  movss [eax+40],xmm0

skip_ENERGY2:
  movss xmm0,[esi]
  divss xmm0,[eax+30]
  jmp return_ENERGY2

INJECT_ENERGY2:
  jmp code_ENERGY2
  nop
  nop
  nop
  nop
return_ENERGY2:
registersymbol(INJECT_ENERGY2)


[DISABLE]

INJECT_ENERGY1:
  db F3 0F 11 47 40

unregistersymbol(INJECT_ENERGY1)
dealloc(newmem_ENERGY1)

