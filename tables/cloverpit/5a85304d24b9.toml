id = "console-enabled"
name = "Console_Enabled"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : CloverPit.exe
  Version: 1.0
  Date   : 2025-09-27
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,ConsolePrompt:Update)
define(bytes,55 48 8B EC 48 81 EC B0 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,ConsolePrompt:Update)

label(code)
label(return)

newmem:

mov [Consoleprompt_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,000000B0
  jmp return

Consoleprompt_ptr:
dq 0

address:
  jmp newmem
  nop 6
return:
