id = "unlimited-upgrades"
name = "Unlimited Upgrades"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(Upgrades_Get_AOB,Motorways.UpgradeDatabase:GetAvailableUpgradeCount,Motorways.UpgradeDatabase:GetAvailableUpgradeCount+118,8D 44 88 10 8B 00 C9 C3) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  lea eax,[eax+ecx*4+10]
  mov [eax],#77
  mov eax,[eax]
  jmp return

Upgrades_Get_AOB:
  jmp newmem
  nop
return:
registersymbol(Upgrades_Get_AOB)

[DISABLE]

Upgrades_Get_AOB:
  db 8D 44 88 10 8B 00

unregistersymbol(Upgrades_Get_AOB)
dealloc(newmem)"""
