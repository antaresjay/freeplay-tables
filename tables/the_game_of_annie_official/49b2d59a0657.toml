[[cheat]]
id = "fsmvariables"
name = "FsmVariables"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(varaddress,HutongGames.PlayMaker.FsmVariables:get_variableLookup+2b )
define(varbytes,48 8B 46 10 48 8B 75 F8)

[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
assert(varaddress,varbytes)

label(code)
label(return fsmvar)
registersymbol(fsmvar)

baseptr+00:
  cmp qword ptr [rsi+18],0
  je code
  cmp qword ptr [rsi+a8],0
  je code
  push r13
  push r14
  mov r14,[rsi+18]
  cmp dword ptr [r14+18],#70
  jne code2
  mov r14,[rsi+a8]
  cmp dword ptr [r14+18],#78
  jne code2
  mov [fsmvar],rsi

code2:
  mov r13,[rsi+18]
  cmp dword ptr [r13+18],#15
  jne code
  mov r13,[rsi+a8]
  cmp dword ptr [r13+18],#18
  jne code
  mov [fsmvar+8],rsi

code:
  mov rax,[rsi+10]
  mov rsi,[rbp-08]
  pop r14
  pop r13
  jmp return

fsmvar:
  dq 0,0

varaddress:
  jmp!near baseptr+00: c3 | 00*
  nop 3
return:

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
varaddress:
  db varbytes
  // mov rax,[rsi+10]
  // mov rsi,[rbp-08]

unregistersymbol(*)"""

