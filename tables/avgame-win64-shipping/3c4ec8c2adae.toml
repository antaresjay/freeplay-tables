[[cheat]]
id = "teleport-activate"
name = "Teleport [Activate]"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[Enable]
aobscanmodule(teleport_aob1,AVGame-Win64-Shipping.exe,0F 28 90 A0 01 00 00 48 8D 44)
alloc(teleport_1,$256,"AVGame-Win64-Shipping.exe"+4C8D5A)
alloc(stored_position,8)//necessary?

label(returnhere_teleport_1)

label(notMe)

label(saveLocation)
label(saveLocation_status)
registersymbol(saveLocation_status)
label(saved_X)
registersymbol(saved_X)
label(saved_Y)
registersymbol(saved_Y)
label(saved_Z)
registersymbol(saved_Z)

label(goToSaved)
label(goToSaved_status)
registersymbol(goToSaved_status)

stored_position: //necessary?
saveLocation_status:
dd 0
saved_X:
dd 0
saved_Y:
dd 0
saved_Z:
dd 0
goToSaved_status:
dd 0

teleport_1:
//cmp [rax+188],#75
//jne notMe
cmp [saveLocation_status],1
je saveLocation
cmp [goToSaved_status],1
je goToSaved
movaps xmm2,[rax+000001A0]
jmp returnhere_teleport_1

notMe:
movaps xmm2,[rax+000001A0]
jmp returnhere_teleport_1

saveLocation:
movaps xmm2,[rax+000001A0]
fld [rax+1A0]
fstp [saved_X]
fld [rax+1A4]
fstp [saved_Y]
fld [rax+1A8]
fstp [saved_Z]
mov [saveLocation_status],0
jmp returnhere_teleport_1

goToSaved:
fld [saved_X]
fstp [rax+1A0]
fld [saved_Y]
fstp [rax+1A4]
fld [saved_Z]
fstp [rax+1A8]
mov [goToSaved_status],0
jmp returnhere_teleport_1

teleport_aob1:
jmp teleport_1
nop
nop

returnhere_teleport_1:
registersymbol(teleport_aob1)

[Disable]
teleport_aob1:
db 0F 28 90 A0 01 00 00
unregistersymbol(teleport_aob1)
dealloc(teleport_1)

unregistersymbol(saveLocation_status)
unregistersymbol(saved_X)
unregistersymbol(saved_Y)
unregistersymbol(saved_Z)

unregistersymbol(goToSaved_status)"""

