[[cheat]]
id = "get-money-pointer"
name = "Get Money Pointer"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048,"MoneyCheck.Output"+2E)
label(returnhere)
label(originalcode)
label(exit)
label(money)
registersymbol(money)

newmem:
mov [money],rcx

originalcode:
cmp dword ptr [rcx+08],00
setg al

exit:
jmp returnhere

money:
dd 0

"MoneyCheck.Output"+2E:
jmp newmem
nop 2
returnhere:

[DISABLE]
unregistersymbol(money)
dealloc(newmem)
"MoneyCheck.Output"+2E:
cmp dword ptr [rcx+08],00
setg al"""
