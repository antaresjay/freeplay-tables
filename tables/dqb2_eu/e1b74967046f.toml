[[cheat]]
id = "exp-multiplier"
name = "EXP Multiplier"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : DQB2_EU.exe
  Date   : 2019-12-08
  Author : CJB
}

[ENABLE]
aobscanmodule(AddXpAOB1,DQB2_EU.exe,8B 91 68 01 00 00) // should be unique
alloc(AddXpMem1,$1000,AddXpAOB1)
label(AddXpRet1)
label(_xpmul)

AddXpMem1:
  push rax
  mov rax,rbx
  movzx rbx,word ptr [_xpmul]
  cdq
  mul bx
  mov rbx,rax
  pop rax

  mov edx,[rcx+00000168]
  jmp AddXpRet1
_xpmul:
  dd 05

AddXpAOB1:
  jmp AddXpMem1
  nop
AddXpRet1:
registersymbol(AddXpAOB1)
registersymbol(_xpmul)


aobscanmodule(AddXpAOB2,DQB2_EU.exe,44 0F B7 7A 38)
alloc(AddXpMem2,$1000,AddXpAOB2)
label(AddXpRet2)

AddXpMem2:
  movzx r15d,word ptr [rdx+38]
  push rax
  mov ax,[_xpmul]
  cdq
  mul r15d
  mov r15d,rax
  pop rax
  jmp AddXpRet2

AddXpAOB2:
  jmp AddXpMem2
AddXpRet2:
registersymbol(AddXpAOB2)

[DISABLE]
AddXpAOB1:
  db 8B 91 68 01 00 00
unregistersymbol(_xpmul)
unregistersymbol(AddXpAOB1)
dealloc(AddXpMem1)

AddXpAOB2:
  db 44 0F B7 7A 38
unregistersymbol(AddXpAOB2)
dealloc(AddXpMem2)"""

