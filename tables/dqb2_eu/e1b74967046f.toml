source = """
{ Game   : DQB2_EU.exe
  Date   : 2019-12-10
  Author : CJB
}

[ENABLE]
aobscanmodule(GetDamageAOB,DQB2_EU.exe,0F B7 84 5F B0 0F 00 00)
alloc(GetDamageMem,$1000,GetDamageAOB)
label(GetDamageRet)
label(_dmgmul)

GetDamageMem:
  movzx eax,word ptr [rdi+rbx*2+00000FB0]
  push rcx
  push rdx
  cdq
  mov cx,[_dmgmul]
  mul cx
  pop rdx
  pop rcx
  jmp GetDamageRet
_dmgmul:
