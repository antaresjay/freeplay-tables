[[cheat]]
id = "player"
name = "Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : CreepyRoad.exe
  Version: 5.6.4.11300998
  Date   : 2019-03-02
  Author : Abystus
}

[ENABLE]
aobscan(playerHook,0F B6 40 40 85 C0 0F 85 18) // should be unique
alloc(newmem,$1000)

label(playerBase)
label(return)

newmem:
  mov [playerBase],eax
  movzx eax,byte ptr [eax+40]
  test eax,eax
  jmp return
playerBase:

playerHook:
  jmp newmem
  nop
return:

registersymbol(playerHook)
registersymbol(playerBase)
[DISABLE]

playerHook:
  db 0F B6 40 40 85 C0

unregistersymbol(playerHook)
unregistersymbol(playerBase)
dealloc(newmem)"""

