[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : BerserkorDie.exe
  Version: 
  Date   : 2025-06-11
  Author : DANGER DASH

  This script does blah blah blah
}

[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

 
 
aobscanmodule(health,GameAssembly.dll,F3 0F 11 73 14 0F 2F) // should be unique
alloc(newmem,$1000,health)
alloc(hlt,4,"GameAssembly.dll"+349192)
label(code)
label(return)

hlt:
dd (float)30

newmem:

movss xmm6,[hlt]

code:
  movss [rbx+14],xmm6
  jmp return

health:
  jmp newmem
return:
registersymbol(health)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
health:
  db F3 0F 11 73 14

unregistersymbol(health)
dealloc(newmem)
dealloc(hlt)"""

