[[cheat]]
id = "on-ground-check"
name = "On Ground Check"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,ONCE_HUMAN.exe,44 89 B7 E0 01 00 00 4C) // should be unique
alloc(newmem,$1000,INJECT)

label(code)
label(return)

newmem:

code:
  mov [rdi+000001E0],0 // Default 4
  jmp return

INJECT:
  jmp newmem
  nop 2
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 44 89 B7 E0 01 00 00

unregistersymbol(INJECT)
dealloc(newmem)"""

