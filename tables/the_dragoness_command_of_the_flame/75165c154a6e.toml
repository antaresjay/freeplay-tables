type = "script"
source = """
//

[ENABLE]

aobscanmodule(InfiniteMapMove,GameAssembly.dll,44 89 75 28 74 0A 33 D2 48 8B CD E8 37) // should be unique
alloc(newmem,$100,InfiniteMapMove)

label(code)
label(return)

registersymbol(InfiniteMapMove)

newmem:
  cmp [rsp+18],rsi
  jne code
  cmp [rsp+F0],rsi
  jne code
  cmp [rsp+128],rsi
  jne code
//cmp [rsp+198],rsi
//jne code
//cmp [rsp+1A0],rsi
//jne code
//cmp [rsp+1F8],rsi
//jne code
  //cmp [rsp+258],rsi
  //jne code
  mov r14d,3E8


code:
  mov [rbp+28],r14d
  je GameAssembly.dll+D408F9
  jmp return

InfiniteMapMove:
  jmp newmem
  nop
return:


[DISABLE]

InfiniteMapMove:
  db 44 89 75 28 74 0A

unregistersymbol(*)
dealloc(*)"""

