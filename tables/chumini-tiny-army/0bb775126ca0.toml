[[cheat]]
id = "playercontroller"
name = "PlayerController"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Chumini Tiny Army.exe
  Version: 
  Date   : 2026-02-06
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,PlayerController:Update)
define(bytes,55 48 8B EC 48 81 EC 10 05 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,PlayerController:Update)

label(code)
label(return)

newmem:
mov [playercontroller_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,00000510
  jmp return

playercontroller_ptr:
dq 0

address:
  jmp newmem
  nop 6
return:
registersymbol(playercontroller_ptr)

[DISABLE]

address:
  db bytes
  // push rbp
  // mov rbp,rsp
  // sub rsp,00000510

dealloc(newmem)
unregistersymbol(playercontroller_ptr)"""

