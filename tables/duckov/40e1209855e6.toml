[[cheat]]
id = "infinite-stamina"
name = "Infinite Stamina"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
//Send@Sintrix|FearlessRevolution
define(address,CharacterMainControl:Update)
define(bytes,55 48 8B EC 48 83 EC 30)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,CharacterMainControl:Update)

label(code)
label(return)

newmem:
mov [rcx+1AC],(float)100
//Send@Sintrix|FearlessRevolution
code:
  push rbp
  mov rbp,rsp
  sub rsp,30
  jmp return

address:
  jmp newmem
  nop 3
return:

[DISABLE]
//Send@Sintrix|FearlessRevolution
address:
  db bytes

dealloc(*)
//Send@Sintrix|FearlessRevolution"""

