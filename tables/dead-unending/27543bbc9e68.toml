[[cheat]]
id = "all-zombie-no-move-chance-in-script"
name = "All Zombie No Move - [ Chance In Script ]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Dead Unending.exe
  Version: 
  Date   : 2023-04-21
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanregion(pData_ZombieScript,zombieScript:Update,zombieScript:Update+4000,F3 0F 10 8E 9C 00 00 00 F3 0F 5A C9 F2 0F 59 C1 F2) // should be unique
alloc(newmem,$1000,pData_ZombieScript)

label(code)
label(return)

newmem:
  mov byte ptr [rsi+000000A0],0        //Moving?         1:Yes  / 0:No
  mov byte ptr [rsi+000000A0],0        //attacking?      1:Yes  / 0:No
  mov byte ptr [rsi+000000B0],0        //IsAngry?        1:Yes  / 0:No
  mov [rsi+000000A4],(float)1          //health
  mov [rsi+000000A8],(float)1          //Damage

code:
  movss xmm1,[rsi+0000009C]
  jmp return

pData_ZombieScript:
  jmp newmem
  nop 3
return:
registersymbol(pData_ZombieScript)

[DISABLE]

pData_ZombieScript:
  db F3 0F 10 8E 9C 00 00 00

unregistersymbol(pData_ZombieScript)
dealloc(newmem)"""

