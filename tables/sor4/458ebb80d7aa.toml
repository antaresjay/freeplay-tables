type = "script"
source = """
[ENABLE]


aobscanmodule(combocd,SOR4.exe,FF 46 68 85 FF)
alloc(newmem,$1000,"SOR4.exe"+42AFE5)

label(code)
label(return)

newmem:
code:
  mov [rsi+68], #999
  test edi,edi
  jmp return

combocd:
  jmp newmem
return:
registersymbol(combocd)

[DISABLE]

combocd:
  db FF 46 68 85 FF

unregistersymbol(combocd)
dealloc(newmem)"""
