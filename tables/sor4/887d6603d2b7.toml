[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(phealth,SOR4.exe,89 46 38 8B 46 38) // should be unique
alloc(newmem,$200,phealth)

label(code)
label(return)

newmem:
cmp byte ptr[rsi+24],0
jne code
mov byte ptr[rsi+3A],64
mov eax,[rsi+38]
jmp return
code:
  mov [rsi+38],eax
  mov eax,[rsi+38]
  jmp return

phealth:
  jmp newmem
  nop
return:
registersymbol(phealth)

[DISABLE]

phealth:
  db 89 46 38 8B 46 38

unregistersymbol(phealth)
dealloc(newmem)"""

