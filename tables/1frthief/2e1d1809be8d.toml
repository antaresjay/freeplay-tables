id = "thief-gold-the-new-dark-1-27-aob-script"
name = "Thief Gold (The New Dark 1.27) AOB script"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : THIEF.EXE
// Author            : Cs
// Executable Version: 1.9.0.0
// Module Version    : 
// Script Date       : 2020-04-22
// Created with      : customAOBInjectionTemplates version: 1.3.6
[ENABLE]
aobscanmodule(aobBaseReader,THIEF.EXE,50 FF D2 A1 ?? ?? ?? ?? C2 04 00 CC CC)
aobscanmodule(aobCurrentSelectionGrabber,THIEF.EXE,8B 44 88 1C C2 08 00)
aobscanmodule(aobInvArrayReader,THIEF.EXE,8B 44 D1 04 8B 4C 24 10 89 01 B8 01 00 00 00 5E C2 0C 00 33 C0 5E C2 0C 00 CC CC CC CC CC 6A 10)
aobscanmodule(aobGoodsReader1,THIEF.EXE,8B 44 24 20 89 5C 24 14 03 08)
aobscanmodule(aobGoodsReader2,THIEF.EXE,8D 54 24 08 89 7C 24 10 0B 58 0C)

alloc(newmemBaseReader,4096,aobBaseReader)

label(aobBaseReader_r)
label(aobBaseReader_i)
registersymbol(aobBaseReader_r)
registersymbol(aobBaseReader_i)

label(lblBaseReader)
label(lblBaseReaderSkip)
label(lblBaseReaderReset)

label(pBase)
label(pInvArray)
registersymbol(pBase)
registersymbol(pInvArray)

label(aobCurrentSelectionGrabber_r)
label(aobCurrentSelectionGrabber_i)
registersymbol(aobCurrentSelectionGrabber_r)
registersymbol(aobCurrentSelectionGrabber_i)

label(lblCurrentSelectionGrabber)
label(lblCurrentSelectionGrabberSkip)
label(lblCurrentSelectionGrabberRet)

label(iCurrentWeapon)
label(iCurrentItem)
registersymbol(iCurrentWeapon)
registersymbol(iCurrentItem)

label(aobInvArrayReader_r)
label(aobInvArrayReader_i)
registersymbol(aobInvArrayReader_r)
registersymbol(aobInvArrayReader_i)

label(lblInvArrayReader)
label(lblInvArrayReaderSkipArrows)
label(lblInvArrayReaderSkipItems)
label(lblInvArrayReaderSkip)
label(lblInvArrayReaderRet)
label(lblInvArrayReaderDoArrow)
label(lblInvArrayReaderDoItem)

label(bEnableMinArrowCount)
label(iMinArrowCount)
label(bEnableMinItemCount)
label(iMinItemCount)
registersymbol(bEnableMinArrowCount)
registersymbol(iMinArrowCount)
registersymbol(bEnableMinItemCount)
registersymbol(iMinItemCount)

label(aobGoodsReader1_r)
registersymbol(aobGoodsReader1_r)

label(lblGoodsReader1)
label(lblGoodsReader1SkipGold)
label(lblGoodsReader1SkipGems)
label(lblGoodsReader1SkipGoods)
label(lblGoodsReader1Ret)

label(bEnableGoldPickupMod)
label(fGoldPickupMod)
label(bEnableGemsPickupMod)
label(fGemsPickupMod)
label(bEnableGoodsPickupMod)
label(fGoodsPickupMod)
registersymbol(bEnableGoldPickupMod)
registersymbol(fGoldPickupMod)
registersymbol(bEnableGemsPickupMod)
registersymbol(fGemsPickupMod)
registersymbol(bEnableGoodsPickupMod)
registersymbol(fGoodsPickupMod)

label(aobGoodsReader2_r)
registersymbol(aobGoodsReader2_r)

label(lblGoodsReader2)
label(lblGoodsReader2SkipGold)
label(lblGoodsReader2SkipGems)
label(lblGoodsReader2SkipGoods)
label(lblGoodsReader2Ret)

label(bEnableMinGold)
label(iMinGold)
label(bEnableMinGems)
label(iMinGems)
label(bEnableMinGoods)
label(iMinGoods)
registersymbol(bEnableMinGold)
registersymbol(iMinGold)
registersymbol(bEnableMinGems)
registersymbol(iMinGems)
registersymbol(bEnableMinGoods)
registersymbol(iMinGoods)

newmemBaseReader:
bEnableMinArrowCount:
dd 1
iMinArrowCount:
dd (int)10
bEnableMinItemCount:
dd 1
iMinItemCount:
dd (int)5
bEnableMinGold:
dd 0
iMinGold:
dd (int)500
bEnableMinGems:
dd 0
iMinGems:
dd (int)250
bEnableMinGoods:
dd 0
iMinGoods:
dd (int)100

bEnableGoldPickupMod:
dd 1
fGoldPickupMod:
dd (float)1.5
bEnableGemsPickupMod:
dd 1
fGemsPickupMod:
dd (float)1.25
bEnableGoodsPickupMod:
dd 1
fGoodsPickupMod:
dd (float)1.25

lblBaseReader:
mov dword ptr [pBase],eax
mov ecx,[eax+50]
test ecx,ecx
jz short lblBaseReaderReset
mov ecx,[ecx+30]
test ecx,ecx
jz short lblBaseReaderReset
mov dword ptr [pInvArray],ecx
mov ecx,[eax]
lblBaseReaderSkip:
readmem(aobBaseReader+08,5)
lblBaseReaderReset:
mov dword ptr [pInvArray],0
jmp short lblBaseReaderSkip
aobBaseReader_i:
readmem(aobBaseReader+08,5)
pBase:
dd 0
pInvArray:
dd 0

lblCurrentSelectionGrabber:
readmem(aobCurrentSelectionGrabber,4)
cmp ecx,0
jne short @f
mov dword ptr [iCurrentWeapon],eax
@@:
cmp ecx,1
jne short @f
mov dword ptr [iCurrentItem],eax
@@:
lblCurrentSelectionGrabberSkip:
readmem(aobCurrentSelectionGrabber+04,3)
jmp lblCurrentSelectionGrabberRet
aobCurrentSelectionGrabber_i:
readmem(aobCurrentSelectionGrabber,7)
iCurrentWeapon:
dd 0
iCurrentItem:
dd 0

lblInvArrayReader:

cmp dword ptr [pInvArray],ecx
jne short lblInvArrayReaderSkip
cmp dword ptr [bEnableMinArrowCount],1
jne short lblInvArrayReaderSkipArrows
mov eax,[ecx+edx*8]
cmp eax,[iCurrentWeapon]
je short lblInvArrayReaderDoArrow
lblInvArrayReaderSkipArrows:

cmp dword ptr [bEnableMinItemCount],1
jne short lblInvArrayReaderSkipItems
mov eax,[ecx+edx*8]
cmp eax,[iCurrentItem]
je short lblInvArrayReaderDoItem
lblInvArrayReaderSkipItems:

lblInvArrayReaderSkip:
readmem(aobInvArrayReader,8)
jmp lblInvArrayReaderRet
aobInvArrayReader_i:
readmem(aobInvArrayReader,8)

lblInvArrayReaderDoArrow:
cmp dword ptr [ecx+edx*8+04],1
jle short lblInvArrayReaderSkip
mov eax,[iMinArrowCount]
cmp dword ptr [ecx+edx*8+04],eax
jge short lblInvArrayReaderSkip
mov dword ptr [ecx+edx*8+04],eax
jmp short lblInvArrayReaderSkip

lblInvArrayReaderDoItem:
cmp dword ptr [ecx+edx*8+04],1
jle short lblInvArrayReaderSkip
mov eax,[iMinItemCount]
cmp dword ptr [ecx+edx*8+04],eax
jge short lblInvArrayReaderSkip
mov dword ptr [ecx+edx*8+04],eax
jmp short lblInvArrayReaderSkip

lblGoodsReader1:
db 8B 44 24 20 89 5C 24 14
cmp dword ptr [bEnableGoldPickupMod],1
jne short lblGoodsReader1SkipGold
fild dword ptr [eax]
fmul dword ptr [fGoldPickupMod]
fistp dword ptr [eax]
lblGoodsReader1SkipGold:
cmp dword ptr [bEnableGemsPickupMod],1
jne short lblGoodsReader1SkipGems
fild dword ptr [eax+04]
fmul dword ptr [fGemsPickupMod]
fistp dword ptr [eax+04]
lblGoodsReader1SkipGems:
cmp dword ptr [bEnableGoodsPickupMod],1
jne short lblGoodsReader1SkipGoods
fild dword ptr [eax+08]
fmul dword ptr [fGoodsPickupMod]
fistp dword ptr [eax+08]
lblGoodsReader1SkipGoods:
jmp lblGoodsReader1Ret

lblGoodsReader2:
cmp dword ptr [bEnableMinGold],1
jne short lblGoodsReader2SkipGold
cmp dword ptr [iMinGold],ecx
jle short lblGoodsReader2SkipGold
mov ecx,[iMinGold]
mov dword ptr [esp+08],ecx
lblGoodsReader2SkipGold:
cmp dword ptr [bEnableMinGems],1
jne short lblGoodsReader2SkipGems
cmp dword ptr [iMinGems],edx
jle short lblGoodsReader2SkipGems
mov edx,[iMinGems]
mov dword ptr [esp+0C],edx
lblGoodsReader2SkipGems:
cmp dword ptr [bEnableMinGoods],1
jne short lblGoodsReader2SkipGoods
cmp dword ptr [iMinGoods],edi
jle short lblGoodsReader2SkipGoods
mov edi,[iMinGoods]
lblGoodsReader2SkipGoods:
db 8D 54 24 08 89 7C 24 10
jmp lblGoodsReader2Ret

aobGoodsReader2:
aobGoodsReader2_r:
jmp lblGoodsReader2
nop
nop
nop
lblGoodsReader2Ret:

aobGoodsReader1:
aobGoodsReader1_r:
jmp lblGoodsReader1
nop
nop
nop
lblGoodsReader1Ret:

aobInvArrayReader:
aobInvArrayReader_r:
jmp lblInvArrayReader
nop 3
lblInvArrayReaderRet:

aobCurrentSelectionGrabber:
aobCurrentSelectionGrabber_r:
jmp lblCurrentSelectionGrabber
nop 2
lblCurrentSelectionGrabberRet:

aobBaseReader+08:
aobBaseReader_r:
jmp lblBaseReader
lblBaseReaderRet:

[DISABLE]
aobBaseReader_r:
readmem(aobBaseReader_i,5)

unregistersymbol(aobBaseReader_r)
unregistersymbol(aobBaseReader_i)

unregistersymbol(pBase)
unregistersymbol(pInvArray)

aobCurrentSelectionGrabber_r:
readmem(aobCurrentSelectionGrabber_i,7)

unregistersymbol(aobCurrentSelectionGrabber_r)
unregistersymbol(aobCurrentSelectionGrabber_i)

unregistersymbol(iCurrentWeapon)
unregistersymbol(iCurrentItem)

aobInvArrayReader_r:
readmem(aobInvArrayReader_i,8)

unregistersymbol(aobInvArrayReader_r)
unregistersymbol(aobInvArrayReader_i)

unregistersymbol(bEnableMinArrowCount)
unregistersymbol(iMinArrowCount)
unregistersymbol(bEnableMinItemCount)
unregistersymbol(iMinItemCount)

aobGoodsReader1_r:
db 8B 44 24 20 89 5C 24 14

unregistersymbol(aobGoodsReader1_r)

unregistersymbol(bEnableGoldPickupMod)
unregistersymbol(fGoldPickupMod)
unregistersymbol(bEnableGemsPickupMod)
unregistersymbol(fGemsPickupMod)
unregistersymbol(bEnableGoodsPickupMod)
unregistersymbol(fGoodsPickupMod)

aobGoodsReader2_r:
db 8D 54 24 08 89 7C 24 10

unregistersymbol(aobGoodsReader2_r)

unregistersymbol(bEnableMinGold)
unregistersymbol(iMinGold)
unregistersymbol(bEnableMinGems)
unregistersymbol(iMinGems)
unregistersymbol(bEnableMinGoods)
unregistersymbol(iMinGoods)

dealloc(newmemBaseReader)"""

