[[cheat]]
id = "100-crit-mc"
name = "~100% Crit MC"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(critYu,P4G.exe,45 3B C6 7C 0D)
alloc(newmem,$1000,critYu)

label(isYu)
label(notYu)
label(return)

newmem:
  push rax
  mov rax,1451BD9E4        // structure de combat de Yu
  cmp rsi,rax
  pop rax
  je isYu                  // si attaquant = Yu -> force crit

notYu:
  cmp r8d,r14d             // comparaison d'origine
  jl P4G.exe+D50F8         // saut conditionnel d'origine
  jmp return

isYu:
  jmp P4G.exe+D50F8        // Yu : toujours crit (eax=2)

return:
  jmp critYu+5

critYu:
  jmp newmem
  nop

[DISABLE]
critYu:
  db 45 3B C6 7C 0D

unregistersymbol(critYu)
dealloc(newmem)"""

