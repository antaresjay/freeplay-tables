[[cheat]]
id = "god-mode"
name = "God Mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send
[ENABLE]

aobscanmodule(health,GameAssembly.dll,29 B7 90 00 00 00)
alloc(newmem,$1000,health)

label(code)
label(return)

newmem:
cmp dword ptr [rdi+0100],0
jne code
mov [rdi+90],#1000
jmp return

code:

  sub [rdi+00000090],esi
  jmp return


health:
  jmp newmem
  nop
return:
registersymbol(health)

[DISABLE]

health:
  db 29 B7 90 00 00 00

unregistersymbol(*)
dealloc(*)"""

