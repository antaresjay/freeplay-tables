[[cheat]]
id = "pointers-fetch"
name = "Pointers Fetch"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Knock.exe
  Version: 
  Date   : 2020-11-20
  Author : DHARMANG1910

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(hpcompnents,GameAssembly.dll,8B 40 1C 85 C0 74 05 8B 40 08) // should be unique
alloc(newmem,$1000)
alloc(herohp,4)
alloc(heroap,4)
alloc(easyflag,4)
label(code)
label(return)
label(isenemy)
label(isap)

easyflag:
db 0

newmem:
mov ebp,[eax+0C]
cmp [ebp+28],0
jne isenemy
cmp [eax+20],2
je isap
mov ebp,[eax+1c]
mov [herohp],ebp
jmp code

isap:
mov ebp,[eax+1c]
mov [heroap],ebp
jmp code


isenemy:
cmp byte ptr [easyflag],0
je code
mov ebp,[eax+1c]
mov [ebp+c],5
jmp code


code:
mov ebp,esp
  mov eax,[eax+1C]
  test eax,eax
  jmp return

hpcompnents:
  jmp newmem
return:
registersymbol(hpcompnents herohp heroap easyflag)

[DISABLE]

hpcompnents:
  db 8B 40 1C 85 C0

unregistersymbol(hpcompnents herohp heroap easyflag)
dealloc(newmem)
dealloc(herohp)
dealloc(heroap)
dealloc(easyflag)"""

