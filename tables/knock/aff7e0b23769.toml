type = "script"
source = """
{ Game   : Knock.exe
  Version: 
  Date   : 2020-11-21
  Author : DHARMANG1910

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(coins,GameAssembly.dll,8B 4C C1 1C 8B 45 10 89) // should be unique
alloc(newmem,$100)

label(code)
label(return)

newmem:
cmp eax,0
jne code
cmp edx,2
jne code
mov [ecx+1c],#9999

code:
  mov ecx,[ecx+eax*8+1C]
  mov eax,[ebp+10]
  jmp return

coins:
