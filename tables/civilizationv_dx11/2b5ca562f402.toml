[[cheat]]
id = "enable-player-faith-options-multiplier-minimum-faith-etc"
name = "Enable Player Faith Options (Multiplier / Minimum Faith, etc)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

{ This code executes on start of turn to add faith to player total }
//aobscanmodule(PlayerFaithOptionsAOB1,"CvGameCore_Expansion2.dll",8B 43 64 03 C6 50 8B CB E8 ?? ?? ?? ?? 8B 4B 28 83 F9 FF) // should be unique
aobscanmodule(PlayerFaithOptionsAOB1,"CvGameCore_Expansion2.dll",8B 43 68 03 C6 50 8B CB E8 ?? ?? ?? ?? 8B 4B 28 83 F9 FF) // should be unique
registersymbol(PlayerFaithOptionsAOB1)
alloc(newmem,1024,PlayerFaithOptionsAOB1)

{ This is the code before the addition of faith that we want to skip since we add even if faith is zero }
aobscanmodule(PlayerFaithOptionsAOB2,"CvGameCore_Expansion2.dll",8B F0 85 F6 7E 31 8D 95 60 FF FF FF 52 6A 15) // should be unique
registersymbol(PlayerFaithOptionsAOB2)

///
label(return)
label(iFaithMinimumAmount)
registersymbol(iFaithMinimumAmount)
label(bDoMinimumFaithAmount)
registersymbol(bDoMinimumFaithAmount)
label(fFaithMultiplier)
registersymbol(fFaithMultiplier)
label(iFaithPerTurnMinimumAmount)
registersymbol(iFaithPerTurnMinimumAmount)

///
newmem:
  cmp dword ptr [ebx+28],0
  jne originalcode
  {So, we have determined this is for human player character }
  { First, Save Some Pointers }
  mov [PlayerPtr],ebx
  { First, we check for minimum faith amount }
  cmp [bDoMinimumFaithAmount],1
  jne SkipDoMinimumFaithAmount
  mov eax,[iFaithMinimumAmount]
  cmp [ebx+68],eax
  jge SkipDoMinimumFaithAmount
  mov [ebx+68],eax
  mov [ebx+6C],eax
SkipDoMinimumFaithAmount:
  {Next, we check for minimum faith per turn amount }
  mov eax,[iFaithPerTurnMinimumAmount]
  cmp esi,eax
  jle DoMinFaithPerTurn
  jmp DoFaithMultiplier
DoMinFaithPerTurn:
  mov esi,eax
  jmp DoFaithMultiplier
DoFaithMultiplier:
  push esi
  fild dword ptr [esp]
  fmul dword ptr [fFaithMultiplier]
  fistp dword ptr [esp]
  pop esi
  jmp originalcode
    
originalcode:
  mov eax,[ebx+68]
  add eax,esi
  jmp return
  
bDoMinimumFaithAmount:
dq 0
iFaithMinimumAmount:
dq #1000
fFaithMultiplier:
dq (float)10.0
iFaithPerTurnMinimumAmount:
dq #2
  
///
PlayerFaithOptionsAOB1:
  jmp newmem
  return:

///
PlayerFaithOptionsAOB2+4:
  db 90 90
  
[DISABLE]

///
PlayerFaithOptionsAOB1:
 db 8B 43 68 03 C6

unregistersymbol(PlayerFaithOptionsAOB1)
unregistersymbol(iFaithMinimumAmount)
unregistersymbol(bDoMinimumFaithAmount)
unregistersymbol(fFaithMultiplier)
unregistersymbol(iFaithPerTurnMinimumAmount)

PlayerFaithOptionsAOB2+4:
  db 7E 31
  
dealloc(newmem)"""

