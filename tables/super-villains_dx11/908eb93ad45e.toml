source = """
//Send@ModEngine
[ENABLE]

aobscanmodule(studsmultiplier,LEGO DC Super-villains_DX11.exe,48 89 7B 30 48 89 7B 28)
alloc(newmem,$1000,studsmultiplier)
registersymbol(studs)
