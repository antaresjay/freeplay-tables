[[cheat]]
id = "set-hp-enemy-player-both"
name = "set_HP (Enemy & Player Both)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : CrescentTower.exe
  Version: 1.0.0
  Date   : 2025-08-24
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,ParameterBase:set_HP)
define(bytes,55 48 8B EC 48 83 EC 30)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,ParameterBase:set_HP)

label(code)
label(return)

newmem:

mov [enemy_parameter_base_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,30
  jmp return

enemy_parameter_base_ptr:
dq 0

address:
  jmp newmem
  nop 3
return:
registersymbol(enemy_parameter_base_ptr)

[DISABLE]

address:
  db bytes
  // push rbp
  // mov rbp,rsp
  // sub rsp,30

dealloc(newmem)
unregistersymbol(enemy_parameter_base_ptr)

{
// ORIGINAL CODE - INJECTION POINT: ParameterBase:set_HP

1B5C7ED714B: 00 04 02                       - add [rdx+rax],al
1B5C7ED714E: 00 00                          - add [rax],al
