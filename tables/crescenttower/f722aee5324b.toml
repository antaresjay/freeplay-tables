1B5C7ED715A: 00 00                          - add [rax],al
1B5C7ED715C: 00 00                          - add [rax],al
1B5C7ED715E: 00 00                          - add [rax],al
// ---------- INJECTING HERE ----------
ParameterBase:set_HP: 55                             - push rbp
// ---------- DONE INJECTING  ----------
ParameterBase:set_HP+1: 48 8B EC                       - mov rbp,rsp
ParameterBase:set_HP+4: 48 83 EC 30                    - sub rsp,30
ParameterBase:set_HP+8: 48 89 7D F8                    - mov [rbp-08],rdi
ParameterBase:set_HP+c: 48 8B F9                       - mov rdi,rcx
ParameterBase:set_HP+f: 48 89 55 F0                    - mov [rbp-10],rdx
ParameterBase:set_HP+13: 4C 63 47 18                    - movsxd  r8,dword ptr [rdi+18]
ParameterBase:set_HP+17: 48 63 4D F0                    - movsxd  rcx,dword ptr [rbp-10]
ParameterBase:set_HP+1b: 33 D2                          - xor edx,edx
ParameterBase:set_HP+1d: 90                             - nop 
ParameterBase:set_HP+1e: 49 BB 80 D3 78 7E B5 01 00 00  - mov r11,UnityEngine.Mathf:Clamp
}"""

