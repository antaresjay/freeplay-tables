type = "script"
source = """
{ Game   : MetalMutation.exe
  Version:
  Date   : 2023-05-06
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(pBase_Currencies,GameAssembly.dll,41 89 4E 20 83 BE 48 01 00 00 00) // should be unique
alloc(newmem,$1000,pBase_Currencies)

label(code)
label(return)

newmem:
  mov ecx,#999111

code:
  mov [r14+20],ecx
  cmp dword ptr [rsi+00000148],00
  jmp return

pBase_Currencies:
  jmp newmem
  nop 6
return:
registersymbol(pBase_Currencies)

[DISABLE]

pBase_Currencies:
  db 41 89 4E 20 83 BE 48 01 00 00 00

unregistersymbol(pBase_Currencies)
dealloc(newmem)"""

