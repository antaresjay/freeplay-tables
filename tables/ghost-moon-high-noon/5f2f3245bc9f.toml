type = "script"
source = """
//Send@FearlessRevolution|Sintrix
define(address,PlayerHealth:TakeDamage+13)
define(bytes,0F B6 47 59 85 C0)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,PlayerHealth:TakeDamage+13)

