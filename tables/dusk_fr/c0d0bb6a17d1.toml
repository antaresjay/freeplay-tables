[[cheat]]
id = "health-some-inside-weapon-wheel"
name = "Health. (Some inside Weapon Wheel)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(Salud,18 F3 0F 10 46 78)
alloc(newmem,$100,Salud)
alloc(player,8)
player:
  dq 0
registersymbol(player)

label(code)
label(return)

newmem:
  test rsi,rsi
  je code
  mov [player],rsi

code:
  movss xmm0,[rsi+78]
  jmp return

Salud+01:
  jmp newmem

return:
registersymbol(Salud)

[DISABLE]

Salud+01:
  db F3 0F 10 46 78

unregistersymbol(*)
dealloc(*)"""

