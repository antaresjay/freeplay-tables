[[cheat]]
id = "godmode"
name = "GodMode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(Salud,18 F3 0F 10 46 78)
alloc(newmem,$100,Salud)

label(godMode)
registersymbol(godMode)

label(code)
label(return)


newmem:
  test rsi,rsi
  je code
  mov al,[godMode]
  mov byte ptr [rsi+81],al
  mov [rsi+7C],(float)100

code:
  movss xmm0,[rsi+78]
  jmp return

godMode:
  db 1

Salud+01:
  jmp newmem
return:
registersymbol(Salud)

[DISABLE]

Salud+01:
  db F3 0F 10 46 78

unregistersymbol(*)
dealloc(*)"""

