[[cheat]]
id = "data-base-address-scan-to-update-battle"
name = "Data Base Address Scan (To Update: Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(data_savedAOB)
label(data_returnhere)
label(data_originalcode)
label(data_exit)


label(data_1_exit)
label(data_2_exit)
label(data_3_exit)
label(data_4_exit)
label(data_5_exit)

label(data_end_exit)

registersymbol(data_savedAOB)

aobscan(data_searchedAOB,DD 06 B0 01 DD 1F 5F 5E)

alloc(data_newmem,2048) //2kb should be enough
alloc(data_temp,4)


data_newmem:
mov [data_temp], ebx

cmp dword ptr [esi+10], #0
je data_end_exit

// Check matching Item IDs
mov ebx, [data_1_id_value]
cmp dword ptr [esi+10], ebx
jne data_1_exit
mov [data_1_basepointer], esi
// Check Item Set Quantity
cmp dword ptr [data_1_quantityset_enable], #0
je data_1_exit
fild [data_1_quantity_value]
fstp qword ptr [esi]
data_1_exit:

// Check matching Item IDs
mov ebx, [data_2_id_value]
cmp dword ptr [esi+10], ebx
jne data_2_exit
mov [data_2_basepointer], esi
// Check Item Set Quantity
cmp dword ptr [data_2_quantityset_enable], #0
je data_2_exit
fild [data_2_quantity_value]
fstp qword ptr [esi]
data_2_exit:

// Check matching Item IDs
mov ebx, [data_3_id_value]
cmp dword ptr [esi+10], ebx
jne data_3_exit
mov [data_3_basepointer], esi
// Check Item Set Quantity
cmp dword ptr [data_3_quantityset_enable], #0
je data_3_exit
fild [data_3_quantity_value]
fstp qword ptr [esi]
data_3_exit:

// Check matching Item IDs
mov ebx, [data_4_id_value]
cmp dword ptr [esi+10], ebx
jne data_4_exit
mov [data_4_basepointer], esi
// Check Item Set Quantity
cmp dword ptr [data_4_quantityset_enable], #0
je data_4_exit
fild [data_4_quantity_value]
fstp qword ptr [esi]
data_4_exit:

// Check matching Item IDs
mov ebx, [data_5_id_value]
cmp dword ptr [esi+10], ebx
jne data_5_exit
mov [data_5_basepointer], esi
// Check Item Set Quantity
cmp dword ptr [data_5_quantityset_enable], #0
je data_5_exit
fild [data_5_quantity_value]
fstp qword ptr [esi]
data_5_exit:


data_end_exit:
mov ebx, [data_temp]


data_originalcode:
db DD 06 B0 01 DD 1F
//fld qword ptr [esi]
//mov al,01
//fstp qword ptr [edi]


data_exit:
jmp data_returnhere


data_searchedAOB:
data_savedAOB:
jmp data_newmem
nop
data_returnhere:


[DISABLE]
data_savedAOB:
db DD 06 B0 01 DD 1F
//fld qword ptr [esi]
//mov al,01
//fstp qword ptr [edi]

unregistersymbol(data_savedAOB)

dealloc(data_newmem)
dealloc(data_temp)"""

