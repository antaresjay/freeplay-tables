name = "Infinite Ink Orbs"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(orbiess,GameAssembly.dll,44 8B 70 20 48 8B 86 C8 00 00 00 48 85 C0)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov [rax+20], #6

code:
  mov r14d,[rax+20]
  mov rax,[rsi+000000C8]
  test rax,rax
  jmp return

orbiess:
  jmp far newmem
return:
registersymbol(orbiess)

[DISABLE]

orbiess:
  db 44 8B 70 20 48 8B 86 C8 00 00 00 48 85 C0

unregistersymbol(orbiess)
dealloc(newmem)"""
