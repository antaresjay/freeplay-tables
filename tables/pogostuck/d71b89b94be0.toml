[[cheat]]
id = "xp-x10"
name = "XP x10"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
// Substitua os bytes abaixo por uma sequência exclusiva em volta da instrução de XP
aobscan(xpHook,FF 83 48 21 08 00) // <-- Alvo: inc [ebx+82148]
alloc(newmem,1024)
label(code)
label(return)

newmem:
code:
  add dword ptr [ebx+82148],10   // Aumenta ganho de XP em 10 (em vez de inc = +1)
  jmp return

xpHook:
  jmp newmem
  nop
return:

[DISABLE]

xpHook:
  db FF 83 48 21 08 00 // Restaura: inc [ebx+82148]

dealloc(newmem)"""

