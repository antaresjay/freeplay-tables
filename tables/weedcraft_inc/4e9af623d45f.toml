[[cheat]]
id = "worker-skills-open-worker-profile-first"
name = "Worker Skills (Open Worker Profile First)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(skills,48 63 40 1C 41 89 46 24) //WOW.Character:CharacterUITypeDependantContent:SkillsSliderSetup+c4
alloc(newmem,1024,skills)
label(loop)
label(write)
label(skip)
label(addressesArray)
label(nextFreeArrayElem)
label(code)
label(return)

registersymbol(skills)
registersymbol(addressesArray)

newmem:
  pushfq
  push rcx
  push rsi
  push rdx

  xor rcx,rcx
  xor rsi,rsi
  xor rdx,rdx

  mov rsi, [nextFreeArrayElem]
  cmp rsi,3 //Array size = 3 x 8 bytes
  je code //When full, leave (3 addresses max.)

  lea rcx, [rax+1C] //read address

  push rsi
  test rsi,rsi //Checks if the array is empty
  je write //If so, write first element
  xor rsi,rsi

loop: //Looping through the array in order to insert the new instance
  cmp [rsp],rsi //If esi = nextFreeArrayElemIndex, then it means the address to insert isn't a duplicate
  je write
  {Loops through the array in order to check for duplicates}
  push rsi
  push rdx
  imul rsi,rsi,08
  lea rdx,[addressesArray]
  cmp [rdx+rsi],rcx //Compare the current array element with the current address
  pop rdx
  pop rsi
  mov rdx,[rsp] //Saves current nextFreeArrayElemIndex (if we find the duplicate the array remains untouched)
  je skip //Duplicate?
  add rsi,1 //No, next array element
  jmp loop

write:
  push rsi
  push rdx
  imul rsi,rsi,08
  lea rdx,[addressesArray]
  mov [rdx+rsi],rcx //Write address
  pop rdx
  pop rsi

  {update nextFreeArrayElem}
  add rsi,1
  mov rdx,rsi
skip:
  pop rsi
  mov qword ptr [nextFreeArrayElem],rdx

code:
  pop rdx
  pop rsi
  pop rcx
  popfq
  {orignial code}
  movsxd rax,dword ptr [rax+1C]
  mov [r14+24],eax
  jmp return

newmem+500:
nextFreeArrayElem:
 dq 0

newmem+520:
addressesArray:
 dq 0

skills:
  jmp newmem
  nop
  nop
  nop
return:

[DISABLE]

skills:
