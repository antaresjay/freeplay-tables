1F33B104DD8: 00 00                          - add [rax],al
1F33B104DDA: 00 00                          - add [rax],al
1F33B104DDC: 00 00                          - add [rax],al
1F33B104DDE: 00 00                          - add [rax],al
// ---------- INJECTING HERE ----------
Player:Update: 55                             - push rbp
// ---------- DONE INJECTING  ----------
Player:Update+1: 48 8B EC                       - mov rbp,rsp
Player:Update+4: 48 83 EC 30                    - sub rsp,30
Player:Update+8: 48 89 75 F8                    - mov [rbp-08],rsi
Player:Update+c: 48 8B F1                       - mov rsi,rcx
Player:Update+f: 0F B6 86 D4 02 00 00           - movzx eax,byte ptr [rsi+000002D4]
Player:Update+16: 85 C0                          - test eax,eax
Player:Update+18: 0F 84 0D 03 00 00              - je Player:Update+32b
Player:Update+1e: 0F B6 86 C4 02 00 00           - movzx eax,byte ptr [rsi+000002C4]
Player:Update+25: 85 C0                          - test eax,eax
Player:Update+27: 0F 85 FE 02 00 00              - jne Player:Update+32b
