[[cheat]]
id = "activate-cheats"
name = "Activate Cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(playerHook,Raji-WinGDK-Shipping.exe,48 8B 01 FF 90 30 07 00 00 F3) // should be unique
alloc(newmem,$1000,playerHook)

label(code)
label(return)
label(playerPTR)

newmem:
  mov [playerPTR], rcx
code:
  mov rax,[rcx]
  call qword ptr [rax+00000730]
  jmp return

playerPTR:
  dq 0

playerHook:
  jmp newmem
  nop 4

return:
registersymbol(playerHook)
registersymbol(playerPTR)

[DISABLE]
playerHook:
  db 48 8B 01 FF 90 30 07 00 00

unregistersymbol(playerHook)
unregistersymbol(playerPTR)
dealloc(newmem)"""

