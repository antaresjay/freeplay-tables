[[cheat]]
id = "no-reload"
name = "No Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
// No reloading for player in AC3 v1.06
// original by ???, Mod by HenryEx

[ENABLE]
alloc(NoReload,256)
aobscan(AOBAmmo,C2 04 00 * * 89 48 08 5E 5D C2 04 00)
// ---------------------------
// Declaration
registersymbol(AOBAmmo)
label(_returnhere)

// ---------------------------
// Hacking Points
AOBAmmo+3: //"AC3SP.exe"+CAC0DB
 jmp NoReload
_returnhere:

// ---------------------------
// Code Section
NoReload:
 sub ecx,edx
 mov [eax+08],ecx
 pushfd
 cmp [eax+18],#35
 jne +6
 mov ecx,[eax+0C]
 mov [eax+08],ecx
 popfd
 jmp _returnhere

[DISABLE]
AOBAmmo+3: //"AC3SP.exe"+CAC0DB
 sub ecx,edx
 mov [eax+08],ecx

unregistersymbol(AOBAmmo)
dealloc(NoReload)"""

