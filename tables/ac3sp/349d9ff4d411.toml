[[cheat]]
id = "teleport"
name = "Teleport"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
// Teleportation and Flying script for AC3 v1.06
// adapted by HenryEx
// When multiple flags are set, LOAD is executed first, so that you can Undo

/* Reference code
AC3SP.exe+BB55A6 - add eax,10
AC3SP.exe+BB55A9 - cmp dword ptr [esi+70],06
AC3SP.exe+BB55AD - movaps xmm0,[AC3SP.exe+1759C40]
AC3SP.exe+BB55B4 - movaps xmm2,[eax+30]  <<-- jacking point -->>
AC3SP.exe+BB55B8 - movaps xmm1,xmm0
AC3SP.exe+BB55BB - andnps xmm1,xmm2
AC3SP.exe+BB55BE - xorps xmm2,xmm2
AC3SP.exe+BB55C1 - andps xmm0,xmm2
AC3SP.exe+BB55C4 - orps xmm1,xmm0
AC3SP.exe+BB55C7 - movaps [esi],xmm1
*/

[ENABLE]
alloc(AC3Tele,512)
aobscan(AOBTeleport,0F 28 50 30 0F 28 C8 0F 55 CA 0F 57 D2 0F 54 C2 0F 56 C8 0F 29 0E 74 06)
// ---------------------------
// Declaration
registersymbol(AC3Tele)
registersymbol(AOBTeleport)
label(_SavePos)
label(_LoadPos)
label(_UndoPos)
label(_Fly)
label(_Fly2)
label(_Fly3)
label(_BackTele)
label(_Exit)

// ---------------------------
// Hacking Points
AOBTeleport:
 jmp AC3Tele+4
 nop
 nop
_BackTele:

// ---------------------------
// Code Section
AC3Tele:
 dd 0

 pushfd
 cmp dword ptr [AC3Tele],0
 jz short _Exit
 cmp byte ptr [AC3Tele+3],0
 jne _Fly
 cmp byte ptr [AC3Tele+1],0
 jne short _LoadPos
 cmp byte ptr [AC3Tele],0
 jne short _SavePos
 cmp byte ptr [AC3Tele+2],0
 jne short _UndoPos

_Exit:
 popfd
 movaps xmm2,[eax+30]
 movaps xmm1,xmm0
 jmp _BackTele

_SavePos:
 mov byte ptr [AC3Tele],0
 cmp dword ptr [eax+30],00
 jz _Exit
 pushad
 mov ecx,3
 lea esi,[eax+30]
 lea edi,[AC3Tele+130]
 repe movsd
 popad
 jmp _Exit

_LoadPos:
 mov byte ptr [AC3Tele+1],0
 cmp dword ptr [AC3Tele+130],00
 jz _Exit
 pushad
 mov ecx,3
 lea esi,[eax+30]
 lea edi,[AC3Tele+140]
 repe movsd
 mov ecx,3
 lea esi,[AC3Tele+130]
 lea edi,[eax+30]
 repe movsd
 popad
 jmp _Exit

_UndoPos:
 mov byte ptr [AC3Tele+2],0
 cmp dword ptr [AC3Tele+140],00
 jz _Exit
 pushad
 mov ecx,3
 lea esi,[AC3Tele+140]
 lea edi,[eax+30]
 repe movsd
 popad
 jmp _Exit

_Fly:
 cmp byte ptr [AC3Tele+3],1
 jne short _Fly2

 pushad
 mov ecx,3
 lea esi,[eax+30]
 lea edi,[AC3Tele+150]
 repe movsd
 inc byte ptr [AC3Tele+3]
 popad
 jmp _Exit

_Fly2:
 pushad
 cmp byte ptr [AC3Tele+3],2
 ja short _Fly3
 mov ecx,3
 lea esi,[AC3Tele+150]
 lea edi,[eax+30]
 repe movsd
 popad
 jmp _Exit

_Fly3:
 lea esi,[AC3Tele+150]
 xor ecx,ecx
 mov [esi],ecx
 mov [esi+4],ecx
 mov [esi+8],ecx
 mov [esi+C],ecx
 mov byte ptr [AC3Tele+3],0
 popad
 jmp _Exit


[DISABLE]
AOBTeleport:
 movaps xmm2,[eax+30]
 movaps xmm1,xmm0

unregistersymbol(AC3Tele)
unregistersymbol(AOBTeleport)
dealloc(AC3Tele)"""

