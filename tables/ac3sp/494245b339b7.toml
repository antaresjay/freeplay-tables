[[cheat]]
id = "no-reload"
name = "no_reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
//structure
//eax+08 - current
//eax+0c - max
//eax+10 - max
//eax+18 - 35 player, 70 enemy
//eax+20 - 35 player, 70 enemy
//eax+28 - 35 player, 70 enemy
//eax+30 - 35 player, 70 enemy

[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

alloc(ammo,2048) //2kb should be enough
label(returnhere)
label(originalcode)
label(exit)
label(aobammo_jmp)
registersymbol(aobammo_jmp)
aobscan(aobammo,C2 04 00 * * 89 48 08 5E 5D C2 04 00)

ammo: //this is allocated memory, you have read,write,execute access
//place your code here
sub ecx,edx
mov [eax+08],ecx
pushfd
cmp [eax+18],#35
jne +6
mov ecx,[eax+0c]
mov [eax+08],ecx
popfd

originalcode:
//sub ecx,edx
//mov [eax+08],ecx

exit:
jmp returnhere

aobammo+3: //"AC3SP.exe"+CCD43B
aobammo_jmp:
jmp ammo
returnhere:

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
aobammo_jmp: //"AC3SP.exe"+CCD43B
sub ecx,edx
mov [eax+08],ecx
dealloc(ammo)
unregistersymbol(aobammo_jmp)"""

