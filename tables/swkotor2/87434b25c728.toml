newmem:
bEnableEasyPazaak:
dd 1
bEnableGodMode:
dd 1
bEnableMoveSpeedMod:
dd 1
fMoveSpeedMod:
dd (float)2.5
bEnableSwoopBoost:
dd 1
fSwoopBoostRate:
dd (float)0.75
bEnableFreeForceUse:
dd 1
bEnableMinUpgrades:
dd 0
iMinUpgrades:
dd (int)5
bEnableMinCredits:
dd 0
iMinCredits:
dd (int)50000
bEnableMinComponents:
dd 0
iMinComponents:
dd (int)600
bEnableMinChems:
dd 0
