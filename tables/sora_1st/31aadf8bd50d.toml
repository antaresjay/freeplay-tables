[[cheat]]
id = "reset-play-time"
name = "Reset Play Time"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(playtime,sora_1st.exe,F2 0F 58 83 08 39 1F 00) // should be unique
alloc(newmem,$1000,playtime)

label(code)
label(return)

newmem:
  mov qword ptr [rbx+001F3908],0
code:
  addsd xmm0,[rbx+001F3908]
  jmp return

playtime:
  jmp newmem
  nop 3
return:
registersymbol(playtime)

[DISABLE]

playtime:
  db F2 0F 58 83 08 39 1F 00

unregistersymbol(playtime)
dealloc(newmem)"""
