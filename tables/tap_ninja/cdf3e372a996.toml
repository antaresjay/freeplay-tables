source = """
define(address,"GameAssembly.dll"+673EBC)
define(bytes,8B 44 99 20 48 83 C4 20)

[ENABLE]

//Send@Sintrix|FearlessRevolution


assert(address,bytes)
alloc(newmem,$1000,"GameAssembly.dll"+673EBC)

label(code)
label(return)

newmem:

code:
  mov eax,[rcx+rbx*4+20]
