[[cheat]]
id = "infinite-resources"
name = "Infinite Resources"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(resources, NorthernTale4.exe, 29 08 83 FE 04)
alloc(newmem, $1000)
label(return)

newmem:
nop
//sub [eax],ecx
cmp esi,04
jmp return

resources:
jmp newmem
return:
registersymbol(resources)

[DISABLE]
resources:
db 29 08 83 FE 04
unregistersymbol(resources)
dealloc(newmem)"""

