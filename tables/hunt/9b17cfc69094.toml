[[cheat]]
id = "set-xp-after-match"
name = "Set xp after match"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : West Hunt.exe
  Version: 
  Date   : 2022-06-30
  Author : Chr0nicxHack3r#6641

  This script does blah blah blah
}

[ENABLE]
aobscan(AOB,18 89 48 38 48 8B 47 20) // should be unique
alloc(newmem,$1000,AOB)
label(code,return)

alloc(xpinput,4)

xpinput:
 dd #1

registersymbol(xpinput)

newmem:
  mov ecx,[xpinput]

code:
  mov [rax+38],ecx
  mov rax,[rdi+20]
  jmp return

AOB+01:
  jmp newmem
  nop 2
return:
registersymbol(AOB)

[DISABLE]
AOB+01:
  db 89 48 38 48 8B 47 20

unregistersymbol(AOB,xpinput)
dealloc(newmem,xpinput)"""

