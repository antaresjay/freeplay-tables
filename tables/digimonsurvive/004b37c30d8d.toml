[[cheat]]
id = "multiply-exp"
name = "Multiply EXP"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(EXP_multi,BattleUnitManager:GetExp,BattleUnitManager:GetExp+28b,48 63 86 84 01 00 00) // should be unique
alloc(newmem,$1000,EXP_multi)

label(code)
label(return)

alloc(Multiplier,4)
registersymbol(Multiplier)

Multiplier:
dd 4

newmem:
  push ebx
  mov ebx,[rsi+00000184]
  imul ebx,[Multiplier]
  movsxd  rax,ebx
  pop ebx
code:
  //movsxd  rax,dword ptr [rsi+00000184]
  jmp return

EXP_multi:
  jmp newmem
  nop 2
return:
registersymbol(EXP_multi)

[DISABLE]

EXP_multi:
  db 48 63 86 84 01 00 00

unregistersymbol(Multiplier)
dealloc(Multiplier)

unregistersymbol(EXP_multi)
dealloc(newmem)"""

