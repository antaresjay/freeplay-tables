type = "script"
source = """
[ENABLE]

aobscanmodule(unlim_dash,Dungeons of Clay.exe,C7 43 04 00 00 00 00 C7 03 00 00 00 00 C7 84 24 68 13 00 00 84) // should be unique
alloc(newmem,$1000)
alloc(player,8)
//alloc(unlim,8)

label(code)
label(return)
label(unlim)
registersymbol(player)
registersymbol(unlim)

newmem:
 mov [player],ebx
 cmp [unlim],01
 jne code
 nop
 nop
 nop
 nop
 nop
 nop
 nop
 jmp return

code:

  mov [ebx+04],00000000
  jmp return

unlim:
dd 0


unlim_dash:
  jmp newmem
  nop 2
return:
registersymbol(unlim_dash)


[DISABLE]

unlim_dash:
  db C7 43 04 00 00 00 00

unregistersymbol(unlim_dash)
dealloc(newmem)
unregistersymbol(player)
unregistersymbol(unlim)

{
// ORIGINAL CODE - INJECTION POINT: 00FF12F0

00FF12C3: 84 C0                             - test al,al
