00FF12E4: E8 67 15 92 FF                    - call 00912850
00FF12E9: C7 43 0C 00 00 00 00              - mov [ebx+0C],00000000
// ---------- INJECTING HERE ----------
00FF12F0: C7 43 04 00 00 00 00              - mov [ebx+04],00000000
// ---------- DONE INJECTING  ----------
00FF12F7: C7 03 00 00 00 00                 - mov [ebx],00000000
00FF12FD: C7 84 24 68 13 00 00 84 01 00 00  - mov [esp+00001368],00000184
00FF1308: B8 FF FF FF 00                    - mov eax,00FFFFFF
00FF130D: 03 84 24 3C 0F 00 00              - add eax,[esp+00000F3C]
00FF1314: A9 FC FF FF 00                    - test eax,00FFFFFC
00FF1319: 75 0F                             - jne 00FF132A
