[[cheat]]
id = "stats-changer"
name = "Stats Changer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : NMS.exe
  Version:
  Date   : 2020-07-20

  The Multitool, Spaceship, and Freighter have some base stats that are
  accessed by this each frame when the appropriate tab is open.

  To use, open the multitool tab and enable the script, then change to
  the starship tab, then the freighter tab.

  In order:

  1) Multitool damage
  2) Multitool mining
  3) Multitool scan

  4) Ship damage
  5) Ship shields
  6) Ship hyperdrive

  7) Hyperdrive
  8) Fleet Coordination
}


[ENABLE]

aobscanmodule(INJECT_TECH_BASE_STATS,NMS.exe,07 48 89 44 24 20 48 3B C2 74 1F 0F 10 00 0F 11 01 F2 0F 10 48 10) // should be unique
alloc(newmem,$1000,"NMS.exe"+4932C0)


label(code)
label(return)
label(pTech)
label(Done)
label(MyLoop)
label(FoundEmpty)

newmem:

code:
  push rbx
  push rcx
  push rsi

  mov rsi,pTech
  mov rcx,0

MyLoop:
  mov rbx,[rsi+rcx*8]
  test rbx,rbx
  jz FoundEmpty
  cmp rax,rbx
  je Done // already have this address
  inc rcx
  cmp rcx,8
  jb MyLoop
  jmp Done // end of space, only storing 8 locations

FoundEmpty:
  mov [rsi+rcx*8],rax
  jmp Done

Done:
  pop rsi
  pop rcx
  pop rbx

  movsd xmm1,[rax+10] // original code
  jmp return

align 10
pTech:
  dq 0 0 0 0 0 0 0 0


INJECT_TECH_BASE_STATS+11:
  jmp newmem
return:
registersymbol(INJECT_TECH_BASE_STATS)
registersymbol(pTech)

[DISABLE]

INJECT_TECH_BASE_STATS+11:
  db F2 0F 10 48 10

unregistersymbol(INJECT_TECH_BASE_STATS)
unregistersymbol(pTech)
dealloc(newmem)

