[[cheat]]
id = "cheat-stats-enable-when-looking-at-a-milestones-tab"
name = "CHEAT: Stats (Enable when looking at a Milestones tab)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : NMS.exe
  Version: 

  Interesting - location where stats are loaded.   An example is for the
  mercenary guild.   When the 'Milestones' tab is opened for the mercenary
  guild, this is called each frame for each of the stats.

  NOTE:  This is called at other times too, but SEEMS to be mostly for the stats.
  If the mercenary guild tab is open, this is called 4 times each frame, in order
  for the values displayed.

  1) Loads value '71', which seems to be top-left 'Standing' showing me as
     trade lord with 29 missions to next level which would be an even 100
  2) Loads value '528' which is missions completed.  Upping this enables you to
     take on tougher msisions at the mission board
  3) Loads value '192' which seems to be words learned.  I don't know if changing
     this might affect translations, but I DOUBT IT
  4) Loads value '10' which is System Visited
}

[ENABLE]

aobscanmodule(CHEAT_STATS,NMS.exe,00 8B 00 48 83 C4 28) // should be unique
alloc(newmem,$1000,"NMS.exe"+47F22D)

label(code)
label(return)
label(MyLoop)
label(FoundEmpty)
label(Done)
label(pStats)

newmem:

code:
  push rbx
  push rcx
  push rsi

  mov rsi,pStats
  mov rcx,0

MyLoop:
  mov rbx,[rsi+rcx*8]
  test rbx,rbx
  jz FoundEmpty
  cmp rbx,rax
  je Done // already have this address
  inc rcx
  cmp rcx,8
  jb MyLoop
  jmp Done // end of space, only storing 8 locations

FoundEmpty:
  mov [rsi+rcx*8],rax
  jmp Done

Done:
  pop rsi
  pop rcx
  pop rbx

  // original code
  mov eax,[rax]
  add rsp,28
  jmp return

align 10
pStats:
  dq 0 0 0 0 0 0 0 0

CHEAT_STATS+01:
  jmp newmem
  nop
return:
registersymbol(CHEAT_STATS)
registersymbol(pStats)


[DISABLE]

CHEAT_STATS+01:
  db 8B 00 48 83 C4 28

unregistersymbol(CHEAT_STATS)
unregistersymbol(pStats)
dealloc(newmem)

