label(return)
label(pTech)
label(Done)
label(MyLoop)
label(FoundEmpty)

newmem:

code:
  push rbx
  push rcx
  push rsi

  mov rsi,pTech
  mov rcx,0

MyLoop:
  mov rbx,[rsi+rcx*8]
  test rbx,rbx
  jz FoundEmpty
  cmp rax,rbx
  je Done // already have this address
  inc rcx
  cmp rcx,8
  jb MyLoop
  jmp Done // end of space, only storing 8 locations

FoundEmpty:
  mov [rsi+rcx*8],rax
  jmp Done

Done:
  pop rsi
  pop rcx
  pop rbx

  movsd xmm1,[rax+10] // original code
  jmp return

align 10
pTech:
  dq 0 0 0 0 0 0 0 0


INJECT_TECH_BASE_STATS+11:
  jmp newmem
return:
