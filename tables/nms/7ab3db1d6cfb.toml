[[cheat]]
id = "cheat-full-stack-up-to-5k-when-picking-up-item"
name = "CHEAT: Full stack (up to 5k) when picking up item"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : NMS.exe
  Version: 
  Date   : 2020-07-19
}

[ENABLE]

aobscanmodule(CHEAT_FULL_STACK_ON_PICKUP,NMS.exe,8B 40 18 39 86 F8 E4 00 00) // should be unique
alloc(newmem,$1000,"NMS.exe"+77B89A)

label(code)
label(return)

newmem:

code:
  push rsi
  cmp [rax+18],#5000
  jge done // stack is already 5000, skip

  mov esi,[rax+1c]
  cmp esi,#5000
  jle @F
  mov esi,#5000 // max 5000 for stack
@@:
  mov [rax+18],esi

done:
  pop rsi

  mov eax,[rax+18]
  cmp [rsi+0000E4F8],eax
  jmp return

CHEAT_FULL_STACK_ON_PICKUP:
  jmp newmem
  nop 4
return:
registersymbol(CHEAT_FULL_STACK_ON_PICKUP)

[DISABLE]

CHEAT_FULL_STACK_ON_PICKUP:
  db 8B 40 18 39 86 F8 E4 00 00

unregistersymbol(CHEAT_FULL_STACK_ON_PICKUP)
dealloc(newmem)

