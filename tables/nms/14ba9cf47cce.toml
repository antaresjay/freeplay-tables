[[cheat]]
id = "damage-multiplier-ohk"
name = "Damage Multiplier + OHK"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game   : NMS.exe
  Version:
  Date   : 2020-02-20
  Author : Squall8
}

[ENABLE]

aobscanmodule(dmmohk,NMS.exe,41 03 FD 41 8B 04 24)
alloc(newmem,$1000,dmmohk)

label(code)
label(return)
label(dmmohkx)
label(ohkf)
label(ohk)

registersymbol(dmmohk)
registersymbol(dmmohkx)
registersymbol(ohkf)

newmem:
  cmp [ohkf],1
  je ohk

code:
  imul r13d,[dmmohkx]
  add edi,r13d
  mov eax,[r12]
  jmp return

ohk:
  mov eax,[r12]
  mov edi,eax
  jmp return

dmmohkx:
  dq 1

ohkf:
  dq 0

dmmohk:
  jmp newmem
  nop 2
return:

[DISABLE]

dmmohk:
  db 41 03 FD 41 8B 04 24

unregistersymbol(dmmohk)
unregistersymbol(dmmohkx)
unregistersymbol(ohkf)
dealloc(newmem)"""

