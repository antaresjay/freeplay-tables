type = "script"
source = """
[ENABLE]

aobscanmodule(CharacterGravity,GameAssembly.dll,F3 0F 10 8B 60 01 00 00 48)
alloc(newmem,$1000,CharacterGravity)
registersymbol(SetGravity)
label(code return SetGravity)

newmem:

code:
  movss xmm1,[SetGravity]
  jmp return

SetGravity:
dd (float)32.21565247


CharacterGravity:
  jmp newmem
  nop 3
return:
registersymbol(CharacterGravity)

[DISABLE]

CharacterGravity:
  db F3 0F 10 8B 60 01 00 00

unregistersymbol(*)
dealloc(*)"""

