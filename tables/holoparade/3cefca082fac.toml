source = """
{ Game   : HoloParade.exe
  Version: 
  Date   : 2023-12-23
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanregion(pData_BattleSceneManager,BattleSceneManager:Update,BattleSceneManager:Update+100,0F B6 86 E9 00 00 00 85 C0 0F) // should be unique
alloc(newmem,$1000,pData_BattleSceneManager)

alloc(pBase_BattleSceneData,8)
registersymbol(pBase_BattleSceneData)

label(code)
label(return)

pBase_BattleSceneData:
dd

newmem:

code:
  mov [pBase_BattleSceneData],rsi
  db 0F B6 86 E9 00 00 00
  jmp return

pData_BattleSceneManager:
  jmp newmem
  nop 2
return:
registersymbol(pData_BattleSceneManager pBase_BattleSceneData)

[DISABLE]

pData_BattleSceneManager:
  db 0F B6 86 E9 00 00 00

unregistersymbol(*)
dealloc(*)"""
