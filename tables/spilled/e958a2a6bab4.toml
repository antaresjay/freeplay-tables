define(address,UpgradeStation:Update+59d)
define(bytes,F3 0F 10 00 F3 0F 5A C0)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,UpgradeStation:Update+59d)

label(code)
label(return)
label(data3)
registersymbol(data3)

newmem:

code:
  mov [data3],rax
  movss xmm0,[rax]
  cvtss2sd xmm0,xmm0
  jmp return

data3:
  db

address:
  jmp newmem
  nop 3
return:

[DISABLE]

address:
  db bytes
  // movss xmm0,[rax]
  // cvtss2sd xmm0,xmm0

dealloc(*)
unregistersymbol(*)"""

