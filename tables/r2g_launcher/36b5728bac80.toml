[[cheat]]
id = "no-gold-use"
name = "No Gold use"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(IdentityCard,8B 45 E0 2B C6 89 81 0c 01 00 00)// 1. identity card no gold use
aobscan(UpgradeCard,8B 88 70 01 00 00 29 B9 0c 01 00 00)// 2. Upgrade card no gold use---
aobscan(DowngradeCard,29 83 0c 01 00 00 8B CB)// 3. Downgrade card no gold use
//============================================================================
registersymbol(IdentityCard)
registersymbol(UpgradeCard)
registersymbol(DowngradeCard)
//==========================
IdentityCard+3:
db 90 90
UpgradeCard+6://r2g_launcher.exe+2CB82F
db 90 90 90 90 90 90
DowngradeCard://r2g_launcher.exe+2B40BC
db 90 90 90 90 90 90
//=====================
[DISABLE]
IdentityCard+3:
db 2B C6
UpgradeCard+6:
db 29 B9 0c 01 00 00
DowngradeCard:
db 29 83 0c 01 00 00
//===========================
unregistersymbol(IdentityCard)
unregistersymbol(UpgradeCard)
unregistersymbol(DowngradeCard)"""

[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
                                                                        // v1.00.18019              v1.00.18203
aobscanmodule(PSX_CharPointer,r2g_launcher.exe,66 89 81 62 01 00 00 33)\t// r2g_launcher.exe+31B25F--321E7F
aobscanmodule(PSX_HP,r2g_launcher.exe,66 89 87 62 01 00 00 85 C9)\t\t\t// r2g_launcher.exe+4C9DDE--4D3ED9
aobscanmodule(PSX_Mana,r2g_launcher.exe,66 89 B3 5E 01 00 00 8B)\t\t// r2g_launcher.exe+2F6E11--2FDA31
//=============================================================
alloc(PSX,$1000,PSX_CharPointer)
alloc(GodMode,4)
alloc(ZeroCauldron,4)

label(_Char)
label(PSX_1)
label(PSX_2)
label(PSX_3)
label(code_1)
label(code_2)
label(code_3)
label(return_1)
label(return_2)
label(return_3)

registersymbol(_Char)
registersymbol(PSX_HP)
registersymbol(GodMode)
registersymbol(PSX_Mana)
registersymbol(ZeroCauldron)
registersymbol(PSX_CharPointer)
//============================
GodMode:
dd 0
align 10
ZeroCauldron:
dd 0
align 10

PSX:
_Char:
dd 0
align 10

PSX_1://=======
mov [_Char],ecx
cmp [ZeroCauldron],0
je code_1
mov [ecx+230+54],#0
mov [ecx+238+54],#0
code_1:
  mov [ecx+0000010E+54],ax
  jmp return_1
align 10 cc

PSX_2://=======
cmp [GodMode],0
je code_2
mov ax,[edi+00000160]
code_2:
  mov [edi+00000162],ax
  jmp return_2
align 10 cc

PSX_3://=======
cmp [GodMode],0
je code_3
mov si,[ebx+00000108+54]
code_3:
  mov [ebx+0000010A+54],si
  jmp return_3
align 10 cc

//==============
PSX_CharPointer:
  jmp PSX_1
  nop
  nop
return_1:

PSX_HP:
  jmp PSX_2
  nop
  nop
return_2:

PSX_Mana:
  jmp PSX_3
  nop
  nop
return_3:

[DISABLE]
PSX_CharPointer:
  db 66 89 81 62 01 00 00
PSX_HP:
  db 66 89 87 62 01 00 00
PSX_Mana:
  db 66 89 B3 5E 01 00 00

unregistersymbol(PSX_CharPointer)
unregistersymbol(ZeroCauldron)
unregistersymbol(PSX_Mana)
unregistersymbol(GodMode)
unregistersymbol(PSX_HP)
unregistersymbol(_Char)
dealloc(ZeroCauldron)
dealloc(GodMode)
dealloc(PSX)
////////
////
//"""

