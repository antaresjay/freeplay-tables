[[cheat]]
id = "fast-build-time-unit"
name = "Fast Build Time Unit"
category = "game"
description = ""
hint = ""
type = "script"
source = """
{ Game   : SiegeUp.exe
  Version: 
  Date   : 2023-03-20
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(pBase_TimeSpawn,GameAssembly.dll,8B ?? ?? 89 ?? ?? 4D ?? ?? 0F 84 ?? ?? ?? ?? 49 8B ?? ?? 48 8D) // should be unique
alloc(newmem,$1000,pBase_TimeSpawn)

label(code)
label(return)

newmem:
  mov [rdi+20],(float)0.1

code:
  mov eax,[rdi+20]
  mov [rbx+28],eax
  jmp return

pBase_TimeSpawn:
  jmp newmem
  nop
return:
registersymbol(pBase_TimeSpawn)

[DISABLE]

pBase_TimeSpawn:
  db 8B 47 20 89 43 28

unregistersymbol(pBase_TimeSpawn)
dealloc(newmem)"""

