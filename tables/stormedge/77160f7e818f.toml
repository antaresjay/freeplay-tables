id = "infinite-diamonds"
name = "Infinite Diamonds"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(sparklyyy, Facility_UI:UpdateCost+2, Facility_UI:UpdateCost+199, 48 63 40 74 48 89 45 88 48 8B CE 83 3E 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov [rax+74], #9999

code:
  movsxd  rax,dword ptr [rax+74]
  mov [rbp-78],rax
  mov rcx,rsi
  cmp dword ptr [rsi],00
  jmp return

sparklyyy:
  jmp far newmem
return:
registersymbol(sparklyyy)

[DISABLE]

sparklyyy:
  db 48 63 40 74 48 89 45 88 48 8B CE 83 3E 00

unregistersymbol(sparklyyy)
dealloc(newmem)"""
