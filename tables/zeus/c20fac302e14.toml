[[cheat]]
id = "fireball-switch-you-can-set-the-washing-range"
name = "Fireball switch（You can set the washing range）"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT_leftClickResultFunction,Zeus.exe,E8 ** ** ** ** ** ** ** 83 ** ** C3 ** ** ** ** ** 84 ** 74 ** C6)
alloc(newmem,$1000)

registersymbol(INJECT_leftClickResultFunction)
registersymbol(fireballsRange)

label(fireballsRange)
label(return)
label(X_loopLabel)
label(Y_loopLabel)

newmem:
  push ecx
  push eax
  mov [005FE764],93 //左键待建物体设置为火球术
  mov eax,[fireballsRange]
  neg eax
Y_loopLabel:
  mov ecx,[fireballsRange]
  neg ecx
X_loopLabel:
  add [005FE750],eax
  add [005FE758],ecx
  push ecx
  push eax
  mov [005FE760],00000001 //解除call 00404860的直接返回判断
  call 00404860
  pop eax
  pop ecx
  sub [005FE750],eax
  sub [005FE758],ecx
  inc ecx
  cmp ecx,[fireballsRange]
  jg @f
  jmp X_loopLabel
@@:
  inc eax
  cmp eax,[fireballsRange]
  jg @f

  jmp Y_loopLabel
@@:
  pop eax
  pop ecx
  mov [005FE764],0
  jmp return
fireballsRange:
  db 00


INJECT_leftClickResultFunction+1C:
  jmp newmem
return:


[DISABLE]

INJECT_leftClickResultFunction+1C:
  db E8 84 9D F0 FF
// 004FAAD7: E8 84 9D F0 FF                 - call 00404860

dealloc(newmem)
unregistersymbol(INJECT_leftClickResultFunction)
unregistersymbol(fireballsRange)"""

