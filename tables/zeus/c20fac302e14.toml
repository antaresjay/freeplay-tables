type = "script"
source = """
[ENABLE]
aobscanmodule(INJECT_readingItems,Zeus.exe,8D ** ** C1 ** ** ** ** ** ** ** ** ** ** 75 ** ** EB) // should be unique

registersymbol(INJECT_readingItems)
registersymbol(itemPointer)

alloc(newmem,$1000)
label(itemPointer)
label(return)

newmem:
  push eax
  lea eax,[eax+008C171A]
  mov [edx*4+itemPointer],eax
  pop eax
  cmp word ptr [eax+008C171A],00
  jmp return
itemPointer:


INJECT_readingItems+6:
  jmp newmem
  nop
  nop
  nop
return:


[DISABLE]

INJECT:
INJECT_readingItems+6:
  db 66 83 B8 1A 17 8C 00 00
// 004801AA: 66 83 B8 1A 17 8C 00 00  - cmp word ptr [eax+008C171A],00
unregistersymbol(INJECT_readingItems)
unregistersymbol(itemPointer)
dealloc(newmem)"""

