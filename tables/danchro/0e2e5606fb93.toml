[[cheat]]
id = "god-like"
name = "God Like"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@Sintrix|FearlessRevolution
[ENABLE]

aobscanmodule(MaxStats,GameAssembly.dll,80 BB 96 00 00 00 00 75 19)
alloc(newmem,$1000,MaxStats)

label(code)
label(return)

newmem:
push r15
mov r15,[rax+10]
cmp  [r15+24],#1
//cmp dword ptr [r15+78],#10001011 -- Main Character
jne code
mov [rax+1C],#9999999
mov [rax+18],#9999999
mov [rax+24],#9999999
mov [rax+30],#9999999
mov [rax+34],#9999999
jmp code
code:
  pop r15
  cmp byte ptr [rbx+00000096],00
  jmp return
//Send@Sintrix|FearlessRevolution
MaxStats:
  jmp newmem
  nop 2
return:
registersymbol(MaxStats)

[DISABLE]

MaxStats:
  db 80 BB 96 00 00 00 00
//Send@Sintrix|FearlessRevolution
unregistersymbol(*)
dealloc(*)"""

[[cheat]]
id = "get-player-battle-take-damage"
name = "Get Player [ Battle - Take Damage ]"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//Send@Sintrix|FearlessRevolution
aobscanmodule(BattleModifiers,GameAssembly.dll,89 5F 1C 48 85 C0 0F)
alloc(newmem,$1000,BattleModifiers)
registersymbol(Player)
label(code return Player)

newmem:
push r13
mov r13,[rdi+10]
cmp [r13+3C],#0
je code
mov [Player],rdi
jmp code


code:
  pop r13
  mov [rdi+1C],ebx
  test rax,rax
  jmp return

Player:
dq

//Send@Sintrix|FearlessRevolution
BattleModifiers:
  jmp newmem
  nop
return:
