alloc(pBase,4)
registersymbol(pBase)

label(code)
label(return)

newmem:

code:
  push ebp
  mov ebp,esp
  push edi
  sub esp,34
  mov edi,[ebp+08]
  mov [pBase],edi
  jmp return

address:
