[[cheat]]
id = "demo-version"
name = "Demo Version"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : VampireClans51-Win64-Shipping.exe
  Date   : 2025-09-20
  Author : Sianz
}

[ENABLE]

aobscanmodule(vampire,VampireClans51-Win64-Shipping.exe,48 8B 49 30 0F B6 EA 48 85) // should be unique
alloc(newmem,$1000,vampire)
alloc(stats,8)
label(code)
label(return)

newmem:
  test rcx,rcx
  je skip
  mov [stats],rcx
  skip:
code:
  mov rcx,[rcx+30]
  movzx ebp,dl
  jmp return

vampire:
  jmp newmem
  nop 2
return:
registersymbol(vampire stats)

[DISABLE]

vampire:
  db 48 8B 49 30 0F B6 EA

unregistersymbol(*)
dealloc(*)"""

