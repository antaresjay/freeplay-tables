type = "script"
source = """
//Send@ModEngine
[ENABLE]
aobscanregion(skillcd,FortTriumph.Abilities.Ability:set_CurrentCooldown,FortTriumph.Abilities.Ability:set_CurrentCooldown+1e,89 88 5C 01 00 00)
alloc(newmem,$1000,skillcd)
label(code return)

newmem:

code:
  mov [rax+0000015C],#0
  jmp return

skillcd:
  jmp newmem
  nop
return:
registersymbol(skillcd)

