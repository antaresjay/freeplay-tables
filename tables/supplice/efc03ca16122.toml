[[cheat]]
id = "enemies-killed-ctrl-numpad-5"
name = "Enemies Killed (Ctrl + Numpad 5)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(kills,8B90xxxx000048B8xxxxxxxxxxxx000048xxxx0Fxxxxxxxxxx48xxxx48xxxx0Fxxxxxxxxxx8Bxxxxxxxxxx) // should be unique
alloc(newmem,$1000,kills)
alloc(data4,8)
alloc(killsbkp,6)
registersymbol(data4)
registersymbol(kills)
registersymbol(killsbkp)
label(code)
label(return)

killsbkp:
  readmem(kills,6)

newmem:
  mov [data4],rax

code:
  readmem(kills,6)
  jmp return

kills:
  jmp newmem
  nop
return:

[DISABLE]

kills:
  readmem(killsbkp,6)

unregistersymbol(*)
dealloc(*)"""

