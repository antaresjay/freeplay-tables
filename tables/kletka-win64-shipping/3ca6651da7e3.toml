source = """
// Game Executable   : KLETKA-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.6.1.0
// Game Version      : v1.0.0
// Script Date       : 2026-02-21


[ENABLE]

aobscanmodule(wrench,KLETKA-Win64-Shipping.exe,498Bxx89xxE8xxxxxxxx488Bxxxxxx4Cxxxxxxxx488B) // should be unique
alloc(newmem,$1000,wrench)
alloc(data4,8)
registersymbol(data4)
label(code)
label(return)

newmem:

code:
  mov [data4],rax
  mov rcx,r15
  mov [rax],ebx
  jmp return

wrench:
  jmp newmem
return:
registersymbol(wrench)

[DISABLE]

wrench:
  db 49 8B CF 89 18

unregistersymbol(*)
dealloc(*)"""

