type = "script"
source = """
[ENABLE]



aobscan(INJECT,C5 FA 10 44 82 10)
alloc(newmem,$1000,INJECT)

label(code)
label(return)

newmem:
cmp rax,12c
jne @F
cmp [rsp+10],000000000000002B
jne @f
cmp [rdx+rax*4+10],(float)1
jng @F
cmp [rdx+rax*4+10],(float)100
jg @F
mov [rdx+rax*4+10],(float)99

code:
db C5 FA 10 44 82 10
jmp return

INJECT:
jmp newmem
nop
return:
registersymbol(INJECT)

[DISABLE]
INJECT:
db C5 FA 10 44 82 10

unregistersymbol(INJECT)
dealloc(newmem)"""
