[[cheat]]
id = "player-ball-ctrl-numpad-2"
name = "Player Ball (Ctrl + Numpad 2)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : B2HDRP.exe
// Author            : ndck76
// Executable Version: 6000.0.41.58439
// Game Version      : v1.0.0
// Script Date       : 2026-07-14


[ENABLE]

aobscanmodule(power,GameAssembly.dll,F3xxxxxxxx4533xxE8xxxxxxxxF3xxxxxxxx0F2Fxxxxxxxxxx488Bxxxxxxxxxx0F86) //Mushreb.Ballex2.LevelStatusUI.UpdateStatus
alloc(newmem,$1000,power)
alloc(data2,8)
alloc(powerbkp,5)
registersymbol(data2)
registersymbol(power)
registersymbol(powerbkp)
label(code)
label(return)

powerbkp:
  readmem(power,5)

newmem:
  mov [data2],rdi

code:
  readmem(power,5)
  jmp return

power:
  jmp newmem
return:

[DISABLE]

power:
  readmem(powerbkp,5)

unregistersymbol(*)
dealloc(*)"""

