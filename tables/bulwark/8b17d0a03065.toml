type = "script"
source = """
[ENABLE]

aobscanmodule(EntityListManager,GameAssembly.dll,48 8B 88 B0 01 00 00 48 85 C9 0F 84 E5)
alloc(newmem,$1000,EntityListManager)
registersymbol(GetGameData)
label(code return GetGameData)

newmem:

code:
  mov rcx,[rax+000001B0]
  mov [GetGameData],rax
  jmp return

GetGameData:
dq 0

EntityListManager:
  jmp newmem
  nop 2
return:
registersymbol(EntityListManager)

[DISABLE]

EntityListManager:
  db 48 8B 88 B0 01 00 00

unregistersymbol(*)
dealloc(*)"""
