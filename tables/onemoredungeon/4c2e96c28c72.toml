[[cheat]]
id = "true-god-mode"
name = "True god mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(INJECT,?? 46 4C 85 DB) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  nop
  test ebx,ebx
  jmp return

INJECT:
  jmp newmem
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db CC 46 4C 85 DB

unregistersymbol(INJECT)
dealloc(newmem)"""

