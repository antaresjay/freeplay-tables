// Define Value
htl:
dd 0


read:
mov [htl],ebx
add [htl],20

originalcode:
mov edx,[ebx+20]
add edi,000000E0
jmp returnhere



//"Bunny2 English.exe"+7051E:
aob_mouseover:
jmp read
nop
nop
nop
nop
returnhere:


 
 
[DISABLE]
