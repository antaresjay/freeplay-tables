registersymbol(aob_coord)
// Variables
label(turnright)
registersymbol(turnright)

Coord:

// Variables
turnright:
dd 0


right:
mov [turnright],esi
add [turnright],0C


originalcode:
mov ecx,[esi+0C]
mov [eax+0020CDE4],ecx
jmp returnhere


//"Bunny2 English.exe"+1D577:
