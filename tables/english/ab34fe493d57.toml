[[cheat]]
id = "elem-freeze"
name = "-Elem Freeze"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(elem,TtT English.exe,A3 28 EA 7A 00 8B 0D * * * * 51 8B 95 E8 FE FF FF 52 E8 DF) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
 add eax,edx,

code:
  mov ["TtT English.exe"+3AEA28],eax
  jmp return

elem:
  jmp newmem
return:
registersymbol(elem)

[DISABLE]

elem:
  db A3 28 EA 7A 00

unregistersymbol(elem)
dealloc(newmem)"""

[[cheat]]
id = "hp-increase-by-getting-hit"
name = "-HP Increase: By Getting Hit?!"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(Health,TtT English.exe,89 82 4C 02 00 00) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov [edx+0000024C],eax
code:
  add [edx+0000024C],eax
  jmp return

Health:
  jmp newmem
  nop
return:
registersymbol(Health)

[DISABLE]
Health:
  db 89 82 4C 02 00 00

unregistersymbol(Health)
dealloc(newmem)"""

