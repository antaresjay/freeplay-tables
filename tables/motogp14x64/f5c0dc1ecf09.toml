[[cheat]]
id = "freeze-opponents"
name = "Freeze Opponents"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanmodule(freeze,MotoGP14X64.exe,F3 0F 10 A1 CC 01 00 00 0F 28 E9)
registersymbol(freeze)
alloc(newmem,2048,freeze)
label(returnhere)
label(originalcode)
newmem: //this is allocated memory, you have read,write,execute access
//place your code here
cmp [rcx+32c],(float)1.100000024
je originalcode
mov [rcx+000001CC],0
originalcode:
movss xmm4,[rcx+000001CC]
jmp returnhere
freeze://"MotoGP14X64.exe"+7B8DE0:
jmp newmem
nop
nop
nop
returnhere:
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
freeze://
movss xmm4,[rcx+000001CC]
//Alt: db F3 0F 10 A1 CC 01 00 00
unregistersymbol(freeze)"""

