[[cheat]]
id = "inf-health"
name = "Inf. Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

aobscan(Health,D9 47 20 8D 65 FC 5F C9 C3)
label(pHealth)

registersymbol(Health)
registersymbol(pHealth)

newmem:
mov [pHealth],edi
cmp [edi+EC],1
jne originalcode
push eax
mov eax,[edi+24]
mov eax,[edi+28]
mov [edi+20],eax

originalcode:
pop eax
fld dword ptr [edi+20]
lea esp,[ebp-04]

exit:
jmp returnhere

pHealth:
dd 0

Health:
jmp newmem
nop
returnhere:


[DISABLE]
unregistersymbol(Health)
unregistersymbol(pHealth)
dealloc(newmem)
Health:
db D9 47 20 8D 65 FC"""

