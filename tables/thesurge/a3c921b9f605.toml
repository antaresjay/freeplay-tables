[ENABLE]
aobscanmodule(player,TheSurge.exe,F3 0F 10 81 B8 00 00 00 C3)
alloc(newmem,$1000,player)

label(code)
label(return)
label(player_ptr)

newmem:
  push rax
  mov rax,player_ptr
  mov [rax],rcx
  pop rax
code:
  movss xmm0,[rcx+000000B8]
  jmp return

player_ptr:
  dq 0

player:
  jmp newmem
  nop
  nop
