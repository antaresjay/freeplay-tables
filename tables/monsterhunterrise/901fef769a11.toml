itemgib:
sub rsp,28
mov rcx,[MonsterHunterRise.exe+C01BA20]
mov rdx,FFFFFFFF
call MonsterHunterRise.exe+2B7BAA0
mov rbx,rax //vtable
mov rcx,rax
