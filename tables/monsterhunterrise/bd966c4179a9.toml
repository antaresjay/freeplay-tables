aobscanmodule(infinite_wirebug_inject, MonsterHunterRise.exe, F3 0F 10 41 10 C3 0F 57 C0 C3 8B) // should be unique
registersymbol(infinite_wirebug_inject)


// save original code
alloc(iw_originalbytes, 5, infinite_wirebug_inject)
registersymbol(iw_originalbytes)

