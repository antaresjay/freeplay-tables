[[cheat]]
id = "pointers"
name = "Pointers"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : MonsterHunterWorld.exe
  Version:
  Date   : 2020-01-26
  Author : Faye
  Define Base Address Pointers
  Item AOB:  23 00 00 00 CD CC CC 3E 00 00 C0 3F 66 66 A6 3F E0 F2 2A 43 01 00 00 00 46 00 00 00 CD CC CC 3E
}
[ENABLE]

define(player_zenni,MonsterHunterRise.exe+C0207E0)
define(player_data,MonsterHunterRise.exe+C070040)
define(current_player,MonsterHunterRise.exe+C06FF70)
define(item_capacity,MonsterHunterRise.exe+C076BF8)
define(bonusSet_Res,MonsterHunterRise.exe+C071D28)
define(quest_session,MonsterHunterRise.exe+C01E948)
define(skill_data,MonsterHunterRise.exe+C01EBC0)
define(skill_params,MonsterHunterRise.exe+C0E7180)
define(char_voucher,MonsterHunterRise.exe+C070F18)
define(hunter_rank,MonsterHunterRise.exe+C01EC60)

registersymbol(player_zenni)
registersymbol(player_data)
registersymbol(current_player)
registersymbol(item_capacity)
registersymbol(bonusSet_Res)
registersymbol(quest_session)
registersymbol(skill_data)
registersymbol(skill_params)
registersymbol(char_voucher)
registersymbol(hunter_rank)

[DISABLE]
unregistersymbol(player_zenni)
unregistersymbol(player_data)
unregistersymbol(current_player)
unregistersymbol(item_capacity)
unregistersymbol(bonusSet_Res)
unregistersymbol(quest_session)
unregistersymbol(skill_data)
unregistersymbol(skill_params)
unregistersymbol(char_voucher)
unregistersymbol(hunter_rank)"""

