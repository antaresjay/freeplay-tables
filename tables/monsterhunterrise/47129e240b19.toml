[[cheat]]
id = "all-heroes-lvl-9999"
name = "All Heroes lvl 9999"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(herolevel,CrusadersGame.GameScreen:Hero:SetLevel,CrusadersGame.GameScreen:Hero:SetLevel+a4,89 83 ?? ?? ?? ?? 89 1C 24 8D 6D) // should be unique
alloc(newmem,$100)
label(code)
label(return)
label(herolevelread)
registersymbol(herolevelread)

newmem:
  mov eax, #9999
code:
  readmem(herolevel,6)
  jmp return

herolevelread:
readmem(herolevel,6)

herolevel:
  jmp newmem
  nop
return:
registersymbol(herolevel)

[DISABLE]

herolevel:
  readmem(herolevelread,6)

unregistersymbol(*)
dealloc(*)"""

