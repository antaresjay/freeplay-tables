[[cheat]]
id = "character-controller-2d-ctrl-numpad-2"
name = "Character Controller 2D (Ctrl + Numpad 2)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Bye Sweet Carole.exe
// Author            : ndck76
// Executable Version: 2021.3.45.43167
// Game Version      : v1.0.1
// Script Date       : 2025-10-11


[ENABLE]

aobscanmodule(positioncount,GameAssembly.dll,F3xxxxxxxxxxxxxxF3xxxxxxxxxxxxxx0F2FxxxxxxxxxxF3xxxxxxxxxxxxxx76) //CharacterController2D.CheckFreezeMovement
alloc(newmem,$1000,positioncount)
alloc(data,8)
alloc(positioncountbkp,8)
registersymbol(data)
registersymbol(positioncount)
registersymbol(positioncountbkp)
label(code)
label(return)

positioncountbkp:
  readmem(positioncount,8)

newmem:
  mov [data],rbx

code:
  readmem(positioncount,8)
  jmp return

positioncount:
  jmp newmem
  nop 3
return:

[DISABLE]

positioncount:
  readmem(positioncountbkp,8)

unregistersymbol(*)
dealloc(*)"""

