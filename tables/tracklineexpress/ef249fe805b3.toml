type = "script"
source = """
// Send
[ENABLE]

aobscan(health,F3 0F 11 68 24 48 8B 46 18 F3 0F 10 40 24)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  movss xmm5,[new]
  movss [rax+24],xmm5
  mov rax,[rsi+18]
  movss xmm0,[rax+24]
  jmp return

new:
dd (float)100

health:
  jmp far newmem
return:
registersymbol(health)

[DISABLE]

health:
  db F3 0F 11 68 24 48 8B 46 18 F3 0F 10 40 24

unregistersymbol(health)
dealloc(newmem)

//Item:OnHealthChange+67: F3 0F 11 68 24                 - movss [rax+24],xmm5"""
