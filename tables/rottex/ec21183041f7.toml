[[cheat]]
id = "infinite-ammo-ctrl-numpad-2"
name = "Infinite Ammo (Ctrl + Numpad 2)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : RottEX.exe
// Author            : ndck76
// Executable Version: 1.0.2595.0
// Game Version      : v1.0.2595.0
// Script Date       : 2023-08-01


[ENABLE]

aobscanmodule(ammo,RottEX.exe,410FxxxxxxF2xxxxxxxxxxxxxx03xx4863) // should be unique
alloc(newmem,$1000,ammo)
alloc(ammobkp,5)
registersymbol(ammo)
registersymbol(ammobkp)
label(code)
label(return)

ammobkp:
  readmem(ammo,5)

newmem:
  mov [r10+10],(int)9

code:
  readmem(ammo,5)
  jmp return

ammo:
  jmp newmem
return:

[DISABLE]

ammo:
  readmem(ammobkp,5)

unregistersymbol(*)
dealloc(*)"""
