[[cheat]]
id = "no-reload"
name = "No Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(noreloadcd,server.dll,96 5C F3 FF 89 3E 5F 8B C6)

noreloadcd+04:
  nop
  nop
registersymbol(noreloadcd)

aobscanmodule(noreloadcd2,server.dll,83 BE A0 05 00 00 32 A1)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  mov [esi+000005A0], 32
  cmp dword ptr [esi+000005A0], 32
  jmp return

noreloadcd2:
  jmp newmem
  nop
  nop
return:
registersymbol(noreloadcd2)


[DISABLE]
noreloadcd+04:
  db 89 3E

unregistersymbol(noreloadcd)


noreloadcd2:
  db 83 BE A0 05 00 00 32

unregistersymbol(noreloadcd2)
dealloc(newmem)"""

