[[cheat]]
id = "battle-stats-base-address-scan-to-activate-battle-to-update-battle"
name = "Battle Stats Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(battlestats_savedAOB)
label(battlestats_returnhere)
label(battlestats_originalcode)
label(battlestats_exit)

label(battlestatsupdate_exit)
label(battlestatsset_exit)
label(battlestatsspiritualenergyset_exit)
label(battlestatsenergyset_exit)

registersymbol(battlestats_savedAOB)

aobscan(battlestats_searchedAOB,8B 80 80 00 00 00 8B 4F 50)

alloc(battlestats_newmem,2048) //2kb should be enough
alloc(battlestats_temp,4)


battlestats_newmem:
cmp dword ptr [battlestatsupdate_enable], #0
je battlestatsupdate_exit
mov [battlestats_basepointer], eax
battlestatsupdate_exit:

cmp dword ptr [battlestatsset_enable], #0
je battlestatsset_exit
battlestatsset_exit:

cmp dword ptr [battlestatsspiritualenergyset_enable], #0
je battlestatsspiritualenergyset_exit
mov [eax+80], #999
battlestatsspiritualenergyset_exit:

cmp dword ptr [battlestatsenergyset_enable], #0
je battlestatsenergyset_exit
mov [battlestats_temp], #999
fild [battlestats_temp]
fstp qword ptr [eax+58]
battlestatsenergyset_exit:


battlestats_originalcode:
db 8B 80 80 00 00 00
//mov eax,[eax+00000080]


battlestats_exit:
jmp battlestats_returnhere


battlestats_searchedAOB:
battlestats_savedAOB:
jmp battlestats_newmem
nop
battlestats_returnhere:


[DISABLE]
battlestats_savedAOB:
db 8B 80 80 00 00 00
//mov eax,[eax+00000080]

unregistersymbol(battlestats_savedAOB)

dealloc(battlestats_newmem)"""

