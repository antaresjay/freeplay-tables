[[cheat]]
id = "canvas-ctrl-numpad-1"
name = "Canvas (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Codex_Lost-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 4.27.2.0
// Game Version      : v1.0.3
// Script Date       : 2024-11-18


[ENABLE]

aobscanmodule(savegamename,Codex_Lost-Win64-Shipping.exe,4Cxxxxxx4889xxxx89xxxx85xx75xx448BxxEBxx4533xx488Dxxxx8BxxE8xxxxxxxx488Bxxxx4Cxxxx4Dxxxx498BxxE8) // should be unique
alloc(newmem,$1000,savegamename)
alloc(data,8)
alloc(savegamenamebkp,8)
registersymbol(data)
registersymbol(savegamename)
registersymbol(savegamenamebkp)
label(code)
label(return)

savegamenamebkp:
  readmem(savegamename,8)

newmem:
  mov [data],rdx

code:
  readmem(savegamename,8)
  jmp return

savegamename:
  jmp newmem
  nop 3
return:

[DISABLE]

savegamename:
  readmem(savegamenamebkp,8)

unregistersymbol(*)
dealloc(*)"""

