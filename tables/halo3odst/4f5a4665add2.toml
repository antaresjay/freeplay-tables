[[cheat]]
id = "no-reload"
name = "No Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(reload_aob,halo3odst.dll,66 41 2B EE 66 42 89 AC EB 32 02 00 00) // should be unique
alloc(newmem,$1000,reload_aob)

label(code)
label(return)

newmem:

code:
  mov [rbx+r13*8+00000232],bp
  jmp return

reload_aob:
  jmp newmem
  nop 8
return:
registersymbol(reload_aob)

[DISABLE]

reload_aob:
  db 66 41 2B EE 66 42 89 AC EB 32 02 00 00

unregistersymbol(reload_aob)
dealloc(newmem)"""

