[[cheat]]
id = "playerdata-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerData Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerData_savedAOB)
label(PlayerData_returnhere)
label(PlayerData_originalcode)
label(PlayerData_exit)

label(PlayerData_update_exit)
label(PlayerData_set_exit)

registersymbol(PlayerData_savedAOB)

//051E2B5A - 74 0D                 - je 051E2B69
//051E2B5C - 39 3F                 - cmp [edi],edi
// PlayerManager:IsPLayerActive+e
//051E2B5E - 0FB6 87 9C000000      - movzx eax,byte ptr [edi+0000009C]
//051E2B65 - 8B F0                 - mov esi,eax
//051E2B67 - EB 02                 - jmp 051E2B6B
//051E2B69 - 33 F6                 - xor esi,esi
aobscan(PlayerData_searchedAOB, 0F B6 87 9C 00 00 00 8B F0)

alloc(PlayerData_newmem, 2048, PlayerData_searchedAOB)


PlayerData_newmem:
cmp dword ptr [edi+9c], #1
jne PlayerData_set_exit

cmp dword ptr [PlayerData_update_enable], #0
je PlayerData_update_exit
mov [PlayerData_basepointer], edi
PlayerData_update_exit:

cmp dword ptr [PlayerData_set_enable], #0
je PlayerData_set_exit
PlayerData_set_exit:


PlayerData_originalcode:
db 0F B6 87 9C 00 00 00
//movzx eax,byte ptr [edi+0000009C]


PlayerData_exit:
jmp PlayerData_returnhere


PlayerData_searchedAOB:
PlayerData_savedAOB:
jmp PlayerData_newmem
nop
nop
PlayerData_returnhere:


[DISABLE]
PlayerData_savedAOB:
db 0F B6 87 9C 00 00 00
//movzx eax,byte ptr [edi+0000009C]

unregistersymbol(PlayerData_savedAOB)

dealloc(PlayerData_newmem)"""

