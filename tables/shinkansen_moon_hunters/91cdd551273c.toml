[[cheat]]
id = "basestatsmanager-base-address-scan-initialization-activate-this-first"
name = "BaseStatsManager Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(BaseStatsManager_basepointer)
registersymbol(BaseStatsManager_update_enable)
registersymbol(BaseStatsManager_set_enable)
registersymbol(BaseStatsManager_healthset_enable)
registersymbol(BaseStatsManager_energyset_enable)
registersymbol(BaseStatsManager_opalsset_enable)
registersymbol(BaseStatsManager_statsset_enable)

alloc(BaseStatsManager_basepointer, 4)
alloc(BaseStatsManager_update_enable, 4)
alloc(BaseStatsManager_set_enable, 4)
alloc(BaseStatsManager_healthset_enable, 4)
alloc(BaseStatsManager_energyset_enable, 4)
alloc(BaseStatsManager_opalsset_enable, 4)
alloc(BaseStatsManager_statsset_enable, 4)


[DISABLE]
unregistersymbol(BaseStatsManager_basepointer)
unregistersymbol(BaseStatsManager_update_enable)
unregistersymbol(BaseStatsManager_set_enable)
unregistersymbol(BaseStatsManager_healthset_enable)
unregistersymbol(BaseStatsManager_energyset_enable)
unregistersymbol(BaseStatsManager_opalsset_enable)
unregistersymbol(BaseStatsManager_statsset_enable)

dealloc(BaseStatsManager_basepointer)
dealloc(BaseStatsManager_update_enable)
dealloc(BaseStatsManager_set_enable)
dealloc(BaseStatsManager_healthset_enable)
dealloc(BaseStatsManager_energyset_enable)
dealloc(BaseStatsManager_opalsset_enable)
dealloc(BaseStatsManager_statsset_enable)"""

[[cheat]]
id = "basestatsmanager-base-address-scan-to-activate-play-level-to-update-play-level"
name = "BaseStatsManager Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(BaseStatsManager_savedAOB)
label(BaseStatsManager_returnhere)
label(BaseStatsManager_originalcode)
label(BaseStatsManager_exit)

label(BaseStatsManager_update_exit)
label(BaseStatsManager_set_exit)
label(BaseStatsManager_healthset_exit)
label(BaseStatsManager_energyset_exit)
label(BaseStatsManager_opalsset_exit)
label(BaseStatsManager_statsset_exit)

registersymbol(BaseStatsManager_savedAOB)

//3FD2AD80 - C7 45 B8 00000000     - mov [ebp-48],00000000
//3FD2AD87 - C7 45 BC 00000000     - mov [ebp-44],00000000
// BaseStatsManager:Update+26
//3FD2AD8E - 0FB6 87 B9000000      - movzx eax,byte ptr [edi+000000B9]
//3FD2AD95 - 85 C0                 - test eax,eax
//3FD2AD97 - 0F84 C9000000         - je 3FD2AE66
//3FD2AD9D - 8B 05 A8EEAA04        - mov eax,[04AAEEA8] : [(double)0.0286]
aobscan(BaseStatsManager_searchedAOB, 0F B6 87 B9 00 00 00 85 C0)

alloc(BaseStatsManager_newmem, 2048, BaseStatsManager_searchedAOB)
alloc(BaseStatsManager_temp1, 4, BaseStatsManager_searchedAOB)
alloc(BaseStatsManager_temp2, 4, BaseStatsManager_searchedAOB)


BaseStatsManager_newmem:
mov [BaseStatsManager_temp1], ebx
mov [BaseStatsManager_temp2], ecx

cmp byte ptr [edi+92], #1
jne BaseStatsManager_statsset_exit

cmp dword ptr [BaseStatsManager_update_enable], #0
je BaseStatsManager_update_exit
mov [BaseStatsManager_basepointer], edi
BaseStatsManager_update_exit:

cmp dword ptr [BaseStatsManager_set_enable], #0
je BaseStatsManager_set_exit
BaseStatsManager_set_exit:

cmp dword ptr [edi+10], #0
je BaseStatsManager_statsset_exit
mov ebx, [edi+10]

cmp dword ptr [BaseStatsManager_healthset_enable], #0
je BaseStatsManager_healthset_exit
mov ecx, [ebx+68]
mov [ebx+60], ecx
BaseStatsManager_healthset_exit:

cmp dword ptr [BaseStatsManager_energyset_enable], #0
je BaseStatsManager_energyset_exit
mov ecx, [ebx+78]
mov [ebx+74], ecx
BaseStatsManager_energyset_exit:

cmp dword ptr [BaseStatsManager_opalsset_enable], #0
je BaseStatsManager_opalsset_exit
mov [ebx+5c], #99999
BaseStatsManager_opalsset_exit:

cmp dword ptr [BaseStatsManager_statsset_enable], #0
je BaseStatsManager_statsset_exit
mov [ebx+1c], #999
mov [ebx+28], #999
mov [ebx+34], #999
mov [ebx+40], #999
mov [ebx+4c], #999
mov [ebx+58], #999
BaseStatsManager_statsset_exit:

mov ebx, [BaseStatsManager_temp1]
mov ecx, [BaseStatsManager_temp2]


BaseStatsManager_originalcode:
db 0F B6 87 B9 00 00 00
//movzx eax,byte ptr [edi+000000B9]


BaseStatsManager_exit:
jmp BaseStatsManager_returnhere


BaseStatsManager_searchedAOB:
BaseStatsManager_savedAOB:
jmp BaseStatsManager_newmem
nop
nop
BaseStatsManager_returnhere:


[DISABLE]
BaseStatsManager_savedAOB:
db 0F B6 87 B9 00 00 00
//movzx eax,byte ptr [edi+000000B9]

unregistersymbol(BaseStatsManager_savedAOB)

dealloc(BaseStatsManager_newmem)
dealloc(BaseStatsManager_temp1)
dealloc(BaseStatsManager_temp2)"""

