[[cheat]]
id = "heal-unit"
name = "Heal Unit"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

aobscanmodule(healunit,Eisenwald.exe,0F BF 80 7A 02 00 00 99) // should be unique
alloc(newmem,$1000)
label(healunity)
registersymbol(healunity)
label(code)
label(return)

newmem:

code:
  push ebx
  mov ebx,[eax+000002d8]
  mov [eax+0000027A], ebx
  pop ebx
  movsx eax,word ptr [eax+0000027A]
  jmp return

healunit:
healunity:
  jmp code
  nop
  nop
return:


[DISABLE]
//code from here till the end of the code will be used to disable the cheat
healunity:
  db 0F BF 80 7A 02 00 00

unregistersymbol(healunity)
dealloc(newmem)"""

