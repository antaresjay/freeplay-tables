[[cheat]]
id = "enable-damage-modifier-options-god-mode-one-hit-kill-etc"
name = "Enable Damage Modifier Options (God Mode, One Hit Kill, etc.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

///
aobscanmodule(DamageModAOB1,$process,44 0F BF 41 10 8B C2 41 3B D0 41 0F 4D C0)
registersymbol(DamageModAOB1)
alloc(newmem,1024,DamageModAOB1)

///
aobscanmodule(DamageModAOB2,$process,44 0F BF 49 10 8B C2 44 0F BF 81 2E 01 00 00)
registersymbol(DamageModAOB2)
alloc(newmem2,1024,DamageModAOB2)

///
label(return)
label(DamageModAOB1Save)
registersymbol(DamageModAOB1Save)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(TwoHitKill)
registersymbol(TwoHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)
label(EnemyCannotDie)
registersymbol(EnemyCannotDie)

///
label(return2)
label(DamageModAOB2Save)
registersymbol(DamageModAOB2Save)
label(fEnemyHealingMult)
registersymbol(fEnemyHealingMult)
label(fHeroHealingMult)
registersymbol(fHeroHealingMult)

///
newmem:
  mov [R10Save],r10
  mov [R11Save],r11
  mov r10,rcx
  sub r10,138
  cmp byte ptr [r10+00000188],1
  je HeroHit
  jmp EnemyHit
HeroHit:
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [fHeroDamageMult]
  fistp dword ptr [rsp]
  pop edx
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor edx,edx
  jmp MyCleanUp1
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne MyCleanUp1
  cmp dx,[rcx+10]
  jl @F
  xor edx,edx
@@:
  jmp MyCleanUp1  
EnemyHit:
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckTwoHitKill
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [fEnemyDamageMult]
  fistp dword ptr [rsp]
  pop edx
CheckTwoHitKill:
  cmp [TwoHitKill],1
  jne CheckOneHitKill
  mov dx,[rcx+10]
  cmp dx,1
  je CheckEnemyCannotDie
  dec dx
  jmp CheckEnemyCannotDie
CheckOneHitKill:
  cmp [OneHitKill],1
  jne CheckEnemyCannotDie
  mov dx,[rcx+10]
  jmp CheckEnemyCannotDie
CheckEnemyCannotDie:
  cmp [EnemyCannotDie],1
  jne MyCleanUp1
  cmp dx,[rcx+10]
  jl @F
  xor edx,edx
@@:
  jmp MyCleanUp1

MyCleanUp1:  
  mov r10,[R10Save]
  mov r11,[R11Save]
DamageModAOB1Save:
  readmem(DamageModAOB1,14)
  jmp DamageModAOB1+0E

R10Save:
dq 0
R11Save:
dq 0
GodMode:
dq 0
OneHitKill:
dq 0
TwoHitKill:
dq 0
fEnemyDamageMult:
dq (float)2.0
fHeroDamageMult:
dq (float)0.25
HeroCannotDie:
dq 1
EnemyCannotDie:
dq 0

///
newmem2:
  mov [R10Save2],r10
  mov [R11Save2],r11
  mov r10,rcx
  sub r10,138
  cmp byte ptr [r10+00000188],1
  je HeroHit2
  jmp EnemyHit2
HeroHit2:
HeroHealingHit:
  cmp [fHeroHealingMult],(float)0.0
  je MyCleanUp2
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [fHeroHealingMult]
  fistp dword ptr [rsp]
  pop edx
  jmp MyCleanUp2
EnemyHit2:
EnemyHealingHit:
  cmp [fEnemyHealingMult],(float)0.0
  je MyCleanUp2
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [fEnemyHealingMult]
  fistp dword ptr [rsp]
  pop edx
  jmp MyCleanUp2

MyCleanUp2:  
  mov r10,[R10Save2]
  mov r11,[R11Save2]
DamageModAOB2Save:
  readmem(DamageModAOB2,15)
  jmp DamageModAOB2+0F

R10Save2:
dq 0
R11Save2:
dq 0
fEnemyHealingMult:
dq (float)0.25
fHeroHealingMult:
dq (float)2.0

///
DamageModAOB1:
  jmp newmem
  return:

///
DamageModAOB2:
  jmp newmem2
  return2:

[DISABLE]

DamageModAOB1:
  readmem(DamageModAOB1Save,14)

unregistersymbol(DamageModAOB1)
unregistersymbol(DamageModAOB1Save)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fHeroDamageMult)

///
DamageModAOB2:
  readmem(DamageModAOB2Save,15)

unregistersymbol(DamageModAOB2)
unregistersymbol(DamageModAOB2Save)
unregistersymbol(fEnemyHealingMult)
unregistersymbol(fHeroHealingMult)

///
dealloc(newmem)
dealloc(newmem2)"""

