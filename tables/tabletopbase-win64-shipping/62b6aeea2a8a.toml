type = "script"
source = """
{ Game   : TableTopBase-Win64-Shipping.exe
  Version: 
  Date   : 2021-10-30
  Author : d

  This script does blah blah blah
}

[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

 
 
aobscanmodule(ATTACK,TableTopBase-Win64-Shipping.exe,66 83 78 48 00 7E 22) // should be unique
alloc(newmem,$1000,ATTACK)
label(god_mode)
label(ohk)
label(code)
label(return)

newmem:
push rcx
//player/summon check
/*Old method
cmp [rax+28],000FE43F //player
je player
cmp [rax+28],000FE456 //summon
je player
*/
cmp byte ptr [rax+39],0 //0 = player
je player
jmp monster


player:
//god_mode
mov rcx,god_mode
cmp byte ptr [rcx],1
jne code //nothing to do
mov [rax+48],#100
mov [rax+4A],#100
jmp code

monster:
mov rcx,ohk
cmp byte ptr [rcx],1
jne code //nothing to do
mov [rax+48],#0
mov [rax+4A],#0
jmp code

code:
  pop rcx
  cmp word ptr [rax+48],00
  jmp return

god_mode:
db 0

ohk:
db 0

ATTACK:
  jmp newmem
return:
registersymbol(ATTACK)
registersymbol(ohk)
registersymbol(god_mode)
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
ATTACK:
