[[cheat]]
id = "activate-trainer-3-controls-wealth-gain-loss-multiplier"
name = "Activate Trainer 3 (Controls Wealth Gain/Loss Multiplier"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(WealthGainLossMultiplierAOB1,$process,48 89 5C 24 08 57 48 83 EC ?? 8B FA 48 8B D9 E8 ?? ?? ?? ?? 84 C0 74 0E)
