[[cheat]]
id = "activate-trainer-1-2-controls-pointers"
name = "Activate Trainer 1.2 (Controls Pointers"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(GetGameStatePtrAOB1,$process,48 8B 80 98 07 00 00 48 89 83 E0 02 00 00)
registersymbol(GetGameStatePtrAOB1)
alloc(newmem,1024)

label(GetGameStatePtrAOB1Save)
registersymbol(GetGameStatePtrAOB1Save)

newmem:
  mov [R15Save],r15
  mov r15,GameStatePtr
  mov [r15],rbx
  mov r15,[R15Save]
  jmp originalcode
  
originalcode:
GetGameStatePtrAOB1Save:
  readmem(GetGameStatePtrAOB1,14)
  jmp GetGameStatePtrAOB1+0E
  
R15Save:
dq 0

GetGameStatePtrAOB1:
  jmp newmem
  return:
  
[DISABLE]

GetGameStatePtrAOB1:
  readmem(GetGameStatePtrAOB1Save,14)
  
unregistersymbol(GetGameStatePtrAOB1)
unregistersymbol(GetGameStatePtrAOB1Save)

dealloc(newmem)"""

[[cheat]]
id = "activate-trainer-2-controls-infinite-split-stack"
name = "Activate Trainer 2 (Controls Infinite Split Stack"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(InfiniteSplitStackAOB1,$process,41 2B C6 48 89 AC 24 88 00 00 00 8B D0 48 8B CF)
registersymbol(InfiniteSplitStackAOB1)
