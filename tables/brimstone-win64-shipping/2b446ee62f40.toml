dq 0

InfiniteSplitStackAOB1:
  jmp newmem
  return:
  
[DISABLE]

InfiniteSplitStackAOB1:
  readmem(InfiniteSplitStackAOB1Save,16)
  
unregistersymbol(InfiniteSplitStackAOB1)
