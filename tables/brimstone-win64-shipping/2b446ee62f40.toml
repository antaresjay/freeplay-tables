[[cheat]]
id = "activate-trainer-4-controls-attributes"
name = "Activate Trainer 4 (Controls Attributes"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(InfiniteSpellSlotAOB1,$process,F3 0F 11 49 0C C3 CC CC CC CC CC CC CC CC CC CC)
registersymbol(InfiniteSpellSlotAOB1)
alloc(newmem,1024)

label(InfiniteSpellSlotAOB1Save)
registersymbol(InfiniteSpellSlotAOB1Save)

newmem:
  mov [R11Save],r11
  mov [R12Save],r12
  mov [R13Save],r13
  mov [R15Save],r15
  mov r15,bInfiniteSpellSlots
  cmp dword ptr [r15],1
  jne MyCleanUp1
  mov r15,GameStatePtr
  mov r15,[r15]
  test r15,r15
  je MyCleanUp1
  mov r15,[r15+2C8]
  test r15,r15
  je MyCleanUp1
  mov r15,[r15+0]
  test r15,r15
  je MyCleanUp1
  xor r11,r11
  mov r11d,[r15+3A8]
  mov r15,[r15+3A0]
  test r15,r15
  je MyCleanUp1
  xor r12,r12
StartPartyLoop:
  cmp r12d,r11d
  jge DonePartyLoop
  mov r13,[r15+r12*8]
  test r13,r13
  je MyCleanUp1
  mov r13,[r13+2E0]
  test r13,r13
  je MyCleanUp1
  mov r13,[r13+1100]
  test r13,r13
  je MyCleanUp1
  mov r13,[r13+68]
  cmp r13,r14
  je FoundHero
  inc r12d
  jmp StartPartyLoop
DonePartyLoop:
  jmp MyCleanUp1
FoundHero:
  comiss xmm1,[rcx+0C]
  jae MyCleanUp1
  movss xmm1,[rcx+0C]
  jmp MyCleanUp1
  
MyCleanUp1:
  mov r11,[R11Save]
  mov r12,[R12Save]
  mov r13,[R13Save]
  mov r15,[R15Save]

originalcode:
InfiniteSpellSlotAOB1Save:
  readmem(InfiniteSpellSlotAOB1,15)
  
R11Save:
dq 0
R12Save:
dq 0
R13Save:
dq 0
R15Save:
dq 0

InfiniteSpellSlotAOB1:
  jmp newmem
  return:
  
[DISABLE]

InfiniteSpellSlotAOB1:
  readmem(InfiniteSpellSlotAOB1Save,15)
  
unregistersymbol(InfiniteSpellSlotAOB1)
unregistersymbol(InfiniteSpellSlotAOB1Save)

dealloc(newmem)"""

