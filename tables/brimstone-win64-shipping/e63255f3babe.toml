[[cheat]]
id = "gold-open-inventory"
name = "Gold (Open Inventory)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(gimmecashh,Brimstone-Win64-Shipping.exe,8B 88 E0 00 00 00 48 8D 54 24 30 89 4F 68 0F 57 C0 48 8B C8 C7 44 24 40 01 00 00 00 F3 0F 7F 44 24 30 48 C7 44 24 44 01 00 00 00 E8 4A 65 E6 FF 8B D0) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

label(money_pointer)
registersymbol(money_pointer)
newmem:
  mov [money_pointer], rax
code:
  mov ecx,[rax+000000E0]
  lea rdx,[rsp+30]
  mov [rdi+68],ecx
  jmp return

money_pointer:
dq 0

gimmecashh:
  jmp far newmem
return:
registersymbol(gimmecashh)

[DISABLE]

gimmecashh:
  db 8B 88 E0 00 00 00 48 8D 54 24 30 89 4F 68

unregistersymbol(gimmecashh)
unregistersymbol(money_pointer)
dealloc(newmem)"""

