[[cheat]]
id = "witcher-2-ee-gog-aob-script"
name = "Witcher 2 EE (GOG) AOB script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game   : witcher2.exe
// Version:
// Date   :
// Author : Cs
[ENABLE]
define(OFFSET_ADRENALINE,0x000002A8)
define(OFFSET_WEIGHTRESTRICTION,0x0000032C)
define(ITEM_ORENS,0x000002C2)
define(STAT_CARRYWEIGHT,0x00000439)
define(STAT_INSTANTKILLCHANCE,0x000004A1)
aobscanmodule(aobPlayerGrabber,witcher2.exe,8B 80 ?? ?? 00 00 83 ?? ?? 56 8B F1 80)
aobscanmodule(aobPlayerVitalsOffset,witcher2.exe,8B 40 ?? 03 41 ?? EB)
aobscanmodule(aobInventoryReader,witcher2.exe,8B 4C 39 ?? 89 4D ?? DB 45)
aobscanmodule(aobItemDropper,witcher2.exe,8B 46 ?? 3B C7 56 0F 42 F8)
aobscanmodule(aobPlayerCListOffset,witcher2.exe,8B 87 ?? ?? 00 00 8B 34 98 85 F6 74 ?? 83)
aobscanmodule(aobRestrictionUpdater,witcher2.exe,8B 45 10 85 C0 74 03 C6 00 01)
aobscanmodule(aobStatGrabber,witcher2.exe,6B D2 14 8B 14 1A 3B 55 ?? 76 ?? 8D)
aobscanmodule(aobStatCalc,witcher2.exe,D8 48 0C D8 48 04)

alloc(newmemPlayerGrabber,4096,aobPlayerGrabber)

label(aobPlayerGrabber_r)
label(aobPlayerGrabber_i)
registersymbol(aobPlayerGrabber_r)
registersymbol(aobPlayerGrabber_i)

label(lblPlayerGrabber)
label(lblPlayerGrabberSkip)
label(lblPlayerGrabberRet)

label(bEnableMaxHealth)
label(bEnableMaxVigor)
label(bEnableMaxAdrenaline)
registersymbol(bEnableMaxHealth)
registersymbol(bEnableMaxVigor)
registersymbol(bEnableMaxAdrenaline)

label(pPlayer)
label(pPlayerVitals)
registersymbol(pPlayer)
registersymbol(pPlayerVitals)

label(iPlayerVitalsOffset)
registersymbol(iPlayerVitalsOffset)

label(aobInventoryReader_r)
label(aobInventoryReader_i)
registersymbol(aobInventoryReader_r)
registersymbol(aobInventoryReader_i)

label(lblInventoryReader)
label(lblInventoryReaderSkip)
label(lblInventoryReaderRet)

label(bEnableMinOrens)
label(iMinOrens)
registersymbol(bEnableMinOrens)
registersymbol(iMinOrens)

label(aobItemDropper_r)
label(aobItemDropper_i)
registersymbol(aobItemDropper_r)
registersymbol(aobItemDropper_i)

label(lblItemDropper)
label(lblItemDropperSkip)
label(lblItemDropperRet)

label(bEnableMinItemsOnDrop)
label(iMinItemsOnDrop)
registersymbol(bEnableMinItemsOnDrop)
registersymbol(iMinItemsOnDrop)

label(iPlayerCListOffset)
registersymbol(iPlayerCListOffset)

label(aobRestrictionUpdater_r)
label(aobRestrictionUpdater_i)
registersymbol(aobRestrictionUpdater_r)
registersymbol(aobRestrictionUpdater_i)

label(lblRestrictionUpdater)
label(lblRestrictionUpdaterSkip)
label(lblRestrictionUpdaterRet)

label(bEnableNoWeightRunRestriction)
registersymbol(bEnableNoWeightRunRestriction)

label(aobStatGrabber_r)
label(aobStatGrabber_i)
registersymbol(aobStatGrabber_r)
registersymbol(aobStatGrabber_i)

label(lblStatGrabber)
label(lblStatGrabberSkip)
label(lblStatGrabberRet)

label(pCarryWeight)
label(pInstantKillChance)
registersymbol(pCarryWeight)
registersymbol(pInstantKillChance)

label(aobStatCalc_r)
label(aobStatCalc_i)
registersymbol(aobStatCalc_r)
registersymbol(aobStatCalc_i)

label(lblStatCalc)
label(lblStatCalcSkip)
label(lblStatCalcRet)

label(bEnableCarryWeightMod)
label(fCarryWeightMod)
label(bEnableInstantKillChanceMod)
label(fInstantKillChanceMod)
registersymbol(bEnableCarryWeightMod)
registersymbol(fCarryWeightMod)
registersymbol(bEnableInstantKillChanceMod)
registersymbol(fInstantKillChanceMod)

newmemPlayerGrabber:
bEnableMaxHealth:
dd 1
bEnableMaxVigor:
dd 1
bEnableMaxAdrenaline:
dd 1
bEnableMinOrens:
dd 1
iMinOrens:
dd (int)1000
bEnableMinItemsOnDrop:
dd 1
iMinItemsOnDrop:
dd (int)20
bEnableNoWeightRunRestriction:
dd 1
bEnableCarryWeightMod:
dd 1
fCarryWeightMod:
dd (float)5.0
bEnableInstantKillChanceMod:
dd 1
fInstantKillChanceMod:
dd (float)10.0

lblPlayerGrabber:
readmem(aobPlayerGrabber,6)
mov [pPlayer],eax
test eax,eax
jz lblPlayerGrabberSkip
push ecx
push ebx
mov ebx,[iPlayerVitalsOffset]
mov ebx,[eax+ebx]
mov dword ptr [pPlayerVitals],ebx
cmp dword ptr [bEnableMaxHealth],1
jne short @f
cmp dword ptr [ebx+08],0
jle short @f
mov ecx,[ebx+0C]
mov dword ptr [ebx+08],ecx
@@:
cmp dword ptr [bEnableMaxVigor],1
jne short @f
cmp dword ptr [ebx+10],0
jle short @f
mov ecx,[ebx+14]
mov dword ptr [ebx+10],ecx
@@:
cmp dword ptr [bEnableMaxAdrenaline],1
jne short @f
cmp dword ptr [ebx+OFFSET_ADRENALINE],0
jle short @f
mov dword ptr [ebx+OFFSET_ADRENALINE],(float)100.0
@@:
pop ebx
pop ecx
lblPlayerGrabberSkip:
jmp lblPlayerGrabberRet
aobPlayerGrabber_i:
readmem(aobPlayerGrabber,6)
pPlayer:
dd 0
pPlayerVitals:
dd 0
iPlayerVitalsOffset:
readmem(aobPlayerVitalsOffset+2,1)
dd 00 00 00

lblInventoryReader:
push eax
push ebx
push edx
cmp dword ptr [ecx+edi],ITEM_ORENS
jne short @f
cmp dword ptr [bEnableMinOrens],1
jne short @f
mov edx,[iMinOrens]
movsx ebx,[aobInventoryReader_i+03]
lea eax,[ecx+edi]
cmp dword ptr [ebx+eax],edx
jge short @f
mov dword ptr [ebx+eax],edx
@@:
lblInventoryReaderSkip:
pop edx
pop ebx
pop eax
readmem(aobInventoryReader,7)
jmp lblInventoryReaderRet
aobInventoryReader_i:
readmem(aobInventoryReader,7)

lblItemDropper:
push ecx
cmp dword ptr [bEnableMinItemsOnDrop],1
jne short lblItemDropperSkip
mov eax,[pPlayer]
test eax,eax
jz short lblItemDropperSkip
mov ecx,[iPlayerCListOffset]
mov eax,[eax+ecx]
test eax,eax
jz short lblItemDropperSkip
mov eax,[eax+1C]
test eax,eax
jz short lblItemDropperSkip
cmp eax,ebx
jne short lblItemDropperSkip
pushad
push 10
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne short lblItemDropperSkip
mov eax,[iMinItemsOnDrop]
add eax,edi
movsx ecx,[aobItemDropper_i+02]
cmp dword ptr [esi+ecx],eax
jge short lblItemDropperSkip
mov dword ptr [esi+ecx],eax
lblItemDropperSkip:
pop ecx
readmem(aobItemDropper,5)
jmp lblItemDropperRet
aobItemDropper_i:
readmem(aobItemDropper,5)
iPlayerCListOffset:
readmem(aobPlayerCListOffset+02,4)

lblRestrictionUpdater:
mov eax,[pPlayerVitals]
add eax,OFFSET_WEIGHTRESTRICTION
cmp dword ptr [ebp+10],eax
jne short lblRestrictionUpdaterSkip
cmp dword ptr [bEnableNoWeightRunRestriction],1
jne short lblRestrictionUpdaterSkip
mov byte ptr [eax],0
mov dword ptr [ebp+10],0
lblRestrictionUpdaterSkip:
readmem(aobRestrictionUpdater,5)
jmp lblRestrictionUpdaterRet
aobRestrictionUpdater_i:
readmem(aobRestrictionUpdater,5)

lblStatGrabber:
readmem(aobStatGrabber,3)

cmp dword ptr [ebp+0C],STAT_CARRYWEIGHT
jne short @f
push eax
lea eax,[edx+ebx]
mov dword ptr [pCarryWeight],eax
pop eax
jmp short lblStatGrabberSkip
@@:

cmp dword ptr [ebp+0C],STAT_INSTANTKILLCHANCE
jne short @f
push eax
lea eax,[edx+ebx]
mov dword ptr [pInstantKillChance],eax
pop eax
@@:

lblStatGrabberSkip:
readmem(aobStatGrabber+03,3)
jmp lblStatGrabberRet
aobStatGrabber_i:
readmem(aobStatGrabber,6)
pCarryWeight:
dd 0
pInstantKillChance:
dd 0

lblStatCalc:
cmp dword ptr [bEnableCarryWeightMod],1
jne short @f
mov ebp,[pCarryWeight]
add ebp,4
cmp eax,ebp
jne short @f
fmul dword ptr [fCarryWeightMod]
jmp short lblStatCalcSkip
@@:
cmp dword ptr [bEnableInstantKillChanceMod],1
jne short @f
mov ebp,[pInstantKillChance]
add ebp,4
cmp eax,ebp
jne short @f
fmul dword ptr [fInstantKillChanceMod]
@@:
lblStatCalcSkip:
readmem(aobStatCalc,6)
jmp lblStatCalcRet
aobStatCalc_i:
readmem(aobStatCalc,6)

aobStatCalc:
aobStatCalc_r:
jmp lblStatCalc
nop
lblStatCalcRet:

aobStatGrabber:
aobStatGrabber_r:
jmp lblStatGrabber
nop
lblStatGrabberRet:

aobRestrictionUpdater:
aobRestrictionUpdater_r:
jmp lblRestrictionUpdater
lblRestrictionUpdaterRet:

aobItemDropper:
aobItemDropper_r:
jmp lblItemDropper
lblItemDropperRet:

aobInventoryReader:
aobInventoryReader_r:
jmp lblInventoryReader
nop
nop
lblInventoryReaderRet:

aobPlayerGrabber:
aobPlayerGrabber_r:
jmp lblPlayerGrabber
nop
lblPlayerGrabberRet:

[DISABLE]
aobPlayerGrabber_r:
readmem(aobPlayerGrabber_i,6)

unregistersymbol(aobPlayerGrabber_r)
unregistersymbol(aobPlayerGrabber_i)

unregistersymbol(bEnableMaxHealth)
unregistersymbol(bEnableMaxVigor)
unregistersymbol(bEnableMaxAdrenaline)

unregistersymbol(pPlayer)
unregistersymbol(pPlayerVitals)

unregistersymbol(iPlayerVitalsOffset)

aobInventoryReader_r:
readmem(aobInventoryReader_i,7)

unregistersymbol(aobInventoryReader_r)
unregistersymbol(aobInventoryReader_i)

unregistersymbol(bEnableMinOrens)

aobItemDropper_r:
readmem(aobItemDropper_i,5)

unregistersymbol(aobItemDropper_r)
unregistersymbol(aobItemDropper_i)

unregistersymbol(bEnableMinItemsOnDrop)
unregistersymbol(iMinItemsOnDrop)

unregistersymbol(iPlayerCListOffset)

aobRestrictionUpdater_r:
readmem(aobRestrictionUpdater_i,5)

unregistersymbol(aobRestrictionUpdater_r)
unregistersymbol(aobRestrictionUpdater_i)

unregistersymbol(bEnableNoWeightRunRestriction)

aobStatGrabber_r:
readmem(aobStatGrabber_i,6)

unregistersymbol(aobStatGrabber_r)
unregistersymbol(aobStatGrabber_i)

unregistersymbol(pCarryWeight)
unregistersymbol(pInstantKillChance)

aobStatCalc_r:
readmem(aobStatCalc_i,6)

unregistersymbol(aobStatCalc_r)
unregistersymbol(aobStatCalc_i)

unregistersymbol(bEnableCarryWeightMod)
unregistersymbol(fCarryWeightMod)
unregistersymbol(bEnableInstantKillChanceMod)
unregistersymbol(fInstantKillChanceMod)

dealloc(newmemPlayerGrabber)"""

