[[cheat]]
id = "cpxplayernetwork-base-address-scan-initialization-activate-this-first"
name = "cpxPlayerNetwork Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(cpxPlayerNetwork_basepointer)
registersymbol(cpxPlayerNetwork_update_enable)
registersymbol(cpxPlayerNetwork_set_enable)
registersymbol(cpxPlayerNetwork_hullset_enable)
registersymbol(cpxPlayerNetwork_shieldset_enable)
registersymbol(cpxPlayerNetwork_weapon1set_enable)
registersymbol(cpxPlayerNetwork_weapon2set_enable)

alloc(cpxPlayerNetwork_basepointer, 4)
alloc(cpxPlayerNetwork_update_enable, 4)
alloc(cpxPlayerNetwork_set_enable, 4)
alloc(cpxPlayerNetwork_hullset_enable, 4)
alloc(cpxPlayerNetwork_shieldset_enable, 4)
alloc(cpxPlayerNetwork_weapon1set_enable, 4)
alloc(cpxPlayerNetwork_weapon2set_enable, 4)


[DISABLE]
unregistersymbol(cpxPlayerNetwork_basepointer)
unregistersymbol(cpxPlayerNetwork_update_enable)
unregistersymbol(cpxPlayerNetwork_set_enable)
unregistersymbol(cpxPlayerNetwork_hullset_enable)
unregistersymbol(cpxPlayerNetwork_shieldset_enable)
unregistersymbol(cpxPlayerNetwork_weapon1set_enable)
unregistersymbol(cpxPlayerNetwork_weapon2set_enable)

dealloc(cpxPlayerNetwork_basepointer)
dealloc(cpxPlayerNetwork_update_enable)
dealloc(cpxPlayerNetwork_set_enable)
dealloc(cpxPlayerNetwork_hullset_enable)
dealloc(cpxPlayerNetwork_shieldset_enable)
dealloc(cpxPlayerNetwork_weapon1set_enable)
dealloc(cpxPlayerNetwork_weapon2set_enable)"""

[[cheat]]
id = "cpxplayernetwork-base-address-scan-to-activate-play-level-to-update-play-level"
name = "cpxPlayerNetwork Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(cpxPlayerNetwork_savedAOB)
label(cpxPlayerNetwork_returnhere)
label(cpxPlayerNetwork_originalcode)
label(cpxPlayerNetwork_exit)

label(cpxPlayerNetwork_update_exit)
label(cpxPlayerNetwork_set_exit)
label(cpxPlayerNetwork_hullset_exit)
label(cpxPlayerNetwork_shieldset_exit)
label(cpxPlayerNetwork_shieldset_entry)
label(cpxPlayerNetwork_weapon1set_exit)
label(cpxPlayerNetwork_weapon1set_entry)
label(cpxPlayerNetwork_weapon1set_continue)
label(cpxPlayerNetwork_weapon2set_exit)
label(cpxPlayerNetwork_weapon2set_entry)
label(cpxPlayerNetwork_weapon2set_continue)

registersymbol(cpxPlayerNetwork_savedAOB)

//14ABDE35 - 83 EC 40              - sub esp,40
//14ABDE38 - 8B 7D 08              - mov edi,[ebp+08]
//  cpxPlayerNetwork:Update+b
//14ABDE3B - 0FB6 47 49            - movzx eax,byte ptr [edi+49]
//14ABDE3F - 85 C0                 - test eax,eax
//14ABDE41 - 0F85 46000000         - jne 14ABDE8D
//14ABDE47 - C6 47 49 01           - mov byte ptr [edi+49],01
//14ABDE4B - 8B 05 7849891C        - mov eax,[1C894978] : [1C87AE40]
//14ABDE51 - 0FB6 40 28            - movzx eax,byte ptr [eax+28]
aobscan(cpxPlayerNetwork_searchedAOB, 0F B6 47 49 85 C0 0F 85 46 00 00 00 C6 47 49 01)

alloc(cpxPlayerNetwork_newmem, 2048, cpxPlayerNetwork_searchedAOB)
alloc(cpxPlayerNetwork_temp1, 4, cpxPlayerNetwork_searchedAOB)
alloc(cpxPlayerNetwork_temp2, 4, cpxPlayerNetwork_searchedAOB)
alloc(cpxPlayerNetwork_temp3, 4, cpxPlayerNetwork_searchedAOB)
alloc(cpxPlayerNetwork_temp4, 4, cpxPlayerNetwork_searchedAOB)
alloc(cpxPlayerNetwork_temp5, 4, cpxPlayerNetwork_searchedAOB)


cpxPlayerNetwork_newmem:
mov [cpxPlayerNetwork_temp1], eax
mov [cpxPlayerNetwork_temp2], ebx
mov [cpxPlayerNetwork_temp3], ecx
mov [cpxPlayerNetwork_temp4], edx

cmp dword ptr [cpxPlayerNetwork_update_enable], #0
je cpxPlayerNetwork_update_exit
mov [cpxPlayerNetwork_basepointer], edi
cpxPlayerNetwork_update_exit:

cmp dword ptr [cpxPlayerNetwork_set_enable], #0
je cpxPlayerNetwork_set_exit
cpxPlayerNetwork_set_exit:

cmp dword ptr [cpxPlayerNetwork_hullset_enable], #0
je cpxPlayerNetwork_hullset_exit
mov ebx, [edi+28]
test ebx, ebx
je cpxPlayerNetwork_hullset_exit
fld [ebx+94]
fstp [ebx+98]
cpxPlayerNetwork_hullset_exit:

cmp dword ptr [cpxPlayerNetwork_shieldset_enable], #0
je cpxPlayerNetwork_shieldset_exit
mov edx, 0
mov ebx, [edi+28]
test ebx, ebx
je cpxPlayerNetwork_shieldset_exit
mov eax, [ebx+20]
test eax, eax
je cpxPlayerNetwork_shieldset_exit
mov ebx, [ebx+1c]
test ebx, ebx
je cpxPlayerNetwork_shieldset_exit
mov ecx, [ebx+c]
test ecx, ecx
je cpxPlayerNetwork_shieldset_exit
cpxPlayerNetwork_shieldset_entry:
fld [ebx+edx*4+10]
fstp [eax+edx*4+10]
inc edx
cmp ecx, edx
je cpxPlayerNetwork_shieldset_exit
jmp cpxPlayerNetwork_shieldset_entry
cpxPlayerNetwork_shieldset_exit:

cmp dword ptr [cpxPlayerNetwork_weapon1set_enable], #0
je cpxPlayerNetwork_weapon1set_exit
mov edx, 0
mov ebx, [edi+28]
test ebx, ebx
je cpxPlayerNetwork_weapon1set_exit
mov ebx, [ebx+58]
test ebx, ebx
je cpxPlayerNetwork_weapon1set_exit
mov ebx, [ebx+10]
test ebx, ebx
je cpxPlayerNetwork_weapon1set_exit
mov ecx, [ebx+c]
test ecx, ecx
je cpxPlayerNetwork_weapon1set_exit
mov [cpxPlayerNetwork_temp5], ecx
cpxPlayerNetwork_weapon1set_entry:
mov eax, [ebx+edx*4+10]
test eax, eax
je cpxPlayerNetwork_weapon1set_continue
mov ecx, [eax+24]
mov [eax+28], ecx
mov [eax+30], (float)0
mov [eax+34], (float)1
mov [eax+44], (float)0
cpxPlayerNetwork_weapon1set_continue:
inc edx
cmp [cpxPlayerNetwork_temp5], edx
je cpxPlayerNetwork_weapon1set_exit
jmp cpxPlayerNetwork_weapon1set_entry
cpxPlayerNetwork_weapon1set_exit:

cmp dword ptr [cpxPlayerNetwork_weapon2set_enable], #0
je cpxPlayerNetwork_weapon2set_exit
mov edx, 0
mov ebx, [edi+28]
test ebx, ebx
je cpxPlayerNetwork_weapon2set_exit
mov ebx, [ebx+58]
test ebx, ebx
je cpxPlayerNetwork_weapon2set_exit
mov ebx, [ebx+c]
test ebx, ebx
je cpxPlayerNetwork_weapon2set_exit
mov ecx, [ebx+c]
test ecx, ecx
je cpxPlayerNetwork_weapon2set_exit
mov [cpxPlayerNetwork_temp5], ecx
cpxPlayerNetwork_weapon2set_entry:
mov eax, [ebx+edx*4+10]
test eax, eax
je cpxPlayerNetwork_weapon2set_continue
mov ecx, [eax+24]
mov [eax+28], ecx
mov [eax+30], (float)0
mov [eax+34], (float)1
mov [eax+44], (float)0
cpxPlayerNetwork_weapon2set_continue:
inc edx
cmp [cpxPlayerNetwork_temp5], edx
je cpxPlayerNetwork_weapon2set_exit
jmp cpxPlayerNetwork_weapon2set_entry
cpxPlayerNetwork_weapon2set_exit:

mov eax, [cpxPlayerNetwork_temp1]
mov ebx, [cpxPlayerNetwork_temp2]
mov ecx, [cpxPlayerNetwork_temp3]
mov edx, [cpxPlayerNetwork_temp4]


cpxPlayerNetwork_originalcode:
db 0F B6 47 49 85 C0
//movzx eax,byte ptr [edi+49]
//test eax,eax


cpxPlayerNetwork_exit:
jmp cpxPlayerNetwork_returnhere


cpxPlayerNetwork_searchedAOB:
cpxPlayerNetwork_savedAOB:
jmp cpxPlayerNetwork_newmem
nop
cpxPlayerNetwork_returnhere:


[DISABLE]
cpxPlayerNetwork_savedAOB:
db 0F B6 47 49 85 C0
//movzx eax,byte ptr [edi+49]
//test eax,eax

unregistersymbol(cpxPlayerNetwork_savedAOB)

dealloc(cpxPlayerNetwork_newmem)
dealloc(cpxPlayerNetwork_temp1)
dealloc(cpxPlayerNetwork_temp2)
dealloc(cpxPlayerNetwork_temp3)
dealloc(cpxPlayerNetwork_temp4)
dealloc(cpxPlayerNetwork_temp5)"""

