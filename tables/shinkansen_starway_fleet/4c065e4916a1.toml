label(cpxShipTarget_shieldset_entry)
label(cpxShipTarget_enemyset_entry)
label(cpxShipTarget_enemyset_exit)

registersymbol(cpxShipTarget_savedAOB)

//14AA0EAE - 81 EC BC000000        - sub esp,000000BC
//14AA0EB4 - 8B 7D 08              - mov edi,[ebp+08]
// cpxShipTarget:Update+f
//14AA0EB7 - C7 85 58FFFFFF 00000000 - mov [ebp-000000A8],00000000
//14AA0EC1 - C7 85 5CFFFFFF 00000000 - mov [ebp-000000A4],00000000
//14AA0ECB - C7 85 60FFFFFF 00000000 - mov [ebp-000000A0],00000000
//14AA0ED5 - 8B 05 7049891C        - mov eax,[1C894970] : [1E0B6190]
//14AA0EDB - 83 EC 08              - sub esp,08
//14AA0EDE - 6A 00                 - push 00
//14AA0EE0 - 50                    - push eax
aobscan(cpxShipTarget_searchedAOB, C7 85 58 FF FF FF 00 00 00 00 C7 85 5C FF FF FF 00 00 00 00 C7 85 60 FF FF FF 00 00 00 00 * * * * * * 83 EC 08)

alloc(cpxShipTarget_newmem, 2048, cpxShipTarget_searchedAOB)
