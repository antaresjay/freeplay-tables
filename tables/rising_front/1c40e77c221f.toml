type = "script"
source = """
//Send@ModEngine
[ENABLE]

aobscan(infammo,89 08 48 63 87 20 01 00 00)
alloc(newmem,$1000,infammo)

label(code)
label(return)

newmem:

code:
  mov [rax],#99
  movsxd  rax,dword ptr [rdi+00000120]
  jmp return

infammo:
  jmp newmem
  nop 4
return:
registersymbol(infammo)

[DISABLE]

infammo:
  db 89 08 48 63 87 20 01 00 00

unregistersymbol(infammo)
dealloc(newmem)"""
