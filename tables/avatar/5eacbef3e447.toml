[[cheat]]
id = "enable-script-1"
name = "Enable Script 1"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,1024)
alloc(_chv,8)
registersymbol(_chv)
label(returnhere)
label(exit)
label(originalcode)

newmem:

cmp [_chv],0
jne originalcode
push eax
lea eax,[ebp+00004FD4]
mov [_chv],eax
pop eax

originalcode:
add [ebp+00004FD4],ebx

exit:
jmp returnhere

"Dunia.dll"+4DD2CE:
jmp newmem
nop
returnhere:


[DISABLE]
dealloc(newmem)
dealloc(_chv)
"Dunia.dll"+4DD2CE:
add [ebp+00004FD4],ebx
unregistersymbol(_chv)
//Alt: db 01 9D D4 4F 00 00"""

