[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(aobHealth,Earthfall.exe,F3 0F 11 87 28 08 00 00)
alloc(newmem,$100,aobHealth)

label(code)
label(return)

newmem:

code:
  movss [rdi+00000828],xmm0
  mov [rdi+00000828],(float)100
  jmp return

aobHealth:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(aobHealth)

[DISABLE]

aobHealth:
  db F3 0F 11 87 28 08 00 00

unregistersymbol(aobHealth)
dealloc(newmem)"""

