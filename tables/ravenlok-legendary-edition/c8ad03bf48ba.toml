[[cheat]]
id = "stats-i"
name = "Stats: I"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(_SaveManager,GameAssembly.dll,8B 40 60 48 8D 4C 24 30 33)
alloc(newmem,$1111,_SaveManager)
alloc(_Manager,8)
label(return)
registersymbol(_Manager _SaveManager)
newmem:
  mov [_Manager],rax
  mov eax,[rax+60]
  lea rcx,[rsp+30]
  jmp return
_SaveManager:
  jmp newmem
  nop 3
return:
[DISABLE]
dealloc(*)
unregistersymbol(*)
_SaveManager:
  db 8B 40 60 48 8D 4C 24 30"""

