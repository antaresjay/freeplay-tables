[[cheat]]
id = "flatout-2"
name = "Flatout 2"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : FlatOut2.exe
  Version: 
  Date   : 2019-01-03
  Author : Dread Pony Roberts

  This script does the impossible
}

[ENABLE]

aobscanmodule(HEALTH,FlatOut2.exe,D9 95 A0 6A 00 00) // should be unique
alloc(newmem,$100)
alloc(healthlock,1)
registersymbol(healthlock)
alloc(onehitkill,1)
registersymbol(onehitkill)
alloc(EXTREME,1)
registersymbol(EXTREME)

label(code)
label(return)
label(onehitkillcode)
label(enemycode)

newmem:
  cmp [ebp+268],81A0A783
  jne enemycode
  cmp byte ptr [EXTREME],1
  je onehitkillcode
  cmp byte ptr [healthlock],1
  jne code
  //fst dword ptr [ebp+00006AA0]
  jmp return

onehitkillcode:
  fst dword ptr [ebp+00006AA0]
  add [ebp+00006AA0],(float)1
  jmp return

enemycode:
  cmp byte ptr [onehitkill],1
  je onehitkillcode

code:
  fst dword ptr [ebp+00006AA0]
  jmp return

HEALTH:
  jmp newmem
  nop
return:
registersymbol(HEALTH)

aobscanmodule(Reader,FlatOut2.exe,8B 01 FF 50 30 47 EB 92) // should be unique
alloc(newmemr,$100)
alloc(read,8)
registersymbol(read)

label(coder)
label(returnr)

newmemr:
mov [read],ecx

coder:
  mov eax,[ecx]
  call dword ptr [eax+30]
  jmp returnr

Reader:
  jmp newmemr
returnr:
registersymbol(Reader)

aobscanmodule(Money_Reader,FlatOut2.exe,A1 10 84 8E 00 8B 88 58) // should be unique
alloc(newmemb,$100)
alloc(read2,8)
registersymbol(read2)
alloc(iamrich,1)
registersymbol(iamrich)
alloc(saveit,8)
registersymbol(saveit)
alloc(safe,1)
alloc(restore,1)
registersymbol(restore)

label(codeb)
label(returnb)
label(riches)
label(savemechief)

newmemb:
  mov eax,[FlatOut2.exe+4E8410]
  mov [read2],eax
  cmp byte ptr [restore],1
  je savemechief
  cmp byte ptr [iamrich],1
  jne codeb
  cmp byte ptr [safe],1
  je riches
  push edx
  push ecx
  mov edx,eax
  add edx,1E38
  mov ecx,[edx]
  mov [saveit],ecx
  mov byte ptr [safe],1
  mov [edx],(int)100000
  pop ecx
  pop edx
  jmp codeb

savemechief:
  cmp byte ptr [safe],1
  jne codeb
  push edx
  push ecx
  mov edx,eax
  add edx,1E38
  mov ecx,[saveit]
  mov [edx],ecx
  mov byte ptr [safe],0
  pop ecx
  pop edx
  jmp codeb

riches:
  push edx
  mov edx,eax
  add edx,1E38
  mov [edx],(int)100000
  pop edx


codeb:
  jmp returnb

Money_Reader:
  jmp newmemb
returnb:
registersymbol(Money_Reader)

[DISABLE]

HEALTH:
  db D9 95 A0 6A 00 00

unregistersymbol(HEALTH)
dealloc(newmem)
dealloc(healthlock)
unregistersymbol(healthlock)
dealloc(onehitkill)
unregistersymbol(onehitkill)
dealloc(EXTREME)
unregistersymbol(EXTREME)

Reader:
  db 8B 01 FF 50 30

unregistersymbol(Reader)
dealloc(newmemr)
dealloc(read)
unregistersymbol(read)

Money_Reader:
  db A1 10 84 8E 00

unregistersymbol(Money_Reader)
dealloc(newmemb)
dealloc(read2)
unregistersymbol(read2)
dealloc(iamrich)
unregistersymbol(iamrich)
dealloc(saveit)
unregistersymbol(saveit)
dealloc(safe)
dealloc(restore)
unregistersymbol(restore)

