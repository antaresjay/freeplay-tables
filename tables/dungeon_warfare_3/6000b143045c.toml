[[cheat]]
id = "timer"
name = "Timer"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(time,GameAssembly.dll,F3 0F 10 31 48 85 D2) // should be unique
alloc(newmem,$1000,time)

label(code)
label(return)

label(timepointer)
registersymbol(timepointer)

newmem:
  mov [timepointer], rcx
code:
  movss xmm6,[rcx]
  test rdx,rdx
  jmp return

timepointer:
dq 0

time:
  jmp newmem
  nop 2
return:
registersymbol(time)

[DISABLE]

time:
  db F3 0F 10 31 48 85 D2

unregistersymbol(time)
unregistersymbol(timepointer)
dealloc(newmem)"""

