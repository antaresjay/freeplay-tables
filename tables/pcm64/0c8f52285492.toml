[[cheat]]
id = "pro-cycling-manager-2022-game-version-1-0-3-3"
name = "Pro Cycling Manager 2022 - Game Version 1.0.3.3+"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobScanModule(Yellow_AOB,PCM64.exe, F3 0F 59 C1 F3 0F 5C D0 44)
aobScanModule(Red_AOB,PCM64.exe, F3 0F 5C CB F3 0F 5F C1)
aobScanModule(Green_AOB,PCM64.exe, F3 41 0F 58 11 0F 2F D0)
aobScanModule(HeartBeat_AOB,PCM64.exe, F3 0F 58 C4 F3 0F 58 C1 F3 0F 10)
aobScanModule(Pointer_AOB,PCM64.exe, 48 8B 57 50 48 8B 4F 48 4D 8B C6)
alloc(EnergyMem,8192,Yellow_AOB)
label(EnergyYellow)
label(EnergyYellow_1)
label(EnergyYellow_2)
label(EnergyRed)
label(EnergyRed_1)
label(EnergyRed_2)
label(EnergyGreen)
label(EnergyGreen_1)
label(EnergyGreen_2)
label(HeartBeat)
label(HeartBeat_1)
label(MinMax)
label(PointerCode)
label(ReturnYellow)
label(ReturnRed)
label(ReturnGreen)
label(ReturnHeartBeat)
label(ReturnPointerCode)

EnergyMem:

EnergyYellow:
  mulss xmm0,xmm1
  cmp r15,1
  jne EnergyYellow_1
  mulss xmm0,[EnergyRateYellow]
  jmp EnergyYellow_2

EnergyYellow_1:
  cmp rdi,1
  jne EnergyYellow_2
  mulss xmm0,[EnergyRateYellow]

EnergyYellow_2:
  subss xmm2,xmm0
  jmp ReturnYellow

EnergyRed:
  cmp r15,1
  jne EnergyRed_1
  mulss xmm3,[EnergyRateRed]
  jmp EnergyRed_2

EnergyRed_1:
  cmp rdi,1
  jne EnergyRed_2
  mulss xmm3,[EnergyRateRed]

EnergyRed_2:
  subss xmm1,xmm3
  maxss xmm0,xmm1
  jmp ReturnRed

EnergyGreen:
  xorps xmm0,xmm0
  cmp r15,1
  jne EnergyGreen_1
  comiss xmm2,xmm0
  ja EnergyGreen_1
  mulss xmm2,[EnergyRateRed]
  jmp EnergyGreen_2

EnergyGreen_1:
  cmp rdi,1
  jne EnergyGreen_2
  comiss xmm2,xmm0
  ja EnergyGreen_2
  mulss xmm2,[EnergyRateRed]

EnergyGreen_2:
  addss xmm2,[r9]
  movss xmm0,[rsp+30]
  jmp ReturnGreen

HeartBeat:
  addss xmm0,xmm4
  addss xmm0,xmm1
  cmp r15,1
  jne HeartBeat_1
  cmp [HeartBeatData],0
  je MinMax
  movss xmm0,[HeartBeatData]
  jmp ReturnHeartBeat

HeartBeat_1:
  cmp rdi,1
  jne ReturnHeartBeat
  cmp [HeartBeatData],0
  je MinMax
  movss xmm0,[HeartBeatData]
  jmp ReturnHeartBeat

MinMax:
  cmp [HeartBeatData+10],0
  je ReturnHeartBeat
  cmp [HeartBeatData+20],0
  je ReturnHeartBeat
  movss xmm1,[HeartBeatData+10]
  maxss xmm0,xmm1
  movss xmm1,[HeartBeatData+20]
  minss xmm0,xmm1
  jmp ReturnHeartBeat

PointerCode:
  mov [CyclistPTR],rdi
  mov rdx,[rdi+50]
  mov rcx,[rdi+48]
  jmp ReturnPointerCode

EnergyRateYellow:
  dd 3F800000

EnergyRateRed:
  dd 3F800000

HeartBeatData:
  dd 0

CyclistPTR:
  dd 0

Yellow_AOB:
  jmp EnergyYellow
  db 90 90 90
ReturnYellow:

Red_AOB:
  jmp EnergyRed
  db 90 90 90
ReturnRed:

Green_AOB:
  jmp EnergyGreen
ReturnGreen:

HeartBeat_AOB:
  jmp HeartBeat
  db 90 90 90
ReturnHeartBeat:

Pointer_AOB:
  jmp PointerCode
  db 90 90 90
ReturnPointerCode:

registersymbol(Yellow_AOB)
registersymbol(Red_AOB)
registersymbol(Green_AOB)
registersymbol(HeartBeat_AOB)
registersymbol(Pointer_AOB)
registersymbol(EnergyRateYellow)
registersymbol(EnergyRateRed)
registersymbol(HeartBeatData)
registersymbol(CyclistPTR)

[DISABLE]

Yellow_AOB:
  db F3 0F 59 C1 F3 0F 5C D0

Red_AOB:
  db F3 0F 5C CB F3 0F 5F C1

Green_AOB:
  db F3 41 0F 58 11

HeartBeat_AOB:
  db F3 0F 58 C4 F3 0F 58 C1

Pointer_AOB:
  db 48 8B 57 50 48 8B 4F 48

unregistersymbol(Yellow_AOB)
unregistersymbol(Red_AOB)
unregistersymbol(Green_AOB)
unregistersymbol(HeartBeat_AOB)
unregistersymbol(Pointer_AOB)
unregistersymbol(EnergyRateYellow)
unregistersymbol(EnergyRateRed)
unregistersymbol(HeartBeatData)
unregistersymbol(CyclistPTR)
dealloc(EnergyMem)"""

