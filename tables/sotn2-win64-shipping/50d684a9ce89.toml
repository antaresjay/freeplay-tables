source = """
[ENABLE]

aobscanmodule(InfJump,SOTN2-Win64-Shipping.exe,8B 83 70 04 00 00 39)
alloc(newmem,$1000,InfJump)
registersymbol(iJump)
label(code return iJump)

newmem:
