[[cheat]]
id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(get_Ammo,GameAssembly.dll,8B 50 5C 45 * C9)
alloc(newmem,$1000,get_Ammo)
label(return)

newmem:
cmp dword ptr [rax+14],00
jne @f
mov rdx,[rax+38] //UnitCurrentStats._baseStats
mov edx,[rdx+90] //Ammunition
mov dword ptr [rax+5C],edx
xor r9d,r9d
jmp return
@@:
mov edx,[rax+5C]
xor r9d,r9d
jmp return

get_Ammo:
  jmp newmem
  nop
return:
registersymbol(get_Ammo)

[DISABLE]
get_Ammo:
  db 8B 50 5C 45 33 C9

unregistersymbol(get_Ammo)
dealloc(newmem)"""
