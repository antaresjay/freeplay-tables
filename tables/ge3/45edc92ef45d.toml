type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanmodule(apmultiplier_aob,ge3.exe,F3 42 0F 10 3C B8) // should be unique
alloc(newmem,$100,apmultiplier_aob)

label(code)
label(return apmultiplier)

newmem:

code:
  movss xmm7,[rax+r15*4]
  mulss xmm7,[apmultiplier]
  jmp return

apmultiplier:
  dd (float)1

apmultiplier_aob:
  jmp newmem
  nop
return:
registersymbol(apmultiplier_aob apmultiplier)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
apmultiplier_aob:
  db F3 42 0F 10 3C B8

unregistersymbol(*)
