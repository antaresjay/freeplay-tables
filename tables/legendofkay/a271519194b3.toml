[[cheat]]
id = "combo-move-x1"
name = "Combo Move x1"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(combomove,legendofkay.exe,DB 81 B4 9D 00 00) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov dword ptr [ecx+00009DB4],1

code:
  fild dword ptr [ecx+00009DB4]
  jmp return

combomove:
  jmp newmem
  nop
return:
registersymbol(combomove)

[DISABLE]

combomove:
  db DB 81 B4 9D 00 00

unregistersymbol(combomove)
dealloc(newmem)

