movq xmm2,[eax+20]
movq xmm3,[dDesiredMaxMana]
subsd xmm0,xmm2
addsd xmm0,xmm1
comisd xmm3,xmm0
jp short lblGetValueSkipMaxManaUpdate
jc short lblGetValueSkipMaxManaUpdate
subsd xmm3,xmm1
addsd xmm3,xmm2
movq [eax+10],xmm3
lblGetValueSkipMaxManaUpdate:
fxrstor [buffer]
lblGetValueSkipMaxMana:
jmp lblGetValueReturn

bManaHackEnabled:
dd 1
bMaxManaHackEnabled:
dd 1
dDesiredMana:
dq (double)1E8
dDesiredMaxMana:
dq (double)1E9
pMana:
dd 0
pManaMax:
dd 0

aobGetPointer:
aobGetPointer_r:
jmp lblGetPointer
nop
lblGetPointerReturn:

aobGetValue:
aobGetValue_r:
jmp lblGetValue
