[[cheat]]
id = "pointer"
name = "Pointer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Tetros.exe
  Version: 
  Date   : 2025-08-24
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,GAMELOGIC:gravity)
define(bytes,55 8B EC 53 57)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,GAMELOGIC:gravity)

label(code)
label(return)

newmem:

mov [gravity_ptr],ecx

code:
  push ebp
  mov ebp,esp
  push ebx
  push edi
  jmp return

gravity_ptr:
dd 0

address:
  jmp newmem
return:
registersymbol(gravity_ptr)

[DISABLE]

address:
  db bytes
  // push ebp
  // mov ebp,esp
  // push ebx
  // push edi

dealloc(newmem)
unregistersymbol(gravity_ptr)
{
// ORIGINAL CODE - INJECTION POINT: GAMELOGIC:gravity

1731B9CA: 00 00                 - add [eax],al
1731B9CC: 68 28 29 A4 15        - push 15A42928
1731B9D1: E9 2A 47 CC EF        - jmp 06FE0100
1731B9D6: 00 00                 - add [eax],al
1731B9D8: 68 E8 28 A4 15        - push 15A428E8
1731B9DD: E9 1E 47 CC EF        - jmp 06FE0100
1731B9E2: 00 00                 - add [eax],al
1731B9E4: 68 88 A8 4B 15        - push 154BA888
1731B9E9: E9 12 47 CC EF        - jmp 06FE0100
1731B9EE: 00 00                 - add [eax],al
// ---------- INJECTING HERE ----------
GAMELOGIC:gravity: 55                    - push ebp
// ---------- DONE INJECTING  ----------
GAMELOGIC:gravity+1: 8B EC                 - mov ebp,esp
GAMELOGIC:gravity+3: 53                    - push ebx
GAMELOGIC:gravity+4: 57                    - push edi
GAMELOGIC:gravity+5: 56                    - push esi
GAMELOGIC:gravity+6: 83 EC 3C              - sub esp,3C
GAMELOGIC:gravity+9: 8B 7D 08              - mov edi,[ebp+08]
GAMELOGIC:gravity+c: 0F B6 87 6B 01 00 00  - movzx eax,byte ptr [edi+0000016B]
GAMELOGIC:gravity+13: 85 C0                 - test eax,eax
GAMELOGIC:gravity+15: 74 1E                 - je GAMELOGIC:gravity+35
GAMELOGIC:gravity+17: D9 E8                 - fld1 
}"""

