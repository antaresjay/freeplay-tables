[[cheat]]
id = "active-trainer"
name = "Active Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(activebase,CrashLanding.exe,8B 17 0F 95 C0 0F B6 C0 50 8B 44 24 18 83 EC 10 8B CC F3 0F 11 44 24 0C F3 0F 7E 44 24 20)
registersymbol(activebase)
alloc(newmem,2048)
label(returnhere)
label(originalcode)

label(health)
label(ammo)

label(healthE)
label(ammoE)
registersymbol(healthE)
registersymbol(ammoE)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
health:
cmp [healthE],0
je ammo
mov [edi+4b0],(float)999///health
ammo:
cmp [ammoE],0
je originalcode
mov [edi+400],(float)999//ammo
originalcode:
mov edx,[edi]
setne al
jmp returnhere
healthE:
dd 0
ammoE:
dd 0
activebase://"CrashLanding.exe"+322EDC:
jmp newmem
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
activebase://
db 8B 17 0F 95 C0
unregistersymbol(activebase)
unregistersymbol(healthE)
unregistersymbol(ammoE)"""

