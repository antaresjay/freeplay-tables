[[cheat]]
id = "player-cam-settings"
name = ">> Player-cam settings"
category = "player"
description = ""
hint = ""
type = "script"
source = """
//"LifeIsStrange.exe"+9FB7B0
[ENABLE]

aobscanmodule(playercamAOB,LifeIsStrange.exe,F3 0F 5C 46 74 F3 0F 59)
alloc(newmem,$1000)

label(code)
label(return)

globalalloc(_playercam,4)

newmem:

code:
  mov [_playercam],esi
  subss xmm0,[esi+74]
  jmp return

playercamAOB:
  jmp code
return:
registersymbol(playercamAOB)

[DISABLE]

playercamAOB:
  db F3 0F 5C 46 74

unregistersymbol(playercamAOB)
dealloc(newmem)"""

