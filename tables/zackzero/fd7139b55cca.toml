[[cheat]]
id = "script-energy-display"
name = "SCRIPT: Energy Display"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
define(_aob_energy_display,F3 0F 10 92 E8 17 00 00)

[ENABLE]
aobscan(aob_energy_display,_aob_energy_display) // find AOB
// define(aob_energy_display,"ZackZero.exe"+16AD1C)
//assert(aob_energy_display,_aob_energy_display) // in case we use define, verify we have the right code

alloc(newmem,$1000)

label(code_energy_display)
label(skip_full_energy)
label(skip_full_health)
label(continue_energy_display)
label(full_energy)
label(pEnergy)
label(pEnergyBase)
label(fFullEnergy)
label(fFullHealth)
label(count_energy_display)
label(I_energy_display)

newmem:
pEnergy:
  dd 0
pEnergyBase:
  dd 0
fFullHealth:
  dd 1
fFullEnergy:
  dd 1
count_energy_display:
  dd 0
full_energy:
  dd (float)100.0


code_energy_display:
  mov [pEnergy],edx
  mov [pEnergyBase],ecx
  pushfd
  cmp [fFullEnergy],00000000
  je skip_full_energy
  inc dword ptr [count_energy_display]
  movss xmm2,dword ptr [full_energy]
  movss [edx+000017E8],xmm2

skip_full_energy:
  cmp [fFullHealth],00000000
  je skip_full_health
  movss xmm2,dword ptr [full_energy]
  movss [edx+00001B4C],xmm2

skip_full_health:
  popfd
  movss xmm2,[edx+000017E8]
  jmp continue_energy_display

aob_energy_display: // "ZackZero.exe"+16AD1C:
I_energy_display:
  jmp code_energy_display
  nop
  nop
  nop
continue_energy_display:

registersymbol(pEnergy)
registersymbol(pEnergyBase)
registersymbol(fFullEnergy)
registersymbol(fFullHealth)
registersymbol(I_energy_display)

[DISABLE]
I_energy_display: // "ZackZero.exe"+16AD1C:
  db _aob_energy_display // movss xmm2,[edx+000017E8]

unregistersymbol(pEnergy)
unregistersymbol(pEnergyBase)
unregistersymbol(fFullEnergy)
unregistersymbol(fFullHealth)
unregistersymbol(I_energy_display)

dealloc(newmem)

