source = """
// Game Executable   : MTForce.exe
// Author            : ndck76
// Executable Version: 2021.3.5.60218
// Game Version      : v1.1
// Script Date       : 2024-08-14


[ENABLE]

aobscanregion(onpause,PlayerMovement:Update,PlayerMovement:Update+2000,0FB680xxxx000085xx0Fxxxxxxxxxx48xxxxxxxxxxxx48xxxx83xxxx66xxxx49BBxxxxxxxxxxxx000041xxxx85xx0Fxxxxxxxxxx) //PlayerMovement:Update+1cf
alloc(newmem,$1000,onpause)
alloc(data2,8)
alloc(onpausebkp,7)
registersymbol(data2)
registersymbol(onpause)
registersymbol(onpausebkp)
label(code)
label(return)

onpausebkp:
  readmem(onpause,7)

newmem:
  mov [data2],rax

code:
  readmem(onpause,7)
  jmp return

onpause:
  jmp newmem
  nop 2
return:

[DISABLE]

onpause:
  readmem(onpausebkp,7)

unregistersymbol(*)
dealloc(*)"""
