[[cheat]]
id = "x-selected-character-activate-before-selecting-a-character"
name = "[X] <== Selected Character (Activate before selecting a character)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : ck3
  Version: 1.6.0
  OS     : Linux
  Date   : 2022-06-06
  Author : fizzgig

  Credit goes to Nameless. Without him this wouldn't exist. Thank you! :)
  Join the Discord: http://discord.gg/ZSpzjSH

  This script gets the pointer for the selected character.
  Activate the script and after that select a character to
  populate all variables.

  To update for newer version go to memory viewer, dissect code,
  View->Referenced strings and search for "Open character %d".
  Jump to that location, scroll a little bit up and find something
  like mov edx,[rax+18]. You can set a breakpoint and select a
  character to validate that you are on the correct spot.
  Create an aobscan for that call and set pSelectedChar like in this
  script. Done! :)
}

[ENABLE]

aobscanmodule(SelectedChar,ck3.1,8B 50 18 48 8D 35 4F 01 E9 02) //16 08 86 02) // should be unique
alloc(newmem,$1000,SelectedChar)

label(code)
label(return)
label(pSelectedChar)

registersymbol(SelectedChar pSelectedChar)

newmem:
  mov [pSelectedChar],rax
code:
  mov edx,[rax+18]
  lea rsi,[ck3+417EB72]
  jmp return

pSelectedChar:
  dq 0

SelectedChar:
  jmp newmem
  nop 5
return:

[DISABLE]

SelectedChar:
  db 8B 50 18 48 8D 35 4F 01 E9 02 //16 08 86 02

unregistersymbol(SelectedChar pSelectedChar)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: ck3+191E352

ck3+191E330: 73 19                             - jae ck3+191E34B
ck3+191E332: 48 8B 40 20                       - mov rax,[rax+20]
ck3+191E336: 89 C9                             - mov ecx,ecx
ck3+191E338: 48 C1 E1 04                       - shl rcx,04
ck3+191E33C: 48 8B 44 08 08                    - mov rax,[rax+rcx+08]
ck3+191E341: 48 85 C0                          - test rax,rax
ck3+191E344: 74 05                             - je ck3+191E34B
ck3+191E346: 39 68 18                          - cmp [rax+18],ebp
ck3+191E349: 74 07                             - je ck3+191E352
ck3+191E34B: 48 8B 05 FE D5 53 04              - mov rax,[561DF8C5B950]
// ---------- INJECTING HERE ----------
ck3+191E352: 8B 50 18                          - mov edx,[rax+18]
// ---------- DONE INJECTING  ----------
ck3+191E355: 48 8D 35 16 08 86 02              - lea rsi,[ck3+417EB72]
ck3+191E35C: 48 8D 7C 24 08                    - lea rdi,[rsp+08]
ck3+191E361: 31 C0                             - xor eax,eax
ck3+191E363: E8 48 2E 61 02                    - call ck3+3F311B0
ck3+191E368: 41 89 AE D8 00 00 00              - mov [r14+000000D8],ebp
ck3+191E36F: 41 C7 86 F8 05 00 00 FF FF FF FF  - mov [r14+000005F8],FFFFFFFF
ck3+191E37A: 41 8B AE F4 06 00 00              - mov ebp,[r14+000006F4]
ck3+191E381: 85 ED                             - test ebp,ebp
ck3+191E383: 7E 2E                             - jle ck3+191E3B3
ck3+191E385: BB 10 00 00 00                    - mov ebx,00000010
}"""

