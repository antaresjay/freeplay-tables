[[cheat]]
id = "x-activate-achievements-with-mods-enable-in-main-menu"
name = "[X] <== Activate Achievements with Mods (Enable in Main Menu)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : ck3
  Version: 1.6.0
  OS     : Linux
  Date   : 2022-06-07
  Author : fizzgig

  Credit goes to Nameless. Without him this wouldn't exist. Thank you! :)
  Join the Discord: http://discord.gg/ZSpzjSH

  With this script you can activate achievements while using mods.

  To update the script you could use the info from Nameless' tutorial from
  Discord.
}

[ENABLE]

aobscanmodule(aob_set_ironman,ck3.1,40 88 B7 F2 00 00 00 C3 0F 1F) // should be unique
aobscanmodule(aob_checksum_a,ck3.1,80 B8 F1 00 00 00 00 74 36)
aobscanmodule(aob_checksum_b,ck3.1,8A 80 F1 00 00 00 88 44 24 0F 48 8D 74)
aobscanmodule(aob_checksum_c,ck3.1,80 BE F1 00 00 00 00 74 2E E8 06 EC 59) //80 BE F1 00 00 00 00 74 2E E8 96 83 46)
aobscanmodule(aob_checksum_d,ck3.1,80 B8 F1 00 00 00 00 0F 95 C3 EB 02 31)
alloc(achievements,$1000,aob_set_ironman)

label(set_ironman)
label(return_set_ironman)
label(set_checksum_a)
label(return_set_checksum_a)
label(set_checksum_b)
label(return_set_checksum_b)
label(set_checksum_c)
label(return_set_checksum_c)
label(set_checksum_d)
label(return_set_checksum_d)
label(pAchievementBase)

registersymbol(aob_set_ironman set_ironman pAchievementBase)
registersymbol(aob_checksum_a set_checksum_a)
registersymbol(aob_checksum_b set_checksum_b)
registersymbol(aob_checksum_c set_checksum_c)
registersymbol(aob_checksum_d set_checksum_d)

achievements:

set_ironman:
  mov [pAchievementBase],rdi
  mov byte ptr [rdi+F0],1
  mov byte ptr [rdi+F1],1
  mov byte ptr [rdi+F2],1
  mov byte ptr [rdi+F3],1
  //mov [rdi+000000F2],sil // original code
  jmp return_set_ironman

set_checksum_a:
  mov [pAchievementBase],rax
  mov byte ptr [rax+F0],1
  mov byte ptr [rax+F1],1
  mov byte ptr [rax+F2],1
  mov byte ptr [rax+F3],1
  cmp byte ptr [rax+000000F1],00 // original code
  jmp return_set_checksum_a

set_checksum_b:
  mov [pAchievementBase],rax
  mov byte ptr [rax+F0],1
  mov byte ptr [rax+F1],1
  mov byte ptr [rax+F2],1
  mov byte ptr [rax+F3],1
  mov al,[rax+000000F1] // original code
  jmp return_set_checksum_b

set_checksum_c:
  mov [pAchievementBase],rsi
  mov byte ptr [rsi+F0],1
  mov byte ptr [rsi+F1],1
  mov byte ptr [rsi+F2],1
  mov byte ptr [rsi+F3],1
  cmp byte ptr [rsi+000000F1],00 // original code
  jmp return_set_checksum_c

set_checksum_d:
  mov [pAchievementBase],rax
  mov byte ptr [rax+F0],1
  mov byte ptr [rax+F1],1
  mov byte ptr [rax+F2],1
  mov byte ptr [rax+F3],1
  cmp byte ptr [rax+000000F1],00 // original code
  jmp return_set_checksum_d

pAchievementBase:
  dq 0

aob_set_ironman:
  jmp set_ironman //achievements
  nop 2
return_set_ironman:

aob_checksum_a:
  jmp set_checksum_a
  nop 2
return_set_checksum_a:

aob_checksum_b:
  jmp set_checksum_b
  nop
return_set_checksum_b:

aob_checksum_c:
  jmp set_checksum_c
  nop 2
return_set_checksum_c:

aob_checksum_d:
  jmp set_checksum_d
  nop 2
return_set_checksum_d:

[DISABLE]

aob_set_ironman:
  db 40 88 B7 F2 00 00 00

aob_checksum_a:
  db 80 B8 F1 00 00 00 00

aob_checksum_b:
  db 8A 80 F1 00 00 00

aob_checksum_c:
  db 80 BE F1 00 00 00 00 74

aob_checksum_d:
  db 80 B8 F1 00 00 00 00 0F

unregistersymbol(aob_set_ironman set_ironman pAchievementBase)
unregistersymbol(aob_checksum_a set_checksum_a)
unregistersymbol(aob_checksum_b set_checksum_b)
unregistersymbol(aob_checksum_c set_checksum_c)
unregistersymbol(aob_checksum_d set_checksum_d)
dealloc(achievements)

{
// ORIGINAL CODE - INJECTION POINT: ck3+3302170

ck3+330213E: 48 8D 44 24 18                    - lea rax,[rsp+18]
ck3+3302143: 48 39 C7                          - cmp rdi,rax
ck3+3302146: 74 05                             - je ck3+330214D
