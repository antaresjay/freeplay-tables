[[cheat]]
id = "x-selected-city-editor-open-change-city-window-to-populate"
name = "[X] <== Selected City Editor (Open/Change City Window to Populate)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

define(selected_City,TenCrowns.GameCore.City:hasCompletedBuild) // should be unique
alloc(newmem,$200)
alloc(select_City,8)
alloc(select_City_Base,8)
define(getcity,TenCrowns.GameCore.Game:getCities) // should be unique
alloc(newmem2,$1000)
alloc(city_base_other,8)

label(code)
label(return)
label(readselected_City)
registersymbol(readselected_City)
registersymbol(select_City)
registersymbol(select_City_Base)

label(return2)
label(LoopStart_City)
label(readgetcity)
label(city_two_lab)
label(Matched_City)
label(Exit_city)
label(Exit_city_two)
registersymbol(city_base_other)
registersymbol(readgetcity)

newmem:
  mov rax,[rcx+10]                 //City mpCurrentData
  test rax,rax
  jz code
  mov [select_City_Base],rcx
  mov rax,[rcx+10]                 //City mpCurrentData
  test rax,rax
  jz code
  mov [select_City],rax
code:
  readmem(selected_City,8)
  jmp return

readselected_City:
  readmem(selected_City,8)

newmem2:
  test rcx,rcx
  jz Exit_city_two
  mov rax,[rcx+18]                   //test if checkUpdateLastData exists
  test rax,rax
  jz Exit_city_two

city_two_lab:
  push rax
  push rbx
  push rcx
  push rdx
  push rsi
  push rdi
  push r8
  mov rax,[rcx+18]                     //test checkUpdateLastData exists
  test rax,rax
  jz Exit_city
  mov rax,[rcx+88]                    //mdCities
  test rax,rax
  jz Exit_city
  mov rax,[rax+18]                   //values
  test rax,rax
  jz Exit_city
  mov esi,dword ptr[rax+18]         // list Size  [mdCities,values]
  test esi,esi
  jz Exit_city
  mov rax,[rax+10]                  //items
  test rax,rax
  jz Exit_city
  mov rdi,rax                       //items - City List

  mov r8,select_City_Base           //Selected City from other script
  mov r8,[r8]
  test r8,r8
  jz Exit_city
  mov eax,dword ptr[r8+30]          // **City ID of Selected City - miID to compare for**

  xor rcx,rcx                       // Use this for an index count

  mov rbx,rdi                      // City list  (items)    [mdCities,values,items]
  add rbx,20                      // jump to list item[0]

LoopStart_City:
  cmp ecx,esi                      //compare list size to index (How many loops)
  jg Exit_city                        // to avoid crashing

  mov rdx,[rbx+rcx*8]
  cmp eax,dword ptr[rdx+30]         // same Selected City ID (miID) as in list?
  je short Matched_City             // if yes jump out of loop and save the pointer

  inc rcx                         // increase counter
  jmp LoopStart_City              // check again until found

Matched_City:
  mov [city_base_other],rdx         // save pointer

Exit_city:
  pop r8
  pop rdi
  pop rsi
  pop rdx
  pop rcx
  pop rbx
  pop rax
  readmem(getcity,8)
  jmp return2

Exit_city_two:
  readmem(getcity,8)
  jmp return2

readgetcity:
  readmem(getcity,8)

selected_City:
  jmp!near newmem; 00 00* 55
  nop 3
return:
registersymbol(selected_City)

getcity:
  jmp!near newmem2; 00 00* 55
  nop 3
return2:
registersymbol(getcity)

[DISABLE]
selected_City:
  readmem(readselected_City,8)
getcity:
  readmem(readgetcity,8)

unregistersymbol(*)
dealloc(*)

{
