//Send@ModEngine
[ENABLE]

aobscanregion(itemdecrease,almost.InventoryItem:set_Quantity+c3,almost.InventoryItem:set_Quantity+d7,89 77 30 48 8B 75 F0)
alloc(newmem,$1000,itemdecrease)

