[[cheat]]
id = "unlimited-perk-points"
name = "Unlimited Perk Points"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(perkpoints_aob,GameAssembly.dll,8B 41 30 2B 41 2C)
alloc(newmem,$1000,perkpoints_aob)

label(code)
label(return)

newmem:

mov [rcx+30],3e8
code:
mov eax,[rcx+30]
sub eax,[rcx+2C]
jmp return

perkpoints_aob:
jmp newmem
nop
return:
registersymbol(perkpoints_aob)

[DISABLE]

perkpoints_aob:
db 8B 41 30 2B 41 2C

unregistersymbol(perkpoints_aob)
dealloc(newmem)"""

