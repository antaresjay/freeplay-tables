[[cheat]]
id = "stats"
name = "Stats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : ReLegend.exe
  Version:
  Date   : 2019-09-02
  Author : Anjinggila

  This script does blah blah blah
}

[ENABLE]

aobscan(RL_Base,f3 0f 11 a8 ? ? ? ? 48 b8 ? ? ? ? ? ? ? ? 48 8b 00 48 8b 40 ? 48 8b c8 83 38 ? 48 8d 64 24 ? 49 bb ? ? ? ? ? ? ? ? 41 ff d3 48 8d 65 ? 5d c3 00 00 00 00 00 00 00 01 04 ? 05 ? ? ? ? 00 e8) // should be unique
alloc(newmem,$1000,RL_Base)
alloc(my_stat,8)
registersymbol(my_stat)

label(code)
label(return)

newmem:
  mov [my_stat],rax

code:
  movss [rax+0000009C],xmm5
  jmp return

RL_Base:
  jmp newmem
  nop 3
return:
registersymbol(RL_Base)

[DISABLE]

RL_Base:
  db F3 0F 11 A8 9C 00 00 00

unregistersymbol(RL_Base)
unregistersymbol(my_stat)
dealloc(my_stat)
dealloc(newmem)"""

