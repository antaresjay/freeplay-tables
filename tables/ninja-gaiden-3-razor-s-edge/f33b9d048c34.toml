type = "script"
source = """
[ENABLE]

aobscanmodule(karmaAOB,NINJA GAIDEN 3 Razor's Edge.exe,8B 9C 83 D8 00 00 00) // should be unique
alloc(newmem,$1000,karmaAOB)

label(code)
label(return)
label(karma)
label(karmaflag)
registersymbol(karmaflag)
registersymbol(karma)

newmem:
  mov [karma],rbx

@@:
  cmp [karmaflag],1
  jne @f
  cmp [rbx+D8],#99999999
  jge code
  mov [rbx+D8],#99999999

code:
  mov ebx,[rbx+rax*4+000000D8]
  jmp return

karma:
  dq 0

karmaflag:
  dd 0

karmaAOB:
  jmp newmem
  nop
  nop
return:
registersymbol(karmaAOB)

[DISABLE]

karmaAOB:
  db 8B 9C 83 D8 00 00 00

unregistersymbol(karmaAOB)
unregistersymbol(karma)
unregistersymbol(karmaflag)
dealloc(newmem)"""

