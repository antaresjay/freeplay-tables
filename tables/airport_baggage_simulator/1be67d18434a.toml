[[cheat]]
id = "enable-movement-speed-multiplier"
name = "Enable Movement Speed Multiplier"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(Movement,ECM.Controllers.BaseFirstPersonController:CalcDesiredVelocity+64,ECM.Controllers.BaseFirstPersonController:CalcDesiredVelocity+fe,F3 41 0F 11 6F 38 48 8B)
alloc(newmem,$1000,Movement)
label(code return)
registersymbol(SpeedMult)

newmem:

code:
  mulss xmm5,[SpeedMult]
  movss [r15+38],xmm5
  jmp return

SpeedMult:
dd (float)20

Movement:
  jmp newmem
  nop
return:
registersymbol(Movement)

[DISABLE]

Movement:
  db F3 41 0F 11 6F 38

unregistersymbol(*)
dealloc(*)"""

