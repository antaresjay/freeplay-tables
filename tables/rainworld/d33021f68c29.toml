[[cheat]]
id = "infinite-jumps"
name = "Infinite Jumps"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
define(address,Player:MovementUpdate)
define(bytes,55 48 8B EC B8 * * 00 00)

[ENABLE]
//Send@FearlessRevolution|Sintrix

assert(address,bytes)
alloc(newmem,$1000,Player:MovementUpdate)

label(code)
label(return)

newmem:
mov [rcx+55C],#5
code:
  push rbp
  mov rbp,rsp
  mov eax,00002030
  jmp return

address:
  jmp newmem
  nop 4
return:

[DISABLE]

address:
  db bytes


dealloc(*)"""

