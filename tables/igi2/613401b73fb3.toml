[[cheat]]
id = "invincible"
name = "Invincible"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
  Game   : Project I.G.I 2 - Covert Strike
  Target : igi2.exe
  Version: 1.3.0.0

  Date   : 2021-07-10
  Author : Nio.b

  This script
  changes (Falling damage,Bullet damage,Explosion damage) value to 0.0
  so... johns will be invulnerable to these damages :)
}

[ENABLE]
aobscanmodule(fallprotection,igi2.exe,D9 9E 04 04 00 00 D9)    // These should be unique
aobscanmodule(Explprotection,igi2.exe,D9 9F 04 04 00 00 8B 8F)
aobscanmodule(Bullprotection,igi2.exe,D9 9E 04 04 00 00 8B 8E)
alloc(fallp_mem,$1000)
alloc(Expl_mem,$1000)
alloc(bull_mem,$1000)
label(fallp_return)
label(Expl_return)
label(bull_return)

//----------------------------------------For falling damage protection
fallp_mem:
  mov [esi+00000404],0 //Original: fstp dword ptr [esi+00000404]
  jmp fallp_return

fallprotection:
  jmp fallp_mem
  nop

fallp_return:
registersymbol(fallprotection)
//----------------------------------------For explosives damage protection
Expl_mem:
  mov [edi+00000404],(float)0 //Original: fstp dword ptr [edi+00000404]
  jmp Expl_return

Explprotection:
  jmp Expl_mem
  nop

Expl_return:
registersymbol(Explprotection)
//----------------------------------------For bullet damage protection
bull_mem:
  mov [edi+00000404],(float)0  //Original: fstp dword ptr [esi+00000404]
  jmp bull_return

Bullprotection:
  jmp bull_mem
  nop

bull_return:
registersymbol(Bullprotection)
//------------------------------------------------------------------------------

[DISABLE]

fallprotection:
db D9 9E 04 04 00 00
explprotection:
db D9 9F 04 04 00 00
Bullprotection:
db D9 9E 04 04 00 00

unregistersymbol(fallprotection)
dealloc(fall_mem)
unregistersymbol(explprotection)
dealloc(expl_mem)
unregistersymbol(Bullprotection)
dealloc(bull_mem)
{
//-------------------------------------------------
// ORIGINAL CODE - INJECTION POINT: "igi2.exe"+AB651    Falling    damage
// ORIGINAL CODE - INJECTION POINT: "igi2.exe"+C68B3    Explosives damage
// ORIGINAL CODE - INJECTION POINT: "igi2.exe"+C5E76    Bullets    damage
}"""

