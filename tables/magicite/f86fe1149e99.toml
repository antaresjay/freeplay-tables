id = "activate"
name = "Activate"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(PLAYERADDRESS,8B 05 ?? ?? ?? ?? 85 C0 7E 0B)
globalalloc(pAddress,4)

pAddress:
  readmem(PLAYERADDRESS+2,4)

aobscan(STAMINAINJECT,D9 80 C8 02 00 00 8B) // should be unique
alloc(newmem,$1000)
alloc(pStaminaBase,16)
label(code)
label(return)

newmem:

code:
  mov [pStaminaBase],eax
  fld dword ptr [eax+000002C8]
  jmp return

STAMINAINJECT:
  jmp newmem
  nop
return:
registersymbol(STAMINAINJECT)
registersymbol(pStaminaBase)

[DISABLE]

STAMINAINJECT:
  db D9 80 C8 02 00 00

unregistersymbol(STAMINAINJECT)
dealloc(newmem)
dealloc(pStaminaBase)"""

