aobscanmodule(ohk,GameAssembly.dll,8Bxxxx2Bxx89xxxx85xx7Fxx33xx488BxxE8xxxxxxxx4489xxxx488Bxxxx4885xx74xx4Cxxxxxx4Cxxxx488Bxxxx488BxxFFxxxx488Bxxxxxxxxxx488Bxxxx4439xxxxxxxxxx75xxE8xxxxxxxx33xx488BxxE8xxxxxxxx84xx74xx488Bxxxx4885xx0F84) //Bullet.OnTriggerEnter
