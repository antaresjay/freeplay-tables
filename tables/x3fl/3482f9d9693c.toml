type = "script"
source = """
[ENABLE]

aobscanmodule(EngSpdflx3,X3FL.exe,8B 80 70 02 00 00 85 C0 74 29 0F BF 49 4A 05 00 00 01 00 69 D1 B8 0D 00 00 8B 0D ? ? ? ?  F7 6C 0A 08 05 00 80 00 00) // should be unique

registersymbol(EngSpdflx3)
alloc(newmem,$1000)

registersymbol(rlspdx3fl)
label(rlspdx3fl)
label(return)

