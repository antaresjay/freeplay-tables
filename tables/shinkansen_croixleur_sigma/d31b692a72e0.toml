je playerstats_bomb_coinset_exit
mov [eax+89c], #250
playerstats_bomb_coinset_exit:


playerstats_bomb_originalcode:
db 3B 98 0C 03 00 00
//cmp ebx,[eax+0000030C]


playerstats_bomb_exit:
jmp playerstats_bomb_returnhere


playerstats_bomb_searchedAOB + 4:
playerstats_bomb_savedAOB:
