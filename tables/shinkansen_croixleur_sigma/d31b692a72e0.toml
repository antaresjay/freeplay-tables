[[cheat]]
id = "player-bomb-stats-base-address-scan-to-update-battle"
name = "Player Bomb Stats Base Address Scan (To Update: Battle)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerstats_bomb_savedAOB)
