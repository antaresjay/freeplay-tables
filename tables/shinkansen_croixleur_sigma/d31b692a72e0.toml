cmp dword ptr [gamestats_scoreset_enable], #0
je gamestats_scoreset_exit
cmp [esi+87838], #1999999999
jg gamestats_scoreset_exit
mov [esi+87978], #2000000000
gamestats_scoreset_exit:

cmp dword ptr [gamestats_timeset_enable], #0
je gamestats_timeset_exit
mov [esi+8783c], #36000
mov [esi+87840], #36000
mov [esi+87844], #36000
gamestats_timeset_exit:

cmp dword ptr [gamestats_coinset_enable], #0
je gamestats_coinset_exit
mov [esi+87be4], #99999999
mov [esi+87be8], #99999999
gamestats_coinset_exit:

mov ebx, [gamestats_temp1]


gamestats_originalcode:
db 8B 86 68 79 08 00
//mov eax,[esi+00087968]


gamestats_exit:
jmp gamestats_returnhere


gamestats_searchedAOB:
gamestats_savedAOB:
jmp gamestats_newmem
nop
gamestats_returnhere:


[DISABLE]
gamestats_savedAOB:
db 8B 86 68 79 08 00
//mov eax,[esi+00087968]

unregistersymbol(gamestats_savedAOB)

dealloc(gamestats_newmem)
dealloc(gamestats_temp1)"""

