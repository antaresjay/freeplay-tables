[[cheat]]
id = "game-stats-base-address-scan-to-update-battle"
name = "Game Stats Base Address Scan (To Update: Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(gamestats_savedAOB)
label(gamestats_returnhere)
label(gamestats_originalcode)
label(gamestats_exit)

label(gamestats_update_exit)
label(gamestats_set_exit)
label(gamestats_chainset_exit)
label(gamestats_scoreset_exit)
label(gamestats_timeset_exit)
label(gamestats_coinset_exit)

registersymbol(gamestats_savedAOB)

aobscan(gamestats_searchedAOB,8B 86 68 79 08 00 3B C1)

alloc(gamestats_newmem,2048)
alloc(gamestats_temp1,4)


gamestats_newmem:
mov [gamestats_temp1], ebx

cmp dword ptr [gamestats_update_enable], #0
je gamestats_update_exit
mov [gamestats_basepointer], esi
gamestats_update_exit:

cmp dword ptr [gamestats_set_enable], #0
je gamestats_set_exit
gamestats_set_exit:

cmp dword ptr [gamestats_chainset_enable], #0
je gamestats_chainset_exit
cmp [esi+8796c], #99999999
jg gamestats_chainset_exit
mov [esi+8796c], #100000000
