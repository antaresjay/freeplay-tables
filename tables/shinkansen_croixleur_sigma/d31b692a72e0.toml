aobscan(playerstats_bomb_searchedAOB,89 5C 24 0C 3B 98 0C 03 00 00)

alloc(playerstats_bomb_newmem,2048)


playerstats_bomb_newmem:
cmp dword ptr [playerstats_update_enable], #0
je playerstats_bomb_update_exit
