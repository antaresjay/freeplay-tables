id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
//Send@Sinttrix|FearlessRevolution
define(address,"GameAssembly.dll"+50EE50)
define(bytes,89 59 1C 80 3D 96 52 D1 02 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,"GameAssembly.dll"+50EE50)

label(code)
label(return)

newmem:

