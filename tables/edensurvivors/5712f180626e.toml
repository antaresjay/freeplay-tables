hint = ""
type = "script"
source = """
define(address,Hero.OldFixedUpdate)
define(bytes,48 8B C4 55 53)
//Send@FearlessRevolution|Sintrix
[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Hero.OldFixedUpdate)
