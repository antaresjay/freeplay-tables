[[cheat]]
id = "invinicble"
name = "Invinicble"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(heroInvincible_flag,GameAssembly.dll,48 8B 4B 30 48 85 C9 0F 84 C4)
alloc(newmem,$1000,heroInvincible_flag)
label(code return)

newmem:
push rbx
mov rbx,[rbx+30]
mov [rbx+1E2],1
pop rbx

code:
  mov rcx,[rbx+30]
  test rcx,rcx
  jmp return

heroInvincible_flag:
  jmp newmem
  nop 2
return:
registersymbol(heroInvincible_flag)

[DISABLE]

heroInvincible_flag:
  db 48 8B 4B 30 48 85 C9
//HeroTurret.FixedUpdate
unregistersymbol(*)
dealloc(*)"""

