[[cheat]]
id = "building-drop-spawners-constantly-spawn-water-oil-panties-takes-a-while-to-kick-in-after-activating-building-must-drop-once-on-it-s-own"
name = """Building "Drop" Spawners Constantly Spawn (Water, Oil, Panties) (Takes a while to kick in after activating, building must drop once on it's own)"""
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(DropSpawner,GameAssembly.dll,6A 00 FF 76 1C FF 76 18 E8) // should be unique
alloc(DropSpawner_Mem,$1000)
label(code)
label(return)
DropSpawner_Mem:
  push 00
  push [esi+0C]
  call MapObject.get_IsFlying
  add esp,08
  test al,al
  jne code
  push 00
  push 01
  push 01
  jmp return
code:
  push 00
  push [esi+1C]
  push [esi+18]
  jmp return
DropSpawner:
  jmp DropSpawner_Mem
  db 90 90 90
return:
registersymbol(DropSpawner)
[DISABLE]
DropSpawner:
  db 6A 00 FF 76 1C FF 76 18
unregistersymbol(DropSpawner)
dealloc(DropSpawner_Mem)"""

