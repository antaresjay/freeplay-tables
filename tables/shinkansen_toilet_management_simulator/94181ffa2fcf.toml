[[cheat]]
id = "gamecontroller-base-address-scan-initialization-activate-this-first-to-activate-play-level"
name = "GameController Base Address Scan Initialization (Activate This First, To Activate: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameController_basepointer)
registersymbol(GameController_update_enable)
registersymbol(GameController_moneyset_enable)
registersymbol(GameController_relationshipsset_enable)
registersymbol(GameController_timeset_enable)

//053DC995 - 48 83 EC 18           - sub rsp,18
//053DC999 - 48 8B F1              - mov rsi,rcx
// GameController:FixedUpdate+c
//053DC99C - F3 0F10 86 EC010000   - movss xmm0,[rsi+000001EC]
//053DC9A4 - F3 0F5A C0            - cvtss2sd xmm0,xmm0
//053DC9A8 - F2 0F11 45 F0         - movsd [rbp-10],xmm0
//053DC9AD - 48 83 EC 20           - sub rsp,20
//053DC9B1 - 49 BB 80CD3D0500000000 - mov r11,00000000053DCD80 : [EC8B4855]
aobscan(GameController_initialization_searchedAOB, F3 0F 10 86 EC 01 00 00 F3 0F 5A C0 F2 0F 11 45 F0)

alloc(GameController_basepointer, 8, GameController_initialization_searchedAOB)
alloc(GameController_update_enable, 4, GameController_initialization_searchedAOB)
alloc(GameController_moneyset_enable, 4, GameController_initialization_searchedAOB)
alloc(GameController_relationshipsset_enable, 4, GameController_initialization_searchedAOB)
alloc(GameController_timeset_enable, 4, GameController_initialization_searchedAOB)


[DISABLE]
unregistersymbol(GameController_basepointer)
unregistersymbol(GameController_update_enable)
unregistersymbol(GameController_moneyset_enable)
unregistersymbol(GameController_relationshipsset_enable)
unregistersymbol(GameController_timeset_enable)

dealloc(GameController_basepointer)
dealloc(GameController_update_enable)
dealloc(GameController_moneyset_enable)
dealloc(GameController_relationshipsset_enable)
dealloc(GameController_timeset_enable)"""

[[cheat]]
id = "gamecontroller-base-address-scan-to-activate-play-level-to-update-play-level"
name = "GameController Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameController_savedAOB)
label(GameController_returnhere)
label(GameController_originalcode)
label(GameController_exit)

label(GameController_update_exit)
label(GameController_moneyset_exit)
label(GameController_relationshipsset_exit)
label(GameController_timeset_exit)

registersymbol(GameController_originalcode)
registersymbol(GameController_savedAOB)

//053DC995 - 48 83 EC 18           - sub rsp,18
//053DC999 - 48 8B F1              - mov rsi,rcx
// GameController:FixedUpdate+c
//053DC99C - F3 0F10 86 EC010000   - movss xmm0,[rsi+000001EC]
//053DC9A4 - F3 0F5A C0            - cvtss2sd xmm0,xmm0
//053DC9A8 - F2 0F11 45 F0         - movsd [rbp-10],xmm0
//053DC9AD - 48 83 EC 20           - sub rsp,20
//053DC9B1 - 49 BB 80CD3D0500000000 - mov r11,00000000053DCD80 : [EC8B4855]
aobscan(GameController_searchedAOB, F3 0F 10 86 EC 01 00 00 F3 0F 5A C0 F2 0F 11 45 F0)

alloc(GameController_newmem, 2048, GameController_searchedAOB)
alloc(GameController_temp1, 8, GameController_searchedAOB)
alloc(GameController_temp2, 8, GameController_searchedAOB)
alloc(GameController_temp3, 8, GameController_searchedAOB)
alloc(GameController_temp4, 8, GameController_searchedAOB)
alloc(GameController_temp5, 8, GameController_searchedAOB)


GameController_newmem:
mov [GameController_temp1], rax
mov [GameController_temp2], rbx
mov [GameController_temp3], rcx
mov [GameController_temp4], rdx

cmp dword ptr [GameController_update_enable], #0
je GameController_update_exit
mov [GameController_basepointer], rsi
GameController_update_exit:

cmp dword ptr [GameController_moneyset_enable], #0
je GameController_moneyset_exit
mov rbx, [rsi+d0]
test rbx, rbx
je GameController_moneyset_exit
mov rbx, [rbx+18]
test rbx, rbx
je GameController_moneyset_exit
mov rbx, [rbx+30]
test rbx, rbx
je GameController_moneyset_exit
mov [rbx+20], #99999
mov [rbx+24], #99999
GameController_moneyset_exit:

cmp dword ptr [GameController_relationshipsset_enable], #0
je GameController_relationshipsset_exit
mov rbx, [rsi+d0]
test rbx, rbx
je GameController_relationshipsset_exit
mov rbx, [rbx+18]
test rbx, rbx
je GameController_relationshipsset_exit
mov rcx, [rbx+50]
test rcx, rcx
je GameController_relationshipsset_exit
mov [rcx+20], #3
mov [rcx+24], #3
mov rcx, [rbx+58]
test rcx, rcx
je GameController_relationshipsset_exit
mov [rcx+20], #3
mov [rcx+24], #3
mov rcx, [rbx+60]
test rcx, rcx
je GameController_relationshipsset_exit
mov [rcx+20], #3
mov [rcx+24], #3
mov rcx, [rbx+68]
test rcx, rcx
je GameController_relationshipsset_exit
mov [rcx+20], #3
mov [rcx+24], #3
mov rcx, [rbx+138]
test rcx, rcx
je GameController_relationshipsset_exit
mov [rcx+20], #3
mov [rcx+24], #3
GameController_relationshipsset_exit:

cmp dword ptr [GameController_timeset_enable], #0
je GameController_timeset_exit
mov [rsi+1ec], (float)0.1
GameController_timeset_exit:

mov rax, [GameController_temp1]
mov rbx, [GameController_temp2]
mov rcx, [GameController_temp3]
mov rdx, [GameController_temp4]


GameController_originalcode:
readmem(GameController_searchedAOB, 8)


GameController_exit:
jmp GameController_returnhere


GameController_searchedAOB:
GameController_savedAOB:
jmp GameController_newmem
nop
nop
nop
GameController_returnhere:


[DISABLE]
GameController_savedAOB:
readmem(GameController_originalcode, 8)

unregistersymbol(GameController_originalcode)
unregistersymbol(GameController_savedAOB)

dealloc(GameController_newmem)
dealloc(GameController_temp1)
dealloc(GameController_temp2)
dealloc(GameController_temp3)
dealloc(GameController_temp4)
dealloc(GameController_temp5)"""

