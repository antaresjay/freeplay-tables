alloc(SliderGame_temp1, 8, SliderGame_searchedAOB)
alloc(SliderGame_temp2, 8, SliderGame_searchedAOB)
alloc(SliderGame_temp3, 8, SliderGame_searchedAOB)
alloc(SliderGame_temp4, 8, SliderGame_searchedAOB)
alloc(SliderGame_temp5, 8, SliderGame_searchedAOB)


