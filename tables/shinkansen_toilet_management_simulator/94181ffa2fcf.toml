// SliderGame:FixedUpdate+c
//0C8F2FBC - 0FB6 86 88000000      - movzx eax,byte ptr [rsi+00000088]
//0C8F2FC3 - 85 C0                 - test eax,eax
//0C8F2FC5 - 0F84 0A010000         - je 0C8F30D5
