cmp dword ptr [SliderGame_timeset_enable], #0
je SliderGame_timeset_exit
mov ebx, [rsi+8c]
mov [rsi+94], ebx
mov [rsi+98], #0
SliderGame_timeset_exit:

cmp dword ptr [SliderGame_finalset_enable], #0
je SliderGame_finalset_exit
cmp dword ptr [rsi+a8], #99
jge SliderGame_finalset_exit
mov [rsi+a8], #99
