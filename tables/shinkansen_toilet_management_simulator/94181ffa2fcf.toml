//0C8F2FD3 - F3 0F5A C0            - cvtss2sd xmm0,xmm0
//0C8F2FD7 - F2 0F11 45 F0         - movsd [rbp-10],xmm0
aobscan(SliderGame_searchedAOB, 0F B6 86 88 00 00 00 85 C0 * * * * * * F3 0F 10 86 90 00 00 00)

