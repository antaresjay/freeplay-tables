  // RAX is our base address for the ammo's class structure.
  // Do not use ADD as it sets the carry flag
  // which is sometimes used by TLD functions
  // and crash the game if we do not restore it.
  // Enable INC if gun ammo is not full.
  //inc [rax+2C]

code:
  // do not DECrease our ammo quantity
  //dec [rax+2C]
  mov rcx,[GameAssembly.dll+3A19EC0]
  jmp return

INJECT:
  jmp newmem
  nop
  nop
  nop
  nop
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db FF 48 2C 48 8B 0D A5 70 C2 02

