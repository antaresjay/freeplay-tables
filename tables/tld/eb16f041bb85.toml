[[cheat]]
id = "guns-inf-loaded-ammo"
name = "[Guns] INF Loaded Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{
  Game   : The Long Dark (tld.exe)
  Version: v1.62 (Steam Build 55870)
  Date   : 2019-11-04
  Author : JLee

  * Guns will not consume loaded ammo.
  * Works with Rifle and Revolver.
  * At least 1 ammo is still needed in the gun.
}

[ENABLE]

aobscanmodule(INJECT,GameAssembly.dll,FF 48 2C 48 8B 0D A5 70 C2 02) // should be unique
alloc(newmem,$1000,"GameAssembly.dll"+DF2E11)

label(code)
label(return)

