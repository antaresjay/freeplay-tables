[[cheat]]
id = "damage-modifier-script-god-mode-one-hit-kill-etc"
name = "Damage Modifier Script (God Mode, One Hit Kill, etc)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DamageModAOB,$process,4C 8B 41 08 48 8B D9 33 C9 4C 03 C2)
registersymbol(DamageModAOB)
alloc(newmem,2048,DamageModAOB)

label(originalcode)
label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)
\t\t  
newmem:
originalcode:
  mov r8,[rcx+08]
  mov rbx,rcx
  push r8
  push rbx
  mov r8,[rcx-10260]
  mov rbx,CCharFuncAOB
  cmp [r8],rbx
  pop rbx
  pop r8
  jne EnemyHit
  jmp HeroHit
EnemyHit:
  cmp rdx,0
  jl EnemyDamageHit
  jmp CleanUp
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckOneHitKill
  neg rdx
  push rdx
  fild dword ptr [rsp]
  fmul dword ptr [fEnemyDamageMult]
  fistp dword ptr [rsp]
  pop rdx
  neg rdx
CheckOneHitKill:
  cmp [OneHitKill],1
  jne CleanUp
  mov rdx,#9999999
  neg rdx
  jmp CleanUp
HeroHit:
  cmp rdx,0
  jl HeroDamageHit
  jmp CleanUp
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  neg rdx
  push rdx
  fild dword ptr [rsp]
  fmul dword ptr [fHeroDamageMult]
  fistp dword ptr [rsp]
  pop rdx
  neg rdx
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor rdx,rdx
  jmp CleanUp
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne CleanUp
  cmp r8,rdx
  jl @F
  xor rdx,rdx
@@:
  jmp CleanUp  
CleanUp:
  jmp return

GodMode:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)5.0
fHeroDamageMult:
dq (float)0.25
HeroCannotDie:
dq 1

DamageModAOB:
  jmp newmem
  nop
  nop
return:

[DISABLE]

DamageModAOB:
  db 4C 8B 41 08 48 8B D9

unregistersymbol(DamageModAOB)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fHeroDamageMult)
unregistersymbol(HeroCannotDie)

dealloc(newmem)"""

