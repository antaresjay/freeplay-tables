aobscan(CharInject,4C 8B F9 48 8B FA 49 8B F0 85 F6 0F 84) // should be unique
alloc(newmem,$1000,CharInject)

label(code)
label(return)
registersymbol(CBase)
alloc(CBase,4)


newmem:

code:
  mov [CBase],rcx
  mov r15,rcx
  mov rdi,rdx
  jmp return

CharInject:
  jmp newmem
  nop
return:
registersymbol(CharInject)

[DISABLE]

CharInject:
  db 4C 8B F9 48 8B FA

unregistersymbol(CharInject)
dealloc(newmem)
dealloc(CBase)
