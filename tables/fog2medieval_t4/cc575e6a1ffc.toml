[[cheat]]
id = "selected-unit-script"
name = "Selected Unit (Script)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : FOG2Medieval.EXE
  Version: v1.0.1 (build 10009)
  Date   : 2021-09-30
  Author : Matt (ProphetofDinkan)

  This script copies the unit's structure address
  when a unit is selected.

  Unit record size is BA4 bytes
}

[ENABLE]

aobscanmodule(INJECTSELUNIT,FOG2Medieval.EXE,69 D2 A4 0B 00 00 03 CA E8 61) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(mattSelUnit)
registerSymbol(mattSelUnit)

newmem:

code:
  imul edx,edx,00000BA4
  push ecx
  add ecx, edx
  mov [mattSelUnit], ecx
  pop ecx
  jmp return

  align 10
mattSelUnit:
  dd 0

INJECTSELUNIT:
  jmp newmem
  nop
return:
registersymbol(INJECTSELUNIT)

[DISABLE]

INJECTSELUNIT:
  db 69 D2 A4 0B 00 00

unregistersymbol(INJECTSELUNIT)
dealloc(newmem)

