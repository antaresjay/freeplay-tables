[[cheat]]
id = "scenario-start-points-script"
name = "Scenario Start Points (Script) "
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : FOG2Medieval.EXE
  Version:
  Date   : 2021-10-01
  Author : Matt (ProphetofDinkan)

  This script saves the address of scenario starting points.
}

[ENABLE]

aobscanmodule(INJECTStartPoints,FOG2Medieval.EXE,8B 02 89 45 FC E9) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(recruitPointsAddress)
registerSymbol(recruitPointsAddress)
label(skipmycode)

newmem:

code:
  push eax
  mov eax,[ebp+08]
  mov eax, [eax]
  cmp eax, 24
  jne skipmycode
  mov [recruitPointsAddress], edx
  mov eax, [ebp-54]
  mov [recruitPointsAddress+4], eax
skipmycode:
  pop eax
//required stuff next
  mov eax,[edx]
  mov [ebp-04],eax
  jmp return

  align 10
recruitPointsAddress:
  dd ff ff

INJECTStartPoints:
  jmp newmem
return:
registersymbol(INJECTStartPoints)

[DISABLE]

INJECTStartPoints:
  db 8B 02 89 45 FC

unregistersymbol(INJECTStartPoints)
dealloc(newmem)

