[[cheat]]
id = "infinite-ammo-and-no-reload"
name = "Infinite Ammo and No Reload"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(LecMunPis,GameAssembly.dll,8B 7B 48 8B 73 44)
alloc(newmem,$100,LecMunPis)

label(code)
label(return)

newmem:
  test rbx,rbx
  je code
  mov edi,[rbx+44]
  mov [rbx+48],edi

code:
  mov edi,[rbx+48]
  mov esi,[rbx+44]
  jmp return

LecMunPis:
  jmp newmem
  nop
return:
registersymbol(LecMunPis)

[DISABLE]

LecMunPis:
  db 8B 7B 48 8B 73 44

unregistersymbol(*)
dealloc(*)"""

