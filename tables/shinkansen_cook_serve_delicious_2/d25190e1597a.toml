[[cheat]]
id = "data-base-address-scan-to-update-view-money"
name = "Data Base Address Scan (To Update: View Money)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Data_savedAOB)
label(Data_returnhere)
label(Data_originalcode)
label(Data_exit)

label(Data_update_exit)
label(Data_set_exit)

label(Data_Slot1_update_exit)
label(Data_Slot1_set_exit)

label(Data_Slot2_update_exit)
label(Data_Slot2_set_exit)

label(Data_Slot3_update_exit)
label(Data_Slot3_set_exit)

label(Data_Slot4_update_exit)
label(Data_Slot4_set_exit)

label(Data_Slot5_update_exit)
label(Data_Slot5_set_exit)


registersymbol(Data_savedAOB)

//00555A9D - 89 78 08              - mov [eax+08],edi
//00555AA0 - EB 25                 - jmp 00555AC7
// Accesses Value
//00555AA2 - F2 0F10 01            - movsd xmm0,[ecx]
//00555AA6 - F2 0F11 07            - movsd [edi],xmm0
//00555AAA - EB 1B                 - jmp 00555AC7
//00555AAC - 8B 01                 - mov eax,[ecx]
//00555AAE - 89 07                 - mov [edi],eax
//00555AB0 - 8B 41 04              - mov eax,[ecx+04]
//00555AB3 - 89 47 04              - mov [edi+04],eax
//00555AB6 - EB 0F                 - jmp 00555AC7
//00555AB8 - 8B 01                 - mov eax,[ecx]
//00555ABA - 85 C0                 - test eax,eax
//00555ABC - 74 07                 - je 00555AC5
//00555ABE - FF 40 04              - inc [eax+04]
//00555AC1 - EB 02                 - jmp 00555AC5
//00555AC3 - 8B 01                 - mov eax,[ecx]
//00555AC5 - 89 07                 - mov [edi],eax
//00555AC7 - 81 7F 0C FFFFFF00     - cmp [edi+0C],00FFFFFF : [02B40757]
//00555ACE - 75 21                 - jne 00555AF1
//00555AD0 - 56                    - push esi
aobscan(Data_searchedAOB, F2 0F 10 01 F2 0F 11 07 EB 1B 8B 01 89 07 8B 41 04 89 47 04 EB 0F 8B 01 85 C0 74 07 FF 40 04 EB 02 8B 01 89 07 81 7F 0C FF FF FF)

alloc(Data_newmem, 2048, Data_searchedAOB)
alloc(Data_temp1, 4, Data_searchedAOB)
alloc(Data_temp2, 4, Data_searchedAOB)
alloc(Data_temp3, 4, Data_searchedAOB)
alloc(Data_temp4, 4, Data_searchedAOB)
alloc(Data_temp5, 4, Data_searchedAOB)


Data_newmem:
mov [Data_temp1], eax
mov [Data_temp2], ebx
mov [Data_temp3], ecx
mov [Data_temp4], edx


cmp dword ptr [Data_update_enable], #0
je Data_update_exit
Data_update_exit:

cmp dword ptr [Data_set_enable], #0
je Data_set_exit
mov [Data_basepointer], ecx
Data_set_exit:

// Slot1
cmp [Data_Slot1_id_value], #0
je Data_Slot1_set_exit
mov eax, [Data_Slot1_id_value]
cmp ebx, eax
jne Data_Slot1_set_exit

cmp dword ptr [Data_Slot1_update_enable], #0
je Data_Slot1_update_exit
mov [Data_Slot1_basepointer], ecx
Data_Slot1_update_exit:

cmp dword ptr [Data_Slot1_set_enable], #0
je Data_Slot1_set_exit
fld [Data_Slot1_quantity_value]
fstp qword ptr [ecx]
Data_Slot1_set_exit:


// Slot2
cmp [Data_Slot2_id_value], #0
je Data_Slot2_set_exit
mov eax, [Data_Slot2_id_value]
cmp ebx, eax
jne Data_Slot2_set_exit

cmp dword ptr [Data_Slot2_update_enable], #0
je Data_Slot2_update_exit
mov [Data_Slot2_basepointer], ecx
Data_Slot2_update_exit:

cmp dword ptr [Data_Slot2_set_enable], #0
je Data_Slot2_set_exit
fld [Data_Slot2_quantity_value]
fstp qword ptr [ecx]
Data_Slot2_set_exit:


// Slot3
cmp [Data_Slot3_id_value], #0
je Data_Slot3_set_exit
mov eax, [Data_Slot3_id_value]
cmp ebx, eax
jne Data_Slot3_set_exit

cmp dword ptr [Data_Slot3_update_enable], #0
je Data_Slot3_update_exit
mov [Data_Slot3_basepointer], ecx
Data_Slot3_update_exit:

cmp dword ptr [Data_Slot3_set_enable], #0
je Data_Slot3_set_exit
fld [Data_Slot3_quantity_value]
fstp qword ptr [ecx]
Data_Slot3_set_exit:


// Slot4
cmp [Data_Slot4_id_value], #0
je Data_Slot4_set_exit
mov eax, [Data_Slot4_id_value]
cmp ebx, eax
jne Data_Slot4_set_exit

cmp dword ptr [Data_Slot4_update_enable], #0
je Data_Slot4_update_exit
mov [Data_Slot4_basepointer], ecx
Data_Slot4_update_exit:

cmp dword ptr [Data_Slot4_set_enable], #0
je Data_Slot4_set_exit
fld [Data_Slot4_quantity_value]
fstp qword ptr [ecx]
Data_Slot4_set_exit:


// Slot5
cmp [Data_Slot5_id_value], #0
je Data_Slot5_set_exit
mov eax, [Data_Slot5_id_value]
cmp ebx, eax
jne Data_Slot5_set_exit

cmp dword ptr [Data_Slot5_update_enable], #0
je Data_Slot5_update_exit
mov [Data_Slot5_basepointer], ecx
Data_Slot5_update_exit:

cmp dword ptr [Data_Slot5_set_enable], #0
je Data_Slot5_set_exit
fld [Data_Slot5_quantity_value]
fstp qword ptr [ecx]
Data_Slot5_set_exit:


mov eax, [Data_temp1]
mov ebx, [Data_temp2]
mov ecx, [Data_temp3]
mov edx, [Data_temp4]


Data_originalcode:
db F2 0F 10 01 F2 0F 11 07
//movsd xmm0,[ecx]
//movsd [edi],xmm0


Data_exit:
jmp Data_returnhere


Data_searchedAOB:
Data_savedAOB:
jmp Data_newmem
nop
nop
nop
Data_returnhere:


[DISABLE]
Data_savedAOB:
db F2 0F 10 01 F2 0F 11 07
//movsd xmm0,[ecx]
//movsd [edi],xmm0

unregistersymbol(Data_savedAOB)

dealloc(Data_newmem)
dealloc(Data_temp1)
dealloc(Data_temp2)
dealloc(Data_temp3)
dealloc(Data_temp4)"""

