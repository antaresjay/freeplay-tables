[[cheat]]
id = "service-stats-base-address-scan-to-update-service"
name = "Service Stats Base Address Scan (To Update: Service)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(servicestats_savedAOB)
label(servicestats_returnhere)
label(servicestats_originalcode)
label(servicestats_exit)

label(servicestats_update_exit)
label(servicestats_set_exit)
label(servicestats_patienceset_exit)

registersymbol(servicestats_savedAOB)

//00476C1C - 7B 1B                 - jnp 00476C39
//00476C1E - 51                    - push ecx
// Accesses Patience
//00476C1F - F3 0F11 91 9C000000   - movss [ecx+0000009C],xmm2
//00476C27 - F3 0F11 89 A0000000   - movss [ecx+000000A0],xmm1
//00476C2F - C6 41 48 01           - mov byte ptr [ecx+48],01
//00476C33 - E8 D8DC0500           - call 004D4910
aobscan(servicestats_searchedAOB, F3 0F 11 91 9C 00 00 00 F3 0F 11 89 A0 00 00 00)

alloc(servicestats_newmem, 2048, servicestats_searchedAOB)
alloc(servicestats_temp1, 4, servicestats_searchedAOB)
alloc(servicestats_temp2, 4, servicestats_searchedAOB)
alloc(servicestats_temp3, 4, servicestats_searchedAOB)
alloc(servicestats_temp4, 4, servicestats_searchedAOB)
alloc(servicestats_temp5, 4, servicestats_searchedAOB)


servicestats_newmem:
mov [servicestats_temp1], eax
mov [servicestats_temp2], ebx
mov [servicestats_temp3], ecx
mov [servicestats_temp4], edx

cmp dword ptr [servicestats_update_enable], #0
je servicestats_update_exit
mov [servicestats_basepointer], ecx
servicestats_update_exit:

cmp dword ptr [servicestats_set_enable], #0
je servicestats_set_exit
servicestats_set_exit:

cmp dword ptr [servicestats_patienceset_enable], #0
je servicestats_patienceset_exit
fld [ecx+9c]
mov [servicestats_temp5], (float)0
fld [servicestats_temp5]
fcomi ST(0), ST(1)
fstp ST(0)
fstp ST(0)
jb servicestats_patienceset_exit
mov [ecx+9c], (float)-1
servicestats_patienceset_exit:

mov eax, [servicestats_temp1]
mov ebx, [servicestats_temp2]
mov ecx, [servicestats_temp3]
mov edx, [servicestats_temp4]


servicestats_originalcode:
db F3 0F 11 89 A0 00 00 00
//movss [ecx+000000A0],xmm1


servicestats_exit:
jmp servicestats_returnhere


servicestats_searchedAOB + 8:
servicestats_savedAOB:
jmp servicestats_newmem
nop
nop
nop
servicestats_returnhere:


[DISABLE]
servicestats_savedAOB:
db F3 0F 11 89 A0 00 00 00
//movss [ecx+000000A0],xmm1

unregistersymbol(servicestats_savedAOB)

dealloc(servicestats_newmem)
dealloc(servicestats_temp1)
dealloc(servicestats_temp2)
dealloc(servicestats_temp3)
dealloc(servicestats_temp4)
dealloc(servicestats_temp5)"""

