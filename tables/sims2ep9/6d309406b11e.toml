label(return code)
label(CurrencyPtr bMoney)

newmem:
  mov [CurrencyPtr],ecx

  cmp byte ptr [bMoney],1
  jne code
  mov [ecx+94],(int)999999

code:
  add eax,[ecx+00000094]
  jmp return

CurrencyPtr:
