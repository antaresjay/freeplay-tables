CurrencyHook:
  jmp newmem
  db 90
return:
registersymbol(CurrencyHook CurrencyPtr bMoney)

[DISABLE]

CurrencyHook:
  db 03 81 94 00 00 00

unregisterSymbol(*)
dealloc(*)"""

