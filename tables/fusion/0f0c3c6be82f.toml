{ Game   : Trinity Fusion.exe
  Version:
  Date   : 2025-06-10
  Author : Roopa

  This script sets the player's Energy (Mana) value to 100 constantly.
}

[ENABLE]

aobscan(energy_inf,F3 0F 11 6E 18 48 8B 46 10 48 8B C8 48) // should be unique
alloc(newmem,$1000,energy_inf)

label(code)
label(return)
label(energyValue)

newmem:
  movss xmm0,[energyValue]       // Load 100.0f into xmm0
  movss [rsi+18],xmm0            // Overwrite energy with 100
  jmp return

energyValue:
  dd (float)100.0                // Constant 100.0f in memory

code:
  movss [rsi+18],xmm5            // original code (not used anymore)
  jmp return

energy_inf:
  jmp newmem
  nop
return:

registersymbol(energy_inf)

[DISABLE]

energy_inf:
  db F3 0F 11 6E 18

unregistersymbol(energy_inf)
dealloc(newmem)



