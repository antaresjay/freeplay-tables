cmp r10,1
jne code
cmp r11,1994a
jne code
cmp r14,0
jne code
// 1. SETUP: Load 10.0 (Threshold)
  // We can safely use RAX as a scratchpad because the original code
  // overwrites RAX immediately anyway.
  mov rax, 4024000000000000   // Hex for (double)10.0
  movq xmm1, rax              // Move 10.0 to XMM1

  // 2. READ: Load current value from memory at [RDI]
  movsd xmm0, [rdi]           // Load the Double from the address RDI

  // 3. COMPARE: Is Current Value (XMM0) < 10.0 (XMM1)?
  comisd xmm0, xmm1

  // 4. DECISION: Jump if Below
  // If value is 1..9, it is "Below", so jump to code (do nothing).
  // If value is 10+, it does NOT jump.
  jb code

  // --- RESET LOGIC (Value is >= 10.0) ---

reset_value:
  // 5. WRITE: Set the value at [RDI] to 1.0
  mov rax, 3FF0000000000000   // Hex for (double)1.0
  mov [rdi], rax              // Write 1.0 into memory

code:
  mov rax,[rdi]
  mov [rsp+40],rax
  jmp return

address:
  jmp newmem
  nop 3
