alloc(newmem,$1000)

label(code)
label(return)
label(original)

label(currentHealth)
label(maxHealth)

globalalloc(pCurrentHealth,4)
globalalloc(pMaxHealth,4)

newmem:

code:
  cmp eax, 0
  jne original
  cmp ecx, 0
  jne original
  cmp edx, 0
  jne original
  cmp edi, 1
  jne original

  cmp [esp+2C], 00D029A2
  je currentHealth
  cmp [esp+2C], 00D029D0
  je maxHealth
  jmp original

currentHealth:
  mov [pCurrentHealth], esi
  jmp original

maxHealth:
  mov [pMaxHealth], esi
  jmp original

original:
  fld qword ptr [esi]
  fstp qword ptr [ebx]
  jmp nuclearthrone.exe+D2373F
  jmp return

ReadHealth:
  jmp newmem
  nop
return:

[DISABLE]

ReadHealth:
