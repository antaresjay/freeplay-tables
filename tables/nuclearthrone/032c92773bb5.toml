source = """
[ENABLE]


aobscanmodule(ammoret,nuclearthrone.exe,83 EC 04 C7 84 24 F8 15 00 00 BD 00 00 00 8B 84 24 4C 14 00 00 83 F8 0D)
aobscanmodule(ammo,nuclearthrone.exe,F2 0F 10 07 F2 0F 11 06 89)
