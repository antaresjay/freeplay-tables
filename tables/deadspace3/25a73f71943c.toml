id = "player-character-coordinates"
name = "[Player] Character coordinates"
category = "player"
description = ""
hint = ""
type = "script"
source = """
//--> Game    : deadspace3.exe
//--> Version : 1.0.0.1
//--> Date    : 08/03/2024
//--> Author  : mul0

[ENABLE]

aobscanmodule(_PlayerCoordinates,deadspace3.exe+326895,0f58xxxxxxxxxx0f29xx8bxxxxc2xxxx8bxxxxd9xxxxdcxxxxxxxxxxebxx8bxxxxxx8dxxxxxx81xxxxxxxxxxxxe8xxxxxxxx83xxxx8bxxxxc2xxxx79xx72xx66xxxxxxxx68)
alloc(newmem,$1000)
alloc(Coordinates,$50)

label(code)
label(codeZ)
label(codeY)
label(return)
registersymbol(_PlayerCoordinates)
registersymbol(Coordinates)

newmem:
  // Extract the coordinate X [Need to manually write register + offset]
  // [Need to manually write register + offset] 
  // Example fld [eax+30] - 30 = X Coordinates
  fld dword ptr [ecx+00000100]                                      // <-- X Coordinates
  // Loading the value into the memory
  fstp dword ptr [Coordinates+300]
  
  // Extract the coordinate Y [Need to manually write register + offset]
  // [Need to manually write register + offset] 
  // Example fld [eax+34] - 34 = Y Coordinates
  fld dword ptr [ecx+00000108]                                      // <-- Y Coordinates
   // Loading the value into the memory
  fstp dword ptr [Coordinates+304]
  
  // Extract the coordinate Z [Need to manually write register + offset]
  // [Need to manually write register + offset] 
  // Example fld [eax+38] - 38 = Z Coordinates
  fld dword ptr [ecx+00000104]                                     // <-- Z Coordinates
   // Loading the value into the memory
  fstp dword ptr [Coordinates+308]

  //Multiplier (float)1.5 [You can enter your value]
  mov [Coordinates+200],(float)1
  
  
  //  ------------------------------------------------- ::Checking pressing button "1" - Up::
  cmp byte [Coordinates+51],01   
  jne codeZ
  // Load coordinate Z
  fld dword ptr [ecx+00000104]                                       // <-- Z Coordinates
  fld dword ptr [Coordinates+200]

  fadd st(0),st(1)

  fstp st(1)
  // Unload coordinate Z
  fstp dword ptr [ecx+00000104]                                               // <-- Z Coordinates
  mov byte [Coordinates+51],00
  
  
   //  ------------------------------------------------- ::Checking pressing button "2" - Down::
  codeZ:
  cmp byte [Coordinates+52],01      
  jne codeY
  fld dword ptr [ecx+00000104]                                     // <-- Z Coordinates
  fld dword ptr [Coordinates+200]

  fsub st(1),st(0)

  fstp st(0)
  fstp dword ptr [ecx+00000104]                                              // <-- Z Coordinates
  mov byte [Coordinates+52],00
  
  
  codeY:
  //  ------------------------------------------------- ::Checking pressing button "T" [Your hotkey for teleportation]::
  cmp byte ptr [Coordinates+50],01
  jne code
  // The X coordinate of the character
  fld dword ptr [Coordinates+300]
  // X coordinate of camera [You need to find this value]
  // [Need to manually write register + offset] 
  // Example fld [eax+30] - 30 = X Coordinates of Camera
  fld dword ptr [_iCursor]                                          // <-- X Coordinates of Camera

  // Subtracts the x coordinate of the character from the x coordinate of the camera
  fsub st(1), st(0)      

  fstp [Coordinates+150]
  fstp [Coordinates+155]
  
  // ---------------------------------------------- ::Delete Multiplier if you don't need it::
  fld [Coordinates+155]
  fld [Coordinates+200]
  fmul st(0),st(1)
  fstp [Coordinates+155]
  fstp st(0)
  // ---------------------------------------------- ::Delete Multiplier if you don't need it::
  
  // The X coordinate of the character
  fld [Coordinates+300] //
  fld [Coordinates+155]
  fadd st(0), st(1)

  // The X coordinate of the character
  // [Need to manually write register + offset] 
  // Example fld [eax+30] - 30 = X Coordinates
  fstp dword ptr [ecx+00000100]
  fstp st(0)                                         // <-- X Coordinates of Player

  //The Y coordinate
  fld dword ptr [Coordinates+304] // -- Player Y
  
  // Y coordinate of camera [You need to find this value]
  // [Need to manually write register + offset] 
  // Example fld [eax+34] - 34 = Y Coordinates of Camera
  fld dword ptr [_iCursor+08]                                      // <-- Y Coordinates of Camera

  fsub st(1), st(0)
  fstp [Coordinates+170]
  fstp [Coordinates+175]

  // ---------------------------------------------- ::Delete Multiplier if you don't need it::
  fld [Coordinates+175]
  fld [Coordinates+200]
  fmul st(0),st(1)
  fstp [Coordinates+175]
  fstp st(0)
  // ---------------------------------------------- ::Delete Multiplier if you don't need it::

  fld [Coordinates+304] // -- Player Y
  fld [Coordinates+175] // -- 6
  fadd st(0), st(1)

  // The Y coordinate of the character
  // [Need to manually write register + offset] 
  // Example fld [eax+34] - 34 = Y Coordinates
  fstp dword ptr [ecx+00000108]                                    // <-- Y Coordinates of Player
  fstp st(0) 

  mov byte [Coordinates+50],00
  
code:
\taddps xmm0,[ecx+00000100]
\tjmp return

