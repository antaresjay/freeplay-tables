[[cheat]]
id = "bench-menu-index-browse-bench-to-update"
name = "Bench Menu Index (Browse Bench To Update)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,"deadspace3.exe"+2024A9)
define(bytes,8B 1F 8B 4D 08)

[ENABLE]
assert(address,bytes)
alloc(newmem,$128)

label(return)
label(bmi) //bench menu index
registersymbol(bmi)

newmem:

code:
  mov [bmi],edi
  mov ebx,[edi]
  mov ecx,[ebp+08]
  jmp return

bmi:
 dd 0

address:
  jmp newmem
return:

[DISABLE]
address:
  db bytes

unregistersymbol(bmi)
dealloc(newmem)"""

