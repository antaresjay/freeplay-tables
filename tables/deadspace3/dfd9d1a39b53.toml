[[cheat]]
id = "activate-trainer"
name = "Activate Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
{
  --Dead Space 4 Plus 5 Trainer
  --by Alice0725, Jan 4, 2013
}
alloc(cheater,2048) //2kb should be enough
label(iCheat)
registersymbol(iCheat)
label(retHealth)
label(orgHealth)
label(chtHealth)
label(retBullet)
label(orgBullet)
label(chtBullet)
label(retStasis)
label(orgStasis)
label(chtStasis)
label(retOxygen)
label(setOxygen)
label(chtOxygen)
label(retRes)
label(chtRes)
label(ptrRes)
registersymbol(ptrRes)

cheater:
iCheat:
 db 00 00 00 00 //byte:health,bullet,stasis,oxygen;
ptrRes:
 dd 00
{-------Infinite Health-------}
chtHealth:
 cmp byte ptr [iCheat],00
 je orgHealth
 cmp [ecx+00000104],00
 je orgHealth
 cmp [ecx+000000F8],(float)0.01
 jb orgHealth  //Must be dead.
 push edx
 mov edx,[ecx+000000F4]
 mov [ecx+000000F8],edx
 pop edx
 mov [ecx+000000FC],(float)1 //Health status
orgHealth:
 fcomp dword ptr [ecx+000000F8]
 jmp retHealth
{------Infinite Ammo-------}
chtBullet:
 cmp byte ptr [iCheat+1],00
 je orgBullet
 push eax
 mov eax,[ecx+0000028C]
 mov [ecx+00000290],eax
 pop eax
orgBullet:
 mov edx,[ecx+00000290]
 jmp retBullet
{------Infinite Stasis------}
chtStasis:
 cmp byte ptr [iCheat+2],00
 je orgStasis
 push edx
 mov edx,[ecx+00000104]
 mov [ecx+00000100],edx
 pop edx
orgStasis:
 fld dword ptr [ecx+00000100]
 jmp retStasis
{------Infinite Oxygen------}
chtOxygen:
 cmp byte ptr [iCheat+3],00
 jne setOxygen  //Enabled:skip next line.
 fsub dword ptr [ebp-08]
setOxygen:
 fstp dword ptr [esi+60]
 jmp retOxygen
{----Get Resources Pointer----}
chtRes:
 mov [ptrRes],ecx // save the base address
 mov [ebp-10],ecx // originalcode
 test ecx,ecx
 jmp retRes

{---------------------------------Hacked--------------------------------------}
locHealth:
 jmp chtHealth
 nop
retHealth:

locBullet:
 jmp chtBullet
 nop
retBullet:

locStasis:
 jmp chtStasis
 nop
retStasis:
 
locOxygen:
 jmp chtOxygen
 nop
retOxygen:

locRes:
 jmp chtRes
retRes:

[DISABLE]
locHealth:
 db D8 99 F8 00 00 00
locBullet:
 db 8B 91 90 02 00 00
locStasis:
 db D9 81 00 01 00 00
locOxygen:
 db D8 65 F8 D9 5E 60
locRes:
 db 89 4D F0 85 C9
unregistersymbol(ptrRes)
unregistersymbol(iCheat)
dealloc(cheater)"""

