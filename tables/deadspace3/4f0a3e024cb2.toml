[[cheat]]
id = "unlimited-health"
name = "Unlimited Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
label(Health)
registersymbol(Health)
aobscan(aobHealth,D8 9E F8 00 00 00 DF E0 F6 C4 01 75 05 F6 C1 01 74 06)

newmem:
cmp [esi+104],0
je originalcode
cmp [esi+FC],(float)0.01
jb originalcode
push edx
mov edx,[esi+F4]
mov [esi+F8],edx
pop edx
mov [esi+FC],(float)1
jmp originalcode

originalcode:
fcomp dword ptr [esi+000000F8]

exit:
jmp returnhere

aobHealth:
Health:
jmp newmem
nop
returnhere:

 
[DISABLE]
dealloc(newmem)
unregistersymbol(Health)
Health:
db D8 9E F8 00 00 00"""

