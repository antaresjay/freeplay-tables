[[cheat]]
id = "pointer-resource"
name = "Pointer Resource"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
alloc(RSRC,4)
registersymbol(RSRC)
label(Resource)
registersymbol(Resource)
aobscan(aobResource,29 41 50 8B 42 0C)

newmem:

originalcode:
mov [RSRC],ecx
sub [ecx+50],eax
mov eax,[edx+0C]
jmp exit

exit:
jmp returnhere

aobResource:
Resource:
jmp newmem
nop
returnhere:

RSRC:
dd 0

 
[DISABLE]
dealloc(newmem)
dealloc(RSRC)
unregistersymbol(RSRC)
unregistersymbol(Resource)
Resource:
db 29 41 50 8B 42 0C"""

