source = """
{ Game   : PES2019.exe
  Date   : 2018-09-01
  Author : Aranaktu
}

[ENABLE]
aobscanmodule(INJECT_PlayerPtr,PES2019.exe,8B 41 04 C1 E8 1C) // should be unique
alloc(newmem,$1000,"PES2019.exe"+ACF2B1F)

alloc(ptrPlayer, 8)
registersymbol(ptrPlayer)
ptrPlayer:
dq 00

label(code)
label(return)


newmem:
  mov [ptrPlayer], rcx

code:
  mov eax,[rcx+04]
  shr eax,1C
  jmp return

INJECT_PlayerPtr:
  jmp newmem
  nop
return:
registersymbol(INJECT_PlayerPtr)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
INJECT_PlayerPtr:
  db 8B 41 04 C1 E8 1C

unregistersymbol(INJECT_PlayerPtr)
