[[cheat]]
id = "pes2019-bal-mode-version-1-0-2-dp-2-00"
name = "PES2019 BAL Mode (Version 1.0.2  DP 2.00)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//By xbxbox//
[ENABLE]
aobscanmodule(INJECT,PES2019.exe,0F B6 01 41 89 00)
alloc(newmem,$1000,"PES2019.exe"+ACF2ABF)

label(code)
label(return)
label(data_ptr)

newmem:

code:
  mov [data_ptr],rcx
  movzx eax,byte ptr [rcx]
  mov [r8],eax
  jmp return

data_ptr:
  dd 0

INJECT:
  jmp newmem
  nop
return:
registersymbol(INJECT)
registersymbol(data_ptr)

[DISABLE]

INJECT:
  db 0F B6 01 41 89 00

unregistersymbol(INJECT)
unregistersymbol(data_ptr)
dealloc(newmem)"""

