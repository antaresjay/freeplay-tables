[[cheat]]
id = "enable-infinite-item-usage-set-minimum-item-amount-on-gain-use-toss"
name = "Enable Infinite Item Usage / Set Minimum Item Amount On Gain/Use/Toss"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

/// This is call when using/tossing items from main menu
aobscanmodule(InfiniteItemUsageAOB1,$process,48 8D 0C 9F 48 8B 5C 24 * 0F B7 81 * * * * 2B C6) // should be unique
registersymbol(InfiniteItemUsageAOB1)
alloc(newmem,1024,InfiniteItemUsageAOB1)

///
label(return)
label(originalcode)
label(SetItemAmount)
registersymbol(SetItemAmount)
label(OverrideItemQty)
registersymbol(OverrideItemQty)
label(InfiniteItemUsageAOB1Save)
registersymbol(InfiniteItemUsageAOB1Save)

{

Key Items have id ??? thru ??? (Except Shining Pom Droplet which is id ???)
Master Quartz have id ???? thru ????

rbx contains item id

}

newmem:
  xor esi,esi
  mov [R15Save],r15
  lea rcx,[rdi+rbx*4]
  mov r15,ItemOffset
  mov r15,[r15]
DoMin:
  movzx eax,byte ptr [rcx+r15]  
  cmp [OverrideItemQty],1
  je ForceItemQty
  cmp eax,[SetItemAmount]
  jge MyCleanUp1
ForceItemQty:
  mov eax,[SetItemAmount]
  mov [rcx+r15],al
  jmp MyCleanUp1

MyCleanUp1:
  mov r15,[R15Save]
  jmp originalcode
  
originalcode:
InfiniteItemUsageAOB1Save:
  readmem(InfiniteItemUsageAOB1,9)
  jmp return

SetItemAmount:
dq #10
OverrideItemQty:
dq 0
R15Save:
dq 0
ItemOffset:
  readmem(InfiniteItemUsageAOB1+C,4)
dd 0

/// 
InfiniteItemUsageAOB1:
  jmp newmem
  nop
  nop
  nop
  nop
  return:
  
[DISABLE]

InfiniteItemUsageAOB1:
  readmem(InfiniteItemUsageAOB1Save,9)
  
unregistersymbol(InfiniteItemUsageAOB1)
unregistersymbol(InfiniteItemUsageAOB1Save)
unregistersymbol(SetItemAmount)
unregistersymbol(OverrideItemQty)

///  
dealloc(newmem)"""

