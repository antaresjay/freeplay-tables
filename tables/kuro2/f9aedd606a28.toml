[[cheat]]
id = "enable-damage-modifier-options-god-mode-one-hit-kill-etc"
name = "Enable Damage Modifier Options (God Mode, One Hit Kill, etc.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DamageModAOB,$process,41 8B 4A 0C 41 8B 52 10 41 03 CB 3B CA 0F 4C D1) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,1024,DamageModAOB)

label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fEnemyHealingMult)
registersymbol(fEnemyHealingMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(fHeroHealingMult)
registersymbol(fHeroHealingMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

newmem:
originalcode:
  mov ecx,[r10+0C]
  mov edx,[r10+10]
  cmp dword ptr [r10+2E0],1
  jne EnemyHit
HeroHit:
  cmp r11d,0
  jl HeroDamageHit
  jg HeroHealingHit
  jmp MyCleanUp1
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  neg r11d
  push r11d
  fild dword ptr [rsp]
  fmul dword ptr [fHeroDamageMult]
  fistp dword ptr [rsp]
  pop r11d
  neg r11d
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor r11d,r11d
  jmp MyCleanUp1
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne MyCleanUp1
  neg r11d
  cmp r11d,ecx
  jl @F
  xor r11d,r11d
@@:
  neg r11d
  jmp MyCleanUp1  
HeroHealingHit:
  cmp [fHeroHealingMult],(float)0.0
  je MyCleanUp1
  push r11d
  fild dword ptr [rsp]
  fmul dword ptr [fHeroHealingMult]
  fistp dword ptr [rsp]
  pop r11d
  jmp MyCleanUp1
EnemyHit:
  cmp r11d,0
  jl EnemyDamageHit
  jg EnemyHealingHit
  jmp CheckOneHitKill
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckOneHitKill
  neg r11d
  push r11d
  fild dword ptr [rsp]
  fmul dword ptr [fEnemyDamageMult]
  fistp dword ptr [rsp]
  pop r11d
  neg r11d
CheckOneHitKill:
  cmp [OneHitKill],1
  jne MyCleanUp1
  mov r11d,ecx
  neg r11d
  jmp MyCleanUp1
EnemyHealingHit:
  cmp [fEnemyHealingMult],(float)0.0
  je MyCleanUp1
  push r11d
  fild dword ptr [rsp]
  fmul dword ptr [fEnemyHealingMult]
  fistp dword ptr [rsp]
  pop r11d

MyCleanUp1:  
  jmp return

GodMode:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)2.0
fEnemyHealingMult:
dq (float)0.25
fHeroDamageMult:
dq (float)0.25
fHeroHealingMult:
dq (float)2.0
HeroCannotDie:
dq 1

DamageModAOB:
  jmp newmem
  nop
  nop
  nop
return:

[DISABLE]

DamageModAOB:
  db 41 8B 4A 0C 41 8B 52 10

unregistersymbol(DamageModAOB)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fEnemyHealingMult)
unregistersymbol(fHeroDamageMult)
unregistersymbol(fHeroHealingMult)

dealloc(newmem)"""

