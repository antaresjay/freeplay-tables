registersymbol(HoloCoreEXPMultiplierAOB1Save)
label(fHoloCoreEXPMultiplier)
registersymbol(fHoloCoreEXPMultiplier)

///
newmem:
  push eax
  fild dword ptr [rsp]
  fmul dword ptr [fHoloCoreEXPMultiplier]
  fistp dword ptr [rsp]
  pop eax
  jmp MyCleanUp1
  
MyCleanUp1:
  jmp originalcode

originalcode:
HoloCoreEXPMultiplierAOB1Save:
  readmem(HoloCoreEXPMultiplierAOB1,5)
  jmp HoloCoreEXPMultiplierAOB1+05

fHoloCoreEXPMultiplier:
dq (float)5.0

///  
HoloCoreEXPMultiplierAOB1:
  jmp newmem
  return:
  
[DISABLE]

///
HoloCoreEXPMultiplierAOB1:
  readmem(HoloCoreEXPMultiplierAOB1Save,5)

unregistersymbol(HoloCoreEXPMultiplierAOB1)
unregistersymbol(HoloCoreEXPMultiplierAOB1Save)
unregistersymbol(fHoloCoreEXPMultiplier)

///
dealloc(newmem)"""

