[[cheat]]
id = "damage-modifier-script-god-mode-one-hit-kill-etc"
name = "Damage Modifier Script (God Mode, One Hit Kill, etc.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DamageModAOB,$process,8B 86 D0 02 00 00 53 55 8B 6C 24 14) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,1024,DamageModAOB)

label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

newmem:
originalcode:
  push ebx
  push ebp
  mov ebp,[esp+14]
  cmp byte ptr [esi+2A4],FF
  je EnemyHit
  jmp HeroHit
HeroHit:
  cmp ebp,0
  jl HeroDamageHit
  jmp MyCleanUp
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  push ebp
  fild dword ptr [rsp]
  fmul dword ptr [fHeroDamageMult]
  fistp dword ptr [rsp]
  pop ebp
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor ebp,ebp
  jmp MyCleanUp
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne MyCleanUp
  cmp ebp,eax
  jl @F
  xor ebp,ebp
@@:
  jmp MyCleanUp 
EnemyHit:
  cmp ebp,0
  jl EnemyDamageHit
  jmp MyCleanUp
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckOneHitKill
  push ebp
  fild dword ptr [rsp]
  fmul dword ptr [fEnemyDamageMult]
  fistp dword ptr [rsp]
  pop ebp
CheckOneHitKill:
  cmp [OneHitKill],1
  jne MyCleanUp
  mov ebp,eax
  neg ebp
  jmp MyCleanUp

MyCleanUp:    
  jmp return

GodMode:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)0.0
fHeroDamageMult:
dq (float)0.5
HeroCannotDie:
dq 1

DamageModAOB+6:
  jmp newmem
  nop
return:

[DISABLE]

DamageModAOB+6:
  db 53 55 8B 6C 24 14

unregistersymbol(DamageModAOB)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fHeroDamageMult)
unregistersymbol(HeroCannotDie)

dealloc(newmem)"""

