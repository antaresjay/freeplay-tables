[[cheat]]
id = "herosingame-base-address-scan-to-activate-load-game-to-update-play-game"
name = "HerosInGame Base Address Scan (To Activate: Load Game, To Update: Play Game)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(HerosInGame_savedAOB)
label(HerosInGame_returnhere)
label(HerosInGame_originalcode)
label(HerosInGame_exit)

label(HerosInGame_update_exit)
label(HerosInGame_set_exit)
label(HerosInGame_godmodeset_exit)
label(HerosInGame_lifestaminafearset_exit)
label(HerosInGame_cashset_exit)
label(HerosInGame_statsset_exit)
label(HerosInGame_usesset_exit)
label(HerosInGame_usesset__HIG_Weapon_Lef_Object_exit)
label(HerosInGame_usesset__HIG_Weapons_Right_Object_exit)
label(HerosInGame_usesset__HIG_Armor_Body_Object_exit)
label(HerosInGame_usesset__HIG_Amor_Legs_Object_exit)
label(HerosInGame_usesset__HiG_Amor_Feet_Object_exit)
label(HerosInGame_usesset__HIG_Amor_Hands_Object_exit)
label(HerosInGame_usesset__HiG_Amor_Head_Object_exit)
label(HerosInGame_usesset__HIG_Neck_And_Ears_Object_exit)
label(HerosInGame_usesset__HIG_Fist_And_Fingers_Object_exit)
label(HerosInGame_usesset__HIG_Miscellaneous_Object_exit)
label(HerosInGame_ammoset_exit)
label(HerosInGame_ammoset__HIG_Weapon_Lef_Object_exit)
label(HerosInGame_ammoset__HIG_Weapons_Right_Object_exit)

registersymbol(HerosInGame_savedAOB)

//04588CB2 - C7 45 A8 00000000     - mov [ebp-58],00000000
//04588CB9 - C7 45 AC 00000000     - mov [ebp-54],00000000
// HerosInGame:CalculateMaxLife+38
//04588CC0 - 8B 47 70              - mov eax,[edi+70]
//04588CC3 - 85 C0                 - test eax,eax
//04588CC5 - 75 07                 - jne 04588CCE
//04588CC7 - D9EE                  - fldz
//04588CC9 - E9 74010000           - jmp 04588E42
//04588CCE - 8B 47 70              - mov eax,[edi+70]
aobscan(HerosInGame_searchedAOB, 8B 47 70 85 C0 * * D9 EE)

alloc(HerosInGame_newmem, 2048)
alloc(HerosInGame_temp1, 4)


HerosInGame_newmem:
mov [HerosInGame_temp1], ebx

cmp dword ptr [HerosInGame_update_enable], #0
je HerosInGame_update_exit
mov [HerosInGame_basepointer], edi
HerosInGame_update_exit:

cmp dword ptr [HerosInGame_set_enable], #0
je HerosInGame_set_exit
HerosInGame_set_exit:

cmp dword ptr [HerosInGame_godmodeset_enable], #0
je HerosInGame_godmodeset_exit
mov byte ptr [edi+27c], #1
HerosInGame_godmodeset_exit:

cmp dword ptr [HerosInGame_lifestaminafearset_enable], #0
je HerosInGame_lifestaminafearset_exit
mov [edi+140], (float)9999
mov [edi+144], (float)9999
mov [edi+148], (float)0
mov [edi+264], (float)9999
HerosInGame_lifestaminafearset_exit:

cmp dword ptr [HerosInGame_cashset_enable], #0
je HerosInGame_cashset_exit
mov [edi+14c], (float)9999999
HerosInGame_cashset_exit:

cmp dword ptr [HerosInGame_statsset_enable], #0
je HerosInGame_statsset_exit
mov [edi+1f8], #9999
mov [edi+1fc], #9999
mov [edi+200], #9999
mov [edi+204], #9999
mov [edi+208], #9999
mov [edi+20c], #9999
mov [edi+210], #9999
mov [edi+22c], #9999
HerosInGame_statsset_exit:

cmp dword ptr [HerosInGame_usesset_enable], #0
je HerosInGame_usesset_exit
cmp dword ptr [edi+a4], #0
je HerosInGame_usesset__HIG_Weapon_Lef_Object_exit
mov ebx, [edi+a4]
mov [ebx+48], (float)0
HerosInGame_usesset__HIG_Weapon_Lef_Object_exit:
cmp dword ptr [edi+a8], #0
je HerosInGame_usesset__HIG_Weapons_Right_Object_exit
mov ebx, [edi+a8]
mov [ebx+48], (float)0
HerosInGame_usesset__HIG_Weapons_Right_Object_exit:
cmp dword ptr [edi+ac], #0
je HerosInGame_usesset__HIG_Armor_Body_Object_exit
mov ebx, [edi+ac]
mov [ebx+48], (float)0
HerosInGame_usesset__HIG_Armor_Body_Object_exit:
cmp dword ptr [edi+b0], #0
je HerosInGame_usesset__HIG_Amor_Legs_Object_exit
mov ebx, [edi+b0]
mov [ebx+48], (float)0
HerosInGame_usesset__HIG_Amor_Legs_Object_exit:
cmp dword ptr [edi+b4], #0
je HerosInGame_usesset__HiG_Amor_Feet_Object_exit
mov ebx, [edi+b4]
mov [ebx+48], (float)0
HerosInGame_usesset__HiG_Amor_Feet_Object_exit:
cmp dword ptr [edi+b8], #0
je HerosInGame_usesset__HIG_Amor_Hands_Object_exit
mov ebx, [edi+b8]
mov [ebx+48], (float)0
HerosInGame_usesset__HIG_Amor_Hands_Object_exit:
cmp dword ptr [edi+bc], #0
je HerosInGame_usesset__HiG_Amor_Head_Object_exit
mov ebx, [edi+bc]
mov [ebx+48], (float)0
HerosInGame_usesset__HiG_Amor_Head_Object_exit:
cmp dword ptr [edi+c0], #0
je HerosInGame_usesset__HIG_Neck_And_Ears_Object_exit
mov ebx, [edi+c0]
mov [ebx+48], (float)0
HerosInGame_usesset__HIG_Neck_And_Ears_Object_exit:
cmp dword ptr [edi+c4], #0
je HerosInGame_usesset__HIG_Fist_And_Fingers_Object_exit
mov ebx, [edi+c4]
mov [ebx+48], (float)0
HerosInGame_usesset__HIG_Fist_And_Fingers_Object_exit:
cmp dword ptr [edi+c8], #0
je HerosInGame_usesset__HIG_Miscellaneous_Object_exit
mov ebx, [edi+c8]
mov [ebx+48], (float)0
HerosInGame_usesset__HIG_Miscellaneous_Object_exit:
HerosInGame_usesset_exit:

cmp dword ptr [HerosInGame_ammoset_enable], #0
je HerosInGame_ammoset_exit
cmp dword ptr [edi+a4], #0
je HerosInGame_ammoset__HIG_Weapon_Lef_Object_exit
mov ebx, [edi+a4]
cmp dword ptr [ebx+4c], #0
je HerosInGame_ammoset__HIG_Weapon_Lef_Object_exit
mov [ebx+4c], #9999
HerosInGame_ammoset__HIG_Weapon_Lef_Object_exit:
cmp dword ptr [edi+a8], #0
je HerosInGame_ammoset__HIG_Weapons_Right_Object_exit
mov ebx, [edi+a8]
cmp dword ptr [ebx+4c], #0
je HerosInGame_ammoset__HIG_Weapons_Right_Object_exit
mov [ebx+4c], #9999
HerosInGame_ammoset__HIG_Weapons_Right_Object_exit:
HerosInGame_ammoset_exit:

mov ebx, [HerosInGame_temp1]


HerosInGame_originalcode:
db 8B 47 70 85 C0
//mov eax,[edi+70]
//test eax,eax


HerosInGame_exit:
jmp HerosInGame_returnhere


HerosInGame_searchedAOB:
HerosInGame_savedAOB:
jmp HerosInGame_newmem
HerosInGame_returnhere:


[DISABLE]
HerosInGame_savedAOB:
db 8B 47 70 85 C0
//mov eax,[edi+70]
//test eax,eax

unregistersymbol(HerosInGame_savedAOB)

dealloc(HerosInGame_newmem)
dealloc(HerosInGame_temp1)"""

