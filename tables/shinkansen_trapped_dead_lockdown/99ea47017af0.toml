[[cheat]]
id = "npcingame-base-address-scan-to-activate-friendly-mission-to-update-friendly-mission"
name = "NPCInGame Base Address Scan (To Activate: Friendly Mission, To Update: Friendly Mission)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(NPCInGame_savedAOB)
label(NPCInGame_returnhere)
label(NPCInGame_originalcode)
label(NPCInGame_exit)

label(NPCInGame_update_exit)
label(NPCInGame_set_exit)

registersymbol(NPCInGame_savedAOB)

//045D1B8F - 8B C8                 - mov ecx,eax
//045D1B91 - 39 09                 - cmp [ecx],ecx
// NGUIFriendNeedHelp:Update+a3
//045D1B93 - D9 80 F4000000        - fld dword ptr [eax+000000F4]
//045D1B99 - D9 5D F8              - fstp dword ptr [ebp-08]
//045D1B9C - D9 45 F8              - fld dword ptr [ebp-08]
aobscan(NPCInGame_searchedAOB, D9 80 F4 00 00 00 D9 5D F8)

alloc(NPCInGame_newmem, 2048)


NPCInGame_newmem:
cmp dword ptr [NPCInGame_update_enable], #0
je NPCInGame_update_exit
mov [NPCInGame_basepointer], eax
NPCInGame_update_exit:

cmp dword ptr [NPCInGame_set_enable], #0
je NPCInGame_set_exit
mov [eax+f4], (float)9999
NPCInGame_set_exit:


NPCInGame_originalcode:
db D9 80 F4 00 00 00
//fld dword ptr [eax+000000F4]


NPCInGame_exit:
jmp NPCInGame_returnhere


NPCInGame_searchedAOB:
NPCInGame_savedAOB:
jmp NPCInGame_newmem
nop
NPCInGame_returnhere:


[DISABLE]
NPCInGame_savedAOB:
db D9 80 F4 00 00 00
//fld dword ptr [eax+000000F4]

unregistersymbol(NPCInGame_savedAOB)

dealloc(NPCInGame_newmem)"""

