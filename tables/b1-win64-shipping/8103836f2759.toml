[[cheat]]
id = "edit-fov"
name = "Edit fov"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(modfov,b1-Win64-Shipping.exe,F3 * * * * * * * C3 CC CC CC CC CC CC CC 40 * 48 * * * 0F * * * * 48 * * F3)
alloc(newmemmodfov,$100,modfov)
alloc(fov,8,modfov)
label(codemodfov returnmodfov)

fov:
dd (float)120

newmemmodfov:
movss xmm1,[fov]

codemodfov:
movss [rcx+000002C0],xmm1
jmp returnmodfov

modfov:
jmp newmemmodfov
nop 3
returnmodfov:
registersymbol(modfov fov)

[DISABLE]

modfov:
db F3 0F 11 89 C0 02 00 00
unregistersymbol(modfov fov)
dealloc(newmemmodfov fov)"""

