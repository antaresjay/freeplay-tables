type = "script"
source = """
[ENABLE]

aobscanmodule(playerinfo,GameAssembly.dll,89 87 E0 00 00 00 48 8B 05)
alloc(newmem,$1000,playerinfo)
registersymbol(player)
label(player)
label(code)
label(return)

newmem:
mov [player],rdi


code:
  mov [rdi+000000E0],eax
  jmp return

player:
dq 0

playerinfo:
  jmp newmem
  nop
return:
registersymbol(playerinfo)

