[[cheat]]
id = "unlimited-nitro-empty-with-lctrl"
name = "Unlimited Nitro, empty with LCtrl"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Made by Geri with Cheat Engine 6.2
//24th December, 2012
//All rights reserved. You are not allowed to use these scripts to create Your own trainer without my permission.
//Contact e-mail: trainers4free@gmail.com
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(originalcode)
label(exit)
label(label1)
registersymbol(label1)
aobscan(aob1,D9 44 08 20 C2 04 00)

newmem: //this is allocated memory, you have read,write,execute access
mov [eax+ecx+20],(float)100
pushfd
pushad
push A2
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne originalcode
mov [eax+ecx+20],0

originalcode:
popfd
fld dword ptr [eax+ecx+20]
ret 0004

exit:
jmp returnhere

aob1:
label1:
jmp newmem
nop
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
label1:
db D9 44 08 20 C2 04 00
unregistersymbol(label1)"""

