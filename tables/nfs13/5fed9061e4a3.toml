[[cheat]]
id = "manual-time-of-day-f4-to-enable"
name = "Manual Time of Day [F4 to enable]"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(pTimeOfDay)
registersymbol(pTimeOfDay)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
mov [pTimeOfDay],esi
jmp exit

originalcode:
movss [esi+00002A84],xmm0

exit:
jmp returnhere

///
pTimeOfDay:
dd 0
///

"NFS13.exe"+4B4C28:
jmp newmem
nop
nop
nop
returnhere:
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
"NFS13.exe"+4B4C28:
movss [esi+00002A84],xmm0
unregistersymbol(pTimeOfDay)"""

