[[cheat]]
id = "creature-base-address-scan-initialization-activate-this-first"
name = "Creature Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Creature_basepointer)
registersymbol(Creature_update_enable)
registersymbol(Creature_set_enable)
registersymbol(Creature_healthset_enable)
registersymbol(Creature_ammoset_enable)
registersymbol(Creature_weaponset_enable)

alloc(Creature_basepointer, 4)
alloc(Creature_update_enable, 4)
alloc(Creature_set_enable, 4)
alloc(Creature_healthset_enable, 4)
alloc(Creature_ammoset_enable, 4)
alloc(Creature_weaponset_enable, 4)


[DISABLE]
unregistersymbol(Creature_basepointer)
unregistersymbol(Creature_update_enable)
unregistersymbol(Creature_set_enable)
unregistersymbol(Creature_healthset_enable)
unregistersymbol(Creature_ammoset_enable)
unregistersymbol(Creature_weaponset_enable)

dealloc(Creature_basepointer)
dealloc(Creature_update_enable)
dealloc(Creature_set_enable)
dealloc(Creature_healthset_enable)
dealloc(Creature_ammoset_enable)
dealloc(Creature_weaponset_enable)"""

[[cheat]]
id = "creature-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Creature Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Creature_savedAOB)
label(Creature_returnhere)
label(Creature_originalcode)
label(Creature_exit)

label(Creature_update_exit)
label(Creature_set_exit)
label(Creature_healthset_exit)
label(Creature_ammoset_exit)
label(Creature_weaponset_exit)

registersymbol(Creature_savedAOB)

//04BFCF13 - 0F84 4E010000         - je 04BFD067
//04BFCF19 - E8 C23CFDFF           - call 04BD0BE0
// Creature:Update+c6
//04BFCF1E - D9 87 F0000000        - fld dword ptr [edi+000000F0]
//04BFCF24 - DEE9                  - fsubp st(1),st(0)
//04BFCF26 - D9 87 EC000000        - fld dword ptr [edi+000000EC]
//04BFCF2C - DFF1                  - fcomip st(0),st(1)
//04BFCF2E - DDD8                  - fstp st(0)
aobscan(Creature_searchedAOB, C7 85 E0 FE FF FF 00 00 00 00 D9 87 E8 00 00 00)

alloc(Creature_newmem, 2048, Creature_searchedAOB)
alloc(Creature_temp1, 4, Creature_searchedAOB)
alloc(Creature_temp2, 4, Creature_searchedAOB)


Creature_newmem:
mov [Creature_temp1], ebx
mov [Creature_temp2], ecx

cmp dword ptr [edi+78], #0
jne Creature_weaponset_exit

cmp dword ptr [Creature_update_enable], #0
je Creature_update_exit
mov [Creature_basepointer], edi
Creature_update_exit:

cmp dword ptr [Creature_set_enable], #0
je Creature_set_exit
Creature_set_exit:

cmp dword ptr [Creature_healthset_enable], #0
je Creature_healthset_exit
mov ebx, [edi+38]
mov [edi+70], ebx
cmp dword ptr [edi+84], #0
je Creature_healthset_exit
mov ebx, [edi+84]
mov ebx, [ebx+14]
add [edi+70], ebx
Creature_healthset_exit:

cmp dword ptr [Creature_ammoset_enable], #0
je Creature_ammoset_exit
cmp dword ptr [edi+80], #0
je Creature_ammoset_exit
mov ebx, [edi+80]
mov ecx, [ebx+38]
mov [ebx+a0], ecx
Creature_ammoset_exit:

cmp dword ptr [Creature_weaponset_enable], #0
je Creature_weaponset_exit
cmp dword ptr [edi+7c], #0
je Creature_weaponset_exit
mov ebx, [edi+7c]
mov [ebx+3c], (float)999
mov [ebx+40], (float)0
mov [ebx+44], (float)0
mov [ebx+48], #1
cmp dword ptr [edi+80], #0
je Creature_weaponset_exit
mov ebx, [edi+80]
mov [ebx+3c], (float)999
mov [ebx+40], (float)0
mov [ebx+44], (float)0
mov [ebx+48], #1
Creature_weaponset_exit:

mov ebx, [Creature_temp1]
mov ecx, [Creature_temp2]


Creature_originalcode:
db D9 87 E8 00 00 00
//fld dword ptr [edi+000000E8]


Creature_exit:
jmp Creature_returnhere


Creature_searchedAOB + a:
Creature_savedAOB:
jmp Creature_newmem
nop
Creature_returnhere:


[DISABLE]
Creature_savedAOB:
db D9 87 E8 00 00 00
//fld dword ptr [edi+000000E8]

unregistersymbol(Creature_savedAOB)

dealloc(Creature_newmem)
dealloc(Creature_temp1)
dealloc(Creature_temp2)"""

