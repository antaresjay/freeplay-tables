type = "script"
source = """
//Send@ModEngine
[ENABLE]

aobscanregion(onehit,Enemy:TakeHit+1c16,Enemy:TakeHit+1c2a,F2 0F 5C C1 F2 0F 5A E8)
alloc(newmem,$1000,onehit)

label(code)
label(return)

newmem:

code:
  xorps xmm0,xmm0
  subsd xmm0,xmm1
  cvtsd2ss xmm5,xmm0
  jmp return



onehit:
  jmp newmem
  nop 3
return:
registersymbol(onehit)

[DISABLE]

onehit:
  db F2 0F 5C C1 F2 0F 5A E8

unregistersymbol(*)
dealloc(*)"""
