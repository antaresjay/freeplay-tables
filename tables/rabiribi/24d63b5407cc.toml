[[cheat]]
id = "player-stats-base-address-scan-to-update-battle"
name = "Player Stats Base Address Scan (To Update: Battle)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstats_update_exit)
label(playerstats_set_exit)
label(playerstats_hpset_exit)
label(playerstats_spset_exit)
label(playerstats_mpset_exit)
label(playerstats_bpset_exit)
label(playerstats_amuletset_exit)
label(playerstats_comboset_exit)
label(playerstats_invincibilityset_exit)
label(playerstats_supercarrotset_exit)
label(playerstats_jumpset_exit)
label(playerstats_sizeset_exit)
label(playerstats_capacityset_exit)
label(playerstats_doublechargeset_exit)
label(playerstats_carrotset_exit)
label(playerstats_carrotset_bomb_entry)
label(playerstats_carrotset_unbomb_entry)
label(playerstats_chargeset_exit)
label(playerstats_shotset_exit)

registersymbol(playerstats_originalcode)
registersymbol(playerstats_savedAOB)

//rabiribi.exe+57750 - E8 DBE3FFFF           - call rabiribi.exe+55B30
//rabiribi.exe+57755 - 8B 0D 10328D02        - mov ecx,[rabiribi.exe+1683210]
//rabiribi.exe+5775B - 8B 84 0B 38060000     - mov eax,[ebx+ecx+00000638]
// Accesses HP
//rabiribi.exe+57762 - 3B 84 0B DC040000     - cmp eax,[ebx+ecx+000004DC]
//rabiribi.exe+57769 - 74 4C                 - je rabiribi.exe+577B7
//rabiribi.exe+5776B - 83 3C B5 74299302 00  - cmp dword ptr [esi*4+rabiribi.exe+16E2974],00
//rabiribi.exe+57773 - 75 42                 - jne rabiribi.exe+577B7
aobscan(playerstats_searchedAOB, 8B 84 0B 38 06 00 00 3B 84 0B DC 04 00 00 74 4C)

alloc(playerstats_newmem, 2048, playerstats_searchedAOB)
alloc(playerstats_temp1, 4, playerstats_searchedAOB)
alloc(playerstats_temp2, 4, playerstats_searchedAOB)
alloc(playerstats_temp3, 4, playerstats_searchedAOB)
alloc(playerstats_temp4, 4, playerstats_searchedAOB)
alloc(playerstats_temp5, 4, playerstats_searchedAOB)


playerstats_newmem:
mov [playerstats_temp1], eax
mov [playerstats_temp2], ebx
mov [playerstats_temp3], ecx
mov [playerstats_temp4], edx

cmp dword ptr [playerstats_update_enable], #0
je playerstats_update_exit
mov [playerstats_basepointer], ecx
playerstats_update_exit:

cmp dword ptr [playerstats_set_enable], #0
je playerstats_set_exit
playerstats_set_exit:

cmp dword ptr [playerstats_hpset_enable], #0
je playerstats_hpset_exit
mov ebx, [ecx+4ec]
mov [ecx+4dc], ebx
playerstats_hpset_exit:

cmp dword ptr [playerstats_spset_enable], #0
je playerstats_spset_exit
mov ebx, [ecx+5bc]
mov [ecx+5b8], ebx
playerstats_spset_exit:

cmp dword ptr [playerstats_mpset_enable], #0
je playerstats_mpset_exit
fld [ecx+6c0]
fstp [ecx+6bc]
playerstats_mpset_exit:

cmp dword ptr [playerstats_bpset_enable], #0
je playerstats_bpset_exit
mov ebx, [ecx+5e8]
mov [ecx+5e0], ebx
playerstats_bpset_exit:

cmp dword ptr [playerstats_amuletset_enable], #0
je playerstats_amuletset_exit
mov [ecx+530], (float)10800
playerstats_amuletset_exit:

cmp dword ptr [playerstats_comboset_enable], #0
je playerstats_comboset_exit
fld [ecx+5ac]
fstp [ecx+5a4]
mov [ecx+5c8], #9999
playerstats_comboset_exit:

cmp dword ptr [playerstats_invincibilityset_enable], #0
je playerstats_invincibilityset_exit
mov [ecx+684], #9999999
playerstats_invincibilityset_exit:

cmp dword ptr [playerstats_supercarrotset_enable], #0
je playerstats_supercarrotset_exit
mov [ecx+698], #9999999
playerstats_supercarrotset_exit:

cmp dword ptr [playerstats_jumpset_enable], #0
je playerstats_jumpset_exit
mov [ecx+4bc], #0
mov [ecx+644], #0
playerstats_jumpset_exit:

cmp dword ptr [playerstats_sizeset_enable], #0
je playerstats_sizeset_exit
mov [playerstats_temp5], (float)0.6
fld [playerstats_temp5]
fstp [ecx+c0]
mov [ecx+c0], (float)0.6
mov [ecx+3b0], #1
mov [ecx+3b4], #1
playerstats_sizeset_exit:

cmp dword ptr [playerstats_capacityset_enable], #0
je playerstats_capacityset_exit
mov [ecx+518], #600
playerstats_capacityset_exit:

cmp dword ptr [playerstats_doublechargeset_enable], #0
je playerstats_doublechargeset_exit
mov [ecx+51c], #9999
playerstats_doublechargeset_exit:

cmp dword ptr [playerstats_carrotset_enable], #0
je playerstats_carrotset_exit
mov ebx, [playerstats_carrotset_counter]
dec ebx
mov [playerstats_carrotset_counter], ebx

cmp dword ptr [ecx+664], #117
je playerstats_carrotset_unbomb_entry

cmp dword ptr [ecx+664], #0
jg playerstats_carrotset_exit

cmp dword ptr [playerstats_carrotset_counter], #0
jl playerstats_carrotset_bomb_entry
jmp playerstats_carrotset_exit

playerstats_carrotset_unbomb_entry:
mov [ecx+664], #0
jmp playerstats_carrotset_exit

playerstats_carrotset_bomb_entry:
mov ebx, [playerstats_carrotset_value]
mov [playerstats_carrotset_counter], ebx
mov [ecx+664], #116

playerstats_carrotset_exit:

cmp dword ptr [playerstats_chargeset_enable], #0
je playerstats_chargeset_exit
cmp dword ptr [ecx+610], #300
jg playerstats_chargeset_exit
mov [ecx+610], #350
playerstats_chargeset_exit:

cmp dword ptr [playerstats_shotset_enable], #0
je playerstats_shotset_exit
cmp dword ptr [ecx+610], #351
jg playerstats_shotset_exit
cmp dword ptr [ecx+610], #-1000
jl playerstats_shotset_exit
mov [playerstats_chargeset_enable], #0
mov [ecx+610], #396
playerstats_shotset_exit:

mov eax, [playerstats_temp1]
mov ebx, [playerstats_temp2]
mov ecx, [playerstats_temp3]
mov edx, [playerstats_temp4]


playerstats_originalcode:
readmem(playerstats_searchedAOB, 7)


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB:
playerstats_savedAOB:
jmp playerstats_newmem
nop
nop
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
readmem(playerstats_originalcode, 7)

unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)
dealloc(playerstats_temp1)
dealloc(playerstats_temp2)
dealloc(playerstats_temp3)
dealloc(playerstats_temp4)
dealloc(playerstats_temp5)"""

