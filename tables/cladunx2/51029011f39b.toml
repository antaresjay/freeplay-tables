[[cheat]]
id = "multiply-atk-stat"
name = "Multiply ATK stat"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(AtkMulti,256)
registersymbol(AtkMulti)
label(_ReturnAtk)

"CladunX2.exe"+6EBC0:
 jmp AtkMulti+4
_ReturnAtk:

AtkMulti:
 dd 1

 mov edx,[eax+34]
 imul edx,[AtkMulti]
 mov [ecx],edx

 jmp _ReturnAtk
 
[DISABLE]
"CladunX2.exe"+6EBC0:
 mov edx,[eax+34]
 mov [ecx],edx

unregistersymbol(AtkMulti)
dealloc(AtkMulti)"""

