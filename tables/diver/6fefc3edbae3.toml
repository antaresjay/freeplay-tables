[[cheat]]
id = "prepare-activate-first"
name = "Prepare ( Activate First )"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(prePlayer,GameAssembly.dll,48 8B 8B 10 01 00 00 48 85 C9 0F 84 ** ** ** ** 48 8B 01 48 8B 90 30 04 00 00 FF 90 28 04 00 00)
alloc(newmem,$1000,prePlayer)
label(code)
label(return)

label(bHealth)

newmem:
push rdx
push r13
mov rdx,[rcx+310]
test rdx,rdx
je code
mov r13,[rcx+1E8]
test r13,r13
je code

_hp:
cmp [rdx+28],1
jne code
cmp byte ptr [bHealth],1
jne code
mov dword ptr [r13+10],(int)999
jmp code



code:
pop r13
pop rdx
  mov rax,[rcx]
  mov rdx,[rax+00000430]
  call qword ptr [rax+00000428]
  jmp return

bHealth:
db 0


prePlayer+10:
  jmp far newmem
  nop 2
return:
registersymbol(prePlayer)
registersymbol(bHealth)
[DISABLE]
prePlayer+10:
  db 48 8B 01 48 8B 90 30 04 00 00 FF 90 28 04 00 00
unregistersymbol(prePlayer)
unregistersymbol(bHealth)
dealloc(newmem)"""

