[[cheat]]
id = "x-deep-black-v1-2-script"
name = "[X] <== Deep Black v1.2 Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
===========================================
 Game Title    : Deep Black
 Game Version  : 1.2
 Proces Name   : DeepBlack.exe
 Script Version: 1.0
 CE Version    : 6.1
 Release date  : 06-Mar-2012
 Author        : Recifense
 Features:
 - Unlimited Ammo
 - Unlimited Jet Power
 - God Mode
===========================================
}

[ENABLE]
//=========================================
// Check if script is compatible to this game version
// If false the script will not be loaded

assert(DeepBlack.exe+2785cf,2b d6 66 89 14 41)
assert(DeepBlack.exe+2d9763,d9 41 54 d9 58 54)
assert(DeepBlack.exe+2e0907,d8 95 ac 05 00 00)
assert(DeepBlack.exe+398f5a,d9 86 ac 05 00 00)

//=========================================
alloc(MyCode,1024)
//=========================================
// Declaration section
label(_MonAmmo)
label(_BackMA)
label(_ExitMA)
label(_MonReload)
label(_BackMR)
label(_ExitMR)
label(_MonPlayer)
label(_BackMP)
label(_ExitMP)
label(_MonHP)
label(_BackMH)
label(_ExitMH)
label(pUnit)
label(pPlayer)
label(iEnableMA)
label(iEnableMR)
label(iEnableGM)

//=========================================
// Registering Symbols
registersymbol(MyCode)
registersymbol(pUnit)
registersymbol(pPlayer)
registersymbol(iEnableMA)
registersymbol(iEnableMR)
registersymbol(iEnableGM)

//=========================================
MyCode:
//=========================================
_MonAmmo:
 push eax

 cmp dword ptr [iEnableMA],0
 je _ExitMA                        // Jump if feature is disabled

 xor esi,esi                       // value2decrease = 0

 mov eax,#200

 cmp edx,eax
 jge _ExitMA

 mov edx,eax

_ExitMA:
 pop eax

 sub edx,esi                       // Original code
 mov [ecx+eax*2],dx                // Original code
 jmp _BackMA                       // Back to main code

//=========================================
_MonReload:
 cmp dword ptr [iEnableMR],0
 je _ExitMR                        // Jump if feature is disabled

 mov edx,(float)3.0
 cmp edx,[ecx+54]
 jle _ExitMR

 mov [ecx+54],edx

_ExitMR:
 fld dword ptr [ecx+54]            // Original code
 fstp dword ptr [eax+54]           // Original code
 jmp _BackMR                       // Back to main code

//=========================================
_MonPlayer:
 mov [pPlayer],ebp

_ExitMP:
 fcom dword ptr [ebp+000005AC]     // Original code
 jmp _BackMP                       // Back to main code

//=========================================
_MonHP:
 cmp esi,[pPlayer]
 jne _ExitMH

 cmp dword ptr [iEnableGM],0
 je _ExitMH                        // Jump if feature is disabled

 mov eax,[esi+00000918]            // get max HP
 mov [esi+000005AC],eax            // Update current HP

 fstp st(0)
 fldz                              // value2decrese = 0

_ExitMH:
 fld dword ptr [esi+000005AC]      // Original code
 jmp _BackMH                       // Back to main code

//=========================================
 db '======================================>'
 db 'CE6.1 Script by Recifense 030612'
//=========================================
// Variables
iEnableMA:
 dd 1
iEnableMR:
 dd 1
iEnableGM:
 dd 1
pUnit:
 dd 0
pPlayer:
 dd MyCode

//=========================================
// Hacking Points
DeepBlack.exe+2785cf:
 jmp _MonAmmo
 nop
_BackMA:

DeepBlack.exe+2d9763:
 jmp _MonReload
 nop
_BackMR:

DeepBlack.exe+2e0907:
 jmp _MonPlayer
 nop
_BackMP:

DeepBlack.exe+398f5a:
 jmp _MonHP
 nop
_BackMH:

//=========================================
// Script for Restoring Original Codes
[DISABLE]
DeepBlack.exe+2785cf:
// sub edx,esi
// mov [ecx+eax*2],dx
 db 2b d6 66 89 14 41

DeepBlack.exe+2d9763:
// fld dword ptr [ecx+54]
// fstp dword ptr [eax+54]
 db d9 41 54 d9 58 54

DeepBlack.exe+2e0907:
// fcom dword ptr [ebp+000005AC]
 db d8 95 ac 05 00 00

DeepBlack.exe+398f5a:
// fld dword ptr [esi+000005AC]
 db d9 86 ac 05 00 00

//=========================================
// Unregistering Symbols
unregistersymbol(MyCode)
unregistersymbol(pUnit)
unregistersymbol(iEnableMA)
unregistersymbol(iEnableMR)
unregistersymbol(iEnableGM)
unregistersymbol(pPlayer)

//=========================================
dealloc(MyCode)
//============= Scripts End ===============

// ****************************************
// NOTES
// ****************************************
{
}"""

