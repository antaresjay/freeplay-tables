[[cheat]]
id = "main-character-ctrl-numpad-2-activate-this-script-during-fights-not-the-training-area"
name = "Main Character (Ctrl + Numpad 2) {Activate this script during fights. Not the training area}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Trakonius-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.4.4.0
// Game Version      : v0.30.2215 (Early Access)
// Script Date       : 2026-06-02


[ENABLE]

aobscanmodule(master,Trakonius-Win64-Shipping.exe,488BxxF2xxxxxxxxxx0F28xx0F29xxxxxxF2xxxxxxxxxxFF) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,9)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,9)

newmem:
  mov [data],rcx

code:
  readmem(master,9)
  jmp return

master:
  jmp newmem
  nop 4
return:

[DISABLE]

master:
  readmem(masterbkp,9)

unregistersymbol(*)
dealloc(*)"""

