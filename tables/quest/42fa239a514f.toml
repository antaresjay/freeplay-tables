[[cheat]]
id = "moonjump-enable-jump-1x"
name = "MoonJump (enable & jump 1x)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(MoonJump_AOB,Platform.mfx,8B ?? ?? ?? ?? ?? F7 ?? 89 ?? ?? ?? ?? ?? 66 ?? ?? C2)
alloc(newmem,$1000)
label(code)
label(return)
label(jumpH)
registersymbol(jumpH)
newmem:
code:
  mov [jumpH],eax
  mov ecx,[eax+000001A0]
  jmp return
jumpH:
db
MoonJump_AOB:
  jmp newmem
  nop
return:
registersymbol(MoonJump_AOB)
[DISABLE]
MoonJump_AOB:
  db 8B 88 A0 01 00 00
unregistersymbol(MoonJump_AOB)
dealloc(newmem)
unregistersymbol(jumpH)"""

