[[cheat]]
id = "gold-hp-hearts-lifes"
name = "GOLD/HP/HEARTS/LIFES"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(Player_Base,Castlevania Chronicles II - Simon's Quest.exe,8B ?? ?? ?? ?? ?? F2 ?? ?? ?? ?? ?? F7 ?? EB ?? 83 ?? ?? 74 ?? 83 ?? ?? 74 ?? 0F ?? ?? EB ?? F2 ?? ?? ?? ?? ?? ?? ?? EB ?? 66 ?? ?? ?? ?? ?? ?? ?? F3 ?? ?? ?? F2 ?? ?? ?? 89) // should be unique
alloc(newmem,$1000)
alloc(Player_Health_ON,1)
alloc(Player_Gold_ON,1)
alloc(Player_Hearts_ON,1)
alloc(Player_Lifes_ON,1)
registersymbol(Player_Health_ON)
registersymbol(Player_Gold_ON)
registersymbol(Player_Hearts_ON)
registersymbol(Player_Lifes_ON)
label(Player_Health_check)
label(Player_Gold_check)
label(Player_Hearts_check)
label(Player_Lifes_check)
label(Player_Health)
label(Player_Gold)
label(Player_Hearts)
label(Player_Lifes)
label(code)
label(return)
newmem:
  cmp byte ptr [esi+14],0C
  je Player_Health_check
  cmp byte ptr [esi+14],0F
  je Player_Gold_check
  cmp byte ptr [esi+14],0D
  je Player_Hearts_check
  cmp byte ptr [esi+14],0E
  je Player_Lifes_check
Player_Health_check:
  cmp byte ptr [Player_Health_ON],1
  jne code
  jmp Player_Health
Player_Gold_check:
  cmp byte ptr [Player_Gold_ON],1
  jne code
  jmp Player_Gold
Player_Hearts_check:
  cmp byte ptr [Player_Hearts_ON],1
  jne code
  jmp Player_Hearts
Player_Lifes_check:
  cmp byte ptr [Player_Lifes_ON],1
  jne code
  jmp Player_Lifes
Player_Health:
  mov word ptr [esi+000002B8],FD43
  mov eax,[esi+000002B8]
  jmp return
Player_Gold:
  mov word ptr [esi+000002B8],D8F0
  mov eax,[esi+000002B8]
  jmp return
Player_Hearts:
  mov byte ptr [esi+000002B8],9C
  mov eax,[esi+000002B8]
  jmp return
Player_Lifes:
  mov byte ptr [esi+000002B8],F6
  mov eax,[esi+000002B8]
  jmp return
code:
  mov eax,[esi+000002B8]
  jmp return
Player_Base:
  jmp newmem
  nop
return:
registersymbol(Player_Base)
[DISABLE]
Player_Base:
  db 8B 86 B8 02 00 00
unregistersymbol(Player_Base)
dealloc(newmem)
dealloc(Player_Health_ON,1)
dealloc(Player_Gold_ON,1)
dealloc(Player_Hearts_ON,1)
dealloc(Player_Lifes_ON,1)
unregistersymbol(Player_Health_ON)
unregistersymbol(Player_Gold_ON)
unregistersymbol(Player_Hearts_ON)
unregistersymbol(Player_Lifes_ON)"""

