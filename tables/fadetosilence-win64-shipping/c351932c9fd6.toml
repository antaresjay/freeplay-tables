[[cheat]]
id = "inf-item-consume"
name = "inf. item consume"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : FadeToSilence-Win64-Shipping.exe
  Version: 1.0.2025_Hotfix5
  Date   : 2025-06-14
  Author : Oyyzj

  have atleast 2
}

[ENABLE]

aobscanmodule(ItemUsage,FadeToSilence-Win64-Shipping.exe,44 29 49 40 41 8B C1) // should be unique
alloc(newmem,$100,ItemUsage)
registersymbol(ItemUsage)
label(code)
label(return)
label(rItemUsage)
registersymbol(rItemUsage)
newmem:
  cmp [rcx+40],2
  jl code
  cmp [rcx+40],3
  jg code
  sub r9d,0
  mov eax,r9d
  jmp return
code:
  readmem(ItemUsage,7)
  jmp return
rItemUsage:
  readmem(ItemUsage,7)
ItemUsage:
  jmp newmem
  db 90 90
return:


[DISABLE]

ItemUsage:
  readmem(rItemUsage,7)

unregistersymbol(*)
dealloc(*)"""

