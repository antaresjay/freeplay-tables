cmp dword ptr [Mecha_set_enable], #0
je Mecha_set_exit
mov [ebx+18], #99999
mov [ebx+1c], #99999
mov [ebx+24], #99999
Mecha_set_exit:

mov ebx, [Mecha_temp1]


Mecha_originalcode:
db 8B 40 14 8B 40 1C
//mov eax,[eax+14]
//mov eax,[eax+1C]


Mecha_exit:
jmp Mecha_returnhere


Mecha_searchedAOB:
Mecha_savedAOB:
jmp Mecha_newmem
nop
Mecha_returnhere:


[DISABLE]
Mecha_savedAOB:
db 8B 40 14 8B 40 1C
//mov eax,[eax+14]
//mov eax,[eax+1C]

unregistersymbol(Mecha_savedAOB)

dealloc(Mecha_newmem)
dealloc(Mecha_temp1)"""

