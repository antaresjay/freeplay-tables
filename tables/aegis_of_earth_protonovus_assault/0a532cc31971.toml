[[cheat]]
id = "activate-this-3"
name = "Activate This"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//Storeroom
label(aob_storeroom)
registersymbol(aob_storeroom)
alloc(newmem_storeroom,1024)
label(return_storeroom)

newmem_storeroom:
  mov [base_storeroom],eax
  cmp [set_storeroom],#0
  je @f
  mov word ptr [eax+08],#99
@@: //Original Code
  movsx eax,word ptr [eax+0A]
  test eax,eax
  jmp return_storeroom

GameParamManager:IsUsedItem+52:
aob_storeroom:
  jmp newmem_storeroom
  nop
return_storeroom:

//Mod Module
label(aob_modmodule)
registersymbol(aob_modmodule)
alloc(newmem_modmodule,1024)
label(return_modmodule)

newmem_modmodule:
  mov eax,[eax] //Original Code
  mov [base_modmodule],eax
  cmp [set_modmodule],#0
  je @f
  mov word ptr [eax+08],#99
@@:
  cmp [set_itemused],#0
  je @f
  mov word ptr [eax+0A],#1
@@: //Original Code
  movsx eax,word ptr [eax+08]
  jmp return_modmodule

GameParamManager:GetHaveItemCount+30:
aob_modmodule:
  jmp newmem_modmodule
  nop
return_modmodule:

[DISABLE]
//Storeroom
aob_storeroom:
  db 0F BF 40 0A 85 C0

unregistersymbol(aob_storeroom)
dealloc(newmem_storeroom)

//Mod Module
aob_modmodule:
  db 8B 00 0F BF 40 08

unregistersymbol(aob_modmodule)
dealloc(newmem_modmodule)"""

