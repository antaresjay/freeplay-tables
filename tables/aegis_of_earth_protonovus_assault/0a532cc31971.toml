unregistersymbol(set_crystals)
unregistersymbol(set_illuminite)"""

[[cheat]]
id = "activate-this"
name = "Activate This"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(aob_money)
registersymbol(aob_money)
alloc(newmem_money,1024)
label(return_money)

newmem_money:
  push ebx
  mov [base_player],eax
  cmp [set_money],#0
  je @f
  mov [eax+0C],#9999999
@@:
  mov ebx,[eax+8]
  cmp [set_illuminite],#0
  je @f
  mov [ebx+10],#9999999 //Illuminite
@@:
  cmp [set_crystals],#0
  je @f
  mov [ebx+14],#999 //Yellow
  mov [ebx+18],#999 //Red
  mov [ebx+1C],#999 //Blue
  mov [ebx+20],#999 //Green
  mov [ebx+24],#999 //Purple
  mov [ebx+28],#999 //Pure
  mov [ebx+2C],#999 //Colorless
@@:
  pop ebx
//Original Code
  mov ecx,[eax+0C]
  mov [ebp-10],ecx
  jmp return_money

UIBattleInformation:UpdateInfo_Resource+16:
aob_money:
  jmp newmem_money
  nop
return_money:
[DISABLE]
aob_money:
  db 8B 48 0C 89 4D F0

unregistersymbol(aob_money)
dealloc(newmem_money)"""

