alloc(set_crystals,4)
alloc(set_illuminite,4)
registersymbol(base_player)
registersymbol(set_money)
registersymbol(set_crystals)
registersymbol(set_illuminite)

[DISABLE]
dealloc(base_player)
dealloc(set_money)
dealloc(set_crystals)
