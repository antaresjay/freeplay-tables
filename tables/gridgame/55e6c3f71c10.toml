[[cheat]]
id = "hp"
name = "hp"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(hp,GridGame.exe,8B 8B E4 02 00 00 50) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov ecx,[ebx+000002E8]
  mov [ebx+000002E4],ecx
  jmp return

hp:
  jmp newmem
  nop
return:
registersymbol(hp)

[DISABLE]

hp:
  db 8B 8B E4 02 00 00

unregistersymbol(hp)
dealloc(newmem)"""

