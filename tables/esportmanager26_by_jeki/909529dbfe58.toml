[[cheat]]
id = "active-first-profiler-active-person-stats-profiler-highlight-player-or-staff"
name = "ACTIVE FIRST [Profiler] ACTIVE PERSON STATS PROFILER (Highlight Player or Staff)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmemPlayer, 1024, PlayerOverview_Init)
label(returnPlayer)

alloc(newmemStaff, 1024, StaffOverview_Init)
label(returnStaff)

newmemPlayer:
push rax
mov rax, pActivePlayer
mov [rax], rdx
pop rax
db 48 89 5C 24 08
jmp returnPlayer

PlayerOverview_Init:
jmp newmemPlayer
returnPlayer:

newmemStaff:
push rax
mov rax, pActivePlayer
mov [rax], rdx
pop rax
db 40 56 57 41 57
jmp returnStaff

StaffOverview_Init:
jmp newmemStaff
returnStaff:

[DISABLE]
PlayerOverview_Init:
db 48 89 5C 24 08

StaffOverview_Init:
db 40 56 57 41 57

dealloc(newmemPlayer)
dealloc(newmemStaff)"""

