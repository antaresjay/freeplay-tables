type = "script"
source = """
// Game Executable   : Egging On.exe
// Author            : ndck76
// Executable Version: 2022.3.62.28864
// Game Version      : v0.1.8724
// Script Date       : 2026-04-19


[ENABLE]

aobscanregion(crack,EggCoreData:TryPlayEggCrackNarratorAction,EggCoreData:TryPlayEggCrackNarratorAction+100,486391xxxx000048xxxx83xxxx9049BBxxxxxxxxxxxx000041xxxx48xxxx48xxxx74xx) //EggCoreData:TryPlayEggCrackNarratorAction+30
alloc(newmem,$1000,crack)
alloc(data2,8)
alloc(crackbkp,7)
registersymbol(data2)
registersymbol(crack)
registersymbol(crackbkp)
label(code)
label(return)

crackbkp:
  readmem(crack,7)

newmem:
  mov [data2],rcx

code:
  readmem(crack,7)
  jmp return

crack:
  jmp newmem
  nop 2
return:

[DISABLE]

crack:
  readmem(crackbkp,7)

unregistersymbol(*)
dealloc(*)"""

