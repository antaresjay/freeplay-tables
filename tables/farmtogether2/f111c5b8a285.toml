[[cheat]]
id = "farm-crop-always-done"
name = "Farm Crop Always Done"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : FarmTogether2.exe
  Version: 
  Date   : 2024-05-11
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(pBase_FarmCrop,GameAssembly.dll,89 7B 30 E8 66 EF DE FF) // should be unique
alloc(newmem,$1000,pBase_FarmCrop)

label(code)
label(return)

newmem:

code:
  mov edi,#1000000
  db 89 7B 30
  call GameAssembly.dll+3C1D30
  jmp return

pBase_FarmCrop:
  jmp newmem
  nop 3
return:
registersymbol(pBase_FarmCrop)

[DISABLE]

pBase_FarmCrop:
  db 89 7B 30 E8 66 EF DE FF

unregistersymbol(pBase_FarmCrop)
dealloc(newmem)"""

