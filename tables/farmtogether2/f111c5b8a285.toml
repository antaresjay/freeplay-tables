aobscanmodule(pData_HarvestTime,GameAssembly.dll,8B 80 E0 00 00 00 0F 57 C0 0F 57 D2) // should be unique
alloc(newmem,$1000,pData_HarvestTime)

aobscanmodule(pData_FarmAnimalFood,GameAssembly.dll,44 8B 43 20 45 33 C9 41) // should be unique
alloc(newmema,$1000,pData_FarmAnimalFood)

label(code)
label(return)

