[[cheat]]
id = "fps-main-script-ctrl-numpad-1"
name = "FPS Main Script (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : PROJECT;HYPATIOS.exe
// Author            : ndck76
// Executable Version: 2019.4.34.40878
// Game Version      : v1.6.2.3
// Script Date       : 2024-01-04


[ENABLE]

aobscanregion(soulpoint,FPSMainScript:Update,FPSMainScript:Update+200,486386xxxx000085xx0FxxxxxxxxxxC7xxxxxxxxxxxxxxxxxx48xxxxxx48xxxxxx5DC3) //FPSMainScript:Update+84
alloc(newmem,$1000,soulpoint)
alloc(data2,8)
alloc(soulpointbkp,7)
registersymbol(data2)
registersymbol(soulpoint)
registersymbol(soulpointbkp)
label(code)
label(return)

soulpointbkp:
  readmem(soulpoint,7)

newmem:
  mov [data2],rsi

code:
  readmem(soulpoint,7)
  jmp return

soulpoint:
  jmp newmem
  nop 2
return:

[DISABLE]

soulpoint:
  readmem(soulpointbkp,7)

unregistersymbol(*)
dealloc(*)"""

