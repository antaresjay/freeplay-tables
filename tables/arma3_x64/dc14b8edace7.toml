label(code_HitDamage_pID2)
label(return_HitDamage_pID)
//===================================================
getpIDAOB_newmem:
    pushfq
    push rcx
                 //rax = player/veh address
                 //rbx = world
                 //rsi = InGameUI
                 //r14 = AIunit/Unit
                 //r14+c8+8 = soldier add
             //0000027D12D5B000
             //00007FF6887E00F8
       cmp rax,[_fffff]              //check if valid address
       jl code
       cmp rax,[_fffff+8]            //check if valid address
       jg code
       cmp rdi,[_fffff]              //check if valid address
       jl code
       cmp rdi,[_fffff+8]            //check if valid address
       jg code
       cmp r14,[_fffff]              //check if valid address
       jl code
       cmp r14,[_fffff+8]            //check if valid address
       jg code
          mov [_pID],rax    //get soldier/veh  ID address
          mov [_pID+8],rbp    //save add
          mov [_pID+18],rdi    //get player ID
          mov [_pID+20],r14    //get pID Main AIUNIT base Address
          mov [_pID+28],rbx    //get world ID address

        lea rcx,[_pID]
        mov [_pID+10],rcx    //set base range

    code:
    pop rcx
    popfq
        lea rcx,[r14+000000D0]            //orig code  rax is rhe pID
        jmp return           //orig code

//===================================================
HitDamage_pID_newmem:
          push rdi                   //orig code
          sub rsp,20                 //orig code

        pushfq
        push rcx
            //  mov [_HitDamage_pID],rdi        //get address for testing
            //  mov [_HitDamage_pID+8],r14      //get address for testing

            cmp rax,[_pID+10]                   //cmp PID add valid
            jg code_HitDamage_pID

        //**get Hitdamage address #1
            test rdi,rdi                     //check if PID is valid
            jz code_HitDamage_pID2
            cmp rdi,[_fffff]                   //check if add is valid
            jl code_HitDamage_pID2

              mov rcx,[rdi+4d8]
            cmp rcx,[_pID+10]                   //cmp PID is valid
            jg code_HitDamage_pID2
              mov rcx,[rcx+8]
            cmp rcx,[_pID+10]                   //cmp PID is valid
            jg code_HitDamage_pID2
               mov [_HitDamage_pID],rcx           //get Hitdamage address #1
              mov qword ptr[_HitDamage_pID+8],0   //reset Hitdamage address #2
            jmp code_HitDamage_pID

         //**get Hitdamage address #2
         code_HitDamage_pID2: //===============
            test r14,r14                   //check PID add valid
            jz code_HitDamage_pID
            cmp r14,[_fffff]                   //check if add is valid
            jl code_HitDamage_pID

              mov rcx,[r14+4d8]
            cmp rcx,[_pID+10]                     //check if PID is valid
            jg code_HitDamage_pID
              mov rcx,[rcx+8]
            cmp rcx,[_pID+10]                     //check if PID is valid
            jg code_HitDamage_pID
               mov [_HitDamage_pID+8],rcx         //get Hitdamage address #2
              mov qword ptr[_HitDamage_pID],0     //reset Hitdamage address #1

        code_HitDamage_pID: //=============
        pop rcx
        popfq
          jmp return_HitDamage_pID   //orig code
//===================================================
_fffff:                         //setting a valid address check
  db F0 FF FF FF 00 00 00 00    //setting a valid address check
_fffff+8:                       //setting a valid address check
  db F0 FF FF FF FF FF 00 00    //setting a valid address check
