[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(aobInfiniteHealth,Eldritch.exe,89 46 08 0F 8F DA 00 00 00)
alloc(newmem,$40)
label(code)
label(originalcode)
label(return)

newmem:

code:
  pushf
  cmp [esi+48],#40
  jne originalcode
  popf
  mov eax,[esi+C]
  mov [esi+08],eax
  jg Eldritch.exe+5242B
  jmp return

originalcode:
  popf
  mov [esi+08],eax
  jg Eldritch.exe+5242B
  jmp return

aobInfiniteHealth:
  jmp code
  nop
  nop
  nop
  nop
return:
registersymbol(aobInfiniteHealth)

[DISABLE]

aobInfiniteHealth:
  db 89 46 08 0F 8F DA 00 00 00

unregistersymbol(aobInfiniteHealth)
dealloc(newmem)"""

