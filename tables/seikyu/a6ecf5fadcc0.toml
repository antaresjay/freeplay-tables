[[cheat]]
id = "disable-time"
name = "Disable Time"
category = "game"
description = ""
hint = ""
type = "script"
source = """
define(address,ACEGame.WorldTimeManager.CalculateTime)
define(bytes,40 53 48 81 EC B0 00 00 00)

[ENABLE]
//Send@Sintrix|FearlessRevolution
assert(address,bytes)
alloc(newmem,$1000,ACEGame.WorldTimeManager.CalculateTime)

label(code)
label(return)

newmem:
mov [rcx+30],(float)0

code:
  push rbx
  sub rsp,000000B0
  jmp return

address:
  jmp newmem
  nop 4
return:
//Send@Sintrix|FearlessRevolution
[DISABLE]

address:
  db bytes

dealloc(*)"""

