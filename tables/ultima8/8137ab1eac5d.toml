name = "Find Avatar (Ultima 8 v2.12.1 w/Flags)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(avatar,$process,* * * * * * * * * * * 0F B6 04 08 0F B6 C0 83)
alloc(CharAdr,4)
registersymbol(CharAdr,avatar)

CharAdr:
