[[cheat]]
id = "infinite-oxygen"
name = "Infinite Oxygen"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscan(oxygen,48 8B 44 D0 10 C4 E1 7A 10 40 08)
alloc(newmem,$1000,oxygen)

label(code)
label(return)

newmem:
code:
  mov rax, [rax+rdx*8+10]
  mov [rax+08], (float)1.0
  jmp return

oxygen:
  jmp newmem
return:
registersymbol(oxygen)

[DISABLE]

oxygen:
  db 48 8B 44 D0 10

unregistersymbol(oxygen)
dealloc(newmem)"""
