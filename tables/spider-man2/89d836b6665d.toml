[[cheat]]
id = "air-supply-spider-bot-jump-jets"
name = "Air Supply   [Spider-Bot]   Jump Jets"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(_jump_jets,$process,C5 FA 10 8B 10 03 00 00 * * * * 40)
alloc(newmem,$100,_jump_jets)
label(return)
registersymbol(_jump_jets)
newmem:
  mov [rbx+310],(float)100
  vmovss xmm1,[rbx+310]
  jmp return
_jump_jets:
  jmp newmem
  nop 3
return:
[DISABLE]
dealloc(*)
unregistersymbol(*)
_jump_jets:
  db C5 FA 10 8B 10 03 00 00"""

