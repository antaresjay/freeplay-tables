type = "script"
source = """
[ENABLE]


aobscan(lives,8B B0 84 02 00 00 85 FF) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:
cmp ebx,1
jne @f


  mov [eax+284],3

code:
  mov esi,[eax+284]
  jmp return

lives:
  jmp newmem
  nop
return:
registersymbol(lives)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
lives:
  db 8B B0 84 02 00 00

unregistersymbol(lives)
dealloc(newmem)"""
