[[cheat]]
id = "undead"
name = "Undead"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(aob_undead,83 C4 1C 8B 45 F0 F3 0F 10 45 08 F3 0F 11 40 14)
registersymbol(aob_undead)

alloc(newmem,1024) //2kb should be enough
label(returnhere)
label(originalcode)
label(exit)
label(doUndead)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
/*cmp [edx+8],3
jne originalcode
//movss ecx,xmm0*/
cmp [pPlayerHealth],eax
je doUndead
cmp [pCompanionHealth],eax
je doUndead
jmp originalcode

doUndead:
cmp [ebp+08],(float)1
jle exit

originalcode:
movss [eax+14],xmm0

exit:
jmp returnhere

// 1.00 - "Dungeon Siege III.exe"+5479D2:
// Update1 - "Dungeon Siege III.exe"+54B332:
aob_undead+B:
jmp newmem
returnhere:


[DISABLE]
dealloc(newmem)
// 1.00 - "Dungeon Siege III.exe"+5479D2:
// Update1 - "Dungeon Siege III.exe"+54B332:
aob_undead+B:
db F3 0F 11 40 14
//Alt: movss [eax+14],xmm0
unregistersymbol(aob_undead)"""

