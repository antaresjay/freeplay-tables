type = "script"
source = """
{ Game   : FINAL FANTASY III.exe
  Version: 
  Date   : 2021-08-01
  Author : Cray

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(encountRateIndex,GameAssembly.dll,01 6F 28 8B 47 24) // should be unique
alloc(newmem,$128,encountRateIndex)

registersymbol(encountRateEnable)
registersymbol(encountRateSet)
label(encountRateEnable)
label(encountRateSet)
label(code)
label(changeRate)
label(finish)
label(return)

newmem:

code:
  cmp [encountRateEnable],1
  je changeRate

  //add [rdi+28],ebp
  mov r15,ebp
  jmp finish

changeRate:
  mov r15,[encountRateSet]
  jmp finish

finish:
  add [rdi+28],r15
  mov r15,0
  mov eax,[rdi+24]
  mov [encountRateEnable],0
  jmp return


encountRateEnable:
  dq 1
encountRateSet:
  dq 0

encountRateIndex:
  jmp newmem
  nop
return:
registersymbol(encountRateIndex)


[DISABLE]

encountRateIndex:
  db 01 6F 28 8B 47 24

unregistersymbol(encountRateIndex)
unregistersymbol(encountRateSet)
dealloc(newmem)

