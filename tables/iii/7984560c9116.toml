[[cheat]]
id = "reciever-manipulator"
name = "Reciever Manipulator"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,"Diablo III.exe"+92E56B)
define(bytes,89 48 08 8B 4D F4)

[ENABLE]
assert(address,bytes)
alloc(newmem,$1000)

label(return)
label(vSave)
label(vPoint)

// Labels handling Stats Freez
label(fMon)
registerSymbol(fMon)
label(fMon2)
registerSymbol(fMon2)
label(iMon)
registerSymbol(iMon)
// Labels handling Stats Change
label(fChng)
registerSymbol(fChng)
label(fRes)
registerSymbol(fRes)
label(iChng)
registerSymbol(iChng)
label(iRes)
registerSymbol(iRes)

newmem:
    mov [vSave],ecx // Backup
    mov ecx,[eax+08]
    //mov [vPoint],ecx
    //mov ecx,[vPoint+0008]

    cmp ecx,[fMon]
    jne L1
    jmp L3
  L1:
    cmp ecx,[fMon2]
    jne L2
    jmp L3
  L2:
    cmp ecx,[iMon]
    jne L4
    jmp L3
  L4:
    mov ecx,[fChng]
    mov [temp],ecx

    sub [hold],#20 //allocate 20bytes for local storage (original xmm0 register(16) and temp float value(4))
    movdqu [hold],xmm0 //save xmm0 (128 bit register, so 16 bytes)
    mov [hold+10],(float)0.01 //prepare an address with the float value 50000
    movss xmm0,[hold+10] //write the float value into xmm0 (note that the upper bits of xmm0 will get erased by doing this, which is why we use movdqu to save it and not movss)
    addss xmm0,[temp] //increase xmm0 with the float value at edx+c4
    movss [temp],xmm0 //write the result of the calculation to edx+c4
    movss xmm0,[hold] //restore with original
    add [hold],#20 //free local variable space

    mov ecx,[vSave] // Restore
    cmp ecx,[fChng]
    jl L5
    cmp ecx,[temp]
    jg L5
    mov ecx,[fRes]
    jmp L3
  L5:
    cmp ecx,[iChng]
    jne L3
    mov ecx,[iRes]
    jmp L3
  L3:
    mov [eax+08],ecx
    mov ecx,[ebp-0C]
    jmp return

  vPoint:
    dd 0
  vSave:
    dd 0
  fMon:
    dd (float)-1
  fMon2:
    dd (float)-1
  iMon:
    dd (int)9999999
  fChng:
    dd (float)-1
  fRes:
    dd (float)1
  iChng:
    dd (int)9999999
  iRes:
    dd (int)1
  temp:
   dd (float)0
  hold:
   dd (float)0

address:
  jmp newmem
  nop
return:

[DISABLE]

address:
  db bytes
  // mov [eax+08],ecx
  // mov ecx,[ebp-0C]

unregistersymbol(iRes)
unregistersymbol(fRes)
unregistersymbol(iChng)
unregistersymbol(fChng)
unregistersymbol(iMon)
unregistersymbol(fMon2)
unregistersymbol(fMon)
dealloc(newmem)"""

