[[cheat]]
id = "infinite-health-p1"
name = "Infinite Health P1"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(InfiniteHealthP1)
label(originalcode)
label(Exit)
registersymbol(InfiniteHealthP1)
aobscan(Hook, 7E 06 89 BE 05 DF 00 00)
aobscan(NotP1, 5F 5E 5D 5B C3 90 90)

newmem:
cmp [esi+00002220],03
je originalcode
jmp NotP1

originalcode:
mov [esi+0000DF05],edi
jmp Exit

Hook:
InfiniteHealthP1:
jmp newmem
nop
nop
nop

Exit:

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
InfiniteHealthP1:
db 7E 06 89 BE 05 DF 00 00
unregistersymbol(InfiniteHealthP1)"""

