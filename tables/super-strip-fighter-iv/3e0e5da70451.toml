[[cheat]]
id = "one-hit-kills-p2-might-take-2-hits-with-normal-attacks"
name = "One Hit Kills P2 (Might take 2 hits with normal attacks.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048) //2kb should be enough
aobscan(Hook, 89 8E 05 DF 00 00 2B D0 C7 86 29 DF 00 00 14 00 00 00)
label(originalcode) //Original Code
label(OneHitKill) //Label for Symbol
label(exit) //Return
registersymbol(OneHitKill) //Register Symbol

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
cmp [esi+00002220],03 //Compare to see if this is player 1
je originalcode //If it is lets run original code
mov [esi+0000DF05],00 //Otherwise lets kill player 2 now
jmp exit //Jump to Return

originalcode:
mov [esi+0000DF05],ecx //Execute Original Code
jmp exit //Jump to Return

Hook:
OneHitKill:
jmp newmem //Call Custom Routine
nop //Balance Instruction

exit: //Lets get out of here

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem) //Destroy Custom Routine
OneHitKill:
db 89 8E 05 DF 00 00 //Restore Original Instruction
unregistersymbol(OneHitKill) //Unregister Symbol"""

