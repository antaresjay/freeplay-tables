source = """
{ Game   : TEW2.exe
  Version: 
  Date   : 2017-10-16
  Author : Kalas

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(_HeroHealth,TEW2.exe,F3 0F 11 89 C4 0B 00 00)
alloc(newmem,$100,TEW2.exe)

alloc(_HeroHealthSet, 08)
registersymbol(_HeroHealthSet)
_HeroHealthSet:
  dd 0

label(code)
label(return)
label(PlayerCheck)

newmem:
  movss [rcx+00000BC4],xmm1

  cmp rdx,0000000000000013
  je PlayerCheck
  jmp code

PlayerCheck:
  cmp dword ptr [_HeroHealthSet], 0
  je code
  fld [rcx+BC0]
  fstp [rcx+BC4]

code:
  jmp return

_HeroHealth:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(_HeroHealth)

// Stamina //

aobscanmodule(_Stamina,TEW2.exe,F3 0F 11 8B D8 17 00 00 83 8B E8 5C 00 00 04 E9)
alloc(newmemV2,$100,TEW2.exe)

alloc(_StaminaSet, 08)
registersymbol(_StaminaSet)
_StaminaSet:
  dd 0

label(codeV2)
label(returnV2)

newmemV2:
  movss [rbx+000017D8],xmm1

  cmp dword ptr [_StaminaSet], 0
  je @f
  push rcx
  mov rcx, (float)999
  mov [rbx+17D8], rcx
  pop rcx

codeV2:
  jmp returnV2

_Stamina:
  jmp newmemV2
  nop
  nop
  nop
returnV2:
registersymbol(_Stamina)

[DISABLE]

// PlayerHealth

_HeroHealth:
  db F3 0F 11 89 C4 0B 00 00

unregistersymbol(_HeroHealth)
dealloc(newmem)

unregistersymbol(_HeroHealthSet)
dealloc(_HeroHealthSet)

// Stamina //

_Stamina:
  db F3 0F 11 8B D8 17 00 00

unregistersymbol(_Stamina)
dealloc(newmemV2)

unregistersymbol(_StaminaSet)
dealloc(_StaminaSet)"""

