type = "script"
source = """
{ Game   : TEW2.exe
  Version:
  Date   : 2017-10-29
  Author : Kalas

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(_EnemiesTeleportXCoord,TEW2.exe,0F 28 98 20 01 00 00 0F 29 44)
alloc(newmem,$1000,TEW2.exe)
alloc(Store, 256)

alloc(SaveF, 08)
alloc(LoadF, 08)
registersymbol(SaveF)
registersymbol(LoadF)

registersymbol(XPos)
registersymbol(YPos)
registersymbol(ZPos)
{registersymbol(SaveF)
registersymbol(LoadF)}

label(code)
label(return)
label(XPos)
label(YPos)
label(ZPos)
{label(SaveF)
label(LoadF)}
label(Save)
label(Load)

Store:

XPos:
  dd 0

YPos:
  dd 0

ZPos:
  dd 0

SaveF:
  dd 0

LoadF:
  dd 0

newmem:
  cmp dword ptr [SaveF], 1
  je Save
  cmp dword ptr [LoadF], 1
  je Load
  jmp code

Save:
  cmp [rax+0C], 0 // Player
  je code // Save Enemies Coords
  mov [SaveF], 0
  push rbx
  mov rbx, [rax+120]
  mov [XPos], rbx
  mov rbx, [rax+124]
  mov [YPos], rbx
  mov rbx, [rax+128]
  mov [ZPos], rbx
  pop rbx
  jmp code

Load:
  cmp [rax+0C], 0 // Player
  jne code // Load Enemies Coords
  push rbx
  mov rbx, [XPos]
  mov [rax+120], rbx
  mov rbx, [YPos]
  mov [rax+124], rbx
  mov rbx, [ZPos]
  mov [rax+128], rbx
  pop rbx
  jmp code

code:
  movaps xmm3,[rax+00000120]
  jmp return

_EnemiesTeleportXCoord:
  jmp newmem
  nop
  nop
return:
registersymbol(_EnemiesTeleportXCoord)

[DISABLE]

_EnemiesTeleportXCoord:
  db 0F 28 98 20 01 00 00

unregistersymbol(_EnemiesTeleportXCoord)
dealloc(newmem)

unregistersymbol(XPos)
unregistersymbol(YPos)
unregistersymbol(ZPos)
unregistersymbol(SaveF)
unregistersymbol(LoadF)

dealloc(SaveF)
dealloc(LoadF)"""

