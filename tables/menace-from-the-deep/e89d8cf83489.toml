[[cheat]]
id = "hero-properties-ui-ctrl-numpad-1-use-energy-to-populate-values"
name = "Hero Properties UI (Ctrl + Numpad 1) {Use energy to populate values}"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Menace from the Deep.exe
// Author            : ndck76
// Executable Version: 2022.3.6.59111
// Game Version      : v1.0
// Script Date       : 2024-11-12


[ENABLE]

aobscanregion(energyafter,Battle.HeroPropertiesUI:UpdateHeroProperties,Battle.HeroPropertiesUI:UpdateHeroProperties+100,496387xxxx000041xxxxxxxxxxxx48xxxxxx41xxxxxxxxxxxx49xxxx66xxxx49BBxxxxxxxxxxxx0000) //Battle.HeroPropertiesUI:UpdateHeroProperties+17
alloc(newmem,$1000,energyafter)
alloc(data2,8)
alloc(energyafterbkp,7)
registersymbol(data2)
registersymbol(energyafter)
registersymbol(energyafterbkp)
label(code)
label(return)

energyafterbkp:
  readmem(energyafter,7)

newmem:
  mov [data2],r15

code:
  readmem(energyafter,7)
  jmp return

energyafter:
  jmp newmem
  nop 2
return:

[DISABLE]

energyafter:
  readmem(energyafterbkp,7)

unregistersymbol(*)
dealloc(*)"""

