//Are you here to look at the code, and see how it works?
//You may have to obtain permission from Etzie regarding this particular code located below (pPlayer)

//Since this table is built on an open-source foundation, encompassing 99% of its structure, you are encouraged to update, enhance, and expand upon it as needed; sharing it as an update
