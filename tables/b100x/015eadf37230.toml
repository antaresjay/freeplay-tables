[[cheat]]
id = "disable-anti-cheat"
name = "Disable Anti-Cheat"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@Sintrix
[ENABLE]

aobscanmodule(actk,GameAssembly.dll,0F B6 40 52 48 83 C4 28)
alloc(newmem,$1000,actk)

label(code return)


newmem:
mov [rax+20],0
mov [rax+24],0
mov [rax+28],1
mov [rax+30],0
mov [rax+31],0
mov [rax+40],0
mov [rax+50],0
mov [rax+51],0
mov [rax+52],0

code:
  movzx eax,byte ptr [rax+52]
  add rsp,28
  jmp return

actk:
  jmp newmem
  nop 3
return:
registersymbol(actk)

[DISABLE]

actk:
  db 0F B6 40 52 48 83 C4 28

unregistersymbol(*)
dealloc(*)"""

[[cheat]]
id = "gain-999-999-999-junk-after-mission"
name = "Gain 999,999,999 Junk After Mission"
category = "game"
description = ""
hint = ""
type = "script"
source = """
//Send@Sintrix
[ENABLE]

aobscanmodule(earnedjunk,GameAssembly.dll,0F 10 81 B4 00 00 00 8B 81)
alloc(newmem,$1000,earnedjunk)
