[[cheat]]
id = "dnd-daggerdale-script"
name = "<-- DnD Daggerdale Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
===========================================
 Dungeons and Dragons Daggerdale
 Game Version  : 1.0.6165.0
 Script Version: 1.0
 CE Version    : 6.0
 God Mode and Gold
 31-May-2011
 By Recifense
===========================================
}

[ENABLE]
//=========================================
// Check if script is compatible to this game version
// If false the script will not be loaded

assert(DnDGame.exe+00dc45e9,83 b9 d0 02 00 00 00)
assert(DnDGame.exe+0004757d,8b 44 24 10 29 03)

//=========================================
alloc(MyCode,1024)
//=========================================
// Declaration section
label(_MonHero)
label(_BackMH)
label(_ExitMH)
label(_GodMode)
label(_BackGM)
label(_ExitGM)
label(pHP)
label(pHero)
label(iEnableGM)
label(iMinGold)

registersymbol(MyCode)
registersymbol(pHP)
registersymbol(pHero)
registersymbol(iEnableGM)
registersymbol(iMinGold)

//=========================================
MyCode:
//=========================================
_MonHero:
 cmp byte ptr [ecx+0000056c],0
 jne _ExitMH

 mov [pHero],ecx                   // Save ptr for debugging
 lea ecx,[ecx+000002D0]
 mov [pHP],ecx                     // Save ptr for further use
 mov ecx,[pHero]

_ExitMH:
 cmp dword ptr [ecx+000002D0],00   // Original code
 jmp _BackMH                       // Back to main code

//=========================================
_GodMode:
 cmp dword ptr [iEnableGM],0
 je _ExitGM                        // Jump if feature is disabled

 cmp ebx,[pHP]                     // Hero's HP ?
 jne _ExitGM                       // Jump if false

 mov eax,[ebx+04]                  // Get max HP
 mov [ebx],eax                     // Make cur HP = max HP
 xor eax,eax
 mov,[esp+10],eax                  // Make value2decrease = 0

_ExitGM:
 mov eax,[esp+10]                  // Original code
 sub [ebx],eax                     // Original code
 jmp _BackGM                       // Back to main code

//=========================================
// Variables
iEnableGM:
 dd 1
pHP:
 dd 0
pHero:
 dd 0
iMinGold:
 dd 0

//=========================================
// Hacking Points
DnDGame.exe+00dc45e9:
 jmp _MonHero
 nop
 nop
_BackMH:

DnDGame.exe+0004757d:
 jmp _GodMode
 nop
_BackGM:

//=========================================
// Original Codes
[DISABLE]
DnDGame.exe+00dc45e9:
 cmp dword ptr [ecx+000002D0],00

DnDGame.exe+0004757d:
 mov eax,[esp+10]
 sub [ebx],eax

unregistersymbol(MyCode)
unregistersymbol(pHP)
unregistersymbol(pHero)
unregistersymbol(iEnableGM)
unregistersymbol(iMinGold)

dealloc(MyCode)"""

