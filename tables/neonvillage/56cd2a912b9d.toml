// ---------- INJECTING HERE ----------
Player:AddCoin: 55           - push rbp
// ---------- DONE INJECTING  ----------
Player:AddCoin+1: 48 8B EC     - mov rbp,rsp
Player:AddCoin+4: 48 83 EC 40  - sub rsp,40
Player:AddCoin+8: 48 89 7D F0  - mov [rbp-10],rdi
Player:AddCoin+c: 4C 89 7D F8  - mov [rbp-08],r15
Player:AddCoin+10: 4C 8B F9     - mov r15,rcx
Player:AddCoin+13: 48 8B FA     - mov rdi,rdx
Player:AddCoin+16: 4C 89 45 E8  - mov [rbp-18],r8
Player:AddCoin+1a: 49 8B 47 10  - mov rax,[r15+10]
Player:AddCoin+1e: 48 8B D0     - mov rdx,rax
Player:AddCoin+21: 48 63 48 18  - movsxd  rcx,dword ptr [rax+18]
}"""

