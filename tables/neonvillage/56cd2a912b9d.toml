{ Game   : NeonVillage.exe
  Version: 0.7.0.1
  Date   : 2025-08-31
  Author : DANGER DASH

  This script does blah blah blah
}

define(address,Player:AddCoin)
define(bytes,55 48 8B EC 48 83 EC 40)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Player:AddCoin)

label(code)
label(return)

newmem:
mov [player_add_coin_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,40
  jmp return

player_add_coin_ptr:
dq 0

address:
  jmp newmem
  nop 3
return:
registersymbol(player_add_coin_ptr)

[DISABLE]

address:
  db bytes
  // push rbp
  // mov rbp,rsp
  // sub rsp,40

dealloc(newmem)
unregistersymbol(player_add_coin_ptr)
{
// ORIGINAL CODE - INJECTION POINT: Player:AddCoin

1E20888823C: 00 00        - add [rax],al
