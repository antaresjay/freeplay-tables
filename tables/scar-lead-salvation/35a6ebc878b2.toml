id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
define(address,Matilda.PlayerAttributeSet.ChangeAttributeEvent)
define(bytes,F3 0F 11 5C 24 20)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Matilda.PlayerAttributeSet.ChangeAttributeEvent)
//Send@Sintrix|FearlessRevolution
label(code)
label(return)

newmem:
push rcx
mov rcx,[rcx+30]
mov [rcx+14],(float)99999
pop rcx

code:
  movss [rsp+20],xmm3
  jmp return

address:
  jmp newmem
  nop
return:

[DISABLE]

address:
  db bytes


