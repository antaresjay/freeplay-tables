[[cheat]]
id = "right-click-here-change-script-for-info"
name = "RIGHT CLICK HERE -> Change script for info"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
Wassup everybody? Here's my rendition of a table for the Turok-Rerelease by
Nightdive Studios on steam. I've made this with Steam Build #1548639, but
it might work with other versions too.

Included are the following offsets and pointer scans:
* Lifes
* Life shards (you know, these things which give you one extra life once
               you've collected 100)
* Health
* Tek-Armor (It seems 1 point Tek armor equals "3")
* Arrows
* Tek-Arrows
* Pistol/Rifle ammo
* Shells
* Explosive Shells
* Energy ammo
* Minigun ammo
* Grenades
* Rockets
* Fusion cannon ammo

Aaaaand I've included a few scripts:

* No damage (health) - AKA "God mode": It seems to be working. The initial
  script made non-moving enemy respawns and unfinishable bosses. After including
  a second check everything seems to be working fine.

* Unlimited Tek-Armor: What it says. You can still increase your armor with
  pickups.

* Keep health at 200: What it says. Uses a constantly running instruction
  to continuously reset your health to 200.

* Keep health at 999: What it says. Uses a constantly running instruction
  to continuously reset your health to 999. 999. For that little extra if
  you're afraid.

* Keep ammo at 200: No matter which weapon you hold, you'll always have
  200 ammo in it. Will of course override how much ammo you've had up to
  that point.

Enjoy!
}
[ENABLE]
[DISABLE]"""

