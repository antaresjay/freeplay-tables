source = """
[ENABLE]

aobscanmodule(mystamina,GameAssembly.dll,F3 0F 10 73 24 F3 0F 11 B4 24 80 00 00 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov [rbx+24], (float)1
code:
  movss xmm6,[rbx+24]
  movss [rsp+00000080],xmm6
  jmp return

mystamina:
  jmp far newmem
return:
registersymbol(mystamina)

[DISABLE]

mystamina:
  db F3 0F 10 73 24 F3 0F 11 B4 24 80 00 00 00

unregistersymbol(mystamina)
