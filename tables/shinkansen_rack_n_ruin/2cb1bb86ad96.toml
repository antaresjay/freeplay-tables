[[cheat]]
id = "rnrinventoryitem-base-address-scan-initialization-activate-this-first"
name = "RNRInventoryItem Base Address Scan Initialization (Activate This First)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(RNRInventoryItem_basepointer)
registersymbol(RNRInventoryItem_update_enable)
registersymbol(RNRInventoryItem_set_enable)

alloc(RNRInventoryItem_basepointer, 4)
alloc(RNRInventoryItem_update_enable, 4)
alloc(RNRInventoryItem_set_enable, 4)


[DISABLE]
unregistersymbol(RNRInventoryItem_basepointer)
unregistersymbol(RNRInventoryItem_update_enable)
unregistersymbol(RNRInventoryItem_set_enable)

dealloc(RNRInventoryItem_basepointer)
dealloc(RNRInventoryItem_update_enable)
dealloc(RNRInventoryItem_set_enable)"""

[[cheat]]
id = "rnrinventoryitem-base-address-scan-to-activate-use-consumable-to-update-use-consumable"
name = "RNRInventoryItem Base Address Scan (To Activate: Use Consumable, To Update: Use Consumable)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(RNRInventoryItem_savedAOB)
label(RNRInventoryItem_returnhere)
label(RNRInventoryItem_originalcode)
label(RNRInventoryItem_exit)

label(RNRInventoryItem_update_exit)
label(RNRInventoryItem_set_exit)

registersymbol(RNRInventoryItem_savedAOB)

//0486E4D4 - 83 EC 04              - sub esp,04
//0486E4D7 - 8B 7D 08              - mov edi,[ebp+08]
// INVConsumable:DecrementCount+a
//0486E4DA - 8B 47 20              - mov eax,[edi+20]
//0486E4DD - 48                    - dec eax
//0486E4DE - 89 47 20              - mov [edi+20],eax
//0486E4E1 - 89 45 F8              - mov [ebp-08],eax
//0486E4E4 - 83 EC 0C              - sub esp,0C
//0486E4E7 - 57                    - push edi
aobscan(RNRInventoryItem_searchedAOB, 8B 47 20 48 89 47 20 89 45 F8)

alloc(RNRInventoryItem_newmem, 2048)


RNRInventoryItem_newmem:
cmp dword ptr [RNRInventoryItem_update_enable], #0
je RNRInventoryItem_update_exit
mov [RNRInventoryItem_basepointer], edi
RNRInventoryItem_update_exit:

cmp dword ptr [RNRInventoryItem_set_enable], #0
je RNRInventoryItem_set_exit
mov eax, [edi+28]
inc eax
mov [edi+20], eax
RNRInventoryItem_set_exit:


RNRInventoryItem_originalcode:
db 8B 47 20 48 89 47 20
//mov eax,[edi+20]
//dec eax
//mov [edi+20],eax


RNRInventoryItem_exit:
jmp RNRInventoryItem_returnhere


RNRInventoryItem_searchedAOB:
RNRInventoryItem_savedAOB:
jmp RNRInventoryItem_newmem
nop
nop
RNRInventoryItem_returnhere:


[DISABLE]
RNRInventoryItem_savedAOB:
db 8B 47 20 48 89 47 20
//mov eax,[edi+20]
//dec eax
//mov [edi+20],eax

unregistersymbol(RNRInventoryItem_savedAOB)

dealloc(RNRInventoryItem_newmem)"""

