[[cheat]]
id = "rnrplayer-base-address-scan-initialization-activate-this-first"
name = "RNRPlayer Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(RNRPlayer_basepointer)
registersymbol(RNRPlayer_update_enable)
registersymbol(RNRPlayer_set_enable)
registersymbol(RNRPlayer_healthset_enable)
registersymbol(RNRPlayer_manaset_enable)
registersymbol(RNRPlayer_inventoryset_enable)
registersymbol(RNRPlayer_invulnerableset_enable)

alloc(RNRPlayer_basepointer, 4)
alloc(RNRPlayer_update_enable, 4)
alloc(RNRPlayer_set_enable, 4)
alloc(RNRPlayer_healthset_enable, 4)
alloc(RNRPlayer_manaset_enable, 4)
alloc(RNRPlayer_inventoryset_enable, 4)
alloc(RNRPlayer_invulnerableset_enable, 4)


[DISABLE]
unregistersymbol(RNRPlayer_basepointer)
unregistersymbol(RNRPlayer_update_enable)
unregistersymbol(RNRPlayer_set_enable)
unregistersymbol(RNRPlayer_healthset_enable)
unregistersymbol(RNRPlayer_manaset_enable)
unregistersymbol(RNRPlayer_inventoryset_enable)
unregistersymbol(RNRPlayer_invulnerableset_enable)

dealloc(RNRPlayer_basepointer)
dealloc(RNRPlayer_update_enable)
dealloc(RNRPlayer_set_enable)
dealloc(RNRPlayer_healthset_enable)
dealloc(RNRPlayer_manaset_enable)
dealloc(RNRPlayer_inventoryset_enable)
dealloc(RNRPlayer_invulnerableset_enable)"""

[[cheat]]
id = "rnrplayer-base-address-scan-to-activate-load-level-to-update-play"
name = "RNRPlayer Base Address Scan (To Activate: Load Level, To Update: Play)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(RNRPlayer_savedAOB)
label(RNRPlayer_returnhere)
label(RNRPlayer_originalcode)
label(RNRPlayer_exit)

label(RNRPlayer_update_exit)
label(RNRPlayer_set_exit)
label(RNRPlayer_healthset_exit)
label(RNRPlayer_manaset_exit)
label(RNRPlayer_inventoryset_exit)
label(RNRPlayer_invulnerableset_exit)

registersymbol(RNRPlayer_savedAOB)

//0484AEC2 - D9EE                  - fldz
//0484AEC4 - D9 5D F4              - fstp dword ptr [ebp-0C]
// RNRPlayer:Update+d0
//0484AEC7 - 0FB6 87 E4000000      - movzx eax,byte ptr [edi+000000E4]
//0484AECE - 85 C0                 - test eax,eax
//0484AED0 - 0F84 B3000000         - je 0484AF89
//0484AED6 - 8B 87 DC000000        - mov eax,[edi+000000DC]
aobscan(RNRPlayer_searchedAOB, 0F B6 87 E4 00 00 00 85 C0)

alloc(RNRPlayer_newmem, 2048)
alloc(RNRPlayer_temp1, 4)
alloc(RNRPlayer_temp2, 4)


RNRPlayer_newmem:
mov [RNRPlayer_temp1], ebx
mov [RNRPlayer_temp2], ecx

cmp dword ptr [RNRPlayer_update_enable], #0
je RNRPlayer_update_exit
mov [RNRPlayer_basepointer], edi
RNRPlayer_update_exit:

cmp dword ptr [RNRPlayer_set_enable], #0
je RNRPlayer_set_exit
RNRPlayer_set_exit:

cmp dword ptr [RNRPlayer_healthset_enable], #0
je RNRPlayer_healthset_exit
cmp dword ptr [edi+1c], #0
je RNRPlayer_healthset_exit
mov ebx, [edi+1c]
mov ecx, [ebx+b0]
mov [ebx+a8], ecx
RNRPlayer_healthset_exit:

cmp dword ptr [RNRPlayer_manaset_enable], #0
je RNRPlayer_manaset_exit
mov [edi+dc], #99
RNRPlayer_manaset_exit:

cmp dword ptr [RNRPlayer_inventoryset_enable], #0
je RNRPlayer_inventoryset_exit
cmp dword ptr [edi+18], #0
je RNRPlayer_inventoryset_exit
mov ebx, [edi+18]
mov [ebx+44], #999999
mov [ebx+48], #99
RNRPlayer_inventoryset_exit:

cmp dword ptr [RNRPlayer_invulnerableset_enable], #0
je RNRPlayer_invulnerableset_exit
cmp dword ptr [edi+1c], #0
je RNRPlayer_inventoryset_exit
mov ebx, [edi+1c]
mov byte ptr [ebx+b8], #0
mov byte ptr [ebx+b9], #0
mov byte ptr [ebx+cd], #0
mov byte ptr [ebx+104], #1
mov byte ptr [ebx+10c], #1
mov byte ptr [ebx+114], #1
mov byte ptr [ebx+120], #1
mov byte ptr [ebx+128], #1
mov byte ptr [ebx+130], #1
mov byte ptr [edi+100], #1
RNRPlayer_invulnerableset_exit:

mov ebx, [RNRPlayer_temp1]
mov ecx, [RNRPlayer_temp2]


RNRPlayer_originalcode:
db 0F B6 87 E4 00 00 00
//movzx eax,byte ptr [edi+000000E4]


RNRPlayer_exit:
jmp RNRPlayer_returnhere


RNRPlayer_searchedAOB:
RNRPlayer_savedAOB:
jmp RNRPlayer_newmem
nop
nop
RNRPlayer_returnhere:


[DISABLE]
RNRPlayer_savedAOB:
db 0F B6 87 E4 00 00 00
//movzx eax,byte ptr [edi+000000E4]

unregistersymbol(RNRPlayer_savedAOB)

dealloc(RNRPlayer_newmem)
dealloc(RNRPlayer_temp1)
dealloc(RNRPlayer_temp2)"""

