[[cheat]]
id = "unlimited-ammo"
name = "Unlimited Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]



aobscan(ammo,89 87 C0 00 00 00 8B 87 68 01 00 00 48 89 87 68 01 00 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
mov eax,[edi+c4]
mov [edi+000000C0],eax
jmp return

ammo:
jmp newmem
nop
return:
registersymbol(ammo)

[DISABLE]
ammo:
db 89 87 C0 00 00 00

unregistersymbol(ammo)
dealloc(newmem)"""

