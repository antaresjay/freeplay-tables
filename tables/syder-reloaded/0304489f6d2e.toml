[[cheat]]
id = "score-points-editor-ctrl-numpad-1-score-to-populate-values"
name = "Score Points Editor (Ctrl + Numpad 1) {Score to populate values}"
category = "game"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Syder Reloaded.exe
// Author            : ndck76
// Executable Version: 2022.2.19.22103
// Game Version      : Build.15982050
// Script Date       : 2025-04-26


[ENABLE]

aobscanregion(score,SyderRetro.LevelLogic:AddScore,SyderRetro.LevelLogic:AddScore+200,F3410F10xxxxF3xxxxxxF2xxxxxxF3xxxxxxxxF3xxxxxxxxF3xxxxxxF3xxxxxxxxF3xxxxxxF3xxxxxxxxF3xxxxxxF2xxxxxxF2xxxxxx49xxxx) //SyderRetro.LevelLogic:AddScore+98
alloc(newmem,$1000,score)
alloc(data3,8)
alloc(scorebkp,6)
registersymbol(data3)
registersymbol(score)
registersymbol(scorebkp)
label(code)
label(return)

scorebkp:
  readmem(score,6)

newmem:
  mov [data3],r15

code:
  readmem(score,6)
  jmp return

score:
  jmp newmem
  nop
return:

[DISABLE]

score:
  readmem(scorebkp,6)

unregistersymbol(*)
dealloc(*)"""

