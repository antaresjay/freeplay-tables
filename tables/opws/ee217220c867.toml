source = """
[ENABLE]

aobscanmodule(INJECTTensionDefault,OPWS.exe,F7 A2 DC 00 00 00 C1 EA 06 41) // should be unique
alloc(newmem,$100,INJECTTensionDefault)

label(code)
label(return)

