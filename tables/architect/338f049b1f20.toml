[[cheat]]
id = "script-near-instant-move"
name = "SCRIPT: Near Instant Move"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : prison architect64.exe
  Version: 
  Date   : 2018-07-03
  Author : Jason

  Right here rbx is the unit pointer, [rbx+28] is x location, I think xmm13
  is target x location, [rbx+28] is y location, and I think xmm10 is target
  y location.  The target should also be in [rbx+1b8] and [rbx+1bc].

  Unit type for worker is 0037 in [rbx+20].

  Looks like the same basic structure is used for items too.  For instance,
  0016 is a light, found in other code...
  0016 Light

  0037 Worker
  0038 Guard
  0039 Riot Guard
  003A Armed Guard
  003B Prisoner
  003C Doctor
  003E Cook
  003F Gardner (50/
  0040 Janitor
  0041 Fireman
  0045 Dog Handler
  0046 Dog
  0050 Sniper
  0051 Warden
  0052 Chief
  0053 Foreman
  0054 Psychologist
  0055 Accountant
  0056 Lawyer

  0010 Values - 50 seems to be peaceful, A0 seems to be compatant
    50 - Worker,Doctor,Cook,Gardner,Janitor,Warden,Chief,Foreman,Psychologist,
         Accountant,Lawyer,Dog,Fireman
    A0 - Prisoner,Dog Handler,Sniper,Guard,Armed Guard

  Types (0010, 0014, 0024)
    0016 50 2D 00 Light

    0037 50 4A 02 Worker
    0038 A0 5A 03 Guard
    0039 A0 5A 00 Riot Guard
    003A A0 5C 03 Armed Guard
    003B A0 6F 03 Prisoner
    003C 50 48 03 Doctor
    003E 50 4A 01 Cook
    003F 50 4A 00 Gardner
    0040 50 4A 01 Janitor
    0041 50 4D 00 Fireman
    0045 A0 5F 03 Dog Handler
    0046 50 50 00 Dog
    0050 A0 62 03 Sniper
    0051 50 4E 00 Warden
    0052 50 4E 00 Chief
    0053 50 4E 00 Foreman
    0054 50 4E 00 Psychologist
    0055 50 4E 00 Accountant
    0056 50 4E 00 Lawyer


}

[ENABLE]

aobscanmodule(INJECT_INSTANT_MOVE,prison architect64.exe,F3 44 0F 5C 53 2C) // should be unique
alloc(newmem,$10000,"prison architect64.exe"+2AFD39)

label(code)
label(doit)
label(isOther)
label(return)
label(bInstantMoveWorker)
label(bInstantMoveGuards)
label(bInstantMoveOther)

newmem:
  cmp [rbx+20],3b // Prisoner - never do it!
  je code

  cmp [rbx+20],37 // worker
  jne @f
  cmp dword ptr [bInstantMoveWorker],1
  je doit
  @@:

  cmp dword ptr [bInstantMoveGuards],1
  jne @F
  cmp [rbx+20],38 // guard
  je doit
  cmp [rbx+20],39 // riot guard
  je doit
  cmp [rbx+20],3a // armed guard
  je doit
  cmp [rbx+20],50 // sniper
  je doit
  cmp [rbx+20],45 // dog handler
  je doit
  cmp [rbx+20],46 // dog
  je doit
  @@:

  cmp [rbx+20],51 // warden
  jne @f
  je isOther
  @@:

  // unknown type, run some extra code so we can debug...
  cmp [rbx+20],0
isOther:
  cmp dword ptr [bInstantMoveOther],1
  je doit
  jmp code

doit:
  // just move to destination, super fast, still looks like they're running though
  movss [rbx+28],xmm13
  movss [rbx+2C],xmm10

code:
  subss xmm10,[rbx+2C]
  jmp return

align 10
bInstantMoveWorker:
  dd 0
bInstantMoveGuards:
  dd 0
bInstantMoveOther:
  dd 0

INJECT_INSTANT_MOVE:
  jmp newmem
  nop
return:
registersymbol(INJECT_INSTANT_MOVE)
registersymbol(bInstantMoveWorker)
registersymbol(bInstantMoveGuards)
registersymbol(bInstantMoveOther)


