[[cheat]]
id = "armello-aob-script-enable-then-hover-mouse-over-your-own-creature"
name = "Armello AOB script (enable, then hover mouse over your own creature)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game   : armello.exe
// Version:
// Date   :
// Author : Cs
[ENABLE]
aobscanmodule(aobPlayerInfoGrabber,GameAssembly.dll,0F B6 41 1C C3)
aobscanmodule(aobLocalPlayerGrabber,GameAssembly.dll,CC 48 8B 81 90 00 00 00 C3)

alloc(newmemLocalPlayerGrabber,4096,aobLocalPlayerGrabber)

label(aobPlayerInfoGrabber_r)
label(aobPlayerInfoGrabber_i)
registersymbol(aobPlayerInfoGrabber_r)
registersymbol(aobPlayerInfoGrabber_i)

label(lblPlayerInfoGrabber)
label(lblPlayerInfoGrabberSkip)
label(lblPlayerInfoGrabberRet)

label(pPlayerInfo)
registersymbol(pPlayerInfo)

label(aobLocalPlayerGrabber_r)
label(aobLocalPlayerGrabber_i)
registersymbol(aobLocalPlayerGrabber_r)
registersymbol(aobLocalPlayerGrabber_i)

label(lblLocalPlayerGrabber)
label(lblLocalPlayerGrabberSkip)
label(lblLocalPlayerGrabberRet)

label(pLocalPlayer)
registersymbol(pLocalPlayer)

newmemLocalPlayerGrabber:

lblPlayerInfoGrabber:
mov qword ptr [pPlayerInfo],rcx
lblPlayerInfoGrabberSkip:
readmem(aobPlayerInfoGrabber,5)
jmp lblPlayerInfoGrabberRet
aobPlayerInfoGrabber_i:
readmem(aobPlayerInfoGrabber,5)
pPlayerInfo:
dq 0

lblLocalPlayerGrabber:
mov rax,[pPlayerInfo]
cmp qword ptr [rcx+38],rax
jne short lblLocalPlayerGrabberSkip
mov qword ptr [pLocalPlayer],rcx
lblLocalPlayerGrabberSkip:
readmem(aobLocalPlayerGrabber+01,7)
jmp lblLocalPlayerGrabberRet
aobLocalPlayerGrabber_i:
readmem(aobLocalPlayerGrabber+01,7)
pLocalPlayer:
dq 0

aobPlayerInfoGrabber:
aobPlayerInfoGrabber_r:
jmp lblPlayerInfoGrabber
lblPlayerInfoGrabberRet:

aobLocalPlayerGrabber+01:
aobLocalPlayerGrabber_r:
jmp lblLocalPlayerGrabber
nop 2
lblLocalPlayerGrabberRet:

[DISABLE]
aobPlayerInfoGrabber_r:
readmem(aobPlayerInfoGrabber_i,5)

unregistersymbol(aobPlayerInfoGrabber_r)
unregistersymbol(aobPlayerInfoGrabber_i)

unregistersymbol(pPlayerInfo)

aobLocalPlayerGrabber_r:
readmem(aobLocalPlayerGrabber_i,7)

unregistersymbol(aobLocalPlayerGrabber_r)
unregistersymbol(aobLocalPlayerGrabber_i)

unregistersymbol(pLocalPlayer)

dealloc(newmemLocalPlayerGrabber)"""

