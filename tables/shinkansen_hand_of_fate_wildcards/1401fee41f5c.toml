[[cheat]]
id = "player-base-address-scan-initialization-activate-this-first"
name = "Player Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Player_basepointer)
registersymbol(Player_update_enable)
registersymbol(Player_set_enable)
registersymbol(Player_resourcesset_enable)
registersymbol(Player_healthset_enable)
registersymbol(Player_resourcesset_value)
registersymbol(Player_healthset_value)

alloc(Player_basepointer, 4)
alloc(Player_update_enable, 4)
alloc(Player_set_enable, 4)
alloc(Player_resourcesset_enable, 4)
alloc(Player_resourcesset_value, 4)
alloc(Player_healthset_enable, 4)
alloc(Player_healthset_value, 4)

Player_resourcesset_value:
dd #9999999

Player_healthset_value:
dd (float)9999999


[DISABLE]
unregistersymbol(Player_basepointer)
unregistersymbol(Player_update_enable)
unregistersymbol(Player_set_enable)
unregistersymbol(Player_resourcesset_enable)
unregistersymbol(Player_resourcesset_value)
unregistersymbol(Player_healthset_enable)
unregistersymbol(Player_healthset_value)

dealloc(Player_basepointer)
dealloc(Player_update_enable)
dealloc(Player_set_enable)
dealloc(Player_resourcesset_enable)
dealloc(Player_resourcesset_value)
dealloc(Player_healthset_enable)
dealloc(Player_healthset_value)"""

[[cheat]]
id = "player-base-address-scan-to-activate-load-game-to-update-play"
name = "Player Base Address Scan (To Activate: Load Game, To Update: Play)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Player_savedAOB)
label(Player_returnhere)
label(Player_originalcode)
label(Player_exit)

label(Player_update_exit)
label(Player_set_exit)
label(Player_resourcesset_exit)
label(Player_healthset_exit)

registersymbol(Player_savedAOB)

//633F83D5 - 8B C8                 - mov ecx,eax
//633F83D7 - 39 09                 - cmp [ecx],ecx
// HealthStatCard:Update+71
//633F83D9 - D9 80 88000000        - fld dword ptr [eax+00000084]
//633F83DF - D9 5D F0              - fstp dword ptr [ebp-10]
//633F83E2 - D9 45 F0              - fld dword ptr [ebp-10]
//633F83E5 - 83 EC 0C              - sub esp,0C
//633F83E8 - 83 EC 04              - sub esp,04
//633F83EB - D9 1C 24              - fstp dword ptr [esp]
aobscan(Player_searchedAOB, D9 80 84 00 00 00 D9 5D F0 D9 45 F0 83 EC 0C)

alloc(Player_newmem, 2048)
alloc(Player_temp1, 4)
alloc(Player_temp2, 4)


Player_newmem:
mov [Player_temp1], ebx
mov [Player_temp2], ecx

cmp dword ptr [Player_update_enable], #0
je Player_update_exit
mov [Player_basepointer], eax
Player_update_exit:

cmp dword ptr [Player_set_enable], #0
je Player_set_exit
Player_set_exit:

cmp dword ptr [Player_resourcesset_enable], #0
je Player_resourcesset_exit
mov ecx, [Player_resourcesset_value]
cmp dword ptr [eax+34], #0
je Player_resourcesset_exit
mov ebx, [eax+34]
mov [ebx+18], ecx
cmp dword ptr [eax+38], #0
je Player_resourcesset_exit
mov ebx, [eax+38]
mov [ebx+18], ecx
cmp dword ptr [eax+3c], #0
je Player_resourcesset_exit
mov ebx, [eax+3c]
mov [ebx+18], ecx
cmp dword ptr [eax+40], #0
je Player_resourcesset_exit
mov ebx, [eax+40]
mov [ebx+18], ecx
Player_resourcesset_exit:

cmp dword ptr [Player_healthset_enable], #0
je Player_healthset_exit
cmp dword ptr [eax+84], #0
jle Player_healthset_exit
mov ecx, [Player_healthset_value]
cmp dword ptr [eax+30], #0
je Player_healthset_exit
mov ebx, [eax+30]
mov [ebx+8], ecx
fld [ebx+8]
fadd [ebx+c]
fmul [ebx+10]
fstp [eax+84]
Player_healthset_exit:

mov ebx, [Player_temp1]
mov ecx, [Player_temp2]


Player_originalcode:
db D9 80 84 00 00 00
//fld dword ptr [eax+00000084]


Player_exit:
jmp Player_returnhere


Player_searchedAOB:
Player_savedAOB:
jmp Player_newmem
nop
Player_returnhere:


[DISABLE]
Player_savedAOB:
db D9 80 84 00 00 00
//fld dword ptr [eax+00000084]

unregistersymbol(Player_savedAOB)

dealloc(Player_newmem)
dealloc(Player_temp1)
dealloc(Player_temp2)"""

