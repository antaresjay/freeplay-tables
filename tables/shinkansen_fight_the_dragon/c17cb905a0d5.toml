[[cheat]]
id = "player-stats-base-address-scan-initialization-activate-this-first"
name = "Player Stats Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

registersymbol(playerstats_basepointer)
registersymbol(playerstatsupdate_enable)
registersymbol(playerstatsset_enable)
registersymbol(playerstatsinvulnerableset_enable)
registersymbol(playerstatsstaminachargehpset_enable)

alloc(playerstats_basepointer,4)
alloc(playerstatsupdate_enable,4)
alloc(playerstatsset_enable,4)
alloc(playerstatsinvulnerableset_enable,4)
alloc(playerstatsstaminachargehpset_enable,4)


[DISABLE]

unregistersymbol(playerstats_basepointer)
unregistersymbol(playerstatsupdate_enable)
unregistersymbol(playerstatsset_enable)
unregistersymbol(playerstatsinvulnerableset_enable)
unregistersymbol(playerstatsstaminachargehpset_enable)

dealloc(playerstats_basepointer)
dealloc(playerstatsupdate_enable)
dealloc(playerstatsset_enable)
dealloc(playerstatsinvulnerableset_enable)
dealloc(playerstatsstaminachargehpset_enable)"""

[[cheat]]
id = "player-stats-base-address-scan-to-activate-adventure-to-update-adventure"
name = "Player Stats Base Address Scan (To Activate: Adventure, To Update: Adventure)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstatsupdate_exit)
label(playerstatsset_exit)
label(playerstatsinvulnerableset_exit)
label(playerstatsstaminachargehpset_exit)

registersymbol(playerstats_savedAOB)

aobscan(playerstats_searchedAOB,D9 80 10 06 00 00 D9 5D F0)

alloc(playerstats_newmem,2048) //2kb should be enough


playerstats_newmem:
cmp dword ptr [playerstatsupdate_enable], #0
je playerstatsupdate_exit
mov [playerstats_basepointer], eax
playerstatsupdate_exit:

cmp dword ptr [playerstatsset_enable], #0
je playerstatsset_exit
mov [eax+4cc], (float)9999
mov byte ptr [eax+529], #1
mov [eax+724], (float)9999
playerstatsset_exit:

cmp dword ptr [playerstatsinvulnerableset_enable], #0
je playerstatsinvulnerableset_exit
mov byte ptr [eax+2c0], #1
mov byte ptr [eax+2c1], #1
playerstatsinvulnerableset_exit:

cmp dword ptr [playerstatsstaminachargehpset_enable], #0
je playerstatsstaminachargehpset_exit
fld dword ptr [eax+3c4]
fstp dword ptr [eax+3c0]
mov [eax+424], (float)9999999
mov [eax+610], (float)9999999
playerstatsstaminachargehpset_exit:


playerstats_originalcode:
db D9 80 10 06 00 00
//fld dword ptr [eax+00000610]


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB:
playerstats_savedAOB:
jmp playerstats_newmem
nop
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
db D9 80 10 06 00 00
//fld dword ptr [eax+00000610]

unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)"""

