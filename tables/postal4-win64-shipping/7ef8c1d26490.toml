[[cheat]]
id = "on-inventory-item-decrease"
name = "On Inventory Item Decrease ()->"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{
  Game\t : Postal4-Win64-Shipping.exe
  Version: 1.0
  Date\t : 20-04-2024
  Author : Leunsel

  Address of signature = Postal4-Win64-Shipping.exe + 0x012B7296
  "F3 0F ? ? 0F 29 ? ? ? 48 8B ? F3 0F"
  ---> Postal4-Win64-Shipping.exe+12B7296 - F3 0F 5C C1 - subss xmm0,xmm1
  ---> Postal4-Win64-Shipping.exe+12B729A - 0F 29 74 24 20 - movaps [rsp+20],xmm6
}

[ENABLE]
aobScanModule(AmountDecHook,Postal4-Win64-Shipping.exe,F3 0F ? ? 0F 29 ? ? ? 48 8B ? F3 0F)
alloc(newmem,$1000,AmountDecHook)

label(return)
label(code)

newmem:
  mov [AmountDec],rcx
  cmp byte ptr [AmountDecFlag],0 // Disabled
  je code
  cmp byte ptr [AmountDecFlag],1 // No Money Usage
  jne @f
    xorps xmm1,xmm1
    jmp code
  @@:
  cmp byte ptr [AmountDecFlag],2 // Decrease Multiplier
  jne @f
    mulss xmm1,[AmountDecMultiplier]
\tjmp code
  @@:
  cmp byte ptr [AmountDecFlag],3 // Increase
  jne @f
    addss xmm0,xmm1
    movaps [rsp+20],xmm6
    jmp return
  @@:
  mov byte ptr [AmountDecFlag],0
code:
  subss xmm0,xmm1
  movaps [rsp+20],xmm6
  jmp return

AmountDec:
 dq 0
AmountDecFlag:
 db 2
AmountDecMultiplier:
 dd (float)0.25

AmountDecHook:
  jmp newmem
  nop 4
return:
registersymbol(AmountDecHook AmountDec AmountDecFlag AmountDecMultiplier)

[DISABLE]

AmountDecHook:
  db F3 0F 5C C1 0F 29 74 24 20

unregisterSymbol(*)
dealloc(*)"""

