[[cheat]]
id = "active-trainer"
name = "Active Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
aobscan(energy,D9 80 AC 00 00 00 8B 05 ???????? 8B 40 10 D9 40 28 DF F1 DD D8)
registersymbol(energy)

label(movementlabel)
label(moralelabel)
label(energylabel)

registersymbol(healthE)
registersymbol(movementE)
registersymbol(moraleE)
registersymbol(energyE)
label(healthE)
label(movementE)
label(moraleE)
label(energyE)
//
newmem: //this is allocated memory, you have read,write,execute access
//place your code here
//health 30 , movement 34 int int , ac energy flkoat , b0 morale
//push esi
//68 28 =1 faction
cmp [eax+2c],0//2c 0
jne originalcode
//health
cmp [healthE],0
je movementlabel
fild [eax+e0]
fistp [eax+30]
//movement
movementlabel:
cmp [movementE],0
je moralelabel
cmp [eax+e4],-1
je originalcode
fild [eax+e4]
fistp [eax+34]
moralelabel:
cmp [moraleE],0
je energylabel
mov [eax+b0],#999//morale
energylabel:
cmp [energyE],0
je originalcode
cmp [eax+ac],(float)100
jg originalcode
mov [eax+ac],(float)100

originalcode:
fld dword ptr [eax+000000AC]
jmp returnhere
healthE:
dd 0
energyE:
dd 0
movementE:
dd 0
moraleE:
dd 0
energy:
jmp newmem
nop
returnhere:




[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
energy:
fld dword ptr [eax+000000AC]
//Alt: db D9 80 AC 00 00 00
unregistersymbol(energy)
unregistersymbol(healthE)
unregistersymbol(movementE)
unregistersymbol(moraleE)
unregistersymbol(energyE)"""

