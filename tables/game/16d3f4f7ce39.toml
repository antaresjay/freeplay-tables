[[cheat]]
id = "squad-teleport-select-and-hit-0"
name = "» Squad Teleport (Select and hit '0')"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(TPORT,2048)

label(_TP_Coord_Start)
label(_TP_Coord_Back)
label(_TP_Coord_Hook)
label(_TP_Squad_Start)
label(_TP_Squad_Done)
label(_TP_Squad_Back)
label(_TP_Squad_Exit)
label(_TP_Squad_Hook)
label(Coords)
label(iTP)
label(TP_meh)

registersymbol(TPORT)
registersymbol(Coords)
registersymbol(iTP)
registersymbol(TP_meh)
registersymbol(_TP_Coord_Hook)
registersymbol(_TP_Squad_Hook)

aobscan(aob_mapmouse,8B8BCC0200008B8930030000384108)
aobscan(aob_squadselected,538B5C2408558B6834)

// Calculation of mouse-map coordinates
// [EBX+384] == x
// [EBX+388] == y
// 0043479B - 8B 8B CC020000             - mov ecx,[ebx+000002CC]
// 004347A1 - 8B 89 30030000             - mov ecx,[ecx+00000330]
// 004347A7 - 38 41 08                   - cmp [ecx+08],al
// 8B8BCC0200008B8930030000384108
//Game.exe+3479B:  // Grab location of mouse coords from function that calcs them
aob_mapmouse:
_TP_Coord_Hook:
  jmp _TP_Coord_Start
  nop
_TP_Coord_Back:

// Squad selected on map screen: ESI is SquadOffset+98
// Something at Squad+7C when there's an order
// 0043B370 - 53                         - push ebx
// 0043B371 - 8B 5C 24 08                - mov ebx,[esp+08]
// 0043B375 - 55                         - push ebp
// 0043B376 - 8B 68 34                   - mov ebp,[eax+34]
// 538B5C2408558B6834
//Game.exe+3B370:
aob_squadselected:
_TP_Squad_Hook:
  jmp _TP_Squad_Start
_TP_Squad_Back:

TPORT:
_TP_Coord_Start: // Capture Mouse Map Coord location
  lea ecx, [ebx+00000384]
  mov dword ptr [Coords], ecx
  mov ecx,[ebx+000002CC]
  jmp _TP_Coord_Back

_TP_Squad_Start: // Hook function only run when squad selected in map screen.
  mov ecx, dword ptr [ESI-7C]
  mov dword ptr [TP_meh], ecx
  mov ecx, dword ptr [ESI-78]
  mov dword ptr [TP_meh+4], ecx
  //
  cmp dword ptr [ESI-1C],0 // Don't proceed if there's an order
  jne _TP_Squad_Exit
  cmp dword ptr [iTP], 0
//  je _TP_Squad_Exit
  //
  pushad
  pushfd
  push '0'
  call GetAsyncKeyState
//  shr ax,#15
  and ax,1
  cmp ax,1
  jne _TP_Squad_Done
  //
  mov dword ptr [iTP], 0
  mov ecx, dword ptr [Coords]
  mov ecx, [ecx]
  mov dword ptr [ESI-7C], ecx
  mov ecx, dword ptr [Coords]
  mov ecx, [ecx+4]
  mov dword ptr [ESI-78], ecx
_TP_Squad_Done:
  popfd
  popad
_TP_Squad_Exit:
  push ebx
  mov ebx,[esp+08]
  jmp _TP_Squad_Back


// Variables
Coords:
  dd 0
iTP:
  dd 0
TP_meh:
  dd 0
  dd 0

[DISABLE]
//Game.exe+3479B:
_TP_Coord_Hook:
  mov ecx,[ebx+000002CC]
  mov ecx,[ecx+00000330]
  cmp [ecx+08],al
//Game.exe+3B370:
_TP_Squad_Hook:
  push ebx
  mov ebx,[esp+08]
  push ebp
  mov ebp,[eax+34]


dealloc(TPORT)
unregistersymbol(TPORT)
unregistersymbol(Coords)
unregistersymbol(iTP)
unregistersymbol(TP_meh)
unregistersymbol(_TP_Coord_Hook)
unregistersymbol(_TP_Squad_Hook)"""

[[cheat]]
id = "magicpockets-see-notes"
name = "» MagicPockets (see notes)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(TradeWiz,4096)
alloc(TradePools,4096)

label(iMilitia)
label(iMilitiaProt)
label(_Trade_Start)
label(_Trade_Loop)
label(_Trade_Exit)
label(_Trade_Back)
label(_Trade_Hook)
label(_Militia_Trade)
label(iTeamPocket)
label(_Teammate_Trade)
label(_Teammate_Trade_Key1)
label(_Teammate_Trade_Key2)
label(_Teammate_Trade_Key3)
label(_Teammate_Trade_Key4)
label(_Teammate_Trade_Key5)
label(_Teammate_Trade_Key6)
label(_Trade_Loop_Exit)

label(_MTComp_Start)
label(_MTComp_Exit)
label(_MTComp_Back)
label(_MTComp_Hook)
label(_TMComp_Start)
label(_TMComp_Exit)
label(_TMComp_Back)
label(_TMComp_Hook)
label(_TMComp_Skip)

label(InvMilitia)
label(InvPistols)
label(InvSMG)
label(InvMG)
label(InvAssault)
label(InvShot)
label(InvSnipe)
label(InvRocket)

registersymbol(TradeWiz)
registersymbol(TradePools)
registersymbol(iMilitia)
registersymbol(iMilitiaProt)
registersymbol(iTeamPocket)
registersymbol(_Trade_Hook)
registersymbol(_MTComp_Hook)
registersymbol(_TMComp_Hook)

// Trade - Copy Inv Function
//Game.exe+11AC70 - 53                  - push ebx
//Game.exe+11AC71 - 55                  - push ebp
//Game.exe+11AC72 - 56                  - push esi
//Game.exe+11AC73 - 57                  - push edi
//Game.exe+11AC74 - 0FB7 51 10          - movzx edx,word ptr [ecx+10]
//Game.exe+11AC78 - 66 89 50 10         - mov [eax+10],dx
//Game.exe+11AC7C - 0FB7 51 12          - movzx edx,word ptr [ecx+12]
//Game.exe+11AC80 - 66 89 50 12         - mov [eax+12],dx
//Game.exe+11AC84 - 0FB7 51 14          - movzx edx,word ptr [ecx+14]
//Game.exe+11AC88 - 66 89 50 14         - mov [eax+14],dx

// Militia Start Trade
//Game.exe+1D9EE - D9 9D 28030000       - fstp dword ptr [ebp+00000328]
//Game.exe+1D9F4 - 8B 8D 18030000       - mov ecx,[ebp+00000318]
//Game.exe+1D9FA - 50                   - push eax
//Game.exe+1D9FB - 51                   - push ecx
//Game.exe+1D9FC - E8 FFDE0000          - call Game.exe+2B900
//Game.exe+1DA01 - 8B 55 74             - mov edx,[ebp+74]       // This is the EIP on Stack that we want to look for from the "Setup trade function"
//Game.exe+1DA04 - 8B 8D D8000000       - mov ecx,[ebp+000000D8]
//Game.exe+1DA0A - 6A 01                - push 01
//Game.exe+1DA0C - 89 9D DC000000       - mov [ebp+000000DC],ebx
//Game.exe+1DA12 - C6 85 2C030000 01    - mov byte ptr [ebp+0000032C],01
//Game.exe+1DA19 - 8B 82 C8000000       - mov eax,[edx+000000C8]
// 8B55748B8DD80000006A01899DDC000000 (+0)
aobscan(aob_militia_trade_start,8B55748B8DD80000006A01899DDC000000)

// Militia End Trade
//Game.exe+1DC92 - 8B B6 18030000       - mov esi,[esi+00000318]
//Game.exe+1DC98 - 8B 46 18             - mov eax,[esi+18]
//Game.exe+1DC9B - 3B C5                - cmp eax,ebp
//Game.exe+1DC9D - 74 08                - je Game.exe+1DCA7
//Game.exe+1DC9F - 8D 4E 1C             - lea ecx,[esi+1C]
//Game.exe+1DCA2 - E8 C9CF0F00          - call Game.exe+11AC70 // This is the call to Copy Inv to write back the changes
//Game.exe+1DCA7 - 5F                   - pop edi
//Game.exe+1DCA8 - 89 6E 18             - mov [esi+18],ebp
// 8BB6180300008B46183BC574088D4E1CE8 (JE +B) (Call +10) (Pop +15)
aobscan(aob_militia_trade_end,8BB6180300008B46183BC574088D4E1CE8)

// SetUp Trade Function
//Game.exe+2B954 - 8D 8D 78010000       - lea ecx,[ebp+00000178] // ECX is the address of the inv to pass to the copy trade function
