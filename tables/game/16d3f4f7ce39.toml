[[cheat]]
id = "savecharpointers-f11-max-stats"
name = "» SaveCharPointers (F11 Max Stats)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(SaveChar,2048)
alloc(pArray,80)

label(_SaveChar_Hook)
label(_SaveChar_Start)
label(_SaveChar_Back)
label(_UberChar_Start)
label(_UberChar_Exit)
label(_UberStatLoop1)
label(_UberStatLoop1Next)
label(_UberStatLoop2)
label(_SaveChar_Exit)
label(cCount)
label(uCounter)
label(dCount)
label(maxVal)

registersymbol(_SaveChar_Hook)
registersymbol(SaveChar)
registersymbol(pArray)
registersymbol(cCount)
registersymbol(dCount)
registersymbol(maxVal)
aobscan(aob_loadcharpointer,8BD88B430C8B4830)
// 8BD88B430C8B4830 Load Char Pointer
// 0043FFB1 - 8B D8                      - mov ebx,eax
// 0043FFB3 - 8B 43 0C                   - mov eax,[ebx+0C]
// 0043FFB6 - 8B 48 30                   - mov ecx,[eax+30]

//Game.exe+3FFB1:
aob_loadcharpointer:
_SaveChar_Hook:
 jmp _SaveChar_Start
_SaveChar_Back:

SaveChar:
_SaveChar_Start:
 mov edx,[edi+1C]
 mov [cCount], edx
 mov edx,eax
 mov eax, 4
 mov ebx,[esp+24]
 mul bl
 mov ebx,eax
 mov eax, edx
 mov edx,[edx+0C]
 mov edx,[edx+30]
 mov [ebx+pArray],edx
// Uber Soldier Hook, don't check for key press on every run
 cmp dword ptr [dCount], 0
 jne _UberChar_Start
 inc dword ptr [uCounter]
 cmp dword ptr [uCounter], 14
 jle _SaveChar_Exit
 // Counter Exceeded Cut Off.
 pushad
 mov dword ptr [uCounter], 1
 push 7A // F11
 call GetAsyncKeyState
 shr ax,#15
 cmp ax,1
 popad
 jne _SaveChar_Exit
 // Start of UberChar Processing.
_UberChar_Start:
 lea ecx, [edx+294]
 and dword ptr [ecx], 1 // Clear Status Flags (including "dead")
 mov ebx, 3
 push eax
 mov eax, dword ptr [maxVal]
_UberStatLoop1: // Max Attributes and Skills
 cmp dword ptr [ecx+ebx*4], eax
 jge _UberStatLoop1Next
 mov dword ptr [ecx+ebx*4], eax
_UberStatLoop1Next:
 inc ebx
 cmp ebx, C
 jle _UberStatLoop1
 pop eax
_UberStatLoop2: // Clear Deficits
 mov dword ptr [ecx+ebx*4], 0
 inc ebx
 cmp ebx, 14
 jle _UberStatLoop2
 mov dword ptr [edx+124], 0 // Clear (unspendable) skill points
 fild dword ptr [edx+2A8] // Load Strength
 fstp dword ptr [edx+298] // Store in Health
 fild dword ptr [edx+2A0] // Load Agility
 fstp dword ptr [edx+29C] // Store in Stamina
_UberChar_Exit:
 inc dword ptr [dCount]
 mov ebx, dword ptr [cCount]
 cmp dword ptr [dCount], ebx
 jle _SaveChar_Exit
 mov dword ptr [dCount], 0
_SaveChar_Exit:
 mov ebx, eax
 mov eax, [ebx+0C]
 jmp _SaveChar_Back

// Variables
cCount:
  dd 0
uCounter:
  dd 0
dCount:
  dd 0
maxVal:
  dd 64

[DISABLE]
//Game.exe+3FFB1:
_SaveChar_Hook:
  mov ebx,eax
  mov eax,[ebx+0C]

dealloc(SaveChar)
dealloc(pArray)
unregistersymbol(SaveChar)
unregistersymbol(pArray)
unregistersymbol(cCount)
unregistersymbol(dCount)
unregistersymbol(_SaveChar_Hook)
unregistersymbol(maxVal)"""

