[[cheat]]
id = "instant-un-detection-timer-always-0"
name = "Instant Un-Detection (Timer Always 0) "
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(originalcode)
label(exit)
label(aoblabel)
registersymbol(aoblabel)
aobscan(AOB1,74 09 D9 5A 78 8B E5 5D)

{============================================================================}

newmem: //this is allocated memory, you have read,write,execute access
originalcode:
fstp dword ptr [edx+78]
mov [edx+78],(float)0
mov esp,ebp

exit:
jmp returnhere

AOB1:
aoblabel:
jmp newmem
returnhere:

{============================================================================}

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
aoblabel:
fstp dword ptr [edx+78]
mov esp,ebp
//Alt: db D9 5A 78 8B E5
unregistersymbol(aoblabel)"""

