[[cheat]]
id = "get-values"
name = "----> Get Values"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[Enable]

alloc(gv_1,2048,Game.exe)
aobscanmodule(gv_aob1,Game.exe,F3 0F 10 44 24 14 F3 0F 11 43 1C)
registersymbol(gv_aob1)
label(returnhere_gv_1)

label(isHealth)
label(ih_status)
registersymbol(ih_status)

label(isAmmo)
label(ia_status)
registersymbol(ia_status)

label(gv_orig)
//--------------------------------------------------//
gv_1:
cmp [ebx+28],(float)0
je isAmmo
cmp [ebx+28],(float)1
je isHealth
jmp gv_orig
//--------------------------------------------------//
isHealth:
cmp [ebx+24],(float)400
jne gv_orig
cmp [ih_status],1
jne gv_orig
fld [ebx+24]
fstp [ebx+1C]
jmp returnhere_gv_1

ih_status:
dd 0
//--------------------------------------------------//
isAmmo:
cmp [ia_status],0
je gv_orig
fld [ebx+24]
fstp [ebx+1C]
jmp returnhere_gv_1

ia_status:
dd 0
//--------------------------------------------------//
gv_orig:
movss [ebx+1C],xmm0
jmp returnhere_gv_1
//--------------------------------------------------//

gv_aob1+6:
jmp gv_1
returnhere_gv_1:

[Disable]

gv_aob1+6:
db F3 0F 11 43 1C
unregistersymbol(gv_aob1)
dealloc(gv_1)

unregistersymbol(ia_status)

unregistersymbol(ih_status)"""

