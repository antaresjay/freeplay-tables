[[cheat]]
id = "infinite-skill-points"
name = "Infinite Skill Points"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(InfSkill,GameAssembly.dll,89 53 20 E8 8D B6 B7 01)
alloc(newmem,$1000,InfSkill)

label(code)
label(return)
//Send@FearlessRevolution|Sintrix
newmem:

code:
  mov [rbx+20],#99
  call UnityEngine.PlayerPrefs.SetInt
  jmp return

InfSkill:
  jmp newmem
  nop 3
return:
