source = """
{ Game   : Diablo II
  Version: 
  Date   : 2026-05-09
  Author : Apocalypticx

  This script does edit skills and stats
}

[ENABLE]

aobscanmodule(skillstat,Game.exe,8B 4D 10 01 48 04) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(Skills)
label(Stats)
label(EditSkills)
label(EditStats)

newmem:
pushfd
cmp edi,00040000
je Skills
cmp edi,00050000
je Stats
popfd

code:
mov ecx,[ebp+10]
add [eax+04],ecx
jmp return

Skills:
popfd
mov ecx,[ebp+10]
add [eax+04],ecx
push rbx
mov rbx,[EditSkills]
mov [eax+4],rbx
pop rbx
jmp return

Stats:
popfd
mov ecx,[ebp+10]
add [eax+04],ecx
push rbx
mov rbx,[EditStats]
mov [eax+4],rbx
pop rbx
jmp return

EditSkills:
dd 0

EditStats:
dd 0

skillstat:
  jmp newmem
  nop
return:
registersymbol(skillstat)
registersymbol(EditSkills)
registersymbol(EditStats)

[DISABLE]

skillstat:
  db 8B 4D 10 01 48 04

unregistersymbol(EditSkills)
unregistersymbol(EditStats)
unregistersymbol(skillstat)
dealloc(newmem)

