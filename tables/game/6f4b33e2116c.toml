[[cheat]]
id = "ohko1"
name = "OHKO1"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,64)
label(returnhere)

newmem:
mov ax, [edi+000000A6]
sub [edi+000000A6],ax
jmp returnhere

"game.exe"+3197:
jmp newmem
nop 2
returnhere:




 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
"game.exe"+3197:
//db 66 29 87 A6 00 00 00
sub [edi+000000A6],ax"""

