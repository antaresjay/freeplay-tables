exit1:
jmp returnhere1

///
pLvlUpPt:
///

lvlUpPtChkAOB: //"game.exe"+15FA48:
jmp newmem1
returnhere1:



 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
