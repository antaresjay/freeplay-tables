unregistersymbol(pPlayer)

///***********************************************///

dealloc(newmem1)
lvlUpPtChkAOB: //"game.exe"+15FA48:
db 8D 77 1C 3B 06
//Alt: lea esi,[edi+1C]
//Alt: cmp eax,[esi]
