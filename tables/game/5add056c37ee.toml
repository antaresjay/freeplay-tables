registersymbol(base)


newmem: //this is allocated memory, you have read,write,execute access
//place your code here

// 3c health 38 full health
// 48 mana 44 full mana
//54 exp
cmp [edi+64],6F726548
jne originalcode
mov [pHero],edi
///////////////////////
cmp [healthE],0
je mana
fld [edi+38]
fstp [edi+3C]
mana:
