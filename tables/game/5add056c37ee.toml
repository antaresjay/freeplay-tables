je originalcode
fld [edi+44]
fstp [edi+48]
originalcode:
fcomp dword ptr [edi+3C]
fnstsw ax
jmp returnhere
pHero:
dd 0
healthE:
dd 0
manaE:
dd 0
base://"game.exe"+CDD67:
jmp newmem
returnhere:
///////////////////////////////////////////////////////////////////////////////
