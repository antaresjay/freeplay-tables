name = "One Hit Kill (Ctrl + Numpad 1)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : game.exe
// Author            : ndck76
// Game Version      : v1.1.2
// Script Date       : 2025-03-27


[ENABLE]

aobscanmodule(ohk,game.exe,03xx4883xxxx483Bxx75xxF3) // should be unique
alloc(newmem,$1000,ohk)
alloc(ohkbkp,6)
registersymbol(ohk)
registersymbol(ohkbkp)
label(code)
label(return)

ohkbkp:
  readmem(ohk,6)

newmem:
  mov [rcx],0

code:
  readmem(ohk,6)
  jmp return

ohk:
  jmp newmem
  nop
return:

[DISABLE]

ohk:
  readmem(ohkbkp,6)

unregistersymbol(*)
dealloc(*)"""
