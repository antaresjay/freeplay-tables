type = "script"
source = """
// Game Executable   : game.exe
// Author            : ndck76
// Game Version      : Build.22935250
// Script Date       : 2026-04-27


[ENABLE]

aobscanmodule(qitems,game.exe,8Bxxxx85xx7Exx83xxxx79) // should be unique
alloc(newmem,$1000,qitems)
alloc(qitemsbkp,5)
registersymbol(qitems)
registersymbol(qitemsbkp)
label(code)
label(return)

qitemsbkp:
  readmem(qitems,5)

newmem:
  mov [rcx+04],(int)10

code:
  readmem(qitems,5)
  jmp return

qitems:
  jmp newmem
return:

[DISABLE]

qitems:
  readmem(qitemsbkp,5)

unregistersymbol(*)
dealloc(*)"""
