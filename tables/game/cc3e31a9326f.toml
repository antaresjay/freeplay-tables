[[cheat]]
id = "health"
name = "Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(health,game.exe,F3 0F 11 41 08 83 49 18 01 C3 0F)
alloc(newmem,$100,health)
alloc(player,4)
alloc(enemy,4)
label(code)
label(return)
registersymbol(health enemy player)

newmem:
cmp [rcx+20],#1
jne @f
cmp [player],0
je code
movss xmm0,[rcx+0C]
movss [rcx+08],xmm0
