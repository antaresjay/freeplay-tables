[[cheat]]
id = "get-party-base-pointer"
name = "Get Party Base Pointer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(get_base_pointer,game.exe,8B 84 88 40 03 00 00 85 F6)
alloc(newmem,$128)

label(return)
label(partybp)
registersymbol(partybp)

newmem:
  mov [partybp],eax
  mov eax,[eax+ecx*4+00000340]
  jmp return

partybp:
  dd 0

get_base_pointer:
  jmp newmem
  nop 2
return:
registersymbol(get_base_pointer)

[DISABLE]
get_base_pointer:
  db 8B 84 88 40 03 00 00

unregistersymbol(partybp)
unregistersymbol(get_base_pointer)
dealloc(newmem)"""

