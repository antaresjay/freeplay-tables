[[cheat]]
id = "toggle-infinite-hp"
name = "Toggle Infinite HP"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc(newmem,2048,dra02.dll+2CF658)

newmem:
  push edx

  // --- health logic
  mov edx,[dra02.dll+9B2896]
  mov [dra02.dll+9B2894],dx

  // --- check debuff timer A (F2F3) ---
  mov ax,[dra02.dll+9B28F2]
  cmp ax,0
  je checkF4
  cmp ax,1
  je checkF4
  mov word ptr [dra02.dll+9B28F2],1

checkF4:
  // --- check debuff timer B (F4F5) ---
  mov ax,[dra02.dll+9B28F4]
  cmp ax,0
  je checkF6
  cmp ax,1
  je checkF6
  mov word ptr [dra02.dll+9B28F4],1

checkF6:
  // --- extra debuff timer (F6F7) ---
  mov ax,[dra02.dll+9B28F6]
  cmp ax,0
  je checkPair2
  cmp ax,1
  je checkPair2
  mov word ptr [dra02.dll+9B28F6],1

checkPair2:
  // --- second debuff timer pair (5E–5F) ---
  mov edx,[dra02.dll+9B2960]
  mov [dra02.dll+9B295E],dx

  mov ax,[dra02.dll+9B295E]
  cmp ax,0
  je checkSecondPair
  cmp ax,1
  je checkSecondPair
  mov word ptr [dra02.dll+9B295E],1

checkSecondPair:
  // --- normalize second word (60–61) ---
  mov ax,[dra02.dll+9B2960]
  cmp ax,0
  je checkExtraPair
  cmp ax,1
  je checkExtraPair
  mov word ptr [dra02.dll+9B2960],1

checkExtraPair:
  // --- extra debuff timer (62–63) ---
  mov ax,[dra02.dll+9B2962]
  cmp ax,0
  je skip
  cmp ax,1
  je skip
  mov word ptr [dra02.dll+9B2962],1

skip:
  pop edx

code:
  mov rdx,dra02.dll+9B2894
  movsx eax,word ptr [rdx]
  jmp return

dra02.dll+2CF658:
  jmp newmem
  nop 2
return:

[DISABLE]

dra02.dll+2CF658:
  db 0F BF 05 35 32 6E 00

dealloc(newmem)"""

