[[cheat]]
id = "toggle-infinite-health"
name = "Toggle Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc(newmem,2048,dra03.dll+A5DBA)

label(code)
label(return)
label(checkTimer)
label(fixTimer)

newmem:
  push rax
  push rdx

  mov eax,[dra03.dll+8CEF1E]
  mov [dra03.dll+8CEF1C],ax

checkTimer:
  mov eax,[dra03.dll+8CEF7C]

  cmp eax,00000000
  je code

  cmp eax,00010000
  je code

fixTimer:
  mov dword ptr [dra03.dll+8CEF7C],#65536

code:
  mov rdx,dra03.dll+8CEF1C
  movsx r9d,word ptr [rdx]

  pop rdx
  pop rax
  jmp return

dra03.dll+A5DBA:
  jmp newmem
  nop 3
return:

[DISABLE]

dra03.dll+A5DBA:
  db 44 0F BF 0D 5A 91 82 00

dealloc(newmem)"""

