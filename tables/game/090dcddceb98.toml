[[cheat]]
id = "toggle-speed-multiplier"
name = "Toggle Speed Multiplier"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc(left_mem,2048,"dra03.dll"+EA065)
alloc(right_mem,2048,"dra03.dll"+EA046)

alloc(speedMul,4)
registersymbol(speedMul)

speedMul:
dd 2

left_mem:
mov eax,[speedMul]
test eax,eax
jz left_skip
imul edx,eax

left_skip:
  mov [rcx+3C],edx
  or r8d,07
  jmp left_return

"dra03.dll"+EA065:
  jmp left_mem
  nop 2
left_return:

//////////////////////////////////////

right_mem:
mov   eax,[speedMul]
test  eax,eax
jz    right_skip
imul  edx,eax

right_skip:
  mov   [rcx+3C],edx
  or    r8d,03
  jmp right_return

"dra03.dll"+EA046:
  jmp right_mem
  nop 2
right_return:


[DISABLE]

"dra03.dll"+EA065:
  db 89 51 3C 41 83 C8 07
dealloc(left_mem)

"dra03.dll"+EA046:
  db 89 51 3C 41 83 C8 03
dealloc(right_mem)

unregistersymbol(speedMul)
dealloc(speedMul)"""

