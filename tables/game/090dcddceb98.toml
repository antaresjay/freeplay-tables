[[cheat]]
id = "toggle-infinite-hp-2"
name = "Toggle Infinite HP"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc(health_mem,2048,dra01.dll+75932)

label(code_health)
label(return_health)
label(checkLow)
label(checkHigh)
label(fixLow)
label(fixHigh)
label(exit)

health_mem:
  push rax
  push rdx

  // --- Original health logic ---
  mov rdx,dra01.dll+96450E
  mov dx,[rdx]

  mov rax,dra01.dll+96450C
  mov [rax],dx

  mov rax,dra01.dll+96454C
  cmp byte ptr [rax],00
  jg checkLow
  jmp exit

  // --- Check LOW WORD (timer A) ---
checkLow:
  mov rax,dra01.dll+96454E
  mov ax,[rax]
  cmp ax,0100
  jbe checkHigh
  jmp fixLow

fixLow:
  mov rax,dra01.dll+96454E
  mov word ptr [rax],0
  jmp checkHigh

  // --- Check HIGH WORD (timer B) ---
checkHigh:
  mov rax,dra01.dll+964550
  mov ax,[rax]
  cmp ax,0100
  jbe exit
  jmp fixHigh

fixHigh:
  mov rax, dra01.dll+964550
  mov word ptr [rax],0
  jmp exit

exit:
  pop rdx
  pop rax

code_health:
  mov rax, dra01.dll+96454C
  mov byte ptr [rax],00
  mov rdx, dra01.dll+96450C
  movsx eax,word ptr [rdx]
  jmp return_health

dra01.dll+75932:
  jmp health_mem
  nop 2
return_health:

[DISABLE]

dra01.dll+75932:
  db 0F BF 05 D3 EB 8E 00

dealloc(health_mem)"""

