[[cheat]]
id = "item-quantity-cooldown-type-write"
name = "Item Quantity/Cooldown/Type - (Write)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
// Define Code
define(CHANGE,"game.exe")

[ENABLE]
alloc(Items,$1000,CHANGE)
label(compare)
label(oricost)
label(cool)
label(oricool)
label(change)
Label(changenext)
label(changeprev)
label(vision)
//label(teleport)
label(dart)
label(changenext2)
label(vision2)
label(returnhere)
label(aHowmany)
label(aItemcool)
label(aSetitem)
label(aSetnext)
label(aSetprev)
label(aSetnext2)
registersymbol(Items)
registersymbol(aHowmany)
registersymbol(aItemcool)
registersymbol(aSetitem)
registersymbol(aSetnext)
registersymbol(aSetprev)
registersymbol(aSetnext2)

Items:

//Var
aHowmany:
dd 2

aItemcool:
dd 1

aSetitem:
dd 0

aSetnext:
dd 0

aSetprev:
dd 0

aSetnext2:
dd 0



compare:
cmp [aSetitem],0
jne change
cmp [aSetnext],0
jne changenext
cmp [aSetprev],0
jne changenext
// 2nd
cmp [aSetnext2],0
jne changenext2
// Quantity
cmp [aHowmany],0
je oricost
push eax
mov eax,[aHowmany]
mov [esi+04],eax //Cost
pop eax
jmp cool

oricost:
dec [esi+04]
jmp cool

cool:
cmp [aItemcool],0
je oricool
//mov [ebp+08],0
jmp returnhere

oricool:
mov ecx,[ebp+08] //Cooldown
jmp returnhere

// Change Item
change:
// [esi] is item address
push eax
mov eax,[aSetitem]
mov [esi],eax
pop eax
mov [aSetitem],0
jmp compare

// -------------------Section 1-----------

// Next Item (Necessary For Vision/Teleport)
changenext:
cmp [aSetnext],2
je vision
/*
cmp [aSetnext],3
je teleport
*/
push eax
mov eax,[aSetnext]
mov [esi+10],eax //+10 is next item
mov eax,[aHowmany]
mov [esi+14],eax // Otherwise is 0
pop eax
mov [aSetnext],0
jmp compare

// Restore Vision
vision:
mov [esi+10],CAAF21C6 // Vision
mov [esi+14],0 // Must be 0
mov [aSetnext],0
jmp compare

//Restore Teleport


// Previous Item (Bamboo Dart or Debug)
changeprev:
cmp [aSetprev],1
je dart
push eax
mov eax,[aSetprev]
mov [esi-10],eax //+10 is next item
mov eax,[aHowmany]
mov [esi-14],eax // Otherwise is 0
pop eax
mov [aSetprev],0
jmp compare

//Restore Dart
dart:
mov [esi-10],5A277A4F // Dart
mov [esi-14],0 // Must be 0
mov [aSetprev],0
jmp compare

// -------------------Section 2------------
changenext2:
cmp [aSetnext2],2
je vision2
push eax
mov eax,[aSetnext2]
mov [esi+20],eax // Next Item 2nd
mov eax,[aHowmany]
mov [esi+24],eax // Quantity +4
pop eax
mov [aSetnext2],0
jmp compare

// Restore Vision 2nd
vision2:
mov [esi+20],CAAF21C6 // Vision
mov [esi+24],0 // Must be 0
mov [aSetnext2],0
jmp compare




game.exe+9B4DD:
jmp compare
nop
returnhere:


 
 
[DISABLE]
game.exe+9B4DD:
db FF 4E 04 8B 4D 08
unregistersymbol(Items)
unregistersymbol(aHowmany)
unregistersymbol(aItemcool)
unregistersymbol(aSetitem)
unregistersymbol(aSetnext)
unregistersymbol(aSetprev)
unregistersymbol(aSetnext2)
dealloc(Items)
//dec [esi+04]
//mov ecx,[ebp+08]
//Alt: db FF 4E 04 8B 4D 08 - 8B C7"""

