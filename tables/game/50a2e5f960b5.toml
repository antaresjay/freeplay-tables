[[cheat]]
id = "collector-s-luck"
name = "Collector's Luck"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : game.exe
  Version: 
  Date   : 2021-07-23
  Author : SeiKur0
}

[ENABLE]
aobscanmodule(inj_collectchances,game.exe,48 89 5C 24 08 48 89 74 24 10 57 48 83 EC 20 4C 8B 59 18) // should be unique
alloc(newmem,$1000,inj_collectchances)

label(return)

label(execute)
label(prereturn)

label(collectchances_mode)
registersymbol(collectchances_mode)

label(flags_exclude)
registersymbol(flags_exclude)
label(after_excludtest1)
label(after_excludtest2)
label(loop_cutRarestOptions)

label(bestchances)
label(skipchange_bestchances)
label(handleZeroP_bestchances)
label(nomodZeroP_bestchances)

label(equalchances)
label(equalchances_pre)
label(skipchange_equalchances)
label(handleZeroP_equalchances)

label(besteggsmell_start)
label(besteggsmell_end)

label(min_normal)
label(loop_findmin_normal)
label(noNewMin_normal)
label(handleZeroP_normal)
label(min_special)
label(loop_findmin_special)
label(noNewMin_special)
label(handleZeroP_special)
label(finishedmin)

newmem:
  push rax
  push rbx
  push rcx
  push rdx
  push rsi
  push rdi

  mov rsi,[rcx+10]
  mov rdi,[rcx+18]

  mov al,[flags_exclude]
  test al,al
  je after_excludtest1
  xor al,al
  mov [flags_exclude],al

  mov al,[flags_exclude+1]
  cmp al,0
  je prereturn
  cmp al,1
  je cutRarestOptions
  jmp execute

  after_excludtest1:
  mov al,[flags_exclude+3]
  test al,al
  je after_excludtest2
  xor al,al
  mov [flags_exclude+3],al

  mov al,[flags_exclude+4]
  cmp al,0
  je prereturn
  cmp al,1
  je cutRarestOptions
  jmp execute

  after_excludtest2:
  mov al,[flags_exclude+5]
  test al,al
  je execute

  xor eax,eax
  mov [flags_exclude+5],al
  lea rdi,[rdi-28]
  besteggsmell_start:
  cmp rsi,rdi
  jae besteggsmell_end
  mov [rsi+10],eax
  lea rsi,[rsi+28]
  jmp besteggsmell_start
  besteggsmell_end:
  inc eax
  mov [rsi+10],eax
  jmp prereturn

  cutRarestOptions:
  mov rax,[rdi-18]
  lea rdi,[rdi-28]
  cmp rsi,rdi
  jae prereturn

  loop_cutRarestOptions:
  mov rdx,[rdi-18]
  cmp rdx,rax
  jne execute
  lea rdi,[rdi-28]
  cmp rsi,rdi
  jae prereturn
  jmp loop_cutRarestOptions

  execute:
  mov rax,rdi
  sub rax,rsi
  xor rdx,rdx
  mov rcx,28
  div rcx
  cmp rax,1
  jbe prereturn
  //rdi has lastEntry
  //rsi has firstEntry

  lea rsi,[rsi+10] //offset 10 for pCurrent
  xor rcx,rcx
  dec ecx //pMin

  mov bl,[flags_exclude+2]

  mov al,[collectchances_mode]
  cmp al,0
  jne min_normal

  min_special:
  push rsi
  loop_findmin_special:
  mov eax,[rsi]
  test eax,eax
  je handleZeroP_special
  mov ecx,eax
  noNewMin_special:
  lea rsi,[rsi+28]
  cmp rsi,rdi
  jb loop_findmin_special
  pop rsi
  jmp finishedmin

  handleZeroP_special:
  cmp bl,02
  jne noNewMin_special
  xor ecx,ecx
  jmp noNewMin_special

  min_normal:
  push rsi
  loop_findmin_normal:
  mov eax,[rsi]
  test eax,eax
  je handleZeroP_normal
  cmp eax,ecx
  jae noNewMin_normal
  mov ecx,eax
  noNewMin_normal:
  lea rsi,[rsi+28]
  cmp rsi,rdi
  jb loop_findmin_normal
  pop rsi
  jmp finishedmin

  handleZeroP_normal:
  cmp bl,02
  jne noNewMin_normal
  xor ecx,ecx
  pop rsi
  //jmp finishedmin

  finishedmin:
  //ecx has pMin

  mov al,[collectchances_mode]
  cmp al,1
  je equalchances_pre

  //can have min_normal or min_special minimum
  bestchances:
  mov eax,[rsi]
  test eax,eax
  je handleZeroP_bestchances
  cmp eax,ecx
  je skipchange_bestchances
  xor eax,eax
  mov [rsi],eax
  skipchange_bestchances:
  lea rsi,[rsi+28]
  cmp rsi,rdi
  jb bestchances
  jmp prereturn

  handleZeroP_bestchances:
  cmp bl,01
  je skipchange_bestchances
  cmp bl,02
  je nomodZeroP_bestchances
  mov [rsi],ecx
  jmp skipchange_bestchances

  nomodZeroP_bestchances:
  inc eax
  mov [rsi],eax
  jmp skipchange_bestchances


  //always has min_normal minimum
  equalchances_pre:
  test ecx,ecx
  jne equalchances
  inc ecx

  equalchances:
  mov eax,[rsi]
  test eax,eax
  je handleZeroP_equalchances
  cmp eax,ecx
  je skipchange_equalchances
  mov [rsi],ecx
  skipchange_equalchances:
  lea rsi,[rsi+28]
  cmp rsi,rdi
  jb equalchances
  jmp prereturn

  handleZeroP_equalchances:
  cmp bl,1
  je skipchange_equalchances
  mov [rsi],ecx
  jmp skipchange_equalchances

  prereturn:
  pop rdi
  pop rsi
  pop rdx
  pop rcx
  pop rbx
  pop rax
  mov [rsp+08],rbx
  jmp return

collectchances_mode:
db 0

flags_exclude:
db 0 0 0 0 0 0

inj_collectchances:
  jmp newmem
return:
registersymbol(inj_collectchances)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
inj_collectchances:
  db 48 89 5C 24 08

unregistersymbol(inj_collectchances)
unregistersymbol(collectchances_mode)
unregistersymbol(flags_exclude)
dealloc(newmem)

