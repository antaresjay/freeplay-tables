{
pushfd
push ebx

//cmp [esi+24],0
//jne code

    cmp [esi+34],0    //check if unit count is valid
    jle code
    mov ebx,[esi+34]    //check if unit count is valid
      test ebx,ebx
      jz code
      test ebx,ebx
      js code
    cmp [ebx+4],0    //check if unit count is valid
    jle code
      mov ebx,[ebx+4]    //check if unit count is valid
      test ebx,ebx
      jz code
      test ebx,ebx
      js code
    cmp [ebx+30],0    //<<<---check if unit count is valid
    jne code

pop ebx
popfd
}
  mov [__unitbases],esi
  mov edx,[esi+38]         //orig code
  mov eax,[edx+ecx*4]      //orig code
  jmp return

code:
  mov [__unitbases+4],esi
pop ebx
popfd
  mov edx,[esi+38]           //orig code
  mov eax,[edx+ecx*4]        //orig code
  jmp return

