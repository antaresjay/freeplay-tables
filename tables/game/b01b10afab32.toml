[[cheat]]
id = "unit-base-v5-disable-at-end-mission"
name = "unit_base v5  (disable at end mission)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Game.exe
  Version: 
  Date   : 2022-03-08
}

[ENABLE]

aobscanmodule(unitbase3_AOB,Game.exe,DB 40 0C 56 8B CB) // should be unique
alloc(unitbase3_newmem,2000,unitbase3_AOB)

alloc(__unitbase3,10,unitbase3_AOB)
registersymbol(__unitbase3)

alloc(__addextraunit,10,unitbase3_AOB)
registersymbol(__addextraunit)

alloc(__pID,4,unitbase3_AOB)
registersymbol(__pID)

label(code)
label(return)
label(code1)
//label(code2)
label(code3)
label(code4)
label(unit1)
label(unit2)
label(unit3)
label(unit4)
label(unit5)
label(unit6)
label(unit7)
label(unit8)
//========================================================================
unitbase3_newmem:
pushfd
push ebx

cmp [__pID],#99        //choose your current player ID
je code

cmp [Game.exe+859B6C],1   //exit if menu mode
je code
cmp [Game.exe+84176C],0   //exit if menu mode
je code4

cmp [Game.exe+84176C],#13   //exit if menu mode
jge code

cmp esi,9
jg code
   lea ecx,[edi]
cmp ebp,9
jg code
   lea ecx,[edi]
cmp ebp,0
je code
   lea ecx,[edi]

//cmp [edi+24],0        //get player ID
//je code2
//  lea ecx,[edi]      //get base unit
//mov ecx,[edi+24]
//cmp ecx,0            //get player ID
//je code2
//  lea ecx,[edi]      //get base unit

    //*Check for Player ID
    cmp edi,#4000     //check if address is valid
    jle code
      lea ecx,[edi]    //test: get base unit
    cmp [edi+34],0     //check if address is valid
    jle code
      lea ecx,[edi]    //test: get base unit
    mov ebx,[edi+34]    //get player ID address
      cmp ebx,#4000     //check if address is valid
      jle code
        lea ecx,[edi]    //test: get base unit
      test ebx,ebx
      jz code
      test ebx,ebx
      js code
    cmp [ebx+4],0    //check if unit count is valid
    jle code
      lea ecx,[edi]      //test: get base unit
    mov ebx,[ebx+4]    //get player ID address
      cmp ebx,#4000     //check if address is valid
      jle code
        lea ecx,[edi]    //test: get base unit
      test ebx,ebx
      jz code
      test ebx,ebx
      js code
      mov ecx,[__pID]   //check for Player ID
    cmp [ebx+30],ecx    //check for Player ID
    jne code
      lea ecx,[edi]      //test: get base unit

//code2:
cmp [edi+3c],0    //check if unit count is valid
jle code
  lea ecx,[edi]      //test: get base unit

cmp [eax+0c],5   //check  for seige unit below 5
jle code1

cmp [eax+0c],5   //check  for seige unit below 5
jle code1

cmp [eax+0c],45   //check  for unit aabove 45
jle code3

  lea ecx,[edi]       //test: get base unit
  mov ebx,[eax+08]
  mov [__unitbase3],ebx      //get base unit

 code3:
  lea ecx,[edi]          //test: get base unit
  mov ebx,[__unitbase3]      //get base unit
  mov [eax+08],ebx

 code1:

  lea ecx,[edi]      //test: get base unit
  mov ecx,[eax+08]   //get base moral/men
  mov [eax+0C],ecx  //set base moral/men

  mov [edi+4C],(float)990  // get base unit health
  mov [edi+48],(float)990  //set base unit health


cmp [__addextraunit],1
jne code

cmp [Game.exe+859B6C],1  //exit if menu mode
je code
cmp [Game.exe+84176C],0   //exit if menu mode
je code
cmp [Game.exe+84176C],#13   //exit if menu mode
jge code

cmp esi,9
jg code
   lea ecx,[edi]
cmp ebp,9
jg code
   lea ecx,[edi]
cmp ebp,0
je code
   lea ecx,[edi]

cmp [eax+0c],5   //check  for seige unit below 5
jle code
cmp [eax+0c],5   //check  for seige unit below 5
jle code


  cmp [edi+3C],9    //check army unit
  jge code
  cmp esi,0
  jne code
  cmp esi,0
  jne code
      mov ebx,[edi+38]             //get army unit address
      mov [__addextraunit+4],ebx

      cmp [edi+3C],9       //check for 9th army unit
      jge code
      cmp [edi+3C],8       //check for 8Th army unit
      je unit8
      cmp [edi+3C],7       //check for 7Th army unit
      je unit7
      cmp [edi+3C],6       //check for 6Th army unit
      je unit6
      cmp [edi+3C],5       //check for 5Th army unit
      je unit5
      cmp [edi+3C],4       //check for 4Th army unit
      je unit4
      cmp [edi+3C],3       //check for 3rd army unit
      je unit3
      cmp [edi+3C],2       //check for 2nd army unit
      je unit2
      cmp [edi+3C],1       //check for 1st army unit
      je unit1
      jmp code

    unit1:
      mov [ebx+04],eax     //add 2nd unit
    unit2:
      mov [ebx+08],eax     //add 3rd unit
    unit3:
      mov [ebx+0C],eax     //add 4th unit
    unit4:
      mov [ebx+10],eax     //add 5th unit
    unit5:
      mov [ebx+14],eax     //add 6th unit
    unit6:
      mov [ebx+18],eax     //add 7th unit
    unit7:
      mov [ebx+1C],eax     //add 8th unit
    unit8:
      mov [ebx+20],eax     //add 9th unit

    mov [edi+3C],9        //edit army unit count
    jmp code

code4:
mov [__pID],ff
mov [__addextraunit],0
jmp code

code:
pop ebx
popfd
  fild dword ptr [eax+0C]  //orig code
  push esi                 //orig code
  mov ecx,ebx              //orig code
  jmp return

