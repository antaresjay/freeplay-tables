[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : The Dark Lord's Trip
  Version: UNKNOWN
  Date   : 2017-07-08
  Author : Ahsan Iqbal (3xd_tango)

  This script Give you health,mana & sp
}

[ENABLE]

aobscanmodule(INJECT,Game.exe,8B 74 88 1F 0F B6 42 07) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(player)
globalalloc(hero,4)

newmem:
  cmp ecx,00000036
  jne code
  cmp byte ptr [eax+00],#132
  jne code
  cmp [eax+1C3],0
  je code
  cmp [eax+07],#138
  je player
  jne code

player:
  mov esi,[eax+ecx*4+1F]
  mov [hero],eax
  movzx eax,byte ptr [edx+07]
  jmp return

code:
  mov esi,[eax+ecx*4+1F]
  movzx eax,byte ptr [edx+07]
  jmp return

INJECT:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 8B 74 88 1F 0F B6 42 07

unregistersymbol(INJECT)
dealloc(newmem)
dealloc(hero)"""

