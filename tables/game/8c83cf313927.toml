[[cheat]]
id = "stage-timer-ctrl-numpad-1"
name = "Stage Timer (Ctrl + Numpad 1)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : game.exe
// Author            : ndck76
// Game Version      : Build.16841918
// Script Date       : 2025-02-21


[ENABLE]

aobscanmodule(stagetimer,game.exe,8Bxxxxxxxxxx33xx85xx0FxxxxC1) // should be unique
alloc(newmem,$1000)
alloc(data2,8)
alloc(stagetimerbkp,6)
registersymbol(data2)
registersymbol(stagetimer)
registersymbol(stagetimerbkp)
label(code)
label(return)

stagetimerbkp:
  readmem(stagetimer,6)

newmem:
  mov [data2],esi

code:
  readmem(stagetimer,6)
  jmp return

stagetimer:
  jmp newmem
  nop
return:

[DISABLE]

stagetimer:
  readmem(stagetimerbkp,6)

unregistersymbol(*)
dealloc(*)"""

