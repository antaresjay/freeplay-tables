[[cheat]]
id = "updatecharacterbaseaddr"
name = "UpdateCharacterBaseAddr"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : game.exe
  Version: 
  Date   : 2019-11-26
  Author : CannonFodder

  This script does blah blah blah
}

define(hpReadCodeAdress,"game.exe"+14DB9)
define(hpReadCodeBytes,8B 88 3C 01 00 00)

[ENABLE]

assert(hpReadCodeAdress,hpReadCodeBytes)
label(endAddrUpdate)
label(endUnlimitedMove)
registersymbol(character_baseAddr)
registersymbol(updateCharBaseAddrEnable)
registersymbol(unlimitedMoveEnable)
registersymbol(maxExpEnable)
alloc(character_baseAddr, 4)
alloc(updateCharBaseAddrEnable, 4)
alloc(unlimitedMoveEnable, 4)
alloc(maxExpEnable, 4)

alloc(newmem,$1000)

label(code)
label(return)

newmem:
  cmp dword ptr [updateCharBaseAddrEnable], #0
  je endAddrUpdate
  mov [character_baseAddr],eax
endAddrUpdate:
  cmp dword ptr [unlimitedMoveEnable], #0
  je endUnlimitedMove
  cmp dword ptr [eax+00000008], #10000 //enemy char id > 10000, not very sure
  jg endUnlimitedMove
  mov [eax+0000014C],#0
endUnlimitedMove:
  cmp dword ptr [maxExpEnable], #0
  je code
  cmp dword ptr [eax+00000008], #10000 //enemy char id > 10000, not very sure
  jg code
  mov [eax+00000140],#99
code:
  mov ecx,[eax+0000013C]
  jmp return

hpReadCodeAdress:
  jmp newmem
  nop
return:

[DISABLE]
unregistersymbol(character_baseAddr)
unregistersymbol(updateCharBaseAddrEnable)
unregistersymbol(unlimitedMoveEnable)
unregistersymbol(maxExpEnable)
dealloc(character_baseAddr)
dealloc(updateCharBaseAddrEnable)
dealloc(unlimitedMoveEnable)
dealloc(maxExpEnable)

hpReadCodeAdress:
  db hpReadCodeBytes
  // mov ecx,[eax+0000013C]

dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: "game.exe"+14DB9

"game.exe"+14DAA: CC                 -  int 3 
"game.exe"+14DAB: CC                 -  int 3 
"game.exe"+14DAC: CC                 -  int 3 
"game.exe"+14DAD: CC                 -  int 3 
"game.exe"+14DAE: CC                 -  int 3 
"game.exe"+14DAF: CC                 -  int 3 
"game.exe"+14DB0: 55                 -  push ebp
"game.exe"+14DB1: 8B EC              -  mov ebp,esp
"game.exe"+14DB3: 8B 45 08           -  mov eax,[ebp+08]
"game.exe"+14DB6: 8B 40 04           -  mov eax,[eax+04]
// ---------- INJECTING HERE ----------
"game.exe"+14DB9: 8B 88 3C 01 00 00  -  mov ecx,[eax+0000013C]
// ---------- DONE INJECTING  ----------
"game.exe"+14DBF: 8B 45 0C           -  mov eax,[ebp+0C]
"game.exe"+14DC2: 89 08              -  mov [eax],ecx
"game.exe"+14DC4: 33 C0              -  xor eax,eax
"game.exe"+14DC6: 5D                 -  pop ebp
"game.exe"+14DC7: C2 08 00           -  ret 0008
"game.exe"+14DCA: CC                 -  int 3 
"game.exe"+14DCB: CC                 -  int 3 
"game.exe"+14DCC: CC                 -  int 3 
