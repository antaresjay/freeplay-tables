[[cheat]]
id = "game-actor-scott-ctrl-numpad-2-activate-during-game-play-may-take-awhile-to-activate"
name = "Game Actor Scott (Ctrl + Numpad 2) {Activate during game play. May take awhile to activate}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Game.exe
// Author            : ndck76
// Executable Version: 1.0.0.13877
// Game Version      : v1.0.0.13877
// Script Date       : 2026-03-04


[ENABLE]

aobscan(fsm,488B8Exxxx00000Fxxxxxx83xxxx0Fxxxxxxxxxx83xxxx0Fxxxxxxxxxx83xxxx0Fxxxxxxxxxx83xxxx) //Paris.Game.Actor.Player::RenderOverlay+D5
alloc(newmem,$1000,fsm)
alloc(data,8)
alloc(fsmbkp,7)
registersymbol(data)
registersymbol(fsm)
registersymbol(fsmbkp)
label(code)
label(return)

fsmbkp:
  readmem(fsm,7)

newmem:
  mov [data],rsi

code:
  readmem(fsm,7)
  jmp return

fsm:
  jmp newmem
  nop 2
return:

[DISABLE]

fsm:
  readmem(fsmbkp,7)

unregistersymbol(*)
dealloc(*)"""

