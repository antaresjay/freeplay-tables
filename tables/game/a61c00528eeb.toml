[[cheat]]
id = "showtime-at-any-time"
name = "SHOWTIME At Any Time"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc(newmem,$1000,read_showtime)
label(code_showtime,undo_showtime,showtime_offset)
registersymbol(code_showtime,undo_showtime,showtime_offset)

newmem:
  code_showtime:
    push rbp
    mov rbp,[showtime_offset]
    add rbp,08
    movss xmm0,[rbp+rcx]
    sub rbp,08
    movss [rbp+rcx],xmm0
    pop rbp

  undo_showtime:
    readmem(read_showtime,8)
    jmp return
    align 10 CC

  showtime_offset:
    readmem(read_showtime+04,4)
    align 08

read_showtime:
  jmp code_showtime
  nop 3
return:

[DISABLE]

read_showtime:
  readmem(undo_showtime,8)

unregistersymbol(code_showtime,undo_showtime,showtime_offset)
dealloc(newmem)"""

