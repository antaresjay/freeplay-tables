[[cheat]]
id = "player-character-ctrl-numpad-1"
name = "Player Character (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Game.exe
// Author            : ndck76
// Executable Version: 1.0.0.12208
// Game Version      : v1.0.0.12208
// Script Date       : 2025-12-02


[ENABLE]

aobscanregion(playerinfo,Paris.Game.Actor.Player::get_IsActiveHero,Paris.Game.Actor.Player::get_IsActiveHero+100,488B86xxxx000048xxxx74xx8Bxxxx0Fxxxxxxxxxxxx3Bxx0Fxxxx0Fxxxx48xxxxxx) //Paris.Game.Actor.Player::get_IsActiveHero+26
alloc(newmem,$1000,playerinfo)
alloc(data,8)
alloc(playerinfobkp,7)
registersymbol(data)
registersymbol(playerinfo)
registersymbol(playerinfobkp)
label(code)
label(return)

playerinfobkp:
  readmem(playerinfo,7)

newmem:
  mov [data],rsi

code:
  readmem(playerinfo,7)
  jmp return

playerinfo:
  jmp newmem
  nop 2
return:

[DISABLE]

playerinfo:
  readmem(playerinfobkp,7)

unregistersymbol(*)
dealloc(*)"""

