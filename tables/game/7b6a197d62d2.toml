[[cheat]]
id = "infinite-health"
name = "INFINITE HEALTH"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(health)
label(returnhere)
registersymbol(health)
aobscan(aob_health,66 89 4E 5C 85 FF 79 04 0C 01 EB 21 8B 4E 74 3B F9 7F 10)

newmem:
mov cx,#1000
mov [esi+5C],cx
test edi,edi
jmp returnhere

aob_health:
health:
jmp newmem
nop
returnhere:

[DISABLE]
dealloc(newmem)
unregistersymbol(health)
health:
mov [esi+5C],cx
test edi,edi"""

