[[cheat]]
id = "damage-modifier-script-god-mode-one-hit-kill-etc"
name = "Damage Modifier Script (God Mode, One Hit Kill, etc)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DamageModAOB,game.exe,01 91 1C 01 00 00 48 89 CB BF 7F 96 98 00 BD 0F 27 00 00)
registersymbol(DamageModAOB)
alloc(newmem,4096,DamageModAOB)

///
label(originalcode)
label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(EnemyDamageMultiplier)
registersymbol(EnemyDamageMultiplier)
label(HeroDamageMultiplier)
registersymbol(HeroDamageMultiplier)
label(EnemyHealingMultiplier)
registersymbol(EnemyHealingMultiplier)
label(HeroHealingMultiplier)
registersymbol(HeroHealingMultiplier)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

///
newmem:
  cmp byte ptr [rcx+10],1
  jne EnemyHit
HeroHit:
  cmp edx,0
  jl HeroDamageHit
  jg HeroHealingHit
  jmp originalcode
HeroDamageHit:
  cmp [HeroDamageMultiplier],(float)0.0
  je CheckGodMode
  neg edx
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [HeroDamageMultiplier]
  fistp dword ptr [rsp]
  pop edx
  neg edx
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor edx,edx
  jmp originalcode
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne originalcode
  push rax
  xor rax,rax
  mov eax,[rcx+0000011C]
  neg edx
  cmp edx,eax
  jl @F
  xor edx,edx
@@:
  neg edx
  pop rax
  jmp originalcode
HeroHealingHit:
  cmp [HeroHealingMultiplier],(float)0.0
  je originalcode
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [HeroHealingMultiplier]
  fistp dword ptr [rsp]
  pop edx
  jmp originalcode
EnemyHit:
  cmp edx,0
  jl EnemyDamageHit
  jg EnemyHealingHit
  jmp CheckOneHitKill
EnemyDamageHit:
  cmp [EnemyDamageMultiplier],(float)0.0
  je CheckOneHitKill
  neg edx
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [EnemyDamageMultiplier]
  fistp dword ptr [rsp]
  pop edx
  neg edx
CheckOneHitKill:
  cmp [OneHitKill],1
  jne originalcode
  mov edx,#999999
  neg edx
  jmp originalcode
EnemyHealingHit:
  cmp [EnemyHealingMultiplier],(float)0.0
  je originalcode
  push edx
  fild dword ptr [rsp]
  fmul dword ptr [EnemyHealingMultiplier]
  fistp dword ptr [rsp]
  pop edx
  
originalcode:
  add [rcx+0000011C],edx
  jmp return

GodMode:
dq 0
OneHitKill:
dq 0
EnemyDamageMultiplier:
dq (float)0.0
HeroDamageMultiplier:
dq (float)0.5
EnemyHealingMultiplier:
dq (float)0.0
HeroHealingMultiplier:
dq (float)2.0
HeroCannotDie:
dq 1

DamageModAOB:
  jmp newmem
  nop
  return:
  
[DISABLE]

DamageModAOB:
  db 01 91 1C 01 00 00

unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(EnemyDamageMultiplier)
unregistersymbol(HeroDamageMultiplier)
unregistersymbol(HeroCannotDie)
unregistersymbol(DamageModAOB)

dealloc(newmem)"""

