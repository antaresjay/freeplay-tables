[[cheat]]
id = "unlimited-life-p1"
name = "Unlimited Life P1"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here

originalcode:
mov [game.exe+27EB0C],6

exit:
jmp returnhere

"game.exe"+13D67C:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
"game.exe"+13D67C:
mov eax,[esi+game.exe+27EB0C]
//Alt: db 8B 86 0C EB BE 00"""

