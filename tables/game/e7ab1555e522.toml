type = "script"
source = """
{ Game   : Game.exe
  Version: 
  Date   : 2017-01-29
  Author : Ahsan Iqbal (3xd_tango)

  This script inf.health
}

[ENABLE]

aobscanmodule(INJECT,RGSS301.dll,89 2C 88 5D 59 C3 F7 06 00 20 00 00)
alloc(newmem,$1000)

label(code)
label(return)
label(player)

newmem:
cmp [eax+20],0
jne code
cmp [eax+04],1
jne code
cmp [eax+0C],1
jne code
cmp [eax+18],0
jne code
cmp [eax+24],#4
jne code
je player

code:
  mov [eax+ecx*4],ebp
  pop ebp
  pop ecx
  jmp return

player:
  mov [eax+ecx*4],ebp
  mov [eax+30],#5
  pop ebp
  pop ecx
  jmp return

INJECT:
  jmp newmem
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 89 2C 88 5D 59

unregistersymbol(INJECT)
dealloc(newmem)"""

