[[cheat]]
id = "enable-pointers-populate-in-battle"
name = "Enable (Pointers populate in battle.)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(gamedata,StarBox:Update,StarBox:Update+4c,88 87 FD 00 00 00 8B)
alloc(newmem,$1000)
registersymbol(infobase)
label(code)
label(return)
label(infobase)

newmem:
mov [infobase],edi

code:
  mov [edi+000000FD],al
  jmp return

infobase:
dq 0

gamedata:
  jmp newmem
  nop
return:
registersymbol(gamedata)

[DISABLE]

gamedata:
  db 88 87 FD 00 00 00

unregistersymbol(*)
dealloc(*)"""
