[[cheat]]
id = "active-trainer"
name = "Active Trainer"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
aobscanmodule(active,Game.exe,F3 0F 10 86 D8 01 00 00 F3 0F 5E 86 B4 01 00 00 57 51 F3 0F 11 04 24)
registersymbol(active)
label(health)
label(ammo)
label(lives)
label(score)
label(healthE)
label(ammoE)
label(livesE)
label(scoreE)
registersymbol(healthE)
registersymbol(ammoE)
registersymbol(livesE)
registersymbol(scoreE)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
/// 1e0 rockets
///1b4 - 1c8 full health 1D8 health
/// 1dc lives
/// 1f8 score
health:
cmp [healthE],0
je ammo
fld dword ptr [esi+1c8]
fstp dword ptr [esi+1d8]
ammo:
cmp [ammoE],0
je lives
mov [esi+1e0],f
lives:
cmp [livesE],0
je score
cmp [esi+1dc],63
jae score
mov [esi+1dc],63
score:
cmp [scoreE],0
je originalcode
cmp [esi+1f8],5F5E0FF
jae originalcode
mov [esi+1f8],5F5E0FF
originalcode:
movss xmm0,[esi+000001D8]

exit:
jmp returnhere
healthE:
dd 0
ammoE:
dd 0
livesE:
dd 0
scoreE:
dd 0
active://"Game.exe"+2AF4CC:
jmp newmem
nop
nop
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
active://
movss xmm0,[esi+000001D8]
//Alt: db F3 0F 10 86 D8 01 00 00
unregistersymbol(healthE)
unregistersymbol(ammoE)
unregistersymbol(livesE)
unregistersymbol(scoreE)
unregistersymbol(active)"""

