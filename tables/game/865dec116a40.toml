[[cheat]]
id = "ignore-most-hits"
name = "Ignore most hits"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Guacamelee Super Turbo Championship Edition
  Version: Steam build 426719
  Date   : 2016-01-19
  Author : DR C

  Check if hit function was called with player stucture as an argument. If it was, skip the jump to the hit processing.
}

define(address,"game.exe"+25B6C1)
define(bytes,3B CE 77 0D 80 7A 14 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000)

label(code)
label(origcode)
label(return)

newmem:

code:
  push eax
  mov eax,[game.exe+0051F4D8]
  mov eax,[eax+10]
  mov eax,[eax+64]
  mov eax,[eax+6c]
  cmp [ebp+0C],eax
  pop eax
  jne origcode
  cmp byte ptr [edx+14],00
  jmp return

origcode:
  cmp ecx,esi
  ja game.exe+25B6D2
  cmp byte ptr [edx+14],00
  jmp return

address:
  jmp code
  nop
  nop
  nop
return:

[DISABLE]

address:
  db bytes
  // cmp ecx,esi
  // ja game.exe+25B6D2
  // cmp byte ptr [edx+14],00

dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: "game.exe"+25B6C1

"game.exe"+25B69F: D9 5D FC              -  fstp dword ptr [ebp-04]
"game.exe"+25B6A2: 8B 45 FC              -  mov eax,[ebp-04]
"game.exe"+25B6A5: 25 FF FF FF 7F        -  and eax,7FFFFFFF
"game.exe"+25B6AA: 81 CE 00 00 00 80     -  or esi,80000000
"game.exe"+25B6B0: 33 F1                 -  xor esi,ecx
"game.exe"+25B6B2: 8B C8                 -  mov ecx,eax
"game.exe"+25B6B4: C1 E9 1F              -  shr ecx,1F
"game.exe"+25B6B7: F7 D9                 -  neg ecx
"game.exe"+25B6B9: 81 C9 00 00 00 80     -  or ecx,80000000
"game.exe"+25B6BF: 33 C8                 -  xor ecx,eax
// ---------- INJECTING HERE ----------
"game.exe"+25B6C1: 3B CE                 -  cmp ecx,esi
"game.exe"+25B6C3: 77 0D                 -  ja game.exe+25B6D2
"game.exe"+25B6C5: 80 7A 14 00           -  cmp byte ptr [edx+14],00
// ---------- DONE INJECTING  ----------
"game.exe"+25B6C9: 75 07                 -  jne game.exe+25B6D2
"game.exe"+25B6CB: 32 C0                 -  xor al,al
"game.exe"+25B6CD: 5E                    -  pop esi
"game.exe"+25B6CE: 8B E5                 -  mov esp,ebp
"game.exe"+25B6D0: 5D                    -  pop ebp
"game.exe"+25B6D1: C3                    -  ret 
"game.exe"+25B6D2: 57                    -  push edi
"game.exe"+25B6D3: 8B 7D 0C              -  mov edi,[ebp+0C]
"game.exe"+25B6D6: D9 87 AC 01 00 00     -  fld dword ptr [edi+000001AC]
"game.exe"+25B6DC: 8B F7                 -  mov esi,edi
}"""

