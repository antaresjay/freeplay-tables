type = "script"
source = """
{ Game   : Game.exe
  Version: 
  Date   : 2017-07-14
  Author : Squall8
}

[ENABLE]

aobscan(infhealth,89 08 8B 05 * * * * 3D 01 00 00 00 75 * 8B 05 * * * * 83 EC 08)
