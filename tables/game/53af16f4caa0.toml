unregistersymbol(infhealth)"""

[[cheat]]
id = "inf-parameter-points-player-pointers-to-activate-open-character-menu"
name = "Inf Parameter Points+Player Pointers (To Activate Open Character Menu)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Game.exe
  Version: 
  Date   : 2017-07-14
  Author : Squall8
}

[ENABLE]

aobscan(parampoints,89 08 8B 0D * * * * B8 * * * * 89 08 8B 0D * * * * B8 * * * * 89 08 8B 0D * * * * B8 * * * * 89 08 8B 0D * * * * B8 * * * * 89 08 8B 05 * * * * 89 85 BC F0 FF FF)
alloc(newmem,$1000)

label(code)
label(return)
label(playerp)

newmem:
  mov [playerp],eax
  readmem(parampoints,8)
  mov [eax],63
  jmp return

code:
  readmem(parampoints,8)
  jmp return

playerp:
  dd 0

parampoints:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(parampoints)
registersymbol(code)
registersymbol(playerp)

[DISABLE]

parampoints:
  readmem(code,8)

unregistersymbol(parampoints)
unregistersymbol(code)
unregistersymbol(playerp)
dealloc(newmem)"""

