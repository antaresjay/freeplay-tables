[[cheat]]
id = "health-flask-ctrl-numpad-4-use-flask-to-populate-values"
name = "Health Flask (Ctrl + Numpad 4) {Use flask to populate values}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Blasphemous 2.exe
// Author            : ndck76
// Executable Version: 2021.3.20.30871
// Game Version      : v1.0.5-cs43681
// Script Date       : 2023-08-25


[ENABLE]

aobscanmodule(potion,GameAssembly.dll,FFxxxxxxxxxx488Bxxxx89xxxxxxxxxx8Bxxxxxxxxxx89xxxxxxxxxxE9) //Game._3rd_party.Kinematic2D.Implementation.Scripts.Character_Abilities.Item_Usage.FlaskUse.OnUpdate
alloc(newmem,$1000,potion)
alloc(data2,8)
alloc(potionbkp,6)
registersymbol(data2)
registersymbol(potion)
registersymbol(potionbkp)
label(code)
label(return)

potionbkp:
  readmem(potion,6)

newmem:
  mov [data2],rbx

code:
  readmem(potion,6)
  jmp return

potion:
  jmp newmem
  nop
return:

[DISABLE]

potion:
  readmem(potionbkp,6)

unregistersymbol(*)
dealloc(*)"""

