id = "unlimited-ammo"
name = "Unlimited Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(ammo_aob,Warhammer.exe,83 BB E0 3A 00 00 00 0F 97 C0 48 8B 5C 24 30)
alloc(newmem,$1000,ammo_aob)

label(code)
label(return)

newmem:
cmp byte ptr [rbx+003A68],00
jne code
fild [rbx+00003AE4]
fistp [rbx+00003AE0]
code:
cmp dword ptr [rbx+00003AE0],00
seta al
mov rbx,[rsp+30]

jmp return

ammo_aob:
mov rdi, newmem
jmp rdi
nop 3
return:
registersymbol(ammo_aob)

[DISABLE]

ammo_aob:
db 83 BB E0 3A 00 00 00 0F 97 C0 48 8B 5C 24 30

unregistersymbol(ammo_aob)
dealloc(newmem)"""
