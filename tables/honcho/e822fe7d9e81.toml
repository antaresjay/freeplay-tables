[ENABLE]

aobscanmodule(timefloat,GameAssembly.dll,F3xxxxxxxxxxxxxx33xxE8xxxxxxxx488Bxxxx4885xx0F84xxxxxxxx66xxxxxxxxxxxxxx0F5BxxF3xxxxxxF3xxxxxxxxxxxxxxF3) //UniStorm.UniStormSystem.Update
alloc(newmem,$1000,timefloat)
alloc(data2,8)
alloc(timefloatbkp,8)
registersymbol(data2)
registersymbol(timefloat)
registersymbol(timefloatbkp)
label(code)
label(return)

timefloatbkp:
  readmem(timefloat,8)

newmem:
  mov [data2],rdi

code:
  readmem(timefloat,8)
  jmp return

timefloat:
  jmp newmem
  nop 3
return:

[DISABLE]

timefloat:
  readmem(timefloatbkp,8)

unregistersymbol(*)
dealloc(*)"""

