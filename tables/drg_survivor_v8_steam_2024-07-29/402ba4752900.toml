[[cheat]]
id = "movement-speed-boost-careful-with-drop-pod"
name = "Movement Speed Boost (Careful with drop pod)"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,GameAssembly.dll,F3 0F 10 48 28 75) // should be unique
alloc(newmem,$1000,INJECT)

label(code)
label(return)

newmem:

code:
  movss xmm1,[rax+28]
  mulss xmm1, xmm1 // square move speed
  jmp return

INJECT:
  jmp newmem
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db F3 0F 10 48 28

unregistersymbol(INJECT)
dealloc(newmem)"""

