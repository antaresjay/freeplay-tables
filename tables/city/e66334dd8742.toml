define(address,Opsive.UltimateInventorySystem.Exchange.CurrencyCollection:GetAmountOf+b8)
define(bytes,48 8B 08 48 89 4D 90)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Opsive.UltimateInventorySystem.Exchange.CurrencyCollection:GetAmountOf+b8)

label(code)
label(return)
label(data3)
registersymbol(data3)

newmem:
  mov [data3],rax

code:
  mov rcx,[rax]
  mov [rbp-70],rcx
  jmp return

data3:
  db

address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  db bytes
  // mov rcx,[rax]
  // mov [rbp-70],rcx

dealloc(*)
unregistersymbol(*)"""

