type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
aobscanmodule(construction,cnc3ep1.dat,D9 46 1C 89 46 58 D9 5E 5C)
registersymbol(construction)



newmem:
cmp [esi+1C],(floaT)100
jge originalcode
cmp [esi+1C],0
je originalcode
mov [esi+1C],(float)100
originalcode:
fld dword ptr [esi+1C]
mov [esi+58],eax
jmp returnhere

construction:
jmp newmem
nop
returnhere:




[DISABLE]
dealloc(newmem)
construction:
fld dword ptr [esi+1C]
mov [esi+58],eax
unregistersymbol(construction)"""
