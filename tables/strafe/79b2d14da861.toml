type = "script"
source = """
{ Game   : STRAFE.exe
  Version: 1.0.6
  Date   : 2017-07-03
  Author : Bakfiets

  This script replaced the current ammo of the primary weapon with its magazine count
  It also has the ability to prevent using ammo when the Primary only feature is activated
}
USEMONO()
[ENABLE]
define(INF_AMMO, vp_SimpleInventory:set_OnValue_CurrentWeaponAmmoCount+22)
alloc(INF_AMMO_MEM,64)
alloc(PRIMARY_ONLY,1)

label(return)
label(SET_AMMO)
label(SET_AMMO_SECONDARY)
label(ORIGINALCODE)

PRIMARY_ONLY:
db 0

INF_AMMO_MEM:
  cmp [rax+34],00
  jne SET_AMMO
  jmp SET_AMMO_SECONDARY

SET_AMMO:
  push rbx
  mov rbx,[rax+34]
  mov [rax+30],rbx
  pop rbx
  jmp return

SET_AMMO_SECONDARY:
  cmp [PRIMARY_ONLY],1
  je ORIGINALCODE
  mov rbx, [rax+30]
  jmp return

ORIGINALCODE:
 mov [rax+30],ecx
 jmp return

INF_AMMO:
  jmp INF_AMMO_MEM
  nop
  nop

return:

registersymbol(INF_AMMO)
registersymbol(PRIMARY_ONLY)

[DISABLE]
INF_AMMO:
  db 89 48 30

unregistersymbol(INF_AMMO)
//unregistersymbol(PRIMARY_ONLY)
dealloc(INF_AMMO_MEM)

