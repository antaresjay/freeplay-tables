name = "GODMODE"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : STRAFE.exe
  Version: 1.0.6
  Date   : 2017-07-15
  Author : Bakfiets

  This script enables two 'godmode' functions to be activated
  1) Infinite HP (prevent health damage)
  2) One-shot-kill
}
USEMONO()
//define(SENDDAMAGE_MANIPULATION,HealthHandler:sendDamage+4af)

[ENABLE]
aobscan(SENDDAMAGE_MANIPULATION,F3 0F 11 A8 84 00 00 00 48 8B 85 D0 FE FF FF 48 8B 40 40 48 85 C0 74 26) // should be unique
alloc(SENDDAMAGE_MANIPULATION_MEM,$1024)
alloc(INF_HP_ENABLED,8,STRAFE.exe)
alloc(ONE_SHOT_ENABLED,8,STRAFE.exe)
alloc(ONE_SHOT_DAMAGE,8,STRAFE.exe)
label(originalcode)
label(return)
label(one_shot)


ONE_SHOT_DAMAGE:
dq 0

INF_HP_ENABLED:
dq 0

ONE_SHOT_ENABLED:
dq 0

SENDDAMAGE_MANIPULATION_MEM:
  cmp [rax+90],42c80000 // _initialhealth == (int)100
  jne one_shot //If not 100, jump to one-shot
  cmp [rax+8C],01 // _canHeal == (int)1
  jne originalcode // Second check for monster
  cmp [INF_HP_ENABLED],0
  je originalcode
  //movss [rax+00000084],xmm5
  jmp return

one_shot:
  cmp [ONE_SHOT_ENABLED],0
  je originalcode
  movss xmm5,[ONE_SHOT_DAMAGE]
  je originalcode

originalcode:
  movss [rax+00000084],xmm5
  jmp return

SENDDAMAGE_MANIPULATION:
  jmp SENDDAMAGE_MANIPULATION_MEM
  nop
  nop
  nop

return:




registersymbol(SENDDAMAGE_MANIPULATION)
registersymbol(INF_HP_ENABLED)
registersymbol(ONE_SHOT_ENABLED)

[DISABLE]
SENDDAMAGE_MANIPULATION:
  db F3 0F 11 A8 84 00 00 00


unregistersymbol(SENDDAMAGE_MANIPULATION)
dealloc(SENDDAMAGE_MANIPULATION_MEM)
dealloc(INF_HP_ENABLED)
dealloc(ONE_SHOT_ENABLED)
dealloc(ONE_SHOT_DAMAGE)

