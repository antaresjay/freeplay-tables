[[cheat]]
id = "set-player-stats"
name = "Set Player Stats"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(money,KcArray.mfx,5B 8B 44 81 20)
alloc(newmem,$1000)

label(code)
label(return)
label(player)

newmem:

player:
  db 00 00 00 00

code:
  mov [player],ecx
  pop ebx
  mov eax,[ecx+eax*4+20]
  jmp return

money:
  jmp code
return:
registersymbol(money)
registersymbol(player)

[DISABLE]
money:
  db 5B 8B 44 81 20
unregistersymbol(money)
unregistersymbol(player)
dealloc(newmem)"""

