name = "Infinite Ammo (Ctrl + Numpad 2)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : RiftApart.exe
// Author            : ndck76
// Executable Version: 1.726.0.0
// Game Version      : v1.726.0.0
// Script Date       : 2023-07-27


[ENABLE]

aobscanmodule(ammo,RiftApart.exe,F3xxxxxxxxxxxxxx488BxxE8xxxxxxxxF3xxxxxx0F57) // should be unique
alloc(newmem,$1000,ammo)
alloc(ammobkp,8)
registersymbol(ammo)
registersymbol(ammobkp)
label(code)
label(return)

ammobkp:
  readmem(ammo,8)

newmem:
  mov [rcx+00000498],(float)999

code:
  readmem(ammo,8)
  jmp return

ammo:
  jmp newmem
  nop 3
return:

[DISABLE]

ammo:
  readmem(ammobkp,8)

unregistersymbol(*)
dealloc(*)"""
