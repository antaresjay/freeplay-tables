[[cheat]]
id = "god-mode-disable-player-burning-from-traps"
name = "God Mode + Disable Player Burning from Traps"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Loot River.exe
  Version: 1.0
  Date   : 2022-05-03
  Author : SinGul4ritY
           2020-07-23 - update for 1.0.8
           2022-05-13 - update for 1.1.6.0
           2022-05-04 - add Disable Player Burning

}

[ENABLE]

aobscanmodule(GodMode,GameAssembly.dll,40 53 41 56 41 57 48 81 ?? ?? ?? ?? ?? 80 ?? ?? ?? ?? ?? ?? 4D) // should be unique
aobscanmodule(IsPlayerBurning,GameAssembly.dll,80 ?? ?? ?? ?? ?? ?? 74 ?? 48 8B ?? ?? ?? ?? ?? F6 ?? ?? ?? ?? ?? ?? 74 ?? 83 ?? ?? ?? ?? ?? ?? 75 ?? 48 8B ?? E8 ?? ?? ?? ?? 48 8B ?? ?? ?? ?? ?? 48 8B ?? ?? ?? ?? ?? 45 33)
alloc(newmem2,64,IsPlayerBurning)

label(return2)
registersymbol(IsPlayerBurning)
registersymbol(GodMode)

GodMode:
  ret

newmem2:
  mov byte ptr [rbx+000001D5],00
  cmp bl, bl
  jmp return2

IsPlayerBurning:
  jmp newmem2
  nop 2
return2:

[DISABLE]

GodMode:
  db 40

IsPlayerBurning:
  db 80 BB CD 01 00 00 00

unregistersymbol(*)
dealloc(*)"""

