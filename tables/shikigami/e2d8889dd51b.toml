type = "script"
source = """
{ Game   : Shikigami.exe
  Version: 
  Date   : 2017-10-05
  Author : wcz
}

[ENABLE]

aobscanmodule(Player,Shikigami.exe,8B 72 14 83 FE 03)
alloc(newmem,$1000)

label(code)
label(Invulnerable)
label(Invulnerable_status)
label(Life)
label(Life_status)
label(Bomb)
label(Bomb_status)
label(return)
globalalloc(pPlayer,4)

newmem:
  mov [pPlayer],edx
  jmp Invulnerable

Invulnerable:
  cmp [Invulnerable_status],0
  je Life
  mov [edx+60],#200
  mov [edx+8c],#2
  jmp Life

Invulnerable_status:
 dd 0

Life:
  cmp [Life_status],0
  je Bomb
  mov [edx+14],#3
  jmp Bomb

Life_status:
 dd 0

Bomb:
  cmp [Bomb_status],0
  je code
  mov byte ptr [edx+7e],5
  jmp code

Bomb_status:
 dd 0

code:
  mov esi,[edx+14]
  cmp esi,03
  jmp return

Player:
  jmp newmem
  nop
return:
registersymbol(Player)
registersymbol(Invulnerable_status)
registersymbol(Life_status)
registersymbol(Bomb_status)

[DISABLE]

Player:
  db 8B 72 14 83 FE 03

unregistersymbol(Player)
unregistersymbol(Invulnerable_status)
unregistersymbol(Life_status)
unregistersymbol(Bomb_status)
dealloc(newmem)

