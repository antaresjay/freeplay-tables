[[cheat]]
id = "pointers"
name = "Pointers"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : SorginaATaleOfWitches.exe
  Version: Update v20170707
  Date   : 2017-07-09
  Author : Squall8
}

[ENABLE]

aobscan(timeread,89 48 34 8B 47 0C)
alloc(newmem,$1000,"SorginaATaleOfWitches.exe")

label(code)
label(return)
label(ps1)

newmem:
  mov [ps1],eax

code:
  mov [eax+34],ecx
  mov eax,[edi+0C]
  jmp return

ps1:
  dd 0

timeread:
  jmp newmem
  nop
return:
registersymbol(timeread)
registersymbol(ps1)

[DISABLE]

timeread:
  db 89 48 34 8B 47 0C

unregistersymbol(timeread)
unregistersymbol(ps1)
dealloc(newmem)"""

