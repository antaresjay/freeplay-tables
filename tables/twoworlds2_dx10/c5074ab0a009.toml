[[cheat]]
id = "weight"
name = "weight"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : TwoWorlds2_DX10.exe
  Version: 2.0.8
  Date   : 2024-12-23
  Author : oyyzj

  make weight 0
}

[ENABLE]

aobscanmodule(Weight,TwoWorlds2_DX10.exe,89 86 5C 0D 00 00 E8 8B) // should be unique
alloc(newmem,100)
registersymbol(Weight)
alloc(pWeight,4)
registersymbol(pWeight)
label(code)
label(return)
label(rWeight)
registersymbol(rWeight)
newmem:
  mov [pWeight],esi
code:
  mov [esi+D5C],00
  jmp return
rWeight:
  readmem(Weight,6)
Weight:
  jmp newmem
  nop
return:

[DISABLE]

Weight:
  readmem(rWeight,6)

unregistersymbol(*)
dealloc(*)"""

