[[cheat]]
id = "money"
name = "Money"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : TwoWorlds2_DX10.exe
  Version: 2.0.8
  Date   : 2024-12-23
  Author : oyyzj
  Credit : Recifense (I had to use his old script as preference)

  set Money / set Attribute Points / set Skill points
  ingame the value still decreases, reopen your inventory get refresh
  your desired value back.
}

[ENABLE]

aobscanmodule(MoneyApSp,TwoWorlds2_DX10.exe,8B 93 20 0A 00 00 8B 42) // should be unique
alloc(newmem,$1000)
registersymbol(MoneyApSp)
label(code)
label(return)
label(rMoneyApSp)
registersymbol(rMoneyApSp)
label(vMoney)
registersymbol(vMoney)
label(vAP)
registersymbol(vAP)
label(vSP)
registersymbol(vSP)
label(_MonEV01)
label(_MonEV02)

newmem:
 mov edx,[ebx+00000a20]            // Get pointer to encrypted values
 mov eax,[edx+24]                  // Get encrypted Auras ... ok
 xor eax,5a63cd29                  // ... and decrypt it
 cmp eax,[vMoney]                  // Current value >= minimum 2
 jge _MonEV01                      // Jump if true
 mov eax,[vMoney]                  // Get minimum value ...
 xor eax,5a63cd29                  // ... and encrypt it
 mov [edx+24],eax                  // Update Aura encrypted value

_MonEV01:
 mov cx,6a39
 mov ax,[edx+10]                   // Get encrypted Attribute Points ...
 xor ax,cx                         // ... and decrypt it
 cmp ax,[vAP]                      // Current value >= minimum 2
 jge _MonEV02                      // Jump if current value >= 20
 mov ax,[vAP]                      // Get minimum value ...
 xor ax,cx                         // ... and encrypt it
 mov [edx+10],ax                   // Update Attribute Points encrypted value

_MonEV02:
 mov ax,[edx+12]                   // Get encrypted Skill Points ...
 xor ax,cx                         // ... and decrypt it
 cmp ax,[vSP]                      // Current value >= minimum 2
 jge code                          // Jump if current value >= 20
 mov ax,[vSP]                      // Get minimum value ...
 xor ax,cx                         // ... and encrypt it
 mov [edx+12],ax                   // Update Attribute Points encrypted value

code:
  readmem(MoneyApSp,6)
  jmp return

rMoneyApSp:
  readmem(MoneyApSp,6)
vMoney:
  dd ff
vAP:
  dd 04
vSP:
  dd 02

MoneyApSp:
  jmp newmem
  nop
return:

[DISABLE]

MoneyApSp:
  readmem(rMoneyApSp,6)

unregistersymbol(*)
dealloc(*)"""

