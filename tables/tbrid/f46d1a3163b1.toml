[[cheat]]
id = "bugfix-remove-windows-and-directx-version-checks"
name = "Bugfix: Remove windows and directx version checks"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(WindowsVersionCheck,33 C0 55 68 01 13 40 00)
aobscan(DXVersionCheck,FF FF FF 33 C0 33 D2 33 C9)
registersymbol(WindowsVersionCheck)
registersymbol(DXVersionCheck)

WindowsVersionCheck-6:
mov eax,15
retn

DXVersionCheck-6:
mov eax,700
retn

[DISABLE]
unregistersymbol(WindowsVersionCheck)
unregistersymbol(DXVersionCheck)

WindowsVersionCheck-6:
push ebp
mov ebp,esp
push 0
push ebx

DXVersionCheck-6:
push ebp
mov ebp,esp
add esp,FFFFFF74"""

