[[cheat]]
id = "alternate-leveling-system"
name = "Alternate leveling system"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
define(SPEED_DIVISOR,#1000)         //you get +1 movement point every SPEED_DIVISOR xp
define(WEAPON_SKILL_DIVISOR,#50)    //you get +1 damage point every WEAPON_SKILL_DIVISOR xp
define(HP_DIVISOR,#100)          //you get +1 hitpoint every HP_DIVISOR xp

alloc(CodeBuffer,2048)
label(GetDrivingSkill)
label(GetDrivingSkill_NotLookingForPM1)
label(GetDrivingSkill_NotLookingForPM2)
label(GetDrivingSkill_Error)
label(GetDrivingSkill_Exit)
label(GetSpeedBonus)
label(GetShortRangeSkill)
label(GetMedRangeSkill)
label(GetLongRangeSkill)
label(GainXP)
label(GainXP_NotInAPM1)
label(GainXP_NotInAPM2)
label(GainXP_UpdateWeaponXp)
label(GainXP_GotAGrenade)
label(GainXP_NoShortRangeWeapon)
label(GainXP_NoMedRangeWeapon)
label(GainXP_Exit)
label(GetTotalXp)
label(GetTotalXp_BadGuys)
label(GetTotalXpEcxForm)
label(GetTotalXpEdxForm)
label(GetTotalXpEaxForm)


TBRID.MainformFinalize+5A8:
jmp GetDrivingSkill

////////////////////////////////////////
TBRID.MainformFinalize+580:
jmp GetSpeedBonus

////////////////////////////////////////
TBRID.MainformFinalize+5E0:
jmp GetShortRangeSkill

////////////////////////////////////////
TBRID.MainformFinalize+608:
jmp GetMedRangeSkill

////////////////////////////////////////
TBRID.MainformFinalize+630:
jmp GetLongRangeSkill

////////////////////////////////////////
TBRID.MainformFinalize+514:
jmp GainXP

//////////////////////////////////////// medals
TBRID.ChkosversionFinalize+FAD:
mov al,byte [ecx+TBRID.frbBattleField+E73C]  //read medal count

TBRID.ChkosversionFinalize+C15:
mov dl,byte [ecx+TBRID.frbBattleField+E73C]

TBRID.ChkosversionFinalize+C41:
mov byte [ecx+TBRID.frbBattleField+E73C],dl  //write medal count

TBRID.exe+24DB8:
MOV dl,byte [ECX+TBRID.exe+E3CB4]

TBRID.exe+333DE:
MOV dl,byte [EBX+TBRID.exe+E3CB4]               //hohoho, the part that determines which end you get (using the medals)

////////////////////////////////////////
TBRID.MainformFinalize+2814:
lea eax,[eax+TBRID.exe+E3CB4]           //give a pointer to the PlayerData to GetTotalXp
jmp GetTotalXp

TBRID.exe+32F8A:
call GetTotalXpEcxForm
nop

TBRID.exe+333FC:
call GetTotalXpEdxForm
nop

TBRID.exe+24E05 :
call GetTotalXpEaxForm
nop

////////////////////////////////////////


CodeBuffer:
//when entering this function eax=&PlayerData and edx=1 PM1,2 for PM2, 3 for PM3
GetDrivingSkill:
//vanilla PlayerData format
//mov ebx, dword [eax]      //ebx= medal count
//mov ecx, dword [eax+04]    //ecx= xp
//mov esi, dword [eax+0C]    //edx= current level

//new PlayerData format:
//ebx 0:7              medal count
//ebx 8:21             short range xp
//ebx 22:31 + ecx 0:3  med range xp
//ecx 4:17             long range xp
//ecx 18:31            PM01 xp
//esi 0:13             PM02 xp
//esi 14:27            PM03 xp
cmp edx, 1
jne short GetDrivingSkill_NotLookingForPM1
  mov ax, word [eax+4]
  shr eax,#18
  and eax,3FFF         //only take 14 bits
  jmp short GetDrivingSkill_Exit
GetDrivingSkill_NotLookingForPM1:
cmp edx, 2
jne short GetDrivingSkill_NotLookingForPM2
  mov ax, word [eax+C]   //medal count
  and eax,3FFF           //only take 14 bits
  jmp short GetDrivingSkill_Exit
GetDrivingSkill_NotLookingForPM2:
cmp edx, 3
jne short GetDrivingSkill_Error
  mov eax, dword [eax+C]   //xp
  shr eax,#14              //thash part of the PM2 xp
  and eax,3FFF             //only take 14 bits
  jmp short GetDrivingSkill_Exit
GetDrivingSkill_Error:
xor eax,eax
GetDrivingSkill_Exit:
xor edx,edx
push ecx
mov ecx,HP_DIVISOR         //mech hp bonus = chassis xp/100
div ecx
pop ecx
retn

///////////////////////////////////////////////
//when entering this function eax=&PlayerData
GetShortRangeSkill://damage bonus is now weapon xp/50
push ecx         //save ecx, may not be needed

mov eax,dword [eax+1]
and eax,3FFF              //now eax=short range xp
//now lets' do eax=eax/50
xor edx,edx
mov ecx,WEAPON_SKILL_DIVISOR
div ecx

pop ecx
retn


///////////////////////////////////////////////
//when entering this function eax=&PlayerData
GetMedRangeSkill://damage bonus is now weapon xp/50 =
push ecx         //save ecx, may not be needed

mov eax,dword [eax+2]
shr eax,6
and eax, 3FFF        //now eax=med range xp
xor edx,edx
mov ecx,WEAPON_SKILL_DIVISOR
div ecx

pop ecx
retn

///////////////////////////////////////////////
//when entering this function eax=&PlayerData
GetLongRangeSkill://mech skill bonus is now mech xp/100 =
push ecx         //save ecx, may not be needed

mov eax,dword [eax+4]
shr eax,4
and eax, 3FFF            //now eax=long range xp
xor edx,edx
mov ecx,WEAPON_SKILL_DIVISOR
div ecx

pop ecx
retn

///////////////////////////////////////////////
GetTotalXp:
cmp eax,TBRID.exe+e3cc4
jb GetTotalXp_BadGuys
cmp eax,TBRID.exe+E3D44
ja GetTotalXp_BadGuys
  push edx
  push ecx         //save ecx, may not be needed
  mov edx,dword [eax+4]
  shr edx,#18               //now edx=pm01 xp
  mov ecx,dword [eax+C]
  and ecx, 3FFF            //now ecx=pm02 xp
  add edx,ecx              //now edx=pm01+pm02 xp
  mov ecx,dword [eax+C]
  shr ecx,E
  and ecx, 3FFF            //now ecx=pm03 xp
  add edx,ecx              //now edx=pm01+pm02+pm03 xp
  mov eax,edx
  pop ecx
  pop edx
retn
GetTotalXp_BadGuys:
xor eax,eax
retn

GetTotalXpEcxForm:
lea eax, [ecx+TBRID.exe+e3cb4]
call GetTotalXp
ret

GetTotalXpEdxForm:
push eax
lea eax, [edx+TBRID.exe+e3cb4]
call GetTotalXp
mov ecx, eax
pop eax
ret

GetTotalXpEaxForm:
push eax
lea eax, [edx+TBRID.exe+e3cb4]
call GetTotalXp
mov edx, eax
pop eax
ret
///////////////////////////////////////////////
//when entering this function eax=&PlayerData
GetSpeedBonus:   //speed bonus is now total xp/1000 = (PM01 + PM02 + PM03) xp/1000
push ecx         //save ecx, may not be needed
call GetTotalXp
//now lets' do eax=TotalXp/1000
xor edx,edx
mov ecx,SPEED_DIVISOR
div ecx
pop ecx
retn

///////////////////////////////////////////////
GainXP:    //updates your xp and level and returns 1 if you gained a level
//when entering this function eax=&PlayerData, edx = new xp, ecx=xp increment (with mod)
//First find which character we're handling
push ecx
push edi
push ebx

mov edi,ecx                  //edi=xp income
mov ecx,eax
sub ecx,TBRID.exe+E3CC4      //medal count for player 0 (Ryounosuke)
shr ecx,4                    //divide edx by the size of the Playerdata structure so now edx=player index (0 based)
cmp ecx,8                    //player index>8 means it's an enemy
ja GainXP_Exit
imul ecx,ecx,74              //0x74=size in byte of a PlayerMech structure
mov ebx,dword [TBRID.exe+E0AF4+ecx] //reads what mech you're on
cmp ebx,1
jne short GainXP_NotInAPM1
  mov ebx, dword [eax+4]
  shr ebx,#18                //got pm1 xp
  add ebx,edi                //increase pm1 xp
  shl ebx,#18
  and dword [eax+4],3FFFF    //clear stored pm1 xp
  or dword [eax+4],ebx
  jmp GainXP_UpdateWeaponXp
GainXP_NotInAPM1:
cmp ebx,2
jne short GainXP_NotInAPM2
  mov ebx, dword [eax+C]
  and ebx, 3FFF              //got pm2 xp
  add ebx,edi                //increase pm2 xp
  and dword [eax+C],FFFFC000 //clear stored pm2 xp
  or dword [eax+C],ebx
  jmp GainXP_UpdateWeaponXp
GainXP_NotInAPM2:
cmp ebx,3
jne short GainXP_UpdateWeaponXp    //a bug
  mov ebx, dword [eax+C]
  shr ebx,#14
  and ebx, 3FFF              //got pm3 xp
  add ebx,edi                //increase pm3 xp
  shl ebx,#14
  and dword [eax+C],FFFC000 //clear stored pm3 xp
  or dword [eax+C],ebx
GainXP_UpdateWeaponXp:
mov bl,byte [ecx+TBRID.exe+E0AF8] //bl=primary weapon
mov bh,byte [ecx+TBRID.exe+E0AFC] //bh=secondary weapon
sub bl,1
sub bh,1                             //if your weapon was 0 (no weapon) bl and bh are now = FF
//search for grenades (item id: 1)
push ecx
push edi
push eax
lea edi,[TBRID.exe+E0b08+ecx]
mov eax,1
mov ecx,4
db F2 AF //REPNE SCAS DWORD PTR ES:[EDI]
pop eax
pop edi
pop ecx
  je short GainXP_GotAGrenade //jump if the repne found a grenade
cmp bl,2              //otherwise check if prim/sec weapons are weapon id 1 or 2
setb dl               //unsigned comparison, so no weapon=-1=FF is bigger than 3, so dl=0
cmp bh,2
setb dh
test dx,dx                          //here dx is non zero if weapon-3<3
je short GainXP_NoShortRangeWeapon  //weapon IDs: 1=submachine gun, 2=shotgun
  GainXP_GotAGrenade:
  mov dx, word [eax+1]
  and edx, 3FFF              //got short range xp
  add edx,edi                //increase pm3 xp
  and word [eax+1],C000      //clear stored pm3 xp
  or word [eax+1],dx
GainXP_NoShortRangeWeapon:
sub bl,2
sub bh,2
cmp bl,2
setb dl
cmp bh,2
setb dh                   //here dx is non zero if 0<=weapon-3<2
test dx,dx                //which means we carry a medium range weapon
je short GainXP_NoMedRangeWeapon  //weapon IDs: 3=rockets 4=missile, 5=sniper
  mov edx, dword [eax+2]
  shr edx,6
  and edx, 3FFF              //got med range xp
  add edx,edi                //increase med range xp
  shl edx,6
  and dword [eax+2],FFF0003F //clear stored med range xp
  or dword [eax+2],edx
GainXP_NoMedRangeWeapon:     //weapon IDs: 6=144mm gun, 7=200mm gun, 8=long range missile, 9=long range rockets
sub bl,3
sub bh,3
cmp bl,4
setb dl
cmp bh,4
setb dh                   //here dx is non zero if 0<=weapon-4-2<5
test dx,dx                //which means we carry a long range weapon
je short GainXP_Exit
  mov edx, dword [eax+4]
  shr edx,4
  and edx, 3FFF              //got long range xp
  add edx,edi                //increase long range xp
  shl edx,4
  and dword [eax+4],FFFC000F //clear stored long range xp
  or dword [eax+4],edx
GainXP_Exit:
pop ebx
pop edi
pop ecx
retn


