EconomyMenuItem:BuildStuff+94: 48 8B 09                       - mov rcx,[rcx]
EconomyMenuItem:BuildStuff+97: 48 8B 89 88 00 00 00           - mov rcx,[rcx+00000088]
EconomyMenuItem:BuildStuff+9e: 48 63 89 24 01 00 00           - movsxd  rcx,dword ptr [rcx+00000124]
EconomyMenuItem:BuildStuff+a5: 48 63 C9                       - movsxd  rcx,ecx
EconomyMenuItem:BuildStuff+a8: 39 48 18                       - cmp [rax+18],ecx
EconomyMenuItem:BuildStuff+ab: 0F 86 97 5D 00 00              - jbe EconomyMenuItem:BuildStuff+5e48
EconomyMenuItem:BuildStuff+b1: 48 8D 44 C8 20                 - lea rax,[rax+rcx*8+20]
EconomyMenuItem:BuildStuff+b6: 48 8B 00                       - mov rax,[rax]
// ---------- INJECTING HERE ----------
EconomyMenuItem:BuildStuff+b9: 48 8B 50 20                    - mov rdx,[rax+20]
// ---------- DONE INJECTING  ----------
EconomyMenuItem:BuildStuff+bd: 48 8B C5                       - mov rax,rbp
