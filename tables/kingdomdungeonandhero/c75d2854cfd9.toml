[[cheat]]
id = "get-kingdom-only-when-economy-menu-is-open"
name = "Get Kingdom (only when economy menu is open)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : KingdomDungeonAndHero.exe
  Version: 
  Date   : 2024-07-17
  Author : CannonFodder

  This script does blah blah blah
}

[ENABLE]

//aobscan(EconomyMenuInject,48 8B 50 20 48 8B C5 48 05 40) // should be unique
aobscanregion(EconomyMenuInject,EconomyMenuItem:BuildStuff+86,EconomyMenuItem:BuildStuff+f0,48 8B 50 20 48 8B C5 48 05 ? ? ? ? 48 8B 8D 30) // should be unique
alloc(newmem,$1000,EconomyMenuInject)

registersymbol(kingdomAddr)

label(code)
label(return)

newmem:
  mov [kingdomAddr],rax
code:
  mov rdx,[rax+20]
  mov rax,rbp
  jmp return

kingdomAddr:
  dq 0

EconomyMenuInject:
  jmp newmem
  nop 2
return:
registersymbol(EconomyMenuInject)

[DISABLE]

EconomyMenuInject:
  db 48 8B 50 20 48 8B C5

unregistersymbol(*)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: EconomyMenuItem:BuildStuff+b9

EconomyMenuItem:BuildStuff+86: 48 8B 40 20                    - mov rax,[rax+20]
