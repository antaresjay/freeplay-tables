type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(powerr,F3 0F 7E 83 F0 00 00 00 66 0F D6 45 D8 8B 5A 08 8B 8B F4) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov dword ptr [ebx+000000F0], 0
  mov dword ptr [ebx+000000F0+4], 408F3800
  movq xmm0,[ebx+000000F0]
  jmp return

powerr:
  jmp code
  nop
  nop
  nop
return:
registersymbol(powerr)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
powerr:
  db F3 0F 7E 83 F0 00 00 00

unregistersymbol(powerr)
dealloc(newmem)"""
