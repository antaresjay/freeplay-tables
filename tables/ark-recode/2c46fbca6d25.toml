name = "One Hit Kill ( Doesn't work on certain stages. )"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(ohk_cmp,GameAssembly.dll,8Bxxxx4885xx0F84xxxxxxxx89xxxx488Bxxxx488Bxxxx4885xx0F84xxxxxxxx33xxE8xxxxxxxx4885xx0F84xxxxxxxx89xxxx488B)//8B 4F 30 48 85 C0 0F 84 C3
alloc(newmem,$1000,ohk_cmp)
label(code return)
// SEND @ SINTRIX.NET | FEARLESSREVOLUTION.COM
newmem:
cmp dword ptr [rdi+40],#2
jne code
mov [rdi+30],#0
jmp code

code:
  mov ecx,[rdi+30]
  test rax,rax
  jmp return
// SEND @ SINTRIX.NET | FEARLESSREVOLUTION.COM
ohk_cmp:
  jmp newmem
  nop
return:
registersymbol(ohk_cmp)

[DISABLE]

ohk_cmp:
  db 8B 4F 30 48 85 C0
// SEND @ SINTRIX.NET | FEARLESSREVOLUTION.COM
unregistersymbol(*)
dealloc(*)"""
