[[cheat]]
id = "player-ctrl-numpad-1-earn-score-to-populate-values"
name = "Player (Ctrl + Numpad 1) {Earn score to populate values}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Retrowave 2.exe
// Author            : ndck76
// Executable Version: 6000.0.24.64053
// Game Version      : Build.18781274 (Early Access)
// Script Date       : 2025-07-17


[ENABLE]

aobscanregion(score,HR_Player:Update,HR_Player:Update+1500,F30F10xxxxF3xxxxxxF2xxxxxxxxxxxxxx48xxxx48xxxxxxxxxxxx49BBxxxxxxxxxxxx000041xxxxF3xxxxxxxxxxxxxx) //HR_Player:Update+4f3
alloc(newmem,$1000,score)
alloc(data,8)
alloc(scorebkp,5)
registersymbol(data)
registersymbol(score)
registersymbol(scorebkp)
label(code)
label(return)

scorebkp:
  readmem(score,5)

newmem:
  mov [data],rsi

code:
  readmem(score,5)
  jmp return

score:
  jmp newmem
return:

[DISABLE]

score:
  readmem(scorebkp,5)

unregistersymbol(*)
dealloc(*)"""

