[[cheat]]
id = "unlimited-stamina"
name = "Unlimited Stamina"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(stamina_Aob,GameAssembly.dll,F3 0F 10 48 7C 0F 57 FF) // should be unique
alloc(newmem,$1000,stamina_Aob)

label(code)
label(return)

newmem:

fld [rax+78]
fstp [rax+7c]
code:
  movss xmm1,[rax+7C]
  jmp return

stamina_Aob:
  jmp newmem
return:
registersymbol(stamina_Aob)

[DISABLE]

stamina_Aob:
  db F3 0F 10 48 7C

unregistersymbol(stamina_Aob)
dealloc(newmem)"""

