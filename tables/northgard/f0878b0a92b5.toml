[[cheat]]
id = "northgard-aob-script"
name = "Northgard AOB script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game   : Northgard.exe
// Version:
// Date   :
// Author : Cs
[ENABLE]
aobscan(aobResOffset,8B 88 ?? ?? 00 00 89 4D FC BA 57 AB E3 0F 89 55 F8 33 CA 89 4D FC)
aobscan(aobPlayerGrabber,8B 88 ?? ?? 00 00 89 4D ?? 85 C9 0F 84 ?? ?? ?? ?? 8B 90 ?? ?? ?? ?? 89 55 ?? 33 ?? 89 ?? ?? 3B)
aobscan(aobXORKeyGrabber,B9 ?? ?? ?? ?? 89 4D ?? 33 C1 89 45 ?? 8B 55 ?? 89 82)
aobscan(aobVillagerSpawnChecker,F2 0F 10 ?? ?? ?? 00 00 F2 0F 11 7D ?? F2 0F 2A C0 F2 0F 11)

alloc(newmemPlayerGrabber,4096,aobPlayerGrabber)

label(aobPlayerGrabber_r)
label(aobPlayerGrabber_i)
registersymbol(aobPlayerGrabber_r)
registersymbol(aobPlayerGrabber_i)

label(lblPlayerGrabber)
label(lblPlayerGrabberSkipFood)
label(lblPlayerGrabberSkipWood)
label(lblPlayerGrabberSkipKrowns)
label(lblPlayerGrabberSkip)
label(lblPlayerGrabberRet)

label(bEnableMinFood)
label(iMinFood)
label(bEnableMinWood)
label(iMinWood)
label(bEnableMinKrowns)
label(iMinKrowns)
registersymbol(bEnableMinFood)
registersymbol(iMinFood)
registersymbol(bEnableMinWood)
registersymbol(iMinWood)
registersymbol(bEnableMinKrowns)
registersymbol(iMinKrowns)

label(pPlayer)
label(iXORKey)
label(iResOffset)
registersymbol(pPlayer)
registersymbol(iXORKey)
registersymbol(iResOffset)

label(aobVillagerSpawnChecker_r)
label(aobVillagerSpawnChecker_i)
registersymbol(aobVillagerSpawnChecker_r)
registersymbol(aobVillagerSpawnChecker_i)

label(lblVillagerSpawnChecker)
label(lblVillagerSpawnCheckerSkip)
label(lblVillagerSpawnCheckerRet)

label(bEnableForcedVillagerSpawn)
registersymbol(bEnableForcedVillagerSpawn)

newmemPlayerGrabber:
bEnableMinFood:
dd 1
iMinFood:
dd (int)500
bEnableMinWood:
dd 1
iMinWood:
dd (int)200
bEnableMinKrowns:
dd 1
iMinKrowns:
dd (int)1000
bEnableForcedVillagerSpawn:
dd 0

lblPlayerGrabber:
push edx
readmem(aobPlayerGrabber,6)
test ecx,ecx
jz lblPlayerGrabberSkip
mov dword ptr [pPlayer],eax
mov edx,[iResOffset]
cmp dword ptr [bEnableMinFood],1
jne short lblPlayerGrabberSkipFood
mov ecx,[eax+edx]
xor ecx,[iXORKey]
cmp dword ptr [iMinFood],ecx
jle short lblPlayerGrabberSkipFood
mov ecx,[iMinFood]
xor ecx,[iXORKey]
mov dword ptr [eax+edx],ecx
lblPlayerGrabberSkipFood:
add edx,4
cmp dword ptr [bEnableMinWood],1
jne short lblPlayerGrabberSkipWood
mov ecx,[eax+edx]
xor ecx,[iXORKey]
cmp dword ptr [iMinWood],ecx
jle short lblPlayerGrabberSkipWood
mov ecx,[iMinWood]
xor ecx,[iXORKey]
mov dword ptr [eax+edx],ecx
lblPlayerGrabberSkipWood:
add edx,4
cmp dword ptr [bEnableMinKrowns],1
jne short lblPlayerGrabberSkipKrowns
mov ecx,[eax+edx]
xor ecx,[iXORKey]
cmp dword ptr [iMinKrowns],ecx
jle short lblPlayerGrabberSkipKrowns
mov ecx,[iMinKrowns]
xor ecx,[iXORKey]
mov dword ptr [eax+edx],ecx
lblPlayerGrabberSkipKrowns:
lblPlayerGrabberSkip:
pop edx
readmem(aobPlayerGrabber,6)
jmp lblPlayerGrabberRet
aobPlayerGrabber_i:
readmem(aobPlayerGrabber,6)
pPlayer:
dd 0
iXORKey:
readmem(aobXORKeyGrabber+01,4)
iResOffset:
readmem(aobResOffset+02,4)

lblVillagerSpawnChecker:
push ebx
cmp dword ptr [pPlayer],edx
jne short lblVillagerSpawnCheckerSkip
cmp dword ptr [bEnableForcedVillagerSpawn],1
jne short lblVillagerSpawnCheckerSkip
mov ebx,[aobVillagerSpawnChecker_i+4]
inc eax
cvtsi2sd xmm0,eax
dec eax
movsd [edx+ebx],xmm0
lblVillagerSpawnCheckerSkip:
pop ebx
readmem(aobVillagerSpawnChecker,8)
jmp lblVillagerSpawnCheckerRet
aobVillagerSpawnChecker_i:
readmem(aobVillagerSpawnChecker,8)

aobVillagerSpawnChecker:
aobVillagerSpawnChecker_r:
jmp lblVillagerSpawnChecker
nop
nop
nop
lblVillagerSpawnCheckerRet:

aobPlayerGrabber:
aobPlayerGrabber_r:
jmp lblPlayerGrabber
nop
lblPlayerGrabberRet:

[DISABLE]
aobPlayerGrabber_r:
readmem(aobPlayerGrabber_i,6)

unregistersymbol(aobPlayerGrabber_r)
unregistersymbol(aobPlayerGrabber_i)

unregistersymbol(bEnableMinFood)
unregistersymbol(iMinFood)
unregistersymbol(bEnableMinWood)
unregistersymbol(iMinWood)
unregistersymbol(bEnableMinKrowns)
unregistersymbol(iMinKrowns)

unregistersymbol(pPlayer)
unregistersymbol(iXORKey)
unregistersymbol(iResOffset)

aobVillagerSpawnChecker_r:
readmem(aobVillagerSpawnChecker_i,8)

unregistersymbol(aobVillagerSpawnChecker_r)
unregistersymbol(aobVillagerSpawnChecker_i)

unregistersymbol(bEnableForcedVillagerSpawn)

dealloc(newmemPlayerGrabber)"""

