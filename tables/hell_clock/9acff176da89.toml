[[cheat]]
id = "game-speed-multiplier-v1"
name = "Game Speed Multiplier V1"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(GameSpeed,UnityPlayer.dll,F3 0F 10 99 FC 00 00 00) // should be unique
alloc(newmem,$1000,GameSpeed)
label(code)
label(return)
alloc(SpeedGame,4)
registersymbol(SpeedGame)
label(Speed1)
label(Speed2)
label(Speed3)
label(Speed4)
label(Speed5)

SpeedGame:
dd (float)1

newmem:
cmp [SpeedGame],(float)1
je Speed1
cmp [SpeedGame],(float)2
je Speed2
cmp [SpeedGame],(float)3
je Speed3
cmp [SpeedGame],(float)4
je Speed4
cmp [SpeedGame],(float)5
je Speed5

Speed1:
mov [rcx+000000FC],(float)1
jmp code

Speed2:
mov [rcx+000000FC],(float)2
jmp code

Speed3:
mov [rcx+000000FC],(float)3
jmp code

Speed4:
mov [rcx+000000FC],(float)4
jmp code

Speed5:
mov [rcx+000000FC],(float)5
jmp code

code:
  movss xmm3,[rcx+000000FC]
  jmp return

GameSpeed:
  jmp newmem
  nop 3
return:
registersymbol(GameSpeed)

[DISABLE]

GameSpeed:
