type = "script"
source = """
[ENABLE]

aobscanmodule(stamina,LabyrinthianLTD-Win64-Shipping.exe,F3xxxxxxxxxxxxxx4885xx74xx4889xxxxxx89xxxxxx488DxxxxxxF3xxxxxxxxxxC6xxxxxxxxC6) // should be unique
alloc(newmem,$1000,stamina)
alloc(staminabkp,8)
registersymbol(stamina)
registersymbol(staminabkp)
label(code)
label(return)

staminabkp:
  readmem(stamina,8)

newmem:

code:
  mov [rdi+000003E0],(float)1
