// Game Executable   : Carma-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.6.1.0
// Game Version      : Build.21803723
// Script Date       : 2026-02-08


[ENABLE]

aobscanmodule(score,Carma-Win64-Shipping.exe,4401xxxxxxxxxx488Bxx488BxxE8xxxxxxxx448B) // should be unique
alloc(newmem,$1000,score)
alloc(data3,8)
alloc(scorebkp,7)
registersymbol(data3)
registersymbol(score)
registersymbol(scorebkp)
label(code)
label(return)

scorebkp:
  readmem(score,7)

newmem:
  mov [data3],rcx

code:
  readmem(score,7)
  jmp return

score:
  jmp newmem
  nop 2
return:

[DISABLE]

score:
  readmem(scorebkp,7)

unregistersymbol(*)
dealloc(*)"""

