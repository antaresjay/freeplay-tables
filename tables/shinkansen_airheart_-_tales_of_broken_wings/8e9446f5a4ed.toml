[[cheat]]
id = "playermodel-base-address-scan-initialization-activate-this-first"
name = "PlayerModel Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlayerModel_basepointer)
registersymbol(PlayerModel_update_enable)
registersymbol(PlayerModel_set_enable)
registersymbol(PlayerModel_healthset_enable)
registersymbol(PlayerModel_invulnerableset_enable)

alloc(PlayerModel_basepointer, 4)
alloc(PlayerModel_update_enable, 4)
alloc(PlayerModel_set_enable, 4)
alloc(PlayerModel_healthset_enable, 4)
alloc(PlayerModel_invulnerableset_enable, 4)


[DISABLE]
unregistersymbol(PlayerModel_basepointer)
unregistersymbol(PlayerModel_update_enable)
unregistersymbol(PlayerModel_set_enable)
unregistersymbol(PlayerModel_healthset_enable)
unregistersymbol(PlayerModel_invulnerableset_enable)

dealloc(PlayerModel_basepointer)
dealloc(PlayerModel_update_enable)
dealloc(PlayerModel_set_enable)
dealloc(PlayerModel_healthset_enable)
dealloc(PlayerModel_invulnerableset_enable)"""

[[cheat]]
id = "playermodel-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerModel Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerModel_savedAOB)
label(PlayerModel_returnhere)
label(PlayerModel_originalcode)
label(PlayerModel_exit)

label(PlayerModel_update_exit)
label(PlayerModel_set_exit)
label(PlayerModel_healthset_exit)
label(PlayerModel_invulnerableset_exit)

registersymbol(PlayerModel_savedAOB)

//35AF637A - 8B 45 08              - mov eax,[ebp+08]
//35AF637D - 8B 40 14              - mov eax,[eax+14]
// Blindflug:PlayerView:OnReelIn+78
//35AF6380 - 8B 80 8C000000        - mov eax,[eax+0000008C]
//35AF6386 - 8B 80 8C000000        - mov eax,[eax+0000008C]
//35AF638C - 83 EC 08              - sub esp,08
//35AF638F - 6A 00                 - push 00
//35AF6391 - 50                    - push eax
//35AF6392 - E8 D1939ACE           - call 0449F768
//35AF6397 - 83 C4 10              - add esp,10
//35AF639A - 85 C0                 - test eax,eax
//35AF639C - 0F85 2E010000         - jne 35AF64D0
//35AF63A2 - 39 36                 - cmp [esi],esi
//35AF63A4 - 8B 46 7C              - mov eax,[esi+7C]
//35AF63A7 - 8B C8                 - mov ecx,eax
aobscan(PlayerModel_searchedAOB, 8B 80 8C 00 00 00 8B 80 8C 00 00 00 83 EC 08 6A 00 50 * * * * * 83 C4 10 85 C0 0F * * * * * 39 36)

alloc(PlayerModel_newmem, 2048, PlayerModel_searchedAOB)
alloc(PlayerModel_temp1, 4, PlayerModel_searchedAOB)
alloc(PlayerModel_temp2, 4, PlayerModel_searchedAOB)
alloc(PlayerModel_temp3, 4, PlayerModel_searchedAOB)
alloc(PlayerModel_temp4, 4, PlayerModel_searchedAOB)
alloc(PlayerModel_temp5, 4, PlayerModel_searchedAOB)


PlayerModel_newmem:
mov [PlayerModel_temp1], eax
mov [PlayerModel_temp2], ebx
mov [PlayerModel_temp3], ecx
mov [PlayerModel_temp4], edx

cmp dword ptr [PlayerModel_update_enable], #0
je PlayerModel_update_exit
mov [PlayerModel_basepointer], eax
PlayerModel_update_exit:

cmp dword ptr [PlayerModel_set_enable], #0
je PlayerModel_set_exit
PlayerModel_set_exit:

cmp dword ptr [PlayerModel_healthset_enable], #0
je PlayerModel_healthset_exit
mov ebx, [eax+8]
test ebx, ebx
je PlayerModel_healthset_exit
mov [ebx+14], (float)9999
fld [ebx+14]
fstp [ebx+10]
PlayerModel_healthset_exit:

cmp dword ptr [PlayerModel_invulnerableset_enable], #0
je PlayerModel_invulnerableset_exit
mov byte ptr [eax+26], #1
PlayerModel_invulnerableset_exit:

mov eax, [PlayerModel_temp1]
mov ebx, [PlayerModel_temp2]
mov ecx, [PlayerModel_temp3]
mov edx, [PlayerModel_temp4]


PlayerModel_originalcode:
db 8B 80 8C 00 00 00
//mov eax,[eax+0000008C]


PlayerModel_exit:
jmp PlayerModel_returnhere


PlayerModel_searchedAOB:
PlayerModel_savedAOB:
jmp PlayerModel_newmem
nop
PlayerModel_returnhere:


[DISABLE]
PlayerModel_savedAOB:
db 8B 80 8C 00 00 00
//mov eax,[eax+0000008C]

unregistersymbol(PlayerModel_savedAOB)

dealloc(PlayerModel_newmem)
dealloc(PlayerModel_temp1)
dealloc(PlayerModel_temp2)
dealloc(PlayerModel_temp3)
dealloc(PlayerModel_temp4)
dealloc(PlayerModel_temp5)"""

