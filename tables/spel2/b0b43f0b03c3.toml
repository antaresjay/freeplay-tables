type = "script"
source = """
[ENABLE]

aobscanmodule(Rope_AOB,Spel2.exe,8A 40 05 43 88 44 07 03) // should be unique
alloc(newmem,$1000,Rope_AOB)

label(code)
label(return)

newmem:

code:
  mov byte ptr [rax+05],#77
  mov al,[rax+05]
  mov [r15+r8+03],al
  jmp return

Rope_AOB:
  jmp newmem
  nop 3
return:
registersymbol(Rope_AOB)

[DISABLE]

Rope_AOB:
  db 8A 40 05 43 88 44 07 03

unregistersymbol(Rope_AOB)
dealloc(newmem)"""
