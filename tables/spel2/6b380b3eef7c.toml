[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(playerHook,Spel2.exe,49 8B 06 49 8B 7E 10) // should be unique
alloc(newmem1,$1000,playerHook)
registersymbol(playerHook)

aobscanmodule(infHealth,Spel2.exe,41 88 86 17 01 00 00 4D) // should be unique
alloc(newmem2,$1000,infHealth)
registersymbol(infHealth)

label(code1)
label(return1)
label(code2)
label(return2)

label(OneHitKillCheck)

label(playerPTR)
registersymbol(playerPTR)
label(bOhK)
registersymbol(bOhK)
label(bUnlimHealth)
registersymbol(bUnlimHealth)

////////////////////////// Player Hook ///////////////////
newmem1:
  mov [playerPTR],r14
code1:
  mov rax,[r14]
  mov rdi,[r14+10]
  jmp return1

playerPTR:
  dd 0

///////////////// Damage Checks ////////////////////////
newmem2:
  push rax
  mov rax,[playerPTR]
  cmp r14,rax
  pop rax
  jne OneHitKillCheck
  cmp byte ptr [bUnlimHealth],1
  jne code2
  jmp return2

OneHitKillCheck:
  cmp byte ptr [bOhK],1
  jne code2
  cmp [r14+EC],0xFA0 // Turkey?
  je code2
  mov [r14+00000117],0
  jmp return2

code2:
  mov [r14+00000117],al
  jmp return2

// dec
bUnlimHealth:
  dd 0
bOhK:
  dd 0

playerHook:
  jmp newmem1
  nop 2

return1:
infHealth:
  jmp newmem2
  nop 2

return2:

[DISABLE]
playerHook:
  db 49 8B 06 49 8B 7E 10

infHealth:
  db 41 88 86 17 01 00 00

unregistersymbol(playerHook)
unregistersymbol(playerPTR)
unregistersymbol(moneyPTR)
unregistersymbol(bOhK)
unregistersymbol(bUnlimHealth)
dealloc(newmem1)
dealloc(newmem2)
dealloc(newmem3)"""

