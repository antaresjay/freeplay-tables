[[cheat]]
id = "playerstat"
name = "[PlayerStat]"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Dawn of Andromeda.exe
  Version: 
  Date   : 2018-04-18
  Author : Kalas

  This script does blah blah blah
}

[ENABLE]

aobscan(aobPlayerStat,F3 0F 10 80 D8 03 00 00 F3 0F 5A C0 F2 0F 5A E8 F3 0F 11 AD 68)
alloc(newmem,$100,aobPlayerStat)

label(code)
label(return)
label(ptrBasePlayerStat)
label(setFunds) // +654 Max Funds == +3B8 Current Funds

newmem:
  cmp [setFunds], 0
  je @f
  fild [rax+654]
  fistp [rax+3B8]

code:
  push rbx
  mov rbx, ptrBasePlayerStat
  mov [rbx], rax
  pop rbx

  movss xmm0,[rax+000003D8]
  jmp return

ptrBasePlayerStat:
  dq 0

setFunds:
  dd 0

aobPlayerStat:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(aobPlayerStat)
registersymbol(ptrBasePlayerStat)
registersymbol(setFunds)

[DISABLE]

aobPlayerStat:
  db F3 0F 10 80 D8 03 00 00

unregistersymbol(aobPlayerStat)
unregistersymbol(ptrBasePlayerStat)
unregistersymbol(setFunds)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: DACFBF6E

""+DACFBF3F: 48 8B 86 D0 00 00 00           -  mov rax,[rsi+000000D0]
""+DACFBF46: 48 8B C8                       -  mov rcx,rax
""+DACFBF49: 33 D2                          -  xor edx,edx
""+DACFBF4B: 48 83 EC 20                    -  sub rsp,20
""+DACFBF4F: 83 38 00                       -  cmp dword ptr [rax],00
""+DACFBF52: 49 BB 18 11 16 07 00 00 00 00  -  mov r11,0000000007161118
""+DACFBF5C: 41 FF D3                       -  call r11
""+DACFBF5F: 48 83 C4 20                    -  add rsp,20
""+DACFBF63: 48 8B 86 18 01 00 00           -  mov rax,[rsi+00000118]
""+DACFBF6A: 48 8B 40 40                    -  mov rax,[rax+40]
// ---------- INJECTING HERE ----------
""+DACFBF6E: F3 0F 10 80 D8 03 00 00        -  movss xmm0,[rax+000003D8]
// ---------- DONE INJECTING  ----------
""+DACFBF76: F3 0F 5A C0                    -  cvtss2sd xmm0,xmm0
""+DACFBF7A: F2 0F 5A E8                    -  cvtsd2ss xmm5,xmm0
""+DACFBF7E: F3 0F 11 AD 68 F0 FF FF        -  movss [rbp-00000F98],xmm5
""+DACFBF86: 48 8B 86 18 01 00 00           -  mov rax,[rsi+00000118]
""+DACFBF8D: 48 8B 80 D0 00 00 00           -  mov rax,[rax+000000D0]
""+DACFBF94: 83 78 18 09                    -  cmp dword ptr [rax+18],09
""+DACFBF98: 0F 86 AB 2E 00 00              -  jbe DACFEE49
""+DACFBF9E: F3 0F 10 40 44                 -  movss xmm0,[rax+44]
""+DACFBFA3: F3 0F 5A C0                    -  cvtss2sd xmm0,xmm0
""+DACFBFA7: 66 0F 57 C9                    -  xorpd xmm1,xmm1
}"""

