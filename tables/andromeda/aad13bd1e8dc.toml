alloc(newmem,$100,aobUnit)

label(code)
label(return)
label(ptrBaseUnitStat)
label(sethitpoints)
label(setshield)

newmem:
  cmp [sethitpoints], 0
  je @f
  mov [sethitpoints], 0
  fild [rax+DC]
  fistp [rax+D8]

@@:
  cmp [setshield], 0
  je @f
  mov [setshield], 0
  fild [rax+E8]
  fistp [rax+E4]

code:
  push rbx
  mov rbx, ptrBaseUnitStat
  mov [rbx], rax
  pop rbx

  movsxd  rax,dword ptr [rax+000000D8]
  jmp return

ptrBaseUnitStat:
