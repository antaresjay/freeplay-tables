[[cheat]]
id = "player-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Player Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Player_savedAOB)
label(Player_returnhere)
label(Player_originalcode)
label(Player_exit)

label(Player_update_exit)
label(Player_set_exit)
label(Player_invulnerableset_exit)

registersymbol(Player_savedAOB)

//0DC2D0B5 - 41 FF D3              - call r11d
//0DC2D0B8 - 48 83 C4 20           - add rsp,20
// Player:PausableUpdate+6c
//0DC2D0BC - F3 0F10 46 30         - movss xmm0,[rsi+30]
//0DC2D0C1 - F3 0F5A C0            - cvtss2sd xmm0,xmm0
//0DC2D0C5 - F2 0F5A E8            - cvtsd2ss xmm5,xmm0
//0DC2D0C9 - F3 0F11 AD 28FFFFFF   - movss [rbp-000000D8],xmm5
//0DC2D0D1 - F3 0F10 85 28FFFFFF   - movss xmm0,[rbp-000000D8]
//0DC2D0D9 - F3 0F5A C0            - cvtss2sd xmm0,xmm0
aobscan(Player_searchedAOB, F3 0F 10 46 30 F3 0F 5A C0 F2 0F 5A E8 F3 0F 11 AD 28 FF FF FF)

alloc(Player_newmem, 2048, Player_searchedAOB)
alloc(Player_temp1, 8, Player_searchedAOB)
alloc(Player_temp2, 8, Player_searchedAOB)
alloc(Player_temp3, 8, Player_searchedAOB)
alloc(Player_temp4, 8, Player_searchedAOB)
alloc(Player_temp5, 8, Player_searchedAOB)


Player_newmem:
mov [Player_temp1], rax
mov [Player_temp2], rbx
mov [Player_temp3], rcx
mov [Player_temp4], rdx

cmp dword ptr [Player_update_enable], #0
je Player_update_exit
mov [Player_basepointer], rsi
Player_update_exit:

cmp dword ptr [Player_set_enable], #0
je Player_set_exit
Player_set_exit:

cmp dword ptr [Player_invulnerableset_enable], #0
je Player_invulnerableset_exit
mov byte ptr [rsi+1e8], #1
Player_invulnerableset_exit:

mov rax, [Player_temp1]
mov rbx, [Player_temp2]
mov rcx, [Player_temp3]
mov rdx, [Player_temp4]


Player_originalcode:
db F3 0F 10 46 30
//movss xmm0,[rsi+30]


Player_exit:
jmp Player_returnhere


Player_searchedAOB:
Player_savedAOB:
jmp Player_newmem
Player_returnhere:


[DISABLE]
Player_savedAOB:
db F3 0F 10 46 30
//movss xmm0,[rsi+30]

unregistersymbol(Player_savedAOB)

dealloc(Player_newmem)
dealloc(Player_temp1)
dealloc(Player_temp2)
dealloc(Player_temp3)
dealloc(Player_temp4)
dealloc(Player_temp5)"""

