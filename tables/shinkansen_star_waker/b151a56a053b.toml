// TreeMenuManager:UpdateSkillPointLeft+c
//0DC38E1C - 48 8B 86 D0000000     - mov rax,[rsi+000000D0]
//0DC38E23 - 48 89 45 E8           - mov [rbp-18],rax
//0DC38E27 - 48 8B 86 38040000     - mov rax,[rsi+00000438]
