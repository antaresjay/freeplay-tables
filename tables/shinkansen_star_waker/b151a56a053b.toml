//0DC38E32 - 48 63 40 18           - movsxd  rax,dword ptr [rax+18]
aobscan(TreeMenuManager_searchedAOB, 48 8B 86 D0 00 00 00 48 89 45 E8 48 8B 86 38 04 00 00)

