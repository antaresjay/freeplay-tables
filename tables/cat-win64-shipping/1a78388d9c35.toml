[[cheat]]
id = "activate-me-to-enable-pointers"
name = "Activate me !      ...to enable POINTERS"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Cat-Win64-Shipping.exe
  Version: 
  Date   : 2024-04-14
  Author : LIOBOSS

  This script does blah blah blah
}

define(address,"Cat-Win64-Shipping.exe"+1405F76)
define(bytes,F3 44 0F 2A A0 B4 03 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,"Cat-Win64-Shipping.exe"+1405F76)
alloc(base_adress,8)


label(code)
label(return)


base_adress:
dq 0


newmem:

code:
  mov [base_adress],rax
  cvtsi2ss xmm12,[rax+000003B4]
  jmp return

address:
  jmp newmem
  nop 4

return:
registersymbol(base_adress)
[DISABLE]

address:
  db bytes
  // cvtsi2ss xmm12,[rax+000003B4]

unregistersymbol(base_adress)
dealloc(newmem)
dealloc(base_adress)"""

