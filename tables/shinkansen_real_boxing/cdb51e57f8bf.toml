type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

registersymbol(upgradingstatisticsupdate_enable)
registersymbol(upgradingstatisticsset_enable)

registersymbol(upgradingstatistics_basepointer)


