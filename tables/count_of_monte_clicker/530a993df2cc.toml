[[cheat]]
id = "cheat-damage-multiplier"
name = "CHEAT: Damage Multiplier"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
define(hook,"EnemyController:DamageEnemy")
define(bytes,55 48 8B EC 48)

[enable]

assert(hook, bytes)
alloc(newmem,$1000, hook)
{
  RCX: EnemyController (this)
  XMM1: single amount

  Returns RAX (System.Void)
}

label(damageMultiplier)

newmem:
  mulss xmm1,[damageMultiplier]

  // original code
  // push rbp
  // mov rbp,rsp
  // sub rsp,00000080
  readmem(hook,11)
  jmp hook+B

align 10
damageMultiplier:
  dd (float)10.0

hook:
  jmp long newmem

registersymbol(damageMultiplier)

[disable]

hook:
  db bytes

unregistersymbol(damageMultiplier)

dealloc(newmem)"""

