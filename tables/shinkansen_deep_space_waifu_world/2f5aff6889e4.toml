//2FAB1FE1 - 0F85 93010000         - jne 2FAB217A
//2FAB1FE7 - 48 8B 04 25 704C0B2D  - mov rax,[2D0B4C70] : [3357DE60]
// PlayerMovement:Update+3f
//2FAB1FEF - 0FB6 40 30            - movzx eax,byte ptr [rax+30]
//2FAB1FF3 - 85 C0                 - test eax,eax
//2FAB1FF5 - 0F84 7F010000         - je 2FAB217A
//2FAB1FFB - 48 8B 04 25 D0CBA102  - mov rax,[02A1CBD0] : [2F2CCAF0]
//2FAB2003 - 0FB6 40 5D            - movzx eax,byte ptr [rax+5D]
//2FAB2007 - 85 C0                 - test eax,eax
//2FAB2009 - 0F85 6B010000         - jne 2FAB217A
aobscan(PlayerManager_searchedAOB, 0F B6 40 30 85 C0 * * * * * * * * * * * * * * 0F B6 40 5D)

alloc(PlayerManager_newmem, 2048, PlayerManager_searchedAOB)
alloc(PlayerManager_temp1, 8, PlayerManager_searchedAOB)
alloc(PlayerManager_temp2, 8, PlayerManager_searchedAOB)
alloc(PlayerManager_temp3, 8, PlayerManager_searchedAOB)
alloc(PlayerManager_temp4, 8, PlayerManager_searchedAOB)
alloc(PlayerManager_temp5, 8, PlayerManager_searchedAOB)


PlayerManager_newmem:
mov [PlayerManager_temp1], rax
mov [PlayerManager_temp2], rbx
mov [PlayerManager_temp3], rcx
mov [PlayerManager_temp4], rdx

cmp dword ptr [PlayerManager_update_enable], #0
je PlayerManager_update_exit
mov [PlayerManager_basepointer], rax
PlayerManager_update_exit:

cmp dword ptr [PlayerManager_livesset_enable], #0
je PlayerManager_livesset_exit
mov [rax+38], #99
PlayerManager_livesset_exit:

mov rax, [PlayerManager_temp1]
mov rbx, [PlayerManager_temp2]
mov rcx, [PlayerManager_temp3]
mov rdx, [PlayerManager_temp4]


PlayerManager_originalcode:
