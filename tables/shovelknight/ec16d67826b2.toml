[[cheat]]
id = "method-mob"
name = "Method_Mob"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// ShovelKnight Mob Method Hook by Diphome.
// To learn how i found this :
//https://www.youtube.com/watch?v=WZwVio8XKDs
//--------------------------------------------------------------------------------------------------------------------------
[Enable]
//--------------------------------------------------------------------------------------------------------------------------

alloc(MobSpawn_Method_Hook,2048)

label(Jump_01)
label(Original_Code)
label(Return_01)

globalalloc(New_ID,4)

aobscan(IE01_Aob_Scan,8B 4E 5C 8B 56 60 51 56 52)
label(IE01_AoB)
registersymbol(IE01_AoB)

//------------------------------------------------------------------

IE01_Aob_Scan:
IE01_AoB:
jmp Jump_01
nop
Return_01:

//------------------------------------------------------------------
MobSpawn_Method_Hook:
//------------------------------------------------------------------

Jump_01:

cmp [New_ID],0
je Original_Code

// Injection of the ID
push eax
mov eax,[New_ID]
mov ecx,eax
pop eax
// End

Original_Code:
//db 8B 56 60 51 56
mov edx,[esi+60]
jmp Return_01

//------------------------------------------------------------------
[Disable]
//------------------------------------------------------------------

IE01_AoB:
mov ecx,[esi+5C]
mov edx,[esi+60]

unregistersymbol(IE01_AoB)
dealloc(New_ID)
dealloc(MobSpawn_Method_Hook)

//---------------------------------------------------------------------"""

