[[cheat]]
id = "time"
name = "Time"
category = "game"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Eastshade.exe
  Version: 
  Date   : 2020-08-01
  Author : aSwedishMagyar
}

[ENABLE]
//TimeCycler:get_DayTime+12
//aobscanregion(timeGet,TimeCycler:get_DayTime,TimeCycler:get_DayTime+80,F3 0F 10 00)
define(timeGet,TimeCycler:get_DayTime+12)
alloc(newmem,$100,TimeCycler:get_DayTime+12)
alloc(timePtr,$8)
registersymbol(timePtr)
label(code)
label(return)

newmem:
  mov [timePtr],rax
code:
  movss xmm0,[rax]
  cvtss2sd xmm0,xmm0
  jmp return

timeGet:
  jmp newmem
  nop 3
return:
registersymbol(timeGet)

[DISABLE]

timeGet:
  db F3 0F 10 00 F3 0F 5A C0

unregistersymbol(timeGet)
unregistersymbol(timePtr)
dealloc(newmem)
dealloc(timePtr)"""

