[[cheat]]
id = "gameplay-manager-ctrl-numpad-1"
name = "Gameplay Manager (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Mirage Feathers.exe
// Author            : ndck76
// Executable Version: 2019.4.34.40878
// Game Version      : Build.15629556
// Script Date       : 2024-09-10


[ENABLE]

aobscanregion(score,GameplayManager:Trip,GameplayManager:Trip+200,486386xxxx00003Dxxxxxxxx7Cxx48xxxxxx48xxxxxx3Dxxxxxxxx7Dxx) //GameplayManager:Trip+cd
alloc(newmem,$1000,score)
alloc(data,8)
alloc(scorebkp,7)
registersymbol(data)
registersymbol(score)
registersymbol(scorebkp)
label(code)
label(return)

scorebkp:
  readmem(score,7)

newmem:
  mov [data],rsi

code:
  readmem(score,7)
  jmp return

score:
  jmp newmem
  nop 2
return:

[DISABLE]

score:
  readmem(scorebkp,7)

unregistersymbol(*)
dealloc(*)"""

