type = "script"
source = """
[ENABLE]

aobscanmodule(StaminaActual,$process,8B 40 3C 48 83 C4 28 5F 5E C3 CC CC CC CC CC 56)
alloc(newmem,$1000,StaminaActual)

label(code)
label(return)

newmem:
mov [rax+3C],#100

code:
  mov eax,[rax+3C]
  add rsp,28
  jmp return

StaminaActual:
  jmp newmem
  nop 2
return:
registersymbol(StaminaActual)

[DISABLE]

StaminaActual:
  db 8B 40 3C 48 83 C4 28

unregistersymbol(StaminaActual)
dealloc(newmem)"""
