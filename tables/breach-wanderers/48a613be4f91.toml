[[cheat]]
id = "experience-editor-ctrl-numpad-5"
name = "Experience Editor (Ctrl + Numpad 5)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Breach Wanderers.exe
// Author            : ndck76
// Executable Version: 2020.3.42.56850
// Game Version      : v1.0001
// Script Date       : 2023-06-13


[ENABLE]

aobscanmodule(exp,GameAssembly.dll,) //Rift.RunInventory.set_Experience
alloc(newmem,$1000,exp)
alloc(data6,8)
alloc(expbkp,8)
registersymbol(data6)
registersymbol(exp)
registersymbol(expbkp)
label(code)
label(return)

expbkp:
  readmem(exp,8)

newmem:
  mov [data6],rax

code:
  readmem(exp,8)
  jmp return

exp:
  jmp newmem
  nop 3
return:

[DISABLE]

exp:
  readmem(expbkp,8)

unregistersymbol(*)
dealloc(*)"""

