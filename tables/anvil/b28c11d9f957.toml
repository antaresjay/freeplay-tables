[[cheat]]
id = "infinite-mission-money"
name = "Infinite Mission Money"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(aobinmissionmoney,$process,0F 5B C0 F3 0F 58 C6 F3 * 0F 2C * * 89 * * * 00 00) // should be unique
alloc(newmem,$1000,aobinmissionmoney)
label(code)
label(return)

newmem:
code:
  cvtdq2ps xmm0,xmm0
  addss xmm0,xmm6
  push (float)9999999
  movss xmm0,[rsp]
  add rsp,8
  jmp return

aobinmissionmoney:
  jmp newmem
  nop 2
return:
registersymbol(aobinmissionmoney)

[DISABLE]

aobinmissionmoney:
  db 0F 5B C0 F3 0F 58 C6
dealloc(newmem)"""
