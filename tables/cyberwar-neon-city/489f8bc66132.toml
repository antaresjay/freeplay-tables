[[cheat]]
id = "game-stats-object-ctrl-numpad-1-collect-gold-to-populate-values"
name = "Game Stats Object (Ctrl + Numpad 1) {Collect 'Gold' to populate values}"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Cyberwar Neon City.exe
// Author            : ndck76
// Executable Version: 2022.3.31.56877
// Game Version      : v0.7.101 (Early Access)
// Script Date       : 2024-11-28


[ENABLE]

aobscanregion(gold,CollectiblesItems:Collect,CollectiblesItems:Collect+500,486388xxxx00004Cxxxxxx41xxxx41xxxx89xxxxxxxxxxE9xxxxxxxx49BAxxxxxxxxxxxx000048xxxxxxxx90) //CollectiblesItems:Collect+9a
alloc(newmem,$1000,gold)
alloc(data2,8)
alloc(goldbkp,7)
registersymbol(data2)
registersymbol(gold)
registersymbol(goldbkp)
label(code)
label(return)

goldbkp:
  readmem(gold,7)

newmem:
  mov [data2],rax

code:
  readmem(gold,7)
  jmp return

gold:
  jmp newmem
  nop 2
return:

[DISABLE]

gold:
  readmem(goldbkp,7)

unregistersymbol(*)
dealloc(*)"""

