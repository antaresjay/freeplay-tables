[[cheat]]
id = "player-stats"
name = "Player Stats"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : ZHUST - THE ILLUSION SOUL.exe
  Version: 
  Date   : 2017-06-10
  Author : Squall8
}

[ENABLE]

aobscan(masb,20 48 8B 85 30 97 FF FF F3 0F 10 80 EC 01 00 00 F3 0F 5A C0 F3 0F 10 0D * * * * F3 0F 5A C9 66)
alloc(newmem,$1000)

label(code)
label(return)

label(playerp)

registersymbol(masb)
registersymbol(playerp)

newmem:
  mov [playerp],rax

code:
  movss xmm0,[rax+000001EC]
  jmp return

playerp:
  dq 0

masb+08:
  jmp newmem
  nop
  nop
  nop
return:

[DISABLE]

masb+08:
  db F3 0F 10 80 EC 01 00 00

unregistersymbol(masb)
unregistersymbol(playerp)
dealloc(newmem)"""

