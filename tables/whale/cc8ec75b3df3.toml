type = "script"
source = """
// Game Executable   : A Completely Fictional Story About a City Inside a Whale.exe
// Author            : ndck76
// Executable Version: 2022.3.49.44571
// Game Version      : Build.22576059
// Script Date       : 2026-04-08


define(address,Wallet:Update+2d)
define(bytes,48 63 09 89 88 1C 02 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Wallet:Update+2d)

label(code)
label(return)
label(data2)
registersymbol(data2)

newmem:

code:
  mov [data2],rcx
  movsxd  rcx,dword ptr [rcx]
  mov [rax+0000021C],ecx
  jmp return

data2:
  db

address:
  jmp newmem
  nop 4
return:

[DISABLE]

address:
  db bytes
  // movsxd  rcx,dword ptr [rcx]
  // mov [rax+0000021C],ecx

dealloc(*)
unregistersymbol(*)"""

