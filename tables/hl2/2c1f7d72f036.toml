[[cheat]]
id = "teleport"
name = "Teleport"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Teleport,server.dll,8B 8F BC 02 00 00 89 4E 64) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(save)
label(load)
alloc(_Xaxis,8)
alloc(_Yaxis,8)
alloc(_Zaxis,8)
alloc(_Zaddaxis,8)
alloc(_SavePosition,8)
alloc(_LoadPosition,8)

registersymbol(_SavePosition)
registersymbol(_LoadPosition)

_Xaxis:
 dd 0

_Yaxis:
 dd 0

_Zaxis:
 dd 0

_Zaddaxis:
 dq (float)40

_SavePosition:
dd 0

_LoadPosition:
dd 0

newmem:
 cmp [_SavePosition], 1
 je save
 cmp [_LoadPosition], 1
 je load
 jmp code

save:
 mov [_SavePosition], 0
 fld [edi+2BC]
 fstp [_Xaxis]
 fld [edi+2C0]
 fstp [_Yaxis]
 fld [edi+2C4]
 fstp [_Zaxis]
 jmp code

load:
mov [_LoadPosition], 0
 fld [_Xaxis]
 fstp [edi+2BC]
 fld [_Yaxis]
 fstp [edi+2C0]
 fld [_Zaxis]
 fadd [_Zaddaxis]
 fstp [edi+2C4]
 jmp code

code:
  mov ecx,[edi+000002BC]
  jmp return

Teleport:
