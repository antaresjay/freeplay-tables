newmemPlayerGrabber:
bEnableCooldownMod:
dd 1
fCooldownMod:
dd (float)25.0
bEnableInfiniteCoolant:
dd 1
bEnableInfiniteAmmo:
dd 1
bEnableReloadTimeMod:
dd 1
fReloadTimeMod:
dd (float)0.2
bEnableRechargeRateMod:
dd 1
fRechargeRateMod:
dd (float)5.0
bEnableMFBAllowanceMod:
dd 1
fMFBAllowanceMod:
dd (float)10.0

lblPlayerGrabber:
readmem(aobPlayerGrabber,5)
mov dword ptr [pPlayer],eax
mov dword ptr [pPlayerMech],esi
jmp lblPlayerGrabberRet
