aobscanmodule(aobAmmoTaker,Mech3.exe,2B C2 89 41 ?? 8B 41 ?? 85 C0 ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? 85)
aobscanmodule(aobReloadTimeInit,Mech3.exe,D9 40 ?? D9 5E ?? 74)
aobscanmodule(aobRechargeCalc,Mech3.exe,D9 83 ?? ?? 00 00 D8 C9 E8)
aobscanmodule(aobMFBAllowanceReader,Mech3.exe,D9 05 ?? ?? ?? ?? C3 ?? ?? ?? ?? ?? ?? ?? ?? ?? B8)

alloc(newmemPlayerGrabber,4096,aobPlayerGrabber)

label(aobPlayerGrabber_r)
label(aobPlayerGrabber_i)
registersymbol(aobPlayerGrabber_r)
registersymbol(aobPlayerGrabber_i)

label(lblPlayerGrabber)
label(lblPlayerGrabberRet)

label(pPlayer)
label(pPlayerMech)
registersymbol(pPlayer)
registersymbol(pPlayerMech)

label(aobCooldownCalc_r)
label(aobCooldownCalc_i)
registersymbol(aobCooldownCalc_r)
registersymbol(aobCooldownCalc_i)

label(lblCooldownCalc)
