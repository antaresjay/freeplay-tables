label(lblCooldownCalcRet)

label(bEnableCooldownMod)
label(fCooldownMod)
registersymbol(bEnableCooldownMod)
registersymbol(fCooldownMod)

label(aobCoolantReader_r)
label(aobCoolantReader_i)
registersymbol(aobCoolantReader_r)
registersymbol(aobCoolantReader_i)

label(lblCoolantReader)
label(lblCoolantReaderSkip)
label(lblCoolantReaderRet)

label(bEnableInfiniteCoolant)
