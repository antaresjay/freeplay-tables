[[cheat]]
id = "enviro-manager-ctrl-numpad-2"
name = "Enviro Manager (Ctrl + Numpad 2)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Gedonia 2.exe
// Author            : ndck76
// Executable Version: 2021.3.15.59526
// Game Version      : v0.21.39 (Early Access)
// Script Date       : 2025-04-10


[ENABLE]

aobscanregion(solartime,Enviro.EnviroEffectsModule:UpdateEffects,Enviro.EnviroEffectsModule:UpdateEffects+300,F30F1080xxxx0000F3xxxxxx48B9xxxxxxxxxxxx0000F2xxxxxxF2xxxxxx48xxxxxxxx49BBxxxxxxxxxxxx000041xxxx33xxE9xxxxxxxx) //Enviro.EnviroEffectsModule:UpdateEffects+23
alloc(newmem,$1000,solartime)
alloc(data2,8)
alloc(solartimebkp,8)
registersymbol(data2)
registersymbol(solartime)
registersymbol(solartimebkp)
label(code)
label(return)

solartimebkp:
  readmem(solartime,8)

newmem:
  mov [data2],rax

code:
  readmem(solartime,8)
  jmp return

solartime:
  jmp newmem
  nop 3
return:

[DISABLE]

solartime:
  readmem(solartimebkp,8)

unregistersymbol(*)
dealloc(*)"""

