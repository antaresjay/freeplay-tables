[[cheat]]
id = "player-editor-ctrl-numpad-1"
name = "Player Editor (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : TriggerHeartEXELICA_ENHANCED.exe
// Author            : ndck76
// Game Version      : v1.0.0
// Script Date       : 2025-08-30


[ENABLE]

aobscanmodule(invin,TriggerHeartEXELICA_ENHANCED.exe,4439xxxxxxxxxx74xx488BxxxxxxxxxxF6xxxxxx75) // should be unique
alloc(newmem,$1000,invin)
alloc(data,8)
alloc(invinbkp,7)
registersymbol(data)
registersymbol(invin)
registersymbol(invinbkp)
label(code)
label(return)

invinbkp:
  readmem(invin,7)

newmem:
  mov [data],rbx

code:
  readmem(invin,7)
  jmp return

invin:
  jmp newmem
  nop 2
return:

[DISABLE]

invin:
  readmem(invinbkp,7)

unregistersymbol(*)
dealloc(*)"""

