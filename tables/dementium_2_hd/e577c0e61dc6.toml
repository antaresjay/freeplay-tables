[[cheat]]
id = "x-godmode"
name = "[X] GodMode"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Dementium 2 HD
  Version: 1.266
  Date   : 2023-04-19
  Author : R_X
}

define(address,dii_CharacterHealth:get_Health+c)
define(bytes,D9 40 0C C9 C3)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov [eax+0C],(float)100

code:
  fld dword ptr [eax+0C]
  leave 
  ret 
  jmp return

address:
  jmp newmem
return:

[DISABLE]

address:
  db bytes
  // fld dword ptr [eax+0C]
  // leave 
  // ret 

dealloc(*)"""

