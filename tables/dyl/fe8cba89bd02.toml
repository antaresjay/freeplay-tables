[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
aobscan(health,8B 7F 0C 8B C7 8D 65 FC 5F C9 C3)
registersymbol(health)
newmem: //this is allocated memory, you have read,write,execute access
//place your code here
mov [edi+0C],64
originalcode:
mov edi,[edi+0C]
mov eax,edi

exit:
jmp returnhere

health://Player:get_lives+23:
jmp newmem
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
health://
db 8B 7F 0C 8B C7
unregistersymbol(health)"""

