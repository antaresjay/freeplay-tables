}

[ENABLE]

aobscanmodule(pBase,OtherSkin-Win64-Shipping.exe,0F B6 40 3E 48 83 C4 20 5B C3 CC) // should be unique
alloc(newmem,$1000,pBase)
alloc(baseX,8)

label(code)
label(return)

