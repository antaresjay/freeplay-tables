[[cheat]]
id = "game-manager-ctrl-numpad-1"
name = "Game Manager (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Bendy - Lone Wolf.exe
// Author            : ndck76
// Executable Version: 2022.3.10.14226
// Game Version      : Build.19612426
// Script Date       : 2025-08-16


[ENABLE]

aobscanregion(stamina,GameUIManager:Update,GameUIManager:Update+400,F30F1091xxxx0000F3xxxxxxF2xxxxxxC7xxxxxxxxxxxxC7xxxxxxxxxxxxF2xxxxxxF3xxxxxxxxF2xxxxxxF3xxxxxxxxF3xxxxxxxxF3xxxxxxF2xxxxxx) //GameUIManager:Update+2e0
alloc(newmem,$1000)
alloc(data,8)
alloc(staminabkp,16)
registersymbol(data)
registersymbol(stamina)
registersymbol(staminabkp)
label(code)
label(return)

staminabkp:
  readmem(stamina,16)

newmem:
  mov [data],rcx

code:
  readmem(stamina,16)
  jmp return

stamina:
  jmp far newmem
  nop 2
return:

[DISABLE]

stamina:
  readmem(staminabkp,16)

unregistersymbol(*)
dealloc(*)"""

