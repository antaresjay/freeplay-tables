name = "Dragon's Health - find something to eat"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[Enable]
alloc(newmem,100)
label(returnhere)
label(exit)
label(Health)
registersymbol(Health)
aobscan(aob1, F3 0F 10 46 20 F3 0F 5A C0 F3 0F 10 8E)
globalalloc(_pHealth,4)
newmem:
mov [_pHealth],rsi
movss xmm0,[rsi+20]

exit:
jmp returnhere

aob1:
Health:
jmp newmem
returnhere:

[Disable]
dealloc(newmem)
unregistersymbol(Health)
Health:
db F3 0F 10 46 20 F3 0F 5A C0 F3 0F 10 8E"""
