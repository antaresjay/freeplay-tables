name = "Bits Wrapper (Ctrl + Numpad 2) {Earn money to populate values}"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : ROBOBEAT.exe
// Author            : ndck76
// Executable Version: 2020.3.48.1457
// Game Version      : v1.0.2
// Script Date       : 2024-05-16


[ENABLE]

aobscanregion(money,HomeBits:IncreaseMoney,HomeBits:IncreaseMoney+100,4863xxx403xx89xxxx48B8xxxxxxxxxxxx000048xxxx48xxxx48xxxx48xxxx75xx) //HomeBits:IncreaseMoney+1a
alloc(newmem,$1000,money)
alloc(data4,8)
alloc(moneybkp,6)
registersymbol(data4)
registersymbol(money)
registersymbol(moneybkp)
label(code)
label(return)

moneybkp:
  readmem(money,6)

newmem:
  mov [data4],rax

code:
  readmem(money,6)
  jmp return

money:
  jmp newmem
  nop
return:

[DISABLE]

money:
  readmem(moneybkp,6)

unregistersymbol(*)
dealloc(*)"""

