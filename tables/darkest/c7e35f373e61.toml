[[cheat]]
id = "scripts-group-1"
name = "Scripts group 1"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Darkest.exe
  Version: 21142
  Date   : 2017-11-04
  Author : Oyyzj

  This script gives full light. Can be activated all the time.
}

[ENABLE]

aobscanmodule(LightFull,darkest.exe,F3 0F 11 87 D0 40 00 00 8B) // should be unique
alloc(newmem,$100)


label(return)

newmem:
  mov [edi+000040D0],(float)100.00
  jmp return

LightFull:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(LightFull)

[DISABLE]

LightFull:
  db F3 0F 11 87 D0 40 00 00

unregistersymbol(LightFull)
dealloc(newmem)"""

