[[cheat]]
id = "enable-cheats"
name = "Enable Cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(health,Darkest.exe,F3 0F 11 80 BC 0F 00 00 C3)
alloc(newmem,$1000,health)

label(code)
label(return)
label(_zhk)
label(_god)
registersymbol(health)
registersymbol(_god)
registersymbol(_zhk)

newmem:
  cmp [rax+100],0
  jne enemy
  cmp [_god],1
  jne code
  jmp return

enemy:
  cmp [_zhk],1
  je zhk
  jmp code

zhk:
  mov [rax+00000FBC],(float)0
  jmp return

code:
  movss [rax+00000FBC],xmm0
  jmp return

_god:
  dd 0

_zhk:
  dd 0

health:
  jmp newmem
  nop 3
return:

[DISABLE]
health:
  db F3 0F 11 80 BC 0F 00 00

unregistersymbol(health)
unregistersymbol(_god)
unregistersymbol(_zhk)

dealloc(newmem)"""

