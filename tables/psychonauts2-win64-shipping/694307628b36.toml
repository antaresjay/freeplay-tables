[[cheat]]
id = "x-psychonauts-2"
name = "[X] <== Psychonauts 2"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(pawn,Psychonauts2-Win64-Shipping.exe,49 8b 07 49 8b cf ff 90 ? ? ? ? 84 c0 0f 84 ? ? ? ? 49 39 bf) // should be unique
alloc(newmem,$1000,pawn)
alloc(pcharacter,8)

label(code)
label(return)
registersymbol(pcharacter)
label(health)
registersymbol(health)
label(damage)
registersymbol(damage)
label(speed)
registersymbol(speed)

newmem:
  push r8
  push rdi
  mov [pcharacter],r15
  mov r8, [speed]
  mov [r15+98], r8   //customTimeDilation
  mov r8, [r15+568]  //m_pCoDamageable
  test r8, r8
  jz code
  mov r8, [r8+D0]
  test r8, r8
  jz code
  mov r8, [r8+0]
  test r8, r8
  jz code
  mov rdi, r8
  mov rdi, [damage]
  mov [r8+A8], rdi
  mov rdi, r8
  cmp [health], 00000001
  jne code
  mov rdi, [rdi+8] // Max health
  mov [r8+30], rdi  //health

code:
  pop rdi
  pop r8
  mov rax,[r15]
  mov rcx,r15
  jmp return

health:
dd 0
damage:
dd (float)1
speed:
dd (float)1

pawn:
  jmp newmem
  nop
return:
registersymbol(pawn)

[DISABLE]

pawn:
  db 49 8B 07 49 8B CF

