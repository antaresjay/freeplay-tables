[[cheat]]
id = "memory-multiplier"
name = "Memory Multiplier"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(MemoryMultiplierAOB,"Atelier_Ayesha_EN.exe",F3 0F 2C C0 F3 0F 2C C9 2B C8 E8 ?? ?? ?? ??)
registersymbol(MemoryMultiplierAOB)
alloc(newmem,4096,MemoryMultiplierAOB)

label(return)
label(MemoryMultiplier)
registersymbol(MemoryMultiplier)

newmem:
  cvttss2si eax,xmm0
  cvttss2si ecx,xmm1
  sub ecx,eax
  cmp ecx,0
  jl originalcode
  imul ecx,[MemoryMultiplier]
  
originalcode:
  jmp return
  
MemoryMultiplier:
dq #5

MemoryMultiplierAOB:
  jmp newmem
  nop
  nop
  nop
  nop
  nop
return:

[DISABLE]

MemoryMultiplierAOB:
  db F3 0F 2C C0 F3 0F 2C C9 2B C8
  
unregistersymbol(MemoryMultiplierAOB)
unregistersymbol(MemoryMultiplier)

dealloc(newmem)"""

