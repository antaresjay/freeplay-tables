[[cheat]]
id = "death-immunity-blocks-the-death-dispatch"
name = "☠ Death Immunity (blocks the death dispatch)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ ACBFR 1.0.4 - Death Immunity (death-dispatch gateway @ RVA 0x6AC126).
  Clears the death-request flags [rsi+0C0]/[rsi+0C1] before the game reads them so the death
  dispatch never fires. DISABLE restores via the registered bfDeathAOB symbol (does NOT rescan
  the already-patched bytes) -> fixes the "AOB not found on disable" stuck-on bug.
  Original 6 bytes: 8A 9E C0 00 00 00 (mov bl,[rsi+0C0]); unique tail 84 DB 48 8B BC 24 80 00 00 00 75 C5.
  NOTE: bfPlayerDmg filter is 0 (acts on every entity through this gateway); if enemies stop
  dying while this is ON, we capture the player component into bfPlayerDmg to make it player-only. }
[ENABLE]
aobscanmodule(bfDeathAOB,ACBlackFlag.exe,8A 9E C0 00 00 00 84 DB 48 8B BC 24 80 00 00 00 75 C5)
alloc(bfDeathCave,$400,bfDeathAOB)
alloc(bfPlayerDmg,8)
label(bfDeathClear)
label(bfDeathDone)
label(bfDeathRet)
registersymbol(bfDeathAOB)
registersymbol(bfDeathCave)
registersymbol(bfPlayerDmg)

bfPlayerDmg:
  dq 0

bfDeathCave:
  push rax
  mov rax,[bfPlayerDmg]
  test rax,rax
  je bfDeathClear
  cmp rsi,rax
  jne bfDeathDone
bfDeathClear:
  mov byte ptr [rsi+000000C0],0
  mov byte ptr [rsi+000000C1],0
bfDeathDone:
  pop rax
  mov bl,[rsi+000000C0]
  jmp bfDeathRet

bfDeathAOB:
  jmp bfDeathCave
  db 90
bfDeathRet:

[DISABLE]
{ restore via the registered bfDeathAOB symbol - do NOT rescan already-patched bytes }
bfDeathAOB:
  db 8A 9E C0 00 00 00
unregistersymbol(bfDeathAOB)
unregistersymbol(bfDeathCave)
unregistersymbol(bfPlayerDmg)
dealloc(bfDeathCave)
dealloc(bfPlayerDmg)"""

