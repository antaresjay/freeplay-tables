[[cheat]]
id = "no-spend-keeps-your-money-resources-on-purchase"
name = "🛒 No Spend (keeps your money/resources on purchase)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
// ============================================================================
//  No-Spend  (ACBFR 1.0.4)
//  The old script hooked bfShop1 (+0xDC8E5E) and bfShop2 (+0x57840D5) and clamped
//  [rcx+30] / [rbx+30]. Both AOBs still resolve uniquely on 1.0.4 -- they are simply
//  NOT charge sites (+0xDC8E5E writes eax then walks an array = store/list refresh).
//  That is why the cheat enabled cleanly and still took your money.
//
//  The real deduction is sub_140F235B0 @ +0xF2373B, disasm-confirmed:
//      mov  eax,[rax]                ; requested
//      mov  ecx,[rbx+r14+10h]        ; current qty   (entry+0x10 = QUANTITY)
//      cmp  eax,ecx / mov r8d,ecx / cmovb r8d,eax    ; r8d = min(req, have)
//      mov  edx,ecx / sub edx,r8d
//      mov  [rbx+r14+10h], edx       ; <-- NOP THIS: the write-back
//
//  NOTE: this suppresses the DEDUCTION only. The affordability check upstream is left
//  intact, so you keep what you have but still cannot buy with insufficient funds.
//  That is "No Spend", not "Free". True free needs that check bypassed as well.
// ============================================================================
aobscanmodule(bfShopDeduct,ACBlackFlag.exe,42 89 54 33 10)
registersymbol(bfShopDeduct)

bfShopDeduct:
  db 90 90 90 90 90

[DISABLE]
bfShopDeduct:
  db 42 89 54 33 10
unregistersymbol(bfShopDeduct)"""

[[cheat]]
id = "free-shopping-money-free-consumables-still-deplete"
name = "🛒 Free Shopping (money-free; consumables still deplete)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ ACBFR 1.0.4 - Free Shopping (money-only). Item-qty deduction @ RVA 0xF2373B fires for BOTH
  purchase costs (money) and consumable uses; NOPing it (old cheat) made consumables infinite.
  This skips the store ONLY when the deducted item is MONEY (id 0x101F1 at [record+0x10]) so purchases
  are free but consumables deplete normally. [rbx+r14]=item record ptr; [rec+0x10] low32=item id;
  reales=0x101F1 (resources use a separate ledger, not this site). }
[ENABLE]
aobscanmodule(bfFreeShop,ACBlackFlag.exe,42 89 54 33 10 39 C1 0F 96 44 24 57 77 0C)
alloc(bfFSCave,$400,bfFreeShop)
label(bfFSret)
label(bfFSskip)
registersymbol(bfFreeShop)
registersymbol(bfFSCave)
bfFSCave:
  push rax
  mov rax,[rbx+r14]
  cmp dword ptr [rax+10],101F1
