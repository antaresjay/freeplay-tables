[[cheat]]
id = "combat"
name = "🎯 Combat"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(bfState,0x1000)
alloc(bfHitLog,0x2000)
registersymbol(bfState)
registersymbol(bfHitLog)
bfHitLog:
dq 0

aobscanmodule(bfHealth,ACBlackFlag.exe,48 8B 89 98 01 00 00 48 83 C1 18 C5 FA 10 31)
alloc(bfHealthcave,256,bfHealth)
label(bfHealthret)
registersymbol(bfHealth)
bfHealthcave:
mov rcx,[rcx+00000198]
push rax
push rdx
mov rax,bfState
mov [rax+60],rsi
mov rdx,[rsi+240]
mov [rax+68],rdx
pop rdx
cmp dword [rax+04],0
jnz bfHFreeze
cmp dword [rax+BC],0
jz bfHDone
bfHFreeze:
push rdx
mov edx,[rcx+1C]
mov [rcx+18],edx
cmp dword [rax+BC],0
jz bfHNoClr
mov dword [rax+BC],0
bfHNoClr:
pop rdx
bfHDone:
pop rax
jmp bfHealthret
bfHealth:
jmp bfHealthcave
nop 2
bfHealthret:

aobscanmodule(bfDmg,ACBlackFlag.exe,C5 FA 10 4B 20 88 84 24 F0 00 00 00)
alloc(bfDmgcave,256,bfDmg)
label(bfDmgret)
registersymbol(bfDmg)
bfDmgcave:
vmovss xmm1,[rbx+20]
push rax
push rcx
push rdx
mov rax,bfState
mov rcx,bfHitLog
mov rdx,[rcx]
cmp rdx,#180
jae bfHitSkip
mov [rcx+rdx*8+10],rbx
mov [rcx+rdx*8+810],rdi
inc qword ptr [rcx]
bfHitSkip:
cmp rdi,[rax+60]
je bfPlayerHit
cmp rdi,[rax+68]
je bfPlayerHit
cmp dword [rax+0C],0
je bfDmgDone
vmovss xmm1,[bfOneHit]
jmp bfDmgDone
bfPlayerHit:
cmp dword [rax+00],0
je bfDmgDone
vxorps xmm1,xmm1,xmm1
bfDmgDone:
pop rdx
pop rcx
pop rax
jmp bfDmgret
bfOneHit:
dd (float)1000000
bfDmg:
jmp bfDmgcave
bfDmgret:

[DISABLE]
bfHealth:
db 48 8B 89 98 01 00 00
dealloc(bfHealthcave)
unregistersymbol(bfHealth)
bfDmg:
db C5 FA 10 4B 20
dealloc(bfDmgcave)
unregistersymbol(bfDmg)
dealloc(bfHitLog)
unregistersymbol(bfHitLog)
dealloc(bfState)
unregistersymbol(bfState)"""

