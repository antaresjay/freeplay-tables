[[cheat]]
id = "infinite-oxygen"
name = "Infinite Oxygen"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(aoboxygen,$process,C5 FA 10 49 48 C4 * * * * * * * * C5 F0 57 * C4 * * * * * 00 00)
alloc(newmem,$1000,aoboxygen)
label(code)
label(return)

newmem:
  vmovss xmm1,[rcx+48]
  xorps xmm1,xmm1
code:
  jmp return

aoboxygen:
  jmp newmem
return:
registersymbol(aoboxygen)

[DISABLE]
aoboxygen:
  db C5 FA 10 49 48
dealloc(newmem)"""
