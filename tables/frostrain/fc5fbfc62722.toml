[[cheat]]
id = "infinite-zeal"
name = "Infinite Zeal"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(kittykat, ResourceBase:AddValue+0, ResourceBase:AddValue+af, 48 63 4F 28 03 CE 4C 63 47 2C 33 D2 48 8D 6D 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  cmp [rdi+30], #2
  jne code

  mov [rdi+28], #999999

code:
  movsxd  rcx,dword ptr [rdi+28]
  add ecx,esi
  movsxd  r8,dword ptr [rdi+2C]
  xor edx,edx
  lea rbp,[rbp+00]
  jmp return

kittykat:
  jmp far newmem
  nop 2
return:
registersymbol(kittykat)

[DISABLE]

kittykat:
  db 48 63 4F 28 03 CE 4C 63 47 2C 33 D2 48 8D 6D 00

unregistersymbol(kittykat)
dealloc(newmem)"""
