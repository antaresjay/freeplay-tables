[[cheat]]
id = "enable-cheats"
name = "Enable Cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(cheats,ACC.exe,8B 84 08 B8 01 00 00)
alloc(newmem,$1000,"ACC.exe"+EEF3EB)
alloc(cheats_ptr,8)

label(code)
label(return)
label(god)
label(invis)
label(items)
label(reload)
label(check)
label(dupe)
label(unknown80)
label(unknownA0)
label(unknownC0)
label(unknownE0)
label(unknown100)
label(unknown120)
label(unknown140)
label(unknown160)
label(unknown180)
label(unknown1A0)

newmem:
  mov [cheats_ptr],rcx
  cmp rax,0
  je god+1
  cmp rax,20
  je items+1
  cmp rax,40
  je reload+1
  cmp rax,60
  je invis+1
  cmp rax,80
  je unknown80+1
  cmp rax,A0
  je unknownA0+1
  cmp rax,C0
  je unknownC0+1
  cmp rax,E0
  je unknownE0+1
  cmp rax,100
  je unknown100+1
  cmp rax,120
  je unknown120+1
  cmp rax,140
  je unknown140+1
  cmp rax,160
  je unknown160+1
  cmp rax,180
  je unknown180+1
  cmp rax,1A0
  je unknown1A0+1
  jmp code

god:
  db 00
  cmp byte ptr [god],1
  jmp check

items:
  db 00
  cmp byte ptr [items],1
  jmp check

reload:
  db 00
  cmp byte ptr [reload],1
  jmp check

invis:
  db 00
  cmp byte ptr [invis],1
  jmp check

unknown80:
  db 00
  cmp byte ptr [unknown80],1
  jmp check

unknownA0:
  db 00
  cmp byte ptr [unknownA0],1
  jmp check

unknownC0:
  db 00
  cmp byte ptr [unknownC0],1
  jmp check

unknownE0:
  db 00
  cmp byte ptr [unknownE0],1
  jmp check

unknown100:
  db 00
  cmp byte ptr [unknown100],1
  jmp check

unknown120:
  db 00
  cmp byte ptr [unknown120],1
  jmp check

unknown140:
  db 00
  cmp byte ptr [unknown140],1
  jmp check

unknown160:
  db 00
  cmp byte ptr [unknown160],1
  jmp check

unknown180:
  db 00
  cmp byte ptr [unknown180],1
  jmp check

unknown1A0:
  db 00
  cmp byte ptr [unknown1A0],1
  jmp check

check:
  jne dupe
  mov eax,2
  jmp return

dupe:
  mov eax,[rax+rcx+000001B8]
  jmp return

code:
  mov eax,[rax+rcx+000001B8]
  jmp return

cheats:
  jmp newmem
  nop
  nop
return:
registersymbol(cheats)
registersymbol(god)
registersymbol(invis)
registersymbol(items)
registersymbol(reload)
registersymbol(unknown80)
registersymbol(unknownA0)
registersymbol(unknownC0)
registersymbol(unknownE0)
registersymbol(unknown100)
registersymbol(unknown120)
registersymbol(unknown140)
registersymbol(unknown160)
registersymbol(unknown180)
registersymbol(unknown1A0)
registersymbol(cheats_ptr)

[DISABLE]
cheats:
  db 8B 84 08 B8 01 00 00
unregistersymbol(cheats)
unregistersymbol(god)
unregistersymbol(invis)
unregistersymbol(items)
unregistersymbol(reload)
unregistersymbol(unknown80)
unregistersymbol(unknownA0)
unregistersymbol(unknownC0)
unregistersymbol(unknownE0)
unregistersymbol(unknown100)
unregistersymbol(unknown120)
unregistersymbol(unknown140)
unregistersymbol(unknown160)
unregistersymbol(unknown180)
unregistersymbol(unknown1A0)
unregistersymbol(cheats_ptr)
dealloc(newmem)
dealloc(cheats_ptr)"""

