[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(health,55 8B EC 53 57 56 81 EC 5C 02 00 00 8B 75 08 D9 EE)
registersymbol(health)


health://DDPlayerBehavior:set_CurrentHP+9:
ret



 
 
[DISABLE]
health://
 db 55
 unregistersymbol(health)"""

[[cheat]]
id = "infinite-mana"
name = "Infinite Mana"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
aobscan(mana,8B 86 80 00 00 00 03 45 0C 89 86 80 00 00 00)
registersymbol(mana)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
//
mov [esi+00000080],#250
mov eax,[esi+00000080]
jmp returnhere

mana:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
mana:
mov eax,[esi+00000080]
//Alt: db 8B 86 80 00 00 00
unregistersymbol(mana)"""

