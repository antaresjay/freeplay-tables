[[cheat]]
id = "character-ctrl-numpad-1"
name = "Character (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : InfectCam-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.5.4.0
// Game Version      : Build.20984599
// Script Date       : 2026-01-08


[ENABLE]

aobscanmodule(master,InfectCam-Win64-Shipping.exe,488BxxFFxxxxxxxxxx488Bxxxxxxxxxxxx0F28xxxxxx4883xxxx5BC3xxxxxxxxxx0FB6) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,9)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,9)

newmem:
  mov [data],rcx

code:
  readmem(master,9)
  jmp return

master:
  jmp newmem
  nop 4
return:

[DISABLE]

master:
  readmem(masterbkp,9)

unregistersymbol(*)
dealloc(*)"""

