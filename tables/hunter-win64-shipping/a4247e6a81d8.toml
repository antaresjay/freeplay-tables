[[cheat]]
id = "kill-score-default-666"
name = ".:|Kill Score|:. (default: 666)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Hunter-Win64-Shipping.exe
  Version: 
  Date   : 2018-04-24
  Author : axyd

  Kill Score
}

[ENABLE]

aobscanmodule(killscore,Hunter-Win64-Shipping.exe,8B 42 14 89 41 14 8B 42 18 48 83 C2 20 89 41 18 48 83 C1 20 E8 42) // should be unique
alloc(newmem,$1000,"Hunter-Win64-Shipping.exe"+1D77B5)

alloc(score,8) //score variable
registersymbol(score)

label(code)
label(return)

newmem:
  //check score value:
  //      if (user input != 0 ), use that value
  //      else set initial value
  cmp [score], 0
  ja code
  mov [score], (int)666

code:
  mov eax,[score]
  mov [rdx+14],eax //necessary, also used for score visual

  mov eax,[rdx+14]
  mov [rcx+14],eax
  jmp return

killscore:
  jmp newmem
  nop
return:
registersymbol(killscore)

[DISABLE]

killscore:
  db 8B 42 14 89 41 14

unregistersymbol(score)
unregistersymbol(killscore)
dealloc(score)
dealloc(newmem)

