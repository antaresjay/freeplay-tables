[[cheat]]
id = "take-no-damage-must-first-take-damage"
name = "Take No Damage (must first take damage)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(invuln,0F B6 43 6C 85 C0 0F 84)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov eax,[ebx+1C]
  cmp byte ptr [eax+394],1
  jne code
  xor eax,eax
  test eax,eax
  jmp return

code:
  movzx eax,byte ptr [ebx+6C]
  test eax,eax
  jmp return

invuln:
  jmp newmem
  nop
return:
registersymbol(invuln)

[DISABLE]
invuln:
  db 0F B6 43 6C 85 C0
unregistersymbol(invuln)
dealloc(newmem)"""

