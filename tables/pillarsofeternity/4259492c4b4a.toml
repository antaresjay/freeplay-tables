[[cheat]]
id = "unlock-all-recipes"
name = "Unlock All Recipes"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(recipe,39 1B E8 * * * * 83 C4 10 85 C0 0F 84 * * * * 8B 05 * * * * 0F B6 80 CC 00 00 00 85 C0)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov eax,1
  add esp,10
  test eax,eax
  jmp return

recipe+7:
  jmp code
return:
registersymbol(recipe)

[DISABLE]
recipe+7:
  db 83 C4 10 85 C0
unregistersymbol(recipe)
dealloc(newmem)"""
