id = "meal-duration-editor"
name = "Meal Duration + Editor"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : ffxv_s.exe
  Version: 
  Date   : 2018-03-02
  Author : Squall8
}

[ENABLE]

aobscanmodule(mealduration,ffxv_s.exe,F3 44 0F 11 87 28 06 00 00)
alloc(newmem,$1000,mealduration)

label(code)
label(return)
label(mealp)
label(charactersel)
label(infdure)

newmem:
  push eax
  mov eax,[rdi+C4]
  cmp [charactersel],eax
  pop eax
  jne @f
  mov [mealp],rdi
@@:
  cmp [infdure],1
  jne code
  fld [rdi+0000062C]
  fstp [rdi+00000628]
  jmp return

code:
  movss [rdi+00000628],xmm8
  jmp return

mealp:
  dq 0

charactersel:
  dq #1952673614

infdure:
  dq 0

mealduration:
  jmp newmem
  nop
  nop
  nop
  nop
return:
registersymbol(mealduration)
registersymbol(mealp)
registersymbol(charactersel)
registersymbol(infdure)

[DISABLE]

mealduration:
  db F3 44 0F 11 87 28 06 00 00

unregistersymbol(mealduration)
unregistersymbol(mealp)
unregistersymbol(charactersel)
unregistersymbol(infdure)
dealloc(newmem)"""

