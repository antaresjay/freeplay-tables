type = "script"
source = """
{ Game   : ffxv_s.exe
  Version: 
  Date   : 2018-03-04
  Author : Squall8
}

[ENABLE]

aobscanmodule(healthhook,ffxv_s.exe,8B 93 88 01 00 00 85)
alloc(newmem,$1000,healthhook)

label(code)
label(return)
label(statmod)
label(statmodg)
label(statmodi)
label(statmodp)
label(noct)
label(ignis)
label(glad)
label(prompto)
label(mben)
label(mbeg)
label(mbei)
label(mbep)

registersymbol(healthhook)
registersymbol(statmod)
registersymbol(statmodg)
registersymbol(statmodi)
registersymbol(statmodp)
registersymbol(mben)
registersymbol(mbeg)
registersymbol(mbei)
registersymbol(mbep)

newmem:
  cmp [rbx+C4],#1952673614
  je noct
  cmp [rbx+C4],#1684106311
  je glad
  cmp [rbx+C4],#1768843081
  je ignis
  cmp [rbx+C4],#1836020304
  je prompto
  jmp code

noct:
  mov [statmod],rbx
  cmp [mben],1
  jne code
  mov [rbx+2A3],1
  mov [rbx+3DE],5
  jmp code

glad:
  mov [statmodg],rbx
  cmp [mbeg],1
  jne code
  mov [rbx+2A3],1
  mov [rbx+3DE],5
  jmp code

ignis:
  mov [statmodi],rbx
  cmp [mbei],1
  jne code
  mov [rbx+2A3],1
  mov [rbx+3DE],5
  jmp code

prompto:
  mov [statmodp],rbx
  cmp [mbep],1
  jne code
  mov [rbx+2A3],1
  mov [rbx+3DE],5

code:
  mov edx,[rbx+00000188]
  jmp return

statmod:
  dq 0

mben:
  dq 0

statmodg:
  dq 0

mbeg:
  dq 0

statmodi:
  dq 0

mbei:
  dq 0

statmodp:
  dq 0

mbep:
  dq 0

healthhook:
  jmp newmem
  nop
return:

[DISABLE]

healthhook:
  db 8B 93 88 01 00 00

unregistersymbol(healthhook)
unregistersymbol(statmod)
unregistersymbol(statmodg)
unregistersymbol(statmodi)
unregistersymbol(statmodp)
unregistersymbol(mben)
unregistersymbol(mbeg)
unregistersymbol(mbei)
unregistersymbol(mbep)
dealloc(newmem)"""

