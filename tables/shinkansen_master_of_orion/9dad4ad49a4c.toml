source = """
[ENABLE]
label(Colony_savedAOB)
label(Colony_returnhere)
label(Colony_originalcode)
label(Colony_exit)

label(Colony_update_exit)
label(Colony_set_exit)

registersymbol(Colony_savedAOB)

//51144F68 - EB 19                 - jmp 51144F83
//51144F6A - 66 0F57 C0            - xorpd xmm0,xmm0
// Backend.Settlements:Colony:GetBuyingPrice+ee
//51144F6E - F3 0F10 8F A8000000   - movss xmm1,[rdi+000000A8]
//51144F76 - F3 0F5A C9            - cvtss2sd xmm1,xmm1
//51144F7A - F2 0F58 C1            - addsd xmm0,xmm1
//51144F7E - F2 0F11 45 80         - movsd [rbp-80],xmm0
//51144F83 - F2 0F10 45 80         - movsd xmm0,[rbp-80]
//51144F88 - F2 44 0F5A F8         - cvtsd2ss xmm15,xmm0
aobscan(Colony_searchedAOB, F3 0F 10 8F A8 00 00 00 F3 0F 5A C9 F2 0F 58 C1 F2 0F 11 45 80)

alloc(Colony_newmem, 2048, Colony_searchedAOB)
alloc(Colony_temp1, 8, Colony_searchedAOB)
alloc(Colony_temp2, 8, Colony_searchedAOB)


Colony_newmem:
mov [Colony_temp1], rbx
mov [Colony_temp2], rcx

cmp dword ptr [Colony_update_enable], #0
je Colony_update_exit
mov [Colony_basepointer], rdi
Colony_update_exit:

cmp dword ptr [Colony_set_enable], #0
je Colony_set_exit
Colony_set_exit:

mov rbx, [Colony_temp1],
mov rcx, [Colony_temp2],


Colony_originalcode:
db F3 0F 10 8F A8 00 00 00
//movss xmm1,[rdi+000000A8]


Colony_exit:
jmp Colony_returnhere


Colony_searchedAOB:
Colony_savedAOB:
jmp Colony_newmem
nop
nop
nop
Colony_returnhere:


[DISABLE]
Colony_savedAOB:
db F3 0F 10 8F A8 00 00 00
//movss xmm1,[rdi+000000A8]

unregistersymbol(Colony_savedAOB)

dealloc(Colony_newmem)
dealloc(Colony_temp1)
dealloc(Colony_temp2)"""

