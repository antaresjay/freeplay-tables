[[cheat]]
id = "civilization-base-address-scan-initialization-activate-this-first"
name = "Civilization Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Civilization_basepointer)
registersymbol(Civilization_update_enable)
registersymbol(Civilization_set_enable)

alloc(Civilization_basepointer, 8)
alloc(Civilization_update_enable, 4)
alloc(Civilization_set_enable, 4)


[DISABLE]
unregistersymbol(Civilization_basepointer)
unregistersymbol(Civilization_update_enable)
unregistersymbol(Civilization_set_enable)

dealloc(Civilization_basepointer)
dealloc(Civilization_update_enable)
dealloc(Civilization_set_enable)"""

[[cheat]]
id = "civilization-base-address-scan-to-activate-view-empire-to-update-view-empire"
name = "Civilization Base Address Scan (To Activate: View Empire, To Update: View Empire)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Civilization_savedAOB)
label(Civilization_returnhere)
label(Civilization_originalcode)
label(Civilization_exit)

label(Civilization_update_exit)
label(Civilization_set_exit)

registersymbol(Civilization_savedAOB)

//22F60959 - 48 8B F1              - mov rsi,rcx
//22F6095C - 48 8B 46 10           - mov rax,[rsi+10]
// Backend.Civilizations:Civilization:get_player+10
//22F60960 - 48 63 96 5C010000     - movsxd  rdx,dword ptr [rsi+0000015C]
//22F60967 - 48 8B C8              - mov rcx,rax
//22F6096A - 48 83 EC 20           - sub rsp,20
//22F6096E - 83 38 00              - cmp dword ptr [rax],00
aobscan(Civilization_searchedAOB, 48 63 96 5C 01 00 00 48 8B C8)

alloc(Civilization_newmem, 2048, Civilization_searchedAOB)
alloc(Civilization_temp1, 8, Civilization_searchedAOB)
alloc(Civilization_temp2, 8, Civilization_searchedAOB)


Civilization_newmem:
mov [Civilization_temp1], rbx
mov [Civilization_temp2], rcx

cmp dword ptr [Civilization_update_enable], #0
je Civilization_update_exit
mov [Civilization_basepointer], rsi
Civilization_update_exit:

cmp dword ptr [Civilization_set_enable], #0
je Civilization_set_exit
Civilization_set_exit:

mov rbx, [Civilization_temp1],
mov rcx, [Civilization_temp2],


Civilization_originalcode:
db 48 63 96 5C 01 00 00
//movsxd  rdx,dword ptr [rsi+0000015C]


Civilization_exit:
jmp Civilization_returnhere


Civilization_searchedAOB:
Civilization_savedAOB:
jmp Civilization_newmem
nop
nop
Civilization_returnhere:


[DISABLE]
Civilization_savedAOB:
db 48 63 96 5C 01 00 00
//movsxd  rdx,dword ptr [rsi+0000015C]

unregistersymbol(Civilization_savedAOB)

dealloc(Civilization_newmem)
dealloc(Civilization_temp1)
dealloc(Civilization_temp2)"""

