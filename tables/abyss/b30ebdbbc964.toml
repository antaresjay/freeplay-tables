[[cheat]]
id = "get-hp-base-addresses"
name = "Get HP Base Addresses"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Operation Abyss.exe
  Version: 
  Date   : 2017-04-09
  Author : ColonelRVH

  This script does blah blah blah
}

[ENABLE]
registersymbol(InstantKill_Flag)
registersymbol(GodMode_Flag)

aobscanmodule(Get_HP_AOB,Operation Abyss.exe,66 8B 41 18 C3) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

label(NormalCode)
label(Godmode)
label(InstantKill)
label(CmpGodmode)
label(CmpInstantKill)

alloc(InstantKill_Flag,4)
alloc(GodMode_Flag,4)

InstantKill_Flag:
dd 0

GodMode_Flag:
dd 0

newmem:
  cmp dword ptr [ecx+1C],0
  je CmpGodmode

  jmp CmpInstantKill

CmpGodmode:
  cmp dword ptr [GodMode_Flag],1
  je Godmode
CmpInstantKill:
  cmp dword ptr [InstantKill_Flag],1
  je InstantKill

code:
NormalCode:
  mov ax,[ecx+18]
  ret 
  jmp return

Godmode:
  //push ebx
  mov eax,#9999
  mov [ecx+18],ax
  //pop ebx
  jmp NormalCode

InstantKill:
  mov [ecx+18],0
  jmp NormalCode

Get_HP_AOB:
  jmp newmem
return:
registersymbol(Get_HP_AOB)

[DISABLE]

Get_HP_AOB:
  db 66 8B 41 18 C3

unregistersymbol(Get_HP_AOB)
dealloc(newmem)
unregistersymbol(InstantKill_Flag)
unregistersymbol(GodMode_Flag)

dealloc(InstantKill_Flag)
dealloc(GodMode_Flag)

