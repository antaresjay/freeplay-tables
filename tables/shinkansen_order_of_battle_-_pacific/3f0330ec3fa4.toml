[[cheat]]
id = "faction-base-address-scan-to-activate-view-purchase-to-update-view-purchase"
name = "Faction Base Address Scan (To Activate: View Purchase, To Update: View Purchase)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Faction_savedAOB)
label(Faction_returnhere)
label(Faction_originalcode)
label(Faction_exit)

label(Faction_update_exit)
label(Faction_set_exit)

registersymbol(Faction_savedAOB)

// ProductionPanelSmall:OnGUI+a31
aobscan(Faction_searchedAOB,8B 52 38 39 51 0C * * * * * * 8D 4C 11 10 0F B6 09 8B 95 1C F4 FF FF)

alloc(Faction_newmem,2048)
alloc(Faction_temp1,4)


Faction_newmem:
mov [Faction_temp1], ebx

cmp dword ptr [Faction_update_enable], #0
je Faction_update_exit
mov [Faction_basepointer], edx
Faction_update_exit:

cmp dword ptr [Faction_set_enable], #0
je Faction_set_exit
cmp dword ptr [edx+34], #0
je Faction_set_exit
mov ebx, [edx+34]
cmp dword ptr [ebx+10], #0
je Faction_set_exit
mov ebx, [ebx+10]
mov [ebx+10], #999
mov [ebx+14], #999
mov [ebx+18], #999
cmp dword ptr [edx+34], #0
je Faction_set_exit
mov ebx, [edx+34]
cmp dword ptr [ebx+14], #0
je Faction_set_exit
mov ebx, [ebx+14]
mov [ebx+10], #9999999
mov [ebx+14], #9999
Faction_set_exit:

mov ebx, [Faction_temp1]


Faction_originalcode:
db 8B 52 38 39 51 0C
//mov edx,[edx+38]
//cmp [ecx+0C],edx


Faction_exit:
jmp Faction_returnhere


Faction_searchedAOB:
Faction_savedAOB:
jmp Faction_newmem
nop
Faction_returnhere:


[DISABLE]
Faction_savedAOB:
db 8B 52 38 39 51 0C
//mov edx,[edx+38]
//cmp [ecx+0C],edx

unregistersymbol(Faction_savedAOB)

dealloc(Faction_newmem)
dealloc(Faction_temp1)"""

