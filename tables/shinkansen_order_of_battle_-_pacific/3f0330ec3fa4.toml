name = "Faction Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Faction_basepointer)
registersymbol(Faction_update_enable)
registersymbol(Faction_set_enable)

