[[cheat]]
id = "godmode"
name = "Godmode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(godmode,ThankYouVeryCool-Win64-Shipping.exe,80 B9 60 10 00 00 00 49)
alloc(newmem,$1000,godmode)
alloc(_god,8)

label(code)
label(return)

newmem:
  mov [_god],rcx

code:
  cmp byte ptr [rcx+00001060],01
  jmp return

godmode:
  jmp newmem
  nop 2
return:
registersymbol(godmode)
registersymbol(_god)

[DISABLE]

godmode:
  db 80 B9 60 10 00 00 00

unregistersymbol(godmode)
unregistersymbol(_god)
dealloc(newmem)
dealloc(_god)"""

