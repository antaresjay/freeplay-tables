type = "script"
source = """
[ENABLE]

aobScanModule(PawnHook,ProjectAnt-Win64-Shipping.exe,EB 20 48 8B 01 4C 8D 44 24 20)
alloc(n_Pawn,$1000,PawnHook)

label(o_Pawn r_Pawn PawnPtr)


n_Pawn:
  mov [PawnPtr],rcx

o_Pawn:
  mov rax,[rcx]
  lea r8,[rsp+20]
  jmp r_Pawn
  
PawnPtr:
 dq 0

PawnHook+2:
  jmp n_Pawn
  db 90 90 90

r_Pawn:
registersymbol(PawnHook PawnPtr)

[DISABLE]

PawnHook+2:
  db 48 8B 01 4C 8D 44 24 20

unregisterSymbol(*)
dealloc(*)"""
