[[cheat]]
id = "activate"
name = "Activate"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(player,2048)
registersymbol(player)

player:
dd 0

aobscanmodule(MaxAmmoBaseAddress,server.dll,* * * * E8 * * * * * * * * * * * * 6A 0A 6A 08)
registersymbol(MaxAmmoBaseAddress)
aobscanmodule(GetBaseAddress,server.dll,8B 41 34 * * * 74 23)
registersymbol(GetBaseAddress)
aobscanmodule(PlayerBaseAddress,server.dll,8B 0D * * * * 3B 41 14 7F 43)
registersymbol(PlayerBaseAddress)
aobscanmodule(Activate,server.dll,55 8B EC 8B 45 08 * 33 FF 85 C0)
registersymbol(Activate)
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
push eax
xor eax,eax
mov [player],eax
mov eax,PlayerBaseAddress
mov eax,[eax+02]
mov eax,[eax]
test eax,eax
je originalcode
mov eax,[eax+58]
test eax,eax
je originalcode
mov eax,[eax+1C]
test eax,eax
je originalcode
mov [player],eax

originalcode:
pop eax
push ebp
mov ebp,esp
mov eax,[ebp+08]

exit:
jmp returnhere

Activate:
jmp newmem
nop
returnhere:

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(player)
unregistersymbol(player)

unregistersymbol(MaxAmmoBaseAddress)
unregistersymbol(GetBaseAddress)
unregistersymbol(PlayerBaseAddress)
unregistersymbol(Activate)
dealloc(newmem)
Activate:
//push ebp
//mov ebp,esp
//mov eax,[ebp+08]
db 55 8B EC 8B 45 08"""

