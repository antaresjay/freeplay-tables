alloc(ignore_damage_by_friendly,2048)
registersymbol(ignore_damage_by_friendly)
alloc(damage_attacking_enemy,2048)
registersymbol(damage_attacking_enemy)
alloc(damage_attacking_enemy_modifier,2048)
registersymbol(damage_attacking_enemy_modifier)
alloc(ignore_friendly_fire,2048)
registersymbol(ignore_friendly_fire)
alloc(damage_taken_modifier,2048)
registersymbol(damage_taken_modifier)

ignore_damage_by_friendly:
db 0

damage_attacking_enemy:
db 0

damage_attacking_enemy_modifier:
dd (Float)10000

damage_attacking_enemy_modifier+4:
dd (Float)1

ignore_friendly_fire:
db 0

damage_taken_modifier:
dd 0

damage_taken_modifier+4:
dd 0

aobscanmodule(DamageTakenModifier,server.dll,55 8B EC 83 EC 6C * * * 8B 0D)
registersymbol(DamageTakenModifier)
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
label(check_ignore_damage_by_friendly)
label(check_damage_attacking_enemy)
label(check_ignore_friendly_fire)
label(ignore_damage)

newmem: //this is allocated memory, you have read,write,execute access
push eax
push ecx
push edx
lea ecx,[ecx]
mov eax,[player]
test eax,eax
je originalcode
cmp eax,ecx
je check_ignore_damage_by_friendly
jmp check_ignore_friendly_fire

check_ignore_damage_by_friendly:
cmp byte ptr [ignore_damage_by_friendly],0
je check_damage_attacking_enemy
mov ecx,[esp+10]
mov ecx,[ecx+34]
sub esp,100
mov [esp+34],ecx
mov ecx,esp
call GetBaseAddress
add esp,100
test eax,eax
je exit
mov ecx,[esp+04]
mov ecx,[ecx+00000238]
cmp [eax+00000238],ecx
jne check_damage_attacking_enemy
jmp exit

check_damage_attacking_enemy:
cmp byte ptr [damage_attacking_enemy],0
je exit
mov ecx,[esp+10]
mov ecx,[ecx+34]
sub esp,100
mov [esp+34],ecx
mov ecx,esp
call GetBaseAddress
add esp,100
test eax,eax
je exit
cmp [esp+04],eax
je exit
mov [esp+04],eax
mov eax,[player]
mov edx,[eax+000003A0]
mov ecx,[esp+10]
mov [ecx+30],edx
mov [ecx+34],edx
fld dword ptr [ecx+3C]
fadd dword ptr [damage_attacking_enemy_modifier]
fmul dword ptr [damage_attacking_enemy_modifier+4]
fstp dword ptr [ecx+3C]
fld dword ptr [ecx+40]
fadd dword ptr [damage_attacking_enemy_modifier]
fmul dword ptr [damage_attacking_enemy_modifier+4]
fstp dword ptr [ecx+40]
jmp originalcode

check_ignore_friendly_fire:
cmp byte ptr [ignore_friendly_fire],0
je originalcode
mov ecx,[esp+10]
mov ecx,[ecx+34]
mov eax,[player]
cmp [eax+000003A0],ecx
jne originalcode
mov ecx,[esp+04]
mov ecx,[ecx+00000238]
cmp [eax+00000238],ecx
jne originalcode
mov eax,[esp+10]
mov [eax+3C],0
mov [eax+40],0
jmp ignore_damage

originalcode:
pop edx
pop ecx
pop eax
push ebp
mov ebp,esp
sub esp,6C
jmp returnhere

exit:
mov eax,[esp+10]
fld dword ptr [eax+3C]
fadd dword ptr [damage_taken_modifier]
fmul dword ptr [damage_taken_modifier+4]
fstp dword ptr [eax+3C]
fld dword ptr [eax+40]
fadd dword ptr [damage_taken_modifier]
fmul dword ptr [damage_taken_modifier+4]
fstp dword ptr [eax+40]
cmp [eax+3C],0
je ignore_damage
pop edx
pop ecx
pop eax
push ebp
mov ebp,esp
sub esp,6C
jmp returnhere

ignore_damage:
pop edx
pop ecx
pop eax
ret 0004

DamageTakenModifier:
jmp newmem
nop
returnhere:

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(ignore_damage_by_friendly)
unregistersymbol(ignore_damage_by_friendly)
dealloc(damage_attacking_enemy)
unregistersymbol(damage_attacking_enemy)
dealloc(damage_attacking_enemy_modifier)
unregistersymbol(damage_attacking_enemy_modifier)
dealloc(ignore_friendly_fire)
unregistersymbol(ignore_friendly_fire)
dealloc(damage_taken_modifier)
unregistersymbol(damage_taken_modifier)

unregistersymbol(DamageTakenModifier)
dealloc(newmem)
DamageTakenModifier:
//push ebp
//mov ebp,esp
//sub esp,6C
db 55 8B EC 83 EC 6C"""

