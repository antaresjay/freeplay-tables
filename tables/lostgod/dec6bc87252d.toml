[[cheat]]
id = "free-shopping"
name = "free shopping"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanregion(currencyWritesOnChangeAOB,PlayerItems:GainRedCrystals,PlayerItems:GainRedCrystals+3e,89 87 ** ** ** ** 48 8B CF)
registersymbol(currencyWritesOnChangeAOB)

alloc(newmem,2048,currencyWritesOnChangeAOB) //PlayerItems:GainRedCrystals+1a)
label(returnhere)
label(originalcode_freeshop)
registersymbol(originalcode_freeshop)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
test eax,eax
jge @f
xor eax,eax

originalcode_freeshop:
readmem(currencyWritesOnChangeAOB,6)
//mov [rdi+000000B4],eax

exit:
jmp returnhere

///

currencyWritesOnChangeAOB: //PlayerItems:GainRedCrystals+1a:
jmp newmem
nop
returnhere:

///*******************************************///
aobscanregion(cJmpIfEnoughCurrencyOnBuyAOB,ShopItem:BuyItem,ShopItem:BuyItem+a0,48 ** ** ** ** ** 7D ** 48)
registersymbol(cJmpIfEnoughCurrencyOnBuyAOB)

cJmpIfEnoughCurrencyOnBuyAOB+6: //ShopItem:BuyItem+56:
db EB




[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
currencyWritesOnChangeAOB: //PlayerItems:GainRedCrystals+1a:
readmem(originalcode_freeshop,6)
//db 89 87 B4 00 00 00
//Alt: mov [rdi+000000B4],eax

unregistersymbol(originalcode_freeshop)

///*******************************************///
cJmpIfEnoughCurrencyOnBuyAOB+6: //ShopItem:BuyItem+56:
db 7D
//Alt: jnl"""

