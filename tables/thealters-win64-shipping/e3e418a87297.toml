[[cheat]]
id = "storage-resource-pointer"
name = "Storage Resource Pointer"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(storage,$process,48 8B ?? 08 8B 40 ?? 48 8B)
alloc(newmem,$1000,storage)

label(storagePtr)
label(storageBkp)
label(return)

newmem:
  readmem(storage,4)
  db 48 8D
  readmem(storage+05,2)
  mov rcx,storagePtr
  mov [rcx+00],rax
  mov [rcx+08],rsi
  mov eax,[rax]
  jmp return
storageBkp:
  readmem(storage,7)
  jmp return

align 10
storagePtr:
  dq 0
  dq 0

storage:
  jmp newmem
  nop 2
return:
registersymbol(storage)
registersymbol(storageBkp)
registersymbol(storagePtr)

[DISABLE]
storage:
  readmem(storageBkp,7)
unregistersymbol(storage)
unregistersymbol(storageBkp)
unregistersymbol(storagePtr)
dealloc(newmem)

