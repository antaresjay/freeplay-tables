[[cheat]]
id = "power-base-address-scan-initialization-activate-this-first"
name = "Power Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Power_basepointer)
registersymbol(Power_update_enable)
registersymbol(Power_set_enable)

alloc(Power_basepointer, 4)
alloc(Power_update_enable, 4)
alloc(Power_set_enable, 4)


[DISABLE]
unregistersymbol(Power_basepointer)
unregistersymbol(Power_update_enable)
unregistersymbol(Power_set_enable)

dealloc(Power_basepointer)
dealloc(Power_update_enable)
dealloc(Power_set_enable)"""

[[cheat]]
id = "power-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Power Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Power_savedAOB)
label(Power_returnhere)
label(Power_originalcode)
label(Power_exit)

label(Power_update_exit)
label(Power_set_exit)

registersymbol(Power_savedAOB)

//05224624 - 83 EC 14              - sub esp,14
//05224627 - 8B 7D 08              - mov edi,[ebp+08]
// Power:Update+a
//0522462A - D9 47 30              - fld dword ptr [edi+30]
//0522462D - D9EE                  - fldz
//0522462F - DFF1                  - fcomip st(0),st(1)
//05224631 - DDD8                  - fstp st(0)
//05224633 - 0F82 74000000         - jb 052246AD
aobscan(Power_searchedAOB, D9 47 30 D9 EE DF F1)

alloc(Power_newmem, 2048, Power_searchedAOB)
alloc(Power_temp1, 4, Power_searchedAOB)


Power_newmem:
mov [Power_temp1], (float)0.1

cmp dword ptr [Power_update_enable], #0
je Power_update_exit
mov [Power_basepointer], edi
Power_update_exit:

cmp dword ptr [Power_set_enable], #0
je Power_set_exit
mov [edi+30], (float)0
fld [edi+18]
fsub [Power_temp1]
fsub [Power_temp1]
fld [edi+2c]
fcomi ST(0), ST(1)
fstp ST(0)
fstp ST(0)
ja Power_set_exit
fld [edi+18]
fsub [Power_temp1]
fstp [edi+2c]
Power_set_exit:


Power_originalcode:
db D9 47 30 D9 EE
//fld dword ptr [edi+30]
//fldz


Power_exit:
jmp Power_returnhere


Power_searchedAOB:
Power_savedAOB:
jmp Power_newmem
Power_returnhere:


[DISABLE]
Power_savedAOB:
db D9 47 30 D9 EE
//fld dword ptr [edi+30]
//fldz

unregistersymbol(Power_savedAOB)

dealloc(Power_newmem)
dealloc(Power_temp1)"""

