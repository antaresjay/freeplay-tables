label(BipedHandScript_exit)

label(BipedHandScript_update_exit)
label(BipedHandScript_set_exit)

registersymbol(BipedHandScript_savedAOB)

//16CD3515 - 83 EC 40              - sub esp,40
//16CD3518 - 8B 7D 08              - mov edi,[ebp+08]
// BipedHandScript:ReleaseGrab+b
//16CD351B - 8B 47 20              - mov eax,[edi+20]
//16CD351E - 8B 40 2C              - mov eax,[eax+2C]
//16CD3521 - 85 C0                 - test eax,eax
//16CD3523 - 74 18                 - je 16CD353D
//16CD3525 - 8B 47 20              - mov eax,[edi+20]
//16CD3528 - 8B 40 2C              - mov eax,[eax+2C]
//16CD352B - 8B 4F 64              - mov ecx,[edi+64]
//16CD352E - 83 EC 08              - sub esp,08
//16CD3531 - 51                    - push ecx
//16CD3532 - 50                    - push eax
//16CD3533 - 39 00                 - cmp [eax],eax
//16CD3535 - E8 3E903CEE           - call 0509C578
//16CD353A - 83 C4 10              - add esp,10
//16CD353D - 8B 47 64              - mov eax,[edi+64]
//16CD3540 - 83 EC 08              - sub esp,08
//16CD3543 - 6A 00                 - push 00
//16CD3545 - 50                    - push eax
aobscan(BipedHandScript_searchedAOB, 8B 47 20 8B 40 2C 85 C0 74 18 8B 47 20 8B 40 2C 8B 4F 64 83 EC 08 51 50 39 00 * * * * * 83 C4 10 8B 47 64 83 EC 08 6A 00)

alloc(BipedHandScript_newmem, 2048, BipedHandScript_searchedAOB)


BipedHandScript_newmem:
cmp dword ptr [BipedHandScript_update_enable], #0
je BipedHandScript_update_exit
mov [BipedHandScript_basepointer], edi
BipedHandScript_update_exit:

cmp dword ptr [BipedHandScript_set_enable], #0
je BipedHandScript_set_exit
mov [edi+100], (float)999
mov [edi+104], (float)999
mov [edi+108], (float)999
mov [edi+120], (float)999
BipedHandScript_set_exit:


BipedHandScript_originalcode:
db 8B 47 20 8B 40 2C
//mov eax,[edi+20]
//mov eax,[eax+2C]


BipedHandScript_exit:
jmp BipedHandScript_returnhere


BipedHandScript_searchedAOB:
BipedHandScript_savedAOB:
jmp BipedHandScript_newmem
nop
BipedHandScript_returnhere:


[DISABLE]
BipedHandScript_savedAOB:
db 8B 47 20 8B 40 2C
//mov eax,[edi+20]
//mov eax,[eax+2C]

unregistersymbol(BipedHandScript_savedAOB)

dealloc(BipedHandScript_newmem)"""

