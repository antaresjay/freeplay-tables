[[cheat]]
id = "god-mode"
name = "God Mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(health,GameAssembly.dll,89 5F 30 48 8B 4F 28)
alloc(newmem,$1000,health)
alloc(player,8)
alloc(enemy,8)
registersymbol(health,player,enemy)

label(code)
label(return)

player:
dd 0
enemy:
dd 0

newmem:
cmp [rdi+EBC],1010000
jne @f
cmp [player],0
je code
push ebx
mov ebx,[rdi+38]
mov [rdi+30],ebx
pop ebx
mov rcx,[rdi+28]
jmp return

@@:
cmp [enemy],0
je code
mov [rdi+30],00
mov rcx,[rdi+28]
jmp return

code:
mov [rdi+30],ebx
mov rcx,[rdi+28]
jmp return

health:
  jmp newmem
  nop 2
return:


[DISABLE]

health:
  db 89 5F 30 48 8B 4F 28

unregistersymbol(*)
dealloc(*)"""

