[[cheat]]
id = "quest-stats-base-address-scan-initialization-activate-this-first"
name = "Quest Stats Base Address Scan Initialization (Activate This First)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(queststats_basepointer)
registersymbol(queststats_update_enable)
registersymbol(queststats_invincibilityset_enable)
registersymbol(queststats_hpset_enable)
registersymbol(queststats_dpset_enable)
registersymbol(queststats_attributesset_enable)
registersymbol(queststats_floatset_enable)
registersymbol(queststats_witchset_enable)
registersymbol(queststats_oracleset_enable)
registersymbol(queststats_banditset_enable)
registersymbol(queststats_questset_enable)

//019C0BD8 - 48                    - dec eax
//019C0BD9 - 89 42 20              - mov [edx+20],eax
// Accesses Dragon Points Base Pointer
//019C0BDC - 8B 42 18              - mov eax,[edx+18]
//019C0BDF - 85 C0                 - test eax,eax
//019C0BE1 - 74 23                 - je 019C0C06
//019C0BE3 - 8B 80 F0060000        - mov eax,[eax+000006F0]
//019C0BE9 - C1 E8 04              - shr eax,04
//019C0BEC - 24 01                 - and al,01
aobscan(queststats_initialization_searchedAOB, 8B 42 18 85 C0 74 23 8B 80 F0 06 00 00)

alloc(queststats_basepointer, 4, queststats_initialization_searchedAOB)
alloc(queststats_update_enable, 4, queststats_initialization_searchedAOB)
alloc(queststats_invincibilityset_enable, 4, queststats_initialization_searchedAOB)
alloc(queststats_hpset_enable, 4, queststats_initialization_searchedAOB)
alloc(queststats_dpset_enable, 4, queststats_initialization_searchedAOB)
alloc(queststats_attributesset_enable, 4, queststats_initialization_searchedAOB)
alloc(queststats_floatset_enable, 4, queststats_initialization_searchedAOB)
alloc(queststats_witchset_enable, 4, queststats_initialization_searchedAOB)
alloc(queststats_oracleset_enable, 4, queststats_initialization_searchedAOB)
alloc(queststats_banditset_enable, 4, queststats_initialization_searchedAOB)
alloc(queststats_questset_enable, 4, queststats_initialization_searchedAOB)


[DISABLE]
unregistersymbol(queststats_basepointer)
unregistersymbol(queststats_update_enable)
unregistersymbol(queststats_invincibilityset_enable)
unregistersymbol(queststats_hpset_enable)
unregistersymbol(queststats_dpset_enable)
unregistersymbol(queststats_attributesset_enable)
unregistersymbol(queststats_floatset_enable)
unregistersymbol(queststats_witchset_enable)
unregistersymbol(queststats_oracleset_enable)
unregistersymbol(queststats_banditset_enable)
unregistersymbol(queststats_questset_enable)

dealloc(queststats_basepointer)
dealloc(queststats_update_enable)
dealloc(queststats_invincibilityset_enable)
dealloc(queststats_hpset_enable)
dealloc(queststats_dpset_enable)
dealloc(queststats_attributesset_enable)
dealloc(queststats_floatset_enable)
dealloc(queststats_witchset_enable)
dealloc(queststats_oracleset_enable)
dealloc(queststats_banditset_enable)
dealloc(queststats_questset_enable)"""

[[cheat]]
id = "quest-stats-base-address-scan-to-update-play-quest"
name = "Quest Stats Base Address Scan (To Update: Play Quest)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(queststats_savedAOB)
label(queststats_returnhere)
label(queststats_originalcode)
label(queststats_exit)

label(queststats_update_exit)
label(queststats_invincibilityset_exit)
label(queststats_hpset_exit)
label(queststats_dpset_exit)
label(queststats_attributesset_exit)
label(queststats_floatset_exit)
label(queststats_witchset_exit)
label(queststats_oracleset_exit)
label(queststats_banditset_exit)
label(queststats_questset_exit)

registersymbol(queststats_originalcode)
registersymbol(queststats_savedAOB)

//019C0BD8 - 48                    - dec eax
//019C0BD9 - 89 42 20              - mov [edx+20],eax
// Accesses Dragon Points Base Pointer
//019C0BDC - 8B 42 18              - mov eax,[edx+18]
//019C0BDF - 85 C0                 - test eax,eax
//019C0BE1 - 74 23                 - je 019C0C06
//019C0BE3 - 8B 80 F0060000        - mov eax,[eax+000006F0]
//019C0BE9 - C1 E8 04              - shr eax,04
//019C0BEC - 24 01                 - and al,01
aobscan(queststats_searchedAOB, 8B 42 18 85 C0 74 23 8B 80 F0 06 00 00)

alloc(queststats_newmem, 2048, queststats_searchedAOB)
alloc(queststats_temp1, 4, queststats_searchedAOB)
alloc(queststats_temp2, 4, queststats_searchedAOB)
alloc(queststats_temp3, 4, queststats_searchedAOB)
alloc(queststats_temp4, 4, queststats_searchedAOB)
alloc(queststats_temp5, 4, queststats_searchedAOB)


queststats_newmem:
mov [queststats_temp1], eax
mov [queststats_temp2], ebx
mov [queststats_temp3], ecx
mov [queststats_temp4], edx

cmp dword ptr [queststats_update_enable], #0
je queststats_update_exit
mov [queststats_basepointer], edx
queststats_update_exit:

cmp dword ptr [queststats_invincibilityset_enable], #0
je queststats_invincibilityset_exit
mov ebx, [edx+18]
test ebx, ebx
je queststats_invincibilityset_exit
fld [ebx+38c]
fstp [ebx+394]
queststats_invincibilityset_exit:

cmp dword ptr [queststats_hpset_enable], #0
je queststats_hpset_exit
mov ebx, [edx+18]
test ebx, ebx
je queststats_hpset_exit
mov ebx, [ebx+39c]
test ebx, ebx
je queststats_hpset_exit
mov ecx, [ebx+84]
mov [ebx+80], ecx
queststats_hpset_exit:

cmp dword ptr [queststats_dpset_enable], #0
je queststats_dpset_exit
mov ebx, [edx+18]
test ebx, ebx
je queststats_dpset_exit
mov ecx, [ebx+84]
mov [ebx+70c], #1000000
queststats_dpset_exit:

cmp dword ptr [queststats_attributesset_enable], #0
je queststats_attributesset_exit
mov ebx, [edx+18]
test ebx, ebx
je queststats_attributesset_exit
mov ebx, [ebx+39c]
test ebx, ebx
je queststats_attributesset_exit
mov ebx, [ebx+70]
test ebx, ebx
je queststats_attributesset_exit
mov word ptr [ebx+30], #30000
mov word ptr [ebx+32], #30000
mov word ptr [ebx+34], #30000
mov word ptr [ebx+36], #30000
mov word ptr [ebx+38], #30000
mov word ptr [ebx+3a], #30000
queststats_attributesset_exit:

cmp dword ptr [queststats_floatset_enable], #0
je queststats_floatset_exit
mov ebx, [edx+18]
test ebx, ebx
je queststats_floatset_exit
mov ebx, [ebx+3a0]
test ebx, ebx
je queststats_floatset_exit
cmp dword ptr [ebx+58], #4
jne queststats_floatset_exit
mov [ebx+74], #260
queststats_floatset_exit:

cmp dword ptr [queststats_witchset_enable], #0
je queststats_witchset_exit
mov ebx, [edx+18]
test ebx, ebx
je queststats_witchset_exit
fld [ebx+1100]
fstp [ebx+10fc]
queststats_witchset_exit:

cmp dword ptr [queststats_oracleset_enable], #0
je queststats_oracleset_exit
mov ebx, [edx+18]
test ebx, ebx
je queststats_oracleset_exit
fld [ebx+1108]
fstp [ebx+1104]
mov ecx, [ebx+106c]
test ecx, ecx
je queststats_oracleset_exit
mov [ecx+72c], (float)999
mov ecx, [ebx+1070]
test ecx, ecx
je queststats_oracleset_exit
mov [ecx+72c], (float)999
queststats_oracleset_exit:

cmp dword ptr [queststats_banditset_enable], #0
je queststats_banditset_exit
mov ebx, [edx+18]
test ebx, ebx
je queststats_banditset_exit
mov [ebx+107c], #2
mov [ebx+1080], #4
mov [ebx+1084], #3
mov [ebx+1088], #3
mov [ebx+108c], #5
mov [ebx+1090], #3
queststats_banditset_exit:

cmp dword ptr [queststats_questset_enable], #0
je queststats_questset_exit
mov ebx, [edx+44]
test ebx, ebx
je queststats_questset_exit
mov [queststats_temp5], (float)100
fld [queststats_temp5]
fmul [ebx+1340]
fstp [ebx+140c]
mov [ebx+140c], (float)216001
queststats_questset_exit:

mov eax, [queststats_temp1]
mov ebx, [queststats_temp2]
mov ecx, [queststats_temp3]
mov edx, [queststats_temp4]


queststats_originalcode:
readmem(queststats_searchedAOB, 5)


queststats_exit:
jmp queststats_returnhere


queststats_searchedAOB:
queststats_savedAOB:
jmp queststats_newmem
queststats_returnhere:


[DISABLE]
queststats_savedAOB:
readmem(queststats_originalcode, 5)

unregistersymbol(queststats_originalcode)
unregistersymbol(queststats_savedAOB)

dealloc(queststats_newmem)
dealloc(queststats_temp1)
dealloc(queststats_temp2)
dealloc(queststats_temp3)
dealloc(queststats_temp4)
dealloc(queststats_temp5)"""

