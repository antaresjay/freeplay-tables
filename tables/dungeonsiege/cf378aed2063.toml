[[cheat]]
id = "dungeon-siege-aob-script"
name = "Dungeon Siege AOB script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game   : DungeonSiege.exe
// Version:
// Date   :
// Author : Cs
[ENABLE]
aobscanmodule(aobLifeRegenRateReader,DungeonSiege.exe,D9 86 80 00 00 00 51 51)
aobscanmodule(aobManaRegenRateReader,DungeonSiege.exe,D9 86 9C 00 00 00 83 C4 3C)
aobscanmodule(aobXPCalc,DungeonSiege.exe,83 EC 2C DD 45 10 53 DC)
aobscanmodule(aobPartyGrabber,DungeonSiege.exe,8B 49 78 6A 01)
aobscanmodule(aobGoldUpdater,DungeonSiege.exe,8B 44 24 04 56 8B F1 6A 01)

alloc(newmemLifeRegenRateReader,4096,aobLifeRegenRateReader)

label(aobLifeRegenRateReader_r)
label(aobLifeRegenRateReader_i)
registersymbol(aobLifeRegenRateReader_r)
registersymbol(aobLifeRegenRateReader_i)

label(lblLifeRegenRateReader)
label(lblLifeRegenRateReaderSkip)
label(lblLifeRegenRateReaderRet)

label(bEnableLifeRegenRateMod)
label(fLifeRegenRateMod)
registersymbol(bEnableLifeRegenRateMod)
registersymbol(fLifeRegenRateMod)

label(aobManaRegenRateReader_r)
label(aobManaRegenRateReader_i)
registersymbol(aobManaRegenRateReader_r)
registersymbol(aobManaRegenRateReader_i)

label(lblManaRegenRateReader)
label(lblManaRegenRateReaderSkip)
label(lblManaRegenRateReaderRet)

label(bEnableManaRegenRateMod)
label(fManaRegenRateMod)
registersymbol(bEnableManaRegenRateMod)
registersymbol(fManaRegenRateMod)

label(aobXPCalc_r)
label(aobXPCalc_i)
registersymbol(aobXPCalc_r)
registersymbol(aobXPCalc_i)

label(lblXPCalc)
label(lblXPCalcSkip)
label(lblXPCalcRet)

label(bEnableXPGainMod)
label(fXPGainMod)
registersymbol(bEnableXPGainMod)
registersymbol(fXPGainMod)

label(aobPartyGrabber_r)
label(aobPartyGrabber_i)
registersymbol(aobPartyGrabber_r)
registersymbol(aobPartyGrabber_i)

label(lblPartyGrabber)
label(lblPartyGrabberSkip)
label(lblPartyGrabberRet)

label(pParty)
registersymbol(pParty)

label(aobGoldUpdater_r)
label(aobGoldUpdater_i)
registersymbol(aobGoldUpdater_r)
registersymbol(aobGoldUpdater_i)

label(lblGoldUpdater)
label(lblGoldUpdaterSkip)
label(lblGoldUpdaterRet)

label(bEnableMinGold)
label(iMinGold)
registersymbol(bEnableMinGold)
registersymbol(iMinGold)

newmemLifeRegenRateReader:
bEnableLifeRegenRateMod:
dd 1
fLifeRegenRateMod:
dd (float)0.05
bEnableManaRegenRateMod:
dd 1
fManaRegenRateMod:
dd (float)0.05
bEnableXPGainMod:
dd 1
fXPGainMod:
dd (float)100000.0
bEnableMinGold:
dd 1
iMinGold:
dd (int)999999

lblLifeRegenRateReader:
readmem(aobLifeRegenRateReader,6)
mov eax,[esi+04]
test eax,eax
jz short lblLifeRegenRateReaderSkip
mov eax,[eax+78]
cmp dword ptr [pParty],eax
jne short lblLifeRegenRateReaderSkip
cmp dword ptr [bEnableLifeRegenRateMod],1
jne short lblLifeRegenRateReaderSkip
fmul dword ptr [fLifeRegenRateMod]
lblLifeRegenRateReaderSkip:
jmp lblLifeRegenRateReaderRet
aobLifeRegenRateReader_i:
readmem(aobLifeRegenRateReader,6)

lblManaRegenRateReader:
readmem(aobManaRegenRateReader,6)
mov eax,[esi+04]
test eax,eax
jz short lblManaRegenRateReaderSkip
mov eax,[eax+78]
cmp dword ptr [pParty],eax
jne short lblManaRegenRateReaderSkip
cmp dword ptr [bEnableManaRegenRateMod],1
jne short lblManaRegenRateReaderSkip
fmul dword ptr [fManaRegenRateMod]
lblManaRegenRateReaderSkip:
jmp lblManaRegenRateReaderRet
aobManaRegenRateReader_i:
readmem(aobManaRegenRateReader,6)

lblXPCalc:
cmp dword ptr [bEnableXPGainMod],1
jne short lblXPCalcSkip
fld qword ptr [ebp+10]
fmul dword ptr [fXPGainMod]
fstp qword ptr [ebp+10]
lblXPCalcSkip:
readmem(aobXPCalc,6)
jmp lblXPCalcRet
aobXPCalc_i:
readmem(aobXPCalc,6)

lblPartyGrabber:
readmem(aobPartyGrabber,5)
cmp dword ptr [ecx+14],1
jne short lblPartyGrabberSkip
mov dword ptr [pParty],ecx
lblPartyGrabberSkip:
jmp lblPartyGrabberRet
aobPartyGrabber_i:
readmem(aobPartyGrabber,5)
pParty:
dd 0

lblGoldUpdater:
cmp dword ptr [bEnableMinGold],1
jne short lblGoldUpdaterSkip
mov eax,[iMinGold]
cmp dword ptr [esp+04],eax
jge short lblGoldUpdaterSkip
mov dword ptr [esp+04],eax
lblGoldUpdaterSkip:
readmem(aobGoldUpdater,5)
jmp lblGoldUpdaterRet
aobGoldUpdater_i:
readmem(aobGoldUpdater,5)

aobGoldUpdater:
aobGoldUpdater_r:
jmp lblGoldUpdater
lblGoldUpdaterRet:

aobPartyGrabber:
aobPartyGrabber_r:
jmp lblPartyGrabber
lblPartyGrabberRet:

aobXPCalc:
aobXPCalc_r:
jmp lblXPCalc
nop
lblXPCalcRet:

aobManaRegenRateReader:
aobManaRegenRateReader_r:
jmp lblManaRegenRateReader
nop
lblManaRegenRateReaderRet:

aobLifeRegenRateReader:
aobLifeRegenRateReader_r:
jmp lblLifeRegenRateReader
nop
lblLifeRegenRateReaderRet:

[DISABLE]
aobLifeRegenRateReader_r:
readmem(aobLifeRegenRateReader_i,6)

unregistersymbol(aobLifeRegenRateReader_r)
unregistersymbol(aobLifeRegenRateReader_i)

unregistersymbol(bEnableLifeRegenRateMod)
unregistersymbol(fLifeRegenRateMod)

aobManaRegenRateReader_r:
readmem(aobManaRegenRateReader_i,6)

unregistersymbol(aobManaRegenRateReader_r)
unregistersymbol(aobManaRegenRateReader_i)

unregistersymbol(bEnableManaRegenRateMod)
unregistersymbol(fManaRegenRateMod)

aobXPCalc_r:
readmem(aobXPCalc_i,6)

unregistersymbol(aobXPCalc_r)
unregistersymbol(aobXPCalc_i)

unregistersymbol(bEnableXPGainMod)
unregistersymbol(fXPGainMod)

aobPartyGrabber_r:
readmem(aobPartyGrabber_i,5)

unregistersymbol(aobPartyGrabber_r)
unregistersymbol(aobPartyGrabber_i)

unregistersymbol(pParty)

aobGoldUpdater_r:
readmem(aobGoldUpdater_i,5)

unregistersymbol(aobGoldUpdater_r)
unregistersymbol(aobGoldUpdater_i)

unregistersymbol(bEnableMinGold)
unregistersymbol(iMinGold)

dealloc(newmemLifeRegenRateReader)"""

