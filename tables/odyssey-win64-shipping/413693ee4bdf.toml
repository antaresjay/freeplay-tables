type = "script"
source = """
//Send@ModEngine
[ENABLE]

aobscanmodule(health,odyssey-Win64-Shipping.exe,8B 91 20 02 00 00 33)
alloc(newmem,$1000,health)

label(code)
label(return)

newmem:
cmp dword ptr [rcx+0210],#0
mov edx,#9999999999
jne code
jmp return

code:
  mov edx,[rcx+00000220]
  jmp return

health:
  jmp newmem
  nop
return:
registersymbol(health)

[DISABLE]

health:
  db 8B 91 20 02 00 00

unregistersymbol(health)
dealloc(newmem)"""
