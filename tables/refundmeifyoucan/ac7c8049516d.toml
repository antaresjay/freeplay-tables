[[cheat]]
id = "set-time"
name = "Set Time"
category = "game"
description = ""
hint = ""
type = "script"
source = """
{ Game   : RefundMeIfYouCan.exe
  Date   : 27-07-2022
  Author : Glowmoss
}

[ENABLE]

aobscanregion(ZeroTime,SaveData:Update,SaveData:Update+273,F3 0F 11 6E 20 F3 0F 10 46)
alloc(newmem,64,ZeroTime)
alloc(Timer,8)

registersymbol(ZeroTime Timer)
label(return)

newmem:
  movss xmm5,[Timer]
  movss [rsi+20],xmm5
  jmp return

Timer:
  dq 0

ZeroTime:
  jmp newmem
return:

[DISABLE]

ZeroTime:
  db F3 0F 11 6E 20

unregistersymbol(*)
dealloc(*)"""

