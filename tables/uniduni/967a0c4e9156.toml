define(address,CharacterCoopJump:JumpStart+15e)
define(bytes,48 63 8E D0 00 00 00)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,CharacterCoopJump:JumpStart+15e)

label(code)
label(return)

newmem:

