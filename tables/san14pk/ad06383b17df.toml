id = "instant-mission"
name = "Instant Mission"
category = "game"
description = ""
hint = ""
type = "script"
source = """
{
Author\t: Raynard
Date\t: 2023-05-21
Version\t: 1.0.10.49499
}

[ENABLE]
aobscanmodule(Mission,$process,0FBF??8D????0FBE????8D????0FBE????446B)
alloc(al_Mission,$128,Mission)
alloc(mem_Mission,6)
label(re_Mission)
registersymbol(Mission mem_Mission)

mem_Mission:
  readmem(Mission,6)

al_Mission:
  movzx eax,word ptr [rcx]
  cmp eax,#180
  jb @f
  cmp eax,#400
  ja @f
  movzx eax,byte ptr [rcx+02]
  cmp eax,0
  je @f
  cmp eax,#12
  ja @f
  movzx eax,byte ptr [rcx+03]
  cmp eax,0
  je @f
  cmp eax,#30
  ja @f
  mov rax,[Time_Pointer]
  mov eax,[rax]
  mov [rcx],eax
  readmem(Mission,6)
  jmp re_Mission

@@:
  readmem(Mission,6)
  jmp re_Mission

Mission:
  jmp al_Mission
  nop
re_Mission:

[DISABLE]
Mission:
  readmem(mem_Mission,6)

