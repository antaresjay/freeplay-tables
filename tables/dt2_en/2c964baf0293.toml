[[cheat]]
id = "character-selection-script"
name = "Character Selection Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Original Author : cybertron, for Dungeon Travelers 2
  Date   : 2023-06-09
  Author : cybertron

  Adapted for Dungeon Travelers (1) : To Heart 2 In Another World
  Program: DT1.exe
  Date   : 2025-03-13
  Author : Cantra
}

[ENABLE]

aobscanmodule(charPtrAOB,DT1.exe,46 04 8B 42 04 89 41 04) // should be unique
aobscanmodule(charAddSkillPtrAOB,DT1.exe,8B 81 1C 01 00 00) // should be unique code2 & return2
alloc(newmem,$1000)

label(code2)
label(return2)

label(char)
label(code)
label(return)

newmem:
char:
  dd 0

code2:
  mov [char],ecx
  mov eax,[ecx+0000011C]
  jmp return2

code:
  mov [char],edx
  mov eax,[edx+04]
  mov [ecx+04],eax
  jmp return

charPtrAOB+02:
  jmp code
  nop
return:

charAddSkillPtrAOB:
  jmp code2
  nop
return2:

registersymbol(charPtrAOB)
registersymbol(char)
registersymbol(charAddSkillPtrAOB)

[DISABLE]

charPtrAOB+02:
  db 8B 42 04 89 41 04

charAddSkillPtrAOB:
  db 8B 81 1C 01 00 00

unregistersymbol(char)
unregistersymbol(charPtrAOB)
unregistersymbol(charAddSkillPtrAOB)
dealloc(newmem)

