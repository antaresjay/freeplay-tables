[[cheat]]
id = "hp"
name = "hp"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(hp,Obscure.exe,D9 56 54 D8 1D 68 13 5D 00) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  fld dword ptr [esi+50]
  fst dword ptr [esi+54]
  fcomp dword ptr [Obscure.exe+1D1368]
  jmp return

hp:
  jmp newmem
  nop 4
return:
registersymbol(hp)

[DISABLE]

hp:
  db D9 56 54 D8 1D 68 13 5D 00

unregistersymbol(hp)
dealloc(newmem)"""

