[[cheat]]
id = "coin-manager-ctrl-numpad-1-enter-perk-shop-to-populate-values"
name = "Coin Manager (Ctrl + Numpad 1) {Enter 'Perk Shop' to populate values}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : ContraOG.exe
// Author            : ndck76
// Executable Version: 2021.3.29.19821
// Game Version      : Build.13626439
// Script Date       : 2024-03-13


[ENABLE]

aobscanmodule(coins,GameAssembly.dll,8Bxxxx33xxE8xxxxxxxx4885xx74xx4Cxxxx488Bxx488Bxx4Dxxxxxxxxxxxx4883xxxx5B49FFxxxxxxxxxxE8xxxxxxxxxxxxxx4533) //Galuga.UI.PerkStoreUIView.UpdateCoinsLabel
alloc(newmem,$1000,coins)
alloc(data2,8)
alloc(coinsbkp,5)
registersymbol(data2)
registersymbol(coins)
registersymbol(coinsbkp)
label(code)
label(return)

coinsbkp:
  readmem(coins,5)

newmem:
  mov [data2],rax

code:
  readmem(coins,5)
  jmp return

coins:
  jmp newmem
return:

[DISABLE]

coins:
  readmem(coinsbkp,5)

unregistersymbol(*)
dealloc(*)"""

