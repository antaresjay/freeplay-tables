[[cheat]]
id = "stopwatch-will-revert-to-00-00-00-after-25-seconds"
name = "Stopwatch will revert to 00:00:00 after 25 seconds"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)

aobscan(timehackpointAOB,8B 81 24 01 00 00 8B 48 14 6A 01)
registersymbol(timehackpointAOB)

newmem:
cmp eax,#1500     // = 25 seconds * 60
jle @f

xor eax,eax
mov [esi+14],eax

@@:
mov eax,[ecx+00000124]
jmp returnhere

//"trials_fusion.exe"+26A710:
timehackpointAOB:
jmp newmem
nop
returnhere:

[DISABLE]
//"trials_fusion.exe"+26A710:
timehackpointAOB:
mov eax,[ecx+00000124]
//Alt: db 8B 81 24 01 00 00

unregistersymbol(timehackpointAOB)

dealloc(newmem)"""

[[cheat]]
id = "fail-counter-always-zero"
name = "Fail Counter Always Zero"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)

aobscan(codeAOB,C2 04 00 8D 88 04 08 00 00 E8 xx xx xx xx 5E 5D C2 04 00)
registersymbol(codeAOB)

newmem:
// we just overwrite previous call result
xor eax,eax // patch fail counter value to zero
pop esi
pop ebp
ret 0004


//"trials_fusion.exe"+4C73B:
codeAOB+E:
jmp newmem

[DISABLE]
//"trials_fusion.exe"+4C73B:
codeAOB+E:
db 5E 5D C2 04 00

dealloc(newmem)

unregistersymbol(codeAOB)"""
