source = """
[ENABLE]

aobscanregion(animeanime, Pankapu:Player:get_CurrentActionPoints+0, Pankapu:Player:get_CurrentActionPoints+17, 39 09 8B 40 18 C9)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  fild dword ptr [ecx+28]
  fistp dword ptr [ecx+18]

code:
  cmp [ecx],ecx
  mov eax,[eax+18]
  jmp return

animeanime:
