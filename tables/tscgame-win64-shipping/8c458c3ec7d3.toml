[[cheat]]
id = "infinite-sanity"
name = "Infinite Sanity"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(sanity,TSCGame-Win64-Shipping.exe,F3 0F 10 87 C8 00 00 00 F3) // should be unique
alloc(newmem,$1000,"TSCGame-Win64-Shipping.exe"+53B3B0)

label(code)
label(return)

newmem:
  fld [rdi+C4]
  fstp [rdi+C8]
code:
  movss xmm0,[rdi+000000C8]
  jmp return

sanity:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(sanity)

[DISABLE]

sanity:
  db F3 0F 10 87 C8 00 00 00

unregistersymbol(sanity)
dealloc(newmem)"""

