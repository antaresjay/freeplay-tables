source = """
{ Game   : AfterLongNight.exe
  Date   : 2025-09-21
  Author : Sianz
}

[ENABLE]

aobscanregion(unithp,BloodBar:Execute+150,BloodBar:Execute+197,F3 41 0F 10 87 ?? ?? 00 00 F3 0F 5A C0 66) // should be unique
alloc(newmem,$1000,unithp)

label(code)
label(return)

newmem:
  movss xmm0,[r15+000002CC]
  movss [r15+0000035C],xmm0
code:
  movss xmm0,[r15+0000035C]
  jmp return

unithp:
  jmp newmem
  nop 4
return:
registersymbol(unithp)

[DISABLE]

unithp:
  db F3 41 0F 10 87 5C 03 00 00

unregistersymbol(unithp)
dealloc(newmem)"""

