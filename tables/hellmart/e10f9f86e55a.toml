[[cheat]]
id = "day-night-manager-ctrl-numpad-2"
name = "Day Night Manager (Ctrl + Numpad 2)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Hellmart.exe
// Author            : ndck76
// Executable Version: 6000.0.59.10268
// Game Version      : Build.21880672
// Script Date       : 2026-02-22


[ENABLE]

aobscanregion(daytime,DayNightManager:Update,DayNightManager:Update+100,F30F1086xxxx0000F3xxxxxxF2xxxxxxF3xxxxxxxxF3xxxxxxxxF3xxxxxxF3xxxxxxxxxxxxxxF3xxxxxx66xxxxxx7Axx) //DayNightManager:Update+2b
alloc(newmem,$1000,daytime)
alloc(data2,8)
alloc(daytimebkp,8)
registersymbol(data2)
registersymbol(daytime)
registersymbol(daytimebkp)
label(code)
label(return)

daytimebkp:
  readmem(daytime,8)

newmem:
  mov [data2],rsi

code:
  readmem(daytime,8)
  jmp return

daytime:
  jmp newmem
  nop 3
return:

[DISABLE]

daytime:
  readmem(daytimebkp,8)

unregistersymbol(*)
dealloc(*)"""

