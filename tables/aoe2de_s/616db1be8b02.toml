[[cheat]]
id = "freeze-population-make-sure-you-have-at-least-2-of-space-like-10-12"
name = "Freeze population(Make sure you have at least 2 of space like 10/12)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : AoE2DE_s.exe
  Version: 201.101.27323.0 4078370
  Date   : 2019-08-11
  Author : rakion99

  This script Freeze population so you can create any amount of people without limit
  Make sure you have at least 2 of space like 10/12
}

[ENABLE]

aobscanmodule(people1,AoE2DE_s.exe,F3 42 0F 11 04 80 66)

people1:
nop
nop
nop
nop
nop
nop

registersymbol(people1)

[DISABLE]

people1:
  db F3 42 0F 11 04 80

unregistersymbol(people1)"""

