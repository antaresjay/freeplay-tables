source = """
[ENABLE]

aobscanmodule(moneyAOB,$process,48 8B 81 80 02 00 00 45 33 C9 48 8B 89 78 02 00 00) // should be unique
alloc(newmem,$1000,moneyAOB)

label(code)
label(return)

newmem:
  mov [rcx+14],#100000000
code:
  add r9d,[rcx+14]
  add rcx,60
  jmp return

moneyAOB+60:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(moneyAOB)

[DISABLE]

moneyAOB+60:
  db 44 03 49 14 48 83 C1 60

unregistersymbol(moneyAOB)
dealloc(newmem)"""
