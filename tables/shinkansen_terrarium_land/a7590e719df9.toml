[[cheat]]
id = "windowsgamemain-base-address-scan-initialization-activate-this-first"
name = "WindowsGameMain Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(WindowsGameMain_basepointer)
registersymbol(WindowsGameMain_update_enable)
registersymbol(WindowsGameMain_set_enable)
registersymbol(WindowsGameMain_healthset_enable)
registersymbol(WindowsGameMain_energyset_enable)
registersymbol(WindowsGameMain_mobilityset_enable)

alloc(WindowsGameMain_basepointer, 8)
alloc(WindowsGameMain_update_enable, 4)
alloc(WindowsGameMain_set_enable, 4)
alloc(WindowsGameMain_healthset_enable, 4)
alloc(WindowsGameMain_energyset_enable, 4)
alloc(WindowsGameMain_mobilityset_enable, 4)


[DISABLE]
unregistersymbol(WindowsGameMain_basepointer)
unregistersymbol(WindowsGameMain_update_enable)
unregistersymbol(WindowsGameMain_set_enable)
unregistersymbol(WindowsGameMain_healthset_enable)
unregistersymbol(WindowsGameMain_energyset_enable)
unregistersymbol(WindowsGameMain_mobilityset_enable)

dealloc(WindowsGameMain_basepointer)
dealloc(WindowsGameMain_update_enable)
dealloc(WindowsGameMain_set_enable)
dealloc(WindowsGameMain_healthset_enable)
dealloc(WindowsGameMain_energyset_enable)
dealloc(WindowsGameMain_mobilityset_enable)"""

[[cheat]]
id = "windowsgamemain-base-address-scan-to-activate-play-level-to-update-play-level"
name = "WindowsGameMain Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(WindowsGameMain_savedAOB)
label(WindowsGameMain_returnhere)
label(WindowsGameMain_originalcode)
label(WindowsGameMain_exit)

label(WindowsGameMain_update_exit)
label(WindowsGameMain_set_exit)
label(WindowsGameMain_healthset_exit)
label(WindowsGameMain_energyset_exit)
label(WindowsGameMain_mobilityset_exit)

registersymbol(WindowsGameMain_savedAOB)

//0D04F16A - 48 8B F9              - mov rdi,rcx
//0D04F16D - 48 8B F2              - mov rsi,rdx
// MUI:WindowsGameMain:SetUpdateStatus+18
//0D04F170 - 48 63 46 5C           - movsxd  rax,dword ptr [rsi+5C]
//0D04F174 - F2 0F2A C0            - cvtsi2sd xmm0,eax
//0D04F178 - 48 63 46 58           - movsxd  rax,dword ptr [rsi+58]
//0D04F17C - F2 0F2A C8            - cvtsi2sd xmm1,eax
//0D04F180 - F2 0F5E C1            - divsd xmm0,xmm1
aobscan(WindowsGameMain_searchedAOB, 48 63 46 5C F2 0F 2A C0 48 63 46 58)

alloc(WindowsGameMain_newmem, 2048, WindowsGameMain_searchedAOB)
alloc(WindowsGameMain_temp1, 8, WindowsGameMain_searchedAOB)


WindowsGameMain_newmem:
mov [WindowsGameMain_temp1], rbx

cmp dword ptr [WindowsGameMain_update_enable], #0
je WindowsGameMain_update_exit
mov [WindowsGameMain_basepointer], rsi
WindowsGameMain_update_exit:

cmp dword ptr [WindowsGameMain_set_enable], #0
je WindowsGameMain_set_exit
WindowsGameMain_set_exit:

cmp dword ptr [WindowsGameMain_healthset_enable], #0
je WindowsGameMain_healthset_exit
mov ebx, [rsi+58]
mov [rsi+5c], ebx
WindowsGameMain_healthset_exit:

cmp dword ptr [WindowsGameMain_energyset_enable], #0
je WindowsGameMain_energyset_exit
fild [rsi+d4]
fstp [rsi+e8]
WindowsGameMain_energyset_exit:

cmp dword ptr [WindowsGameMain_mobilityset_enable], #0
je WindowsGameMain_mobilityset_exit
cmp qword ptr [rsi+80], #0
je WindowsGameMain_mobilityset_exit
cmp dword ptr [rsi+80], #0
je WindowsGameMain_mobilityset_exit
mov rbx, [rsi+80]
cmp qword ptr [rbx+48], #0
je WindowsGameMain_mobilityset_exit
cmp dword ptr [rbx+48], #0
je WindowsGameMain_mobilityset_exit
mov rbx, [rbx+48]
mov [rbx+d4], (float)12
mov [rbx+ec], (float)10
WindowsGameMain_mobilityset_exit:

mov rbx, [WindowsGameMain_temp1]


WindowsGameMain_originalcode:
db 48 63 46 5C F2 0F 2A C0
//movsxd  rax,dword ptr [rsi+5C]
//cvtsi2sd xmm0,eax


WindowsGameMain_exit:
jmp WindowsGameMain_returnhere


WindowsGameMain_searchedAOB:
WindowsGameMain_savedAOB:
jmp WindowsGameMain_newmem
nop
nop
nop
WindowsGameMain_returnhere:


[DISABLE]
WindowsGameMain_savedAOB:
db 48 63 46 5C F2 0F 2A C0
//movsxd  rax,dword ptr [rsi+5C]
//cvtsi2sd xmm0,eax

unregistersymbol(WindowsGameMain_savedAOB)

dealloc(WindowsGameMain_newmem)
dealloc(WindowsGameMain_temp1)"""

