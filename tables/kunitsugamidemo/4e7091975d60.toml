[[cheat]]
id = "on-health-decrease"
name = "On Health Decrease ()->"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{
  Game\t : KunitsuGamiDemo.exe
  Version: 1.0
  Date\t : 05-07-2024
  Author : Leunsel

  Address of signature = KunitsuGamiDemo.exe + 0x01E14A1A
  "44 2B ? 45 85 ? 45 0F"
  ---> KunitsuGamiDemo.exe+1E14A1A - 44 2B C8 - sub r9d,eax
  ---> KunitsuGamiDemo.exe+1E14A1D - 45 85 C9 - test r9d,r9d
}

[ENABLE]
aobScanModule(HealthDecHook,KunitsuGamiDemo.exe,44 2B ? 45 85 ? 45 0F)
alloc(newmem,$1000,HealthDecHook)

label(return code)
label(Player Yoshiro Entity)

newmem:
  push rdi
  mov rdi,CharacterContext
  mov rdi,[rdi]
  test rdi,rdi
  je code
    mov rdi,[rdi+88]
    test rdi,rdi
    je code
      mov rdi,[rdi+B0]
      test rdi,rdi
      jz code
        cmp rdx,rdi
        je Player
          mov rdi,CharacterContext+8
          mov rdi,[rdi]
          test rdi,rdi
          je code
            mov rdi,[rdi+88]
            test rdi,rdi
            je code
              mov rdi,[rdi+B0]
              test rdi,rdi
              jz code
                cmp rdx,rdi
                je Yoshiro
                jmp Entity

Player:
  mov [HealthDec],rdx
  cmp byte ptr [HealthDecFlag],0 // Disabled
  je code
  cmp byte ptr [HealthDecFlag],1 // No Damage
  jne @f
    xor eax,eax
    jmp code
  @@:
  cmp byte ptr [HealthDecFlag],2 // Decrease Multiplier
  jne @f
    cvtsi2ss xmm10,eax
    mulss xmm10,[HealthDecMultiplier]
    cvtss2si eax,xmm10
\tjmp code
  @@:
  mov byte ptr [HealthDecFlag],0
  jmp code
Yoshiro:
  mov [HealthDec+10],rdx
  cmp byte ptr [HealthDecFlag+2],0 // Disabled
  je code
  cmp byte ptr [HealthDecFlag+2],1 // No Damage
  jne @f
    xor eax,eax
    jmp code
  @@:
  cmp byte ptr [HealthDecFlag+2],2 // Decrease Multiplier
  jne @f
    cvtsi2ss xmm10,eax
    mulss xmm10,[HealthDecMultiplier+8]
    cvtss2si eax,xmm10
\tjmp code
  @@:
  mov byte ptr [HealthDecFlag+2],0
  jmp code
Entity:
  mov [HealthDec+8],rdx
  cmp byte ptr [HealthDecFlag+1],0 // Disabled
  je code
  cmp byte ptr [HealthDecFlag+1],1 // One Hit Kill
  jne @f
    mov eax,r9d
    jmp code
  @@:
  cmp byte ptr [HealthDecFlag+1],2 // Decrease Multiplier
  jne @f
    cvtsi2ss xmm10,eax
    mulss xmm10,[HealthDecMultiplier+4]
    cvtss2si eax,xmm10
\tjmp code
  @@:
  mov byte ptr [HealthDecFlag+1],0
  jmp code

code:
  pop rdi
  sub r9d,eax
  test r9d,r9d
  jmp return

HealthDec:
 dq 0
 dq 0
 dq 0
HealthDecFlag:
 db 2
 db 2
 db 2
HealthDecMultiplier:
 dd (float)0.25
 dd (float)3.00
 dd (float)0.25

HealthDecHook:
  jmp newmem
  nop
return:
registersymbol(HealthDecHook HealthDec HealthDecFlag HealthDecMultiplier)

[DISABLE]

HealthDecHook:
  db 44 2B C8 45 85 C9

unregisterSymbol(*)
dealloc(*)"""

