[[cheat]]
id = "on-required-hold-time-increase"
name = "On Required Hold Time Increase ()->"
category = "game"
description = ""
hint = ""
type = "script"
source = """
{
  Game\t : KunitsuGamiDemo.exe
  Version: 1.0
  Date\t : 05-07-2024
  Author : Leunsel

  Address of signature = KunitsuGamiDemo.exe + 0x0047B49C
  "F2 0F ? ? 66 0F ? ? F3 0F ? ? ? ? ? ? 48 8B ? ? F3 0F ? ? ? ? ? ? 48 8B ? ? ? ? ? 48 85 ? 74 ? 48 8B ? ? 48 8B ? F3 0F ? ? ? ? ? ? F3 0F ? ? ? ? ? ? E8 ? ? ? ? 44 8B ? ? ? ? ? 48 8B ? 48 8B ? ? ? ? ? E8 ? ? ? ? E9"
  ---> KunitsuGamiDemo.exe+47B49C - F2 0F 58 D6 - addsd xmm2,xmm6
  ---> KunitsuGamiDemo.exe+47B4A0 - 66 0F 5A C2 - cvtpd2ps xmm0,xmm2
}

[ENABLE]
aobScanModule(CurrentRequireHoldSecondsHook,KunitsuGamiDemo.exe,F2 0F ? ? 66 0F ? ? F3 0F ? ? ? ? ? ? 48 8B ? ? F3 0F ? ? ? ? ? ? 48 8B ? ? ? ? ? 48 85 ? 74 ? 48 8B ? ? 48 8B ? F3 0F ? ? ? ? ? ? F3 0F ? ? ? ? ? ? E8 ? ? ? ? 44 8B ? ? ? ? ? 48 8B ? 48 8B ? ? ? ? ? E8 ? ? ? ? E9)
alloc(newmem,$1000,CurrentRequireHoldSecondsHook)

label(return)
label(code)

newmem:
  mov [CurrentRequireHoldSeconds],rax
  cmp byte ptr [CurrentRequireHoldSecondsFlag],0 // Disabled
  je code
  cmp byte ptr [CurrentRequireHoldSecondsFlag],1 // Instantly Finish Purge Timer
  jne @f
    movsd xmm0,[rax+000004E8]
    cvtpd2ps xmm0,xmm2
    jmp return
  @@:
  cmp byte ptr [CurrentRequireHoldSecondsFlag],2 // Increase Multiplier
  jne @f
    mulsd xmm2,[CurrentRequireHoldSecondsMultiplier]
\tjmp code
  @@:
  mov byte ptr [CurrentRequireHoldSecondsFlag],0
code:
  addsd xmm2,xmm6
  cvtpd2ps xmm0,xmm2
  jmp return

CurrentRequireHoldSeconds:
 dq 0
CurrentRequireHoldSecondsFlag:
 db 2
CurrentRequireHoldSecondsMultiplier:
 dq (double)3

CurrentRequireHoldSecondsHook:
  jmp newmem
  nop 3
return:
registersymbol(CurrentRequireHoldSecondsHook CurrentRequireHoldSeconds CurrentRequireHoldSecondsFlag CurrentRequireHoldSecondsMultiplier)

[DISABLE]

CurrentRequireHoldSecondsHook:
  db F2 0F 58 D6 66 0F 5A C2

unregisterSymbol(*)
dealloc(*)"""

