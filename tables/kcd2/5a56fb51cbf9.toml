[[cheat]]
id = "infinite-stamina"
name = "Infinite Stamina"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(stamina,WHGame.DLL,F3 0F 10 87 EC 06 00 00 4C)
alloc(newmem,$1000,stamina)
label(code return)

newmem:

code:
mov [rdi+6EC],(float)300
movss xmm0,[rdi+000006EC]
jmp return

stamina:
  jmp newmem
  nop 3
return:
registersymbol(stamina)

[DISABLE]

stamina:
  db F3 0F 10 87 EC 06 00 00

unregistersymbol(*)
dealloc(*)"""
