[[cheat]]
id = "x-selected-hero"
name = "[X} <=============== Selected Hero ================="
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//=========================================
[ENABLE]
//=========================================
// AOBScans
aobscanmodule(aob_heroC,EoCApp.exe,85 C0 74 19 EB 06 8D 9B 00 00 00 00 8D 90 00 01 00 00 8B F8)

// Memory Allocation
alloc(func_heroIDtoPointer,1024,EoCApp.exe)
alloc(mem_heroM,512,EoCApp.exe)

// Symbols and Labels
label(p_heroC)
registersymbol(p_heroC)

label(p_movspdH)
registersymbol(p_movspdH)

label(_heroC)
registersymbol(_heroC)

label(return_heroC)
label(prereturn_heroC)
label(check1_heroC)
label(check2_heroC)
label(success_heroC)
registersymbol(success_heroC)

func_heroIDtoPointer:
mov [esp+14],00000000 //oC

push esi
mov esi,[esp+04]
mov ecx,esi
shr ecx,10
movzx eax,cx
shl eax,10
movzx edx,si
or eax,edx
xor edx,edx
div [edi]
mov eax,[edi+04]
mov edx,[eax+edx*4]
test edx,edx
je prereturn_heroC
check1_heroC:
mov eax,[edx+04]
cmp si,ax
jne check2_heroC
shr eax,10
cmp cx,ax
je success_heroC
check2_heroC:
mov edx,[edx]
test edx,edx
jne check1_heroC
jmp prereturn_heroC


success_heroC:
mov [p_heroC],edx

nop
nop
nop
nop
nop

mov edx,[edx+20]
mov edx,[edx+60]
mov [p_movspdH],edx

prereturn_heroC:
pop esi
jmp return_heroC



//=========================================
// Variables
//=========================================
p_heroC:
dd 0
p_movspdH:
dd 0

//=========================================
// Injection
//=========================================

 aob_heroC-1c:
 _heroC:
 jmp func_heroIDtoPointer
 nop
 nop
 nop
 return_heroC:



//=========================================
[DISABLE]
//=========================================

//Restore Code
_heroC:
db C7 44 24 14 00 00 00 00


// Unregistering Symbols
unregistersymbol(_heroC)
unregistersymbol(p_heroC)
unregistersymbol(p_movspdH)

// Deallocate Memory
dealloc(func_heroIDtoPointer)

dealloc(func_addSkill)
unregistersymbol(func_addSkill)"""

