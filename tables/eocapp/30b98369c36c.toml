type = "script"
source = """
[ENABLE]
aobscanmodule(hero,EoCApp.exe,66 0F 1F * * * * * * 49 8B 87 * * * * 48 8B 1C F8 48 8B CB)
alloc(newmem,$1000,hero)

label(code)
label(return)
label(hero_ptr)

newmem:

code:
  mov rbx,[rax+rdi*8]
  mov rcx,hero_ptr
  mov [rcx+rdi*8],rbx
  mov rcx,rbx
  jmp return

hero_ptr:
  dq 0
  dq 0
  dq 0
  dq 0

hero+10:
  jmp code
  nop
  nop
return:
registersymbol(hero)
registersymbol(hero_ptr)

[DISABLE]
hero+10:
  db 48 8B 1C F8 48 8B CB
unregistersymbol(hero)
unregistersymbol(hero_ptr)
dealloc(newmem)

