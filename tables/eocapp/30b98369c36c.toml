[[cheat]]
id = "damage-modifier-god-mode-herodamagemultiplier-enemydamagemultiplier-don-t-use-with-unlimited-health-option-below"
name = "Damage Modifier (God Mode, HeroDamageMultiplier, EnemyDamageMultiplier) (Don't Use With Unlimited Health Option Below)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(DamageModAOB,EoCApp.exe,49 8B CF 41 2B D4 E8 * * * * 41)
alloc(newmem,2048,DamageModAOB)
registersymbol(DamageModAOB)

label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fEnemyHealingMult)
registersymbol(fEnemyHealingMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(fHeroHealingMult)
registersymbol(fHeroHealingMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

newmem:
  mov rcx,[r15+C0]
  cmp [rcx+190],0
  mov rcx,r12
  je EnemyHit
HeroHit:
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  push ecx
  fild dword ptr [rsp]
  fmul dword ptr [fHeroDamageMult]
  fistp dword ptr [rsp]
  pop ecx
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor ecx,ecx
  jmp CleanUp
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne CleanUp
  cmp ecx,edx
  jl @F
  xor ecx,ecx
@@:
  jmp CleanUp  
EnemyHit:
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckOneHitKill
  push ecx
  fild dword ptr [rsp]
  fmul dword ptr [fEnemyDamageMult]
  fistp dword ptr [rsp]
  pop ecx
CheckOneHitKill:
  cmp [OneHitKill],1
  jne CleanUp
  mov ecx,#999
  jmp CleanUp

CleanUp:  
  mov r12d,ecx
  mov rcx,r15
  sub edx,r12d
  jmp return

GodMode:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)2.0
fEnemyHealingMult:
dq (float)0.0
fHeroDamageMult:
dq (float)0.25
fHeroHealingMult:
dq (float)2.0
HeroCannotDie:
dq 1

DamageModAOB:
  jmp newmem
  nop
return:

[DISABLE]

DamageModAOB:
  db 49 8B CF 41 2B D4

unregistersymbol(DamageModAOB)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fEnemyHealingMult)
unregistersymbol(fHeroDamageMult)
unregistersymbol(fHeroHealingMult)

dealloc(newmem)

