[[cheat]]
id = "zero-ability-cooldown"
name = "Zero Ability CoolDown"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(ability_cooldown,EoCApp.exe,F3 0F 11 46 38 72)
alloc(newmem,$1000,"EoCApp.exe"+4460B3)

label(code)
label(return)

newmem:
code:
  xorps xmm0, xmm0
  movss [rsi+38], xmm0
  jmp return

ability_cooldown:
  jmp newmem
return:
registersymbol(ability_cooldown)

[DISABLE]

ability_cooldown:
  db F3 0F 11 46 38

unregistersymbol(ability_cooldown)
dealloc(newmem)"""

