[[cheat]]
id = "aientity-base-address-scan-initialization-activate-this-first"
name = "AIEntity Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(AIEntity_basepointer)
registersymbol(AIEntity_update_enable)
registersymbol(AIEntity_set_enable)
registersymbol(AIEntity_healthset_enable)
registersymbol(AIEntity_energyset_enable)
registersymbol(AIEntity_invulnerableset_enable)
registersymbol(AIEntity_statsset_enable)
registersymbol(AIEntity_enemyset_enable)

alloc(AIEntity_basepointer, 4)
alloc(AIEntity_update_enable, 4)
alloc(AIEntity_set_enable, 4)
alloc(AIEntity_healthset_enable, 4)
alloc(AIEntity_energyset_enable, 4)
alloc(AIEntity_invulnerableset_enable, 4)
alloc(AIEntity_statsset_enable, 4)
alloc(AIEntity_enemyset_enable, 4)


[DISABLE]
unregistersymbol(AIEntity_basepointer)
unregistersymbol(AIEntity_update_enable)
unregistersymbol(AIEntity_set_enable)
unregistersymbol(AIEntity_healthset_enable)
unregistersymbol(AIEntity_energyset_enable)
unregistersymbol(AIEntity_invulnerableset_enable)
unregistersymbol(AIEntity_statsset_enable)
unregistersymbol(AIEntity_enemyset_enable)

dealloc(AIEntity_basepointer)
dealloc(AIEntity_update_enable)
dealloc(AIEntity_set_enable)
dealloc(AIEntity_healthset_enable)
dealloc(AIEntity_energyset_enable)
dealloc(AIEntity_invulnerableset_enable)
dealloc(AIEntity_statsset_enable)
dealloc(AIEntity_enemyset_enable)"""

[[cheat]]
id = "aientity-base-address-scan-to-activate-play-level-to-update-play-level"
name = "AIEntity Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(AIEntity_savedAOB)
label(AIEntity_returnhere)
label(AIEntity_originalcode)
label(AIEntity_exit)

label(AIEntity_update_exit)
label(AIEntity_set_exit)
label(AIEntity_healthset_exit)
label(AIEntity_energyset_exit)
label(AIEntity_invulnerableset_exit)
label(AIEntity_statsset_exit)
label(AIEntity_enemyset_exit)

registersymbol(AIEntity_savedAOB)

//93F87D43 - E8 601C0000           - call 93F899A8
//93F87D48 - 83 C4 10              - add esp,10
// AIEntity:Update+c3
//93F87D4B - D9 87 48020000        - fld dword ptr [edi+00000248]
//93F87D51 - D9EE                  - fldz
//93F87D53 - DFF1                  - fcomip st(0),st(1)
//93F87D55 - DDD8                  - fstp st(0)
//93F87D57 - 0F8A 49000000         - jp 93F87DA6
aobscan(AIEntity_searchedAOB, D9 87 48 02 00 00 D9 EE DF F1)

alloc(AIEntity_newmem, 2048)
alloc(AIEntity_temp1, 4)


AIEntity_newmem:
mov [AIEntity_temp1], ebx

// Is Controllable
cmp dword ptr [edi+6c], #0
je AIEntity_enemyset_exit
mov ebx, [edi+6c]
cmp byte ptr [ebx+52], #1
jne AIEntity_enemyset_exit

cmp dword ptr [AIEntity_update_enable], #0
je AIEntity_update_exit
// Is Selected
cmp byte ptr [edi+255], #1
jne AIEntity_update_exit
mov [AIEntity_basepointer], edi
AIEntity_update_exit:

cmp dword ptr [AIEntity_set_enable], #0
je AIEntity_set_exit
AIEntity_set_exit:

cmp dword ptr [AIEntity_healthset_enable], #0
je AIEntity_healthset_exit
cmp dword ptr [edi+4c], #0
je AIEntity_healthset_exit
mov ebx, [edi+4c]
fld [ebx+78]
fstp [ebx+7c]
fld [ebx+88]
fstp [ebx+6c]
fld [ebx+84]
fstp [ebx+8c]
AIEntity_healthset_exit:

cmp dword ptr [AIEntity_energyset_enable], #0
je AIEntity_energyset_exit
cmp dword ptr [edi+54], #0
je AIEntity_energyset_exit
mov ebx, [edi+54]
fld [ebx+30]
fstp [ebx+18]
AIEntity_energyset_exit:

cmp dword ptr [AIEntity_invulnerableset_enable], #0
je AIEntity_invulnerableset_exit
mov bl, byte ptr [edi+250]
or bl, #2
mov byte ptr [edi+250], bl
cmp dword ptr [edi+54], #0
je AIEntity_invulnerableset_exit
mov ebx, [edi+54]
mov byte ptr [ebx+20], #1
AIEntity_invulnerableset_exit:

cmp dword ptr [AIEntity_statsset_enable], #0
je AIEntity_statsset_exit
cmp dword ptr [edi+24], #0
je AIEntity_statsset_exit
mov ebx, [edi+24]
mov [ebx+18], (float)9999
mov [ebx+1c], (float)9999
mov [ebx+20], (float)9999
mov [ebx+24], (float)9999
mov [ebx+28], (float)9999
mov [ebx+2c], (float)9999
mov [ebx+30], (float)9999
AIEntity_statsset_exit:

// The same AIWorld referenced by all AIEntity
cmp dword ptr [AIEntity_enemyset_enable], #0
je AIEntity_enemyset_exit
cmp dword ptr [edi+30], #0
je AIEntity_enemyset_exit
mov ebx, [edi+30]
mov [ebx+110], (float)0
mov [ebx+114], (float)0
mov [ebx+118], (float)0
AIEntity_enemyset_exit:

mov ebx, [AIEntity_temp1]


AIEntity_originalcode:
db D9 87 48 02 00 00
//fld dword ptr [edi+00000248]


AIEntity_exit:
jmp AIEntity_returnhere


AIEntity_searchedAOB:
AIEntity_savedAOB:
jmp AIEntity_newmem
nop
AIEntity_returnhere:


[DISABLE]
AIEntity_savedAOB:
db D9 87 48 02 00 00
//fld dword ptr [edi+00000248]

unregistersymbol(AIEntity_savedAOB)

dealloc(AIEntity_newmem)
dealloc(AIEntity_temp1)"""

