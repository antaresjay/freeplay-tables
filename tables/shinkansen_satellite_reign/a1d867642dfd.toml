[[cheat]]
id = "skillmanager-base-address-scan-to-activate-play-level-to-update-play-level"
name = "SkillManager Base Address Scan ((To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(SkillManager_savedAOB)
label(SkillManager_returnhere)
label(SkillManager_originalcode)
label(SkillManager_exit)

label(SkillManager_update_exit)
label(SkillManager_set_exit)

registersymbol(SkillManager_savedAOB)

//752DF8F3 - 83 EC 08              - sub esp,08
//752DF8F6 - 8B 45 08              - mov eax,[ebp+08]
// SkillManager:Update+9
//752DF8F9 - 0FB6 40 61            - movzx eax,byte ptr [eax+61]
//752DF8FD - 85 C0                 - test eax,eax
//752DF8FF - 74 10                 - je 752DF911
//752DF901 - 83 EC 08              - sub esp,08
//752DF904 - 6A 00                 - push 00
//752DF906 - FF 75 08              - push [ebp+08]
aobscan(SkillManager_searchedAOB, 0F B6 40 61 85 C0 74 10 83 EC 08)

alloc(SkillManager_newmem, 2048)


SkillManager_newmem:
cmp dword ptr [SkillManager_update_enable], #0
je SkillManager_update_exit
mov [SkillManager_basepointer], eax
SkillManager_update_exit:

cmp dword ptr [SkillManager_set_enable], #0
je SkillManager_set_exit
SkillManager_set_exit:


SkillManager_originalcode:
db 0F B6 40 61 85 C0
//movzx eax,byte ptr [eax+61]
//test eax,eax


SkillManager_exit:
jmp SkillManager_returnhere


SkillManager_searchedAOB:
SkillManager_savedAOB:
jmp SkillManager_newmem
nop
SkillManager_returnhere:


[DISABLE]
SkillManager_savedAOB:
db 0F B6 40 61 85 C0
//movzx eax,byte ptr [eax+61]
//test eax,eax

unregistersymbol(SkillManager_savedAOB)

dealloc(SkillManager_newmem)"""

