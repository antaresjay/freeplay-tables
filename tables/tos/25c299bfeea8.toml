id = "zero-battle-time"
name = "Zero Battle Time"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(battletime,TOS.exe,01 9F E4 90 00 00) 
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  mov [edi+000090E4], 0
  jmp return

battletime:
  jmp newmem
  nop
return:
registersymbol(battletime)

[DISABLE]

battletime:
  db 01 9F E4 90 00 00

unregistersymbol(battletime)
dealloc(newmem)"""
