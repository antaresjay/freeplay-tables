[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
\t\t  
aobscanmodule(GaldReadInStatusAOB,ToS.exe,8B 08 8B 45 FC 51 56) // should be unique
registersymbol(GaldReadInStatusAOB)
alloc(newmem,2048,GaldReadInStatusAOB)

///
label(GaldPtr)
registersymbol(GaldPtr)
label(returnhere)
label(originalcode)
label(exit)

newmem:
  mov [GaldPtr],eax
  
originalcode:
  mov ecx,[eax]
  mov eax,[ebp-04]
  
exit:
  jmp returnhere

///
GaldPtr:
dq 0

GaldReadInStatusAOB:
  jmp newmem
  returnhere:
  
[DISABLE]

GaldReadInStatusAOB:
  db 8B 08 8B 45 FC

dealloc(newmem)
unregistersymbol(GaldReadInStatusAOB)
unregistersymbol(GaldPtr)"""

[[cheat]]
id = "damage-modifier-script"
name = "Damage Modifier Script"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(DamageModAOB,TOS.exe,01 58 24 8B 4E 08 83 79 24 00) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,2048,DamageModAOB)

label(originalcode)
label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(EnemyDamageMultiplier)
registersymbol(EnemyDamageMultiplier)
label(HeroDamageMultiplier)
registersymbol(HeroDamageMultiplier)
label(EnemyHealingMultiplier)
registersymbol(EnemyHealingMultiplier)
label(HeroHealingMultiplier)
registersymbol(HeroHealingMultiplier)
label(HeroCannotDie)
registersymbol(HeroCannotDie)


newmem:
  cmp byte ptr [eax+18],00
  jne EnemyHit
  cmp byte ptr [eax+04],00
  jne EnemyHit
HeroHit:
  cmp ebx,0
  jl HeroDamageHit
  jg HeroHealingHit
  jmp originalcode
HeroDamageHit:
  cmp [HeroDamageMultiplier],(float)0.0
  je CheckGodMode
  neg ebx
  push ebx
  fild dword ptr [esp]
  fmul dword ptr [HeroDamageMultiplier]
  fistp dword ptr [esp]
  pop ebx
  neg ebx
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor ebx,ebx
  jmp originalcode
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne originalcode
  push eax
  mov eax,[eax+24]
  neg ebx
  cmp ebx,eax
  jl @F
  xor ebx,ebx
@@:
  neg ebx
  pop eax
  jmp originalcode
HeroHealingHit:
  cmp [HeroHealingMultiplier],(float)0.0
  je originalcode
  push ebx
  fild dword ptr [esp]
  fmul dword ptr [HeroHealingMultiplier]
  fistp dword ptr [esp]
  pop ebx
  jmp originalcode
EnemyHit:
  cmp ebx,0
  jl EnemyDamageHit
  jg EnemyHealingHit
  jmp CheckOneHitKill
EnemyDamageHit:
  cmp [EnemyDamageMultiplier],(float)0.0
  je CheckOneHitKill
  neg ebx
  push ebx
  fild dword ptr [esp]
  fmul dword ptr [EnemyDamageMultiplier]
  fistp dword ptr [esp]
  pop ebx
  neg ebx
CheckOneHitKill:
  cmp [OneHitKill],1
  jne originalcode
  mov ebx,#99999
  neg ebx
  jmp originalcode
EnemyHealingHit:
  cmp [EnemyHealingMultiplier],(float)0.0
  je originalcode
  push ebx
  fild dword ptr [esp]
  fmul dword ptr [EnemyHealingMultiplier]
  fistp dword ptr [esp]
  pop ebx
    
originalcode:
  add [eax+24],ebx
  mov ecx,[esi+08]

  jmp return

GodMode:
dq 0
OneHitKill:
dq 0
EnemyDamageMultiplier:
dq (float)2.0
HeroDamageMultiplier:
dq (float)0.5
EnemyHealingMultiplier:
dq (float)0.0
HeroHealingMultiplier:
dq (float)2.0
HeroCannotDie:
dq 1

DamageModAOB:
  jmp newmem
  nop
return:

[DISABLE]

DamageModAOB:
  db 01 58 24 8B 4E 08

unregistersymbol(DamageModAOB)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(EnemyDamageMultiplier)
unregistersymbol(EnemyHealingMultiplier)
unregistersymbol(HeroDamageMultiplier)
unregistersymbol(HeroHealingMultiplier)
unregistersymbol(HeroCannotDie)
dealloc(newmem)"""

