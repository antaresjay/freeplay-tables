[[cheat]]
id = "weapon-no-overheat"
name = "Weapon No Overheat"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(aoboverheat,gotg.exe,48 8B 47 20 48 8D 4F 20 F3 0F 10 * * * * * F3 0F 5E * FF * * F3 0F 59) // should be unique
alloc(newmem,$1000,aoboverheat)
label(code)
label(return)
aobscanmodule(aoboffsetcheck,gotg.exe,F3 0F 11 * 54 8B * 1C 83 * 1F 3C * 73) // should be unique

newmem:
code:
  mov [rdi+54],(float)0
  mov rax,[rdi+20]
  lea rcx,[rdi+20]
  jmp return

aoboverheat:
  jmp newmem
  nop 3
return:
registersymbol(aoboverheat)

[DISABLE]

aoboverheat:
  db 48 8B 47 20 48 8D 4F 20

dealloc(newmem)"""

