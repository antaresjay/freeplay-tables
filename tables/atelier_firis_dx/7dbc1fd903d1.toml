[[cheat]]
id = "set-color-values"
name = "Set Color Values"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Atelier_Firis_DX.exe
  Author : Anon-9

  This script sets Dot values when crafting.
  Note that 1 dot is actually 2 points. So a value of 20 is 10 dots.
}

[ENABLE]

aobscanmodule(funSetDotValues,Atelier_Firis_DX.exe,8B 54 84 20 89 91 90 00 00 00) // should be unique
alloc(newmem,$1000,funSetDotValues)

label(mainCode)
label(return)
label(varRedValue varBlueValue varGreenValue varYellowValue varPurpleValue)
label(varDefaultValue)

newmem:

  //mov edx,[rsp+rax*4+20]
  //This section checks values by color and sets them.
  cmp rax,0
  jne @f
  mov edx,[varRedValue]
  jmp mainCode
  @@:
  cmp rax,1
  jne @f
  mov edx,[varBlueValue]
  jmp mainCode
  @@:
  cmp rax,2
  jne @f
  mov edx,[varGreenValue]
  jmp mainCode
  @@:
  cmp rax,3
  jne @f
  mov edx,[varYellowValue]
  jmp mainCode
  /* This section does not seem to be needed.
  @@:
  cmp rax,4
  jne @f
  mov edx,[varDefaultValue]
  jmp mainCode
  @@:
  /**/
  cmp rax,5
  jne @f
  mov edx,[varPurpleValue]
  jmp mainCode
  @@:
  mov edx,[varDefaultValue]
mainCode:
