type = "script"
source = """
[ENABLE]
aobscanmodule(aobfishingtime,ed8_2_PC_US.exe,8B 86 9C 01 00 00 0F BF * * 68 * * * * 8D * * 6A 20 * E8) // should be unique
alloc(newmem,$1000)
label(code)
label(return)

newmem:
code:
  mov eax,[esi+0000019C]
  mov word ptr [eax],#99
  jmp return

aobfishingtime:
  jmp newmem
  nop
return:
registersymbol(aobfishingtime)

[DISABLE]

aobfishingtime:
  db 8B 86 9C 01 00 00
dealloc(newmem)"""

