[[cheat]]
id = "always-critical-hit-allies"
name = "Always Critical Hit (Allies)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
{
This changes the critical hit rate for allies to 100%, this code executes every attack and looks up the item data critical hit rate
and puts the result in [ebp-00000098], [ebp+0C] is the target structure, [eax+40] of the item structure is critical hit rate
}

aobscanmodule(CriticalHitAOB,ed8_2_PC_US.exe,80 78 4F CE 75 79 8B 48 34 F3 0F 10 95 68 FF FF FF) // should be unique
alloc(newmem,1024,CriticalHitAOB)
registersymbol(CriticalHitAOB)

///
label(return)
label(originalcode)
label(EBXSave)
label(CriticalHitPct)

newmem:
  mov [EBXSave],ebx
  mov ebx,[ebp+0C]
  cmp dword ptr [ebx+F8],0
  mov ebx,[EBXSave]
  je originalcode
DoAlwaysCriticalHit:
  movss xmm2,[CriticalHitPct]
  movss [ebp-00000098],xmm2
  
originalcode:
  cmp byte ptr [eax+4F],-32
  jne CriticalHitAOB+7F
  jmp return

EBXSave:
dq 0
CriticalHitPct:
dq (float)100.0

CriticalHitAOB:
  jmp newmem
  nop
  return:
  
[DISABLE]

CriticalHitAOB:
  db 80 78 4F CE 75 79
  
unregistersymbol(CriticalHitAOB)
  
dealloc(newmem)"""

