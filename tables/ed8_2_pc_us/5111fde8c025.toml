[[cheat]]
id = "damage-modifier-script-god-mode-one-hit-kill-etc"
name = "Damage Modifier Script (God Mode, One Hit Kill, etc.)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

//aobscanmodule(DamageModAOB,ed8_2_PC_US.exe,8B 45 B8 2B C3 33 C9 85 C0) // should be unique
aobscanmodule(DamageModAOB,ed8_2_PC_US.exe,8B 4D B8 33 C0 2B CB 85 C9) // should be unique
registersymbol(DamageModAOB)
alloc(newmem,4096,DamageModAOB)

label(return)
label(GodMode)
registersymbol(GodMode)
label(OneHitKill)
registersymbol(OneHitKill)
label(fEnemyDamageMult)
registersymbol(fEnemyDamageMult)
label(fEnemyHealingMult)
registersymbol(fEnemyHealingMult)
label(fHeroDamageMult)
registersymbol(fHeroDamageMult)
label(fHeroHealingMult)
registersymbol(fHeroHealingMult)
label(HeroCannotDie)
registersymbol(HeroCannotDie)

newmem:
  mov ecx,[ebp-48]
  cmp dword ptr [esi+F8],0
  jne EnemyHit
HeroHit:
  cmp ebx,0
  jl HeroHealingHit
  jg HeroDamageHit
  jmp CleanUp
HeroDamageHit:
  cmp [fHeroDamageMult],(float)0.0
  je CheckGodMode
  push ebx
  fild dword ptr [rsp]
  fmul dword ptr [fHeroDamageMult]
  fistp dword ptr [rsp]
  pop ebx
CheckGodMode:
  cmp [GodMode],1
  jne CheckHeroCannotDie
  xor ebx,ebx
  jmp CleanUp
CheckHeroCannotDie:
  cmp [HeroCannotDie],1
  jne CleanUp
  cmp ebx,ecx
  jl @F
  xor ebx,ebx
@@:
  jmp CleanUp  
HeroHealingHit:
  cmp [fHeroHealingMult],(float)0.0
  je CleanUp
  neg ebx
  push ebx
  fild dword ptr [rsp]
  fmul dword ptr [fHeroHealingMult]
  fistp dword ptr [rsp]
  pop ebx
  neg ebx
  jmp CleanUp
EnemyHit:
  cmp ebx,0
  jl EnemyHealingHit
  jg EnemyDamageHit
  jmp CheckOneHitKill
EnemyDamageHit:
  cmp [fEnemyDamageMult],(float)0.0
  je CheckOneHitKill
  push ebx
  fild dword ptr [rsp]
  fmul dword ptr [fEnemyDamageMult]
  fistp dword ptr [rsp]
  pop ebx
CheckOneHitKill:
  cmp [OneHitKill],1
  jne CleanUp
  mov ebx,#49999
  jmp CleanUp
EnemyHealingHit:
  cmp [fEnemyHealingMult],(float)0.0
  je CleanUp
  neg ebx
  push ebx
  fild dword ptr [rsp]
  fmul dword ptr [fEnemyHealingMult]
  fistp dword ptr [rsp]
  pop ebx
  neg ebx

CleanUp:  
  mov [ebp+08],ebx
  xor eax,eax
  sub ecx,ebx
  jmp return


GodMode:
dq 0
OneHitKill:
dq 0
fEnemyDamageMult:
dq (float)4.0
fEnemyHealingMult:
dq (float)0.0
fHeroDamageMult:
dq (float)0.25
fHeroHealingMult:
dq (float)2.0
HeroCannotDie:
dq 1

DamageModAOB:
  jmp newmem
  nop
  nop
return:

[DISABLE]

DamageModAOB:
  db 8B 4D B8 33 C0 2B CB

unregistersymbol(DamageModAOB)
unregistersymbol(GodMode)
unregistersymbol(OneHitKill)
unregistersymbol(fEnemyDamageMult)
unregistersymbol(fEnemyHealingMult)
unregistersymbol(fHeroDamageMult)
unregistersymbol(fHeroHealingMult)

dealloc(newmem)"""

