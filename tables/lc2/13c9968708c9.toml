[[cheat]]
id = "undead"
name = "Undead"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(hpReadPreSubAOB,F3 0F 10 40 18 F3 0F 58 C1 0F 57 C9 0F 2F C1)
registersymbol(hpReadPreSubAOB)

label(pHero)
registersymbol(pHero)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)
label(ishero)
label(isenemy)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
//cmp ecx,edx
cmp [esp+14],0 //zero if attack not from hero's main attack //can't spot bomb attack by hero, i.e. hero damaged by hero's own bomb won't be considered a hero damaged
jne isenemy

ishero:
mov [pHero],eax
xorps xmm1,xmm1//
comiss xmm0,xmm1//
ja originalcode
mov dword ptr [eax+18],(float)1.0
movss xmm0,[eax+18]
movss [ebp-14],xmm1
jmp originalcode

isenemy:
cmp [edx],1 //1 should be hero
je ishero
jmp originalcode

originalcode:
xorps xmm1,xmm1
comiss xmm0,xmm1

exit:
jmp returnhere

///
pHero:
dd 0
///

hpReadPreSubAOB+9: //"LC2.exe"+1D1EB4:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
hpReadPreSubAOB+9: //"LC2.exe"+1D1EB4:
db 0F 57 C9 0F 2F C1
//Alt: xorps xmm1,xmm1
//Alt: comiss xmm0,xmm1
unregistersymbol(hpReadPreSubAOB)

unregistersymbol(pHero)"""

