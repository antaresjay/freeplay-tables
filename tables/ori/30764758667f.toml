[[cheat]]
id = "invincibility"
name = "Invincibility"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[Enable]

//Invincibility (Land)
alloc(i_1,32)
aobscan(i_aob1,DD 45 E8 D9 C9 DE E9 D9 5F 54)
registersymbol(i_aob1)
label(returnhere_i_1)

//Invincibility (Water)
alloc(i_2,32)
aobscan(i_aob2,DD 45 F0 D9 C9 DE E9 D9 9F C0 00 00 00)
registersymbol(i_aob2)
label(returnhere_i_2)

//--------------------------------------------------//
i_1:
fsubp st(1),st(0)
fstp dword ptr [edi+54]
mov [edi+54],(float)1
jmp returnhere_i_1
//--------------------------------------------------//
i_2:
fsubp st(1),st(0)
fstp dword ptr [edi+000000C0]
mov [edi+C0],(float)1
jmp returnhere_i_2
//--------------------------------------------------//

i_aob1+5:
jmp i_1
returnhere_i_1:

i_aob2+5:
jmp i_2
returnhere_i_2:

[Disable]

i_aob1+5:
db DE E9 D9 5F 54
unregistersymbol(i_aob1)
dealloc(i_1)

i_aob2+5:
db DE E9 D9 9F C0 00 00 00
unregistersymbol(i_aob2)
dealloc(i_2)"""

