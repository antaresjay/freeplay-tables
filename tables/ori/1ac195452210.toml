[[cheat]]
id = "infinite-skill-points"
name = "Infinite Skill Points"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(skillpoints, 89 48 24 8B 47 58 83 EC 0C 50)
alloc(newmem, $1000)
label(return)

newmem:
nop
//mov [eax+24],ecx
mov eax,[edi+58]
jmp return

skillpoints:
jmp newmem
nop
return:
registersymbol(skillpoints)

[DISABLE]
skillpoints:
db 89 48 24 8B 47 58
unregistersymbol(skillpoints)
dealloc(newmem)"""

