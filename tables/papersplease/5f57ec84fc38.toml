type = "script"
source = """
define(address,play.night.FamilyMember.get_isAlive)
define(bytes,48 83 EC 28 48 8B 51 48)

[ENABLE]
play.night.FamilyMember.updateSickness:
db C3

assert(address,bytes)
alloc(newmem,$1000,play.night.FamilyMember.get_isAlive)

label(code)
label(return)

newmem:
push rcx
mov rcx,[rcx+48]
mov [rcx+10],#0
pop rcx

code:
  sub rsp,28
  mov rdx,[rcx+48]
  jmp return

address:
  jmp newmem
  nop 3
return:

[DISABLE]
play.night.FamilyMember.updateSickness:
db 40 53

address:
  db bytes


dealloc(*)"""
