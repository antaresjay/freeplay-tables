id = "unlimited-chi-write"
name = "Unlimited Chi - Write"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(unlchi,512)
label(returnhere)
label(originalcode)
//
aobscan(aob_hat,83 ?? ?? D9 81 78 04 00 00)
aobscan(aob_ts,8B ?? ?? ?? 89 86 78 04 00 00)

// Healing, Attacking, Tranformation Attacking
unlchi:
cmp [ecx+00000468],(int)10
jl originalcode
mov [ecx+00000478],(float)20000 // How Much Chi
fld dword ptr [ecx+00000478] // When Used
jmp returnhere


originalcode:
fld dword ptr [ecx+00000478]
jmp returnhere



// Healing, Attacking, Tranformation Attacking
//"JadeEmpire.exe"+23D43:
aob_hat+3:
jmp unlchi
nop
returnhere:

// Tranformation Standing Still
//"JadeEmpire.exe"+BBA3D:
aob_ts+4:
nop
nop
nop
nop
nop
nop

registersymbol(aob_hat)
registersymbol(aob_ts)
 
[DISABLE]
aob_hat+3:
db D9 81 78 04 00 00
aob_ts+4:
db 89 86 78 04 00 00
unregistersymbol(aob_hat)
unregistersymbol(aob_ts)
dealloc(unlchi)
//fld dword ptr [ecx+00000478]
//Alt: db D9 81 78 04 00 00
//
//mov [esi+00000478],eax
//Alt: db 89 86 78 04 00 00"""

