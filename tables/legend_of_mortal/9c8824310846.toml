type = "script"
source = """
[ENABLE]
aobscanmodule(aobtimescale,UnityPlayer.dll,F3 0F 10 81 EC 00 00 00 0F 2E * * * * * * * * * 7B)
alloc(newmem,$1000)
label(code)
label(return)
label(gamespeed_f)
registersymbol(gamespeed_f)

newmem:
  movss xmm0,[ecx+000000EC]
  cmp [gamespeed_f],-1
  jle code
  comiss xmm0,[newmem+300]
  jbe code
  cmp [gamespeed_f],0
  je @f
  movss xmm0,[gamespeed_f]
  movss [ecx+000000EC],xmm0
  jmp code
@@:
  mov [ecx+000000EC],(float)1.0
  movss xmm0,[ecx+000000EC]
  mov [gamespeed_f],-1
code:
  jmp return

newmem+200:
gamespeed_f:
dd -1

aobtimescale:
  jmp newmem
  nop 3
return:
registersymbol(aobtimescale)

[DISABLE]
aobtimescale:
  db F3 0F 10 81 EC 00 00 00
dealloc(newmem)"""

