[[cheat]]
id = "inputmanager-static-base-address-scan-initialization-activate-this-first"
name = "InputManager_static Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(InputManager_static_basepointer)
registersymbol(InputManager_static_update_enable)
registersymbol(InputManager_static_set_enable)
registersymbol(InputManager_static_godmodeset_enable)

alloc(InputManager_static_basepointer, 4)
alloc(InputManager_static_update_enable, 4)
alloc(InputManager_static_set_enable, 4)
alloc(InputManager_static_godmodeset_enable, 4)


[DISABLE]
unregistersymbol(InputManager_static_basepointer)
unregistersymbol(InputManager_static_update_enable)
unregistersymbol(InputManager_static_set_enable)
unregistersymbol(InputManager_static_godmodeset_enable)

dealloc(InputManager_static_basepointer)
dealloc(InputManager_static_update_enable)
dealloc(InputManager_static_set_enable)
dealloc(InputManager_static_godmodeset_enable)"""

[[cheat]]
id = "inputmanager-static-base-address-scan-to-activate-play-level-to-update-play-level"
name = "InputManager_static Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(InputManager_static_savedAOB)
label(InputManager_static_returnhere)
label(InputManager_static_originalcode)
label(InputManager_static_exit)

label(InputManager_static_update_exit)
label(InputManager_static_set_exit)
label(InputManager_static_godmodeset_exit)

registersymbol(InputManager_static_savedAOB)

//053D5335 - 0FB6 05 E85E831B      - movzx eax,byte ptr [1B835EE8] : [00]
//053D533C - 85 C0                 - test eax,eax
//053D533E - 0F85 6F080000         - jne 053D5BB3
//053D5344 - 8B 05 103D7801        - mov eax,[01783D10] : [20753400]
// InputManager:FixedUpdate+72
//053D534A - 83 EC 08              - sub esp,08
//053D534D - 6A 00                 - push 00
//053D534F - 50                    - push eax
//053D5350 - E8 F3D3F2FF           - call 05302748
//053D5355 - 83 C4 10              - add esp,10
//053D5358 - 85 C0                 - test eax,eax
//053D535A - 0F84 FC000000         - je 053D545C
//053D5360 - 8B 47 64              - mov eax,[edi+64]
//053D5363 - 8B C8                 - mov ecx,eax
//053D5365 - 39 09                 - cmp [ecx],ecx
aobscan(InputManager_static_searchedAOB, 83 EC 08 6A 00 50 * * * * FF 83 C4 10 85 C0 * * * * * * 8B 47 64)

alloc(InputManager_static_newmem, 2048, InputManager_static_searchedAOB)
alloc(InputManager_static_temp1, 4, InputManager_static_searchedAOB)
alloc(InputManager_static_temp2, 4, InputManager_static_searchedAOB)
alloc(InputManager_static_temp3, 4, InputManager_static_searchedAOB)
alloc(InputManager_static_temp4, 4, InputManager_static_searchedAOB)
alloc(InputManager_static_temp5, 4, InputManager_static_searchedAOB)


InputManager_static_newmem:
mov [InputManager_static_temp1], eax
mov [InputManager_static_temp2], ebx
mov [InputManager_static_temp3], ecx
mov [InputManager_static_temp4], edx

mov ebx, [InputManager_static_savedAOB-12]
sub ebx, 90

cmp dword ptr [InputManager_static_update_enable], #0
je InputManager_static_update_exit
mov [InputManager_static_basepointer], ebx
InputManager_static_update_exit:

cmp dword ptr [InputManager_static_set_enable], #0
je InputManager_static_set_exit
InputManager_static_set_exit:

cmp dword ptr [InputManager_static_godmodeset_enable], #0
je InputManager_static_godmodeset_exit
mov byte ptr [ebx+92], #1
InputManager_static_godmodeset_exit:

mov eax, [InputManager_static_temp1]
mov ebx, [InputManager_static_temp2]
mov ecx, [InputManager_static_temp3]
mov edx, [InputManager_static_temp4]


InputManager_static_originalcode:
db 83 EC 08 6A 00
//sub esp,08
//push 00


InputManager_static_exit:
jmp InputManager_static_returnhere


InputManager_static_searchedAOB:
InputManager_static_savedAOB:
jmp InputManager_static_newmem
InputManager_static_returnhere:


[DISABLE]
InputManager_static_savedAOB:
db 83 EC 08 6A 00
//sub esp,08
//push 00

unregistersymbol(InputManager_static_savedAOB)

dealloc(InputManager_static_newmem)
dealloc(InputManager_static_temp1)
dealloc(InputManager_static_temp2)
dealloc(InputManager_static_temp3)
dealloc(InputManager_static_temp4)
dealloc(InputManager_static_temp5)"""

