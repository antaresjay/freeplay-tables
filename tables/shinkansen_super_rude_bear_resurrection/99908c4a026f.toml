[[cheat]]
id = "rudebear-base-address-scan-to-activate-play-level-to-update-play-level"
name = "RudeBear Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(RudeBear_savedAOB)
label(RudeBear_returnhere)
label(RudeBear_originalcode)
label(RudeBear_exit)

label(RudeBear_update_exit)
label(RudeBear_set_exit)
label(RudeBear_jumpset_exit)

registersymbol(RudeBear_savedAOB)

//0BCF79D5 - 81 EC F0030000        - sub esp,000003F0
//0BCF79DB - 8B 7D 08              - mov edi,[ebp+08]
// RudeBear:Update+e
//0BCF79DE - 0FB6 87 4E020000      - movzx eax,byte ptr [edi+0000024E]
//0BCF79E5 - 85 C0                 - test eax,eax
//0BCF79E7 - 0F84 CD150000         - je 0BCF8FBA
//0BCF79ED - 33 F6                 - xor esi,esi
aobscan(RudeBear_searchedAOB, 0F B6 87 4E 02 00 00 85 C0)

alloc(RudeBear_newmem, 2048, RudeBear_searchedAOB)
alloc(RudeBear_temp1, 4, RudeBear_searchedAOB)
alloc(RudeBear_temp2, 4, RudeBear_searchedAOB)
alloc(RudeBear_temp3, 4, RudeBear_searchedAOB)
alloc(RudeBear_temp4, 4, RudeBear_searchedAOB)
alloc(RudeBear_temp5, 4, RudeBear_searchedAOB)


RudeBear_newmem:
mov [RudeBear_temp1], eax
mov [RudeBear_temp2], ebx
mov [RudeBear_temp3], ecx
mov [RudeBear_temp4], edx

cmp dword ptr [RudeBear_update_enable], #0
je RudeBear_update_exit
mov [RudeBear_basepointer], edi
RudeBear_update_exit:

cmp dword ptr [RudeBear_set_enable], #0
je RudeBear_set_exit
RudeBear_set_exit:

cmp dword ptr [RudeBear_jumpset_enable], #0
je RudeBear_jumpset_exit
mov byte ptr [edi+289], #1
mov [edi+28c], (float)0
mov [edi+2a0], (float)120
RudeBear_jumpset_exit:

mov eax, [RudeBear_temp1]
mov ebx, [RudeBear_temp2]
mov ecx, [RudeBear_temp3]
mov edx, [RudeBear_temp4]


RudeBear_originalcode:
db 0F B6 87 4E 02 00 00
//movzx eax,byte ptr [edi+0000024E]


RudeBear_exit:
jmp RudeBear_returnhere


RudeBear_searchedAOB:
RudeBear_savedAOB:
jmp RudeBear_newmem
nop
nop
RudeBear_returnhere:


[DISABLE]
RudeBear_savedAOB:
db 0F B6 87 4E 02 00 00
//movzx eax,byte ptr [edi+0000024E]

unregistersymbol(RudeBear_savedAOB)

dealloc(RudeBear_newmem)
dealloc(RudeBear_temp1)
dealloc(RudeBear_temp2)
dealloc(RudeBear_temp3)
dealloc(RudeBear_temp4)
dealloc(RudeBear_temp5)"""

