type = "script"
source = """
[ENABLE]

aobscanmodule(easycraftconstruction_ret,OI_Pendulum-Win64-Shipping.exe,49 8B D3 FF 90 D0 00 00 00 E9 72 01 00 00)
aobscanmodule(easycraftconstruction_aob,VCRUNTIME140.dll,8B 0A 89 08 C3)
alloc(newmem,$1000,easycraftconstruction_aob)

label(code)
label(return)

newmem:
mov rcx,easycraftconstruction_ret+9
cmp [rsp+170],rcx
jne @f
cmp  [RDX],a
jg @f
cmp  [RDX],0
jng @f


mov [RDX],0
code:
xor rcx,rcx
mov ecx,[rdx]
mov [rax],ecx
ret

easycraftconstruction_aob:
jmp newmem
return:
registersymbol(easycraftconstruction_aob)

[DISABLE]

easycraftconstruction_aob:
db 8B 0A 89 08 C3

unregistersymbol(easycraftconstruction_aob)
dealloc(newmem)"""
