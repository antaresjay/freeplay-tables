type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(player)
aobscanmodule(active,GameplayLibrary.dll,39 86 58 02 00 00 0F 8C ???????? 80 7D 10 00)
registersymbol(active)


registersymbol(player)
newmem: //this is allocated memory, you have read,write,execute access
//place your code here
{
player

eax 3
ebx 0
Enemy

Eax 1
ebx 1
}
//258 resourses
// 44 0 318 // might level
// might level + 4 = magic level
// magic level + 4 = destiny
//hero life points 8 2a0 b8
test ebx,ebx
jnz originalcode
mov [player],esi

originalcode:
cmp [esi+00000258],eax
jmp returnhere
player:
dd 0
active://"GameplayLibrary.dll"+8430:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
active://
cmp [esi+00000258],eax
//Alt: db 39 86 58 02 00 00
unregistersymbol(active)"""

