[[cheat]]
id = "grab-player-data-earn-money"
name = "Grab Player Data (Earn Money)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
//Send@Sintrix|FearlessRevolution
[ENABLE]

aobscanregion(playerd,PlayerData:get_Money,PlayerData:get_Money+16,48 63 80 F4 00 00 00 48 83)
alloc(newmem,$1000,playerd)
registersymbol(playerdata)
label(code return playerdata)

newmem:
mov [playerdata],rax

code:
  movsxd  rax,dword ptr [rax+000000F4]
  jmp return

playerdata:
dq 0

playerd:
  jmp newmem
  nop 2
return:
registersymbol(playerd)

[DISABLE]

playerd:
  db 48 63 80 F4 00 00 00

unregistersymbol(*)
dealloc(*)"""
