[[cheat]]
id = "player"
name = "Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(modssss,GameAssembly.dll,48 8B 11 49 8B F8 0F 29 74 24 40 48 8B D9 0F 29)
alloc(newmem,$1000)

label(code)
label(return)

label(tostam)
label(tohung)

label(infstim)
registersymbol(infstim)

newmem:
  cmp rsi, 0
  jne tostam
  jmp code

tostam:
  cmp rsi, 1
  jne tohung

  cmp dword ptr [infstim], 1
  jne tohung

  push 0000000042C80000
  movss xmm1, [rsp]
  add rsp, 8
  jmp code

tohung:
  jmp code
code:
  mov rdx,[rcx]
  mov rdi,r8
  movaps [rsp+40],xmm6
  mov rbx,rcx
  jmp return


infstim:
dd 0

modssss:
  jmp far newmem
return:
registersymbol(modssss)

[DISABLE]

modssss:
  db 48 8B 11 49 8B F8 0F 29 74 24 40 48 8B D9

unregistersymbol(modssss)
unregistersymbol(infstim)

dealloc(newmem)"""

