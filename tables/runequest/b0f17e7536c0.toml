alloc(newmem,$1000,CalculateMovableTilesInject)

label(code)
label(return)
label(unitAddr)
registersymbol(unitAddr)

newmem:
  mov rax,[rcx+70]
  test rax,rax
  je code
  mov [unitAddr],rax
code:
  //mov rax,[rcx+70]
