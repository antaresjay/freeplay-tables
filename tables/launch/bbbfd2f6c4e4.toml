exit:
jmp returnhere


[DISABLE]
savedambitioncampupdate:
db 0F B7 86 A4 00 00 00
//movzx eax,word ptr [esi+000000A4]

unregistersymbol(savedambitioncampupdate)

dealloc(newmem)"""

