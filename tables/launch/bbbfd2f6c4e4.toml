category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(savedambitioncampupdate)
label(returnhere)
label(originalcode)
label(exit)

registersymbol(savedambitioncampupdate)

