[[cheat]]
id = "find-item-with-id"
name = "Find Item with ID"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(itemid,DarkSoulsIII.exe,C3 CC CC CC CC CC 8B 41 0C 89 02)
alloc(newmem,$1000,itemid)

label(code)
label(return)
label(itemid_value)
label(itemid_found)

newmem:
  mov rax,itemid_value
  mov eax,[rax]
  cmp [rcx+0C],eax
  jne code
  mov rax,itemid_found
  mov [rax],rcx
code:
  mov eax,[rcx+0C]
  mov [rdx],eax
  jmp return

itemid_value:
  dd 0

itemid_found:
  dq 0

itemid+06:
  jmp newmem
return:
registersymbol(itemid)
registersymbol(itemid_value)
registersymbol(itemid_found)

[DISABLE]
itemid+06:
  db 8B 41 0C 89 02
unregistersymbol(itemid)
unregistersymbol(itemid_value)
unregistersymbol(itemid_found)
dealloc(newmem)

