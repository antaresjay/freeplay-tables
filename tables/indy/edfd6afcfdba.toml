[[cheat]]
id = "endurance-gondola"
name = "Endurance   [Gondola]"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(endurance,G_Indy.sgl,15 * * * * D9 86 84 00 00 00 D8 1D)
alloc(newmem,$100)
label(return)
registersymbol(endurance)
newmem:
  fld dword ptr [esi+84]
  mov [esi+84],(float)10000
  jmp return
endurance+05:
  jmp newmem
  nop
return:
[DISABLE]
dealloc(newmem)
unregistersymbol(endurance)
endurance+05:
  db D9 86 84 00 00 00"""

