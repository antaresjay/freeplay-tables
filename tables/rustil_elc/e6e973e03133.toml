type = "script"
source = """
// Send

[ENABLE]

aobscanmodule(_stamina,GameAssembly.dll,F3 0F 11 89 98 00 00 00 C3 F3)
alloc(newmem,$1000,_stamina)

label(code)
label(return)

newmem:

code:
  movss xmm1,[rcx+00000098]
  movss [rcx+00000098],xmm1
  jmp return

_stamina:
  jmp newmem
  nop 3
return:
registersymbol(_stamina)

[DISABLE]

_stamina:
  db F3 0F 11 89 98 00 00 00

unregistersymbol(_stamina)
dealloc(newmem)


//GameAssembly.dll+68B66B: F3 0F 11 89 98 00 00 00  - movss [rcx+00000098],xmm1"""
