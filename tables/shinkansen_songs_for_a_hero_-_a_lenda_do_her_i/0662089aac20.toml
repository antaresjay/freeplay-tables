registersymbol(SandBox_originalcode)
registersymbol(SandBox_savedAOB)

//DumaLegend.HUD.HeroHud::Draw+7D - 33 F6                 - xor esi,esi
//DumaLegend.HUD.HeroHud::Draw+7F - A1 AC35AD03           - mov eax,[03AD35AC] : [02BB0BA8]
//DumaLegend.HUD.HeroHud::Draw+84 - 8B 40 38              - mov eax,[eax+38]
//DumaLegend.HUD.HeroHud::Draw+87 - 8B 80 58010000        - mov eax,[eax+00000158]
//DumaLegend.HUD.HeroHud::Draw+8D - 85 C0                 - test eax,eax
//DumaLegend.HUD.HeroHud::Draw+8F - 79 03                 - jns DumaLegend.HUD.HeroHud::Draw+94
//DumaLegend.HUD.HeroHud::Draw+91 - 83 C0 03              - add eax,03
//DumaLegend.HUD.HeroHud::Draw+94 - C1 F8 02              - sar eax,02
aobscan(SandBox_searchedAOB, 8B 40 38 8B 80 58 01 00 00 85 C0 79 03)

alloc(SandBox_newmem, 2048, SandBox_searchedAOB)
alloc(SandBox_temp1, 4, SandBox_searchedAOB)
alloc(SandBox_temp2, 4, SandBox_searchedAOB)
alloc(SandBox_temp3, 4, SandBox_searchedAOB)
alloc(SandBox_temp4, 4, SandBox_searchedAOB)
alloc(SandBox_temp5, 4, SandBox_searchedAOB)


SandBox_newmem:
mov [SandBox_temp1], eax
mov [SandBox_temp2], ebx
mov [SandBox_temp3], ecx
mov [SandBox_temp4], edx

cmp dword ptr [SandBox_update_enable], #0
je SandBox_update_exit
mov [SandBox_basepointer], eax
SandBox_update_exit:

cmp dword ptr [SandBox_invulnerabilityset_enable], #0
je SandBox_invulnerabilityset_exit
mov ebx, [eax+38]
test ebx,ebx
je SandBox_invulnerabilityset_exit
mov [ebx+148], #999
SandBox_invulnerabilityset_exit:

cmp dword ptr [SandBox_hpset_enable], #0
je SandBox_hpset_exit
mov ebx, [eax+38]
test ebx,ebx
je SandBox_hpset_exit
mov ecx, [ebx+158]
mov [ebx+154], ecx
SandBox_hpset_exit:

cmp dword ptr [SandBox_energyset_enable], #0
je SandBox_energyset_exit
mov ebx, [eax+38]
test ebx,ebx
je SandBox_energyset_exit
fild [ebx+160]
fstp [ebx+15c]
SandBox_energyset_exit:

cmp dword ptr [SandBox_airset_enable], #0
je SandBox_airset_exit
mov ebx, [eax+38]
test ebx,ebx
je SandBox_airset_exit
mov ecx, [ebx+170]
mov [ebx+16c], ecx
SandBox_airset_exit:

cmp dword ptr [SandBox_mobilityset_enable], #0
je SandBox_mobilityset_exit
mov ebx, [eax+38]
test ebx,ebx
je SandBox_mobilityset_exit
mov byte ptr [ebx+e5], #1
mov [ebx+134], (float)2
mov [ebx+138], (float)1.5
SandBox_mobilityset_exit:

cmp dword ptr [SandBox_invisibilityset_enable], #0
je SandBox_invisibilityset_exit
mov ebx, [eax+38]
test ebx,ebx
je SandBox_invisibilityset_exit
mov [ebx+150], #99
SandBox_invisibilityset_exit:

cmp dword ptr [SandBox_attackset_enable], #0
je SandBox_attackset_exit
mov ebx, [eax+38]
test ebx,ebx
je SandBox_attackset_exit
mov [ebx+19c], (float)900
mov [ebx+188], (float)0
mov [ebx+18c], (float)99
SandBox_attackset_exit:

mov eax, [SandBox_temp1]
mov ebx, [SandBox_temp2]
mov ecx, [SandBox_temp3]
mov edx, [SandBox_temp4]


SandBox_originalcode:
readmem(SandBox_searchedAOB, 9)


SandBox_exit:
jmp SandBox_returnhere


SandBox_searchedAOB:
SandBox_savedAOB:
jmp SandBox_newmem
nop
nop
nop
nop
SandBox_returnhere:


[DISABLE]
SandBox_savedAOB:
readmem(SandBox_originalcode, 9)

unregistersymbol(SandBox_originalcode)
unregistersymbol(SandBox_savedAOB)

dealloc(SandBox_newmem)
dealloc(SandBox_temp1)
dealloc(SandBox_temp2)
dealloc(SandBox_temp3)
dealloc(SandBox_temp4)
dealloc(SandBox_temp5)"""

