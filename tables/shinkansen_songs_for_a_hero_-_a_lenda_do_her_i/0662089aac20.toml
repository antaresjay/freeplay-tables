//DumaLegend.HUD.MoneyCounter::Update+F - 8B 40 04              - mov eax,[eax+04]
// Accesses Gold
//DumaLegend.HUD.MoneyCounter::Update+12- 8B 50 30              - mov edx,[eax+30]
//DumaLegend.HUD.MoneyCounter::Update+15- 3B CA                 - cmp ecx,edx
//DumaLegend.HUD.MoneyCounter::Update+17- 74 2B                 - je DumaLegend.HUD.MoneyCounter::Update+44
//DumaLegend.HUD.MoneyCounter::Update+19- 6A 03                 - push 03
//DumaLegend.HUD.MoneyCounter::Update+1B- FF 15 BC279005        - call dword ptr [059027BC] : [DumaLegend.ExtensionMethods::StepTowards]
aobscan(Save_searchedAOB, 8B 40 04 8B 50 30 3B CA 74 2B)

alloc(Save_newmem, 2048, Save_searchedAOB)
alloc(Save_temp1, 4, Save_searchedAOB)
alloc(Save_temp2, 4, Save_searchedAOB)
alloc(Save_temp3, 4, Save_searchedAOB)
alloc(Save_temp4, 4, Save_searchedAOB)
alloc(Save_temp5, 4, Save_searchedAOB)


Save_newmem:
mov [Save_temp1], eax
mov [Save_temp2], ebx
mov [Save_temp3], ecx
mov [Save_temp4], edx

cmp dword ptr [Save_update_enable], #0
je Save_update_exit
mov [Save_basepointer], eax
Save_update_exit:

cmp dword ptr [Save_goldset_enable], #0
je Save_goldset_exit
mov ebx, [eax+4]
test ebx, ebx
je Save_goldset_exit
mov [ebx+30], #9999
Save_goldset_exit:

mov eax, [Save_temp1]
mov ebx, [Save_temp2]
mov ecx, [Save_temp3]
mov edx, [Save_temp4]


Save_originalcode:
readmem(Save_searchedAOB, 6)


Save_exit:
jmp Save_returnhere


Save_searchedAOB:
Save_savedAOB:
jmp Save_newmem
nop
Save_returnhere:


[DISABLE]
Save_savedAOB:
readmem(Save_originalcode, 6)

unregistersymbol(Save_originalcode)
unregistersymbol(Save_savedAOB)

dealloc(Save_newmem)
dealloc(Save_temp1)
dealloc(Save_temp2)
dealloc(Save_temp3)
dealloc(Save_temp4)
dealloc(Save_temp5)"""

