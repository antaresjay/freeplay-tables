[[cheat]]
id = "infinite-oxygen"
name = "Infinite Oxygen"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(oxygen,FC_m64.dll,49 8B 88 C8 05 00 00)
alloc(newmem,$1000,"FC_m64.dll"+12386DBB)

label(code)
label(return)

newmem:
code:
  mov rcx,[r8+000005C8]
  fld dword ptr [rcx+1C]
  fstp dword ptr [rcx+18]
  jmp return

oxygen:
  jmp newmem
  nop
  nop
return:
registersymbol(oxygen)

[DISABLE]

oxygen:
  db 49 8B 88 C8 05 00 00

unregistersymbol(oxygen)
dealloc(newmem)"""

