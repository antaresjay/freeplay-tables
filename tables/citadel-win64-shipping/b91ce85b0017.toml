type = "script"
source = """
{ Game   : Citadel-Win64-Shipping.exe
  Date   : 11-02-19
  Author : GamerCare
  Website: www.patreon.com/gamercare
}

[ENABLE]

aobscanmodule(base,Citadel-Win64-Shipping.exe,0f 2f 81 ? ? ? ? 77 ? 0f 57 c0) // should be unique
alloc(newmem,$1000,base)
alloc(pbase,8)
label(code)
label(return)

newmem:
  mov [pbase],rcx

code:
  readmem(base,7)
  jmp return

base:
  jmp newmem
  nop 2
return:
registersymbol(pbase)
registersymbol(code)
registersymbol(base)

[DISABLE]

base:
  readmem(code,7)

unregistersymbol(pbase)
unregistersymbol(code)
unregistersymbol(base)
dealloc(pbase)
dealloc(newmem)"""

