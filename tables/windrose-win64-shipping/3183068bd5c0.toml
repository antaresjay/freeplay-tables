type = "script"
source = """
[ENABLE]
aobscanmodule(aobitemdec,Windrose-Win64-Shipping.exe,48 0F 4C C6 8B 38 2B CF 89)
alloc(newmem,$1000,aobitemdec)
label(code)
label(return)

newmem:
  cmovl rax,rsi
  mov edi,[rax]
  cmp ecx,edi
  jle code
  add ecx,edi
code:
  jmp return

aobitemdec:
  jmp newmem
  nop
return:
registersymbol(aobitemdec)

