[[cheat]]
id = "enable-ai-movement-modifier"
name = "Enable AI Movement Modifier"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(SlowAI,$process,48 8B 01 FF 90 D8 07 00 00 84 C0 74 07)
alloc(newmem,$1000,SlowAI)
label(code return SlowAIMultiplier FreezeAIFlag)

//Send @ Sintrix | FearlessRevolution
newmem:
cmp byte ptr [rcx+6C4],1
je code
push r15
mov r15,[rcx+2E8]
test r15,r15
je @f
movss xmm15,[SlowAIMultiplier]
movss [r15+68],xmm15

@@:
pop r15


code:
  mov rax,[rcx]
  call qword ptr [rax+000007D8]
  jmp return

SlowAIMultiplier:
dd (float)1

FreezeAIFlag:
dd 0
//Send @ Sintrix | FearlessRevolution
SlowAI:
  jmp newmem
  nop 4
return:
registersymbol(SlowAI SlowAIMultiplier FreezeAIFlag)

[DISABLE]

SlowAI:
  db 48 8B 01 FF 90 D8 07 00 00

unregistersymbol(*)
dealloc(*)"""

