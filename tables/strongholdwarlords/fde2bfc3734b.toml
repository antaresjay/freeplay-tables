[[cheat]]
id = "invincibility-ohk"
name = "Invincibility + OHK"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,$100)

label(codeInv)
label(return condOHK)

newmem:
  mov dword ptr [han],0
  push eax
  mov eax,[esi+39C]
  cmp eax,fs:[8]
  jbe @f
  push [eax+58]
  pop [arzeStr]
  mov eax,[eax+70]
  cmp eax,fs:[8]
  jbe @f
  push [eax+48]
  pop [arzeStr+4]
  mov eax,[eax+50]
  cmp eax,fs:[8]
  jbe @f
  push [eax]
  pop [arzeStr+8]
  movdqa xmm3,[mem]
  cmpps xmm3,[arzeStr],0
  movmskps eax,xmm3
  test eax,3
  je @f
  push [esi+390]
  pop [ebp+8]
  mov dword ptr [han],1
  @@:
  pop eax
  cmp byte ptr [condOHK],00
  jz codeInv
  cmp dword ptr [han],1
  je codeInv
  mov [ebp+08],00
codeInv:
  fld dword ptr [esi+0000038C]
  jmp return
  align 10,cc

mem:
  dd 00316574,1,79616C50,00
arzeStr:
  resb 20
condOHK:
  dd 0
han:
  dd 00
invincAndOHK:
  jmp newmem
  nop
return:
registersymbol(condOHK codeInv)

[DISABLE]

invincAndOHK:
  readmem(codeInv,6)

unregistersymbol(condOHK codeInv)
dealloc(newmem)"""

