[[cheat]]
id = "items-for-player-only"
name = "Items [For Player Only]"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,$100)
label(return customValITMS)

newmem:
  mov ebp,esp
  mov ecx,[ebp+08]
  push eax
  mov eax,[tawazan]
  cmp [ecx+2B4],eax
  jnz @f
  mov eax,[customValITMS]
  cmp [ebp+0C],eax
  jnl @f
  push [customValITMS]
  pop [ebp+0C]
  @@:
  pop eax
  jmp return
customValITMS:
  dd (float)2000
items:
  jmp newmem
return:
registersymbol(customValITMS)

[DISABLE]

items:
  db 8B EC 8B 4D 08

unregistersymbol(customValITMS)
dealloc(newmem)"""

