[[cheat]]
id = "no-attack-cooldown"
name = "No Attack Cooldown"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
define(address,GameData.Domains.Extra.ExtraDomain::ConsumeActionPoint)
define(bytes,55 57 48 83 EC 28)

[ENABLE]
alloc(newmem,$1000,GameData.Domains.Extra.ExtraDomain::ConsumeActionPoint)
label(code)
label(return)


newmem:
  xor r8,r8
code:
  db bytes
  jmp return

address:
  jmp newmem
  nop
return:

[DISABLE]
address:
  db 55 57 48 83 EC 28
dealloc(newmem)"""

