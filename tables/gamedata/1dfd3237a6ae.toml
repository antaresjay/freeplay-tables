type = "script"
source = """
define(address,GameData.Domains.Character.Character::SetPoisoned)
define(bytes,55 57 48 83 EC 28)

[ENABLE]
assert(address,bytes)
alloc(newmem,$1000,GameData.Domains.Character.Character::SetPoisoned)
