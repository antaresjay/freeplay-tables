id = "infinite-vehicle-condition"
name = "Infinite Vehicle Condition"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]





aobscanmodule(vehclecond_Aob,GameAssembly.dll,F3 0F 10 70 40 F6 81 33 01 00 00 04) // should be unique
alloc(newmem,$1000,vehclecond_Aob)

label(code)
label(return)

newmem:
fld1
fstp [rax+40]
code:
  movss xmm6,[rax+40]
  jmp return

vehclecond_Aob:
  jmp newmem
return:
registersymbol(vehclecond_Aob)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
vehclecond_Aob:
  db F3 0F 10 70 40

unregistersymbol(vehclecond_Aob)
dealloc(newmem)"""
