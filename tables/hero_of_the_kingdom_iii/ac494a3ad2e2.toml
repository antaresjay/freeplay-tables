[[cheat]]
id = "stats-reopen-inventory"
name = "Stats [reopen inventory]"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Hero_of_the_Kingdom_III.exe
  Version: 1.2.12
  Date   : 2024-04-21
  Author : fenuzulage

  This script captures pointer to fame, health and gold so that these can be changed
  and sets the item stack size to 99 if flag is set
}

[ENABLE]

aobscanmodule(INJECT,Hero_of_the_Kingdom_III.exe,8B 40 58 83 F8 01)
alloc(newmem,$100,INJECT)

alloc(fame,$8)
registersymbol(fame)
alloc(health,$8)
registersymbol(health)
alloc(gold,$8)
registersymbol(gold)
alloc(give_items_flag,$4)
registersymbol(give_items_flag)

label(code)
label(return)
label(originalcode)

give_items_flag:
  dd 0

newmem:

code:
  // rax: Inventory Item
  // rax+58: amount
  // rax+40: Index
  //         0 = Fame
  //         1 = Health
  //         2 = Gold

  // if item is fame, capture adress
  cmp [rax+40], 0
  jne @f              // to @@: which is the next case
  mov dword ptr [fame], rax
  jmp originalcode

@@:
  // if item is health, capture adress
  cmp [rax+40], 1
  jne @f              // to @@: which is the next case
  mov dword ptr [health], rax
  jmp originalcode

@@:
  // if item is gold, capture adress
  cmp [rax+40], 2
  jne @f              // to @@: which is the next case
  mov dword ptr [gold], rax
  jmp originalcode

@@:
  // default: if Flag is set, set item count to 99
  cmp [give_items_flag],1
  jne originalcode
  //rax+58 is amount. set it to 99
  mov [rax+58], (int)99

originalcode:
  mov eax,[rax+58]
  cmp eax,01
  jmp return

INJECT:
  jmp newmem
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 8B 40 58 83 F8 01

unregistersymbol(INJECT)
dealloc(newmem)

{
