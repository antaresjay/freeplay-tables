[[cheat]]
id = "x-unlock-all-temple-blessings-can-leave-on"
name = "[X] <== Unlock All Temple Blessings (Can leave On)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Blessings,StormAgePlugin.dll,8b 34 ?? 8d 46 ?? 83 F8) // should be unique
alloc(newmem,$200)

label(code)
label(return)
label(blessingread)
registersymbol(blessingread)
label(allblessing)
registersymbol(allblessing)

newmem:
  push edx
  mov edx, esi
  add edx, eax
  cmp [edx],#200    //cmp if blessing is activated, jump if activated
  je @f
  cmp [edx], 0     //cmp if blessing is unlocked, jump if unlocked
  je @f
  mov [edx], 0     //unlock all blessings/temple build levels/RESET
@@:
  cmp [allblessing], 00000001
  jne @f
  //cmp [edx], 0  //cmp if blessing is activated, jump if activated
  //jne code
  mov [edx], #200  //activate all blessings
@@:
   cmp [allblessing], 00000000
   jne code
   mov [edx], 0     //unlock all blessings/temple build levels/RESETs
code:
  pop edx
  readmem(Blessings,6)
  jmp return

blessingread:
readmem(Blessings,6)

allblessing:
dd 0

Blessings:
  jmp newmem
  nop
return:
registersymbol(Blessings)

[DISABLE]

Blessings:
  readmem(blessingread,6)

unregistersymbol(Blessings)
dealloc(newmem)

