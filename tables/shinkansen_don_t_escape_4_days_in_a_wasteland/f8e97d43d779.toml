[[cheat]]
id = "gamedatacontroller-static-base-address-scan-initialization-activate-this-first"
name = "GameDataController_static Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameDataController_static_basepointer)
registersymbol(GameDataController_static_update_enable)
registersymbol(GameDataController_static_timesett_enable)
registersymbol(GameDataController_static_fuelset_enable)

alloc(GameDataController_static_basepointer, 4)
alloc(GameDataController_static_update_enable, 4)
alloc(GameDataController_static_timesett_enable, 4)
alloc(GameDataController_static_fuelset_enable, 4)


[DISABLE]
unregistersymbol(GameDataController_static_basepointer)
unregistersymbol(GameDataController_static_update_enable)
unregistersymbol(GameDataController_static_timesett_enable)
unregistersymbol(GameDataController_static_fuelset_enable)

dealloc(GameDataController_static_basepointer)
dealloc(GameDataController_static_update_enable)
dealloc(GameDataController_static_timesett_enable)
dealloc(GameDataController_static_fuelset_enable)"""

[[cheat]]
id = "gamedatacontroller-static-base-address-scan-to-activate-play-level-to-update-play-level"
name = "GameDataController_static Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameDataController_static_savedAOB)
label(GameDataController_static_returnhere)
label(GameDataController_static_originalcode)
label(GameDataController_static_exit)

label(GameDataController_static_update_exit)
label(GameDataController_static_timesett_exit)
label(GameDataController_static_fuelset_exit)

registersymbol(GameDataController_static_originalcode)
registersymbol(GameDataController_static_savedAOB)

//0416CCA3 - 83 EC 08              - sub esp,08
//0416CCA6 - 8B 0D C44F060E        - mov ecx,[0E064FC4] : [0E9F1B60]
// GameDataController:Update+c
//0416CCAC - 8B 45 08              - mov eax,[ebp+08]
//0416CCAF - 89 48 0C              - mov [eax+0C],ecx
//0416CCB2 - C9                    - leave
//0416CCB3 - C3                    - ret
aobscan(GameDataController_static_searchedAOB, 8B 45 08 89 48 0C C9 C3)

alloc(GameDataController_static_newmem, 2048, GameDataController_static_searchedAOB)
alloc(GameDataController_static_temp1, 4, GameDataController_static_searchedAOB)
alloc(GameDataController_static_temp2, 4, GameDataController_static_searchedAOB)
alloc(GameDataController_static_temp3, 4, GameDataController_static_searchedAOB)
alloc(GameDataController_static_temp4, 4, GameDataController_static_searchedAOB)
alloc(GameDataController_static_temp5, 4, GameDataController_static_searchedAOB)


GameDataController_static_newmem:
mov [GameDataController_static_temp1], eax
mov [GameDataController_static_temp2], ebx
mov [GameDataController_static_temp3], ecx
mov [GameDataController_static_temp4], edx

mov ebx, [GameDataController_static_savedAOB-4]
sub ebx, 4

cmp dword ptr [GameDataController_static_update_enable], #0
je GameDataController_static_update_exit
mov [GameDataController_static_basepointer], ebx
GameDataController_static_update_exit:

cmp dword ptr [GameDataController_static_timesett_enable], #0
je GameDataController_static_timesett_exit
mov ecx, [ebx]
test ecx, ecx
je GameDataController_static_timesett_exit
mov [ecx+3c], #0
GameDataController_static_timesett_exit:

cmp dword ptr [GameDataController_static_fuelset_enable], #0
je GameDataController_static_fuelset_exit
mov [ebx+2c], #350000
GameDataController_static_fuelset_exit:

mov eax, [GameDataController_static_temp1]
mov ebx, [GameDataController_static_temp2]
mov ecx, [GameDataController_static_temp3]
mov edx, [GameDataController_static_temp4]


GameDataController_static_originalcode:
readmem(GameDataController_static_searchedAOB, 6)


GameDataController_static_exit:
jmp GameDataController_static_returnhere


GameDataController_static_searchedAOB:
GameDataController_static_savedAOB:
jmp GameDataController_static_newmem
nop
GameDataController_static_returnhere:


[DISABLE]
GameDataController_static_savedAOB:
readmem(GameDataController_static_originalcode, 6)

unregistersymbol(GameDataController_static_originalcode)
unregistersymbol(GameDataController_static_savedAOB)

dealloc(GameDataController_static_newmem)
dealloc(GameDataController_static_temp1)
dealloc(GameDataController_static_temp2)
dealloc(GameDataController_static_temp3)
dealloc(GameDataController_static_temp4)
dealloc(GameDataController_static_temp5)"""

