cmp dword ptr [characterstats_goldset_enable], #0
je characterstats_nonbattle_goldset_exit
mov [r14+1cc], #9999
characterstats_nonbattle_goldset_exit:

cmp dword ptr [characterstats_robotset_enable], #0
je characterstats_nonbattle_robotset_exit
//mov [r14+20c], #21
mov [r14+210], #99
mov [r14+218], #21
mov [r14+234], #3
