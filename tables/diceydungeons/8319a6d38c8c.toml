[[cheat]]
id = "character-stats-base-address-scan-initialization-activate-this-first"
name = "Character Stats Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(characterstats_basepointer)
registersymbol(characterstats_update_enable)
registersymbol(characterstats_healthset_enable)
registersymbol(characterstats_furyset_enable)
registersymbol(characterstats_equipmentset_enable)
registersymbol(characterstats_diceset_enable)
registersymbol(characterstats_goldset_enable)
registersymbol(characterstats_robotset_enable)

alloc(characterstats_basepointer, 8)
alloc(characterstats_update_enable, 4)
alloc(characterstats_healthset_enable, 4)
alloc(characterstats_furyset_enable, 4)
alloc(characterstats_equipmentset_enable, 4)
alloc(characterstats_diceset_enable, 4)
alloc(characterstats_goldset_enable, 4)
alloc(characterstats_robotset_enable, 4)


[DISABLE]
unregistersymbol(characterstats_basepointer)
unregistersymbol(characterstats_update_enable)
unregistersymbol(characterstats_healthset_enable)
unregistersymbol(characterstats_furyset_enable)
unregistersymbol(characterstats_equipmentset_enable)
unregistersymbol(characterstats_diceset_enable)
unregistersymbol(characterstats_goldset_enable)
unregistersymbol(characterstats_robotset_enable)

dealloc(characterstats_basepointer)
dealloc(characterstats_update_enable)
dealloc(characterstats_healthset_enable)
dealloc(characterstats_furyset_enable)
dealloc(characterstats_equipmentset_enable)
dealloc(characterstats_diceset_enable)
dealloc(characterstats_goldset_enable)
dealloc(characterstats_robotset_enable)"""

[[cheat]]
id = "character-battle-stats-base-address-scan-to-update-battle"
name = "Character Battle Stats Base Address Scan (To Update: Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(characterstats_battle_savedAOB)
label(characterstats_battle_returnhere)
label(characterstats_battle_originalcode)
label(characterstats_battle_exit)

label(characterstats_battle_update_exit)
label(characterstats_battle_healthset_exit)
label(characterstats_battle_furyset_exit)
label(characterstats_battle_equipmentset_exit)
label(characterstats_battle_diceset_exit)
label(characterstats_battle_goldset_exit)
label(characterstats_battle_robotset_exit)

registersymbol(characterstats_battle_originalcode)
registersymbol(characterstats_battle_savedAOB)

//diceydungeons.exe+1D046A - E8 D1AE1D01           - call diceydungeons.hx_cffi+23F70
//diceydungeons.exe+1D046F - 48 8B 0B              - mov rcx,[rbx]
// Accesses Health
//diceydungeons.exe+1D0472 - 8B B9 B0010000        - mov edi,[rcx+000001B0]
//diceydungeons.exe+1D0478 - 48 8D 8D B8080000     - lea rcx,[rbp+000008B8]
//diceydungeons.exe+1D047F - E8 1C500401           - call diceydungeons.exe+12154A0
//diceydungeons.exe+1D0484 - 48 8B D8              - mov rbx,rax
aobscan(characterstats_battle_searchedAOB, 8B B9 B0 01 00 00 48 8D 8D B8 08 00 00)

alloc(characterstats_battle_newmem, 2048, characterstats_battle_searchedAOB)
alloc(characterstats_battle_temp1, 8, characterstats_battle_searchedAOB)
alloc(characterstats_battle_temp2, 8, characterstats_battle_searchedAOB)
alloc(characterstats_battle_temp3, 8, characterstats_battle_searchedAOB)
alloc(characterstats_battle_temp4, 8, characterstats_battle_searchedAOB)
alloc(characterstats_battle_temp5, 8, characterstats_battle_searchedAOB)


characterstats_battle_newmem:
mov [characterstats_battle_temp1], rax
mov [characterstats_battle_temp2], rbx
mov [characterstats_battle_temp3], rcx
mov [characterstats_battle_temp4], rdx

cmp dword ptr [characterstats_update_enable], #0
je characterstats_battle_update_exit
mov [characterstats_basepointer], rcx
characterstats_battle_update_exit:

cmp dword ptr [characterstats_healthset_enable], #0
je characterstats_battle_healthset_exit
mov eax, [rcx+1b4]
mov [rcx+1b0], eax
characterstats_battle_healthset_exit:

cmp dword ptr [characterstats_furyset_enable], #0
je characterstats_battle_furyset_exit
mov eax, [rcx+204]
mov [rcx+200], eax
characterstats_battle_furyset_exit:

cmp dword ptr [characterstats_equipmentset_enable], #0
je characterstats_battle_equipmentset_exit
mov rbx, [rcx+240]
test rbx, rbx
je characterstats_battle_equipmentset_exit
mov [rbx+168], #-1
characterstats_battle_equipmentset_exit:

cmp dword ptr [characterstats_diceset_enable], #0
je characterstats_battle_diceset_exit
mov [rcx+190], #12
characterstats_battle_diceset_exit:

cmp dword ptr [characterstats_goldset_enable], #0
je characterstats_battle_goldset_exit
mov [rcx+1cc], #9999
characterstats_battle_goldset_exit:

cmp dword ptr [characterstats_robotset_enable], #0
je characterstats_battle_robotset_exit
//mov [rcx+20c], #21
mov [rcx+210], #99
mov [rcx+218], #21
mov [rcx+234], #3
characterstats_battle_robotset_exit:

mov rax, [characterstats_battle_temp1]
mov rbx, [characterstats_battle_temp2]
mov rcx, [characterstats_battle_temp3]
mov rdx, [characterstats_battle_temp4]


characterstats_battle_originalcode:
readmem(characterstats_battle_searchedAOB, 6)


characterstats_battle_exit:
jmp characterstats_battle_returnhere


characterstats_battle_searchedAOB:
characterstats_battle_savedAOB:
jmp characterstats_battle_newmem
nop
characterstats_battle_returnhere:


[DISABLE]
characterstats_battle_savedAOB:
readmem(characterstats_battle_originalcode, 6)

unregistersymbol(characterstats_battle_originalcode)
unregistersymbol(characterstats_battle_savedAOB)

dealloc(characterstats_battle_newmem)
dealloc(characterstats_battle_temp1)
dealloc(characterstats_battle_temp2)
dealloc(characterstats_battle_temp3)
dealloc(characterstats_battle_temp4)
dealloc(characterstats_battle_temp5)"""

