[[cheat]]
id = "enable-cheats"
name = "Enable Cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Dicey Dungeons
  Version: 1.12.3.0
  Date   : 2021-11-11
  Author : SovietWristwatch.jpg
}

[ENABLE]
aobscanmodule(main,diceydungeons.exe,45 8B 8C 24 B0 01 00 00)
alloc(newmem,$1000,main)

label(code)
label(return)
label(_god)
label(_ohk)
label(cmpVal)

registersymbol(main)
registersymbol(_god)
registersymbol(_ohk)
registersymbol(cmpVal)

newmem:
  push rax
  mov rax,[cmpVal]
  cmp [r12+00000060],rax
  jne enemy
  pop rax
  cmp [_god],1
  jne code
  mov [r12+000001B4],#999
  mov [r12+000001B0],#999
  jmp code

enemy:
  pop rax
  cmp [_ohk],1
  je ohk
  jmp code

ohk:
  mov [r12+000001B0],#0
  jmp code

code:
  mov r9d,[r12+000001B0]
  jmp return

_god:
  dd 0

_ohk:
  dd 0

cmpVal:
  dq (double)-1

main:
  jmp newmem
  nop 3
return:

[DISABLE]
main:
  db 45 8B 8C 24 B0 01 00 00

unregistersymbol(main)
unregistersymbol(_god)
unregistersymbol(_ohk)
unregistersymbol(cmpVal)
dealloc(newmem)"""

