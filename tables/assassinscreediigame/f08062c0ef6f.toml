[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(health_aob,AssassinsCreedIIGame.exe,8B CE 89 50 08 E8 69)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
mov ecx,esi
mov [eax+08],#99
jmp return

health_aob:
jmp newmem
return:
registersymbol(health_aob)

[DISABLE]

health_aob:
db 8B CE 89 50 08

unregistersymbol(health_aob)
dealloc(newmem)"""

