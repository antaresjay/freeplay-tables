[[cheat]]
id = "low-enemies-health-infinite-allies-health"
name = "Low enemies health & infinite allies health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : AssassinsCreedIIGame.exe
  Version: 1.01 Steam/Uplay
  Date   : 2021-11-02
  Author : hex
}

[ENABLE]

aobscanmodule(EnemiesAlliesHealth,AssassinsCreedIIGame.exe,8B 51 08 2B 55 0C)
alloc(newmem,$1000)

alloc(bLowEnemiesHealth,1)
alloc(bInfAlliesHealth,1)

registersymbol(bLowEnemiesHealth)
registersymbol(bInfAlliesHealth)

label(code)
label(return)

//Faction IDs
//04 - allies | 03, 07, 09, 0A - enemies

newmem:
push ebx
cmp byte ptr [bInfAlliesHealth],01
jne @F
//Get faction ID
cmp byte ptr [ecx+04],04
jne @F
//Get max allies health
mov ebx,[ecx+10]
//Set max allies health
mov [ecx+08],ebx
@@:
cmp byte ptr [bLowEnemiesHealth],01
jne code
cmp byte ptr [ecx+04],03
jne @F
//Check if the enemy's health is less than 12 points, then skip,
//otherwise after death he may continue to remain "alive"
cmp byte ptr [ecx+08],0C
jle @F
//Set enemies health to 12 points
mov byte ptr [ecx+08],0C
@@:
cmp byte ptr [ecx+04],07
jne @F
cmp byte ptr [ecx+08],0C
jle @F
mov byte ptr [ecx+08],0C
@@:
cmp byte ptr [ecx+04],09
jne @F
cmp byte ptr [ecx+08],0C
jle @F
mov byte ptr [ecx+08],0C
@@:
cmp byte ptr [ecx+04],0A
jne @F
cmp byte ptr [ecx+08],0C
jle @F
mov byte ptr [ecx+08],0C

code:
pop ebx
  mov edx,[ecx+08]
  sub edx,[ebp+0C]
  jmp return

EnemiesAlliesHealth:
  jmp newmem
  nop
return:
registersymbol(EnemiesAlliesHealth)

