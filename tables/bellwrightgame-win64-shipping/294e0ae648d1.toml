[[cheat]]
id = "inf-weight"
name = "Inf. Weight"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//sendme@fearlessrevolution.com
[ENABLE]

aobscanmodule(weight,BellwrightGame-Win64-Shipping.exe,F3 0F 11 8E BC 02 00 00) // should be unique
alloc(newmem,$1000,weight)

label(code)
label(return)
label(bag)

newmem:

code:
  movss xmm1,[bag]
  movss [rsi+000002BC],xmm1
  jmp return


bag:
dd (float)0

weight:
  jmp newmem
  nop 3
return:
registersymbol(weight)

[DISABLE]

weight:
  db F3 0F 11 8E BC 02 00 00

unregistersymbol(weight)
dealloc(newmem)"""

