[[cheat]]
id = "main-script"
name = "main script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048)
label(returnhere)
registersymbol(returnhere)


label(_aobmark)
registersymbol(_aobmark)
aobscanmodule(aobmark,TurmoilSteam.exe,56 ** 8B 45 ** 25 FF FF FF 00 83 F8 0E 0F)

registersymbol(money)
label(money)
registersymbol(prices)
label(prices)
registersymbol(time)
label(time)
registersymbol(pricegrant)
label(pricegrant)

registersymbol(pricebak)
label(pricebak)

label(storemoney)
label(storemainmoney)
label(mstorenext)

label(storemaindiamonds)
label(dstorenext)

label(storestocks)
label(sstorenext)

label(storeprices)
label(priceinited)

label(storetime)

label(validprices)
label(pricemod)
label(currentone)
label(currentfin)

label(storep1)
label(storep2)
label(modend)
label(modend2)

label(script_joint)
registersymbol(script_joint)

newmem:
fld qword ptr [ebp]
pop edi
fstp qword ptr [esi]

cmp edi,00018751
je storemoney

cmp edi,000187D6
je storemainmoney

cmp edi,00018762
je storeprices

cmp edi,00018761
je storemaindiamonds

cmp edi,000187D3
je storestocks

cmp edi,0001875A
je storetime

jmp returnhere

storetime:
/*mov ebx,[esp+50]
cmp ebx,80000000
jne returnhere
cmp [esp+60],0
je returnhere
cmp [esp+6c],0
jne returnhere*/
cmp [esp],0
jle returnhere


mov [time],ebp
jmp returnhere


storestocks:
mov ebx,[esp]
sub ebx,[money+2c]
cmp ebx,4
jb sstorenext
mov ebx,[esp]
mov [money+2c],ebx
xor ebx,ebx

sstorenext:
mov [money+30+ebx*4],ebp
jmp returnhere

storemaindiamonds:
mov ebx,[esp]
sub ebx,[money+18]
cmp ebx,4
jb dstorenext
mov ebx,[esp]
mov [money+18],ebx
xor ebx,ebx

dstorenext:
mov [money+1c+ebx*4],ebp
jmp returnhere

storemoney:
mov [money],ebp
jmp returnhere

storemainmoney:
mov ebx,[esp]
sub ebx,[money+4]
cmp ebx,4
jb mstorenext
mov ebx,[esp]
mov [money+4],ebx
xor ebx,ebx

mstorenext:
mov [money+8+ebx*4],ebp
jmp returnhere

storeprices:
cmp [prices],0
je storep1

cmp ebp,[prices]
je priceinited

cmp [prices+4],0
je storep2

cmp ebp,[prices+4]
je validprices

mov [prices],0
mov [prices+4],0

jmp returnhere

priceinited:
cmp [prices+4],0
jne validprices

storep1:
mov [prices],ebp
jmp returnhere

storep2:
mov [prices+4],ebp

cmp [prices],ebp
jae returnhere

mov ebx,[prices]
mov [prices+4],ebx
mov [prices],ebp
jmp returnhere


validprices:
fld qword ptr [ebp+00]
fstp qword ptr [esi]
mov ebx,00018762
cmp ebx,[esp+48]

script_joint:
jmp returnhere
nop

pricemod:
push eax
////// prevent high-looping

fld qword ptr [ebp]
cmp ebp,[prices]
jne currentone
fst qword ptr [pricebak]
jmp currentfin

currentone:
fst qword ptr [pricebak+8]

currentfin:


//////
fld qword ptr [pricebak]

fld qword ptr [pricebak+8]
fcomp
fstsw ax
sahf
jbe modend
fstp st(0)
mov eax,[prices+4]
fld qword ptr [eax]

modend:

fld qword ptr [pricegrant]
fcomp
fstsw ax
sahf
jbe modend2
fstp st(0)
fld qword ptr [pricegrant]


modend2:
mov eax,[prices]
fst qword ptr [eax]
mov eax,[prices+4]
fst qword ptr [eax]
fstp qword ptr [esi]


pop eax
jmp returnhere



money:
dd 0
dd 0
dd 0
dd 0
dd 0
dd 0
dd 0
dd 0
dd 0
dd 0
dd 0
dd 0
dd 0
dd 0
dd 0
dd 0

prices:
dd 0
dd 0

pricegrant:
dd 0
dd 0

pricebak:
dd 0
dd 0
dd 0
dd 0

time:
dd 0

aobmark+21:
_aobmark:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
_aobmark:
fld qword ptr [ebp+00]
pop edi
fstp qword ptr [esi]

dealloc(newmem)
unregistersymbol(_aobmark)
unregistersymbol(money)
unregistersymbol(prices)
unregistersymbol(pricegrant)
unregistersymbol(pricebak)
unregistersymbol(script_joint)
unregistersymbol(time)
unregistersymbol(returnhere)
//Alt: db DD 45 00 5F DD 1E"""

