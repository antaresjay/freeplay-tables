[[cheat]]
id = "set-gold"
name = "Set Gold"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Anno4.exe
  Version: GOG
  Date   : 2020-02-16
  Author : rambo99jose

  Modifies gold value
}

[ENABLE]

aobscanmodule(INJECT_gold,Anno4.exe,8B 81 A0 00 00 00 25) // should be unique
alloc(newmemGold,$1000)

//variable to set gold
alloc(setGold,$64)
registersymbol(setGold)

label(lblGold)
label(code)
label(return)

newmemGold:
  //check if modifying gold
  cmp [setGold],0
  jnz lblGold
  jmp code

lblGold:
  push eax
  mov eax, [setGold]       //(Gold/1024)
  imul eax,eax,(int)1024   //(Gold)
  mov [ecx+000000A0],eax
  pop eax
  jmp return

code:
  mov eax,[ecx+000000A0]
  jmp return

INJECT_gold:
  jmp newmemGold
  nop
return:
registersymbol(INJECT_gold)

[DISABLE]

INJECT_gold:
  db 8B 81 A0 00 00 00

//clean variables
unregistersymbol(setGold)
dealloc(setGold)

unregistersymbol(INJECT_gold)
dealloc(newmemGold)

