name = "God Mode Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Anno4.exe
  Version: GOG
  Date   : 2020-02-16
  Author : rambo99jose

  God mode for player

  Based of STN https://fearlessrevolution.com/viewtopic.php?t=1362
  Originally by Recifense
}

[ENABLE]

aobscanmodule(INJECT_God,Anno4.exe,01 43 08 B8 10 27 00 00) // should be unique
alloc(newmemGod,$1000)

label(code)
label(return)

newmemGod:
  //check if property belongs to player faction
  push ecx
  mov ecx,[ebx+04]                      // Get ptr to unit
  cmp dword ptr[ecx+000000c0],0         // Player's unit?
  pop ecx//popping here to prevent crash
  jne return                            // Jump if false

  mov dword ptr [ebx+08],(int)40960000  // Make %HP = 100%
  mov dword ptr [ebx+0c],0              // Make %HP = 100%

