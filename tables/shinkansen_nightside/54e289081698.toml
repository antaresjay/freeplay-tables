[[cheat]]
id = "resourcesgui-base-address-scan-initialization-activate-this-first"
name = "resourcesGUI Base Address Scan Initialization (Activate This First)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(resourcesGUI_basepointer)
registersymbol(resourcesGUI_update_enable)
registersymbol(resourcesGUI_set_enable)

alloc(resourcesGUI_basepointer, 4)
alloc(resourcesGUI_update_enable, 4)
alloc(resourcesGUI_set_enable, 4)


[DISABLE]
unregistersymbol(resourcesGUI_basepointer)
unregistersymbol(resourcesGUI_update_enable)
unregistersymbol(resourcesGUI_set_enable)

dealloc(resourcesGUI_basepointer)
dealloc(resourcesGUI_update_enable)
dealloc(resourcesGUI_set_enable)"""

[[cheat]]
id = "resourcesgui-base-address-scan-to-activate-battle-to-update-battle"
name = "resourcesGUI Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(resourcesGUI_savedAOB)
label(resourcesGUI_returnhere)
label(resourcesGUI_originalcode)
label(resourcesGUI_exit)

label(resourcesGUI_update_exit)
label(resourcesGUI_set_exit)

registersymbol(resourcesGUI_savedAOB)

//04C056CC - 89 45 FC              - mov [ebp-04],eax
//04C056CF - 8B 41 10              - mov eax,[ecx+10]
// resourcesGUI:LateUpdate+12
//04C056D2 - 8B 40 6C              - mov eax,[eax+6C]
//04C056D5 - 8B 49 10              - mov ecx,[ecx+10]
//04C056D8 - 8B 89 34030000        - mov ecx,[ecx+00000334]
//04C056DE - 39 48 0C              - cmp [eax+0C],ecx
//04C056E1 - 0F86 2A000000         - jbe 04C05711
aobscan(resourcesGUI_searchedAOB, 8B 40 6C 8B 49 10 8B 89 34 03 00 00)

alloc(resourcesGUI_newmem, 2048)
alloc(resourcesGUI_temp1, 4)


resourcesGUI_newmem:
mov [resourcesGUI_temp1], ebx


cmp dword ptr [resourcesGUI_update_enable], #0
je resourcesGUI_update_exit
mov [resourcesGUI_basepointer], ecx
resourcesGUI_update_exit:

cmp dword ptr [resourcesGUI_set_enable], #0
je resourcesGUI_set_exit
cmp dword ptr [ecx+10], #0
je resourcesGUI_set_exit
mov ebx, [ecx+10]
cmp dword ptr [ebx+6c], #0
je resourcesGUI_set_exit
mov ebx, [ebx+6c]
mov [ebx+14], #9999999
resourcesGUI_set_exit:

mov ebx, [resourcesGUI_temp1]


resourcesGUI_originalcode:
db 8B 40 6C 8B 49 10
//mov eax,[eax+6C]
//mov ecx,[ecx+10]


resourcesGUI_exit:
jmp resourcesGUI_returnhere


resourcesGUI_searchedAOB:
resourcesGUI_savedAOB:
jmp resourcesGUI_newmem
nop
resourcesGUI_returnhere:


[DISABLE]
resourcesGUI_savedAOB:
db 8B 40 6C 8B 49 10
//mov eax,[eax+6C]
//mov ecx,[ecx+10]

unregistersymbol(resourcesGUI_savedAOB)

dealloc(resourcesGUI_newmem)
dealloc(resourcesGUI_temp1)"""

