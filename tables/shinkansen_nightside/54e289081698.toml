[[cheat]]
id = "building-properties-base-address-scan-to-activate-battle-to-update-battle"
name = "building_properties Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(building_properties_savedAOB)
label(building_properties_returnhere)
label(building_properties_originalcode)
label(building_properties_exit)

label(building_properties_update_exit)
label(building_properties_set_exit)
label(building_properties_invincibleset_exit)
label(building_properties_healthshieldset_exit)
label(building_properties_statsset_exit)

registersymbol(building_properties_savedAOB)

//04BEAA01 - C7 85 DCFEFFFF 00000000 - mov [ebp-00000124],00000000
//04BEAA0B - C7 85 E0FEFFFF 00000000 - mov [ebp-00000120],00000000
// building_properties:Update+2d
//04BEAA15 - 0FB6 87 E0010000      - movzx eax,byte ptr [edi+000001E0]
//04BEAA1C - 8B 8F 9C000000        - mov ecx,[edi+0000009C]
//04BEAA22 - 0FB6 89 FC020000      - movzx ecx,byte ptr [ecx+000002FC]
//04BEAA29 - 3B C1                 - cmp eax,ecx
aobscan(building_properties_searchedAOB, 0F B6 87 E0 01 00 00 8B 8F 9C 00 00 00)

alloc(building_properties_newmem, 2048)
alloc(building_properties_temp1, 4)


building_properties_newmem:
mov [building_properties_temp1], ebx

// Player is Team 1
cmp dword ptr [edi+17c], #1
jne building_properties_statsset_exit

cmp dword ptr [building_properties_update_enable], #0
je building_properties_update_exit
cmp dword ptr [edi+fc], #1
jne building_properties_update_exit
mov [building_properties_basepointer], edi
building_properties_update_exit:

cmp dword ptr [building_properties_set_enable], #0
je building_properties_set_exit
building_properties_set_exit:

cmp dword ptr [building_properties_invincibleset_enable], #0
je building_properties_invincibleset_exit
cmp dword ptr [edi+1c], #0
je building_properties_update_exit
mov ebx, [edi+1c]
mov byte ptr [ebx+286], #1
building_properties_invincibleset_exit:

cmp dword ptr [building_properties_healthshieldset_enable], #0
je building_properties_healthshieldset_exit
cmp dword ptr [edi+1c], #0
je building_properties_healthshieldset_exit
mov ebx, [edi+1c]
// Dead
cmp byte ptr [ebx+2ec], #0
jne building_properties_healthshieldset_exit
fild [ebx+270]
fstp [ebx+200]
fld [ebx+2ac]
fstp [ebx+20c]
building_properties_healthshieldset_exit:

cmp dword ptr [building_properties_statsset_enable], #0
je building_properties_statsset_exit
mov [edi+16c], #99
mov [edi+178], #99
building_properties_statsset_exit:

mov ebx, [building_properties_temp1]


building_properties_originalcode:
db 0F B6 87 E0 01 00 00
//movzx eax,byte ptr [edi+000001E0]


building_properties_exit:
jmp building_properties_returnhere


building_properties_searchedAOB:
building_properties_savedAOB:
jmp building_properties_newmem
nop
nop
building_properties_returnhere:


[DISABLE]
building_properties_savedAOB:
db 0F B6 87 E0 01 00 00
//movzx eax,byte ptr [edi+000001E0]

unregistersymbol(building_properties_savedAOB)

dealloc(building_properties_newmem)
dealloc(building_properties_temp1)"""

