[[cheat]]
id = "unit-properties-base-address-scan-to-activate-battle-to-update-battle"
name = "unit_properties Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(unit_properties_savedAOB)
label(unit_properties_returnhere)
label(unit_properties_originalcode)
label(unit_properties_exit)

label(unit_properties_update_exit)
label(unit_properties_set_exit)
label(unit_properties_invincibleset_exit)
label(unit_properties_healthshieldset_exit)
label(unit_properties_statsset_exit)

registersymbol(unit_properties_savedAOB)

//04D250CD - C7 85 20FFFFFF 00000000 - mov [ebp-000000E0],00000000
//04D250D7 - E8 34E9FAFF           - call 04CD3A10
// unit_properties:Update+6c
//04D250DC - 8B 8F DC000000        - mov ecx,[edi+000000DC]
//04D250E2 - 2B C1                 - sub eax,ecx
//04D250E4 - B9 03000000           - mov ecx,00000003
//04D250E9 - 99                    - cdq
aobscan(unit_properties_searchedAOB, 8B 8F DC 00 00 00 2B C1)

alloc(unit_properties_newmem, 2048)
alloc(unit_properties_temp1, 4)


unit_properties_newmem:
mov [unit_properties_temp1], ebx

// Player is Team 1
cmp dword ptr [edi+a0], #1
jne unit_properties_statsset_exit

cmp dword ptr [unit_properties_update_enable], #0
je unit_properties_update_exit
mov [unit_properties_basepointer], edi
unit_properties_update_exit:

cmp dword ptr [unit_properties_set_enable], #0
je unit_properties_set_exit
unit_properties_set_exit:

cmp dword ptr [unit_properties_invincibleset_enable], #0
je unit_properties_invincibleset_exit
cmp dword ptr [edi+18], #0
je unit_properties_update_exit
mov ebx, [edi+18]
mov byte ptr [ebx+286], #1
unit_properties_invincibleset_exit:

cmp dword ptr [unit_properties_healthshieldset_enable], #0
je unit_properties_healthshieldset_exit
cmp dword ptr [edi+18], #0
je unit_properties_healthshieldset_exit
mov ebx, [edi+18]
// Dead
cmp byte ptr [ebx+2ec], #0
jne unit_properties_healthshieldset_exit
fild [ebx+270]
fstp [ebx+200]
fld [ebx+2ac]
fstp [ebx+20c]
unit_properties_healthshieldset_exit:

cmp dword ptr [unit_properties_statsset_enable], #0
je unit_properties_statsset_exit
mov [edi+ac], #99
mov [edi+b0], #99
unit_properties_statsset_exit:

mov ebx, [unit_properties_temp1]


unit_properties_originalcode:
db 8B 8F DC 00 00 00
//mov ecx,[edi+000000DC]


unit_properties_exit:
jmp unit_properties_returnhere


unit_properties_searchedAOB:
unit_properties_savedAOB:
jmp unit_properties_newmem
nop
unit_properties_returnhere:


[DISABLE]
unit_properties_savedAOB:
db 8B 8F DC 00 00 00
//mov ecx,[edi+000000DC]

unregistersymbol(unit_properties_savedAOB)

dealloc(unit_properties_newmem)
dealloc(unit_properties_temp1)"""

