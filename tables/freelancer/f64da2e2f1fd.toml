[[cheat]]
id = "infinite-weapon-energy"
name = "INFINITE WEAPON ENERGY"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

 
 
aobscanmodule(energy,Common.dll,D9 99 98 01 00 00 8B) // should be unique
alloc(newmem,$1000)
alloc(nrg,8)

label(code)
label(return)

nrg:
dd (float)20000

newmem:
cmp dword ptr [ecx+b4],1
jne code
fld dword ptr [nrg]
fstp dword ptr [ecx+00000198]
jmp return

code:
  fstp dword ptr [ecx+00000198]
  jmp return

energy:
  jmp newmem
  nop
return:
registersymbol(energy)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
energy:
  db D9 99 98 01 00 00

unregistersymbol(energy)
dealloc(newmem)
dealloc(nrg)"""

