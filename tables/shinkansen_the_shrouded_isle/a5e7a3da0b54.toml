[[cheat]]
id = "gamemanager-base-address-scan-initialization-activate-this-first"
name = "GameManager Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameManager_basepointer)
registersymbol(GameManager_update_enable)
registersymbol(GameManager_set_enable)
registersymbol(GameManager_resourcesset_enable)
registersymbol(GameManager_familyset_enable)
registersymbol(GameManager_contagionset_enable)

alloc(GameManager_basepointer, 4)
alloc(GameManager_update_enable, 4)
alloc(GameManager_set_enable, 4)
alloc(GameManager_resourcesset_enable, 4)
alloc(GameManager_familyset_enable, 4)
alloc(GameManager_contagionset_enable, 4)


[DISABLE]
unregistersymbol(GameManager_basepointer)
unregistersymbol(GameManager_update_enable)
unregistersymbol(GameManager_set_enable)
unregistersymbol(GameManager_resourcesset_enable)
unregistersymbol(GameManager_familyset_enable)
unregistersymbol(GameManager_contagionset_enable)

dealloc(GameManager_basepointer)
dealloc(GameManager_update_enable)
dealloc(GameManager_set_enable)
dealloc(GameManager_resourcesset_enable)
dealloc(GameManager_familyset_enable)
dealloc(GameManager_contagionset_enable)"""

[[cheat]]
id = "gamemanager-base-address-scan-to-activate-play-level-to-update-play-level"
name = "GameManager Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameManager_savedAOB)
label(GameManager_returnhere)
label(GameManager_originalcode)
label(GameManager_exit)

label(GameManager_update_exit)
label(GameManager_set_exit)
label(GameManager_resourcesset_exit)
label(GameManager_familyset_exit)
label(GameManager_familyset_entry)
label(GameManager_familyset_continue)
label(GameManager_contagionset_exit)
label(GameManager_contagionset_entry)
label(GameManager_contagionset_continue)

registersymbol(GameManager_savedAOB)

//0545B834 - 83 EC 04              - sub esp,04
//0545B837 - 8B 7D 08              - mov edi,[ebp+08]
// GameManager:Update+a
//0545B83A - 0FB6 87 3F010000      - movzx eax,byte ptr [edi+0000013F]
//0545B841 - 85 C0                 - test eax,eax
//0545B843 - 75 23                 - jne 0545B868
//0545B845 - 83 EC 0C              - sub esp,0C
//0545B848 - 57                    - push edi
aobscan(GameManager_searchedAOB, 0F B6 87 3F 01 00 00 85 C0 75 23)

alloc(GameManager_newmem, 2048, GameManager_searchedAOB)
alloc(GameManager_temp1, 4, GameManager_searchedAOB)
alloc(GameManager_temp2, 4, GameManager_searchedAOB)
alloc(GameManager_temp3, 4, GameManager_searchedAOB)
alloc(GameManager_temp4, 4, GameManager_searchedAOB)
alloc(GameManager_temp5, 4, GameManager_searchedAOB)


GameManager_newmem:
mov [GameManager_temp1], eax
mov [GameManager_temp2], ebx
mov [GameManager_temp3], ecx
mov [GameManager_temp4], edx

cmp dword ptr [GameManager_update_enable], #0
je GameManager_update_exit
mov [GameManager_basepointer], edi
GameManager_update_exit:

cmp dword ptr [GameManager_set_enable], #0
je GameManager_set_exit
GameManager_set_exit:

cmp dword ptr [GameManager_resourcesset_enable], #0
je GameManager_resourcesset_exit
mov edx, 0
mov ebx, [edi+3c]
test ebx, ebx
je GameManager_resourcesset_exit
mov ebx, [ebx+8]
test ebx, ebx
je GameManager_resourcesset_exit
mov [ebx+8], #100
mov [ebx+c], #100
mov [ebx+10], #100
mov [ebx+14], #100
mov [ebx+18], #100
GameManager_resourcesset_exit:

cmp dword ptr [GameManager_familyset_enable], #0
je GameManager_familyset_exit
mov edx, 0
mov ebx, [edi+b0]
test ebx, ebx
je GameManager_familyset_exit
mov ebx, [ebx+8]
test ebx, ebx
je GameManager_familyset_exit
mov ecx, [ebx+c]
test ecx, ecx
je GameManager_familyset_exit
GameManager_familyset_entry:
mov eax, [ebx+edx*4+10]
test eax, eax
je GameManager_familyset_continue
mov [eax+ac], #100
mov [eax+b8], #9999
mov [eax+bc], #0
GameManager_familyset_continue:
inc edx
cmp ecx, edx
je GameManager_familyset_exit
jmp GameManager_familyset_entry
GameManager_familyset_exit:

cmp dword ptr [GameManager_contagionset_enable], #0
je GameManager_contagionset_exit
mov edx, 0
mov ebx, [edi+ac]
test ebx, ebx
je GameManager_contagionset_exit
mov ebx, [ebx+8]
test ebx, ebx
je GameManager_contagionset_exit
mov ecx, [ebx+c]
test ecx, ecx
je GameManager_contagionset_exit
GameManager_contagionset_entry:
mov eax, [ebx+edx*4+10]
test eax, eax
je GameManager_contagionset_continue
mov [eax+20], #0
GameManager_contagionset_continue:
inc edx
cmp ecx, edx
je GameManager_contagionset_exit
jmp GameManager_contagionset_entry
GameManager_contagionset_exit:

mov eax, [GameManager_temp1]
mov ebx, [GameManager_temp2]
mov ecx, [GameManager_temp3]
mov edx, [GameManager_temp4]


GameManager_originalcode:
db 0F B6 87 3F 01 00 00
//movzx eax,byte ptr [edi+0000013F]


GameManager_exit:
jmp GameManager_returnhere


GameManager_searchedAOB:
GameManager_savedAOB:
jmp GameManager_newmem
nop
nop
GameManager_returnhere:


[DISABLE]
GameManager_savedAOB:
db 0F B6 87 3F 01 00 00
//movzx eax,byte ptr [edi+0000013F]

unregistersymbol(GameManager_savedAOB)

dealloc(GameManager_newmem)
dealloc(GameManager_temp1)
dealloc(GameManager_temp2)
dealloc(GameManager_temp3)
dealloc(GameManager_temp4)
dealloc(GameManager_temp5)"""

