jne originalcode
cmp [prevloc_saved],1
jne originalcode

push edx
mov edx,[prev_x_coordinate]
mov [edi+2C],edx
mov edx,[prev_y_coordinate]
mov [edi+24],edx
mov edx,[prev_z_coordinate]
mov [edi+34],edx
pop edx
mov [Prev_tlp],0
je originalcode

//-------------------------------------------------------------
//-------------------------------------------------------------
//-------------------------------------------------------------
originalcode:
mov edx,[ebp+14]
mov [edi+44],edx

cmp ebx,F2A
jne exit
mov [current_coordinates],edi

exit:
jmp return
//-------------------------------------------------------------
//-------------------------------------------------------------
x_coordinate:
dd (float)0
z_coordinate:
dd (float)0
y_coordinate:
dd (float)0
current_coordinates:
dd (float)0
prev_x_coordinate:
dd (float)0
prev_y_coordinate:
dd (float)0
prev_z_coordinate:
dd (float)0
Save_tlp:
dd 0
Load_tlp:
dd 0
Prev_tlp:
dd 0
loc_saved:
dd 0
prevloc_saved:
dd 0
//-------------------------------------------------------------
//-------------------------------------------------------------
//----------------Enable Script ends to here-------------------
//-------------------------------------------------------------
//-------------------------------------------------------------











[DISABLE]
