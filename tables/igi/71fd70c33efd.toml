type = "script"
source = """
[ENABLE]
//-------------------------------------------------------------
//-------------------------------------------------------------
//--------------Enable Script starts from here-----------------
//-------------------------------------------------------------
//-------------------------------------------------------------
aobscanmodule(Teleporter,igi.exe,8B 55 14 89 57 44) //AOB Scan
//-------------------------------------------------------------
