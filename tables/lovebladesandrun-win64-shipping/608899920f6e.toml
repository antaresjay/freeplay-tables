source = """
// Game Executable   : LoveBladesandRun-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.6.1.0
// Game Version      : Build.21935490
// Script Date       : 2026-03-01


[ENABLE]

aobscanmodule(master,LoveBladesandRun-Win64-Shipping.exe,4Cxxxx4Cxxxxxxxx488Bxx488Bxx41FFxxxxxxxxxx488Bxxxxxx4883xxxx5FC3xxxxxxxxxxxxxxxxxx4889) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,8)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,8)

newmem:
  mov [data],rdi

code:
  readmem(master,8)
  jmp return

master:
  jmp newmem
  nop 3
return:

[DISABLE]

master:
  readmem(masterbkp,8)

unregistersymbol(*)
dealloc(*)"""

