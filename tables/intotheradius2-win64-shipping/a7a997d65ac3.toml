[[cheat]]
id = "inf-durability"
name = "INF DURABILITY"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
// Keep item durability at 100.0

alloc(newmem,2048,"IntoTheRadius2-Win64-Shipping.exe"+5422DC6)
label(returnhere)
label(float100)

newmem:
    // load float 100.0 into xmm3 and write it to [rdi+0xA8]
    movss xmm3, [float100]
    movss [rdi+000000A8], xmm3

    // done, return to the original code flow
    jmp returnhere

float100:
    dd 0x42C80000     // 100.0 as IEEE-754 single-precision

"IntoTheRadius2-Win64-Shipping.exe"+5422DC6:
    jmp newmem
    nop
    nop
    nop

returnhere:

[DISABLE]
// restore original bytes and free memory
"IntoTheRadius2-Win64-Shipping.exe"+5422DC6:
    db F3 0F 11 9F A8 00 00 00
dealloc(newmem)"""

