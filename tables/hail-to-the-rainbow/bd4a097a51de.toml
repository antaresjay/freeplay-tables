[[cheat]]
id = "player-controller-ctrl-numpad-1"
name = "Player Controller (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Hail to the Rainbow.exe
// Author            : ndck76
// Executable Version: 2019.4.40.50731
// Game Version      : v1.01
// Script Date       : 2025-12-03


[ENABLE]

aobscanregion(master,PlayerController:Update,PlayerController:Update+10000,5548xxxx48xxxxxxxxxxxx48xxxxxx48xxxxC785xxxxxxxxxxxx0000C785xxxxxxxxxxxx0000C785xxxxxxxxxxxx0000C785xxxxxxxxxxxx0000C785xxxxxxxxxxxx0000C785xxxxxxxxxxxx0000C785xxxxxxxxxxxx0000C785xxxxxxxxxxxx0000C6xxxxxxxxxxxxC785xxxxxxxxxxxx0000) //PlayerController:Update
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,11)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,11)

newmem:
  mov [data],rcx

code:
  readmem(master,11)
  jmp return

master:
  jmp newmem
  nop 6
return:

[DISABLE]

master:
  readmem(masterbkp,11)

unregistersymbol(*)
dealloc(*)"""

