type = "script"
source = """
// Game Executable   : GoriCuddlyCarnage-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.1.1.0
// Game Version      : v1.0.101
// Script Date       : 2024-09-03


[ENABLE]

aobscanmodule(master,GoriCuddlyCarnage-Win64-Shipping.exe,488Bxx410FxxxxF2xxxxxxxxxxFF) ///Script/Engine.Pawn:AddMovementInput+109
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,7)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,7)

newmem:
  mov [data],rsi

code:
  readmem(master,7)
  jmp return

master:
  jmp newmem
  nop 2
return:

[DISABLE]

master:
  readmem(masterbkp,7)

unregistersymbol(*)
dealloc(*)"""

