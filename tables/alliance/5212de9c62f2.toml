type = "script"
source = """
//Send@ModEngine
[ENABLE]

aobscanmodule(expmultiplier,Alliance.exe,89????C3????????????????????????C2??????????????????????????????80)
alloc(newmem,$1000,expmultiplier)
registersymbol(expmultiplier xpmulti)
label(code return xpmulti)

newmem:

code:
  imul edx,[xpmulti]
  mov [rcx+20],edx
  ret 
  int 3 
  jmp return

xpmulti:
dd 1

expmultiplier+0D:
  jmp newmem
return:
registersymbol(expmultiplier)

[DISABLE]

expmultiplier+0D:
  db 89 51 20 C3 CC

unregistersymbol(*)
dealloc(*)"""

