[[cheat]]
id = "points-hack"
name = "Points hack"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,Alliance.exe,5B C3 CC 8B 41 0C C3 CC)
alloc(newmem,$1000,"Alliance.exe"+A1D4A0)

alloc(marker,4)
registersymbol(marker)

label(code)
label(return)

newmem:

code:
mov [marker],rcx

  mov eax,[rcx+0C]
  ret 
  int 3 
  jmp return

INJECT+03:
  jmp code
return:
registersymbol(INJECT)

[DISABLE]

INJECT+03:
  db 8B 41 0C C3 CC

dealloc(marker)
unregistersymbol(marker)
unregistersymbol(INJECT)
dealloc(newmem)"""

