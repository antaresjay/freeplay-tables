[[cheat]]
id = "actioncontroller-base-address-scan-initialization-activate-this-first"
name = "ActionController Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(ActionController_basepointer)
registersymbol(ActionController_update_enable)
registersymbol(ActionController_set_enable)
registersymbol(ActionController_healtharmorset_enable)
registersymbol(ActionController_staminaset_enable)
registersymbol(ActionController_jumpset_enable)
registersymbol(ActionController_durabilityset_enable)
registersymbol(ActionController_resourcesset_enable)

alloc(ActionController_basepointer, 4)
alloc(ActionController_update_enable, 4)
alloc(ActionController_set_enable, 4)
alloc(ActionController_healtharmorset_enable, 4)
alloc(ActionController_staminaset_enable, 4)
alloc(ActionController_jumpset_enable, 4)
alloc(ActionController_durabilityset_enable, 4)
alloc(ActionController_resourcesset_enable, 4)


[DISABLE]
unregistersymbol(ActionController_basepointer)
unregistersymbol(ActionController_update_enable)
unregistersymbol(ActionController_set_enable)
unregistersymbol(ActionController_healtharmorset_enable)
unregistersymbol(ActionController_staminaset_enable)
unregistersymbol(ActionController_jumpset_enable)
unregistersymbol(ActionController_durabilityset_enable)
unregistersymbol(ActionController_resourcesset_enable)

dealloc(ActionController_basepointer)
dealloc(ActionController_update_enable)
dealloc(ActionController_set_enable)
dealloc(ActionController_healtharmorset_enable)
dealloc(ActionController_staminaset_enable)
dealloc(ActionController_jumpset_enable)
dealloc(ActionController_durabilityset_enable)
dealloc(ActionController_resourcesset_enable)"""

[[cheat]]
id = "actioncontroller-base-address-scan-to-activate-play-level-to-update-play-level"
name = "ActionController Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(ActionController_savedAOB)
label(ActionController_returnhere)
label(ActionController_originalcode)
label(ActionController_exit)

label(ActionController_update_exit)
label(ActionController_set_exit)
label(ActionController_healtharmorset_exit)
label(ActionController_staminaset_exit)
label(ActionController_jumpset_exit)
label(ActionController_durabilityset_exit)
label(ActionController_resourcesset_exit)

registersymbol(ActionController_savedAOB)

//04718E69 - C7 85 ECFEFFFF 00000000 - mov [ebp-00000114],00000000
//04718E73 - C7 85 F0FEFFFF 00000000 - mov [ebp-00000110],00000000
// ActionController:Update+5d
//04718E7D - 0FB6 87 05010000      - movzx eax,byte ptr [edi+00000105]
//04718E84 - 85 C0                 - test eax,eax
//04718E86 - 0F85 980E0000         - jne 04719D24
//04718E8C - 0FB6 05 543ECC00      - movzx eax,byte ptr [00CC3E54] : [00]
aobscan(ActionController_searchedAOB, 0F B6 87 05 01 00 00 85 C0)

alloc(ActionController_newmem, 2048, ActionController_searchedAOB)
alloc(ActionController_temp1, 4, ActionController_searchedAOB)
alloc(ActionController_temp2, 4, ActionController_searchedAOB)


ActionController_newmem:
mov [ActionController_temp1], ebx
mov [ActionController_temp2], edx

cmp dword ptr [ActionController_update_enable], #0
je ActionController_update_exit
mov [ActionController_basepointer], edi
ActionController_update_exit:

cmp dword ptr [ActionController_set_enable], #0
je ActionController_set_exit
ActionController_set_exit:

cmp dword ptr [ActionController_healtharmorset_enable], #0
je ActionController_healtharmorset_exit
cmp dword ptr [edi+a0], #0
je ActionController_healtharmorset_exit
mov ebx, [edi+a0]
mov edx, [ebx+74]
mov [ebx+6c], edx
mov edx, [ebx+80]
mov [ebx+7c], edx
ActionController_healtharmorset_exit:

cmp dword ptr [ActionController_staminaset_enable], #0
je ActionController_staminaset_exit
cmp dword ptr [edi+a0], #0
je ActionController_staminaset_exit
mov ebx, [edi+a0]
fild [ebx+78]
fstp [ebx+8c]
ActionController_staminaset_exit:

cmp dword ptr [ActionController_jumpset_enable], #0
je ActionController_jumpset_exit
cmp dword ptr [edi+94], #0
je ActionController_jumpset_exit
mov ebx, [edi+94]
mov [ebx+a8], (float)12
ActionController_jumpset_exit:

cmp dword ptr [ActionController_durabilityset_enable], #0
je ActionController_durabilityset_exit
cmp dword ptr [edi+98], #0
je ActionController_durabilityset_exit
mov ebx, [edi+98]
mov [ebx+8c], #9999999
mov [ebx+94], #9999999
ActionController_durabilityset_exit:

cmp dword ptr [ActionController_resourcesset_enable], #0
je ActionController_resourcesset_exit
cmp dword ptr [edi+a4], #0
je ActionController_durabilityset_exit
mov ebx, [edi+a4]
mov edx, [ebx+64]
mov [ebx+50], edx
mov edx, [ebx+68]
mov [ebx+54], edx
mov edx, [ebx+6c]
mov [ebx+58], edx
mov edx, [ebx+70]
mov [ebx+5c], edx
mov [ebx+60], #9999999
mov [ebx+74], #9999999
mov [ebx+78], (float)9999999
ActionController_resourcesset_exit:

mov ebx, [ActionController_temp1]
mov edx, [ActionController_temp2]


ActionController_originalcode:
db 0F B6 87 05 01 00 00
//movzx eax,byte ptr [edi+00000105]


ActionController_exit:
jmp ActionController_returnhere


ActionController_searchedAOB:
ActionController_savedAOB:
jmp ActionController_newmem
nop
nop
ActionController_returnhere:


[DISABLE]
ActionController_savedAOB:
db 0F B6 87 05 01 00 00
//movzx eax,byte ptr [edi+00000105]

unregistersymbol(ActionController_savedAOB)

dealloc(ActionController_newmem)
dealloc(ActionController_temp1)
dealloc(ActionController_temp2)"""

