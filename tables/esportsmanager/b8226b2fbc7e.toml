[[cheat]]
id = "max-squad-member-health-condition"
name = "Max Squad Member Health Condition"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[enable]
ijmscripts+0:
push r13
push r14
push r15
sub rsp,20

xor r13,r13

@@:
mov r15,ptr_TeamPlayers
mov r15,[r15]
test r15,r15
je ndd
mov r14d,[r15+18]  // _size

@@:
cmp r13,r14
je ndd
mov rcx,[r15+10]  // _items
mov rcx,[rcx+r13*8+20]
test rcx,rcx
lea r13,[r13+1]
je @b
mov rcx,[rcx+$DataUserC.Attributes]
test rcx,rcx
je ndd

mov edx,$AttributeTypeE.Immunity
movss xmm2,[fs]
mov r9d,1
mov r11,"Attributes.SetValue"
call r11
jmp @b


ndd:
add rsp,20
pop r15
pop r14
pop r13
ret

fs:
dd (float)100

[disable]
ijmscripts+0:
ret
nop"""

