newmem:
{$try}
  push rcx
  mov rcx,rbx
  mov rcx,[rcx+250]
  cmp [rcx+534],(float)180
  jne code
  mov rcx,[rbx+200]
  mov rcx,[rcx]
  mov [WayPoint_],rcx
{$except}

code:
  pop rcx
  mov r9,[rbx]
  xor r8d,r8d
