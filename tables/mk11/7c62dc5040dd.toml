type = "script"
source = """
[ENABLE]

aobscanmodule(frimter,MK11.exe,89 91 68 07 00 00) // should be unique
alloc(newmem,$1000,frimter)

label(code)
label(return)

newmem:

code:
  mov edx,[rcx+00000768]
  jmp return

frimter:
  jmp newmem
  nop
return:
registersymbol(frimter)

[DISABLE]

frimter:
  db 89 91 68 07 00 00

unregistersymbol(frimter)
dealloc(newmem)"""
