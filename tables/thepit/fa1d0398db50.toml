[[cheat]]
id = "undying-can-be-activated-immediatly"
name = ">>>>>Undying-Can Be activated Immediatly<<<<<"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Define Code
define(INVUNE,"ThePit.exe")

[ENABLE]
alloc(Nodie,2048,INVUNE)
label(whde)
label(StHtBn)
label(returnhere)
label(originalcode)
label(undying)
label(iKilled)
label(aHltbonus)
registersymbol(Nodie)
registersymbol(iKilled)
registersymbol(aHltbonus)
registersymbol(undying)
aobscan(aob_inv,D9 9E 34 01 00 00 5E)

Nodie:

//Var
iKilled:
dd 1

aHltbonus:
dd 0 //10

whde:
cmp [esi+00000104],0 //Avatar Health Bonus always more then 1
je originalcode
cmp [iKilled],0
je originalcode
// Read Health Bonus, unless i want to change it
push ebx // Need to be here, or push 2 times
cmp [iKilled],2
je StHtBn
mov ebx,[esi+00000104]
mov [aHltbonus],ebx
pop ebx //Here so don't need to push again
push eax
mov eax,[esi+00000130]
mov [esi+00000134],eax
pop eax
jmp returnhere

//Set Health Bonus
StHtBn:
mov ebx,[aHltbonus]
mov [esi+00000104],ebx
pop ebx
mov [iKilled],1 //Done, Now Reset
jmp whde

originalcode:
fstp dword ptr [esi+00000134]
jmp returnhere


aob_inv:
undying:
jmp whde
nop
returnhere:


 
 
[DISABLE]
undying:
db D9 9E 34 01 00 00
unregistersymbol(undying)
unregistersymbol(iKilled)
unregistersymbol(aHltbonus)
unregistersymbol(Nodie)
dealloc(Nodie)
//fstp dword ptr [esi+00000134]
//Alt: db D9 9E 34 01 00 00 - 5E 5D C2 04 00"""

