[[cheat]]
id = "unlimited-stacked-items-timestop"
name = ">>>>>>Unlimited Stacked Items/Timestop<<<<<"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
// Definitions
define(CODE,"ThePit.exe")

[ENABLE]
alloc(MyCode,4096,CODE)
label(noconsume)
label(returnhere)
label(returnhere1)
label(originalcode)
label(originalcode1)
label(lower)
label(increase)
label(fix)
label(used) //aob
label(Aenable1)
label(iStop)
label(aStop)
label(stoptime)
label(sttime)
label(setimer)
registersymbol(MyCode)
registersymbol(used)
registersymbol(Aenable1)
registersymbol(sttime)
registersymbol(iStop)
registersymbol(aStop)
aobscan(aob1,89 46 24 8B 7E 24)
aobscan(aob_stime,40 89 82 AC 00 00 00)

MyCode:

//Var
Aenable1:
dd 0

iStop:
dd 0

aStop:
dd 0

noconsume:
cmp dword ptr [Aenable1],0
je originalcode
cmp dword ptr [Aenable1],2
je increase
cmp dword ptr [Aenable1],2
jg fix
cmp eax,0
je originalcode
push edi
mov edi,[esi+24]
//cmp edi,eax
cmp eax,edi
jl lower
pop edi
jmp originalcode

lower:
pop edi
nop
nop
nop
mov edi,[esi+24]
jmp returnhere

increase:
inc eax
mov dword ptr [Aenable1],1
jmp originalcode

fix:
mov dword ptr [Aenable1],0
jmp originalcode

originalcode:
mov [esi+24],eax
mov edi,[esi+24]
jmp returnhere

// Time Section

stoptime:
cmp [iStop],0
je originalcode1
cmp [iStop],2
je setimer
cmp [iStop],3
je setimer
nop
mov [edx+000000AC],eax
mov [aStop],eax //Write it Down
jmp returnhere1

setimer:
mov eax,[aStop]
dec eax
cmp [iStop],2
je originalcode1
mov [iStop],0
jmp originalcode1


originalcode1:
inc eax
mov [edx+000000AC],eax
mov [aStop],eax //Write it Down
jmp returnhere1


aob1:
used:
jmp noconsume
nop
returnhere:

aob_stime:
sttime:
jmp stoptime
nop
nop
returnhere1:

 
[DISABLE]
used:
db 89 46 24 8B 7E 24
sttime:
db 40 89 82 AC 00 00 00
unregistersymbol(used)
unregistersymbol(Aenable1)
unregistersymbol(sttime)
unregistersymbol(iStop)
unregistersymbol(aStop)
unregistersymbol(MyCode)
dealloc(MyCode)
//------Orig------
//mov [esi+24],eax
//mov edi,[esi+24]
//Alt: db 89 46 24 8B 7E 24
//----Second------
//inc eax
//mov [edx+000000AC],eax
//Alt: db 40 89 82 AC 00 00 00"""

