type = "script"
source = """
// Define the code
define(CODEX,"ThePit.exe")


[ENABLE]
alloc(Extend,$1000,CODEX)
label(nopsicooldown) // Come First
label(nopsicost)
label(recalc)
label(origcool)
label(oricosts)
label(orirecalc)
label(returnhere)
label(returnhere1)
label(returnhere2)
label(iEnablecool)
label(iEnablecost)
label(iEnablext)
label(aExtend)
label(aPsybonus)
label(psclaob) // Cooldown
label(pscsaob) //Cost
label(maxbonus) // Change Max Psy Bonus
label(aob_dur) // Duration
registersymbol(Extend)
registersymbol(psclaob)
registersymbol(pscsaob)
registersymbol(aob_dur)
registersymbol(iEnablecool)
registersymbol(iEnablecost)
registersymbol(iEnablext)
registersymbol(aExtend)
registersymbol(aPsybonus)
aobscan(aob33,89 50 10 8B 97 08 01 00 00) //Colldown
aobscan(aob41,89 87 08 01 00 00 8B 45) //Cost
aobscan(aob_ext1,89 46 14 8B CE 8B D7 8B 01) // Duration

Extend:

//Var
iEnablecool:
dd 1

iEnablecost:
dd 1

iEnablext:
dd 0

aExtend:
dd 64

aPsybonus:
dd 1F4

nopsicooldown:
cmp [iEnablecool],0
je origcool
mov edx,1 //Time Unit 1 is cooldown end
jmp origcool

origcool:
mov [eax+10],edx //What set the cooldown
mov edx,[edi+00000108]
jmp returnhere

nopsicost:
cmp [iEnablecost],0
je oricosts
cmp [iEnablecost],2
je maxbonus
mov [edi+00000108],3E8  //How much psi left
jmp returnhere1

//Change Max Psi Bonus
maxbonus:
push ecx
mov ecx,[aPsybonus]
mov [edi+000001B0],ecx //+A8
pop ecx
mov [iEnablecost],1
jmp nopsicost

oricosts:
mov [edi+00000108],eax
jmp returnhere1


recalc:
cmp [iEnablext],0
je orirecalc
add eax,[aExtend] // How much Extend
jmp orirecalc

orirecalc:
mov [esi+14],eax
mov ecx,esi
jmp returnhere2


aob33:
psclaob:
jmp nopsicooldown
nop
nop
nop
nop
returnhere:

aob41:
pscsaob:
jmp nopsicost
nop
returnhere1:

aob_ext1:
aob_dur:
jmp recalc
returnhere2:
 
 
[DISABLE]
psclaob:
db 89 50 10 8B 97 08 01 00 00
pscsaob:
db 89 87 08 01 00 00
aob_dur:
db 89 46 14 8B CE
unregistersymbol(psclaob)
unregistersymbol(pscsaob)
unregistersymbol(aob_dur)
unregistersymbol(iEnablecool)
unregistersymbol(iEnablecost)
unregistersymbol(iEnablext)
unregistersymbol(aExtend)
unregistersymbol(aPsybonus)
unregistersymbol(Extend)
dealloc(Extend)
//---First-----
//mov [eax+10],edx
//mov edx,[edi+00000108]
//Alt: db 89 50 10 8B 97 08 01 00 00 - 8B DA 8B 4E 04
//---Second----
//mov [edi+00000108],eax
//Alt: db 89 87 08 01 00 00 - 8B 45 F0
//---Third------
//mov [esi+14],eax
//mov ecx,esi
//Alt: db 89 46 14 8B CE - 8B D7 8B 01 8B 40 30 FF 10 89 46 18"""

