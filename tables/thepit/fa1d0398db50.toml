type = "script"
source = """
// Define the code
define(MOVERT,"ThePit.exe")


[ENABLE]
alloc(Movers,$1000,MOVERT)
label(actmov)
label(chmxmov)
label(lockmov)
label(partlockmov)
label(fixer)
label(fixer2)
label(returnhere)
label(returnhere1)
label(originalcode)
label(originalcode1)
label(iActmove)
label(aActomove)
label(iChangemov) // Max Step Enabler
label(aChangemov) // New Max Step
label(wal_aob) // Actual Step Aob
label(mov_aob) // Max Step Aob
registersymbol(Movers)
registersymbol(iActmove)
registersymbol(aActomove)
registersymbol(iChangemov)
registersymbol(aChangemov)
registersymbol(wal_aob)
registersymbol(mov_aob)
aobscan(aobwal,DE E9 D9 5D B4 D9 45 B4)
aobscan(aobmove,D9 9E 74 01 00 00 ?? ?? D9 9E 74 01 00 00)

Movers:

//Var
iActmove:
dd 0

aActomove:
dd 40A00000

iChangemov:
dd 0

aChangemov:
dd 40A00000

actmov:
cmp [iChangemov],2 //Fixer for when not recall Max
je chmxmov
cmp [iActmove],0
je originalcode
cmp [iActmove],2
je lockmov
cmp [iActmove],3
je partlockmov
cmp [iActmove],4
jge fixer
fsubp st(0),st(0) // Do not sub anymore
fstp dword ptr [ebp-4C]
jmp returnhere

lockmov:
fsubp st(0),st(0) // Do not sub anymore
push esi
mov esi,[aActomove]
mov dword ptr [ebp-4C],esi
pop esi
jmp returnhere

partlockmov:
fsubp st(0),st(0) // Do not sub anymore
push esi
mov esi,[aActomove]
mov dword ptr [ebp-4C],esi
pop esi
mov [iActmove],0
jmp returnhere

fixer:
mov [iActmove],0
jmp originalcode

originalcode:
fsubp st(1),st(0)
fstp dword ptr [ebp-4C]
jmp returnhere


chmxmov:
cmp [iChangemov],0
je originalcode1
push ecx
mov ecx,[aChangemov]
mov dword ptr [esi+00000178],ecx
pop ecx
cmp [iChangemov],2 //Return to the right place
je fixer2
cmp [iChangemov],3
je originalcode1
mov [iChangemov],0
jmp originalcode1

originalcode1:
fstp dword ptr [esi+00000174]
jmp returnhere1

fixer2: //Fix strange game propension to ignore commands
mov [iChangemov],0
jmp actmov //Reset and restart, fixed now

aobwal:
wal_aob:
jmp actmov
returnhere:

aobmove:
mov_aob:
jmp chmxmov
nop
returnhere1:


 
 
[DISABLE]
wal_aob:
db DE E9 D9 5D B4
mov_aob:
db D9 9E 74 01 00 00
unregistersymbol(wal_aob)
unregistersymbol(mov_aob)
unregistersymbol(iActmove)
unregistersymbol(aActomove)
unregistersymbol(iChangemov)
unregistersymbol(aChangemov)
unregistersymbol(Movers)
dealloc(Movers)
//Actual Step
//fsubp st(1),st(0)
//fstp dword ptr [ebp-4C]
//ALT: DE E9 D9 5D B4-D9 45 B4
//Max Step
//fstp dword ptr [esi+00000174]
//Alt: db D9 9E 74 01 00 00 - EB 06
//Alt: db D9 9E 74 01 00 00 ?? ?? D9 9E 74 01 00 00"""

