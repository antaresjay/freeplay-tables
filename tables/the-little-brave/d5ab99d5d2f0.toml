[[cheat]]
id = "player-behaviour-ctrl-numpad-1"
name = "Player Behaviour (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : The Little Brave.exe
// Author            : ndck76
// Executable Version: 2019.4.18.4260
// Game Version      : v1.0.0
// Script Date       : 2025-03-05


[ENABLE]

aobscanregion(isready,PlayerBehavior:FixedUpdate,PlayerBehavior:FixedUpdate+300,0FB686xxxx000085xx75xx0Fxxxxxxxxxxxx85xx75xxF3xxxxxxxxxxxxxxF3xxxxxx66xxxxxx66xxxxxx7Axx) //PlayerBehavior:FixedUpdate+bf
alloc(newmem,$1000,isready)
alloc(data,8)
alloc(isreadybkp,7)
registersymbol(data)
registersymbol(isready)
registersymbol(isreadybkp)
label(code)
label(return)

isreadybkp:
  readmem(isready,7)

newmem:
  mov [data],rsi

code:
  readmem(isready,7)
  jmp return

isready:
  jmp newmem
  nop 2
return:

[DISABLE]

isready:
  readmem(isreadybkp,7)

unregistersymbol(*)
dealloc(*)"""

