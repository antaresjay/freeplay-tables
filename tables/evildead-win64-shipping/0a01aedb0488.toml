[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(health_aob,EvilDead-Win64-Shipping.exe,F3 0F 10 48 4C 0F 57 C0 0F 2F C8 76 * 48 8B 83 00 05 00 00) // should be unique
alloc(newmem,$1000,health_aob)

label(code)
label(return)

newmem:
fld [rax+5c]
fst [rax+48]
fstp [rax+4C]
code:
  movss xmm1,[rax+4C]
  jmp return

health_aob:
  jmp newmem
return:
registersymbol(health_aob)

[DISABLE]

health_aob:
  db F3 0F 10 48 4C

unregistersymbol(health_aob)
dealloc(newmem)"""

