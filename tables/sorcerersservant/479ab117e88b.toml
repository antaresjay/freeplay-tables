[[cheat]]
id = "one-hit-kill"
name = "One Hit Kill"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
define(address,Enemy.Damage)
define(bytes,48 83 EC 28 4C 8B C1)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Enemy.Damage)
label(code return)

newmem:
push rsi
mov rsi,[rcx+18]
mov [rsi+2C],#0
pop rsi
jmp code

code:
  sub rsp,28
  mov r8,rcx
  jmp return

address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  db bytes

dealloc(*)"""
