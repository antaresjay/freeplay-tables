teleportmem:
cmp [s_enable],1
je save_coord

cmp [l_enable],1
je load_coord

cmp [u_enable],1
je undo_coord

cmp [_WriteWayPointCoordsToPlayerLocation],1
je WriteWayPointCoordsToPlayerLocation

jmp originalcodeteleport

save_coord:
mov [s_enable],0

movss xmm12,[rax]
movss [x_coord],xmm12
movss xmm12,[rax+04]
movss [z_coord],xmm12
movss xmm12,[rax+08]
movss [y_coord],xmm12

jmp originalcodeteleport

load_coord:
mov [l_enable],0
cmp [z_coord],0
je originalcodeteleport
// Save actual Position (for UNDO TELEPORT) when press LOAD POSiTiON

movss xmm12,[rax]
movss [x_coord_undo],xmm12
movss xmm12,[rax+04]
movss [z_coord_undo],xmm12
movss xmm12,[rax+08]
movss [y_coord_undo],xmm12

// Save actual Position (for UNDO TELEPORT) when press LOAD POSiTiON

movss xmm12,[x_coord]
movss [rax],xmm12
movss xmm12,[z_coord]
movss [rax+04],xmm12
movss xmm12,[y_coord]
movss [rax+08],xmm12

jmp originalcodeteleport

undo_coord:
