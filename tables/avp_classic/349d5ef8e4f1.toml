[[cheat]]
id = "right-click-me-change-script-for-info"
name = "RIGHT CLICK ME -> Change Script for Info"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
Heya boys & gals!

This is my updated version of the Alien VS
Predator 2000 Steam/GOG crossover. I have fixed
some scripts (I've learned a good deal since
I've done the initial release of this table).
Additionaly to the things mentioned below, this
also means deactivating the scripts is less
likely to crash your game.

God Mode Lite means you're almost invulnerable.
Deep pitfalls, extremely damaging projectiles
(predator cannon, missile launcher) might still
kill you.

//Because I'm one lazy bastard some of the unlimited
//ammo codes for the marine don't use 'rounded' values.
//This might also apply to Alien or Predator health and
//energy. Don't worry if the displayed ammo value for the
//pulse rifle spazzes out, I might tweak the script sometime
//to avoid that.

Because I've been a not so lazy bastard lately, I've
tweaked the scripts for the specific weapons and included
a script which should give you unlimited ammo for EVERY
marine weapon.
No more spazzing ammo counters (except for that rascally
skeeter launcer), just clean, nice, "full" values.

The unlimited Grenade Launcher script should still work
for all grenade types.

Tested on two computers with the Steam Alien versus Predator
Classic 2000, build 521880 using the Steam/GOG Cross
Executable.

Thx for reading - Dami0n
}

[ENABLE]
[DISABLE]"""

