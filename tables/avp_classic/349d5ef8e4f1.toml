[[cheat]]
id = "god-mode-lite"
name = "God Mode Lite"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(godmode,AvP_Classic.exe,8B 43 14 8B 75 EC) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov [ebx+14],00C80000
  mov eax,[ebx+14]
  mov esi,[ebp-14]
  jmp return

godmode:
  jmp code
  nop
return:
registersymbol(godmode)

[DISABLE]

godmode:
  db 8B 43 14 8B 75 EC

unregistersymbol(godmode)
dealloc(newmem)

AvP_Classic.exe+BDAB8:
  mov eax,[ebx+14]
  mov esi,[ebp-14]"""

