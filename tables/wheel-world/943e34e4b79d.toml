[[cheat]]
id = "save-data-v3-ctrl-numpad-1"
name = "Save Data V3 (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Wheel World.exe
// Author            : ndck76
// Executable Version: 2022.3.59.28105
// Game Version      : Build.19332258
// Script Date       : 2025-07-25


[ENABLE]

aobscanmodule(coupons,GameAssembly.dll,8Bxxxxxxxxxx488BxxxxxxxxxxE8xxxxxxxx4885xx0F84xxxxxxxx488Bxxxx4885xx0F84xxxxxxxx448B) //Collectibles.GetValue
alloc(newmem,$1000,coupons)
alloc(data2,8)
alloc(couponsbkp,6)
registersymbol(data2)
registersymbol(coupons)
registersymbol(couponsbkp)
label(code)
label(return)

couponsbkp:
  readmem(coupons,6)

newmem:
  mov [data2],rcx

code:
  readmem(coupons,6)
  jmp return

coupons:
  jmp newmem
  nop
return:

[DISABLE]

coupons:
  readmem(couponsbkp,6)

unregistersymbol(*)
dealloc(*)"""

