[[cheat]]
id = "global-base-address-scan-initialization-activate-this-first"
name = "Global Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Global_static_basepointer)
registersymbol(Global_static_update_enable)
registersymbol(Global_static_set_enable)
registersymbol(Global_static_gildedset_enable)

alloc(Global_static_basepointer, 8)
alloc(Global_static_update_enable, 4)
alloc(Global_static_set_enable, 4)
alloc(Global_static_gildedset_enable, 4)


[DISABLE]
unregistersymbol(Global_static_basepointer)
unregistersymbol(Global_static_update_enable)
unregistersymbol(Global_static_set_enable)
unregistersymbol(Global_static_gildedset_enable)

dealloc(Global_static_basepointer)
dealloc(Global_static_update_enable)
dealloc(Global_static_set_enable)
dealloc(Global_static_gildedset_enable)"""

[[cheat]]
id = "global-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Global Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Global_static_savedAOB)
label(Global_static_returnhere)
label(Global_static_originalcode)
label(Global_static_exit)

label(Global_static_update_exit)
label(Global_static_set_exit)
label(Global_static_gildedset_exit)

registersymbol(Global_static_savedAOB)

//15F6C0BE - 48 89 45 F8           - mov [rbp-08],rax
//15F6C0C2 - B8 54ECD702           - mov eax,02D7EC54 : [(float)154.0000]
// MainMenu:UpdatePlayClock+17
//15F6C0C7 - F3 0F10 00            - movss xmm0,[rax]
//15F6C0CB - F3 0F5A C0            - cvtss2sd xmm0,xmm0
//15F6C0CF - 48 8B CD              - mov rcx,rbp
//15F6C0D2 - 48 83 C1 F8           - add rcx,-08
//15F6C0D6 - F2 0F10 C8            - movsd xmm1,xmm0
aobscan(Global_static_searchedAOB, F3 0F 10 00 F3 0F 5A C0 48 8B CD)

alloc(Global_static_newmem, 2048, Global_static_searchedAOB)
alloc(Global_static_temp1, 8, Global_static_searchedAOB)
alloc(Global_static_temp2, 8, Global_static_searchedAOB)
alloc(Global_static_temp3, 8, Global_static_searchedAOB)
alloc(Global_static_temp4, 8, Global_static_searchedAOB)
alloc(Global_static_temp5, 8, Global_static_searchedAOB)


Global_static_newmem:
mov [Global_static_temp1], rax
mov [Global_static_temp2], rbx
mov [Global_static_temp3], rcx
mov [Global_static_temp4], rdx

sub rax, 54

cmp dword ptr [Global_static_update_enable], #0
je Global_static_update_exit
mov [Global_static_basepointer], rax
Global_static_update_exit:

cmp dword ptr [Global_static_set_enable], #0
je Global_static_set_exit
Global_static_set_exit:

cmp dword ptr [Global_static_gildedset_enable], #0
je Global_static_gildedset_exit
mov [rax+1ac], #9999999
Global_static_gildedset_exit:


mov rax, [Global_static_temp1]
mov rbx, [Global_static_temp2]
mov rcx, [Global_static_temp3]
mov rdx, [Global_static_temp4]


Global_static_originalcode:
db F3 0F 10 00 F3 0F 5A C0
//movss xmm0,[rax]
//cvtss2sd xmm0,xmm0


Global_static_exit:
jmp Global_static_returnhere


Global_static_searchedAOB:
Global_static_savedAOB:
jmp Global_static_newmem
nop
nop
nop
Global_static_returnhere:


[DISABLE]
Global_static_savedAOB:
db F3 0F 10 00 F3 0F 5A C0
//movss xmm0,[rax]
//cvtss2sd xmm0,xmm0

unregistersymbol(Global_static_savedAOB)

dealloc(Global_static_newmem)
dealloc(Global_static_temp1)
dealloc(Global_static_temp2)
dealloc(Global_static_temp3)
dealloc(Global_static_temp4)
dealloc(Global_static_temp5)"""

