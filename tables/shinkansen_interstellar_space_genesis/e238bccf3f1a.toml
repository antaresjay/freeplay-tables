id = "colony-base-address-scan-update-exit-view-colony"
name = "Colony Base Address Scan (Update: Exit View Colony)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{$STRICT}
[ENABLE]
aobscanregion(Colony_searchedAOB,Colony:getInfraInc,Colony:getInfraInc+50,F3 0F 10 87 04 01 00 00 F3 0F 5A C0 F2 0F 5A E8 F3 0F 11 6D F0)
registersymbol(Colony_searchedAOB)

alloc(Colony_newmem, $1000, Colony_searchedAOB)

label(Colony_basepointer)
label(Colony_update_enable)
label(Colony_productionset_enable)
label(Colony_infrastructureset_enable)
label(Colony_sizeset_enable)
label(Colony_ruinsset_enable)
registersymbol(Colony_basepointer)
registersymbol(Colony_update_enable)
registersymbol(Colony_productionset_enable)
registersymbol(Colony_infrastructureset_enable)
registersymbol(Colony_sizeset_enable)
registersymbol(Colony_ruinsset_enable)

label(Colony_originalcode)
registersymbol(Colony_originalcode)

label(Colony_max_value)
label(Colony_temp2,Colony_temp3,Colony_temp4)

label(Colony_ruinsset_loop1_entry)
label(Colony_exit)
label(Colony_returnhere)
Colony_newmem:
//rax, r11
mov rax, [rdi+10]  //player_ (Player)
test rax, rax
je Colony_originalcode
 cmp byte ptr [rax+2d0], 1  //isHuman_ (Bool)
 jne Colony_originalcode
  mov [Colony_basepointer], rdi  //Colony (Settlement)

mov [Colony_temp2], rbx
mov [Colony_temp3], rcx
mov [Colony_temp4], rdx

cmp dword ptr [Colony_productionset_enable], 0
je @f
 xor eax, eax
 mov [rdi+130], eax  //rushTimer_
 mov [rdi+134], eax  //rushsDoneNum_
 mov eax, [Colony_max_value]
 mov [rdi+144], eax  //spilledProductionTotalShipConstr_
 mov [rdi+148], eax  //spilledProductionTotalBuildingsConstr_
 mov [rdi+14c], eax  //spilledProductionTotalTerra_
 mov [rdi+150], eax  //spilledProductionTotalEco_
 mov [rdi+154], eax  //spilledProductionTotalInfra_
 mov [rdi+158], eax  //spilledProductionBaseConstr_
@@:

cmp dword ptr [Colony_infrastructureset_enable], 0
je @f
 mov eax, [Colony_max_value]
 mov [rdi+100], eax  //infraBucket_
 mov [rdi+120], #99  //bs_
@@:

cmp dword ptr [Colony_sizeset_enable], 0
je @f
 mov rax, [rdi+18]  //SystemPlanet
 test rax, rax
 je @f
  mov [rax+b0], 4  //size_
  mov [rax+c0], 4  //richness_
  mov [rax+c8], 0  //bombFallout_ (Float)
@@:

cmp dword ptr [Colony_ruinsset_enable], 0
je Colony_exit
 mov rax, [rdi+18]  //sysObj_ (SystemObject)
 test rax, rax
 je Colony_exit
  mov rax, [rax+20]  //discoveries (List[Discovery])
  test rax, rax
  je Colony_exit
   mov rax, [rax+10]
   test rax, rax  //Colony_loop1_base
   je Colony_exit
    mov rdx, [rax+18]
    test rdx, rdx  //Colony_loop1_max
    je Colony_exit
     mov rcx, 0  //Colony_loop1_index
Colony_ruinsset_loop1_entry:
     mov rbx, [rax+rcx*8+20]
     test rbx, rbx
     je @f
      mov [rbx+38], (float)9999.0  //chanceToDiscoverCurrent_ (Float)
      mov rbx, [rbx+28]  //playersWhoAlreadySearchedInOrder_ (List[Player])
      test rbx, rbx
      je @f
       mov [rbx+18], 0  //_size
       mov [rbx+1c], 0  //_version
@@: //Colony_ruinsset_loop1_continue
      inc rcx
      cmp rdx, rcx
      je Colony_exit
       jmp Colony_ruinsset_loop1_entry

Colony_exit: //Colony_ruinsset_loop1_exit
mov rbx, [Colony_temp2]
mov rcx, [Colony_temp3]
mov rdx, [Colony_temp4]

Colony_originalcode:
readmem(Colony_searchedAOB, 8)
//movss xmm0,[rdi+00000104]
jmp Colony_returnhere

Colony_basepointer:
dq 0
Colony_update_enable:
dd 0
Colony_productionset_enable:
dd 0
Colony_infrastructureset_enable:
dd 0
Colony_sizeset_enable:
dd 0
Colony_ruinsset_enable:
dd 0
Colony_max_value:
dd (float)999999999.0
Colony_temp2:
dq 0
Colony_temp3:
dq 0
Colony_temp4:
dq 0


Colony_searchedAOB:
jmp Colony_newmem
nop 3
Colony_returnhere:

[DISABLE]
Colony_searchedAOB:
readmem(Colony_originalcode, 8)
unregistersymbol(Colony_originalcode)
unregistersymbol(Colony_searchedAOB)

