[[cheat]]
id = "game-base-address-scan-update-play-level"
name = "Game Base Address Scan (Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
{$STRICT}
[ENABLE]
aobscanregion(Game_searchedAOB,Game:Update,Game:Update+84,0F B6 86 38 06 00 00 85 C0)
registersymbol(Game_searchedAOB)

alloc(Game_newmem, $1000, Game_searchedAOB)

label(Game_basepointer)
label(Game_researchset_enable)
label(Game_explorationset_enable)
label(Game_treasuryset_enable)
label(Game_cultureset_enable)
label(Game_abilitiesset_enable)
label(Game_moraleset_enable)
label(Game_leadersopinionset_enable)
label(Game_leadersprimaryset_enable)
label(Game_leaderssecondaryset_enable)
registersymbol(Game_basepointer)
registersymbol(Game_researchset_enable)
registersymbol(Game_explorationset_enable)
registersymbol(Game_treasuryset_enable)
registersymbol(Game_cultureset_enable)
registersymbol(Game_abilitiesset_enable)
registersymbol(Game_moraleset_enable)
registersymbol(Game_leadersopinionset_enable)
registersymbol(Game_leadersprimaryset_enable)
registersymbol(Game_leaderssecondaryset_enable)

label(Game_originalcode)
registersymbol(Game_originalcode)

label(Game_temp2,Game_temp3,Game_temp4,Game_temp5,Game_temp6,Game_temp7)

label(Game_abilitiesset_loop1_exit)
label(Game_abilitiesset_loop1_entry)
label(Game_leaders_loop1_exit)
label(Game_leaders_loop1_entry)
label(Game_leaders_loop2_exit)
label(Game_leaders_loop2_entry)
label(Game_leaders_loop3_exit)
label(Game_leaders_loop3_entry)

label(Game_returnhere)
Game_newmem:
//rax, r11
mov rax, [rsi+18]  //currentPlayer_ (Player)
test rax, rax
je Game_originalcode
 cmp byte ptr [rax+2d0], 1  //isHuman_ (Bool)
 jne Game_originalcode
  mov [Game_basepointer], rsi  //Game

mov [Game_temp2], rbx
mov [Game_temp3], rcx
mov [Game_temp4], rdx
mov [Game_temp5], r8
mov [Game_temp6], r9
mov [Game_temp7], r10

cmp dword ptr [Game_researchset_enable], 0
je @f
 mov rax, [rsi+18]
 test rax, rax
 je @f
  mov rax, [rax+a8]  //playerResearchState_ (PlayerResearchState)
  test rax, rax
  je @f
   mov [rax+d0], #9999999  //spilledRPs_ (Int32)
@@:

cmp dword ptr [Game_explorationset_enable], 0
je @f
 mov rax, [rsi+18]
 test rax, rax
 je @f
  mov [rax+2e8], #99  //sectorsCanExploreRemotelyImmediatelyNum_ (Int32)
  mov rax, [rax+a8]  //playerResearchState_ (PlayerResearchState)
  test rax, rax
  je @f
   mov [rax+d8], #50  //remoteExplorationRange_ (Int32)
   mov [rax+dc], #999  //remoteSimultaneousRemoteExplorations_ (Int32)
@@:

cmp dword ptr [Game_treasuryset_enable], 0
je @f
 mov rax, [rsi+18]
 test rax, rax
 je @f
  mov rax, [rax+b0]  //empireState_ (EmpireState)
  test rax, rax
  je @f
   mov [rax+c0], (float)999999999.0  //treasury_ (Float)
@@:

cmp dword ptr [Game_cultureset_enable], 0
je @f
 mov rax, [rsi+18]
 test rax, rax
 je @f
  mov rax, [rax+c0]  //playerSpaceCultureState_ (PlayerSpaceCultureState)
  test rax, rax
  je @f
   mov [rax+40], 0  //perkPickState_ (PerkPickState)
   mov [rax+44], (float)9999999.0  //SCPs_ (Float)
@@:

cmp dword ptr [Game_moraleset_enable], 0
je @f
 mov rax, [rsi+18]
 test rax, rax
 je @f
  mov rax, [rax+18]  //race_ (Race)
  test rax, rax
  je @f
   mov [rax+15c], (float)0.01  //basePopGrowth_ (Float)
   mov [rax+160], (float)150.0  //baseMorale_ (Float)
@@:

cmp dword ptr [Game_abilitiesset_enable], 0
je Game_abilitiesset_loop1_exit
 mov rax, [rsi+18]  //Player
 test rax, rax
 je Game_abilitiesset_loop1_exit
  mov rax, [rax+20]  //uniqueAbilities_ (List[UniqueAbility])
  test rax, rax
  je Game_abilitiesset_loop1_exit
   mov rax, [rax+10]
   test rax, rax  //Game_loop1_base
   je Game_abilitiesset_loop1_exit
    mov rdx, [rax+18]  //total slots
    test rdx, rdx  //Game_loop1_max
    je Game_abilitiesset_loop1_exit
     mov rcx, 0  //Game_loop1_index
Game_abilitiesset_loop1_entry:
     mov rbx, [rax+rcx*8+20]  //select slot
     test rbx, rbx
     je @f
      mov [rbx+60], 2  //state_ (UniqueAbilityState)
      mov [rbx+70], 0  //turnsToBeReady_ (Int32)
@@: //Game_abilitiesset_loop1_continue:
     inc rcx
     cmp rdx, rcx
     je Game_abilitiesset_loop1_exit
      jmp Game_abilitiesset_loop1_entry
Game_abilitiesset_loop1_exit:

xor eax,eax
cmp [Game_leadersopinionset_enable], eax
jne @f
 cmp [Game_leadersprimaryset_enable], eax
 jne @f
  cmp [Game_leaderssecondaryset_enable], eax
  jne @f
   jmp Game_leaders_loop1_exit
@@:
 mov rax, [rsi+18]  //currentPlayer_ (Player)
 test rax, rax
 je Game_leaders_loop1_exit
  mov rax, [rax+b8]  //playerLeadersState_ (PlayerLeadersState)
  test rax, rax
  je Game_leaders_loop1_exit
   mov rax, [rax+18]  //pLeaders_ (List[PlayerLeader])
   test rax, rax
   je Game_leaders_loop1_exit
    mov rax, [rax+10]
    test rax, rax  //Game_loop1_base
    je Game_leaders_loop1_exit
     mov rdx, [rax+18]
     test rdx, rdx  //Game_loop1_max
     je Game_leaders_loop1_exit
      mov rcx, 0  //Game_loop1_index
Game_leaders_loop1_entry:
      mov rbx, [rax+rcx*8+20]
      test rbx, rbx
      je Game_leaders_loop3_exit

       cmp dword ptr [Game_leadersopinionset_enable], 0
       je @f
        mov [rbx+60], 0  //salary_ (Float)
        mov [rbx+64], #999  //opinion_ (Int32)
@@: //Game_leaders_inner_loop_Start

       mov rbx, [rbx+18]  //leader_ (Leader)
       test rbx, rbx
       je Game_leaders_loop3_exit

        cmp dword ptr [Game_leadersprimaryset_enable], 0
        je Game_leaders_loop2_exit
         mov r11, [rbx+40]  //leaderPrimSkillsList_ (List[PrimarySkill])
         test r11, r11
         je Game_leaders_loop2_exit
          mov r11, [r11+10]
          test r11, r11  //Game_loop2_base
          je Game_leaders_loop2_exit
           mov r10, [r11+18]
           test r10, r10  //Game_loop2_max
           je Game_leaders_loop2_exit
            mov r9, 0 //Game_loop2_index
Game_leaders_loop2_entry:
            mov r8, [r11+r9*8+20]
            test r8, r8
            je @f
             mov [r8+30], 9  //skillLevel_ (Int32)
@@: //Game_leaders_loop2_continue:
            inc r9
            cmp r10, r9
            je Game_leaders_loop2_exit
             jmp Game_leaders_loop2_entry
Game_leaders_loop2_exit:

        cmp dword ptr [Game_leaderssecondaryset_enable], 0
        je Game_leaders_loop3_exit
         mov r11, [rbx+48]  //leaderSecSkillsList_ (List[LeaderSecondarySkill])
         test r11, r11
         je Game_leaders_loop3_exit
          mov r11, [r11+10]
          test r11, r11  //Game_loop3_base
          je Game_leaders_loop3_exit
           mov r10, [r11+18]
           test r10, r10  //Game_loop3_max
           je Game_leaders_loop3_exit
            mov r9, 0  //Game_loop3_index
Game_leaders_loop3_entry:
            mov r8, [r11+r9*8+20]
            test r8, r8
            je @f
             mov [r8+20], 2  //level_ (SkillLevel)
@@: //Game_leaders_loop3_continue:
            inc r9
            cmp r10, r9
            je Game_leaders_loop3_exit
             jmp Game_leaders_loop3_entry
Game_leaders_loop3_exit: //Game_leaders_loop1_continue:

      inc rcx
      cmp rdx, rcx
      je Game_leaders_loop1_exit
       jmp Game_leaders_loop1_entry
Game_leaders_loop1_exit:

mov rbx, [Game_temp2]
mov rcx, [Game_temp3]
mov rdx, [Game_temp4]
mov r8, [Game_temp5]
mov r9, [Game_temp6]
mov r10, [Game_temp7]

Game_originalcode:
readmem(Game_searchedAOB, 7)  //movzx eax,byte ptr [rsi+00000638]

jmp Game_returnhere

Game_basepointer:
dq 0
Game_researchset_enable:
dd 0
Game_explorationset_enable:
dd 0
Game_treasuryset_enable:
dd 0
Game_cultureset_enable:
dd 0
Game_abilitiesset_enable:
dd 0
Game_moraleset_enable:
dd 0
Game_leadersopinionset_enable:
dd 0
Game_leadersprimaryset_enable:
dd 0
Game_leaderssecondaryset_enable:
dd 0
Game_temp2:
dq 0
Game_temp3:
dq 0
Game_temp4:
dq 0
Game_temp5:
dq 0
Game_temp6:
dq 0
Game_temp7:
dq 0


Game_searchedAOB:
jmp Game_newmem
nop
nop
Game_returnhere:

[DISABLE]
Game_searchedAOB:
readmem(Game_originalcode, 7)
unregistersymbol(Game_searchedAOB)

unregistersymbol(Game_basepointer)
unregistersymbol(Game_researchset_enable)
unregistersymbol(Game_explorationset_enable)
unregistersymbol(Game_treasuryset_enable)
unregistersymbol(Game_cultureset_enable)
unregistersymbol(Game_abilitiesset_enable)
unregistersymbol(Game_moraleset_enable)
unregistersymbol(Game_leadersopinionset_enable)
unregistersymbol(Game_leadersprimaryset_enable)
unregistersymbol(Game_leaderssecondaryset_enable)
unregistersymbol(Game_originalcode)

dealloc(Game_newmem)
{
Game:Update
+00- 55                    - push rbp
+01- 48 8B EC              - mov rbp,rsp
+04- 48 83 EC 30           - sub rsp,30
+08- 48 89 75 F8           - mov [rbp-08],rsi
+0c- 48 8B F1              - mov rsi,rcx

//+0f- 0FB6 86 38060000      - movzx eax,byte ptr [rsi+00000638]  //wroteDefaultConfigFile_
+16- 85 C0                 - test eax,eax

+18- 74 41                 - je +5b
+1a- F3 0F10 05 6E000000   - movss xmm0,[+90]  //(float)1.50
+22- F3 0F5A C0            - cvtss2sd xmm0,xmm0
+26- 48 8B CE              - mov rcx,rsi
+29- F2 0F10 C8            - movsd xmm1,xmm0
+2d- F2 0F5A C9            - cvtsd2ss xmm1,xmm1
+31- 48 8D 64 24 00        - lea rsp,[rsp+00]
+36- 49 BB 90C6019AAC010000 - mov r11,Game:adjustGraphicsQualityAutomatically
+40- 41 FF D3              - call r11
+43- 48 8B D0              - mov rdx,rax
+46- 48 8B CE              - mov rcx,rsi
+49- 48 8D 64 24 00        - lea rsp,[rsp+00]
+4e- 49 BB 40E35D95AC010000 - mov r11,UnityEngine:MonoBehaviour:StartCoroutine
}"""

