[[cheat]]
id = "score-editor-ctrl-numpad-2-score-to-populate-value"
name = "Score Editor (Ctrl + Numpad 2) {Score to populate value}"
category = "game"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Castle_of_shikigami3.exe
// Author            : ndck76
// Game Version      : Build.17586011
// Script Date       : 2025-03-18


[ENABLE]

aobscanmodule(score,Castle_of_shikigami3.exe,89xxxxxxxxxx5B5DC2xxxx558BxxFF) // should be unique
alloc(newmem,$1000)
alloc(data3,8)
alloc(scorebkp,6)
registersymbol(data3)
registersymbol(score)
registersymbol(scorebkp)
label(code)
label(return)

scorebkp:
  readmem(score,6)

newmem:
  mov [data3],ecx

code:
  readmem(score,6)
  jmp return

score:
  jmp newmem
  nop
return:

[DISABLE]

score:
  readmem(scorebkp,6)

unregistersymbol(*)
dealloc(*)"""

