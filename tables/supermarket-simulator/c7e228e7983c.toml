[[cheat]]
id = "store-data-hover-open-closed-sign"
name = "→ Store Data (Hover Open/Closed Sign)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,StoreStatus:get_m_IsOpen+27)
define(bytes,0F B6 80 D0 00 00 00)

[ENABLE]
//Send@FearlessRevolution|Sintrix
assert(address,bytes)
alloc(newmem,$1000,StoreStatus:get_m_IsOpen+27)
registersymbol(storeprogress)
label(code return storeprogress)

newmem:
mov [storeprogress],rax

code:
  movzx eax,byte ptr [rax+000000D0]
  jmp return

storeprogress:
dw

address:
  jmp newmem
  nop 2
return:

[DISABLE]

address:
  db bytes

  unregistersymbol(*)
  dealloc(*)"""

