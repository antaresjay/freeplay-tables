[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(health,LunaAbyss-Win64-Shipping.exe,F3 0F 10 81 F8 05 00 00 C3)
alloc(newmem,$1000,health)
label(code return)

newmem:
mov [rcx+5F8],(float)500

code:
  movss xmm0,[rcx+000005F8]
  jmp return

health:
  jmp newmem
  nop 3
return:
registersymbol(health)

[DISABLE]

health:
  db F3 0F 10 81 F8 05 00 00

unregistersymbol(*)
dealloc(*)"""

