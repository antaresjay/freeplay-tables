  Author : R_X
}

[ENABLE]

aobscanmodule(pBase,LunaAbyss-Win64-Shipping.exe,48 8B 01 48 89 5C 24 20 FF 90 80) // should be unique
alloc(newmem,$1000,pBase)
alloc(base,8)

label(code)
label(return)

base:
dq 0

newmem:

code:
  mov [base],rcx
  mov rax,[rcx]
