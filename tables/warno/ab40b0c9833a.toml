{ Game   : WARNO.exe
  Version: v130507
  Date   : 2024-09-01
  Author : Administrator

  This script does blah blah blah
}

[ENABLE]
aobscanmodule(CmdPtsAOB,$process,44 0F 28 C2 44 8B FA) // should be unique
