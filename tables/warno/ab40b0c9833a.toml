alloc(PtrToCommandPts,8,CmdPtsAOB)

label(code1)
label(return)
label(newmem2)
label(cleanup)
label(loopingChk)

registersymbol(PtrToCommandPts)

newmem1:
  movaps xmm8,xmm2   // original code
  mov r15d,edx       // original code
  push rdi
  push rcx
  push rax
  pushfq
  mov rdi,PlayerManualDeployAOB
  xor rax,rax

loopingChk:         // check the stack for presence of PlayerManualDeployAOB, up to rsp+0xA00
