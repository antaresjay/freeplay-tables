define(address,Abrakam.Overworld.Inks:ConsumableService:UseConsumable)
define(bytes,55 48 8B EC 48 81 EC **)

[ENABLE]

assert(address,bytes)
alloc(newmem,$200,Abrakam.Overworld.Inks:ConsumableService:UseConsumable)

alloc(origConsume,11)
registersymbol(origConsume)

origConsume:
readmem(address,11)

label(code)
label(done)
label(return)

newmem:

code:
  //push rbp
  //mov rbp,rsp
  //sub rsp,**
  readmem(address,11)
  push rax
  push rbx
  push rsi

  xor rbx,rbx
  mov rsi,8
  mov rax,20
  mov ebx,edx // rdx = slot index
  imul rbx,rsi // index * 8 to get the correct pointer
  add rbx,rax // +20 (slot 0) + index
  mov rsi,[rcx+18] // runDataService
  test rsi, rsi
  jz done
  mov rsi,[rsi+60] // loadedRun
  test rsi, rsi
  jz done
  mov rsi,[rsi+60] // consumeables
  test rsi, rsi
  jz done
  mov rsi,[rsi+10] // items
  test rsi, rsi
  jz done
  mov rsi,[rsi+rbx] // item Slot ID
  test rsi, rsi
  jz done
  mov rsi,[rsi+20] // count
  test rsi, rsi
  jz done
  mov dword ptr[rsi+18],#99 // value

done:
  pop rsi
  pop rbx
  pop rax
  jmp return

address:
  jmp!near newmem; 00 00* 55
  nop 6
return:

[DISABLE]

address:
  readmem(origConsume,11)
unregistersymbol(*)
dealloc(*)

