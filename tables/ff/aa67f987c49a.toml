[[cheat]]
id = "hit-anywhere-both-players"
name = "Hit Anywhere Both Players"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
//0F 84 5C 06 00 00 8B 85 D0 08 00 00 85 C0 0F 85 88 03 00 00 8B 44 24 1C
label(HitAnywhere) //Create Label
registersymbol(HitAnywhere) //Register Symbol for Label
aobscan(HookHit, 0F 84 5C 06 00 00 8B 85 D0 08 00 00 85 C0 0F 85 88 03 00 00 8B 44 24 1C) //Find Hook

HookHit:
HitAnywhere:
db 90 90 90 90 90 90 //Nop JE

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
HitAnywhere:
db 0F 84 5C 06 00 00 //Restore JE

unregistersymbol(HitAnywhere) //Unregister Symbol"""
