type = "script"
source = """
[ENABLE]
//Send@FearlessRevolution|Sintrix
aobscanmodule(jumpcount,CaveGame-Win64-Shipping.exe,8B 83 64 04 00 00 39 83 6C)
alloc(newmem,$1000,jumpcount)

label(code)
label(return)

newmem:
