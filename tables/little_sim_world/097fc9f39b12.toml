type = "script"
source = """
[ENABLE]

aobscanmodule(ppppp,GameAssembly.dll,48 8B 10 48 8B 82 88 01 00 00 48 8B 92 90 01 00 00 48 8B CF FF D0 F3)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
  mov [rax+58], (float)100.0
code:
  mov rdx,[rax]
  mov rax,[rdx+00000188]
  mov rdx,[rdx+00000190]
  jmp return

ppppp:
  jmp far newmem
  nop
  nop
  nop
return:
registersymbol(ppppp)

[DISABLE]

ppppp:
  db 48 8B 10 48 8B 82 88 01 00 00 48 8B 92 90 01 00 00

unregistersymbol(ppppp)
dealloc(newmem)"""
