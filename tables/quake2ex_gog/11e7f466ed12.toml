[[cheat]]
id = "unli-ammo-nades"
name = "unli_ammo_nades"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(ammo_nades,game_x64.dll,43 8B 94 81 80 0A 00 00)
alloc(newmem,$1000,ammo_nades)
label(code)
label(return)
newmem:
  mov [r9+r8*4+A80],#201
code:
  mov edx,[r9+r8*4+A80]
  jmp return
ammo_nades:
  jmp newmem
  nop 3
return:
registersymbol(ammo_nades)
[DISABLE]
ammo_nades:
  db 43 8B 94 81 80 0A 00 00
unregistersymbol(ammo_nades)
dealloc(newmem)"""

