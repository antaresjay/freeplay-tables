[[cheat]]
id = "run-state"
name = "Run State"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Spiritfall.exe
  Version:
  Date   : 2023-04-03
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanregion(pData_RunState,Product.RunState:EarnRunCurrency,Product.RunState:EarnRunCurrency+100,49 63 97 24 01 00 00) // should be unique
alloc(newmem,$1000,pData_RunState)

alloc(pBase_RunState,8)
registersymbol(pBase_RunState)

label(code)
label(return)

pBase_RunState:
dd

newmem:

code:
  mov [pBase_RunState],r15
  movsxd  rdx,dword ptr [r15+00000124]
  jmp return

pData_RunState:
  jmp newmem
  nop 2
return:
registersymbol(pData_RunState pBase_RunState)

[DISABLE]

pData_RunState:
  db 49 63 97 24 01 00 00

unregistersymbol(*)
dealloc(*)"""

