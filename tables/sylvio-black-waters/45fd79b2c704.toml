[[cheat]]
id = "shoot-gun-ctrl-numpad-2"
name = "Shoot Gun (Ctrl + Numpad 2)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Sylvio Black Waters.exe
// Author            : ndck76
// Executable Version: 2020.3.24.51085
// Game Version      : v1.0.32
// Script Date       : 2026-05-09


[ENABLE]

aobscanregion(playeractions,ShootGun:Update,ShootGun:Update+1000,488B80xxxx000048xxxx83xxxx66xx49BBxxxxxxxxxxxx000041xxxx85xx0Fxxxxxxxxxx48xxxxxxxxxxxx48xxxx83xxxx48xxxxxxxx90) //ShootGun:Update+28
alloc(newmem,$1000,playeractions)
alloc(data2,8)
alloc(playeractionsbkp,7)
registersymbol(data2)
registersymbol(playeractions)
registersymbol(playeractionsbkp)
label(code)
label(return)

playeractionsbkp:
  readmem(playeractions,7)

newmem:
  mov [data2],rsi

code:
  readmem(playeractions,7)
  jmp return

playeractions:
  jmp newmem
  nop 2
return:

[DISABLE]

playeractions:
  readmem(playeractionsbkp,7)

unregistersymbol(*)
dealloc(*)"""

