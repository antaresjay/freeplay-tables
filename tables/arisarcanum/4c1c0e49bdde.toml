name = "One Hit Kill (Ctrl + Numpad 1)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
define(address,Npc:TakeDamage+266)
define(bytes,48 63 4E 48 4C 8B 85 E0 FE FF FF)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,Npc:TakeDamage+266)

label(code)
label(return)

newmem:

code:
  mov [rsi+48],0
  mov r8,[rbp-00000120]
  jmp return

address:
  jmp newmem
  nop 6
return:

[DISABLE]

address:
  db bytes
  // movsxd  rcx,dword ptr [rsi+48]
  // mov r8,[rbp-00000120]

dealloc(newmem)"""
