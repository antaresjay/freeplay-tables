[[cheat]]
id = "game-save-data-ctrl-numpad-1-open-main-goal-menu-to-populate-values"
name = "Game Save Data (Ctrl + Numpad 1) {Open 'Main Goal' menu to populate values}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Mika.exe
// Author            : ndck76
// Executable Version: 2021.3.41.23198
// Game Version      : Build.15448465 (Early Access)
// Script Date       : 2024-08-24


[ENABLE]

aobscanregion(packages,Chibig.Mika.DataService:TryGetPackageState,Chibig.Mika.DataService:TryGetPackageState+200,488B40xx48xxxx48xxxxxx48xxxx4Cxxxx83xxxx48xxxxxxxx49BBxxxxxxxxxxxx0000) //Chibig.Mika.DataService:TryGetPackageState+135
alloc(newmem,$1000,packages)
alloc(data2,8)
alloc(packagesbkp,7)
registersymbol(data2)
registersymbol(packages)
registersymbol(packagesbkp)
label(code)
label(return)

packagesbkp:
  readmem(packages,7)

newmem:
  mov [data2],rax

code:
  readmem(packages,7)
  jmp return

packages:
  jmp newmem
  nop 2
return:

[DISABLE]

packages:
  readmem(packagesbkp,7)

unregistersymbol(*)
dealloc(newmem)"""

