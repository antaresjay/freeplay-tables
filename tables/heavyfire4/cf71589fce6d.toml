[[cheat]]
id = "god-mode"
name = "God Mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// hp value range: 0 (full) to 20 (death, default)
[ENABLE]
alloc(MyCode,2048)
label(_ret)
label(_org)
label(_end)

MyCode:

_org:
 add [eax+ebp+00000488],#0

_end:
 jmp _ret

"HeavyFire4.exe"+BE472:
 jmp MyCode
 nop
 nop
_ret:

[DISABLE]
"HeavyFire4.exe"+BE472:
 db 01 94 28 88 04 00 00
dealloc(MyCode)"""

