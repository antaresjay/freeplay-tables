    jne @f
      cvtsi2ss xmm15,[rbx+48]
      jmp NBROTR03_o_code
    @@:
    mulss xmm14,[NBROTR03_flt+04]
    mulss xmm15,[NBROTR03_flt+04]
    jmp NBROTR03_o_code
