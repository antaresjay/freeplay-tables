[[cheat]]
id = "infinite-ammo-ctrl-numpad-2-pellets-shuriken-etc"
name = "Infinite Ammo (Ctrl + Numpad 2) {Pellets, shuriken, etc}"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(ammo,Ronin.exe,8Bxxxx89xxxx488Dxxxxxxxxxx488Dxxxxxxxxxx4438) // should be unique
alloc(newmem,$1000,ammo)
alloc(ammobkp,6)
registersymbol(ammo)
registersymbol(ammobkp)
label(code)
label(return)

ammobkp:
  readmem(ammo,6)

newmem:
  mov [rax+04],(int)99

code:
  readmem(ammo,6)
  jmp return

ammo:
  jmp newmem
  nop
return:

[DISABLE]

ammo:
  readmem(ammobkp,6)

unregistersymbol(*)
dealloc(*)"""
