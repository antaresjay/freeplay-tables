// Set your preferred default values below. //
//////////////////////////////////////////////
bEnableMinEnergyLevel:
dd 1
fMinEnergyLevel:
dd (float)0.2
bEnableMinAmmoLevel:
dd 1
fMinAmmoLevel:
dd (float)0.25
bEnableMinACAmmoLevel:
dd 1
fMinACAmmoLevel:
dd (float)0.25
bEnableMinAmpGemLevel:
dd 1
fMinAmpGemLevel:
dd (float)2.0
bEnableMinMaterials:
dd 1
iMinMaterials:
dd (int)25
//////////////////////////////////////////////
// Set your preferred default values above. //
//////////////////////////////////////////////

lblGameGrabber:
cmp qword ptr [pGame],rcx
je short lblGameGrabberSkip
mov qword ptr [pGame],rcx
lblGameGrabberSkip:
readmem(aobGameGrabber,7)
jmp lblGameGrabberRet
aobGameGrabber_i:
readmem(aobGameGrabber,7)
align 8 CC
pGame:
dq 0
iGameUpgradesOffset:
readmem(aobGameUpgradesOffset+02,4)
dd 0
iUnitEnemyOffset:
readmem(aobUnitEnemyOffset+03,1)
db 0
dw 0
dd 0
iUnitAmmoOffset:
readmem(aobUnitAmmoOffset+04,1)
db 0
dw 0
dd 0

lblEnergyReader:
readmem(aobEnergyReader,8)
cmp dword ptr [bEnableMinEnergyLevel],1
jne short lblEnergyReaderSkip
movsxd r10,[aobEnergyReader_i+04]
movss xmm4,[rdi+r10-04]
mulss xmm4,[fMinEnergyLevel]
comiss xmm0,xmm4
jz short lblEnergyReaderSkip
jnc short lblEnergyReaderSkip
movss xmm0,xmm4
movss [rdi+r10],xmm0
lblEnergyReaderSkip:
jmp lblEnergyReaderRet
aobEnergyReader_i:
readmem(aobEnergyReader,8)

lblUnitUpdater:
readmem(aobUnitUpdater,7)
pushfq
jne short lblUnitUpdaterSkip
movsx r10,[iUnitEnemyOffset]
cmp byte ptr [rbx+r10],0
jne lblUnitUpdaterSkip
mov r10,[rbx+48]
test r10,r10
jz lblUnitUpdaterSkip
cmp dword ptr [r10+10],9
jne short @f
mov r11,0x6C006C0075004E
cmp qword ptr [r10+14],r11
je lblUnitUpdaterSkip
@@:
cmp dword ptr [bEnableMinAmmoLevel],1
jne short @f
movsx r10,[iUnitAmmoOffset]
movss xmm4,[rbx+r10-04]
movss xmm5,[rbx+r10]
mulss xmm4,[fMinAmmoLevel]
comiss xmm5,xmm4
jz short @f
jnc short @f
movss [rbx+r10],xmm4
@@:
cmp dword ptr [bEnableMinACAmmoLevel],1
jne short @f
movsx r10,[iUnitAmmoOffset]
movss xmm4,[rbx+r10+04]
movss xmm5,[rbx+r10+08]
mulss xmm4,[fMinACAmmoLevel]
comiss xmm5,xmm4
jz short @f
jnc short @f
movss [rbx+r10+08],xmm4
@@:
