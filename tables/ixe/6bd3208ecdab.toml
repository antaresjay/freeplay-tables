// Created with      : customAOBInjectionTemplates version: 1.3.11
[ENABLE]
aobscanmodule(aobGameGrabber,GameAssembly.dll,80 B9 ?? ?? 00 00 00 74 ?? 32 C0 C3 0F B6 81)
aobscanmodule(aobGameUpgradesOffset,GameAssembly.dll,83 B8 ?? ?? 00 00 00 7E ?? 48 8B 4B)
aobscanmodule(aobUnitEnemyOffset,GameAssembly.dll,0F B6 40 ?? 88 84 24 ?? ?? 00 00 48 8B 46 ?? 48 85 C0)
aobscanmodule(aobUnitAmmoOffset,GameAssembly.dll,F3 0F 58 4E ?? F3 0F 10 46 ?? F3 41 ?? ?? ?? 0F 2F)
aobscanmodule(aobEnergyReader,GameAssembly.dll,F3 0F 10 87 ?? ?? 00 00 0F 2F 87 ?? ?? 00 00 76)
aobscanmodule(aobUnitUpdater,GameAssembly.dll,80 BB ?? ?? 00 00 00 0F 85 ?? ?? 00 00 80 BB ?? ?? 00 00 00 48 89 7C 24 ?? 0F 84 ?? ?? 00 00)
aobscanmodule(aobAmpGemChecker,GameAssembly.dll,83 B8 ?? ?? 00 00 00 7E 29 48 8B 4B ?? 48 85 C9)
aobscanmodule(aobMaterialsReader,GameAssembly.dll,0F B6 CA 3B 48 ?? 73 0F 8B 44 88 20 48 83 C4)

alloc(newmemGameGrabber,4096,aobGameGrabber)

label(aobGameGrabber_r)
label(aobGameGrabber_i)
registersymbol(aobGameGrabber_r)
registersymbol(aobGameGrabber_i)

label(lblGameGrabber)
