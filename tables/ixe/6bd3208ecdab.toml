popfq
jmp lblUnitUpdaterRet
aobUnitUpdater_i:
readmem(aobUnitUpdater,7)

lblAmpGemChecker:
readmem(aobAmpGemChecker,7)
pushfq
cmp dword ptr [bEnableMinAmpGemLevel],1
jne short lblAmpGemCheckerSkip
movsxd r10,[aobAmpGemChecker_i+02]
mov r11d,[rax+r10+04]
cmp r11d,1
jl short lblAmpGemCheckerSkip
cvtsi2ss xmm4,r11d
cvtsi2ss xmm5,[rax+r10]
mulss xmm4,[fMinAmpGemLevel]
comiss xmm4,xmm5
jz short lblAmpGemCheckerSkip
jc short lblAmpGemCheckerSkip
cvtss2si r11d,xmm4
mov dword ptr [rax+r10],r11d
lblAmpGemCheckerSkip:
popfq
jmp lblAmpGemCheckerRet
aobAmpGemChecker_i:
readmem(aobAmpGemChecker,7)

lblMaterialsReader:
cmp dword ptr [bEnableMinMaterials],1
jne short lblMaterialsReaderSkip
cmp dword ptr [rax+rcx*4+20],(int)10
jle short lblMaterialsReaderSkip
mov r10d,[iMinMaterials]
cmp dword ptr [rax+rcx*4+20],r10d
jge short lblMaterialsReaderSkip
mov dword ptr [rax+rcx*4+20],r10d
lblMaterialsReaderSkip:
readmem(aobMaterialsReader+08,8)
jmp lblMaterialsReaderRet
aobMaterialsReader_i:
readmem(aobMaterialsReader+08,8)

aobMaterialsReader+08:
aobMaterialsReader_r:
jmp lblMaterialsReader
nop 3
lblMaterialsReaderRet:

aobAmpGemChecker:
aobAmpGemChecker_r:
jmp lblAmpGemChecker
nop 2
lblAmpGemCheckerRet:

aobUnitUpdater:
aobUnitUpdater_r:
jmp lblUnitUpdater
nop 2
lblUnitUpdaterRet:

aobEnergyReader:
aobEnergyReader_r:
jmp lblEnergyReader
nop 3
lblEnergyReaderRet:

aobGameGrabber:
aobGameGrabber_r:
jmp lblGameGrabber
nop 2
lblGameGrabberRet:

[DISABLE]
aobGameGrabber_r:
readmem(aobGameGrabber_i,7)

aobEnergyReader_r:
readmem(aobEnergyReader_i,8)

aobUnitUpdater_r:
readmem(aobUnitUpdater_i,7)

aobAmpGemChecker_r:
readmem(aobAmpGemChecker_i,7)

aobMaterialsReader_r:
readmem(aobMaterialsReader_i,8)

unregistersymbol(*)
dealloc(*)"""

