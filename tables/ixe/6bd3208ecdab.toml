registersymbol(iGameUpgradesOffset)
registersymbol(iUnitEnemyOffset)
registersymbol(iUnitAmmoOffset)

label(aobEnergyReader_r)
label(aobEnergyReader_i)
registersymbol(aobEnergyReader_r)
registersymbol(aobEnergyReader_i)

label(lblEnergyReader)
label(lblEnergyReaderSkip)
label(lblEnergyReaderRet)

label(bEnableMinEnergyLevel)
label(fMinEnergyLevel)
registersymbol(bEnableMinEnergyLevel)
registersymbol(fMinEnergyLevel)

label(aobUnitUpdater_r)
label(aobUnitUpdater_i)
registersymbol(aobUnitUpdater_r)
registersymbol(aobUnitUpdater_i)

label(lblUnitUpdater)
label(lblUnitUpdaterSkip)
label(lblUnitUpdaterRet)

label(bEnableMinAmmoLevel)
label(fMinAmmoLevel)
label(bEnableMinACAmmoLevel)
label(fMinACAmmoLevel)
registersymbol(bEnableMinAmmoLevel)
registersymbol(fMinAmmoLevel)
registersymbol(bEnableMinACAmmoLevel)
registersymbol(fMinACAmmoLevel)

label(aobAmpGemChecker_r)
label(aobAmpGemChecker_i)
registersymbol(aobAmpGemChecker_r)
registersymbol(aobAmpGemChecker_i)

label(lblAmpGemChecker)
label(lblAmpGemCheckerSkip)
label(lblAmpGemCheckerRet)

label(bEnableMinAmpGemLevel)
label(fMinAmpGemLevel)
registersymbol(bEnableMinAmpGemLevel)
registersymbol(fMinAmpGemLevel)

