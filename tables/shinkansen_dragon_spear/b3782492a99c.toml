[[cheat]]
id = "gameworld-base-address-scan-initialization-activate-this-first-to-activate-play-level"
name = "GameWorld Base Address Scan Initialization (Activate This First, To Activate: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(GameWorld_basepointer)
registersymbol(GameWorld_update_enable)
registersymbol(GameWorld_set_enable)
registersymbol(GameWorld_hpset_enable)
registersymbol(GameWorld_mpset_enable)
registersymbol(GameWorld_cooldownset_enable)
registersymbol(GameWorld_apset_enable)
registersymbol(GameWorld_timeset_enable)

//053AEAC5 - E8 BE15FFFF           - call 053A0088
//053AEACA - 83 C4 10              - add esp,10
// BossMonster:Gameworld:Update+65
//053AEACD - 8B 87 88000000        - mov eax,[edi+00000088]
//053AEAD3 - 8D 4D C4              - lea ecx,[ebp-3C]
//053AEAD6 - 83 EC 08              - sub esp,08
//053AEAD9 - 50                    - push eax
//053AEADA - 51                    - push ecx
//053AEADB - 39 00                 - cmp [eax],eax
//053AEADD - E8 16860000           - call 053B70F8
//053AEAE2 - 83 C4 0C              - add esp,0C
//053AEAE5 - E9 3B000000           - jmp 053AEB25
//053AEAEA - 8D AD 00000000        - lea ebp,[ebp+00000000]
//053AEAF0 - 8D 45 C4              - lea eax,[ebp-3C]
//053AEAF3 - 05 0C000000           - add eax,0000000C
aobscan(GameWorld_initialization_searchedAOB, 8B 87 88 00 00 00 8D 4D C4 83 EC 08 50 51 39 00 * * * * * 83 C4 0C * * * * * 8D AD 00 00 00 00)

alloc(GameWorld_basepointer, 4, GameWorld_initialization_searchedAOB)
alloc(GameWorld_update_enable, 4, GameWorld_initialization_searchedAOB)
alloc(GameWorld_set_enable, 4, GameWorld_initialization_searchedAOB)
alloc(GameWorld_hpset_enable, 4, GameWorld_initialization_searchedAOB)
alloc(GameWorld_mpset_enable, 4, GameWorld_initialization_searchedAOB)
alloc(GameWorld_cooldownset_enable, 4, GameWorld_initialization_searchedAOB)
alloc(GameWorld_apset_enable, 4, GameWorld_initialization_searchedAOB)
alloc(GameWorld_timeset_enable, 4, GameWorld_initialization_searchedAOB)


[DISABLE]
unregistersymbol(GameWorld_basepointer)
unregistersymbol(GameWorld_update_enable)
unregistersymbol(GameWorld_set_enable)
unregistersymbol(GameWorld_hpset_enable)
unregistersymbol(GameWorld_mpset_enable)
unregistersymbol(GameWorld_cooldownset_enable)
unregistersymbol(GameWorld_apset_enable)
unregistersymbol(GameWorld_timeset_enable)

dealloc(GameWorld_basepointer)
dealloc(GameWorld_update_enable)
dealloc(GameWorld_set_enable)
dealloc(GameWorld_hpset_enable)
dealloc(GameWorld_mpset_enable)
dealloc(GameWorld_cooldownset_enable)
dealloc(GameWorld_apset_enable)
dealloc(GameWorld_timeset_enable)"""

[[cheat]]
id = "gameworld-base-address-scan-to-activate-play-level-to-update-play-level"
name = "GameWorld Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(GameWorld_savedAOB)
label(GameWorld_returnhere)
label(GameWorld_originalcode)
label(GameWorld_exit)

label(GameWorld_update_exit)
label(GameWorld_set_exit)
label(GameWorld_hpset_exit)
label(GameWorld_mpset_exit)
label(GameWorld_cooldownset_exit)
label(GameWorld_cooldownset_entry)
label(GameWorld_cooldownset_continue)
label(GameWorld_apset_exit)
label(GameWorld_timeset_exit)

registersymbol(GameWorld_savedAOB)

//053AEAC5 - E8 BE15FFFF           - call 053A0088
//053AEACA - 83 C4 10              - add esp,10
// BossMonster:Gameworld:Update+65
//053AEACD - 8B 87 88000000        - mov eax,[edi+00000088]
//053AEAD3 - 8D 4D C4              - lea ecx,[ebp-3C]
//053AEAD6 - 83 EC 08              - sub esp,08
//053AEAD9 - 50                    - push eax
//053AEADA - 51                    - push ecx
//053AEADB - 39 00                 - cmp [eax],eax
//053AEADD - E8 16860000           - call 053B70F8
//053AEAE2 - 83 C4 0C              - add esp,0C
//053AEAE5 - E9 3B000000           - jmp 053AEB25
//053AEAEA - 8D AD 00000000        - lea ebp,[ebp+00000000]
//053AEAF0 - 8D 45 C4              - lea eax,[ebp-3C]
//053AEAF3 - 05 0C000000           - add eax,0000000C
aobscan(GameWorld_searchedAOB, 8B 87 88 00 00 00 8D 4D C4 83 EC 08 50 51 39 00 * * * * * 83 C4 0C * * * * * 8D AD 00 00 00 00)

alloc(GameWorld_newmem, 2048, GameWorld_searchedAOB)
alloc(GameWorld_temp1, 4, GameWorld_searchedAOB)
alloc(GameWorld_temp2, 4, GameWorld_searchedAOB)
alloc(GameWorld_temp3, 4, GameWorld_searchedAOB)
alloc(GameWorld_temp4, 4, GameWorld_searchedAOB)
alloc(GameWorld_temp5, 4, GameWorld_searchedAOB)


GameWorld_newmem:
mov [GameWorld_temp1], eax
mov [GameWorld_temp2], ebx
mov [GameWorld_temp3], ecx
mov [GameWorld_temp4], edx

cmp dword ptr [GameWorld_update_enable], #0
je GameWorld_update_exit
mov [GameWorld_basepointer], edi
GameWorld_update_exit:

cmp dword ptr [GameWorld_set_enable], #0
je GameWorld_set_exit
GameWorld_set_exit:

cmp dword ptr [GameWorld_hpset_enable], #0
je GameWorld_hpset_exit
mov ebx, [edi+90]
test ebx, ebx
je GameWorld_hpset_exit
mov ecx, [ebx+18]
test ecx, ecx
je GameWorld_hpset_exit
mov ecx, [ecx+8]
test ecx, ecx
je GameWorld_hpset_exit
fld [ecx+44]
fstp [ebx+100]
GameWorld_hpset_exit:

cmp dword ptr [GameWorld_mpset_enable], #0
je GameWorld_mpset_exit
mov ebx, [edi+90]
test ebx, ebx
je GameWorld_mpset_exit
mov ecx, [ebx+18]
test ecx, ecx
je GameWorld_mpset_exit
mov ecx, [ecx+8]
test ecx, ecx
je GameWorld_mpset_exit
fld [ecx+4c]
fstp [ebx+104]
GameWorld_mpset_exit:

cmp dword ptr [GameWorld_cooldownset_enable], #0
je GameWorld_cooldownset_exit
mov edx, 0
mov ebx, [edi+90]
test ebx, ebx
je GameWorld_cooldownset_exit
mov ebx, [ebx+74]
test ebx, ebx
je GameWorld_cooldownset_exit
mov ecx, [ebx+c]
test ecx, ecx
je GameWorld_cooldownset_exit
GameWorld_cooldownset_entry:
mov eax, [ebx+edx*4+10]
test eax, eax
je GameWorld_cooldownset_continue
mov [eax+24], (float)0
mov [eax+28], (float)0
GameWorld_cooldownset_continue:
inc edx
cmp ecx, edx
je GameWorld_cooldownset_exit
jmp GameWorld_cooldownset_entry
GameWorld_cooldownset_exit:

cmp dword ptr [GameWorld_apset_enable], #0
je GameWorld_apset_exit
mov ebx, [edi+90]
test ebx, ebx
je GameWorld_apset_exit
mov [ebx+108], (float)9999
GameWorld_apset_exit:

cmp dword ptr [GameWorld_timeset_enable], #0
je GameWorld_timeset_exit
mov [edi+100], (float)0
GameWorld_timeset_exit:

mov eax, [GameWorld_temp1]
mov ebx, [GameWorld_temp2]
mov ecx, [GameWorld_temp3]
mov edx, [GameWorld_temp4]


GameWorld_originalcode:
db 8B 87 88 00 00 00
//mov eax,[edi+00000088]


GameWorld_exit:
jmp GameWorld_returnhere


GameWorld_searchedAOB:
GameWorld_savedAOB:
jmp GameWorld_newmem
nop
GameWorld_returnhere:


[DISABLE]
GameWorld_savedAOB:
db 8B 87 88 00 00 00
//mov eax,[edi+00000088]

unregistersymbol(GameWorld_savedAOB)

dealloc(GameWorld_newmem)
dealloc(GameWorld_temp1)
dealloc(GameWorld_temp2)
dealloc(GameWorld_temp3)
dealloc(GameWorld_temp4)
dealloc(GameWorld_temp5)"""

