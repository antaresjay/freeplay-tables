[[cheat]]
id = "game-time-manager-ctrl-numpad-1"
name = "Game Time Manager (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Prison Escape Simulator.exe
// Author            : ndck76
// Executable Version: 6000.0.35.15302
// Game Version      : Build.19290522
// Script Date       : 2025-07-27


[ENABLE]

aobscanmodule(nightchangetime,GameAssembly.dll,F3xxxxxxxxF3xxxxxxEBxxF3xxxxxxxx0F28xxF3xxxxxx0F28xx4533xxF3xxxxxxxxE8xxxxxxxx488Bxxxxxxxxxx4885xx74xx488Bxxxxxxxxxx4533xx0F28xxE8) //GameTimeManager.Update
alloc(newmem,$1000,nightchangetime)
alloc(data2,8)
alloc(nightchangetimebkp,5)
registersymbol(data2)
registersymbol(nightchangetime)
registersymbol(nightchangetimebkp)
label(code)
label(return)

nightchangetimebkp:
  readmem(nightchangetime,5)

newmem:
  mov [data2],rbx

code:
  readmem(nightchangetime,5)
  jmp return

nightchangetime:
  jmp newmem
return:

[DISABLE]

nightchangetime:
  readmem(nightchangetimebkp,5)

unregistersymbol(*)
dealloc(*)"""

