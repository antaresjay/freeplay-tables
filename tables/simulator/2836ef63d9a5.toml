source = """
[ENABLE]
alloc(LevelHack, 128, Backend.AddExperience+6C)
label(return)
label(DesiredLevel)
registerSymbol(DesiredLevel)

LevelHack:
  // 1. Load and Clamp the value
  mov eax, [DesiredLevel]

  cmp eax,#1
  jl low_clamp         // If < 1, set to 1

  cmp eax,#30
  jg high_clamp        // If > 30, set to 30
  jmp do_logic

low_clamp:
  mov eax,#1
  jmp do_logic

high_clamp:
  mov eax,#30

do_logic:
  // 2. Preserve the "weird" nuke
  xor ecx,ecx

  // 3. Commit to memory
  mov [rdi+70], eax    // Force Level (+70)
  mov [rdi+6C], 0      // Force XP (+6C) to 0

  jmp return

DesiredLevel:
  dd #30

Backend.AddExperience+6C: // Using +67 to ensure we capture the full logic block
  jmp LevelHack
  nop 2
return:

[DISABLE]
Backend.AddExperience+6C:
  db 03 C3 33 C9 89 47 6C // Restore original logic

dealloc(LevelHack)
unregisterSymbol(DesiredLevel)"""

