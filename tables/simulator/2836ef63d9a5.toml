source = """
// --- Level Requirement Fix ---
define(level_addr, Arrabbiata.CatalogItemData.get_requiredLevel+9)
define(level_bytes, 8B 40 20 C3 C3)
// --- Gold Coupon Fix ---
define(gold_addr, Arrabbiata.CatalogItemData.get_goldCoupons+9)
define(gold_bytes, 8B 40 38 C3 C3)

[ENABLE]
assert(level_addr, level_bytes)
assert(gold_addr, gold_bytes)

alloc(CatalogHacks, $1000, GameAssembly.dll)

label(ForcedLevelReq)
label(ForcedGoldCost)
registersymbol(ForcedLevelReq)
registersymbol(ForcedGoldCost)

CatalogHacks:
  ForcedLevelReq:
    dd 0    // Default to 0 (Inactive)
  ForcedGoldCost:
    dd 0    // Default to 0 (Everything is free)

// --- Level Injection with Logic Gate ---
newmem_level:
  mov ecx,[ForcedLevelReq]
  cmp ecx,0
  je short @f           // If 0, skip the modification

  mov [rax+20],ecx      // If not 0, force the requirement

@f:
  mov eax,[rax+20]      // Original read
  ret

// --- Gold Injection ---
newmem_gold:
  mov ecx,[ForcedGoldCost]
  mov [rax+38],ecx      // Force coupon cost
  mov eax,[rax+38]
  ret

level_addr:
  jmp newmem_level

gold_addr:
  jmp newmem_gold

[DISABLE]
level_addr:
  db level_bytes

gold_addr:
  db gold_bytes

unregistersymbol(ForcedLevelReq)
unregistersymbol(ForcedGoldCost)
dealloc(CatalogHacks)"""

