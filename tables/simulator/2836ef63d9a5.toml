// Logic: Set time to 0.1, wait 100 frames, then set to 0.
// This allows the HUD to catch up while ZA WARUDO is active.

alloc(ImpulsiveDelivery, 1024, Arrabbiata.Stock.get_deliveriesProgress+2D)
