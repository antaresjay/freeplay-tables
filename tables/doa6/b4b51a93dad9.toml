[[cheat]]
id = "health"
name = "Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : DOA6.exe
  Version: 
  Date   : 2019-03-01
  Author : Jessie Kazama
}

[ENABLE]

aobscanmodule(health,DOA6.exe,66 89 8E 50 05 00 00)
alloc(newmem,$1000,health)

label(code)
label(return)
label(ohkchk)
label(infhpf)
label(ohkf)

registersymbol(health)
registersymbol(infhpf)
registersymbol(ohkf)

newmem:
  cmp [rsi+10],1
  jne ohkchk
  //cmp [rsi+70],0
  //jne ohkchk
  //cmp [rsi+78],0
  //jne ohkchk
  //cmp [rsi+7C],0
  //jne ohkchk
  //cmp byte ptr [rsi+120],1
  //jne ohkchk
  //cmp byte ptr [rsi+13E],1
  //jne ohkchk
  //cmp [rsi+144],0
  //jne ohkchk
  //cmp [rsi+388],1
  //jne ohkchk
  //cmp [rsi+3C0],1
  //jne ohkchk
  cmp [infhpf],1
  jne code
  push word ptr [rsi+00000552]
  pop word ptr [rsi+00000550]
  jmp return

ohkchk:
  cmp [ohkf],1
  jne code
  xor cx,cx

code:
  mov [rsi+00000550],cx
  jmp return

infhpf:
  dq 0

ohkf:
  dq 0

health:
  jmp newmem
  nop
  nop
return:

[DISABLE]

health:
  db 66 89 8E 50 05 00 00

unregistersymbol(health)
unregistersymbol(infhpf)
unregistersymbol(ohkf)
dealloc(newmem)"""

