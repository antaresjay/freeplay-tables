[[cheat]]
id = "hold-num1-to-hold-spellcard-usage"
name = 'Hold "Num1" to hold spellcard usage'
category = "misc"
description = ""
hint = ""
type = "script"
source = """
define(address,"th155.exe"+180B16)
define(bytes,8B 44 CF 30 EB 0D)

[ENABLE]
assert(address,bytes)
alloc(newmem,$1000)

label(code)
label(return)
label(resettimer)
label(holdcount)

newmem:
cmp ["th155.exe"+004DB6A8],00
je code
mov eax,["th155.exe"+004DB6A8]
cmp [eax+10],00
je code
mov eax,[eax+10]
cmp [eax+18],00
je code
mov eax,[eax+18]
cmp [eax+4],00
je code
mov eax,[eax+4]
cmp [eax+60],00
je code
mov eax,[eax+60]
cmp eax,edi
jne code
cmp byte ptr [th155.exe+4DAF4F],00
je code
cmp [edi+7*8+30],10
jge resettimer
call holdcount

code:
  mov eax,[edi+ecx*8+30]
  jmp th155.exe+180B29
  jmp return

resettimer:
mov [edi+7*8+30],00
call holdcount
jmp code

holdcount:
cmp word ptr [edi+1B*8+32],00
jne code
mov [edi+1B*8+30],04
ret

address:
  jmp newmem
  nop
return:

[DISABLE]

address:
  db bytes
  // mov eax,[edi+ecx*8+30]
  // jmp th155.exe+180B29

dealloc(newmem)"""

