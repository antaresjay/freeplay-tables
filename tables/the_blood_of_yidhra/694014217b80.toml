[[cheat]]
id = "infinite-ammo"
name = "Infinite Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : The Blood of Yidhra
  Version: 1.0
  Date   : 2026-07-18

  功能: 射击时弹夹内弹药不减少
  原理: Hook InventoryController.ShootBullet() 方法，NOP 掉弹药递减指令 (dec r8d)
  前提: 需先在 CE 菜单中执行 Mono -> Activate mono features
}

[ENABLE]

aobscanregion(INFAMMO_INJECT, InventoryController:ShootBullet+00, InventoryController:ShootBullet+2000, 48 8B 45 F0 48 8B 55 E8 41 FF C8 48 8B C8)

registersymbol(INFAMMO_INJECT)

INFAMMO_INJECT+8:
  nop
  nop
  nop

[DISABLE]

INFAMMO_INJECT+8:
  db 41 FF C8

unregistersymbol(INFAMMO_INJECT)

// C# 反编译源码 (// 注释, 用 () 表示代码块)
// public void ShootBullet()
// (
//   Dictionary(EquipmentSlot,int) magazineBulletList = this.MagazineBulletList;
//   EquipmentSlot seletedItem = this.SeletedItem;
//   int num = magazineBulletList[seletedItem];
//   magazineBulletList[seletedItem] = num - 1;  // <- 此处的 -1 被 NOP
// )

{
// ORIGINAL CODE - INJECTION POINT: InventoryController:ShootBullet
InventoryController:ShootBullet+3E: 48 8B 45 F0 - mov rax,[rbp-10]        // rax = MagazineBulletList
InventoryController:ShootBullet+42: 48 8B 55 E8 - mov rdx,[rbp-18]        // rdx = SeletedItem (key)
InventoryController:ShootBullet+46: 41 FF C8    - dec r8d                 // r8d = bullet_count - 1  <-- NOP HERE
InventoryController:ShootBullet+49: 48 8B C8    - mov rcx,rax             // rcx = Dictionary for set_Item
}"""

