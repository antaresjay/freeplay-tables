undo2:
  movss xmm0,[eax+30]
  fld [undox2]
  fstp [eax+30]
  fld [undoy2]
  fstp [eax+34]
  mov [doundo2],0
  jmp return

code:
  movss xmm0,[eax+30]
  jmp return

posp:
  dd 0

dosave:
  dd 1

doload:
  dd 0

savedx:
  dd 0

savedy:
  dd 0

doundo:
  dd 0

undox:
  dd 0

undoy:
  dd 0

dosave2:
  dd 1

doload2:
  dd 0

savedx2:
  dd 0

savedy2:
  dd 0

doundo2:
  dd 0

undox2:
  dd 0

undoy2:
  dd 0

teleport+02:
  jmp newmem
return:

