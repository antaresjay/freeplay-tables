label(code)
label(return)
label(posp)
label(dosave)
label(doload)
label(save)
label(load)
label(savedx)
label(savedy)
label(undo)
label(doundo)
label(undox)
label(undoy)

label(dosave2)
label(doload2)
label(save2)
label(load2)
label(savedx2)
label(savedy2)
label(undo2)
label(doundo2)
label(undox2)
label(undoy2)

registersymbol(teleport)
registersymbol(posp)
registersymbol(dosave)
registersymbol(doload)
registersymbol(savedx)
registersymbol(savedy)
registersymbol(doundo)
registersymbol(undox)
registersymbol(undoy)

registersymbol(dosave2)
registersymbol(doload2)
registersymbol(savedx2)
registersymbol(savedy2)
registersymbol(doundo2)
registersymbol(undox2)
registersymbol(undoy2)

newmem:
  mov [posp],eax
  cmp [dosave],1
  je save
  cmp [doload],1
  je load
  cmp [doundo],1
  je undo
  cmp [dosave2],1
  je save2
  cmp [doload2],1
  je load2
  cmp [doundo2],1
  je undo2
  jmp code

save:
  movss xmm0,[eax+30]
  fld [eax+30]
  fstp [savedx]
  fld [eax+34]
  fstp [savedy]
  mov [dosave],0
  jmp return

load:
  movss xmm0,[eax+30]
  fld [eax+30]
  fstp [undox]
  fld [eax+34]
  fstp [undoy]
  fld [savedx]
  fstp [eax+30]
  fld [savedy]
  fstp [eax+34]
  mov [doload],0
  jmp return

undo:
  movss xmm0,[eax+30]
  fld [undox]
  fstp [eax+30]
  fld [undoy]
  fstp [eax+34]
  mov [doundo],0
  jmp return

save2:
  movss xmm0,[eax+30]
  fld [eax+30]
  fstp [savedx2]
  fld [eax+34]
  fstp [savedy2]
  mov [dosave2],0
