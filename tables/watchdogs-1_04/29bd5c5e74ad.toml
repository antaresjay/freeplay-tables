[[cheat]]
id = "fov-override-aob-f1"
name = "FOV Override (AOB) = F1"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscanmodule(fovOverrideAOB,Disrupt_b64.dll,F3 0F 11 49 24 F3 0F 11 49 28 C3)
registersymbol(fovOverrideAOB)

aobscanmodule(fovGetAOB,Disrupt_b64.dll,F3 x x 40 2C F3 x x 48 30 49 8B 04 24)
registersymbol(fovGetAOB)

alloc(newmem,2048,"Disrupt_b64.dll")
label(returnhere)
label(exit)

label(newmem2)
label(returnhere2)
label(exit2)

label(pPlayer)
registersymbol(pPlayer)

////////

newmem:
jmp exit

exit:
jmp returnhere

////////

newmem2:
mov [pPlayer],rax
movss xmm0,[rax+2C]
jmp exit2

exit2:
jmp returnhere2

///
pPlayer:
dd 0
///

////////

fovOverrideAOB:
jmp newmem
returnhere:

fovGetAOB:
jmp newmem2
