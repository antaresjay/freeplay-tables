source = """
{ Game   : StarBirds.exe
  Date   : 2025-09-19
  Author : Sianz
}

[ENABLE]

aobscanregion(resource,MemoryPlayer:ChangePoints,MemoryPlayer:ChangePoints+100,44 03 C6 48 8B C8) // should be unique
alloc(newmem,$1000,resource)

label(code)
label(return)

newmem:
  mov ecx,esi
  sar ecx,31
  xor esi,ecx
  sub esi,ecx
