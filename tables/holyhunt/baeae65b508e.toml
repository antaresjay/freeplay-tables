[[cheat]]
id = "shotgun-ctrl-numpad-2-shoot-to-populate-values"
name = "Shotgun (Ctrl + Numpad 2) {Shoot to populate values}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : HOLYHUNT.exe
// Author            : ndck76
// Executable Version: 2021.3.11.23713
// Game Version      : Build.12675201
// Script Date       : 2025-08-11


[ENABLE]

aobscanregion(ammo,Shotgun:Shot,Shotgun:Shot+200,486386xxxx000085xx0Fxxxxxxxxxx48xxxxxxxxxxxx48xxxx48xxxx75xxEBxx) //Shotgun:Shot+c3
alloc(newmem,$1000,ammo)
alloc(data,8)
alloc(ammobkp,7)
registersymbol(data)
registersymbol(ammo)
registersymbol(ammobkp)
label(code)
label(return)

ammobkp:
  readmem(ammo,7)

newmem:
  mov [data],rsi

code:
  readmem(ammo,7)
  jmp return

ammo:
  jmp newmem
  nop 2
return:

[DISABLE]

ammo:
  readmem(ammobkp,7)

unregistersymbol(*)
dealloc(*)"""

