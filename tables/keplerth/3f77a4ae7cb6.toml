[[cheat]]
id = "enable"
name = "Enable"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
  Game\t  : Keplerth
  Author\t: LeFiXER
  Date\t\t\t: 28/05/2022

  Player Stuff
}

[ENABLE]

aobscanregion(aobPlayer,Keplerth.PlayerHunger:SetHunger+10,Keplerth.PlayerHunger:SetHunger+30,18 33 D2 48 8D 64 24 00 90) // should be unique
alloc(newmem,$1000,aobPlayer)
alloc(player,8)
alloc(hp,1)
alloc(hunger,1)
alloc(energy,1)

label(code)
label(return)

newmem:
  mov [player],rcx
  cmp byte ptr [hp],0
  je @f
  push rax
  mov rax,[rcx+618]
  mov [rcx+61C],rax
  pop rax

@@:
  cmp byte ptr [hunger],0
  je @f
  push rax
  mov rax,[rcx+624]
  mov [rcx+628],rax
  pop rax

@@:
  cmp byte ptr [energy],0
  je code
  push rax
  mov rax,[rcx+62C]
  mov [rcx+630],rax
  pop rax
  jmp code

code:
  xor edx,edx
  lea rsp,[rsp+00]
  jmp return

aobPlayer+01:
  jmp newmem
  nop 2
return:
registersymbol(aobPlayer)
registersymbol(player)
registersymbol(hp)
registersymbol(hunger)
registersymbol(energy)
[DISABLE]

aobPlayer+01:
  db 33 D2 48 8D 64 24 00

unregistersymbol(aobPlayer)
unregistersymbol(player)
unregistersymbol(hp)
unregistersymbol(hunger)
unregistersymbol(energy)

dealloc(newmem)
dealloc(player)
dealloc(hp)
dealloc(hunger)
dealloc(energy)"""

