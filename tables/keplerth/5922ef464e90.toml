[[cheat]]
id = "no-skill-cooldown"
name = "No Skill Cooldown"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
//Send@ModEngine
[ENABLE]

aobscan(skillcd,48 63 80 34 07 00 00 85 C0 7E 15)
alloc(newmem,$1000,skillcd)

label(code)
label(return)

newmem:
mov [rax+0734],#600
code:
  movsxd  rax,dword ptr [rax+00000734]
  jmp return

skillcd:
  jmp newmem
  nop 2
return:
registersymbol(skillcd)

[DISABLE]

skillcd:
  db 48 63 80 34 07 00 00

unregistersymbol(skillcd)
dealloc(newmem)"""
