id = "no-overheat"
name = "No Overheat"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(overheatd,lua51.dll,48 89 29 8B 06) 
aobscan(overheat_addr,10 ?? ?? ??  6F 76 65 72 63 68 61 72 67 65 5F 76 61 6C 75 65)

alloc(newmem,$1000,overheatd)

label(code)
label(return)

newmem:
code:
  cmp [rcx+8], overheat_addr-c
  jne @F

  xor rbp, rbp

@@:
  mov [rcx], rbp
  mov eax, [rsi]
  jmp return

overheatd:
  jmp newmem
return:
registersymbol(overheatd)

[DISABLE]

overheatd:
  db 48 89 29 8B 06

unregistersymbol(overheatd)
dealloc(newmem)"""
