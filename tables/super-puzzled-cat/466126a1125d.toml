id = "godmode"
name = "Godmode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(GodModeDeath,66 90 55 8B EC 83 EC 54 A1 ? ? ? ? 33 C5 89 45 ? 53 8B 5D)
registersymbol(GodModeDeath)

assert(GodModeDeath,66 90 55 8B EC)

GodModeDeath:
