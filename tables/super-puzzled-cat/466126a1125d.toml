unregistersymbol(GodModeDeath)"""

[[cheat]]
id = "noclip-dont-activate-together-with-godmode"
name = "Noclip (Dont activate together with Godmode)"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(ForceGhostMode,83 7F 58 FF 0F 10 85 08 FE FF FF 0F 95 85 40 FE FF FF 83 7F 48 FF)
alloc(newmem,1024)

label(return)

newmem:
  cmp dword ptr [edi+58],FF
  movups xmm0,[ebp-000001F8]
  mov dword ptr [edi+48],0
  jmp return

ForceGhostMode:
  jmp newmem
  nop 6

return:

registersymbol(ForceGhostMode)

[DISABLE]

ForceGhostMode:
  db 83 7F 58 FF 0F 10 85 08 FE FF FF

unregistersymbol(ForceGhostMode)
dealloc(newmem)"""

