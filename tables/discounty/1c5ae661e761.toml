[[cheat]]
id = "max-selected-hotbar-item-stack-disable-after-use"
name = "Max Selected Hotbar Item Stack (disable after use)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[enable]
ijmscripts+300:
push rcx
push rdx
push r13
push r14
push r15

@@:
mov rcx,ptr_InventoryHolder
mov rcx,[rcx]
test rcx,rcx
je ndd
mov r11,"Storie.Core.InventoryHolder:GetSelectedItemStack"
call r11
test rax,rax
je ndd

mov r15,rax   // R15 = ItemStack

mov r14,ptr_InventoryHolder
mov r14,[r14]
test r14,r14
je ndd
mov r14d,[r14+InventoryHolderC.stackLimit]

mov r13,[r15+$ItemStackC.item]
test r13,r13
je ndd
mov r13d,[r13+$ItemC.maxStack]

mov edx,r14d
cmp r13d,edx
cmovl edx,r13d

cmp edx,[r15+$ItemStackC.quantity]
je ndd

mov rcx,r15
//inc edx
mov r11,"Storie.Core.ItemStack:set_Quantity"
call r11

mov rcx,ptr_InventoryManagerUI
mov rcx,[rcx]
test rcx,rcx
je ndd
mov rdx,$PlayerInventoryHolderSlotPtr
mov edx,[rdx]
xor r8,r8
mov r11,"Storie.UI.InventoryManagerUI:UpdateUISlot"
call r11

ndd:
pop r15
pop r14
pop r13
pop rdx
pop rcx
ret

[disable]
ijmscripts+300:
ret"""
