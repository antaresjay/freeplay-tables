[[cheat]]
id = "cash-setter"
name = "Cash Setter"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[enable]
ijmscripts+0:
push r13
push r14
push r15

mov rcx,ptr_GlobalDataManager
mov rcx,[rcx]
test rcx,rcx
je @f
mov rcx,[rcx+$GlobalDataManagerC.moneyVar]
test rcx,rcx
je @f

xor r14,r14
mov r15,tempval

mov r14,[r15]
mov edx,[rcx+$IntVariableC.value]
cmp r14,edx
je @f
cmp edx,[rcx+$IntVariableC.maxClampedValue]
cmovg edx,[rcx+$IntVariableC.maxClampedValue]
cmp edx,[rcx+$IntVariableC.minClampedValue]
cmovl edx,[rcx+$IntVariableC.minClampedValue]
mov [rcx+$IntVariableC.value],edx
mov [r15],edx

mov r11,$IntVariable_set_Value
call r11

@@:
pop r15
pop r14
pop r13
ret

[disable]
//ijmscripts+0:
//ret"""

