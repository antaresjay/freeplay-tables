[[cheat]]
id = "player-base-address-scan-to-activate-display-major-module-list-to-update-display-major-module-list"
name = "Player Base Address Scan (To Activate: Display Major Module List, To Update: Display Major Module List)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Player_savedAOB)
label(Player_returnhere)
label(Player_originalcode)
label(Player_exit)

label(Player_update_exit)
label(Player_set_exit)

registersymbol(Player_savedAOB)

//180B0525 - 8B C8                 - mov ecx,eax
//180B0527 - 39 09                 - cmp [ecx],ecx
// ConstructibleModuleItem:RefreshCost+e1
//180B0529 - D9 40 34              - fld dword ptr [eax+34]
//180B052C - D9 5D F0              - fstp dword ptr [ebp-10]
//180B052F - D9 45 F0              - fld dword ptr [ebp-10]
//180B0532 - D9 45 F4              - fld dword ptr [ebp-0C]
//180B0535 - DFF1                  - fcomip st(0),st(1)
//180B0537 - DDD8                  - fstp st(0)
aobscan(Player_searchedAOB, D9 40 34 D9 5D F0 D9 45 F0 D9 45 F4)

alloc(Player_newmem, 2048)
alloc(Player_temp1, 4)


Player_newmem:
mov [Player_temp1], ebx

cmp dword ptr [Player_update_enable], #0
je Player_update_exit
mov [Player_basepointer], eax
Player_update_exit:

cmp dword ptr [Player_set_enable], #0
je Player_set_exit
mov [eax+30], (float)9999999
mov [eax+34], (float)9999999
mov [eax+38], (float)9999999
cmp dword ptr [eax+20], #0
je Player_set_exit
mov ebx, [eax+20]
mov [ebx+228], (float)400
Player_set_exit:

mov ebx, [Player_temp1]


Player_originalcode:
db D9 40 34 D9 5D F0
//fld dword ptr [eax+34]
//fstp dword ptr [ebp-10]


Player_exit:
jmp Player_returnhere


Player_searchedAOB:
Player_savedAOB:
jmp Player_newmem
nop
Player_returnhere:


[DISABLE]
Player_savedAOB:
db D9 40 34 D9 5D F0
//fld dword ptr [eax+34]
//fstp dword ptr [ebp-10]

unregistersymbol(Player_savedAOB)

dealloc(Player_newmem)
dealloc(Player_temp1)"""

