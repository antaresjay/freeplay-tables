[[cheat]]
id = "health-base-address-scan-initialization-activate-this-first"
name = "Health Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Health_basepointer)
registersymbol(Health_update_enable)
registersymbol(Health_set_enable)
registersymbol(Health_invincibleset_enable)
registersymbol(Health_unlockset_enable)

alloc(Health_basepointer, 4)
alloc(Health_update_enable, 4)
alloc(Health_set_enable, 4)
alloc(Health_invincibleset_enable, 4)
alloc(Health_unlockset_enable, 4)


[DISABLE]
unregistersymbol(Health_basepointer)
unregistersymbol(Health_update_enable)
unregistersymbol(Health_set_enable)
unregistersymbol(Health_invincibleset_enable)
unregistersymbol(Health_unlockset_enable)

dealloc(Health_basepointer)
dealloc(Health_update_enable)
dealloc(Health_set_enable)
dealloc(Health_invincibleset_enable)
dealloc(Health_unlockset_enable)"""

[[cheat]]
id = "health-base-address-scan-to-activate-battle-to-update-battle"
name = "Health Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Health_savedAOB)
label(Health_returnhere)
label(Health_originalcode)
label(Health_exit)

label(Health_update_exit)
label(Health_set_exit)
label(Health_invincibleset_exit)
label(Health_unlockset_exit)

registersymbol(Health_savedAOB)

//1EBEA203 - 39 00                 - cmp [eax],eax
//1EBEA205 - E8 C6F00100           - call 1EC092D0
// Health:GetHealth+25
//1EBEA20A - 83 C4 10              - add esp,10
//1EBEA20D - EB 09                 - jmp 1EBEA218
//1EBEA20F - 8B 45 08              - mov eax,[ebp+08]
//1EBEA212 - D9 80 80000000        - fld dword ptr [eax+00000080]
//1EBEA218 - C9                    - leave
//1EBEA219 - C3                    - ret
aobscan(Health_searchedAOB, 83 C4 10 EB 09 8B 45 08 D9 80 80 00 00 00 C9)

alloc(Health_newmem, 2048)
alloc(Health_temp1, 4)
alloc(Health_temp2, 4)


Health_newmem:
mov [Health_temp1], ebx
mov [Health_temp2], ecx

// Is enemy?
cmp dword ptr [eax+3c], #0
je Health_unlockset_exit

cmp dword ptr [Health_update_enable], #0
je Health_update_exit
mov [Health_basepointer], eax
Health_update_exit:

cmp dword ptr [Health_set_enable], #0
je Health_set_exit
Health_set_exit:

cmp dword ptr [Health_invincibleset_enable], #0
je Health_invincibleset_exit
mov byte ptr [eax+b0], #1
Health_invincibleset_exit:

cmp dword ptr [Health_unlockset_enable], #0
je Health_unlockset_exit
cmp dword ptr [eax+2c], #0
je Health_unlockset_exit
mov ebx, [eax+2c]
// Already unlocked
cmp dword ptr [ebx+290], #0
je Health_unlockset_exit
mov ecx, [ebx+270]
mov [ebx+290], ecx
Health_unlockset_exit:

mov ebx, [Health_temp1]
mov ecx, [Health_temp2]


Health_originalcode:
db D9 80 80 00 00 00
//fld dword ptr [eax+00000080]


Health_exit:
jmp Health_returnhere


Health_searchedAOB + 8:
Health_savedAOB:
jmp Health_newmem
nop
Health_returnhere:


[DISABLE]
Health_savedAOB:
db D9 80 80 00 00 00
//fld dword ptr [eax+00000080]

unregistersymbol(Health_savedAOB)

dealloc(Health_newmem)
dealloc(Health_temp1)
dealloc(Health_temp2)"""

