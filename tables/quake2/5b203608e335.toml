[[cheat]]
id = "true-god-mode"
name = "True god mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,kmq2gamex86.dll,89 8? 44 02 00 00 EB 41) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  nop
  jmp return

INJECT:
  jmp code
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 89 81 44 02 00 00

unregistersymbol(INJECT)
dealloc(newmem)"""

[[cheat]]
id = "always-have-200-health"
name = "Always have 200 health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,kmq2gamex86.dll,?? B8 44 02 00 00 00 7E 3A) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov [eax+00000244],C8
  cmp dword ptr [eax+00000244],00
  jmp return

INJECT:
  jmp code
  nop
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db ?? B8 44 02 00 00 00

unregistersymbol(INJECT)
dealloc(newmem)"""

