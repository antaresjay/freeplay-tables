[[cheat]]
id = "no-tyre-wear"
name = "No Tyre Wear"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(tyrewear_aob,F1_25.exe,C5 FA 11 86 80 00 00 00 * * * * 24) 
alloc(newmem,$1000,tyrewear_aob)

label(code)
label(return)

newmem:
xorps xmm0,xmm0
code:
db C5 FA 11 86 80 00 00 00
jmp return

tyrewear_aob:
jmp newmem
nop 3
return:
registersymbol(tyrewear_aob)

[DISABLE]

tyrewear_aob:
db C5 FA 11 86 80 00 00 00

unregistersymbol(tyrewear_aob)
dealloc(newmem)"""
