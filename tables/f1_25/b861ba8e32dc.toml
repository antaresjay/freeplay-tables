[[cheat]]
id = "grip-script"
name = "Grip Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
    authors: 0xdede and immunityd0g
}

[ENABLE]
aobscanmodule(INJECT,F1_25.exe,C4 A1 7A 11 84 BE F0 06 00 00)
alloc(newmem,$512,INJECT)
alloc(customValue,4)
label(return)
label(originalcode)

registersymbol(customValue)

newmem:
  mov rax,[rsp+148]
  mov rax,[rax+124]
  cmp rax,1
  je originalcode
  vmovss xmm0,[customValue]
  vmovss [rsi+r15*4+000006F0],xmm0
  jmp return

customValue:
  dd (float)1.0


originalcode:
  vmovss [rsi+r15*4+000006F0],xmm0
  jmp return

INJECT:
  jmp newmem
  nop 5

return:
registersymbol(INJECT)

[DISABLE]
INJECT:
  db C4 A1 7A 11 84 BE F0 06 00 00


unregistersymbol(customValue)
unregistersymbol(INJECT)
dealloc(customValue)
dealloc(newmem)"""

