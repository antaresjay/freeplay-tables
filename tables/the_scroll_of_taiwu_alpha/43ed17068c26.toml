[[cheat]]
id = "cheat"
name = "创建指针"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(point,1024)
alloc(point2,1024)
alloc(texingp,20)
registersymbol(point)
registersymbol(point2)
registersymbol(texingp)
 
[DISABLE]
dealloc(point)
dealloc(point2)
unregistersymbol(point)
unregistersymbol(point2)
//code from here till the end of the code will be used to disable the cheat"""

[[cheat]]
id = "buff"
name = "灾祸祥瑞BUFF修改初始化"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(findzaihuo,48 C1 E1 04 48 03 C1 48 83 C0 20 48 63 40 0C eb)
registersymbol(findzaihuo)
alloc(newmem,2048,findzaihuo+7)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here

originalcode:
add rax,20
cmp rdx,3d
je buff
movsxd  rax,dword ptr [rax+0C]
jmp exit

buff://如果指针未被写入,先无条件写入
cmp [point+900],0
jne buff1
mov [point+900],rax
jmp buff1

buff1://校验rax是否等于已经被写入到point+900的rax,如果不等于,则写入到point+910
cmp rax,[point+900]
jne buff2
mov [point+900],rax
movsxd  rax,dword ptr [rax+0C]
jmp exit

buff2:
mov [point+910],rax
movsxd  rax,dword ptr [rax+0C]

exit:
jmp returnhere

findzaihuo+7:
jmp newmem
nop
nop
nop
returnhere:



[DISABLE]
dealloc(newmem)
findzaihuo+7:
add rax,20
movsxd  rax,dword ptr [rax+0C]
//Alt: db 48 83 C0 20 48 63 40 0C

unregistersymbol(findzaihuo)
//code from here till the end of the code will be used to disable the cheat"""

