[[cheat]]
id = "script-currentgame-get-credits"
name = "SCRIPT: CurrentGame:get_Credits()"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Distant Star.exe
  Version: 
  Date   : 2015-04-11
  Author : jgoemat

  CurrentGame:get_Credits+9

  Here we get the pointer to the CurrentGame class instance and we can add
  credits and fuel.
}

[ENABLE]

aobscan(cdu_inject,8B 80 9C 00 00 00 C9) // CurrentGame:get_Credits+9
alloc(newmem,$1000)

label(cdu_code)
label(cdu_skip_credits)
label(cdu_skip_fuel)
label(cdu_return)

newmem:

cdu_code:
  pushad
  mov ecx,eax
  mov [pCurrentGame],ecx
  cmp dword ptr [cheatCredits],1
  jne cdu_skip_credits
  mov eax,#1000000
  mov [ecx+9c],eax
cdu_skip_credits:
  cmp dword ptr [cheatFuel],1
  jne cdu_skip_fuel
  mov eax,#1000
  mov [ecx+98],eax
cdu_skip_fuel:
  popad
  mov eax,[eax+0000009C] // original code
  jmp cdu_return

cdu_inject:
  jmp cdu_code
  nop
cdu_return:
registersymbol(cdu_inject)

[DISABLE]

cdu_inject:
  db 8B 80 9C 00 00 00

unregistersymbol(cdu_inject)
dealloc(newmem)

