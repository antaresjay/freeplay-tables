[[cheat]]
id = "alt-num6-triple-damage"
name = "ALT+NUM6 = Triple Damage "
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(INJECT,D9 81 00 08 00 00)
registersymbol(INJECT)
alloc(newmem,$1000)
label(return)

newmem:
  fld   dword ptr [ecx+00000800]
  fld   dword ptr [ecx+00000800]
  fadd  ST(0),ST(0)
  faddp ST(1),ST(0)
  jmp return

INJECT:
  jmp newmem
  nop
return:

[DISABLE]
INJECT:
  db D9 81 00 08 00 00

unregistersymbol(INJECT)
dealloc(newmem)"""

