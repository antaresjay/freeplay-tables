[[cheat]]
id = "infinite-ammo-all-guns"
name = "无限子弹Infinite Ammo (all guns)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Jump Space.exe
  Date   : 2026-04-10
  Author : ChatGPT
}

[ENABLE]

aobscanmodule(ammo_INJECT,GameAssembly.dll,89 7E 58 0F 85)
alloc(newmem,$1000,ammo_INJECT)

label(return)
label(skipwrite)

newmem:
  pushfq                  // 保存原始标志位（给原来的 jne 用）
  mov eax,[rsi+58]        // 旧弹数
  cmp edi,eax             // 新值 vs 旧值
  jl skipwrite            // 新值更小 = 扣弹，跳过写入
  mov [rsi+58],edi        // 非扣弹时正常写入（换弹/初始化）

skipwrite:
  popfq                   // 恢复原始标志位
  jne GameAssembly.dll+5176858
  jmp return

ammo_INJECT:
  jmp newmem
  nop 4

return:
registersymbol(ammo_INJECT)

[DISABLE]

ammo_INJECT:
  db 89 7E 58 0F 85 94 01 00 00

unregistersymbol(ammo_INJECT)
dealloc(newmem)"""

