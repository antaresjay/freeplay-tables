[[cheat]]
id = "game-ctrl-numpad-2"
name = "Game (Ctrl + Numpad 2)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Dunjungle.exe
// Author            : ndck76
// Executable Version: 2022.3.62.62237
// Game Version      : v1.0
// Script Date       : 2025-12-12


[ENABLE]

aobscanregion(timer,Game:UpdateTimer,Game:UpdateTimer+100,F30F1086xxxx0000F3xxxxxx66xxxx49BBxxxxxxxxxxxx000041xxxx48xxxxxx48xxxx48xxxxxx) //Game:UpdateTimer+17
alloc(newmem,$1000,timer)
alloc(data4,8)
alloc(timerbkp,8)
registersymbol(data4)
registersymbol(timer)
registersymbol(timerbkp)
label(code)
label(return)

timerbkp:
  readmem(timer,8)

newmem:
  mov [data4],rsi

code:
  readmem(timer,8)
  jmp return

timer:
  jmp newmem
  nop 3
return:

[DISABLE]

timer:
  readmem(timerbkp,8)

unregistersymbol(*)
dealloc(*)"""

