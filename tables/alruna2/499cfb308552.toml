source = """
{ Game   : Alruna2.exe
  Version: 1.2
  OS: Steam
  Engine: GameMaker
  Date   : 2026-06-14
  Author : Chris.O

}

[ENABLE]
aobscanmodule(prePlayer,Alruna2.exe,48 8B 07 48 89 06 B0 01 48 83 C4 38 41 5F 5F 5E 5B C3 25)
alloc(newmem,$1000,prePlayer)
label(code)
label(return)

label(pHealth)
label(pWater)

newmem:
cmp r11,186CC
jne _water
mov [pHealth],rdi

_water:
cmp r11,18756
jne code
mov [pWater],rdi


code:
  mov rax,[rdi]
  mov [rsi],rax
  jmp return


pHealth:
dq 0

pWater:
dq 0


prePlayer:
  jmp newmem
  nop
return:
registersymbol(prePlayer)
registersymbol(pHealth)
registersymbol(pWater)
[DISABLE]
prePlayer:
  db 48 8B 07 48 89 06
unregistersymbol(prePlayer)
unregistersymbol(pHealth)
unregistersymbol(pWater)
dealloc(newmem)"""

