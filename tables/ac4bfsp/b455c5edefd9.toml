[[cheat]]
id = "infinite-breath"
name = "Infinite Breath"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(breathcd,AC4BFSP.exe,D9 80 80 00 00 00 8B)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  mov [eax+00000080], (float)1.0
  fld dword ptr [eax+00000080]
  jmp return

breathcd:
  jmp newmem
  nop
return:
registersymbol(breathcd)

[DISABLE]

breathcd:
  db D9 80 80 00 00 00

unregistersymbol(breathcd)
dealloc(newmem)"""
