[[cheat]]
id = "unlimited-ammo"
name = "Unlimited Ammo"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(ammocd,$process,2B 85 80 05 00 00 89) // should be unique
alloc(newmem,$1000)

fullaccess($process+540, 20)

label(code)
label(return)

newmem:
  mov [rbp+00000580], 0

code:
  sub eax, [rbp+00000580]
  jmp return

$process+540:
jumpHelper:
  jmp far newmem

ammocd:
  jmp jumpHelper
  nop
return:
registersymbol(ammocd)

[DISABLE]

ammocd:
  db 2B 85 80 05 00 00

unregistersymbol(ammocd)
dealloc(newmem)"""
