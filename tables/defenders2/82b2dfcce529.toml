[[cheat]]
id = "grab-match-data"
name = "Grab Match Data"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
//Send@Sintrix
[ENABLE]

aobscanregion(unlimitedcardflag,PWD.SessionManager:Update,PWD.SessionManager:Update+47,0F B6 47 60 85 C0)
alloc(newmem,$1000)
registersymbol(ucc)
label(code return ucc)

newmem:
mov [ucc],edi

code:
  movzx eax,byte ptr [edi+60]
  test eax,eax
  jmp return

ucc:
dq 0

unlimitedcardflag:
  jmp newmem
  nop
return:
registersymbol(unlimitedcardflag)

[DISABLE]

unlimitedcardflag:
  db 0F B6 47 60 85 C0

unregistersymbol(*)
dealloc(*)"""
