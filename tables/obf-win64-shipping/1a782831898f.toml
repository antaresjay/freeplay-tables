[[cheat]]
id = "01-money-scan-open-inventar"
name = "01. Money scan open inventar"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : OBF-Win64-Shipping.exe
  Version: 0.760.97 [PATREON]
  Date   : 2024-01-10
  Author : Oyyzj


}

[ENABLE]
aobscanmodule(Moneyscan,OBF-Win64-Shipping.exe,8B 80 70 02 00 00 C3) // should be unique
alloc(newmem,100,Moneyscan)
alloc(pMoneyscan,4)
label(code)
label(return)
newmem:
  mov [pMoneyscan],rax
code:
  readmem(Moneyscan,6)
  jmp return
rMoneyscan:
  readmem(Moneyscan,6)
Moneyscan:
  jmp newmem
  nop
return:
registersymbol(Moneyscan)
registersymbol(pMoneyscan)
registersymbol(rMoneyscan)
[DISABLE]
Moneyscan:
  readmem(rMoneyscan,6)
unregistersymbol(*)
dealloc(*)"""

