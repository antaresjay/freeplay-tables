type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

 
 
aobscanmodule(Battlestatusgirl_aob,MarySkelter.exe,8B 7E 10 FF 50 0C 3B F8 7E 0D) // should be unique
alloc(newmem,$1000)
alloc(atk,4)
alloc(tec,4)
alloc(defs,4)
alloc(men,4)
alloc(agi,4)
alloc(luc,4)

label(code)
label(return)
