registersymbol(lucmul)
registersymbol(atk)
registersymbol(tec)
registersymbol(defs)
registersymbol(men)
registersymbol(agi)
registersymbol(luc)

newmem:

lppoint:
cmp [lpoint],#0
je @f
push ebx
mov byte ptr [esi+08],#0
mov ebx,[esi+0c]
mov [esi+10],ebx
pop ebx
@@:

sppoint:
cmp [spoint],#0
je @f
push ax
mov ax,word ptr [esi+14]
mov word ptr [esi+16],ax
pop ax
@@:

bloodsplash:
cmp [blood],#0
je @f
mov [esi+390],(float)500
@@:

statmultiplier:
push edx
cmp [atkmul],#0
je @f
mov edx,[atk]
mov [esi+3b8],edx
@@:
cmp [tecmul],#0
je @f
mov edx,[tec]
mov [esi+3c0],edx
@@:
cmp [defmul],#0
je @f
mov edx,[defs]
mov [esi+3bc],edx
@@:
cmp [menmul],#0
je @f
mov edx,[men]
mov [esi+3c4],edx
@@:
cmp [agimul],#0
je @f
mov edx,[agi]
mov [esi+3c8],edx
@@:
cmp [lucmul],#0
je @f
mov edx,[luc]
mov [esi+3cc],edx
@@:
pop edx

code:
  mov edi,[esi+10]
  call dword ptr [eax+0C]
  jmp return

