source = """
[ENABLE]



aobscanmodule(health_aob,server.dll,83 BE 10 02 00 00 00 0F 8C)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
mov [esi+00000210],3e8
mov [esi+0000020c],3e8
code:
cmp dword ptr [esi+00000210],00
jmp return

health_aob:
