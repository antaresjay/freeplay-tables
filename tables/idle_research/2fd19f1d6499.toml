type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,GameAssembly.dll,0F 11 B3 80 00 00 00) // should be unique
alloc(newmem,$1000,INJECT)

label(code)
label(return)

newmem:

code:
  xorps xmm6,xmm6
  movups [rbx+00000080],xmm6
  jmp return

INJECT:
  jmp newmem
  nop 2
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 0F 11 B3 80 00 00 00

unregistersymbol(INJECT)
dealloc(newmem)"""
