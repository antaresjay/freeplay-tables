[[cheat]]
id = "video-base-address-scan-to-activate-edit-video-upload-to-update-edit-video-upload"
name = "Video Base Address Scan (To Activate: Edit Video Upload, To Update: Edit Video Upload)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Video_savedAOB)
label(Video_returnhere)
label(Video_originalcode)
label(Video_exit)

label(Video_update_exit)
label(Video_set_exit)
label(Video_renderset_exit)
label(Video_uploadset_exit)

registersymbol(Video_savedAOB)

//297CE38E - D9 45 0C              - fld dword ptr [ebp+0C]
//297CE391 - 8B 45 08              - mov eax,[ebp+08]
// DAOData:Video:set_Upload_time+c
//297CE394 - D9 98 A4000000        - fstp dword ptr [eax+000000A4]
//297CE39A - C6 80 08020000 01     - mov byte ptr [eax+00000208],01
//297CE3A1 - 83 EC 08              - sub esp,08
//297CE3A4 - 6A 14                 - push 14
aobscan(Video_searchedAOB, D9 98 A4 00 00 00 C6 80 08 02 00 00 01)

alloc(Video_newmem, 2048, Video_searchedAOB)
alloc(Video_temp1, 4, Video_searchedAOB)
alloc(Video_temp2, 4, Video_searchedAOB)
alloc(Video_temp3, 4, Video_searchedAOB)
alloc(Video_temp4, 4, Video_searchedAOB)


Video_newmem:
mov [Video_temp1], eax
mov [Video_temp2], ebx
mov [Video_temp3], ecx
mov [Video_temp4], edx

cmp dword ptr [Video_update_enable], #0
je Video_update_exit
mov [Video_basepointer], eax
Video_update_exit:

cmp dword ptr [Video_set_enable], #0
je Video_set_exit
Video_set_exit:

cmp dword ptr [Video_renderset_enable], #0
je Video_renderset_exit
mov [eax+a0], (float)0
Video_renderset_exit:

cmp dword ptr [Video_uploadset_enable], #0
je Video_uploadset_exit
mov [eax+a4], (float)0
Video_uploadset_exit:

mov eax, [Video_temp1]
mov ebx, [Video_temp2]
mov ecx, [Video_temp3]
mov edx, [Video_temp4]


Video_originalcode:
db C6 80 08 02 00 00 01
//mov byte ptr [eax+00000208],01


Video_exit:
jmp Video_returnhere


Video_searchedAOB + 6:
Video_savedAOB:
jmp Video_newmem
nop
nop
Video_returnhere:


[DISABLE]
Video_savedAOB:
db C6 80 08 02 00 00 01
//mov byte ptr [eax+00000208],01

unregistersymbol(Video_savedAOB)

dealloc(Video_newmem)
dealloc(Video_temp1)
dealloc(Video_temp2)
dealloc(Video_temp3)
dealloc(Video_temp4)"""

