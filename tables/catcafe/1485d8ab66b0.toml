[[cheat]]
id = "populate-pointers"
name = "Populate Pointers"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : catcafe.exe
  Version: 
  Date   : 2022-04-16

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(materialss,catcafe.exe,48 8B 47 08 48 89 43 08 48 8B 5C) // should be unique
aobscanmodule(cmpret,catcafe.exe,C6 07 01 44 89 33) // should be unique
alloc(newmem,$1000,materialss)

label(code)
label(return)
label(pdata)
registersymbol(pdata)

newmem:
cmp [rsp+28], cmpret+11
jne code
cmp r13, C // Materials
jne @F
cmp r8, 9   // Expensive
jne @F
cmp [pdata+100], 1
jne @F
mov [rdi+08], 0
mov [rdi+08+4], #1083127808
mov [pdata], rdi
@@:
cmp r13, 4E // Nectar
jne @F
cmp r8, 6   // Nectar
jne @F
cmp [pdata+104], 1
jne @F
mov [rdi+08], 0
mov [rdi+08+4], #1086556032
@@:
cmp r13, 9 // Stats
jne code
cmp r8, 9   // Expensive
jne @F
mov [pdata+8], rdi
@@:
cmp r8, 4   // Coziness
jne @F
mov [pdata+C], rdi
@@:
cmp r8, 3  //
jne @F
mov [pdata+14], rdi
@@:
cmp r8, 5  //
jne @F
mov [pdata+30], rdi
@@:
cmp r8, 6  //
jne @F
mov [pdata+38], rdi
code:
  mov rax,[rdi+08]
  mov [rbx+08],rax
  jmp return
pdata:
dd 0
dd 0

materialss:
  jmp newmem
  nop 3
return:
registersymbol(materialss)

[DISABLE]

materialss:
  db 48 8B 47 08 48 89 43 08

unregistersymbol(materialss)
dealloc(newmem)"""

