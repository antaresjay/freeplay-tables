[[cheat]]
id = "infinite-movement"
name = "Infinite Movement"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
{ Game        : HeroesOldenEra.exe
  Last verified version: May 2026 update
  Author      : Heaser
  Description : Skip movement decrement when the moving hero belongs to a
                Player side (Side.typeOnCreate == 0). AI/Bot heroes still
                spend movement normally.

  ────────────────────────────────────────────────
  HOOK DETAILS
  ────────────────────────────────────────────────
  Class       : esx (energy/movement manager)
  Method      : The "spend movement" function (takes int cost, returns bool)
  Hook site   : The actual subtract instruction sub [rax+48], edi
  Strategy    : Skip the subtract if the hero's Side is Player.

  REGISTER LAYOUT AT HOOK SITE
  ────────────────────────────────────────────────
  rax   = points to movement counter object, +0x48 is the counter int
  edi   = the cost being subtracted
  rbx   = the esx (energy manager)

  FIELD CHAIN (5 levels): rbx (esx) -> esq -> Hero -> dtb -> Side -> typeOnCreate
  ────────────────────────────────────────────────
  esx.esq         : +0x10  (runtime hero ref)
  esq.Hero        : +0x10  (game-data hero ref)
  Hero.dtb        : +0x18  (runtime side container)
  dtb.Side        : +0x10  (Side ref)
  Side.typeOnCreate : +0x2C  (0=Player, 1=Bot, 2=Empty, 3=BotAkaPlayer)

  AOB ANCHOR
  ────────────────────────────────────────────────
  29 78 48          sub [rax+48], edi          (anchor: the subtract)
  33 D2             xor edx, edx
  48 8B CB          mov rcx, rbx
  E8 ?? ?? ?? ??    call <something>           (volatile)
  48 8B 4B 10       mov rcx, [rbx+10]          (field +0x10)
  48 85 C9          test rcx, rcx

  RECOVERY IF BROKEN
  ────────────────────────────────────────────────
  1. Open dump.cs, locate the esx class.
  2. Find a method with signature "public bool xxx(int a)" that has the largest
     RVA among methods on esx (typically the "spend movement" function).
  3. CE Memory Viewer Ctrl+G to that RVA, scroll to find: sub [rax+48], edi
     (bytes: 29 78 48).
  4. If the bytes after match the AOB pattern, this script should still work.
  5. If not, paste 6-8 instructions after the sub and rebuild the AOB.
}

[ENABLE]
aobscanmodule(MOVEMENT_INJECT,GameAssembly.dll,29 78 48 33 D2 48 8B CB E8 ?? ?? ?? ?? 48 8B 4B 10 48 85 C9)
alloc(newmem,$1000,MOVEMENT_INJECT)

label(code)
label(return)
label(doSubtract)
label(skipSubtract)

registersymbol(MOVEMENT_INJECT)

newmem:
  push rcx
  push rax
  // walk esx -> esq
  mov rax,[rbx+10]
  test rax,rax
  jz doSubtract
  // walk esq -> Hero
  mov rax,[rax+10]
  test rax,rax
  jz doSubtract
  // walk Hero -> dtb
  mov rax,[rax+18]
  test rax,rax
  jz doSubtract
  // walk dtb -> Side
  mov rax,[rax+10]
  test rax,rax
  jz doSubtract
  // check Side.typeOnCreate == 0 (Player)
  cmp dword ptr [rax+2C],00
  jz skipSubtract

doSubtract:
  pop rax
  pop rcx
code:
  sub [rax+48],edi
  xor edx,edx
  jmp return

skipSubtract:
  pop rax
  pop rcx
  xor edx,edx
  jmp return

MOVEMENT_INJECT:
  jmp newmem
return:

[DISABLE]
MOVEMENT_INJECT:
  db 29 78 48 33 D2

unregistersymbol(MOVEMENT_INJECT)

dealloc(newmem)"""

[[cheat]]
id = "unlimited-builds-per-turn"
name = "Unlimited builds per turn"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game        : HeroesOldenEra.exe
  Last verified version: May 2026 update
  Author      : Heaser
  Description : Skip the BuildingsData.todaysConstructionsCount increment
                when the city belongs to a Player side. AI cities are still
                limited to 1 construction per turn.

  ────────────────────────────────────────────────
  HOOK DETAILS
  ────────────────────────────────────────────────
  Class       : dwo (city build manager)
  Method      : The function that performs the "build a structure" operation
                inside the dwo class.
  Hook site   : inc [rdx+A8] (where rdx is BuildingsData and +0xA8 is the
                todaysConstructionsCount field).
  Strategy    : Skip the increment if the city's Side is Player.

  REGISTER LAYOUT AT HOOK SITE
  ────────────────────────────────────────────────
  rdx   = BuildingsData (the city's building lists + counter at +0xA8)
  rbp   = dwo (the build manager wrapping BuildingsData)

  FIELD CHAIN (5 levels): rbp (dwo) -> fbg -> fco -> dtb -> Side -> typeOnCreate
  ────────────────────────────────────────────────
  dwo.fbg              : +0x28  (city back-reference)
  fbg.fco (via fcf)    : +0x28  (per-side runtime data)
  fco.dtb              : +0x10  (runtime side container)
  dtb.Side             : +0x10  (Side ref)
  Side.typeOnCreate    : +0x2C  (0=Player, 1=Bot, 2=Empty, 3=BotAkaPlayer)

  Also relevant:
  BuildingsData.todaysConstructionsCount : +0xA8

  AOB ANCHOR
  ────────────────────────────────────────────────
  FF 82 A8 00 00 00  inc [rdx+0xA8]              (anchor: the increment)
  45 33 C0           xor r8d, r8d
  41 8B D7           mov edx, r15d
  49 8B CE           mov rcx, r14

  Anchored on field offset +0xA8, plus 3 register-only instructions.
  No wildcards needed - all bytes are stable.

  RECOVERY IF BROKEN
  ────────────────────────────────────────────────
  1. Open dump.cs, locate the BuildingsData class.
  2. Verify "public int todaysConstructionsCount; // 0xA8" still exists at
     that offset. If offset changed, update both the AOB pattern (bytes
     A8 00 00 00) and the inc instruction in the [DISABLE] section.
  3. Verify dwo class still has fbg back-reference at +0x28.
  4. Verify fcf still has fco at +0x28, fco still has dtb at +0x10,
     dtb still has Side at +0x10, Side still has typeOnCreate at +0x2C.
  5. If all class layouts intact, AOB should still match. If not, find
     "inc [rdx+A8]" via "find what writes" on the build counter and
     rebuild AOB from new surrounding code.
}

