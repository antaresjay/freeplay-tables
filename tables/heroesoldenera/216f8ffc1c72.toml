[[cheat]]
id = "multiply-slot-0-count-on-entry-hero-army"
name = "Multiply slot 0 count on entry (Hero army)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game        : HeroesOldenEra.exe
  Version     : Update May 2026
  Author      : Heaser
  Description : Multiply slot 0 count when units move into slot 0 of Hero army

  HOOK DETAILS
  ============
  Class       : dss (army container)
  Method      : Move(int _fromSlot, dss _toParty, int _toSlot, EListenerCallbackCall)
  Hook site   : The unconditional jmp at AOB anchor +0x04 that runs after
                the slotPos write. Original jmp targets the function epilogue
                convergence point at AOB anchor +0x179.

  REGISTER LAYOUT
  ===============
  rdi   = Unit (slot) whose slotPos just got set
  r15d  = the new slotPos value
  rbx   = source dss (the source army, preserved from prologue)

  FIELD OFFSETS USED
  ==================
  Unit.count    : +0x18
  Unit.slotPos  : +0x1C
  dss.type      : +0x28  (1=Hero, 2=City, etc)

  AOB PATTERN
  ===========
  44 89 7F 1C       mov [rdi+1C], r15d       (anchor: slotPos write)
  E9 ?? ?? ?? ??    jmp <epilogue>            (volatile offset)
  49 8B 55 10       mov rdx, [r13+10]         (field +0x10)
  45 33 C0          xor r8d, r8d
  48 8B 4F 10       mov rcx, [rdi+10]         (field +0x10)

  RECOVERY IF BROKEN
  ==================
  1. Find dss.Move in dump.cs, note its RVA.
  2. In CE Memory Viewer Ctrl+G to that RVA.
  3. Scroll to find: mov [rdi+1C], r15d (bytes 44 89 7F 1C).
  4. The next instruction should be: jmp <some address> (E9 ?? ?? ?? ??).
  5. Note that jmp's target.
  6. Update the (TARGET_OFFSET = ...) constant below to:
     <jmp target absolute address> - <AOB anchor address>
}

[ENABLE]
aobscanmodule(SLOTPOS_AOB,GameAssembly.dll,44 89 7F 1C E9 ?? ?? ?? ?? 49 8B 55 10 45 33 C0 48 8B 4F 10)
alloc(newmem,$1000,SLOTPOS_AOB+04)
alloc(multiplier,4)

label(noOverride)

registersymbol(SLOTPOS_AOB)
registersymbol(multiplier)

multiplier:
  dd #2

// Original jmp went to (AOB anchor + 0x179).
// The original instruction at SLOTPOS_AOB+04 was `E9 X4 X3 X2 X1` which jumps
// to (SLOTPOS_AOB + 9 + signed32(X4 X3 X2 X1)).
// In current dump that target is SLOTPOS_AOB + 0x179.

newmem:
  cmp dword ptr [rdi+1C],00
  jne noOverride
  cmp dword ptr [rbx+28],01
  jne noOverride
  push rax
  push rdx
  mov eax,[rdi+18]
  imul eax,[multiplier]
  mov [rdi+18],eax
  pop rdx
  pop rax
noOverride:
  jmp SLOTPOS_AOB+179

SLOTPOS_AOB+04:
  jmp newmem

[DISABLE]
SLOTPOS_AOB+04:
  db E9 70 01 00 00

unregistersymbol(SLOTPOS_AOB)
unregistersymbol(multiplier)

dealloc(newmem)
dealloc(multiplier)"""

