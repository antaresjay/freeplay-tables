type = "script"
source = """
[ENABLE]


aobscanmodule(ammocd,Dishonored.exe,39 34 D9 48 8B 5C 24 30)
alloc(newmem,$1000,"Dishonored.exe"+A60797)

label(code)
label(return)

newmem:
code:
  mov [rcx+rbx*8], #99
  cmp [rcx+rbx*8],esi
  mov rbx,[rsp+30]
  jmp return

ammocd:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(ammocd)

[DISABLE]

ammocd:
  db 39 34 D9 48 8B 5C 24 30

unregistersymbol(ammocd)
