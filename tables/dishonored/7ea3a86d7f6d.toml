[[cheat]]
id = "no-standard-damage"
name = "No Standard Damage"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(noDamage,Dishonored.exe,29 93 44 03 00 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  //sub [ebx+00000344],edx
  jmp return

noDamage:
  jmp code
  nop
return:
registersymbol(noDamage)

[DISABLE]

noDamage:
  db 29 93 44 03 00 00

unregistersymbol(noDamage)
dealloc(newmem)"""

[[cheat]]
id = "inf-health"
name = "Inf Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(damage,Dishonored.exe,29 93 44 03 00 00)
alloc(newmem,$1000)

label(code)
label(playerCheck)
label(playerCheckDaud)
label(return)

newmem:

playerCheck:
  cmp [ebx+00000040],2F
  jne playerCheckDaud
  jmp return

playerCheckDaud:
  cmp [ebx+00000040],36
  jne code
  jmp return

code:
  sub [ebx+00000344],edx
  jmp return

damage:
  jmp playerCheck
  nop
return:
registersymbol(damage)

[DISABLE]

damage:
  db 29 93 44 03 00 00

unregistersymbol(damage)
dealloc(newmem)"""

