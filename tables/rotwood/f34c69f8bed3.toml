[ENABLE]


aobscanmodule(activates_aob,rotwood.exe,48 8B 08 48 8B B4 24 A0 01 00 00)
alloc(newmem,$1000,activates_aob)

label(code)
label(return)

registersymbol(res_ptr)
label(res_ptr)
newmem:

cmp rbx ,000000000609050E
jne code

cmp [rax],#100000
jg code
cmp [res_ptr],0
je @F
dec [res_ptr]

mov [rax],#10000
code:
mov rcx,[rax]
mov rsi,[rsp+000001A0]
