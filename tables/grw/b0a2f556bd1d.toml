[[cheat]]
id = "no-reload"
name = "No Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule( PBYTE_NoReload, GRW.exe, 48895C24??574883EC20488B41??89D34889CF4C6340 )
registersymbol( PBYTE_NoReload )
alloc( pHook, 0x1000, GRW.exe )

pHook:
push rax
push rcx
mov rcx,[rcx+30]
mov rcx,[rcx]
mov rcx,[rcx+10]
mov rax,[o]
test rax,rax
je short @f
  cmp rcx,[rax+10]
  jne short @f
    pop rcx
    pop rax
    ret
@@:
pop rcx
pop rax
mov [rsp+10],rbx
jmp PBYTE_NoReload+5

PBYTE_NoReload:
jmp pHook

[DISABLE]

PBYTE_NoReload:
db 48 89 5C 24 10

dealloc( pHook )
unregistersymbol( PBYTE_NoReload )"""

