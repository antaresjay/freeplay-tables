[[cheat]]
id = "super-accuracy"
name = "Super Accuracy"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule( PBYTE_SuperAccuracy, GRW.exe, 80BBF400000000C683E400000001 )
registersymbol( PBYTE_SuperAccuracy )
alloc( pHook, 0x1000, GRW.exe )

pHook:
push rax
push rcx
mov rcx,[rdi+A8]
mov rcx,[rcx]
mov rcx,[rcx+30]
mov rcx,[rcx]
mov rcx,[rcx+10]
mov rax,[o]
test rax,rax
je @f
  cmp rcx,[rax+10]
  jne short @f
    mov byte ptr [rbx+F4],1
    mov rcx,[rdi+A8]
    mov rcx,[rcx]
    mov rcx,[rcx+118] //changed from 0x100 (Title Update 7) to 0x108 (Title Update 8) and to 0x110 (Title Update 12) and to 0x118 (TU15)
    mov rcx,[rcx]
    test rcx,rcx
    je short @f
      mov rcx,[rcx+220]
      test rcx,rcx
      je short @f
        mov rcx,[rcx]
        test rcx,rcx
        je short @f
          mov [rcx+20],FFFFFFFF
          mov [rcx+24],FFFFFFFF
          mov [rcx+28],FFFFFFFF
          mov [rcx+2C],FFFFFFFF
@@:
pop rcx
pop rax
cmp byte ptr [rbx+F4],0
jmp PBYTE_SuperAccuracy+7

PBYTE_SuperAccuracy:
jmp pHook
db 90 90

[DISABLE]

PBYTE_SuperAccuracy:
db 80 BB F4 00 00 00 00

dealloc( pHook )
unregistersymbol( PBYTE_SuperAccuracy )"""

