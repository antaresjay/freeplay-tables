[[cheat]]
id = "enable-cheats"
name = "Enable Cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : wargroove.exe
  Version: 2.1.7 | Windows Store
  Date   : 2020-10-28
  Author : SovietWristwatch.jpg
}

[ENABLE]
aobscanmodule(enableCheats,wargroove.exe,8B 08 85 C9 7E 1C)
alloc(newmem,$1000,enableCheats)

label(code)
label(return)
label(_easyKills)

newmem:
  cmp [_easyKills],1
  jne code
  cmp [rax],#1
  jle code
  cmp [rax],#100
  jg code
  mov [rax],#1

code:
  mov ecx,[rax]
  test ecx,ecx
  jle wargroove.exe+45A611
  jmp return

_easyKills:
  dd 0

enableCheats:
  jmp newmem
  nop
return:
registersymbol(enableCheats)
registersymbol(_easyKills)

[DISABLE]
enableCheats:
  db 8B 08 85 C9 7E 1C

unregistersymbol(enableCheats)
unregistersymbol(_easyKills)
dealloc(newmem)"""

