[[cheat]]
id = "activate-trainer-2-1-controls-damage-modifier"
name = "Activate Trainer 2.1 (Controls Damage Modifier)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(GetMainGamePtrAOB1,MainGame.getBattleMenuInputInfo,MainGame.getBattleMenuInputInfo+100,48 8B 44 D9 20 48 8B 5C 24 30 48 83 C4 20 5F C3 48 8B 5C 24 30)
registersymbol(GetMainGamePtrAOB1)
alloc(newmem,1024)

///
label(return)
label(GetMainGamePtrAOB1Save)
registersymbol(GetMainGamePtrAOB1Save)

///
newmem:
  mov [R15Save],r15
  mov r15,MainGamePtr
  mov [r15],rdi
  jmp MyCleanUp1

MyCleanUp1:
  mov r15,[R15Save]
  jmp originalcode
  
originalcode:
GetMainGamePtrAOB1Save:
  readmem(GetMainGamePtrAOB1,14)
  jmp GetMainGamePtrAOB1+0E
    
R15Save:
dq 0
  
///
GetMainGamePtrAOB1:
  jmp newmem
  return:
   
[DISABLE]

///
GetMainGamePtrAOB1:
  readmem(GetMainGamePtrAOB1Save,14)
  
unregistersymbol(GetMainGamePtrAOB1)
unregistersymbol(GetMainGamePtrAOB1Save)

dealloc(newmem)"""

