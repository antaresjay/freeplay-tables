[[cheat]]
id = "scriptmain-base-address-scan-initialization-activate-this-first"
name = "ScriptMain Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(ScriptMain_basepointer)
registersymbol(ScriptMain_update_enable)
registersymbol(ScriptMain_lifeset_enable)
registersymbol(ScriptMain_missesset_enable)
registersymbol(ScriptMain_shieldset_enable)

alloc(ScriptMain_basepointer, 8)
alloc(ScriptMain_update_enable, 4)
alloc(ScriptMain_lifeset_enable, 4)
alloc(ScriptMain_missesset_enable, 4)
alloc(ScriptMain_shieldset_enable, 4)


[DISABLE]
unregistersymbol(ScriptMain_basepointer)
unregistersymbol(ScriptMain_update_enable)
unregistersymbol(ScriptMain_lifeset_enable)
unregistersymbol(ScriptMain_missesset_enable)
unregistersymbol(ScriptMain_shieldset_enable)

dealloc(ScriptMain_basepointer)
dealloc(ScriptMain_update_enable)
dealloc(ScriptMain_lifeset_enable)
dealloc(ScriptMain_missesset_enable)
dealloc(ScriptMain_shieldset_enable)"""

[[cheat]]
id = "scriptmain-base-address-scan-to-activate-play-level-to-update-play-level"
name = "ScriptMain Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(ScriptMain_savedAOB)
label(ScriptMain_returnhere)
label(ScriptMain_originalcode)
label(ScriptMain_exit)

label(ScriptMain_update_exit)
label(ScriptMain_lifeset_exit)
label(ScriptMain_missesset_exit)
label(ScriptMain_shieldset_exit)

registersymbol(ScriptMain_originalcode)
registersymbol(ScriptMain_savedAOB)

//1AF924ED - C6 00 00              - mov byte ptr [rax],00
//1AF924F0 - E9 198E0000           - jmp 1AF9B30E
// ScriptMain:Update+225
//1AF924F5 - 48 8B 86 B0050000     - mov rax,[rsi+000005B0]
//1AF924FC - 48 89 85 38F6FFFF     - mov [rbp-000009C8],rax
//1AF92503 - 48 8B 40 10           - mov rax,[rax+10]
//1AF92507 - 48 8B CD              - mov rcx,rbp
//1AF9250A - 48 81 C1 A8F9FFFF     - add rcx,FFFFF9A8
//1AF92511 - 48 8B D0              - mov rdx,rax
aobscan(ScriptMain_searchedAOB, 48 8B 86 B0 05 00 00 48 89 85 38 F6 FF FF 48 8B 40 10 48 8B CD)

alloc(ScriptMain_newmem, 2048, ScriptMain_searchedAOB)
alloc(ScriptMain_temp1, 8, ScriptMain_searchedAOB)
alloc(ScriptMain_temp2, 8, ScriptMain_searchedAOB)
alloc(ScriptMain_temp3, 8, ScriptMain_searchedAOB)
alloc(ScriptMain_temp4, 8, ScriptMain_searchedAOB)
alloc(ScriptMain_temp5, 8, ScriptMain_searchedAOB)


ScriptMain_newmem:
mov [ScriptMain_temp1], rax
mov [ScriptMain_temp2], rbx
mov [ScriptMain_temp3], rcx
mov [ScriptMain_temp4], rdx

cmp dword ptr [ScriptMain_update_enable], #0
je ScriptMain_update_exit
mov [ScriptMain_basepointer], rsi
ScriptMain_update_exit:

cmp dword ptr [ScriptMain_lifeset_enable], #0
je ScriptMain_lifeset_exit
mov rbx, [rsi+5b0]
test rbx, rbx
je ScriptMain_lifeset_exit
mov rbx, [rbx+1a0]
test rbx, rbx
je ScriptMain_lifeset_exit
fld [rbx+110]
fstp [rbx+118]
ScriptMain_lifeset_exit:

cmp dword ptr [ScriptMain_missesset_enable], #0
je ScriptMain_missesset_exit
mov [rsi+7f8], #0
mov [rsi+7fc], #0
mov rbx, [rsi+5b0]
test rbx, rbx
je ScriptMain_missesset_exit
mov [rbx+270], #0
ScriptMain_missesset_exit:

cmp dword ptr [ScriptMain_shieldset_enable], #0
je ScriptMain_shieldset_exit
mov rbx, [rsi+5b0]
test rbx, rbx
je ScriptMain_shieldset_exit
mov byte ptr [rbx+256], #1
mov [rbx+290], (float)9999
mov [rbx+294], (float)9999
mov [rbx+298], (float)9999
ScriptMain_shieldset_exit:

mov rax, [ScriptMain_temp1]
mov rbx, [ScriptMain_temp2]
mov rcx, [ScriptMain_temp3]
mov rdx, [ScriptMain_temp4]


ScriptMain_originalcode:
readmem(ScriptMain_searchedAOB, 7)


ScriptMain_exit:
jmp ScriptMain_returnhere


ScriptMain_searchedAOB:
ScriptMain_savedAOB:
jmp ScriptMain_newmem
nop
nop
ScriptMain_returnhere:


[DISABLE]
ScriptMain_savedAOB:
readmem(ScriptMain_originalcode, 7)

unregistersymbol(ScriptMain_originalcode)
unregistersymbol(ScriptMain_savedAOB)

dealloc(ScriptMain_newmem)
dealloc(ScriptMain_temp1)
dealloc(ScriptMain_temp2)
dealloc(ScriptMain_temp3)
dealloc(ScriptMain_temp4)
dealloc(ScriptMain_temp5)"""

