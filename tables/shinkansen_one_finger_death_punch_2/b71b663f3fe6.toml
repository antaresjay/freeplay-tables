[[cheat]]
id = "playersave-static-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerSave_static Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerSave_static_savedAOB)
label(PlayerSave_static_returnhere)
label(PlayerSave_static_originalcode)
label(PlayerSave_static_exit)

label(PlayerSave_static_update_exit)
label(PlayerSave_static_speedset_exit)

registersymbol(PlayerSave_static_originalcode)
registersymbol(PlayerSave_static_savedAOB)

//1C993645 - F2 0F59 C1            - mulsd xmm0,xmm1
//1C993649 - B8 A892251D           - mov eax,1D2592A8 : [(float)3.0000]
// ScriptMain:FindSpeed+46e
//1C99364E - F3 0F10 08            - movss xmm1,[rax]
//1C993652 - F3 0F5A C9            - cvtss2sd xmm1,xmm1
//1C993656 - F2 0F59 C1            - mulsd xmm0,xmm1
//1C99365A - F3 0F10 8E 94070000   - movss xmm1,[rsi+00000794]
//1C993662 - F3 0F5A C9            - cvtss2sd xmm1,xmm1
//1C993666 - F2 0F59 C1            - mulsd xmm0,xmm1
//1C99366A - 48 8B 86 E0050000     - mov rax,[rsi+000005E0]
//1C993671 - F3 0F10 48 24         - movss xmm1,[rax+24]
aobscan(PlayerSave_static_searchedAOB, F3 0F 10 08 F3 0F 5A C9 F2 0F 59 C1 F3 0F 10 8E 94 07 00 00 F3 0F 5A C9 F2 0F 59 C1)

alloc(PlayerSave_static_newmem, 2048, PlayerSave_static_searchedAOB)
alloc(PlayerSave_static_temp1, 8, PlayerSave_static_searchedAOB)
alloc(PlayerSave_static_temp2, 8, PlayerSave_static_searchedAOB)
alloc(PlayerSave_static_temp3, 8, PlayerSave_static_searchedAOB)
alloc(PlayerSave_static_temp4, 8, PlayerSave_static_searchedAOB)
alloc(PlayerSave_static_temp5, 8, PlayerSave_static_searchedAOB)


PlayerSave_static_newmem:
mov [PlayerSave_static_temp1], rax
mov [PlayerSave_static_temp2], rbx
mov [PlayerSave_static_temp3], rcx
mov [PlayerSave_static_temp4], rdx

cmp dword ptr [PlayerSave_static_update_enable], #0
je PlayerSave_static_update_exit
mov [PlayerSave_static_basepointer], rax
PlayerSave_static_update_exit:

cmp dword ptr [PlayerSave_static_speedset_enable], #0
je PlayerSave_static_speedset_exit
mov [rax+0], (float)0.1
PlayerSave_static_speedset_exit:

mov rax, [PlayerSave_static_temp1]
mov rbx, [PlayerSave_static_temp2]
mov rcx, [PlayerSave_static_temp3]
mov rdx, [PlayerSave_static_temp4]


PlayerSave_static_originalcode:
readmem(PlayerSave_static_searchedAOB, 8)


PlayerSave_static_exit:
jmp PlayerSave_static_returnhere


PlayerSave_static_searchedAOB:
PlayerSave_static_savedAOB:
jmp PlayerSave_static_newmem
nop
nop
nop
PlayerSave_static_returnhere:


[DISABLE]
PlayerSave_static_savedAOB:
readmem(PlayerSave_static_originalcode, 8)

unregistersymbol(PlayerSave_static_originalcode)
unregistersymbol(PlayerSave_static_savedAOB)

dealloc(PlayerSave_static_newmem)
dealloc(PlayerSave_static_temp1)
dealloc(PlayerSave_static_temp2)
dealloc(PlayerSave_static_temp3)
dealloc(PlayerSave_static_temp4)
dealloc(PlayerSave_static_temp5)"""

