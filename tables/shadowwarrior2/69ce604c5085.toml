[[cheat]]
id = "compare-variables"
name = "Compare Variables"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(values,ShadowWarrior2.exe,8B 41 04 89 44 24 24 8B 41 08 48 8B)
alloc(newmem,$1000,values)

label(code)
label(return)
label(address)
label(compare)
label(offset)
label(skip)

newmem:
  cmp [rcx+0C],00080006
  jne code
  cmp [rcx+10],00010000
  jbe code
  mov rax,[rcx+10]
  add rax,20
  //cmp word ptr [rax],#9
  //jne @f
  cmp dword ptr [rax+2],'Spaw'
  jne @f
  cmp dword ptr [rax+6],'nInC'
  jne @f
  lea rax,[rax]
  lea rax,[rcx+04]
@@:
  mov rax,address
  cmp [rax],0
  je @f
  cmp [rax],rcx
  jne code
  jmp skip
@@:
  mov rax,compare
  mov eax,[rax]
  cmp eax,[rcx+04]
  jne code
skip:
  mov rax,offset
  mov rax,[rax]
  add rax,rsp
  mov rax,[rax]
  lea rax,[rax]
  mov eax,[rcx+04]
code:
  mov eax,[rcx+04]
  mov [rsp+24],eax
  jmp return

address:
  dq 0

compare:
  dq 0

offset:
  dq 38

values:
  jmp newmem
  nop
  nop
return:
registersymbol(values)
registersymbol(compare)
registersymbol(offset)
registersymbol(address)

[DISABLE]
values:
  db 8B 41 04 89 44 24 24
unregistersymbol(values)
