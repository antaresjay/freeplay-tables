  db 'XP'
drops:
  dw #18
  db 'ItemsNumberToSpawn'
level:
  dw #24
  db 'UpgradeDropLevelModifier'
radius:
  dw #22
  db 'AutoCollectRadiusBonus'
modifiers:
  dw #9
  db 'Modifiers'
basestats:
  dw #9
  db 'BaseStats'

zanzer_ptr:
  dq 0

items_on:
  db 0
ammo_on:
  db 0
special_on:
  db 0
lore_on:
  db 0
cookie_on:
  db 0
weapon_on:
  db 0
heart_on:
  db 0
head_on:
  db 0
quality_on:
  db 0
drops_on:
  db 0
level_on:
  db 0
radius_on:
  db 0

money_ptr:
  dq 0
perks_ptr:
  dq 0
xp_ptr:
  dq 0
modifiers_ptr:
  dq 0
weapon_ptr:
  dq 0

zanzer:
  jmp newmem
  nop
return:
registersymbol(zanzer)
registersymbol(zanzer_ptr)
registersymbol(items_on)
registersymbol(ammo_on)
registersymbol(money_ptr)
registersymbol(perks_ptr)
registersymbol(special_on)
registersymbol(lore_on)
registersymbol(cookie_on)
registersymbol(weapon_on)
registersymbol(heart_on)
registersymbol(head_on)
registersymbol(quality_on)
registersymbol(xp_ptr)
registersymbol(drops_on)
registersymbol(level_on)
registersymbol(radius_on)
registersymbol(modifiers_ptr)
registersymbol(weapon_ptr)

[DISABLE]
zanzer:
  db 81 39 0D 00 08 00
unregistersymbol(zanzer)
unregistersymbol(zanzer_ptr)
unregistersymbol(items_on)
unregistersymbol(ammo_on)
unregistersymbol(money_ptr)
unregistersymbol(perks_ptr)
unregistersymbol(special_on)
unregistersymbol(lore_on)
unregistersymbol(cookie_on)
unregistersymbol(weapon_on)
unregistersymbol(heart_on)
unregistersymbol(head_on)
unregistersymbol(quality_on)
unregistersymbol(xp_ptr)
unregistersymbol(drops_on)
unregistersymbol(level_on)
unregistersymbol(radius_on)
unregistersymbol(modifiers_ptr)
unregistersymbol(weapon_ptr)
dealloc(newmem)

