[[cheat]]
id = "main-script"
name = "Main Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(zanzer,ShadowWarrior2.exe,81 39 0D 00 08 00 48 8D 54 24 20)
alloc(newmem,$2000,zanzer)

label(code)
label(return)
label(zanzer_ptr)
label(is_equal)
label(items_on)
label(ammo_on)
label(ammo_off)
label(special_on)
label(lore_on)
label(cookie_on)
label(weapon_on)
label(heart_on)
label(head_on)
label(quality_on)
label(money_ptr)
label(perks_ptr)
label(xp_ptr)
label(level_on)
label(drops_on)
label(radius_on)
label(modifiers_ptr)
label(weapon_ptr)

newmem:
  // credits to mgr.inz.Player for compares
  cmp [rcx+0C],00080006
  jne code
  cmp [rcx+10],00010000
  jbe code
  //cmp [rcx],00040000
  //jb code
  //cmp [rcx],00040001
  //ja code
  // find money structure for player pointers
  mov rax,money
  call is_equal
  test al,al
  jz @f
  mov rdx,zanzer_ptr
  mov [rdx],r11
  mov rdx,money_ptr
  mov [rdx],rcx
@@: // set the % of item find
  mov rax,items_on
  cmp byte ptr [rax],1
  jne @f
  mov rax,items
  call is_equal
  test al,al
  jz @f
  mov [rcx+04],(float)101
@@: // set special drop chance
  mov rax,special_on
  cmp byte ptr [rax],1
  jne @f
  mov rax,special
  call is_equal
  test al,al
  jz @f
  mov [rcx+04],(float)2
@@: // set lore drop chance
  mov rax,lore_on
  cmp byte ptr [rax],1
  jne @f
  mov rax,lore
  call is_equal
  test al,al
  jz @f
  mov [rcx+04],(float)101
@@: // set cookie drop chance
  mov rax,cookie_on
  cmp byte ptr [rax],1
  jne @f
  mov rax,cookie
  call is_equal
  test al,al
  jz @f
  mov [rcx+04],(float)101
@@: // set weapon drop chance
  mov rax,weapon_on
  cmp byte ptr [rax],1
  jne @f
  mov rax,weapon
  call is_equal
  test al,al
  jz @f
  mov [rcx+04],(float)2
@@: // set heart drop chance
  mov rax,heart_on
  cmp byte ptr [rax],1
  jne @f
  mov rax,heart
  call is_equal
  test al,al
  jz @f
  mov [rcx+04],(float)2
@@: // set head drop chance
  mov rax,head_on
  cmp byte ptr [rax],1
  jne @f
  mov rax,head
  call is_equal
  test al,al
  jz @f
  mov [rcx+04],(float)2
@@: // set quality drop chance
  mov rax,quality_on
  cmp byte ptr [rax],1
  jne @f
  mov rax,quality
  call is_equal
  test al,al
  jz @f
  mov [rcx+04],(float)5
@@: // set number of drops
  mov rax,drops_on
  cmp byte ptr [rax],1
  jne @f
  mov rax,drops
  call is_equal
  test al,al
  jz @f
  mov [rcx+04],#10
@@: // set upgrade level mult
  mov rax,level_on
  cmp byte ptr [rax],1
  jne @f
  mov rax,level
  call is_equal
  test al,al
  jz @f
  mov [rcx+04],(float)5
@@: // set collect radius
  mov rax,radius_on
  cmp byte ptr [rax],1
  jne @f
  mov rax,radius
  call is_equal
  test al,al
  jz @f
  mov [rcx+04],(float)20
@@: // get perks pointer
  mov rax,perks
  call is_equal
  test al,al
  jz @f
  mov rdx,perks_ptr
  mov [rdx],rcx
@@: // xp pointer
  mov rax,xp
  call is_equal
  test al,al
  jz @f
  mov rdx,xp_ptr
  mov [rdx],rcx
@@: // modifiers pointer
  mov rax,modifiers
  call is_equal
  test al,al
  jz @f
  mov rdx,modifiers_ptr
  mov [rdx],rcx
@@: // weapon pointer
  mov rax,basestats
  call is_equal
  test al,al
  jz @f
  mov rdx,weapon_ptr
  mov [rdx],rcx
@@: // unlimited ammo
  mov rax,ammo_on
  cmp byte ptr [ammo_on],1
  jne ammo_off
  mov rax,ammo
  call is_equal
  test al,al
  jnz @f
  mov rax,ammo_per
  call is_equal
  test al,al
  jz ammo_off
@@:
  mov [rcx+04],0
ammo_off:

code:
  cmp [rcx],0008000D
  jmp return

is_equal:
  push rbx
  push rdi
  mov rdx,[rcx+10]
  add rdx,20
  mov di,[rdx]
  cmp [rax],di
  jne is_equal_false
  add rdx,2
  add rax,2
is_equal_loop:
  mov bl,[rdx]
  cmp [rax],bl
  jne is_equal_false
  dec di
  jz is_equal_true
  inc rdx
  inc rax
  jmp is_equal_loop
is_equal_true:
  mov rax,1
  pop rdi
  pop rbx
  ret
is_equal_false:
  xor rax,rax
  pop rdi
  pop rbx
  ret

money:
  dw #5
  db 'Money'
perks:
  dw #11
  db 'PerksPoints'
items:
  dw #9
  db 'FindItems'
ammo:
  dw #8
  db 'AmmoCost'
ammo_per:
