type = "script"
source = """
//Send@ModEngine
[ENABLE]
aobscanmodule(spellcooldown,HogwartsLegacy.exe,F3 0F 10 B6 D8 0B 00 00)
alloc(newmem,$1000,spellcooldown)
label(code return)

newmem:
mov [rsi+00000BD8],(float)100
mov [rsi+00000BDC],(float)100
code:
  movss xmm6,[rsi+00000BD8]
  jmp return

spellcooldown:
  jmp newmem
  nop 3
return:
registersymbol(spellcooldown)

[DISABLE]

spellcooldown:
  db F3 0F 10 B6 D8 0B 00 00

unregistersymbol(*)
dealloc(*)"""
