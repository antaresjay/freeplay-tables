[ENABLE]

registersymbol(SQLExec)
alloc(SQLExec,16384)

SQLExec:
  sub rsp,348
  mov [R14Save],r14
  mov [R15Save],r15
  mov r14,pBuffer
  mov r15,iCustomSQLNum
  cmp dword ptr [r15],1
  jne SkipFirstSQL
  mov r15,pCustomSQL1
  mov [r14],r15
  jmp DoSQL
SkipFirstSQL:
  mov r15,pCustomSQL2
  mov [r14],r15
  jmp DoSQL
DoSQL:
  mov r14,[R14Save]
  mov r15,[R15Save]
  mov rcx,pCustomSQL1
  call lstrlenW
  mov [pBuffer+8],eax
  add eax,4
  mov [pBuffer+C],eax
  mov dl,1
  mov rcx,pBuffer
  call SQLCommitCall
  add rsp,348
  ret

align 10 CC

R14Save:
dq 0
R15Save:
dq 0
pBuffer:
dq pCustomSQL1 // pointer to SQL statement UNICODE string
dd 0 // size without terminator
dd 0 // size with terminator (above + 4)

align 10 CC
  
[DISABLE]

unregistersymbol(SQLExec)

///
dealloc(SQLExec)"""

