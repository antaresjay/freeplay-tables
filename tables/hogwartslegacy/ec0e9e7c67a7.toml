type = "script"
source = """
[ENABLE]

///
//aobscanmodule(SQLUpdateAOB,$process,B2 01 48 8D 4D ?? E8 ?? ?? ?? ?? 48 8B 4D ?? E9 ?? ?? ?? ?? BA 03 00 00 00 48)
aobscanmodule(SQLUpdateAOB,$process,B2 01 48 8D 4D ?? E8 ?? ?? ?? ?? 48 8B 4D ?? E9 ?? ?? ?? ?? BA 60 00 00 00 4C)
registersymbol(SQLUpdateAOB)
alloc(newmem,4096)

///
label(SQLUpdateAOBSave)
registersymbol(SQLUpdateAOBSave)

///
newmem:
  readmem(SQLUpdateAOB,6)
  mov [R9Save],r9
  mov [R10Save],r10
  mov [R11Save],r11
  mov [R12Save],r12
  mov [R13Save],r13
  mov [R14Save],r14
  mov [R15Save],r15
  mov r14,[rcx]
  mov [RCXSave],r14
  test r14,r14
  je MyCleanUp1
  // Determine The SQL Statement Size
  xor r12,r12
StartSizeCheckLoop:
  cmp word ptr [r14],0
  je EndOfString
  add r14,2
  inc r12d
  jmp StartSizeCheckLoop
EndOfString:
  inc r12d
  mov [CurrentSQLSize],r12d
  // Check if this is updating Inventory
  mov r14,[rcx]
  test r14,r14
  je MyCleanUp1
  xor r12,r12
  mov r15,constInventoryUpdate1
StartFirstCheckLoop:
  cmp r12,6
  jge PassedFirstCheck
  mov r13,[r15+r12*8]
  mov r10,[r14]
  cmp r10,r13
  jne MyCleanUp1
  inc r12
  add r14,08
  jmp StartFirstCheckLoop
PassedFirstCheck:
  // Check for VendorStock Update
  xor r11,r11
  mov r14,[rcx]
  test r14,r14
  je MyCleanUp1
  mov [R14Save2],r14
StartVendorCheckOuterLoop:
  mov r14,[R14Save2]
  cmp r11d,[CurrentSQLSize]
  jge DoneWithVendorStockSearch
  xor r12,r12
  mov r15,constVendorStock1
StartVendorCheckInnerLoop:
  cmp r12,3
  jge PassedVendorStockTest
  mov r13,[r15+r12*8]
  mov r10,[r14]
  cmp r10,r13
  jne SkipRestOfVendorStockInnerLoop
  add r14,08
  inc r12d
  jmp StartVendorCheckInnerLoop
SkipRestOfVendorStockInnerLoop:
  mov r14,[R14Save2]
  add r14,2
  mov [R14Save2],r14
  inc r11d
  jmp StartVendorCheckOuterLoop
DoneWithVendorStockSearch:
  jmp CheckPlayer0
PassedVendorStockTest:
  // This is something we want to change the count of
  // First, search for Count = in the SQL  
  xor r11,r11
  mov r14,[rcx]
  test r14,r14
  je MyCleanUp1
  mov [R14Save2],r14
StartCountCheckOuterLoop:
  mov r14,[R14Save2]
  cmp r11d,[CurrentSQLSize]
  jge DoneWithCountSearch
  xor r12,r12
  mov r15,constCount1
StartCountCheckInnerLoop:
  cmp r12,2
  jge PassedCountTest
  mov r13,[r15+r12*8]
  mov r10,[r14]
  cmp r10,r13
  jne SkipRestOfCountInnerLoop
  add r14,08
  inc r12d
  jmp StartCountCheckInnerLoop
SkipRestOfCountInnerLoop:
  mov r14,[R14Save2]
  add r14,2
  mov [R14Save2],r14
  inc r11d
  jmp StartCountCheckOuterLoop
DoneWithCountSearch:
  jmp MyCleanUp1
PassedCountTest:
  mov r15,bInfiniteVendorStock
  cmp dword ptr [r15],1
  jne MyCleanUp1
  add r14,08
  cmp byte ptr [r14],39
  je MyCleanUp1
  inc [r14]
  jmp MyCleanUp1
CheckPlayer0:
  xor r11,r11
  mov r14,[rcx]
  test r14,r14
  je MyCleanUp1
  mov [R14Save2],r14
StartPlayer0CheckOuterLoop:
  mov r14,[R14Save2]
  cmp r11d,[CurrentSQLSize]
  jge DoneWithPlayer0Search
  xor r12,r12
  mov r15,constPlayer01
StartPlayer0CheckInnerLoop:
  cmp r12,2
  jge PassedPlayer0Test
  mov r13,[r15+r12*8]
  mov r10,[r14]
  cmp r10,r13
  jne SkipRestOfPlayer0InnerLoop
  add r14,08
  inc r12d
  jmp StartPlayer0CheckInnerLoop
SkipRestOfPlayer0InnerLoop:
  mov r14,[R14Save2]
  add r14,2
  mov [R14Save2],r14
  inc r11d
  jmp StartPlayer0CheckOuterLoop
DoneWithPlayer0Search:
  jmp MyCleanUp1
PassedPlayer0Test:
  // Check for Knuts Update
  xor r11,r11
  mov r14,[rcx]
  test r14,r14
  je MyCleanUp1
  mov [R14Save2],r14
StartKnutsCheckOuterLoop:
  mov r14,[R14Save2]
  cmp r11d,[CurrentSQLSize]
  jge DoneWithKnutsSearch
  xor r12,r12
  mov r15,constKnuts1
StartKnutsCheckInnerLoop:
  cmp r12,2
  jge PassedKnutsTest
  mov r13,[r15+r12*8]
  mov r10,[r14]
  cmp r10,r13
  jne SkipRestOfKnutsInnerLoop
  add r14,08
  inc r12d
  jmp StartKnutsCheckInnerLoop
SkipRestOfKnutsInnerLoop:
  mov r14,[R14Save2]
  add r14,2
  mov [R14Save2],r14
  inc r11d
  jmp StartKnutsCheckOuterLoop
DoneWithKnutsSearch:
  jmp CheckMaxInventoryItem
PassedKnutsTest:
  mov r15,bSetMaxKnutsOnUpdate
  cmp dword ptr [r15],1
  je DoKnutsUpdate
  mov r15,bSetLowKnutsInsteadOnUpdate
  cmp dword ptr [r15],1
  jne MyCleanUp1
DoKnutsUpdate:
  // First, search for Count
  xor r11,r11
  mov r14,[rcx]
  test r14,r14
  je MyCleanUp1
  mov [R14Save2],r14
StartCountCheckOuterLoop2:
  mov r14,[R14Save2]
  cmp r11d,[CurrentSQLSize]
  jge DoneWithCountSearch2
  xor r12,r12
  mov r15,constCount1
StartCountCheckInnerLoop2:
  cmp r12,2
  jge PassedCountTest2
  mov r13,[r15+r12*8]
  mov r10,[r14]
  cmp r10,r13
  jne SkipRestOfCountInnerLoop2
  add r14,08
  inc r12d
  jmp StartCountCheckInnerLoop2
SkipRestOfCountInnerLoop2:
  mov r14,[R14Save2]
  add r14,2
  mov [R14Save2],r14
  inc r11d
  jmp StartCountCheckOuterLoop2
DoneWithCountSearch2:
  jmp MyCleanUp1
PassedCountTest2:
StartCommaSearchLoop:
  cmp word ptr [r14],002C
  je FoundComma
  mov r15,bSetMaxKnutsOnUpdate
  cmp [r15],1
  je SetMaxKnuts
  mov word ptr [r14],0030
  add r14,2
  jmp StartCommaSearchLoop  
SetMaxKnuts:
  mov word ptr [r14],0039
  add r14,2
  jmp StartCommaSearchLoop
FoundComma:
  mov r15,bSetLowKnutsInsteadOnUpdate
  cmp [r15],1
  jne MyCleanUp1
  sub r14,2
  mov word ptr [r14],0039
  add r14,2
  jmp MyCleanUp1
CheckMaxInventoryItem:
  mov r15,bSetMaxPlayerInventory
  cmp dword ptr [r15],1
  je DoPlayerInventoryUpdate
  mov r15,bSetLowPlayerInventoryInsteadOnUpdate
  cmp dword ptr [r15],1
  jne MyCleanUp1
DoPlayerInventoryUpdate:
  // First, search for Count
  xor r11,r11
  mov r14,[rcx]
  test r14,r14
  je MyCleanUp1
  mov [R14Save2],r14
StartCountCheckOuterLoop3:
  mov r14,[R14Save2]
  cmp r11d,[CurrentSQLSize]
  jge DoneWithCountSearch3
  xor r12,r12
  mov r15,constCount1
StartCountCheckInnerLoop3:
  cmp r12,2
  jge PassedCountTest3
  mov r13,[r15+r12*8]
  mov r10,[r14]
  cmp r10,r13
  jne SkipRestOfCountInnerLoop3
  add r14,08
  inc r12d
  jmp StartCountCheckInnerLoop3
SkipRestOfCountInnerLoop3:
  mov r14,[R14Save2]
  add r14,2
  mov [R14Save2],r14
  inc r11d
  jmp StartCountCheckOuterLoop3
DoneWithCountSearch3:
  jmp MyCleanUp1
PassedCountTest3:
StartCommaSearchLoop2:
  cmp word ptr [r14],002C
  je FoundComma2
  mov r15,bSetMaxPlayerInventory
  cmp [r15],1
  je SetMaxPlayerInventory
  mov word ptr [r14],0030
  add r14,2
  jmp StartCommaSearchLoop  
SetMaxPlayerInventory:
  mov word ptr [r14],0039
  add r14,2
  jmp StartCommaSearchLoop2
FoundComma2:
  mov r15,bSetLowPlayerInventoryInsteadOnUpdate
  cmp [r15],1
  jne MyCleanUp1
  sub r14,2
  mov word ptr [r14],0039
  add r14,2
  jmp MyCleanUp1
  
MyCleanUp1:
  mov r9,[R9Save]
  mov r10,[R10Save]
  mov r11,[R11Save]
  mov r12,[R12Save]
  mov r13,[R13Save]
  mov r14,[R14Save]
  mov r15,[R15Save]
  
originalcode:
  call SQLCommitCall
  readmem(SQLUpdateAOB+B,4)
  jmp SQLUpdateAOB+0F

SQLUpdateAOBSave:
  readmem(SQLUpdateAOB,15)
  
CurrentSQLSize:
dq 0
NewSQLSize:
dq 0
RCXSave:
dq 0
R14Save2:
dq 0
R9Save:
dq 0
R10Save:
dq 0
R11Save:
dq 0
R12Save:
dq 0
R13Save:
dq 0
R14Save:
dq 0
R15Save:
dq 0

SQLUpdateAOB:
  jmp newmem
  return:
  
[DISABLE]

SQLUpdateAOB:
  readmem(SQLUpdateAOBSave,15)

unregistersymbol(SQLUpdateAOBSave)

///
dealloc(newmem)"""

