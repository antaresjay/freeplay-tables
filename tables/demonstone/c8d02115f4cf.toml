[[cheat]]
id = "hp"
name = "hp"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(hp,Demonstone.exe,DB 86 E8 02 00 00 83) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  fild dword ptr [esi+000002E8]
  mov [esi+2E8],#2000
  jmp return

hp:
  jmp newmem
  nop
return:
registersymbol(hp)

[DISABLE]

hp:
  db DB 86 E8 02 00 00

unregistersymbol(hp)
dealloc(newmem)"""

