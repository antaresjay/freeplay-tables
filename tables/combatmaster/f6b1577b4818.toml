  push rax
  mov rax,["Project.dll"+04B23AB8]
  cmp [rax],0  // crash prevention while dead/dying
  je clean
  mov rax,[rax+B8]
  mov rax,[rax+8]
  mov rax,[rax+98]
  mov rax,[rax+10]
  cmp [rax+70],0  // crash prevention while dead/dying
  je clean
  mov rax,[rax+70]
  mov rax,[rax+1F0]
  mov rax,[rax+38]
  mov [_testXID],rax
  pop rax
  //cmp [_testXID],#3
  //jl code
  //cmp [_testXID],#99999
  //jg code
  jmp compare


compare:
  push rax
  mov rax,[rdi+000001F0]
  mov rax,[rax+38]
  cmp rax,[_testXID]
  pop rax
  je playerX
  jmp botX


playerX:
  //cmp [_testXID],0
  //je code
  mov [_testX],rdi
  jmp code


botX:
  cmp [vacuumToggle],#0
  je code
  cmp [vacuumToggle],#2
  je botStatic
  cmp [vacuumToggle],#1
  jne code
  //cmp [_testX],0
  //je code
  push rax
  mov rax,[_testX]
  test rax,rax
  je clean

