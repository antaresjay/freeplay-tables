[[cheat]]
id = "inf-coin-for-shopping"
name = "Inf Coin (for shopping)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : FightAngel.exe
  Version: 
  Date   : 2019-08-31
  Author : Anjinggila

  This script does blah blah blah
}

define(coin,BWUIStoreView:buyit+18e)
define(bytes,89 48 44 48 8B 04 25 E0 CD AC 04)

[ENABLE]

assert(coin,bytes)
alloc(newmem,$1000,BWUIStoreView:buyit+18e)

label(code)
label(return)

newmem:

code:
  mov [rax+44],#9999999
  mov rax,[04ACCDE0]
  jmp return

coin:
  jmp newmem
  nop 6
return:

[DISABLE]

coin:
  db bytes

dealloc(newmem)"""

[[cheat]]
id = "editable-stat-edit-this-script-to-change-to-player-1-2"
name = "Editable Stat (edit this script to change to player 1/2)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : FightAngel.exe
  Version: 
  Date   : 2019-08-31
  Author : Anjinggila

  This script does blah blah blah

}

define(player_stats,PlayerEntity:SubHp+1b)
define(bytes,41 89 47 68 85 C0)

[ENABLE]

assert(player_stats,bytes)
alloc(newmem,$1000,PlayerEntity:SubHp+1b)

label(code)
label(return)
label(player_team)
label(show_stats)

newmem:
  cmp [r15+160],0 //0 = player 1 | 1 = player 2 (edit to change team here)
  je player_team
  jmp code

player_team:
  mov [show_stats],r15
  test eax,eax
  jmp return

code:
  mov [r15+68],eax
  test eax,eax
  jmp return

show_stats:
  dd

player_stats:
  jmp newmem
  nop
return:
registersymbol(show_stats)

[DISABLE]

player_stats:
  db bytes

unregistersymbol(show_stats)
dealloc(newmem)"""

