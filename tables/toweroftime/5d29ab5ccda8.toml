[[cheat]]
id = "inf-hp-ohk-to-activate-get-hit"
name = "Inf HP +OHK (To Activate: Get Hit)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : TowerOfTime.exe
  Version: 
  Date   : 2018-04-17
  Author : Squall8
}

[ENABLE]

aobscan(health,F3 41 0F 11 AF A0 00 00 00)
alloc(newmem,$1000,health)

label(code)
label(return)

label(infhpf)
label(ohkf)
label(ohkchk)

registersymbol(health)
registersymbol(infhpf)
registersymbol(ohkf)

newmem:
  cmp byte ptr [r15+129],1
  jne ohkchk
  cmp [infhpf],1
  jne code
  push ebx
  mov ebx,[r15+000000AC]
  cvtsi2ss xmm5,ebx
  movss [r15+000000A0],xmm5
  pop ebx
  jmp return

ohkchk:
  cmp [ohkf],1
  jne code
  mov [r15+000000A0],0
  jmp return

code:
  movss [r15+000000A0],xmm5
  jmp return

infhpf:
  dq 0

ohkf:
  dq 0

health:
  jmp newmem
  nop
  nop
  nop
  nop
return:

[DISABLE]

health:
  db F3 41 0F 11 AF A0 00 00 00

unregistersymbol(health)
unregistersymbol(infhpf)
unregistersymbol(ohkf)
dealloc(newmem)"""

