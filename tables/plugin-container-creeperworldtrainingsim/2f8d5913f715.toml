jmp lblEnergy
nop
nop
nop
lblEnergyReturn:

[DISABLE]
aobEnergy_r:
//Alt: movq xmm0,[edi+00000138]
db F3 0F 7E 87 38 01 00 00

unregistersymbol(aobEnergy_r)
unregistersymbol(bEnableEnergyHack)
unregistersymbol(iDesiredEnergyStorePercent)
