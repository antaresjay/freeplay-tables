[[cheat]]
id = "player-weapon-ctrl-numpad-2"
name = "Player Weapon (Ctrl + Numpad 2)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : GalacticVault.exe
// Author            : ndck76
// Executable Version: 6000.2.15.1974
// Game Version      : v1.0.5
// Script Date       : 2026-03-23


[ENABLE]

aobscanmodule(ammo,GameAssembly.dll,F3xxxxxxxxxxxxxx0F2Fxx0F86xxxxxxxx33xx488BxxE8xxxxxxxx4885xx0F84xxxxxxxx4533) //GV.PlayerWeapon.Update
alloc(newmem,$1000,ammo)
alloc(data,8)
alloc(ammobkp,8)
registersymbol(data)
registersymbol(ammo)
registersymbol(ammobkp)
label(code)
label(return)

ammobkp:
  readmem(ammo,8)

newmem:
  mov [data],rbx

code:
  readmem(ammo,8)
  jmp return

ammo:
  jmp newmem
  nop 3
return:

[DISABLE]

ammo:
  readmem(ammobkp,8)

unregistersymbol(*)
dealloc(*)"""

