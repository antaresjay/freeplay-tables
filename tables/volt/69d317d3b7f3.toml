[[cheat]]
id = "inf-energy-jump"
name = "Inf. Energy (Jump)"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
aobscan(energywriteAOB,89 46 20 85 C0 ** ** ** ** ** ** 83 EC)
registersymbol(energywriteAOB)

alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
cmp eax,1
jge originalcode
mov eax,1

originalcode:
mov [esi+20],eax
test eax,eax

exit:
jmp returnhere

///

energywriteAOB: //03AA97E3:
jmp newmem
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
energywriteAOB: //03AA97E3:
db 89 46 20 85 C0
//Alt: mov [esi+20],eax
//Alt: test eax,eax
unregistersymbol(energywriteAOB)"""

