type = "script"
source = """
// Game Executable   : SuperSpec Rallycross.exe
// Author            : ndck76
// Executable Version: 2021.3.38.12197
// Game Version      : Build.15077642
// Script Date       : 2024-07-30


[ENABLE]

aobscanmodule(laptime,GameAssembly.dll,F3xxxxxxxx83xxxxxxxxxxxx75xxE8xxxxxxxx0F5Axx33) //DriverPanel.LateUpdate
alloc(newmem,$1000,laptime)
alloc(data,8)
alloc(laptimebkp,5)
registersymbol(data)
registersymbol(laptime)
registersymbol(laptimebkp)
label(code)
label(return)

laptimebkp:
  readmem(laptime,5)

newmem:
  mov [data],rax

code:
  readmem(laptime,5)
  jmp return

laptime:
  jmp newmem
return:

[DISABLE]

laptime:
  readmem(laptimebkp,5)

unregistersymbol(*)
dealloc(*)"""

