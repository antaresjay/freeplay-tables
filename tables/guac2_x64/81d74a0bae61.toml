id = "player-64bit-clickme"
name = "Player_64bit_[ClickME]"
category = "player"
description = ""
hint = ""
type = "script"
source = '''
define(PlayerBase64,"Guac2_x64.exe"+42D5BB)
define(bytes0,48 8B D9 0F 28 F1)

define(JumpBase64,"Guac2_x64.exe"+2205FE)
define(bytesA,44 38 B6 A8 07 00 00)

define(SkillsBase64,"Guac2_x64.exe"+1E8AD4)
define(bytesB,48 8B D9 C6 81 38 05 00 00 00)

[ENABLE]
assert(PlayerBase64,bytes0)
assert(JumpBase64,bytesA)
assert(SkillsBase64,bytesB)
alloc(newmem,$256,"Guac2_x64.exe"+42D5BB)
alloc(newmem2,$256,"Guac2_x64.exe"+2205FE)
alloc(newmem3,$256,"Guac2_x64.exe"+1E8AD4)

globalalloc(_player64,8)
globalalloc(_jump64,8)
globalalloc(_skills64,8)

label(code)
label(code1)
label(code2)
label(originalcode1)
label(return)
label(return1)
label(return2)

/// Player 64 bit \\\
newmem:
code:
  mov rbx,rcx
  mov [_player64],rcx
  movaps xmm6,xmm1
  jmp return

PlayerBase64:
  jmp newmem
  nop
return:

/// Jump 64 bit \\\
newmem2:
code1:
  push rsi
  cmp [rsi+60],#25
  jne originalcode1
  cmp [rsi+000007A8],r14l
  mov [_jump64],rsi
  pop rsi
  jmp return1

originalcode1:
  pop rsi
  cmp [rsi+000007A8],r14l
  jmp return1

JumpBase64:
  jmp newmem2
  nop
  nop
return1:

/// Skills 64 bit \\\
newmem3:
code2:
  mov [_skills64],rcx
  mov rbx,rcx
  mov byte ptr [rcx+00000538],00
  jmp return2

SkillsBase64:
  jmp newmem3
  nop
  nop
  nop
  nop
  nop
return2:

[DISABLE]
PlayerBase64:
  db bytes0
  // mov rbx,rcx
  // movaps xmm6,xmm1

JumpBase64:
  db bytesA
  // cmp [rsi+000007A8],r14l

SkillsBase64:
  db bytesB
  // mov rbx,rcx
  // mov byte ptr [rcx+00000538],00

dealloc(newmem)
dealloc(newmem2)
dealloc(newmem3)'''

