id = "unlimited-energy-2shotonekill-clickme"
name = "Unlimited_Energy/2ShotOneKill__[ClickME]"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
define(address,"Guac2_x64.exe"+37E63D)
define(bytes,89 87 20 01 00 00)

[ENABLE]
registersymbol(Godmode_Flag64)
registersymbol(FastKill_Flag64)

assert(address,bytes)
alloc(newmem,$512,"Guac2_x64.exe"+37E5E3)
alloc(Godmode_Flag64,4)
alloc(FastKill_Flag64,4)

label(code)
label(originalcode)
label(return)

label(Cmp_Godmode_Flag64)
label(Cmp_FastKill_Flag64)
label(Godmode64)
label(FastKill64)

Godmode_Flag64:
dd 0
FastKill_Flag64:
dd 0

newmem:

code:
  cmp rdi,[[_player64]+18]
  jne Cmp_FastKill_Flag64
  je Cmp_Godmode_Flag64

Cmp_Godmode_Flag64:
  cmp dword ptr [Godmode_Flag64],1
  je Godmode64
  jmp originalcode

Cmp_FastKill_Flag64:
  cmp dword ptr [FastKill_Flag64],1
  je FastKill64
  jmp originalcode

originalcode:
  mov [rdi+00000120],eax
  jmp return

Godmode64:
  mov eax,[rdi+0000011C]
  mov [rdi+00000120],eax
  jmp return

FastKill64:
  push rbx
  mov ebx,[rdi+0000011C]
  dec [rdi+0000011C]
  sub ebx,[rdi+0000011C]
  inc [rdi+0000011C]
  mov [rdi+00000120],ebx
  pop rbx
  jmp return

address:
  jmp newmem
  nop

return:

[DISABLE]
address:
  db bytes
  //mov [ebx],edx
  //lea eax,[esi+000000DC]

dealloc(newmem)
unregistersymbol(Godmode_Flag64)
unregistersymbol(FastKill_Flag64)
dealloc(Godmode_Flag64)
dealloc(FastKill_Flag64)"""

