[[cheat]]
id = "enable-cheats"
name = "Enable Cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Guac2_x64.exe
  Version: 3417584 | Steam
  Date   : 2022-01-26
  Author : SvT
}

[ENABLE]
aobscanmodule(health,Guac2_x64.exe,89 87 20 01 00 00 8B 87)
alloc(newmem,$1000,health)

label(code)
label(return)
label(enemy)
label(_godmode)
label(_fastKill)
registersymbol(health)
registersymbol(_godmode)
registersymbol(_fastKill)

newmem:
  cmp [rdi+28],(float)0.03999999911
  jne enemy
  cmp [_godmode],1
  jne code
  mov eax,[rdi+11C]
  mov [rdi+120],eax
  jmp return

enemy: // ported from WS version w/ asm code from Nemesis. Thanks!
  cmp [_fastKill],1
  jne code
  push ebx
  mov ebx,[rdi+11C]
  dec [rdi+11C]
  sub ebx,[rdi+11C]
  inc [rdi+11C]
  mov [rdi+120],ebx
  pop ebx
  jmp return

code:
  mov [rdi+120],eax
  jmp return

_godmode:
  dd 0

_fastKill:
  dd 0

health:
  jmp newmem
  nop
return:

[DISABLE]
health:
  db 89 87 20 01 00 00

unregistersymbol(health)
unregistersymbol(_godmode)
unregistersymbol(_fastKill)
dealloc(newmem)

