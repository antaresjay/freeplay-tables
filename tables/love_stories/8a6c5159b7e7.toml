[[cheat]]
id = "turn"
name = "Turn"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(Turn,48 63 40 7C 48 89 85 18 FE FF FF) // should be unique
alloc(newmem,$1000)
alloc(_Turn,4)
label(code)
label(return)

newmem:
mov [_Turn],rax
code:
  movsxd  rax,dword ptr [rax+7C]
  mov [rbp-000001E8],rax
  jmp return

Turn:
  jmp newmem
  nop 6
return:
registersymbol(Turn)
registersymbol(_Turn)
[DISABLE]

Turn:
  db 48 63 40 7C 48 89 85 18 FE FF FF

unregistersymbol(Turn)
dealloc(newmem)
unregistersymbol(_Turn)
dealloc(_Turn)"""

