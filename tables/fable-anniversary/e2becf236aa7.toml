[[cheat]]
id = "health"
name = "Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Health,Fable Anniversary.exe,D9 81 D0 00 00 00 D8)

alloc(newmem,$1000)

label(unlimited_health)
registersymbol(unlimited_health)

label(code)
label(return)

newmem:
cmp edx,FFFFFFFF
jne code
cmp ebx,ecx
jne code

cmp [unlimited_health],1
jne code

push eax
mov eax,[ecx+000000CC]
mov [ecx+000000D0],eax
pop eax

code:
  fld dword ptr [ecx+000000D0]
  jmp return

unlimited_health:
  dd 1

Health:
  jmp newmem
  nop

return:

registersymbol(Health)

[DISABLE]

Health:
  db D9 81 D0 00 00 00

unregistersymbol(Health)
unregistersymbol(unlimited_health)

dealloc(newmem)"""

