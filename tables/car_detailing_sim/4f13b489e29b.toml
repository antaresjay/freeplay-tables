id = "unlimited-paste"
name = "Unlimited Paste"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]



aobscanmodule(paste_aob,GameAssembly.dll,F3 0F 11 B7 E8 00 00 00 E8 * * * * 48 85 C0)
alloc(newmem,$1000,paste_aob)

label(code)
label(return)

newmem:

code:
mov [rdi+000000E8],(float)1
jmp return

paste_aob:
jmp newmem
nop 3
return:
registersymbol(paste_aob)

[DISABLE]
paste_aob:
db F3 0F 11 B7 E8 00 00 00

unregistersymbol(paste_aob)
dealloc(newmem)"""
