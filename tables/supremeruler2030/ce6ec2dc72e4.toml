[[cheat]]
id = "3-damage-control-0x-enemy-multiplier-auto-player-country"
name = "3) Damage Control 0x + Enemy Multiplier - Auto Player Country"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
// DAMAGE CONTROL + SAFE ENEMY DAMAGE MULTIPLIER - AUTO PLAYER COUNTRY
// Uses the current player country marker from:
//   SupremeRuler2030.exe+18294E0
// Player-unit check:
//   byte [unitBase+01E] == byte [SupremeRuler2030.exe+18294E0]
// Hook:
//   SupremeRuler2030.exe+7ECBE6
// Original:
//   subss xmm0,xmm7
//   movaps [rsp+100],xmm6
// Own units: damage x 0 and safety min 50.
// Other units: damage multiplied by enemyDamageMultiplier.
// This is NOT old hard-kill. It does not write huge or forced negative health.

// Change enemyDamageMultiplier through the child dropdown.
// Recommended: 2x or 5x first. 10x and 20x are stronger tests.

define(damageCalc,SupremeRuler2030.exe+7ECBE6)
assert(damageCalc,F3 0F 5C C7 0F 29 B4 24 00 01 00 00)

alloc(damageAutoMem,4096,damageCalc)

label(returnHere)
label(enemyTarget)
label(afterDamage)
label(ownDamageMultiplier)
label(enemyDamageMultiplier)
label(ownHealthMinValue)
label(zeroFloat)

registersymbol(enemyDamageMultiplier)

damageAutoMem:
  pushfq
  push rax

  // Compare unit country byte with active player country byte.
  mov al,[r12+0000001E]
  cmp al,byte ptr [SupremeRuler2030.exe+18294E0]
  jne enemyTarget

  // Own unit: scale received damage by 0.
  mulss xmm7,[ownDamageMultiplier]
  subss xmm0,xmm7

  // Own safety: do not allow own result below safe minimum.
  ucomiss xmm0,[ownHealthMinValue]
  jae afterDamage
  movss xmm0,[ownHealthMinValue]
  jmp afterDamage

enemyTarget:
  // Enemy or other country: boost normal damage, but do not use hard-kill.
  mulss xmm7,[enemyDamageMultiplier]
  subss xmm0,xmm7

  // Safety: avoid forced negative values from huge multiplier.
  ucomiss xmm0,[zeroFloat]
  jae afterDamage
  movss xmm0,[zeroFloat]

afterDamage:
  pop rax
  popfq

  movaps [rsp+00000100],xmm6
  jmp returnHere

ownDamageMultiplier:
  dd (float)0.0
enemyDamageMultiplier:
  dd (float)2.0
ownHealthMinValue:
  dd (float)50.0
zeroFloat:
  dd (float)0.0

damageCalc:
  jmp damageAutoMem
  nop 7

returnHere:

[DISABLE]
damageCalc:
  db F3 0F 5C C7 0F 29 B4 24 00 01 00 00

unregistersymbol(enemyDamageMultiplier)
dealloc(damageAutoMem)"""

