source = """
[ENABLE]
// BUILD / MISSILE - ONE DAY FINISH - AUTO PLAYER COUNTRY
// Confirmed build-progress update code:
//   SupremeRuler2030.exe+8448D0  subss xmm0,xmm12
//   SupremeRuler2030.exe+8448DC  movss [rcx],xmm0
//
// Confirmed contexts from aircraft, tank, and missile builds:
//   RBX = country production/state context
//   [SupremeRuler2030.exe+18295F8] = current player country/state context
//
// Only when RBX belongs to the country currently controlled by the player,
// remaining build time is changed to 0.0 after the normal daily calculation.
// AI production is left on the original calculation.
//
// “One Day” intentionally means 0.0 remaining time: the game completes it
// on its next production update, just as research did.
//
// The hook preserves EFLAGS because later original code uses CMOVA.


define(buildCalc,SupremeRuler2030.exe+8448D0)
assert(buildCalc,F3 41 0F 5C C4 48 8D 85 84 00 00 00)
alloc(buildOneDayMem,2048,buildCalc)

label(returnHere)
label(aiBuild)

buildOneDayMem:
  // Original instructions overwritten by the jump.
  subss xmm0,xmm12
  lea rax,[rbp+00000084]

  // Keep the original flags intact for the later CMOVA in game code.
  pushfq
  push rax
  mov rax,[SupremeRuler2030.exe+18295F8]
  cmp rbx,rax
  pop rax
  jne aiBuild

  popfq
  xorps xmm0,xmm0
  jmp returnHere

aiBuild:
  popfq
  jmp returnHere

buildCalc:
  jmp buildOneDayMem
  nop 7
returnHere:

[DISABLE]

buildCalc:
  db F3 41 0F 5C C4 48 8D 85 84 00 00 00

dealloc(buildOneDayMem)"""
