[[cheat]]
id = "1-research-one-day-finish-auto-player-country"
name = "1) Research - One Day Finish - Auto Player Country"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
// RESEARCH - ONE DAY FINISH - AUTO PLAYER COUNTRY
// Research update code:
//   SupremeRuler2030.exe+76AB31  comiss xmm15,xmm0
//   SupremeRuler2030.exe+76AB35  movss [rdi+28],xmm0
//
// Live player-country marker used by the other auto tools:
//   SupremeRuler2030.exe+18294E0
//
// R9 is the country/context ID of the research item currently updating.
// Only the country currently controlled by the player gets 0.0 remaining
// research days. The game's normal next daily tick then completes it.
// AI research is left unchanged.

// Important: “One Day” intentionally writes 0.0, not 1.0.
// In this game 0.0 completes research on the next daily update.

define(researchWrite,SupremeRuler2030.exe+76AB31)
assert(researchWrite,44 0F 2F F8 F3 0F 11 47 28)
alloc(researchOneDayMem,2048,researchWrite)

label(returnHere)
label(originalCode)

researchOneDayMem:
  push rax
  movzx eax,word ptr [SupremeRuler2030.exe+18294E0]
  cmp r9d,eax
  pop rax
  jne originalCode
  xorps xmm0,xmm0

originalCode:
  comiss xmm15,xmm0
  movss [rdi+28],xmm0
  jmp returnHere

researchWrite:
  jmp researchOneDayMem
  nop 4
returnHere:

[DISABLE]

researchWrite:
  db 44 0F 2F F8 F3 0F 11 47 28

dealloc(researchOneDayMem)"""

[[cheat]]
id = "2-construction-one-day-finish-auto-player-country-pass-through"
name = "2) Construction - One Day Finish - Auto Player Country (Pass-Through)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
// CONSTRUCTION - ONE DAY FINISH - AUTO PLAYER COUNTRY
// Confirmed construction progress display/update code:
//   SupremeRuler2030.exe+780999  movss [r14+90],xmm1
//
// Confirmed construction structure:
//   R14+90 = construction progress, where 0.0 is empty and 1.0 is full.
//
// RDI is the country ID of the construction item currently updating.
// It is compared with the live player-country ID used by the other auto tools:
//   SupremeRuler2030.exe+18294E0
//
// IMPORTANT: Do NOT use exactly 1.0 here. In this game an exact 1.0 can
// glitch the construction state. 0.9999999404 is the highest float value
// below 1.0 (float32 0x3F7FFFFF), so it preserves the game's completion flow.
//
// PASS-THROUGH FIX:
// The old version wrote 0.9999999404 on every update, so the game never got
// its final natural write to 1.0 and the construction could remain stuck.
// This version only boosts progress while the game is still below 99.9%.
// Once it is near completion, it lets the original code write the real final
// value and trigger the normal factory/object activation.
// AI construction is left unchanged.

define(constructionWrite,SupremeRuler2030.exe+780999)
assert(constructionWrite,F3 41 0F 11 8E 90 00 00 00)
alloc(constructionOneDayMem,2048,constructionWrite)

label(returnHere)
label(originalCode)
label(constructionNearThreshold)
label(maxSafeProgress)

constructionOneDayMem:
  push rax
  movzx eax,word ptr [SupremeRuler2030.exe+18294E0]
  cmp edi,eax
  pop rax
  jne originalCode

  // Let the engine itself perform the final 99.9% -> 100% completion update.
  comiss xmm1,[constructionNearThreshold]
  jae originalCode
  movss xmm1,[maxSafeProgress]

originalCode:
  movss [r14+00000090],xmm1
  jmp returnHere

constructionNearThreshold:
  dd (float)0.999
maxSafeProgress:
  dd (float)0.9999999404

constructionWrite:
  jmp constructionOneDayMem
  nop 4
returnHere:

[DISABLE]

constructionWrite:
  db F3 41 0F 11 8E 90 00 00 00

dealloc(constructionOneDayMem)"""

