[[cheat]]
id = "1-ammo-refill-auto-player-country"
name = "1) Ammo Refill - Auto Player Country"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
// AMMO REFILL - AUTO PLAYER COUNTRY
// Player country marker: SupremeRuler2030.exe+18294E0
// Own unit marker: unitBase+01E

define(ammoWrite,SupremeRuler2030.exe+7ECA21)
assert(ammoWrite,F3 41 0F 11 8C 24 84 00 00 00)
alloc(ammoAutoMem,2048,ammoWrite)
label(returnHere)
label(originalWrite)
label(doRefill)
label(ammoRefillValue)

ammoAutoMem:
  pushfq
  push rax
  mov al,[r12+0000001E]
  cmp al,byte ptr [SupremeRuler2030.exe+18294E0]
  jne originalWrite
  mov eax,[r12+00000084]
  and eax,7FFFFFFF
  jne doRefill
  movd eax,xmm1
  and eax,7FFFFFFF
  je originalWrite

doRefill:
  movss xmm1,[ammoRefillValue]

originalWrite:
  pop rax
  popfq
  movss [r12+00000084],xmm1
  jmp returnHere

ammoRefillValue:
  dd (float)9999.0

ammoWrite:
  jmp ammoAutoMem
  nop 5
returnHere:

[DISABLE]
ammoWrite:
  db F3 41 0F 11 8C 24 84 00 00 00
dealloc(ammoAutoMem)"""

