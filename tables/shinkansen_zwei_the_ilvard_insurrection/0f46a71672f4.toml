[[cheat]]
id = "player-stats-base-address-scan-initialization-activate-this-first"
name = "Player Stats Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(playerstats_basepointer)
registersymbol(playerstats_update_enable)
registersymbol(playerstats_set_enable)
registersymbol(playerstats_hpset_enable)
registersymbol(playerstats_arcanumset_enable)
registersymbol(playerstats_statsset_enable)
registersymbol(playerstats_penneset_enable)
registersymbol(playerstats_scoreboardset_enable)
registersymbol(playerstats_comboset_enable)

alloc(playerstats_basepointer, 4)
alloc(playerstats_update_enable, 4)
alloc(playerstats_set_enable, 4)
alloc(playerstats_hpset_enable, 4)
alloc(playerstats_arcanumset_enable, 4)
alloc(playerstats_statsset_enable, 4)
alloc(playerstats_penneset_enable, 4)
alloc(playerstats_scoreboardset_enable, 4)
alloc(playerstats_comboset_enable, 4)


[DISABLE]
unregistersymbol(playerstats_basepointer)
unregistersymbol(playerstats_update_enable)
unregistersymbol(playerstats_set_enable)
unregistersymbol(playerstats_hpset_enable)
unregistersymbol(playerstats_arcanumset_enable)
unregistersymbol(playerstats_statsset_enable)
unregistersymbol(playerstats_penneset_enable)
unregistersymbol(playerstats_scoreboardset_enable)
unregistersymbol(playerstats_comboset_enable)

dealloc(playerstats_basepointer)
dealloc(playerstats_update_enable)
dealloc(playerstats_set_enable)
dealloc(playerstats_hpset_enable)
dealloc(playerstats_arcanumset_enable)
dealloc(playerstats_statsset_enable)
dealloc(playerstats_penneset_enable)
dealloc(playerstats_scoreboardset_enable)
dealloc(playerstats_comboset_enable)"""

[[cheat]]
id = "player-stats-base-address-scan-to-update-play-level"
name = "Player Stats Base Address Scan (To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstats_update_exit)
label(playerstats_set_exit)
label(playerstats_hpset_exit)
label(playerstats_arcanumset_exit)
label(playerstats_statsset_exit)
label(playerstats_penneset_exit)
label(playerstats_scoreboardset_exit)
label(playerstats_comboset_exit)

registersymbol(playerstats_savedAOB)

//0052F537 - 6A 00                 - push 00
//0052F539 - 6A 08                 - push 08
//0052F53B - BE 000080BF           - mov esi,BF800000
//0052F540 - 56                    - push esi
//0052F541 - 68 D1010000           - push 000001D1
//0052F546 - 6A 11                 - push 11
// Accesses Money
//0052F548 - FF 35 C8EA5C03        - push [035CEAC8] : [00000064]
//0052F54E - E8 ED8BF9FF           - call 004C8140
//0052F553 - 6A 01                 - push 01
aobscan(playerstats_searchedAOB, BE 00 00 80 BF 56 68 D1 01 00 00 6A 11)

alloc(playerstats_newmem, 2048, playerstats_searchedAOB)
alloc(playerstats_temp1, 4, playerstats_searchedAOB)
alloc(playerstats_temp2, 4, playerstats_searchedAOB)
alloc(playerstats_temp3, 4, playerstats_searchedAOB)
alloc(playerstats_temp4, 4, playerstats_searchedAOB)
alloc(playerstats_temp5, 4, playerstats_searchedAOB)


playerstats_newmem:
mov [playerstats_temp1], eax
mov [playerstats_temp2], ebx
mov [playerstats_temp3], ecx
mov [playerstats_temp4], edx

mov ebx, [playerstats_savedAOB+f]

cmp dword ptr [playerstats_update_enable], #0
je playerstats_update_exit
mov [playerstats_basepointer], ebx
playerstats_update_exit:

cmp dword ptr [playerstats_set_enable], #0
je playerstats_set_exit
playerstats_set_exit:

cmp dword ptr [playerstats_hpset_enable], #0
je playerstats_hpset_exit
mov ecx, [ebx-10]
mov [ebx+1c], ecx
playerstats_hpset_exit:

cmp dword ptr [playerstats_arcanumset_enable], #0
je playerstats_arcanumset_exit
mov [ebx+20], #5000
playerstats_arcanumset_exit:

cmp dword ptr [playerstats_statsset_enable], #0
je playerstats_statsset_exit
mov [ebx-c], #99999
mov [ebx-8], #99999
mov [ebx+4], #99999
playerstats_statsset_exit:

cmp dword ptr [playerstats_penneset_enable], #0
je playerstats_penneset_exit
mov [ebx], #9999999
playerstats_penneset_exit:

cmp dword ptr [playerstats_scoreboardset_enable], #0
je playerstats_scoreboardset_exit
//mov [ebx+12d6c], #0
mov [ebx+12d6d], #0
mov [ebx+5fa0c], #100
playerstats_scoreboardset_exit:

cmp dword ptr [playerstats_comboset_enable], #0
je playerstats_comboset_exit
mov [ebx+5f9f4], #9999
playerstats_comboset_exit:

mov eax, [playerstats_temp1]
mov ebx, [playerstats_temp2]
mov ecx, [playerstats_temp3]
mov edx, [playerstats_temp4]


playerstats_originalcode:
db BE 00 00 80 BF
//mov esi,BF800000


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB:
playerstats_savedAOB:
jmp playerstats_newmem
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
db BE 00 00 80 BF
//mov esi,BF800000

unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)
dealloc(playerstats_temp1)
dealloc(playerstats_temp2)
dealloc(playerstats_temp3)
dealloc(playerstats_temp4)
dealloc(playerstats_temp5)"""

