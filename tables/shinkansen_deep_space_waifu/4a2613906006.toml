alloc(PlayerMovementFriction_set_enable, 4)
alloc(PlayerMovementFriction_invincibleset_enable, 4)
alloc(PlayerMovementFriction_hpset_enable, 4)
alloc(PlayerMovementFriction_livesset_enable, 4)
alloc(PlayerMovementFriction_damageset_enable, 4)
alloc(PlayerMovementFriction_bombsset_enable, 4)
