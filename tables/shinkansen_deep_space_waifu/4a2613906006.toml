dealloc(PlayerMovementFriction_basepointer)
dealloc(PlayerMovementFriction_update_enable)
dealloc(PlayerMovementFriction_set_enable)
dealloc(PlayerMovementFriction_invincibleset_enable)
dealloc(PlayerMovementFriction_hpset_enable)
dealloc(PlayerMovementFriction_livesset_enable)
dealloc(PlayerMovementFriction_damageset_enable)
dealloc(PlayerMovementFriction_bombsset_enable)
dealloc(PlayerMovementFriction_specialset_enable)
dealloc(PlayerMovementFriction_mouseset_enable)"""

[[cheat]]
id = "playermovementfriction-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerMovementFriction Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerMovementFriction_savedAOB)
label(PlayerMovementFriction_returnhere)
label(PlayerMovementFriction_originalcode)
label(PlayerMovementFriction_exit)

label(PlayerMovementFriction_update_exit)
label(PlayerMovementFriction_set_exit)
label(PlayerMovementFriction_invincibleset_exit)
label(PlayerMovementFriction_hpset_exit)
label(PlayerMovementFriction_livesset_exit)
label(PlayerMovementFriction_damageset_exit)
label(PlayerMovementFriction_bombsset_exit)
label(PlayerMovementFriction_specialset_exit)
label(PlayerMovementFriction_mouseset_exit)

registersymbol(PlayerMovementFriction_savedAOB)

//053E2A23 - 57                    - push edi
//053E2A24 - 81 EC E4000000        - sub esp,000000E4
//053E2A2A - 8B 7D 08              - mov edi,[ebp+08]
// PlayerMovementFriction+d
//053E2A2D - C7 85 5CFFFFFF 00000000 - mov [ebp-000000A4],00000000
//053E2A37 - C7 85 60FFFFFF 00000000 - mov [ebp-000000A0],00000000
//053E2A41 - C7 85 64FFFFFF 00000000 - mov [ebp-0000009C],00000000
//053E2A4B - 83 EC 0C              - sub esp,0C
//053E2A4E - 68 15010000           - push 00000115
//053E2A53 - E8 68FEFAFF           - call 053928C0
aobscan(PlayerMovementFriction_searchedAOB, C7 85 5C FF FF FF 00 00 00 00 C7 85 60 FF FF FF 00 00 00 00 C7 85 64 FF FF FF 00 00 00 00 83 EC 0C)

alloc(PlayerMovementFriction_newmem, 2048, PlayerMovementFriction_searchedAOB)
alloc(PlayerMovementFriction_temp1, 4, PlayerMovementFriction_searchedAOB)
alloc(PlayerMovementFriction_temp2, 4, PlayerMovementFriction_searchedAOB)
alloc(PlayerMovementFriction_temp3, 4, PlayerMovementFriction_searchedAOB)
alloc(PlayerMovementFriction_temp4, 4, PlayerMovementFriction_searchedAOB)
alloc(PlayerMovementFriction_temp5, 4, PlayerMovementFriction_searchedAOB)


PlayerMovementFriction_newmem:
mov [PlayerMovementFriction_temp1], eax
mov [PlayerMovementFriction_temp2], ebx
mov [PlayerMovementFriction_temp3], ecx
mov [PlayerMovementFriction_temp4], edx

cmp dword ptr [PlayerMovementFriction_update_enable], #0
je PlayerMovementFriction_update_exit
mov [PlayerMovementFriction_basepointer], edi
PlayerMovementFriction_update_exit:

cmp dword ptr [PlayerMovementFriction_set_enable], #0
je PlayerMovementFriction_set_exit
PlayerMovementFriction_set_exit:

cmp dword ptr [PlayerMovementFriction_invincibleset_enable], #0
je PlayerMovementFriction_invincibleset_exit
mov byte ptr [edi+11c], #1
PlayerMovementFriction_invincibleset_exit:

cmp dword ptr [PlayerMovementFriction_hpset_enable], #0
je PlayerMovementFriction_hpset_exit
mov ebx, [edi+e0]
mov [edi+10c], ebx
PlayerMovementFriction_hpset_exit:

cmp dword ptr [PlayerMovementFriction_livesset_enable], #0
je PlayerMovementFriction_livesset_exit
mov ebx, [edi+e4]
mov [edi+110], ebx
PlayerMovementFriction_livesset_exit:

cmp dword ptr [PlayerMovementFriction_damageset_enable], #0
je PlayerMovementFriction_damageset_exit
mov [edi+f8], #9999999
mov [edi+fc], #9999999
//mov [edi+100], #9999999
//mov [edi+104], #9999999
//mov [edi+108], #9999999
PlayerMovementFriction_damageset_exit:

cmp dword ptr [PlayerMovementFriction_bombsset_enable], #0
je PlayerMovementFriction_bombsset_exit
mov ebx, [edi+70]
test ebx, ebx
je PlayerMovementFriction_bombsset_exit
mov [ebx+8c], #99
PlayerMovementFriction_bombsset_exit:

cmp dword ptr [PlayerMovementFriction_specialset_enable], #0
je PlayerMovementFriction_specialset_exit
mov ebx, [edi+90]
test ebx, ebx
je PlayerMovementFriction_specialset_exit
mov [ebx+6c], (float)1
PlayerMovementFriction_specialset_exit:

cmp dword ptr [PlayerMovementFriction_mouseset_enable], #0
je PlayerMovementFriction_mouseset_exit
mov byte ptr [edi+1c4], #1
PlayerMovementFriction_mouseset_exit:

mov eax, [PlayerMovementFriction_temp1]
mov ebx, [PlayerMovementFriction_temp2]
mov ecx, [PlayerMovementFriction_temp3]
mov edx, [PlayerMovementFriction_temp4]


PlayerMovementFriction_originalcode:
db C7 85 5C FF FF FF 00 00 00 00
//mov [ebp-000000A4],00000000


PlayerMovementFriction_exit:
jmp PlayerMovementFriction_returnhere


PlayerMovementFriction_searchedAOB:
PlayerMovementFriction_savedAOB:
jmp PlayerMovementFriction_newmem
nop
nop
nop
nop
nop
PlayerMovementFriction_returnhere:


[DISABLE]
PlayerMovementFriction_savedAOB:
db C7 85 5C FF FF FF 00 00 00 00
//mov [ebp-000000A4],00000000

unregistersymbol(PlayerMovementFriction_savedAOB)

dealloc(PlayerMovementFriction_newmem)
dealloc(PlayerMovementFriction_temp1)
dealloc(PlayerMovementFriction_temp2)
dealloc(PlayerMovementFriction_temp3)
dealloc(PlayerMovementFriction_temp4)
dealloc(PlayerMovementFriction_temp5)"""

