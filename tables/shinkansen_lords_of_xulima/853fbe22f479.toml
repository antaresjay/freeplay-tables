dealloc(partymemberstatsset_enable)
dealloc(partymemberstatshpppset_enable)"""

[[cheat]]
id = "party-member-stats-base-address-scan-to-activate-view-party-member-to-update-view-party-member"
name = "Party Member Stats Base Address Scan (To Activate: View Party Member, To Update: View Party Member)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
label(partymemberstats_savedAOB)
label(partymemberstats_returnhere)
label(partymemberstats_originalcode)
label(partymemberstats_exit)

label(partymemberstatsupdate_exit)
label(partymemberstatsset_exit)
label(partymemberstatshpppset_exit)

registersymbol(partymemberstats_savedAOB)

aobscan(partymemberstats_searchedAOB,8B 81 0C 01 00 00 8B 50 18 * * * * * * C3)

alloc(partymemberstats_newmem,2048) //2kb should be enough


partymemberstats_newmem:
cmp dword ptr [partymemberstatsupdate_enable], #0
je partymemberstatsupdate_exit
mov [partymemberstats_basepointer], ecx
partymemberstatsupdate_exit:

cmp dword ptr [partymemberstatsset_enable], #0
je partymemberstatsset_exit
mov eax, [ecx+30]
mov eax, [eax+8]
mov [eax+8], #9999
mov [eax+c], #9999
mov [eax+10], #9999
mov [eax+14], #9999
mov [eax+18], #9999
mov [eax+1c], #9999
mov eax, [ecx+10c]
mov [eax+18], #9999
mov [eax+38], #9999
mov [eax+58], #9999
mov [eax+78], #9999
mov [eax+98], #9999
mov [ecx+154], #9999
partymemberstatsset_exit:

cmp dword ptr [partymemberstatshpppset_enable], #0
je partymemberstatshpppset_exit
mov eax, [ecx+54]
mov [ecx+44], eax
mov eax, [ecx+58]
mov [ecx+48], eax
partymemberstatshpppset_exit:


partymemberstats_originalcode:
db 8B 81 0C 01 00 00
//mov eax,[ecx+0000010C]


partymemberstats_exit:
jmp partymemberstats_returnhere


partymemberstats_searchedAOB:
partymemberstats_savedAOB:
jmp partymemberstats_newmem
nop
partymemberstats_returnhere:


[DISABLE]
partymemberstats_savedAOB:
db 8B 81 0C 01 00 00
//mov eax,[ecx+0000010C]


unregistersymbol(partymemberstats_savedAOB)

dealloc(partymemberstats_newmem)"""

