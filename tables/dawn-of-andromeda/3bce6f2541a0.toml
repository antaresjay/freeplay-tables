[[cheat]]
id = "get-player-stats-base-address"
name = "Get Player Stats Base Address"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Dawn of Andromeda.exe
  Version: 
  Date   : 2017-05-05
  Author : ColonelRVH

  This script does blah blah blah
}

[ENABLE]

aobscan(Get_Funds_AOB,48 63 86 90 03 00 00 3D D0) // should be unique
alloc(newmem,$1000,129DDCA0)

label(code)
label(return)
label(MaxFunds)
label(MaxInfluence)
label(CmpFunds_Flag)
label(CmpInfluence_Flag)
registersymbol(PlayerStatsBase)
alloc(PlayerStatsBase,8)
registersymbol(Funds_Flag)
alloc(Funds_Flag,4)
registersymbol(Influence_Flag)
alloc(Influence_Flag,4)

Funds_Flag:
dd 0
Influence_Flag:
dd 0

newmem:
  mov [PlayerStatsBase],rsi

CmpFunds_Flag:
  cmp dword ptr [Funds_Flag],1
  je MaxFunds

CmpInfluence_Flag:
  cmp dword ptr [Influence_Flag],1
  je MaxInfluence

code:
  movsxd  rax,dword ptr [rsi+00000390]
  jmp return

MaxFunds:
  push ebx
  mov ebx,[rsi+0000061C]
  mov [rsi+00000390],ebx
  pop ebx
  jmp CmpInfluence_Flag

MaxInfluence:
  push ebx
  mov ebx,[rsi+00000498]
  mov [rsi+00000494],ebx
  pop ebx
  jmp code

Get_Funds_AOB:
  jmp newmem
  nop
  nop
return:
registersymbol(Get_Funds_AOB)

[DISABLE]

Get_Funds_AOB:
  db 48 63 86 90 03 00 00

unregistersymbol(Get_Funds_AOB)
dealloc(newmem)
unregistersymbol(PlayerStatsBase)
dealloc(PlayerStatsBase)
unregistersymbol(Funds_Flag)
dealloc(Funds_Flag)
unregistersymbol(Influence_Flag)
dealloc(Influence_Flag)
{
// ORIGINAL CODE - INJECTION POINT: 129DDCA0

""+129DDC74: 68 80 DC 31 01                 -  push 0131DC80
""+129DDC79: 41 52                          -  push r10
""+129DDC7B: 50                             -  push rax
""+129DDC7C: 48 83 EC 20                    -  sub rsp,20
""+129DDC80: 49 BB F6 A1 9D 12 00 00 00 00  -  mov r11,00000000129DA1F6
""+129DDC8A: 41 FF D3                       -  call r11
""+129DDC8D: 48 83 C4 60                    -  add rsp,60
""+129DDC91: 48 63 86 10 05 00 00           -  movsxd  rax,dword ptr [rsi+00000510]
""+129DDC98: 85 C0                          -  test eax,eax
""+129DDC9A: 0F 8C C3 00 00 00              -  jl PlayerStat:Update+2413
// ---------- INJECTING HERE ----------
""+129DDCA0: 48 63 86 90 03 00 00           -  movsxd  rax,dword ptr [rsi+00000390]
// ---------- DONE INJECTING  ----------
""+129DDCA7: 3D D0 07 00 00                 -  cmp eax,000007D0
""+129DDCAC: 0F 8C 51 00 00 00              -  jl PlayerStat:Update+23b3
""+129DDCB2: 48 8B CE                       -  mov rcx,rsi
""+129DDCB5: BA 02 00 00 00                 -  mov edx,00000002
""+129DDCBA: 41 B8 C0 DF 31 01              -  mov r8d,0131DFC0
""+129DDCC0: 41 B9 C0 DF 31 01              -  mov r9d,0131DFC0
""+129DDCC6: 48 83 EC 20                    -  sub rsp,20
""+129DDCCA: 49 BB 30 A2 9D 12 00 00 00 00  -  mov r11,PlayerStat:CheckForDecision
""+129DDCD4: 41 FF D3                       -  call r11
""+129DDCD7: 48 83 C4 20                    -  add rsp,20
}"""

