[[cheat]]
id = "get-player"
name = "Get Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(LocalPlayerHook,NpcSpeachController:HandleSpeechBubble,NpcSpeachController:HandleSpeechBubble+9e,48 8B 40 78 48 8B C8 83 38 00 90)
alloc(newmem,$1000,LocalPlayerHook)
label(code return PlayerPtr)

newmem:
mov [PlayerPtr],rax

code:
  mov rax,[rax+78]
  mov rcx,rax
  jmp return

PlayerPtr:
dq

LocalPlayerHook:
  jmp newmem
  nop 2
return:
registersymbol(LocalPlayerHook PlayerPtr)

[DISABLE]

LocalPlayerHook:
  db 48 8B 40 78 48 8B C8

unregistersymbol(*)
dealloc(*)"""
