[[cheat]]
id = "no-weapon-cooldown"
name = "No Weapon Cooldown"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(WepCD,PerfectRandom.Sulfur.Core.Weapons.Weapon+<cooldownRoutine>d__336:MoveNext,PerfectRandom.Sulfur.Core.Weapons.Weapon+<cooldownRoutine>d__336:MoveNext+85,26 F3 41 0F 10 87 00 04 00 00)
alloc(newmem,$1000,WepCD)

label(code)
label(return)

newmem:
cmp [r15+100],0
je code
mov [r15+400],(float)0
code:
  movss xmm0,[r15+00000400]
  jmp return

WepCD+01:
  jmp newmem
  nop 4
return:
registersymbol(WepCD)

[DISABLE]

WepCD+01:
  db F3 41 0F 10 87 00 04 00 00

unregistersymbol(WepCD)
dealloc(newmem)"""
