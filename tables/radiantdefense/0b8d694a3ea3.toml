[[cheat]]
id = "fast-tower-upgrade"
name = "Fast Tower Upgrade"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(fastup,1024)
label(_refastup)
label(_ocfastup)
label(_exfastup)

aobscan(scfastup,FF 47 70 8B 4F 70 8B 40 0C 8D 04 88 50)
label(_scfastup)
registersymbol(_scfastup)

fastup: //this is allocated memory, you have read,write,execute access
//place your code here

_ocfastup:
mov [edi+70],#4
mov ecx,[edi+70]

_exfastup:
jmp _refastup

scfastup:
_scfastup:
jmp fastup
nop
_refastup:

[DISABLE]
_scfastup:
inc [edi+70]
mov ecx,[edi+70]

dealloc(fastup)
unregistersymbol(_scfastup)

//FF 47 70 8B 4F 70 8B 40 0C 8D 04 88 50"""
