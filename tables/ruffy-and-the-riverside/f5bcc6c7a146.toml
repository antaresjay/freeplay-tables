[[cheat]]
id = "save-game-ctrl-numpad-1"
name = "Save Game (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Ruffy and the Riverside.exe
// Author            : ndck76
// Executable Version: 2022.3.30.21890
// Game Version      : Build.18993957
// Script Date       : 2025-06-28


[ENABLE]

aobscanmodule(coincount,GameAssembly.dll,89xxxx84xx75xx488DxxxxxxxxxxE8xxxxxxxxF0xxxxxxxxC6xxxxxxxxxxxx488Bxxxxxxxxxx488Bxxxxxxxxxx488B) //Inventory.IncreaseCoins
alloc(newmem,$1000,coincount)
alloc(data3,8)
alloc(coincountbkp,5)
registersymbol(data3)
registersymbol(coincount)
registersymbol(coincountbkp)
label(code)
label(return)

coincountbkp:
  readmem(coincount,5)

newmem:
  mov [data3],rdx

code:
  readmem(coincount,5)
  jmp return

coincount:
  jmp newmem
return:

[DISABLE]

coincount:
  readmem(coincountbkp,5)

unregistersymbol(*)
dealloc(*)"""

