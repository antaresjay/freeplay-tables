id = "no-reload"
name = "No Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(noreload,F.E.A.R. 3.exe,89 86 FC 00 00 00 E8 11)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  jmp return

noreload:
  jmp newmem
  nop
return:
registersymbol(noreload)

[DISABLE]

noreload:
  db 89 86 FC 00 00 00

unregistersymbol(noreload)
dealloc(newmem)"""
