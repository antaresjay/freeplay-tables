[[cheat]]
id = "player-stats-ctrl-numpad-1"
name = "Player Stats (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Coridden.exe
// Author            : ndck76
// Executable Version: 2021.3.3.11875
// Game Version      : v1.0.1
// Script Date       : 2025-01-30


[ENABLE]

aobscanregion(playtime,PlayerStats:Update,PlayerStats:Update+100,F30F10xxxxF3xxxxxxF2xxxxxxxx9049BBxxxxxxxxxxxx000041xxxxF3xxxxxxF2xxxxxxxxF2xxxxxxF2xxxxxxF3xxxxxxxx48xxxx66xx) //PlayerStats:Update+f
alloc(newmem,$1000,playtime)
alloc(data2,8)
alloc(playtimebkp,5)
registersymbol(data2)
registersymbol(playtime)
registersymbol(playtimebkp)
label(code)
label(return)

playtimebkp:
  readmem(playtime,5)

newmem:
  mov [data2],rsi

code:
  readmem(playtime,5)
  jmp return

playtime:
  jmp newmem
return:

[DISABLE]

playtime:
  readmem(playtimebkp,5)

unregistersymbol(*)
dealloc(*)"""

