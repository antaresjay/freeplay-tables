[[cheat]]
id = "player-take-damage-before-and-after-activating"
name = "Player (TAKE DAMAGE BEFORE _AND_ AFTER ACTIVATING)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : LaMulana2.exe
  Version: 
  Date   : 2018-08-04
  Author : Trin

  This script finds the base player structure using hp
}

[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

 
 
aobscan(hpwriting,89 87 E4 00 00 00 85 C0 7F) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

globalalloc(_playerbase,8)

newmem:

code:
  mov [_playerbase],rdi
  mov [rdi+000000E4],eax
  jmp return

hpwriting:
  jmp newmem
  nop
return:
registersymbol(hpwriting)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
hpwriting:
  db 89 87 E4 00 00 00

unregistersymbol(hpwriting)
dealloc(newmem)

