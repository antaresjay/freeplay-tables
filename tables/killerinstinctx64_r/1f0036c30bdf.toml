type = "script"
source = """
{ Game   : Killer Instinct
  Version:
  Date   : 2024-04-26
  Author : pat

  Infinite Health for P1
}

define(addr_inf_health,"KillerInstinctX64_r.exe"+70771A)
define(bytes,F3 0F 11 8E C0 01 00 00)

define(D_ELT_OFFSET, 6)


//-----------------------------------------------------------------------
[ENABLE]
//-----------------------------------------------------------------------

assert(addr_inf_health,bytes)
alloc(newmem,$1000,"KillerInstinctX64_r.exe"+70771A)

label(hook_start)
label(playerCheck)
label(hook_job)
label(fill_p1)
label(fill_p2)
label(originalcode)
label(hook_exit)
label(return)

label(b_invert_check)

label(p1_addr)
label(p2_addr)

label(p1_elt_addr)
label(p2_elt_addr)

registersymbol(b_invert_check)
registersymbol(p1_addr)
registersymbol(p2_addr)

registersymbol(p1_elt_addr)
registersymbol(p2_elt_addr)


//---------
// Code
//---------

newmem:

//-------
hook_start:
  pushfq // save flags register
  push RAX
  jmp playerCheck


//-------
//-------
hook_job:
  // check if Human
  mov RAX, rsi
  add RAX, D_ELT_OFFSET
  mov EAX, [RAX]
  and EAX, 00010000
  cmp EAX, 0
  je case_false
  mov EAX, [b_invert_check]
  cmp EAX, 0
  je originalcode
  jmp hook_exit
case_false:
  mov EAX, [b_invert_check]
  cmp EAX, 0
  je hook_exit
  jmp originalcode



//-------
playerCheck:
  cmp [p1_addr], 0
  je fill_p1
  // check if P1
  cmp RSI, [p1_addr]
  je hook_job
  // if p2 still unknown
  cmp [p2_addr], 0
  je fill_p2
  // check if P2
  cmp [p2_addr],RSI
  jne hook_job
  // nor P1, nor P2 => reset variables
  jmp fill_p1

//-------
fill_p1:
  mov [p2_addr], 0
  mov [p1_addr], RSI
  mov RAX, RSI
  ADD RAX, D_ELT_OFFSET
  mov [p1_elt_addr], RAX
  // don't know if it's P1 or P2
  jmp hook_job

fill_p2:
  cmp [p1_addr], RSI
  je hook_job
  mov [p2_addr], RSI
  add RSI, D_ELT_OFFSET
  mov [p2_elt_addr], RSI
  sub RSI, D_ELT_OFFSET
  jmp hook_job



//-------
originalcode:
  movss [rsi+000001C0],xmm1
  jmp hook_exit

//-------
hook_exit:
  pop RAX
  popfq
  jmp return



//---------
// Variables
//---------

b_invert_check:
  dq 0

p1_addr:
  dq 0

p2_addr:
  dq 0


p1_elt_addr:
  dq 0

p2_elt_addr:
  dq 0



//---------
// Hook
//---------
addr_inf_health:
  jmp newmem
  nop
  nop
  nop
return:



//-----------------------------------------------------------------------
[DISABLE]
//-----------------------------------------------------------------------

addr_inf_health:
  db bytes

unregistersymbol(b_invert_check)
unregistersymbol(p1_addr)
unregistersymbol(p2_addr)

unregistersymbol(p1_elt_addr)
unregistersymbol(p2_elt_addr)

dealloc(newmem)

