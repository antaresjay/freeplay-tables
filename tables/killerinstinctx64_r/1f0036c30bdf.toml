[[cheat]]
id = "free-cam-numpad-div"
name = "Free Cam (NumPad DIV)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Killer Instinct
  Version:
  Date   : 2024-04-22
  Author : lamain

  Free-Camera

  Alpha is the Vertical angle
  Beta is the horizontal one
}



define(addr_hook_cam_matrix,"KillerInstinctX64_r.exe"+DE16F)
define(bytes_hook_cam_matrix, 0F 29 A7 D0 02 00 00 )

//-------------------------------
//-------------------------------
[ENABLE]

//-------
// basics
assert(addr_hook_cam_matrix,bytes_hook_cam_matrix)
alloc(newmem_hook,$3000,"KillerInstinctX64_r.exe"+DE16F)


//-------
// Decl Code
label(code_hook_cam_matrix)
label(cod_hookCamMx_skip)
label(cod_hookCamMx_exit)
label(fct_cos)
label(fct_sin)
label(fct_fill_mtx_alpha_tx)
label(fct_fill_mtx_inv_beta_tx)
label(fct_mul_mtxS_col_row)
label(restrain_dx)


//-------
// Variables
label(ptr_cam_matrix)
label(b_init_done)

label(tgt_pos_x)
label(tgt_pos_y)
label(tgt_pos_z)
label(tgt_alpha_val)
label(tgt_beta_val)

label(curr_pos_x)
label(curr_pos_y)
label(curr_pos_z)
label(curr_alpha_val)
label(curr_beta_val)

label(cst_d_alpha_max)
label(cst_d_beta_max)
label(cst_d_xyz_max)

label(cst_fl_zero)
label(cst_fl_one)
label(cst_fl_minusOne)
label(cst_fl_90)
label(cst_fl_m90)
label(cst_fl_180)
label(cst_fl_360)
label(cst_fl_30)
label(cst_fl_60)

label(mtx_alpha_tx)
label(mtx_inv_beta_tx)

label(xmm1_bkup)
label(xmm2_bkup)
label(xmm6_bkup)
label(xmm7_bkup)


registerSymbol(ptr_cam_matrix)
registerSymbol(tgt_pos_x)
registerSymbol(tgt_pos_y)
registerSymbol(tgt_pos_z)
registerSymbol(tgt_alpha_val)
registerSymbol(tgt_beta_val)



//----------------------------
// Code
//----------------------------

newmem_hook:

//-------------------------------
code_hook_cam_matrix:
\tpushfq // save flags register
\tpush RAX
\t//---
\tmov RAX, rdi
\tadd RAX, 000002D0
\tcmp RAX  5B000000
\t// test if do not modify // else, mess up with players coords ...
\tjg cod_hookCamMx_skip

\t//---
\tpush RBX
\tpush RCX
\tpush RDX
\tmovaps [xmm1_bkup], xmm1
\tmovaps [xmm2_bkup], xmm2
\tmovaps [xmm6_bkup], xmm6
\tmovaps [xmm7_bkup], xmm7

\t//---
\tmov [ptr_cam_matrix], RAX

\tmov RBX, [b_init_done]
\tcmp RBX, 1
\tje cod_after_init

\t// Copy Cam Coords
\tadd RAX, C
\tmov EBX, [RAX]
\tmov [tgt_pos_x], EBX
\tmov [curr_pos_x], EBX
\tadd RAX, 10
\tmov EBX, [RAX]
\tmov [tgt_pos_y], EBX
\tmov [curr_pos_y], EBX
\tadd RAX, 10
\tmov EBX, [RAX]
\tmov [tgt_pos_z], EBX
\tmov [curr_pos_z], EBX
\t// Reset Cam Angles
\tmovss xmm1, [cst_fl_zero]
\tmovss [tgt_alpha_val], xmm1
\tmovss [curr_alpha_val], xmm1
\tmovss xmm1, [cst_fl_180]
\tmovss [tgt_beta_val], xmm1
\tmovss [curr_beta_val], xmm1
\t// init done
\tmov [b_init_done], 1

cod_after_init:


\t//---
\t// update 'curr' values
\t//---
\tmovss xmm1, [tgt_beta_val]
\tmovss xmm2, [curr_beta_val]
\tsubss xmm2, xmm1
\tucomiss xmm2, [cst_fl_90]
\tjb cod_beta_not_too_pos_diff
\taddss xmm1, [cst_fl_360]
\tmovss [tgt_beta_val], xmm1
\tjmp cod_beta_diff_ok
cod_beta_not_too_pos_diff:
\tmovss xmm2, [curr_beta_val]
\tsubss xmm2, xmm1
\tucomiss xmm2, [cst_fl_m90]
\tja cod_beta_diff_ok
\tsubss xmm1, [cst_fl_360]
\tmovss [tgt_beta_val], xmm1

cod_beta_diff_ok:
\tmovss xmm1, [tgt_beta_val]
\tmovss xmm2, [curr_beta_val]
\tmovss xmm6, [cst_d_beta_max]
\tcall restrain_dx
\tmovss [curr_beta_val], xmm1

\tmovss xmm1, [tgt_alpha_val]
\tmovss xmm2, [curr_alpha_val]
\tmovss xmm6, [cst_d_alpha_max]
\tcall restrain_dx
\tmovss [curr_alpha_val], xmm1

\tmovss xmm1, [tgt_pos_x]
\tmovss xmm2, [curr_pos_x]
\tmovss xmm6, [cst_d_xyz_max]
\tcall restrain_dx
\tmovss [curr_pos_x], xmm1

\tmovss xmm1, [tgt_pos_y]
\tmovss xmm2, [curr_pos_y]
\tmovss xmm6, [cst_d_xyz_max]
\tcall restrain_dx
\tmovss [curr_pos_y], xmm1

\tmovss xmm1, [tgt_pos_z]
\tmovss xmm2, [curr_pos_z]
\tmovss xmm6, [cst_d_xyz_max]
\tcall restrain_dx
\tmovss [curr_pos_z], xmm1


\t//---
\t// compute new rotation matrix
\t//---
\tmovss xmm1, [curr_beta_val]
\tcall fct_fill_mtx_inv_beta_tx
\tmovss xmm1, [curr_alpha_val]
\tcall fct_fill_mtx_alpha_tx


\t//---
\t// mult rotation matrix into new cam matrix
\t//---
\t// RAX => row_num, RBX => col_Num
\tmov RAX, 0
\tmov RBX, 0
\tmov RCX, [ptr_cam_matrix]

\t//--
\t//--
\t// Row ZERO
\tcall fct_mul_mtxS_col_row
\tmovss [RCX], xmm1
\tADD RCX, 4

\t//--
\tINC RBX
\tcall fct_mul_mtxS_col_row
\tmovss [RCX], xmm1
\tADD RCX, 4

\t//--
\tINC RBX
\tcall fct_mul_mtxS_col_row
\tmovss [RCX], xmm1
\tADD RCX, 8 // next row

\t//--
\t//--
\t// Row ONE
\tINC RAX // next row
\tmov RBX, 0 // next ro
\tcall fct_mul_mtxS_col_row
\tmovss [RCX], xmm1
\tADD RCX, 4

\t//--
\tINC RBX
\tcall fct_mul_mtxS_col_row
\tmovss [RCX], xmm1
\tADD RCX, 4

\t//--
\tINC RBX
\tcall fct_mul_mtxS_col_row
\tmovss [RCX], xmm1
\tADD RCX, 8 // next row

\t//--
\t//--
\t// Row TWO
\tINC RAX // next row
\tmov RBX, 0 // next ro
\tcall fct_mul_mtxS_col_row
\tmovss [RCX], xmm1
\tADD RCX, 4

\t//--
\tINC RBX
\tcall fct_mul_mtxS_col_row
\tmovss [RCX], xmm1
\tADD RCX, 4

\t//--
\tINC RBX
\tcall fct_mul_mtxS_col_row
\tmovss [RCX], xmm1


\t//---
\t// Set Camera Position
\t//---
\tmov RAX, [ptr_cam_matrix]
\t//---
\t// Set X position
\tmov ECX, [curr_pos_x]
\tmov [RAX+C], ECX
\tmovaps xmm4, [RAX]
\tmovaps [rdi+000002D0],xmm4
\t//---
\tADD RAX, 10
\tmov ECX, [curr_pos_y]
\tmov [RAX+C], ECX
\tmovaps xmm4, [RAX]
\tmovaps [rdi+000002E0],xmm4
\t//---
\t// build Z-xmm3 vector line
\tADD RAX, 10
\tmov ECX, [curr_pos_z]
\tmov [RAX+C], ECX
\tmovaps xmm4, [RAX]
\tmovaps [rdi+000002F0],xmm4


\t// movaps [rdi+000002D0],xmm4
\t// movaps [rdi+000002E0],xmm5
\t// movaps [rdi+000002F0],xmm3

\t//---
\tmovaps xmm1, [xmm1_bkup]
\tmovaps xmm2, [xmm2_bkup]
\tmovaps xmm6, [xmm6_bkup]
\tmovaps xmm7, [xmm7_bkup]
\tpop RDX
\tpop RCX
\tpop RBX

\t//---
\tjmp cod_hookCamMx_exit

//---
// Cos: Table + Interpolation
// xmm1 : alpha
// xmm2 : res cos(alpha)
// xmm3 : used
// xmm4 : used
fct_cos:
\t//---
\tmovss xmm2, [cst_fl_180]
\tucomiss xmm1, xmm2
\tja cod_max_cos
\tmulss xmm2, [cst_fl_minusOne]
\tucomiss xmm1, xmm2
\tjb cod_min_cos
\tucomiss xmm1, [cst_fl_zero]
\tjb cod_neg_cos
\t//---
\tpush RAX
\tpush RBX
\troundss xmm2, xmm1, 1\t// 1 => round down xmm1 => xmm2
\tcvtss2si EAX, xmm2\t\t// float -> int
\tmov RBX, 4 // sizeof float
\tMUL RBX
\tMOV RBX, tble_cos
\tADD RAX, RBX
\tmovss xmm3,[RAX]
\t//---
\t// RAX => table address cos(floor(alpha)), xmm1 => alpha, xmm2 => floor(alpha), xmm3 => cos(floor(alpha))
\tmovss xmm4, xmm1
\tsubss xmm4, xmm2
\tucomiss xmm4, [cst_fl_zero]
\tje cod_cos_exact
\t// RAX => table address cos(floor(alpha)), xmm1 => alpha, xmm2 => floor(alpha), xmm3 => cos(floor(alpha)), xmm4 => [ratio cos(floor(alpha)), cos(ceil(alpha))]
\tADD RAX, 4
\tmovss xmm2, [RAX]
\t// xmm1 => alpha, xmm2 => cos(ceil(alpha)), xmm3 => cos(floor(alpha)), xmm4 => [ratio cos(floor(alpha)), cos(ceil(alpha))]
\tmulss xmm2, xmm4
\tmovd EAX, xmm2
\tmovss xmm2, [cst_fl_one]
\tsubss xmm2, xmm4
\tmulss xmm3, xmm2
\tmovd xmm2, EAX
\taddss xmm2, xmm3
\tpop RBX
\tpop RAX
\tret
cod_cos_exact:
\tpop RBX
\tpop RAX
\tmovss xmm2, xmm3
\tret

// xmm1 => alpha, xmm2 => 180
cod_max_cos:
\tpush RAX
\tmovd EAX, xmm1
\tmovss xmm3, [cst_fl_360]
cod_shrink_alpha:
\tsubss xmm1, xmm3
\tucomiss xmm1, xmm2
\tja cod_shrink_alpha
\tcall fct_cos
\tmovd xmm1, EAX
\tpop RAX
\tret

// xmm1 => alpha, xmm2 => -180
cod_min_cos:
\tpush RAX
\tmovd EAX, xmm1
\tmovss xmm3, [cst_fl_360]
cod_biggen_alpha:
\taddss xmm1, xmm3
\tucomiss xmm1, xmm2
\tjb cod_biggen_alpha
\tcall fct_cos
\tmovd xmm1, EAX
\tpop RAX
\tret

cod_neg_cos:
\tmovd EAX, xmm1
