type = "script"
source = """
[ENABLE]


aobscanmodule(minnionhealth,Overlord2.exe,04 8B 90 A4 08 00 00)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  mov edx, [eax+000008A4]

  cmp ebx, 0
  je return

  mov [eax+00000A34], (float)10000.0
  mov [eax+00000A38], (float)10000.0
  jmp return

minnionhealth+01:
  jmp newmem
  nop
return:
registersymbol(minnionhealth)

[DISABLE]

minnionhealth+01:
  db 8B 90 A4 08 00 00

unregistersymbol(minnionhealth)
dealloc(newmem)"""
