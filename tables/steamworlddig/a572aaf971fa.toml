[[cheat]]
id = "right-click-change-script-for-info"
name = "RIGHT CLICK -> Change script for info"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
Howdy again!

Here's another table containing some scripts for Steamworld
Dig, steam Build #382752. I couldn't find any pointers, but
there might to unearth some if you're more patient than I am.

The scripts do the following:

* Reset health when moving

There's an instruction that gets triggered once the player
moves around. Once the player has taken a step, this modified
script will reset his health to "6". At the beginning you
won't have that much health, so don't worry about the health
bar filling itself up and going down again.

* No damage (player only)

In theory, this should make you invulnerable as any incoming
damage won't be saved. Enemies are perfectly killable AFAIK.

* No damage (player & enemies)

Might make everything invulnerable. Why is this even here?
I don't know. Maybe some of you can think of some way this
might come in handy.

* Unlimited water (steam jumps)

This script stops the decrease of water in your tank when you're
"steam jumping".

* Unlimited water (drilling)

This script stops losing water when you're drilling.

* Unlimited light

You won't lose light (the top right bar) once you've gone
underground.

* Freeze money at 1000

Your money will always be 1000. You can't get more (except
you change the script) and you won't drop below 1000 either.

* Infinite money (when buying)

When you're buying in one of the shops your money won't
decrease, no matter what you purchase.

* Freeze blue orbs at 15

You will always have 15 blue orbs with you. The script
resets the value to 15 continually.

* Infinite blue orbs (when buying)

The amount of blue orbs you're carrying won't decrease when
you buy one of the upgrades in one of the shops.

* Unlimited/increasing items

Your items (ladders, dynamite, teleporters, et cetera) won't
won't vanish once you use them; they will even increase by
one every use - even above the usual maximum amount.

You know the drill, don't cheat in MP, you're not a dirty wanker,
are you? Have fun! ~CyberD3m0n

}
[ENABLE]
[DISABLE]"""

[[cheat]]
id = "reset-health-when-moving"
name = "Reset health when moving"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(healthwhenmove,SteamWorldDig.exe,D8 9B 64 01 00 00 DF E0 F6 C4 05 7A 04) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(dothething)
newmem:

code:
  cmp [ebx+0144],1
  je dothething
  fcomp dword ptr [ebx+00000164]
  jmp return

dothething:
  fcomp dword ptr [ebx+00000164]
  mov [ebx+00000164],(float)6
  jmp return

healthwhenmove:
  jmp newmem
  nop
return:
registersymbol(healthwhenmove)

[DISABLE]

healthwhenmove:
  db D8 9B 64 01 00 00

unregistersymbol(healthwhenmove)
dealloc(newmem)

"SteamWorldDig.exe"+44046:
  fcomp dword ptr [ebx+00000164]"""

