//12EA164B - F3 0F5A C0            - cvtss2sd xmm0,xmm0
//12EA164F - F2 0F11 85 E0FEFFFF   - movsd [rbp-00000120],xmm0
//12EA1657 - 48 83 EC 20           - sub rsp,20
//12EA165B - 49 BB 80FD4A0500000000 - mov r11,00000000054AFD80 : [EC8B4855]
aobscan(Detector_searchedAOB, F3 0F 10 46 6C F3 0F 5A C0 F2 0F 11 85 E0 FE FF FF)

alloc(Detector_newmem, 2048, Detector_searchedAOB)
alloc(Detector_temp1, 8, Detector_searchedAOB)
