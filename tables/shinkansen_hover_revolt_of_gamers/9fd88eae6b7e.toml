mov [Detector_temp1], rax
mov [Detector_temp2], rbx
mov [Detector_temp3], rcx
mov [Detector_temp4], rdx

cmp dword ptr [Detector_update_enable], #0
je Detector_update_exit
mov [Detector_basepointer], rsi
