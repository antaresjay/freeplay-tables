unregistersymbol(Player_Manager_update_enable)
unregistersymbol(Player_Manager_set_enable)
unregistersymbol(Player_Manager_jumpset_enable)
unregistersymbol(Player_Manager_tricksset_enable)

dealloc(Player_Manager_basepointer)
dealloc(Player_Manager_update_enable)
dealloc(Player_Manager_set_enable)
dealloc(Player_Manager_jumpset_enable)
dealloc(Player_Manager_tricksset_enable)"""

[[cheat]]
id = "player-manager-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Player_Manager Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Player_Manager_savedAOB)
label(Player_Manager_returnhere)
label(Player_Manager_originalcode)
label(Player_Manager_exit)

label(Player_Manager_update_exit)
label(Player_Manager_set_exit)
label(Player_Manager_jumpset_exit)
label(Player_Manager_tricksset_exit)

registersymbol(Player_Manager_savedAOB)

//1EE0C725 - 48 83 EC 78           - sub rsp,78
//1EE0C729 - 48 8B F1              - mov rsi,rcx
// Player_Manager:LateUpdate+c
//1EE0C72C - 0FB6 86 68030000      - movzx eax,byte ptr [rsi+00000368]
//1EE0C733 - 85 C0                 - test eax,eax
//1EE0C735 - 0F84 3D010000         - je 1EE0C878
//1EE0C73B - 48 8B 8E 58010000     - mov rcx,[rsi+00000158]
//1EE0C742 - 33 D2                 - xor edx,edx
//1EE0C744 - 48 83 EC 20           - sub rsp,20
aobscan(Player_Manager_searchedAOB, 0F B6 86 68 03 00 00 85 C0 * * * * * * 48 8B 8E 58 01 00 00)

alloc(Player_Manager_newmem, 2048, Player_Manager_searchedAOB)
alloc(Player_Manager_temp1, 8, Player_Manager_searchedAOB)
alloc(Player_Manager_temp2, 8, Player_Manager_searchedAOB)
alloc(Player_Manager_temp3, 8, Player_Manager_searchedAOB)
alloc(Player_Manager_temp4, 8, Player_Manager_searchedAOB)
alloc(Player_Manager_temp5, 8, Player_Manager_searchedAOB)


Player_Manager_newmem:
mov [Player_Manager_temp1], rax
mov [Player_Manager_temp2], rbx
mov [Player_Manager_temp3], rcx
mov [Player_Manager_temp4], rdx

cmp dword ptr [Player_Manager_update_enable], #0
je Player_Manager_update_exit
mov [Player_Manager_basepointer], rsi
Player_Manager_update_exit:

cmp dword ptr [Player_Manager_set_enable], #0
je Player_Manager_set_exit
Player_Manager_set_exit:

cmp dword ptr [Player_Manager_jumpset_enable], #0
je Player_Manager_jumpset_exit
mov [rsi+4ec], (float)99
Player_Manager_jumpset_exit:

cmp dword ptr [Player_Manager_tricksset_enable], #0
je Player_Manager_tricksset_exit
mov rbx, [rsi+1d8]
test rbx, rbx
je Player_Manager_tricksset_exit
mov [rbx+24], (float)9999999
mov [rbx+28], (float)9999999
mov [rbx+2c], (float)9999999
mov rbx, [rsi+1e0]
test rbx, rbx
je Player_Manager_tricksset_exit
mov [rbx+24], (float)9999999
mov [rbx+28], (float)9999999
mov [rbx+2c], (float)9999999
mov rbx, [rsi+1e8]
test rbx, rbx
je Player_Manager_tricksset_exit
mov [rbx+24], (float)9999999
mov [rbx+28], (float)9999999
mov [rbx+2c], (float)9999999
mov rbx, [rsi+1f0]
test rbx, rbx
je Player_Manager_tricksset_exit
mov [rbx+24], (float)9999999
mov [rbx+28], (float)9999999
mov [rbx+2c], (float)9999999
mov rbx, [rsi+1f8]
test rbx, rbx
je Player_Manager_tricksset_exit
mov [rbx+24], (float)9999999
mov [rbx+28], (float)9999999
mov [rbx+2c], (float)9999999
mov rbx, [rsi+200]
test rbx, rbx
je Player_Manager_tricksset_exit
mov [rbx+24], (float)9999999
mov [rbx+28], (float)9999999
mov [rbx+2c], (float)9999999
Player_Manager_tricksset_exit:

mov rax, [Player_Manager_temp1]
mov rbx, [Player_Manager_temp2]
mov rcx, [Player_Manager_temp3]
mov rdx, [Player_Manager_temp4]


Player_Manager_originalcode:
db 0F B6 86 68 03 00 00
//movzx eax,byte ptr [rsi+00000368]


Player_Manager_exit:
jmp Player_Manager_returnhere


Player_Manager_searchedAOB:
Player_Manager_savedAOB:
jmp Player_Manager_newmem
nop
nop
Player_Manager_returnhere:


[DISABLE]
Player_Manager_savedAOB:
db 0F B6 86 68 03 00 00
//movzx eax,byte ptr [rsi+00000368]

unregistersymbol(Player_Manager_savedAOB)

dealloc(Player_Manager_newmem)
dealloc(Player_Manager_temp1)
dealloc(Player_Manager_temp2)
dealloc(Player_Manager_temp3)
dealloc(Player_Manager_temp4)
dealloc(Player_Manager_temp5)"""

