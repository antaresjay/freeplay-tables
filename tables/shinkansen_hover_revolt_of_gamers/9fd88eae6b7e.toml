[[cheat]]
id = "player-manager-base-address-scan-initialization-activate-this-first"
name = "Player_Manager Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Player_Manager_basepointer)
registersymbol(Player_Manager_update_enable)
registersymbol(Player_Manager_set_enable)
registersymbol(Player_Manager_jumpset_enable)
registersymbol(Player_Manager_tricksset_enable)

alloc(Player_Manager_basepointer, 8)
alloc(Player_Manager_update_enable, 4)
alloc(Player_Manager_set_enable, 4)
alloc(Player_Manager_jumpset_enable, 4)
alloc(Player_Manager_tricksset_enable, 4)


[DISABLE]
