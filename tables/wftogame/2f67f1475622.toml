[[cheat]]
id = "game-play-settings"
name = "Game Play Settings"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//GamePlaySettings:get_DefaultLanguage+4
aobscan(get_settings,48 8B 04 25 ?? ?? ?? ?? 48 8B 40 18 48 83)
alloc(settings,8)
settings:
  readmem(get_settings+4,4)
registersymbol(settings)

[DISABLE]
unregistersymbol(settings)
dealloc(settings)

{
// ORIGINAL CODE - INJECTION POINT: 2D37C0CC

2D37C0AF: 48 8B C8                       -  mov rcx,rax
2D37C0B2: 48 83 EC 20                    -  sub rsp,20
2D37C0B6: 48 8B 00                       -  mov rax,[rax]
2D37C0B9: 41 BA C0 C8 3A 0E              -  mov r10d,0E3AC8C0
2D37C0BF: 90                             -  nop 
2D37C0C0: 90                             -  nop 
2D37C0C1: 90                             -  nop 
2D37C0C2: FF 50 E0                       -  call qword ptr [rax-20]
2D37C0C5: 48 83 C4 20                    -  add rsp,20
2D37C0C9: 48 8B F0                       -  mov rsi,rax
// ---------- INJECTING HERE ----------
2D37C0CC: 48 8B 04 25 00 BB FF 04        -  mov rax,[04FFBB00]
// ---------- DONE INJECTING  ----------
2D37C0D4: 48 63 40 20                    -  movsxd  rax,dword ptr [rax+20]
2D37C0D8: F2 0F 2A C0                    -  cvtsi2sd xmm0,eax
2D37C0DC: F2 0F 5A E8                    -  cvtsd2ss xmm5,xmm0
2D37C0E0: F3 0F 11 6D EC                 -  movss [rbp-14],xmm5
2D37C0E5: 33 FF                          -  xor edi,edi
2D37C0E7: E9 2D 00 00 00                 -  jmp GamePlaySettings:WorkerCost+a9
2D37C0EC: 48 8D 6D 00                    -  lea rbp,[rbp+00]
2D37C0F0: F3 0F 10 45 EC                 -  movss xmm0,[rbp-14]
2D37C0F5: F3 0F 5A C0                    -  cvtss2sd xmm0,xmm0
2D37C0F9: 48 8B 04 25 00 BB FF 04        -  mov rax,[04FFBB00]
}"""

