{ Game   : Dice Gambit.exe
  Version: 
  Date   : 2026-07-30
  Author : jacob
  Description : 

  <Optional info>
}

[ENABLE]

aobscan(ReRoll,FF C9 89 88 D4 00 00 00) // should be unique
alloc(newmem,$1000,ReRoll)

label(code)
label(return)

newmem:

code:
  mov [rax+000000D4],2
  jmp return

ReRoll+02:
  jmp newmem
  nop
return:
registersymbol(ReRoll)

[DISABLE]

ReRoll+02:
  db 89 88 D4 00 00 00

unregistersymbol(ReRoll)
dealloc(newmem)

