[[cheat]]
id = "shotgunmodule"
name = "ShotgunModule"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : DuckSeasonPC.exe
  Version: 
  Date   : 2019-06-19
  Author : Anjinggila

  This script does blah blah blah
}

[ENABLE]

aobscan(LocalGun,C8 89 86 88 01 00 00) // should be unique
alloc(newmem,$1000,15B8A519DA8)
globalalloc(gunpointers,8)

label(code)
label(return)

newmem:

code:
  mov [gunpointers],rsi
  mov [rsi+00000188],eax
  jmp return

LocalGun+01:
  jmp newmem
  nop
return:
registersymbol(LocalGun)

[DISABLE]

LocalGun+01:
  db 89 86 88 01 00 00

unregistersymbol(LocalGun)
dealloc(newmem)"""

