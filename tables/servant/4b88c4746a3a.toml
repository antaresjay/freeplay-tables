label(code)
label(return)
alloc(Orgasm_Flag,8)
registersymbol(Orgasm_Flag)
alloc(Stamina_Flag,8)
registersymbol(Stamina_Flag)

Orgasm_Flag:
dd 0
Stamina_Flag:
dd 0

newmem:
  push ebx
  mov ebx,[edi+08]
  mov ebx,[ebx+0C]
  cmp [Orgasm_Flag],1
  jne @f
  mov [ebx+7C],#0
