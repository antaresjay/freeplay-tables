type = "script"
source = """
{ Game   : Everholm.exe
  Version: 
  Date   : 2024-11-15
  Author : BabyGroot

  This script does blah blah blah
}

[ENABLE]

aobscanregion(pData_GameTimer,GameTimer:UpdateMinutes,GameTimer:UpdateMinutes+130,0F B6 86 A0 00 00 00 85 C0 0F 85) // should be unique
alloc(newmem,$1000,pData_GameTimer)

alloc(pBase_GameTimer,8)
registersymbol(pBase_GameTimer)

label(code)
label(return)

pBase_GameTimer:
dd

newmem:

code:
  mov [pBase_GameTimer],rsi
  db 0F B6 86 A0 00 00 00
  jmp return

pData_GameTimer:
  jmp newmem
  nop 2
return:
registersymbol(pData_GameTimer pBase_GameTimer)

[DISABLE]

pData_GameTimer:
  db 0F B6 86 A0 00 00 00

unregistersymbol(*)
dealloc(*)"""

