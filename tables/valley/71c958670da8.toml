id = "inventory-item-holder-ctrl-numpad-1-right-click-on-any-item-to-populate-value"
name = "Inventory Item Holder (Ctrl + Numpad 1) {Right Click on any item to populate value}"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Fangclaw Valley.exe
// Author            : ndck76
// Executable Version: 2022.3.13.37029
// Game Version      : Build.19030923
// Script Date       : 2025-07-16


define(address,InventoryManager:HandleRightClick+ac)
define(bytes,44 0F B6 46 60)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,InventoryManager:HandleRightClick+ac)

label(code)
label(return)
label(data2)
registersymbol(data2)

newmem:

code:
  mov [data2],rsi
  movzx r8d,byte ptr [rsi+60]
  jmp return

data2:
  db

address:
  jmp newmem
return:

[DISABLE]

address:
  db bytes
  // movzx r8d,byte ptr [rsi+60]

dealloc(*)
unregistersymbol(*)"""

