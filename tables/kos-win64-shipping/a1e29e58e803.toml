registersymbol(crit_chance)
registersymbol(crit_damage)

newmem3:
code3:
  readmem(shipattributes,7)      //playercontroller/ownedship/attributeSet
  mov [shipattrib], rdx
  jmp god
god:
  cmp [god_mode],00000001
  jne weap
  test rdx, rdx
  jz return3
  push rax
  mov rax, [rdx+7C]     //sailshealth max
  mov [rdx+4C], rax     //sailshealth Current
  mov rax, [rdx+6C]     //Crewhealth max
  mov [rdx+3C], rax     //Crewshealth Current
  mov rax, [rdx+8C]     //Hullhealth max
  mov [rdx+5C], rax     //Hullhealth Current
  mov [rdx+22C], (float)9999      //Armor
  pop rax
  jmp weap

weap:
  cmp [weap_hack],00000001
  jne reload
  test rdx, rdx
  jz return3
  mov [rdx+19C], (float)15000     //Bullet Speed
  mov [rdx+17C], (float)50        //Weapon Range
  jmp reload

reload:
  cmp [weap_reload],00000001
  jne reward
  test rdx, rdx
  jz return3
  mov [rdx+EC], (float)0      //Reload Time
  jmp reward

reward:
  cmp [reward_hack],00000001
  jne crit_c
  test rdx, rdx
  jz return3
  mov [rdx+2BC], (float)999     //Gold Drop Chance
  mov [rdx+3CC], (float)999     //Rare or High Drop Bonus
  jmp crit_c

crit_c:
  cmp [crit_chance],00000001
  jne crit_d
  test rdx, rdx
  jz return3
  mov [rdx+1BC], (float)999     //Critical Chance
  jmp crit_d

crit_d:
  cmp [crit_damage],00000001
  jne return3
  test rdx, rdx
  jz return3
  mov [rdx+1DC], (float)999      //Critical Power/Damage
  jmp return3

shipattribread:
readmem(shipattributes,7)

god_mode:
dd 0
weap_hack:
dd 0
weap_reload:
dd 0
reward_hack:
dd 0
crit_chance:
dd 0
crit_damage:
dd 0

shipattributes:
  jmp newmem3
  nop 2
return3:
registersymbol(shipattributes)

[DISABLE]

shipattributes:
  readmem(shipattribread,7)

