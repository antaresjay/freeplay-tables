[[cheat]]
id = "game-data-ctrl-numpad-1"
name = "Game Data (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : PrincessOfTheWaterLilies.exe
// Author            : ndck76
// Executable Version: 2021.3.12.62403
// Game Version      : v1.0.0
// Script Date       : 2025-11-22


[ENABLE]

aobscanregion(flyfirecount,KF.PersistenceData.GameData:GetCollectibleInPossessionCount,KF.PersistenceData.GameData:GetCollectibleInPossessionCount+150,4C63BFxxxx0000EBxx45xxxx48xxxxxx41xxxx48xxxxxx48xxxxxx4Cxxxxxx48xxxxxx5DC3) //KF.PersistenceData.GameData:GetCollectibleInPossessionCount+98
alloc(newmem,$1000,flyfirecount)
alloc(data2,8)
alloc(flyfirecountbkp,7)
registersymbol(data2)
registersymbol(flyfirecount)
registersymbol(flyfirecountbkp)
label(code)
label(return)

flyfirecountbkp:
  readmem(flyfirecount,7)

newmem:
  mov [data2],rdi

code:
  readmem(flyfirecount,7)
  jmp return

flyfirecount:
  jmp newmem
  nop 2
return:

[DISABLE]

flyfirecount:
  readmem(flyfirecountbkp,7)

unregistersymbol(*)
dealloc(*)"""

