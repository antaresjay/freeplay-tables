[[cheat]]
id = "stop-game-timer-experimental"
name = "Stop Game Timer (Experimental)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Slender - The Arrival.exe
  Version: 
  Date   : 2022-12-05
  Author : R_X
}

define(address,Timer:UpdateTime+d4)
define(bytes,E8 7F 03 00 00)
define(timer,90 90 90 90 90)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
//  call Timer:processSeconds
  db timer
  jmp return

address:
  jmp newmem
return:

[DISABLE]

address:
  db bytes
  // call Timer:processSeconds

dealloc(newmem)"""

