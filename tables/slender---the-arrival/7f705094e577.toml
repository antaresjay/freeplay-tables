[[cheat]]
id = "x-activate-me-old"
name = "<<== [X]  Activate me OLD"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Slender - The Arrival.exe
  Version: 
  Date   : 2023-03-29
  Author : R_X
}

[ENABLE]

aobscan(pBase,06 00 00 8B 47 48 8B C8) // should be unique
alloc(newmem,$1000)
alloc(Base,8)

label(code)
label(return)

Base:
dq 0

newmem:

code:
  mov [Base],edi
  mov eax,[edi+48]
  mov ecx,eax
  jmp return

pBase+03:
  jmp newmem
return:
registersymbol(pBase Base)

[DISABLE]

pBase+03:
  db 8B 47 48 8B C8

unregistersymbol(*)
dealloc(*)"""
