[[cheat]]
id = "block-base-address-scan-initialization-activate-this-first"
name = "Block Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Block_basepointer)
registersymbol(Block_update_enable)
registersymbol(Block_set_enable)
registersymbol(Block_decayset_enable)
registersymbol(Block_resourceoutputsset_enable)

alloc(Block_basepointer, 4)
alloc(Block_update_enable, 4)
alloc(Block_set_enable, 4)
alloc(Block_decayset_enable, 4)
alloc(Block_resourceoutputsset_enable, 4)


[DISABLE]
unregistersymbol(Block_basepointer)
unregistersymbol(Block_update_enable)
unregistersymbol(Block_set_enable)
unregistersymbol(Block_decayset_enable)
unregistersymbol(Block_resourceoutputsset_enable)

dealloc(Block_basepointer)
dealloc(Block_update_enable)
dealloc(Block_set_enable)
dealloc(Block_decayset_enable)
dealloc(Block_resourceoutputsset_enable)"""

[[cheat]]
id = "block-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Block Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Block_savedAOB)
label(Block_returnhere)
label(Block_originalcode)
label(Block_exit)

label(Block_update_exit)
label(Block_set_exit)
label(Block_decayset_exit)
label(Block_resourceoutputsset_entry)
label(Block_resourceoutputsset_exit)

registersymbol(Block_savedAOB)

//05566CDC - 83 EC 04              - sub esp,04
//05566CDF - 8B 7D 08              - mov edi,[ebp+08]
// Block:everyFrameUpdate+a
//05566CE2 - 8B 87 64020000        - mov eax,[edi+00000264]
//05566CE8 - 85 C0                 - test eax,eax
//05566CEA - 7E 25                 - jle 05566D11
//05566CEC - 8B 87 68020000        - mov eax,[edi+00000268]
aobscan(Block_searchedAOB, 8B 87 64 02 00 00 85 C0)

alloc(Block_newmem, 2048, Block_searchedAOB)
alloc(Block_temp1, 4, Block_searchedAOB)
alloc(Block_temp2, 4, Block_searchedAOB)
alloc(Block_temp3, 4, Block_searchedAOB)
alloc(Block_temp4, 4, Block_searchedAOB)
alloc(Block_temp5, 4, Block_searchedAOB)


Block_newmem:
mov [Block_temp1], eax
mov [Block_temp2], ebx
mov [Block_temp3], ecx
mov [Block_temp4], edx

cmp dword ptr [Block_update_enable], #0
je Block_update_exit
cmp dword ptr [edi+264], #0
je Block_update_exit
mov [Block_basepointer], edi
Block_update_exit:

cmp dword ptr [Block_set_enable], #0
je Block_set_exit
Block_set_exit:

cmp dword ptr [Block_decayset_enable], #0
je Block_decayset_exit
mov [edi+1f0], #0
Block_decayset_exit:

cmp dword ptr [Block_resourceoutputsset_enable], #0
je Block_resourceoutputsset_exit
mov ebx, [edi+d8]
test ebx, ebx
je Block_resourceoutputsset_exit
mov ebx, [ebx+8]
test ebx, ebx
je Block_resourceoutputsset_exit
mov ecx, [ebx+c]
test ecx, ecx
je Block_resourceoutputsset_exit
add ecx, [ebx+c]
add ecx, [ebx+c]
add ecx, [ebx+c]
Block_resourceoutputsset_entry:
sub ecx, 4
mov [ebx+ecx+10], (float)999
cmp ecx, #0
je Block_resourceoutputsset_exit
jmp Block_resourceoutputsset_entry
Block_resourceoutputsset_exit:

mov eax, [Block_temp1]
mov ebx, [Block_temp2]
mov ecx, [Block_temp3]
mov edx, [Block_temp4]


Block_originalcode:
db 8B 87 64 02 00 00
//mov eax,[edi+00000264]


Block_exit:
jmp Block_returnhere


Block_searchedAOB:
Block_savedAOB:
jmp Block_newmem
nop
Block_returnhere:


[DISABLE]
Block_savedAOB:
db 8B 87 64 02 00 00
//mov eax,[edi+00000264]

unregistersymbol(Block_savedAOB)

dealloc(Block_newmem)
dealloc(Block_temp1)
dealloc(Block_temp2)
dealloc(Block_temp3)
dealloc(Block_temp4)
dealloc(Block_temp5)"""

