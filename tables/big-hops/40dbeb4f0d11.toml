[[cheat]]
id = "player-item-ctrl-numpad-1"
name = "Player Item (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Big Hops.exe
// Author            : ndck76
// Executable Version: 2022.3.62.62237
// Game Version      : v21207
// Script Date       : 2026-01-14


[ENABLE]

aobscanregion(stamina,PlayerMotor_Ground:Tick,PlayerMotor_Ground:Tick+3000,488B80xxxx000048xxxx83xxxx49BBxxxxxxxxxxxx000041xxxx48xxxx49BBxxxxxxxxxxxx000041xxxx48xxxx83xxxx48xxxxxxxxxxxx48xxxx83xxxx) //PlayerMotor_Ground:Tick+171
alloc(newmem,$1000,stamina)
alloc(data,8)
alloc(staminabkp,7)
registersymbol(data)
registersymbol(stamina)
registersymbol(staminabkp)
label(code)
label(return)

staminabkp:
  readmem(stamina,7)

newmem:
  mov [data],rax

code:
  readmem(stamina,7)
  jmp return

stamina:
  jmp newmem
  nop 2
return:

[DISABLE]

stamina:
  readmem(staminabkp,7)

unregistersymbol(*)
dealloc(*)"""

