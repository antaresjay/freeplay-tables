[ENABLE]

aobscanmodule(jumps,GameAssembly.dll,8Bxxxx89xxxxxxxxxxC6xxxxxxxxxxxx8Bxxxx85xx0Fxxxxxxxxxx6A) //MoreMountains.CorgiEngine.CharacterJump.ProcessAbility
alloc(newmem,$1000)
alloc(jumpsbkp,9)
