[[cheat]]
id = "right-click-change-script-for-info"
name = "Right click -> Change script for info"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
The scripts concerning your energy value usually crash at certain
points; I'll try to refine the scripts but here are some hints
which might help you:

"Set energy to 99 when changing weapon": this will change
your current energy to 99 once you've selected a different
weapon. The game crashes if you disable the script.

"Always 99 energy": this will crash once you select your
melee weapon (that "power glove thing") and attack.

"Unlimited energy": this also crashes your game if you
melee attack with the glove AND if you deactivate the
script.

Thx for reading & cheerio - Dami0N/CyberD3m0n
}
[ENABLE]
[DISABLE]"""

