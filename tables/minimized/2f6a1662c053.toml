[[cheat]]
id = "true-god-mode"
name = "True god mode"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(INJECT,Minimized.exe,00 89 1D 38 31 45 00 C7) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  nop
  jmp return

INJECT+01:
  jmp newmem
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT+01:
  db 89 1D 38 31 45 00

unregistersymbol(INJECT)
dealloc(newmem)

Minimized.exe+DF99:
  mov [Minimized.exe+53138],ebx"""

