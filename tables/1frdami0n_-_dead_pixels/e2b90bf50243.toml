[[cheat]]
id = "no-ammo-substraction"
name = "No Ammo Substraction"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(INJECT,3F 01 00 00 C1 E3 04 8D 5C 1E 08 8B 45 0C 89 43 0C FF 47 20) // should be unique
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov [ebx+0C],eax
  add [ebx+0C],1
  inc [edi+20]
  jmp return

INJECT+0E:
  jmp code
  nop
return:
registersymbol(INJECT)

[DISABLE]

INJECT+0E:
  db 89 43 0C FF 47 20

unregistersymbol(INJECT)
dealloc(newmem)"""

