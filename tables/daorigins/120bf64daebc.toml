[[cheat]]
id = "zero-cool-down"
name = "Zero Cool Down"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(instantcooldown,DAOrigins.exe,DF E0 F6 C4 41 0F ?? ?? ?? ?? ?? 8B ?? 5C E8)
alloc(newmem,$1000)

label(code)
label(return)

newmem:
code:
  mov [ecx+0C], 0
  fnstsw ax
  test ah,41
  jmp return

instantcooldown:
  jmp newmem
return:
registersymbol(instantcooldown)

[DISABLE]

instantcooldown:
  db DF E0 F6 C4 41

unregistersymbol(instantcooldown)
dealloc(newmem)"""
