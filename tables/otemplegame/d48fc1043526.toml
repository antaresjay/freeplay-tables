[[cheat]]
id = "activate-cheats"
name = "Activate Cheats"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(playerHook,oTempleGame.exe,48 F3 0F 10 97 8C 00 00 00) // should be unique
alloc(newmem,$1000,playerHook)

label(code)
label(return)
label(playerPTR)

newmem:
  mov [playerPTR], rdi
code:
  movss xmm2,[rdi+0000008C]
  jmp return

playerPTR:
  dq 0

playerHook+01:
  jmp newmem
  nop 3
return:
registersymbol(playerPTR)
registersymbol(playerHook)

[DISABLE]

playerHook+01:
  db F3 0F 10 97 8C 00 00 00

unregistersymbol(playerPTR)
unregistersymbol(playerHook)
dealloc(newmem)"""

