[[cheat]]
id = "player"
name = "Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(_o,48 63 40 20 F3 0F 2A C0 F3 0F 5A C0 F2 0F 11 45 C8)
alloc(_0,8)
alloc(newmem,$1000,_o)
label(return)
registersymbol(_o _0)
newmem:
  mov [_0],rax
  movsxd  rax,dword ptr [rax+20]
  cvtsi2ss xmm0,eax
  jmp return
_o:
  jmp newmem
  nop 3
return:
[DISABLE]
dealloc(*)
unregistersymbol(*)
_o:
  db 48 63 40 20 F3 0F 2A C0"""

