[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

aobscanmodule(health,AWVSSAO.exe,F3 0F 10 8B 00 04 00 00 48) // should be unique
alloc(newmem,$1000,health)

label(code)
label(return)

newmem:
code:
  cmp [rbx+00000088], 59414C50
  jne @F

  mov [rbx+00000400], 497423F0

@@:
  movss xmm1,[rbx+00000400]
  jmp return

health:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(health)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
health:
  db F3 0F 10 8B 00 04 00 00

unregistersymbol(health)
dealloc(newmem)"""

