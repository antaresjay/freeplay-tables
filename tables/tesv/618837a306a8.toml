[[cheat]]
id = "camera-press-g-to-switch-b-w-right-default-center-and-left-won-t-affect-combat-riding-cam"
name = "Camera - press G to switch b/w Right(Default), Center, and Left (won't affect Combat/Riding Cam)"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048) //2kb should be enough
label(returnhere)
label(originalcode)
label(exit)
label(resetheyhoho)
label(setLeft)
label(setCenter)
label(setRight)
globalalloc(heyhoho,4)
globalalloc(pCamera,4)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
fld dword ptr [esi+48]

mov [pCamera],esi

pushad
push 'G'      //key G
call GetAsyncKeyState
shr ax,#15
cmp ax,1
popad
jne resetheyhoho
cmp [heyhoho],00000000
jne originalcode
mov [heyhoho],00000001

cmp dword ptr [esi+3C],(float)2.5
je setLeft
cmp dword ptr [esi+3C],(float)30.0
je setCenter
cmp dword ptr [esi+3C],(float)-30.0
je setRight
jmp originalcode

setLeft:
mov dword ptr [esi+3C],(float)-30.0
mov dword ptr [esi+40],(float)0.0
mov dword ptr [esi+44],(float)-10.0
jmp originalcode

setCenter:
mov dword ptr [esi+3C],(float)2.5
mov dword ptr [esi+40],(float)0.0
mov dword ptr [esi+44],(float)13.0
jmp originalcode

setRight:
mov dword ptr [esi+3C],(float)30.0
mov dword ptr [esi+40],(float)0.0
mov dword ptr [esi+44],(float)-10.0
jmp originalcode

resetheyhoho:
mov [heyhoho],00000000
jmp originalcode

originalcode:
//fld dword ptr [esi+48]
fld dword ptr [esi+3C]

exit:
jmp returnhere

///
heyhoho:
dd 00000000
pCamera:
dd 0
///

"TESV.exe"+43A0BC:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
"TESV.exe"+43A0BC:
db D9 46 48 D9 46 3C
//Alt: fld dword ptr [esi+48]
//Alt: fld dword ptr [esi+3C]
dealloc(heyhoho)
dealloc(pCamera)"""

