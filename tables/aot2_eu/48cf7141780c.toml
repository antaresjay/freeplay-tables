[[cheat]]
id = "infinite-battle-items"
name = "Infinite Battle Items"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]


aobscanmodule(battleitems,AOT2_EU.exe,41 0F B7 94 79 EC 06 00 00)
alloc(newmem,$1000,battleitems)

label(code)
label(return)

newmem:

code:

mov word ptr [r9+rdi*2+000006EC],5
movzx edx,word ptr [r9+rdi*2+000006EC]
jmp return

battleitems:
jmp newmem
nop
nop
nop
nop
return:
registersymbol(battleitems)

[DISABLE]

battleitems:
db 41 0F B7 94 79 EC 06 00 00

unregistersymbol(battleitems)
dealloc(newmem)"""

