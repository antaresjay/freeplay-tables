[[cheat]]
id = "activate-trainer-2-controls-money-pointer"
name = "Activate Trainer 2 (Controls Money Pointer)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
///
aobscanmodule(GetMoneyPointerAOB1,"GameAssembly.dll",8B 5B 44 40 84 FF 74 4D 80 3D * * * * 00 75 13)
registersymbol(GetMoneyPointerAOB1)
alloc(newmem,1024,GetMoneyPointerAOB1)

///
label(return)
label(GetMoneyPointerAOB1Save)
registersymbol(GetMoneyPointerAOB1Save)

///
newmem:
  mov [R14Save],r14
  mov [R15Save],r15
  mov r15,PotchPtr
  mov [r15],rbx
  jmp MyCleanUp1
  
MyCleanUp1:
  mov r14,[R14Save]
  mov r15,[R15Save]
  jmp originalcode
  
originalcode:
GetMoneyPointerAOB1Save:
  readmem(GetMoneyPointerAOB1,6)
  jmp GetMoneyPointerAOB1+06
  
R14Save:
dq 0
R15Save:
dq 0
  
///
GetMoneyPointerAOB1:
  jmp newmem
  return:
  
[DISABLE]

GetMoneyPointerAOB1:
  readmem(GetMoneyPointerAOB1Save,6)

unregistersymbol(GetMoneyPointerAOB1)
unregistersymbol(GetMoneyPointerAOB1Save)

///
dealloc(newmem)"""

