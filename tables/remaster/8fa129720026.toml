[[cheat]]
id = "always-drop-item-choose-which-item-of-monster"
name = "Always Drop Item (Choose Which Item of Monster)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

///
aobscanmodule(AlwaysDropItemAOB1,"GameAssembly.dll",42 0F B6 7C 08 20 66 85 FF 0F 84 D4 01 00 00 42 0F B6 5C 09 20)
registersymbol(AlwaysDropItemAOB1)
alloc(newmem,1024,AlwaysDropItemAOB1)

/// Save Starting ESI
aobscanmodule(AlwaysDropItemAOB2,"GameAssembly.dll",48 8B B0 00 08 00 00 48 85 F6 0F 84 99 04 00 00)
registersymbol(AlwaysDropItemAOB2)
alloc(newmem2,1024,AlwaysDropItemAOB2)

/// Increase Our Saved ESI
aobscanmodule(AlwaysDropItemAOB3,"GameAssembly.dll",FF C6 66 90 44 39 B9 E0 00 00 00 75 0C)
registersymbol(AlwaysDropItemAOB3)
alloc(newmem3,1024,AlwaysDropItemAOB3)

/// Use Our Real ESI
aobscanmodule(AlwaysDropItemAOB4,"GameAssembly.dll",48 63 C6 49 8B 54 C6 20 48 85 D2 0F 84 39 04 00 00)
registersymbol(AlwaysDropItemAOB4)
alloc(newmem4,1024,AlwaysDropItemAOB4)

/// Set Drop Rate to 100
aobscanmodule(AlwaysDropItemAOB5,"GameAssembly.dll",42 0F B6 5C 09 20 33 C9 E8 * * * * 44 8B C0)
registersymbol(AlwaysDropItemAOB5)
alloc(newmem5,1024,AlwaysDropItemAOB5)

/// Use Our Chosen Drop Item
aobscanmodule(AlwaysDropItemAOB6,"GameAssembly.dll",43 8D 04 00 48 63 C8 48 FF C1 41 3B 49 18)
registersymbol(AlwaysDropItemAOB6)
alloc(newmem6,1024,AlwaysDropItemAOB6)

///
label(AlwaysDropItemAOB1Save)
registersymbol(AlwaysDropItemAOB1Save)

///
label(RealESI)
registersymbol(RealESI)
label(AlwaysDropItemAOB2Save)
registersymbol(AlwaysDropItemAOB2Save)

///
label(AlwaysDropItemAOB3Save)
registersymbol(AlwaysDropItemAOB3Save)

///
label(AlwaysDropItemAOB4Save)
registersymbol(AlwaysDropItemAOB4Save)

///
label(AlwaysDropItemAOB5Save)
registersymbol(AlwaysDropItemAOB5Save)

///
label(ChosenItemNum)
registersymbol(ChosenItemNum)
label(AlwaysDropItemAOB6Save)
registersymbol(AlwaysDropItemAOB6Save)

///
newmem:
  mov [R14Save],r14
  mov [R15Save],r15
  cmp byte ptr [rax+r9+20],0
  jne SkipResetTry
  mov r14,RealESI
  mov r14,[r14]
  mov r15,MaxESI
  mov r15,[r15]
  cmp r14d,r15d
  jg FinishLoop
  dec esi
  jmp SkipResetTry
FinishLoop:
  mov esi,r14d
  jmp SkipResetTry
SkipResetTry:
  mov r14,[R14Save]
  mov r15,[R15Save]
AlwaysDropItemAOB1Save:
  readmem(AlwaysDropItemAOB1,6)
  jmp AlwaysDropItemAOB1+06
        
R14Save:
dq 0
R15Save:
dq 0

///
newmem2:
  readmem(AlwaysDropItemAOB2,7)
  test rsi,rsi
  je MyCleanUp1
  mov esi,[rsi+40]
  mov [RealESI],esi
  readmem(AlwaysDropItemAOB2,7)
  mov esi,[rsi+48]
  mov [MaxESI],esi
MyCleanUp1:
AlwaysDropItemAOB2Save:
  readmem(AlwaysDropItemAOB2,7)
  jmp AlwaysDropItemAOB2+07

RealESI:
dq 0
MaxESI:
dq 0

///
newmem3:
  mov [R15Save3],r15
  mov r15,RealESI
  inc [r15]
  mov r15,[R15Save3]
AlwaysDropItemAOB3Save:
  readmem(AlwaysDropItemAOB3,11)
  jmp AlwaysDropItemAOB3+0B
  
R15Save3:
dq 0

///  
newmem4:
  mov rax,RealESI
  mov rax,[rax]
  readmem(AlwaysDropItemAOB4+3,5)
  jmp AlwaysDropItemAOB4+08
  
AlwaysDropItemAOB4Save:
  readmem(AlwaysDropItemAOB4,8)

///
newmem5:
  mov ebx,#100  
  jmp AlwaysDropItemAOB5+06
  
AlwaysDropItemAOB5Save:
  readmem(AlwaysDropItemAOB5,6)

///
newmem6:
  mov r8,ChosenItemNum
  mov r8,[r8]
AlwaysDropItemAOB6Save:
  readmem(AlwaysDropItemAOB6,7)
  jmp AlwaysDropItemAOB6+07
  
ChosenItemNum:
dq 0

/// 
AlwaysDropItemAOB1:
  jmp newmem
  return:

/// 
AlwaysDropItemAOB2:
  jmp newmem2
  return2:

/// 
AlwaysDropItemAOB3:
  jmp newmem3
  return3:

/// 
AlwaysDropItemAOB4:
  jmp newmem4
  return4:

/// 
AlwaysDropItemAOB5:
  jmp newmem5
  return5:

/// 
AlwaysDropItemAOB6:
  jmp newmem6
  return6:
  
[DISABLE]

/// 
AlwaysDropItemAOB1:
  readmem(AlwaysDropItemAOB1Save,6)
  
unregistersymbol(AlwaysDropItemAOB1)
unregistersymbol(AlwaysDropItemAOB1Save)

/// 
AlwaysDropItemAOB2:
  readmem(AlwaysDropItemAOB2Save,7)
  
unregistersymbol(AlwaysDropItemAOB2)
unregistersymbol(AlwaysDropItemAOB2Save)
unregistersymbol(RealESI)

/// 
AlwaysDropItemAOB3:
  readmem(AlwaysDropItemAOB3Save,11)
  
unregistersymbol(AlwaysDropItemAOB3)
unregistersymbol(AlwaysDropItemAOB3Save)

/// 
AlwaysDropItemAOB4:
  readmem(AlwaysDropItemAOB4Save,8)
  
unregistersymbol(AlwaysDropItemAOB4)
unregistersymbol(AlwaysDropItemAOB4Save)

/// 
AlwaysDropItemAOB5:
  readmem(AlwaysDropItemAOB5Save,6)
  
unregistersymbol(AlwaysDropItemAOB5)
unregistersymbol(AlwaysDropItemAOB5Save)

/// 
AlwaysDropItemAOB6:
  readmem(AlwaysDropItemAOB6Save,7)
  
unregistersymbol(AlwaysDropItemAOB6)
unregistersymbol(AlwaysDropItemAOB6Save)
unregistersymbol(ChosenItemNum)
  
///
dealloc(newmem)
dealloc(newmem2)
dealloc(newmem3)
dealloc(newmem4)
dealloc(newmem5)
dealloc(newmem6)"""

