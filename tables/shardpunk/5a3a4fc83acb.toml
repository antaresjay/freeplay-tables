[ENABLE]
aobscan(combat,48 8B 40 ?? 48 3B ?? 0F 84 ?? ?? ?? ?? 48 B8 ?? ?? ?? ?? ?? ?? ?? ?? 48 8B ?? 48 8B)
alloc(newmem,$1000,combat)

label(combatPtr)
label(combatBkp)
label(return)

newmem:
combatBkp:
  readmem(combat,7)
  mov rcx,combatPtr
  mov [rcx],rax
  jmp return

align 10
combatPtr:
  dq 0

combat:
  jmp newmem
  nop 2
return:
registersymbol(combat)
registersymbol(combatBkp)
registersymbol(combatPtr)

[DISABLE]
