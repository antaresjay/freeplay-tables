[[cheat]]
id = "gun-ctrl-numpad-2-shoot-to-populate"
name = "Gun (Ctrl + Numpad 2) {Shoot to populate}"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Burning Dead.exe
// Author            : ndck76
// Executable Version: 2022.3.17.51072
// Game Version      : Build.13316130
// Script Date       : 2024-02-05


[ENABLE]

aobscanregion(ammo,InventoryUI:UpdateAmmo,InventoryUI:UpdateAmmo+100,486396xxxx000048xxxx83xxxx48xxxxxxxx9049BBxxxxxxxxxxxx000041xxxx48xxxxxx48xxxxxx48xxxxxx5DC3) //InventoryUI:UpdateAmmo+33
alloc(newmem,$1000,ammo)
alloc(data,8)
alloc(ammobkp,7)
registersymbol(data)
registersymbol(ammo)
registersymbol(ammobkp)
label(code)
label(return)

ammobkp:
  readmem(ammo,7)

newmem:
  mov [data],rsi

code:
  readmem(ammo,7)
  jmp return

ammo:
  jmp newmem
  nop 2
return:

[DISABLE]

ammo:
  readmem(ammobkp,7)

unregistersymbol(*)
dealloc(*)"""

