[ENABLE]
define(Building,UserData.get_SkillSorting)
alloc(al_Building,$128,Building)
alloc(mem_Building,6)
alloc(Building_Pointer,8)
label(re_Building)
registersymbol(Building mem_Building Building_Pointer)

mem_Building:
  readmem(Building,6)

Building_Pointer:
dq

al_Building:
  mov [Building_Pointer],rcx
  readmem(Building,6)
  jmp re_Building

Building:
  jmp al_Building
  nop
re_Building:

[DISABLE]
Building:
  readmem(mem_Building,6)

