type = "script"
source = """
{
Author\t: Raynald
Date\t: 2023-02-06
Game\t: Broken Universe.exe
Version\t: 2021.3.16.5719
}

[ENABLE]
aobscanregion(Level,IconBuildingComponent.Refresh,IconBuildingComponent.Refresh+3000,8B????488D??????33??E8????????3B??7C??418B)
alloc(al_Level,$128,Level)
alloc(mem_Level,8)
alloc(Level_Pointer,8)
label(re_Level)
registersymbol(Level mem_Level Level_Pointer)

mem_Level:
  readmem(Level,8)

Level_Pointer:
dq

al_Level:
  mov [Level_Pointer],rbx
  readmem(Level,8)
  jmp re_Level

Level:
  jmp al_Level
  nop 3
re_Level:

[DISABLE]
Level:
  readmem(mem_Level,8)

dealloc(*)
unregistersymbol(*)"""

