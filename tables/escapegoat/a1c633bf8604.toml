[[cheat]]
id = "inf-jump-activate-after-1-jump"
name = "Inf. Jump (Activate after 1 jump)"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
{ Game   : EscapeGoat.exe
  Version: 1.0.9.2
  Date   : 2015-05-19
  Author : wcz
}

[ENABLE]

aobscan(jump,FF 8E F4 00 00 00 C7)
alloc(newmem,$1000)

label(code)
label(return)

newmem:

code:
  mov [esi+000000F4],#2
  jmp return

jump:
  jmp code
  nop
return:
registersymbol(jump)

[DISABLE]

jump:
  db FF 8E F4 00 00 00

unregistersymbol(jump)
dealloc(newmem)

