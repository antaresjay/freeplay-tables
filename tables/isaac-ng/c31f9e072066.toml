[[cheat]]
id = "pedestal-script"
name = "Pedestal Script"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ by HenryEx
  for The Binding of Isaac: Afterbirth

  This script allows you to set the item that will be picked up the next time
  you touch a pedestal.
}

[ENABLE]
aobscanmodule(AOB_pedInj,isaac-ng.exe,83 xx 64 0F 85 xx xx xx xx 8B 46 2C 85 C0 0F 84)
alloc(PedScript,256)

// Declaration section
registersymbol(AOB_pedInj)
registersymbol(PedScript)
label(_Code)
label(_ExitPS)
label(_BackPS)

//=========================================
// Hacking Point

AOB_pedInj+9:
 jmp _Code
_BackPS:

//=========================================
// Var Section

PedScript:
 dd 0  // Item ID to pick up

//=========================================
// Code Section
_Code:
 mov eax,[PedScript]
 cmp eax,0
 jz short _ExitPS

 mov [esi+2C],eax
 xor eax,eax
 mov [PedScript],eax

_ExitPS:
 mov eax,[esi+2C]
 test eax,eax
 jmp _BackPS


[DISABLE]
AOB_pedInj+9:
 mov eax,[esi+2C]
 test eax,eax
