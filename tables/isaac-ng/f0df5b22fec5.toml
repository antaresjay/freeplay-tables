[[cheat]]
id = "don-t-use-up-cards-pills"
name = "Don't Use Up Cards/Pills"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here
jmp exit

originalcode:
mov [ebx+00002F94],eax

exit:
jmp returnhere

"isaac-ng.exe"+E9DD5:
jmp newmem
nop
returnhere:


[DISABLE]

"isaac-ng.exe"+E9DD5:
mov [ebx+00002F94],eax

dealloc(newmem)"""

