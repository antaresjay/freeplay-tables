[[cheat]]
id = "infinite-health-one-hit-kill-inside"
name = "Infinite Health [One Hit Kill Inside]"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(gethealth,DragonStarVarnir.exe,48 8B 07 48 8B 5C 24 30 48 8B 74) //NORMAL HEALTH
aobscanmodule(getbosshealth,DragonStarVarnir.exe,48 89 8D E8 00 00 00 84) //PARTS HEALTH
aobscanmodule(getmaxhp,DragonStarVarnir.exe,5F C3 CC CC CC CC 48 8B 41 18 C3) // should be unique
alloc(newmem,$1000,"DragonStarVarnir.exe"+CBD63)
alloc(newmem2,$1000,"DragonStarVarnir.exe"+2A1BBD)
alloc(newmem5,$1000,"DragonStarVarnir.exe"+12B4C0)
label(code)
label(return)
label(code2)
label(return2)
label(code5)
label(return5)
label(checkonehit)
registersymbol(onehitkill)

newmem:
  cmp [rdi+3C],00000000
  je checkonehit
  mov [rdi],#90000

code:
  mov rax,[rdi]
  mov rbx,[rsp+30]
  jmp return

checkonehit:
  cmp [onehitkill],1
  jne code
  mov [rdi],#0
  jmp code

onehitkill:
  dd 0

gethealth:
  jmp newmem
  nop 3
return:
registersymbol(gethealth)

newmem2:
  cmp [onehitkill],1
  jne code2
  mov [rbp+000000E8],#0
  jmp return2

code2:
  mov [rbp+000000E8],rcx
  jmp return2

getbosshealth:
  jmp newmem2
  nop 2
return2:
registersymbol(getbosshealth)

newmem5:
  cmp [rcx+3C],00000000
  je code5
  mov [rcx+18],#90000

code5:
  mov rax,[rcx+18]
  ret 
  jmp return5

getmaxhp+06:
  jmp newmem5
return5:
registersymbol(getmaxhp)

[DISABLE]
gethealth:
  db 48 8B 07 48 8B 5C 24 30

getbosshealth:
  db 48 89 8D E8 00 00 00

getmaxhp+06:
  db 48 8B 41 18 C3

unregistersymbol(onehitkill)
unregistersymbol(gethealth)
unregistersymbol(getbosshealth)
unregistersymbol(getmaxhp)
dealloc(newmem)
dealloc(newmem2)
dealloc(newmem5)"""

