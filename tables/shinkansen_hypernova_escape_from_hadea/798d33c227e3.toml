[[cheat]]
id = "structurecontroller-base-address-scan-initialization-activate-this-first"
name = "StructureController Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(StructureController_basepointer)
registersymbol(StructureController_update_enable)
registersymbol(StructureController_set_enable)
registersymbol(StructureController_invulnerableset_enable)
registersymbol(StructureController_hpset_enable)
registersymbol(StructureController_usableset_enable)
registersymbol(StructureController_collectableset_enable)
registersymbol(StructureController_populationset_enable)

alloc(StructureController_basepointer, 8)
alloc(StructureController_update_enable, 4)
alloc(StructureController_set_enable, 4)
alloc(StructureController_invulnerableset_enable, 4)
alloc(StructureController_hpset_enable, 4)
alloc(StructureController_usableset_enable, 4)
alloc(StructureController_collectableset_enable, 4)
alloc(StructureController_populationset_enable, 4)


[DISABLE]
unregistersymbol(StructureController_basepointer)
unregistersymbol(StructureController_update_enable)
unregistersymbol(StructureController_set_enable)
unregistersymbol(StructureController_invulnerableset_enable)
unregistersymbol(StructureController_hpset_enable)
unregistersymbol(StructureController_usableset_enable)
unregistersymbol(StructureController_collectableset_enable)
unregistersymbol(StructureController_populationset_enable)

dealloc(StructureController_basepointer)
dealloc(StructureController_update_enable)
dealloc(StructureController_set_enable)
dealloc(StructureController_invulnerableset_enable)
dealloc(StructureController_hpset_enable)
dealloc(StructureController_usableset_enable)
dealloc(StructureController_collectableset_enable)
dealloc(StructureController_populationset_enable)"""

[[cheat]]
id = "structurecontroller-base-address-scan-to-activate-mouseover-structure-to-update-mouseover-structure"
name = "StructureController Base Address Scan (To Activate: Mouseover Structure, To Update: Mouseover Structure)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(StructureController_savedAOB)
label(StructureController_returnhere)
label(StructureController_originalcode)
label(StructureController_exit)

label(StructureController_update_exit)
label(StructureController_set_exit)
label(StructureController_invulnerableset_exit)
label(StructureController_hpset_exit)
label(StructureController_usableset_exit)
label(StructureController_collectableset_exit)
label(StructureController_populationset_exit)

registersymbol(StructureController_savedAOB)

//0E9F3355 - 48 83 EC 08           - sub rsp,08
//0E9F3359 - 48 8B F1              - mov rsi,rcx
// StructureController:get_radius+c
//0E9F335C - 48 8B 8E 98010000     - mov rcx,[rsi+00000198]
//0E9F3363 - 33 D2                 - xor edx,edx
//0E9F3365 - 48 83 EC 20           - sub rsp,20
//0E9F3369 - 49 BB 5064520500000000 - mov r11,0000000005526450 : [EC8B4855]
//0E9F3373 - 41 FF D3              - call r11d
//0E9F3376 - 48 83 C4 20           - add rsp,20
//0E9F337A - 85 C0                 - test eax,eax
//0E9F337C - 0F84 30000000         - je 0E9F33B2
//0E9F3382 - 48 8B 86 98010000     - mov rax,[rsi+00000198]
//0E9F3389 - 48 8B C8              - mov rcx,rax
//0E9F338C - 48 83 EC 20           - sub rsp,20
//0E9F3390 - 83 38 00              - cmp dword ptr [rax],00
//0E9F3393 - 49 BB 40349F0E00000000 - mov r11,000000000E9F3440 : [EC8B4855]
aobscan(StructureController_searchedAOB, 48 8B 8E 98 01 00 00 33 D2 48 83 EC 20 * * * * * * * * * * 41 FF D3 48 83 C4 20 85 C0 * * * * * * 48 8B 86 98 01 00 00 48 8B C8 48 83 EC 20)

alloc(StructureController_newmem, 2048, StructureController_searchedAOB)
alloc(StructureController_temp1, 8, StructureController_searchedAOB)
alloc(StructureController_temp2, 8, StructureController_searchedAOB)
alloc(StructureController_temp3, 8, StructureController_searchedAOB)
alloc(StructureController_temp4, 8, StructureController_searchedAOB)
alloc(StructureController_temp5, 8, StructureController_searchedAOB)


StructureController_newmem:
mov [StructureController_temp1], rax
mov [StructureController_temp2], rbx
mov [StructureController_temp3], rcx
mov [StructureController_temp4], rdx

cmp dword ptr [StructureController_update_enable], #0
je StructureController_update_exit
mov [StructureController_basepointer], rsi
StructureController_update_exit:

cmp dword ptr [StructureController_set_enable], #0
je StructureController_set_exit
StructureController_set_exit:

cmp dword ptr [StructureController_invulnerableset_enable], #0
je StructureController_invulnerableset_exit
mov rbx, [rsi+1a8]
test rbx, rbx
je StructureController_invulnerableset_exit
mov byte ptr [rbx+78], #1
StructureController_invulnerableset_exit:

cmp dword ptr [StructureController_hpset_enable], #0
je StructureController_hpset_exit
mov rbx, [rsi+1a8]
test rbx, rbx
je StructureController_hpset_exit
mov byte ptr [rbx+74], (float)9999999
StructureController_hpset_exit:

cmp dword ptr [StructureController_usableset_enable], #0
je StructureController_usableset_exit
mov rbx, [rsi+128]
test rbx, rbx
je StructureController_usableset_exit
mov rbx, [rbx+18]
test rbx, rbx
je StructureController_usableset_exit
mov [rbx+60], (float)999999
mov [rbx+64], (float)999999
mov [rbx+68], (float)999999
StructureController_usableset_exit:

cmp dword ptr [StructureController_collectableset_enable], #0
je StructureController_collectableset_exit
mov rbx, [rsi+128]
test rbx, rbx
je StructureController_collectableset_exit
mov rbx, [rbx+18]
test rbx, rbx
je StructureController_collectableset_exit
mov [rbx+78], (float)999999
mov [rbx+7c], (float)999999
mov [rbx+80], (float)999999
mov [rbx+84], (float)999999
StructureController_collectableset_exit:

cmp dword ptr [StructureController_populationset_enable], #0
je StructureController_populationset_exit
mov rbx, [rsi+128]
test rbx, rbx
je StructureController_populationset_exit
mov rbx, [rbx+18]
test rbx, rbx
je StructureController_populationset_exit
mov [rbx+9c], #999999
StructureController_populationset_exit:

mov rax, [StructureController_temp1]
mov rbx, [StructureController_temp2]
mov rcx, [StructureController_temp3]
mov rdx, [StructureController_temp4]


StructureController_originalcode:
db 48 8B 8E 98 01 00 00
//mov rcx,[rsi+00000198]


StructureController_exit:
jmp StructureController_returnhere


StructureController_searchedAOB:
StructureController_savedAOB:
jmp StructureController_newmem
nop
nop
StructureController_returnhere:


[DISABLE]
StructureController_savedAOB:
db 48 8B 8E 98 01 00 00
//mov rcx,[rsi+00000198]

unregistersymbol(StructureController_savedAOB)

dealloc(StructureController_newmem)
dealloc(StructureController_temp1)
dealloc(StructureController_temp2)
dealloc(StructureController_temp3)
dealloc(StructureController_temp4)
dealloc(StructureController_temp5)"""

