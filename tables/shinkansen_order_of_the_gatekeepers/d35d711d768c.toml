[[cheat]]
id = "player-base-address-scan-initialization-activate-this-first-to-activate-kill-enemy"
name = "Player Base Address Scan Initialization (Activate This First, To Activate: Kill Enemy)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Player_basepointer)
registersymbol(Player_update_enable)
registersymbol(Player_goldset_enable)
registersymbol(Player_factionset_enable)
registersymbol(Player_towersset_enable)

//1403A069 - DEC9                  - fmulp st(1),st(0)
//1403A06B - D9 5D 0C              - fstp dword ptr [ebp+0C]
// Player:AddGold+3e
//1403A06E - D9 47 4C              - fld dword ptr [edi+4C]
//1403A071 - D9 45 0C              - fld dword ptr [ebp+0C]
//1403A074 - DEC1                  - faddp
//1403A076 - 83 EC 08              - sub esp,08
//1403A079 - 83 EC 04              - sub esp,04
aobscan(Player_initialization_searchedAOB, D9 47 4C D9 45 0C DE C1)

alloc(Player_basepointer, 4, Player_initialization_searchedAOB)
alloc(Player_update_enable, 4, Player_initialization_searchedAOB)
alloc(Player_goldset_enable, 4, Player_initialization_searchedAOB)
alloc(Player_factionset_enable, 4, Player_initialization_searchedAOB)
alloc(Player_towersset_enable, 4, Player_initialization_searchedAOB)


[DISABLE]
unregistersymbol(Player_basepointer)
unregistersymbol(Player_update_enable)
unregistersymbol(Player_goldset_enable)
unregistersymbol(Player_factionset_enable)
unregistersymbol(Player_towersset_enable)

dealloc(Player_basepointer)
dealloc(Player_update_enable)
dealloc(Player_goldset_enable)
dealloc(Player_factionset_enable)
dealloc(Player_towersset_enable)"""

[[cheat]]
id = "player-base-address-scan-to-activate-kill-enemy-to-update-kill-enemy"
name = "Player Base Address Scan (To Activate: Kill Enemy, To Update: Kill Enemy)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Player_savedAOB)
label(Player_returnhere)
label(Player_originalcode)
label(Player_exit)

label(Player_update_exit)
label(Player_goldset_exit)
label(Player_factionset_exit)
label(Player_towersset_loop1_exit)
label(Player_towersset_loop1_entry)
label(Player_towersset_loop1_continue)

registersymbol(Player_originalcode)
registersymbol(Player_savedAOB)

//1403A069 - DEC9                  - fmulp st(1),st(0)
//1403A06B - D9 5D 0C              - fstp dword ptr [ebp+0C]
// Player:AddGold+3e
//1403A06E - D9 47 4C              - fld dword ptr [edi+4C]
//1403A071 - D9 45 0C              - fld dword ptr [ebp+0C]
//1403A074 - DEC1                  - faddp
//1403A076 - 83 EC 08              - sub esp,08
//1403A079 - 83 EC 04              - sub esp,04
aobscan(Player_searchedAOB, D9 47 4C D9 45 0C DE C1)

alloc(Player_newmem, 2048, Player_searchedAOB)
alloc(Player_temp1, 4, Player_searchedAOB)
alloc(Player_temp2, 4, Player_searchedAOB)
alloc(Player_temp3, 4, Player_searchedAOB)
alloc(Player_temp4, 4, Player_searchedAOB)
alloc(Player_temp5, 4, Player_searchedAOB)
alloc(Player_loop1_index, 4, Player_searchedAOB)
alloc(Player_loop1_base, 4, Player_searchedAOB)
alloc(Player_loop1_max, 4, Player_searchedAOB)


Player_newmem:
mov [Player_temp1], eax
mov [Player_temp2], ebx
mov [Player_temp3], ecx
mov [Player_temp4], edx

cmp dword ptr [Player_update_enable], #0
je Player_update_exit
mov [Player_basepointer], edi
Player_update_exit:

cmp dword ptr [Player_goldset_enable], #0
je Player_goldset_exit
mov [edi+4c], (float)9999990
Player_goldset_exit:

cmp dword ptr [Player_factionset_enable], #0
je Player_factionset_exit
mov [edi+50], #9999990
Player_factionset_exit:

cmp dword ptr [Player_towersset_enable], #0
je Player_towersset_loop1_exit
mov [Player_loop1_index], #0
mov ebx, [edi+28]
test ebx, ebx
je Player_towersset_loop1_exit
mov ebx, [ebx+8]
test ebx, ebx
je Player_towersset_loop1_exit
mov [Player_loop1_base], ebx
mov ecx, [ebx+c]
test ecx, ecx
je Player_towersset_loop1_exit
mov [Player_loop1_max], ecx

Player_towersset_loop1_entry:
mov ebx, [Player_loop1_base]
mov edx, [Player_loop1_index]
mov eax, [ebx+edx*4+10]
test eax, eax
je Player_towersset_loop1_continue
//mov [eax+d0], (float)9999
//mov [eax+d4], (float)9999
//mov [eax+d8], (float)9999
mov [eax+f4], (float)9999
mov [eax+f8], (float)9999
mov [eax+10c], (float)9999
mov [eax+114], (float)9999
mov [eax+118], (float)9999
mov [eax+124], (float)9999
fld [eax+130]
fstp [eax+12c]
mov [eax+134], (float)9999
mov [eax+144], (float)9999
mov [eax+148], (float)9999
//mov [eax+14c], (float)9999
mov [eax+150], (float)9999
mov [eax+154], (float)9999
//mov [eax+158], (float)9999
//mov [eax+168], (float)9999
//mov [eax+16c], (float)9999
//mov [eax+170], (float)9999
mov [eax+17c], (float)99

Player_towersset_loop1_continue:
mov edx, [Player_loop1_index]
inc edx
mov [Player_loop1_index], edx
mov ecx, [Player_loop1_max]
cmp ecx, edx
je Player_towersset_loop1_exit
jmp Player_towersset_loop1_entry
Player_towersset_loop1_exit:

mov eax, [Player_temp1]
mov ebx, [Player_temp2]
mov ecx, [Player_temp3]
mov edx, [Player_temp4]


Player_originalcode:
readmem(Player_searchedAOB, 6)


Player_exit:
jmp Player_returnhere


Player_searchedAOB:
Player_savedAOB:
jmp Player_newmem
nop
Player_returnhere:


[DISABLE]
Player_savedAOB:
readmem(Player_originalcode, 6)

unregistersymbol(Player_originalcode)
unregistersymbol(Player_savedAOB)

dealloc(Player_newmem)
dealloc(Player_temp1)
dealloc(Player_temp2)
dealloc(Player_temp3)
dealloc(Player_temp4)
dealloc(Player_temp5)
dealloc(Player_loop1_index)
dealloc(Player_loop1_base)
dealloc(Player_loop1_max)"""

