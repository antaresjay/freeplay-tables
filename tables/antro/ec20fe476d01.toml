source = """
// Game Executable   : Antro.exe
// Author            : ndck76
// Executable Version: 2021.3.38.12197
// Game Version      : Build.19009001
// Script Date       : 2025-06-29


[ENABLE]

aobscanregion(character,MoreMountains.CorgiEngine.CharacterHorizontalMovement:UpdateAnimator,MoreMountains.CorgiEngine.CharacterHorizontalMovement:UpdateAnimator+600,488Bxxxx4Cxxxx41xxxxxx4CxxxxxxF2xxxxxxF2xxxxxx49BBxxxxxxxxxxxx000041xxxx48xxxxxx48xxxxxx5DC3) //MoreMountains.CorgiEngine.CharacterHorizontalMovement:UpdateAnimator+457
alloc(newmem,$1000,character)
alloc(data,8)
alloc(characterbkp,7)
registersymbol(data)
registersymbol(character)
registersymbol(characterbkp)
label(code)
label(return)

characterbkp:
  readmem(character,7)

newmem:
  mov [data],rsi

code:
  readmem(character,7)
  jmp return

character:
  jmp newmem
  nop 2
return:

[DISABLE]

character:
  readmem(characterbkp,7)

unregistersymbol(*)
dealloc(*)"""

