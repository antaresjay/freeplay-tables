[[cheat]]
id = "no-reload"
name = "No Reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanregion(NoReload,UserItemData:get_Ammo,UserItemData:get_Ammo+2d,48 63 46 34 48 8B 34 24)
alloc(newmem,$1000,NoReload)

label(code)
label(return)

newmem:
mov [rsi+34],#99
code:
  movsxd  rax,dword ptr [rsi+34]
  mov rsi,[rsp]
  jmp return

NoReload:
  jmp newmem
  nop 3
return:
registersymbol(NoReload)

[DISABLE]

NoReload:
  db 48 63 46 34 48 8B 34 24

unregistersymbol(NoReload)
dealloc(newmem)"""
