newmem: //this is allocated memory, you have read,write,execute access
//place your code here
{
160 lvl
174 Hp
178 Ap
17c Sp
180 full hp
}
//cmp [esi+0000078],1
//jne originalcode
mov [player],esi
originalcode:
mov ecx,[esi+00000178]

exit:
jmp returnhere
player:
dd 0
active://"AgarestZero.exe"+12B416:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(newmem)
active://
db 8B 8E 78 01 00 00
unregistersymbol(player)
unregistersymbol(active)"""

