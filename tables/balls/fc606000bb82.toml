source = """
{ Game   : Balls.exe
  Date   : 2025-10-15
  Author : Sianz
}

[ENABLE]

aobscanregion(player,GameMgr.MyUpdate,GameMgr.MyUpdate+900,F3 0F 10 B3 ?? 00 00 00 33) // should be unique
alloc(newmem,$1000,player)
alloc(stats,8)
label(code)
label(return)

newmem:
  cmp dword ptr [rbx+00000088],0
  je skip
  test rbx,rbx
  je skip
  mov [stats],rbx
  skip:
code:
  movss xmm6,[rbx+00000088]
  jmp return

player:
  jmp newmem
  nop 3
return:
registersymbol(player stats)

[DISABLE]

player:
  db F3 0F 10 B3 88 00 00 00

unregistersymbol(*)
dealloc(*)"""
