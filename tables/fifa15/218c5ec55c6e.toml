[[cheat]]
id = "virtual-player-only"
name = "VIRTUAL PLAYER ONLY"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(MYVPv1_8,fifa15.exe,F3 0F 10 BB 94 00 00 00)
alloc(mycode,$1000,"fifa15.exe"+40087C3)

alloc(VP_STMN_ON,1)
alloc(VP_STMN_OFF,1)
alloc(VP_INJ_ON,1)
alloc(VP_INJ_OFF,1)

label(VP_STMN_ACTIVE)
label(VP_STMN_NOT_ACTIVE)
label(VP_INJ)
label(VP_NOT_INJ)


label(return)
label(originalcode)
label(exit)

VP_STMN_ON:
  db 0
VP_STMN_OFF:
  db 0
VP_INJ_ON:
  db 0
VP_INJ_OFF:
  db 0

mycode:
  cmp byte ptr [rbx+259],01 //Virtual PLayer
  jne originalcode
VP_STMN_ACTIVE:
  cmp byte ptr [VP_STMN_ON],1
  jne VP_STMN_NOT_ACTIVE
  mov [rbx+00000094],00000000
  mov [rbx+00000098],00000000
  movss xmm7,[rbx+00000094]
  jmp return
VP_STMN_NOT_ACTIVE:
  cmp byte ptr [VP_STMN_OFF],1
  jne VP_NOT_INJ
  mov [rbx+00000094],3F800000
  mov [rbx+00000098],3F800000
  movss xmm7,[rbx+00000094]
  jmp return
VP_NOT_INJ:
  cmp byte ptr [VP_INJ_OFF],1
  jne VP_INJ
  mov [rbx+A4],00000000 //injuries
  movss xmm7,[rbx+00000094]
  jmp return
VP_INJ:
  cmp byte ptr [VP_INJ_ON],1
  jne originalcode
  mov [rbx+A4],00000002 //injuries
  movss xmm7,[rbx+00000094]
  jmp return

originalcode:
movss xmm7,[rbx+00000094]

exit:
jmp return

//"fifa15.exe"+40087C3:
MYVPv1_8:
jmp mycode
nop
nop
nop
return:
registersymbol(MYVPv1_8)
registersymbol(VP_STMN_ON)
registersymbol(VP_STMN_OFF)
registersymbol(VP_INJ_ON)
registersymbol(VP_INJ_OFF)


 
 
[DISABLE]

dealloc(mycode)
//"fifa15.exe"+40087C3:
//movss xmm7,[rbx+00000094]
MYVPv1_8:
  db F3 0F 10 BB 94 00 00 00

dealloc(VP_STMN_ON)
dealloc(VP_STMN_OFF)
dealloc(VP_INJ_ON)
dealloc(VP_INJ_OFF)
unregistersymbol(MYVPv1_8)
unregistersymbol(VP_STMN_ON)
unregistersymbol(VP_STMN_OFF)
unregistersymbol(VP_INJ_ON)
unregistersymbol(VP_INJ_OFF)"""

