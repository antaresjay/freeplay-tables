[[cheat]]
id = "all-team-stamina-sprint-injuries"
name = "ALL TEAM - STAMINA / SPRINT / INJURIES"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(STAMINAv1_8,fifa15.exe,F3 0F 11 BB 94 00 00 00 48) // should be unique
alloc(newmem,$1000,"fifa15.exe"+40087E3)
alloc(nevertiredplayer1,1)
alloc(nevertiredplayer2,1)
alloc(tiredplayer1,1)
alloc(tiredplayer2,1)
alloc(NOinjuriesplayer1,1)
alloc(NOinjuriesplayer2,1)
alloc(injuriesplayer1,1)
alloc(injuriesplayer2,1)

label(code1)
label(code1a)
label(code1b)
label(code1c)
label(code2)
label(code2a)
label(code2b)
label(code2c)
label(original)
label(return)

nevertiredplayer1:
  db 0
nevertiredplayer2:
  db 0
tiredplayer1:
  db 0
tiredplayer2:
  db 0

NOinjuriesplayer1:
  db 0
NOinjuriesplayer2:
  db 0
injuriesplayer1:
  db 0
injuriesplayer2:
  db 0

newmem:
  cmp byte ptr [rbx+7c],00 //00 is 1player
  je code1
  cmp byte ptr [rbx+7c],01 //01 is 2player
  je code2

code1:
  cmp byte ptr [nevertiredplayer1],1
  jne code1a
  mov [rbx+00000094],00000000
  mov [rbx+00000098],00000000
  jmp return
code1a:
  cmp byte ptr [tiredplayer1],1
  jne code1b
  mov [rbx+00000094],3F800000
  mov [rbx+00000098],3F800000
  jmp return

code1b:
  cmp byte ptr [NOinjuriesplayer1],1
  jne code1c
  mov [rbx+A4],00000000 //injuries
  movss [rbx+00000094],xmm7
  jmp return
code1c:
  cmp byte ptr [injuriesplayer1],1
  jne original
  mov [rbx+A4],00000002 //injuries
  movss [rbx+00000094],xmm7
  jmp return


code2:
  cmp byte ptr [nevertiredplayer2],1
  jne code2a
  mov [rbx+00000094],00000000
  mov [rbx+00000098],00000000
  jmp return
code2a:
  cmp byte ptr [tiredplayer2],1
  jne code2b
  mov [rbx+00000094],3F800000
  mov [rbx+00000098],3F800000
  jmp return

code2b:
  cmp byte ptr [NOinjuriesplayer2],1
  jne code2c
  mov [rbx+A4],00000000 //injuries
  movss [rbx+00000094],xmm7
  jmp return
code2c:
  cmp byte ptr [injuriesplayer2],1
  jne original
  mov [rbx+A4],00000002 //injuries
  movss [rbx+00000094],xmm7
  jmp return

original:
  movss [rbx+00000094],xmm7
  jmp return

STAMINAv1_8:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(STAMINAv1_8)
registersymbol(nevertiredplayer1)
registersymbol(nevertiredplayer2)
registersymbol(tiredplayer1)
registersymbol(tiredplayer2)
registersymbol(NOinjuriesplayer1)
registersymbol(NOinjuriesplayer2)
registersymbol(injuriesplayer1)
registersymbol(injuriesplayer2)
[DISABLE]

STAMINAv1_8:
  db F3 0F 11 BB 94 00 00 00

unregistersymbol(STAMINAv1_8)
dealloc(newmem)
dealloc(nevertiredplayer1)
dealloc(nevertiredplayer2)
dealloc(tiredplayer1)
dealloc(tiredplayer2)
dealloc(NOinjuriesplayer1)
dealloc(NOinjuriesplayer2)
dealloc(injuriesplayer1)
dealloc(injuriesplayer2)
unregistersymbol(nevertiredplayer1)
unregistersymbol(nevertiredplayer2)
unregistersymbol(tiredplayer1)
unregistersymbol(tiredplayer2)
unregistersymbol(NOinjuriesplayer1)
unregistersymbol(NOinjuriesplayer2)
unregistersymbol(injuriesplayer1)
unregistersymbol(injuriesplayer2)"""

