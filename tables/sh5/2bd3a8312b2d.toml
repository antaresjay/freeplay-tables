type = "script"
source = """
[ENABLE]
alloc(newmem,2048)
label(returnhere)

aobscanmodule(battery,SHSim.act,DD 86 90 04 00 00 D9 C1 D9 C9 DF E9 DD D8 9F F6 C4 44 7B 09 F3 0F 10 7B 08)
