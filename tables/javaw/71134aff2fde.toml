[[cheat]]
id = "get-playerstats-open-treasury"
name = "-> Get PlayerStats (open Treasury)"
category = "player"
description = ""
hint = ""
type = "script"
source = '''
//Target:  Age of History 3
//Author:  Sintrix.net
//Credit to METHOS for custom Template LUA

[ENABLE]

////////////////////////  getpstats  \\\\\\\\\\\\\\\\\\\\\\\\

aobscan(address,C5 FA 10 84 24 A0 00 00 00 C5 FA 10 48 34 C5 F8 2E C1)
alloc(newmem,1024)
alloc(obytes_getpstats, 18)
label(return originalcode)

registersymbol(obytes_getpstats pstats)

obytes_getpstats:
readmem(address, 18)

newmem:

originalcode:
 mov [pstats],rax
 vmovss xmm0,[rsp+000000A0]
 vmovss xmm1,[rax+34]
 vucomiss xmm0,xmm1
 jmp return

pstats:
dd #0

address:
 jmp newmem
 db 90 90 90 90 90 90 90 90 90 90 90 90 90
 return:


[DISABLE]

address:
readmem(obytes_getpstats, 18)

dealloc(*)
unregistersymbol(*)'''

