[[cheat]]
id = "initialization-reserve"
name = "Initialization(Reserve)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscan(findmoney,48 83 EC 30 8B 82 B8 00 00 00 48 C1 E0 03 48 8B 70 10)
registersymbol(findmoney)

alloc(newmem,2048,findmoney+e) 
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here

originalcode:
