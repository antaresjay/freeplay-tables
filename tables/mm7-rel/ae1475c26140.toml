[[cheat]]
id = "infinite-spell-points-all-characters"
name = "Infinite Spell Points (All Characters)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(Spell,MM7-Rel.exe,89 81 40 19 00 00 33) // should be unique
alloc(newmem,$100)
label(code)
label(return)

newmem:

code:
  mov eax,#9999
  mov [ecx+00001940],eax
  jmp return

Spell:
  jmp newmem
  nop
return:
registersymbol(Spell)

[DISABLE]
Spell:
  db 89 81 40 19 00 00

unregistersymbol(Spell)
dealloc(newmem)"""

