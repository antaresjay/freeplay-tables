type = "script"
source = """
{ Game   : OddRealm.exe
  Version: 
  Date   : 2022-02-01
  Author : Reny

  This script does blah blah blah
}

[ENABLE]

define(attradd,AttributeBase.AddBase + 00) // should be unique
alloc(attrhook,$1000)
alloc(ptrData,8)

//-- Code labels---

label(OriginalCode)

label(CheckType)
label(chT01)

label(WriteXP)

label(return)

//-- Flags---

label(iEnableHXP)
registersymbol(iEnableHXP)

attrhook:

//=========================================
// Variables
//=========================================
iEnableHXP:
 dd 0


ptrData:
 dq 0

//=========================================
// Functions
//=========================================

CheckType:
  push rdi
  mov rdi,[rcx+48]
  mov rdi,[rdi+38]
  mov [ptrData], rdi

  cmp dword ptr [iEnableHXP],0      // XP
  je chT01                          // Jump if feature is disabled
  cmp [ptrData], 05
  je WriteXP

  chT01:
  jmp OriginalCode

WriteXP:
  mov rdx, (int)200000

OriginalCode:
  pop rdi
  mov r11,rsp
  mov [r11+08],rbx
  mov [r11+10],rbp
  mov [r11+18],rsi
  push rdi
  jmp return

attradd:
  jmp CheckType
  nop 2
return:
registersymbol(attradd)

[DISABLE]

attradd:
  db 4C 8B DC 49 89 5B 08 49 89 6B 10 49 89 73 18 57

unregistersymbol(attradd)
dealloc(newmem)

