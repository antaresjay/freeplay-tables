[[cheat]]
id = "player-pawn-ctrl-numpad-1-activate-during-game-play"
name = "Player Pawn (Ctrl + Numpad 1) {Activate during game play}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : TheLastCitadel-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 4.27.2.0
// Game Version      : v1.0.0.4.3
// Script Date       : 2026-02-26


[ENABLE]

aobscanmodule(master,TheLastCitadel-Win64-Shipping.exe,488Bxx410Fxxxx0F29xxxxxx488Bxx0F29xxxxxx488Bxx440F) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,7)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,7)

newmem:
  mov [data],rcx

code:
  readmem(master,7)
  jmp return

master:
  jmp newmem
  nop 2
return:

[DISABLE]

master:
  readmem(masterbkp,7)

unregistersymbol(*)
dealloc(*)"""

