[[cheat]]
id = "get-charactar-base-address"
name = "Get charactar base address"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[enable]
alloc(newmem,128)
alloc(_base, 128)
registersymbol(_base)
label(returnhere)
label(originalcode)
label(exit)

newmem:
originalcode:
mov [esi+00000268],ecx

// Get address :)
mov [_base], esi

exit:
jmp returnhere

"Monaco.exe"+8E216:
jmp newmem
nop
returnhere:

[disable]
dealloc(newmem)
dealloc(_base)
unregistersymbol(_base)
"Monaco.exe"+8E216:
mov [esi+00000268],ecx"""

