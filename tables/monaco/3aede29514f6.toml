[[cheat]]
id = "insta-action"
name = "Insta Action"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{
00EBDD69 - 0F2E C8  - ucomiss xmm1,xmm0
00EBDD6C - F3 0F10 44 24 2C  - movss xmm0,[esp+2C]
00EBDD72 - F3 0F11 86 E4000000  - movss [esi+000000E4],xmm0 <<
00EBDD7A - 9F - lahf
00EBDD7B - F6 C4 44 - test ah,44
}
[enable]
alloc(newmem,128)
label(returnhere)
label(originalcode)
label(exit)

newmem:
// xmm0 = 1
push eax
mov eax, (float)1
movd xmm0,eax
pop eax

originalcode:
movss [esi+000000E4],xmm0

exit:
jmp returnhere

"Monaco.exe"+CDD72:
jmp newmem
nop
nop
nop
returnhere:

[disable]
dealloc(newmem)
"Monaco.exe"+CDD72:
movss [esi+000000E4],xmm0"""

