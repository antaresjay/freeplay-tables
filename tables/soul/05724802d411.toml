[[cheat]]
id = "combo-meter-controller-ctrl-numpad-3"
name = "Combo Meter Controller (Ctrl + Numpad 3)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Lone Soul.exe
// Author            : ndck76
// Executable Version: 2022.3.14.62174
// Game Version      : v1.0.0D
// Script Date       : 2026-07-20


[ENABLE]

aobscanregion(level,ComboMeterController:Update,ComboMeterController:Update+500,4863xxxx85xx0Fxxxxxxxxxx48B8xxxxxxxxxxxx000048xxxx48xxxx83xxxx48xxxxxx48xxxx83xxxx48xxxxxx) //ComboMeterController:Update+1bd
alloc(newmem,$1000,level)
alloc(data3,8)
alloc(levelbkp,6)
registersymbol(data3)
registersymbol(level)
registersymbol(levelbkp)
label(code)
label(return)

levelbkp:
  readmem(level,6)

newmem:
  mov [data3],rsi

code:
  readmem(level,6)
  jmp return

level:
  jmp newmem
  nop
return:

[DISABLE]

level:
  readmem(levelbkp,6)

unregistersymbol(*)
dealloc(*)"""

