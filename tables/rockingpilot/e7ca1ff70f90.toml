[[cheat]]
id = "get-player-base-address-activate-enter-battle"
name = "Get Player Base Address [Activate: Enter Battle]"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : RockingPilot.exe
  Version: 
  Date   : 2017-05-18
  Author : ColonelRVH

  This script does blah blah blah
}

[ENABLE]

aobscan(Get_Combo_AOB,D9 80 A0 03 00 00 8B 80) // should be unique
alloc(newmem,$1000)

label(code)
label(return)
label(Cmp_MaxCombo)
label(Cmp_MaxLives)
label(Cmp_UnlOverdriveBar)

label(MaxCombo)
label(MaxLives)
label(UnlOverdriveBar)

alloc(Player_Base,4)
alloc(ComboMax_Flag,4)
alloc(LivesUnl_Flag,4)
alloc(OverdriveBarUnl_Flag,4)
//alloc(AmmosUnl_Flag,4)
registersymbol(Player_Base)
registersymbol(ComboMax_Flag)
registersymbol(LivesUnl_Flag)
registersymbol(OverdriveBarUnl_Flag)
//registersymbol(AmmosUnl_Flag)

ComboMax_Flag:
dd 0
LivesUnl_Flag:
dd 0
OverdriveBarUnl_Flag:
dd 0

newmem:
Cmp_MaxCombo:
  cmp dword ptr [ComboMax_Flag],1
  je MaxCombo
Cmp_MaxLives:
  cmp dword ptr [LivesUnl_Flag],1
  je MaxLives
Cmp_UnlOverdriveBar:
  cmp dword ptr [OverdriveBarUnl_Flag],1
  je UnlOverdriveBar
code:
  mov [Player_Base],eax
  fld dword ptr [eax+000003A0]
  jmp return
MaxCombo:
  push ebx
  mov ebx,[eax+000003A8]
  cvtsi2ss xmm5,ebx
  movss [eax+000003A0],xmm5
  pop ebx
  jmp Cmp_MaxLives
MaxLives:
  push ebx
  mov ebx,[eax+000002A4]
  mov [eax+000002A8],ebx
  pop ebx
  jmp Cmp_UnlOverdriveBar
UnlOverdriveBar:
  mov [eax+000003DC],(float)40
  jmp code

Get_Combo_AOB:
  jmp newmem
  nop
return:
registersymbol(Get_Combo_AOB)

[DISABLE]

Get_Combo_AOB:
  db D9 80 A0 03 00 00

unregistersymbol(Get_Combo_AOB)
dealloc(newmem)
dealloc(Player_Base)
dealloc(ComboMax_Flag)
dealloc(LivesUnl_Flag)
dealloc(OverdriveBarUnl_Flag)
//dealloc(AmmosUnl_Flag)
unregistersymbol(Player_Base)
unregistersymbol(ComboMax_Flag)
unregistersymbol(LivesUnl_Flag)
unregistersymbol(OverdriveBarUnl_Flag)
//unregistersymbol(AmmosUnl_Flag)
{
// ORIGINAL CODE - INJECTION POINT: 200F1FF6

""+200F1FE0: C3                    -  ret 
""+200F1FE1: 00 00                 -  add [eax],al
""+200F1FE3: 00 00                 -  add [eax],al
""+200F1FE5: 00 00                 -  add [eax],al
""+200F1FE7: 00 55 8B              -  add [ebp-75],dl
""+200F1FEA: EC                    -  in al,dx
""+200F1FEB: 83 EC 18              -  sub esp,18
""+200F1FEE: D9 EE                 -  fldz 
""+200F1FF0: D9 5D F8              -  fstp dword ptr [ebp-08]
""+200F1FF3: 8B 45 08              -  mov eax,[ebp+08]
// ---------- INJECTING HERE ----------
""+200F1FF6: D9 80 A0 03 00 00     -  fld dword ptr [eax+000003A0]
// ---------- DONE INJECTING  ----------
""+200F1FFC: 8B 80 A8 03 00 00     -  mov eax,[eax+000003A8]
""+200F2002: 50                    -  push eax
""+200F2003: DB 04 24              -  fild dword ptr [esp]
""+200F2006: D9 1C 24              -  fstp dword ptr [esp]
""+200F2009: D9 04 24              -  fld dword ptr [esp]
""+200F200C: 83 C4 04              -  add esp,04
""+200F200F: DF F1                 -  fcomip st(0),st(1)
""+200F2011: DD D8                 -  fstp st(0)
""+200F2013: 75 48                 -  jne Player:updateCombo+75
""+200F2015: 7A 46                 -  jp Player:updateCombo+75
}"""

