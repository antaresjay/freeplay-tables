id = "super-movement-speed"
name = "Super Movement Speed"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(get_multiplyMovementSpeed,SHTA.exe,F3 0F 11 87 8C 01 00 00 F3 0F 11)
alloc(newmem,$1000,get_multiplyMovementSpeed)
label(return)
alloc(movSpeedMult,4)
registersymbol(movSpeedMult)

movSpeedMult:
dd (float)1

newmem:
mov r11,movSpeedMult
mulss xmm0,[r11]
movss [rdi+0000018C],xmm0
jmp return

get_multiplyMovementSpeed:
  jmp newmem
  nop 3
return:
registersymbol(get_multiplyMovementSpeed)

[DISABLE]
get_multiplyMovementSpeed:
  db F3 0F 11 87 8C 01 00 00

unregistersymbol(get_multiplyMovementSpeed)
dealloc(newmem)"""
