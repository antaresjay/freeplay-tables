name = "Unlimited Presents Per Day"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(Get_Max_Present_AOB,GameAssembly.dll,3B 78 4C 0F 9C C0) // should be unique
alloc(newmem,$1000,Get_Max_Present_AOB)

label(code)
label(return)

newmem:
  test rax,rax
  je code
  mov [rax+4C],#7777
code:
  cmp edi,[rax+4C]
  setl al
  jmp return

Get_Max_Present_AOB:
  jmp newmem
  nop
return:
registersymbol(Get_Max_Present_AOB)

[DISABLE]

Get_Max_Present_AOB:
  db 3B 78 4C 0F 9C C0

unregistersymbol(Get_Max_Present_AOB)
dealloc(newmem)"""
