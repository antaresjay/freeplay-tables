[[cheat]]
id = "infinite-ammo-d"
name = "Infinite Ammo! :D"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
//Hotline Miami
//Infinite Ammo v1.1.1
//Steve Andrew
[enable]
alloc(InfiniteAmmo,128)
label(NinetyNineBullets)
label(AmmoCheck)
label(ApplyAmmo)
label(RegularCode)
label(AmmoRet)
assert(HotlineMiami.exe+2abc, FD F3 A5 89 C1)

InfiniteAmmo:
cmp [esp+c],18 //Filter out a lot of stuff
jne RegularCode
cmp [esp+18],e //0x0E == Narrow down
je AmmoCheck
cmp [esp+18],10//0x10 == Narrow down 2
je AmmoCheck
jmp RegularCode

AmmoCheck:
cmp [esp+fc],7 //one final narrow it down check
jne RegularCode
cmp [esp+c0],d //most guns
je ApplyAmmo
cmp [esp+c0],8 //double barrel shotgun (maybe more)
je ApplyAmmo
jmp RegularCode

ApplyAmmo:
fld qword ptr [NinetyNineBullets]
fstp qword ptr [edi-4]
jmp AmmoRet+c

RegularCode:
std
repe movsd
mov ecx,eax
jmp AmmoRet

NinetyNineBullets:
dq (double)99

HotlineMiami.exe+2abc:
jmp InfiniteAmmo
AmmoRet:

[disable]

HotlineMiami.exe+2abc:
db FD F3 A5 89 C1

dealloc(InfiniteAmmo)"""

