[[cheat]]
id = "first-person-shooter-character-ctrl-numpad-1"
name = "First Person Shooter Character (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Pih2-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.3.2.0
// Game Version      : Build.24565388
// Script Date       : 2026-08-06


[ENABLE]

aobscanmodule(master,Pih2-Win64-Shipping.exe,488Bxx410FxxxxF2xxxxxxxxxxFF) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,7)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,7)

newmem:
  mov [data],rsi

code:
  readmem(master,7)
  jmp return

master:
  jmp newmem
  nop 2
return:

[DISABLE]

master:
  readmem(masterbkp,7)

unregistersymbol(*)
dealloc(*)"""

