alloc(newmem,$1000,PlanetDataManager:Update)

label(code)
label(return)

newmem:

mov [planet_data_manager_ptr],rcx

code:
  push rbp
  mov rbp,rsp
  sub rsp,50
  jmp return

planet_data_manager_ptr:
dq 0

address:
  jmp newmem
  nop 3
return:
registersymbol(planet_data_manager_ptr)

[DISABLE]

address:
