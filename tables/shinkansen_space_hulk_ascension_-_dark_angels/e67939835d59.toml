[[cheat]]
id = "shunit-base-address-scan-initialization-activate-this-first"
name = "SHUnit Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(SHUnit_basepointer)
registersymbol(SHUnit_update_enable)
registersymbol(SHUnit_set_enable)
registersymbol(SHUnit_statsset_enable)
registersymbol(SHUnit_upgradeset_enable)
registersymbol(SHUnit_ammoset_enable)
registersymbol(SHUnit_weaponset_enable)

alloc(SHUnit_basepointer,4)
alloc(SHUnit_update_enable,4)
alloc(SHUnit_set_enable,4)
alloc(SHUnit_statsset_enable,4)
alloc(SHUnit_upgradeset_enable,4)
alloc(SHUnit_ammoset_enable,4)
alloc(SHUnit_weaponset_enable,4)


[DISABLE]
unregistersymbol(SHUnit_basepointer)
unregistersymbol(SHUnit_update_enable)
unregistersymbol(SHUnit_set_enable)
unregistersymbol(SHUnit_statsset_enable)
unregistersymbol(SHUnit_upgradeset_enable)
unregistersymbol(SHUnit_ammoset_enable)
unregistersymbol(SHUnit_weaponset_enable)

dealloc(SHUnit_basepointer)
dealloc(SHUnit_update_enable)
dealloc(SHUnit_set_enable)
dealloc(SHUnit_statsset_enable)
dealloc(SHUnit_upgradeset_enable)
dealloc(SHUnit_ammoset_enable)
dealloc(SHUnit_weaponset_enable)"""

[[cheat]]
id = "shunit-base-address-scan-to-activate-movement-path-to-update-movement-path"
name = "SHUnit Base Address Scan (To Activate: Movement Path, To Update: Movement Path)"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(SHUnit_savedAOB)
label(SHUnit_returnhere)
label(SHUnit_originalcode)
label(SHUnit_exit)

label(SHUnit_update_exit)
label(SHUnit_set_exit)
label(SHUnit_statsset_exit)
label(SHUnit_upgradeset_exit)
label(SHUnit_ammoset_exit)
label(SHUnit_weaponset_exit)

registersymbol(SHUnit_savedAOB)

aobscan(SHUnit_searchedAOB,8B 4F 2C 3B C1 0F 4C C1 33 C9)

alloc(SHUnit_newmem,2048)


SHUnit_newmem:
// Player check
cmp dword ptr [edi+4c], #1
jne SHUnit_weaponset_exit

cmp dword ptr [SHUnit_update_enable], #0
je SHUnit_update_exit
mov [SHUnit_basepointer], edi
SHUnit_update_exit:

cmp dword ptr [SHUnit_set_enable], #0
je SHUnit_set_exit
SHUnit_set_exit:

cmp dword ptr [SHUnit_statsset_enable], #0
je SHUnit_statsset_exit
mov [edi+28], #999
mov [edi+2c], #999
mov [edi+c0], #999
mov byte ptr [edi+c4], #0
SHUnit_statsset_exit:

cmp dword ptr [SHUnit_upgradeset_enable], #0
je SHUnit_upgradeset_exit
mov ecx,[edi+7c]
mov [ecx+44], #9999999
SHUnit_upgradeset_exit:

cmp dword ptr [SHUnit_ammoset_enable], #0
je SHUnit_ammoset_exit
mov ecx,[edi+98]
mov [ecx+24], #0
mov [ecx+2c], #999
mov [ecx+30], #999
mov [ecx+3c], #0
mov [ecx+70], #999
mov [ecx+74], #-1
SHUnit_ammoset_exit:

cmp dword ptr [SHUnit_weaponset_enable], #0
je SHUnit_weaponset_exit
mov ecx,[edi+98]
mov byte ptr [ecx+28], #0
mov byte ptr [ecx+29], #0
