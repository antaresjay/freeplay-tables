load:
  cmp [ebp+160],2
  jne code
  mov byte ptr [enable_load],0
  push eax
  mov eax,[xpos]
  mov [ebp+34],eax
  mov eax,[ypos]
  mov [ebp+38],eax
  mov eax,[zpos]
  mov [ebp+3C],eax
  pop eax
  jmp code

code:
  fld dword ptr [ebp+3C]
  fadd dword ptr [esp+0C]
  jmp return

PlayerCoordinates:
  jmp newmem2
  nop 2
return:

[DISABLE]

PlayerCoordinates:
  db D9 45 3C D8 44 24 0C

unregistersymbol(PlayerCoordinates)
unregistersymbol(playerCoords)
unregistersymbol(loadFlag)
unregistersymbol(xpos)
unregistersymbol(ypos)
unregistersymbol(zpos)
unregistersymbol(enable_save)
unregistersymbol(enable_load)
dealloc(newmem)

