source = """
{ Game   : AbioticFactor-Win64-Shipping.exe
  Version: 
  Date   : 2025-05-17
  Author : Vater

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(player_pointer,AbioticFactor-Win64-Shipping.exe,4C 8B B9 D8 02 00 00 33 F6 4C 89 A4 24 D8 00 00 00) // should be unique
alloc(newmem,$1000)

alloc(playerpointer,8)
registersymbol(playerpointer)


registersymbol(hunger)
registersymbol(fatigue)
registersymbol(thirst)
registersymbol(continence)
registersymbol(sanity)
registersymbol(radiation)
registersymbol(temperature)
registersymbol(no_reloaded)
registersymbol(inventory)


label(hunger)
label(fatigue)
label(thirst)
label(continence)
label(sanity)
label(radiation)
label(temperature)
label(no_reloaded)
label(inventory)


label(code)
label(return)

newmem:
  push r14
  push r15

  mov r14,[rbx+000002E8]  // PlayerCharacter
  test r14,r14
  je code
  mov [playerpointer], r14

hungercmp:
  cmp byte ptr [hunger],01
  jne fatiguecmp
  movsd xmm1,[r14+9C0]  // max Hunger
  movsd [r14+9B8],xmm1  // current Hunger

fatiguecmp:
  cmp byte ptr [fatigue],01
  jne thirstcmp
  pxor xmm2,xmm2
  movsd [r14+9E8],xmm2  // max fatigue

thirstcmp:
  cmp byte ptr [thirst],01
  jne continencecmp
  movsd xmm1,[r14+A10]  // max thirst
  movsd [r14+A08],xmm1  // current thirst

continencecmp:
  cmp byte ptr [continence],01
  jne sanitycmp
  movsd xmm1,[r14+E18]  // max continence
  movsd [r14+E10],xmm1  // current continence

sanitycmp:
  cmp byte ptr [sanity],01
  jne radiationcmp
  movsd xmm1,[r14+1938]  // max sanity
  movsd [r14+1930],xmm1  // current sanity  radiation

radiationcmp:
  cmp byte ptr [radiation],01
  jne temperaturecmp
  pxor xmm3,xmm3
  movsd [r14+F80],xmm3  // current radiation

temperaturecmp:
  cmp byte ptr [temperature],01
  jne inv_inventory_cmp
  pxor xmm4,xmm4
  movsd [r14+CC8],xmm4  // current temperature

inv_inventory_cmp:
  cmp byte ptr [inventory],01
  jne no_reloadecmp
  movsd xmm1,[inf_inventory]
  movsd [r14+2250],xmm1

no_reloadecmp:
  mov r15, [r14+18F8]
  test r15,r15
  je code

  mov rax,[r15+10]
  test rax,rax
  je code
  cmp dword ptr [rax+38],08
  je set_no_reload
  cmp dword ptr [rax+38],07
  je set_no_reload
  jmp code

set_no_reload:
  cmp byte ptr [no_reloaded],01
  jne code
  mov [r15+00000B24],00000009

code:
  pop r14
  pop r15
  mov r15,[rcx+000002D8]
  xor esi,esi
  mov [rsp+000000D8],r12
  jmp return

hunger:
  db 0

fatigue:
  db 0

thirst:
  db 0

continence:
  db 0

sanity:
  db 0

radiation:
  db 0

temperature:
  db 0

inventory:
  db 0

no_reloaded:
  db 0

inf_inventory:
  dq (double)999999



player_pointer:
  jmp far newmem
  nop 3
return:
registersymbol(player_pointer)

// fly mode
aobscanmodule(fly_ptr,AbioticFactor-Win64-Shipping.exe,0F B6 81 11 02 00 00 FE) // should be unique
alloc(newmem2,$1000,fly_ptr)
alloc(fly_bkp,4)

label(code2)
label(return2)
label(fly)

newmem2:
pushfq
push rdx
mov rax,[playerpointer]
cmp [rcx+20],rax
jne code2
mov dl,[fly]
cmp dl,01
jne fly_mode_on
cmp byte ptr [fly_bkp],01
jne fly_mode_on
mov r8b,00
jmp fly_mode_on

fly_mode_on:
cmp dl,01
jne fly_mode_off
mov byte ptr [rcx+00000211],05
mov [rcx+0000027C],4E6E6B28
jmp code2

fly_mode_off:
cmp dl,02
jne code2
mov byte ptr [rcx+00000211],03
mov [rcx+0000027C],00000000
mov byte ptr [fly],00

code2:
  pop rdx
  popfq
  movzx eax,byte ptr [rcx+00000211]
  jmp return2

fly:
  db 00

fly_bkp:
  db 00

fly_ptr:
  jmp newmem2
  nop 2
return2:
registersymbol(fly_ptr)
registersymbol(fly)

// inf_health and one_hit_damage

aobscanmodule(leben,AbioticFactor-Win64-Shipping.exe,48 8B D9 83 C0 FD) // should be unique
alloc(newmem3,$1000,leben)

registersymbol(infleben)
registersymbol(one_hit_damage)

label(code3)
label(return3)

label(infleben)
label(one_hit_damage)

newmem3:
mov r11,playerpointer
mov r11,[r11]
test r11,r11
je code3
cmp r11,rcx
je check2

check:
cmp byte ptr [one_hit_damage],00
je code3
movzx r11d,byte ptr [r11+AbioticFactor-Win64-Shipping.ObjectCacheContextScopeImpl::Current+8]
cmp [rcx+AbioticFactor-Win64-Shipping.ObjectCacheContextScopeImpl::Current+8],r11b
je code3
xorps xmm2,xmm2
jmp code3

check2:
cmp byte ptr [infleben],00
je code3
mov r11,00000000495BBA00
movq xmm2,r11
jmp code3
code3:
  mov rbx,rcx
  add eax,-03
  jmp return3

infleben:
  db 00

one_hit_damage:
  db 00

leben:
  jmp newmem3
  nop
return3:
registersymbol(leben)

// inf_item_durability and batteries
aobscanmodule(inf_durability_pointer,AbioticFactor-Win64-Shipping.exe,44 8B 45 00 48 85 C0)
alloc(newmem4, $1000, inf_durability_pointer)

label(code4)
label(return4)

label(slot_1)
registersymbol(slot_1)

label(inf_durability)
registersymbol(inf_durability)

label(inf_battery)
registersymbol(inf_battery)

newmem4:
  push rax
  push rbx
  push rcx
  push rdx
  push rsi
  push r12
  push r13

  mov rcx, [rbx+10]
  test rcx, rcx
  je skip
  cmp dword ptr [rcx+38], 0
  jne skip
  cmp dword ptr [rcx+5C], 8
  jne skip
  cmp dword ptr [rcx+58], 0000013C
  jne skip

  mov rax, playerpointer
  mov rax, [rax]
  mov rcx, [rbx+18]
  test rcx, rcx
  je skip
  cmp [rcx+20], rax
  jne skip
  mov rcx, [rcx+10]
  test rcx, rcx
  je skip
  cmp dword ptr [rcx+38], 2
  jne skip
  cmp dword ptr [rcx+5C], 8
  jne skip
  cmp dword ptr [rcx+58], 000002C1
  jne skip

  mov rdx, [r13+78]
  test rdx, rdx
  je skip

  cmp dword ptr [r12+08], 0
  je skip

  cmp dword ptr [r12+08], 0B
  ja process_toolbelt

  mov rax,[r12]
  mov [slot_1],rax

  xor ecx, ecx

backpack_loop:
  mov esi, ecx
  imul rsi, [rdx+34]
  add rsi, [r12]

  cmp byte ptr [inf_durability], 1
  jne skip_dura_b
  mov rax, [rsi+28]
  mov [rsi+20], rax

skip_dura_b:
  cmp dword ptr [rsi+3C], 0
  je skip_batt_b
  cmp byte ptr [inf_battery], 1
  jne skip_batt_b
  mov dword ptr [rsi+38], 000003E7

skip_batt_b:
  inc ecx
  cmp ecx, [r12+08]
  jl backpack_loop

  jmp skip

process_toolbelt:
  xor ecx, ecx

toolbelt_loop:
  mov esi, ecx
  imul rsi, [rdx+34]
  add rsi, [r12]

  cmp byte ptr [inf_durability], 1
  jne skip_dura_t
  mov rax, [rsi+28]
  mov [rsi+20], rax

skip_dura_t:
  cmp dword ptr [rsi+3C], 0
  je skip_batt_t
  cmp byte ptr [inf_battery], 1
  jne skip_batt_t
  mov dword ptr [rsi+38], 000003E7

skip_batt_t:
  inc ecx
  cmp ecx, [r12+08]
  jl toolbelt_loop

skip:
  pop r13
  pop r12
  pop rsi
  pop rdx
  pop rcx
  pop rbx
  pop rax

  mov r14, [rbx+78]
  jmp code4

code4:
  mov r8d, [rbp+00]
  test rax, rax
  jmp return4

inf_durability:
  db 0

inf_battery:
  db 0

slot_1:
  dq 0

inf_durability_pointer:
  jmp newmem4
  nop 2

return4:

// max exp //

aobscanmodule(exp_pointer,AbioticFactor-Win64-Shipping.exe,48 8B 02 FF 90 88 01 00 00 80) // should be unique
alloc(newmem5,$1000,exp_pointer)

registersymbol(set_xp)
registersymbol(exp_pointer)

label(code5)
label(set_xp)
label(xp_value)
label(return5)

newmem5:
  push rbx
  push rcx
  push rsi
  push rdi

  mov rax,[rdx+10]
  test rax,rax
  je code5
  cmp dword ptr [rax+38],02
  jne code5
  cmp dword ptr [rax+5C],08
  jne code5
  mov rax,[playerpointer]
  cmp [rdx+20],rax
  jne code5
  cmp [rdx+168],0F
  jne code5

  xor ecx,ecx

loop5:
  mov esi,ecx
  imul esi,esi,38
  add rsi,[rdx+160]

  mov eax,[xp_value]
  mov [rsi+2C],eax

  cmp byte ptr [set_xp],01
  jne skip5
  mov [rsi+28],4B18967F

skip5:
  inc ecx
  cmp ecx,[rdx+168]
  jne loop5

code5:
  pop rdi
  pop rsi
  pop rcx
  pop rbx
  mov rax,[rdx]
  call qword ptr [rax+188]
  jmp return5

xp_value:
  dd 0x3F800000 // 1.0 float

set_xp:
  db 00

exp_pointer:
  jmp newmem5
  nop 4
return5:

//   free crafting
aobscanmodule(free_crafting_ptr,AbioticFactor-Win64-Shipping.exe,48 8B 4F 28 48 85 C9 74 7E) // should be unique
alloc(newmem6,$1000,free_crafting_ptr)

registersymbol(item_pointer)


label(code6)
label(item_pointer)
label(return6)

newmem6:
cmp [rdi+3C],000001C6
jne code6
mov rcx,[r8+20]
mov [item_pointer],rcx

code6:
  mov rcx,[rdi+28]
  test rcx,rcx
  jmp return6

item_pointer:
  dq 0


free_crafting_ptr:
  jmp newmem6
  nop 2
return6:
registersymbol(free_crafting_ptr)

[DISABLE]

