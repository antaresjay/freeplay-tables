[[cheat]]
id = "press-r-to-reload"
name = "Press R to reload"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
alloc(newmem, 256)
label(return)

ResidentEvil3.exe+677AA:
jmp newmem
nop
return:

newmem:
pushad
push 'R'
call GetAsyncKeyState
shr ax,#15
cmp ax,1
je @f
popad
jmp ResidentEvil3.exe+677B2
@@:
popad
or ax,FFFF
jmp return

[DISABLE]
dealloc(newmem)
dealloc(return)

ResidentEvil3.exe+677AA:
jne ResidentEvil3.exe+677B2
or ax,FFFF"""

