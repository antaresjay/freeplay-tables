[[cheat]]
id = "game-manager-ctrl-numpad-1"
name = "Game Manager (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Aerial_Knights_Dropshot.exe
// Author            : ndck76
// Executable Version: 2022.3.62.28864
// Game Version      : v1.0.0
// Script Date       : 2026-02-23


[ENABLE]

aobscanregion(gametime,NeoFPS.GameUIManager:Update,NeoFPS.GameUIManager:Update+500,F30F11A8xxxx000048xxxxxxxxxxxx33xx48xxxxxxxxxxxx49BBxxxxxxxxxxxx000041xxxx85xx74xx48xxxxxxxxxxxx48xxxxxx) //NeoFPS.GameUIManager:Update+16e
alloc(newmem,$1000,gametime)
alloc(data3,8)
alloc(gametimebkp,8)
registersymbol(data3)
registersymbol(gametime)
registersymbol(gametimebkp)
label(code)
label(return)

gametimebkp:
  readmem(gametime,8)

newmem:
  mov [data3],rax

code:
  readmem(gametime,8)
  jmp return

gametime:
  jmp newmem
  nop 3
return:

[DISABLE]

gametime:
  readmem(gametimebkp,8)

unregistersymbol(*)
dealloc(*)"""

