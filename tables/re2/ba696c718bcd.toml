[[cheat]]
id = "anti-poison-timer"
name = "Anti Poison Timer"
category = "game"
description = ""
hint = ""
type = "script"
source = """
{ Game   : re2.exe
  Version: non rt
  Date   : 2023-04-11
  Author : Oyyzj

  This script does blah blah blah
}

[ENABLE]
aobscanmodule(AntiPoisonTimer,re2.exe,F3 0F 11 B6 5C 02 00 00 E9) // should be unique
alloc(newmem,100,AntiPoisonTimer)
alloc(pAntiPoisonTimer,4)
label(code)
label(return)
label(rAntiPoisonTimer)
newmem:
  mov [pAntiPoisonTimer],rsi
code:
  mov [rsi+25C],(float)180
  jmp return
rAntiPoisonTimer:
  readmem(AntiPoisonTimer,8)
AntiPoisonTimer:
  jmp newmem
  db 90 90 90
return:
registersymbol(AntiPoisonTimer)
registersymbol(pAntiPoisonTimer)
registersymbol(rAntiPoisonTimer)
[DISABLE]
AntiPoisonTimer:
  readmem(rAntiPoisonTimer,8)
unregistersymbol(rAntiPoisonTimer)
unregistersymbol(pAntiPoisonTimer)
dealloc(pAntiPoisonTimer,4)
unregistersymbol(AntiPoisonTimer)
dealloc(newmem)"""

