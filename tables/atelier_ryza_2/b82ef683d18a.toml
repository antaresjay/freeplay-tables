[[cheat]]
id = "party-don-t-break"
name = "Party Don't Break"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc(newmem,$1000,write_break)
label(code_break,break_offset)
registersymbol(code_break,break_offset)

newmem:
  code_break:
    readmem(write_break,6)
    push rbp
    mov rbp,[break_offset]
    sub rbp,04
    cmp dword ptr [rbp+rsi],0
    pop rbp
    jne write_break+0E
    jmp return
    align 10 CC

  break_offset:
    readmem(write_break+08,4)
    align 08

write_break:
  jmp code_break
  nop
return:

[DISABLE]

