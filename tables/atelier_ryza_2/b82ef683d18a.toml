[[cheat]]
id = "move-speed-multiplier"
name = "Move Speed Multiplier"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc(newmem,$1000,write_x_coord)
label(code_x_coord,code_z_coord,move_speed)
registersymbol(code_x_coord,code_z_coord,move_speed)

newmem:
  code_x_coord:
    readmem(write_x_coord,5)
    cmp [mem0x05],rbx
    jne @f
    mulss xmm0,[move_speed]
  @@:
    jmp return1
    align 10 CC

  code_z_coord:
    readmem(write_z_coord,5)
    cmp [mem0x05],rbx
    jne @f
    mulss xmm2,[move_speed]
  @@:
    jmp return2
    align 10 CC

  move_speed:
    dd (float)2.0

write_x_coord:
  jmp code_x_coord
return1:

write_z_coord:
  jmp code_z_coord
return2:

[DISABLE]

write_x_coord:
  readmem(code_x_coord,5)

write_z_coord:
  readmem(code_z_coord,5)

unregistersymbol(code_x_coord,code_z_coord,move_speed)
dealloc(newmem)"""

