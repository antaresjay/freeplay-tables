type = "script"
source = """
[ENABLE]


aobscanmodule(ammo,GetEven.exe,29 84 8B 3C 25 00 00)
alloc(newmem,$1000,"GetEven.exe"+F9EDFB)

label(code)
label(return)

newmem:
code:
