[[cheat]]
id = "squadmemberpanel-base-address-scan-initialization-activate-this-first"
name = "SquadMemberPanel Base Address Scan Initialization (Activate This First)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(SquadMemberPanel_basepointer)
registersymbol(SquadMemberPanel_update_enable)
registersymbol(SquadMemberPanel_set_enable)
registersymbol(SquadMemberPanel_healthset_enable)
registersymbol(SquadMemberPanel_spiritset_enable)
registersymbol(SquadMemberPanel_statsset_enable)

alloc(SquadMemberPanel_basepointer, 4)
alloc(SquadMemberPanel_update_enable, 4)
alloc(SquadMemberPanel_set_enable, 4)
alloc(SquadMemberPanel_healthset_enable, 4)
alloc(SquadMemberPanel_spiritset_enable, 4)
alloc(SquadMemberPanel_statsset_enable, 4)


[DISABLE]
unregistersymbol(SquadMemberPanel_basepointer)
unregistersymbol(SquadMemberPanel_update_enable)
unregistersymbol(SquadMemberPanel_set_enable)
unregistersymbol(SquadMemberPanel_healthset_enable)
unregistersymbol(SquadMemberPanel_spiritset_enable)
unregistersymbol(SquadMemberPanel_statsset_enable)

dealloc(SquadMemberPanel_basepointer)
dealloc(SquadMemberPanel_update_enable)
dealloc(SquadMemberPanel_set_enable)
dealloc(SquadMemberPanel_healthset_enable)
dealloc(SquadMemberPanel_spiritset_enable)
dealloc(SquadMemberPanel_statsset_enable)"""

[[cheat]]
id = "squadmemberpanel-base-address-scan-to-activate-battle-to-update-battle"
name = "SquadMemberPanel Base Address Scan (To Activate: Battle, To Update: Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(SquadMemberPanel_savedAOB)
label(SquadMemberPanel_returnhere)
label(SquadMemberPanel_originalcode)
label(SquadMemberPanel_exit)

label(SquadMemberPanel_update_exit)
label(SquadMemberPanel_set_exit)
label(SquadMemberPanel_healthset_exit)
label(SquadMemberPanel_spiritset_exit)
label(SquadMemberPanel_statsset_exit)

registersymbol(SquadMemberPanel_savedAOB)

//1D0590A4 - D9 5D C0              - fstp dword ptr [ebp-40]
//1D0590A7 - D9 45 C0              - fld dword ptr [ebp-40]
// Dawn.Panels.HUD_PC:SquadMemberPanel:InternalUpdate+1fa
//1D0590AA - 8B 87 4C010000        - mov eax,[edi+0000014C]
//1D0590B0 - 8B C8                 - mov ecx,eax
//1D0590B2 - 39 09                 - cmp [ecx],ecx
//1D0590B4 - 8B 80 B8000000        - mov eax,[eax+000000B8]
//1D0590BA - 50                    - push eax
//1D0590BB - DB 04 24              - fild dword ptr [esp]
//1D0590BE - D9 1C 24              - fstp dword ptr [esp]
//1D0590C1 - D9 04 24              - fld dword ptr [esp]
//1D0590C4 - 83 C4 04              - add esp,04
//1D0590C7 - DFF1                  - fcomip st(0),st(1)
//1D0590C9 - DDD8                  - fstp st(0)
aobscan(SquadMemberPanel_searchedAOB, 8B 87 4C 01 00 00 8B C8 39 09 8B 80 B8 00 00 00 50 DB 04 24 D9 1C 24 D9 04 24 83 C4 04 DF F1)

alloc(SquadMemberPanel_newmem, 2048)
alloc(SquadMemberPanel_temp1, 4)


SquadMemberPanel_newmem:
mov [SquadMemberPanel_temp1], ebx

cmp dword ptr [SquadMemberPanel_update_enable], #0
je SquadMemberPanel_update_exit
cmp byte ptr [edi+195], #1
jne SquadMemberPanel_update_exit
mov [SquadMemberPanel_basepointer], edi
SquadMemberPanel_update_exit:

cmp dword ptr [SquadMemberPanel_set_enable], #0
je SquadMemberPanel_set_exit
SquadMemberPanel_set_exit:

cmp dword ptr [SquadMemberPanel_healthset_enable], #0
je SquadMemberPanel_healthset_exit
cmp dword ptr [edi+14c], #0
je SquadMemberPanel_healthset_exit
mov ebx, [edi+14c]
mov [ebx+58], #9999999
SquadMemberPanel_healthset_exit:

cmp dword ptr [SquadMemberPanel_spiritset_enable], #0
je SquadMemberPanel_spiritset_exit
cmp dword ptr [edi+14c], #0
je SquadMemberPanel_spiritset_exit
mov ebx, [edi+14c]
mov [ebx+b8], #9999999
SquadMemberPanel_spiritset_exit:

cmp dword ptr [SquadMemberPanel_statsset_enable], #0
je SquadMemberPanel_statsset_exit
cmp dword ptr [edi+14c], #0
je SquadMemberPanel_spiritset_exit
mov ebx, [edi+14c]
mov [ebx+164], #999
mov [ebx+168], #999
mov [ebx+16c], #500
mov [ebx+170], #999
SquadMemberPanel_statsset_exit:

mov ebx, [SquadMemberPanel_temp1]


SquadMemberPanel_originalcode:
db 8B 87 4C 01 00 00
//mov eax,[edi+0000014C]


SquadMemberPanel_exit:
jmp SquadMemberPanel_returnhere


SquadMemberPanel_searchedAOB:
SquadMemberPanel_savedAOB:
jmp SquadMemberPanel_newmem
nop
SquadMemberPanel_returnhere:


[DISABLE]
SquadMemberPanel_savedAOB:
db 8B 87 4C 01 00 00
//mov eax,[edi+0000014C]

unregistersymbol(SquadMemberPanel_savedAOB)

dealloc(SquadMemberPanel_newmem)
dealloc(SquadMemberPanel_temp1)"""

