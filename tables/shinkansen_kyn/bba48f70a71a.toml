[[cheat]]
id = "statspanel-base-address-scan-to-activate-view-inventory-to-update-view-inventory"
name = "StatsPanel Base Address Scan (To Activate: View Inventory, To Update: View Inventory)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(StatsPanel_savedAOB)
label(StatsPanel_returnhere)
label(StatsPanel_originalcode)
label(StatsPanel_exit)

label(StatsPanel_update_exit)
label(StatsPanel_set_exit)

registersymbol(StatsPanel_savedAOB)

//1CE6DA7E - 8B 87 78010000        - mov eax,[edi+00000178]
//1CE6DA84 - 89 45 BC              - mov [ebp-44],eax
// Dawn.Panels.MSVJ.V:StatsPanel:InternalUpdate+677
//1CE6DA87 - 8B 87 7C010000        - mov eax,[edi+0000017C]
//1CE6DA8D - 8B C8                 - mov ecx,eax
//1CE6DA8F - 39 09                 - cmp [ecx],ecx
//1CE6DA91 - 8B 80 70010000        - mov eax,[eax+00000170]
//1CE6DA97 - 89 45 C0              - mov [ebp-40],eax
//1CE6DA9A - 8D 45 C0              - lea eax,[ebp-40]
aobscan(StatsPanel_searchedAOB, 8B 87 7C 01 00 00 8B C8 39 09 8B 80 70 01 00 00 89 45 C0)

alloc(StatsPanel_newmem, 2048)
alloc(StatsPanel_temp1, 4)


StatsPanel_newmem:
mov [StatsPanel_temp1], ebx

cmp dword ptr [StatsPanel_update_enable], #0
je StatsPanel_update_exit
mov [StatsPanel_basepointer], edi
StatsPanel_update_exit:

cmp dword ptr [StatsPanel_set_enable], #0
je StatsPanel_set_exit
cmp dword ptr [edi+17c], #0
je StatsPanel_set_exit
mov ebx, [edi+17c]
mov [ebx+164], #999
mov [ebx+168], #999
mov [ebx+16c], #500
mov [ebx+170], #999
StatsPanel_set_exit:

mov ebx, [StatsPanel_temp1]


StatsPanel_originalcode:
db 8B 87 7C 01 00 00
//mov eax,[edi+0000017C]


StatsPanel_exit:
jmp StatsPanel_returnhere


StatsPanel_searchedAOB:
StatsPanel_savedAOB:
jmp StatsPanel_newmem
nop
StatsPanel_returnhere:


[DISABLE]
StatsPanel_savedAOB:
db 8B 87 7C 01 00 00
//mov eax,[edi+0000017C]

unregistersymbol(StatsPanel_savedAOB)

dealloc(StatsPanel_newmem)
dealloc(StatsPanel_temp1)"""

