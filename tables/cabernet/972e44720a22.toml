[[cheat]]
id = "tillie-stats-ctrl-numpad-1"
name = "Tillie Stats (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Cabernet.exe
// Author            : ndck76
// Executable Version: 2022.3.36.42017
// Game Version      : v1.0.8
// Script Date       : 2025-02-27


[ENABLE]

aobscanregion(artstats,TillieStats:GetRealKnowledgeStat,TillieStats:GetRealKnowledgeStat+100,4863873xxx0000EBxx83xxxx75xx48xxxxxxxxxxxxEBxx83xxxx75xx48xxxxxxxxxxxxEBxx83xxxx75xx48xxxxxxxxxxxxEBxx48xxxxxxxxxxxxxxxxxx) //TillieStats:GetRealKnowledgeStat+17
alloc(newmem,$1000,artstats)
alloc(data,8)
alloc(artstatsbkp,7)
registersymbol(data)
registersymbol(artstats)
registersymbol(artstatsbkp)
label(code)
label(return)

artstatsbkp:
  readmem(artstats,7)

newmem:
  mov [data],rdi

code:
  readmem(artstats,7)
  jmp return

artstats:
  jmp newmem
  nop 2
return:

[DISABLE]

artstats:
  readmem(artstatsbkp,7)

unregistersymbol(*)
dealloc(*)"""

