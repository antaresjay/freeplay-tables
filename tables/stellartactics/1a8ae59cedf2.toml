alloc(capacitor,8)
alloc(thruster,8)
registersymbol(capacitor)
registersymbol(thruster)
registersymbol(fast_move)
registersymbol(max_speed)
registersymbol(shp_ammo)

label(code)
label(return)
label(capac)
label(thrust)
label(fast_move)
label(max_speed)
label(shp_ammo)
label(shipammo)
label(shipammotwo)
label(shipammothree)
label(sh_ammo_amount)

newmem:
 capac:
 cmp r15, 34
 jne thrust
 mov [capacitor], rsi
thrust:
 cmp r15, 4A
 jne shipammo
 mov [thruster], rsi
 cmp [fast_move],00000001
 jne shipammo
 movss xmm6,[max_speed]
shipammo:
 cmp [shp_ammo], 00000001
 jne code
 cmp r15, 60
 jne shipammotwo
 movss xmm6,[sh_ammo_amount]
 movss [rsi+08],xmm6
 jmp return
shipammotwo:
