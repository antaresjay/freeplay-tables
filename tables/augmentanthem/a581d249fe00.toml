[[cheat]]
id = "ego-melee-ctrl-numpad-3"
name = "Ego Melee (Ctrl + Numpad 3)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : AugmentAnthem.exe
// Author            : ndck76
// Executable Version: 2021.3.45.63631
// Game Version      : v1.00
// Script Date       : 2026-05-19


[ENABLE]

aobscanregion(heatvalue,EgoMelee:MeleeAction,EgoMelee:MeleeAction+100,F30F10xx2xF3xxxxxx48xxxxF2xxxxxxF2xxxxxx83xxxx48xxxxxx49BBxxxxxxxxxxxx000041xxxx48xxxxxx48xxxxxx5DC3) //EgoMelee:MeleeAction+2b
alloc(newmem,$1000)
alloc(data4,8)
alloc(heatvaluebkp,16)
registersymbol(data4)
registersymbol(heatvalue)
registersymbol(heatvaluebkp)
label(code)
label(return)

heatvaluebkp:
  readmem(heatvalue,16)

newmem:
  mov [data4],rsi

code:
  readmem(heatvalue,16)
  jmp return

heatvalue:
  jmp far newmem
  nop 2
return:

[DISABLE]

heatvalue:
  readmem(heatvaluebkp,16)

unregistersymbol(*)
dealloc(*)"""

