[[cheat]]
id = "infinite-food"
name = "Infinite Food"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat

 
 
aobscan(resources,7B 00 00 00 48 8D 44 88 20) // should be unique
alloc(newmem,$1000,resources)
aobscan(resourcesret,48 83 C4 20 89 45 EC 48 8B CD 48 83 C1 EC 48 83 EC 20)
label(code)
label(return)

newmem:
cmp [rbp+8],resourcesret
jne code
  lea rax,[rax+rcx*4+20]
  mov [rax],#9999
  jmp return
code:
  lea rax,[rax+rcx*4+20]
  jmp return

resources+04:
  jmp newmem
return:
registersymbol(resources)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
resources+04:
  db 48 8D 44 88 20

unregistersymbol(resources)
dealloc(newmem)"""
