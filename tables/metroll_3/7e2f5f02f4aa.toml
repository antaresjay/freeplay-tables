[[cheat]]
id = "unlimited-clip-unlimited-ammo-on-reload"
name = "Unlimited Clip & Unlimited Ammo (on reload)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

alloc( dwCave, 256 )
label( back )

dwCave:
push ecx
push edx
mov ecx,[D05F4C] // change this on updates based on dwPlayerStructPtr
mov ecx,[ecx+20]
lea edx,[eax-724]
mov edx,[edx+B8]
mov edx,[edx]
lea edx,[edx-58]
cmp ecx,edx
jne short @f
test byte ptr [eax+68],10
jne short @f
or byte ptr [eax+68],18
// ORing with 0x10 will not decrease clip
// ORing with 0x8 will increases ammo to full capacity (refill)
@@:
pop edx
pop ecx
test byte ptr [eax+68],10
pop ebp
jmp back

aobscan( dwCheckClip_AOB, F64068105D ) // on firing bullets
label( dwCheckClip )
registersymbol( dwCheckClip )

dwCheckClip_AOB:
dwCheckClip:
jmp dwCave
back:

// TEST BYTE PTR DS:[EAX+0x68],0x8 << on reload

[DISABLE]

dwCheckClip:
test byte ptr [eax+68],10
pop ebp

unregistersymbol( dwCheckClip )
dealloc( dwCave )"""
