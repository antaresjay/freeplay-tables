type = "script"
source = """
[ENABLE]

aobscanmodule(money,NeedForSpeedPayback.exe,8B 47 08 C6 41 10 02)
alloc(newmem,$1000,money)

label(code)
label(return)

newmem:
mov [rdi+08], #99999999
code:
mov eax,[rdi+08]
mov byte ptr [rcx+10],02
jmp return

money:
jmp newmem
nop
nop
