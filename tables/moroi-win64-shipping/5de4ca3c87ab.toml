[[cheat]]
id = "character-ctrl-numpad-1"
name = "Character (Ctrl + Numpad 1)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : Moroi-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.2.1.0
// Game Version      : v1.10
// Script Date       : 2025-05-02


[ENABLE]

aobscanmodule(master,Moroi-Win64-Shipping.exe,488BxxF2xxxxxxxxxx0F28xx0F29xxxxxxF2xxxxxxxxxxFF) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,9)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,9)

newmem:
  mov [data],rcx

code:
  readmem(master,9)
  jmp return

master:
  jmp newmem
  nop 4
return:

[DISABLE]

master:
  readmem(masterbkp,9)

unregistersymbol(*)
dealloc(*)"""

