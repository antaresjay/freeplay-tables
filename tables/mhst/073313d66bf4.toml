alloc(xp_address,8)

registersymbol(xp_address)

label(code)
label(return)


newmem:
  mov [xp_address],rcx

code:
  mov edx,[rcx+0000013C]
  jmp return

save_xp:
  jmp newmem
  nop
return:
registersymbol(save_xp)

