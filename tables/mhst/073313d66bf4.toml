[[cheat]]
id = "load-monster-data"
name = "Load Monster Data"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
{ Game   : MONSTER HUNTER STORIES
  Version: 
  Date   : 2024-06-22
  Author : jacob

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(INJECT,MHST.exe,0F B6 81 B8 00 00 00 C3) // should be unique
alloc(newmem,$1000,INJECT)
alloc(level_address,8)

registersymbol(level_address)

label(code)
label(return)

newmem:
mov [level_address],rcx

code:
  movzx eax,byte ptr [rcx+000000B8]
  jmp return

INJECT:
  jmp newmem
  nop 2
return:
registersymbol(INJECT)

[DISABLE]

INJECT:
  db 0F B6 81 B8 00 00 00

unregistersymbol(INJECT)
dealloc(newmem)

{
// ORIGINAL CODE - INJECTION POINT: MHST.exe+D43540

MHST.exe+D43536: CC                    - int 3 
MHST.exe+D43537: CC                    - int 3 
MHST.exe+D43538: CC                    - int 3 
MHST.exe+D43539: CC                    - int 3 
MHST.exe+D4353A: CC                    - int 3 
MHST.exe+D4353B: CC                    - int 3 
MHST.exe+D4353C: CC                    - int 3 
MHST.exe+D4353D: CC                    - int 3 
MHST.exe+D4353E: CC                    - int 3 
MHST.exe+D4353F: CC                    - int 3 
// ---------- INJECTING HERE ----------
MHST.exe+D43540: 0F B6 81 B8 00 00 00  - movzx eax,byte ptr [rcx+000000B8]
// ---------- DONE INJECTING  ----------
MHST.exe+D43547: C3                    - ret 
MHST.exe+D43548: CC                    - int 3 
MHST.exe+D43549: CC                    - int 3 
MHST.exe+D4354A: CC                    - int 3 
MHST.exe+D4354B: CC                    - int 3 
MHST.exe+D4354C: CC                    - int 3 
MHST.exe+D4354D: CC                    - int 3 
MHST.exe+D4354E: CC                    - int 3 
MHST.exe+D4354F: CC                    - int 3 
MHST.exe+D43550: 0F B7 81 4A 01 00 00  - movzx eax,word ptr [rcx+0000014A]
}"""

