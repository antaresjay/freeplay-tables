  This script does blah blah blah
}

define(address,"GameAssembly.dll"+DDBE30)
define(bytes,48 89 5C 24 10)

[ENABLE]

assert(address,bytes)
alloc(newmem,$1000,"GameAssembly.dll"+DDBE30)

label(code)
label(return)

newmem:
mov [playerattack_ptr],rcx

