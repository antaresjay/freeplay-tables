source = """
[ENABLE]



aobscanmodule(megaexp_Aob,foundation.exe,F3 0F 10 8B 90 00 00 00 45) // should be unique
alloc(newmem,$1000,megaexp_Aob)

label(code)
label(return)

newmem:

push f
fild [rsp]
fadd [rbx+90]
fstp [rbx+90]
add rsp,8
code:
  movss xmm1,[rbx+00000090]
  jmp return

megaexp_Aob:
  jmp newmem
  nop 3
return:
