[[cheat]]
id = "set-minimum-renown"
name = "Set Minimum Renown"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(Renown,89 58 28 8D 49 34) // should be unique
alloc(newRenown,$100)

label(codeRenown)
label(returnRenown)
label(minRenown)

newRenown:
  mov ebx,[minRenown]
codeRenown:
  mov [eax+28],ebx
  lea ecx,[ecx+34]
  jmp returnRenown
  nop

minRenown:
  dd (int)1000

Renown:
  jmp newRenown
  nop
returnRenown:
registersymbol(Renown)
registersymbol(minRenown)

[DISABLE]

Renown:
  db 89 58 28 8D 49 34

unregistersymbol(Renown)
dealloc(newRenown)"""

