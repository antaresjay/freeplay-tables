type = "script"
source = """
{ Game   : IronCrypticle.exe
  Version: 
  Date   : 2017-08-19
  Author : wcz
}

[ENABLE]

aobscanmodule(Player,IronCrypticle.exe,0F B6 BC 01 E2 03 00 00) // old 0F B6 8C 07 E2 03 00 00
alloc(newmem,$1000)

label(code)
label(Health)
label(Health_status)
label(Invincible)
label(Invincible_status)
label(Magic)
label(Magic_status)
label(Weapon)
label(Weapon_status)
label(return)
globalalloc(pPlayer,4)

newmem:
  cmp [eax+300],#1
  jne code
  mov [pPlayer],eax
  jmp Health

Health:
  cmp [Health_status],0
  je Invincible
  push ecx
  mov ecx,[eax+50]
  mov [eax+3E2],ecx
  pop ecx
  jmp Invincible

Health_status:
 dd 0

Invincible:
  cmp [Invincible_status],0
  je Magic
  mov [eax+31C],(float)3
  jmp Magic

Invincible_status:
 dd 0

Magic:
  cmp [Magic_status],0
  je Weapon
  mov byte ptr [eax+3DE],3
  jmp Weapon

Magic_status:
 dd 0

Weapon:
  cmp [Weapon_status],0
  je code
  mov [eax+394],(float)20
  jmp code

Weapon_status:
 dd 0

code:
  movzx edi,byte ptr [ecx+eax+000003E2]
  jmp return

Player:
  jmp newmem
  nop
  nop
  nop
return:
registersymbol(Player)
registersymbol(Health_status)
registersymbol(Invincible_status)
registersymbol(Magic_status)
registersymbol(Weapon_status)

[DISABLE]

Player:
  db 0F B6 BC 01 E2 03 00 00 //old 0F B6 8C 07 E2 03 00 00

unregistersymbol(Player)
unregistersymbol(Health_status)
unregistersymbol(Invincible_status)
unregistersymbol(Magic_status)
unregistersymbol(Weapon_status)
dealloc(newmem)

