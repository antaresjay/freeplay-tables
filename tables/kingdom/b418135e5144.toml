[[cheat]]
id = "always-full-life-endurance-food-water-whatever"
name = "Always Full Life, Endurance, Food, Water...whatever"
category = "player"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Dungeon Kingdom.exe
  Version: 
  Date   : 2021-02-11
  Author : Ich

    This script changes the ApplyModifier-Code.
    This one is very useful because only our party memebers get modified values.
    It is used for
    * mana regeneration
    * health regeneration
    * food
    * water
    * damage output
    * and possibly even more
}

define(address,dkCharacteristic:ApplyModifier+12)
define(bytes,D9 5E 10 0F B6 45 10)

[ENABLE]
assert(address,bytes)
alloc(newmem,$1000)

label(code)
label(return)
registersymbol(magicvalue)


newmem:
  fadd dword ptr [magicvalue] // just add our value to whatever comes our way

code:
  fstp dword ptr [esi+10]
  movzx eax,byte ptr [ebp+10]
  jmp return

magicvalue:
  dd (float)1000

address:
  jmp newmem
  nop
  nop
return:

[DISABLE]

address:
  db bytes

dealloc(newmem)
unregistersymbol(magicvalue)

