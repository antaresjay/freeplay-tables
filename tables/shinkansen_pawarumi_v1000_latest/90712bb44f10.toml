[[cheat]]
id = "player-base-address-scan-initialization-activate-this-first"
name = "Player Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(Player_basepointer)
registersymbol(Player_update_enable)
registersymbol(Player_set_enable)
registersymbol(Player_shieldset_enable)
registersymbol(Player_energyset_enable)
registersymbol(Player_invincibilityset_enable)

alloc(Player_basepointer, 8)
alloc(Player_update_enable, 4)
alloc(Player_set_enable, 4)
alloc(Player_shieldset_enable, 4)
alloc(Player_energyset_enable, 4)
alloc(Player_invincibilityset_enable, 4)


[DISABLE]
unregistersymbol(Player_basepointer)
unregistersymbol(Player_update_enable)
unregistersymbol(Player_set_enable)
unregistersymbol(Player_shieldset_enable)
unregistersymbol(Player_energyset_enable)
unregistersymbol(Player_invincibilityset_enable)

dealloc(Player_basepointer)
dealloc(Player_update_enable)
dealloc(Player_set_enable)
dealloc(Player_shieldset_enable)
dealloc(Player_energyset_enable)
dealloc(Player_invincibilityset_enable)"""

[[cheat]]
id = "player-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Player Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Player_savedAOB)
label(Player_returnhere)
label(Player_originalcode)
label(Player_exit)

label(Player_update_exit)
label(Player_set_exit)
label(Player_shieldset_exit)
label(Player_energyset_exit)
label(Player_invincibilityset_exit)

registersymbol(Player_savedAOB)

//0D63F8C5 - 66 0F57 C0            - xorpd xmm0,xmm0
//0D63F8C9 - F2 0F11 85 28FEFFFF   - movsd [rbp-000001D8],xmm0
// Player:Update+61
//0D63F8D1 - F3 0F10 86 18020000   - movss xmm0,[rsi+00000218]
//0D63F8D9 - F3 0F5A C0            - cvtss2sd xmm0,xmm0
//0D63F8DD - F2 0F11 85 20FEFFFF   - movsd [rbp-000001E0],xmm0
//0D63F8E5 - 48 83 EC 20           - sub rsp,20
//0D63F8E9 - 49 BB F0D3AC1000000000 - mov r11,0000000010ACD3F0 : [EC8B4855]
//0D63F8F3 - 41 FF D3              - call r11d
aobscan(Player_searchedAOB, F3 0F 10 86 18 02 00 00 F3 0F 5A C0 F2 0F 11 85 20 FE FF FF 48 83 EC 20)

alloc(Player_newmem, 2048, Player_searchedAOB)
alloc(Player_temp1, 8, Player_searchedAOB)
alloc(Player_temp2, 8, Player_searchedAOB)
alloc(Player_temp3, 8, Player_searchedAOB)
alloc(Player_temp4, 8, Player_searchedAOB)
alloc(Player_temp5, 8, Player_searchedAOB)


Player_newmem:
mov [Player_temp1], rax
mov [Player_temp2], rbx
mov [Player_temp3], rcx
mov [Player_temp4], rdx

cmp dword ptr [Player_update_enable], #0
je Player_update_exit
mov [Player_basepointer], rsi
Player_update_exit:

cmp dword ptr [Player_set_enable], #0
je Player_set_exit
Player_set_exit:

cmp dword ptr [Player_shieldset_enable], #0
je Player_shieldset_exit
mov rbx, [rsi+78]
test rbx, rbx
je Player_shieldset_exit
mov [rbx+3c], (float)1
Player_shieldset_exit:

cmp dword ptr [Player_energyset_enable], #0
je Player_energyset_exit
mov rbx, [rsi+80]
test rbx, rbx
je Player_energyset_exit
mov [rbx+3c], (float)1
Player_energyset_exit:

cmp dword ptr [Player_invincibilityset_enable], #0
je Player_invincibilityset_exit
fld [rsi+1a0]
fstp [rsi+284]
Player_invincibilityset_exit:

mov rax, [Player_temp1]
mov rbx, [Player_temp2]
mov rcx, [Player_temp3]
mov rdx, [Player_temp4]


Player_originalcode:
db F3 0F 10 86 18 02 00 00
//movss xmm0,[rsi+00000218]


Player_exit:
jmp Player_returnhere


Player_searchedAOB:
Player_savedAOB:
jmp Player_newmem
nop
nop
nop
Player_returnhere:


[DISABLE]
Player_savedAOB:
db F3 0F 10 86 18 02 00 00
//movss xmm0,[rsi+00000218]

unregistersymbol(Player_savedAOB)

dealloc(Player_newmem)
dealloc(Player_temp1)
dealloc(Player_temp2)
dealloc(Player_temp3)
dealloc(Player_temp4)
dealloc(Player_temp5)"""

