[[cheat]]
id = "ignore-damage-immortal"
name = "Ignore Damage / Immortal"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
//Send
[ENABLE]

aobscanmodule(immortal,GameAssembly.dll,0F B6 81 DC 00 00 00 C3)
alloc(newmem,$1000,immortal)
label(code return)

newmem:
mov [rcx+DC],1

code:
  movzx eax,byte ptr [rcx+000000DC]
  jmp return

immortal:
  jmp newmem
  nop 2
return:
registersymbol(immortal)

[DISABLE]

immortal:
  db 0F B6 81 DC 00 00 00

unregistersymbol(*)
dealloc(*)"""

