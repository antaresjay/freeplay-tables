aobscanmodule(Call_Function,GameAssembly.dll,48 8B 41 28 4C 8B F2) // should be unique
alloc(newmem,$1000,Call_Function)

label(code)
label(return)

label(AddItems)
registersymbol(AddItems)
define(CallAddItem,BackPackManager.PickUp)
define(CreateStruct,GameAssembly.mono_method_get_class+60) // BackPackManager.AddItem
define(CallAddWeapon,BackPackManager.AddWeaponWithSkill)
define(CallAddArmor,BackPackManager.AddArmor)
define(CallAddAccessories,BackPackManager.AddAccessories)
define(CallAddheadWear,BackPackManager.AddHeadwear)
define(CallAddMagic,BackPackManager.AddMagic)
define(CallAddSeal,BackPackManager.AddSeal)
define(CallAddSkill,BackPackManager.AddSkill)

alloc(EnableCallItems,16)
registersymbol(EnableCallItems)

EnableCallItems:
dd 0
alloc(AddItemsData,100)
registersymbol(AddItemsData)
AddItemsData:
dd 3EA
AddItemsData+30:
dd 1
alloc(SpwanStruct,100)
registersymbol(SpwanStruct)

newmem:

code:
  mov rax,[rcx+28]
  mov r14,rdx
  mov [rbp+28],rbx
  mov [rbp+30],rsi
  call AddItems
  jmp return
newmem+100:
AddItems:
  push rax
  push rbx
  push rcx
  push rdx
  push rsi
  push rdi
  push rbp
  push r8
  push r9
  push r10
  push r11
  push r12
  push r13
  push r14
  push r15
  sub rsp,0x60

  mov rcx,GameAssembly.dll+42DF2F0
  test rcx,rcx
  je skip_call
  mov rcx,[rcx]
  test rcx,rcx
  je skip_call
  mov rcx,[rcx+B8]
  test rcx,rcx
  je skip_call
  mov rcx,[rcx+08]
  test rcx,rcx
  je skip_call
  mov rbp,rcx
  cmp [EnableCallItems],1
  jne Skip1
  mov [EnableCallItems],0
  mov rcx,GameAssembly.dll+433FD40
  mov rcx,[rcx]
  test rcx,rcx
  je skip_call
  call CreateStruct
  mov rbx,rax
  mov rcx,GameAssembly.dll+43113A0
  mov rcx,[rcx]
  test rcx,rcx
  je skip_call
  call CreateStruct
  mov [rbx+10],rax//第一层ItemInfo
  call CreateStruct
  mov [rbx+18],rax
  call CreateStruct
  mov [rbx+20],rax
  call CreateStruct
  mov [rbx+28],rax
  call CreateStruct
  mov [rbx+30],rax
  call CreateStruct
  mov [rbx+38],rax
  call CreateStruct
  mov [rbx+40],rax
  call CreateStruct
  mov [rbx+48],rax

  ///////// ItemInfo ///////////
  mov rax,[rbx+10]
  mov [rax+18],1
  mov [rax+1C],1
  mov [SpwanStruct+18],4
  mov rdx,[AddItemsData]
  mov [SpwanStruct+20],rdx//ID
  mov rdx,[AddItemsData+30]//Num
  mov [SpwanStruct+24],rdx
  mov rdx,SpwanStruct
  mov [rax+10],rdx
  ///////////////////////
  mov rax,SpwanStruct+50
  mov rdx,[rbx+18]
  mov [rdx+10],rax
  mov rdx,[rbx+20]
  mov [rdx+10],rax
  mov rdx,[rbx+28]
  mov [rdx+10],rax
  mov rdx,[rbx+30]
  mov [rdx+10],rax
  mov rdx,[rbx+38]
  mov [rdx+10],rax
  mov rdx,[rbx+40]
  mov [rdx+10],rax
  mov rdx,[rbx+48]
  mov [rdx+10],rax

  mov rbx,rbx
  mov rdx,rbx
  xor r9d,r9d
  xor r8d,r8d
  mov rcx,rbp
  mov rbp,rdx
  call CallAddItem
Skip1:
  mov rcx,rbp
  cmp [EnableCallItems+4],1 //武器
  jne Skip2
  mov [EnableCallItems+4],0
  mov rdx,[AddItemsData+4]
  call CallAddWeapon

Skip2:
  cmp [EnableCallItems+8],1 //衣装
  jne Skip3
  mov [EnableCallItems+8],0
  mov rdx,[AddItemsData+8]
  call CallAddArmor

Skip3:
  cmp [EnableCallItems+C],1 //饰品
  jne Skip4
  mov [EnableCallItems+C],0
  mov rdx,[AddItemsData+C]
  call CallAddAccessories

 Skip4:
  cmp [EnableCallItems+10],1 //头饰
  jne Skip5
  mov [EnableCallItems+10],0
  mov rdx,[AddItemsData+10]
  call CallAddheadWear

Skip5:
  cmp [EnableCallItems+14],1 //术士
  jne Skip6
  mov [EnableCallItems+14],0
  mov rdx,[AddItemsData+14]
  call CallAddMagic

Skip6:
  cmp [EnableCallItems+18],1 //刻印
  jne Skip7
  mov [EnableCallItems+18],0
  mov rdx,[AddItemsData+18]
  call CallAddSeal

Skip7:
  cmp [EnableCallItems+2C],1 //技能
  jne skip_call
  mov [EnableCallItems+2C],0
  mov rdx,[AddItemsData+2C]
  call CallAddSkill


skip_call:
  add rsp,0x60
  pop r15
  pop r14
  pop r13
  pop r12
  pop r11
  pop r10
  pop r9
  pop r8
  pop rbp
  pop rdi
  pop rsi
  pop rdx
  pop rcx
  pop rbx
  pop rax
  ret

Call_Function:
  jmp far newmem
  nop
return:
