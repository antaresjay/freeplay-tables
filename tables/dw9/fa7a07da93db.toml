[[cheat]]
id = "teleport-to-waypoint"
name = "Teleport to Waypoint"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(_AobTeleport,DW9.exe,90 04 00 00 4C 8D 4C 24 70 0F 28 00 8B C2)
aobscanmodule(_AobTeleportToWaypoint,DW9.exe,25 01 00 00 F3 0F 10 87 CC 0B 01 00)
alloc(newmem,$1000,DW9.exe)
alloc(newmem2,$1000,DW9.exe)
alloc(base,256)
alloc(WaypointBase,256)

label(XCord_Waypoint)
label(ZCord_Waypoint)
label(Load_Waypoint)
label(LoadCords_Waypoint)
label(basepos)
label(code)
label(code2)
label(return)
label(return2)

registersymbol(XCord_Waypoint)
registersymbol(ZCord_Waypoint)
registersymbol(LoadCords_Waypoint)
registersymbol(basepos)

base:
LoadCords_Waypoint:
dd 0

basepos:
dd 0

newmem:
cmp byte ptr [LoadCords_Waypoint],1
je Load_Waypoint
jmp code

Load_Waypoint:
mov byte ptr [LoadCords_Waypoint],0
push rbx
mov rbx,[XCord_Waypoint]
mov [rax],rbx
mov rbx,[ZCord_Waypoint]
mov [rax+8],rbx
pop rbx
jmp code

code:
  mov [basepos],rax
  movaps xmm0,[rax]
  mov eax,edx
  jmp return

_AobTeleport+09:
  jmp newmem
return:
registersymbol(_AobTeleport)
/////////////////// Teleport to Waypoint ///////////////////
///////////////////////////////////////////////////////////
WaypointBase:
XCord_Waypoint:
dd 0
ZCord_Waypoint:
dd 0


newmem2:
cmp byte ptr [rdi+00010BDC],01
jne @f
push rcx
mov rcx,[rdi+00010BCC]
mov [XCord_Waypoint],rcx
mov rcx,[rdi+00010BD0]
mov [ZCord_Waypoint],rcx
pop rcx
jmp code2

code2:
  movss xmm0,[rdi+00010BCC]
  jmp return2

_AobTeleportToWaypoint+04:
  jmp newmem2
  nop
  nop
  nop
return2:
registersymbol(_AobTeleportToWaypoint)

[DISABLE]
_AobTeleport+09:
  db 0F 28 00 8B C2

_AobTeleportToWaypoint+04:
  db F3 0F 10 87 CC 0B 01 00

unregistersymbol(_AobTeleport)
unregistersymbol(_AobTeleportToWaypoint)
unregistersymbol(XCord_Waypoint)
unregistersymbol(ZCord_Waypoint)
unregistersymbol(LoadCords_Waypoint)
unregistersymbol(basepos)
dealloc(newmem)
dealloc(newmem2)
dealloc(base)
dealloc(WaypointBase)"""

