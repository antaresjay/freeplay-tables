[[cheat]]
id = "health"
name = "Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(_AobHealth,DW9.exe,05 * * * * F3 0F 10 40 10)
alloc(newmem,$1000,DW9.exe)

label(code)
label(return)
label(Health)
registersymbol(Health)

newmem:

code:
  cmp rdx,00
  jne @f
  mov [Health],rax
@@:
  movss xmm0,[rax+10]
  jmp return

Health:
 dd 0

_AobHealth+05:
  jmp newmem
return:
registersymbol(_AobHealth)

[DISABLE]

_AobHealth+05:
  db F3 0F 10 40 10

unregistersymbol(_AobHealth)
unregistersymbol(Health)
dealloc(newmem)"""

