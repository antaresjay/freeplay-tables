[[cheat]]
id = "modify-weapon-damage"
name = "Modify Weapon Damage"
category = "combat"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(weapon_damage,2048)
registersymbol(weapon_damage)

weapon_damage:
dd 0

weapon_damage+4:
dd (Float)1000000

alloc(newmem,2048)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
push eax
mov eax,[Fallout3.exe+C7A104]
test eax,eax
je originalcode
add eax,9C
cmp eax,[esp+24]
je exit
jmp originalcode

originalcode:
pop eax
fild dword ptr [esp+24]
jmp Fallout3.exe+183A78

exit:
pop eax
fild dword ptr [esp+24]
fadd dword ptr [weapon_damage]
fmul dword ptr [weapon_damage+4]
jmp Fallout3.exe+183A78

"Fallout3.exe"+183A6B:
jmp newmem
nop

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
dealloc(weapon_damage)
unregistersymbol(weapon_damage)

dealloc(newmem)
"Fallout3.exe"+183A6B:
fild dword ptr [esp+24]
jmp Fallout3.exe+183A78
//Alt: db DB 44 24 24 EB 07"""

