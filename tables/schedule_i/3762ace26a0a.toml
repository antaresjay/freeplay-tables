type = "script"
source = """
[ENABLE]

aobscanmodule(Growth_AOB,GameAssembly.dll,F3 0F 58 73 28 48 8B 03) 
alloc(newmem,$1000,Growth_AOB)

label(code)
label(return)

newmem:

code:
addss xmm6,[rbx+28]
push (float)1
fld [rsp]
movss xmm6,[rsp]
fstp st(0)
add rsp,8
jmp return

Growth_AOB:
jmp newmem
return:
registersymbol(Growth_AOB)

[DISABLE]

Growth_AOB:
db F3 0F 58 73 28

unregistersymbol(Growth_AOB)
dealloc(newmem)"""
