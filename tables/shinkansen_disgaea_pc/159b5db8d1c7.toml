id = "item-stats-base-address-scan-initialization-activate-this-first"
name = "Item Stats Base Address Scan Initialization (Activate This First)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(itemstats_basepointer)
registersymbol(itemstats_update_enable)
registersymbol(itemstats_set_enable)

alloc(itemstats_basepointer, 4)
alloc(itemstats_update_enable, 4)
alloc(itemstats_set_enable, 4)


[DISABLE]
unregistersymbol(itemstats_basepointer)
unregistersymbol(itemstats_update_enable)
unregistersymbol(itemstats_set_enable)

dealloc(itemstats_basepointer)
dealloc(itemstats_update_enable)
dealloc(itemstats_set_enable)"""

[[cheat]]
id = "item-stats-base-address-scan-to-update-view-item"
name = "Item Stats Base Address Scan (To Update: View Item)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(itemstats_savedAOB)
label(itemstats_returnhere)
label(itemstats_originalcode)
label(itemstats_exit)

label(itemstats_update_exit)
label(itemstats_set_exit)

registersymbol(itemstats_savedAOB)

//00A6C8D1 - F3 0F11 04 24         - movss [esp],xmm0
//00A6C8D6 - E8 35A40500           - call 00AC6D10
//00A6C8DB - 0FBF 47 7A            - movsx eax,word ptr [edi+7A]
//00A6C8DF - 83 C4 24              - add esp,24
//00A6C8E2 - D9 44 24 20           - fld dword ptr [esp+20]
//00A6C8E6 - B9 19BF0000           - mov ecx,0000BF19
//00A6C8EB - DC 05 C0F1B400        - fadd qword ptr [00B4F1C0] : [(double)10.5000]
aobscan(itemstats_searchedAOB, 0F BF 47 7A 83 C4 24 D9 44 24 20)

alloc(itemstats_newmem, 2048, itemstats_searchedAOB)


itemstats_newmem:
cmp dword ptr [itemstats_update_enable], #0
je itemstats_update_exit
mov [itemstats_basepointer], edi
itemstats_update_exit:

cmp dword ptr [itemstats_set_enable], #0
je itemstats_set_exit
mov [edi+48], #9999999
mov [edi+4c], #9999999
mov [edi+50], #9999999
mov [edi+54], #9999999
mov [edi+58], #9999999
mov [edi+5c], #9999999
mov [edi+60], #9999999
mov [edi+64], #9999999
mov byte ptr [edi+7e], #0
itemstats_set_exit:


itemstats_originalcode:
db 0F BF 47 7A 83 C4 24
//movsx eax,word ptr [edi+7A]
//add esp,24


itemstats_exit:
jmp itemstats_returnhere


itemstats_searchedAOB:
itemstats_savedAOB:
jmp itemstats_newmem
nop
nop
itemstats_returnhere:


[DISABLE]
itemstats_savedAOB:
db 0F BF 47 7A 83 C4 24
//movsx eax,word ptr [edi+7A]
//add esp,24

unregistersymbol(itemstats_savedAOB)

dealloc(itemstats_newmem)"""

