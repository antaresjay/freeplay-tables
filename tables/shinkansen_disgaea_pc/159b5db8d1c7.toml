[[cheat]]
id = "battle-stats-base-address-scan-to-update-view-battle"
name = "Battle Stats Base Address Scan (To Update: View Battle)"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(battlestats_savedAOB)
label(battlestats_returnhere)
label(battlestats_originalcode)
label(battlestats_exit)

label(battlestats_update_exit)
label(battlestats_set_exit)

registersymbol(battlestats_savedAOB)

//00A2A0AB - C7 45 EC 00000000     - mov [ebp-14],00000000
//00A2A0B2 - C7 45 F0 00000000     - mov [ebp-10],00000000
//00A2A0B9 - C7 45 F4 0000803F     - mov [ebp-0C],3F800000
//00A2A0C0 - 80 BE 68020000 00     - cmp byte ptr [esi+00000268],00
//00A2A0C7 - 0F84 DC000000         - je 00A2A1A9
// Accesses moved flag
//00A2A0CD - 80 BE 02040000 00     - cmp byte ptr [esi+00000402],00
//00A2A0D4 - 0F84 CF000000         - je 00A2A1A9
//00A2A0DA - 80 BE 03040000 00     - cmp byte ptr [esi+00000403],00
//00A2A0E1 - 0F84 C2000000         - je 00A2A1A9
aobscan(battlestats_searchedAOB, C7 45 F4 00 00 80 3F 80 BE 68 02 00 00 00)

alloc(battlestats_newmem, 2048, battlestats_searchedAOB)


battlestats_newmem:
cmp dword ptr [battlestats_update_enable], #0
je battlestats_update_exit
mov [battlestats_basepointer], esi
battlestats_update_exit:

cmp dword ptr [battlestats_set_enable], #0
je battlestats_set_exit
mov word ptr [esi+402], #0
battlestats_set_exit:


battlestats_originalcode:
db C7 45 F4 00 00 80 3F
//mov [ebp-0C],3F800000


battlestats_exit:
jmp battlestats_returnhere


battlestats_searchedAOB:
battlestats_savedAOB:
jmp battlestats_newmem
nop
nop
battlestats_returnhere:


[DISABLE]
battlestats_savedAOB:
db C7 45 F4 00 00 80 3F
//mov [ebp-0C],3F800000

unregistersymbol(battlestats_savedAOB)

dealloc(battlestats_newmem)"""

