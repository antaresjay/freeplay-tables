[[cheat]]
id = "player-stats-base-address-scan-initialization-activate-this-first"
name = "Player Stats Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(playerstats_basepointer)
registersymbol(playerstats_update_enable)
registersymbol(playerstats_set_enable)
registersymbol(playerstats_playtimeset_enable)
registersymbol(playerstats_hospitalset_enable)
registersymbol(playerstats_hlset_enable)
registersymbol(playerstats_shopset_enable)

alloc(playerstats_basepointer, 4)
alloc(playerstats_update_enable, 4)
alloc(playerstats_set_enable, 4)
alloc(playerstats_playtimeset_enable, 4)
alloc(playerstats_hospitalset_enable, 4)
alloc(playerstats_hlset_enable, 4)
alloc(playerstats_shopset_enable, 4)


[DISABLE]
unregistersymbol(playerstats_basepointer)
unregistersymbol(playerstats_update_enable)
unregistersymbol(playerstats_set_enable)
unregistersymbol(playerstats_playtimeset_enable)
unregistersymbol(playerstats_hospitalset_enable)
unregistersymbol(playerstats_hlset_enable)
unregistersymbol(playerstats_shopset_enable)

dealloc(playerstats_basepointer)
dealloc(playerstats_update_enable)
dealloc(playerstats_set_enable)
dealloc(playerstats_playtimeset_enable)
dealloc(playerstats_hospitalset_enable)
dealloc(playerstats_hlset_enable)
dealloc(playerstats_shopset_enable)"""

[[cheat]]
id = "player-stats-base-address-scan-to-update-play"
name = "Player Stats Base Address Scan (To Update: Play)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstats_update_exit)
label(playerstats_set_exit)
label(playerstats_playtimeset_exit)
label(playerstats_hospitalset_exit)
label(playerstats_hlset_exit)
label(playerstats_shopset_exit)

registersymbol(playerstats_savedAOB)

//00DCB92C - 83 FA 3C              - cmp edx,3C
//00DCB92F - 56                    - push esi
//00DCB930 - 66 8B 35 3802FA00     - mov si,[00FA0238] : [0002]
//00DCB937 - 0F9D C1               - setge cl
//00DCB93A - 8B C1                 - mov eax,ecx
//00DCB93C - C1 E0 04              - shl eax,04
//00DCB93F - 2B C1                 - sub eax,ecx
//00DCB941 - F7 D8                 - neg eax
//00DCB943 - 57                    - push edi
//00DCB944 - BF 0F270000           - mov edi,0000270F
aobscan(playerstats_searchedAOB, 0F 9D C1 8B C1 C1 E0 04 2B C1 F7 D8)

alloc(playerstats_newmem, 2048, playerstats_searchedAOB)
alloc(playerstats_temp1, 4, playerstats_searchedAOB)
alloc(playerstats_temp2, 4, playerstats_searchedAOB)


playerstats_newmem:
mov [playerstats_temp1], ebx

mov ebx, [playerstats_savedAOB-7]

cmp dword ptr [playerstats_update_enable], #0
je playerstats_update_exit
mov [playerstats_basepointer], ebx
playerstats_update_exit:

cmp dword ptr [playerstats_set_enable], #0
je playerstats_set_exit
playerstats_set_exit:

cmp dword ptr [playerstats_playtimeset_enable], #0
je playerstats_playtimeset_exit
mov [ebx], #0
playerstats_playtimeset_exit:

cmp dword ptr [playerstats_hospitalset_enable], #0
je playerstats_hospitalset_exit
mov [ebx+248], #0
mov [ebx+24c], #0
mov [ebx+250], #0
mov [ebx+254], #0
mov [ebx+258], #0
mov [ebx+25c], #0
mov [ebx+260], #0
mov [ebx+264], #0
mov byte ptr [ebx+268], #0
mov [ebx+2a0], #999999999
mov [ebx+2a8], #999999999
mov [ebx+44818], #999999999
playerstats_hospitalset_exit:

cmp dword ptr [playerstats_hlset_enable], #0
je playerstats_hlset_exit
mov [ebx+288], #999999999
playerstats_hlset_exit:

cmp dword ptr [playerstats_shopset_enable], #0
je playerstats_shopset_exit
mov [ebx+290], #999999999
mov byte ptr [ebx+44853], #99
mov byte ptr [ebx+44854], #99
playerstats_shopset_exit:

mov ebx, [playerstats_temp1]


playerstats_originalcode:
db 8B C1 C1 E0 04
//setge cl
//shl eax,04


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB + 3:
playerstats_savedAOB:
jmp playerstats_newmem
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
db 8B C1 C1 E0 04
//setge cl
//shl eax,04

unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)
dealloc(playerstats_temp1)
dealloc(playerstats_temp2)"""

