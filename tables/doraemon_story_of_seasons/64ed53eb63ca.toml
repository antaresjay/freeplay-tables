[[cheat]]
id = "make-max-stack-size-custom-item-stack-size-default-500"
name = "Make Max Stack Size Custom Item Stack Size (Default 500)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

///
aobscan(MaxStackSizePtr,04 00 00 00 08 00 00 00 03 00 00 00 1B 00 00 00 ?? ?? 00 00 E7 03 00 00)
registersymbol(MaxStackSizePtr)
  
MaxStackSizePtr+10:
 readmem(CustomItemStackSize,4)
  
[DISABLE]

MaxStackSizePtr+10:
 db 63 00 00 00

unregistersymbol(MaxStackSizePtr)"""

