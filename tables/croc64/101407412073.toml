[[cheat]]
id = "jump-height"
name = "Jump Height"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
aobscanmodule(JumpHeight,$process,01 96 B4 07 00 00 41)
alloc(newmem,$1111,JumpHeight)
label(code return)
registersymbol(JumpHeight)
newmem:
  add [rsi+7b4],(int)200
code:
  add [rsi+7b4],edx
  jmp return
JumpHeight:
  jmp newmem
  nop
return:
[DISABLE]
dealloc(newmem)
unregistersymbol(JumpHeight)
JumpHeight:
  db 01 96 B4 07 00 00"""

