[[cheat]]
id = "playerbase-base-address-scan-initialization-activate-this-first"
name = "PlayerBase Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(PlayerBase_basepointer)
registersymbol(PlayerBase_update_enable)
registersymbol(PlayerBase_set_enable)
registersymbol(PlayerBase_invulnerabilityset_enable)
registersymbol(PlayerBase_goldset_enable)
registersymbol(PlayerBase_speedset_enable)
registersymbol(PlayerBase_ammoset_enable)

alloc(PlayerBase_basepointer, 8)
alloc(PlayerBase_update_enable, 4)
alloc(PlayerBase_set_enable, 4)
alloc(PlayerBase_invulnerabilityset_enable, 4)
alloc(PlayerBase_goldset_enable, 4)
alloc(PlayerBase_speedset_enable, 4)
alloc(PlayerBase_ammoset_enable, 4)


[DISABLE]
unregistersymbol(PlayerBase_basepointer)
unregistersymbol(PlayerBase_update_enable)
unregistersymbol(PlayerBase_set_enable)
unregistersymbol(PlayerBase_invulnerabilityset_enable)
unregistersymbol(PlayerBase_goldset_enable)
unregistersymbol(PlayerBase_speedset_enable)
unregistersymbol(PlayerBase_ammoset_enable)

dealloc(PlayerBase_basepointer)
dealloc(PlayerBase_update_enable)
dealloc(PlayerBase_set_enable)
dealloc(PlayerBase_invulnerabilityset_enable)
dealloc(PlayerBase_goldset_enable)
dealloc(PlayerBase_speedset_enable)
dealloc(PlayerBase_ammoset_enable)"""

[[cheat]]
id = "playerbase-base-address-scan-to-activate-play-level-to-update-play-level"
name = "PlayerBase Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(PlayerBase_savedAOB)
label(PlayerBase_returnhere)
label(PlayerBase_originalcode)
label(PlayerBase_exit)

label(PlayerBase_update_exit)
label(PlayerBase_set_exit)
label(PlayerBase_invulnerabilityset_exit)
label(PlayerBase_goldset_exit)
label(PlayerBase_speedset_exit)
label(PlayerBase_ammoset_exit)
label(PlayerBase_ammoset_entry)

registersymbol(PlayerBase_savedAOB)

//2D1B6972 - 41 FF D3              - call r11d
//2D1B6975 - 48 83 C4 20           - add rsp,20
// Redneck.PlayerClasses:PlayerBase:Update+39
//2D1B6979 - 48 8B 80 98000000     - mov rax,[rax+00000098]
//2D1B6980 - 48 8B C8              - mov rcx,rax
//2D1B6983 - 83 39 00              - cmp dword ptr [rcx],00
//2D1B6986 - 0FB6 80 A8000000      - movzx eax,byte ptr [rax+000000A8]
//2D1B698D - 85 C0                 - test eax,eax
//2D1B698F - 75 18                 - jne 2D1B69A9
//2D1B6991 - 48 8B CE              - mov rcx,rsi
//2D1B6994 - 48 83 EC 20           - sub rsp,20
aobscan(PlayerBase_searchedAOB, 48 8B 80 98 00 00 00 48 8B C8 83 39 00 0F B6 80 A8 00 00 00 85 C0 75 18)

alloc(PlayerBase_newmem, 2048, PlayerBase_searchedAOB)
alloc(PlayerBase_temp1, 8, PlayerBase_searchedAOB)
alloc(PlayerBase_temp2, 8, PlayerBase_searchedAOB)
alloc(PlayerBase_temp3, 8, PlayerBase_searchedAOB)
alloc(PlayerBase_temp4, 8, PlayerBase_searchedAOB)
alloc(PlayerBase_temp5, 8, PlayerBase_searchedAOB)


PlayerBase_newmem:
mov [PlayerBase_temp1], rax
mov [PlayerBase_temp2], rbx
mov [PlayerBase_temp3], rcx
mov [PlayerBase_temp4], rdx

cmp dword ptr [PlayerBase_update_enable], #0
je PlayerBase_update_exit
mov [PlayerBase_basepointer], rsi
PlayerBase_update_exit:

cmp dword ptr [PlayerBase_set_enable], #0
je PlayerBase_set_exit
PlayerBase_set_exit:

cmp dword ptr [PlayerBase_invulnerabilityset_enable], #0
je PlayerBase_invulnerabilityset_exit
mov byte ptr [rsi+74], #1
PlayerBase_invulnerabilityset_exit:

cmp dword ptr [PlayerBase_goldset_enable], #0
je PlayerBase_goldset_exit
// Decrypted value = xor FFFFFFFF[rsi+214] FFFFFFFF[rsi+218]
movsxd rax, [rsi+214]
mov rcx, #9999999
mov [PlayerBase_temp5], rcx
movsxd rcx, [PlayerBase_temp5]
xor rax, rcx
mov [rsi+218], rax
PlayerBase_goldset_exit:

cmp dword ptr [PlayerBase_speedset_enable], #0
je PlayerBase_speedset_exit
mov rbx, [rsi+c0]
test rbx, rbx
je PlayerBase_speedset_exit
mov [rbx+100], (float)3
PlayerBase_speedset_exit:

cmp dword ptr [PlayerBase_ammoset_enable], #0
je PlayerBase_ammoset_exit
mov rbx, [rsi+158]
test rbx, rbx
je PlayerBase_ammoset_exit
mov rbx, [rbx+70]
test rbx, rbx
je PlayerBase_ammoset_exit
mov rbx, [rbx+28]
test rbx, rbx
je PlayerBase_ammoset_exit
mov rcx, [rbx+18]
test rcx, rcx
je PlayerBase_ammoset_exit
PlayerBase_ammoset_entry:
mov [rbx+rdx*4+20], #999
inc rdx
cmp rcx, rdx
je PlayerBase_ammoset_exit
jmp PlayerBase_ammoset_entry
PlayerBase_ammoset_exit:

mov rax, [PlayerBase_temp1]
mov rbx, [PlayerBase_temp2]
mov rcx, [PlayerBase_temp3]
mov rdx, [PlayerBase_temp4]


PlayerBase_originalcode:
db 48 8B 80 98 00 00 00
//mov rax,[rax+00000098]


PlayerBase_exit:
jmp PlayerBase_returnhere


PlayerBase_searchedAOB:
PlayerBase_savedAOB:
jmp PlayerBase_newmem
nop
nop
PlayerBase_returnhere:


[DISABLE]
PlayerBase_savedAOB:
db 48 8B 80 98 00 00 00
//mov rax,[rax+00000098]

unregistersymbol(PlayerBase_savedAOB)

dealloc(PlayerBase_newmem)
dealloc(PlayerBase_temp1)
dealloc(PlayerBase_temp2)
dealloc(PlayerBase_temp3)
dealloc(PlayerBase_temp4)
dealloc(PlayerBase_temp5)"""

