alloc(Character_energyset_enable, 4)
alloc(Character_attributesset_enable, 4)
alloc(Character_miscattributesset_enable, 4)
alloc(Character_resourcesset_enable, 4)
alloc(Character_crucibleset_enable, 4)
alloc(Character_invincibleset_enable, 4)
alloc(Character_lightradiusset_enable, 4)


[DISABLE]
unregistersymbol(Character_basepointer)
unregistersymbol(Character_update_enable)
unregistersymbol(Character_set_enable)
unregistersymbol(Character_healthset_enable)
unregistersymbol(Character_energyset_enable)
unregistersymbol(Character_attributesset_enable)
unregistersymbol(Character_miscattributesset_enable)
unregistersymbol(Character_resourcesset_enable)
unregistersymbol(Character_crucibleset_enable)
unregistersymbol(Character_invincibleset_enable)
unregistersymbol(Character_lightradiusset_enable)

dealloc(Character_basepointer)
dealloc(Character_update_enable)
dealloc(Character_set_enable)
dealloc(Character_healthset_enable)
dealloc(Character_energyset_enable)
dealloc(Character_attributesset_enable)
dealloc(Character_miscattributesset_enable)
dealloc(Character_resourcesset_enable)
dealloc(Character_crucibleset_enable)
dealloc(Character_invincibleset_enable)
dealloc(Character_lightradiusset_enable)"""

[[cheat]]
id = "character-base-address-scan-to-activate-play-level-to-update-play-level"
name = "Character Base Address Scan (To Activate: Play Level, To Update: Play Level)"
category = "game"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(Character_savedAOB)
label(Character_returnhere)
label(Character_originalcode)
label(Character_exit)

label(Character_update_exit)
label(Character_set_exit)
label(Character_healthset_exit)
label(Character_energyset_exit)
label(Character_attributesset_exit)
label(Character_miscattributesset_exit)
label(Character_resourcesset_exit)
label(Character_crucibleset_exit)
label(Character_invincibleset_exit)
label(Character_lightradiusset_exit)

registersymbol(Character_savedAOB)

//Game.GAME::Character::GetCurrentLifeInt - F3 0F10 81 A0080000   - movss xmm0,[ecx+000008A0]
//Game.GAME::Character::GetCurrentLifeInt+8- 0F57 C9               - xorps xmm1,xmm1
//Game.GAME::Character::GetCurrentLifeInt+B- F3 0F5F C1            - maxss xmm0,xmm1
//Game.GAME::Character::GetCurrentLifeInt+F- 0F2F 05 D0921B5E      - comiss xmm0,[Game.GAME::WeaponArmor_Offhand::`vftable'+9F0]
aobscan(Character_searchedAOB, F3 0F 10 81 A0 08 00 00 0F 57 C9)

alloc(Character_newmem, 2048, Character_searchedAOB)
alloc(Character_temp1, 4, Character_searchedAOB)


Character_newmem:
mov [Character_temp1], ebx

cmp dword ptr [Character_update_enable], #0
je Character_update_exit
mov [Character_basepointer], ecx
Character_update_exit:

cmp dword ptr [Character_set_enable], #0
je Character_set_exit
Character_set_exit:

cmp dword ptr [Character_healthset_enable], #0
je Character_healthset_exit
fld [ecx+d00]
fstp [ecx+8a0]
fld [ecx+914]
fstp [ecx+8b4]
Character_healthset_exit:

cmp dword ptr [Character_energyset_enable], #0
je Character_energyset_exit
fld [ecx+cfc]
fstp [ecx+8b8]
Character_energyset_exit:

cmp dword ptr [Character_attributesset_enable], #0
je Character_attributesset_exit
mov [ecx+8f0], (float)9999999
mov [ecx+8f4], (float)9999999
mov [ecx+8f8], (float)9999999
Character_attributesset_exit:

cmp dword ptr [Character_miscattributesset_enable], #0
je Character_miscattributesset_exit
mov [ecx+904], (float)9999999
mov [ecx+908], (float)9999999
mov [ecx+91c], (float)9999999
mov [ecx+920], (float)9999999
mov [ecx+924], (float)9999999
mov [ecx+928], (float)9999999
mov [ecx+92c], (float)9999
mov [ecx+930], (float)9999
mov [ecx+934], (float)9999
mov [ecx+938], (float)9999
mov [ecx+93c], (float)9999999
mov [ecx+940], (float)9999999
mov [ecx+944], (float)9999999
mov [ecx+948], (float)9999999
//mov [ecx+9b8], (float)9999999
Character_miscattributesset_exit:

cmp dword ptr [Character_resourcesset_enable], #0
je Character_resourcesset_exit
mov [ecx+d50], #999999999
mov [ecx+d58], #999999999
Character_resourcesset_exit:

cmp dword ptr [Character_crucibleset_enable], #0
je Character_crucibleset_exit
mov [ecx+ed8], #60000
Character_crucibleset_exit:

cmp dword ptr [Character_invincibleset_enable], #0
je Character_invincibleset_exit
mov byte ptr [ecx+126c], #1
mov byte ptr [ecx+126d], #1
mov byte ptr [ecx+126e], #1
Character_invincibleset_exit:

cmp dword ptr [Character_lightradiusset_enable], #0
je Character_lightradiusset_exit
mov [ecx+1254], (float)9999999
Character_lightradiusset_exit:

mov ebx, [Character_temp1],


Character_originalcode:
db F3 0F 10 81 A0 08 00 00
//movss xmm0,[ecx+000008A0]


Character_exit:
jmp Character_returnhere


Character_searchedAOB:
Character_savedAOB:
jmp Character_newmem
nop
nop
nop
Character_returnhere:


[DISABLE]
Character_savedAOB:
db F3 0F 10 81 A0 08 00 00
//movss xmm0,[ecx+000008A0]

unregistersymbol(Character_savedAOB)

dealloc(Character_newmem)
dealloc(Character_temp1)"""

