label(code)
label(return)
label(Health)
label(Stamina)
label(Ammo)
label(NoReload)

newmem:
push rdi
mov rdi,[rcx+00000160]
cmp rdi,1000000
jna code
mov rdi,[rdi+00000020]
cmp rdi,1000000
jna code

cmp byte ptr [rcx+00000008],48
jne code
cmp [Health],0
je LabelStamina
fld [rdi+000009DC]
fstp [rdi+000009B0]

LabelStamina:
cmp [Stamina],0
je LabelAmmo
mov [rdi+000009C0],(float)125

LabelAmmo:
mov rdi,[rcx+00000020]
cmp rdi,1000000
jna code
mov rdi,[rdi+00000998]
cmp rdi,1000000
jna code

cmp [Ammo],0
je LabelNoReload
cmp [rdi+000003D0],0
je code
fild [rdi+0000047C]
fistp [rdi+00000470]

LabelNoReload:
cmp [NoReload],0
je code
cmp [rdi+000003D0],0
je code
fild [rdi+0000046C]
fistp [rdi+00000468]
jmp code

code:
  pop rdi
  comiss xmm0,[rcx+00000358]
  jmp return

Health:
dd 0

Stamina:
dd 0

Ammo:
dd 0

NoReload:
dd 0

_AobPlayerBase:
  jmp newmem
  nop
  nop
return:
registersymbol(_AobPlayerBase)
registersymbol(Health)
registersymbol(Stamina)
registersymbol(Ammo)
registersymbol(NoReload)

[DISABLE]

_AobPlayerBase:
  db 0F 2F 81 58 03 00 00

unregistersymbol(_AobPlayerBase)
