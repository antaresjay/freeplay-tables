  je exit
  cmp ecx,#-2
  jne exit
  add eax,ecx
  add eax,[age_temple_adds]

exit:
  mov [esi+28],eax
  pop ecx
  jmp return

notdefined:
  mov [age_pointer_base],esi
  mov [age_pointed],#0
  jmp defined


