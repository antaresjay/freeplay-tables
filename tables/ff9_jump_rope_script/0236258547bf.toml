[[cheat]]
id = "base-activate-before-playing-jump-rope"
name = "BASE: activate before playing jump rope"
category = "movement"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscan(INJECT,01 00 00 49 8D 44 05 20 40 88 08 49 8D 46 01) // should be unique
alloc(newmem,$1000,22CCCAA0)

label(code)
label(return)
globalalloc(_base,4)
newmem:

code:
  mov [_base], rax
  mov [rax],cl
  lea rax,[r14+01]
  jmp return

INJECT+08:
  jmp code
  nop
  nop
return:
registersymbol(INJECT)

[DISABLE]
//code from here till the end of the code will be used to disable the cheat
INJECT+08:
  db 40 88 08 49 8D 46 01

unregistersymbol(INJECT)
dealloc(newmem)"""
