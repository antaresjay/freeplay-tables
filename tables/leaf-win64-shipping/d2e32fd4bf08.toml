[[cheat]]
id = "get-all-faction-resources-on-turn-pass"
name = "Get All Faction Resources On Turn Pass"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
{ Game   : Leaf-Win64-Shipping.exe
  Version: 
  Date   : 2026-06-22
  Author : CannonFodder

  This script does blah blah blah
}

[ENABLE]

aobscanmodule(ResourceTurnPassReadInject,Leaf-Win64-Shipping.exe,44 8B 41 70 44 03 C2) // should be unique
alloc(newmem,$1000,ResourceTurnPassReadInject)

label(code)
label(return)
registersymbol(playerAddr)

newmem:
  push rax
  mov eax, [rcx+40]             // 玩家编号 (0~7)
  cmp eax, 7
  ja skip_store                 // 超出范围则跳过
  push r10
  mov r10, playerAddr           // 取得 playerAddr 的基址（安全 64 位立即数）
  shl rax, 3                    // 索引 * 8
  add r10, rax                  // r10 = playerAddr + 偏移
  mov [r10], rcx                // 存入对应槽位
  pop r10
skip_store:
  pop rax
code:
  mov r8d,[rcx+70]
  add r8d,edx
  jmp return

playerAddr:
  dq 0,0,0,0,0,0,0,0           // 8 个 qword，对应玩家 0~7

ResourceTurnPassReadInject:
  jmp newmem
  nop 2
return:
registersymbol(ResourceTurnPassReadInject)

[DISABLE]

ResourceTurnPassReadInject:
  db 44 8B 41 70 44 03 C2

unregistersymbol(*)
dealloc(newmem)

