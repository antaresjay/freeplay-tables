type = "script"
source = """
{ Game   : Disgaea4gp.exe
  Version: 1.0.68.0 | Windows Store
  Date   : 2020-09-12
  Author : SovietWristwatch.jpg
}

[ENABLE]
aobscanmodule(enableCheats,Disgaea4gp.exe,48 83 B9 10 0D 00 00 00 7F 06)
alloc(newmem,$1000,enableCheats)

label(code)
label(return)
label(enemy)
label(suicidalEnemies)
label(_godmode)
label(_ohk)
label(_suicidalEnemies)

newmem:
  cmp rax,0
  jne enemy
  cmp [_godmode],1
  jne code
  mov [rcx+00000D20],#9999
  mov [rcx+00000D10],#9999
  jmp code

enemy:
  cmp [_suicidalEnemies],1
  je suicidalEnemies
  cmp [_ohk],1
  jne code
  mov [rcx+00000D20],#1
  mov [rcx+00000D10],#1
  jmp code

suicidalEnemies:
  cmp [rcx+00000D20],#9999
  je code
  cmp r10,1
  je code
  cmp r12,1
  je code
  mov [rcx+00000D10],#0

code:
  cmp qword ptr [rcx+00000D10],00
  jmp return

_godmode:
  dd 0

_ohk:
  dd 0

_suicidalEnemies:
  dd 0

enableCheats:
  jmp newmem
  nop 3
return:
registersymbol(enableCheats)
registersymbol(_godmode)
registersymbol(_ohk)
registersymbol(_suicidalEnemies)

[DISABLE]
enableCheats:
