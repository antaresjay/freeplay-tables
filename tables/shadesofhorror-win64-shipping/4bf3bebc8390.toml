[[cheat]]
id = "player-character-ctrl-numpad-1"
name = "Player Character (Ctrl + Numpad 1)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : ShadesOfHorror-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 5.6.0.0
// Game Version      : Build.21324882 (Early Access)
// Script Date       : 2036-04-20


[ENABLE]

aobscanmodule(master,ShadesOfHorror-Win64-Shipping.exe,488BxxFFxxxxxxxxxx88xx4883xxxx5BC3xx488Bxxxx4533xx4885xx410Fxxxx4Cxxxx4Cxxxxxx8B) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,9)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,9)

newmem:
  mov [data],rcx

code:
  readmem(master,9)
  jmp return

master:
  jmp newmem
  nop 4
return:

[DISABLE]

master:
  readmem(masterbkp,9)

unregistersymbol(*)
dealloc(*)"""

