[[cheat]]
id = "health-component-ctrl-numpad-1-activate-script-during-game-play-will-populate-as-ship-loses-health"
name = "Health Component (Ctrl + Numpad 1) {Activate script during game play. Will populate as ship loses health}"
category = "player"
description = ""
hint = ""
type = "script"
source = """
// Game Executable   : CosmicDestroyer.exe
// Author            : ndck76
// Executable Version: 6000.2.6.19914
// Game Version      : v0.8.4.5 (Early Access)
// Script Date       : 2025-12-29


[ENABLE]

aobscanmodule(entity,GameAssembly.dll,488Bxxxx4Dxxxxxxxxxxxx4Dxxxxxxxxxxxx4883xxxx5B49FFxx32) //HealthComponent.CanTakeDamage
alloc(newmem,$1000,entity)
alloc(data2,8)
alloc(entitybkp,11)
registersymbol(data2)
registersymbol(entity)
registersymbol(entitybkp)
label(code)
label(return)

entitybkp:
  readmem(entity,11)

newmem:
  mov [data2],rbx

code:
  readmem(entity,11)
  jmp return

entity:
  jmp newmem
  nop 6
return:

[DISABLE]

entity:
  readmem(entitybkp,11)

unregistersymbol(*)
dealloc(*)"""

