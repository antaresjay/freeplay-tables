[[cheat]]
id = "inf-money"
name = "Inf Money"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
{Stronghold Crusader.exe+C478 - 89 85 D4A01901        - mov [ebp+"Stronghold Crusader.exe"+D9A0D4],eax
   ----ebp+"Stronghold Crusader.exe"+D9A0D4-----
87B                    #18688/25600
7f8                    50004/80007
8C0                    123/00
8C4                    125/00
}
aobscanmodule(inf_money,Stronghold Crusader.exe,8B 44 24 18 5F 5E 89 85) // should be unique
alloc(newmem,$100)

label(code return selection)

newmem:
  cmp [selection],00
  je code
  cmp [selection],01
  jne @f
  //---Initiate player money only
  cmp edi,1
  jne code
  cmp [ebp+"Stronghold Crusader.exe"+D9A0D4],#99999999
  jge code
  mov [esp+18],#99999999
  @@:
  cmp [selection],02
  jne @f
  //--inf money for all
  cmp [ebp+"Stronghold Crusader.exe"+D9A0D4],#99999999
  jge code
  mov [esp+18],#99999999
  //@@:
code:
  mov eax,[esp+18]
  pop edi
  jmp return
selection:
  dd 01
inf_money:
  jmp newmem
return:
registersymbol(inf_money selection)

[DISABLE]

inf_money:
  db 8B 44 24 18 5F

unregistersymbol(inf_money selection)
dealloc(newmem)

