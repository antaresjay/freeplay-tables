[[cheat]]
id = "zero-cargo-hold-weight"
name = "Zero Cargo Hold Weight"
category = "misc"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(noCargoWeight_AOB,Tortuga.exe,8B ?? ?? ?? ?? ?? 8B ?? 2B ?? 88) // should be unique
alloc(newmem,$1000,noCargoWeight_AOB)

label(code)
label(return)

newmem:
  mov [rdi+94],0
code:
  mov eax,[rdi+00000094]
  jmp return

noCargoWeight_AOB:
  jmp newmem
  nop
return:
registersymbol(noCargoWeight_AOB)

[DISABLE]

noCargoWeight_AOB:
  db 8B 87 94 00 00 00

unregistersymbol(noCargoWeight_AOB)
dealloc(newmem)"""
