type = "script"
source = """
// Game Executable   : CW_28_11_2020-Win64-Shipping.exe
// Author            : ndck76
// Executable Version: 4.24.3.0
// Game Version      : v0.0.11
// Script Date       : 2025-12-15


[ENABLE]

aobscanmodule(master,CW_28_11_2020-Win64-Shipping.exe,4Cxxxx4Cxxxxxxxx488Bxx488Bxx41FFxxxxxxxxxx4883xxxx493B) // should be unique
alloc(newmem,$1000,master)
alloc(data,8)
alloc(masterbkp,8)
registersymbol(data)
registersymbol(master)
registersymbol(masterbkp)
label(code)
label(return)

masterbkp:
  readmem(master,8)

newmem:
  mov [data],rdi

code:
  readmem(master,8)
  jmp return

master:
  jmp newmem
  nop 3
return:

[DISABLE]

master:
  readmem(masterbkp,8)

unregistersymbol(*)
dealloc(*)"""

