[[cheat]]
id = "infinite-health"
name = "Infinite Health"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[enable]
alloc(InfiniteHealth,64)
label(HealthRet)
label(NotPlayer)

InfiniteHealth: //[esi+28] == max health
cmp [esi+f0],1//[esi+24],0
jne NotPlayer

movss xmm0,[esi+28] //max health

NotPlayer:
movq [esi],xmm0
mov ecx,[edx+08]
jmp HealthRet

ST.exe+1b8a1e:
jmp InfiniteHealth
db 90 90
HealthRet:
 
[disable]

ST.exe+1b8a1e:
db 66 0f d6 06 8b 4a 08
//movq [esi],xmm0
//mov ecx,[edx+08]

dealloc(InfiniteHealth)"""

