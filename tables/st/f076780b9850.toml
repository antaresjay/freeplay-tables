[[cheat]]
id = "infinite-health-aobscan"
name = "Infinite Health AOBScan"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[enable]
alloc(InfiniteHealth,64)
aobscan(HealthAddress,66 0f d6 06 8b 4a 08 89 44 24 ? 89 4e)
label(HealthAddy)
label(NotPlayer)
registersymbol(HealthAddy)

InfiniteHealth: //[esi] == current health; [esi+28] == max health
cmp [esi+f0],1//alternatives: [esi+4],0; [esi+24],0; [esi+4c],0; [esi+68],0
jne NotPlayer

movss xmm0,[esi+28] //max health

NotPlayer:
movq [esi],xmm0
mov ecx,[edx+8]
jmp HealthAddress+7

HealthAddress:
HealthAddy:
jmp InfiniteHealth
db 90 90
 
[disable]

HealthAddy:
db 66 0f d6 06 8b 4a 08
//movq [esi],xmm0
//mov ecx,[edx+8]

dealloc(InfiniteHealth)
unregistersymbol(HealthAddy)"""

