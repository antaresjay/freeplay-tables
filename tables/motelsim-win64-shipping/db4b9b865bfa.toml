[[cheat]]
id = "unlimited-money"
name = "Unlimited Money"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
//code from here to '[DISABLE]' will be used to enable the cheat
alloc(newmem,2048,"MotelSim-Win64-Shipping.exe"+EDEA13) 
label(returnhere)
label(originalcode)
label(exit)

newmem: //this is allocated memory, you have read,write,execute access
//place your code here

originalcode:
mov [rdx],(float)99999
jae MotelSim-Win64-Shipping.exe+EDEA1B

exit:
jmp returnhere

"MotelSim-Win64-Shipping.exe"+EDEA13:
jmp newmem
nop
returnhere:


 
 
[DISABLE]
