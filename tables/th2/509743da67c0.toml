[[cheat]]
id = "x-infinite-perk-points-and-no-resets-don-t-go-over-maximum-shown-here-in-table-as-it-will-zero-out-benefits"
name = "[X] ← Infinite Perk Points and NO Resets (Don't Go over Maximum Shown here in Table as it will Zero Out benefits)"
category = "resources"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]

aobscanmodule(perklevellimit,TH2.exe,38 84 ?? ?? ?? ?? ?? 7E) // should be unique
alloc(newmem,$100)
aobscanmodule(perkcountone,TH2.exe,0f be 8c 10 ?? ?? ?? ?? 03 f1) // should be unique
alloc(newmem1,$100)
aobscanmodule(perkypointes,TH2.exe,0f be 84 10 ?? ?? ?? ?? 89 45 ?? e8) // should be unique
alloc(newmem3,$100)

label(code)
label(return)
label(code1)
label(return1)
label(code3)
label(return3)

newmem:
  mov al, #126
code:
  cmp [edi+esi+0001F8A1],al
  jmp return

newmem1:
code1:
  mov ecx,0            //counts how many perk points you haver invested
  jmp return1

newmem3:
code3:
  mov eax, 0              //movsx eax,byte ptr [eax+edx+0001F8A1]  //adds up and tests to see how many perk points are spent
  jmp return3

perklevellimit:
  jmp newmem
  nop 2
return:
registersymbol(perklevellimit)

perkcountone:
  jmp newmem1
  nop 3
return1:
registersymbol(perkcountone)

perkypointes:
  jmp newmem3
  nop 3
return3:
registersymbol(perkypointes)

[DISABLE]

perklevellimit:
  db 38 84 37 A1 F8 01 00
