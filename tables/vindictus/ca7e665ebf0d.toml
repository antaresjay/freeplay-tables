[[cheat]]
id = "get-player"
name = "Get Player"
category = "player"
description = ""
hint = ""
type = "script"
source = """
//Send@Sintrix|FearlessRevolution
[ENABLE]

aobscanmodule(BP_Player,Vindictus.exe,4C 8B 08 41 FF 91 50 06 00 00 0F)
alloc(newmem,$1000,BP_Player)
registersymbol(GetPlayer)
label(code return GetPlayer)

newmem:
mov [GetPlayer],rax

code:
  mov r9,[rax]
  call qword ptr [r9+00000650]
  jmp return
//Send@Sintrix|FearlessRevolution
GetPlayer:
dw

BP_Player:
  jmp newmem
  nop 5
return:
registersymbol(BP_Player)
//Send@Sintrix|FearlessRevolution
[DISABLE]

BP_Player:
  db 4C 8B 08 41 FF 91 50 06 00 00

unregistersymbol(*)
dealloc(*)
//Send@Sintrix|FearlessRevolution"""

