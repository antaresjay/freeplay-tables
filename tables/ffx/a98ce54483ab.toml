source = """
[ENABLE]


aobscanmodule(manacd,FFX.exe,8B 80 E8 05 00 00 48)
alloc(newmem,$1000,"FFX.exe"+449DB9)

label(code)
label(return)

newmem:
code:
  fild [rax+000005Ac]
  fistp [rax+000005E8]
  mov eax,[rax+000005E8]
