[[cheat]]
id = "player-stats-base-address-scan-initialization-activate-this-first"
name = "Player Stats Base Address Scan Initialization (Activate This First)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
registersymbol(playerstats_basepointer)
registersymbol(playerstats_update_enable)
registersymbol(playerstats_set_enable)
registersymbol(playerstats_timeset_enable)
registersymbol(playerstats_gilset_enable)
registersymbol(playerstats_blitzballset_enable)
registersymbol(playerstats_partyset_enable)

alloc(playerstats_basepointer, 4)
alloc(playerstats_update_enable, 4)
alloc(playerstats_set_enable, 4)
alloc(playerstats_timeset_enable, 4)
alloc(playerstats_gilset_enable, 4)
alloc(playerstats_blitzballset_enable, 4)
alloc(playerstats_partyset_enable, 4)


[DISABLE]
unregistersymbol(playerstats_basepointer)
unregistersymbol(playerstats_update_enable)
unregistersymbol(playerstats_set_enable)
unregistersymbol(playerstats_timeset_enable)
unregistersymbol(playerstats_gilset_enable)
unregistersymbol(playerstats_blitzballset_enable)
unregistersymbol(playerstats_partyset_enable)

dealloc(playerstats_basepointer)
dealloc(playerstats_update_enable)
dealloc(playerstats_set_enable)
dealloc(playerstats_timeset_enable)
dealloc(playerstats_gilset_enable)
dealloc(playerstats_blitzballset_enable)
dealloc(playerstats_partyset_enable)"""

[[cheat]]
id = "player-stats-base-address-scan-to-update-play-level"
name = "Player Stats Base Address Scan (To Update: Play Level)"
category = "player"
description = ""
hint = ""
type = "script"
source = """
[ENABLE]
label(playerstats_savedAOB)
label(playerstats_returnhere)
label(playerstats_originalcode)
label(playerstats_exit)

label(playerstats_update_exit)
label(playerstats_set_exit)
label(playerstats_timeset_exit)
label(playerstats_gilset_exit)
label(playerstats_partyset_exit)
label(playerstats_blitzballset_exit)

registersymbol(playerstats_savedAOB)

//FFX.exe+46C9C8 - D9 5D FC              - fstp dword ptr [ebp-04]
//FFX.exe+46C9CB - D9 45 FC              - fld dword ptr [ebp-04]
// Accesses Play Time
//FFX.exe+46C9CE - 8B 8E BC000000        - mov ecx,[esi+000000BC]
//FFX.exe+46C9D4 - D9C0                  - fld st(0)
//FFX.exe+46C9D6 - D8 25 445B1002        - fsub dword ptr [FFX.exe+F25B44]
//FFX.exe+46C9DC - D9 5D FC              - fstp dword ptr [ebp-04]
aobscan(playerstats_searchedAOB, 8B 8E BC 00 00 00 D9 C0)

alloc(playerstats_newmem, 2048, playerstats_searchedAOB)


playerstats_newmem:
cmp dword ptr [playerstats_update_enable], #0
je playerstats_update_exit
mov [playerstats_basepointer], esi
playerstats_update_exit:

cmp dword ptr [playerstats_set_enable], #0
je playerstats_set_exit
playerstats_set_exit:

cmp dword ptr [playerstats_timeset_enable], #0
je playerstats_timeset_exit
mov [esi+bc], #0
playerstats_timeset_exit:

cmp dword ptr [playerstats_gilset_enable], #0
je playerstats_gilset_exit
mov [esi+3d48], #999999999
playerstats_gilset_exit:

cmp dword ptr [playerstats_blitzballset_enable], #0
je playerstats_blitzballset_exit
mov byte ptr [esi+163e], #99
mov byte ptr [esi+163f], #0
playerstats_blitzballset_exit:

cmp dword ptr [playerstats_partyset_enable], #0
je playerstats_partyset_exit
mov [esi+55f8], #17
mov [esi+568c], #17
mov [esi+5720], #17
mov [esi+57b4], #17
mov [esi+5848], #17
mov [esi+58dc], #17
mov [esi+5970], #17
mov [esi+5a98], #17
mov [esi+5b2c], #17
mov [esi+5bc0], #17
mov [esi+5c54], #17
mov [esi+5ce8], #17
mov [esi+5d7c], #17
mov [esi+5e10], #17
mov [esi+5ea4], #17
playerstats_partyset_exit:


playerstats_originalcode:
db 8B 8E BC 00 00 00
//mov ecx,[esi+000000BC]


playerstats_exit:
jmp playerstats_returnhere


playerstats_searchedAOB:
playerstats_savedAOB:
jmp playerstats_newmem
nop
playerstats_returnhere:


[DISABLE]
playerstats_savedAOB:
db 8B 8E BC 00 00 00
//mov ecx,[esi+000000BC]

unregistersymbol(playerstats_savedAOB)

dealloc(playerstats_newmem)"""

