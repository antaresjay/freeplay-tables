cmp dword ptr [blitzballstats_set_enable], #0
je blitzballstats_set_exit
blitzballstats_set_exit:

cmp dword ptr [blitzballstats_hpset_enable], #0
je blitzballstats_hpset_exit
mov [edx+100], #9999
mov [edx+104], #9999
mov [edx+108], #9999
mov [edx+10c], #9999
mov [edx+110], #9999
mov [edx+114], #9999
blitzballstats_hpset_exit:

cmp dword ptr [blitzballstats_enpashset_enable], #0
je blitzballstats_enpashset_exit
cmp dword ptr [edx+44], #-1
jne blitzballstats_enpashset_opponent_entry
mov [edx+68], #9999
mov [edx+6c], #9999
mov [edx+70], #9999
jmp blitzballstats_enpashset_exit
blitzballstats_enpashset_opponent_entry:
mov [edx+68], #0
mov [edx+6c], #0
mov [edx+70], #0
blitzballstats_enpashset_exit:

mov eax, [blitzballstats_temp1]


blitzballstats_originalcode:
db 8B 52 3C 85 D2
//mov edx,[edx+3C]


blitzballstats_exit:
jmp blitzballstats_returnhere


blitzballstats_searchedAOB:
blitzballstats_savedAOB:
jmp blitzballstats_newmem
blitzballstats_returnhere:


[DISABLE]
blitzballstats_savedAOB:
db 8B 52 3C 85 D2
//mov edx,[edx+3C]

unregistersymbol(blitzballstats_savedAOB)

dealloc(blitzballstats_newmem)
dealloc(blitzballstats_temp1)"""

