label(blitzballstats_hpset_exit)
label(blitzballstats_enpashset_exit)
label(blitzballstats_enpashset_opponent_entry)

registersymbol(blitzballstats_savedAOB)

//FFX.exe+46AB20 - 85 D2                 - test edx,edx
//FFX.exe+46AB22 - 74 1A                 - je FFX.exe+46AB3E
// Acceses Team
//FFX.exe+46AB24 - 8B 52 3C              - mov edx,[edx+3C]
//FFX.exe+46AB27 - 85 D2                 - test edx,edx
//FFX.exe+46AB29 - 74 13                 - je FFX.exe+46AB3E
//FFX.exe+46AB2B - 03 D1                 - add edx,ecx
//FFX.exe+46AB2D - 74 0F                 - je FFX.exe+46AB3E
aobscan(blitzballstats_searchedAOB, 8B 52 3C 85 D2 74 13)

alloc(blitzballstats_newmem, 2048, blitzballstats_searchedAOB)
alloc(blitzballstats_temp1, 4, blitzballstats_searchedAOB)


blitzballstats_newmem:
mov [blitzballstats_temp1], eax

cmp dword ptr [blitzballstats_update_enable], #0
je blitzballstats_update_exit
mov [blitzballstats_basepointer], edx
